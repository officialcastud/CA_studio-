  h+=calcRow("11 · Tax and interest paid (Σ challans)","F17",D.paid||0);
  h+=calcRow("12 · Net payable / refundable (10 − 11)","F18",D.item12||0);
  if(R(G.td12)>0)h+=note("₹"+F(G.td12)+" net tax payable on 115TD accreted income (including 115TE interest) — carried to Part B-TTI.");

  return h;
}

/* =====================================================================
   EXPORT — ScheduleSI, Schedule115BBI, Schedule115TD (books §7/§8).
   Each block written only when it carries content.
   ===================================================================== */
function expSi(j){
  const G=S.C.si||(engSi(),S.C.si)||{};

  /* ---- ScheduleSI (SI book §7) ---- */
  const srows=(G.rows||[]).filter(r=>r.code&&N(r.inc));
  if(srows.length){
    const SI={
      TotSplRateInc:n0(G.totInc),                 /* G94 */
      TotSplRateIncTax:n0(G.totTax),              /* I94 */
      SplCodeRateTax:srows.map(r=>({
        SecCode:r.code,
        SplRatePercent:N(r.rate),
        SplRateInc:n0(r.inc),                     /* column G */
        SplRateIncTax:n0(r.tax)})),               /* column I */
      EditAutopoulatedDetail:(S.si.edit==="Yes")?"Y":"N"};
    j.ScheduleSI=SI;
  } else if(S.si.edit==="Yes"){
    j.ScheduleSI={TotSplRateInc:0,TotSplRateIncTax:0,EditAutopoulatedDetail:"Y"};
  }

  /* ---- Schedule115BBI (115BBI book §6 — all seven leaves required) ---- */
  const B=G.bbi||{};
  if(G.bbiOn){
    j.Schedule115BBI={
      DeemedIncSec1023C_113:n0(B.l1),
      DeemedIncSec111B:n0(B.l2),
      IncDeemedSec131c:n0(B.l3),
      IncNotExemptSec131d:n0(B.l4),
      IncNotExcludedSec111c:n0(B.l5),
      IncAccInExcess:n0(B.l6),
      Total:n0(B.tot)};
  }

  /* ---- Schedule115TD (115TD book §7) ---- */
  const D=G.td||{};
  if(D.on){
    const TD={
      FMVTotTrustInst:n0(D.f1),
      LessTotLiaTrustInst:n0(D.f2),
      NetValAsst:n0(D.net),
      FMVAsstAcqrdRfrdSec101:n0(D.q1),
      FMVAsstAcqPeriodFromDateCrtn:n0(D.q2),
      FMVAsstTrnfsrdSec115TD2:n0(D.q3),
      FMVTotal:n0(D.fmv4),
      LiabilityRespectofAsset4Above:n0(D.liab4),
      AccretedIncomeSection115TD:n0(D.accreted),
      AddIncPay115TDMarginalRate:n0(D.addTax),
      InterestPayable115TE:n0(D.interest),
      AddIncIntstPayb:n0(D.item10),
      TaxIntstPaid:n0(D.paid),
      NetPaybleRefble:n0(D.item12)};
    const sd=ISO(D.specDate); if(sd)TD.SpecifiedDateUs115TD=sd;
    const ch=(D.challans||[]).filter(c=>N(c.amt)&&ISO(c.date)&&BSR.test(st0(c.bsr).toUpperCase())&&st0(c.bank)&&st0(c.sn));
    if(ch.length)TD.DepositofTaxAccInc={DepositofTaxAccIncDtls:ch.map(c=>({
      DateDep:ISO(c.date),
      NameBankBranch:st0(c.bank),
      BSRCode:st0(c.bsr).toUpperCase(),
      SrlNoOfChaln:parseInt(st0(c.sn),10),
      Amount:n0(c.amt)}))};
    j.Schedule115TD=TD;
  }
}

/* =====================================================================
   IMPORT — inverse of export (round-trip identity).
   ===================================================================== */
function impSi(I){
  const read=[]; if(!I)return read;

  /* ScheduleSI — re-derived from the heads each compute; a returned SI is
     read into the manual-override rows only when EditAutopoulatedDetail=Y */
  const si=I.ScheduleSI;
  if(si){
    S.si.edit=(si.EditAutopoulatedDetail==="Y")?"Yes":(si.EditAutopoulatedDetail==="N"?"No":S.si.edit);
    if(S.si.edit==="Yes"&&Array.isArray(si.SplCodeRateTax)){
      S.si.rows=si.SplCodeRateTax.map(r=>{
        const code=r.SecCode, rate=r.SplRatePercent!=null?String(r.SplRatePercent):"";
        const o={code,rate,inc:nz(r.SplRateInc)};
        if(siIsDTAA(code)&&r.SplRateIncTax!=null)o.tax=nz(r.SplRateIncTax);
        return o;});
    }
    read.push("Schedule SI (income at special rates)");
  }

  /* Schedule115BBI */
  const b=I.Schedule115BBI;
  if(b){
    S.bbi={l1:nz(b.DeemedIncSec1023C_113),l2:nz(b.DeemedIncSec111B),l3:nz(b.IncDeemedSec131c),
      l4:nz(b.IncNotExemptSec131d),l5:nz(b.IncNotExcludedSec111c),l6:nz(b.IncAccInExcess)};
    read.push("Schedule 115BBI (specified income @30%)");
  }

  /* Schedule115TD */
  const d=I.Schedule115TD;
  if(d){
    S.td={
      fmvTot:nz(d.FMVTotTrustInst), liab:nz(d.LessTotLiaTrustInst),
      fmv4i:nz(d.FMVAsstAcqrdRfrdSec101), fmv4ii:nz(d.FMVAsstAcqPeriodFromDateCrtn),
      fmv4iii:nz(d.FMVAsstTrnfsrdSec115TD2), liab4:nz(d.LiabilityRespectofAsset4Above),
      addTaxOvr:nz(d.AddIncPay115TDMarginalRate), intOvr:nz(d.InterestPayable115TE),
      specDate:dmy(d.SpecifiedDateUs115TD),
      challans:(((d.DepositofTaxAccInc||{}).DepositofTaxAccIncDtls)||[]).map(c=>({
        date:dmy(c.DateDep), bank:c.NameBankBranch||"", bsr:c.BSRCode||"",
        sn:c.SrlNoOfChaln!=null?String(c.SrlNoOfChaln):"", amt:nz(c.Amount)}))};
    read.push("Schedule 115TD (accreted income / exit tax)");
  }
  return read;
}

/* =====================================================================
   CHECKS — the section's own screen validations (not the department
   rule engine, which is Phase 6).
   ===================================================================== */
function chkSi(){
  const out=[]; const G=S.C.si||(engSi(),S.C.si)||{};
  const add=(lvl,t,m)=>out.push({lvl,t,m,sec:"si"});

  (G.rows||[]).forEach(r=>{
    if(N(r.inc)&&!N(r.rate)&&!siIsDTAA(r.code))
      add("err","Special rate missing","The head \""+siLabel(r.code)+"\" has income of ₹"+F(r.inc)+" but no rate.");
    if(siIsDTAA(r.code)&&N(r.inc)>0&&!(N(r.tax)>0))
      add("warn","DTAA tax not entered","\""+siLabel(r.code)+"\" carries income of ₹"+F(r.inc)+
        " but no treaty tax. For a DTAA head the tax is at the treaty rate.");
  });
  if((G.rows||[]).length){
    const sumTax=(G.rows||[]).reduce((a,r)=>a+N(r.tax),0);
    if(Math.abs(sumTax-N(G.totTax))>1)
      add("err","Schedule SI total","Total tax at special rates (row 94) must equal the sum of the rows.");
  }
  if((G.totTax||0)>0)add("ok","Tax at special rates","₹"+F(G.totTax)+" of tax at special rates, added to the normal-rate tax in Part B-TTI.");
  if((G.exemption112A||0)>0)add("ok","Section-112A exemption","₹"+F(G.exemption112A)+" of the ₹1,25,000 section-112A exemption applied.");

  /* Schedule 115BBI */
  if((G.bbiTotal||0)>0)add("ok","Specified income u/s 115BBI","₹"+F(G.bbiTotal)+" of specified income charged @30% u/s 115BBI (₹"+F(G.bbiTax)+" tax).");

  /* Schedule 115TD */
  const TD=G.td||{};
  if((TD.accreted||0)>0&&!st0(TD.specDate))
    add("err","Specified date missing","Accreted income of ₹"+F(TD.accreted)+" is present u/s 115TD — the specified date (item 9) cannot be blank.");
  if(st0(TD.specDate)&&!D(TD.specDate))
    add("err","Specified date invalid","The specified date u/s 115TD (item 9) is not a valid "+DF+" date.");
  if((TD.accreted||0)>0&&(TD.paid||0)<(TD.item10||0))
    add("warn","115TD tax unpaid","Net ₹"+F(TD.item12)+" of additional tax/interest u/s 115TD is still payable (item 12).");
  if((TD.item12||0)>0)add("ok","Accreted income (exit tax)","₹"+F(TD.item12)+" net payable u/s 115TD carried to Part B-TTI.");
  return out;
}

/* ---- register (overrides the boot stub) ----------------------------- */
reg({id:"si", t:"Special-rate, specified & accreted income", ref:"Schedule SI · 115BBI · 115TD",
  f:secSi, s:()=>{const G=S.C.si||{};
    const bits=[];
    if(G.totTax)bits.push(RS(G.totTax)+" special-rate tax");
    if(G.bbiTotal)bits.push(RS(G.bbiTax)+" u/s 115BBI");
    if(G.td12)bits.push(RS(G.td12)+" u/s 115TD");
    return bits.length?bits.join(" · "):(G.on?"disclosed":"");},
  eng:engSi, exp:expSi, imp:impSi, chk:chkSi, order:150, corder:60});

})();

/* =====================================================================
   ITR-7 · Section "tax" (order 170, corder 90) — Part B roll-up for the
   TRUST / INSTITUTION return.  It is the LAST substantive compute: it reads
   every upstream head and schedule via S.C.<id>.* and paints the four
   Part B blocks.

   Books: books/ITR-7/PART_B_TI_TTI.md (blocks PartB_TI, PartB_TI2,
          PartB_TI3, PartB_TTI) — the trust/institution Part B.
   Schema blocks OWNED here (section_map.json → section "tax"):
          PartB_TI, PartB_TI2, PartB_TI3, PartB_TTI (the whole object,
          including the Refund bank-account block and AssetOutsideIndiaFlg,
          which section_map maps to `tax`, NOT to the `bank`/Verification
          section — the `bank` section owns only the Verification block and
          merely READS the refund figure this engine publishes as
          S.C.tax.refundDue).

   ITR-7 computes Part B-TI ONCE PER EXEMPTION REGIME and paints three
   parallel sub-statements; only the one matching the filing status is
   filed (the others are computed but inert):
     · Part-B1 (PartB_TI)  — ss.11/12 or 10(23C)(iv)/(v)/(vi)/(via)
     · Part-B2 (PartB_TI2) — s.13A/13B or 10(21)…10(47)
     · Part-B3 (PartB_TI3) — income at maximum marginal rate under the 22nd
                             proviso to 10(23C) or s.13(10)
   The live regime is picked from S.C.who (exemptionSection / returnSection /
   prov1310).  Part B-TTI (the tax ladder) is common to whichever regime is
   filed.

   Consumes (all guarded, all defaulting so nothing throws):
     who   S.C.who.{exemptionSection,returnSection,prov1310,isPoliticalParty,
                    resident,domestic,claim9090A91}
     hp    S.C.hp.{partBTI,total}                       (item 10i / 7i)
     bp    S.C.bp.{d,income}                            (item 10ii / 7ii — D48)
     cg    S.C.cg.{after.{st20,st30,stApp,stDTAA,lt125,ltDTAA},C2,income}
     os    S.C.os.{chargeable,special}                 (item 10iv / 7iv)
     vc    S.C.vc.{anon115BBC,totalVC,corpus,corpus80G2b,aggregateIncome,
                   domesticVC,foreignVC}
     fa    S.C.fa.{relief,relief90,relief91}           (Part B-TTI 5a/5b)
     paid  S.C.paid.{adv,tds,tcs,sat,paid,challans}    (Part B-TTI 9a-9e)
     app   S.C.app.*   — STUB (Schedule A/I/IA application & exemption feed)
     ie    S.C.ie.*    — Schedule IE (application, for Part-B2/receipts)
     si    S.C.si.*    — STUB (Schedule SI special rates, 115BBI, 115TD 12)
     cyla  S.C.cyla.*  — STUB (current-year loss set-off, item 12)

   Publishes the footer + seam contract:
     S.C.gti, S.C.ti (wiring footer), S.C.int (wiring footer), and
     S.C.tax = { gti, ti, tax, netTax, refundDue, regime, ... } — the
     `bank` section reads S.C.tax.refundDue.

   Rule 2 (CLAUDE.md): every figure/formula is ITR-7's own; codes are the
   book's own (ITR-7 spellings). Every cross-read is guarded.
   ===================================================================== */

/* ---- my own typed input: the date of filing (drives 234A/B/C interest).
   The bank-account block, the BankDtlsFlag, AssetOutsideIndiaFlg and the
   Verification block are OWNED by the `bank` section (it reads the refund
   figure this engine publishes as S.C.int.refund / S.C.tax.refundDue). ---- */
S.tax = S.tax || {};

/* ---- guarded computed reader (S.C.<path>, default 0) ---- */
function taxC(path,d){ return RG(S.C,path,d===undefined?0:d); }

/* ---- the trust / AOP normal-rate (old-regime) slab ladder ----
   AY 2026-27: nil up to ₹2,50,000, 5% to ₹5,00,000, 20% to ₹10,00,000,
   30% above.  Used for the "tax at normal rates" line and for the
   agricultural-income rebate (partial integration). */
function taxSlab(ti){ ti=Math.max(0,R(ti));
  if(ti<=250000) return 0;
  if(ti<=500000) return R((ti-250000)*0.05);
  if(ti<=1000000) return R(12500+(ti-500000)*0.20);
  return R(112500+(ti-1000000)*0.30); }

const TAX_MMR=0.30;              /* maximum marginal rate — base component (2(29C)) */

/* ---- regime resolver (which Part B-TI sub-statement is filed) ---- */
function taxRegime(W){
  if(W.prov1310) return "B3";                          /* A26 Yes → income at MMR (22nd proviso / 13(10)) */
  const ex=st0(W.exemptionSection);
  const B1=["11","23CIV","23CV","23CVI","23CVIA"];      /* ss.11/12 or 10(23C)(iv)-(via) */
  if(B1.indexOf(ex)>=0) return "B1";
  if(ex) return "B2";                                  /* 13A/13B or any 10(21)…10(47) clause */
  if(st0(W.returnSection)==="139-4B") return "B2";     /* political party, no exsec keyed yet */
  return "B1";                                         /* default: a 139(4A) charitable trust */
}

/* advance-tax instalment cut-offs (Schedule IT deposit dates) */
const TAX_QCUT=[new Date(2025,5,15),new Date(2025,8,15),new Date(2025,11,15),new Date(2026,2,15)];

/* =====================================================================
   ENGINE — the whole Part B roll-up + the footer/seam contract
   ===================================================================== */
function engTax(){
  const W=(S.C.who||{});
  const regime=taxRegime(W);

  /* ===== the income-not-forming-part heads (common to all regimes) ===== */
  const HP=(S.C.hp||{}), BP=(S.C.bp||{}), CG=(S.C.cg||{}), OS=(S.C.os||{});
  const after=(CG.after||{});

  const hp   = Math.max(0, R(HP.partBTI!=null?HP.partBTI:Math.max(0,N(HP.total))));   /* HP 3, nil if loss */
  const bp   = Math.max(0, R(BP.d!=null?BP.d:N(BP.income)));                           /* BP D48, nil if loss */
  /* capital-gain rate buckets, post set-off (Schedule CG item E) */
  const st20 =Math.max(0,R(after.st20)),  st30 =Math.max(0,R(after.st30));
  const stApp=Math.max(0,R(after.stApp)), stDTAA=Math.max(0,R(after.stDTAA));
  const lt125=Math.max(0,R(after.lt125)), ltDTAA=Math.max(0,R(after.ltDTAA));
  const totST=R(st20+st30+stApp+stDTAA);              /* Av */
  const totLT=R(lt125+ltDTAA);                        /* Biii */
  const cgSTLT=R(totST+totLT);                        /* C */
  const cg115BBH=Math.max(0,R(CG.C2));                /* D — 115BBH @30% (VDA CG) */
  const totCG=R(cgSTLT+cg115BBH);                     /* E */
  const os   = Math.max(0, R(OS.chargeable!=null?OS.chargeable:N(OS.income)));         /* OS 9, nil if loss */

  const headsTot=R(hp+bp+totCG+os);                   /* Σ heads not forming part of application */

  /* ===== upstream schedules that are still Phase-4 stubs (guarded 0) ===== */
  const cyla   =Math.max(0,R(taxC("cyla.total",taxC("cyla.cyTotal",0))));  /* item 12 — CYLA 2xiv/3xiv/4xiv */
  const splInc =Math.max(0,R(taxC("si.totInc",0)));   /* Schedule SI col (i) — income at special rates */
  const splTax =Math.max(0,R(taxC("si.totTax",0)));   /* Schedule SI col (ii) — tax at special rates */
  const bbeInc =Math.max(0,R(taxC("si.inc115BBE",0)));
  const bbeTax =Math.max(0,R(taxC("si.tax115BBE",0)));
  const spec115BBI=Math.max(0,R(taxC("si.spec115BBI",taxC("si.inc115BBI",0)))); /* 115BBI specified income */
  const netAgri=Math.max(0,R(taxC("si.agri",taxC("app.netAgri",0))));  /* net agricultural income for rate */
  const net115TD=Math.max(0,R(taxC("si.net115TD",0)));/* Schedule 115TD Sl.12 → Part B-TTI item 12 */

  /* anonymous donations @30% u/s 115BBC (Schedule VC Diii) */
  const anon115BBC=Math.max(0,R(taxC("vc.anon115BBC",0)));

  /* application / exemption feed (Schedule A/I/IA — `app` section, STUB → 0) */
  const A=k=>Math.max(0,R(taxC("app."+k,0)));
  const vcCorpus115BBC=Math.max(0,R(taxC("vc.vcOtherCorpus",A("vcCorpus115BBC")))); /* Part-B1 item1 */
  const corpus80G=Math.max(0,R(taxC("vc.corpus80G2b",0)));
  const corpusOther=Math.max(0,R((taxC("vc.corpus",0))-corpus80G));
  const grossExempt=A("grossIncomeAfterExemption");   /* Part-B1 item9 (post-application) */

  /* ===== the live regime's total income and its rate split ===== */
  let ti,normalRateInc,mmrInc;
  if(regime==="B3"){
    /* Part-B3 — income at MMR (lost exemption). Everything is MMR income;
       heads + additions less loss, less special-rate carve-outs. */
    const inc=Math.max(0, headsTot - cyla);
    ti=inc;
    mmrInc=Math.max(0, inc - splInc - anon115BBC - spec115BBI);
    normalRateInc=0;
  } else if(regime==="B2"){
    /* Part-B2 — s.13A/13B or 10(21)…10(47). Gross total less exemptions
       (app stub → 0), plus heads not forming part, less CY loss. Aggregate
       at normal rates, with the MMR portion (item 14) carved out. */
    const gti=Math.max(0, grossExempt + headsTot - cyla);
    ti=gti;
    mmrInc=Math.max(0,R(A("incMMR")));                 /* item 14 (app stub → 0) */
    normalRateInc=Math.max(0, ti - splInc - anon115BBC - spec115BBI - mmrInc);
  } else {
    /* Part-B1 — ss.11/12 or 10(23C)(iv)-(via). Gross income after exemption
       (app stub) + heads, less CY loss; aggregate at normal rates is
       13 − 14 − 15 − 16. */
    const gross=Math.max(0, grossExempt + headsTot);
    ti=Math.max(0, gross - cyla);
    mmrInc=0;
    normalRateInc=Math.max(0, ti - splInc - anon115BBC - spec115BBI);
  }
  const gti=ti;                                        /* gross total income (post application) */
  ti=Math.max(0, Math.round(ti/10)*10);                /* §288A — round total income to the nearest ten */

  /* ===== Part B-TTI 1 — tax payable on total income ===== */
  const tax1a=R(taxSlab(normalRateInc + netAgri));     /* 1a — normal (AOP slab) with agri aggregation */
  const rebateAgri=netAgri>0 ? R(taxSlab(netAgri + 250000)) : 0;   /* 1f — agri rebate (partial integration) */
  const tax1b=splTax;                                  /* 1b — special rates (Schedule SI col ii) */
  const tax1c=R(anon115BBC*0.30);                      /* 1c — 30% on anonymous donations 115BBC */
  const tax1d=R(spec115BBI*0.30);                      /* 1d — 30% on 115BBI specified income */
  const tax1e=R(mmrInc*TAX_MMR);                       /* 1e — maximum marginal rate */
  const tax1g=Math.max(0, R(tax1a+tax1b+tax1c+tax1d+tax1e-rebateAgri)); /* 1g — tax payable on total income */

  /* ===== 2 — surcharge (AOP/trust ladder + 25% flat on 115BBE) ===== */
  const surRate = ti>50000000?0.37: ti>20000000?0.25: ti>10000000?0.15: ti>5000000?0.10:0;
  const sur25SI = R(Math.max(0,bbeTax)*0.25);          /* 2i — 25% of 115BBE tax (never marginal-relieved) */
  const restTax = Math.max(0, tax1g - bbeTax);
  let surOnRest = R(restTax*surRate);                  /* 2ii — ladder surcharge on the rest */
  /* marginal relief at the ladder threshold (on the surcharged rest) */
  if(surRate>0){
    const th = ti>50000000?50000000: ti>20000000?20000000: ti>10000000?10000000:5000000;
    const lower = ti>50000000?0.25: ti>20000000?0.15: ti>10000000?0.10:0;
    const mr = Math.max(0, (restTax+surOnRest) - (restTax + restTax*lower) - (ti-th));
    surOnRest = Math.max(0, R(surOnRest - mr));
  }
  const totalSur=R(sur25SI+surOnRest);                 /* 2iii */
  const cess=R((tax1g+totalSur)*0.04);                 /* 3 — health & education cess @4% */
  const grossTax=R(tax1g+totalSur+cess);               /* 4 — gross tax liability */

  /* ===== 5 — tax relief (Schedule TR): 90/90A + 91 ===== */
  const FA=(S.C.fa||{});
  const rel90=Math.max(0,R(FA.relief90!=null?FA.relief90:N(FA.dtaa)));
  const rel91=Math.max(0,R(FA.relief91!=null?FA.relief91:N(FA.notDtaa)));
  const relief=Math.max(0, R(FA.relief!=null?FA.relief:(rel90+rel91)));
  const netTax=Math.max(0, R(grossTax - relief));      /* 6 — net tax liability */

  /* ===== taxes paid (Part B-TTI 9a-9e) ===== */
  const P=(S.C.paid||{});
  const adv=R(P.adv||0), tds=R(P.tds||0), tcs=R(P.tcs||0), sat=R(P.sat||0);
  const paidTot=R(P.paid!=null?P.paid:(adv+tds+tcs+sat));

  /* ===== 7 — interest & fee (234A/B/C, 234F, 234-I) ===== */
  const dueDate = DUE;                                 /* FORM.due — the audit-case 139(1) date */
  const filed = D(S.tax.filed);
  const late = !!(filed && filed>dueDate);
  const challans = Array.isArray(P.challans)?P.challans:[];
  const upto=d=>challans.filter(c=>!c.sat && D(c.dt) && D(c.dt)<=d).reduce((a,c)=>a+N(c.amt),0);

  /* 234A — 1%/month on the shortfall (net − adv − tds − tcs), principal floored to 100 */
  let p234a=Math.max(0, netTax-adv-tds-tcs); if(p234a>100)p234a=Math.floor(p234a/100)*100;
  const m234a=late?MPART(dueDate,filed):0;
  const i234a=(netTax>0)?R(p234a*0.01*m234a):0;        /* A636 — nil if tax on total income is 0 */

  /* 234B — assessed = net − (tds+tcs); if advance < 90%, 1%/month Apr→filing */
  let i234b=0; const assessed=netTax-tds-tcs;
  if(netTax>0 && assessed>=10000 && adv<0.9*assessed){
    const principal=Math.floor(Math.max(0, netTax-adv-tds-tcs)/100)*100;
    const months=Math.min(30, MPART(new Date(2026,3,1), filed||new Date())||1);
    i234b=R(principal*0.01*months);
  }

  /* 234C — four instalment buckets on cumulative advance tax paid */
  const base234c=netTax;
  const gate234c=(netTax>0 && base234c>=10000);
  const QDEF=[[0.15,0.12,3],[0.45,0.36,3],[0.75,null,3],[1,null,1]];
  const qs=QDEF.map((q,k)=>{const pc=q[0],safe=q[1],mo=q[2];
    const b=Math.max(0, base234c - tds - tcs - relief);
    const need=R(b*pc), got=R(upto(TAX_QCUT[k]));
    let sh=(safe!==null && got>=Math.floor(b*safe/100)*100)?0:Math.floor(Math.max(0,need-got)/100)*100;
    if(!gate234c)sh=0;
    return {need:need, got:got, short:sh, mo:mo, int:R(sh*0.01*mo)};});
  const i234c=R(qs.reduce((a,q)=>a+q.int,0));

  /* 234F — late-filing fee (A637): ₹5,000, or ₹1,000 if total income ≤ ₹5 lakh */
  const f234f=late?(ti<=500000?1000:5000):0;
  /* 234-I — revised-return fee (A639/A640): filed after 31-12-2026 u/s 139(5) */
  const revised=(+S.fs.sec===17)||/revis|139\s*\(?5/i.test(st0(S.fs.retType||S.fs.sec));
  const f234i=(revised && filed && filed>new Date(2026,11,31))?(ti<=500000?1000:5000):0;

  const intTotal=R(i234a+i234b+i234c+f234f+f234i);     /* 7e */
  const aggregate=R(netTax+intTotal);                  /* 8 — aggregate liability */
  const bal=aggregate-paidTot;
  const balance=Math.round(Math.max(0,bal)/10)*10;     /* 10 — amount payable */
  let refund=Math.round(Math.max(0,-bal)/10)*10;       /* 11 — refund */
  /* 12 — net tax payable on 115TD income adjusts the refund */
  const refundDue=Math.max(0, refund - net115TD);

  /* ===== publish the footer + seam contract ===== */
  S.C.gti=R(gti);
  S.C.ti =R(ti);
  S.C.tax={
    regime:regime,
    gti:R(gti), ti:R(ti), tax:grossTax, netTax:netTax, refundDue:refundDue,
    /* Part B-TI common heads */
    hp:hp, bp:bp, st20:st20, st30:st30, stApp:stApp, stDTAA:stDTAA,
    totST:totST, lt125:lt125, ltDTAA:ltDTAA, totLT:totLT,
    cgSTLT:cgSTLT, cg115BBH:cg115BBH, totCG:totCG, os:os, headsTot:headsTot,
    vcCorpus115BBC:vcCorpus115BBC, corpus80G:corpus80G, corpusOther:corpusOther,
    grossExempt:grossExempt, cyla:cyla,
    splInc:splInc, anon115BBC:anon115BBC, spec115BBI:spec115BBI, netAgri:netAgri,
    normalRateInc:normalRateInc, mmrInc:mmrInc,
    /* Part B-TTI ladder */
    tax1a:tax1a, tax1b:tax1b, tax1c:tax1c, tax1d:tax1d, tax1e:tax1e,
    rebateAgri:rebateAgri, tax1g:tax1g,
    surRate:surRate, sur25SI:sur25SI, surOnRest:surOnRest, totalSur:totalSur,
    cess:cess, grossTax:grossTax, gross:grossTax,
    rel90:rel90, rel91:rel91, relief:relief, net115TD:net115TD, rebate:0 };
  S.C.int={
    dueDate:dueDate, filed:filed, late:late,
    rel90:rel90, rel91:rel91, relief:relief, net:netTax,
    adv:adv, tds:tds, tcs:tcs, sat:sat, paid:paidTot,
    p234a:R(p234a), m234a:m234a, i234a:i234a, i234b:i234b, qs:qs, i234c:i234c,
    f234f:f234f, f234i:f234i, total:intTotal, aggregate:aggregate,
    balance:balance, refund:refundDue, refundGross:refund, net115TD:net115TD };
}

/* =====================================================================
   SCREEN — the four Part B blocks as result rows, plus the keyed filing
   date. The bank-account block and the foreign-asset flag live under the
   Bank & verification section.
   ===================================================================== */
function secTax(){
  const T=(S.C.tax||{}), I=(S.C.int||{});
  const REGLBL={B1:"Part-B1 · ss.11/12 or 10(23C)(iv)-(via)",
    B2:"Part-B2 · s.13A/13B or 10(21)…10(47)",
    B3:"Part-B3 · income at maximum marginal rate (22nd proviso / s.13(10))"};
  const r=(n,l,v,o)=>row(l,cell(v),Object.assign({ref:n},o||{}));
  let h="";

  h+=note("<b>Part B — total income &amp; tax.</b> ITR-7 computes Part B-TI once <b>per exemption "+
    "regime</b>; only the sub-statement matching your filing status is filed. This roll-up reads every "+
    "income head and schedule; the only keyed figures here are the <b>date of filing</b>, the "+
    "<b>bank-account</b> details for any refund, and the <b>foreign-asset</b> declaration. Regime in "+
    "force: <b>"+esc(REGLBL[T.regime]||"Part-B1")+"</b>.");

  /* ===== Part B-TI (the live regime) ===== */
  h+=sub("Part B-TI — Computation of total income ("+esc((T.regime||"B1").replace("B","Part-B"))+")");
  if(T.regime==="B3"){
    h+=note("The trust's income is chargeable at the <b>maximum marginal rate</b> under the twenty-second "+
      "proviso to section 10(23C) or section 13(10) (Part A-General A26 = Yes).");
  } else {
    h+=r("1","Voluntary contributions &amp; anonymous donations taxable u/s 115BBC (other than corpus)",T.vcCorpus115BBC||0);
    h+=r("2A","Corpus — donations for renovation/repair of places notified u/s 80G(2)(b)",T.corpus80G||0,{ind:1});
    h+=r("2B","Corpus other than above",T.corpusOther||0,{ind:1});
    h+=r("9","Gross income after exemption u/s 11 / 10(23C) (from Schedule A / I)",T.grossExempt||0,{cls:"tot",hint:"fed by the Application & accumulation section"});
  }
  h+=sub("Income not forming part of the application heads");
  h+=r("10i","Income from house property — 3 of Schedule HP (nil if loss)",T.hp||0);
  h+=r("10ii","Profits &amp; gains of business or profession — D48 of Schedule BP (nil if loss)",T.bp||0);
  h+=sub("10iii · Capital gains");
  h+=r("Ai","Short-term chargeable @ 20% — 8ii of item E of Schedule CG",T.st20||0,{ind:1});
  h+=r("Aii","Short-term chargeable @ 30% — 8iii",T.st30||0,{ind:1});
  h+=r("Aiii","Short-term at applicable rate — 8iv",T.stApp||0,{ind:1});
  h+=r("Aiv","Short-term at special rates as per DTAA — 8v",T.stDTAA||0,{ind:1});
  h+=r("Av","Total short-term (Ai+Aii+Aiii+Aiv)",T.totST||0,{cls:"tot"});
  h+=r("Bi","Long-term chargeable @ 12.5% — 8vi",T.lt125||0,{ind:1});
  h+=r("Bii","Long-term at special rates as per DTAA — 8vii",T.ltDTAA||0,{ind:1});
  h+=r("Biii","Total long-term (Bi+Bii)",T.totLT||0,{cls:"tot"});
  h+=r("C","Sum of short-term / long-term capital gains (Av+Biii)",T.cgSTLT||0);
  h+=r("D","Capital gain chargeable @ 30% u/s 115BBH — C2 of Schedule CG",T.cg115BBH||0);
  h+=r("E","Total capital gains (C+D)",T.totCG||0,{cls:"tot"});
  h+=r("10iv","Income from other sources — 9 of Schedule OS",T.os||0);
  h+=r("10v","Total (10i+10ii+10iiiE+10iv)",T.headsTot||0,{cls:"tot"});
  h+=r("12","Current-year losses to be set off — Schedule CYLA",T.cyla||0,{hint:"fed by the current-year-loss section"});
  h+=r("13","Total income",S.C.ti||0,{cls:"grand",hint:"rounded to the nearest ten"});
  h+=r("14","Income chargeable at special rates — col (i) of Schedule SI",T.splInc||0);
  h+=r("15","Anonymous donations taxed u/s 115BBC @ 30% — Diii of Schedule VC",T.anon115BBC||0);
  h+=r("16","Specified income chargeable u/s 115BBI @ 30% — Sl.7 of Schedule 115BBI",T.spec115BBI||0);
  if(T.regime==="B2") h+=r("14MMR","Income chargeable at maximum marginal rate",T.mmrInc||0);
  h+=r("17","Aggregate income to be taxed at normal rates",T.normalRateInc||0,{cls:"tot"});

  /* ===== Part B-TTI ===== */
  h+=sub("Part B-TTI — Computation of tax liability");
  h+=sub("1 · Tax payable on total income");
  h+=r("1a","Tax at normal rates (AOP slab) on the aggregate at normal rates",T.tax1a||0,{ind:1});
  h+=r("1b","Tax at special rates — col (ii) of Schedule SI",T.tax1b||0,{ind:1});
  h+=r("1c","Tax on anonymous donations u/s 115BBC @ 30%",T.tax1c||0,{ind:1});
  h+=r("1d","Tax on income chargeable u/s 115BBI @ 30%",T.tax1d||0,{ind:1});
  h+=r("1e","Tax at maximum marginal rate",T.tax1e||0,{ind:1});
  h+=r("1f","Rebate on agricultural income",-(T.rebateAgri||0),{ind:1});
  h+=r("1g","Tax payable on total income (1a+1b+1c+1d+1e−1f)",T.tax1g||0,{cls:"tot"});
  h+=sub("2 · Surcharge");
  h+=r("2i","25% of tax on income chargeable u/s 115BBE (never marginal-relieved)",T.sur25SI||0,{ind:1});
  h+=r("2ii","Surcharge on the balance, after marginal relief",T.surOnRest||0,{ind:1,hint:T.surRate?R(T.surRate*100)+"%":"nil"});
  h+=r("2iii","Total surcharge (2i+2ii)",T.totalSur||0,{cls:"tot"});
  h+=r("3","Health &amp; education cess @ 4% on (1g+2iii)",T.cess||0);
  h+=r("4","Gross tax liability (1g+2iii+3)",T.grossTax||0,{cls:"grand"});
  h+=sub("5 · Tax relief (Schedule TR)");
  h+=r("5a","Section 90/90A — 2 of Schedule TR",I.rel90||0,{ind:1});
  h+=r("5b","Section 91 — 3 of Schedule TR",I.rel91||0,{ind:1});
  h+=r("5c","Total (5a+5b)",I.relief||0,{cls:"tot"});
  h+=r("6","Net tax liability (4−5c)",I.net||0,{cls:"grand"});
  h+=sub("7 · Interest &amp; fee payable");
  h+=row("Date of filing the return",dte("tax.filed"),{ref:"—",hint:"due "+DISP(I.dueDate||DUE)});
  h+=r("7a","Interest for default in furnishing the return — 234A",I.i234a||0,{ind:1,hint:I.m234a?(I.m234a+" month"+(I.m234a>1?"s":"")):""});
  h+=r("7b","Interest for default in payment of advance tax — 234B",I.i234b||0,{ind:1});
  h+=r("7c","Interest for deferment of advance tax — 234C",I.i234c||0,{ind:1});
  h+=r("7d","Fee for default in furnishing the return — 234F",I.f234f||0,{ind:1});
  h+=r("7da","Fee for furnishing a revised return — 234-I",I.f234i||0,{ind:1});
  h+=r("7e","Total interest &amp; fee (7a+7b+7c+7d+7da)",I.total||0,{cls:"tot"});
  h+=r("8","Aggregate liability (6+7e)",I.aggregate||0,{cls:"grand"});
  h+=sub("9 · Taxes paid");
  h+=r("9a","Advance tax — Schedule IT",I.adv||0,{ind:1});
  h+=r("9b","TDS — Schedule TDS 1 &amp; 2",I.tds||0,{ind:1});
  h+=r("9c","TCS — Schedule TCS",I.tcs||0,{ind:1});
  h+=r("9d","Self-assessment tax — Schedule IT",I.sat||0,{ind:1});
  h+=r("9e","Total taxes paid (9a+9b+9c+9d)",I.paid||0,{cls:"tot"});
  h+=r("10","Amount payable — if 8 exceeds 9e",I.balance||0,{cls:I.balance?"grand":"tot"});
  h+=r("11","Refund — if 9e exceeds 8",I.refund||0,{cls:I.refund?"grand":"tot"});
  if(T.net115TD) h+=r("12","Net tax payable on 115TD income including interest u/s 115TE — Schedule 115TD",T.net115TD||0);

  h+=note("The bank-account details for any refund, the foreign-asset declaration and the verification block are entered under <b>Bank &amp; verification</b>.");
  return h;
}

/* =====================================================================
   EXPORT — the live Part B-TI regime block + the whole Part B-TTI block
   (including the Refund bank-account details and the foreign-asset flag,
   which section_map assigns to this section).
   ===================================================================== */
function expTax(j){
  const T=(S.C.tax||{}), I=(S.C.int||{});

  /* ---- the live Part B-TI regime ---- */
  if(T.regime==="B2")      expTaxB2(j,T);
  else if(T.regime==="B3") expTaxB3(j,T);
  else                     expTaxB1(j,T);

  /* ---- Part B-TTI (common) ---- */
  const B="PartB_TTI.ComputationOfTaxLiability.";
  put(j,B+"TaxPayableOnTI.TaxAtNormalRates",sg(T.tax1a));
  put(j,B+"TaxPayableOnTI.TaxAtSpecialRates",sg(T.tax1b));
  put(j,B+"TaxPayableOnTI.DonationUs115BC",sg(T.tax1c));
  put(j,B+"TaxPayableOnTI.TaxIncChargUs115BBI",sg(T.tax1d));
  put(j,B+"TaxPayableOnTI.TaxAtMarginalRate",sg(T.tax1e));
  put(j,B+"TaxPayableOnTI.RebateOnAgricultureInc",sg(T.rebateAgri));
  put(j,B+"TaxPayableOnTI.TaxPayableOnTotInc",sg(T.tax1g));
  put(j,B+"Surcharge25ofSI",sg(T.sur25SI));
  put(j,B+"SurchargeOnTaxPayable",sg(T.surOnRest));
  put(j,B+"TotalSurcharge",sg(T.totalSur));
  put(j,B+"EducationCess",sg(T.cess));
  put(j,B+"GrossTaxLiability",sg(T.grossTax));
  put(j,B+"TaxRelief.Section90",sg(I.rel90));
  put(j,B+"TaxRelief.Section91",sg(I.rel91));
  put(j,B+"TaxRelief.TotTaxRelief",sg(I.relief));
  put(j,B+"NetTaxLiability",sg(I.net));
  put(j,B+"IntrstPay.IntrstPayUs234A",sg(I.i234a));
  put(j,B+"IntrstPay.IntrstPayUs234B",sg(I.i234b));
  put(j,B+"IntrstPay.IntrstPayUs234C",sg(I.i234c));
  put(j,B+"IntrstPay.LateFilingFee234F",Math.min(5000,sg(I.f234f)));
  if(I.f234i) put(j,B+"IntrstPay.FeeFurnish234I",sg(I.f234i));
  put(j,B+"IntrstPay.TotalIntrstPay",sg(I.total));
  put(j,B+"AggregateTaxInterestLiability",sg(I.aggregate));

  const TP="PartB_TTI.TaxPaid.";
  put(j,TP+"TaxesPaid.AdvanceTax",sg(I.adv));
  put(j,TP+"TaxesPaid.TDS",sg(I.tds));
  put(j,TP+"TaxesPaid.TCS",sg(I.tcs));
  put(j,TP+"TaxesPaid.SelfAssessmentTax",sg(I.sat));
  put(j,TP+"TaxesPaid.TotalTaxesPaid",sg(I.paid));
  put(j,TP+"BalTaxPayable",sg(I.balance));

  /* Refund figures owned here; the BankAccountDtls block, the BankDtlsFlag
     and AssetOutsideIndiaFlg are exported by the `bank` section. */
  put(j,"PartB_TTI.Refund.RefundDue",sg(I.refund));
  put(j,"PartB_TTI.Refund.NetTaxPyblOn115TDInc",sg(T.net115TD));
}

/* ---- Part-B1 (PartB_TI) ---- */
function expTaxB1(j,T){
  const B="PartB_TI.";
  put(j,B+"VcCorpusSec11",sg(T.vcCorpus115BBC));
  put(j,B+"VoluntaryContributions.TotIncFromVC",sg(taxC("vc.totalVC",0)));
  put(j,B+"VoluntaryContributions.CorpusDonationUS80G",sg(T.corpus80G));
  put(j,B+"VoluntaryContributions.CorpusOtherThan80G",sg(T.corpusOther));
  put(j,B+"AggregateIncomeUs1112",sg(taxC("app.aggregate1112",0)));
  put(j,B+"AmtForCharitableUs111",sg(taxC("app.amtCharitable111",0)));
  put(j,B+"IncToBeApplied",sg(taxC("app.incToApply",0)));
  const D=B+"TIDeductions.";
  put(j,D+"AmtAppliedtForCharitablePurpose",sg(taxC("app.applied",0)));
  put(j,D+"AmtAppForCharitablePurposeRepayment",sg(taxC("app.loanRepay",0)));
  put(j,D+"AmtAppliedSpecifiedMode",sg(taxC("app.appliedSpecMode",0)));
  put(j,D+"AmtDeemedForCharitable",sg(taxC("app.deemedApplied",0)));
  put(j,D+"AmtAccumulatedForCharitable",sg(taxC("app.accumulated11_2",0)));
  put(j,D+"AmtFulfilledUs11_2",sg(taxC("app.setApart11_2",0)));
  put(j,D+"TotalDeductions",sg(taxC("app.totalDeductions",0)));
  const AD=B+"TIAdditions.";
  put(j,AD+"IncChargeableUs115BBI",sg(T.spec115BBI));
  put(j,AD+"ExemptionUs11_13Dtl.AnonymousDonationVC",sg(taxC("app.anonNoExempt",0)));
  put(j,AD+"IncChargeableUs12_2",sg(taxC("app.incUs12_2",0)));

   compute()); only the keyed inputs (filing date, bank block, flags) are
   read back into state so the round-trip is faithful.

function impTax(I7){
  const read=[];
  if(!I7) return read;
  /* Part B-TI/TTI are all computed figures — they recompute via compute()
     on import; only the identity round-trip is recorded here. The keyed
     date of filing the return is not carried in the schema. */
  if(RG(I7,"PartB_TTI",null)) read.push("Part B-TTI (computed on import)");

  if(RG(I7,"PartB_TI2",null)) read.push("Part B-TI2");

}

/* =====================================================================
   ITR-7 · Section "vc" — Voluntary Contributions & Aggregate Income
   Books: books/ITR-7/Schedule_VC.md (block ScheduleVC)
          books/ITR-7/Schedule_AI.md (block ScheduleAI)
   Screen order 20 · Compute order (corder) 25 — the receipts side of a
   trust/institution return: it feeds the application/accumulation (Sch A/
   ER/EC), the special-rate 115BBC computation (Sch SI / Part B-TI) and the
   exemption schedules, all of which compute after VC. Structural template:
   forms/ITR-6/src/70_sec_os.js (array/total idioms; put/pf, grid, fold).

   TWO complementary schedules, both mandatory for a trust:
   ---------------------------------------------------------------------
   Schedule VC — Voluntary Contributions (Donations Received). Domestic (A)
   split corpus (Ai = Aia 80G(2)(b) + Aib other) vs other-than-corpus (Aii,
   breakdown iia–iid → total iie); domestic VC Aiii = Ai + Aiie. Foreign (B):
   corpus (Bi = Bia + Bib), other-than-corpus (Bii), foreign contribution
   Biii = Bi + Bii, plus a free-text purpose line (Biv). Total contributions
   C = Aiii + Biii. Anonymous donations chargeable u/s 115BBC (block D): Di
   aggregate, Dii the statutory floor = max(5% of (C+Di), 1,00,000), Diii the
   amount chargeable @30% = MAX(0, Di − Dii); E = anonymous donations other
   than Diii = Di − Diii (the within-floor part, taxed under the ordinary
   11/10(23C) regime). Voluntary contributions are recorded ONLY here — never
   in Schedule AI.

   Schedule AI — Aggregate of income derived during the previous year
   EXCLUDING voluntary contributions: eight category lines (1 main-object
   receipts, 2 incidental-object receipts, 3 rent, 4 commission, 5 dividend,
   6 interest, 7 agriculture, 8 net consideration on transfer of capital
   asset), a "9 any other income" sub-table (OthersInc.OthersIncDtls[]) plus
   9a pass-through income (→ its total row 20), and the aggregate row 23
   TotalofAggregateIncomes = 1+2+3+4+5+6+8+9 (line 7 agriculture excluded per
   the utility's own formula; 9 = the row-20 other-income total incl. PTI).

   CROSS-SECTION ROLLS published on S.C.vc (consumed by app / si / tax):
     domesticVC / foreignVC / totalVC   — Aiii / Biii / C (total contributions)
     corpus / corpus80G2b               — corpus donation total & its 80G(2)(b) part
     anonAgg / anonFloor                — Di / Dii
     anon115BBC                         — Diii chargeable u/s 115BBC @30% (→ SI / Part B-TI)
     anonOther                          — E (within-floor anonymous donation)
     aiOthersTotal / aggregateIncome    — Sch AI row 20 / row 23 (income base → ER/EC/BTI)
     grossReceipts                      — totalVC + aggregateIncome (whole receipts side)
   Nothing else writes S.C.vc.
   ===================================================================== */

/* ---- state (flat keys; arrays hold {nat,amt}) -------------------- */
S.vc = S.vc || {
  /* Schedule VC · A — Domestic contribution */
  corpus80G2b:"",   /* Aia — corpus for renovation/repair of 80G(2)(b) places */
  corpusOther:"",   /* Aib — corpus other than above */
  grantsGovt:"",    /* iia — Grants from Government */
  grantsCSR:"",     /* iib — Grants from companies under CSR */
  otherGrants:"",   /* iic — Other specific grants */
  otherDon:"",      /* iid — Other donations */
  /* Schedule VC · B — Foreign contribution */
  fCorpus80G2b:"",  /* Bia */
  fCorpusOther:"",  /* Bib */
  fOther:"",        /* Bii — foreign other-than-corpus */
  fPurpose:"",      /* Biv — free-text purpose (FCRA) */
  /* Schedule VC · D — Anonymous donations 115BBC */
  anonAgg:"",       /* Di — aggregate anonymous donations received */
  /* Schedule AI — aggregate of income (excluding voluntary contributions) */
  recMain:"", recIncid:"", rent:"", comm:"", div:"", interest:"",
  agri:"", netConsid:"", pti:"",
  aiOthers:[]       /* {nat,amt} — OthersInc.OthersIncDtls[] */
};

/* default row for the shell's generic add-row handler */
SEED["vc.aiOthers"] = SEED["vc.aiOthers"] || {};

/* ---- engine ------------------------------------------------------ */
function engVc(){
  S.vc = S.vc || {};
  const O = S.vc;
  const C = S.C.vc = {};

  /* ===== Schedule VC · A — Domestic ===== */
  const aia = R(O.corpus80G2b), aib = R(O.corpusOther);
  const ai  = aia + aib;                                  /* Ai  Local.CorpusFundDonation */
  const iia = R(O.grantsGovt), iib = R(O.grantsCSR), iic = R(O.otherGrants), iid = R(O.otherDon);
  const iie = iia + iib + iic + iid;                      /* Aiie Local.TotalOtherThanCorpusFund */
  const aiii = ai + iie;                                  /* Aiii Local.VoluntaryContribution */

  /* ===== Schedule VC · B — Foreign ===== */
  const bia = R(O.fCorpus80G2b), bib = R(O.fCorpusOther);
  const bi  = bia + bib;                                  /* Bi  Foreign.CorpusFundDonation */
  const bii = R(O.fOther);                                /* Bii Foreign.OtherThanCorpusFund */
  const biii = bi + bii;                                  /* Biii Foreign.ForeignContribution */

  /* ===== C — Total contributions ===== */
  const cTot = aiii + biii;                               /* C  TotalContribution */

  /* ===== D — Anonymous donations chargeable u/s 115BBC ===== */
  const di   = R(O.anonAgg);                              /* Di  AggregateAnonymousDonations */
  const dii  = Math.max(R(0.05*(cTot+di)), 100000);      /* Dii 5% of (C+Di) or 1,00,000, higher */
  const diii = Math.max(0, di - dii);                    /* Diii chargeable @30% (floored at nil) */
  const e    = di - diii;                                 /* E  anonymous other than Diii (= min(Di,Dii)) */

  /* ===== Schedule AI — aggregate income excluding voluntary contributions ===== */
  const recMain=R(O.recMain), recIncid=R(O.recIncid), rent=R(O.rent), comm=R(O.comm),
        div=R(O.div), interest=R(O.interest), agri=R(O.agri), netConsid=R(O.netConsid);
  const pti = R(O.pti);                                   /* 9a PassThroughIncome */
  const othersSum = (O.aiOthers||[]).reduce((s,r)=>s+R(r.amt),0);
  const aiOthersTotal = othersSum + pti;                  /* row 20 TotalofOtherIncomes */
  /* row 23 Total(1+2+3+4+5+6+8+9) — line 7 agriculture excluded per utility formula */
  const aggregateIncome = recMain + recIncid + rent + comm + div + interest + netConsid + aiOthersTotal;

  /* ---- working exposed for the renderer ---- */
  C.ai={aia,aib,tot:ai}; C.iie={iia,iib,iic,iid,tot:iie}; C.aiii=aiii;
  C.bi={bia,bib,tot:bi}; C.bii=bii; C.biii=biii;
  C.cTot=cTot;
  C.di=di; C.dii=dii; C.diii=diii; C.e=e;
  C.ai_lines={recMain,recIncid,rent,comm,div,interest,agri,netConsid,pti,othersSum};
  C.aiOthersTotal=aiOthersTotal; C.aggregateIncome=aggregateIncome;

  /* ---- cross-section rolls (app / si / tax) ---- */
  C.domesticVC   = R(aiii);
  C.foreignVC    = R(biii);
  C.totalVC      = R(cTot);                 /* total voluntary contributions (C) */
  C.corpus       = R(ai + bi);              /* corpus donation total (domestic + foreign) */
  C.corpus80G2b  = R(aia + bia);            /* corpus for 80G(2)(b) renovation/repair places */
  C.anonAgg      = R(di);
  C.anonFloor    = R(dii);
  C.anon115BBC   = R(diii);                 /* chargeable u/s 115BBC @30% → Schedule SI / Part B-TI */
  C.anonOther    = R(e);
  C.aiOthersTotal   = R(aiOthersTotal);
  C.aggregateIncome = R(aggregateIncome);   /* Sch AI row 23 — income base → ER/EC / Part B-TI */
  C.grossReceipts   = R(cTot + aggregateIncome);
}

/* ---- renderer ---------------------------------------------------- */
function secVc(){
  const O = S.vc||{}, C = S.C.vc||{};
  let h = "";

  /* ===== Schedule VC — Voluntary Contributions ===== */
  {
    let b = note("Voluntary Contributions (Donations Received) — to be mandatorily filled in by all persons filing ITR-7. A contribution given with a specific direction that it shall form part of the corpus is a corpus donation; anonymous donations (donor identity not recorded) are captured separately at block D. Do NOT record these receipts in Schedule AI.");

    /* A — Domestic */
    b += sub("A · Domestic Contribution (other than anonymous donations taxable u/s 115BBC)");
    b += row("Ai · Corpus donation (Aia + Aib)", cell((C.ai||{}).tot), {ref:"Ai", cls:"tot"});
    b += row("Corpus representing donations received for renovation/repair of places notified u/s 80G(2)(b)", inp("vc.corpus80G2b",{n:1}), {ind:1, ref:"Aia"});
    b += row("Corpus other than above", inp("vc.corpusOther",{n:1}), {ind:1, ref:"Aib"});
    b += sub("ii · Other than corpus donation");
    b += row("Grants received from Government", inp("vc.grantsGovt",{n:1}), {ind:1, ref:"Aiia"});
    b += row("Grants received from companies under Corporate Social Responsibility", inp("vc.grantsCSR",{n:1}), {ind:1, ref:"Aiib"});
    b += row("Other specific grants", inp("vc.otherGrants",{n:1}), {ind:1, ref:"Aiic"});
    b += row("Other donations", inp("vc.otherDon",{n:1}), {ind:1, ref:"Aiid"});
    b += row("iie · Total other than corpus (iia + iib + iic + iid)", cell((C.iie||{}).tot), {ref:"Aiie", cls:"tot"});
    b += row("Aiii · Voluntary contribution — Domestic (Ai + Aiie)", cell(C.aiii), {ref:"Aiii", cls:"tot"});

    /* B — Foreign */
    b += sub("B · Foreign contribution (other than anonymous donations taxable u/s 115BBC)");
    b += row("Bi · Corpus donation (Bia + Bib)", cell((C.bi||{}).tot), {ref:"Bi", cls:"tot"});
    b += row("Corpus representing donations received for renovation/repair of places notified u/s 80G(2)(b)", inp("vc.fCorpus80G2b",{n:1}), {ind:1, ref:"Bia"});
    b += row("Corpus other than above", inp("vc.fCorpusOther",{n:1}), {ind:1, ref:"Bib"});
    b += row("Bii · Other than corpus donation", inp("vc.fOther",{n:1}), {ref:"Bii"});
    b += row("Biii · Foreign contribution (Bi + Bii)", cell(C.biii), {ref:"Biii", cls:"tot"});
    b += row("Biv · Specify the purpose for which foreign contribution has been received", inp("vc.fPurpose",{max:500}), {ref:"Biv",
      hint:"free text — FCRA linkage"});

    /* C — Total */
    b += row("C · Total Contributions (Aiii + Biii)", cell(C.totalVC), {ref:"C", cls:"tot"});

    /* D — Anonymous donations 115BBC */
    b += sub("D · Anonymous donations, chargeable u/s 115BBC");
    b += note("Applicable to an assessee claiming exemption u/s 11 or 10(23C)(iv)/(v)/(vi)/(via)/(iiiad)/(iiiae); to be filled only by trusts other than those covered u/s 115BBC(2). An anonymous donation is one where the identity (name and address) of the donor is not recorded.");
    b += row("Di · Aggregate of such anonymous donations received", inp("vc.anonAgg",{n:1}), {ref:"Di"});
    b += row("Dii · 5% of total donations received at (C + Di) or 1,00,000, whichever is higher", cell(C.dii), {ref:"Dii", cls:"tot"});
    b += row("Diii · Anonymous donations chargeable u/s 115BBC @ 30% (Di − Dii)", cell(C.diii), {ref:"Diii", cls:"tot"});
    b += row("E · Anonymous donations other than those included at Diii (Di − Diii)", cell(C.anonOther), {ref:"E", cls:"tot"});

    h += fold("vc_vc","VC","Schedule VC — Voluntary Contributions (Donations Received)", RS(C.totalVC||0), b, {def:true});
  }

  /* ===== Schedule AI — Aggregate of income derived (excluding VC) ===== */
  {
    const L = C.ai_lines||{};
    let b = note("Aggregate of income derived during the previous year EXCLUDING voluntary contributions — to be filled by assessees claiming exemption u/s 11 and 12 or u/s 10(23C)(iv)/(v)/(vi)/(via). This is the operating-receipts base carried to the application/accumulation and exemption schedules; the donations themselves stay in Schedule VC.");
    b += row("1 · Receipts from main objects", inp("vc.recMain",{n:1}), {ref:"1"});
    b += row("2 · Receipts from incidental objects", inp("vc.recIncid",{n:1}), {ref:"2"});
    b += row("3 · Rent", inp("vc.rent",{n:1}), {ref:"3"});
    b += row("4 · Commission", inp("vc.comm",{n:1}), {ref:"4"});
    b += row("5 · Dividend income", inp("vc.div",{n:1}), {ref:"5"});
    b += row("6 · Interest income", inp("vc.interest",{n:1}), {ref:"6"});
    b += row("7 · Agriculture income", inp("vc.agri",{n:1}), {ref:"7",
      hint:"disclosed here but excluded from the aggregate total (row 23 = 1+2+3+4+5+6+8+9)"});
    b += row("8 · Net consideration on transfer of capital asset", inp("vc.netConsid",{n:1}), {ref:"8"});
    b += sub("9 · Any other income (specify nature and amount)");
    b += grid("vc.aiOthers",[
      {k:"nat",h:"Nature of the income",t:"txt",max:125,req:1},
      {k:"amt",h:"Amount",t:"num",w:"160px",req:1}
    ], O.aiOthers||[], {empty:"No other-income rows.", add:"Add an income row",
       foot:[{l:1,v:"Σ other income"},{v:(L.othersSum||0)}]});
    b += row("9a · Pass through income (Fill Schedule PTI)", inp("vc.pti",{n:1}), {ref:"9a"});
    b += row("Total · Other income (9 rows + 9a)", cell(C.aiOthersTotal), {ref:"20", cls:"tot"});
    b += row("Aggregate of income (1+2+3+4+5+6+8+9)", cell(C.aggregateIncome), {ref:"23", cls:"tot"});
    h += fold("vc_ai","AI","Schedule AI — Aggregate of income derived (excluding voluntary contributions)", RS(C.aggregateIncome||0), b);
  }

  return h;
}

/* ---- export ------------------------------------------------------ */
function expVc(j){
  const O = S.vc||{}, C = S.C.vc||{};

  /* ---------- Schedule VC ---------- */
  const hasVc = R(O.corpus80G2b)||R(O.corpusOther)||R(O.grantsGovt)||R(O.grantsCSR)||
    R(O.otherGrants)||R(O.otherDon)||R(O.fCorpus80G2b)||R(O.fCorpusOther)||R(O.fOther)||
    st0(O.fPurpose)||R(O.anonAgg);
  if(hasVc){
    const ai=C.ai||{}, iie=C.iie||{}, bi=C.bi||{};
    /* Local (block A) — all leaves required */
    put(j,"ScheduleVC.Local.CorpusFundDonation",        sg(ai.tot));
    put(j,"ScheduleVC.Local.CorpusFundDonationUS80G2b", sg(ai.aia));

    O.fCorpus80G2b= nz(Fo.CorpusFundDonationUS80G2b);
    O.fCorpusOther= nz(Fo.CorpusFundDonationOther80G2b);
    O.fOther      = nz(Fo.OtherThanCorpusFund);
    O.fPurpose    = Fo.PurposeOfContribution||"";
    O.anonAgg     = nz(AN.AggregateAnonymousDonations);
    read.push("Schedule VC");
  }

  const AI = I.ScheduleAI;
  if(AI){
    O.recMain  = nz(AI.RecptMainObj);
    O.recIncid = nz(AI.RecptsIncidentalObj);
    O.rent     = nz(AI.Rent);
    O.comm     = nz(AI.Commission);

    O.aiOthers = (((AI.OthersInc||{}).OthersIncDtls)||[]).map(r=>({
      nat:r.OthNatOfInc||"", amt:nz(r.OthAmount)}));

  }
  return read;
}

/* ---- checks (section-local sanity, not the Phase-6 rule engine) --- */
function chkVc(){
  const out = [], O = S.vc||{}, C = S.C.vc||{};

  /* corpus for 80G(2)(b) renovation is a subset of corpus — informational */
  if(C.corpus80G2b>0)
    out.push({lvl:"ok", t:"Corpus u/s 80G(2)(b)", m:"Corpus of "+RS(C.corpus80G2b)+" is earmarked for renovation/repair of places notified u/s 80G(2)(b); it is taxable as income if applied otherwise (11th proviso to 10(23C) / Explanation 3A to s.11).", sec:"vc"});

  /* anonymous donations 115BBC */
  if(R(C.di)>0){
    if(R(C.diii)>0)
      out.push({lvl:"ok", t:"Anonymous donations u/s 115BBC", m:"Of the "+RS(C.di)+" anonymous donations, "+RS(C.diii)+" exceeds the floor of "+RS(C.dii)+" and is chargeable u/s 115BBC @30% (Diii); "+RS(C.anonOther)+" (E) falls within the floor and is taxed under the ordinary exemption regime.", sec:"vc"});
    else
      out.push({lvl:"ok", t:"Anonymous donations u/s 115BBC", m:"The "+RS(C.di)+" anonymous donations are within the 115BBC floor of "+RS(C.dii)+"; nothing is chargeable @30% (Diii is nil) and the whole amount (E) is taxed under the ordinary exemption regime.", sec:"vc"});
  }

  /* a foreign contribution should state its purpose (FCRA) */
  if(R(C.foreignVC)>0 && !st0(O.fPurpose))
    out.push({lvl:"warn", t:"Foreign contribution · purpose", m:"A foreign contribution of "+RS(C.foreignVC)+" is reported but the purpose (Biv) for which it was received is blank; state it for FCRA compliance.", sec:"vc"});

  /* any-other-income rows must carry a nature and an amount */
  (O.aiOthers||[]).forEach((r,i)=>{
    if(R(r.amt)>0 && !st0(r.nat))
      out.push({lvl:"err", t:"Schedule AI · other income row "+(i+1), m:"An amount of "+RS(R(r.amt))+" is entered without stating the nature of the income.", sec:"vc"});
  });

  return out;
}

/* =====================================================================
   ITR-7 · Section "vda" — Schedule VDA (Virtual Digital Assets).
   Built ONLY from books/ITR-7/Schedule_VDA.md (block ScheduleVDA),
   books/ITR-7/{enums.json,skeleton.json,section_map.json} and the schema
   sources/ITR-7/ITR-7_2026_Main_V0_1_schema.json (definitions.ScheduleVDA).
   Structural template: forms/ITR-6/src/70_sec_cg.js — its VDA handling
   (engVDA / the Schedule VDA grid / the ScheduleVDA export & import) — but
   every field, number, formula, schema key and enum here is taken from the
   ITR-7 book, never from ITR-6.

   Schema block (section_map → vda):
     ScheduleVDA  (ScheduleVDADtls[]{DateofAcquisition, DateofTransfer,
                   HeadUndIncTaxed, AcquisitionCost, ConsidReceived,
                   IncomeFromVDA}, TotIncBusiness, TotIncCapGain)

   The law — section 115BBH (book §4):
   - Flat 30% tax on income from transfer of any Virtual Digital Asset.
   - Income (Col 7) = Consideration received (Col 6) − Cost of acquisition
     (Col 5) ONLY; no other deduction/allowance, and a LOSS is entered as
     nil (a VDA loss is neither set off against any income nor carried
     forward).  So each row's income = MAX(0, ConsidReceived − AcquisitionCost).
   - Only POSITIVE incomes are summed, split by the Head chosen in Col 4:
       A · TotIncBusiness  = Σ positive income where head = Business Income
       B · TotIncCapGain   = Σ positive income where head = Capital Gain
   - Both totals feed Schedule SI at 30% — the two 115BBH sub-rows
     5BBHi (business) / 5BBHii (capital gain) (SI book §2 rows 90-92, §3).
     Item A also routes to Schedule BP, Item B to the capital-gain line
     (Schedule CG C2). This section only PUBLISHES the scalars; the
     consuming sections read them from S.C.vda.

   Wrapped in an IIFE so no helper leaks into the shared namespace where
   parallel section-builders live.
   ===================================================================== */
(function(){
"use strict";

/* ---- dropdown table (book §6 / schema HeadUndIncTaxed enum, verbatim) ----
   Cells F6:F10 source "(Select),Business Income,Capital Gain"; the schema
   files the enum members "BI"/"CG". */
const HEADVDA=[["BI","Business Income"],["CG","Capital Gain"]];

/* ---- state (S.vda) --------------------------------------------------
   One flat transaction table (book §1: "Details of every transaction are to
   be filled" — reported deal by deal, not netted). */
S.vda = S.vda || { rows:[] };   /* rows: {buy,sale,head,cost,cons} */
SEED["vda.rows"]=SEED["vda.rows"]||{};

/* =====================================================================
   ENGINE — Col 7 income and the two totals (book §2/§3)
   ===================================================================== */
function engVda(){
  const V=S.vda||{};
  const rows=Array.isArray(V.rows)?V.rows:[];
  let bi=0,cg=0,on=false;
  rows.forEach(r=>{
    const inc=Math.max(0,R(N(r.cons)-N(r.cost)));   /* Col 7 = MAX(0, Col6 − Col5) */
    r._={inc};                                       /* for the grid's calc column */
    if(r.head==="BI")bi+=inc; else if(r.head==="CG")cg+=inc;   /* only positive, by head */
    if(st0(r.head)||N(r.cost)||N(r.cons)||st0(r.buy)||st0(r.sale))on=true;
  });
  bi=R(bi); cg=R(cg);
  const total=R(bi+cg);

  /* ---- Schedule-SI feed (book §5 out; SI book §2 rows 90-92, §3) --------
     70_sec_si.js consumes S.C.vda.siFeed keyed by the exact schema SecCode.
     The 115BBH group (row 90 header, no code) has TWO sub-rows in the enum:
       5BBHi  — 115BBH(i)  income under head Business or Profession @30% <- A
       5BBHii — 115BBH(ii) income under head Capital Gain @30%          <- B
     Value = a plain number (income); si.js supplies the 30% rate from its
     own rate table and computes the tax. VDA is not part of any set-off
     matrix, so the incomes are fed directly. */
  const siFeed={};
  if(bi>0)siFeed["5BBHi"]=bi;
  if(cg>0)siFeed["5BBHii"]=cg;

  S.C.vda={on:on, bi:bi, cg:cg, total:total, siFeed:siFeed};
}

/* =====================================================================
   RENDERER
   ===================================================================== */
function calcRow(label,ref,n){return row(label,cell(n),{ref:ref});}

function secVda(){
  const V=S.vda||{};
  const rows=Array.isArray(V.rows)?V.rows:[];
  const G=S.C.vda||{bi:0,cg:0,total:0};
  let h="";
  h+=note("Section 115BBH — income from transfer of a Virtual Digital Asset is taxed at a flat 30%. "+
    "Details of every transaction are to be filled (VDA income is reported deal by deal, not netted). "+
    "Income = consideration received − cost of acquisition ONLY (no other deduction, no set-off); "+
    "a loss is entered as nil and is neither set off against any income nor carried forward. "+
    "For a VDA received as a gift, the cost of acquisition is the amount on which tax was paid u/s 56(2)(x), if any, else the cost to the previous owner.");
  h+=grid("vda.rows",[
      {h:"Date of acquisition",k:"buy",t:"date"},
      {h:"Date of transfer",k:"sale",t:"date"},
      {h:"Head under which income to be taxed",k:"head",t:"sel",opts:HEADVDA},
      {h:"Cost of acquisition (Col 5)",k:"cost",t:"num"},
      {h:"Consideration received (Col 6)",k:"cons",t:"num"},
      {h:"Income — Col 6 − Col 5 (nil if loss)",k:"inc",t:"calc",f:r=>(r._||{}).inc||0}
    ],rows,{empty:"No VDA transfer entered.",add:"Add a transfer",min:"960px"});
  h+=calcRow("A · Total — sum of all positive incomes under Business Income (Col 7)","A · TotIncBusiness",G.bi);
  h+=calcRow("B · Total — sum of all positive incomes under Capital Gain (Col 7)","B · TotIncCapGain",G.cg);
  h+=calcRow("Total income from transfer of VDA (A + B) — taxed at 30% u/s 115BBH","115BBH",G.total);
  return h;
}

/* =====================================================================
   EXPORT — ScheduleVDA (block object built directly: TotIncBusiness /
   TotIncCapGain and the row integers are REQUIRED and may legitimately be
   0, which put() would drop — so the block is assigned, mirroring ITR-6.
   Emitted only when at least one row is complete.)
   ===================================================================== */
function expVda(j){
  const V=S.vda||{};
  const rows=Array.isArray(V.rows)?V.rows:[];
  const G=S.C.vda||{bi:0,cg:0};
  const vr=rows.filter(r=>ISO(r.buy)&&ISO(r.sale)&&(r.head==="BI"||r.head==="CG"));
  if(!vr.length)return;
  j.ScheduleVDA={
    ScheduleVDADtls:vr.map(r=>({
      DateofAcquisition:ISO(r.buy),
      DateofTransfer:ISO(r.sale),
      HeadUndIncTaxed:r.head,
      AcquisitionCost:n0(r.cost),
      ConsidReceived:n0(r.cons),
      IncomeFromVDA:n0(Math.max(0,N(r.cons)-N(r.cost)))
    })),
    TotIncBusiness:n0(G.bi),
    TotIncCapGain:n0(G.cg)
  };
}

/* =====================================================================
   IMPORT — inverse of export (schema → S.vda)
   ===================================================================== */
function impVda(I){
  const b=I&&I.ScheduleVDA;
  if(!b)return [];
  S.vda=S.vda||{rows:[]};
  S.vda.rows=(b.ScheduleVDADtls||[]).map(x=>({
    buy:dmy(x.DateofAcquisition),
    sale:dmy(x.DateofTransfer),
    head:x.HeadUndIncTaxed,
    cost:nz(x.AcquisitionCost),
    cons:nz(x.ConsidReceived)}));
  return ["Schedule VDA"];
}

/* =====================================================================
   CHECKS — the section's own screen validations (not the department rules)
   ===================================================================== */
function chkVda(){
  const out=[];
  const G=S.C.vda; if(!G)return out;
  const V=S.vda||{};
  const rows=Array.isArray(V.rows)?V.rows:[];
  rows.forEach((r,i)=>{
    const dA=D(r.buy), dS=D(r.sale);
    /* dates cannot be after 31 March of the financial year */
    if((dS&&dS>YREND)||(dA&&dA>YREND))out.push({lvl:"err",t:"Schedule VDA row "+(i+1),
      m:"Date of acquisition/transfer cannot be after 31 March of the financial year.",sec:"vda"});
    /* transfer before acquisition */
    if(dA&&dS&&dS<dA)out.push({lvl:"warn",t:"Schedule VDA row "+(i+1),
      m:"Date of transfer is before the date of acquisition.",sec:"vda"});
    /* amounts entered but no head chosen (Col 4 routes the income) */
    if((N(r.cost)||N(r.cons))&&!(r.head==="BI"||r.head==="CG"))out.push({lvl:"err",t:"Schedule VDA row "+(i+1),
      m:"Choose the head (Business Income or Capital Gain) under which this VDA income is to be taxed.",sec:"vda"});
    /* a loss row — income is entered as nil (reminder of the 115BBH rule) */
    if((r.head==="BI"||r.head==="CG")&&R(N(r.cons)-N(r.cost))<0)out.push({lvl:"warn",t:"Schedule VDA row "+(i+1),
      m:"Consideration is below cost — the loss is entered as nil (a VDA loss is neither set off nor carried forward).",sec:"vda"});
  });
  if(G.total)out.push({lvl:"ok",t:"Virtual digital assets",
    m:"Income from transfer of VDA = "+RS(G.total)+" (Business "+RS(G.bi)+" + Capital Gain "+RS(G.cg)+"), taxed at 30% u/s 115BBH.",sec:"vda"});
  return out;
}

reg({id:"vda", t:"Virtual digital assets", ref:"Schedule VDA",
  f:secVda, s:()=>(S.C.vda&&S.C.vda.total)?RS(S.C.vda.total):((S.C.vda&&S.C.vda.on)?"Reporting":"None"),
  eng:engVda, exp:expVda, imp:impVda, chk:chkVda, order:60, corder:46});

})();

/* =====================================================================
   ENGINE — engWho(): identity face, adds nothing to GTI. Publishes the
   cross-section scalars every downstream trust schedule keys on:
   status/entity, the 139(4A-D) return-section and exemption-section (which
   Schedule IE / VC / AI / ER apply), residential status (Schedule FSI/TR/FA),
   the s.90/90A/91 claim flag, and the domestic flag.
   ===================================================================== */
function engWho(){
  const W=S.who||{}, G=S.g2||{};
  const C=S.C.who={ income:0 };
  const status=st0(W.status)||"4";
  const res=(st0(W.resStatus)||"RES")==="RES";
  const isCompany=status==="7";
  const dom=isCompany?((st0(W.domcomp)||"Y")!=="N"):res; /* domestic company gates the RES range */
  C.status=status;                              /* StatusOrCompanyType (4/5/6/7) */
  C.isCompany=isCompany;
  C.isPoliticalParty=st0(W.retfurn)==="139-4B"; /* 139(4B) -> political party (13A) */
  C.returnSection=st0(W.retfurn)||"139-4A";     /* ReturnFurnishedSec (139-4A..4D) */
  C.exemptionSection=st0(W.exsec)||"";          /* SecExemptionClaimed */
  C.exsec=C.exemptionSection;                    /* SEAM: ie/tax read S.C.who.exsec (aligned to the publisher) */
  C.resident=res;
  C.nonResident=!res;
  C.domestic=dom;                               /* -> FSI/TR/FA availability, tax rate */
  C.claim9090A91=(st0(W.claim90)||"NO")==="YES";/* -> Schedule TR / FSI */
  C.heldUnlisted=(st0(W.unlistedFlg)||"N")==="Y";
  C.liableAudit=(st0(G.aud44)||"N")==="Y";      /* -> due-date / Form 10B(BB) path */
  C.firstReturn=(st0((G.od||{}).firstRet)||"N")==="Y";
  C.prov1310=(st0((G.od||{}).prov1310)||"N")==="Y"; /* -> 13(10)/22nd-proviso computation (Schedule at si) */
  C.income=0;
}

/* =====================================================================
   RENDERER — secWho(): every live (non-hidden) row of the PI and Audit
   sheets. Trust/institution identity, registration and filing/exemption
   status, plus the A23-A26 "other details", the A27/A28 audit and the
   A29 governance tables.
   ===================================================================== */
function secWho(){
  const W=S.who, G=S.g2, OD=G.od;
  const india=(st0(W.country)||"91")==="91";
  const indiab=(st0(W.countryb)||"91")==="91";
  const status=st0(W.status)||"4";
  const sec=st0(W.sec);
  let h="";

  h+=note("<b>Who is filing.</b> ITR-7 is the return for a <b>trust / institution</b> (or other body) filing under section 139(4A)/(4B)/(4C)/(4D). This page is the entity's identity, its registrations/approvals and its filing &amp; exemption status; it adds nothing to total income. Every date is <b>DD/MM/YYYY</b>. The A23-A26 &quot;other details&quot; and the A27-A29 audit / governance tables are the <b>PartA_GEN2</b> block, displayed here with the identity face.");

  /* ===================== A1-A3 · Personal information ===================== */
  h+=sub("Personal information (A1-A3)");
  h+=row("A1 · Name (as in the deed of creation / establishing / incorporation / formation)",
    inp("who.name",{max:75}),{req:1,ref:"OrgFirmInfo.AssesseeName.SurNameOrOrgName"});
  h+=row("A2 · Permanent Account Number (PAN)",inp("who.pan",{max:10}),
    {req:1,ref:"OrgFirmInfo.PAN",hint:"the fourth letter denotes the status of the entity"});
  h+=row("A3 · Date of formation / incorporation",dte("who.doi"),
    {req:1,ref:"OrgFirmInfo.DateOFFormOrIncorp",hint:"on or before 31 March 2026"});
  h+=row("Status",sel("who.status",WHO7_STATUS,{blank:false}),
    {req:1,ref:"OrgFirmInfo.StatusOrCompanyType"});
  if(status==="5")
    h+=row("Sub-status",sel("who.substatus",WHO7_SUB5),{ref:"OrgFirmInfo.SubStatus"});
  else if(status==="7")
    h+=row("Sub-status",sel("who.substatus",WHO7_SUB7),{ref:"OrgFirmInfo.SubStatus"});

  /* ===================== A4-A11 · Primary address ===================== */
  h+=sub("Primary address — for communication (A4a-A11a)");
  h+=row("A4a · Flat / Door / Block No",inp("who.addr1",{max:50}),{req:1,ref:"Address.ResidenceNo"});

    h+=row("Zip Code",inp("who.zip",{max:10}),{ref:"Address.ZipCode"});

  /* ===================== Secondary address ===================== */
  h+=row("Is the secondary address the same as the primary address?",
    sel("who.addr2same",WHO7_SECADDR,{blank:false}),{req:1,ref:"OrgFirmInfo.SecondaryAdd"});

    h+=sub("Secondary address (A4b-A9b)");

    h+=row("A6b · Road / Street / Post Office",inp("who.roadb",{max:50}),{ref:"AlternateAddress.RoadOrStreet"});
    h+=row("Area / Locality",inp("who.localityb",{max:50}),{req:1,ref:"AlternateAddress.LocalityOrArea"});
    h+=row("A8b · Town / City / District",inp("who.cityb",{max:50}),{req:1,ref:"AlternateAddress.CityOrTownOrDistrict"});
    h+=row("Country",sel("who.countryb",WHO7_COUNTRY,{blank:false}),{ref:"AlternateAddress.CountryCode"});
    if(indiab){
      h+=row("A9b · State",sel("who.stateb",WHO7_STATE),{req:1,ref:"AlternateAddress.StateCode"});
      h+=row("PIN Code",inp("who.pinb",{n:1,max:6}),{ref:"AlternateAddress.PinCode"});

  }

  /* ===================== A13-A16 · Communication ===================== */

    inp("who.std",{n:1,max:5,ph:"STD"})+' '+inp("who.phone",{n:1,max:10,ph:"Phone"}),

    ],W.regoth,{min:"1120px",add:"Add an other-law registration",empty:"No other-law registration entered."});

  /* ===================== A21 / A17 · Filing status ===================== */
  h+=sub("Filing status (A21 / A17)");
  h+=row("A21 a · Return filed u/s / in response to notice u/s",
    sel("who.sec",WHO7_RETSEC),{req:1,ref:"FilingStatus.ReturnFileSec.IncomeTaxSec"});

    h+=row("b · Receipt no. of the original return",inp("who.receipt",{n:1,max:23}),

    h+=row("b · Date of filing of the original return",dte("who.origdate"),{ref:"FilingStatus.OrigRetFiledDate"});
  }

  if(WHO7_SEC_NOTICE.indexOf(sec)>=0||WHO7_SEC_APA.indexOf(sec)>=0)
    h+=row(sec==="19"?"c · Date of the advance pricing agreement (u/s 92CD)":"c · Date of such notice or order",

  h+=row("A17 i · Return furnished under section",
    sel("who.retfurn",WHO7_RETFURN,{blank:false}),{req:1,ref:"OrgFirmInfo.ReturnFurnishedSec",

  /* ===================== d-g · Residential / representative / partner ===================== */
  h+=sub("Residential status and representation (d-g)");

  h+=row("f · Is this return filed by a representative assessee?",

  /* ===================== h · LEI ===================== */
  h+=sub("h · Legal Entity Identifier (LEI)");

  /* ===================== A22 · Unlisted equity shares ===================== */

      {h:"Purchase price / share",k:"purch",t:"num"},

      {h:"Transferred — consideration",k:"trCons",t:"num"},
      {h:"Closing — no. of shares",k:"cbNo",t:"num",req:1},

  /* ===================== A23-A26 · Other details (PartA_GEN2.OtherDetailsFor7) ===================== */
  h+=sub("A23-A26 · Other details — section 2(15) test, change in activities, first return, 13(10)");
  h+=note("These rows are shown on the PI sheet, but their schema keys are the <b>PartA_GEN2.OtherDetailsFor7</b> block.");
  h+=row("A23 i · Charitable purpose is advancement of general public utility?",
    sel("g2.od.charPurpose",WHO7_YN_NA,{blank:false}),
    {req:1,ref:"OtherDetailsFor7.OtherDetailsUs2_15.CharitablePurposeOfGeneralPublic"});
  h+=row("A23 ai · Any activity in the nature of trade, commerce or business (proviso to 2(15))?",
    sel("g2.od.act2_15",WHO7_YN),{ref:"...OtherDetailsUs2_15.ActivityNature2_15"});
  if(st0(OD.act2_15)==="Y")
    h+=row("A23 aii · Percentage of receipt from such activity vs total receipts",
      inp("g2.od.pctTrade",{n:1}),{ref:"...OtherDetailsUs2_15.PercntNatureOfTrade"});
  h+=row("A23 bi · Any activity of rendering service in relation to trade, commerce or business?",

  if(st0(OD.act2_15)==="Y"||st0(OD.rend2_15)==="Y"){

  h+=row("A24 i · Any change in objects / activities during the year (basis of approval / registration)?",
