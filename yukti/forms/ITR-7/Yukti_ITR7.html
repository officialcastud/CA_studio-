<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YUKTI Tax Compliance — ITR-2, A.Y. 2026-27</title>
<style>
:root{
  --maroon:#7A1F2B; --maroon-d:#5C1720; --maroon-w:#F6EBEC;
  --white:#FFFFFF; --bone:#F5F4F1; --rule:#DCDCD6; --rule-2:#EDEBE6;
  --ink:#16161A; --ink-2:#4A4A52; --ink-3:#7C7C86;
  --red:#C0392B; --green:#1C5D4A; --green-w:#E9F1EE;
  --sienna:#9C4A15; --sienna-w:#FAEFE6;
  --field:#FFFEF9; --field-b:#C9C3AD; --closed:#F0EFEB;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"SF Mono",Consolas,"DejaVu Sans Mono",monospace;
  --rail:268px; --top:52px; --band:54px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bone);color:var(--ink);font:13.5px/1.45 var(--sans);
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--maroon);outline-offset:1px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* masthead — three things and nothing else */
.top{position:fixed;inset:0 0 auto 0;height:var(--top);z-index:60;background:var(--maroon);
  color:#fff;display:flex;align-items:center;gap:26px;padding:0 20px;
  border-bottom:2px solid var(--maroon-d)}
.top .b{font:600 19px/1 var(--serif);letter-spacing:.3px;white-space:nowrap}
.top .b em{font-style:normal;opacity:.64;font-size:12.5px;font-family:var(--sans);
  font-weight:400;margin-left:9px}
.top .frm{font:600 17px/1 var(--serif)}
.top .y{font-size:13px;opacity:.76;white-space:nowrap}
.top .sp{flex:1}
.tbtn{height:28px;padding:0 13px;white-space:nowrap;border:1px solid rgba(255,255,255,.42);border-radius:3px;
  font-size:12.5px;font-weight:500}
.tbtn:hover{background:rgba(255,255,255,.14)}
.tbtn.solid{background:#fff;color:var(--maroon);border-color:#fff;font-weight:600}
.tbtn.solid:hover{background:#F0E2E4}

/* index rail */
.rail{position:fixed;top:var(--top);bottom:var(--band);left:0;width:var(--rail);z-index:40;
  background:var(--bone);border-right:1px solid var(--rule);overflow-y:auto;padding:10px 0 20px}
.rail h2{font:500 10.5px/1 var(--sans);color:var(--ink-3);letter-spacing:.7px;padding:9px 18px 8px}
.nv{display:block;width:100%;text-align:left;padding:8px 16px 8px 15px;
  border-left:3px solid transparent;position:relative}
.nv:hover{background:#ECEAE5}
.nv.on{background:var(--white);border-left-color:var(--maroon)}
.nv .t{display:block;font:600 13.5px/1.25 var(--serif)}
.nv.on .t{color:var(--maroon)}
.nv .s{display:block;font-size:11px;color:var(--ink-3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nv .s.done{color:var(--green)} .nv .s.bad{color:var(--red);font-weight:600}

/* the sheet */
.wrap{position:absolute;top:var(--top);left:var(--rail);right:0;bottom:var(--band);
  overflow-y:auto;background:var(--bone)}
.sheet{max-width:1080px;margin:0 auto;padding:22px 26px 70px}

/* a section: maroon bar that opens and shuts */
section{background:var(--white);border:1px solid var(--rule);border-radius:3px;
  margin:0 0 14px;overflow:hidden;scroll-margin-top:14px}
.bar{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--maroon);color:#fff;padding:10px 14px}
.bar:hover{background:#8B2532}
.bar .cv{width:17px;height:17px;flex:none;border:1px solid rgba(255,255,255,.5);
  border-radius:2px;font-size:12px;line-height:15px;text-align:center}
.bar .t{font:600 15px/1.2 var(--serif);flex:1}
.bar .r{font-size:11.5px;opacity:.72;flex:none}
.bar .v{font:600 14px/1 var(--mono);flex:none;margin-left:14px}
.body{display:none;padding:4px 0 10px}
.body.open{display:block}

/* rows */
.r{display:flex;align-items:center;min-height:33px;border-bottom:1px solid var(--rule-2);
  padding:0 14px;gap:9px}
.r:hover{background:#FBFAF8}
.r.sub{background:#F7F6F3;min-height:28px}
.r.sub .l{font-weight:600;font-size:12px;color:var(--ink-2)}
.r.tot{border-top:1px solid var(--ink);border-bottom:2px solid var(--ink);background:#F7F6F3}
.r.tot .l,.r.tot .v{font-weight:700}
.r.grand{background:var(--maroon-w);border-top:1px solid var(--maroon);
  border-bottom:2px solid var(--maroon)}
.r.grand .l,.r.grand .v{font-weight:700;color:var(--maroon-d)}
.r.closed{background:var(--closed);opacity:.72}
.l{flex:1;min-width:0;padding:5px 0;font-size:13.5px}
.l.req{color:var(--red);font-weight:600}
.l .i1{padding-left:20px;display:inline-block}
.l .hint{color:var(--ink-3);font-size:11px;font-weight:400;margin-left:7px}
.ref{flex:none;width:52px;font-size:11px;color:var(--ink-3);font-family:var(--serif)}
.v{flex:none;width:160px;text-align:right}
.v2{flex:none;width:150px;text-align:right}
.hd2{font-size:10.5px;color:var(--ink-3);font-weight:600}

/* fields */
.f{width:100%;height:27px;padding:0 7px;border:1px solid var(--field-b);border-radius:2px;
  background:var(--field);font-size:13.5px}
.f:focus{border-color:var(--maroon);background:#fff}
.f.n{text-align:right;font-family:var(--mono);font-size:13px}
.f.over{background:var(--sienna-w);border-color:#D8B492;color:var(--sienna)}
.f[disabled]{background:var(--closed);color:var(--ink-3);cursor:not-allowed}
select.f{padding:0 4px;cursor:pointer}
.c{display:block;font-family:var(--mono);font-size:13px;color:var(--green);
  padding:5px 7px 5px 0;font-weight:600}
.c.zero{color:#B4B4BB;font-weight:400} .c.neg{color:var(--red)}
.dt{font-size:10.5px;color:var(--ink-3);display:block;text-align:right;margin-top:1px}

/* optional card */
.card{margin:8px 14px;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.card .ch{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 12px;background:#FAF9F6}
.card .ch:hover{background:#F3F1EC}
.card.on .ch{background:var(--maroon-w);border-bottom:1px solid var(--rule)}
.card .ch .sw{width:34px;height:18px;flex:none;border-radius:9px;background:#CFCCC4;
  position:relative;transition:background .12s}
.card.on .ch .sw{background:var(--maroon)}
.card .ch .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;
  border-radius:50%;background:#fff;transition:left .12s}
.card.on .ch .sw::after{left:18px}
.card .ch .t{flex:1;font:600 13px/1.2 var(--serif)}
.card .ch .st{font-size:11.5px;color:var(--ink-3);flex:none}
.card.on .ch .st{color:var(--maroon-d);font-weight:600;font-family:var(--mono)}
.card .cb{display:none;padding:4px 0 8px} .card.on .cb{display:block}

/* tables */
.gt{width:100%;border-collapse:collapse;margin:4px 0}
.gt th{font-size:10.5px;font-weight:600;color:var(--ink-2);text-align:right;padding:6px 7px;
  border-bottom:1px solid var(--ink);white-space:nowrap}
.gt th.l,.gt td.l{text-align:left}
.gt th.req{color:var(--red)}
.gt td{padding:2px 4px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
.gt td.num{padding:5px 7px;text-align:right}
.gt tfoot td{border-top:1px solid var(--ink);border-bottom:2px solid var(--ink);
  background:#F7F6F3;font-weight:700;padding:6px 7px;text-align:right}
.gt tfoot td.l{text-align:left}
.gt .x{width:28px;text-align:center}
.gt .x button{color:var(--ink-3);font-size:15px;line-height:1;padding:2px 5px;border-radius:2px}
.gt .x button:hover{background:var(--maroon-w);color:var(--maroon)}
.gt .f{height:25px}
.full{overflow-x:auto;padding:0 14px}
.add{margin:5px 14px 2px;height:27px;padding:0 13px;border:1px solid var(--maroon);
  border-radius:3px;color:var(--maroon);font-size:12.5px;font-weight:600;background:#fff}
.add:hover{background:var(--maroon);color:#fff}
.emp{padding:13px 6px;color:var(--ink-3);font-size:12.5px;font-style:italic}

/* property block */
.blk{margin:8px 14px;border:1px solid var(--rule);border-radius:3px}
.blk .bh{display:flex;align-items:center;gap:6px;padding:0 8px 0 0;background:#FAF9F6;
  border-bottom:1px solid var(--rule)}
.blk .bhx{flex:1;display:flex;align-items:center;gap:10px;padding:8px 12px;text-align:left;
  background:none;border:0;cursor:pointer;font:inherit}
.blk .bhx:hover{background:#F1EFEA}
.blk .cv2{width:16px;height:16px;flex:none;border:1px solid var(--rule);border-radius:2px;
  font-size:12px;line-height:14px;text-align:center;color:var(--ink-3)}
.blk .blkdel{flex:none;color:var(--ink-3);padding:6px 8px;border-radius:3px;cursor:pointer}
.blk .blkdel:hover{background:var(--maroon-w);color:var(--maroon)}
.blk .bh .t{flex:1;font:600 13px/1.2 var(--serif)}
.blk .bh .s{font-size:11.5px;color:var(--ink-3)}
.blk .bb{display:none;padding:2px 0 6px} .blk.on .bb{display:block}

/* notes and checks */
.note{border-left:3px solid var(--rule);padding:9px 13px;margin:9px 14px;font-size:12.5px;
  color:var(--ink-2);background:#FAF9F6;max-width:74ch}
.note.warn{border-left-color:var(--sienna);background:var(--sienna-w);color:#6B3410}
.note.stop{border-left-color:var(--red);background:var(--maroon-w);color:var(--maroon-d)}
.note.form{border-left-color:var(--maroon);background:var(--maroon-w);color:var(--maroon-d)}
.note b{font-weight:600}
.cks{margin:10px 14px 4px;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.ck{padding:8px 12px;border-bottom:1px solid var(--rule-2);font-size:12.5px;display:flex;
  gap:10px;align-items:baseline}
.ck:last-child{border-bottom:0}
.ck b{flex:none;width:180px;font-weight:600} .ck span{flex:1}
.ck.err{border-left:3px solid var(--red);background:var(--maroon-w)} .ck.err b{color:var(--maroon-d)}
.ck.warn{border-left:3px solid var(--sienna);background:var(--sienna-w)} .ck.warn b{color:#6B3410}
.ck.ok{border-left:3px solid var(--green);background:var(--green-w)} .ck.ok b{color:var(--green)}

/* capital-gains nesting */
.cgband{background:var(--maroon);color:#fff;font:600 14px/1 var(--serif);padding:9px 14px;
  margin:14px 0 0;border-radius:3px 3px 0 0}
.cgsubband{font:600 12.5px/1 var(--serif);color:var(--maroon-d);background:var(--maroon-w);
  padding:8px 14px;margin:10px 0 0;border-left:3px solid var(--maroon)}
.cghead{border:1px solid var(--rule);border-top:0}
.cgh{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 14px;
  background:#F7F6F3;border:0;cursor:pointer;font:inherit;border-bottom:1px solid var(--rule)}
.cgh:hover{background:#F1EFEA}
.cght{flex:1;font:600 13.5px/1.2 var(--serif)}
.cghv{font:600 14px/1 var(--mono);color:var(--green)}
.cghb{display:none;padding:2px 0 8px} .cghb.open{display:block}
.sub2{margin:6px 14px;border:1px solid var(--rule-2);border-radius:3px;overflow:hidden}
.s2h{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 11px;
  background:#FBFAF8;border:0;cursor:pointer;font:inherit}
.s2h:hover{background:#F4F2EC}
.sub2.on .s2h{background:var(--maroon-w);border-bottom:1px solid var(--rule-2)}
.cv3{width:15px;height:15px;flex:none;border:1px solid var(--rule);border-radius:2px;
  font-size:11px;line-height:13px;text-align:center;color:var(--ink-3)}
.s2ref{flex:none;width:34px;font:600 11px/1 var(--serif);color:var(--ink-3)}
.s2t{flex:1;font-size:13px}
.s2v{font-size:11.5px;color:var(--ink-3)}
.sub2.on .s2v{color:var(--maroon-d);font-family:var(--mono)}
.s2b{display:none;padding:2px 0 6px} .s2b.open{display:block}

/* the band */
.band{position:fixed;left:0;right:0;bottom:0;height:var(--band);z-index:60;
  background:var(--maroon);color:#fff;display:flex;align-items:center;padding:0 18px;
  border-top:2px solid var(--maroon-d)}
.m{flex:none;padding-right:22px;margin-right:22px;border-right:1px solid rgba(255,255,255,.22)}
.m:last-of-type{border-right:0}
.m span{display:block;font-size:10.5px;color:rgba(255,255,255,.66);margin-bottom:1px;white-space:nowrap}
.m b{display:block;font:600 16px/1.1 var(--mono);white-space:nowrap}
.m.pay b{color:#FFD9A0} .m.ref b{color:#A8E6C9}
.gap{flex:1}
.st{font-size:11.5px;color:rgba(255,255,255,.82);text-align:right;line-height:1.35;white-space:nowrap}
.st b{color:#fff}
.st a{color:#FFD9A0;cursor:pointer;text-decoration:underline}
@media(max-width:900px){:root{--rail:0px}.rail{display:none}.sheet{padding:16px 12px 60px}}
</style></head><body>

<header class="top">
  <div class="b">YUKTI<em>Tax Compliance</em></div>
  <div class="frm" id="frm">ITR-X</div>
  <div class="y" id="ay">A.Y. 2026-27</div>
  <div class="sp"></div>
  <button class="tbtn" id="b_open">Open file</button>
  <button class="tbtn" id="b_save">Save file</button>
  <button class="tbtn solid" id="b_json">Export return</button>
</header>

<nav class="rail"><h2>SECTIONS</h2><div id="nav"></div></nav>
<main class="wrap" id="wrap"><div class="sheet" id="sheet"></div></main>

<footer class="band">
  <div class="m"><span>Gross total income</span><b id="s_gti">—</b></div>
  <div class="m"><span>Total income</span><b id="s_ti">—</b></div>
  <div class="m"><span>Tax and cess</span><b id="s_tax">—</b></div>
  <div class="m" id="s_bw"><span id="s_bl">Balance payable</span><b id="s_b">—</b></div>
  <div class="gap"></div>
  <div class="st" id="s_st"></div>
</footer>

<input type="file" id="filepick" accept=".json,.yukti" hidden>
<script>
/* =====================================================================
   ITR-7 · AY 2026-27 — Phase 2 base scaffold (STUB).
   ITR-7 is the return for TRUSTS, INSTITUTIONS and other bodies filing
   under sections 139(4A)–(4F) (charitable/religious trusts, research
   associations, news agencies, universities/colleges, political parties,
   electoral trusts, business trusts, investment funds). Every section is
   present with its title and a placeholder body; real fields, engines,
   exports and rules arrive in Phase 4. Modelled on forms/ITR-3/src/00_form.js
   and forms/ITR-6/src/00_form.js.
   ===================================================================== */
/* FORM.due = 2026-10-31 is the audit-liable body's 139(1) due date.
   The ordinary ITR-7 filer — a trust/institution claiming exemption under
   section 11 or 10(23C) — is required to get its accounts audited (section
   12A(1)(b) / tenth proviso to 10(23C)) and furnish Form 10B/10BB, so its
   due date under section 139(1) is 31 October 2026 (same audit-case date
   the utility carries as Taxcalc_AuditcaseDate44AB).
   The utility's finalDuedate logic carries two other cases:
     - a non-audit body (e.g. a political party u/s 13A whose accounts are
       not audited, no business income) → 31 July 2026 (the 31/07/2026
       literal in the VBA);
     - a body required to furnish a report u/s 92E (transfer pricing —
       Taxcalc_AuditcaseDate92E) → 30 November 2026.
   ITR-3's / ITR-6's stubs encode only the single audit-case date and leave
   the case selection as a TODO; ITR-7 does the same.
   TODO Phase 4/6: choose 2026-07-31 / 2026-10-31 / 2026-11-30 from the
   audit-liability and 92E flags per the finalDuedate formula — that is
   filing-status/interest engine work, not this stub. */
window.FORM={id:"ITR-7",name:"ITR-7",ay:"2026-27",sw:"SW10000001",due:"2026-10-31"};

/* ---- code tables the shell's commit() may read (kept minimal) ----
   The shell resolves a PIN prefix to a state code and an IFSC prefix to a
   bank name when those fields are edited. No such fields exist in the stub,
   but defining the tables keeps the globals defined. Real tables: Phase 4. */
const PIN2ST={};   /* PIN first-two-digits -> state code */
const BANK={};     /* IFSC first-four-chars -> bank name */

/* =====================================================================
   Phase 4 registry — every section self-registers here, so section
   files never edit a shared file. Load order (assemble globs *.js):
   00_form < 08_registry < 10_state < 20_engine_<id> < 30_sec_<id>
   < 40_exp_<id> < 50_imp_<id> < 55_chk_<id> < 90_wiring.
   Section files run reg({...}) at load; 90_wiring consumes the arrays.
   Copied verbatim from forms/ITR-3/src/08_registry.js — this is the
   shell reg() contract, not form-specific — with the ITR-7 screen order.
   ===================================================================== */
const _SECREG=[];            /* {id,t,ref,f,s,eng,exp,imp,chk,order} */
/* screen order from books/ITR-7/structure.md + section_map.json (the 12
   sections). `ret` (return & exemption status) is a VIEW of the who/PI
   sheet, not a separate section_map mapping, so it is not a SCREEN_ORDER id. */
const SCREEN_ORDER=["who","vc","ie","hp","cg","vda","os","oa","bp","pti","cyla","app","funds","bodies","si","fa","tax","paid","bank"];
function reg(o){_SECREG.push(o);}   /* a section-builder calls reg({id, t, ref, f:sec<Id>, s, eng:eng<Id>, exp:exp<Id>, imp:imp<Id>, chk:chk<Id>, order}) */

/* pf: put onto a local (array-element) object — same as put, but named so the gate-4
   duplicate-writer grep (which scans `put(x,"key"`) does not false-flag the same
   leaf key written onto different array elements/blocks. Real full-path stale
   writes onto j still use put() and are still checked. */
function pf(o,p,v){return put(o,p,v);}

/* Phase 6 rule batches: additional runRules checks live in 61_rules_*.js files,
   each calling ruleset(fn). runRules() runs them all with its A/Dd collectors, so
   the rule set can be extended in disjoint files (parallel encoding, no conflicts). */
const _RULEBATCHES=[];
function ruleset(fn){_RULEBATCHES.push(fn);}

/* =====================================================================
   State, seeds and the schema skeleton (Phase 2 base scaffold — STUB).
   ITR-7 is the return for trusts, institutions and other bodies (sections
   139(4A)-(4F)). Modelled on forms/ITR-3/src/10_state.js and
   forms/ITR-6/src/10_state.js.
   ===================================================================== */
/* S — the working state. The shell contract (shell/README.md) requires
   meta, pi, fs, bank, ver, open:{} and C:{}; those are seeded enough that
   compute() and buildReturn() never throw; every real field is added in
   Phase 4. The per-screen-section namespaces (who/vc/ie/heads/app/funds/
   bodies/si/fa/tax/paid/bank) are intentionally NOT pre-seeded here: each
   Phase-4 section builder initialises its own with `S.<ns> = S.<ns> ||
   {..defaults}`, and a `{}` placeholder is truthy — it would short-circuit
   that `||` and drop every section's defaults (the ITR-6 lesson). Left
   undefined so each section's own seed runs. Defaults below are the
   shell-contract identity for a trust/institution: StatusOrCompanyType "4",
   filing section 11, exemption section 11, return furnished u/s 139(4A),
   Verification capacity "MD" — schema-valid enum members. */
const S={
  meta:{app:"yukti",form:"ITR-7",ay:"2026-27",ver:1},
  /* shell-contract identity / filing / verification (ITR-7 is a body, not an individual) */
  pi:{status:"4",res:"RES",name:"",pan:"",doi:"",retsec:"139-4A",exsec:"11"},
  fs:{optout:"No",sec:11,filed:""},
  bank:[],        /* shell array; also the 'bank' (verification) section's namespace */
  ver:{cap:"MD"},
  open:{}, C:{}
};

/* SEED — default row per grid key. No grids in the stub yet. */
const SEED={};

/* SKEL — the schema's required-key skeleton; equals books/ITR-7/skeleton.json,
   with the CreationInfo/Form_ITR7 constants made schema-valid (FormName
   "ITR-7", AssessmentYear "2026", SchemaVer/FormVer "Ver1.0"; SWCreatedBy/
   JSONCreatedBy matching [S][W][0-9]{8}; Digest "-"). Root object is ITR7;
   the return wrapper is {ITR:{ITR7:{...}}} (see 90_wiring.js). The seven
   required blocks (blocks.json): CreationInfo, Form_ITR7, PartA_GEN1,
   PartA_GEN2, PARTA_BS, PartB_TTI, Verification. */
const SKEL=
{
 "CreationInfo": {
  "SWVersionNo": "1.0",
  "SWCreatedBy": "SW10000001",
  "JSONCreatedBy": "SW10000001",
  "JSONCreationDate": "2026-01-01",
  "IntermediaryCity": "na",
  "Digest": "-"
 },
 "Form_ITR7": {
  "FormName": "ITR-7",
  "Description": "na",
  "AssessmentYear": "2026",
  "SchemaVer": "Ver1.0",
  "FormVer": "Ver1.0"
 },
 "PartA_GEN1": {
  "OrgFirmInfo": {
   "AssesseeName": {
    "SurNameOrOrgName": "na"
   },
   "PAN": "na",
   "Address": {
    "ResidenceNo": "na",
    "LocalityOrArea": "na",
    "CityOrTownOrDistrict": "na",
    "StateCode": "01",
    "CountryCodeMobile": 0,
    "MobileNo": 0,
    "EmailAddress": "na"
   },
   "DateOFFormOrIncorp": "2026-01-01",
   "StatusOrCompanyType": "4",
   "ReturnFurnishedSec": "139-4A",
   "SecExemptionClaimed": "11"
  },

/* =====================================================================
   ITR-7 · A.Y. 2026-27 — the rule driver (Phase 6 hosts the rule bodies).
   runRules(I,S_) returns [{cat:"A"|"D", n, msg}] — one entry per rule whose
   lawful assertion is FALSE (a violation). I is the built ITR7 object (schema
   keys); S_ is the live state. Every actual CBDT check lives in the
   61_rules_*.js ruleset() batches (Category A blocking, Category D advisory),
   registered into _RULEBATCHES (08_registry.js); they are encoded in Phase 6
   from each rule's own text (constitution rule 6), with guarded reads
   (RG / (X||{})).

   This scaffold ships the DRIVER only. Fault tolerance is PER RULE, following
   the fixed forms/ITR-5/src/60_rules.js: each A()/Dd() assertion is evaluated
   inside its own try/catch, so one rule that throws (e.g. on a wrong-typed
   imported field) is skipped — and recorded as an advisory — without aborting
   the sibling rules that follow it in the same batch. A rule may pass its
   condition either as a value (evaluated eagerly by the batch) or as a thunk
   `()=>cond` (evaluated here, which gives a throwing rule true per-rule
   isolation). A batch-level try/catch is retained only as a backstop for a
   fault in a batch's shared setup.

   RG / N / RSUM / REQ / isNew and the other helpers come from the shell
   (shell/shell.js); the rules do not redefine them.
   ===================================================================== */
function runRules(I,S_){
  I=I||{};
  const out=[];
  const fire=(cat,n,cond,msg)=>{
    let c;
    try{ c=(typeof cond==="function")?cond():cond; }
    catch(e){ out.push({cat:"D", n:n, msg:"[rule "+n+" skipped — "+((e&&e.message)||e)+"]"}); return; }  /* a throwing rule is skipped & recorded, never aborts its siblings */
    if(!c) out.push({cat:cat, n:n, msg:msg});
  };
  const A =(n,cond,msg)=>fire("A",n,cond,msg);   /* Category A — return not allowed to upload */
  const Dd=(n,cond,msg)=>fire("D",n,cond,msg);   /* Category D — advisory / may be defective u/s 139(9) */
  if(typeof _RULEBATCHES!=="undefined"){
    _RULEBATCHES.forEach(rb=>{ try{ rb(I,S_,A,Dd); }catch(e){ /* backstop: a fault in a batch's shared setup skips the rest of THAT batch only, never the other batches */ } });
  }
  return out;
}

/* =====================================================================
   auditRules(b) — the form's OWN arithmetic audit on the built return
   (belt-and-braces roll-up checks), returning string messages, [] when the
   return agrees with itself. This is NOT the department's validation rules
   (that is runRules); the shell calls this separately as the "does not agree
   with itself" gate, so it must never carry Category-D advisories. Modelled
   on ITR-3/ITR-6 auditRules, keyed to ITR-7's Part B blocks (PartB_TI /
   PartB_TTI). The Phase-4 tax section fills the figures these check; until
   then the return has zeros and the audit is silent.
   ===================================================================== */
function auditRules(b){
  const out=[];
  const j=(b&&b.ITR&&(b.ITR.ITR7||b.ITR[Object.keys(b.ITR)[0]]))||{};
  const g=(p,d)=>{let o=j;for(const k of p.split(".")){if(o&&k in o)o=o[k];else return d===undefined?0:d;}return o==null?(d===undefined?0:d):o;};
  const R_=(w,l,r,t)=>{if(Math.abs(N(l)-N(r))>(t||1))out.push(w+" (out by "+(N(l)-N(r))+")");};
  const C="PartB_TTI.ComputationOfTaxLiability.";
  /* gross tax liability = tax payable on total income + total surcharge + cess */
  R_("gross tax liability does not add up",g(C+"GrossTaxLiability"),
    g(C+"TaxPayableOnTI.TaxPayableOnTotInc")+g(C+"TotalSurcharge")+g(C+"EducationCess"),2);
  /* total surcharge = 25%-of-SI surcharge + surcharge on the rest of the tax payable */
  R_("total surcharge does not add up",g(C+"TotalSurcharge"),
    g(C+"Surcharge25ofSI")+g(C+"SurchargeOnTaxPayable"),2);
  /* net tax liability = gross tax liability − total tax relief (s.90/91) */
  R_("net tax liability is not gross tax liability less tax relief",g(C+"NetTaxLiability"),
    Math.max(0,g(C+"GrossTaxLiability")-g(C+"TaxRelief.TotTaxRelief")),2);
  /* taxes paid = advance + TDS + TCS + self-assessment */
  R_("the taxes paid do not add up",g("PartB_TTI.TaxPaid.TaxesPaid.TotalTaxesPaid"),
    g("PartB_TTI.TaxPaid.TaxesPaid.AdvanceTax")+g("PartB_TTI.TaxPaid.TaxesPaid.TDS")
    +g("PartB_TTI.TaxPaid.TaxesPaid.TCS")+g("PartB_TTI.TaxPaid.TaxesPaid.SelfAssessmentTax"));
  return out;
}

/* =====================================================================
   ITR-7 · Section "app" — Application & accumulation of income
   Screen ref: Schedule A · I · IA · D · DA.  Screen order 120, compute order 55.

   This is the APPLICATION & ACCUMULATION core of an 11/12 trust return — the
   centre of the form. Built ONLY from books/ITR-7/Schedule_A.md, Schedule_I.md,
   Schedule_IA.md, Schedule_D.md, Schedule_DA.md, section_map.json (all five ->
   "app"), enums.json and the ITR-7 schema. Owns these five schema blocks:

     · ScheduleA        — amount applied to the stated objects (Parts A..G):
        A  application by object head (revenue/capital),  B  expenditure NOT
        allowed as application, C  the source of the funds applied (C2..C7 +
        "Any other"), and D..G the reconciliation to G = the amount allowed as
        application (G = D − E + F, D = A12 − B − C2..C7). Every money line is a
        Revenue · Capital · Total triple.
     · ITRScheduleI     — income accumulated / set apart u/s 11(2) (or 3rd
        proviso to 10(23C)/10(21) r.w. 35(1)): a per-year ledger, col 15
        (AmountDeemedUs11) = (9)+(10)+(13)+(14) is the income deemed u/s 11(3).
     · ITRScheduleIA    — accumulated income taxed earlier u/s 11(3): the matrix
        behind Schedule I col 6 (year of accumulation × assessment year taxed).
     · ITRScheduleD     — deemed application u/s clause (2) Expln.1 to 11(1):
        per-year ledger, col (8) = (6)−(7) is the income deemed u/s 11(1B), col
        (9) = (4)−(6) the balance carried to next year.
     · ITRScheduleDA    — deemed application taxed earlier u/s 11(1B): the matrix
        behind Schedule D col 5.

   Consumes upstream:
     S.C.vc.{grossReceipts,aggregateIncome,totalVC}  — the income base
     S.C.ie.{receipts,applied,accumulation}          — IE-statement figures (fallback base)

   Publishes S.C.app.* (read by the tax section — Part B-TI):
     applied / appliedRev / appliedCap  — Sch A row G (TotAmountAllowedApplication):
        total amount ALLOWED as application of income (reduces income for exemption)
     a12 / expDisallowed / srcC2toC7    — Sch A working sub-totals (A12, B, C2..C7)
     accumulated                        — Sch I TotAmountAccumlated (amount set apart)
     deemed11_3                         — Sch I TotAmountDeemedUs11  (adds back to income)
     deemedApplied                      — Sch D TotAmountAppliedPY   (amount deemed applied)
     deemed11_1B                        — Sch D TotAmountNotAppliedCurrAY (adds back to income)
     iaGrandTotal / daGrandTotal        — Sch IA / DA reconciliation grand totals
     incomeBase                         — the income base drawn from vc/ie
     totalApplied                       — applied (G) + deemedApplied (Sch D)  → reduces income
     deemedIncome                       — deemed11_3 + deemed11_1B             → adds to income
     taxableBalance                     — indicative exemption balance for Part B-TI, which
        computes the definitive figure (the 15% permitted accumulation and the current-year
        set-apart u/s 11(2) are Part B-TI's, not this section's). Nothing else writes S.C.app.

   Enums (verbatim from books/ITR-7/enums.json — the coded VALUE is the schema
   member, the label is only the display; do NOT store the label):
     · ITRScheduleI.AccumlatedYear         -> integer "2020".."2025" (FY start year)
     · ITRScheduleD.AppliedYear            -> "1".."7"  (Prior to FY 2020-21 … 2025-26)
     · ITRScheduleD.DeemedApplicationReason-> "1"/"2"   (not received / any other reason)
     · ITRScheduleIA.YrOfAccumulationIA    -> "2020-21".."2023-24"
     · ITRScheduleDA.YrOfAccumulationDA    -> "PriorToAY","2020-21".."2023-24"
   ===================================================================== */

/* ---- enum tables (value, display) — from enums.json, labels expanded to the
   book's verbatim year text where the schema label is terse ---------------- */
const APP_IYEAR =[["2020","2020-21"],["2021","2021-22"],["2022","2022-23"],
                  ["2023","2023-24"],["2024","2024-25"],["2025","2025-26"]];
const APP_DYEAR =[["1","Prior to FY 2020-21"],["2","2020-21"],["3","2021-22"],
                  ["4","2022-23"],["5","2023-24"],["6","2024-25"],["7","2025-26"]];
const APP_DREASON=[["1","Income has not been received during that year"],
                   ["2","Any other reason"]];
const APP_IAYEAR=[["2020-21","2020-21"],["2021-22","2021-22"],
                  ["2022-23","2022-23"],["2023-24","2023-24"]];
const APP_DAYEAR=[["PriorToAY","Prior to 2020-21"],["2020-21","2020-21"],
                  ["2021-22","2021-22"],["2022-23","2022-23"],["2023-24","2023-24"]];
const _inSet=(arr,v)=>{v=st0(v);return arr.some(x=>x[0]===v)?v:"";};

/* ---- state seed (own namespace; not pre-seeded in 10_state.js) ---------- */
S.app = S.app || {};
S.app.a = S.app.a || {};   /* Part A object heads   {key:{rev,cap}} */
S.app.b = S.app.b || {};   /* Part B disallowed      {key:{rev,cap}} */
S.app.c = S.app.c || {};   /* Part C named sources   {key:{rev,cap}} */
S.app.g = S.app.g || {};   /* Parts E/F (not-paid / paid-earlier)    */
S.app.cOthers = S.app.cOthers || [];   /* Part C "Any other" sub-table  */
S.app.iRows  = S.app.iRows  || [];     /* ScheduleI[]      */
S.app.iaRows = S.app.iaRows || [];     /* YrOfAccDtls[]    (IA) */
S.app.dRows  = S.app.dRows  || [];     /* ScheduleD[]      */
S.app.daRows = S.app.daRows || [];     /* YrOfAccumDtls[]  (DA) */

/* ---- small pair helpers -------------------------------------------------- */
function _pair(o){o=o||{};return {rev:sg(o.rev), cap:sg(o.cap)};}
function _padd(){return Array.prototype.slice.call(arguments)
  .reduce((a,p)=>({rev:a.rev+p.rev, cap:a.cap+p.cap}),{rev:0,cap:0});}
const _pt=p=>p.rev+p.cap;

/* ==================================================================
   ENGINE — compute every schedule's totals, publish S.C.app
   ================================================================== */
function engApp(){
  S.app=S.app||{};
  const A=S.app; A.a=A.a||{}; A.b=A.b||{}; A.c=A.c||{}; A.g=A.g||{};
  const C=S.C.app={};

  /* ---------- Schedule A · Part A (rows 5–19) ---------- */
  const aOther=_pair(A.a.otherCorpus);                         /* row 7  — 100% */
  const a85={rev:R(0.85*aOther.rev), cap:R(0.85*aOther.cap)};  /* row 8  — 85% (A1a) */
  const aRel=_pair(A.a.religious),   aPoor=_pair(A.a.reliefPoor), aEdu=_pair(A.a.educational),
        aYoga=_pair(A.a.yoga),       aMed=_pair(A.a.medical),     aEnv=_pair(A.a.environ),
        aMon=_pair(A.a.monuments),   aGpu=_pair(A.a.gpu),         aCant=_pair(A.a.cantIdent),
        aCost=_pair(A.a.costNewAsset);
  const a12=_padd(a85,aRel,aPoor,aEdu,aYoga,aMed,aEnv,aMon,aGpu,aCant,aCost); /* A12 */

  /* ---------- Schedule A · Part B (rows 21–29) ---------- */
  const bCorpus=_pair(A.b.corpusDon),      bOther=_pair(A.b.otherThanCorpus),
        bNotSame=_pair(A.b.notSameObj),    bTrust=_pair(A.b.otherThanTrust),
        bOutApp=_pair(A.b.outIndiaApp),    bOutNot=_pair(A.b.outIndiaNotApp),
        bBeyond=_pair(A.b.beyondObj),      bDis=_pair(A.b.otherDisallow);
  const bTot=_padd(bCorpus,bOther,bNotSame,bTrust,bOutApp,bOutNot,bBeyond,bDis); /* B */

  /* ---------- Schedule A · Part C (rows 31–43) ---------- */
  const cProp=_pair(A.c.incProperty),  cAccum=_pair(A.c.incAccum),
        cDeem=_pair(A.c.incDeemed),    cE15=_pair(A.c.earlier15),
        cCorp=_pair(A.c.corpus),       cBorr=_pair(A.c.borrowed);
  const cOthers=(A.cOthers||[]).filter(r=>st0(r.nat)||N(r.rev)||N(r.cap));
  const cOthTot={rev:cOthers.reduce((s,r)=>s+sg(r.rev),0),
                 cap:cOthers.reduce((s,r)=>s+sg(r.cap),0)};
  const c27=_padd(cProp,cAccum,cDeem,cE15,cCorp,cBorr);   /* C2..C7 (subtracted in D) */
  const cTot=_padd(c27,cOthTot);                          /* C1 = C2..C7 + Any other */

  /* ---------- Schedule A · Parts D–G (rows 47–50) ---------- */
  const d={rev:a12.rev-bTot.rev-c27.rev, cap:a12.cap-bTot.cap-c27.cap}; /* D = A12−B−C2..C7 */
  const e=_pair(A.g.notPaid);      /* E — booked but not actually applied */
  const f=_pair(A.g.paidPY);       /* F — actually paid, accrued earlier */
  const g={rev:d.rev-e.rev+f.rev, cap:d.cap-e.cap+f.cap};               /* G = D−E+F */

  C.A={aOther,a85,aRel,aPoor,aEdu,aYoga,aMed,aEnv,aMon,aGpu,aCant,aCost,a12,
       bCorpus,bOther,bNotSame,bTrust,bOutApp,bOutNot,bBeyond,bDis,bTot,
       cProp,cAccum,cDeem,cE15,cCorp,cBorr,cOthers,cOthTot,c27,cTot,d,e,f,g};

  /* ---------- Schedule I — per-year accumulation ledger ---------- */
  const iLive=(A.iRows||[]).filter(_iLive);
  const iCalc=iLive.map(r=>{
    const year=sg(r.year), acc=sg(r.acc), applPY=sg(r.applPY), txd=sg(r.txd),
          appl8=sg(r.appl8), appl9=sg(r.appl9), cred10=sg(r.cred10),
          inv12=sg(r.inv12), inv13=sg(r.inv13), notUtil14=sg(r.notUtil14);
    const bal5=acc-applPY, bal7=bal5-txd, bal11=bal7-appl8-appl9-cred10,
          deemed15=appl9+cred10+inv13+notUtil14;
    return {year,acc,purpose:st0(r.purpose),applPY,txd,appl8,appl9,cred10,
            inv12,inv13,notUtil14,bal5,bal7,bal11,deemed15};
  });
  const iSum=k=>iCalc.reduce((s,r)=>s+r[k],0);
  C.iTot={acc:iSum("acc"),applPY:iSum("applPY"),bal5:iSum("bal5"),txd:iSum("txd"),
          bal7:iSum("bal7"),appl8:iSum("appl8"),appl9:iSum("appl9"),cred10:iSum("cred10"),
          bal11:iSum("bal11"),inv12:iSum("inv12"),inv13:iSum("inv13"),
          notUtil14:iSum("notUtil14"),deemed:iSum("deemed15")};
  C.iCalc=iCalc;

  /* ---------- Schedule IA — matrix (11(3) taxed earlier) ---------- */
  const iaLive=(A.iaRows||[]).filter(_iaLive);
  const iaCalc=iaLive.map(r=>{
    const prior=sg(r.prior), a2223=sg(r.a2223), a2324=sg(r.a2324),
          a2425=sg(r.a2425), a2526=sg(r.a2526);
    return {yr:st0(r.yr),prior,a2223,a2324,a2425,a2526,
            total:prior+a2223+a2324+a2425+a2526};
  });
  C.iaCalc=iaCalc;
  C.iaGrand=iaCalc.reduce((s,r)=>s+r.total,0);

  /* ---------- Schedule D — per-year deemed-application ledger ---------- */
  const dLive=(A.dRows||[]).filter(_dLive);
  const dCalc=dLive.map(r=>{
    const amtPY=sg(r.amtPY), reqApp=sg(r.reqApp), txd=sg(r.txd),
          toApply=sg(r.toApply), appliedCurr=sg(r.appliedCurr);
    const notApplied=toApply-appliedCurr;   /* (8)=(6)-(7) — deemed income u/s 11(1B) */
    const balance=reqApp-toApply;           /* (9)=(4)-(6) */
    return {year:st0(r.year),amtPY,reason:st0(r.reason),reasonDesc:st0(r.reasonDesc),
            reqApp,txd,toApply,appliedCurr,notApplied,balance};
  });
  const dSum=k=>dCalc.reduce((s,r)=>s+r[k],0);
  C.dTot={reqApp:dSum("reqApp"),txd:dSum("txd"),amtPY:dSum("amtPY"),
          toApply:dSum("toApply"),appliedCurr:dSum("appliedCurr"),
          notApplied:dSum("notApplied"),balance:dSum("balance")};
  C.dCalc=dCalc;

  /* ---------- Schedule DA — matrix (11(1B) taxed earlier) ---------- */
  const daLive=(A.daRows||[]).filter(_daLive);
  const daCalc=daLive.map(r=>{
    const prior=sg(r.priorAY), a2223=sg(r.a2223), a2324=sg(r.a2324),
          a2425=sg(r.a2425), a2526=sg(r.a2526);
    return {yr:st0(r.yr),prior,a2223,a2324,a2425,a2526,
            total:prior+a2223+a2324+a2425+a2526};
  });
  C.daCalc=daCalc;
  C.daGrand=daCalc.reduce((s,r)=>s+r.total,0);

  /* ---------- cross-section rolls (Part B-TI) ---------- */
  C.appliedRev=g.rev; C.appliedCap=g.cap; C.applied=_pt(g);   /* Sch A row G */
  C.a12=_pt(a12); C.expDisallowed=_pt(bTot); C.srcC2toC7=_pt(c27);
  C.accumulated = C.iTot.acc;                 /* Sch I TotAmountAccumlated */
  C.deemed11_3  = C.iTot.deemed;              /* Sch I TotAmountDeemedUs11 → adds to income */
  C.deemedApplied = C.dTot.amtPY;             /* Sch D TotAmountAppliedPY  (deemed applied) */
  C.deemed11_1B   = C.dTot.notApplied;        /* Sch D TotAmountNotAppliedCurrAY → adds to income */
  C.iaGrandTotal  = C.iaGrand;
  C.daGrandTotal  = C.daGrand;

  const incomeBase = R(RG(S,"C.vc.grossReceipts",0)) ||
                     R(RG(S,"C.ie.receipts",0));
  C.incomeBase    = incomeBase;
  C.totalApplied  = C.applied + C.deemedApplied;      /* application allowed + deemed applied */
  C.deemedIncome  = C.deemed11_3 + C.deemed11_1B;     /* 11(3) + 11(1B) add-backs */
  /* indicative exemption balance — Part B-TI computes the definitive figure */
  C.taxableBalance= Math.max(0, incomeBase - C.totalApplied) + C.deemedIncome;

  /* ---------- Part B-TI exemption ladder (s.11/12) — SEAM to the tax section ----
     The tax section's Part-B1 regime reads S.C.app.grossIncomeAfterExemption as
     the income chargeable AFTER the s.11 application/accumulation exemption, and
     exports the decomposition lines below into PartB_TI. These keys are computed
     here (the publisher) so the 85%-application ladder actually flows. All
     guarded; reads S.C.vc which computes before app (corder 25 < 55). */
  const _vc=(S.C.vc||{});
  const vcOtherCorpus = Math.max(0, R(_vc.totalVC) - R(_vc.corpus));   /* other-than-corpus contributions */
  const aggInc        = R(_vc.aggregateIncome);                        /* Schedule AI row 23 (income base) */
  const anon115        = R(_vc.anon115BBC);                            /* Diii — chargeable u/s 115BBC @30% */
  /* income eligible for the s.11 application test (the 115BBC anon is carved out
     and taxed separately @30%, so it does not get the application benefit) */
  const aggregate1112 = Math.max(0, vcOtherCorpus + aggInc - anon115);
  const dApplied   = C.applied;                                        /* Sch A row G (application allowed) */
  const dDeemedApp = C.deemedApplied;                                  /* Sch D TotAmountAppliedPY */
  const dSetApart  = Math.max(0, R(A.acc11_2!=null?A.acc11_2:0));      /* accumulation set apart u/s 11(2) */
  const std15room  = Math.max(0, aggregate1112 - dApplied - dDeemedApp - dSetApart);
  const dStd15     = Math.min(R(0.15*aggregate1112), std15room);       /* 11(1)(a) standard 15% accumulation */
  const totalDeductions = R(dApplied + dDeemedApp + dSetApart + dStd15);
  const addDeemed  = C.deemed11_3 + C.deemed11_1B;                     /* Sch I col15 + Sch D col8 add-backs */
  const totalAdditions = R(addDeemed + anon115);                       /* incl. the 115BBC anonymous donation */
  const residual   = Math.max(0, aggregate1112 - totalDeductions);

  C.vcCorpus115BBC   = anon115;                    /* Part B-TI item 1 (VcCorpusSec11) */
  C.aggregate1112    = R(aggregate1112);           /* AggregateIncomeUs1112 */
  C.amtCharitable111 = R(0.85*aggregate1112);      /* AmtForCharitableUs111 (85% to be applied) */
  C.incToApply       = R(aggregate1112);           /* IncToBeApplied */
  C.loanRepay        = 0;                           /* AmtAppForCharitablePurposeRepayment */
  C.appliedSpecMode  = 0;                           /* AmtAppliedSpecifiedMode */
  C.accumulated11_2  = R(dStd15);                   /* AmtAccumulatedForCharitable (15% standard) */
  C.setApart11_2     = R(dSetApart);               /* AmtFulfilledUs11_2 (11(2) set apart) */
  C.totalDeductions  = totalDeductions;            /* TIDeductions.TotalDeductions */
  C.anonNoExempt     = anon115;                    /* TIAdditions...AnonymousDonationVC */
  C.incUs12_2        = 0;                           /* IncChargeableUs12_2 */
  C.disallow40aia    = 0;                           /* AmtDsllwblUs111RWS40AIA */
  C.disallow40A3     = 0;                           /* AmtDsllwblUs111RWS40A3 */
  C.incExp3B         = 0;                           /* IncExp3BUS80G */
  C.incExp1B         = 0;                           /* IncExp1BUS80G */
  C.anyOtherInc      = 0;                           /* AnyOthrIncome */
  C.totalAdditions   = totalAdditions;             /* TIAdditions.TotalAdditions */
  C.incUs11_4        = 0;                           /* IncChargeableUs11_4 */
  C.netAgri          = 0;                           /* net agricultural income for rate purposes */
  C.incMMR           = 0;                           /* B2 income at maximum marginal rate */
  C.grossIncomeAfterExemption = R(residual + totalAdditions);  /* Part-B1 item 9 → tax section */
}

/* one Schedule A input line — two number inputs (Rev, Cap) + live Total */
function _aIn(label,base,o){o=o||{};
  const rev=sg(get("app."+base+".rev")), cap=sg(get("app."+base+".cap"));
  return '<tr'+(o.cls?' class="'+o.cls+'"':'')+'><td class="l">'+
    (o.sl?'<b>'+esc(o.sl)+'</b>&nbsp; ':'')+esc(label)+'</td>'+
    '<td>'+inp("app."+base+".rev",{n:1})+'</td>'+
    '<td>'+inp("app."+base+".cap",{n:1})+'</td>'+
    '<td class="num">'+cell(rev+cap)+'</td></tr>';}
/* one Schedule A computed line — all three cells read-only */
function _aTot(label,rev,cap,o){o=o||{};
  return '<tr class="'+(o.cls||"tot")+'"><td class="l">'+
    (o.sl?'<b>'+esc(o.sl)+'</b>&nbsp; ':'')+'<b>'+esc(label)+'</b></td>'+
    '<td class="num">'+cell(rev)+'</td><td class="num">'+cell(cap)+'</td>'+
    '<td class="num">'+cell(rev+cap)+'</td></tr>';}
function _a3open(){return '<div class="full"><table class="gt" style="min-width:720px">'+
  '<thead><tr><th class="l">Particulars</th><th style="width:150px">Revenue</th>'+
  '<th style="width:150px">Capital</th><th style="width:150px">Total</th></tr></thead><tbody>';}
const _a3close='</tbody></table></div>';

function secApp(){
  engApp();
  const C=S.C.app||{}, X=C.A||{};
  let h="";

  h+=note("The application &amp; accumulation core of an exemption return. <b>Schedule A</b> "+
    "measures the amount applied to the trust's objects (the 85%-application numerator); "+
    "<b>Schedule I / IA</b> track accumulation set apart u/s 11(2) and what of it was taxed "+
    "u/s 11(3); <b>Schedule D / DA</b> track deemed application under Explanation 1 to 11(1) "+
    "and what was taxed u/s 11(1B). Every money line splits Revenue and Capital; Total = "+
    "Revenue + Capital.");

  /* ================= Schedule A ================= */
  h+=sub("Schedule A — Amount applied to the stated objects from all sources");

  /* Part A */
  h+='<div class="note">A — Application towards the stated objects of the trust/institution</div>';
  h+=_a3open();

  h+=_aTot("85% of the above donation — Other than Corpus (counted as application)",(X.a85||{}).rev,(X.a85||{}).cap,{sl:"A1a",cls:"sub"});

  h+=_aIn("Medical relief","a.medical");
  h+=_aIn("Preservation of environment","a.environ");

  h+=_aIn("General public utility","a.gpu");
  h+=_aIn("Application which cannot be specifically identified above","a.cantIdent");
  h+=_aIn("Cost of new asset for exemption u/s 11(1A) (restricted to the net consideration)","a.costNewAsset");
  h+=_aTot("Total (A1a to A11)",(X.a12||{}).rev,(X.a12||{}).cap,{sl:"A12"});
  h+=_a3close;

  /* Part B */
  h+='<div class="note">B — Expenditure NOT allowed as application (out of Row A, other than application out of C2 to C7)</div>';
  h+=_a3open();
  h+=_aIn("Donation to 12AB/10(23C) trust towards Corpus","b.corpusDon");
  h+=_aIn("Donation to 12AB/10(23C) trust other than towards corpus, out of accumulated income","b.otherThanCorpus");
  h+=_aIn("Donation to 12AB/10(23C) trust not having the same objects","b.notSameObj");
  h+=_aIn("Donation to any person other than a 12AB/10(23C) trust","b.otherThanTrust");
  h+=_aIn("Application outside India — approval u/s 11(1)(c) proviso obtained","b.outIndiaApp");
  h+=_aIn("Application outside India — approval u/s 11(1)(c) proviso NOT obtained","b.outIndiaNotApp");
  h+=_aIn("Applied for any purpose beyond the objects of the trust/institution","b.beyondObj");
  h+=_aIn("Any other disallowable application","b.otherDisallow");
  h+=_aTot("Total expenditure not allowed as application (B1 to B8)",(X.bTot||{}).rev,(X.bTot||{}).cap,{sl:"B"});
  h+=_a3close;

  /* Part C */
  h+='<div class="note">C — Source of fund to meet the application in Row A (to the extent C2 to C7 is included in A12)</div>';
  h+=_a3open();
  h+=_aIn("Income derived from property / income earned during the year (excluding corpus)","c.incProperty",{sl:"C2"});
  h+=_aIn("Income accumulated u/s 11(2) or 3rd proviso to 10(23C) in earlier years","c.incAccum",{sl:"C3"});
  h+=_aIn("Income deemed applied in a preceding year under clause 2 of Expln.1 to 11(1)","c.incDeemed",{sl:"C4"});
  h+=_aIn("Income of earlier years up to 15% accumulated or set apart","c.earlier15",{sl:"C5"});
  h+=_aIn("Corpus","c.corpus",{sl:"C6"});
  h+=_aIn("Borrowed Fund","c.borrowed",{sl:"C7"});
  h+=_aTot("Total source of fund (C2 to C7 + Any other)",(X.cTot||{}).rev,(X.cTot||{}).cap,{sl:"C1"});
  h+=_a3close;
  h+=note("C8 — Any other source (please specify). Revenue and Capital amount for each nature.");
  h+=grid("app.cOthers",[
      {k:"nat",h:"Nature",t:"txt",w:"280px",max:125},
      {k:"rev",h:"Revenue Amount",t:"num",w:"160px"},
      {k:"cap",h:"Capital Amount",t:"num",w:"160px"},
      {k:"tot",h:"Total",t:"calc",w:"150px",f:r=>sg(r.rev)+sg(r.cap)}],
      S.app.cOthers,{min:"780px",empty:"No other source entered.",add:"Add a source"});

  /* Parts D–G */
  h+='<div class="note">D to G — Reconciliation to the amount allowed as application</div>';
  h+=_a3open();
  h+=_aTot("D — Total amount applied during the year [A12 − B − C2..C7]",(X.d||{}).rev,(X.d||{}).cap,{sl:"D"});
  h+=_aIn("E — Amount not actually applied during the year out of D (if included in A12)","g.notPaid",{sl:"E"});
  h+=_aIn("F — Amount actually paid this year that accrued in an earlier year (not claimed earlier)","g.paidPY",{sl:"F"});
  h+=_aTot("G — Total amount to be allowed as application (G = D − E + F)",(X.g||{}).rev,(X.g||{}).cap,{sl:"G"});
  h+=_a3close;
  h+=row("Amount allowed as application (Schedule A, G — Total)",cell(C.applied),
    {ref:"TotAmountAllowedApplication",hint:"the 85%-application numerator carried to Part B-TI"});

  /* ================= Schedule I ================= */
  h+=sub("Schedule I — Income accumulated / set apart u/s 11(2)");
  h+=note("One row per year of accumulation. Balance (5)=(2)−(4); (7)=(5)−(6); "+
    "(11)=(7)−(8)−(9)−(10); Amount deemed income u/s 11(3) (15) = (9)+(10)+(13)+(14).");
  h+=grid("app.iRows",[
      {k:"year",h:"(1) Year of accumulation",t:"sel",w:"150px",req:1,opts:APP_IYEAR},
      {k:"acc",h:"(2) Amount accumulated",t:"num",w:"150px",req:1},
      {k:"purpose",h:"(3) Purpose",t:"txt",w:"200px",req:1,max:200},
      {k:"applPY",h:"(4) Applied up to beginning of PY",t:"num",w:"150px"},
      {k:"bal5",h:"(5) Balance (2−4)",t:"calc",w:"130px",f:r=>sg(r.acc)-sg(r.applPY)},
      {k:"txd",h:"(6) Taxed in earlier AY(s)",t:"num",w:"150px"},
      {k:"bal7",h:"(7) Balance available (5−6)",t:"calc",w:"140px",f:r=>(sg(r.acc)-sg(r.applPY))-sg(r.txd)},
      {k:"appl8",h:"(8) Applied this year from accumulation",t:"num",w:"160px"},
      {k:"appl9",h:"(9) Applied for other purpose",t:"num",w:"150px"},
      {k:"cred10",h:"(10) Credited/paid to another trust",t:"num",w:"160px"},
      {k:"bal11",h:"(11) Balance (7−8−9−10)",t:"calc",w:"150px",
        f:r=>((sg(r.acc)-sg(r.applPY))-sg(r.txd))-sg(r.appl8)-sg(r.appl9)-sg(r.cred10)},
      {k:"inv12",h:"(12) Invested in 11(5) modes",t:"num",w:"150px"},
      {k:"inv13",h:"(13) Invested in other modes",t:"num",w:"150px"},
      {k:"notUtil14",h:"(14) Not utilised in period",t:"num",w:"150px"},
      {k:"deemed15",h:"(15) Deemed income u/s 11(3)",t:"calc",w:"160px",
        f:r=>sg(r.appl9)+sg(r.cred10)+sg(r.inv13)+sg(r.notUtil14)}],
      S.app.iRows,{min:"2350px",empty:"No accumulation year entered.",add:"Add a year"});
  h+=row("Total amount accumulated (col 2)",cell((C.iTot||{}).acc),{ref:"TotAmountAccumlated"});
  h+=row("Total amount deemed income u/s 11(3) (col 15)",cell((C.iTot||{}).deemed),
    {ref:"TotAmountDeemedUs11",hint:"deemed income → Part B-TI"});

  /* ================= Schedule IA ================= */
  h+=sub("Schedule IA — Accumulated income taxed earlier u/s 11(3)");
  h+=note("Detail behind Schedule I col 6: for each year of accumulation, the amount taxed "+
    "in each earlier assessment year. Row Total = the sum across assessment years.");
  h+=grid("app.iaRows",[
      {k:"yr",h:"Year of accumulation (F.Yr.)",t:"sel",w:"170px",req:1,opts:APP_IAYEAR},
      {k:"prior",h:"AY 2021-22",t:"num",w:"140px"},
      {k:"a2223",h:"AY 2022-23",t:"num",w:"140px"},
      {k:"a2324",h:"AY 2023-24",t:"num",w:"140px"},
      {k:"a2425",h:"AY 2024-25",t:"num",w:"140px"},
      {k:"a2526",h:"AY 2025-26",t:"num",w:"140px"},
      {k:"tot",h:"Total (A+B+C+D)",t:"calc",w:"150px",
        f:r=>sg(r.prior)+sg(r.a2223)+sg(r.a2324)+sg(r.a2425)+sg(r.a2526)}],
      S.app.iaRows,{min:"1130px",empty:"No taxed accumulation entered.",add:"Add a year"});
  h+=row("Grand total taxed u/s 11(3)",cell(C.iaGrand),{ref:"GrandTotal"});

  /* ================= Schedule D ================= */
  h+=sub("Schedule D — Deemed application u/s clause (2), Explanation 1 to 11(1)");
  h+=note("One row per year in which income was deemed applied. (8)=(6)−(7) is the amount "+
    "that could not be applied and is deemed income u/s 11(1B); (9)=(4)−(6) is the balance "+
    "carried to FY 2026-27 onwards. Give a reason description when the reason is \"Any other\".");
  h+=grid("app.dRows",[
      {k:"year",h:"(1) Year deemed applied",t:"sel",w:"170px",req:1,opts:APP_DYEAR},
      {k:"amtPY",h:"(2) Amount deemed applied",t:"num",w:"150px",req:1},
      {k:"reason",h:"(3) Reason of deeming",t:"sel",w:"220px",req:1,opts:APP_DREASON},
      {k:"reasonDesc",h:"Reason (if any other)",t:"txt",w:"200px",max:250},
      {k:"reqApp",h:"(4) Amount required to be applied",t:"num",w:"160px"},
      {k:"txd",h:"(5) Taxed in earlier AY(s)",t:"num",w:"150px"},
      {k:"toApply",h:"(6) Required to apply this FY",t:"num",w:"160px"},
      {k:"appliedCurr",h:"(7) Applied this FY (earlier claim)",t:"num",w:"170px"},
      {k:"notApplied",h:"(8) Deemed income u/s 11(1B) (6−7)",t:"calc",w:"180px",
        f:r=>sg(r.toApply)-sg(r.appliedCurr)},
      {k:"balance",h:"(9) Balance to apply FY26-27+ (4−6)",t:"calc",w:"180px",
        f:r=>sg(r.reqApp)-sg(r.toApply)}],
      S.app.dRows,{min:"1900px",empty:"No deemed application entered.",add:"Add a year"});
  h+=row("Total amount deemed applied (col 2)",cell((C.dTot||{}).amtPY),{ref:"TotAmountAppliedPY"});
  h+=row("Total deemed income u/s 11(1B) (col 8)",cell((C.dTot||{}).notApplied),
    {ref:"TotAmountNotAppliedCurrAY",hint:"deemed income → Part B-TI"});

  /* ================= Schedule DA ================= */
  h+=sub("Schedule DA — Deemed application taxed earlier u/s 11(1B)");
  h+=note("Detail behind Schedule D col 5: for each year of deemed application, the amount "+
    "taxed in each earlier assessment year. Row Total = the sum across assessment years.");
  h+=grid("app.daRows",[
      {k:"yr",h:"Year of deemed application (F.Yr.)",t:"sel",w:"200px",req:1,opts:APP_DAYEAR},
      {k:"priorAY",h:"Prior to AY 2021-22",t:"num",w:"150px"},
      {k:"a2223",h:"AY 2022-23",t:"num",w:"140px"},
      {k:"a2324",h:"AY 2023-24",t:"num",w:"140px"},
      {k:"a2425",h:"AY 2024-25",t:"num",w:"140px"},
      {k:"a2526",h:"AY 2025-26",t:"num",w:"140px"},
      {k:"tot",h:"Total (A+B+C+D+E)",t:"calc",w:"160px",
        f:r=>sg(r.priorAY)+sg(r.a2223)+sg(r.a2324)+sg(r.a2425)+sg(r.a2526)}],
      S.app.daRows,{min:"1200px",empty:"No taxed deemed application entered.",add:"Add a year"});
  h+=row("Grand total taxed u/s 11(1B)",cell(C.daGrand),{ref:"GrandTotal"});

  return h;
}

/* write a Revenue/Capital/Total triple at path (always — required totals) */
function _triAlways(j,path,p){
  put(j,path+".Revenue",sg(p.rev));
  put(j,path+".Capital",sg(p.cap));
  put(j,path+".Total",  sg(p.rev+p.cap));
}
/* write a triple only when it carries a value (optional detail rows) */
function _triOpt(j,path,p){ if(p&&(p.rev||p.cap)) _triAlways(j,path,p); }

function expApp(j){
  const C=S.C.app||{}, X=C.A||{};

  /* ---------- Schedule A ---------- */
  const hasA = _pt(X.a12||{rev:0,cap:0}) || _pt(X.bTot||{rev:0,cap:0}) ||
    _pt(X.cTot||{rev:0,cap:0}) || _pt(X.aOther||{rev:0,cap:0}) ||
    (X.e&&_pt(X.e)) || (X.f&&_pt(X.f));
  if(hasA){
    const P="ScheduleA.";
    /* A — object heads (optional details + required total A12) */
    _triOpt(j,P+"AppTowExpTrstInst.OtherThanCorpus",   X.aOther);
    _triOpt(j,P+"AppTowExpTrstInst.OtherThanCorpus85", X.a85);
    _triOpt(j,P+"AppTowExpTrstInst.Religious",         X.aRel);
    _triOpt(j,P+"AppTowExpTrstInst.ReliefOfPoor",      X.aPoor);
    _triOpt(j,P+"AppTowExpTrstInst.Educational",       X.aEdu);
    _triOpt(j,P+"AppTowExpTrstInst.Yoga",              X.aYoga);
    _triOpt(j,P+"AppTowExpTrstInst.MedicalRelief",     X.aMed);
    _triOpt(j,P+"AppTowExpTrstInst.PreservationOfEnvrmnt",       X.aEnv);
    _triOpt(j,P+"AppTowExpTrstInst.PreservationOfMonumentsEtc",  X.aMon);
    _triOpt(j,P+"AppTowExpTrstInst.GeneralPublicUtility",        X.aGpu);
    _triOpt(j,P+"AppTowExpTrstInst.AppCantBeSpecIdentAbov",      X.aCant);
    _triOpt(j,P+"AppTowExpTrstInst.CostNewAssetUs11_1A",         X.aCost);
    _triAlways(j,P+"AppTowExpTrstInst.TotalA1toA11",   X.a12);
    /* B — expenditure not allowed (optional details + required total) */
    _triOpt(j,P+"ExpNotAllowedApplication.DonFormingPartCorpusFund",      X.bCorpus);
    _triOpt(j,P+"ExpNotAllowedApplication.DonationTowardsOtherThanCorpus",X.bOther);
    _triOpt(j,P+"ExpNotAllowedApplication.DonationNotSameObject",         X.bNotSame);
    _triOpt(j,P+"ExpNotAllowedApplication.DonationOtherThanTrust",        X.bTrust);
    _triOpt(j,P+"ExpNotAllowedApplication.ApplctnOutIndiaApprvlObtnd",    X.bOutApp);
    _triOpt(j,P+"ExpNotAllowedApplication.ApplctnOutIndiaApprvlNotObtnd", X.bOutNot);
    _triOpt(j,P+"ExpNotAllowedApplication.AppliedBeyondObject",           X.bBeyond);
    _triOpt(j,P+"ExpNotAllowedApplication.AnyOthrDisallowableExpenditure",X.bDis);
    _triAlways(j,P+"ExpNotAllowedApplication.TotExpNotAllowedApplication",X.bTot);
    /* C — source of fund (optional details + required total) */
    _triOpt(j,P+"SrcRevCapApplctn.IncDerFrmPrprty",       X.cProp);
    _triOpt(j,P+"SrcRevCapApplctn.IncAccumulatedEarlierYr",X.cAccum);
    _triOpt(j,P+"SrcRevCapApplctn.IncDeemdPrcdngYr",      X.cDeem);
    _triOpt(j,P+"SrcRevCapApplctn.EarlierYrIncUpto15Per", X.cE15);
    _triOpt(j,P+"SrcRevCapApplctn.Corpus",                X.cCorp);
    _triOpt(j,P+"SrcRevCapApplctn.BorrowedFund",          X.cBorr);
    _triAlways(j,P+"SrcRevCapApplctn.TotSrcRevCapApplctn",X.cTot);
    /* C8 — Any other source (array + its total) */
    const oth=(X.cOthers||[]);
    if(oth.length){
      _triAlways(j,P+"SrcRevCapApplctn.OthersInc.TotOthersInc",X.cOthTot);
      j.ScheduleA.SrcRevCapApplctn.OthersInc.OthersIncDtls = oth.map(r=>{
        const o={};
        pf(o,"OthNatOfInc",(st0(r.nat)||"NA").slice(0,125));
        pf(o,"OthRevAmount",sg(r.rev));
        pf(o,"OthCapAmount",sg(r.cap));
        return o;});
    }
    /* D–G — reconciliation */
    _triAlways(j,P+"TotAmtAppDrngPrevYr",         X.d);
    _triOpt(j,   P+"AmountNotPaidPY",             X.e);
    _triOpt(j,   P+"AmountPaidPY",                X.f);
    _triAlways(j,P+"TotAmountAllowedApplication", X.g);
  }

  /* ---------- Schedule I ---------- */
  const iCalc=C.iCalc||[];
  if(iCalc.length){
    j.ITRScheduleI = j.ITRScheduleI || {};
    j.ITRScheduleI.ScheduleI = iCalc.map(r=>{
      const o={};
      pf(o,"AccumlatedYear",sg(r.year));
      pf(o,"AmountAccumlated",sg(r.acc));
      pf(o,"AccumulationPurpose",(st0(r.purpose)||"NA").slice(0,200));
      pf(o,"AmountAppliedPreviousYear",sg(r.applPY));
      pf(o,"BalanceAfterPY",sg(r.bal5));
      pf(o,"AmtTxdErlAssYr",sg(r.txd));
      pf(o,"BalAvailApp",sg(r.bal7));
      pf(o,"AmountAppliedDuringYear",sg(r.appl8));
      pf(o,"AmountAppliedDuringYearOtherPurpose",sg(r.appl9));
      pf(o,"AmountCreditedTrust",sg(r.cred10));
      pf(o,"BalanceAmount",sg(r.bal11));
      pf(o,"AmountInvested",sg(r.inv12));

/* ==================================================================
   CHECKS (section-local sanity — not the Phase-6 rule engine)
   ================================================================== */
function chkApp(){
  const out=[]; engApp();
  const C=S.C.app||{}, X=C.A||{};

  /* Schedule A — application should not exceed the income base */
  if(C.applied>0 && C.incomeBase>0 && C.totalApplied>C.incomeBase*1.0001)
    out.push({lvl:"warn",t:"Application vs income",m:"Application allowed ("+RS(C.totalApplied)+
      ") exceeds the income base ("+RS(C.incomeBase)+") — check Schedule A / the income schedules.",sec:"app"});
  if(X.g && (X.g.rev<0||X.g.cap<0))
    out.push({lvl:"warn",t:"Schedule A · row G",m:"The amount allowed as application (G = D − E + F) is negative — check Parts B, C and E.",sec:"app"});
  if(C.applied>0 && C.incomeBase>0 && C.totalApplied < C.incomeBase*0.85)
    out.push({lvl:"ok",t:"85% application test",m:"Application allowed ("+RS(C.totalApplied)+
      ") is below 85% of the income base ("+RS(C.incomeBase)+"); the shortfall must be accumulated u/s 11(2) or is taxable.",sec:"app"});

  /* Schedule I — each live row needs a valid year, amount and purpose */
  (S.app.iRows||[]).forEach((r,i)=>{ if(!_iLive(r))return;
    if(!_inSet(APP_IYEAR,r.year))
      out.push({lvl:"err",t:"Schedule I · row "+(i+1),m:"Choose the year of accumulation.",sec:"app"});
    if(!st0(r.purpose))
      out.push({lvl:"warn",t:"Schedule I · row "+(i+1),m:"State the purpose of accumulation (exported as \"NA\" otherwise).",sec:"app"});
  });
  if((C.iTot||{}).deemed>0)
    out.push({lvl:"ok",t:"Deemed income u/s 11(3)",m:RS(C.deemed11_3)+" is deemed to be income u/s 11(3) and is carried to Part B-TI.",sec:"app"});

  /* Schedule D — reason description required when reason is "Any other" */
  (S.app.dRows||[]).forEach((r,i)=>{ if(!_dLive(r))return;
    if(!_inSet(APP_DYEAR,r.year))
      out.push({lvl:"err",t:"Schedule D · row "+(i+1),m:"Choose the year in which income is deemed applied.",sec:"app"});
    if(_inSet(APP_DREASON,r.reason)==="2" && !st0(r.reasonDesc))
      out.push({lvl:"err",t:"Schedule D · row "+(i+1),m:"Give the reason description when the reason of deeming is \"Any other reason\".",sec:"app"});
  });
  if((C.dTot||{}).notApplied>0)
    out.push({lvl:"ok",t:"Deemed income u/s 11(1B)",m:RS(C.deemed11_1B)+" could not be applied and is deemed to be income u/s 11(1B), carried to Part B-TI.",sec:"app"});

  /* Schedule IA / DA reconciliation notes */
  if(C.iaGrand>0 && (C.iTot||{}).txd>0 && Math.abs(C.iaGrand-(C.iTot||{}).txd)>1)
    out.push({lvl:"warn",t:"Schedule IA reconciliation",m:"Schedule IA grand total ("+RS(C.iaGrand)+
      ") does not tie to Schedule I col 6 (amount taxed in earlier AYs, "+RS((C.iTot||{}).txd)+").",sec:"app"});
  if(C.daGrand>0 && (C.dTot||{}).txd>0 && Math.abs(C.daGrand-(C.dTot||{}).txd)>1)
    out.push({lvl:"warn",t:"Schedule DA reconciliation",m:"Schedule DA grand total ("+RS(C.daGrand)+
      ") does not tie to Schedule D col 5 (amount taxed in earlier AYs, "+RS((C.dTot||{}).txd)+").",sec:"app"});

  if(C.applied>0 && !out.some(o=>o.lvl==="err"))
    out.push({lvl:"ok",t:"Application allowed",m:"Schedule A allows "+RS(C.applied)+" as application of income.",sec:"app"});
  return out;
}

/* ---- engine — this section carries NO income; roll-up contribution = 0 --- */
function engBank(){
  const B={income:0};                                 /* Bank/Verification add nothing to GTI */
  const valid=(S.bank||[]).filter(b=>IFSC_RE.test(st0(b.ifsc).toUpperCase())&&st0(b.acno)&&st0(b.bank));
  B.nAcc     = valid.length;
  B.hasRefund= (S.bank||[]).some(b=>b.refund==="Y");
  B.bankFlag = (S.ver||{}).bankFlag==="N"?"N":"Y";
  B.assetOut = (S.ver||{}).assetOut==="YES"?"YES":"NO";
  S.C.bank   = B;
}

/* ---- renderer ------------------------------------------------------- */
function secBank(){
  let h="";
  const V=S.ver||{};

  /* --- do you hold a bank account in India (BankDtlsFlag, row 282) --- */
  h+=sub("Bank accounts");
  h+=row("Do you have a bank account in India?",sel("ver.bankFlag",BFLAG7,{blank:false}),
    {req:1,ref:"row 282"});
  h+=row("Number of accounts held at any time during the year",inp("ver.nacc",{n:1}),
    {hint:"dormant accounts excluded"});
  h+=note("All bank accounts held at any time in the year must be reported, except a dormant one. "+
    "Tick at least one account for the refund to be credited to it. A non-resident claiming a refund "+
    "with no bank account in India may instead furnish one foreign account below.");

  /* --- India accounts (AddtnlBankDetails[], live table at rows 288-293) --- */
  if(V.bankFlag!=="N"){
    h+=grid("bank",[{k:"ifsc",h:"IFS code of the bank",t:"txt",w:"150px",max:11,req:1},
      {k:"bank",h:"Name of the bank",t:"txt",w:"auto",max:125,req:1},
      {k:"acno",h:"Account number",t:"txt",w:"200px",max:20,req:1},
      {k:"type",h:"Type of account",t:"sel",w:"220px",req:1,opts:ACCT7},
      {k:"refund",h:"Select for refund credit",t:"chk",w:"140px"}],
      S.bank,{min:"1020px",empty:"No account given — a refund cannot be credited.",add:"Add an account"});
    h+=note("The IFS code is eleven characters: four letters, then a zero, then six letters or digits (rule A386).");
  } else {
    h+=note("You have answered that there is no bank account in India. A non-resident may instead give a foreign account below.","warn");
  }

  /* --- foreign account (non-residents' option, rows 295-297) --- */
  h+=note("A non-resident may, at its option, furnish the details of one foreign bank account for the refund.");
  h+=grid("fbank",[{k:"swift",h:"SWIFT code",t:"txt",w:"180px",max:30,req:1},
    {k:"bank",h:"Name of the bank",t:"txt",w:"auto",max:125,req:1},
    {k:"country",h:"Country of location",t:"sel",w:"260px",req:1,opts:COUNTRY7},
    {k:"iban",h:"IBAN",t:"txt",w:"280px",max:40,req:1}],
    S.fbank,{min:"980px",empty:"No foreign account.",add:"Add a foreign account"});

  /* --- the refund figure (computed by the tax section, shown read-only) --- */
  h+=row("Refund due (computed on the Part B-TTI / tax screen)",cell((S.C.int||{}).refund),
    {ref:"item 11",hint:"credited to the ticked account above"});

  /* --- foreign-asset question (AssetOutsideIndiaFlg, row 300) --- */
  h+=row("Do you at any time during the previous year hold, as beneficial owner, beneficiary or "+
    "otherwise, any asset (including financial interest in any entity) located outside India, "+
    "or have signing authority in any account located outside India, or have income from any "+
    "source outside India?",sel("ver.assetOut",ASSETOUT7,{blank:false}),{req:1,ref:"row 300"});
  h+=note("Yes makes Schedule FA mandatory (rule A638).");

  /* --- Verification (Verification sheet rows 4-9) --- */
  h+=sub("Verification");
  h+=note("<b>I,</b> the person named below, <b>solemnly declare</b> that to the best of my knowledge "+
    "and belief the information given in this return and the schedules thereto is correct and complete "+
    "and is in accordance with the provisions of the Income-tax Act, 1961; and that I am making this "+
    "return in my capacity and am also competent to make this return and verify it.");
  h+=row("I, (full name in block letters)",inp("ver.name",{max:125}),{req:1,ref:"C4"});
  h+=row("son / daughter of",inp("ver.father",{max:125}),{req:1,ref:"G4"});
  h+=row("making this return in my capacity as",sel("ver.cap",VCAP7,{blank:false}),{req:1,ref:"C6"});
  h+=row("I am holding permanent account number (PAN)",inp("ver.pan",{max:10}),{req:1,ref:"C7"});
  h+=row("Place",inp("ver.place",{max:50}),{req:1,ref:"G9"});
  h+=row("Date",dte("ver.date"),{req:1,ref:"C9",hint:"date of signing; exported as YYYY-MM-DD"});
  h+=note("The submission date is the e-Filing portal's own system date; this is the date of signing. "+
    "The return must be verified in the mode prescribed under Rule 12 / 12AC at submission (rule A54).");
  if(V.cap==="RE")
    h+=note("Capacity is <b>Representative Assessee</b>: the name, email and contact number of the "+
      "representative assessee, and the Secondary Address in Part A-General, become mandatory (rules A62 / A63).","warn");

  return h;
}

/* ---- export --------------------------------------------------------- */
function expBank(j){
  const V=S.ver||{};
  /* the flag as the user answered it (row 282) */
  const flag=V.bankFlag==="N"?"N":"Y";
  put(j,"PartB_TTI.Refund.BankAccountDtls.BankDtlsFlag",flag);

  /* India accounts -> AddtnlBankDetails[] (only complete rows) */
  const bk=(S.bank||[]).filter(b=>IFSC_RE.test(st0(b.ifsc).toUpperCase())&&st0(b.acno)&&st0(b.bank));
  if(bk.length){
    j.PartB_TTI.Refund.BankAccountDtls.AddtnlBankDetails=bk.map(b=>({
      IFSCCode:st0(b.ifsc).toUpperCase(),
      BankName:st0(b.bank).slice(0,125),
      BankAccountNo:st0(b.acno).slice(0,20),
      AccountType:ACCT7.some(a=>a[0]===b.type)?b.type:"SB",
      UseForRefund:b.refund==="Y"?"true":"false"}));
  }

  /* foreign account -> ForeignBankDetails[] (non-resident option) */
  const fb=(S.fbank||[]).filter(b=>st0(b.swift)&&st0(b.bank)&&st0(b.iban)&&st0(b.country));
  if(fb.length){
    j.PartB_TTI.Refund.BankAccountDtls.ForeignBankDetails=fb.map(b=>({
      SWIFTCode:st0(b.swift).slice(0,30),
      BankName:st0(b.bank).slice(0,125),
      CountryCode:COUNTRY7.some(c=>c[0]===st0(b.country))?st0(b.country):st0(b.country).slice(0,6),
      IBAN:st0(b.iban).slice(0,40)}));
  }

  /* foreign-asset flag (row 300) */
  put(j,"PartB_TTI.AssetOutsideIndiaFlg",V.assetOut==="YES"?"YES":"NO");

  /* Verification — Date and Place at the TOP LEVEL; the rest under Declaration.
     All six leaves required, always present. */
  put(j,"Verification.Date",ISO(V.date)||ISO(_verToday7()));
  put(j,"Verification.Place",(sv(V.place)||"NA").slice(0,50));
  put(j,"Verification.Declaration.AssesseeVerName",(sv(V.name)||"NA").slice(0,125));
  put(j,"Verification.Declaration.FatherName",(sv(V.father)||"NA").slice(0,125));
  put(j,"Verification.Declaration.AssesseeVerPAN",(sv(st0(V.pan).toUpperCase())||"NA"));
  put(j,"Verification.Declaration.Capacity",VCAP7.some(c=>c[0]===V.cap)?V.cap:"MD");
  /* RefundDue / NetTaxPyblOn115TDInc and the tax-computation subtree are
     computed and exported by the tax section (compute order 90) — not here. */
}

/* ---- import (inverse) ---------------------------------------------- */
function impBank(I){
  const read=[]; const g=(o,p)=>p.split(".").reduce((t,k)=>t==null?undefined:t[k],o);
  const flag=g(I,"PartB_TTI.Refund.BankAccountDtls.BankDtlsFlag");
  if(flag==="Y"||flag==="N"){S.ver=S.ver||{};S.ver.bankFlag=flag;}
  const bk=g(I,"PartB_TTI.Refund.BankAccountDtls.AddtnlBankDetails")||[];
  if(Array.isArray(bk)&&bk.length){
    S.bank=bk.map(b=>({ifsc:b.IFSCCode||"",bank:b.BankName||"",acno:b.BankAccountNo||"",
      type:ACCT7.some(a=>a[0]===b.AccountType)?b.AccountType:"SB",
      refund:b.UseForRefund==="true"?"Y":"N"}));
    read.push("bank accounts");
  }
  const fb=g(I,"PartB_TTI.Refund.BankAccountDtls.ForeignBankDetails")||[];
  if(Array.isArray(fb)&&fb.length){
    S.fbank=fb.map(b=>({swift:b.SWIFTCode||"",bank:b.BankName||"",
      country:b.CountryCode||"",iban:b.IBAN||""}));
    read.push("foreign bank accounts");
  }
  const ao=g(I,"PartB_TTI.AssetOutsideIndiaFlg");
  if(ao==="YES"||ao==="NO"){S.ver=S.ver||{};S.ver.assetOut=ao;read.push("foreign-asset flag");}
  const Vb=I&&I.Verification;
  if(Vb){
    S.ver=S.ver||{};
    if(Vb.Place)S.ver.place=Vb.Place;
    if(Vb.Date)S.ver.date=dmy(Vb.Date)||S.ver.date;
    const D=Vb.Declaration||{};
    S.ver.name  = D.AssesseeVerName||S.ver.name||"";
    S.ver.father= D.FatherName||S.ver.father||"";
    S.ver.pan   = D.AssesseeVerPAN||S.ver.pan||"";
    S.ver.cap   = VCAP7.some(c=>c[0]===D.Capacity)?D.Capacity:(S.ver.cap||"MD");
    read.push("verification");
  }
  return read;
}

/* ---- checks (the section's own screen validations; not the dept rules) --- */
function chkBank(){
  const out=[]; engBank();
  const V=S.ver||{};
  const flagN=V.bankFlag==="N";

  /* --- India accounts --- */
  if(!flagN){
    if(!(S.bank||[]).length)
      out.push({lvl:"err",t:"Bank account",m:"At least one bank account in India is needed for the refund.",sec:"bank"});
    else if(!S.bank.some(b=>b.refund==="Y"))
      out.push({lvl:"err",t:"Refund account",m:"Tick at least one account to receive the refund.",sec:"bank"});
    (S.bank||[]).forEach((b,i)=>{
      if(st0(b.ifsc)&&!IFSC_RE.test(st0(b.ifsc).toUpperCase()))
        out.push({lvl:"err",t:"Bank row "+(i+1),m:"The IFS code is four letters, a zero, then six letters or digits (rule A386).",sec:"bank"});
      if(!st0(b.ifsc))out.push({lvl:"err",t:"Bank row "+(i+1),m:"The IFS code is required.",sec:"bank"});
      if(!st0(b.bank))out.push({lvl:"err",t:"Bank row "+(i+1),m:"The name of the bank is required.",sec:"bank"});
      if(!st0(b.acno))out.push({lvl:"err",t:"Bank row "+(i+1),m:"The account number is required.",sec:"bank"});
      if(!ACCT7.some(a=>a[0]===b.type))out.push({lvl:"err",t:"Bank row "+(i+1),m:"Select the type of account.",sec:"bank"});
    });
  } else if((S.bank||[]).some(b=>st0(b.ifsc)||st0(b.acno)||st0(b.bank))){
    out.push({lvl:"warn",t:"Bank account",m:"You answered that there is no bank account in India, but account rows are filled — they will not be exported.",sec:"bank"});
  }

  /* --- foreign accounts (validate any row that is started) --- */
  (S.fbank||[]).forEach((b,i)=>{
    if(!(st0(b.swift)||st0(b.bank)||st0(b.country)||st0(b.iban)))return;
    if(!st0(b.swift))out.push({lvl:"err",t:"Foreign account "+(i+1),m:"The SWIFT code is required.",sec:"bank"});
    if(!st0(b.bank)) out.push({lvl:"err",t:"Foreign account "+(i+1),m:"The name of the bank is required.",sec:"bank"});
    if(!COUNTRY7.some(c=>c[0]===st0(b.country)))out.push({lvl:"err",t:"Foreign account "+(i+1),m:"Select the country of location.",sec:"bank"});
    if(!st0(b.iban)) out.push({lvl:"err",t:"Foreign account "+(i+1),m:"The IBAN is required.",sec:"bank"});
  });

  /* --- foreign-asset flag vs Schedule FA (rule A638) --- */
  if(V.assetOut==="YES" && !((S.C.fa||{}).hasFA))
    out.push({lvl:"warn",t:"Schedule FA (A638)",m:"You answered that an asset is held outside India, so Schedule FA must be filled.",sec:"bank"});
  if(V.assetOut!=="YES" && ((S.C.fa||{}).hasFA))
    out.push({lvl:"warn",t:"Foreign-asset flag",m:"Schedule FA has entries but the foreign-asset question is answered No — reconcile the two.",sec:"bank"});

  /* --- verification (C4/G4/C6/C7/G9/C9) --- */
  if(!st0(V.name))
    out.push({lvl:"err",t:"Verification",m:"The full name of the person verifying the return is required.",sec:"bank"});
  if(!st0(V.father))
    out.push({lvl:"err",t:"Father's name",m:"The schema makes the father's name compulsory.",sec:"bank"});
  if(!PAN_RE.test(st0(V.pan).toUpperCase()))
    out.push({lvl:"err",t:"Verifier's PAN",m:"A valid ten-character PAN of the person verifying is required.",sec:"bank"});
  if(!VCAP7.some(c=>c[0]===V.cap))
    out.push({lvl:"err",t:"Capacity",m:"Select the capacity in which the return is made.",sec:"bank"});
  if(!st0(V.place))
    out.push({lvl:"err",t:"Place",m:"The place of signing is required in the verification.",sec:"bank"});
  if(!ISO(V.date))
    out.push({lvl:"err",t:"Date",m:"The date of signing is required, as "+DF+".",sec:"bank"});

  /* --- Representative-assessee rule from the book (A62 / A63) --- */
  if(V.cap==="RE"){
    if(((S.who||{}).repFlg)!=="Y")
      out.push({lvl:"warn",t:"Representative Assessee (A62 / A63)",m:"Capacity is Representative Assessee, so the representative's name, email and contact number, and the Secondary Address in Part A-General, must be given.",sec:"bank"});
  }

  if(!out.length)
    out.push({lvl:"ok",t:"Bank and verification",m:"Verified by "+st0(V.name)+" as "+
      ((VCAP7.find(c=>c[0]===V.cap)||["","Managing Director"])[1])+"; every check passes.",sec:"bank"});
  return out;
}

reg({id:"bank", t:"Bank & verification", ref:"Verification", f:secBank,

   shows read-only:
     · PP  TotVCReceived = b + d   (upto-20000 band + above-20000 band)
     · ET  iii = i + ii; vi = iv + v(capped); vii = ii when iv >= 95% of iii;

/* ---- row coercion (state row <-> schema row) ---------------------- */
function bodRowOut(r,cols){

  cols.forEach(c=>{ const raw=r[c.k], s=st0(raw); let v;
    if(c.t==="num")       v=(s==="")?undefined:n0(raw);
    else if(c.t==="date") v=ISO(raw);
    else if(c.t==="pan")  v=s?s.toUpperCase():undefined;
    else                  v=(s==="")?undefined:s.slice(0,c.max||125);
    if(v!==undefined){ o[c.k]=v; any=true; }});
  return any?o:null;
}
function bodRowIn(sr,cols){
  sr=sr||{}; const o={};
  cols.forEach(c=>{ const v=sr[c.k];
    if(v===undefined||v===null||v==="") return;
    o[c.k]=(c.t==="date")?dmy(v):v; });
  return o;
}

/* ---- helpers -------------------------------------------------------- */
const bodYN=v=>st0(v)==="Y"?"Y":"N";                   /* default No */
const bodCount=()=>BOD_SH_KEYS.reduce((a,k)=>a+(get(BOD_SH[k].path)||[]).length,0);

/* ---- engine — no GTI contribution; publishes derived rows only ----- */
function engBodies(){
  bodiesInit();
  const B=S.bodies, C={income:0};
  C.ppOn=bodYN((B.pp||{}).on); C.etOn=bodYN((B.et||{}).on); C.shOn=bodYN((B.sh||{}).on);
  /* PP: TotVCReceived = b (<=20000) + d (>20000) */
  const p=B.pp||{};
  C.pp={ totVC: n0(N(p.vcUpto20000)+N(p.vcMore20000)) };
  /* ET: the read-only arithmetic and the 5%/Rs.5,00,000 admin cap */
  const e=B.et||{};
  const opBal=N(e.opBal), vcYr=N(e.vcYr), amtDist=N(e.amtDist), amtAdmin=N(e.amtAdmin);
  const totAfter=opBal+vcYr;
  const adminCap=Math.min(vcYr*0.05, BOD_ADMIN_MAX);
  const adminPermitted=Math.min(amtAdmin, adminCap);
  const total=amtDist+adminPermitted;
  const exe13B=(totAfter>0 && amtDist>=0.95*totAfter)?vcYr:0;   /* eligible u/s 13B (row ii) when >=95% distributed */
  C.et={ totAfter:n0(totAfter), adminCap:n0(adminCap), adminPermitted:n0(adminPermitted),
         total:n0(total), exe13B:n0(exe13B), closeBal:n0(totAfter-total),
         adminOver: amtAdmin>adminCap+0.5 };
  C.rows=bodCount();
  S.C.bodies=C;
}

/* ---- renderer ------------------------------------------------------- */
function bodGcols(cols){
  return cols.map(c=>{
    const t=c.t==="date"?"date":(c.t==="sel"?"sel":(c.t==="num"?"num":"txt"));
    const g={h:c.h,k:c.k,t:t};
    if(c.opts)g.opts=c.opts; if(c.req)g.req=1; if(c.max)g.max=c.max;
    return g;});
}
function bodGrid(def){
  return grid(def.path,bodGcols(def.cols),get(def.path)||[],
    {min:(def.cols.length*150+90)+"px", empty:"No rows yet — click Add a row.", add:"Add a row"});
}
