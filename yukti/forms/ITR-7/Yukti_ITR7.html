  O.giftImmovInadeq = nz(io.Immovpropinadeqcons562x); O.giftOthWo = nz(io.Anyotherpropwithoutcons562x);
  O.giftOthInadeq = nz(io.Anyotherpropinadeqcons562x);
  O.disallow10 = nz(io.IncDisallwnExmpUs10);
  O.sum562xii = nz(io.SumRecdPrYrBusTRU562xii);
  O.win115BB = nz(io.LtryPzzlChrgblUs115BB); O.win115BBJ = nz(io.IncChrgblUs115BBJ);
  O.cc68 = nz(io.CashCreditsUs68); O.ui69 = nz(io.UnExplndInvstmntsUs69); O.um69a = nz(io.UnExplndMoneyUs69A);
  O.udi69b = nz(io.UnDsclsdInvstmntsUs69B); O.ue69c = nz(io.UnExplndExpndtrUs69C); O.hundi69d = nz(io.AmtBrwdRepaidOnHundiUs69D);
  O.notDed58 = nz(io.AmtNotDeductibleUs58); O.profit59 = nz(io.ProfitChargTaxUs59);

  const dd = io.Deductions||{};

  O.pti = (io.PTIOthersGrossDtls||[]).map(r=>({code:r.SourceDescription||"", amt:nz(r.SourceAmount)}));
  O.dtaa = ((((io.IncChargblSplRateOS||{}).NRIOsDTAA||{}).NRIDTAADtlsSchOS)||[]).map(r=>({
    amt:nz(r.DTAAamt), nature:r.NatureOfIncome||"", cc:r.CountryCodeExcludingIndia||"",
    article:r.DTAAarticle||"", treaty:r.RateAsPerTreaty!=null?String(r.RateAsPerTreaty):"",
    trc:r.TaxRescertifiedFlag||"", sec:r.ItemNoincl||"",
    itact:r.RateAsPerITAct!=null?String(r.RateAsPerITAct):""}));

  const rh = OS.IncFromOwnHorse||{};

              notDed58:nz(rh.AmtNotDeductibleUs58), profit59:nz(rh.ProfitChargTaxUs59) };

  O.q = O.q || {};

    if(dr){ O.q[qr.k] = O.q[qr.k]||{}; OS7_QP.forEach(pk=>{ O.q[qr.k][pk] = nz(dr[pk]); }); }
  });

  read.push("Schedule OS");
  return read;
}

/* ---- checks ------------------------------------------------------ */
function chkOs(){
  const out = [], C = S.C.os||{}, O = S.os||{};
  const D = C.ded||{};

  /* 3b depreciation only if rental income (1c) is offered */
  if(R(O.dDep)>0 && !(C.c1>0))
    out.push({lvl:"err", t:"Section 57 · depreciation", m:"Depreciation (3b) can be claimed only when rental income from machinery/plant/buildings is offered at 1c.", sec:"os"});
  else if(R(O.dDep)>0 && R(O.dDep)>C.c1)
    out.push({lvl:"warn", t:"Section 57 · depreciation", m:"Depreciation (3b) is restricted to the 1c rental income of "+RS(C.c1)+"; only that much is allowed.", sec:"os"});

  /* 3c interest expenditure — only against dividend at 1a(i)/1a(ii), and ≤ 20% of it */
  const divForInt = (C.a1||{}).i + (C.a1||{}).ii;
  if(R(O.dIntClaimed)>0 && !(divForInt>0))
    out.push({lvl:"err", t:"Section 57 · interest expenditure", m:"Interest expenditure u/s 57(1) (3c) is available only when dividend income is offered at 1a(i) and/or 1a(ii).", sec:"os"});
  else if(R(O.dIntClaimed) > (D.eligInt||0))
    out.push({lvl:"warn", t:"Section 57 · interest expenditure", m:"Interest expenditure u/s 57(1) is restricted to 20% of the dividend at 1a(i)+1a(ii); only "+RS(D.eligInt||0)+" of "+RS(R(O.dIntClaimed))+" claimed is eligible.", sec:"os"});

  /* 2e DTAA — NRI/TRC gate and applicable-rate note */
  (C.dtaaRows||[]).forEach((r,i)=>{
    if(os7_isNRI() && r.amt>0 && r.trc!=="Y")
      out.push({lvl:"warn", t:"DTAA row "+(i+1), m:"You are a non-resident and no TRC is obtained for this row, so its "+RS(r.amt)+" is not counted in the 2e DTAA total.", sec:"os"});
  });
  /* 2e is a non-resident-only table */
  if((C.dtaaRows||[]).some(r=>r.amt>0) && !os7_isNRI())
    out.push({lvl:"warn", t:"DTAA table", m:"The 2e DTAA table is applicable for non-residents only; the residential status in Part A-General is Resident.", sec:"os"});

  /* per-item DTAA caps: 1a(i), 1b, 1c, 1d, 2a(i), 2a(ii), 2c, 2d */
  const capMap = [
    {nat:"1ai",  lim:(C.a1||{}).i, l:"1a(i) dividend"},
    {nat:"1b",   lim:(C.b1||{}).tot, l:"1b interest"},
    {nat:"1c",   lim:C.c1, l:"1c rental"},
    {nat:"1d",   lim:(C.d1||{}).tot, l:"1d 56(2)(x)"},
    {nat:"2ai",  lim:C.s2ai, l:"2a(i) 115BB"},
    {nat:"2aii", lim:C.s2aii, l:"2a(ii) 115BBJ"},
    {nat:"2c",   lim:C.d2c, l:"2c other special-rate"},
    {nat:"2d",   lim:C.d2d, l:"2d PTI special-rate"}
  ];
  capMap.forEach(cm=>{
    const sum = (C.dtaaRows||[]).filter(r=>r.counts && r.nature===cm.nat).reduce((s,r)=>s+r.amt,0);
    if(sum>R(cm.lim))
      out.push({lvl:"err", t:"DTAA vs "+cm.l, m:"The 2e DTAA amounts against "+cm.l+" ("+RS(sum)+") exceed that item's own figure "+RS(cm.lim)+".", sec:"os"});
  });

  /* item-1 gift 56(2)(x) floored at nil */
  const d1=C.d1||{};
  if((d1.i+d1.ii+d1.iii+d1.iv+d1.v)<0)
    out.push({lvl:"warn", t:"Section 56(2)(x)", m:"The 56(2)(x) sub-lines sum below nil; item 1d is taken as nil.", sec:"os"});

  /* race-horse loss goes to CFL */
  if(R((C.horse||{}).bal)<0)
    out.push({lvl:"ok", t:"Race horses", m:"The race-horse balance (8e) is a loss of "+RS((C.horse||{}).bal)+"; it is carried to Schedule CFL and taken as nil at item 9.", sec:"os"});

  /* item-6 loss to CYLA */
  if(R(C.item6)<0)
    out.push({lvl:"ok", t:"Other sources loss", m:"Net income at normal rates (item 6) is a loss of "+RS(C.item6)+"; it is available for set-off in Schedule CYLA.", sec:"os"});

  return out;
}

/* =====================================================================
   ITR-7 · A.Y. 2026-27 — Section "paid" · Tax payments
   Books: books/ITR-7/IT.md  (Schedule IT · 15A, advance / self-assessment
   challans), books/ITR-7/TDS.md (the two other-than-salary TDS tables) and
   books/ITR-7/TCS.md (Schedule TCS · 18C1).

   THE SHEET-NAME ↔ SCHEMA-BLOCK OFFSET (books/ITR-7/TDS.md §0):
     sheet "Schedule TDS1" (15B1, Form 16A, deductor by TAN)   → ScheduleTDS2
                                                                 (TDSOthThanSalaryDtls[])
     sheet "Schedule TDS2" (15B2, Form 16B/C/D/E, buyer PAN)    → ScheduleTDS3
                                                                 (TDS3onOthThanSalDtls[])
     sheet "Schedule TCS"  (18C1, Form 27D)                     → ScheduleTCS
                                                                 (TCSDetails[])
   A TRUST / INSTITUTION HAS NO SALARY TDS — there is NO ScheduleTDS1 block
   (that is the salary Form-16 table, absent on ITR-7).

   Schema blocks written here: ScheduleTDS2, ScheduleTDS3, ScheduleTCS,
   ScheduleIT.  Part B-TTI is a RESULT block owned by the `tax` section; this
   section PUBLISHES the taxes-paid totals as cross-section scalars the tax
   section reads into Part B-TTI 9a/9b/9c/9d/9e (ITR-7 numbering — not ITR-6's
   10a-e).  No duplicate writer: only `tax` writes Part B-TTI.  corder 92
   (after the income heads and Part B roll-up feed the liability).

   Published scalars for the tax section (all rounded whole rupees):
     adv → 9a (Advance Tax)       tds → 9b (TDS, both tables col 9)
     tcs → 9c (TCS col 7(i))      sat → 9d (Self-Assessment)
     paid → 9e (Total taxes paid = 9a+9b+9c+9d).
   Also published: t2/t3 (per-TDS-table col-9 totals), itTotal (Σ challan
   amounts), challans[] (each {amt,dt,sat,valid} for the 234A/234C interest
   engine) and income:0 (taxes paid add nothing to Gross Total Income).
   ===================================================================== */

/* Financial-year dropdown — all three tables (books/ITR-7/TDS.md §6.4 and
   TCS.md §4.2: 2024 … 2008). Schema DeductedYr / TDSFinYr files the integer
   starting year; the option value is the year string "2024", text "2024-25". */
const DEDYR=["2024","2023","2022","2021","2020","2019","2018","2017","2016","2015","2014","2013","2012","2011","2010","2009","2008"];
const DEDYR_OPTS=DEDYR.map(y=>[y,y+"-"+String((+y+1)%100).padStart(2,"0")]);

/* Head of income — TRUST-specific (books/ITR-7/TDS.md §6.2 / §6.3). Includes
   the exemption schedules (AI, IE-1..IE-4, VC) as well as the four heads.
   Sheet "Schedule TDS1" (schema TDS2) also carries "Not applicable" (194N);
   sheet "Schedule TDS2" (schema TDS3) drops it. Schema HeadOfIncome enum:
   TDS2 = HP/BP/CG/OS/AI/IE1..IE4/VC/NA ; TDS3 = the same without NA. */
const TDS2_HEADS=[
  ["AI","Schedule AI"],["IE1","Schedule IE-1"],["IE2","Schedule IE-2"],
  ["IE3","Schedule IE-3"],["IE4","Schedule IE-4"],["VC","Schedule VC"],
  ["HP","Income from House Property"],["BP","Income from Business & Profession"],
  ["CG","Income from Capital Gains"],["OS","Income from Other Sources"],
  ["NA","Not applicable (only in case TDS is deducted u/s 194N)"]];
const TDS3_HEADS=TDS2_HEADS.filter(x=>x[0]!=="NA");

/* head-of-income pre-fill from the section (a convenience default; editable;
   not a tax figure). Keyed by schema TDSSection code. Everything not listed
   defaults to Other Sources (interest / dividend / units — the trust's usual
   TDS). No 194T on ITR-7. */
const TDS_HEAD_OF={
  "94C":"BP","94D":"BP","4H":"BP","94J-A":"BP","94J-B":"BP","94M":"BP","94O":"BP",
  "94Q":"BP","94R":"BP","94R-P":"BP","4IC":"BP","94E":"BP",
  "4-IA":"HP","4-IB":"HP","4IB":"HP",
  "4IA":"CG","94S":"CG","94S-P":"CG","4LA":"CG",
  "94N":"NA","94N-F":"NA","94N-C":"NA","94N-FT":"NA"};

/* ---- engine ------------------------------------------------------- */
function engPaid(){
  const P={income:0};

  /* TDS credit tables (schema TDS2 / TDS3) — per-row carried forward
     (rule A654: col 13 = col 6 + 7 + 8(ii) − 9 − 10):
       cf = MAX(0, bf + dedOwn + dedOthTds − claimOwn − claimOthTds) */
  const rowCF=rows=>(rows||[]).forEach(r=>{
    const avail=N(r.bf)+N(r.dedOwn)+N(r.dedOthTds);
    const claimed=N(r.claimOwn)+N(r.claimOthTds);
    r._avail=avail; r._claimed=claimed; r._cf=Math.max(0,avail-claimed); r._over=claimed>avail;});
  rowCF(S.paid.tds2); rowCF(S.paid.tds3);
  const t2=(S.paid.tds2||[]).reduce((a,r)=>a+N(r.claimOwn),0); /* Σ col 9 own hands */
  const t3=(S.paid.tds3||[]).reduce((a,r)=>a+N(r.claimOwn),0); /* Σ col 9 own hands */

  /* Schedule TCS (18C1) — per-row carried forward (rule A661:
       col 8 = col 5 + col 6 − col 7):
       cf = MAX(0, bf + collOwn + collOth − claimOwn − claimOth) */
  (S.paid.tcs||[]).forEach(r=>{
    const avail=N(r.bf)+N(r.collOwn)+N(r.collOth);
    const claimed=N(r.claimOwn)+N(r.claimOth);
    r._avail=avail; r._claimed=claimed; r._cf=Math.max(0,avail-claimed); r._over=claimed>avail;});
  const tcs=(S.paid.tcs||[]).reduce((a,r)=>a+N(r.claimOwn),0); /* Σ col 7(i) own hands */

  /* Schedule IT (15A) — advance vs self-assessment split by deposit date
     (books/ITR-7/IT.md §3; rules A631 / A632): a challan dated on or before
     31 Mar 2026 (YREND) is advance tax (→ 9a); on or after 1 Apr 2026 is
     self-assessment tax (→ 9d). No dropdown — the date decides. */
  const isSAT=c=>{const d=D(c.dt);return d?d>YREND:false;};
  const challans=(S.paid.it||[]).map(c=>({amt:R(N(c.amt)),dt:c.dt,sat:isSAT(c),valid:!!D(c.dt)}));
  const adv=challans.filter(c=>!c.sat).reduce((a,c)=>a+c.amt,0);
  const sat=challans.filter(c=> c.sat).reduce((a,c)=>a+c.amt,0);

  P.t2=R(t2); P.t3=R(t3);
  P.tds=R(t2+t3);                    /* 9b = TDS1 col 9 + TDS2 col 9 (rule A633) */
  P.tcs=R(tcs);                      /* 9c = TCS col 7(i)          (rule A634) */
  P.adv=R(adv); P.sat=R(sat); P.itTotal=R(adv+sat); /* TotalTaxPayments = Σ Amt */
  P.paid=R(adv+t2+t3+tcs+sat);       /* 9e = 9a + 9b + 9c + 9d (rule A628) */
  P.challans=challans;
  P.income=0;                        /* taxes paid contribute nothing to GTI */
  S.C.paid=P;
}

/* ---- renderer ----------------------------------------------------- */
/* the 13-column credit table shared by sheet "Schedule TDS1" (deductor by TAN
   → schema TDS2) and "Schedule TDS2" (buyer/tenant by PAN → schema TDS3).

function _tdsCols(buyer){return [

         :{k:"tan",h:"TAN of the deductor",t:"txt",w:"130px",max:10,req:1},

    {k:"dedOthTds",h:"— TDS",t:"num",w:"100px"},
    {k:"claimOwn",h:"Claimed this year — own hands",t:"num",w:"130px",req:1},
    {k:"claimOthInc",h:"Claimed in other's hands — income",t:"num",w:"140px"},
    {k:"claimOthTds",h:"— TDS",t:"num",w:"100px"},
    {k:"claimOthPan",h:"— PAN",t:"txt",w:"110px",max:10},
    {k:"claimOthAadh",h:"— Aadhaar",t:"txt",w:"120px",max:12},
    {k:"gross",h:"Corresponding gross amount offered",t:"num",w:"140px"},
    {k:"head",h:"Head of income",t:"sel",w:"220px",opts:buyer?TDS3_HEADS:TDS2_HEADS},
    {k:"cf",h:"TDS credit carried forward",t:"calc",w:"130px",f:r=>r._cf||0}];}

function secPaid(){
  const P=S.C.paid||{}; let h="";
  h+=formNote("A trust or institution has no salary TDS — there is no Form 16 / TDS-1 table. Check every figure against <b>Form 26AS</b> and the AIS/TIS. The head of income here carries the trust exemption schedules (AI, IE-1…IE-4, VC) as well as the four heads; where possible it is pre-filled from the section — please verify it.");

  /* Schedule TDS1 · 15B1 (Form 16A) → schema ScheduleTDS2 */
  h+='<div class="cgband">Schedule TDS1 · 15B1 — TDS on income other than salary, as per Form 16A (deductor with TAN)</div>';
  h+=note("Carried forward = MAX(0, b/f + deducted − claimed) (rule A654). Credit may be claimed only where the corresponding receipt is offered this year under the head named (rules A649/A652). Credit in another person’s hands is under rule 37BA(2) — give that person’s PAN or Aadhaar (rule A647).");

  /* Schedule TDS2 · 15B2 (Form 16B/16C/16D/16E) → schema ScheduleTDS3 */
  h+='<div class="cgband">Schedule TDS2 · 15B2 — TDS as per Form 16B / 16C / 16D / 16E (buyer / tenant with PAN)</div>';
  h+=note("The deductor here is a <b>buyer, tenant or payer identified by PAN</b> (194IA sale, 194IB rent, 194M, 194S), not a TAN (rule A646/A647).");
  h+=grid("paid.tds3",_tdsCols(true),S.paid.tds3||[],{min:"2650px",empty:"Nothing under these sections.",add:"Add a deduction",
    foot:[{l:1,v:"Claimed in own hands — to 9b of Part B-TTI",span:11},{v:P.t3},{v:""},{v:""},{v:""},{v:""},{v:""},{v:""}]});
  (S.paid.tds3||[]).forEach((r,i)=>{if(r._over)h+=note("Schedule TDS2 row "+(i+1)+": claimed "+RS(r._claimed)+" exceeds the "+RS(r._avail)+" deducted and brought forward.","stop");});

  /* Schedule TCS · 18C1 (Form 27D) → schema ScheduleTCS. Credit-owner S/O. */
  h+='<div class="cgband">Schedule TCS · 18C1 — Tax collected at source, as per Form 27D</div>';
  h+=note("Carried forward = MAX(0, b/f + collected − claimed) (rule A661). Credit in another person’s hands is under rule 37i(1) — give that person’s PAN (rule A658).");
  h+=grid("paid.tcs",[
    {k:"who",h:"TCS credit relating to",t:"sel",w:"120px",req:1,opts:[["S","Self"],["O","Other Person"]]},
    {k:"tan",h:"TAN of the collector",t:"txt",w:"130px",max:10,req:1},
    {k:"othPan",h:"PAN of other person",t:"txt",w:"120px",max:10},
    {k:"yr",h:"FY in which TCS collected",t:"sel",w:"120px",opts:DEDYR_OPTS},
    {k:"bf",h:"Unclaimed TCS b/f",t:"num",w:"110px"},
    {k:"collOwn",h:"Collected this FY — own hands",t:"num",w:"130px"},
    {k:"collOth",h:"Collected in other's hands",t:"num",w:"130px"},
    {k:"claimOwn",h:"Claimed this year — own hands",t:"num",w:"130px",req:1},
    {k:"claimOth",h:"Claimed in other's hands — TCS",t:"num",w:"130px"},
    {k:"claimOthPan",h:"— PAN of other person",t:"txt",w:"120px",max:10},
    {k:"cf",h:"Carried forward",t:"calc",w:"110px",f:r=>r._cf||0}],
    S.paid.tcs||[],{min:"1550px",empty:"Nothing collected.",add:"Add a collection",
      foot:[{l:1,v:"Claimed in own hands (7i) — to 9c of Part B-TTI",span:7},{v:P.tcs},{v:""},{v:""},{v:""}]});
  (S.paid.tcs||[]).forEach((r,i)=>{if(r._over)h+=note("Schedule TCS row "+(i+1)+": claimed "+RS(r._claimed)+" exceeds the "+RS(r._avail)+" collected and brought forward.","stop");});

  /* Schedule IT · 15A — challans; advance/self-assessment split by date */
  h+='<div class="cgband">Schedule IT · 15A — Advance tax and self-assessment tax</div>';
  h+=note("A challan dated <b>on or before 31 March 2026</b> is advance tax (→ 9a of Part B-TTI); one dated <b>on or after 1 April 2026</b> is self-assessment tax (→ 9d). The date also places each advance challan in its 234C instalment. There is no dropdown — the split is by date (rules A631/A632).");
  h+=grid("paid.it",[
    {k:"bsr",h:"BSR code",t:"txt",w:"130px",max:7,req:1},

  /* summary — the five Part B-TTI feeds (ITR-7 numbering) */
  h+=row("9a · Advance tax — challans on or before 31 Mar 2026",cell(P.adv));
  h+=row("9b · TDS — Schedule TDS1 col 9 + Schedule TDS2 col 9",cell(P.tds));
  h+=row("9c · TCS — Schedule TCS col 7(i)",cell(P.tcs));
  h+=row("9d · Self-assessment tax — challans on or after 1 Apr 2026",cell(P.sat));
  h+=row("9e · Total taxes paid (9a + 9b + 9c + 9d)",cell(P.paid),{cls:"grand"});
  return h;
}

/* ---- export ------------------------------------------------------- */
function expPaid(j){
  const P=S.C.paid||{};

  /* the shared TDS credit row (schema TDS2 / TDS3). buyer=true → PAN table. */
  const tdsRow=(r,buyer)=>{
    const o={TDSCreditName:r.who==="O"?"O":"S"};
    if(r.who==="O"){
      if(PAN_RE.test(st0(r.othPan).toUpperCase()))o.PANofOtherPerson=st0(r.othPan).toUpperCase();
      if(AADH.test(st0(r.othAadh)))o.AadhaarOfOtherPerson=st0(r.othAadh);}
    if(buyer){
      o.PANOfBuyerTenant=PAN_RE.test(st0(r.pan).toUpperCase())?st0(r.pan).toUpperCase():"AAAAA0000A";
      if(AADH.test(st0(r.aadh)))o.AadhaarOfBuyerTenant=st0(r.aadh);}
    else o.TANOfDeductor=st0(r.tan).toUpperCase();
    o.TDSSection=TDSSEC_CODES.indexOf(st0(r.sec))>=0?st0(r.sec):"94A";
    if(N(r.bf)&&DEDYR.indexOf(st0(r.yr))>=0){o.DeductedYr=parseInt(r.yr,10);o.BroughtFwdTDSAmt=n0(r.bf);}
    const c={TaxClaimedOwnHands:n0(r.claimOwn)};                 /* required leaf */
    if(N(r.dedOwn))c.TaxDeductedOwnHands=n0(r.dedOwn);
    if(N(r.dedOthInc))c.TaxDeductedIncome=n0(r.dedOthInc);
    if(N(r.dedOthTds))c.TaxDeductedTDS=n0(r.dedOthTds);
    if(N(r.claimOthInc))c.TaxClaimedIncome=n0(r.claimOthInc);
    if(N(r.claimOthTds))c.TaxClaimedTDS=n0(r.claimOthTds);
    if(PAN_RE.test(st0(r.claimOthPan).toUpperCase()))c.TaxClaimedSpouseOthPrsnPAN=st0(r.claimOthPan).toUpperCase();
    if(AADH.test(st0(r.claimOthAadh)))c.SpouseOthPrsnAadhaar=st0(r.claimOthAadh);
    o.TaxDeductCreditDtls=c;
    if(N(r.gross))o.GrossAmount=n0(r.gross);
    const heads=buyer?TDS3_HEADS:TDS2_HEADS;
    let hd=st0(r.head)||TDS_HEAD_OF[r.sec]||"OS";
    if(!heads.some(x=>x[0]===hd))hd="OS";
    o.HeadOfIncome=hd;
    o.AmtCarriedFwd=n0(r._cf||0);                                /* required leaf */
    return o;};

  /* ScheduleTDS2 (sheet "Schedule TDS1", Form 16A) — total present even at zero */
  const t2=(S.paid.tds2||[]).filter(r=>(N(r.claimOwn)||N(r.dedOwn)||N(r.bf))&&TAN_RE.test(st0(r.tan).toUpperCase()));
  j.ScheduleTDS2={TotalTDSonOthThanSals:n0(P.t2)};
  if(t2.length)j.ScheduleTDS2.TDSOthThanSalaryDtls=t2.map(r=>tdsRow(r,false));

  /* ScheduleTDS3 (sheet "Schedule TDS2", Form 16B/C/D/E) — total present even at zero */
  const t3=(S.paid.tds3||[]).filter(r=>N(r.claimOwn)||N(r.dedOwn)||N(r.bf));
  j.ScheduleTDS3={TotalTDS3OnOthThanSal:n0(P.t3)};
  if(t3.length)j.ScheduleTDS3.TDS3onOthThanSalDtls=t3.map(r=>tdsRow(r,true));

  /* ScheduleTCS (sheet "Schedule TCS", Form 27D) — total present even at zero.
     Credit-owner S/O; TAN inside EmployerOrDeductorOrCollectDetl; the current-FY
     and claimed blocks nest own/other hands; the claimed-other-hands is an
     OBJECT {TaxClaimedTCS, PANOfOthrPrsn} (books/ITR-7/TCS.md §2). */
  const tc=(S.paid.tcs||[]).filter(r=>(N(r.claimOwn)||N(r.collOwn)||N(r.bf))&&st0(r.tan));
  j.ScheduleTCS={TotalSchTCS:n0(P.tcs)};
  if(tc.length)j.ScheduleTCS.TCSDetails=tc.map(r=>{
    const det={TCSCreditName:r.who==="O"?"O":"S",TAN:st0(r.tan).toUpperCase()};
    if(r.who==="O"&&PAN_RE.test(st0(r.othPan).toUpperCase()))det.PANofOtherPerson=st0(r.othPan).toUpperCase();
    if(N(r.bf)&&DEDYR.indexOf(st0(r.yr))>=0)det.TDSFinYr=parseInt(r.yr,10);
    const o={EmployerOrDeductorOrCollectDetl:det};
    if(N(r.bf)&&DEDYR.indexOf(st0(r.yr))>=0)o.BroughtFwdTCSAmt=n0(r.bf);
    const cur={TCSAmtCollOwnHands:n0(r.collOwn)};                /* required leaf */
    if(N(r.collOth))cur.TCSAmtCollOthrHands=n0(r.collOth);
    o.TCSCurrFYDtls=cur;
    const cl={TCSAmtCollOwnHands:n0(r.claimOwn)};                /* required leaf */
    if(N(r.claimOth)||PAN_RE.test(st0(r.claimOthPan).toUpperCase())){
      const oth={};
      if(N(r.claimOth))oth.TaxClaimedTCS=n0(r.claimOth);
      if(PAN_RE.test(st0(r.claimOthPan).toUpperCase()))oth.PANOfOthrPrsn=st0(r.claimOthPan).toUpperCase();
      cl.TCSAmtCollOthrHands=oth;}
    o.TCSClaimedThisYearDtls=cl;
    o.AmtCarriedFwd=n0(r._cf||0);                               /* required leaf */
    return o;});

  /* ScheduleIT — TotalTaxPayments present even at zero; DateDep as YYYY-MM-DD */
  const ch=(S.paid.it||[]).filter(c=>N(c.amt)&&BSR.test(st0(c.bsr).toUpperCase())&&ISO(c.dt)&&/^\d{1,14}$/.test(st0(c.sn)));
  j.ScheduleIT={TotalTaxPayments:n0(P.itTotal)};
  if(ch.length)j.ScheduleIT.TaxPayment=ch.map(c=>({BSRCode:st0(c.bsr).toUpperCase(),
    DateDep:ISO(c.dt),SrlNoOfChaln:parseInt(c.sn,10),Amt:n0(c.amt)}));
}

/* ---- import (inverse) --------------------------------------------- */
function impPaid(I7){
  const read=[]; const g=(o,p)=>p.split(".").reduce((t,k)=>t==null?undefined:t[k],o);
  const back=(r,buyer)=>{const c=r.TaxDeductCreditDtls||{};return {
    who:r.TDSCreditName||"S",othPan:r.PANofOtherPerson||"",othAadh:r.AadhaarOfOtherPerson||"",
    tan:r.TANOfDeductor||"",pan:r.PANOfBuyerTenant||"",aadh:r.AadhaarOfBuyerTenant||"",
    sec:r.TDSSection||"",yr:nz(r.DeductedYr)+"",bf:nz(r.BroughtFwdTDSAmt),
    dedOwn:nz(c.TaxDeductedOwnHands),dedOthInc:nz(c.TaxDeductedIncome),dedOthTds:nz(c.TaxDeductedTDS),
    claimOwn:nz(c.TaxClaimedOwnHands),claimOthInc:nz(c.TaxClaimedIncome),claimOthTds:nz(c.TaxClaimedTDS),
    claimOthPan:c.TaxClaimedSpouseOthPrsnPAN||"",claimOthAadh:c.SpouseOthPrsnAadhaar||"",
    gross:nz(r.GrossAmount),head:r.HeadOfIncome||""};};
  if(I7.ScheduleTDS2){S.paid.tds2=(I7.ScheduleTDS2.TDSOthThanSalaryDtls||[]).map(r=>back(r,false));read.push("Schedule TDS1 (Form 16A, other than salary)");}
  if(I7.ScheduleTDS3){S.paid.tds3=(I7.ScheduleTDS3.TDS3onOthThanSalDtls||[]).map(r=>back(r,true));read.push("Schedule TDS2 (Form 16B/16C/16D/16E)");}
  if(I7.ScheduleTCS){S.paid.tcs=(I7.ScheduleTCS.TCSDetails||[]).map(r=>{
    const det=r.EmployerOrDeductorOrCollectDetl||{};return {
    who:det.TCSCreditName||"S",tan:det.TAN||"",othPan:det.PANofOtherPerson||"",
    yr:nz(det.TDSFinYr)+"",bf:nz(r.BroughtFwdTCSAmt),
    collOwn:nz(g(r,"TCSCurrFYDtls.TCSAmtCollOwnHands")),collOth:nz(g(r,"TCSCurrFYDtls.TCSAmtCollOthrHands")),
    claimOwn:nz(g(r,"TCSClaimedThisYearDtls.TCSAmtCollOwnHands")),
    claimOth:nz(g(r,"TCSClaimedThisYearDtls.TCSAmtCollOthrHands.TaxClaimedTCS")),
    claimOthPan:g(r,"TCSClaimedThisYearDtls.TCSAmtCollOthrHands.PANOfOthrPrsn")||""};});
    read.push("Schedule TCS");}
  if(I7.ScheduleIT){S.paid.it=(I7.ScheduleIT.TaxPayment||[]).map(c=>({
    bsr:c.BSRCode||"",dt:dmy(c.DateDep),sn:c.SrlNoOfChaln!=null?String(c.SrlNoOfChaln):"",amt:nz(c.Amt)}));
    read.push("advance / self-assessment tax");}
  return read;
}

/* ---- checks (screen validations only; department rules are Phase 6) ---- */
function chkPaid(){
  const out=[]; engPaid(); /* ensure row helpers set even if called stand-alone */
  const needYr=(rows,lbl)=>(rows||[]).forEach((r,i)=>{
    if(N(r.bf)>0 && DEDYR.indexOf(st0(r.yr))<0)
      out.push({lvl:"err",t:lbl+" row "+(i+1),m:"Unclaimed TDS brought forward is claimed but the financial year of deduction is not given (rule A648).",sec:"paid"});});
  needYr(S.paid.tds2,"Schedule TDS1"); needYr(S.paid.tds3,"Schedule TDS2");
  const needTan=(rows,lbl)=>(rows||[]).forEach((r,i)=>{
    if((N(r.claimOwn)||N(r.dedOwn))&&!TAN_RE.test(st0(r.tan).toUpperCase()))
      out.push({lvl:"err",t:lbl+" row "+(i+1),m:"The deductor’s TAN is required and must be 4 letters, 5 digits, 1 letter (rule A646).",sec:"paid"});});
  needTan(S.paid.tds2,"Schedule TDS1");
  (S.paid.tds3||[]).forEach((r,i)=>{
    if((N(r.claimOwn)||N(r.dedOwn))&&!PAN_RE.test(st0(r.pan).toUpperCase()))
      out.push({lvl:"err",t:"Schedule TDS2 row "+(i+1),m:"The buyer / tenant PAN is required (there is no TAN for 194IA/IB/M/S) (rule A647).",sec:"paid"});});
  const needOth=(rows,lbl)=>(rows||[]).forEach((r,i)=>{
    if(st0(r.who)==="O" && !(PAN_RE.test(st0(r.othPan).toUpperCase())||AADH.test(st0(r.othAadh))))
      out.push({lvl:"err",t:lbl+" row "+(i+1),m:"Credit relates to another person — give that person’s PAN or Aadhaar (rule 37BA(2) / A647).",sec:"paid"});});
  needOth(S.paid.tds2,"Schedule TDS1"); needOth(S.paid.tds3,"Schedule TDS2");
  const needGross=(rows,lbl)=>(rows||[]).forEach((r,i)=>{
    if(N(r.claimOwn)>0 && !st0(r.head))
      out.push({lvl:"warn",t:lbl+" row "+(i+1),m:"TDS credit is claimed — please confirm the head of income / exemption schedule under which the receipt is offered (rule A652).",sec:"paid"});});
  needGross(S.paid.tds2,"Schedule TDS1"); needGross(S.paid.tds3,"Schedule TDS2");
  (S.paid.tcs||[]).forEach((r,i)=>{
    if((N(r.claimOwn)||N(r.collOwn))&&!TAN_RE.test(st0(r.tan).toUpperCase()))
      out.push({lvl:"err",t:"Schedule TCS row "+(i+1),m:"The collector’s TAN is required (rule A660).",sec:"paid"});
    if(N(r.bf)>0 && DEDYR.indexOf(st0(r.yr))<0)
      out.push({lvl:"warn",t:"Schedule TCS row "+(i+1),m:"TCS brought forward is claimed but the year of collection is not given.",sec:"paid"});
    if(st0(r.who)==="O" && !PAN_RE.test(st0(r.othPan).toUpperCase()))
      out.push({lvl:"err",t:"Schedule TCS row "+(i+1),m:"Credit relates to another person — give that person’s PAN (rule 37i(1) / A658).",sec:"paid"});});
  const over=(rows,lbl)=>(rows||[]).forEach((r,i)=>{if(r._over)
    out.push({lvl:"warn",t:lbl+" row "+(i+1)+" over-claimed",m:"Claimed "+RS(r._claimed)+" exceeds the "+RS(r._avail)+" deducted / collected and brought forward; carry-forward is held at zero.",sec:"paid"});});
  over(S.paid.tds2,"Schedule TDS1"); over(S.paid.tds3,"Schedule TDS2"); over(S.paid.tcs,"Schedule TCS");
  (S.paid.it||[]).forEach((c,i)=>{
    if(N(c.amt)&&!D(c.dt))
      out.push({lvl:"warn",t:"Challan "+(i+1),m:"An amount is entered but the date of deposit is missing or not DD/MM/YYYY — advance vs self-assessment cannot be decided.",sec:"paid"});
    if(N(c.amt)&&!BSR.test(st0(c.bsr).toUpperCase()))
      out.push({lvl:"warn",t:"Challan "+(i+1),m:"BSR code should be 7 characters (3 digits + 4 alphanumerics).",sec:"paid"});});
  const P=S.C.paid||{};
  if(P.paid>0)out.push({lvl:"ok",t:"Tax payments",m:RS(P.paid)+" total — advance "+RS(P.adv)+", TDS "+RS(P.tds)+", TCS "+RS(P.tcs)+", self-assessment "+RS(P.sat)+".",sec:"paid"});
  return out;
}

/* =====================================================================
   ITR-7 · Section "pti" — Schedule PTI (SchedulePTI)
     PASS-THROUGH INCOME FROM BUSINESS TRUST OR INVESTMENT FUND
     u/s 115U / 115UA / 115UB.
   Built ONLY from books/ITR-7/Schedule_PTI.md (block SchedulePTI) and
   books/ITR-7/{enums.json,skeleton.json,section_map.json} + the schema
   ITR-7_2026_Main_V1_0_schema.json.  Structural template (idioms only):
   forms/ITR-6/src/70_sec_other.js (its Schedule PTI card) and
   forms/ITR-6/src/70_sec_cg.js (the PTI heads A8 / B10) — but the exempt
   block here is the ITR-7 shape (an IncClmdExmptDtls[] array + a
   TotalSec23FBB line), not the ITR-6 fixed SecB/SecC slots.

   Schema block (section_map → pti): SchedulePTI
     SchedulePTIDtls[]  (repeatable, one object per business trust / fund)
       InvstmntCvrdUs115UA115UB, BusinessName, BusinessPAN
       IncFromHP                         {4-col: has a loss column}
       CapitalGainsPTI.{ShortTermCG, STCG_Sec111A, STCG_Others,
                        LongTermCG, LTCG_Sec112A, LTCG_Others}  {4-col}
       IncOthSrc, OS_Dividend, OS_Others {3-col: NO loss column}
       IncClmdPTI.TotalSec23FBB          {3-col}          (u/s 10(23FBB))
       IncClmdPTI.IncClmdExmptDtls[]     {SectionCode + SecBCIncExmptDtl 3-col}

   The four money columns on each head row (book §1):
     (7) AmountOfInc                 — current-year income
     (8) CurrYrLossShareByInvstFund  — share of CY loss distributed (HP+CG only)
     (9) NetIncomeLoss  = 7 − 8      — computed
     (10) TDSAmount                  — TDS on such amount
   CurrYrLossShareByInvstFund exists ONLY on the HP and CG objects; the
   other-sources and exempt objects have no col-8 leaf (book §2).

   PTI is a DISCLOSURE OF SOURCE — it does not itself add to Gross Total
   Income (each net reappears in the head's own schedule).  So
   S.C.pti.income = 0; the by-head nets are published for cyla / the head
   schedules / Part B-TI to fold in.

   CROSS-SECTION SCALARS PUBLISHED into S.C.pti (guarded reads by consumers):
     on          any block carries a value
     blocks      [] computed per-fund blocks (each head object, net & tds)
     hp          Σ i·HP net            -> Schedule HP item 2 (A383)
     stcg111a    Σ iiai·STCG 111A net  -> Schedule CG A8 / SI 111A (A442)
     stcgOth     Σ iiaii·STCG oth net  -> Schedule CG A8b / SI @30% (A389, A442)
     stcg        Σ iia·STCG net        (= stcg111a + stcgOth)
     ltcg112a    Σ iibi·LTCG 112A net  -> Schedule CG B10a1 / SI 112A (A428, A443)
     ltcgOth     Σ iibii·LTCG oth net  -> Schedule CG / SI (A444)
     ltcg        Σ iib·LTCG net        (= ltcg112a + ltcgOth)
     osDiv       Σ iiia·dividend net   -> Schedule OS 2
     osOth       Σ iiib·others net     -> Schedule OS 2d special (A305)
     os          Σ iii·OS net          (= osDiv + osOth)
     exempt      Σ iv·exempt net       -> Schedule EI (pass-through not chargeable)
     tds         Σ all col-10 TDS      -> Schedule TDS (head set accordingly)
     income      0  (disclosure — nothing added to GTI here)
   CONSUMES: none (every read is of this section's own state).
   ===================================================================== */
(function(){
"use strict";

/* ---- dropdown (books/ITR-7/Schedule_PTI.md Appendix C, verbatim) -----
   "(Select) / Section 115U / Section 115UA / Section 115UB"; the schema
   leaf InvstmntCvrdUs115UA115UB stores the chosen display string. */
const PTIKIND=[["Section 115U","Section 115U"],
               ["Section 115UA","Section 115UA"],
               ["Section 115UB","Section 115UB"]];

/* ---- state (S.pti) ------------------------------------------------- */
/* one object per business trust / investment fund; head leaves seeded
   lazily (leaf()/leaf3() guard undefined), exempt "u/s specify" lines in
   a per-fund exList grid. */
S.pti = S.pti || { funds:[] };

/* SEED for the shell add-handler (a fresh block/row is an empty object) */
SEED["pti.funds"] = SEED["pti.funds"] || {};

/* =====================================================================
   ENGINE — col 9 = 7 − 8 on HP & CG; net = income on OS & exempt.
   iia = ai+aii, iib = bi+bii, iii = a+b, iv = 23FBB + Σ(specify).
   ===================================================================== */
/* a 4-column leaf (has the col-8 loss share): HP and every CG head */
function leaf4(r){r=r||{};const inc=R(r.inc),loss=R(r.loss),tds=Math.max(0,R(r.tds));
  return {inc,loss,net:inc-loss,tds};}
/* a 3-column leaf (no loss share): OS and exempt heads */
function leaf3(r){r=r||{};const inc=R(r.inc),tds=Math.max(0,R(r.tds));
  return {inc,net:inc,tds};}
function add4(a,b){return {inc:a.inc+b.inc,loss:a.loss+b.loss,net:a.net+b.net,tds:a.tds+b.tds};}
function add3(a,b){return {inc:a.inc+b.inc,net:a.net+b.net,tds:a.tds+b.tds};}

function engPti(){
  S.pti = S.pti || {funds:[]};
  const F = S.pti.funds || [];
  const C = S.C.pti = {income:0};

  C.blocks = F.map(b=>{
    b = b || {};
    const hp     = leaf4(b.hp);
    const st111a = leaf4(b.st111a), stOth = leaf4(b.stOth);
    const lt112a = leaf4(b.lt112a), ltOth = leaf4(b.ltOth);
    const stAgg  = add4(st111a, stOth);     /* iia = ai + aii */
    const ltAgg  = add4(lt112a, ltOth);     /* iib = bi + bii */
    const osDiv  = leaf3(b.osDiv), osOth = leaf3(b.osOth);
    const osAgg  = add3(osDiv, osOth);      /* iii = a + b */
    const ex23   = leaf3(b.ex23fbb);        /* iv u/s 10(23FBB) -> TotalSec23FBB */
    const exList = (b.exList || []).map(e=>{const o=leaf3(e); o.code=st0((e||{}).code); return o;});
    const exTot  = exList.reduce((a,e)=>add3(a,e), add3({inc:0,net:0,tds:0}, ex23)); /* iv total */
    const hasVal = !!(st0(b.kind)||st0(b.name)||st0(b.pan)||
                      hp.inc||hp.loss||stAgg.inc||stAgg.loss||ltAgg.inc||ltAgg.loss||
                      osAgg.inc||exTot.inc||exTot.tds);
    return { kind:st0(b.kind), name:st0(b.name), pan:st0(b.pan).toUpperCase(),
             hp, st111a, stOth, lt112a, ltOth, stAgg, ltAgg,
             osDiv, osOth, osAgg, ex23, exList, exTot, hasVal };
  });

  const sum = f => C.blocks.reduce((a,b)=>a + R(f(b)), 0);
  /* by-head nets (col 9) — for the head schedules / cyla / Part B-TI */
  C.hp        = sum(b=>b.hp.net);        /* -> Schedule HP item 2 */
  C.stcg111a  = sum(b=>b.st111a.net);    /* -> CG A8 / SI 111A */
  C.stcgOth   = sum(b=>b.stOth.net);     /* -> CG A8b / SI @30% */
  C.stcg      = R(C.stcg111a + C.stcgOth);
  C.ltcg112a  = sum(b=>b.lt112a.net);    /* -> CG B10a1 / SI 112A */
  C.ltcgOth   = sum(b=>b.ltOth.net);     /* -> CG / SI */
  C.ltcg      = R(C.ltcg112a + C.ltcgOth);
  C.osDiv     = sum(b=>b.osDiv.net);     /* -> OS 2 dividend */
  C.osOth     = sum(b=>b.osOth.net);     /* -> OS 2 others / special */
  C.os        = R(C.osDiv + C.osOth);
  C.exempt    = sum(b=>b.exTot.net);     /* -> Schedule EI (not chargeable) */
  C.tds       = sum(b=>b.hp.tds+b.stAgg.tds+b.ltAgg.tds+b.osAgg.tds+b.exTot.tds); /* -> Schedule TDS */
  C.on        = C.blocks.some(b=>b.hasVal);
  C.income    = 0;                        /* disclosure of source — not GTI */
}

/* =====================================================================
   RENDERER
   ===================================================================== */
function secPti(){
  const O = S.pti || {funds:[]}, C = S.C.pti || {};
  let h = note("Schedule PTI — pass-through income from a business trust (REIT / InvIT) or investment fund (AIF / VCF) u/s 115U / 115UA / 115UB. Each head's net (col 9 = col 7 − col 8) is taxed in your hands under the head it had in the fund's hands, so it reappears in that head's own schedule — house property (item 2), capital gains (A8 / B10 / Schedule SI) and other sources (Sl. 2). The exempt total (iv) flows to Schedule EI; column 10 TDS flows to Schedule TDS. PTI is a disclosure of source and does not itself add to total income.");

  const blocks = C.blocks || [];
  (O.funds || []).forEach((raw,i)=>{
    raw = raw || {};
    const cb = blocks[i] || {};
    const pre = "pti.funds."+i+".";
    const title = "Trust / fund " + (i+1) + (st0(raw.name)?" — "+esc(st0(raw.name)):"");
    let inner = "";
    inner += row("Investment entity covered by section 115U/115UA/115UB", sel(pre+"kind", PTIKIND), {req:1, ref:"(2)"});
    inner += row("Name of business trust / investment fund", inp(pre+"name",{max:125}), {req:1, ref:"(3)"});
    inner += row("PAN of business trust / investment fund", inp(pre+"pan",{max:10}), {req:1, ref:"(4)"});

    /* a 4-column head row (income · loss share · net · TDS) */
    const money4 = (k,lbl,ind)=> '<tr><td class="l"'+(ind?' style="padding-left:'+ind+'px"':'')+'>'+esc(lbl)+'</td>'+
      '<td>'+inp(pre+k+".inc",{n:1})+'</td><td>'+inp(pre+k+".loss",{n:1})+'</td>'+
      '<td class="num">'+cell((cb[k]||{}).net)+'</td><td>'+inp(pre+k+".tds",{n:1})+'</td></tr>';
    /* a 3-column head row (no loss share — net = income) */
    const money3 = (k,lbl,ind)=> '<tr><td class="l"'+(ind?' style="padding-left:'+ind+'px"':'')+'>'+esc(lbl)+'</td>'+
      '<td>'+inp(pre+k+".inc",{n:1})+'</td><td class="num">'+cell(0)+'</td>'+
      '<td class="num">'+cell((cb[k]||{}).net)+'</td><td>'+inp(pre+k+".tds",{n:1})+'</td></tr>';
    /* a computed aggregate row (iia / iib / iii) */
    const aggRow = (lbl,o,ind)=> '<tr><td class="l"'+(ind?' style="padding-left:'+ind+'px"':'')+'><b>'+esc(lbl)+'</b></td>'+
      '<td class="num">'+cell((o||{}).inc)+'</td><td class="num">'+cell((o||{}).loss!==undefined?(o||{}).loss:0)+'</td>'+
      '<td class="num">'+cell((o||{}).net)+'</td><td class="num">'+cell((o||{}).tds)+'</td></tr>';

    let t = '<div class="full"><table class="gt" style="min-width:680px"><thead><tr>'+
      '<th class="l">Sl · Head of income (5)(6)</th><th>Current year income (7)</th>'+
      '<th>Share of CY loss distributed (8)</th><th>Net income/loss 9 = 7−8 (9)</th>'+
      '<th>TDS (10)</th></tr></thead><tbody>';
    t += money4("hp","i · House property");
    t += '<tr><td class="l" colspan="5"><b>ii · Capital Gains</b></td></tr>';
    t += aggRow("a · Short term (iia = ai + aii)", cb.stAgg, 20);
    t += money4("st111a","ai · Section 111A", 36);
    t += money4("stOth","aii · Others", 36);
    t += aggRow("b · Long term (iib = bi + bii)", cb.ltAgg, 20);
    t += money4("lt112a","bi · Section 112A", 36);
    t += money4("ltOth","bii · Sections other than 112A", 36);
    t += '<tr><td class="l" colspan="5"><b>iii · Other Sources (iii = a + b)</b></td></tr>';
    t += aggRow("Other Sources total", cb.osAgg, 20);
    t += money3("osDiv","a · Dividend", 36);
    t += money3("osOth","b · Others", 36);
    t += '<tr><td class="l" colspan="5"><b>iv · Income claimed to be exempt</b></td></tr>';
    t += money3("ex23fbb","u/s 10(23FBB)", 20);
    t += '</tbody></table></div>';
    inner += t;

    /* iv a-e · exempt income under a specified section (IncClmdExmptDtls[]) */
    inner += sub("Other income claimed to be exempt (u/s — specify the section)");
    inner += grid(pre+"exList",[
        {h:"Section", k:"code", t:"txt", max:15},
        {h:"Amount of income (7)", k:"inc", t:"num"},
        {h:"Net income (9)", k:"net", t:"calc", f:r=>Math.max(0,R((r||{}).inc))},
        {h:"TDS (10)", k:"tds", t:"num"}
      ], (raw.exList||[]), {empty:"No other exempt-income line entered.", add:"Add an exempt line", min:"620px"});
    if(cb.exTot) inner += row("Total income claimed to be exempt (iv)", cell(cb.exTot.net), {ref:"(iv)"});

    h += blk("ptifund"+i, title, (cb.hasVal?"Entered":"Empty"), inner, "pti.funds."+i);
  });
  h += '<button class="add" data-add="pti.funds">Add a trust / fund</button>';

  /* section totals (by head) */
  if((C.blocks||[]).some(b=>b.hasVal)){
    h += sub("Pass-through totals across all trusts / funds (feed the head schedules)");
    h += row("Net house-property income (→ Schedule HP item 2)", cell(C.hp), {});
    h += row("Net STCG — Section 111A (→ Schedule CG A8 / SI)", cell(C.stcg111a), {});
    h += row("Net STCG — Others (→ Schedule CG A8b / SI @30%)", cell(C.stcgOth), {});
    h += row("Net LTCG — Section 112A (→ Schedule CG B10 / SI)", cell(C.ltcg112a), {});
    h += row("Net LTCG — other than 112A (→ Schedule CG / SI)", cell(C.ltcgOth), {});
    h += row("Net dividend (→ Schedule OS 2)", cell(C.osDiv), {});
    h += row("Net other-source income (→ Schedule OS 2d)", cell(C.osOth), {});
    h += row("Net exempt pass-through income (→ Schedule EI)", cell(C.exempt), {});
    h += row("Total TDS on pass-through income (→ Schedule TDS)", cell(C.tds), {});
  }
  return h;
}

/* the section-bar summary (screen order) */
function selPti(){
  const C = S.C.pti || {};
  const n = (C.blocks||[]).filter(b=>b.hasVal).length;
  return n ? (n + (n===1?" fund":" funds")) : "";
}

/* =====================================================================
   EXPORT — writes SchedulePTI.SchedulePTIDtls[] (every head object present)
   ===================================================================== */
function expPti(j){
  const C = S.C.pti || {};
  const pb = (C.blocks || []).filter(b=>b.hasVal);
  if(!pb.length) return;

  /* 4-col schema object (HP + CG heads carry the loss-share leaf) */
  const m4 = o => ({ AmountOfInc:sg((o||{}).inc), CurrYrLossShareByInvstFund:n0((o||{}).loss),
                     NetIncomeLoss:sg((o||{}).net), TDSAmount:n0((o||{}).tds) });
  /* 3-col schema object (OS + exempt heads — no loss-share leaf) */
  const m3 = o => ({ AmountOfInc:sg((o||{}).inc), NetIncomeLoss:sg((o||{}).net), TDSAmount:n0((o||{}).tds) });

  const arr = pb.map(b=>{
    const IncClmdPTI = { TotalSec23FBB: m3(b.ex23) };   /* iv u/s 10(23FBB) */
    const ex = (b.exList||[]).filter(e=>sv(e.code)).map(e=>({
      SectionCode: st0(e.code).slice(0,15),
      SecBCIncExmptDtl: m3(e) }));
    if(ex.length) IncClmdPTI.IncClmdExmptDtls = ex;     /* iv a-e specify sections */
    return {
      InvstmntCvrdUs115UA115UB: sv(b.kind) || "Section 115UB",
      BusinessName: (sv(b.name) || "NA").slice(0,125),
      BusinessPAN: PAN_RE.test(b.pan) ? b.pan : "AAAAA0000A",
      IncFromHP: m4(b.hp),
      CapitalGainsPTI: {
        ShortTermCG: m4(b.stAgg), STCG_Sec111A: m4(b.st111a), STCG_Others: m4(b.stOth),
        LongTermCG:  m4(b.ltAgg), LTCG_Sec112A: m4(b.lt112a), LTCG_Others: m4(b.ltOth) },
      IncOthSrc: m3(b.osAgg), OS_Dividend: m3(b.osDiv), OS_Others: m3(b.osOth),
      IncClmdPTI: IncClmdPTI
    };
  });
  put(j, "SchedulePTI.SchedulePTIDtls", arr);
}

/* =====================================================================
   IMPORT — reads SchedulePTI back into S.pti.funds (round-trip)
   ===================================================================== */
function impPti(I){
  if(!I || !I.SchedulePTI) return [];
  const l4 = o => o ? { inc:nz(o.AmountOfInc), loss:nz(o.CurrYrLossShareByInvstFund), tds:nz(o.TDSAmount) } : {};
  const l3 = o => o ? { inc:nz(o.AmountOfInc), tds:nz(o.TDSAmount) } : {};
  S.pti = S.pti || {funds:[]};
  S.pti.funds = (I.SchedulePTI.SchedulePTIDtls || []).map(b=>{
    b = b || {};
    const cg = b.CapitalGainsPTI || {}, x = b.IncClmdPTI || {};
    const r = {
      kind: b.InvstmntCvrdUs115UA115UB || "", name: b.BusinessName || "", pan: b.BusinessPAN || "",
      hp: l4(b.IncFromHP),
      st111a: l4(cg.STCG_Sec111A), stOth: l4(cg.STCG_Others),
      lt112a: l4(cg.LTCG_Sec112A), ltOth: l4(cg.LTCG_Others),
      osDiv: l3(b.OS_Dividend), osOth: l3(b.OS_Others),
      ex23fbb: l3(x.TotalSec23FBB),
      exList: (x.IncClmdExmptDtls || []).map(e=>{
        const d = l3((e||{}).SecBCIncExmptDtl); d.code = (e||{}).SectionCode || ""; return d; })
    };
    return r;
  });
  return ["Schedule PTI"];
}

/* =====================================================================
   SECTION-LOCAL SANITY CHECKS (not the CBDT rule engine — Phase 6)
   ===================================================================== */

    if(!st0(b.kind) || !st0(b.name) || !PAN_RE.test(b.pan))
      out.push({lvl:"err", t:"Schedule PTI", sec:"pti",
        m:"Trust/fund "+(i+1)+": the section covered (115U/115UA/115UB), the name and a valid PAN of the trust/fund are mandatory."});

          m:"Trust/fund "+(i+1)+", exempt line "+(k+1)+": the section code and the amount must both be filled."});

function _siNorm(v){
  if(v==null)return null;
  if(typeof v==="object")return {inc:R(N(v.inc!=null?v.inc:v.income)),
    rate:(v.rate!=null&&v.rate!=="")?st0(v.rate):null,
    tax:(v.tax!=null&&v.tax!=="")?R(N(v.tax)):null};
  return {inc:R(N(v)),rate:null,tax:null};
}
function engSi(){
  const cg=(S.C.cg||{}), os=(S.C.os||{}), bp=(S.C.bp||{}), vda=(S.C.vda||{}), vc=(S.C.vc||{});
  const feeds={};                                 /* code -> {inc,rate,tax,src} */
  const merge=(src,head)=>{if(!src||typeof src!=="object")return;
    Object.keys(src).forEach(k=>{const f=_siNorm(src[k]); if(!f)return;
      feeds[k]={inc:f.inc,rate:f.rate,tax:f.tax,src:head};});};
  merge(cg.siFeed,"cg"); merge(os.siFeed,"os"); merge(bp.siFeed,"bp"); merge(vda.siFeed,"vda");

  /* the trust's anonymous-donation charge u/s 115BBC (Schedule VC Diii) is
     NOT folded into Schedule SI: the ITR-7 Part B-TI/TTI carry a DEDICATED
     115BBC line (DonationsUs115BBC / DonationUs115BC), owned by the tax
     section (tax1c). Folding it here too would tax the same rupees twice.
     vc's Diii is published for reference (S.C.vc.anon115BBC → tax), but it
     does not enter the Schedule SI special-rate total. */
  const anon=R(N(vc.anon115BBC));

  /* manual override (SI book §9 — EditAutopoulatedDetail unlocks the table) */
  if(S.si.edit==="Yes"){
    (S.si.rows||[]).forEach(r=>{if(!r||!r.code)return; const code=st0(r.code);
      feeds[code]={
        inc:R(N(r.inc)),
        rate:(r.rate!=null&&r.rate!=="")?st0(r.rate):(SI_RATE_DEF[code]||null),
        tax:(r.tax!=null&&r.tax!=="")?R(N(r.tax)):null,
        src:"man"};});
  }

  /* assemble rows in canonical sheet order (unknown codes appended) */
  const codes=Object.keys(feeds).sort((a,b)=>
    (SI_ORDER[a]==null?999:SI_ORDER[a])-(SI_ORDER[b]==null?999:SI_ORDER[b]));
  const rows=[];
  codes.forEach(code=>{const f=feeds[code];
    const rate=(f.rate!=null?f.rate:SI_RATE_DEF[code])||"";
    const inc=R(f.inc);
    if(inc===0)return;                            /* one row per head carrying income (SI book §10) */
    rows.push({code,rate:st0(rate),inc,tax:(f.tax!=null?R(f.tax):null),
      src:(f.src==="man"?"man":(SI_FEED[code]||f.src||""))});});

  /* the ₹1,25,000 s.112A exemption (SI book §5, tax column only):
       own 112A (2A) then PTI-112A share one ₹1,25,000 pool;
       115AD(1)(b)(iii) proviso (5ADiiiP) gets a separate ₹1,25,000. */
  let pool=125000, exOwn=0, exPti=0, exSep=0;
  const rOwn=rows.find(r=>r.code===C_112A_OWN);
  const rPti=rows.find(r=>r.code===C_112A_PTI);
  const rSep=rows.find(r=>r.code===C_112A_SEP);
  if(rOwn){exOwn=Math.min(pool,Math.max(0,rOwn.inc));pool-=exOwn;}
  if(rPti){exPti=Math.min(pool,Math.max(0,rPti.inc));pool-=exPti;}
  if(rSep){exSep=Math.min(125000,Math.max(0,rSep.inc));}
  const exemption112A=exOwn+exPti+exSep;

  /* column H (taxable after min-charge adjust) == column G on ITR-7
     (SI book §5, THRESOLD inert). Then column I tax = ROUND(G × F/100). */
  let totInc=0, totCalc=0, totTax=0, tax112A=0, bbeInc=0, bbeTax=0,
      cgDivInc=0, cgDivTax=0, dtaaInc=0, dtaaTax=0;
  rows.forEach(r=>{
    r.taxable=r.inc;                              /* col H = col G */
    let base=r.inc;
    if(r.code===C_112A_OWN)      base=Math.max(0,r.inc-exOwn);
    else if(r.code===C_112A_PTI) base=Math.max(0,r.inc-exPti);
    else if(r.code===C_112A_SEP) base=Math.max(0,r.inc-exSep);
    if(siIsDTAA(r.code)){
      r.tax=(r.tax!=null)?R(r.tax):R(base*N(r.rate)/100);   /* treaty tax from feed */
    }else{
      r.tax=R(base*N(r.rate)/100);
    }
    totInc+=r.inc; totCalc+=r.taxable; totTax+=r.tax;
    if(r.code===C_112A_OWN||r.code===C_112A_PTI||r.code===C_112A_SEP) tax112A+=r.tax;
    if(r.code==="5BBE"){bbeInc+=r.inc; bbeTax+=r.tax;}
    if(SI_CGDIV.indexOf(r.code)>=0){cgDivInc+=r.inc; cgDivTax+=r.tax;}
    if(siIsDTAA(r.code)){dtaaInc+=r.inc; dtaaTax+=r.tax;}});

  const G={
    on:rows.length>0, rows,
    totInc:R(totInc),                             /* G94 → Part B-TI SplRateInc  */
    totCalc:R(totCalc),
    totTax:R(totTax),                             /* I94 → Part B-TTI special tax*/
    exemption112A:R(exemption112A), exOwn:R(exOwn), exPti:R(exPti), exSep:R(exSep),
    tax112A:R(tax112A),
    bbeInc:R(bbeInc), bbeTax:R(bbeTax),
    inc115BBE:R(bbeInc), tax115BBE:R(bbeTax),     /* SEAM: tax reads si.inc115BBE / si.tax115BBE */
    cgDivInc:R(cgDivInc), cgDivTax:R(cgDivTax),
    dtaaInc:R(dtaaInc), dtaaTax:R(dtaaTax),
    anon115BBC:anon,
    agri:0,                                        /* SEAM: tax reads si.agri (net agricultural income for rate) */
    income:0};                                    /* adds nothing to GTI (SI book §1) */

  /* fold in the 115BBI and 115TD computations onto the same S.C.si */
  Object.assign(G, engBbi(), engTd());
  /* SEAM aliases: the tax section reads si.spec115BBI (115BBI base @30%) and
     si.net115TD (Schedule 115TD item 12); publish them next to bbiTotal/td12. */
  G.spec115BBI=R(G.bbiTotal||0);
  G.net115TD  =R(G.td12||0);
  S.C.si=G;
}

/* =====================================================================
   ENGINE — Schedule 115BBI (115BBI book §2): six limbs → Total @30%.
   ===================================================================== */
function engBbi(){
  const B=S.bbi||{};
  const l1=R(N(B.l1)), l2=R(N(B.l2)), l3=R(N(B.l3)),
        l4=R(N(B.l4)), l5=R(N(B.l5)), l6=R(N(B.l6));
  const tot=R(l1+l2+l3+l4+l5+l6);
  return {
    bbi:{l1,l2,l3,l4,l5,l6,tot},
    bbiOn:(l1||l2||l3||l4||l5||l6)>0,
    bbiTotal:tot,                                 /* Total → base @30% (Part B-TTI) */
    bbiTax:R(tot*30/100)};                        /* convenience 30% charge         */
}

/* =====================================================================
   ENGINE — Schedule 115TD (115TD book §3): accreted-income ladder,
   MMR exit tax (item 7), 115TE interest (item 8) and the challan net.
   ===================================================================== */
function engTd(){
  const T=S.td||{};
  const f1=R(N(T.fmvTot)), f2=R(N(T.liab));
  const net=R(f1-f2);                             /* item 3 = 1 − 2 */
  const q1=R(N(T.fmv4i)), q2=R(N(T.fmv4ii)), q3=R(N(T.fmv4iii));
  const fmv4=R(q1+q2+q3);                         /* item 4iv = 4i+4ii+4iii */
  const liab4=R(N(T.liab4));                      /* item 5 */
  const accreted=R(Math.max(0,net-(fmv4-liab4))); /* item 6 = 3 − (4iv − 5), floored ≥0 */

  /* item 7 — additional income-tax at MMR (override honoured) */
  const addTax=(T.addTaxOvr!=null&&T.addTaxOvr!=="")?R(N(T.addTaxOvr)):R(accreted*TD_MMR/100);

  /* challans (item 11 = Σ amount deposited) */
  const challans=(T.challans||[]).map(c=>({
    date:c.date, bank:st0(c.bank), bsr:st0(c.bsr).toUpperCase(), sn:st0(c.sn),
    amt:R(N(c.amt)), d:D(c.date)}));
  const paid=R(challans.reduce((a,c)=>a+c.amt,0));  /* item 11 */

  /* item 8 — interest u/s 115TE at 1% per (part) month on item 7 from the
     specified date to the payment date. The utility's hidden helper columns
     (115TD book §2) split each challan interest-then-tax; here the interest
     total is computed to the latest challan deposit (the payment date), and
     is overridable to match the utility exactly (book §3/§8, resolved gap). */
  const spec=D(T.specDate);
  let interest;
  if(T.intOvr!=null&&T.intOvr!=="")interest=R(N(T.intOvr));
  else{
    const dated=challans.filter(c=>c.d).map(c=>c.d).sort((a,b)=>b-a);
    const payDate=dated.length?dated[0]:null;
    interest=(accreted>0&&spec&&payDate&&payDate>spec)?R(addTax*MPART(spec,payDate)/100):0;
  }

  const item10=R(addTax+interest);                /* item 10 = 7 + 8 */
  const item12=R(Math.max(0,item10-paid));        /* item 12 = 10 − 11, floored ≥0 */
  const on=(f1||f2||q1||q2||q3||liab4||accreted||paid||st0(T.specDate))?true:false;

  return {
    td:{f1,f2,net,q1,q2,q3,fmv4,liab4,accreted,addTax,interest,
        specDate:T.specDate||"",item10,paid,item12,challans,on},
    td10:item10,                                  /* item 10 (addl tax + interest) */
    td12:item12};                                 /* item 12 → Part B-TTI (Refund) */
}

  if(!rows.length)h+='<tr><td class="emp" colspan="6">No special-rate income — Schedule SI has nothing to show.</td></tr>';
  rows.forEach((r,i)=>{h+='<tr><td class="l">'+(i+1)+'</td>'+
    '<td class="l">'+esc(siLabel(r.code))+
      (r.src==="man"?'<span class="dt">manually edited</span>':
        (r.src?'<span class="dt">from Schedule '+esc(String(r.src).toUpperCase())+'</span>':''))+'</td>'+
    '<td class="num">'+(r.rate?esc(r.rate):"—")+(siIsDTAA(r.code)?'<span class="dt">treaty</span>':'')+'</td>'+
    '<td class="num">'+cell(r.inc)+'</td><td class="num">'+cell(r.taxable)+'</td>'+
    '<td class="num">'+cell(r.tax)+'</td></tr>';});
  h+='</tbody><tfoot><tr><td class="l" colspan="3">Total (row 94)</td>'+
     '<td>'+F(G.totInc||0)+'</td><td>'+F(G.totCalc||0)+'</td><td>'+F(G.totTax||0)+'</td></tr></tfoot></table></div>';

  if(R(G.exemption112A)>0)h+=note("₹"+F(G.exemption112A)+" of section-112A exemption applied in the tax column — "+
    "one ₹1,25,000 shared across own-112A then PTI-112A"+(R(G.exSep)>0?", and a separate ₹1,25,000 on the 115AD(1)(b)(iii) proviso head":"")+".");

  h+=row("Do you want to edit the details auto-populated in the table above?",
    sel("si.edit",[["Yes","Yes"],["No","No"]],{blank:false}),{ref:"r96",hint:"EditAutopoulatedDetail"});
  if(S.si.edit==="Yes"){
    h+=note("Override the auto-populated table — add or correct a special-rate head. Pick the section and its rate, "+
      "enter the income; a row here replaces the fed figure for the same section. For a DTAA head, also enter the "+
      "treaty tax. The ₹1,25,000 section-112A adjustment is applied automatically.");
    h+=grid("si.rows",[
      {h:"Section",k:"code",t:"sel",opts:SI_CODE_OPTS,req:1},
      {h:"Rate (%)",k:"rate",t:"sel",opts:SI_RATES.map(x=>[x,x])},
      {h:"Income",k:"inc",t:"num",req:1},
      {h:"Treaty tax (DTAA only)",k:"tax",t:"num"}],
      S.si.rows||[],
      {min:"780px",empty:"No manual special-rate head added.",add:"Add / override a special-rate head"});
  }

  /* ---------- Schedule 115BBI ---------- */
  const B=(G.bbi)||{};
  h+='<div class="cgband">Schedule 115BBI — specified income of certain institutions u/s 115BBI (taxed @30%)</div>';
  h+=note("Section 115BBI charges the specified income of a trust/institution (registered u/s 12AA/12AB or approved "+
    "u/s 10(23C)) to a flat 30%, with no deduction of expenditure/allowance and no set-off of loss. Enter each limb of "+
    "specified income; the total is the base on which 30% is charged.");
  h+=row("1 · Deemed income u/s Explanation 4 to the third proviso to s.10(23C) or s.11(3)",inp("bbi.l1",{n:1}),{ref:"D4"});
  h+=row("2 · Deemed income referred under section 11(1B)",inp("bbi.l2",{n:1}),{ref:"D5"});
  h+=row("3 · Income deemed u/s twenty-first proviso to s.10(23C) or not excluded per s.13(1)(c)",inp("bbi.l3",{n:1}),{ref:"D6"});
  h+=row("4 · Income not exempt u/s 10(23C) for violation of clause (b) of the third proviso, or not excluded per s.13(1)(d)",inp("bbi.l4",{n:1}),{ref:"D7"});
  h+=row("5 · Income not excluded from total income as per section 11(1)(c)",inp("bbi.l5",{n:1}),{ref:"D8"});
  h+=row("6 · Income accumulated/set apart in excess of 15% where such accumulation is not allowed",inp("bbi.l6",{n:1}),{ref:"D9"});
  h+=calcRow("Total (of Sl. 1 to 6) — specified income charged @30% u/s 115BBI","D10 · Total",B.tot||0);
  if(R(G.bbiTotal)>0)h+=note("30% of ₹"+F(G.bbiTotal)+" = ₹"+F(G.bbiTax)+" charged u/s 115BBI (added in Part B-TTI).");

  /* ---------- Schedule 115TD ---------- */
  const D=(G.td)||{};
  h+='<div class="cgband">Schedule 115TD — accreted income / exit tax u/s 115TD</div>';
  h+=note("Applicable if exemption is claimed u/s 11 and 12 or 10(23C)(iv)/(v)/(vi)/(via) and the trust/institution has "+
    "ceased to be eligible. Section 115TD taxes the accreted income (excess of FMV of assets over liabilities) at the "+
    "maximum marginal rate, with interest u/s 115TE. Items 3, 4iv, 6, 7, 8, 10, 11 and 12 are computed.");
  h+=row("1 · Aggregate Fair Market Value (FMV) of total assets of the specified person",inp("td.fmvTot",{n:1}),{ref:"F4"});
  h+=row("2 · Less: total liability of the specified person",inp("td.liab",{n:1}),{ref:"F5"});
  h+=calcRow("3 · Net value of assets (1 − 2)","F6",D.net||0);
  h+=row("4i · FMV of assets directly acquired out of income referred to in s.10(1)",inp("td.fmv4i",{n:1}),{ref:"F7"});
  h+=row("4ii · FMV of assets acquired before registration where 11/12 or 10(23C) benefit not claimed",inp("td.fmv4ii",{n:1}),{ref:"F8"});
  h+=row("4iii · FMV of assets transferred per third proviso to s.115TD(2)",inp("td.fmv4iii",{n:1}),{ref:"F9"});
  h+=calcRow("4iv · Total (4i + 4ii + 4iii)","F10",D.fmv4||0);
  h+=row("5 · Liability in respect of assets at 4 above",inp("td.liab4",{n:1}),{ref:"F11"});
  h+=calcRow("6 · Accreted income as per section 115TD [3 − (4 − 5)]","F12",D.accreted||0);
  h+=row("7 · Additional income-tax payable u/s 115TD at maximum marginal rate ("+TD_MMR+"%) — override",
    inp("td.addTaxOvr",{n:1}),{ref:"F13",hint:"blank = computed"});
  h+=calcRow("&nbsp;&nbsp;&nbsp;computed additional tax","",D.addTax||0);
  h+=row("8 · Interest payable u/s 115TE — override",inp("td.intOvr",{n:1}),{ref:"F14",hint:"blank = computed"});
  h+=calcRow("&nbsp;&nbsp;&nbsp;computed interest","",D.interest||0);
  h+=row("9 · Specified date u/s 115TD",inp("td.specDate",{ph:DF,max:10})+'<span class="dt">'+DF+'</span>',{ref:"F15"});
  h+=calcRow("10 · Additional income-tax and interest payable (7 + 8)","F16",D.item10||0);
  h+=note("Dates of deposit of tax on accreted income (challan table):");
  h+=grid("td.challans",[
      {h:"Date of deposit",k:"date",t:"date",w:"150px",req:1},
      {h:"Name of bank & branch",k:"bank",t:"txt",max:125,req:1},
      {h:"BSR code",k:"bsr",t:"txt",max:7,req:1},
      {h:"Serial no. of challan",k:"sn",t:"txt",max:5,req:1},
      {h:"Amount deposited",k:"amt",t:"num",req:1}],
