/* ---- export --------------------------------------------------------- */
function expBodies(j){
  bodiesInit(); const B=S.bodies||{}, Cb=(S.C.bodies||{});

  /* ----- Schedule PP ----- */
  if(bodYN((B.pp||{}).on)==="Y"){
    const p=B.pp||{}, pp={};
    /* required Y/N leaves (default No so all are present) */
    pp.RegisterUS29A=bodYN(p.reg);
    pp.RecognizedByECI=bodYN(p.eci);
    pp.BooksOfAccMaintained=bodYN(p.books);
    pp.AccountsAudited=bodYN(p.audited);
    pp.ReportUs29=bodYN(p.report29);
    pp.VoluntaryContribution=bodYN(p.vc);
    pp.VoluntaryContributionElecBond=bodYN(p.vcElecBond);
    pp.DonExceElectoralBond=bodYN(p.donExc);
    /* required integer (must be present even at 0) */
    pp.TotVCReceived=n0((Cb.pp||{}).totVC);
    /* optional registration / recognition particulars */
    if(bodYN(p.reg)==="Y"){
      pf(pp,"RegisterNum",st0(p.regNum).slice(0,25)||undefined);
      pf(pp,"DateRegisterUS29A",ISO(p.regDate));
    }
    if(bodYN(p.eci)==="Y") pf(pp,"DateOfRecognition",ISO(p.eciDate));
    /* optional auditor particulars (only when audited) */
    if(bodYN(p.audited)==="Y"){
      const au={};
      pf(au,"DateOfAudit",ISO(p.audDateFurnish));
      pf(au,"AuditorName",st0(p.audName).slice(0,125)||undefined);
      pf(au,"AuditorMemNo",st0(p.audMemNo).slice(0,6)||undefined);
      pf(au,"AudFrmName",st0(p.audFrmName).slice(0,125)||undefined);
      pf(au,"AudFrmRegNo",st0(p.audFrmRegNo).slice(0,8)||undefined);
      pf(au,"AudFrmPAN",st0(p.audFrmPAN).toUpperCase()||undefined);
      pf(au,"AudFrmAadhaar",st0(p.audFrmAadhaar).slice(0,12)||undefined);
      pf(au,"AuditDate",ISO(p.audDate));
      if(Object.keys(au).length) pp.AuditDetailsSchPP=au;
    }
    /* optional section-29C report particulars */
    if(bodYN(p.report29)==="Y"){
      pf(pp,"SubmissionDate",ISO(p.subDate));
      pf(pp,"Electioncommissionlist",BOD_ECI.some(x=>x[0]===st0(p.eciList))?st0(p.eciList):undefined);
    }
    /* optional aggregate bands */
    pf(pp,"AggregateVCUpto20000",n0(p.vcUpto20000)||undefined);
    pf(pp,"AggregateVC2000Cash",n0(p.vc2000Cash)||undefined);
    pf(pp,"AggregateVC2000OtherThanCash",n0(p.vc2000Other)||undefined);
    pf(pp,"AggregateVCMoreThan20000",n0(p.vcMore20000)||undefined);
    j.SchedulePP=pp;
  }

  /* ----- Schedule ET ----- */
  if(bodYN((B.et||{}).on)==="Y"){
    const e=B.et||{}, ce=(Cb.et||{}), et={};
    et.BooksOfAccMaintained=bodYN(e.books);
    et.VoluntaryContribution=bodYN(e.vc);
    et.RecordsMaintainedWithPAN=bodYN(e.records);
    et.AccountsAudited=bodYN(e.audited);
    et.ReportAsPerRule17CA=bodYN(e.report17CA);
    if(bodYN(e.audited)==="Y") pf(et,"AuditReportDate",ISO(e.audDate));
    /* VoluntaryContributionDtls — required object, all 8 integer leaves present */
    et.VoluntaryContributionDtls={
      OpeningBalance:n0(e.opBal),
      VoluntaryContributionDuringYr:n0(e.vcYr),
      TotalAfterVoluntaryContribution:n0(ce.totAfter),
      AmtDistToPoliticalParties:n0(e.amtDist),
      AmtSpentOnManagingAffairs:n0(ce.adminPermitted),
      Total:n0(ce.total),
      TotAmtExeUndSec13B:n0(ce.exe13B),
      ClosingBalance:n0(ce.closeBal)
    };
    j.ScheduleET=et;
  }

  /* ----- Schedule SH ----- */
  const uc={};
  BOD_SH_KEYS.forEach(k=>{ const def=BOD_SH[k];
    const rows=(get(def.path)||[]).map(r=>bodRowOut(r,def.cols)).filter(Boolean);
    if(rows.length) uc[def.sk]=rows; });
  if(Object.keys(uc).length) j.ScheduleSH={ShrhldngUnlistedCompany:uc};
}

/* ---- import (inverse; round-trip is identity) ---------------------- */
function impBodies(I){
  bodiesInit(); const read=[];
  if(!I) return read;

  const PP=I.SchedulePP;
  if(PP){
    const p=S.bodies.pp; p.on="Y";
    p.reg=PP.RegisterUS29A||""; p.regNum=PP.RegisterNum||"";
    if(PP.DateRegisterUS29A)p.regDate=dmy(PP.DateRegisterUS29A)||"";
    p.eci=PP.RecognizedByECI||"";
    if(PP.DateOfRecognition)p.eciDate=dmy(PP.DateOfRecognition)||"";
    p.books=PP.BooksOfAccMaintained||""; p.audited=PP.AccountsAudited||"";
    const au=PP.AuditDetailsSchPP||{};
    if(au.DateOfAudit)p.audDateFurnish=dmy(au.DateOfAudit)||"";
    p.audName=au.AuditorName||""; p.audMemNo=au.AuditorMemNo||"";
    p.audFrmName=au.AudFrmName||""; p.audFrmRegNo=au.AudFrmRegNo||"";
    p.audFrmPAN=au.AudFrmPAN||""; p.audFrmAadhaar=au.AudFrmAadhaar||"";
    if(au.AuditDate)p.audDate=dmy(au.AuditDate)||"";
    p.report29=PP.ReportUs29||"";
    if(PP.SubmissionDate)p.subDate=dmy(PP.SubmissionDate)||"";
    p.eciList=PP.Electioncommissionlist||"";
    p.vc=PP.VoluntaryContribution||""; p.vcElecBond=PP.VoluntaryContributionElecBond||"";
    p.donExc=PP.DonExceElectoralBond||"";
    p.vcUpto20000=PP.AggregateVCUpto20000!=null?PP.AggregateVCUpto20000:"";
    p.vc2000Cash=PP.AggregateVC2000Cash!=null?PP.AggregateVC2000Cash:"";
    p.vc2000Other=PP.AggregateVC2000OtherThanCash!=null?PP.AggregateVC2000OtherThanCash:"";
    p.vcMore20000=PP.AggregateVCMoreThan20000!=null?PP.AggregateVCMoreThan20000:"";
    read.push("Schedule PP (political party)");
  }

  const ET=I.ScheduleET;
  if(ET){
    const e=S.bodies.et; e.on="Y";
    e.books=ET.BooksOfAccMaintained||""; e.vc=ET.VoluntaryContribution||"";
    e.records=ET.RecordsMaintainedWithPAN||""; e.audited=ET.AccountsAudited||"";
    if(ET.AuditReportDate)e.audDate=dmy(ET.AuditReportDate)||"";
    e.report17CA=ET.ReportAsPerRule17CA||"";
    const d=ET.VoluntaryContributionDtls||{};
    e.opBal=d.OpeningBalance!=null?d.OpeningBalance:"";
    e.vcYr=d.VoluntaryContributionDuringYr!=null?d.VoluntaryContributionDuringYr:"";
    e.amtDist=d.AmtDistToPoliticalParties!=null?d.AmtDistToPoliticalParties:"";
    e.amtAdmin=d.AmtSpentOnManagingAffairs!=null?d.AmtSpentOnManagingAffairs:"";
    read.push("Schedule ET (electoral trust)");
  }

  const SH=I.ScheduleSH&&I.ScheduleSH.ShrhldngUnlistedCompany;
  if(SH){
    S.bodies.sh.on="Y";
    BOD_SH_KEYS.forEach(k=>{ const def=BOD_SH[k];
      if(Array.isArray(SH[def.sk])) set(def.path,SH[def.sk].map(r=>bodRowIn(r,def.cols))); });
    read.push("Schedule SH (unlisted company shareholding)");
  }
  return read;
}

/* ---- checks (section-local sanity; not the CBDT rule engine) ------- */
function chkBodies(){
  bodiesInit(); const out=[], B=S.bodies, Cb=(S.C.bodies||{});

  /* --- Schedule PP --- */
  if(bodYN((B.pp||{}).on)==="Y"){
    const p=B.pp||{};
    if(bodYN(p.reg)!=="Y")
      out.push({lvl:"warn",t:"Schedule PP",m:"A political party must be registered under section 29A of the RP Act, 1951 to claim the section 13A exemption.",sec:"bodies"});
    if(bodYN(p.reg)==="Y"&&!st0(p.regNum))
      out.push({lvl:"warn",t:"Schedule PP",m:"Registration u/s 29A is Yes — please give the registration number.",sec:"bodies"});
    if(bodYN(p.audited)==="Y"){
      if(st0(p.audMemNo)&&!/^[0-9]{6}$/.test(st0(p.audMemNo)))
        out.push({lvl:"err",t:"Schedule PP",m:"Membership No. of the auditor must be six digits.",sec:"bodies"});
      if(st0(p.audFrmRegNo)&&!/^[a-zA-Z0-9]{8}$/.test(st0(p.audFrmRegNo)))
        out.push({lvl:"err",t:"Schedule PP",m:"Firm registration No. must be eight characters.",sec:"bodies"});
      if(st0(p.audFrmPAN)&&!PAN_RE.test(st0(p.audFrmPAN).toUpperCase()))
        out.push({lvl:"err",t:"Schedule PP",m:"PAN of the auditor is not a valid PAN.",sec:"bodies"});
      if(st0(p.audFrmAadhaar)&&!AADH.test(st0(p.audFrmAadhaar)))
        out.push({lvl:"warn",t:"Schedule PP",m:"Aadhaar of the auditor should be a 12-digit number.",sec:"bodies"});
    }
    ["regDate","eciDate","audDateFurnish","audDate","subDate"].forEach(kk=>{
      if(st0(p[kk])&&!ISO(p[kk]))
        out.push({lvl:"err",t:"Schedule PP",m:"A date is not a valid "+DF+" date.",sec:"bodies"});
    });
    if(bodYN(p.report29)==="Y"&&!st0(p.eciList))
      out.push({lvl:"warn",t:"Schedule PP",m:"Report u/s 29C furnished = Yes — please select the Election Commission to whom it was submitted.",sec:"bodies"});
    if(bodYN(p.donExc)==="Y")
      out.push({lvl:"warn",t:"Schedule PP",m:"A donation over Rs.2,000 received otherwise than by account-payee instrument / electoral bond breaches section 13A(d).",sec:"bodies"});
  }

  /* --- Schedule ET --- */
  if(bodYN((B.et||{}).on)==="Y"){
    const e=B.et||{}, ce=(Cb.et||{});
    if(st0(e.audDate)&&!ISO(e.audDate))
      out.push({lvl:"err",t:"Schedule ET",m:"Date of the Form 10BC audit report is not a valid "+DF+" date.",sec:"bodies"});
    if(ce.adminOver)
      out.push({lvl:"warn",t:"Schedule ET",m:"Administrative spend exceeds the ceiling (5% of contributions, max "+RS(BOD_ADMIN_MAX)+"); it is capped to "+RS(ce.adminPermitted)+" on export.",sec:"bodies"});
    if(N(ce.totAfter)>0 && N(e.amtDist)<0.95*N(ce.totAfter))
      out.push({lvl:"warn",t:"Schedule ET",m:"Less than 95% of the total contributions (opening + received) was distributed to political parties, so no amount is eligible for exemption under section 13B.",sec:"bodies"});
    if(N(ce.total)>N(ce.totAfter))
      out.push({lvl:"warn",t:"Schedule ET",m:"Amounts applied (distributed + admin) exceed the total available; the closing balance is shown as nil.",sec:"bodies"});
  }

  /* --- Schedule SH --- */
  if(bodYN((B.sh||{}).on)==="Y"){
    BOD_SH_KEYS.forEach(k=>{ const def=BOD_SH[k], arr=get(def.path)||[];
      arr.forEach((r,i)=>{ r=r||{};
        if(!def.cols.some(c=>st0(r[c.k])!=="")) return;         /* skip wholly blank */
        const miss=[];
        def.cols.forEach(c=>{ if(c.req&&st0(r[c.k])==="") miss.push(c.h); });
        if(miss.length)
          out.push({lvl:"err",t:"Schedule SH · "+def.sk,m:"Row "+(i+1)+": please fill "+miss.join(", ")+".",sec:"bodies"});
        def.cols.forEach(c=>{ const v=st0(r[c.k]); if(!v)return;
          if(c.t==="pan"&&!PAN_RE.test(v.toUpperCase()))
            out.push({lvl:"err",t:"Schedule SH · "+def.sk,m:"Row "+(i+1)+": "+c.h+" is not a valid PAN.",sec:"bodies"});
          if(c.t==="date"&&!ISO(v))
            out.push({lvl:"err",t:"Schedule SH · "+def.sk,m:"Row "+(i+1)+": "+c.h+" must be a valid "+DF+" date.",sec:"bodies"});
        });
      });
    });
    if(bodCount()===0)
      out.push({lvl:"warn",t:"Schedule SH",m:"Marked as an unlisted company but no shareholder row is entered.",sec:"bodies"});
  }

  if(!out.length && (bodYN((B.pp||{}).on)==="Y"||bodYN((B.et||{}).on)==="Y"||bodYN((B.sh||{}).on)==="Y"))
    out.push({lvl:"ok",t:"Special-body disclosures",m:"Every check passes.",sec:"bodies"});
  return out;
}

/* ---- register (overrides the boot stub for id "bodies") ------------ */
reg({id:"bodies", t:"Political party, electoral trust & shareholding", ref:"Schedule PP · ET · SH",
  f:secBodies,
  s:()=>{ const C=S.C.bodies||{}; const parts=[];
    if(C.ppOn==="Y")parts.push("PP");
    if(C.etOn==="Y")parts.push("ET"+(C.et&&C.et.exe13B?" "+CR(C.et.exe13B):""));
    if(C.shOn==="Y"&&C.rows)parts.push(C.rows+" SH row"+(C.rows>1?"s":""));
    return parts.join(" · "); },
  eng:engBodies, exp:expBodies, imp:impBodies, chk:chkBodies, order:140, corder:30});

/* =====================================================================
   ITR-7 · Section "bp" — Business income (Schedule BP)
   Book: books/ITR-7/Schedule_BP.md  ·  schema block: CorpScheduleBP
   Reference model: forms/ITR-6/src/70_sec_bp.js — but ITR-7's BP is the
   LEANER corporate BP for a trust/institution, so the shape differs:
     - item 1 starts from the *Income and Expenditure account* surplus
       (ProfBfrTaxPL), not a company P&L;
     - the "income considered under other heads" group (item 3) carries
       House property / Capital gains / Other sources (dividend + other)
       and a single 115BBH line (3d = UnderSec115BBH);
     - item 4 is the single Section-44AE profit (PLUs44sChapXIIG) — the
       whole 44B/44BB/…/Ch-XII-G/rule-7-8/115B ladder of ITR-6 is gone;
     - item 21 is ONE key (Total33ABto35ABB) — the twelve 32AC…80-IA
       sub-lines collapse to the single total;
     - NO DPM/DOA/DEP/DCG/ESR/ICDS sub-schedules are owned here (ITR-7's
       section_map maps only CorpScheduleBP to `bp`): item 12i
       (DepreciationAllowUs32_1_ii) is a plain fed input, item 28
       (DebPLUs35ExcessAmt, the ESR excess) and item 32
       (DecProfIncLossAccICDSAdj, the ICDS decrease) are plain inputs;
     - the presumptive block (item 35) shows only Section 44AE;
     - Part C's 35AD(5) drop-down has the thirteen specified-business
       clauses INCLUDING the new (aj) semi-conductor wafer clause; the
       filed value is the clause CODE (schema pattern a|aa|…|aj|ak|b);
     - Part D adds the 115BBH income back: D = A36 + B40 + C46 + A3d.
   Excluded (book §6): the hidden trust-specific "Computation of income
   chargeable to tax under section 11(4)" part (rows 108-110) — it has no
   CorpScheduleBP schema key.

   Publishes for downstream seams (nothing else writes S.C.bp):
     - S.C.bp.total / .income / .d = D  (business-head total, = D48 of
       Schedule BP → Part B-TI item 10ii/7ii "Profits and gains of
       business or profession"; also the aggregate CYLA business figure);
     - S.C.bp.a.A36, S.C.bp.e.* (Table-E after-set-off speculative /
       specified income) for Schedule CYLA rows 1ii/1iii/1iv;
     - S.C.bp.siFeed = { "5BBHi": <item 3d> } — the 115BBH business income
       for Schedule SI (SecCode 5BBHi, enum §3 of the SI book). Part B-TI
       item 14 nets this special-rate income out of the slab base, so the
       full D in .total is not double-taxed.
   Compute order 42 (corder). Screen order 90.
   ===================================================================== */

/* ---- state ---- */
S.bp = S.bp || {
  /* Part A — items 1-6 */
  pbt:0,                 /* 1  Profit before tax as per Income & Expenditure a/c (signed) */
  nplSpec:0,             /* 2a net P/L speculative included in 1 (signed) */
  nplSpecified:0,        /* 2b net P/L specified 35AD included in 1 (signed) */
  a3a:0,a3b:0,           /* 3a House property, 3b Capital gains */
  a3ci:0,a3cii:0,        /* 3c(i) dividend, 3c(ii) other than dividend (3c = ci+cii) */
  a3d:0,                 /* 3d u/s 115BBH (net of cost of acquisition) */
  s44AE:0,               /* 4  profit included in 1 referred to in s.44AE (signed) */
  a5a:0,a5b:0,           /* 5a firm share, 5b AOP/BOI share */
  divExempt:0,           /* 5c fixed Dividend-income row */
  othExempt:[],          /* 5c other exempt rows [{name,amt}] */
  /* Part A — items 7-13 */
  e7a:0,e7b:0,e7c:0,e7d:0,   /* 7a HP, 7b CG, 7c OS, 7d 115BBH (expenses under other heads) */
  depDebPL:0,            /* 11 depreciation & amortization debited to I&E a/c */
  dep32ii:0,            /* 12i  depreciation allowable u/s 32(1)(ii) & (iia) (fed) */
  dep32i:0,             /* 12ii depreciation allowable u/s 32(1)(i) — power sector own comp. */
  /* Part A — items 14-24 (additions) */
  d14:0,d15:0,d16:0,d17:0,d18:0,d19:0,   /* 14 s36, 15 s37, 16 s40, 17 s40A, 18 s43B, 19 s23 MSMED */
  d20:0,                 /* 20 deemed income u/s 41 */
  d21:0,                 /* 21 deemed income 32AC/32AD/33AB/…/72A (single total key) */
  d22:0,                 /* 22 deemed income u/s 43CA */
  d23:0,                 /* 23 any other item of addition u/s 28-44DB */
  d24:0,                 /* 24 any other income not in I&E / expense not allowable */
  /* Part A — items 26-32 (deductions) */
  k26:0,                 /* 26 deduction u/s 32(1)(iii) */
  k27:0,                 /* 27 amount allowable u/s 32AC */
  k28:0,                 /* 28 s35/35CCC/35CCD in excess of amount debited (ESR excess, fed) */
  k29:0,                 /* 29 s40 disallowed earlier, now allowable */
  k30:0,                 /* 30 s43B disallowed earlier, now allowable */
  k31:0,                 /* 31 any other amount allowable as deduction */
  k32:0,                 /* 32 decrease in profit on account of ICDS / stock valuation (fed) */
  /* Part A — item 35 presumptive */
  dp44AE:0,              /* 35i Section 44AE deemed profit */
  /* Part B — speculative */
  specAdd:0,specDed:0,   /* 38 additions, 39 deductions (37 = 2a) */
  /* Part C — specified 35AD */
  spAdd:0,spDed:0,sp35AD:0,   /* 42 additions, 43 deductions, 45 deduction u/s 35AD(1) */
  clause:["",""]         /* 35AD(5) clause drop-down (two rows) */
};

SEED["bp.othExempt"] = SEED["bp.othExempt"] || {name:"",amt:0};

/* ---- the 35AD(5) clause list — [code,label] (book §7.4 + schema pattern
   a|aa|ab|ac|ad|ae|af|ag|ah|ai|aj|ak|b; the filed value is the CODE) ---- */
const BP_35AD5 = [
 ["a","(a) laying and operating a cross-country natural gas pipeline network for distribution, including storage facilities being an integral part of such network"],
 ["aa","(aa) building and operating a new hotel of two-star or above category as classified by the Central Government"],
 ["ab","(ab) building and operating a new hospital with at least one hundred beds for patients"],
 ["ac","(ac) developing and building a housing project under a scheme for slum redevelopment or rehabilitation"],
 ["ad","(ad) developing and building a housing project under a scheme for affordable housing"],
 ["ae","(ae) new plant or newly installed capacity in an existing plant for production of fertilizer"],
 ["af","(af) setting up and operating an inland container depot or a container freight station"],
 ["ag","(ag) bee-keeping and production of honey and beeswax"],
 ["ah","(ah) setting up and operating a warehousing facility for storage of sugar"],
 ["ai","(ai) laying and operating a slurry pipeline for the transportation of iron ore"],
 ["aj","(aj) setting up and operating a semi-conductor wafer fabrication manufacturing unit notified by the Board"],
 ["ak","(ak) developing or operating and maintaining any infrastructure facility"],
 ["b","(b) all other cases not falling under any of the above clauses"]
];

/* =====================================================================
   ENGINE
   ===================================================================== */
function engBp(){
  const B=S.bp||{};
  const nb=k=>N(B[k]), sgb=k=>sg(B[k]);

  /* ================= Part A ================= */
  const K1   = sg(nb("pbt"));                          /* 1 */
  const _2a  = sgb("nplSpec");                         /* 2a */
  const _2b  = sgb("nplSpecified");                    /* 2b */
  const _3c  = R(nb("a3ci")+nb("a3cii"));              /* 3c = 3ci + 3cii */
  const a3d  = R(nb("a3d"));                           /* 3d 115BBH */
  const _4   = sgb("s44AE");                           /* 4  PLUs44sChapXIIG (44AE, signed) */
  const othExemptTot = R((B.othExempt||[]).reduce((a,r)=>a+N(r.amt),0));
  const _5c  = R(nb("divExempt")+othExemptTot);        /* 5c OthExempInc */
  const _5d  = R(nb("a5a")+nb("a5b")+_5c);             /* 5d TotExempInc */
  const _6   = R(K1 - _2a - _2b - nb("a3a") - nb("a3b") - _3c - a3d - _4 - _5d); /* 6 balance (signed) */
  const _9   = R(nb("e7a")+nb("e7b")+nb("e7c")+nb("e7d"));   /* 9 TotExpDebPL */
  const _10  = R(_6 + _9);                             /* 10 AdjustedPL (6 + expenses added back) */
  const _12iii = R(nb("dep32ii")+nb("dep32i"));       /* 12iii TotDeprAllowITAct */
  const _13  = R(_10 + nb("depDebPL") - _12iii);       /* 13 AdjustPLAfterDepr (signed) */
  const addBack = R(nb("d14")+nb("d15")+nb("d16")+nb("d17")+nb("d18")+nb("d19")+
    nb("d20")+nb("d21")+nb("d22")+nb("d23")+nb("d24"));      /* 14…24 */
  const _25  = R(_13 + addBack);                       /* 25 TotAfterAddToPLDeprOthSpecInc (signed) */
  const _33  = R(nb("k26")+nb("k27")+nb("k28")+nb("k29")+nb("k30")+nb("k31")+nb("k32")); /* 33 TotDeductionAmts */
  const _34  = R(_25 - _33);                           /* 34 PLAftAdjDedBusOthThanSpec (signed) */
  const dp44AE = R(nb("dp44AE"));                      /* 35i Section 44AE */
  const _35tot = dp44AE;                               /* 35 TotDeemedProfitBusUs */
  const _36  = R(_34 + _35tot);                        /* 36 NetPLAftAdjBusOthThanSpec (signed) */
  const A36  = _36;                                    /* A36 NetPLBusOthThanSpec7A7B7C (no rule 7A/7B/8 in ITR-7) */

  /* ================= Part B — speculative ================= */
  const _37  = _2a;                                    /* 37 = 2a NetPLFrmSpecBus */
  const _38  = R(nb("specAdd")), _39 = R(nb("specDed"));
  const B40  = R(_37 + _38 - _39);                     /* B40 AdjustedPLFrmSpecuBus (signed) */

  /* ================= Part C — specified 35AD ================= */
  const _41  = _2b;                                    /* 41 = 2b NetPLFrmSpecifiedBus */
  const _42  = R(nb("spAdd")), _43 = R(nb("spDed"));
  const _44  = R(_41 + _42 - _43);                     /* 44 ProfitLossSpecifiedBusiness (signed) */
  const _45  = R(nb("sp35AD"));                        /* 45 DedSec35AD */
  const C46  = R(_44 - _45);                           /* C46 ProfitLossSpecifiedBusFinal (signed) */

  /* ================= Part D ================= */
  const D    = R(A36 + Math.max(0,B40) + Math.max(0,C46) + a3d);  /* D = A36 + B40 + C46 + A3d */

  /* ================= Part E — intra-head set-off ================= */
  const lossSetOff  = Math.abs(Math.min(0, A36));      /* (i) business loss to set off */
  const specInc     = Math.max(0, B40);                /* (ii) speculative income */
  const specifiedInc= Math.max(0, C46);                /* (iii) specified income */
  let rem = lossSetOff;
  const specSet      = Math.min(rem, specInc);      rem -= specSet;
  const specifiedSet = Math.min(rem, specifiedInc); rem -= specifiedSet;
  const totSet    = R(specSet + specifiedSet);         /* (iv) TotLossSetOffOnBus */
  const lossRemain= R(Math.max(0, lossSetOff - totSet)); /* (v) LossRemainSetOffOnBus */

  /* ================= Schedule-SI feed (special-rate BP head) =================
     Only 115BBH (item 3d) is a special-rate business head in ITR-7's BP.
     si.js supplies the 30% rate from its own table; the amount is reused
     from the ladder above and emitted only when positive. */
  const siFeed = {};
  if(a3d>0) siFeed["5BBHi"] = a3d;                     /* 115BBH(i) business income */

  S.C.bp = {
    on:true,
    a:{K1,_2a,_2b,_3c,a3d,_4,_5c,_5d,_6,_9,_10,_12iii,_13,_25,_33,_34,dp44AE,_35tot,_36,A36},
    b:{_37,_38,_39,B40},
    c:{_41,_42,_43,_44,_45,C46},
    d:D,
    e:{lossSetOff,specInc,specifiedInc,specSet,specifiedSet,totSet,lossRemain},
    siFeed:siFeed,     /* special-rate BP heads for Schedule SI (S.C.bp.siFeed) */
    total:D,           /* business-head total for CYLA / Part B-TI (= D48) */
    income:D
  };
}

/* =====================================================================
   RENDERER
   ===================================================================== */
function bpRow(label,right,ref,o){o=o||{};o.ref=ref;return row(label,right,o);}
function bpInpN(p){return inp(p,{n:1});}

function secBp(){
  const A=(S.C.bp&&S.C.bp.a)||{}, Bp=(S.C.bp&&S.C.bp.b)||{}, Cp=(S.C.bp&&S.C.bp.c)||{}, E=(S.C.bp&&S.C.bp.e)||{};
  let h="";
  h+=formNote("Schedule BP turns the surplus of the Income &amp; Expenditure account into taxable business "+
    "income through a long adjustment ladder — head transfers (3, 7), exempt income (5), depreciation (11-13), "+
    "additions (14-24) and deductions (26-32) to business income (34), then presumptive income (35) and the "+
    "Part-A result (A36). Speculative (Part B) and specified 35AD business (Part C) are computed separately, "+
    "and Part D is the head total (A36 + B40 + C46 + A3d). Most rows carry the figures as they appear in the "+
    "accounts, Part A-OI and the depreciation summary; the free entries are the 5c exempt-income table and the "+
    "35AD(5) clause. Every green cell is computed.");

  /* ---- Part A ---- */
  h+=sub("A — Business other than speculative and specified business");
  h+=bpRow("1  Profit before tax as per Income and Expenditure account (as applicable)",bpInpN("bp.pbt"),"A1",{hint:"enter −ve for a deficit"});
  h+=bpRow("2a  Net profit/loss from speculative business included in 1",bpInpN("bp.nplSpec"),"A2a",{hint:"enter −ve for a loss"});
  h+=bpRow("2b  Net profit/loss from specified business u/s 35AD included in 1",bpInpN("bp.nplSpecified"),"A2b",{hint:"enter −ve for a loss"});
  h+=sub("3 — Income/receipts credited to I&E account considered under other heads / chargeable u/s 115BBH");
  h+=bpRow("3a  House property",bpInpN("bp.a3a"),"A3a",{ind:1});
  h+=bpRow("3b  Capital Gains",bpInpN("bp.a3b"),"A3b",{ind:1});
  h+=bpRow("3c(i)  Dividend income",bpInpN("bp.a3ci"),"A3ci",{ind:1});
  h+=bpRow("3c(ii)  Other than dividend income",bpInpN("bp.a3cii"),"A3cii",{ind:1});
  h+=bpRow("3c  Other sources (3c(i) + 3c(ii))",cell(A._3c),"A3c",{ind:1});
  h+=bpRow("3d  u/s 115BBH (net of cost of acquisition, if any)",bpInpN("bp.a3d"),"A3d",{ind:1});
  h+=bpRow("4  Profit or loss included in 1 which is referred to in section 44AE",bpInpN("bp.s44AE"),"A4",{hint:"enter −ve for a loss"});
  h+=sub("5 — Income credited to I&E account (included in 1) which is exempt");
  h+=bpRow("5a  Share of income from firm(s)",bpInpN("bp.a5a"),"A5a",{ind:1});
  h+=bpRow("5b  Share of income from AOP/BOI",bpInpN("bp.a5b"),"A5b",{ind:1});
  h+=bpRow("5c  Dividend income (exempt)",bpInpN("bp.divExempt"),"A5c",{ind:1});
  h+=grid("bp.othExempt",[{k:"name",h:"Nature of other exempt income",t:"txt",w:"60%"},{k:"amt",h:"Amount",t:"num",w:"30%"}],
    (S.bp&&S.bp.othExempt)||[],{empty:"No other exempt income.",add:"Add exempt income"});
  h+=bpRow("5c  Total exempt income credited (dividend + other)",cell(A._5c),"A5cTot",{ind:1});
  h+=bpRow("5d  Total exempt income (5a + 5b + 5c)",cell(A._5d),"A5d");
  h+=bpRow("6  Balance (1 − 2a − 2b − 3a − 3b − 3c − 3d − 4 − 5d)",cell(A._6),"A6");
  h+=sub("7 — Expenses debited to I&E account considered under other heads / related to 115BBH");
  h+=bpRow("7a  House property",bpInpN("bp.e7a"),"A7a",{ind:1});
  h+=bpRow("7b  Capital Gains",bpInpN("bp.e7b"),"A7b",{ind:1});
  h+=bpRow("7c  Other sources",bpInpN("bp.e7c"),"A7c",{ind:1});
  h+=bpRow("7d  u/s 115BBH (other than cost of acquisition)",bpInpN("bp.e7d"),"A7d",{ind:1});
  h+=bpRow("9  Total (7a + 7b + 7c + 7d)",cell(A._9),"A9");
  h+=bpRow("10  Adjusted profit or loss (6 + 8)",cell(A._10),"A10");
  h+=bpRow("11  Depreciation and amortization debited to I&E account",bpInpN("bp.depDebPL"),"A11");
  h+=bpRow("12i  Depreciation allowable u/s 32(1)(ii) & 32(1)(iia)",bpInpN("bp.dep32ii"),"A12i",{ind:1,hint:"from the depreciation summary"});
  h+=bpRow("12ii  Depreciation allowable u/s 32(1)(i) (own computation, Appendix-IA; power sector)",bpInpN("bp.dep32i"),"A12ii",{ind:1});
  h+=bpRow("12iii  Total (12i + 12ii)",cell(A._12iii),"A12iii");
  h+=bpRow("13  Profit/loss after adjustment for depreciation (10 + 11 − 12iii)",cell(A._13),"A13");
  h+=sub("14–24 — Amounts to be added back");
  [["d14","14 disallowable u/s 36"],["d15","15 disallowable u/s 37"],["d16","16 disallowable u/s 40"],
   ["d17","17 disallowable u/s 40A"],["d18","18 disallowable u/s 43B (of the previous year)"],
   ["d19","19 interest disallowable u/s 23 of the MSMED Act, 2006"],["d20","20 deemed income u/s 41"],
   ["d21","21 deemed income u/s 32AC/32AD/33AB/33ABA/35ABA/35ABB/35AC/40A(3A)/33AC/72A"],
   ["d22","22 deemed income u/s 43CA"],["d23","23 any other item of addition u/s 28 to 44DB"],
   ["d24","24 any other income not in I&E account / any other expense not allowable"]].forEach(x=>
     h+=bpRow(x[1],bpInpN("bp."+x[0]),"",{ind:1}));
  h+=bpRow("25  Total (13 + 14 … 24)",cell(A._25),"A25");
  h+=sub("26–32 — Amounts to be deducted");
  [["k26","26 deduction allowable u/s 32(1)(iii)"],["k27","27 amount allowable as deduction u/s 32AC"],
   ["k28","28 deduction u/s 35/35CCC/35CCD in excess of the amount debited to I&E account"],
   ["k29","29 s.40 disallowed in an earlier year, now allowable"],
   ["k30","30 s.43B disallowed in an earlier year, now allowable"],
   ["k31","31 any other amount allowable as deduction"],
   ["k32","32 decrease in profit on account of ICDS adjustments / deviation in stock valuation"]].forEach(x=>
     h+=bpRow(x[1],bpInpN("bp."+x[0]),"",{ind:1}));
  h+=bpRow("33  Total (26 … 32)",cell(A._33),"A33");
  h+=bpRow("34  Income (25 − 33)",cell(A._34),"A34");
  h+=sub("35 — Profits and gains deemed to be under presumptive section");
  h+=bpRow("35i  Section 44AE",bpInpN("bp.dp44AE"),"A35i",{ind:1});
  h+=bpRow("35  Total deemed profit",cell(A._35tot),"A35");
  h+=bpRow("36  Net profit/loss other than speculative and specified business (34 + 35)",cell(A._36),"A36pre");
  h+=bpRow("A36  Net profit/loss after applying rule 7A/7B/8, if applicable",cell(A.A36),"A36",{hint:"if loss → 2i of Schedule CYLA / CFL"});

  /* ---- Part B ---- */
  h+=sub("B — Speculative business");
  h+=bpRow("37  Net profit/loss from speculative business as per I&E account (item 2a)",cell(Bp._37),"B37");
  h+=bpRow("38  Additions in accordance with section 28 to 44DB",bpInpN("bp.specAdd"),"B38");
  h+=bpRow("39  Deductions in accordance with section 28 to 44DB",bpInpN("bp.specDed"),"B39");
  h+=bpRow("B40  Income from speculative business (37 + 38 − 39)",cell(Bp.B40),"B40",{hint:"if loss → Schedule CFL speculative line"});

  /* ---- Part C ---- */
  h+=sub("C — Specified business under section 35AD");
  h+=bpRow("41  Net profit/loss from specified business as per I&E account (item 2b)",cell(Cp._41),"C41");
  h+=bpRow("42  Additions in accordance with section 28 to 44DB",bpInpN("bp.spAdd"),"C42");
  h+=bpRow("43  Deductions u/s 28 to 44DB (other than 35AD / 32 or 35 on which 35AD is claimed)",bpInpN("bp.spDed"),"C43");
  h+=bpRow("44  Profit/loss from specified business (41 + 42 − 43)",cell(Cp._44),"C44");
  h+=bpRow("45  Deductions in accordance with section 35AD(1)",bpInpN("bp.sp35AD"),"C45");
  h+=bpRow("C46  Income from specified business (44 − 45)",cell(Cp.C46),"C46",{hint:"if loss → Schedule CFL specified line"});
  h+=bpRow("Relevant clause of s.35AD(5) (row 1)",sel("bp.clause.0",BP_35AD5),"35AD(5)");
  h+=bpRow("Relevant clause of s.35AD(5) (row 2)",sel("bp.clause.1",BP_35AD5),"35AD(5)");

  /* ---- Part D & E ---- */
  h+=sub("D & E — Chargeable income and intra-head set off");
  h+=bpRow("D  Income chargeable under 'Profits and gains from Business or profession' (A36 + B40 + C46 + A3d)",cell(S.C.bp?S.C.bp.d:0),"D");
  h+=bpRow("E(i)  Business loss of the current year to be set off",cell(E.lossSetOff),"E i");
  h+=bpRow("E(ii)  Income from speculative business",cell(E.specInc),"E ii",{v2:cell(E.specSet)});
  h+=bpRow("E(iii)  Income from specified business",cell(E.specifiedInc),"E iii",{v2:cell(E.specifiedSet)});
  h+=bpRow("E(iv)  Total loss set off (ii + iii)",cell(E.totSet),"E iv");
  h+=bpRow("E(v)  Loss remaining after set off (i − iv)",cell(E.lossRemain),"E v");
  h+=note("Include the income of the specified persons referred to in Schedule SPI while computing income under this head. "+
    "The 115BBH business income (item 3d) is carried to Schedule SI at the 30% rate; Part B-TI nets it out of the slab base.");
  return h;
}

/* =====================================================================
   EXPORT — writes block CorpScheduleBP
   ===================================================================== */
function expBp(j){
  const A=(S.C.bp&&S.C.bp.a)||{}, Bp=(S.C.bp&&S.C.bp.b)||{}, Cp=(S.C.bp&&S.C.bp.c)||{}, E=(S.C.bp&&S.C.bp.e)||{};
  const B=S.bp||{};
  const P="CorpScheduleBP.BusinessIncOthThanSpec.";

  /* ---- Part A: items 1-6 ---- */
  put(j,P+"ProfBfrTaxPL",sg(A.K1));
  put(j,P+"NetPLFromSpecBus",sg(A._2a));
  put(j,P+"NetProfLossSpecifiedBus",sg(A._2b));
  put(j,P+"IncRecCredPLOthHeadDtls.HouseProperty",n0(B.a3a));

/* =====================================================================
   CHECKS — this section's own screen validations (not the dept rules)
   ===================================================================== */
function chkBp(){
  const out=[];
  const B=S.bp||{};
  /* 12ii power-sector depreciation */
  if(N(B.dep32i))
    out.push({lvl:"warn",t:"Verify 32(1)(i) depreciation",m:"Depreciation u/s 32(1)(i) (12ii) is allowable only for a power-sector business.",sec:"bp"});
  /* 5c other-exempt nature special characters (nonEmptyString leaves reject < > &) */
  if((B.othExempt||[]).some(r=>/[<>&]/.test(st0(r.name))))
    out.push({lvl:"err",t:"Invalid character in 5c nature",m:"The nature of exempt income at 5c cannot contain < > or &.",sec:"bp"});
  /* 35AD(5) clause not selected twice */
  const cl=(B.clause||[]).filter(c=>st0(c));
  if(cl.length===2 && cl[0]===cl[1])
    out.push({lvl:"err",t:"Duplicate 35AD(5) clause",m:"The same clause of sub-section (5) of section 35AD cannot be selected more than once.",sec:"bp"});
  /* a 35AD deduction (item 45) without a clause selected */
  if(N(B.sp35AD) && !cl.length)
    out.push({lvl:"warn",t:"35AD(5) clause missing",m:"A deduction u/s 35AD(1) is claimed but no clause of section 35AD(5) is selected.",sec:"bp"});
  /* income summary */
  if(S.C.bp){
    const d=N(S.C.bp.income);
    if(d<0)out.push({lvl:"ok",t:"Business loss",m:RS(-d)+" goes to Schedule CYLA / CFL for set off.",sec:"bp"});
    else if(d>0)out.push({lvl:"ok",t:"Business income",m:RS(d)+" chargeable under Profits and gains from Business or profession.",sec:"bp"});
  }
  return out;
}

   exceeds actual consideration by more than 10% (IF(sdv>1.1*cons,sdv,cons)) */
function v50C(cons,sdv){cons=N(cons);sdv=N(sdv);
  return {value:(sdv>cons*1.10?sdv:cons),safe:!(sdv>cons*1.10)};}

/* one land/building property — A1 (STCG) or B1 (LTCG); a trust gets NO
   indexation (schema has no indexed-cost fields), so the two are one shape. */
function engLand(p){
  const isLT = p.lt==="Long";
  const c50=v50C(p.cons,p.sdv);                            /* aiii */
  const biv=N(p.cost)+N(p.improve)+N(p.exp);               /* biv (bi+bii+biii) */
  const c=R(c50.value-biv);                                /* c = aiii − biv */
  const d=p.ded||{};
  const dedTot = isLT ? (N(d.s54D)+N(d.s54EC)+N(d.s54G)+N(d.s54GA))   /* B1: 54D/54EC/54G/54GA */
                      : (N(d.s54G)+N(d.s54GA));                        /* A1: 54G/54GA only */
  const e = R(c - Math.min(dedTot,Math.max(0,c)));         /* A1e / B1e (floor deduction at a positive balance) */
  return {isLT,value:c50.value,safe:c50.safe,biv:R(biv),c,dedTot:R(dedTot),e,gain:e};
}

/* an aggregate head carrying the section-48 block (A3i, A3ii, A5, A6, B3, B8, NR B6) */
function engAgg(o,opts){o=o||{};opts=opts||{};
  let cons=0,c50ca=0;
  if(opts.unq){c50ca=Math.max(N(o.unqCons),N(o.unqFmv)); cons=c50ca+N(o.othCons);} /* 50CA MAX (ic) */
  else cons=N(o.cons);
  const biv=N(o.cost)+N(o.improve)+N(o.exp);               /* biv */
  const c=R(cons-biv);                                     /* c = balance */
  const l94=opts.loss94?N(o.loss94):0;                     /* 94(7)/94(8) disallowed loss (3id/6d) */
  const dcg=opts.dcg?N(o.dcg):0;                           /* A6e deemed depreciable (Sch DCG item 6) */
  const ded=(opts.deds||[]).reduce((a,k)=>a+N((o.ded||{})[k]),0);
  const e=R(c+l94+dcg-Math.min(ded,Math.max(0,c+l94+dcg)));
  return {cons:R(cons),c50ca:R(c50ca),biv:R(biv),c,l94:R(l94),dcg:R(dcg),ded:R(ded),e,gain:e};}

/* slump sale — A2 (FVC = higher of Rule 11UAE(2)/(3); no deduction) and
   B2 (deduction u/s 54EC only) */
function engSlump(o,lt){o=o||{};const v=Math.max(N(o.fmv2),N(o.fmv3));
  const c=R(v-N(o.networth));                              /* 2c = 2aiii − 2b */
  const ded=lt?N((o.ded||{}).s54EC):0;                     /* B2: 54EC only (DeductionUnderSec54); A2: none */
  const gain=R(c-Math.min(ded,Math.max(0,c)));
  return {value:R(v),c,ded:R(ded),gain};}

/* A9 / B11 DTAA relief: per row the applicable rate is the lower of the treaty
   rate and the I.T.-Act rate; a row the treaty makes fully exempt (applicable
   rate 0) is "not chargeable to tax", the rest is taxable at the special DTAA
   rate. */
function engDTAA(rows){let notTax=0,special=0,rate="";
  (rows||[]).forEach(r=>{const amt=N(r.amt);
    const tr=(r.treaty===""||r.treaty==null)?null:N(r.treaty);
    const it=(r.itact===""||r.itact==null)?null:N(r.itact);
    let appl; if(tr!=null&&it!=null)appl=Math.min(tr,it); else appl=(tr!=null?tr:(it!=null?it:0));
    r._appl=appl;
    if(appl<=0)notTax+=amt; else {special+=amt; if(rate==="")rate=appl;}});
  return {notTax:R(notTax),special:R(special),rate};}

/* the toggle is stored as a string "true"/"false" by the <select>, or a
   boolean by import — normalise both */
function cgOn(){const v=(S.cg||{}).on;return v===true||v==="true"||v==="Yes";}

const KEYS=["st20","st30","stApp","stDTAA","lt125","ltDTAA"];
const Z=()=>({st20:0,st30:0,stApp:0,stDTAA:0,lt125:0,ltDTAA:0});

function engCg(){
  const C=S.cg;
  const nri=isNr();
  const vcg=vdaCG();
  if(!cgOn()){
    S.C.cg={on:false,nri:nri,A:{total:0},B:{total:0},C1:0,C2:vcg,C3:vcg,
      gain:Z(),loss:Z(),used:Z(),absorbed:Z(),after:Z(),totSet:Z(),remain:Z(),matrix:{},F:{},
      vda:{cg:vcg},buckets:{},siFeed:vcg>0?{"5BBHii":vcg}:{},dedD:{},dedTotal:0,cflSTCL:0,cflLTCL:0,
      shortTerm:0,longTerm:0,total:vcg,income:vcg};
    return;
  }

  /* ---- Part A · short-term ---------------------------------------- */
  const land={st:[],lt:[]};
  (C.land||[]).forEach((p,i)=>{const r=engLand(p);p._=r;p._i=i;(r.isLT?land.lt:land.st).push(p);});
  const A={};
  A.a1  = R(land.st.reduce((a,p)=>a+p._.gain,0));           /* A1e ΣA1e */
  A.a2  = engSlump(C.a2,false);                            /* A2c */
  A.a3i = engAgg(C.a3i,{loss94:1});                        /* A3ie (111A) */
  A.a3ii= engAgg(C.a3ii,{loss94:1});                       /* A3iie (115AD(1)(b)(ii) FII) */
  A.a4  = {a:R(N((C.a4||{}).sttPaid)), b:R(N((C.a4||{}).sttNot))};   /* A4a/A4b (NR) */
  A.a4.gain = R(A.a4.a + A.a4.b);
  A.a5  = engAgg(C.a5,{unq:1,loss94:1});                    /* A5e (FII 115AD securities, NR) */
  A.a6  = engAgg(C.a6,{unq:1,loss94:1,dcg:1,deds:["s54G","s54GA"]}); /* A6g */
  const a7t=((C.a7&&C.a7.deem)||[]).reduce((a,x)=>a+N(x.unused),0)+N((C.a7||{}).other);
  A.a7  = {gain:R(a7t)};                                    /* A7 */
  const a8=C.a8||{};
  A.a8  = {gain:R(N(a8.r20)+N(a8.r30)+N(a8.rApp))};         /* A8 */
  A.a9  = engDTAA(C.a9);                                    /* A9a/A9b (NR DTAA) */
  A.aA  = {loss:R((C.aA||[]).reduce((a,x)=>a+N(x.amt),0))}; /* A(A) buy-back STCL */
  /* A10 = A1e+A2c+A3ie+A3iie+A4a+A4b+A5e+A6g+A7+A8−A9a+A(A) (A4/A5 are 0 for a resident) */
  A.total=R(A.a1+A.a2.gain+A.a3i.gain+A.a3ii.gain+A.a4.gain+A.a5.gain+A.a6.gain+A.a7.gain+A.a8.gain-A.a9.notTax-A.aA.loss);

  /* ---- Part B · long-term ----------------------------------------- */
  const B={};
  B.b1 = R(land.lt.reduce((a,p)=>a+p._.gain,0));            /* B1g ΣB1e */
  B.b2 = engSlump(C.b2,true);                              /* B2e */
  B.b3 = engAgg(C.b3,{});                                  /* B3c (112(1) listed sec/ZCB) */
  B.b4 = {a:R(N((C.b4||{}).amt)), gain:R(N((C.b4||{}).amt))};        /* B4 = SaleOfEquityShareUs112AAmt */
  {const b5g=N((C.b5||{}).gain);
    B.b5={without:R(b5g), gain:R(b5g)};}                   /* B5 (NR) LTCG without indexation */
  B.b6 = {rows:(C.b6||[]).map(r=>engAgg(r,{unq:1}))};       /* B6 (NR) */
  B.b6.gain=R(B.b6.rows.reduce((a,x)=>a+x.gain,0));
  B.b7 = nri?{a:R(N((C.b7||{}).amt)), gain:R(N((C.b7||{}).amt))}:{a:0,gain:0};   /* B7 = NRISaleOfEquityShareUs112AAmt (NR) */
  B.b8 = engAgg(C.b8,{unq:1,deds:["s54D","s54G","s54GA"]}); /* B8e */
  const b9t=((C.b9&&C.b9.deem)||[]).reduce((a,x)=>a+N(x.unused),0)+N((C.b9||{}).other);
  B.b9 = {gain:R(b9t)};                                     /* B9 deemed LTCG */
  const b10=C.b10||{};
  B.b10= {gain:R(N(b10.r125a)+N(b10.r125o))};               /* B10 pass-through LTCG */
  B.b11= engDTAA(C.b11);                                    /* B11a/B11b (NR DTAA) */
  B.bA = {loss:R(N((C.bA||{}).amt))};                       /* B(A) buy-back LTCL @12.5% */
  /* B12 = B1g+B2e+B3c+B4+B5+B6c+B7+B8e+B9+B10−B11a+B(A) (B5/B6/B7 are 0 for a resident) */
  B.total=R(B.b1+B.b2.gain+B.b3.gain+B.b4.gain+B.b5.gain+B.b6.gain+B.b7.gain+B.b8.gain+B.b9.gain+B.b10.gain-B.b11.notTax-B.bA.loss);

  /* ---- Part E · set-off matrix on the six rate-slots -------------- */
  /* Composition (CG book §6, live Table E rows 474-485):
     20%   = A3ie + A3iie + A4a + A8@20                        − STL20
     30%   = A5e + A8@30                                       − STL30
     app.  = A1e + A2c + A4b + A6g + A7 + A8@app               − STLAR
     DTAA  = A9b
     12.5% = B1g+B2e+B3c+B4+B5+B6c+B7+B8e+B9+B10               − B(A)
     LTDTAA= B11b   (A4/A5/B5/B6/B7 are 0 for a resident)                */
  const bbAt=code=>R((C.aA||[]).filter(x=>(x.rate||"STL20")===code).reduce((a,x)=>a+N(x.amt),0));
  const E={
    st20:R(A.a3i.gain+A.a3ii.gain+A.a4.a+N(a8.r20)-bbAt("STL20")),
    st30:R(A.a5.gain+N(a8.r30)-bbAt("STL30")),
    stApp:R(A.a1+A.a2.gain+A.a4.b+A.a6.gain+A.a7.gain+N(a8.rApp)-bbAt("STLAR")),
    stDTAA:R(A.a9.special),
    lt125:R(B.b1+B.b2.gain+B.b3.gain+B.b4.gain+B.b5.gain+B.b6.gain+B.b7.gain+B.b8.gain+B.b9.gain+B.b10.gain-B.bA.loss),
    ltDTAA:R(B.b11.special)};
  const gain={},loss={},used={},absorbed={},matrix={};
  KEYS.forEach(k=>{gain[k]=Math.max(0,E[k]);loss[k]=Math.max(0,-E[k]);used[k]=0;absorbed[k]=0;matrix[k]={};});
  const isLong=k=>k.charAt(0)==="l";
  if(C.editE && C.Eover){                                   /* row 486 "Do you want to edit" override */
    KEYS.forEach(gk=>KEYS.forEach(lk=>{const v=N(((C.Eover[gk]||{})[lk]));
      if(v>0){matrix[gk][lk]=v;absorbed[gk]+=v;used[lk]+=v;}}));
  } else {
    /* auto set-off: a STCL sets off any CG; a LTCL sets off only LTCG (Part E rule) */
    KEYS.forEach(lk=>{if(!loss[lk])return;let avail=loss[lk];
      KEYS.forEach(gk=>{if(avail<=0||gk===lk||!gain[gk])return;
        if(isLong(lk)&&!isLong(gk))return;
        const u=Math.min(avail,gain[gk]-absorbed[gk]);if(u<=0)return;
        matrix[gk][lk]=(matrix[gk][lk]||0)+u;absorbed[gk]+=u;used[lk]+=u;avail-=u;});});
  }
  const after={},totSet={},remain={};let C1=0;
  KEYS.forEach(k=>{after[k]=R(gain[k]-absorbed[k]);C1+=after[k];   /* C1 = Σ CurrYrCapGain (ii..vii) */
    totSet[k]=R(used[k]);remain[k]=R(Math.max(0,loss[k]-used[k]));});
  const cflSTCL=R(["st20","st30","stApp","stDTAA"].reduce((a,k)=>a+remain[k],0)); /* unabsorbed CY STCL → CFL */
  const cflLTCL=R(["lt125","ltDTAA"].reduce((a,k)=>a+remain[k],0));               /* unabsorbed CY LTCL → CFL */

  /* ---- Part F · quarters (auto from land sale dates; editable) ---- */
  const Fauto={};KEYS.forEach(k=>Fauto[k]=[0,0,0,0,0]);
  (C.land||[]).forEach(p=>{const r=p._;if(!r)return;const q=cgQtr(p.sale);
    const k=r.isLT?"lt125":"stApp"; if(r.gain>0)Fauto[k][q]+=r.gain;});
  const F={};KEYS.forEach(k=>{const ov=(C.Fover||{})[k];
    F[k]=(C.editF&&ov)?ov.map(N):Fauto[k].slice();});

  /* ---- Part C · summary ------------------------------------------- */
  const C2=vcg;                                             /* C2 = Sch VDA item B (from the vda section) */
  const C3=R(C1+C2);                                         /* C3 = C1 + C2 */

  /* ---- Part D · deduction particulars (disclosure) ---------------- */
  const dedD={};
  const addD=(sec,amt,src)=>{if(!N(amt))return;(dedD[sec]=dedD[sec]||[]).push({amt:N(amt),src});};
  (C.land||[]).forEach((p,i)=>Object.keys(p.ded||{}).forEach(k=>addD(k.replace("s",""),(p.ded||{})[k],"land"+i)));
  if(N((C.b2||{}).ded&&(C.b2.ded||{}).s54EC))addD("54EC",(C.b2.ded||{}).s54EC,"b2");
  [["a6",C.a6],["b8",C.b8]].forEach(([h,o])=>
    Object.keys((o||{}).ded||{}).forEach(k=>addD(k.replace("s",""),(o.ded||{})[k],h)));
  const dedTotal=Object.values(dedD).reduce((a,rows)=>a+rows.reduce((b,r)=>b+r.amt,0),0);

  /* ---- special-rate carve for 112A / 115AD-proviso (Schedule SI) --- */
  const base112a=Math.max(0,B.b4.gain), base115ad=Math.max(0,B.b7.gain);
  const si112a=Math.max(0,Math.min(after.lt125,base112a));           /* 112A @12.5% (own ₹1.25L exempt at SI) */
  const si112a115ad=Math.max(0,Math.min(Math.max(0,after.lt125-si112a),base115ad)); /* 115AD proviso @12.5% */
  const si112=Math.max(0,after.lt125-si112a-si112a115ad);            /* other LTCG @12.5% */
  const buckets={
    si111a20:after.st20, si30:after.st30, stApp:after.stApp, stDTAA:after.stDTAA,
    si112a:si112a, si112a115ad:si112a115ad, si112:si112, ltDTAA:after.ltDTAA, si115bbh:C2};

  /* ================= Schedule-SI feed (special-rate CG heads) =================
     The si section consumes S.C.cg.siFeed keyed by the exact ITR-7 Schedule-SI
     SecCode (SI.md §2/§3/§6).  Value = a plain number (income; si.js supplies
     the rate and computes the tax) OR, for a DTAA head, an {inc,tax} object
     carrying the treaty-rate tax.  Every figure is REUSED from the ladder above
     (Part A/B gains, Table-E after-set-off slots and the ₹1.25L LTCG split).

     A special-rate head shares its Table-E rate-slot with siblings, so the
     post-set-off slot total (after.*) is apportioned back to its member heads by
     their gross gain (splitSI).  Applicable-/normal-rate slots (stApp: A1/A2/A4b/
     A6/A7/A8-app) carry NO special rate and are deliberately excluded.
        1A       111A / NR-111A @20%                <- A3(i)e + A4a  (E.st20)
        5AD1biiP 115AD(1)(b)(ii) STCG by FII @20%   <- A3(ii)e       (E.st20)
        PTI_STCG20P pass-through STCG @20%          <- A8a           (E.st20)
        5ADii    115AD(1)(ii) STCG @30%             <- A5e           (E.st30)
        PTI_STCG30P pass-through STCG @30%          <- A8b           (E.st30)
        2A       112A LTCG @12.5%                   <- B4            (si112a)
        5ADiiiP  115AD(1)(b)(iii) proviso LTCG      <- B7            (si112a115ad)
        21       112 LTCG (land/slump/B5/B8/B9)     <- B1g/B2e/B5/B8e/B9 (si112)
        22       112(1) listed sec/ZCB @12.5%       <- B3c           (si112)
        21ciii/5AB1b/5AC1c/5ADiii  NR 112(1)(c)/115AB/115AC/115AD  <- B6 rows (si112)
        PTI_LTCG12_5P112A / PTI_LTCG12_5P pass-through LTCG @12.5% <- B10a1/B10a2 (si112)
        DTAASTCG / DTAALTCG  STCG/LTCG at the DTAA treaty rate <- A9b/B11b
        5BBHii   115BBH VDA capital-gain income @30% <- Schedule VDA item B (C2) */
  const splitSI=(dst,afterAmt,members)=>{
    const codes=Object.keys(members).filter(c=>members[c]>0);
    const tot=codes.reduce((a,c)=>a+members[c],0);
    if(tot<=0||afterAmt<=0)return;
    if(afterAmt>=tot){codes.forEach(c=>{dst[c]=R((dst[c]||0)+members[c]);});return;}
    let acc=0;                                          /* set-off shrank the slot — pro-rate, last head absorbs rounding */
    codes.forEach((c,i)=>{const v=(i<codes.length-1)?R(afterAmt*members[c]/tot):R(afterAmt-acc);
      acc+=v; if(v>0)dst[c]=R((dst[c]||0)+v);});
  };
  const siFeed={};
  /* STCG @20% slot (E.st20) — 111A own+NR, FII 115AD(1)(b)(ii), pass-through */
  splitSI(siFeed,after.st20,{
    "1A":R(Math.max(0,A.a3i.gain)+Math.max(0,A.a4.a)),
    "5AD1biiP":Math.max(0,A.a3ii.gain),
    "PTI_STCG20P":Math.max(0,N(a8.r20))});
  /* STCG @30% slot (E.st30) — FII 115AD(1)(ii) other than 111A, pass-through */
  splitSI(siFeed,after.st30,{
    "5ADii":Math.max(0,A.a5.gain),
    "PTI_STCG30P":Math.max(0,N(a8.r30))});
  /* LTCG @12.5% — 112A (2A) and 115AD-proviso (5ADiiiP) carved out first
     by the engine (si112a / si112a115ad); the residue si112 is the "other" pool */
  if(si112a>0)       siFeed["2A"]=R(si112a);
  if(si112a115ad>0)  siFeed["5ADiiiP"]=R(si112a115ad);
  const b6by={};                                        /* NR B6 rows classified to their SI code by the entered section */
  (C.b6||[]).forEach((rw,i)=>{const g=Math.max(0,N(((B.b6.rows||[])[i]||{}).gain));if(g<=0)return;
    const s=st0(rw.sec).toUpperCase().replace(/\s+/g,"");
    const code=/115AB/.test(s)?"5AB1b":/115AC/.test(s)?"5AC1c":/115AD/.test(s)?"5ADiii":"21ciii";
    b6by[code]=R((b6by[code]||0)+g);});
  splitSI(siFeed,si112,Object.assign({
    "21":R(Math.max(0,B.b1)+Math.max(0,B.b2.gain)+Math.max(0,B.b5.gain)+Math.max(0,B.b8.gain)+Math.max(0,B.b9.gain)),
    "22":Math.max(0,B.b3.gain),
    "PTI_LTCG12_5P112A":Math.max(0,N(b10.r125a)),
    "PTI_LTCG12_5P":Math.max(0,N(b10.r125o))},b6by));
  /* DTAA heads — treaty-rate tax: {inc, tax}. inc = post-set-off amount;
     tax = inc × the applicable (lower of treaty/IT-Act) rate. */
  const dSt=R(after.stDTAA), dLt=R(after.ltDTAA);
  if(dSt>0)siFeed["DTAASTCG"]={inc:dSt,tax:R(dSt*N(A.a9.rate)/100)};
  if(dLt>0)siFeed["DTAALTCG"]={inc:dLt,tax:R(dLt*N(B.b11.rate)/100)};
  /* 115BBH VDA capital-gain income @30% (Schedule VDA item B = C2) — not part
     of Table E, taken directly from the vda section */
  if(C2>0)siFeed["5BBHii"]=R(C2);

  S.C.cg={on:true,nri:nri,land,A,B,E,gain,loss,used,absorbed,matrix,after,totSet,remain,F,Fauto,
    vda:{cg:C2},buckets,siFeed,dedD,dedTotal:R(dedTotal),cflSTCL,cflLTCL,
    dtaaStcgRate:A.a9.rate,dtaaLtcgRate:B.b11.rate,
    C1:R(C1),C2:R(C2),C3:R(C3),
    shortTerm:A.total,longTerm:B.total,total:R(C3),
    income:R(C3)};   /* head's contribution to Gross Total Income — C3 (≥0; net loss carries via loss section) */
}

/* =====================================================================
   RENDERER
   ===================================================================== */
function calcRow(label,ref,n,ind){return row(label,cell(n),{ref:ref,ind:ind});}

function landBlock(p,i,lt){const r=p._||engLand(p);let h="";
  h+=row("Date of purchase / acquisition",dte("cg.land."+i+".buy"),{ref:lt?"B1":"A1"});
  h+=row("Date of sale / transfer",dte("cg.land."+i+".sale"),{});
  h+=row("a i · Full value of consideration received/receivable",inp("cg.land."+i+".cons",{n:1}),{ref:"ai"});
  h+=row("ii · Value of property as per stamp valuation authority",inp("cg.land."+i+".sdv",{n:1}),{ref:"aii"});
  h+=calcRow("iii · Full value of consideration u/s 50C","aiii",r.value);
  if(!r.safe)h+=note("Stamp value exceeds consideration by more than 10% — u/s 50C the stamp value is adopted.","warn");
  h+=row("b i · Cost of acquisition without indexation",inp("cg.land."+i+".cost",{n:1}),{ref:"bi"});
  h+=row("ii · Cost of improvement without indexation",inp("cg.land."+i+".improve",{n:1}),{ref:"bii"});
  h+=row("iii · Expenditure wholly & exclusively on transfer",inp("cg.land."+i+".exp",{n:1}),{ref:"biii"});
  h+=calcRow("iv · Total deductions u/s 48 (bi + bii + biii)","biv",r.biv);
  h+=calcRow("c · Balance (aiii − biv)","1c",r.c);
  const ex=lt?EXLT_LAND:EXST_LAND;
  ex.forEach(([code,lbl])=>{h+=row("d · Deduction u/s "+code+" (details in item D)",inp("cg.land."+i+".ded.s"+code,{n:1}),{ref:lbl,ind:1});});
  h+=calcRow(lt?"e · LTCG on Immovable property (1c − 1d)":"e · STCG on Immovable property (1c − 1d)",lt?"B1e":"A1e",r.e);
  /* buyer table (194-IA) + property location → TrnsfImmblPrprty */
  h+=row("Address of property",inp("cg.land."+i+".paddr"),{ref:"AddressOfProperty"});
  h+=row("State",sel("cg.land."+i+".pstate",CG_STATE),{ref:"StateCode"});
  h+=row("Pin code",inp("cg.land."+i+".ppin",{max:6}),{ref:"PinCode"});
  h+=row("Country code",inp("cg.land."+i+".pcountry",{max:4,ph:"91"}),{ref:"CountryCode"});
  h+=note("Furnishing of PAN is mandatory if tax was deducted u/s 194-IA or the PAN is quoted by the buyer.");

/* the section-48 aggregate body (shared by A3i/A3ii/A5/A6/B3/B8 and NR B6 rows) */
function aggBody(path,r,opts){opts=opts||{};let h="";
  if(opts.unq){
    h+=row("a · Full value — unquoted shares (received/receivable)",inp(path+".unqCons",{n:1}),{ref:"ia"});
    h+=row("b · Fair market value of unquoted shares (Rule 11UA)",inp(path+".unqFmv",{n:1}),{ref:"ib"});
    h+=calcRow("c · Full value u/s 50CA (higher of a or b)","ic",r.c50ca);
    h+=row("ii · Full value — assets other than unquoted shares",inp(path+".othCons",{n:1}),{ref:"ii"});
    h+=calcRow("iii · Total consideration (ic + ii)","aiii",r.cons);
  } else {
    h+=row("a · Full value of consideration",inp(path+".cons",{n:1}),{ref:"a"});
  }
  h+=row("bi · Cost of acquisition without indexation",inp(path+".cost",{n:1}),{ref:"bi",ind:1});
  h+=row("bii · Cost of improvement without indexation",inp(path+".improve",{n:1}),{ref:"bii",ind:1});
  h+=row("biii · Expenditure w&e on transfer",inp(path+".exp",{n:1}),{ref:"biii",ind:1});
  h+=calcRow("biv · Total deductions u/s 48","biv",r.biv);
  h+=calcRow("c · Balance","c",r.c);
  if(opts.loss94)h+=row("d · Loss to be ignored u/s 94(7)/94(8)",inp(path+".loss94",{n:1}),{ref:"d"});
  if(opts.dcg)h+=row("e · Deemed STCG on depreciable assets (Sch DCG item 6)",inp(path+".dcg",{n:1}),{ref:"6e"});
  (opts.deds||[]).forEach(code=>{const c=code.replace("s","");
    h+=row("d · Deduction u/s "+c,inp(path+".ded."+code,{n:1}),{ref:c,ind:1});});
  return h;}
function aggBlock(id,title,ref,path,o,r,opts){opts=opts||{};
  const h=aggBody(path,r,opts)+calcRow(title+" gain",ref,r.gain);
  return fold(id,ref,title,RS(r.gain),h,{});}

function secCg(){
  const G=S.C.cg||{on:false};
  if(!G.on){

      row("Report capital gains?",sel("cg.on",[["true","Yes"]],{blank:true}),{ref:"Schedule CG · C3"});
  }

  a+=aggBlock("cga6","A6 · STCG on assets other than A1–A5","A6g","cg.a6",C.a6,G.A.a6,{unq:1,loss94:1,dcg:1,deds:["s54G","s54GA"]});
  /* A7 deemed STCG */
  const a7unut=st0((C.a7||{}).unutFlag)==="Y"||(((C.a7||{}).deem||[]).length>0);

    (a7unut?deemGrid("cg.a7.deem",(C.a7||{}).deem,DEEM_ST_SEC):"")+
    row("b · Amount deemed STCG u/s 54G/54GA (other than at 'a')",inp("cg.a7.other",{n:1}),{ref:"7b"})+
    calcRow("Total amount deemed to be STCG (aXi+aXii+aXiii + b)","A7",G.A.a7.gain),{});
  /* A8 PTI */
  a+=fold("cga8","A8","A8 · Pass-through income/loss (STCG) — Schedule PTI",RS(G.A.a8.gain),
    row("a · chargeable @ 20%",inp("cg.a8.r20",{n:1}),{ref:"8a"})+
    row("b · chargeable @ 30%",inp("cg.a8.r30",{n:1}),{ref:"8b"})+
    row("c · at applicable rates",inp("cg.a8.rApp",{n:1}),{ref:"8c"})+
    calcRow("Total pass-through STCG","A8",G.A.a8.gain),{});
  /* A(A) buy-back STCL */
  a+=fold("cgaA","A(A)","A(A) · Capital loss on buy-back of shares (STCL 20%/30%/applicable)",RS(-G.A.aA.loss),
    note("Can be claimed only if the corresponding dividend u/s 2(22)(f) is offered in Schedule OS.")+
    grid("cg.aA",[{h:"Rate",k:"rate",t:"sel",opts:BBST},{h:"Loss amount",k:"amt",t:"num"}],
      C.aA||[],{empty:"No buy-back loss.",add:"Add a row",min:"560px"}),{});
  /* NON-RESIDENT STCG heads A4/A5 + DTAA A9 */
  if(G.nri){
    a+=fold("cga4","A4","A4 · STCG for a non-resident (111A / other shares & debentures)",RS(G.A.a4.gain),
      row("a · STCG on transactions covered u/s 111A (STT paid)",inp("cg.a4.sttPaid",{n:1}),{ref:"A4a"})+
      row("b · STCG from shares/debentures not covered at 4a",inp("cg.a4.sttNot",{n:1}),{ref:"A4b"})+
      calcRow("Total STCG for non-resident (A4a + A4b)","A4",G.A.a4.gain),{});
    a+=aggBlock("cga5","A5 · STCG on securities by an FII u/s 115AD","A5e","cg.a5",C.a5,G.A.a5,{unq:1,loss94:1});
    a+=fold("cga9","A9","A9 · STCG not chargeable / chargeable at special rate per DTAA",RS(G.A.a9.special),
      dtaaGrid("cg.a9",C.a9||[],ITEM_STCG)+
      calcRow("9a · STCG not chargeable to tax in India as per DTAA","A9a",G.A.a9.notTax)+
      calcRow("9b · STCG chargeable at special rate in India as per DTAA","A9b",G.A.a9.special),{});
  }
  a+=calcRow("A10 · Total Short-term Capital Gain (A1e+A2c+A3e+A4a+A4b+A5e+A6g+A7+A8−A9a+A(A))","A10",G.A.total);
  h+=fold("cgA","A · STCG","Short-term capital gains (items 4 & 5 not applicable for residents)",RS(G.A.total),a,{def:true});

  /* ---- B · long-term ---- */
  let b="";
  (G.land.lt||[]).forEach(p=>b+=landBlock(p,p._i,true));
  b+='<button class="add" data-addland="Long">Add a long-term property (B1)</button>';
  b+=calcRow("B1g · Total LTCG on Immovable property (ΣB1e)","B1g",G.B.b1);
  b+=fold("cgb2","B2e","B2 · Slump sale (LTCG)",RS(G.B.b2.gain),
    row("ai · FMV as per Rule 11UAE(2)",inp("cg.b2.fmv2",{n:1}),{ref:"2ai"})+
    row("aii · FMV as per Rule 11UAE(3)",inp("cg.b2.fmv3",{n:1}),{ref:"2aii"})+
    calcRow("aiii · Full value (higher of ai/aii)","2aiii",G.B.b2.value)+
    row("b · Net worth of the undertaking (6(e) of Form 3CEA)",inp("cg.b2.networth",{n:1}),{ref:"2b"})+
    calcRow("c · Balance (2aiii − 2b)","2c",G.B.b2.c)+
    row("d · Deduction u/s 54EC",inp("cg.b2.ded.s54EC",{n:1}),{ref:"2d",ind:1})+
    calcRow("e · LTCG from slump sale (2c − 2d)","B2e",G.B.b2.gain),{});
  b+=aggBlock("cgb3","B3 · Listed securities (other than a unit) / ZCB u/s 112(1)","B3c","cg.b3",C.b3,G.B.b3,{});
  /* B4 112A — single amount */
  b+=fold("cgb4","B4","B4 · Equity / EOMF / business-trust units u/s 112A (STT paid)",RS(G.B.b4.gain),
    note("Long-term capital gain on 112A equity/units (net of the section-112A working). Feeds Schedule SI @12.5%.")+
    row("LTCG on assets at B4 u/s 112A",inp("cg.b4.amt",{n:1}),{ref:"B4"}),{});
  b+=aggBlock("cgb8","B8 · LTCG on assets where B1–B7 are not applicable","B8e","cg.b8",C.b8,G.B.b8,{unq:1,deds:["s54D","s54G","s54GA"]});
  /* B9 deemed LTCG */
  const b9unut=st0((C.b9||{}).unutFlag)==="Y"||(((C.b9||{}).deem||[]).length>0);
  b+=fold("cgb9","B9","B9 · Amount deemed to be LTCG",RS(G.B.b9.gain),
    row("Any unutilized capital gain of an earlier year now chargeable?",
      sel("cg.b9.unutFlag",UNUTFLAG,{blank:true}),{ref:"UnutilizedLtcgFlag"})+
    (b9unut?deemGrid("cg.b9.deem",(C.b9||{}).deem,DEEM_LT_SEC):"")+
    row("b · Amount deemed LTCG (other than at 'a')",inp("cg.b9.other",{n:1}),{ref:"9b"})+
    calcRow("Total amount deemed to be LTCG (aXi+aXii+aXiii + b)","B9",G.B.b9.gain),{});
  /* B10 PTI */
  b+=fold("cgb10","B10","B10 · Pass-through income/loss (LTCG) — Schedule PTI",RS(G.B.b10.gain),
    row("a1 · chargeable @ 12.5% u/s 112A",inp("cg.b10.r125a",{n:1}),{ref:"10a1"})+
    row("a2 · chargeable @ 12.5% under other sections",inp("cg.b10.r125o",{n:1}),{ref:"10a2"})+
    calcRow("Total pass-through LTCG","B10",G.B.b10.gain),{});
  /* B(A) buy-back LTCL */
  b+=fold("cgbA","B(A)","B(A) · Capital loss on buy-back of shares (LTCL @12.5%)",RS(-G.B.bA.loss),
    note("Can be claimed only if the corresponding dividend income is offered in Schedule OS.")+
    row("Loss on buy-back of shares [Long Term 12.5%]",inp("cg.bA.amt",{n:1}),{ref:"B(A)"}),{});
  /* NON-RESIDENT LTCG heads B5/B6/B7 + DTAA B11 */
  if(G.nri){
    b+=fold("cgb5","B5","B5 · LTCG on unlisted shares / listed debentures (non-resident)",RS(G.B.b5.gain),
      row("LTCG computed without indexation / forex benefit (1st proviso to s.48)",inp("cg.b5.gain",{n:1}),{ref:"B5"}),{});
    let b6="";
    (C.b6||[]).forEach((rw,i)=>{const rr=(G.B.b6.rows||[])[i]||engAgg(rw,{unq:1});
      b6+=blk("cgb6_"+i,"B6 asset "+(i+1),RS(rr.gain),
        row("Section",inp("cg.b6."+i+".sec",{max:12,ph:"112(1)(c)/115AB/115AC/115AD"}),{ref:"SectionCode"})+
        aggBody("cg.b6."+i,rr,{unq:1})+
        calcRow("LTCG on assets at B6","B6c",rr.gain),
        "cg.b6."+i);});
    b6+='<button class="add" data-add="cg.b6">Add a B6 asset</button>';
    b+=fold("cgb6","B6c","B6 · LTCG for non-resident u/s 112(1)(c) / 115AB / 115AC / 115AD",RS(G.B.b6.gain),b6,{});
    b+=fold("cgb7","B7","B7 · FII/FPI 112A route u/s 115AD(1)(b)(iii) proviso",RS(G.B.b7.gain),
      note("Long-term capital gain on equity/units for a FII/FPI non-resident (115AD proviso). Feeds Schedule SI @12.5%.")+
      row("LTCG on assets at B7",inp("cg.b7.amt",{n:1}),{ref:"B7"}),{});
    b+=fold("cgb11","B11","B11 · LTCG not chargeable / chargeable at special rate per DTAA",RS(G.B.b11.special),
      dtaaGrid("cg.b11",C.b11||[],ITEM_LTCG)+
      calcRow("a · LTCG not chargeable to tax in India as per DTAA","B11a",G.B.b11.notTax)+
      calcRow("b · LTCG chargeable at special rate in India as per DTAA","B11b",G.B.b11.special),{});
  }
  b+=calcRow("B12 · Total Long-term Capital Gain (B1g+B2e+B3c+B4+B5+B6c+B7+B8e+B9+B10−B11a+B(A))","B12",G.B.total);
  h+=fold("cgB","B · LTCG","Long-term capital gains (sub-items 5, 6 & 7 not applicable for residents)",RS(G.B.total),b,{def:true});

  /* ---- C · summary ---- */
  h+=fold("cgC","C","Income under the head Capital Gains",RS(G.C3),
    calcRow("C1 · Sum of capital gain incomes (Table E, remaining after set-off)","C1",G.C1)+
    calcRow("C2 · Income from transfer of Virtual Digital Assets (Item B of Schedule VDA)","C2",G.C2)+
    calcRow("C3 · Income chargeable under CAPITAL GAINS (C1 + C2)","C3",G.C3),{def:true});
  if(G.C2)h+=note("C2 is the capital-gain total from the separate Schedule VDA section.");

  /* ---- D · deductions claimed ---- */
  let d="";
  if(G.dedTotal){Object.keys(G.dedD).forEach(sec=>{const rows=G.dedD[sec];
    d+=calcRow("Deduction u/s "+sec,sec,rows.reduce((a,r)=>a+r.amt,0));});}
  d+=calcRow("1e · Total deduction claimed (1a + 1b + 1c + 1d)","1e",G.dedTotal);
  h+=fold("cgD","D","Deductions claimed against capital gains",RS(G.dedTotal),
    (G.dedTotal?"":note("Deductions entered against each head above are totalled here."))+d,{});
  let dclaimTot=0;DCLAIM.forEach(Dd=>((C.dclaim||{})[Dd.ns]||[]).forEach(r=>dclaimTot+=N(r.amt)));
  h+=fold("cgDdet","D","Details of deduction claimed u/s 54D/54EC/54G/54GA (CGAS / new asset)",RS(dclaimTot),
    note("Enter the proof of each exemption claimed — date of transfer, cost of the new asset, CGAS deposit and account. Disclosure detail; it does not alter the computed gain.")+
    dclaimBlock(C),{});

  /* ---- E · set-off ---- */
  h+=fold("cgE","E","Set-off of current-year capital losses",RS(G.C1),
    setoffTable(G)+
    row("Edit the auto-populated set-off?",sel("cg.editE",[["false","No"],["true","Yes"]],{blank:false}),{ref:"row486"}),{});

  /* ---- F · quarterly split (234C) ---- */
  h+=fold("cgF","F","Accrual / receipt of capital gain (quarterly, for 234C)","—",
    quartersTable(G)+
    row("Edit the auto-filled quarters?",sel("cg.editF",[["false","No"],["true","Yes"]],{blank:false}),{ref:"row489"}),{});

  return h;
}

function expCg(j){
  const G=S.C.cg;if(!G||!G.on){
    /* even when off, C2/VDA-accrual are required if there is VDA capital gain;
       but Schedule CG as a whole is emitted only when the head is on.  When off
       there is nothing to write (Part B-TI/SI read S.C.cg scalars directly). */
    return;
  }
  const C=S.cg,A=G.A,B=G.B;
  const buyers=p=>{const bs=(p.buyers||[]).filter(x=>st0(x.name));if(!bs.length)return undefined;
    return {TrnsfImmblPrprtyDtls:bs.map(x=>({NameOfBuyer:st0(x.name).slice(0,125),
      PANofBuyer:PAN_RE.test(st0(x.pan).toUpperCase())?st0(x.pan).toUpperCase():undefined,
      AaadhaarOfBuyer:AADH.test(st0(x.aadhaar))?st0(x.aadhaar):undefined,
      PercentageShare:N(x.share)||100,Amount:n0(x.amt),
      AddressOfProperty:(sv(p.paddr)||"NA").slice(0,50),
      StateCode:CG_STATE_SET[st0(p.pstate)]?st0(p.pstate):"19",
      CountryCode:(st0(p.pcountry)||"91").slice(0,4),
      PinCode:/^[1-9]\d{5}$/.test(st0(p.ppin))?parseInt(p.ppin,10):undefined}))};};
  const dtaaOut=rows=>{const good=(rows||[]).filter(r=>N(r.amt));if(!good.length)return undefined;
    return {NRIDTAADtls:good.map(r=>{const o={DTAAamt:n0(r.amt),ItemNoincl:st0(r.itemno),
      CountryName:st0(r.country),CountryCodeExcludingIndia:st0(r.ccode),DTAAarticle:st0(r.article),
      RateAsPerTreaty:N(r.treaty),SecITAct:st0(r.secit),RateAsPerITAct:N(r.itact)};
      if(r.trc)o.TaxRescertifiedFlag=r.trc;
      if(r._appl!=null)o.ApplicableRate=r._appl;
      return o;})};};
  const zDed48=()=>({AquisitCost:0,ImproveCost:0,ExpOnTrans:0,TotalDedn:0});
  const exList=(ded,pairs)=>{const ex=[];pairs.forEach(([k,c])=>{if(N((ded||{})[k]))ex.push({ExemptionSecCode:c,ExemptionAmount:n0(ded[k])});});return ex;};

  S.cg.a7.deem=(g(ST,"UnutilizedCg.UnutilizedCgPrvYrDtls")||[]).map(x=>({py:x.PrvYrInWhichAsstTrnsfrd,sec:x.SectionClmd,
    yracq:x.YrInWhichAssetAcq||"",util:nz(x.AmtUtilized),unused:nz(x.AmtUnutilized)}));
  S.cg.a7.other=nz(ST.AmtDeemedStcg);S.cg.a7.unutFlag=ST.UnutilizedStcgFlag||"";
  S.cg.a8={r20:nz(ST.PassThrIncNatureSTCG20Per),r30:nz(ST.PassThrIncNatureSTCG30Per),rApp:nz(ST.PassThrIncNatureSTCGAppRate)};
  const bbs=g(ST,"CapitalLossBuyBackShares.CapitalLossBuyBackSharesDtls")||[];
  if(bbs.length)S.cg.aA=bbs.map(x=>({rate:x.Rate||"STL20",amt:Math.abs(N(x.Amount))}));
  /* B */
  const s2=g(LT,"SlumpSaleInLtcgDtls.SlumpSaleInLtcg");
  if(s2&&(N(s2.FMV11UAEii)||N(s2.FMV11UAEiii)||N(s2.NetWorthOfDivision)))
    S.cg.b2={fmv2:nz(s2.FMV11UAEii),fmv3:nz(s2.FMV11UAEiii),networth:nz(s2.NetWorthOfDivision),ded:{s54EC:nz(s2.DeductionUnderSec54)}};
  const p3=g(LT,"Proviso112Applicable.Proviso112Applicabledtls");
  if(p3&&(N(p3.FullConsideration)||N(g(p3,"DeductSec48.AquisitCost"))))
    S.cg.b3={cons:nz(p3.FullConsideration),cost:nz(g(p3,"DeductSec48.AquisitCost")),
      improve:nz(g(p3,"DeductSec48.ImproveCost")),exp:nz(g(p3,"DeductSec48.ExpOnTrans"))};
  if(N(g(LT,"SaleOfEquityShareUs112A.SaleOfEquityShareUs112AAmt")))
    S.cg.b4={amt:nz(g(LT,"SaleOfEquityShareUs112A.SaleOfEquityShareUs112AAmt"))};
  const b8=g(LT,"SaleofAssetNADtls.SaleofAssetNA");
  if(b8&&(N(b8.FullConsideration)||N(b8.FullValueConsdRecvUnqshr)||N(b8.FullValueConsdOthUnqshr)||N(g(b8,"DeductSec48.AquisitCost")))){const d={};
    (g(b8,"ExemptionOrDednUs54.ExemptionOrDednUs54Dtls")||[]).forEach(e=>d["s"+e.ExemptionSecCode]=nz(e.ExemptionAmount));
    S.cg.b8={unqCons:nz(b8.FullValueConsdRecvUnqshr),unqFmv:nz(b8.FairMrktValueUnqshr),othCons:nz(b8.FullValueConsdOthUnqshr),
      cost:nz(g(b8,"DeductSec48.AquisitCost")),improve:nz(g(b8,"DeductSec48.ImproveCost")),exp:nz(g(b8,"DeductSec48.ExpOnTrans")),ded:d};}
  S.cg.b9=S.cg.b9||{deem:[],other:0,unutFlag:""};
  S.cg.b9.deem=(g(LT,"UnutilizedCg.UnutilizedCgPrvYrDtls")||[]).map(x=>({py:x.PrvYrInWhichAsstTrnsfrd,sec:x.SectionClmd,
    yracq:x.YrInWhichAssetAcq||"",util:nz(x.AmtUtilized),unused:nz(x.AmtUnutilized)}));
  S.cg.b9.other=nz(LT.AmtDeemedLtcg);S.cg.b9.unutFlag=LT.UnutilizedLtcgFlag||"";
  S.cg.b10={r125a:nz(LT.PassThrIncNatureLTCGUs112A12_5Per),r125o:nz(LT.PassThrIncNatureLTCG12_5Per)};
  if(N(g(LT,"CapitalLossBuyBackShares.TotalCapitalLossBuyBackShares")))
    S.cg.bA={amt:Math.abs(N(g(LT,"CapitalLossBuyBackShares.TotalCapitalLossBuyBackShares")))};
  /* NR heads */
  const dtaaIn=r=>({amt:nz(r.DTAAamt),itemno:r.ItemNoincl||"",country:r.CountryName||"",
    ccode:r.CountryCodeExcludingIndia||"",article:r.DTAAarticle||"",
    treaty:r.RateAsPerTreaty!=null?r.RateAsPerTreaty:"",trc:r.TaxRescertifiedFlag||"",
    secit:r.SecITAct||"",itact:r.RateAsPerITAct!=null?r.RateAsPerITAct:""});
  if(ST.NRITransacSec48Dtl&&(N(ST.NRITransacSec48Dtl.NRItaxSTTPaid)||N(ST.NRITransacSec48Dtl.NRItaxSTTNotPaid)))
    S.cg.a4={sttPaid:nz(ST.NRITransacSec48Dtl.NRItaxSTTPaid),sttNot:nz(ST.NRITransacSec48Dtl.NRItaxSTTNotPaid)};
  const a5=ST.NRISecur115AD;
  if(a5&&(N(a5.FullConsideration)||N(a5.FullValueConsdRecvUnqshr)||N(a5.FullValueConsdOthUnqshr)||N(g(a5,"DeductSec48.AquisitCost"))))
    S.cg.a5={unqCons:nz(a5.FullValueConsdRecvUnqshr),unqFmv:nz(a5.FairMrktValueUnqshr),othCons:nz(a5.FullValueConsdOthUnqshr),
      cost:nz(g(a5,"DeductSec48.AquisitCost")),improve:nz(g(a5,"DeductSec48.ImproveCost")),
      exp:nz(g(a5,"DeductSec48.ExpOnTrans")),loss94:nz(a5.LossSec94of7Or94of8)};
  S.cg.a9=(g(ST,"NRICgDTAA.NRIDTAADtls")||[]).map(dtaaIn);
  if(LT.NRIProvisoSec48&&N(LT.NRIProvisoSec48.BalanceCG))S.cg.b5={gain:nz(LT.NRIProvisoSec48.BalanceCG)};
  S.cg.b6=(g(LT,"NRIOnSec112and115.NRIOnSec112and115Dtls")||[]).map(r=>({sec:r.SectionCode||"",
    unqCons:nz(r.FullValueConsdRecvUnqshr),unqFmv:nz(r.FairMrktValueUnqshr),othCons:nz(r.FullValueConsdOthUnqshr),
    cost:nz(g(r,"DeductSec48.AquisitCost")),improve:nz(g(r,"DeductSec48.ImproveCost")),exp:nz(g(r,"DeductSec48.ExpOnTrans"))}));
  if(N(g(LT,"NRISaleOfEquityShareUs112A.NRISaleOfEquityShareUs112AAmt")))
    S.cg.b7={amt:nz(g(LT,"NRISaleOfEquityShareUs112A.NRISaleOfEquityShareUs112AAmt"))};
  S.cg.b11=(g(LT,"NRICgDTAA.NRIDTAADtls")||[]).map(dtaaIn);
  /* Part D — DeducClaimInfo detail back into S.cg.dclaim */
  const DI=CGb.DeducClaimInfo;
  if(DI){S.cg.dclaim={us54D:[],us54EC:[],us54G:[],us54GA:[]};
    DCLAIM.forEach(Dd=>{S.cg.dclaim[Dd.ns]=(DI[Dd.key]||[]).map(r=>{
      if(Dd.invest)return {transfer:dmy(r.DateofTransfer),invested:nz(r.AmtInvested),
        invdate:dmy(r.DateofInvestment),amt:nz(r.AmtDeducted)};
      return {transfer:dmy(Dd.acq?r.DateofAcquisition:r.DateofTransfer),cost:nz(r[Dd.cost]),
        purchase:dmy(r.DateofPurchase),deposited:nz(r.AmtDeposited),depdate:dmy(r.DepositDate),
        acno:r.AccountNo||"",ifsc:r.IFSC||"",amt:nz(r.AmtDeducted)};});});
    if(Object.keys(S.cg.dclaim).some(k=>S.cg.dclaim[k].length))read.push("CG deduction detail");}
  if(st0(CGb.EditAutopoulatedDetail))S.cg.editE=true;
  read.push("capital gains");
  return read;
}

/* =====================================================================
   CHECKS — the section's own screen validations (not the department rules)
   ===================================================================== */
function chkCg(){
  const out=[];const G=S.C.cg;if(!G||!G.on)return out;
  const C=S.cg;
  /* 50C — stamp value more than 10% above consideration */
  (C.land||[]).forEach((p,i)=>{const r=p._;if(r&&!r.safe)
    out.push({lvl:"warn",t:"Property "+(i+1)+" · section 50C",
      m:"Stamp value exceeds consideration by more than 10% — the stamp value is adopted as full value.",sec:"cg"});});
  /* NR-only heads entered by a resident */
  if(!G.nri){
    if(N((C.a4||{}).sttPaid)||N((C.a4||{}).sttNot)||N((C.a5||{}).cost)||N((C.b5||{}).gain)||N((C.b7||{}).amt)||(C.b6||[]).length||(C.a9||[]).length||(C.b11||[]).length)
      out.push({lvl:"warn",t:"Non-resident capital-gains heads",
        m:"Heads A4/A5/A9 and B5/B6/B7/B11 apply only to a non-resident; the residential status is resident.",sec:"cg"});
  }
  /* VDA: dates not after 31 March of the FY — validated in the vda section */
  /* consideration nil but section-48 deductions claimed */
  (C.land||[]).forEach((p,i)=>{if(!N(p.cons)&&(N(p.cost)||N(p.exp)||N(p.improve)))
    out.push({lvl:"warn",t:"Property "+(i+1)+" · section 48",
      m:"Where full value of consideration is zero, deductions u/s 48 cannot be claimed.",sec:"cg"});});
  /* buy-back loss needs the dividend offered in Schedule OS (reminder) */
  if(N((G.A.aA||{}).loss)||N((G.B.bA||{}).loss))
    out.push({lvl:"warn",t:"Buy-back capital loss",
      m:"A buy-back capital loss can be claimed only if the corresponding dividend is offered in Schedule OS.",sec:"cg"});
  if(G.C3!==0||G.A.total||G.B.total)
    out.push({lvl:"ok",t:"Capital gains",m:"C3 income chargeable under CAPITAL GAINS = "+RS(G.C3)+".",sec:"cg"});
  return out;
}

reg({id:"cg", t:"Capital gains", ref:"Schedule CG",
