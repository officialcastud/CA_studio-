/* ---- engine ------------------------------------------------------ */
/* One property block, exactly as the book's a–j working reads (book §2).
   The share only guards the interest (A189); there is NO share×1e line. */
function engProp(p){
  p = p || {};
  const co = p.co==="YES";
  const coShare = (p.coowners||[]).reduce((s,x)=>s+N(x.share), 0);
  /* AssessePercentShareProp (typed, required — book row 6):
     not co-owned → 100; co-owned → the typed assessee %. */
  const share = co ? N(p.share) : 100;

  const a = R(p.rent);                            /* 1a AnnualLetableValue — typed gross */
  const b = R(p.unreal);                          /* 1b RentNotRealized — typed */
  const c = R(p.taxes);                           /* 1c LocalTaxes — typed */
  const d = R(b + c);                             /* 1d TotalUnrealizedAndTax = 1b+1c (A179) */
  const e = Math.max(0, R(a - d));                /* 1e BalanceALV = 1a−1d (A180) */
  const f = Math.max(0, R(0.30 * e));             /* 1f ThirtyPercentOfBalance = 30% of 1e (A181) */

  /* 1g IntOnBorwCap — interest u/s 24(b), admitted only when share>0 and 1a>0
     (A189). TotalInterestUs24B = Σ loan rows (A192), disclosed as hRaw. */
  const loans = (p.loans||[]).filter(l => N(l.interest));
  const hRaw  = R(loans.reduce((s,l)=>s+N(l.interest), 0));  /* Section24B.TotalInterestUs24B */
  const guard = share > 0 && a > 0;
  const g = guard ? hRaw : 0;
  const barredGuard = !guard && hRaw > 0;

  const h  = R(f + g);                            /* 1h TotalDeduct = 1f+1g (A182) */
  const ar = R(p.arrears);                        /* 1i ArrearsUnrealizedRentRcvd — typed net of 30% */
  const j  = R(e - h + ar);                       /* 1j IncomeOfHP = 1e−1h+1i (A183, signed) */

  return {co, coShare, share, a, b, c, d, e, f, g, hRaw, guard, barredGuard,
          h, ar, j, nLoans:loans.length};
}

/* item 2 — Pass through income/loss from Schedule PTI (book §4; A383/A485).
   The pti section (id "pti") aggregates SchedulePTIDtls[].IncFromHP.NetIncomeLoss;
   its engine is expected to publish that net figure at S.C.pti.hp (signed).
   Guarded read — falls back to the manual H.pti figure until that engine
   has run / been built (integrator seam: see report). */
function hpPTI(){
  const fromSch = RG(S.C, "pti.hp", undefined);
  if(fromSch!==undefined && N(fromSch)!==0) return {val:R(fromSch), sch:true};
  return {val:R(N(S.hp && S.hp.pti)), sch:false};
}

function engHp(){
  const H = S.hp || {};
  const C = S.C.hp = { on:!!H.on, rows:[], sum1j:0, pti:0, ptiFromSch:false,
                       total:0, loss:0, lossFull:0, cflExcess:0, partBTI:0 };
  if(!H.on) return;

  const rows  = (H.props||[]).map((p,idx)=>{ const r=engProp(p); p._=r; p._i=idx; return r; });
  const sum1j = R(rows.reduce((s,r)=>s+r.j, 0));          /* Σ1j across properties */

  const P = hpPTI();
  const pti = P.val;                                      /* item 2 PassThroghIncome */
  const total = R(sum1j + pti);                           /* item 3 = Σ1j + 2 = TotalIncomeChargeableUnHP (signed) */

  C.rows = rows;
  C.sum1j = sum1j;
  C.pti = pti;
  C.ptiFromSch = P.sch;
  C.total = total;                                        /* signed head total (income) */

  /* loss → Schedule CYLA 2i, capped at ₹2,00,000 (A360/A373/A354); the
     balance remaining carries forward under Schedule CFL. */
  C.lossFull  = total < 0 ? R(-total) : 0;                /* full HP loss magnitude (positive) */
  C.loss      = Math.min(200000, C.lossFull);             /* loss available for CYLA set-off (≤2 lakh) */
  C.cflExcess = Math.max(0, R(C.lossFull - 200000));      /* balance remaining → Schedule CFL */
  C.partBTI   = Math.max(0, total);                       /* Part B-TI item = MAX(0, income) */
}

/* ---- renderer ---------------------------------------------------- */
function hpBlock(p, i, ordinal){
  const r = p._ || engProp(p);
  const pre = "hp.props."+i+".", id = "hp"+i;
  const typeLbl = (HP_TYPE.find(t=>t[0]===p.type)||["","—"])[1];
  const status = (st0(p.addr)?typeLbl+" · ":"") + (r.j<0?"loss "+RS(-r.j):RS(r.j));
  let b = "";

  /* --- the property --- */
  b += sub("The property");
  b += row("Address of property", inp(pre+"addr",{max:250}), {req:1, ref:"F4", hint:"do not leave the address blank"});
  b += row("Town / City", inp(pre+"city",{max:50}), {req:1, ref:"G4"});
  b += row("Country", sel(pre+"country", HP_COUNTRY), {req:1, ref:"I4"});
  if((p.country||"91")==="91"){
    b += row("State", sel(pre+"state", HP_STATE), {req:1, ref:"H4"});
    b += row("PIN Code", inp(pre+"pin",{max:6}), {ref:"J4", hint:"100000–999999"});
  } else {
    b += row("State", sel(pre+"state", [["99","Foreign"]], {blank:false}), {req:1, ref:"H4"});
    b += row("Zip Code", inp(pre+"zip",{max:8}), {ref:"K4", hint:"for a property abroad"});
  }

  /* --- ownership (Self / Deemed owner only) --- */
  b += sub("Ownership");
  b += row("Owner of the Property", sel(pre+"owner", HP_OWNER), {req:1, ref:"F6",
           hint:"a body can own only as itself or as a deemed owner"});
  b += row("Is the property co-owned?", sel(pre+"co", HP_COOWN, {blank:false}), {req:1, ref:"H6"});
  if(p.co==="YES"){
    b += row("Assessee's percentage of share in the property (%)", inp(pre+"share",{n:1}),
             {req:1, ref:"J6", hint:"the body's own share; the assessee's + co-owners' shares must total 100%"});
    b += grid(pre.slice(0,-1)+".coowners",[
        {k:"name",h:"Name of Co-owner(s)",t:"txt",w:"auto",req:1,max:125},
        {k:"pan",h:"PAN of Co-owner(s)",t:"txt",w:"120px",max:10},

      p.coowners||[], {min:"780px", empty:"No co-owner listed.", add:"Add a co-owner",
        foot:[{l:1,v:"Shares — assessee "+r.share+"% + co-owners "+r.coShare+"%",span:3},{v:r.share+r.coShare}]});
    if(Math.abs(r.share+r.coShare-100)>0.01)
      b += note("The assessee's share + the co-owners' shares add to "+(r.share+r.coShare)+"%, not 100%.","warn");
  } else {
    b += row("Assessee's percentage of share in the property (%)", cell(r.share),
             {ref:"J6", cls:"tot", hint:"not co-owned — 100%"});
  }

  /* --- type (Let Out / Deemed Let Out only) --- */
  b += sub("Type of house property");
  b += row("Type of House property", sel(pre+"type", HP_TYPE), {req:1, ref:"F16",
           hint:"a trust/institution has no self-occupied house — Let Out or Deemed Let Out only"});
  b += grid(pre.slice(0,-1)+".tenants",[
      {k:"name",h:"Name(s) of Tenant(s) (if let out)",t:"txt",w:"auto",max:125},
      {k:"pan",h:"PAN of Tenant(s) (if available)",t:"txt",w:"120px",max:10},
      {k:"aadhaar",h:"Aadhaar of Tenant(s)",t:"txt",w:"150px",max:12},
      {k:"pantan",h:"PAN / TAN of Tenant(s) (if TDS credit is claimed)",t:"txt",w:"230px",max:10}],
    p.tenants||[], {min:"900px", empty:"No tenant listed.", add:"Add a tenant"});
  b += note("Furnishing the PAN of the tenant is mandatory if tax is deducted u/s 194-IB; furnishing the "+
    "TAN of the tenant is mandatory if tax is deducted u/s 194-I (sheet note, row 48).");

  /* --- the working a–j (always full — no self-occupied branch) --- */
  b += sub("Computation of income from the property");
  b += row("a · Gross rent received or receivable or lettable value", inp(pre+"rent",{n:1}),
           {req:1, ref:"1a", hint:"higher of the two if let out for the whole year — a let-out / deemed let-out property cannot have nil rent"});
  b += row("b · The amount of rent which cannot be realized", inp(pre+"unreal",{n:1}), {ref:"1b", hint:"cannot exceed 1a"});
  b += row("c · Tax paid to local authorities", inp(pre+"taxes",{n:1}), {ref:"1c"});
  b += row("d · Total (1b + 1c)", cell(r.d), {ref:"1d", cls:"tot"});
  b += row("e · Annual value (1a − 1d)", cell(r.e), {ref:"1e", cls:"tot"});
  b += row("f · 30% of 1e", cell(r.f), {ref:"1f", cls:"tot", hint:"standard deduction u/s 24(a)"});

  /* --- 24(b) loan table (inside the block) — feeds item g --- */
  b += sub("g · Interest payable on borrowed capital — Section 24(b)");
  b += note("One row per loan; every column is required on a filled row. The interest sums into "+
    "Total Interest u/s 24(b) and into item g. Interest is admitted only when the assessee's share > 0 "+
    "and the annual value (1a) > 0 (rule A189).");
  b += grid(pre.slice(0,-1)+".loans",[
      {k:"from",h:"Loan taken from",t:"sel",w:"180px",req:1,opts:HP_LOANFROM},
      {k:"name",h:"Name of the bank / institution / person",t:"txt",w:"auto",req:1,max:125},
      {k:"acno",h:"Loan Account number of the Bank / Institution",t:"txt",w:"210px",req:1,max:20},
      {k:"dt",h:"Date of sanction of loan",t:"date",w:"150px",req:1},
      {k:"amt",h:"Total amount of loan",t:"num",w:"150px",req:1},
      {k:"os",h:"Loan outstanding as on 31-03-2026",t:"num",w:"180px",req:1},
      {k:"interest",h:"Interest on Borrowed capital u/s 24(b)",t:"num",w:"180px",req:1}],
    p.loans||[], {min:"1370px", empty:"No loan.", add:"Add a loan",
      foot:[{l:1,v:"Total Interest on borrowed capital u/s 24(b)",span:6},{v:r.hRaw}]});
  let gHint = "";
  if(!r.guard && r.hRaw>0) gHint = "not admissible — the assessee's share is nil or the annual value (1a) is nil";
  b += row("g · Interest payable on borrowed capital", cell(r.g), {ref:"1g", cls:"tot", hint:gHint});

  b += row("h · Total (1f + 1g)", cell(r.h), {ref:"1h", cls:"tot"});
  b += row("i · Arrears / Unrealized Rent received during the year, less 30%", inp(pre+"arrears",{n:1}),
           {ref:"1i", hint:"enter the amount already net of the 30% deduction"});
  b += row("j · Income from house property "+ordinal+" (1e − 1h + 1i)", cell(r.j), {ref:"1j", cls:"grand"});

  return blk(id, "Property "+ordinal+(st0(p.addr)?" — "+st0(p.addr):""), status, b, "hp.props."+i);
}

function secHp(){
  const C = S.C.hp || {};
  let h = "";
  h += row("Is there income or a loss from house property?",
           sel("hp.on",[["","No"],["1","Yes"]],{blank:false}), {req:1, ref:"Schedule HP"});
  if(!S.hp.on) return h;

  h += note("One block per property, unlimited. Type is Let Out or Deemed Let Out only — a trust/institution "+
    "has no self-occupied house, so the full a–j working always runs and the gross rent (1a) must be more than "+
    "nil. The Section 24(b) loan table sits inside each block and sums into item g; the 30% standard deduction "+
    "(item f) is 30% of the annual value (1e) directly — there is no 'share × annual value' line on ITR-7.");

  (S.hp.props||[]).forEach((p,i)=>h += hpBlock(p, i, i+1));
  h += '<button class="add" data-addprop="1">Add a property</button>';

  h += sub("Across all properties");
  h += row("Σ1j · Income from all properties", cell(C.sum1j), {cls:"tot"});
  if(C.ptiFromSch)
    h += row("2 · Pass through income / Loss — from Schedule PTI", cell(C.pti),
             {ref:"2", hint:"the house-property row(s) of Schedule PTI"});
  else
    h += row("2 · Pass through income / Loss (if any)", inp("hp.pti",{n:1}),
             {ref:"2", hint:"from Schedule PTI — leave blank if none"});
  h += row('3 · Income under the head "Income from house property" (Σ1j + 2)', cell(C.total),
           {ref:"3", cls:"grand",
            hint:C.total<0?"a loss — to 2i of Schedule CYLA, the set-off capped at ₹2,00,000; the balance remaining carries to CFL":""});
  if(C.total<0){
    h += row("Loss allowed to be set off this year (capped at ₹2,00,000) → CYLA 2i", cell(-C.loss), {cls:"tot"});
    if(C.cflExcess>0)
      h += row("Loss remaining, carried forward under Schedule CFL", cell(-C.cflExcess), {cls:"tot"});
  }
  return h;
}

/* ---- export ------------------------------------------------------ */
function expHp(j){
  const C = S.C.hp || {};
  if(!(S.hp && S.hp.on && (S.hp.props||[]).length)) return;

  const items = (S.hp.props||[]).map((p,i)=>{
    const r = p._ || engProp(p);
    const inIndia = (p.country||"91")==="91";
    const ad = {
      AddrDetail:(sv(p.addr)||"NA").slice(0,250),
      CityOrTownOrDistrict:(sv(p.city)||"NA").slice(0,50),
      StateCode: inIndia ? (HP_STATE_SET[st0(p.state)]?st0(p.state):"19") : "99",
      CountryCode:(HP_COUNTRY_SET[st0(p.country)]?st0(p.country):"91").slice(0,4)
    };
    if(inIndia){ if(/^[1-9]\d{5}$/.test(st0(p.pin))) ad.PinCode=parseInt(p.pin,10); }
    else if(sv(p.zip)) ad.ZipCode=sv(p.zip).slice(0,8);

    /* Rentdetails — every schema-required leaf written, even when zero
       (direct literal, not put(), so 0 is retained). */
    const rd = {
      AnnualLetableValue:n0(r.a),               /* 1a */
      RentNotRealized:n0(r.b),                  /* 1b */
      LocalTaxes:n0(r.c),                       /* 1c */
      TotalUnrealizedAndTax:n0(r.d),            /* 1d */
      BalanceALV:n0(r.e),                       /* 1e */
      ThirtyPercentOfBalance:n0(r.f),           /* 1f */
      IntOnBorwCap:n0(r.g),                     /* 1g */
      TotalDeduct:n0(r.h),                      /* 1h */
      IncomeOfHP:sg(r.j)                        /* 1j (signed) */
    };
    if(r.ar) rd.ArrearsUnrealizedRentRcvd=sg(r.ar);   /* 1i — optional, write when non-zero */

    const ln = (p.loans||[]).filter(l=>N(l.interest));
    if(ln.length){
      rd.Section24B = {
        Section24BDtls: ln.map(l=>({
          LoanTknFrom:l.from==="I"?"I":"B",
          BankOrInstnName:(sv(l.name)||"NA").slice(0,125),
          LoanAccNoOfBankOrInstnRefNo:(sv(l.acno)||"NA").slice(0,20),
          DateofLoan:ISO(l.dt)||"2025-04-01",
          TotalLoanAmt:n0(l.amt),
          LoanOutstndngAmt:n0(l.os),
          InterestUs24B:n0(l.interest)
        })),
        TotalInterestUs24B:n0(r.hRaw)             /* Σ rows (A192) */
      };
    }

    const it = {
      HPSNo:i+1,
      AddressDetailWithZipCode:ad,
      PropertyOwner:(p.owner==="DO"?"DO":"SE"),
      PropCoOwnedFlg:(p.co==="YES"?"YES":"NO"),
      AssessePercentShareProp:r.share,            /* required number */
      ifLetOut:(p.type==="D"?"D":"Y"),            /* Y/D only; coerce anything else to Y */
      Rentdetails:rd
    };

    const co = (p.coowners||[]).filter(x=>st0(x.name));
    if(p.co==="YES" && co.length) it.CoOwners=co.map((x,k)=>{
      const c={CoOwnersSNo:k+1, NameCoOwner:st0(x.name).slice(0,125)};
      if(PAN_RE.test(st0(x.pan).toUpperCase())) c.PAN_CoOwner=st0(x.pan).toUpperCase();
      if(AADH.test(st0(x.aadhaar))) c.Aadhaar_CoOwner=st0(x.aadhaar);
      if(N(x.share)) c.PercentShareProperty=N(x.share);
      return c;
    });
    const tn = (p.tenants||[]).filter(x=>st0(x.name));
    if(tn.length) it.TenantDetails=tn.map((x,k)=>{
      const t={TenantSNo:k+1, NameofTenant:st0(x.name).slice(0,125)};
      if(PAN_RE.test(st0(x.pan).toUpperCase())) t.PANofTenant=st0(x.pan).toUpperCase();
      if(AADH.test(st0(x.aadhaar))) t.AadhaarofTenant=st0(x.aadhaar);
      if(sv(x.pantan)) t.PANTANofTenant=st0(x.pantan).toUpperCase().slice(0,10);
      return t;
    });
    return it;
  });

  j.ScheduleHP = { PropertyDetails:items, TotalIncomeChargeableUnHP:sg(C.total) };
  if(C.pti) j.ScheduleHP.PassThroghIncome=sg(C.pti);
}

/* ---- import ------------------------------------------------------ */
function impHp(I){
  if(!(I && I.ScheduleHP)) return [];
  const hp = I.ScheduleHP;
  S.hp = {
    on:"1",
    pti:nz(hp.PassThroghIncome),
    props:(hp.PropertyDetails||[]).map(p=>{
      const ad = p.AddressDetailWithZipCode||{}, rd = p.Rentdetails||{};
      return {
        addr:ad.AddrDetail||"", city:ad.CityOrTownOrDistrict||"",
        state:ad.StateCode||"", country:ad.CountryCode||"91",
        pin:ad.PinCode!=null?String(ad.PinCode):"", zip:ad.ZipCode||"",
        owner:p.PropertyOwner==="DO"?"DO":"SE",
        co:p.PropCoOwnedFlg==="YES"?"YES":"NO",
        share:nz(p.AssessePercentShareProp),
        coowners:(p.CoOwners||[]).map(c=>({name:c.NameCoOwner||"", pan:c.PAN_CoOwner||"",
          aadhaar:c.Aadhaar_CoOwner||"", share:nz(c.PercentShareProperty)})),
        type:p.ifLetOut==="D"?"D":"Y",
        tenants:(p.TenantDetails||[]).map(t=>({name:t.NameofTenant||"", pan:t.PANofTenant||"",
          aadhaar:t.AadhaarofTenant||"", pantan:t.PANTANofTenant||""})),
        rent:nz(rd.AnnualLetableValue), unreal:nz(rd.RentNotRealized), taxes:nz(rd.LocalTaxes),
        arrears:nz(rd.ArrearsUnrealizedRentRcvd),
        loans:(RG(rd,"Section24B.Section24BDtls",[])||[]).map(l=>({
          from:l.LoanTknFrom==="I"?"I":"B", name:l.BankOrInstnName||"", acno:l.LoanAccNoOfBankOrInstnRefNo||"",
          dt:dmy(l.DateofLoan)||"", amt:nz(l.TotalLoanAmt), os:nz(l.LoanOutstndngAmt),
          interest:nz(l.InterestUs24B)}))
      };
    })
  };
  return ["Schedule HP (income from house property)"];
}

/* ---- checks ------------------------------------------------------ */
function chkHp(){
  const out = [];
  if(!(S.hp && S.hp.on)) return out;
  const myPan = st0((S.pi||{}).pan).toUpperCase();

  (S.hp.props||[]).forEach((p,n)=>{
    const r = p._ || engProp(p);
    const L = "Property "+(n+1);

    /* required address */
    if(!st0(p.addr)) out.push({lvl:"err", t:L, m:"The address of the property is required.", sec:"hp"});
    if(!st0(p.city)) out.push({lvl:"err", t:L, m:"Town / City is required.", sec:"hp"});
    if((p.country||"91")==="91" && !HP_STATE_SET[st0(p.state)])
      out.push({lvl:"err", t:L, m:"State is required for a property in India.", sec:"hp"});
    /* owner Self / Deemed owner only */
    if(p.owner!=="SE" && p.owner!=="DO")
      out.push({lvl:"err", t:L, m:"Select the owner of the property — Self or Deemed owner.", sec:"hp"});
    /* type Let Out / Deemed Let Out only */
    if(p.type!=="Y" && p.type!=="D")
      out.push({lvl:"err", t:L, m:"Select the type of house property — Let Out or Deemed Let Out (there is no self-occupied on ITR-7).", sec:"hp"});

    /* gross rent must be > 0 for a let-out / deemed let-out property (A186) */
    if(!(N(p.rent)>0))
      out.push({lvl:"err", t:L, m:"A let-out or deemed let-out property needs a gross rent / lettable value (1a) greater than nil.", sec:"hp"});
    /* local tax not allowed if 1a is zero/null (A185) */
    if(N(p.taxes)>0 && !(N(p.rent)>0))
      out.push({lvl:"warn", t:L, m:"Tax paid to local authorities (1c) cannot be claimed when the gross rent (1a) is nil.", sec:"hp"});
    /* unrealised rent cannot exceed the gross rent */
    if(N(p.unreal) > N(p.rent))
      out.push({lvl:"warn", t:L, m:"The amount of rent that cannot be realised (1b) cannot exceed the gross rent (1a).", sec:"hp"});

    /* co-ownership: shares total 100 (A188); PAN or Aadhaar per co-owner;
       co-owner PAN ≠ assessee PAN (A190); assessee share > 0 to claim interest (A189) */
    if(p.co==="YES"){
      if(!(N(p.share)>0))
        out.push({lvl:"err", t:L, m:"Enter the assessee's percentage of share in the co-owned property.", sec:"hp"});
      if(!(p.coowners||[]).some(x=>st0(x.name)))
        out.push({lvl:"err", t:L, m:"List the other co-owner(s) of the property.", sec:"hp"});
      if(Math.abs(r.share+r.coShare-100)>0.01)
        out.push({lvl:"err", t:L, m:"The assessee's share plus the co-owners' shares must total 100%.", sec:"hp"});
      (p.coowners||[]).forEach((x,m)=>{
        const CL = L+", co-owner "+(m+1);
        if(!st0(x.name))
          out.push({lvl:"err", t:CL, m:"The co-owner's name is required.", sec:"hp"});
        if(!PAN_RE.test(st0(x.pan).toUpperCase()) && !AADH.test(st0(x.aadhaar)))
          out.push({lvl:"warn", t:CL, m:"The PAN or Aadhaar of the co-owner should be provided.", sec:"hp"});
        if(st0(x.pan) && !PAN_RE.test(st0(x.pan).toUpperCase()))
          out.push({lvl:"err", t:CL, m:"The PAN is not in the correct form.", sec:"hp"});
        if(myPan && st0(x.pan).toUpperCase()===myPan)
          out.push({lvl:"err", t:CL, m:"A co-owner's PAN cannot be the same as the assessee's own PAN.", sec:"hp"});
        if(N(x.share)>=100)
          out.push({lvl:"err", t:CL, m:"Each co-owner's share must be less than 100%.", sec:"hp"});
      });
      if(r.share===0 && r.hRaw>0)
        out.push({lvl:"err", t:L, m:"Interest u/s 24(b) cannot be claimed on a co-owned property in which the assessee's share is nil (rule A189).", sec:"hp"});
    }

    /* tenant PAN form */
    (p.tenants||[]).forEach((x,m)=>{
      if(st0(x.pan) && !PAN_RE.test(st0(x.pan).toUpperCase()))
        out.push({lvl:"err", t:L+", tenant "+(m+1), m:"The PAN is not in the correct form.", sec:"hp"});
    });

    /* interest not admissible when share is nil or the annual value (1a) is nil (A189) */
    if(r.barredGuard)
      out.push({lvl:"warn", t:L, m:"Interest u/s 24(b) is admitted only when the assessee's share > 0 and the annual value (1a) > 0; it has been set to nil for this property.", sec:"hp"});

    /* every column of a 24(b) loan row required to claim the deduction (A191/A193) */
    (p.loans||[]).filter(l=>N(l.interest)).forEach((l,m)=>{
      if(!st0(l.from)||!st0(l.name)||!st0(l.acno)||!ISO(l.dt)||!(N(l.amt)>0)||!(N(l.os)>=0))
        out.push({lvl:"err", t:L+", loan "+(m+1), m:"Every column of the Section 24(b) loan row is required (lender, name, account no., date of sanction, total loan, amount outstanding).", sec:"hp"});
    });
  });

  return out;
}

/* ---- register ---------------------------------------------------- */
reg({id:"hp", t:"Income from house property", ref:"Schedule HP",
     f:secHp,
     s:()=>{ const C=S.C.hp||{}; if(!(S.hp&&S.hp.on)) return "None";
       return C.total<0 ? "Loss "+CR(-C.total)
            : (C.total ? "Income "+CR(C.total)
                       : ((S.hp.props||[]).length+" property")); },
     eng:engHp, exp:expHp, imp:impHp, chk:chkHp, order:40, corder:40});

/* =====================================================================
   ITR-7 · Section "ie" — Income & Expenditure statements (Schedule IE-1/2/3/4)
   Screen ref: Schedule IE-1 / IE-2 / IE-3 / IE-4.  Screen order 30, compute order 28.

   Owns (built ONLY from books/ITR-7/Schedule_IE_1.md..4, section_map.json
   ["Schedule IE-1..4" -> "ie"], enums.json and the ITR-7 schema):
     · ScheduleIE_I    (regime 1 — blanket-exemption regimes 10(21)/10(23AAA)/
        10(23B)/10(23D)/10(23DA)/10(23EC)/10(23ED)/10(23EE)/10(23FB)/10(29A)/
        10(46)/10(46A)/10(46B)/10(47)/10(21) r.w. 35(1)): three plain figures —
        TotRcptVoluntaryContr, AppIncTwrdsObjInstn, AccmltnOfInc.
     · ScheduleIE_II   (regime 2 — 10(23A)/10(24)): the same three figures (Row A,
        exempt receipts) plus the taxable-heads gate AnyIncomeTaxable + head flags
        HPIncome/BPIncome/CGIncome/OSIncome (Yes routes to HP/BP/CG/OS).
     · ScheduleIE_III  (regime 3 — 10(23C)(iiiab)/(iiiac)): per-institution table
        ScheduleIEIIIDtls[] {objective EDU/MED, address+State code+PIN, total receipts,
        Government grants, amount applied, balance accumulated}; the exemption condition
        is Government grants exceeding 50% of total receipts.
     · ScheduleIE_IV   (regime 4 — 10(23C)(iiiad)/(iiiae)): per-institution table
        ScheduleIEIVDtls[] {objective, address, gross annual receipts, amount applied,
        balance accumulated} + SumGrossAnnualReceipts, tested against the Rs 5-crore ceiling.

   Which IE applies is driven by the exemption regime (SecExemptionClaimed) read from
   S.C.who.exsec (falling back to S.pi.exsec); when the regime does not select an IE the
   section falls back to whichever statement the user has actually filled. Only the ONE
   active statement is exported, so at most one ScheduleIE_* block appears in a return.

   Seam: publishes S.C.ie.{active, ex, regIE, receipts, applied, accumulation, anyTax,
   heads, sumReceipts, i3n, i4n, govtOK, ceilingOK} for the tax section (order 90), which
   routes the IE-2 taxable heads and reads the statement figures. No other builder writes
   the ScheduleIE_* blocks.

   Enums (verbatim from the ITR-7 schema, NOT the display words in the book's dropdown):
     · ObjectiveOfInstitution -> "EDU"/"MED"   (book shows Educational/Medical)
     · AnyIncomeTaxable / head flags -> "Y"/"N" (book shows Yes/No)
     · StateCode -> 2-digit code "01".."37"     (book shows "01-ANDAMAN…"; the coded value
        is the schema enum, the label is the display)
   ===================================================================== */

/* ---- objective (schema enum EDU/MED; display from the book) ---------- */
const IE_OBJ=[["EDU","Educational"],["MED","Medical"]];
/* ---- Yes/No routing flags (schema enum Y/N; display Yes/No) ---------- */
const IE_YN=[["Y","Yes"],["N","No"]];
/* ---- State (schema StateCode enum -> the book's verbatim display list;
   value is the 2-digit code, label is the utility's StateIE3 dropdown text) */
const IE_STATE=[
  ["01","01-ANDAMAN AND NICOBAR ISLANDS"],["02","02-ANDHRA PRADESH"],
  ["03","03-ARUNACHAL PRADESH"],["04","04-ASSAM"],["05","05-BIHAR"],
  ["06","06-CHANDIGARH"],["07","07-DADRA AND NAGAR HAVELI"],["08","08-DAMAN AND DIU"],
  ["09","09-DELHI"],["10","10-GOA"],["11","11-GUJARAT"],["12","12-HARYANA"],
  ["13","13-HIMACHAL PRADESH"],["14","14-JAMMU AND KASHMIR"],["15","15-KARNATAKA"],
  ["16","16-KERALA"],["17","17-LAKHSWADEEP"],["18","18-MADHYA PRADESH"],
  ["19","19-MAHARASHTRA"],["20","20-MANIPUR"],["21","21-MEGHALAYA"],["22","22-MIZORAM"],
  ["23","23-NAGALAND"],["24","24-ODISHA"],["25","25-PUDUCHERRY"],["26","26-PUNJAB"],
  ["27","27-RAJASTHAN"],["28","28-SIKKIM"],["29","29-TAMILNADU"],["30","30-TRIPURA"],
  ["31","31-UTTAR PRADESH"],["32","32-WEST BENGAL"],["33","33-CHHATISHGARH"],
  ["34","34-UTTARAKHAND"],["35","35-JHARKHAND"],["36","36-TELANGANA"],["37","37-LADAKH"]];

/* ---- exemption-regime -> which IE statement (from the four head notes) --
   codes from enums.json PartA_GEN1.OrgFirmInfo.SecExemptionClaimed. */
const IE_REGIME={
  /* IE-1 : blanket-exemption regimes, no application test */
  "21":1,"23AAA":1,"23B":1,"23D":1,"23DA":1,"23EC":1,"23ED":1,"23EE":1,
  "23FB":1,"29A":1,"26":1,"46A":1,"46B":1,"47":1,"2135I":1,
  /* IE-2 : certain heads taxable, rest exempt */
  "23A":2,"24":2,
  /* IE-3 : wholly/substantially govt-financed education/medical */
  "23CIIIAB":3,"23CIIIAC":3,
  /* IE-4 : small education/medical under the receipts ceiling */
  "23CIIIAD":4,"23CIIIAE":4};
const IE_CEILING=50000000;   /* Rs 5 crore — IE-4 aggregate-receipts ceiling */

/* ---- state seed (own namespace; not pre-seeded in 10_state.js) -------- */
S.ie = S.ie || {};
if(S.ie.rcpt===undefined)   S.ie.rcpt="";     /* Row A / IE-1 total receipts incl. voluntary contribution */
if(S.ie.appl===undefined)   S.ie.appl="";     /* application towards object */
if(S.ie.accum===undefined)  S.ie.accum="";    /* accumulation of income */
if(S.ie.anyTax===undefined) S.ie.anyTax="N";  /* IE-2 gate: any income taxable? (required Y/N) */
if(S.ie.hp===undefined)     S.ie.hp="N";      /* IE-2 head flags (only when anyTax=Y) */
if(S.ie.bp===undefined)     S.ie.bp="N";
if(S.ie.cg===undefined)     S.ie.cg="N";
if(S.ie.os===undefined)     S.ie.os="N";
S.ie.i3 = S.ie.i3 || [];    /* ScheduleIEIIIDtls[] — one row per institution (IE-3) */
S.ie.i4 = S.ie.i4 || [];    /* ScheduleIEIVDtls[]  — one row per institution (IE-4) */

/* ---- helpers -------------------------------------------------------- */
function _ieEx(){                                   /* the exemption code driving the statement */
  return st0(RG(S,"C.who.exsec","")||RG(S,"pi.exsec",""));
}
function _ieObj(v){return v==="MED"?"MED":"EDU";}
function _ieState(v){v=st0(v);return IE_STATE.some(s=>s[0]===v)?v:"";}
const _iePIN=/^[1-9][0-9]{5}$/;
/* a row counts as "live" once its objective and enough of its required address
   /receipt fields are present (mirrors the bank section's complete-row filter). */
function _ieLive(r){r=r||{};
  return st0(r.flat)&&st0(r.area)&&st0(r.town)&&_ieState(r.state)&&_iePIN.test(st0(r.pin));}
function _ieI3(){return (S.ie.i3||[]).filter(_ieLive);}
function _ieI4(){return (S.ie.i4||[]).filter(_ieLive);}

/* ---- engine — resolve the active statement, publish S.C.ie ---------- */
function engIE(){
  const ex=_ieEx();
  const regIE=IE_REGIME[ex]||0;
  const rcpt=sg(S.ie.rcpt), appl=sg(S.ie.appl), accum=sg(S.ie.accum);
  const anyTax=(S.ie.anyTax==="Y")?"Y":(S.ie.anyTax==="N")?"N":"";
  const i3=_ieI3(), i4=_ieI4();
  const hasA=!!(N(S.ie.rcpt)||N(S.ie.appl)||N(S.ie.accum));
  const dataIE = i3.length?3 : i4.length?4 : (anyTax==="Y"?2 : hasA?1 : 0);
  /* S.ie.active is set only by imp() when a return is loaded; otherwise the
     regime chooses, then the data the user has filled. */
  const active = (S.ie.active===1||S.ie.active===2||S.ie.active===3||S.ie.active===4)
    ? S.ie.active : (regIE||dataIE);

  const heads={hp:S.ie.hp==="Y"?"Y":"N",bp:S.ie.bp==="Y"?"Y":"N",
    cg:S.ie.cg==="Y"?"Y":"N",os:S.ie.os==="Y"?"Y":"N"};
  const sumRcpt=i4.reduce((s,r)=>s+sg(r.rcpt),0);
  /* IE-3 "substantially financed": Government grant exceeds 50% of total receipts */
  const govtFail=i3.filter(r=>!(sg(r.grants)*2>sg(r.rcpt))).length;

  S.C.ie={
    active, ex, regIE,
    receipts:rcpt, applied:appl, accumulation:accum,
    anyTax:anyTax==="Y"?"Y":"N",
    heads,                              /* IE-2 routing for the tax section */
    i3n:i3.length, i4n:i4.length,
    sumReceipts:sumRcpt,
    govtOK: i3.length?govtFail===0:true,     /* every institution passes the 50% test */
    ceilingOK: sumRcpt<=IE_CEILING           /* IE-4 aggregate <= Rs 5 crore */
  };
}

/* ---- renderer ------------------------------------------------------- */
function secIE(){
  engIE();
  const A=(S.C.ie||{}).active||0, ex=(S.C.ie||{}).ex||"";
  let h="";

  h+=note("The Income &amp; Expenditure statement is chosen automatically by the exemption "+
    "section claimed in <b>Who is filing</b> (Part A - General). Only the statement for the "+
    "regime you claim is shown; if you claim exemption under section 11 or 10(23C)(iv)-(via) "+
    "no IE statement applies (the application of income is stated in Schedule A instead).");
  h+=row("Exemption section claimed",'<span class="c">'+(esc(ex)||"—")+'</span>',
    {ref:"A17 ii",hint:"from Who is filing"});

  if(A===1){
    /* ---------- Schedule IE-1 ---------- */
    h+=sub("Schedule IE-1 — Income &amp; Expenditure statement");
    h+=note("Applicable for exemption under sections 10(21), 10(23AAA), 10(23B), 10(23D), "+
      "10(23DA), 10(23EC), 10(23ED), 10(23EE), 10(23FB), 10(29A), 10(46), 10(46A), 10(46B), "+
      "10(47) and 10(21) read with section 35(1). These exemptions are not subject to a "+
      "computational or application test — state the money that moved.");
    h+=row("1. Total receipts including any voluntary contribution",inp("ie.rcpt",{n:1}),{req:1,ref:"IE-1 row 4"});
    h+=row("2. Application of income towards object of the institution",inp("ie.appl",{n:1}),{req:1,ref:"IE-1 row 5"});
    h+=row("3. Accumulation of income",inp("ie.accum",{n:1}),{req:1,ref:"IE-1 row 6"});

  } else if(A===2){
    /* ---------- Schedule IE-2 ---------- */
    h+=sub("Schedule IE-2 — Income &amp; Expenditure statement");
    h+=note("Applicable for exemption under sections 10(23A) and 10(24), where only certain "+
      "heads of income are taxable and the other receipts (Row A) are exempt.");
    h+=row("A. Total receipts including any voluntary contribution",inp("ie.rcpt",{n:1}),
      {req:1,ref:"IE-2 row 4",hint:"excluding receipts under taxable heads (Row B)"});
    h+=row("Application of income towards object of the institution",inp("ie.appl",{n:1}),{req:1,ref:"IE-2 row 5"});
    h+=row("Accumulation of income",inp("ie.accum",{n:1}),{req:1,ref:"IE-2 row 6"});
    h+=row("B. Do you have any income which is taxable?",sel("ie.anyTax",IE_YN,{blank:true}),
      {req:1,ref:"IE-2 row 7"});
    if(S.ie.anyTax==="Y"){
      h+=note("For each head marked <b>Yes</b>, the corresponding computational schedule must be "+
        "filled and that income offered to tax; everything in Row A stays exempt.");
      h+=row("a. Income from House Property (fill Schedule HP)",sel("ie.hp",IE_YN,{blank:false}),{ref:"IE-2 row 8"});
      h+=row("b. Income from Business or Profession (fill Schedule BP)",sel("ie.bp",IE_YN,{blank:false}),{ref:"IE-2 row 9"});
      h+=row("c. Income from Capital gains (fill Schedule CG)",sel("ie.cg",IE_YN,{blank:false}),{ref:"IE-2 row 10"});
      h+=row("d. Income from other Sources (fill Schedule OS)",sel("ie.os",IE_YN,{blank:false}),{ref:"IE-2 row 11"});
    }

  } else if(A===3){
    /* ---------- Schedule IE-3 ---------- */
    h+=sub("Schedule IE-3 — Income &amp; Expenditure statement (per institution)");
    h+=note("Applicable for exemption under sections 10(23C)(iiiab) or 10(23C)(iiiac). Fill the "+
      "address for each institution separately. Exemption is subject to Government grants "+
      "exceeding fifty per cent of the total receipts including voluntary contribution.");
    h+=grid("ie.i3",_ieAddrCols().concat([
      {k:"rcpt",  h:"Total receipts incl. voluntary contribution",t:"num",w:"150px",req:1},
      {k:"grants",h:"Government grants (out of receipts)",t:"num",w:"150px",req:1},
      {k:"appl",  h:"Amount applied for objective",t:"num",w:"150px",req:1},
      {k:"bal",   h:"Balance accumulated",t:"calc",w:"140px",f:(r)=>sg(r.rcpt)-sg(r.appl)}]),
      S.ie.i3,{min:"1800px",empty:"No institution entered.",add:"Add an institution"});
    if((S.C.ie||{}).govtOK===false)
      h+=note("At least one institution's Government grant does not exceed 50% of its total "+
        "receipts — the 10(23C)(iiiab)/(iiiac) condition of being substantially financed by "+
        "the Government is not met for that institution.","warn");

  } else if(A===4){
    /* ---------- Schedule IE-4 ---------- */
    h+=sub("Schedule IE-4 — Income &amp; Expenditure statement (per institution)");
    h+=note("Applicable for exemption under sections 10(23C)(iiiad) or 10(23C)(iiiae). Fill the "+
      "address for each institution separately. Exemption is subject to the total receipts from "+
      "all the institutions/universities not exceeding five crore rupees.");

  } else {
    h+=note("No Income &amp; Expenditure statement applies to the exemption section currently "+

/* ---- export --------------------------------------------------------- */
function expIE(j){
  const C=S.C.ie||{}; const A=C.active||0;

  if(A===1){
    /* ScheduleIE_I — three required integers (written even when 0) */
    put(j,"ScheduleIE_I.TotRcptVoluntaryContr",sg(S.ie.rcpt));
    put(j,"ScheduleIE_I.AppIncTwrdsObjInstn",sg(S.ie.appl));
    put(j,"ScheduleIE_I.AccmltnOfInc",sg(S.ie.accum));

  } else if(A===2){
    /* ScheduleIE_II — Row A three integers + the taxable-heads gate */
    put(j,"ScheduleIE_II.TotRcptVoluntaryContr",sg(S.ie.rcpt));
    put(j,"ScheduleIE_II.AppIncTwrdsObjInstn",sg(S.ie.appl));
    put(j,"ScheduleIE_II.AccmltnOfInc",sg(S.ie.accum));
    const yes=S.ie.anyTax==="Y";
    put(j,"ScheduleIE_II.AnyIncomeTaxable",yes?"Y":"N");
    if(yes){                                  /* all four head flags accompany a Yes */
      put(j,"ScheduleIE_II.HPIncome",S.ie.hp==="Y"?"Y":"N");
      put(j,"ScheduleIE_II.BPIncome",S.ie.bp==="Y"?"Y":"N");
      put(j,"ScheduleIE_II.CGIncome",S.ie.cg==="Y"?"Y":"N");
      put(j,"ScheduleIE_II.OSIncome",S.ie.os==="Y"?"Y":"N");
    }

  } else if(A===3){
    /* ScheduleIE_III — ScheduleIEIIIDtls[] (only complete institution rows) */
    const rows=_ieI3().map(r=>{
      const rcpt=sg(r.rcpt), appl=sg(r.appl);
      const el={};
      pf(el,"ObjectiveOfInstitution",_ieObj(r.obj));
      pf(el,"FlatDoorBlockNumber",st0(r.flat).slice(0,50));
      if(st0(r.prem))pf(el,"PremisesBuildingName",st0(r.prem).slice(0,50));
      if(st0(r.road))pf(el,"RoadStreetPostOffice",st0(r.road).slice(0,50));
      pf(el,"AreaLocality",st0(r.area).slice(0,50));
      pf(el,"TownCityDistrict",st0(r.town).slice(0,50));
      pf(el,"StateCode",_ieState(r.state));
      pf(el,"PinCode",N(r.pin));
      pf(el,"TotRcptVoluntaryContr",rcpt);
      pf(el,"GovtGrants",sg(r.grants));
      pf(el,"AmountAppliedObj",appl);
      pf(el,"BalanceAccumulated",n0(rcpt-appl));
      return el;});
    if(rows.length)j.ScheduleIE_III={ScheduleIEIIIDtls:rows};

  } else if(A===4){
    /* ScheduleIE_IV — ScheduleIEIVDtls[] + SumGrossAnnualReceipts */
    const rows=_ieI4().map(r=>{
      const rcpt=sg(r.rcpt), appl=sg(r.appl);
      const el={};
      pf(el,"ObjectiveOfInstitution",_ieObj(r.obj));
      pf(el,"FlatDoorBlockNumber",st0(r.flat).slice(0,50));
      if(st0(r.prem))pf(el,"PremisesBuildingName",st0(r.prem).slice(0,50));
      if(st0(r.road))pf(el,"RoadStreetPostOffice",st0(r.road).slice(0,50));
      pf(el,"AreaLocality",st0(r.area).slice(0,50));
      pf(el,"TownCityDistrict",st0(r.town).slice(0,50));
      pf(el,"StateCode",_ieState(r.state));
      pf(el,"PinCode",N(r.pin));
      pf(el,"GrossAnnualReceipts",rcpt);
      pf(el,"AmountAppliedObj",appl);
      pf(el,"BalanceAccumulated",n0(rcpt-appl));
      return el;});
    if(rows.length)
      j.ScheduleIE_IV={ScheduleIEIVDtls:rows,
        SumGrossAnnualReceipts:rows.reduce((s,e)=>s+N(e.GrossAnnualReceipts),0)};
  }
}

/* ---- import (inverse) ---------------------------------------------- */
function impIE(I){
  const read=[]; S.ie=S.ie||{};
  const I1=I&&I.ScheduleIE_I, I2=I&&I.ScheduleIE_II,
        I3=I&&I.ScheduleIE_III, I4=I&&I.ScheduleIE_IV;

  if(I1){
    S.ie.rcpt=N(I1.TotRcptVoluntaryContr);
    S.ie.appl=N(I1.AppIncTwrdsObjInstn);
    S.ie.accum=N(I1.AccmltnOfInc);
    S.ie.active=1; read.push("Schedule IE-1");
  } else if(I2){
    S.ie.rcpt=N(I2.TotRcptVoluntaryContr);
    S.ie.appl=N(I2.AppIncTwrdsObjInstn);
    S.ie.accum=N(I2.AccmltnOfInc);
    S.ie.anyTax=I2.AnyIncomeTaxable==="Y"?"Y":"N";
    S.ie.hp=I2.HPIncome==="Y"?"Y":"N";
    S.ie.bp=I2.BPIncome==="Y"?"Y":"N";
    S.ie.cg=I2.CGIncome==="Y"?"Y":"N";
    S.ie.os=I2.OSIncome==="Y"?"Y":"N";
    S.ie.active=2; read.push("Schedule IE-2");
  }
  if(I3&&Array.isArray(I3.ScheduleIEIIIDtls)){
    S.ie.i3=I3.ScheduleIEIIIDtls.map(e=>({
      obj:_ieObj(e.ObjectiveOfInstitution),
      flat:e.FlatDoorBlockNumber||"", prem:e.PremisesBuildingName||"",
      road:e.RoadStreetPostOffice||"", area:e.AreaLocality||"",
      town:e.TownCityDistrict||"", state:_ieState(e.StateCode),
      pin:e.PinCode==null?"":String(e.PinCode),
      rcpt:N(e.TotRcptVoluntaryContr), grants:N(e.GovtGrants),
      appl:N(e.AmountAppliedObj)}));
    S.ie.active=3; read.push("Schedule IE-3");
  }
  if(I4&&Array.isArray(I4.ScheduleIEIVDtls)){
    S.ie.i4=I4.ScheduleIEIVDtls.map(e=>({
      obj:_ieObj(e.ObjectiveOfInstitution),
      flat:e.FlatDoorBlockNumber||"", prem:e.PremisesBuildingName||"",
      road:e.RoadStreetPostOffice||"", area:e.AreaLocality||"",
      town:e.TownCityDistrict||"", state:_ieState(e.StateCode),
      pin:e.PinCode==null?"":String(e.PinCode),
      rcpt:N(e.GrossAnnualReceipts), appl:N(e.AmountAppliedObj)}));
    S.ie.active=4; read.push("Schedule IE-4");
  }
  return read;
}

/* ---- checks (section-local; not the CBDT rule engine) -------------- */
function chkIE(){
  const out=[]; engIE();
  const C=S.C.ie||{}, A=C.active||0;

  if(A===1||A===2){
    if(!(N(S.ie.rcpt)||N(S.ie.appl)||N(S.ie.accum)))
      out.push({lvl:"warn",t:"IE statement",m:"The Income & Expenditure statement is empty — enter the total receipts, application and accumulation.",sec:"ie"});
    if(sg(S.ie.appl)+sg(S.ie.accum)>sg(S.ie.rcpt) && N(S.ie.rcpt))
      out.push({lvl:"warn",t:"IE statement",m:"Application plus accumulation exceeds total receipts — check the figures.",sec:"ie"});
    if(A===2 && S.ie.anyTax!=="Y" && S.ie.anyTax!=="N")
      out.push({lvl:"err",t:"Taxable income (IE-2)",m:'Answer "Do you have any income which is taxable?" (Yes/No).',sec:"ie"});
    if(A===2 && S.ie.anyTax==="Y" && !(S.ie.hp==="Y"||S.ie.bp==="Y"||S.ie.cg==="Y"||S.ie.os==="Y"))
      out.push({lvl:"warn",t:"Taxable heads (IE-2)",m:"You answered Yes to taxable income but marked no head — tick at least one of HP/BP/CG/OS.",sec:"ie"});
  }
  if(A===3||A===4){
    const rows=(A===3?S.ie.i3:S.ie.i4)||[];
    if(!rows.length)
      out.push({lvl:"err",t:"IE statement",m:"Add at least one institution with its address and receipts.",sec:"ie"});
    rows.forEach((r,i)=>{
      if(!_ieLive(r) && (st0(r.flat)||st0(r.area)||st0(r.town)||st0(r.state)||st0(r.pin)||N(r.rcpt)))
        out.push({lvl:"err",t:"Institution "+(i+1),m:"Objective, Flat/Door No., Area, Town, State and a valid 6-digit PIN are all required.",sec:"ie"});
      if(st0(r.pin)&&!_iePIN.test(st0(r.pin)))
        out.push({lvl:"err",t:"Institution "+(i+1),m:"The PIN code is six digits and cannot start with zero.",sec:"ie"});
    });
    if(A===3 && C.govtOK===false)
      out.push({lvl:"warn",t:"Government grants (IE-3)",m:"Government grants do not exceed 50% of total receipts for at least one institution — the substantially-financed condition may not be met.",sec:"ie"});
    if(A===4 && C.ceilingOK===false)
      out.push({lvl:"warn",t:"Receipts ceiling (IE-4)",m:"Aggregate gross annual receipts exceed Rs 5 crore — the 10(23C)(iiiad)/(iiiae) exemption is not available.",sec:"ie"});
  }
  if(!out.length && A)
    out.push({lvl:"ok",t:"Income & Expenditure",m:"Schedule IE-"+A+" is complete.",sec:"ie"});
  return out;
}

reg({id:"ie", t:"Income & Expenditure statements", ref:"Schedule IE-1/2/3/4",
  f:secIE,
  s:()=>{const A=(S.C.ie||{}).active||0;

/* =====================================================================
   ENGINE — engOa(): disclosure only; contributes nothing to GTI. Publishes
   the cross-section scalars that gate the business-income computation:
   S.C.oa.bpFlag (whether Schedule BP applies) is the seam the bp builder
   reads; the accounting-deviation and stock-valuation figures feed the
   ICDS / 145A adjustments used in the BP reconciliation.
   ===================================================================== */
function engOa(){
  const O=(S&&S.oa)||{};
  const C=S.C.oa={ income:0 };
  C.bpFlag = O.bpFlag==="Y";                                  /* -> bp: build Schedule BP? */
  C.nobCodes = ((O.nob)||[]).map(r=>r&&r.code).filter(Boolean); /* -> bp/ded descriptive gating */
  C.methodOfAcct = st0(O.acctMeth);                          /* MERC|CASH */
  C.acctChanged = O.acctChg==="Y";                           /* change in method of accounting */
  C.acctDeviationEffect = R(O.acctDev);                      /* ProfDeviatDueAcctMeth (145) */
  C.stkValChanged = O.stkChg==="Y";                          /* change in stock valuation method */
  C.stkDeviationEffect = R(O.stkEff);                        /* EffectOnPL (145A) */
  C.income = 0;
}

/* =====================================================================
   RENDERER — secOa(): every live row of Schedule OA. The gate flag first;
   the nature-of-business table, accounting particulars and stock-valuation
   rows are shown only when the gate flag is Yes.
   ===================================================================== */
function secOa(){
  const O=S.oa; let h="";
  h+=note("<b>Schedule OA — General (business & profession).</b> A descriptive schedule in front of the business-income computation (Schedule BP). It adds nothing to total income; the first answer decides whether Schedule BP applies at all. A trust or institution with only property / other-sources income answers <b>No</b>.");

  /* ---- the gate flag (row 4) ---- */
  h+=row("Do you have any income under the head business and profession?",
    sel("oa.bpFlag",OA_YN,{blank:false}),{req:1,ref:"IncUnHeadBPFlag",hint:"No ⇒ Schedule BP is not filled"});

  if(O.bpFlag!=="Y"){
    h+=note("Business income not declared — the nature-of-business, accounting and stock-valuation particulars below, and the whole Schedule BP, are not filled.");
    return h;
  }

  /* ---- nature of business or profession (rows 5-8) ---- */
  h+=sub("Nature of Business or Profession");
  h+=note("Give the Code-Sub Sector and trade name for each line of business (up to three). Where there is more than one business, indicate the three main activities / products.");
  h+=grid("oa.nob",[
    {h:"#",k:"_i",t:"calc",f:(r,i)=>i+1,w:"36px"},
    {h:"Code — Sub sector",k:"code",t:"sel",opts:OA_NOB,req:1},
    {h:"Trade name",k:"trade",t:"txt",max:125}
  ],S.oa.nob,{min:"760px",add:"Add a business code",empty:"No business code entered."});

  /* ---- accounting particulars (rows 12-15) ---- */
  h+=sub("Accounting particulars");
  h+=row("Number of branches",inp("oa.branches",{n:1}),{ref:"NumberOfBranches"});
  h+=row("Method of accounting employed in the previous year",
    sel("oa.acctMeth",OA_ACCT,{blank:false}),{ref:"MethodOfAcct",hint:"section 145 — Mercantile or Cash"});
  h+=row("Is there any change in method of accounting?",
    sel("oa.acctChg",OA_YN,{blank:false}),{ref:"ChangeInAcctMethFlg"});
  h+=row("Effect on the profit because of deviation, if any, in the method of accounting",
    inp("oa.acctDev",{n:1}),{ref:"ProfDeviatDueAcctMeth",hint:"may be negative"});

  /* ---- method of valuation of closing stock (rows 16-20) ---- */
  h+=sub("Method of valuation of closing stock employed in the previous year");
  h+=row("a · Raw material",sel("oa.vRaw",OA_STKVAL,{blank:false}),
    {req:1,ref:"MethodOfValClgStk.ValRawMaterial",hint:"6a"});
  h+=row("b · Finished goods",sel("oa.vFin",OA_STKVAL,{blank:false}),
    {req:1,ref:"MethodOfValClgStk.ValFinishedGoods",hint:"6b"});
  h+=row("c · Is there any change in stock valuation method?",
    sel("oa.stkChg",OA_YN,{blank:false}),{req:1,ref:"MethodOfValClgStk.ChngStockValMetFlg",hint:"6c"});
  h+=row("d · Effect on the profit or loss because of deviation, if any, from the method of valuation prescribed under section 145A",
    inp("oa.stkEff",{n:1}),{req:1,ref:"MethodOfValClgStk.EffectOnPL",hint:"6d — may be negative"});

  return h;
}

/* =====================================================================
   EXPORT — expOa(j): serialise block ScheduleOA from S.oa. The gate flag
   is always written; when the flag is No, only the flag is emitted (the
   rest of OA is not filled). When Yes, the nature-of-business array, the
   accounting particulars and the (required) MethodOfValClgStk object are
   written. put() skips undefined/null/"" (0 is written), so the required
   integer EffectOnPL is always present at its nil value.
   ===================================================================== */
function expOa(j){
  const O=S.oa||{};
  const flag = O.bpFlag==="Y" ? "Y" : "N";
  put(j,"ScheduleOA.IncUnHeadBPFlag",flag);
  if(flag!=="Y") return;                    /* No business — only the gate flag */

  /* nature of business: NatOfBus[] -> one element carrying the NatureOfBusiness[] rows */
  const rows=(O.nob||[]).map(r=>{const o={}; pf(o,"Code",sv(r.code)); pf(o,"TradeName1",sv(r.trade)); return o;})
    .filter(o=>o.Code!==undefined);
  if(rows.length) put(j,"ScheduleOA.NatOfBus",[{NatureOfBusiness:rows.slice(0,3)}]);

  /* accounting particulars */
  put(j,"ScheduleOA.NumberOfBranches",R(O.branches));           /* optional integer (0 default) */
  put(j,"ScheduleOA.MethodOfAcct",sv(O.acctMeth));
  put(j,"ScheduleOA.ChangeInAcctMethFlg",sv(O.acctChg));
  put(j,"ScheduleOA.ProfDeviatDueAcctMeth",R(O.acctDev));       /* optional integer, may be negative */

  /* method of valuation of closing stock (object with four required leaves).
     put() skips only undefined/null/"" — 0 is written — so EffectOnPL lands
     present at its nil value and all four required leaves are always emitted. */
  put(j,"ScheduleOA.MethodOfValClgStk.ValRawMaterial",sv(O.vRaw)||"1");
  put(j,"ScheduleOA.MethodOfValClgStk.ValFinishedGoods",sv(O.vFin)||"1");
  put(j,"ScheduleOA.MethodOfValClgStk.ChngStockValMetFlg",sv(O.stkChg)||"N");
  put(j,"ScheduleOA.MethodOfValClgStk.EffectOnPL",R(O.stkEff));
}

/* =====================================================================
   IMPORT — impOa(I7): read block ScheduleOA back into S.oa (inverse of the
   export, so buildReturn -> importReturn -> buildReturn is identity).
   ===================================================================== */
function impOa(I7){
  const read=[];
  const O=(I7&&I7.ScheduleOA)||{};
  if(!Object.keys(O).length) return read;
  S.oa=S.oa||{};
  if(O.IncUnHeadBPFlag!=null) S.oa.bpFlag=O.IncUnHeadBPFlag;
  if(Array.isArray(O.NatOfBus)){
    const rows=[];
    O.NatOfBus.forEach(g=>{ if(g&&Array.isArray(g.NatureOfBusiness))
      g.NatureOfBusiness.forEach(r=>rows.push({code:r&&r.Code,trade:(r&&r.TradeName1)||""})); });
    S.oa.nob=rows;
  }
  if(O.NumberOfBranches!=null) S.oa.branches=O.NumberOfBranches;
  if(O.MethodOfAcct!=null) S.oa.acctMeth=O.MethodOfAcct;
  if(O.ChangeInAcctMethFlg!=null) S.oa.acctChg=O.ChangeInAcctMethFlg;
  if(O.ProfDeviatDueAcctMeth!=null) S.oa.acctDev=O.ProfDeviatDueAcctMeth;
  if(O.MethodOfValClgStk){const M=O.MethodOfValClgStk;
    if(M.ValRawMaterial!=null)     S.oa.vRaw=M.ValRawMaterial;
    if(M.ValFinishedGoods!=null)   S.oa.vFin=M.ValFinishedGoods;
    if(M.ChngStockValMetFlg!=null) S.oa.stkChg=M.ChngStockValMetFlg;
    if(M.EffectOnPL!=null)         S.oa.stkEff=M.EffectOnPL;
  }
  read.push("Schedule OA (business — general)");
  return read;
}

/* =====================================================================
   CHECKS — chkOa(): this section's own screen validations (err/warn).
   Department rules are Phase 6.
   ===================================================================== */
function chkOa(){
  const out=[]; const O=S.oa||{};
  if(!st0(O.bpFlag))
    out.push({lvl:"err",t:"Business income flag required",m:"Answer whether you have any income under the head business and profession.",sec:"oa"});
  if(O.bpFlag==="Y"){
    if(!(O.nob||[]).some(r=>st0(r&&r.code)))
      out.push({lvl:"warn",t:"Nature of business",m:"Enter at least one Code-Sub Sector when business income is declared.",sec:"oa"});
    if((O.nob||[]).length>3)
      out.push({lvl:"warn",t:"Nature of business",m:"Only three nature-of-business codes are permitted; extra rows are dropped on export.",sec:"oa"});
    if(!st0(O.acctMeth))
      out.push({lvl:"warn",t:"Method of accounting",m:"Select the method of accounting (Mercantile or Cash).",sec:"oa"});
    if(!st0(O.vRaw)||!st0(O.vFin))
      out.push({lvl:"warn",t:"Stock valuation",m:"Select the method of valuation for raw material and finished goods.",sec:"oa"});
  }
  if(!out.some(x=>x.lvl==="err"))
    out.push({lvl:"ok",t:"Schedule OA",m:O.bpFlag==="Y"?((O.nob||[]).filter(r=>st0(r&&r.code)).length+" business code(s) · "+(O.acctMeth==="CASH"?"Cash":"Mercantile")):"No business income.",sec:"oa"});
  return out;
}

/* =====================================================================
   ITR-7 · Section "os" — Income from Other Sources (trust / institution)
   Book: books/ITR-7/Schedule_OS.md   ·   Schema block: ScheduleOS
   Structural template: forms/ITR-6/src/70_sec_os.js — the shape (nine
   items + a quarterly matrix) is the same, but every field, number,
   formula, enum and schema key below is taken from the ITR-7 book and the
   ITR-7 schema (ScheduleOS), NOT ported from ITR-6.  Compute order: 44.

   HOW ITR-7's OS DIFFERS FROM ITR-6's (book §2, §3, §9)
   ---------------------------------------------------------------------
   · 1e "Any other income" carries TWO fixed lines, not one: the ITR-7-only
     row 24 "Income due to disallowance of exemption under clauses of
     section 10" (IncDisallwnExmpUs10, REQUIRED) — a trust that loses an
     exemption under a clause of section 10 offers the disallowed income
     here — plus row 25 56(2)(xii) (SumRecdPrYrBusTRU562xii, optional) and
     the free OthersInc.OthersIncDtls[] table.  1e is floored at nil.
   · The 2e DTAA table names its "Section of I.T. Act" column ItemNoincl
     (ITR-6 used SecITAct), and its disclosure total is
     TotalOSGrossChargblSplRate (ITR-6 used TotalAmtTaxUsDTAASchOs).  The
     ItemNoincl enum is the ITR-7 43-code list; NatureOfIncome is the
     9-value list {1ai,1aiii,1b,1c,1d,2ai,2aii,2c,2d}.  DTAA rows sit under
     IncChargblSplRateOS.NRIOsDTAA.NRIDTAADtlsSchOS[] (minItems 1 — the
     NRIOsDTAA node is emitted only when a row exists).
   · The 2c / 2d dropdowns are the ITR-7 special-rate section-code lists
     (18 codes each, incl. 5BBC "Anonymous donations u/s 115BBC" — a trust
     head; NO 115BBF/115BBG/115AB/specified-fund codes).
   · Item 10 has NINE live quarterly blocks (ITR-6 had ten): the
     specified-fund 115AD(1)(i)(B) dividend row is absent.

   ITEM 2 / ITEM 6 — the DTAA reclassification (same engine as ITR-6)
   ---------------------------------------------------------------------
   The DTAA attributable to the item-1 normal lines (natures 1ai,1aiii,1b,
   1c,1d), DTAA6, is MOVED from the normal leg to the special leg: item 6
   subtracts DTAA6 and item 2 adds it back.  The special-rate DTAA rows
   (2ai,2aii,2c,2d) already sit inside 2ai/2aii/2c/2d and are not re-added.
   TotalOSGrossChargblSplRate (the 2e disclosure total) sums ALL counted rows.

   CROSS-SECTION ROLLS published on S.C.os (consumed by cyla/si/tax/ti):
     total        — MAX(0,item6): normal-rate OS income → CYLA / Part B-TI
     loss         — a positive OS loss magnitude (item6<0) → CYLA
     netNormal / normal / six  — item 6 signed (aliases)
     special      — item 2 total (→ Schedule SI, Part B-TI)
     raceHorse / horse.bal     — item 8e (signed; <0 ⇒ Schedule CFL)
     chargeable   — item 9 IncChargeableFrmOthSrc (→ Part B-TI)
     dtaaTotal    — 2e TotalOSGrossChargblSplRate (→ SI DTAA / CYLA)
     income       — signed head figure (item2 + item6 + MAX0(8e))

/* ---- engine ------------------------------------------------------ */
function engOs(){
  S.os = S.os || {};
  const O = S.os;
  const C = S.C.os = { income:0 };

  /* ===== item 1 — gross income at normal applicable rates ===== */
  /* 1a (J5) = 1a(i) + 1a(ii) + 1a(iii) */
  const div_i=R(O.divOth), div_ii=R(O.div22e), div_iii=R(O.div22f);
  const a1 = div_i + div_ii + div_iii;                                    /* DividendGross */
  /* 1b (J9) = FIVE interest lines; PTI interest (1b(iv)) may be negative */
  const bi=R(O.intSaving), bii=R(O.intDeposit), biii=R(O.intRefund), biv=R(O.intPTI), bv=R(O.intOthers);
  const b1 = bi+bii+biii+biv+bv;                                          /* InterestGross */
  /* 1c */
  const c1 = R(O.rentMach);                                               /* RentFromMachPlantBldgs */
  /* 1d (J16) = MAX(0, 56(2)(x) five lines) */
  const d_i=R(O.giftMoney), d_ii=R(O.giftImmovWo), d_iii=R(O.giftImmovInadeq),
        d_iv=R(O.giftOthWo), d_v=R(O.giftOthInadeq);
  const d1 = Math.max(0, d_i+d_ii+d_iii+d_iv+d_v);                        /* Tot562x */
  /* 1e (J22) = MAX(0, IncDisallwnExmpUs10 + 56(2)(xii) + free rows) */
  const disallow10 = R(O.disallow10);                                     /* IncDisallwnExmpUs10 (required) */
  const biz562xii = R(O.sum562xii);                                       /* SumRecdPrYrBusTRU562xii */
  const othersSum = (O.others||[]).reduce((s,r)=>s+R(r.amt),0);
  const e1 = Math.max(0, disallow10 + biz562xii + othersSum);             /* AnyOtherIncome */
  const item1 = a1 + b1 + c1 + d1 + e1;                                   /* GrossIncChrgblTaxAtAppRate */

  /* ===== item 2 — special rates ===== */
  const s2ai = R(O.win115BB);                                             /* LtryPzzlChrgblUs115BB */
  const s2aii = R(O.win115BBJ);                                           /* IncChrgblUs115BBJ */
  /* 2b (J32) = MAX(0, six 68/69 lines) */
  const b2 = Math.max(0, R(O.cc68)+R(O.ui69)+R(O.um69a)+R(O.udi69b)+R(O.ue69c)+R(O.hundi69d)); /* IncChrgblUs115BBE */
  /* 2c (J46) = Σ SourceAmount */
  const d2c = (O.spl||[]).reduce((s,r)=>s+R(r.amt),0);                    /* OthersGross */
  /* 2d (J58) = Σ PTI amounts */
  const d2d = (O.pti||[]).reduce((s,r)=>s+R(r.amt),0);                    /* PassThrIncOSChrgblSplRate */
  /* 2e DTAA — for an NRI only TRC="Y" rows count; residents: all rows */
  const dtaaRows = (O.dtaa||[]).map(r=>{
    const treaty = st0(r.treaty).toUpperCase()==="NIL" ? 0 : N(r.treaty);
    const hasTreaty = st0(r.treaty)!=="";
    const itact  = N(r.itact);
    const hasItact = st0(r.itact)!=="";
    /* col 10 applicable rate = lower of treaty (col 6) and IT-Act (col 9); blank
       for a non-resident whose TRC is not "Y" */
    let appl = hasTreaty ? (hasItact ? Math.min(treaty,itact) : treaty) : (hasItact ? itact : "");
    if(os7_isNRI() && r.trc!=="Y") appl = "";
    const counts = os7_isNRI() ? (r.trc==="Y") : true;
    return {amt:R(r.amt), nature:st0(r.nature), sec:st0(r.sec), treaty, hasTreaty,
            itact, hasItact, appl, trc:r.trc||"", counts,
            cc:st0(r.cc), article:st0(r.article)};
  });
  /* DTAA6 = the item-1-attributable DTAA portion (natures 1ai,1aiii,1b,1c,1d),
     moved from the normal leg (item 6 subtracts) to the special leg (item 2 adds) */
  const OS_ITEM1_NAT = ["1ai","1aiii","1b","1c","1d"];
  const dtaa6 = dtaaRows.filter(r=>r.counts && OS_ITEM1_NAT.indexOf(r.nature)>=0)
                        .reduce((s,r)=>s+r.amt,0);
  const f2 = dtaaRows.filter(r=>r.counts).reduce((s,r)=>s+r.amt,0);       /* TotalOSGrossChargblSplRate */
  /* item 2 (J29) = MAX(0, 2ai + 2aii + 2b + 2c + 2d + DTAA6) */
  const item2 = Math.max(0, s2ai + s2aii + b2 + d2c + d2d + dtaa6);       /* IncChargeableSpecialRates */

  /* ===== item 3 — section 57 deductions ===== */
  const expenses = R(O.dExpenses);                                        /* 3a Expenses */
  /* 3b depreciation — allowed only if rental income (1c) offered, restricted to 1c */
  const dep = c1>0 ? Math.min(Math.max(0,R(O.dDep)), c1) : 0;             /* Depreciation */
  /* 3c interest expenditure u/s 57(1): eligible ≤ 20% of dividend at 1a(i)+1a(ii) */
  const claimedInt = Math.max(0,R(O.dIntClaimed));                        /* UsrIntExp57 */
  const divForInt = div_i + div_ii;                                       /* 1a(i)+1a(ii) */
  const eligInt = divForInt>0 ? Math.min(claimedInt, R(0.20*divForInt)) : 0; /* IntExp57 */
  const totDed = expenses + dep + eligInt;                                /* TotDeductions (3a+3b+3c) */

  /* ===== items 4, 5 ===== */
  const notDed58 = R(O.notDed58);                                         /* AmtNotDeductibleUs58 */
  const profit59 = R(O.profit59);                                         /* ProfitChargTaxUs59 */

  /* ===== item 6, signed — a loss routes to CYLA ===== */
  const item6 = item1 - dtaa6 - totDed + notDed58 + profit59;            /* BalanceNoRaceHorse */

  /* ===== item 7 = 2 + MAX(0, 6) ===== */
  const item7 = item2 + Math.max(0, item6);                              /* TotOthSrcNoRaceHorse */

  /* ===== item 8 — race horses ===== */
  const H = O.horse||{};
  const hReceipts=R(H.receipts), hDed57=Math.max(0,R(H.ded57)), hNot58=R(H.notDed58), hProfit59=R(H.profit59);
  const item8e = hReceipts - hDed57 + hNot58 + hProfit59;                /* BalanceOwnRaceHorse (signed) */

  /* ===== item 9 = 7 + MAX(0, 8e) ===== */
  const item9 = item7 + Math.max(0, item8e);                             /* IncChargeableFrmOthSrc */

  /* ---- expose the working ---- */
  C.a1={i:div_i,ii:div_ii,iii:div_iii,tot:a1};
  C.b1={i:bi,ii:bii,iii:biii,iv:biv,v:bv,tot:b1};
  C.c1=c1;
  C.d1={i:d_i,ii:d_ii,iii:d_iii,iv:d_iv,v:d_v,tot:d1};
  C.e1={disallow10:disallow10, biz562xii:biz562xii, others:othersSum, tot:e1};
  C.item1=item1;
  C.s2ai=s2ai; C.s2aii=s2aii; C.b2=b2;
  C.d2c=d2c; C.d2d=d2d; C.f2=f2; C.dtaa6=dtaa6; C.dtaaRows=dtaaRows;
  C.item2=item2;
  C.ded={expenses, dep, claimedInt, eligInt, tot:totDed};
  C.notDed58=notDed58; C.profit59=profit59;
  C.item6=item6; C.item7=item7;
  C.horse={receipts:hReceipts, ded57:hDed57, not58:hNot58, profit59:hProfit59, bal:item8e};
  C.item9=item9;

  /* ---- rolls for other sections (cyla / si / tax / ti) ---- */
  C.total      = R(Math.max(0, item6));    /* normal-rate OS income → CYLA / Part B-TI */
  C.loss       = R(item6<0 ? -item6 : 0);  /* OS loss magnitude (item6<0) → CYLA */
  C.netNormal  = R(item6);                 /* signed net normal (alias) */
  C.normal     = R(item6);                 /* alias */
  C.six        = R(item6);                 /* alias (tax-section fallback name) */
  C.special    = R(item2);                 /* special-rate OS income → Schedule SI / Part B-TI */
  C.raceHorse  = R(item8e);                /* signed; <0 → Schedule CFL */
  C.chargeable = R(item9);                 /* IncChargeableFrmOthSrc → Part B-TI */
  C.dtaaTotal  = R(f2);                    /* 2e total → Schedule SI DTAA / CYLA */
  /* GTI contribution — signed on the normal leg so a loss reaches CYLA */
  C.income = R(item2 + item6 + Math.max(0, item8e));

  /* ================= Schedule-SI feed (special-rate OS heads) =================
     70_sec_si.js consumes S.C.os.siFeed keyed by the schema SecCode (Schedule
     SI SplCodeRateTax). A value is a plain number (income — si.js supplies the
     rate and computes the tax) or {inc,tax} for the DTAA head (treaty tax).
     Every amount is REUSED from item 2 above — the 2a winnings, 2b 115BBE, and
     the 2c/2d dropdown incomes summed by their own section code (already the
     schema SecCode spelling) — never recomputed.

     DTAA netting: the 2e income is disclosed once, at the treaty rate, under the
     single OS-DTAA head (DTAAOS = the whole 2e total f2). Because the same DTAA
     income is also carried inside the 2a/2c/2d figures (the 2ai/2aii/2c/2d DTAA
     rows are NOT re-added into item 2, they already sit in those heads), each
     special-rate head is reduced by its own counted-DTAA portion so no rupee is
     taxed twice; the natures map 2ai→5BB, 2aii→5BBJ 1:1, and a 2c/2d row names
     its head in the ItemNoincl (enum) column. A head is emitted only when its
     remaining income is > 0. */
  const siFeed = {};
  const dtRows = (dtaaRows || []).filter(r => r.counts);
  const sumDt  = pred => dtRows.filter(pred).reduce((s, r) => s + r.amt, 0);

  /* gross special-rate incomes by SecCode, straight from item 2 */
  const osGross = {};
  const bump = (code, amt) => { if (code) osGross[code] = (osGross[code] || 0) + R(amt); };
  bump("5BB",  s2ai);                                              /* 2a(i)  115BB   */
  bump("5BBJ", s2aii);                                             /* 2a(ii) 115BBJ  */
  bump("5BBE", b2);                                                /* 2b     115BBE (never DTAA) */
  (O.spl || []).forEach(r => bump(st0(r.code), r.amt));            /* 2c dropdown incomes */
  (O.pti || []).forEach(r => bump(st0(r.code), r.amt));            /* 2d dropdown incomes */

  /* the DTAA portion carried inside those gross figures, by SecCode */
  const osDtaa = {};
  const bumpDt = (code, amt) => { if (code) osDtaa[code] = (osDtaa[code] || 0) + R(amt); };
  bumpDt("5BB",  sumDt(r => r.nature === "2ai"));                  /* 2ai ↔ 5BB   */
  bumpDt("5BBJ", sumDt(r => r.nature === "2aii"));                 /* 2aii ↔ 5BBJ */
  dtRows.filter(r => r.nature === "2c" || r.nature === "2d")       /* 2c/2d named by ItemNoincl */
        .forEach(r => bumpDt(st0(r.sec), r.amt));

  /* net each head; publish only what still carries income */
  Object.keys(osGross).forEach(code => {
    const net = R(Math.max(0, osGross[code] - R(osDtaa[code] || 0)));
    if (net > 0) siFeed[code] = net;
  });

  /* OS-DTAA head — the whole 2e total at the treaty rate ({inc,tax}); tax is
     Σ income × applicable rate (lower of treaty / IT-Act, per row). */
  if (R(f2) > 0) {
    const dtaaTax = dtRows.reduce((s, r) => {
      const rate = (r.appl !== "" && r.appl != null) ? N(r.appl) : 0;
      return s + R(r.amt * rate / 100);
    }, 0);
    siFeed["DTAAOS"] = { inc: R(f2), tax: R(dtaaTax) };
  }

  C.siFeed = siFeed;                        /* special-rate OS heads → Schedule SI (S.C.os.siFeed) */
}

/* ---- renderer ---------------------------------------------------- */
function secOs(){
  const O = S.os||{}, C = S.C.os||{};
  let h = "";

  h += note('Income from Other Sources for a trust / institution. A trust that loses an exemption under a clause of section 10 offers the disallowed income at 1e (row 24). Dividend income reduced in Schedule BP must be offered here.');

  /* ===== item 1 — normal-rate income ===== */
  {
    let b = "";
    /* 1a — dividends */
    b += row("1a · Dividends, Gross (i + ii + iii)", cell((C.a1||{}).tot), {ref:"1a", cls:"tot"});
    b += row("Dividend income [other than (ii) and (iii)]", inp("os.divOth",{n:1}), {ind:1, ref:"1a(i)"});
    b += row("Dividend income u/s 2(22)(e)", inp("os.div22e",{n:1}), {ind:1, ref:"1a(ii)"});
    b += row("Dividend income u/s 2(22)(f)", inp("os.div22f",{n:1}), {ind:1, ref:"1a(iii)"});
    /* 1b — interest (five lines) */
    b += row("1b · Interest, Gross (i … v)", cell((C.b1||{}).tot), {ref:"1b", cls:"tot"});
    b += row("From Savings Bank", inp("os.intSaving",{n:1}), {ind:1, ref:"1b(i)"});
    b += row("From Deposit (Bank / Post Office / Co-operative)", inp("os.intDeposit",{n:1}), {ind:1, ref:"1b(ii)"});
    b += row("From Income Tax refund", inp("os.intRefund",{n:1}), {ind:1, ref:"1b(iii)"});
    b += row("In the nature of Pass through income / loss", inp("os.intPTI",{n:1}), {ind:1, ref:"1b(iv)", hint:"may be negative"});
    b += row("Others, incl. interest from Companies, NBFCs & HFCs", inp("os.intOthers",{n:1}), {ind:1, ref:"1b(v)"});
    /* 1c */
    b += row("1c · Rental income from machinery, plants, buildings etc., Gross", inp("os.rentMach",{n:1}), {ref:"1c",
      hint:"unlocks the depreciation deduction at 3b"});
    /* 1d — 56(2)(x) */
    b += row("1d · Income u/s 56(2)(x) chargeable to tax (i … v, floored at nil)", cell((C.d1||{}).tot), {ref:"1d", cls:"tot"});
    b += row("Aggregate sum of money received without consideration", inp("os.giftMoney",{n:1}), {ind:1, ref:"1d(i)"});
    b += row("Immovable property without consideration — stamp duty value", inp("os.giftImmovWo",{n:1}), {ind:1, ref:"1d(ii)"});
    b += row("Immovable property for inadequate consideration — SDV in excess", inp("os.giftImmovInadeq",{n:1}), {ind:1, ref:"1d(iii)"});
    b += row("Any other property without consideration — fair market value", inp("os.giftOthWo",{n:1}), {ind:1, ref:"1d(iv)"});
    b += row("Any other property for inadequate consideration — FMV in excess", inp("os.giftOthInadeq",{n:1}), {ind:1, ref:"1d(v)"});
    /* 1e — any other income */
    b += row("1e · Any other income (floored at nil)", cell((C.e1||{}).tot), {ref:"1e", cls:"tot"});
    b += row("Income due to disallowance of exemption under clauses of section 10", inp("os.disallow10",{n:1}), {ind:1, ref:"1e",
      hint:"ITR-7 line: disallowed income where a clause-10 exemption is lost"});
    b += row("Specified sum received by a unit holder from a business trust u/s 56(2)(xii)", inp("os.sum562xii",{n:1}), {ind:1, ref:"1e"});
    b += sub("Any other income — specify nature and amount");
    b += grid("os.others",[
      {k:"nat",h:"Nature",t:"txt",max:50,req:1},
      {k:"amt",h:"Amount",t:"num",w:"160px",req:1}
    ], O.others||[], {empty:"No other-income rows.", add:"Add an income row"});
    b += row("1 · Gross income chargeable at normal rates (1a+1b+1c+1d+1e)", cell(C.item1), {ref:"1", cls:"tot"});
    h += fold("os_1","1","Income chargeable at normal applicable rates", RS(C.item1||0), b, {def:true});
  }

  /* ===== item 2 — special rates ===== */
  {
    let b = "";
    b += note("Nothing in item 3 (deductions u/s 57) may be set against the special-rate income at 2a–2e (sheet row 71).");
    b += row("2a(i) · Winnings from lotteries, crossword puzzles, races, card games etc. u/s 115BB", inp("os.win115BB",{n:1}), {ref:"2a(i)"});
    b += row("2a(ii) · Winnings from online games u/s 115BBJ", inp("os.win115BBJ",{n:1}), {ref:"2a(ii)"});
    /* 2b — 115BBE */
    b += row("2b · Income chargeable u/s 115BBE (i … vi, floored at nil)", cell(C.b2), {ref:"2b", cls:"tot"});
    b += row("Cash credits u/s 68", inp("os.cc68",{n:1}), {ind:1, ref:"2b(i)"});
    b += row("Unexplained investments u/s 69", inp("os.ui69",{n:1}), {ind:1, ref:"2b(ii)"});
    b += row("Unexplained money etc. u/s 69A", inp("os.um69a",{n:1}), {ind:1, ref:"2b(iii)"});
    b += row("Undisclosed investments etc. u/s 69B", inp("os.udi69b",{n:1}), {ind:1, ref:"2b(iv)"});
    b += row("Unexplained expenditure etc. u/s 69C", inp("os.ue69c",{n:1}), {ind:1, ref:"2b(v)"});
    b += row("Amount borrowed or repaid on hundi u/s 69D", inp("os.hundi69d",{n:1}), {ind:1, ref:"2b(vi)"});
    /* 2c — other special-rate sources */
    b += sub("2c · Any other income chargeable at special rate");
    b += note("The utility narrows the section list by residential status; the full filed set is shown here (book §3).");
    b += grid("os.spl",[
      {k:"code",h:"Nature (special-rate section)",t:"sel",opts:OS7_SPL,req:1},
      {k:"amt",h:"Amount",t:"num",w:"150px"}
    ], O.spl||[], {min:640, empty:"No special-rate rows.", add:"Add a special-rate row",
       foot:[{l:1,v:"2c Total"},{v:C.d2c}]});
    /* 2d — PTI special-rate */
    b += sub("2d · Pass through income in the nature of income from other sources at special rate");
    b += grid("os.pti",[
      {k:"code",h:"Nature (PTI special-rate section)",t:"sel",opts:OS7_PTI,req:1},
      {k:"amt",h:"Amount",t:"num",w:"150px"}
    ], O.pti||[], {min:640, empty:"No PTI special-rate rows.", add:"Add a PTI row",
       foot:[{l:1,v:"2d Total"},{v:C.d2d}]});
    /* 2e — DTAA */
    b += sub("2e · Amount included in 1 and 2 above, chargeable at special rates in India as per DTAA (non-residents only)");
    b += note("For a non-resident a row counts in the 2e total only if the TRC is obtained (Yes); for a resident every row counts. The applicable rate is the lower of the treaty rate and the Income-tax Act rate. DTAA attributable to items 1a(i)/1a(iii)/1b/1c/1d is moved from item 6 to item 2.");
    b += grid("os.dtaa",[
      {k:"amt",h:"Amount of income",t:"num",w:"130px",req:1},
      {k:"nature",h:"Item No. in which included",t:"sel",opts:OS7_DTAA_NAT,req:1},
      {k:"cc",h:"Country",t:"sel",opts:OS7_CC,req:1},
      {k:"article",h:"Article of DTAA",t:"txt",max:16,req:1},
      {k:"treaty",h:"Rate as per Treaty (NIL if not chargeable)",t:"txt",max:10,req:1},
      {k:"trc",h:"TRC obtained",t:"sel",opts:OS7_TRC},
      {k:"sec",h:"Section of I.T. Act",t:"sel",opts:OS7_DTAA_ITEMNO,req:1},
      {k:"itact",h:"Rate as per I.T. Act",t:"txt",max:10,req:1},
      {k:"appl",h:"Applicable rate [lower of Treaty, I.T. Act]",t:"calc",f:(r,i)=>((C.dtaaRows||[])[i]||{}).appl}
    ], O.dtaa||[], {min:1180, empty:"No DTAA rows.", add:"Add a DTAA row",
       foot:[{l:1,v:"2e Total"},{v:C.f2},{l:1,v:"",span:7}]});
    b += row("2 · Income chargeable at special rates (2ai+2aii+2b+2c+2d+2e)", cell(C.item2), {ref:"2", cls:"tot"});
    h += fold("os_2","2","Income chargeable at special rates", RS(C.item2||0), b);
  }

  /* ===== item 3 — section 57 deductions ===== */
  {
    const D = C.ded||{};
    let b = "";
    b += row("3a · Expenses / deductions (other than those relating to 2a–2e)", inp("os.dExpenses",{n:1}), {ref:"3a"});
    b += row("3b · Depreciation (available only if rental income offered at 1c)", (C.c1>0?inp("os.dDep",{n:1}):cell(0)), {ref:"3b",
      hint:(C.c1>0?"restricted to the 1c rental income":"available only when rental income is offered at 1c")});
    if(C.c1>0) b += row("3b · Depreciation allowed — computed", cell(D.dep), {ind:1, ref:"3b", cls:"tot"});
    b += row("3c · Interest expenditure u/s 57(1) claimed (dividend only)", inp("os.dIntClaimed",{n:1}), {ref:"3c",
      hint:"available only if dividend offered at 1a(i)/1a(ii); eligible ≤ 20% of that dividend"});
    b += row("3c · Eligible interest expenditure u/s 57(1) — computed", cell(D.eligInt), {ind:1, ref:"3c", cls:"tot"});
    b += row("3d · Total deductions (3a + 3b + 3c)", cell(D.tot), {ref:"3d", cls:"tot"});
    h += fold("os_3","3","Deductions under section 57", RS((C.ded||{}).tot||0), b);
  }

  /* ===== items 4–7 ===== */
  {
    let b = "";
    b += row("4 · Amounts not deductible u/s 58", inp("os.notDed58",{n:1}), {ref:"4"});
    b += row("5 · Profits chargeable to tax u/s 59", inp("os.profit59",{n:1}), {ref:"5"});
    if(C.dtaa6) b += row("Less: DTAA amounts attributable to item-1 lines (moved to item 2)", cell(-(C.dtaa6||0)), {ind:1, ref:"6"});
    b += row("6 · Net income at normal rates (1 − DTAA − 3 + 4 + 5); a loss goes to CYLA", cell(C.item6), {ref:"6", cls:"tot"});
    b += row("7 · Income from other sources other than race horses (2 + 6; 6 as nil if negative)", cell(C.item7), {ref:"7", cls:"tot"});
    h += fold("os_67","4–7","Net income from other sources", RS(C.item7||0), b, {def:true});
  }

  /* ===== item 8 — race horses ===== */
  {
    const RH = C.horse||{};
    let b = "";
    b += row("8a · Receipts", inp("os.horse.receipts",{n:1}), {ref:"8a"});
    b += row("8b · Deductions u/s 57 in relation to 8a only", inp("os.horse.ded57",{n:1}), {ref:"8b"});
    b += row("8c · Amounts not deductible u/s 58", inp("os.horse.notDed58",{n:1}), {ref:"8c"});
    b += row("8d · Profits chargeable to tax u/s 59", inp("os.horse.profit59",{n:1}), {ref:"8d"});
    b += row("8e · Balance (8a − 8b + 8c + 8d)", cell(RH.bal), {ref:"8e", cls:"tot"});
    if(R(RH.bal)<0) b += note("A negative 8e is a race-horse loss carried to Schedule CFL and taken as nil at item 9. It is set off against race-horse income only, for four years.");
    h += fold("os_8","8","Income from owning and maintaining race horses", RS((C.horse||{}).bal||0), b);
  }

  /* ===== item 9 ===== */
  h += row("9 · Income under the head “Income from other sources” (7 + 8e; 8e as nil if negative)",
           cell(C.item9), {ref:"9", cls:"tot"});

  /* ===== item 10 — quarterly accrual/receipt ===== */
  {
    let t = '<div class="full"><table class="gt" style="min-width:960px"><thead><tr>'+
      '<th class="l">Other Source Income</th>'+OS7_QCOLH.map(x=>'<th>'+esc(x)+'</th>').join("")+'</tr></thead><tbody>';
    OS7_QROWS.forEach(qr=>{
      t += '<tr><td class="l">'+esc(qr.l)+'</td>'+
        OS7_QP.map(pk=>'<td>'+inp("os.q."+qr.k+"."+pk,{n:1})+'</td>').join("")+'</tr>';
    });
    t += '</tbody></table></div>';
    let b = note("Quarterly break-up of income that accrues or is received under this head, for interest u/s 234C. Each row must reconcile to its source figure by its tie-back rule (e.g. row 1 = 2a(i); the 1a(i) dividend row = 1a(i) − DTAA subject to TRC − adjusted interest u/s 57).");
    b += t;
    h += fold("os_10","10","Information about accrual / receipt of income from Other Sources", "", b);
  }

  return h;
}

/* ---- export ------------------------------------------------------ */
function expOs(j){
  const C = S.C.os||{}, O = S.os||{};

  /* ---- item 3 Deductions object (book-required: Depreciation, TotDeductions) ---- */
  const D = C.ded||{};
  /* Expenses, Depreciation and TotDeductions are ALL schema-required leaves of
     the Deductions object (they must be present even at nil). */
  const ded = { Expenses:n0(D.expenses), Depreciation:n0(D.dep), TotDeductions:n0(D.tot) };
  if(D.claimedInt) ded.UsrIntExp57 = n0(D.claimedInt);
  if(D.eligInt)    ded.IntExp57    = n0(D.eligInt);

  /* ---- IncOthThanOwnRaceHorse (parent of items 1–7) ---- */
  const a1=C.a1||{}, b1=C.b1||{}, d1=C.d1||{}, e1=C.e1||{};
  const io = {
    GrossIncChrgblTaxAtAppRate: sg(C.item1),
    DividendGross: n0(a1.tot),
    DividendOthThan22e: sg(a1.i),
    Dividend22e: sg(a1.ii),
    Dividend22f: sg(a1.iii),
    InterestGross: sg(b1.tot),
    IntrstFrmSavingBank: sg(b1.i),
    IntrstFrmTermDeposit: sg(b1.ii),
    IntrstFrmIncmTaxRefund: sg(b1.iii),
    NatofPassThrghIncome: sg(b1.iv),
    IntrstFrmOthers: sg(b1.v),
    RentFromMachPlantBldgs: n0(C.c1),
    Tot562x: n0(d1.tot),
    Aggrtvaluewithoutcons562x: sg(d1.i),
    Immovpropwithoutcons562x: sg(d1.ii),
    Immovpropinadeqcons562x: sg(d1.iii),
    Anyotherpropwithoutcons562x: sg(d1.iv),
    Anyotherpropinadeqcons562x: sg(d1.v),
    IncDisallwnExmpUs10: n0(e1.disallow10),
    AnyOtherIncome: n0(e1.tot),
    IncChargeableSpecialRates: n0(C.item2),
    LtryPzzlChrgblUs115BB: n0(C.s2ai),
    IncChrgblUs115BBE: n0(C.b2),
    CashCreditsUs68: n0(R(O.cc68)),
    UnExplndInvstmntsUs69: n0(R(O.ui69)),
    UnExplndMoneyUs69A: n0(R(O.um69a)),
    UnDsclsdInvstmntsUs69B: n0(R(O.udi69b)),
    UnExplndExpndtrUs69C: n0(R(O.ue69c)),
    AmtBrwdRepaidOnHundiUs69D: n0(R(O.hundi69d)),
    OthersGross: n0(C.d2c),
    PassThrIncOSChrgblSplRate: n0(C.d2d),
    IncChargblSplRateOS: { TotalOSGrossChargblSplRate: n0(C.f2) },
    Deductions: ded,
    BalanceNoRaceHorse: sg(C.item6)
  };
  /* optional fixed lines */
  if(C.s2aii)        io.IncChrgblUs115BBJ      = sg(C.s2aii);
  if(R(O.sum562xii)) io.SumRecdPrYrBusTRU562xii = sg(R(O.sum562xii));
  if(R(O.notDed58))  io.AmtNotDeductibleUs58   = sg(C.notDed58);
  if(R(O.profit59))  io.ProfitChargTaxUs59     = sg(C.profit59);
  /* 1e free "any other income" rows */
  const others = (O.others||[]).filter(r=>st0(r.nat)||R(r.amt));
  if(others.length) io.OthersInc = { OthersIncDtls: others.map(r=>({
    OthNatOfInc:(sv(r.nat)||"NA").slice(0,50), OthAmount:sg(R(r.amt)) })) };
  /* 2c other special-rate rows */
  const spl = (O.spl||[]).filter(r=>st0(r.code)||R(r.amt));
  if(spl.length) io.OthersGrossDtls = spl.map(r=>({SourceDescription:st0(r.code)||"5AD1i", SourceAmount:sg(R(r.amt))}));
  /* 2d PTI special-rate rows */
  const pti = (O.pti||[]).filter(r=>st0(r.code)||R(r.amt));
  if(pti.length) io.PTIOthersGrossDtls = pti.map(r=>{
    const o = {SourceDescription:st0(r.code)||"PTI_5AD1i"};
    if(R(r.amt)) o.SourceAmount = sg(R(r.amt));
    return o;
  });
  /* 2e DTAA rows (emit NRIOsDTAA only when a row exists — minItems 1) */
  const dtaa = (C.dtaaRows||[]).filter(r=>r.amt||st0(r.cc)||st0(r.article));
  if(dtaa.length) io.IncChargblSplRateOS.NRIOsDTAA = { NRIDTAADtlsSchOS: dtaa.map(r=>{
    const o = {
      DTAAamt: sg(r.amt),
      NatureOfIncome: st0(r.nature)||"1ai",
      CountryName: (OS7_CCNAME[st0(r.cc)]||"NA").slice(0,55),
      CountryCodeExcludingIndia: st0(r.cc)||"9999",
      DTAAarticle: (sv(r.article)||"NA").slice(0,16),
      RateAsPerTreaty: r.hasTreaty ? r.treaty : 0,
      ItemNoincl: st0(r.sec)||"56i",
      RateAsPerITAct: r.hasItact ? r.itact : 0
    };
    if(r.trc) o.TaxRescertifiedFlag = r.trc;
    if(r.appl!=="" && r.appl!=null) o.ApplicableRate = r.appl;
    return o;
  }) };

  const OS = { IncOthThanOwnRaceHorse: io, TotOthSrcNoRaceHorse: sg(C.item7) };

  /* ---- item 8 race horses (root group; book-required Receipts/DeductSec57/Balance) ---- */
  const RH = C.horse||{};
  const rh = { Receipts:n0(RH.receipts), DeductSec57:n0(RH.ded57), BalanceOwnRaceHorse:sg(RH.bal) };
  if(RH.not58)    rh.AmtNotDeductibleUs58 = sg(RH.not58);
  if(RH.profit59) rh.ProfitChargTaxUs59   = sg(RH.profit59);
  OS.IncFromOwnHorse = rh;

  /* ---- item 9 ---- */
  OS.IncChargeableFrmOthSrc = sg(C.item9);

  /* ---- item 10 quarterly DateRange objects (all nine blocks, always present) ---- */
  const q = O.q||{};
  OS7_QROWS.forEach(qr=>{
    const src = q[qr.k]||{};
    const dr = {};
    OS7_QP.forEach(pk=>{ dr[pk] = sg(R(src[pk])); });
    OS[qr.o] = { DateRange: dr };
  });

  /* Emit ScheduleOS only when the head actually carries income. A
     trust/institution with no other-source income files no ScheduleOS — an
     all-nil block would otherwise be an unlawful (and, via the required
     Deductions leaves, schema-valid but empty) disclosure. */
  const anyOS = [C.item1,C.item2,C.item6,C.item7,C.item9,C.f2,C.d2c,C.d2d,C.b2]
      .some(v=>n0(v)) || n0((C.horse||{}).receipts)
      || (O.others||[]).some(r=>st0(r.nat)||R(r.amt))
      || (O.spl||[]).some(r=>st0(r.code)||R(r.amt))
      || (O.pti||[]).some(r=>st0(r.code)||R(r.amt))
      || (C.dtaaRows||[]).length>0;
  if(anyOS) j.ScheduleOS = OS;
}
