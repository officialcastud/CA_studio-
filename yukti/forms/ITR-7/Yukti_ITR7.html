  eng:engCg, exp:expCg, imp:impCg, chk:chkCg, order:50, corder:45});

})();

/* =====================================================================
   ITR-7 · Section "cyla" — Schedule CYLA
   Current-year loss set-off (Details of Income after set-off of current
   years losses).  Built strictly from books/ITR-7/Schedule_CYLA.md
   (schema block ScheduleCYLA) — the trust/institution return.

   ITR-7 has ONE set-off sheet: Schedule CYLA (there is no BFLA matrix in
   this block — brought-forward adjustment is not part of it).  The matrix
   runs THIRTEEN live income-head rows (the three pre-23-Jul-2024 CG rate
   slots STCG@15% / LTCG@10% / LTCG@20% are hidden, not built).  Five
   columns:  1 income · 2 HP-loss set off · 3 business-loss set off ·
   4 OS-loss set off (excl race horses) · 5 income remaining (5 = 1−2−3−4).

   The house-property loss set off is capped at Rs 2,00,000 (s.71(3A) /
   rule A354); any excess is not relieved here (it carries under Schedule
   CFL, built elsewhere).  A normal other-sources loss not set off lapses.

   compute order 50 (corder) — runs AFTER every income head (hp 40, oa 41,
   bp 42, os 44, cg 45, vda 46, pti 47) and before the tax roll-up.

   CONSUMES (guarded, default 0):
     S.C.hp.total       house-property head total (signed)
     S.C.hp.lossFull    full HP loss magnitude (row-6 col-2 feed, A360)
     S.C.bp.a.A36       business (excl spec/specified) net P&L (signed)
     S.C.bp.e.specInc / .specifiedInc   Table-E 3ii / 3iii income
     S.C.bp.e.lossRemain                Table-E 2v business loss (col-3 feed, A361)
     S.C.cg.after.{st20,st30,stApp,stDTAA,lt125,ltDTAA}  Table-E 8ii..8vii
     S.C.os.total       normal-rate OS income  = MAX(0, item 6)
     S.C.os.loss        normal-rate OS loss    = MAX(0,−item 6) (col-4 feed, A362)
     S.C.os.raceHorse   race-horse balance (item 8e, signed)
     S.C.os.dtaaTotal   OS at special DTAA rates (item 2e)

   PUBLISHES on S.C.cyla (nothing else writes it) — for the tax (Part
   B-TI) / SI sections:
     .inc.<head>        col-1 current-year income by head (≥0)
     .after.<head>      col-5 income remaining after set-off (5=1−2−3−4)
     .setHP/.setBus/.setOS.<head>   the matrix set-off cells
     .hpLoss/.busLoss/.osLoss       the three "loss to be adjusted" figures
     .totHPset/.totBusset/.totOSset row xiv column totals (HP capped 2L)
     .totalSetOff       2xiv+3xiv+4xiv  → Part B-TI Sl.No.12/9/8 (A500/A565/A601)
     .balHP/.balBus/.balOS          row xv loss remaining after set-off
     .gti               Σ col-5 across the 13 heads (income remaining)
     .editFlag          "Y"/"N" (CYLAEditFlag)
   ===================================================================== */

/* ---- state ---------------------------------------------------------- */
/* S.cyla.edit  — the row-51 "edit auto-populated details?" switch ("Y"/"").
   S.cyla.over.<head> = {hp,bus,os} — the manual set-off cells behind it.  */
S.cyla = S.cyla || { edit:"", over:{} };
if(typeof S.cyla.over!=="object"||!S.cyla.over) S.cyla.over={};

/* The THIRTEEN live income-head rows, in the sheet's row order (i..xiii).
   Each entry: [key, schemaObject, label, {cyHP, cyBus, cyOS}]
   The flag object is which current-year set-off column exists on that row
   (Schedule_CYLA.md §3 — the schema leaf presence is the authority):
     cyHP  — HP loss may be set off here (column 2 present)
     cyBus — business loss may be set off here (column 3 present)
     cyOS  — normal OS loss may be set off here (column 4 present)
   "—" columns (A HP loss cannot go against HP income; a business loss not
   against a business row; a normal OS loss not against OS-normal income).  */
const CYLA_ROWS=[
 ["hp",       "HP",                         "House property",                                                                       {cyHP:0,cyBus:1,cyOS:1}],
 ["bus",      "BusProfExclSpecProf",        "Income from Business (excluding speculation profit and income from specified business or profession)", {cyHP:1,cyBus:0,cyOS:1}],
 ["spec",     "SpeculationIncome",          "Speculative Income",                                                                   {cyHP:1,cyBus:0,cyOS:1}],
 ["specified","SpecifiedBusIncome",         "Specified Business Income u/s 35AD",                                                   {cyHP:1,cyBus:0,cyOS:1}],
 ["st20",     "STCG20Per",                  "Short-term capital gain taxable @ 20%",                                                {cyHP:1,cyBus:1,cyOS:1}],
 ["st30",     "STCG30Per",                  "Short-term capital gain taxable @ 30%",                                                {cyHP:1,cyBus:1,cyOS:1}],
 ["stApp",    "STCGAppRate",                "Short-term capital gain taxable at applicable rates",                                  {cyHP:1,cyBus:1,cyOS:1}],
 ["stDTAA",   "STCGDTAARate",               "Short-term capital gain taxable at special rates in India as per DTAA",                {cyHP:1,cyBus:1,cyOS:1}],
 ["lt125",    "LTCG12_5Per",                "Long term capital gain taxable @ 12.5%",                                               {cyHP:1,cyBus:1,cyOS:1}],
 ["ltDTAA",   "LTCGDTAARate",               "Long term capital gains taxable at special rates in India as per DTAA",                {cyHP:1,cyBus:1,cyOS:1}],
 ["os",       "OthSrcExclRaceHorseLottery", "Net Income from Other sources (excluding profit from owning race horses and winnings from lottery)", {cyHP:1,cyBus:1,cyOS:0}],
 ["horse",    "ProfitFrmRaceHorse",         "Profit from the activity of owning and maintaining race horses",                       {cyHP:1,cyBus:1,cyOS:1}],
 ["osDTAA",   "IncOSDTAA",                  "Income from other sources taxable at special rates in India as per DTAA",              {cyHP:1,cyBus:1,cyOS:1}]];
const CYLA_KEYS=CYLA_ROWS.map(r=>r[0]);
const CYLA_HPCAP=200000;                                      /* s.71(3A) / A354 */

/* Set-off walk orders — the heads each current-year loss may be set off
   against (flag-eligible), in the utility's running-remainder order.
   A374: a normal OS loss is set off FIRST against race-horse profit and OS
   income taxable at special DTAA rates, then the rest.  Each walk respects
   the row's remaining income, so on any row col2+col3+col4 ≤ col1 (A375). */
const CYLA_ORDER_HP =["bus","spec","specified","os","horse","st30","stApp","st20","stDTAA","lt125","ltDTAA","osDTAA"];
const CYLA_ORDER_BUS=["hp","os","horse","osDTAA","st30","stApp","st20","stDTAA","lt125","ltDTAA"];
const CYLA_ORDER_OS =["horse","osDTAA","hp","bus","spec","specified","st30","stApp","st20","stDTAA","lt125","ltDTAA"];

/* ---- engine --------------------------------------------------------- */
function engCyla(){
  const g=o=>o||{};
  const hp=g(S.C.hp), bp=g(S.C.bp), cg=g(S.C.cg), os=g(S.C.os);
  const bpE=g(bp.e), bpA=g(bp.a), cgAfter=g(cg.after);

  /* ---- row 6 · the three current-year losses coming in --------------- */
  /* HP: full loss magnitude (Sl.No.3 of Sch HP, A360). The 2L cap of s.71(3A)
     bites on the total SET OFF (xiv col 2, A354), not on this figure. */
  const hpLoss  = R(("lossFull" in hp)?N(hp.lossFull):Math.max(0,-N(hp.total)));   /* G6 TotHPlossCurYr */
  const hpAvail = Math.min(hpLoss, CYLA_HPCAP);                                     /* set-off limited to 2,00,000 */
  const busLoss = R(("lossRemain" in bpE)?Math.max(0,N(bpE.lossRemain))            /* H6 TotBusLoss = Table-E 2v (A361) */
                    : Math.max(0,-N(bpA.A36)));
  const osLoss  = R(("loss" in os)?Math.max(0,N(os.loss)):Math.max(0,-N(os.total)));/* I6 TotOthSrcLossNoRaceHorse (A362) */

  /* ---- col 1 · income of the current year (positive only) ----------- */
  const specInc      = ("specInc" in bpE)?N(bpE.specInc):Math.max(0,N(g(bp.b).B40));
  const specifiedInc = ("specifiedInc" in bpE)?N(bpE.specifiedInc):Math.max(0,N(g(bp.c).C46));
  const inc={
    hp:Math.max(0,N(hp.total)),                                  /* i  = MAX(0, Sch HP item 3) */
    bus:Math.max(0,N(bpA.A36)),                                  /* ii = A36 of BP if positive (A372) */
    spec:Math.max(0,specInc),                                    /* iii= Table-E 3ii (A364) */
    specified:Math.max(0,specifiedInc),                          /* iv = Table-E 3iii (A365) */
    st20:Math.max(0,N(cgAfter.st20)),                            /* v  = Table-E 8ii (A376) */
    st30:Math.max(0,N(cgAfter.st30)),                            /* vi = Table-E 8iii (A366) */
    stApp:Math.max(0,N(cgAfter.stApp)),                          /* vii= Table-E 8iv (A367) */
    stDTAA:Math.max(0,N(cgAfter.stDTAA)),                        /* viii=Table-E 8v (A368) */
    lt125:Math.max(0,N(cgAfter.lt125)),                          /* ix = Table-E 8vi (A377) */
    ltDTAA:Math.max(0,N(cgAfter.ltDTAA)),                        /* x  = Table-E 8vii (A369) */
    os:Math.max(0,N(("total" in os)?os.total:0)),                /* xi = MAX(0, OS item 6) (A370) */
    horse:Math.max(0,N(os.raceHorse)),                           /* xii= OS item 8e (A371) */
    osDTAA:Math.max(0,N(os.dtaaTotal))};                         /* xiii=OS item 2e (A378) */

  /* ---- cols 2/3/4 · the set-off matrix ------------------------------ */
  const setHP={},setBus={},setOS={},remInc={},flag={};
  CYLA_ROWS.forEach(r=>{setHP[r[0]]=0;setBus[r[0]]=0;setOS[r[0]]=0;remInc[r[0]]=inc[r[0]];flag[r[0]]=r[3];});

  if(S.cyla.edit==="Y"){                                         /* row-51 manual override */
    CYLA_ROWS.forEach(r=>{const k=r[0],f=r[3],ov=g(S.cyla.over[k]);
      if(f.cyHP){setHP[k]=Math.max(0,Math.min(N(ov.hp),remInc[k]));remInc[k]-=setHP[k];}
      if(f.cyBus){setBus[k]=Math.max(0,Math.min(N(ov.bus),remInc[k]));remInc[k]-=setBus[k];}
      if(f.cyOS){setOS[k]=Math.max(0,Math.min(N(ov.os),remInc[k]));remInc[k]-=setOS[k];}});
  }else{                                                         /* auto set-off (greedy, running remainder) */
    let rem=hpAvail; CYLA_ORDER_HP.forEach(k=>{if(rem<=0||!flag[k].cyHP)return;
      const t=Math.max(0,Math.min(rem,remInc[k]));setHP[k]=t;remInc[k]-=t;rem-=t;});
    rem=busLoss;     CYLA_ORDER_BUS.forEach(k=>{if(rem<=0||!flag[k].cyBus)return;
      const t=Math.max(0,Math.min(rem,remInc[k]));setBus[k]=t;remInc[k]-=t;rem-=t;});
    rem=osLoss;      CYLA_ORDER_OS.forEach(k=>{if(rem<=0||!flag[k].cyOS)return;
      const t=Math.max(0,Math.min(rem,remInc[k]));setOS[k]=t;remInc[k]-=t;rem-=t;});
  }

  const sum=o=>CYLA_KEYS.reduce((a,k)=>a+N(o[k]),0);
  const totHPset =R(Math.max(0,Math.min(CYLA_HPCAP,sum(setHP))));      /* xiv col 2 — capped 2L (A354) */
  const totBusset=R(Math.max(0,Math.min(sum(setBus),busLoss)));       /* xiv col 3 (A355) */
  const totOSset =R(Math.max(0,Math.min(sum(setOS),osLoss)));         /* xiv col 4 (A356) */
  const balHP =R(Math.max(0,hpLoss-totHPset));                        /* xv col 2 (A357) */
  const balBus=R(Math.max(0,busLoss-totBusset));                      /* xv col 3 (A358) */
  const balOS =R(Math.max(0,osLoss-totOSset));                        /* xv col 4 (A359) */

  const after={};let gti=0;
  CYLA_ROWS.forEach(r=>{const k=r[0];
    after[k]=R(Math.max(0,inc[k]-setHP[k]-setBus[k]-setOS[k]));       /* col 5 = 1−2−3−4 (A363) */
    gti+=after[k];});

  S.C.cyla={
    inc,after,setHP,setBus,setOS,flag,
    hpLoss:R(hpLoss),busLoss:R(busLoss),osLoss:R(osLoss),
    totHPset,totBusset,totOSset,balHP,balBus,balOS,
    totalSetOff:R(totHPset+totBusset+totOSset),                       /* → Part B-TI Sl.No.12/9/8 */
    total:R(totHPset+totBusset+totOSset),                             /* SEAM: tax reads S.C.cyla.total */
    cyTotal:R(totHPset+totBusset+totOSset),                           /* SEAM: tax's secondary read S.C.cyla.cyTotal */
    gti:R(gti),                                                       /* Σ col-5 income remaining */
    editFlag:S.cyla.edit==="Y"?"Y":"N"};
  return S.C.cyla;
}

/* ---- renderer ------------------------------------------------------- */
function secCyla(){
  const L=S.C.cyla||engCyla();
  const closed='style="background:var(--closed)"';
  const ed=S.cyla.edit==="Y";
  let h="";

  h+=note("Schedule CYLA sets <b>this year's</b> house-property, business and normal other-sources losses "+
    "against this year's income, head by head. A house-property loss is set off only up to "+
    "<b>Rs 2,00,000</b> (section 71(3A)); a normal other-sources loss not set off here lapses. "+
    "Column 5 (income remaining) = column 1 − 2 − 3 − 4.");

  const sl=["i","ii","iii","iv","v","vi","vii","viii","ix","x","xi","xii","xiii"];
  h+='<div class="full"><table class="gt" style="min-width:1180px"><thead><tr>'+
     '<th class="l" style="width:34px">Sl.</th>'+
     '<th class="l" style="min-width:340px">Head / Source of Income</th>'+
     '<th style="width:130px">Income of current year (1)</th>'+
     '<th style="width:140px">HP loss set off (2)</th>'+
     '<th style="width:150px">Business loss set off (3)</th>'+
     '<th style="width:170px">OS loss set off (4)</th>'+
     '<th style="width:140px">Remaining after set-off (5)</th></tr></thead><tbody>';

  /* row 6 — loss to be adjusted (the three incoming current-year losses) */
  h+='<tr><td class="l"></td><td class="l"><b>Loss to be adjusted</b></td><td></td>'+
     '<td class="num">'+cell(-L.hpLoss)+
       (L.hpLoss>CYLA_HPCAP?'<span class="dt">set-off capped at Rs 2,00,000</span>':'')+'</td>'+
     '<td class="num">'+cell(-L.busLoss)+'</td>'+
     '<td class="num">'+cell(-L.osLoss)+'</td><td></td></tr>';

  /* the thirteen head rows */
  CYLA_ROWS.forEach((r,i)=>{const k=r[0],label=r[2],f=r[3];
    h+='<tr><td class="l">'+sl[i]+'</td><td class="l">'+esc(label)+'</td>'+
       '<td class="num">'+cell(L.inc[k])+'</td>'+
       '<td class="num"'+(f.cyHP?'':' '+closed)+'>'+(f.cyHP?(ed?inp("cyla.over."+k+".hp",{n:1}):cell(L.setHP[k])):'')+'</td>'+
       '<td class="num"'+(f.cyBus?'':' '+closed)+'>'+(f.cyBus?(ed?inp("cyla.over."+k+".bus",{n:1}):cell(L.setBus[k])):'')+'</td>'+
       '<td class="num"'+(f.cyOS?'':' '+closed)+'>'+(f.cyOS?(ed?inp("cyla.over."+k+".os",{n:1}):cell(L.setOS[k])):'')+'</td>'+
       '<td class="num">'+cell(L.after[k])+'</td></tr>';});

  h+='</tbody><tfoot>'+
     '<tr><td class="l">xiv</td><td class="l">Total loss set-off</td><td></td>'+
       '<td>'+F(L.totHPset)+'</td><td>'+F(L.totBusset)+'</td><td>'+F(L.totOSset)+'</td><td></td></tr>'+
     '<tr><td class="l">xv</td><td class="l">Loss remaining after set-off</td><td></td>'+
       '<td>'+F(L.balHP)+'<span class="dt">&rarr; CFL</span></td>'+
       '<td>'+F(L.balBus)+'<span class="dt">&rarr; CFL</span></td>'+
       '<td>'+F(L.balOS)+'<span class="dt">lapses</span></td><td></td></tr>'+
     '</tfoot></table></div>';

  if(L.totHPset>=CYLA_HPCAP && L.hpLoss>CYLA_HPCAP)
    h+=note("The house-property loss set off is at the Rs 2,00,000 ceiling of section 71(3A); "+
      "Rs "+F(L.hpLoss-CYLA_HPCAP)+" of the loss is not relieved here and carries under Schedule CFL.","warn");

  h+=row("Do you want to edit the details auto-populated in the table above?",
    sel("cyla.edit",[["","No"],["Y","Yes"]],{blank:false}),{ref:"CYLA"});
  if(ed)h+=note("Editing is on. The two-lakh house-property cap, the col 2 + 3 + 4 &le; col 1 check and "+
    "the col-5 identity are enforced against the figures you enter.");

  return h;
}

/* ---- export --------------------------------------------------------- */
/* Writes the ScheduleCYLA block.  Fixed matrix — every live head object gets
   its required IncCYLA leaves (IncOfCurYrUnderThatHead + IncOfCurYrAfterSetOff)
   and the set-off leaves that exist on that row.  put() writes 0 (only skips
   undefined/""), so the schema-required leaves are always present. */
function expCyla(j){
  const L=S.C.cyla||engCyla();
  /* emit only when the matrix carries something (income or a loss) */
  const any=CYLA_KEYS.some(k=>N(L.inc[k])>0) || L.hpLoss>0 || L.busLoss>0 || L.osLoss>0;
  if(!any) return;

  const B="ScheduleCYLA.";
  CYLA_ROWS.forEach(r=>{const k=r[0],obj=r[1],f=r[3],p=B+obj+".IncCYLA.";
    put(j,p+"IncOfCurYrUnderThatHead",n0(L.inc[k]));
    if(f.cyHP)  put(j,p+"HPlossCurYrSetoff",n0(L.setHP[k]));
    if(f.cyBus) put(j,p+"BusLossSetoff",n0(L.setBus[k]));
    if(f.cyOS)  put(j,p+"OthSrcLossNoRaceHorseSetoff",n0(L.setOS[k]));
    put(j,p+"IncOfCurYrAfterSetOff",n0(L.after[k]));});

  put(j,B+"TotalCurYr.TotHPlossCurYr",n0(L.hpLoss));
  put(j,B+"TotalCurYr.TotBusLoss",n0(L.busLoss));
  put(j,B+"TotalCurYr.TotOthSrcLossNoRaceHorse",n0(L.osLoss));

  put(j,B+"TotalLossSetOff.TotHPlossCurYrSetoff",n0(L.totHPset));
  put(j,B+"TotalLossSetOff.TotBusLossSetoff",n0(L.totBusset));
  put(j,B+"TotalLossSetOff.TotOthSrcLossNoRaceHorseSetoff",n0(L.totOSset));

  put(j,B+"LossRemAftSetOff.BalHPlossCurYrAftSetoff",n0(L.balHP));
  put(j,B+"LossRemAftSetOff.BalBusLossAftSetoff",n0(L.balBus));
  put(j,B+"LossRemAftSetOff.BalOthSrcLossNoRaceHorseAftSetoff",n0(L.balOS));

  put(j,B+"CYLAEditFlag",L.editFlag);
}

/* ---- import --------------------------------------------------------- */
/* Round-trips the override switch and (when on) the manual set-off cells.
   The auto matrix itself recomputes from the income heads, so only the
   person-set state is seeded. */
function impCyla(I7){
  const read=[];
  const cy=I7&&I7.ScheduleCYLA;
  if(!cy)return read;
  S.cyla.edit=(cy.CYLAEditFlag==="Y")?"Y":"";
  if(S.cyla.edit==="Y"){
    S.cyla.over={};
    CYLA_ROWS.forEach(r=>{const k=r[0],f=r[3],b=(cy[r[1]]||{}).IncCYLA;if(!b)return;
      const o={};
      if(f.cyHP) o.hp=N(b.HPlossCurYrSetoff);
      if(f.cyBus)o.bus=N(b.BusLossSetoff);
      if(f.cyOS) o.os=N(b.OthSrcLossNoRaceHorseSetoff);
      S.cyla.over[k]=o;});
  }
  read.push("Schedule CYLA");
  return read;
}

/* ---- checks --------------------------------------------------------- */
function chkCyla(){
  const out=[];
  const L=S.C.cyla||engCyla();
  const add=(lvl,t,m)=>out.push({lvl,t,m,sec:"cyla"});

  /* A354 — HP set-off cap */
  if(L.totHPset>CYLA_HPCAP)
    add("err","House-property set-off cap","The current-year house-property loss set off (Rs "+F(L.totHPset)+
      ") exceeds the Rs 2,00,000 limit of section 71(3A).");

  /* A375 — on any row, cols 2+3+4 shall not exceed col 1 */
  const bad=CYLA_KEYS.filter(k=>N(L.setHP[k])+N(L.setBus[k])+N(L.setOS[k])>N(L.inc[k])+1);
  if(bad.length)
    add("err","Set-off exceeds income","A head's total set-off (columns 2 + 3 + 4) cannot exceed its income (column 1).");

  /* A355 / A356 — a set-off column total cannot exceed the loss to be adjusted */
  if(L.totBusset>L.busLoss+1)
    add("err","Business set-off exceeds loss","The business loss set off (Rs "+F(L.totBusset)+
      ") exceeds the business loss to be adjusted (Rs "+F(L.busLoss)+").");
  if(L.totOSset>L.osLoss+1)
    add("err","Other-sources set-off exceeds loss","The other-sources loss set off (Rs "+F(L.totOSset)+
      ") exceeds the other-sources loss to be adjusted (Rs "+F(L.osLoss)+").");

  /* informational */
  if(L.totalSetOff>0)
    add("ok","Current-year losses set off","Rs "+F(L.totalSetOff)+" of this year's losses set against other heads in Schedule CYLA.");
  if(L.hpLoss>CYLA_HPCAP)
    add("ok","House-property loss over Rs 2 lakh","Rs "+F(L.hpLoss-CYLA_HPCAP)+" of the house-property loss is beyond the two-lakh set-off ceiling and carries under Schedule CFL.");
  const lapse=L.balOS;
  if(lapse>0)
    add("warn","Other-sources loss lapses","Rs "+F(lapse)+" of the normal other-sources loss could not be set off and lapses (it is not carried forward).");

  return out;
}

/* ---- register (overrides the boot stub) ---- */
reg({id:"cyla", t:"Current-year loss set-off", ref:"Schedule CYLA",
  f:secCyla,
  s:()=>{const L=S.C.cyla||{};return L.totalSetOff?"Set off "+CR(L.totalSetOff):"";},
  eng:engCyla, exp:expCyla, imp:impCyla, chk:chkCyla, order:110, corder:50});

/* =====================================================================
   ITR-7 · Section "fa" — Foreign income, tax relief and foreign assets
   Books: books/ITR-7/Schedule_FSI.md (block ScheduleFSI)
          books/ITR-7/Schedule_TR.md  (block ScheduleTR1)
          books/ITR-7/Schedule_FA.md  (block ScheduleFA)
   Schema blocks: ScheduleFSI, ScheduleTR1, ScheduleFA
   Screen order 160, compute order 58 (foreign relief is published for the
   Part B tax roll-up, so it computes after the income heads/CYLA/BFLA).

   TRUST / INSTITUTION RETURN — read from the ITR-7 books, never ported:
   - FSI head list is House Property · Business or Profession · Capital
     Gains · Other Sources. There is NO Salary head (Schedule_FSI.md). The
     four schema head objects are IncFromHP, IncFromBusiness, IncCapGain,
     IncOthSrc, plus TotalCountryWise.
   - ScheduleTR1's grand total of taxes paid is TotalTaxOutsideIndia. The
     refund flag TaxPaidOutsideIndFlg is REQUIRED on ITR-7 (optional on
     ITR-6) — it is written ALWAYS whenever the TR block is emitted
     (Schedule_TR.md: "Set TaxPaidOutsideIndFlg always — it is mandatory").
   - ONE country-code list on ITR-7 FA: every FA country field (A1–A4 and
     B–G) uses `Country_WithoutIndia` (code-NAME format). FSI and TR use
     `FSI_newcountrycod` / the TR reference list (NAME:code). The two share
     the same 249 codes; only code 670 (Timor-Leste) differs by one space —
     FSI/TR carry a non-breaking space, FA does not. Each list keeps its own
     verbatim name; value stored is always the code.
   - FA enum VALUES are the schema's, matched verbatim (enums.json):
       OwnerStatus/Status  : OWNER · BENEFICIAL_OWNER · BENIFICIARY
       NatureOfInt/Ownership: DIRECT · BENEFICIAL_OWNER · BENIFICIARY
       NatureOfAmount (A2) : INT · DIV · SALE · OTH · NAP  (NOT ITR-6's I/D/S/O/N)
       Schedule where offered: HP · BU · CG · OS · EI · NI  (no salary)
       "taxable in your hands?" flags: Y · N
     The department's misspelled BENIFICIARY is deliberate.

   RESIDENCE GATE: FSI, TR and FA are "available only in case of resident"
   / "not Applicable for NRI". ITR-7 residential status (S.pi.res) is RES or
   NRI. Everything here is off for NRI.

   GTI NOTE: Schedule FSI adds no income — column (b) is "already included in
   PART B-TI". This section contributes 0 to Gross Total Income; its output
   is the foreign-tax relief that feeds Part B-TTI via TR.

   SEAM (publishes): S.C.fa.relief (total 90/91 relief), S.C.fa.relief90
   (DTAA, s.90/90A), S.C.fa.relief91 (non-DTAA, s.91), plus paidTot,
   reliefTot, dtaa, notDtaa, hasFA, income. The tax section reads
   S.C.fa.relief / relief90 / relief91 to reduce liability (Part B-TTI

/* residence: ITR-7 body is RES or NRI (no RNOR); default RES */
function faRes(){return st0((S.pi||{}).res)||"RES";}
function faOn(){return faRes()==="RES";}
function faCount(){return ["a1","a2","a3","a4","b","c","d","e","f","g"]
  .reduce((a,k)=>a+((S.fa[k]||[]).length),0);}
/* small local helper: count label for a table */
function faCnt(a){a=a||[];return a.length?(a.length+" row"+(a.length>1?"s":"")):"None";}

/* ================================================================
   ENGINE — engFa()
   ================================================================ */
function engFa(){
  const C=S.C.fa={income:0, fsi:[], trRows:[], paidTot:0, reliefTot:0,
                  dtaa:0, notDtaa:0, relief:0, relief90:0, relief91:0, hasFA:false};
  /* Schedule FSI adds no income to GTI — column (b) is already in Part B-TI. */
  C.income=0;

  /* Schedule FA present ⟺ any table has a row and the body is resident.
     Published so a Part B-TTI / who owner can set AssetOutsideIndiaFlg. */
  C.hasFA = faOn() && faCount()>0;

  if(!faOn()){S.fa.fsi=S.fa.fsi||[];return;}  /* NRI: schedules not applicable */

  (S.fa.fsi||[]).forEach(rw=>{
    const heads=["hp","bus","cg","os"];       /* NO salary head */
    let tb=0,tc=0,td=0,te=0; const hc={};
    heads.forEach(k=>{
      const h=rw[k]||{};
      const b=n0(h.b), c=n0(h.c), d=n0(h.d);
      const e=Math.min(c,d);                  /* (e)=MIN(c,d): relief = lower of tax paid (c) and tax payable (d) */
      hc[k]={b,c,d,e};
      tb+=b; tc+=c; td+=d; te+=e;             /* Total row = SUM down each column */
    });
    C.fsi.push({code:rw.code||"", name:FSI_CONM[rw.code]||rw.name||"", tin:rw.tin||"",
                sec:rw.sec||"", heads:hc, tot:{b:tb,c:tc,d:td,e:te}});
    /* one Schedule TR row per country: (c)=country total tax paid, (d)=country total relief */
    if(rw.code){
      C.trRows.push({code:rw.code, name:FSI_CONM[rw.code]||rw.name||"", tin:rw.tin||"",
                     paid:tc, relief:te, sec:rw.sec||""});
    }
  });

  /* TR totals (Schedule_TR.md) */
  C.paidTot   = C.trRows.reduce((a,r)=>a+n0(r.paid),0);      /* SUM col (c) -> TotalTaxOutsideIndia */
  C.reliefTot = C.trRows.reduce((a,r)=>a+n0(r.relief),0);    /* SUM col (d) -> TotalTaxReliefOutsideIndia */
  C.dtaa      = C.trRows.reduce((a,r)=>a+((r.sec==="90"||r.sec==="90A")?n0(r.relief):0),0); /* SUMIF 90/90A */
  C.notDtaa   = C.trRows.reduce((a,r)=>a+(r.sec==="91"?n0(r.relief):0),0);                  /* SUMIF 91 */
  /* SEAM: relief90 -> Part B-TTI Section90, relief91 -> Section91, relief -> TotTaxRelief */
  C.relief90  = C.dtaa;
  C.relief91  = C.notDtaa;
  C.relief    = C.reliefTot;
}

/* ================================================================
   RENDERER — secFa()
   (the FSI country loop calls the shell renderer blk(); no local var is
    named `blk`, to avoid shadowing it — that once crashed ITR-6.)
   ================================================================ */
function secFa(){
  const C=S.C.fa||{fsi:[],trRows:[],paidTot:0,reliefTot:0,dtaa:0,notDtaa:0};

  if(!faOn())
    return note("<b>Not applicable.</b> Schedules FSI, TR and FA are available only when the body is <b>resident</b> (FA is not applicable for NRI). Set residential status to Resident under <i>Who is filing</i> to enter foreign income, tax relief and foreign assets.","form");

  let H="";

  /* ---------- Schedule FSI ---------- */
  let fsiInner=note("Details of income from outside India and tax relief (available only in case of resident). The amounts in (b) are already included in Part B-TI — this schedule identifies that slice and computes the relief. Column (e) = lower of (c) tax paid outside India and (d) tax payable in India. If no Country Code is entered, the row is not considered.");
  const HEADS=[["hp","i","House Property"],["bus","ii","Business or Profession"],["cg","iii","Capital Gains"],["os","iv","Other Sources"]];
  (S.fa.fsi||[]).forEach((rw,i)=>{
    const cr=(C.fsi||[])[i]||{heads:{},tot:{b:0,c:0,d:0,e:0}};
    let tbl='<div class="full"><table class="gt" style="min-width:920px"><thead><tr>'+
      '<th class="l">Head of income (a)</th>'+
      '<th>Income from outside India (b)</th>'+
      '<th>Tax paid outside India (c)</th>'+
      '<th>Tax payable in India (d)</th>'+
      '<th>Tax relief (e)=min(c,d)</th>'+
      '<th class="l">DTAA article u/s 90/90A (f)</th></tr></thead><tbody>';
    HEADS.forEach(hd=>{const k=hd[0], p="fa.fsi."+i+"."+k, hc=(cr.heads||{})[k]||{e:0};
      tbl+='<tr><td class="l">'+hd[1]+' — '+esc(hd[2])+'</td>'+
        '<td>'+inp(p+".b",{n:1})+'</td>'+
        '<td>'+inp(p+".c",{n:1})+'</td>'+
        '<td>'+inp(p+".d",{n:1})+'</td>'+
        '<td class="num">'+cell(hc.e)+'</td>'+
        '<td class="l">'+inp(p+".art",{max:16,ph:"Article"})+'</td></tr>';});
    const tt=cr.tot||{b:0,c:0,d:0,e:0};
    tbl+='<tr><td class="l"><b>Total (i+ii+iii+iv)</b></td>'+
       '<td class="num">'+cell(tt.b)+'</td><td class="num">'+cell(tt.c)+'</td>'+
       '<td class="num">'+cell(tt.d)+'</td><td class="num">'+cell(tt.e)+'</td><td></td></tr>';
    tbl+='</tbody></table></div>';
    const hdr=row("Country/Region Code",sel("fa.fsi."+i+".code",FSI_CO),{req:1})+
      row("Taxpayer Identification Number",inp("fa.fsi."+i+".tin",{max:75}),{req:1})+
      row("Section under which relief claimed",sel("fa.fsi."+i+".sec",FA_RELSEC),{hint:"90 / 90A (DTAA) or 91 (no DTAA) — carried to Schedule TR"});
    const nm=rw.code?(FSI_CONM[rw.code]||rw.code):"New country";
    fsiInner+=blk("fsi"+i, "Country "+(i+1)+" — "+esc(nm), tt.e?RS(tt.e)+" relief":"—", hdr+tbl, "fa.fsi."+i);
  });
  fsiInner+='<button class="add" data-add="fa.fsi">Add a country</button>';
  H+=fold("fa_fsi","Schedule FSI","Income from outside India & tax relief",
      (C.fsi||[]).length?(C.fsi.length+" countr"+(C.fsi.length>1?"ies":"y")):"None", fsiInner, {def:true});

  /* ---------- Schedule TR ---------- */
  let trTbl;
  if((C.trRows||[]).length){
    trTbl='<div class="full"><table class="gt" style="min-width:760px"><thead><tr>'+
      '<th class="l">Country/Region (a)</th><th class="l">TIN (b)</th>'+
      '<th>Taxes paid outside India (c)</th><th>Tax relief available (d)</th>'+
      '<th class="l">Relief section (e)</th></tr></thead><tbody>';
    (C.trRows||[]).forEach(r=>{
      let fi=-1;(S.fa.fsi||[]).forEach((bk,j)=>{if(fi<0&&bk.code===r.code)fi=j;});
      trTbl+='<tr><td class="l">'+esc(r.name||r.code)+'</td><td class="l">'+esc(r.tin||"—")+'</td>'+
        '<td class="num">'+cell(r.paid)+'</td><td class="num">'+cell(r.relief)+'</td>'+
        '<td class="l">'+(fi>=0?sel("fa.fsi."+fi+".sec",FA_RELSEC,{style:"width:100%"}):esc(r.sec||"—"))+'</td></tr>';
    });
    trTbl+='<tr><td class="l"><b>Total</b></td><td></td>'+
      '<td class="num">'+cell(C.paidTot)+'</td><td class="num">'+cell(C.reliefTot)+'</td><td></td></tr>';
    trTbl+='</tbody></table></div>';
  } else {
    trTbl=note("Schedule TR is generated from Schedule FSI — add a country in FSI above (with a Country Code) and its taxes paid (c) and relief (e) appear here per country.");
  }
  let trInner=trTbl+
    row("Total relief where DTAA applies (section 90/90A)",cell(C.dtaa),{hint:"sum of (d) where section is 90 or 90A"})+
    row("Total relief where DTAA does not apply (section 91)",cell(C.notDtaa),{hint:"sum of (d) where section is 91"})+
    row("Total taxes paid outside India",cell(C.paidTot),{hint:"TotalTaxOutsideIndia"})+
    row("Total tax relief available",cell(C.reliefTot),{hint:"TotalTaxReliefOutsideIndia"})+
    row("Any tax paid outside India, on which relief was allowed in India, refunded/credited by the foreign authority this year?",
        sel("fa.trFlag",FA_REFFLAG),{req:1,hint:"required on ITR-7"});
  if(S.fa.trFlag==="YES"){
    trInner+=row("Amount of tax refunded",inp("fa.trAmt",{n:1}))+
             row("Assessment year in which the relief was allowed in India",inp("fa.trAY",{max:9,ph:"YYYY-YY"}));
  }
  H+=fold("fa_tr","Schedule TR","Summary of tax relief for taxes paid outside India",
      C.reliefTot?RS(C.reliefTot)+" relief":"—", trInner, {def:false});

  /* ---------- Schedule FA ---------- */
  let faInner=note("Details of foreign assets and income from any source outside India, held at any time during the <b>calendar year</b> 1 Jan – 31 Dec 2025 (peak and closing balances are for that period, not the financial year). Values in rupees. Beneficial interest counts. If no Country Code (or, in E, no institution name) is entered in a row, that row is not considered. The \"schedule / item where offered\" columns point at where the income already sits in this return — FA adds no income.");

  /* A1 — Foreign Depository Accounts */
  faInner+=fold("fa_a1","A1","Foreign Depository Accounts", faCnt(S.fa.a1),
    grid("fa.a1",[
      {h:"Country/Region",k:"code",t:"sel",opts:FA_CO},
      {h:"Financial institution",k:"Bankname",t:"txt",max:125},
      {h:"Address",k:"AddressOfBank",t:"txt",max:200},
      {h:"ZIP",k:"ZipCode",t:"txt",max:8},
      {h:"Account no.",k:"ForeignAccountNumber",t:"txt",max:34},
      {h:"Status",k:"OwnerStatus",t:"sel",opts:FA_OWN},
      {h:"Opened",k:"AccOpenDate",t:"date"},
      {h:"Peak balance (₹)",k:"PeakBalanceDuringYear",t:"num"},
      {h:"Closing balance",k:"ClosingBalance",t:"num"},
      {h:"Gross interest",k:"IntrstAccured",t:"num"}
    ],S.fa.a1,{min:"1200px",empty:"No foreign depository accounts.",add:"Add a depository account"}),{def:false});

  /* A2 — Foreign Custodial Accounts */
  faInner+=fold("fa_a2","A2","Foreign Custodial Accounts", faCnt(S.fa.a2),
    grid("fa.a2",[
      {h:"Country/Region",k:"code",t:"sel",opts:FA_CO},
      {h:"Financial institution",k:"FinancialInstName",t:"txt",max:125},
      {h:"Address",k:"FinancialInstAddress",t:"txt",max:200},
      {h:"ZIP",k:"ZipCode",t:"txt",max:8},
      {h:"Account no.",k:"AccountNumber",t:"txt",max:34},
      {h:"Status",k:"Status",t:"sel",opts:FA_OWN},
      {h:"Opened",k:"AccOpenDate",t:"date"},
      {h:"Peak balance (₹)",k:"PeakBalanceDuringPeriod",t:"num"},
      {h:"Closing balance",k:"ClosingBalance",t:"num"},
      {h:"Nature of amount",k:"NatureOfAmount",t:"sel",opts:FA_NAMT},
      {h:"Gross amount",k:"GrossAmtPaidCredited",t:"num"}
    ],S.fa.a2,{min:"1300px",empty:"No foreign custodial accounts.",add:"Add a custodial account"}),{def:false});

  /* A3 — Foreign Equity & Debt Interest */
  faInner+=fold("fa_a3","A3","Foreign Equity and Debt Interest", faCnt(S.fa.a3),
    grid("fa.a3",[
      {h:"Country/Region",k:"code",t:"sel",opts:FA_CO},
      {h:"Name of entity",k:"NameOfEntity",t:"txt",max:125},
      {h:"Address",k:"AddressOfEntity",t:"txt",max:200},
      {h:"ZIP",k:"ZipCode",t:"txt",max:8},
      {h:"Nature of entity",k:"NatureOfEntity",t:"txt",max:34},
      {h:"Acquired on",k:"InterestAcquiringDate",t:"date"},
      {h:"Initial value (₹)",k:"InitialValOfInvstmnt",t:"num"},
      {h:"Peak value",k:"PeakBalanceDuringPeriod",t:"num"},
      {h:"Closing balance",k:"ClosingBalance",t:"num"},
      {h:"Gross amount paid",k:"TotGrossAmtPaidCredited",t:"num"},
      {h:"Gross sale proceeds",k:"TotGrossProceeds",t:"num"}
    ],S.fa.a3,{min:"1300px",empty:"No foreign equity/debt interest.",add:"Add an equity/debt interest"}),{def:false});

  /* A4 — Foreign Cash Value Insurance / Annuity */
  faInner+=fold("fa_a4","A4","Foreign Cash Value Insurance / Annuity Contract", faCnt(S.fa.a4),
    grid("fa.a4",[
      {h:"Country/Region",k:"code",t:"sel",opts:FA_CO},
      {h:"Financial institution",k:"FinancialInstName",t:"txt",max:125},
      {h:"Address",k:"FinancialInstAddress",t:"txt",max:200},
      {h:"ZIP",k:"ZipCode",t:"txt",max:8},
      {h:"Date of contract",k:"ContractDate",t:"date"},
      {h:"Cash / surrender value (₹)",k:"CashValOrSurrenderVal",t:"num"},
      {h:"Gross amount paid",k:"TotGrossAmtPaidCredited",t:"num"}
    ],S.fa.a4,{min:"1000px",empty:"No insurance/annuity contracts.",add:"Add a contract"}),{def:false});

  /* B — Financial Interest in any Entity */
  faInner+=fold("fa_b","B","Financial Interest in any Entity", faCnt(S.fa.b),
    grid("fa.b",[
      {h:"Country/Region",k:"code",t:"sel",opts:FA_CO},
      {h:"ZIP",k:"ZipCode",t:"txt",max:8},
      {h:"Nature of entity",k:"NatureOfEntity",t:"txt",max:100},
      {h:"Name of entity",k:"NameOfEntity",t:"txt",max:125},
      {h:"Address of entity",k:"AddressOfEntity",t:"txt",max:200},
      {h:"Nature of interest",k:"NatureOfInt",t:"sel",opts:FA_DIR},
      {h:"Held since",k:"DateHeld",t:"date"},
      {h:"Total investment (₹)",k:"TotalInvestment",t:"num"},
      {h:"Income accrued",k:"IncFromInt",t:"num"},
      {h:"Nature of income",k:"NatureOfInc",t:"txt",max:100},
      {h:"Income offered (₹)",k:"IncTaxAmt",t:"num"},
      {h:"Schedule",k:"IncTaxSch",t:"sel",opts:FA_OFF},
      {h:"Item no.",k:"IncTaxSchNo",t:"txt",max:50}
    ],S.fa.b,{min:"1600px",empty:"No financial interest.",add:"Add a financial interest"}),{def:false});

  /* C — Immovable Property */
  faInner+=fold("fa_c","C","Immovable Property", faCnt(S.fa.c),
    grid("fa.c",[
      {h:"Country/Region",k:"code",t:"sel",opts:FA_CO},
      {h:"ZIP",k:"ZipCode",t:"txt",max:8},
      {h:"Address of property",k:"AddressOfProperty",t:"txt",max:200},
      {h:"Ownership",k:"Ownership",t:"sel",opts:FA_DIR},
      {h:"Acquired on",k:"DateOfAcq",t:"date"},
      {h:"Total investment (₹)",k:"TotalInvestment",t:"num"},
      {h:"Income derived",k:"IncDrvProperty",t:"num"},
      {h:"Nature of income",k:"NatureOfInc",t:"txt",max:100},
      {h:"Income offered (₹)",k:"IncTaxAmt",t:"num"},
      {h:"Schedule",k:"IncTaxSch",t:"sel",opts:FA_OFF},
      {h:"Item no.",k:"IncTaxSchNo",t:"txt",max:50}
    ],S.fa.c,{min:"1400px",empty:"No immovable property.",add:"Add an immovable property"}),{def:false});

  /* D — Any other Capital Asset */
  faInner+=fold("fa_d","D","Any other Capital Asset", faCnt(S.fa.d),
    grid("fa.d",[
      {h:"Country/Region",k:"code",t:"sel",opts:FA_CO},
      {h:"ZIP",k:"ZipCode",t:"txt",max:8},
      {h:"Nature of asset",k:"NatureOfAsset",t:"txt",max:100},
      {h:"Ownership",k:"Ownership",t:"sel",opts:FA_DIR},
      {h:"Acquired on",k:"DateOfAcq",t:"date"},
      {h:"Total investment (₹)",k:"TotalInvestment",t:"num"},
      {h:"Income derived",k:"IncDrvAsset",t:"num"},
      {h:"Nature of income",k:"NatureOfInc",t:"txt",max:100},
      {h:"Income offered (₹)",k:"IncTaxAmt",t:"num"},
      {h:"Schedule",k:"IncTaxSch",t:"sel",opts:FA_OFF},
      {h:"Item no.",k:"IncTaxSchNo",t:"txt",max:50}
    ],S.fa.d,{min:"1400px",empty:"No other capital assets.",add:"Add a capital asset"}),{def:false});

  /* E — Accounts with signing authority (not in A–D) */
  faInner+=fold("fa_e","E","Accounts with signing authority (not in A–D)", faCnt(S.fa.e),
    grid("fa.e",[
      {h:"Institution name",k:"NameOfInstitution",t:"txt",max:125},
      {h:"Institution address",k:"AddressOfInstitution",t:"txt",max:200},
      {h:"Country/Region",k:"code",t:"sel",opts:FA_CO},
      {h:"ZIP",k:"ZipCode",t:"txt",max:8},
      {h:"Account holder",k:"NameMentionedInAccnt",t:"txt",max:125},
      {h:"Account no.",k:"InstitutionAccountNumber",t:"txt",max:34},
      {h:"Peak balance (₹)",k:"PeakBalanceOrInvestment",t:"num"},
      {h:"Income taxable?",k:"IncAccuredTaxFlag",t:"sel",opts:FA_YN},
      {h:"Income accrued",k:"IncAccuredInAcc",t:"num"},
      {h:"Income offered (₹)",k:"IncOfferedAmt",t:"num"},
      {h:"Schedule",k:"IncOfferedSch",t:"sel",opts:FA_OFF},
      {h:"Item no.",k:"IncOfferedSchNo",t:"txt",max:50}
    ],S.fa.e,{min:"1500px",empty:"No signing-authority accounts.",add:"Add an account"}),{def:false});

  /* F — Trusts outside India */
  faInner+=fold("fa_f","F","Trusts outside India (trustee/beneficiary/settlor)", faCnt(S.fa.f),
    grid("fa.f",[
      {h:"Country/Region",k:"code",t:"sel",opts:FA_CO},
      {h:"ZIP",k:"ZipCode",t:"txt",max:8},
      {h:"Name of trust",k:"NameOfTrust",t:"txt",max:125},
      {h:"Address of trust",k:"AddressOfTrust",t:"txt",max:200},
      {h:"Trustees",k:"NameOfOtherTrustees",t:"txt",max:125},
      {h:"Trustees address",k:"AddressOfOtherTrustees",t:"txt",max:200},
      {h:"Settlor",k:"NameOfSettlor",t:"txt",max:125},
      {h:"Settlor address",k:"AddressOfSettlor",t:"txt",max:200},
      {h:"Beneficiaries",k:"NameOfBeneficiaries",t:"txt",max:125},
      {h:"Beneficiaries address",k:"AddressOfBeneficiaries",t:"txt",max:200},
      {h:"Held since",k:"DateHeld",t:"date"},
      {h:"Income taxable?",k:"IncDrvTaxFlag",t:"sel",opts:FA_YN},
      {h:"Income derived",k:"IncDrvFromTrust",t:"num"},
      {h:"Income offered (₹)",k:"IncOfferedAmt",t:"num"},
      {h:"Schedule",k:"IncOfferedSch",t:"sel",opts:FA_OFF},
      {h:"Item no.",k:"IncOfferedSchNo",t:"txt",max:50}
    ],S.fa.f,{min:"1900px",empty:"No foreign trusts.",add:"Add a trust"}),{def:false});

  /* G — Any other income from a source outside India */
  faInner+=fold("fa_g","G","Other income from a source outside India", faCnt(S.fa.g),
    grid("fa.g",[
      {h:"Country/Region",k:"code",t:"sel",opts:FA_CO},
      {h:"ZIP",k:"ZipCode",t:"txt",max:8},
      {h:"Name of person",k:"NameOfPerson",t:"txt",max:125},
      {h:"Address",k:"AddressOfPerson",t:"txt",max:200},
      {h:"Income derived (₹)",k:"IncDerived",t:"num"},
      {h:"Nature of income",k:"NatureOfInc",t:"txt",max:100},
      {h:"Income taxable?",k:"IncDrvTaxFlag",t:"sel",opts:FA_YN},
      {h:"Income offered (₹)",k:"IncOfferedAmt",t:"num"},
      {h:"Schedule",k:"IncOfferedSch",t:"sel",opts:FA_OFF},
      {h:"Item no.",k:"IncOfferedSchNo",t:"txt",max:50}
    ],S.fa.g,{min:"1200px",empty:"No other foreign income.",add:"Add an income"}),{def:false});

  const fc=faCount();
  H+=fold("fa_fa","Schedule FA","Foreign assets & income from any source outside India",
      fc?(fc+" row"+(fc>1?"s":"")):"None", faInner, {def:false});

  return H;
}

/* ================================================================
   EXPORT — expFa(j)   (schema keys/enum values verbatim)
   ================================================================ */
function expFa(j){
  const C=S.C.fa||{fsi:[],trRows:[],paidTot:0,reliefTot:0,dtaa:0,notDtaa:0};
  if(!faOn())return;   /* FSI/TR/FA not applicable to an NRI */

  /* ---- ScheduleFSI ---- (four heads: HP, Business, CG, OS — no salary) ---- */
  const fsiArr=[];
  (C.fsi||[]).forEach(cr=>{
    if(!cr.code)return;    /* no country code -> row not considered */
    const el={};
    pf(el,"CountryName", cr.name||FSI_CONM[cr.code]||"");
    pf(el,"CountryCodeExcludingIndia", cr.code);
    pf(el,"TaxIdentificationNo", cr.tin);
    const bst=(S.fa.fsi||[]).find(b=>b.code===cr.code)||{};
    const obj=(sk,dtaa)=>{const h=(cr.heads||{})[sk]||{b:0,c:0,d:0,e:0};const o={};
      o.IncFrmOutsideInd=n0(h.b); o.TaxPaidOutsideInd=n0(h.c);
      o.TaxPayableinInd=n0(h.d);  o.TaxReliefinInd=n0(h.e);
      const art=sv((bst[sk]||{}).art);
      if(art&&dtaa)o.DTAAReliefUs90or90A=art;
      return o;};
    el.IncFromHP      =obj("hp",1);
    el.IncFromBusiness=obj("bus",1);
    el.IncCapGain     =obj("cg",1);
    el.IncOthSrc      =obj("os",1);
    const t=cr.tot||{b:0,c:0,d:0,e:0};
    el.TotalCountryWise={IncFrmOutsideInd:n0(t.b),TaxPaidOutsideInd:n0(t.c),
                         TaxPayableinInd:n0(t.d),TaxReliefinInd:n0(t.e)};
    fsiArr.push(el);
  });
  if(fsiArr.length)put(j,"ScheduleFSI.ScheduleFSIDtls",fsiArr);

  /* ---- ScheduleTR1 ---- (grand total key is TotalTaxOutsideIndia) ---- */
  const trArr=[];
  (C.trRows||[]).forEach(r=>{
    const el={};
    pf(el,"CountryName", r.name||FSI_CONM[r.code]||"");
    pf(el,"CountryCodeExcludingIndia", r.code);
    pf(el,"TaxIdentificationNo", r.tin);
    el.TaxPaidOutsideIndia=n0(r.paid);
    el.TaxReliefOutsideIndia=n0(r.relief);
    if(sv(r.sec))el.ReliefClaimedUsSection=r.sec;
    trArr.push(el);
  });
  if(trArr.length)put(j,"ScheduleTR1.ScheduleTR",trArr);
  if(trArr.length||C.reliefTot||C.paidTot){
    /* block-level required totals — present even at zero once TR is filed */
    put(j,"ScheduleTR1.TotalTaxOutsideIndia",n0(C.paidTot));
    put(j,"ScheduleTR1.TotalTaxReliefOutsideIndia",n0(C.reliefTot));
    put(j,"ScheduleTR1.TaxReliefOutsideIndiaDTAA",n0(C.dtaa));
    put(j,"ScheduleTR1.TaxReliefOutsideIndiaNotDTAA",n0(C.notDtaa));
    /* TaxPaidOutsideIndFlg is REQUIRED on ITR-7 — always written (default NO) */
    put(j,"ScheduleTR1.TaxPaidOutsideIndFlg", st0(S.fa.trFlag)||"NO");
    if(S.fa.trFlag==="YES"){
      if(N(S.fa.trAmt))put(j,"ScheduleTR1.AmtTaxRefunded",n0(S.fa.trAmt));
      if(sv(S.fa.trAY))put(j,"ScheduleTR1.AssmtYrTaxRelief",st0(S.fa.trAY));
    }
  }

  /* ---- ScheduleFA ---- (resident body only) ---- */
  const hasCode=r=>st0(r.code)!=="";
  const cc=(el,r)=>{pf(el,"CountryCodeExcludingIndia",r.code);pf(el,"CountryName",FA_CONM[r.code]||"");}; /* one FA name list */
  const S1=(el,r,fields)=>fields.forEach(f=>pf(el,f,sv(r[f])));           /* strings/enums — drop if empty */
  const NR=(el,r,fields)=>fields.forEach(f=>pf(el,f,n0(r[f])));           /* required numerics — present even at 0 */
  const NO=(el,r,fields)=>fields.forEach(f=>{if(N(r[f]))pf(el,f,n0(r[f]));}); /* optional numerics — only if non-zero */
  const D1=(el,r,map)=>Object.keys(map).forEach(k=>{const iso=ISO(r[map[k]]);if(iso)pf(el,k,iso);}); /* dates -> ISO */

  const a1=(S.fa.a1||[]).filter(hasCode).map(r=>{const el={};cc(el,r);
    S1(el,r,["Bankname","AddressOfBank","ZipCode","ForeignAccountNumber","OwnerStatus"]);
    D1(el,r,{AccOpenDate:"AccOpenDate"});
    NR(el,r,["PeakBalanceDuringYear","ClosingBalance","IntrstAccured"]);return el;});
  if(a1.length)put(j,"ScheduleFA.DetailsForiegnBank",a1);

  const a2=(S.fa.a2||[]).filter(hasCode).map(r=>{const el={};cc(el,r);
    S1(el,r,["FinancialInstName","FinancialInstAddress","ZipCode","AccountNumber","Status","NatureOfAmount"]);
    D1(el,r,{AccOpenDate:"AccOpenDate"});
    NR(el,r,["PeakBalanceDuringPeriod","ClosingBalance","GrossAmtPaidCredited"]);return el;});
  if(a2.length)put(j,"ScheduleFA.DtlsForeignCustodialAcc",a2);

  const a3=(S.fa.a3||[]).filter(hasCode).map(r=>{const el={};cc(el,r);
    S1(el,r,["NameOfEntity","AddressOfEntity","ZipCode","NatureOfEntity"]);
    D1(el,r,{InterestAcquiringDate:"InterestAcquiringDate"});
    NR(el,r,["InitialValOfInvstmnt","PeakBalanceDuringPeriod","ClosingBalance","TotGrossAmtPaidCredited","TotGrossProceeds"]);
    return el;});
  if(a3.length)put(j,"ScheduleFA.DtlsForeignEquityDebtInterest",a3);

  const a4=(S.fa.a4||[]).filter(hasCode).map(r=>{const el={};cc(el,r);
    S1(el,r,["FinancialInstName","FinancialInstAddress","ZipCode"]);
    D1(el,r,{ContractDate:"ContractDate"});
    NR(el,r,["CashValOrSurrenderVal","TotGrossAmtPaidCredited"]);
    return el;});
  if(a4.length)put(j,"ScheduleFA.DtlsForeignCashValueInsurance",a4);

  const b=(S.fa.b||[]).filter(hasCode).map(r=>{const el={};cc(el,r);
    S1(el,r,["ZipCode","NatureOfEntity","NameOfEntity","AddressOfEntity","NatureOfInt","NatureOfInc","IncTaxSch","IncTaxSchNo"]);
    D1(el,r,{DateHeld:"DateHeld"});
    NR(el,r,["TotalInvestment","IncFromInt","IncTaxAmt"]);return el;});
  if(b.length)put(j,"ScheduleFA.DetailsFinancialInterest",b);

  const c=(S.fa.c||[]).filter(hasCode).map(r=>{const el={};cc(el,r);
    S1(el,r,["ZipCode","AddressOfProperty","Ownership","NatureOfInc","IncTaxSch","IncTaxSchNo"]);
    D1(el,r,{DateOfAcq:"DateOfAcq"});
    NR(el,r,["TotalInvestment","IncDrvProperty","IncTaxAmt"]);return el;});
  if(c.length)put(j,"ScheduleFA.DetailsImmovableProperty",c);

  const d=(S.fa.d||[]).filter(hasCode).map(r=>{const el={};cc(el,r);

/* ================================================================

function impFa(I7){
  const got=[];
  const toDMY=s=>dmy(s)||st0(s);

  /* ScheduleFSI + the section stored on TR */
  if(I7.ScheduleFSI&&Array.isArray(I7.ScheduleFSI.ScheduleFSIDtls)){
    const trSec={};((I7.ScheduleTR1||{}).ScheduleTR||[]).forEach(r=>{trSec[r.CountryCodeExcludingIndia]=r.ReliefClaimedUsSection;});
    const hd=o=>{o=o||{};return {b:nz(o.IncFrmOutsideInd),c:nz(o.TaxPaidOutsideInd),d:nz(o.TaxPayableinInd),art:o.DTAAReliefUs90or90A||""};};
    S.fa.fsi=I7.ScheduleFSI.ScheduleFSIDtls.map(el=>({
      code:el.CountryCodeExcludingIndia||"", name:el.CountryName||"", tin:el.TaxIdentificationNo||"",

      hp:hd(el.IncFromHP), bus:hd(el.IncFromBusiness),
      cg:hd(el.IncCapGain), os:hd(el.IncOthSrc)}));
    got.push("Schedule FSI");
  }
  /* ScheduleTR1 refund block */
  if(I7.ScheduleTR1){const T=I7.ScheduleTR1;
    S.fa.trFlag=T.TaxPaidOutsideIndFlg||""; S.fa.trAmt=nz(T.AmtTaxRefunded); S.fa.trAY=T.AssmtYrTaxRelief||"";
    got.push("Schedule TR");
  }
  /* ScheduleFA — nine tables */
  if(I7.ScheduleFA){const F=I7.ScheduleFA;
    const cc=r=>({code:r.CountryCodeExcludingIndia||""});

    S.fa.a1=map(F.DetailsForiegnBank,r=>Object.assign(cc(r),{Bankname:r.Bankname,AddressOfBank:r.AddressOfBank,ZipCode:r.ZipCode,ForeignAccountNumber:r.ForeignAccountNumber,OwnerStatus:r.OwnerStatus,AccOpenDate:toDMY(r.AccOpenDate),PeakBalanceDuringYear:nz(r.PeakBalanceDuringYear),ClosingBalance:nz(r.ClosingBalance),IntrstAccured:nz(r.IntrstAccured)}));

    S.fa.a3=map(F.DtlsForeignEquityDebtInterest,r=>Object.assign(cc(r),{NameOfEntity:r.NameOfEntity,AddressOfEntity:r.AddressOfEntity,ZipCode:r.ZipCode,NatureOfEntity:r.NatureOfEntity,InterestAcquiringDate:toDMY(r.InterestAcquiringDate),InitialValOfInvstmnt:nz(r.InitialValOfInvstmnt),PeakBalanceDuringPeriod:nz(r.PeakBalanceDuringPeriod),ClosingBalance:nz(r.ClosingBalance),TotGrossAmtPaidCredited:nz(r.TotGrossAmtPaidCredited),TotGrossProceeds:nz(r.TotGrossProceeds)}));
    S.fa.a4=map(F.DtlsForeignCashValueInsurance,r=>Object.assign(cc(r),{FinancialInstName:r.FinancialInstName,FinancialInstAddress:r.FinancialInstAddress,ZipCode:r.ZipCode,ContractDate:toDMY(r.ContractDate),CashValOrSurrenderVal:nz(r.CashValOrSurrenderVal),TotGrossAmtPaidCredited:nz(r.TotGrossAmtPaidCredited)}));
    S.fa.b=map(F.DetailsFinancialInterest,r=>Object.assign(cc(r),{ZipCode:r.ZipCode,NatureOfEntity:r.NatureOfEntity,NameOfEntity:r.NameOfEntity,AddressOfEntity:r.AddressOfEntity,NatureOfInt:r.NatureOfInt,DateHeld:toDMY(r.DateHeld),TotalInvestment:nz(r.TotalInvestment),IncFromInt:nz(r.IncFromInt),NatureOfInc:r.NatureOfInc,IncTaxAmt:nz(r.IncTaxAmt),IncTaxSch:r.IncTaxSch,IncTaxSchNo:r.IncTaxSchNo}));
    S.fa.c=map(F.DetailsImmovableProperty,r=>Object.assign(cc(r),{ZipCode:r.ZipCode,AddressOfProperty:r.AddressOfProperty,Ownership:r.Ownership,DateOfAcq:toDMY(r.DateOfAcq),TotalInvestment:nz(r.TotalInvestment),IncDrvProperty:nz(r.IncDrvProperty),NatureOfInc:r.NatureOfInc,IncTaxAmt:nz(r.IncTaxAmt),IncTaxSch:r.IncTaxSch,IncTaxSchNo:r.IncTaxSchNo}));
    S.fa.d=map(F.DetailsOthAssets,r=>Object.assign(cc(r),{ZipCode:r.ZipCode,NatureOfAsset:r.NatureOfAsset,Ownership:r.Ownership,DateOfAcq:toDMY(r.DateOfAcq),TotalInvestment:nz(r.TotalInvestment),IncDrvAsset:nz(r.IncDrvAsset),NatureOfInc:r.NatureOfInc,IncTaxAmt:nz(r.IncTaxAmt),IncTaxSch:r.IncTaxSch,IncTaxSchNo:r.IncTaxSchNo}));
    S.fa.e=map(F.DetailsOfAccntsHvngSigningAuth,r=>Object.assign(cc(r),{NameOfInstitution:r.NameOfInstitution,AddressOfInstitution:r.AddressOfInstitution,ZipCode:r.ZipCode,NameMentionedInAccnt:r.NameMentionedInAccnt,InstitutionAccountNumber:r.InstitutionAccountNumber,PeakBalanceOrInvestment:nz(r.PeakBalanceOrInvestment),IncAccuredTaxFlag:r.IncAccuredTaxFlag,IncAccuredInAcc:nz(r.IncAccuredInAcc),IncOfferedAmt:nz(r.IncOfferedAmt),IncOfferedSch:r.IncOfferedSch,IncOfferedSchNo:r.IncOfferedSchNo}));
    S.fa.f=map(F.DetailsOfTrustOutIndiaTrustee,r=>Object.assign(cc(r),{ZipCode:r.ZipCode,NameOfTrust:r.NameOfTrust,AddressOfTrust:r.AddressOfTrust,NameOfOtherTrustees:r.NameOfOtherTrustees,AddressOfOtherTrustees:r.AddressOfOtherTrustees,NameOfSettlor:r.NameOfSettlor,AddressOfSettlor:r.AddressOfSettlor,NameOfBeneficiaries:r.NameOfBeneficiaries,AddressOfBeneficiaries:r.AddressOfBeneficiaries,DateHeld:toDMY(r.DateHeld),IncDrvTaxFlag:r.IncDrvTaxFlag,IncDrvFromTrust:nz(r.IncDrvFromTrust),IncOfferedAmt:nz(r.IncOfferedAmt),IncOfferedSch:r.IncOfferedSch,IncOfferedSchNo:r.IncOfferedSchNo}));
    S.fa.g=map(F.DetailsOfOthSourcesIncOutsideIndia,r=>Object.assign(cc(r),{ZipCode:r.ZipCode,NameOfPerson:r.NameOfPerson,AddressOfPerson:r.AddressOfPerson,IncDerived:nz(r.IncDerived),NatureOfInc:r.NatureOfInc,IncDrvTaxFlag:r.IncDrvTaxFlag,IncOfferedAmt:nz(r.IncOfferedAmt),IncOfferedSch:r.IncOfferedSch,IncOfferedSchNo:r.IncOfferedSchNo}));
    got.push("Schedule FA");
  }
  return got;
}

/* ================================================================
   CHECKS — chkFa()   (this section's own screen validations)
   ================================================================ */
function chkFa(){
  const out=[];
  const C=S.C.fa||{fsi:[],trRows:[],reliefTot:0};
  const anyFsi=(S.fa.fsi||[]).length>0;
  const fc=faCount();

  /* Not applicable to an NRI (FSI/TR/FA) */
  if(!faOn()){
    if(anyFsi||fc>0)
      out.push({lvl:"err",t:"Foreign schedules not applicable",
        m:"Residential status is NRI. Schedules FSI, TR and FA are available only for a resident — remove the foreign entries or correct the residential status.",sec:"fa"});
    return out.length?out:[{lvl:"ok",t:"Foreign income & assets",m:"Not applicable to a non-resident.",sec:"fa"}];
  }

  /* FSI: country-code note; TIN per country block; relief section */
  (S.fa.fsi||[]).forEach((b,i)=>{
    const t=(C.fsi||[])[i]||{tot:{b:0,c:0,d:0}};
    const anyVal=(t.tot.b||t.tot.c||t.tot.d);
    if(!b.code&&anyVal)
      out.push({lvl:"warn",t:"FSI country "+(i+1)+" has no Country Code",
        m:"Figures are entered but no Country/Region Code is chosen — the utility ignores a row with a blank Country Code. Pick a country or clear the row.",sec:"fa"});
    if(b.code&&!st0(b.tin)&&anyVal)
      out.push({lvl:"warn",t:"FSI country "+(i+1)+" missing TIN",
        m:"Taxpayer Identification Number is required for each FSI country block.",sec:"fa"});
    if(b.code&&anyVal&&!st0(b.sec))
      out.push({lvl:"warn",t:"FSI country "+(i+1)+" missing relief section",
        m:"Choose the section under which relief is claimed (90 / 90A / 91) — it decides whether the relief goes to the DTAA or the non-DTAA total in Schedule TR.",sec:"fa"});
  });

  /* (e)=MIN(c,d): flag a head where tax was paid abroad but (d) is nil, so relief is 0 */
  (C.fsi||[]).forEach((cr,i)=>{
    ["hp","bus","cg","os"].forEach(k=>{const h=(cr.heads||{})[k]||{};
      if(n0(h.c)>0&&n0(h.d)===0)
        out.push({lvl:"warn",t:"No relief for country "+(i+1),
          m:"Tax was paid outside India on a head but tax payable in India (d) is nil, so relief (e)=min(c,d)=0. Enter (d) at the average Indian rate on that income.",sec:"fa"});
    });
  });

  /* TR refund clawback follow-up */
  if(S.fa.trFlag==="YES"){
    if(!N(S.fa.trAmt))out.push({lvl:"warn",t:"Refund amount missing",m:"You answered that foreign tax relief was refunded — enter the amount of tax refunded.",sec:"fa"});
    if(!st0(S.fa.trAY))out.push({lvl:"warn",t:"Refund AY missing",m:"Enter the assessment year in which the relief was allowed in India.",sec:"fa"});
  }

  /* FA where-offered pointer completeness (B/C/D require schedule + item no.) */
  [["b","B"],["c","C"],["d","D"]].forEach(pair=>{
    (S.fa[pair[0]]||[]).forEach((r,i)=>{
      if(st0(r.code)===""&&(N(r.TotalInvestment)||N(r.IncTaxAmt)))
        out.push({lvl:"warn",t:"FA "+pair[1]+" row "+(i+1)+" has no Country Code",
          m:"A row with values but no Country/Region Code is ignored by the utility — pick a country or clear the row.",sec:"fa"});
      else if(st0(r.code)!==""&&(!st0(r.IncTaxSch)||!st0(r.IncTaxSchNo)))
        out.push({lvl:"warn",t:"FA "+pair[1]+" row "+(i+1)+" incomplete",
          m:"Table "+pair[1]+" requires the schedule where the income is offered and its item number.",sec:"fa"});
    });
  });

  if(!out.length){
    out.push({lvl:"ok",t:"Foreign income & assets",
      m:(anyFsi||fc)?("FSI/TR relief "+RS(C.reliefTot||0)+"; FA rows "+fc+"."):"No foreign income, relief or assets.",sec:"fa"});
  }
  return out;
}

/* =====================================================================
   70_sec_funds.js — Balance sheet, funds & corpus (ITR-7, Phase 4)
   Section id "funds", screen order 130 / compute order 20.
   Built ONLY from books/ITR-7/: BALANCE_SHEET.md (block PARTA_BS),
   Schedule_J.md (block ITRScheduleJ), Schedule_R.md (block ITRScheduleR),
   plus the schema for exact keys/enum codes. Modelled on the ITR-6
   accounts/balance-sheet builder (forms/ITR-6/src/70_sec_accounts.js).

   Three schema blocks (verbatim keys):
     PARTA_BS      — trust fund-accounting balance sheet: Sources of Funds
                     (own corpus + loans + advances) = Application of Funds
                     (fixed assets + investments + net current assets +
                     accumulated balance). Always filed (in SKEL, required).
     ITRScheduleJ  — statement of funds & investments on the last day: A1
                     corpus movement, A2 loan/borrowing movement, B corpus
                     11(5) investments (14-mode list), C 13(3)-concern
                     investments, D other investments, E in-kind voluntary
                     contributions. Optional block; when emitted, A1 & A2
                     are always present (block-required).
     ITRScheduleR  — reconciliation of the Schedule J closing corpus (line
                     A) to the Balance-Sheet corpus (line C = A + reasons)
                     across the three corpus columns. Optional block.

   COMPUTE CHAIN (trust fund-accounting identity):
     BS  : TotalFund/TotalLoanFund → TotSourceFund  (row 24, A)
           NetBlock/NetCurrAssets  → TotalApplicationOfFunds (row 57, B)
           the department requires  A == B.
     J-A1: ClosingBlc = (Opening + Received + col5 deposited-back) − Applied
           Investment_11_5_Other = Closing − Investment_11_5 − AmtTaxed
     J-A2: ClosingBlc = Opening + LoanBorrow − TotRepOfLoan
     R   : line A (per Sch J) = J-A1 closing corpus grouped by corpus type
           line B = B(i) Purchase FA + B(ii) Depreciation + B(iii) other
           line C (per BS) = A + B  (the required output; clamped ≥ 0)
   Publishes S.C.funds.* for downstream seams (corpus totals, 11(5) split,
   the source/application half-totals and the balancing flag).
   ===================================================================== */

/* ---- dropdown code lists (codes verbatim from the schema patterns;

  ["COOT","ii · Corpus other than (i), received on/after 01.04.2021"],
  ["OTHER","iii · Other than (i) and (ii)"]];                             /* B InvestementOutOff */
const J_MODE=[["IGSS","Investment in Government Saving Scheme"],

  ["DSBC","Deposit in Scheduled Bank / co-op society — s.11(5)(iii)"],
  ["IUTI","Investment in UTI"],

/* ---- state: S.funds mirrors each schema block's nested shape; the engine
   writes computed totals back onto the same paths, so S.funds is the single
   source of truth for the renderer cells and the exporter. ---- */
S.funds = S.funds || {
  bs:{ SourcesOfFund:{ OwnFund:{ OtherReserve:[] }, LongTermBorrowings:{} },
       ApplicationOfFunds:{ FixedAsset:{},
         CurrentAssetsLoanAdv:{ CurrentAssets:{ CashNCashEquivalents:{} },
           CurrLiabilitiesProviosions:{ CurrLiability:{} } } } },
  j:{ a1:[], a2:[], us11:[], us13:[], other:[], vc:[] },
  r:{ ReasonsOfDiff:{ PurchFixedAsset:{}, Depreciation:{}, AnyOthReason:{} } }
};

/* ================================================================
   ENGINE — every total tagged with its book item/row reference.
   ================================================================ */
function engFunds(){
  const G=p=>N(get("funds."+p)),
        St=(p,v)=>set("funds."+p,R(v)),
        A=p=>{const a=get("funds."+p);return Array.isArray(a)?a:[];},
        SUM=(arr,k)=>arr.reduce((a,r)=>a+N(r[k]),0);

  /* ---------- Part A-BS — Sources of Funds ---------- */
  const of="bs.SourcesOfFund.OwnFund.";
  const orTot=SUM(A(of+"OtherReserve"),"Amount");                                    /* 1fiii */
  St(of+"TotalOtherReserve", orTot);
  const totFund=G(of+"Corpus80G")+G(of+"OtherCorpus")+G(of+"AccumulatedInc")
    +G(of+"AccumulatedIncUS10_11")+G(of+"BalDeemedInc")+orTot;                        /* 1g */
  St(of+"TotalFund", totFund);
  const lb="bs.SourcesOfFund.LongTermBorrowings.";
  const totLoan=G(lb+"SecuredLoan")+G(lb+"UnSecuredLoan");                            /* 2c */
  St(lb+"TotalLoanFund", totLoan);
  const totSrc=totFund+totLoan+G("bs.SourcesOfFund.Advances");                        /* A (row 24) */
  St("bs.SourcesOfFund.TotSourceFund", totSrc);

  /* ---------- Part A-BS — Application of Funds ---------- */
  const fa="bs.ApplicationOfFunds.FixedAsset.";
  const netBlk=G(fa+"GrossBlock")-G(fa+"Depreciation");                               /* 1c */
  St(fa+"NetBlock", netBlk);
  const cla="bs.ApplicationOfFunds.CurrentAssetsLoanAdv.", ca=cla+"CurrentAssets.", cce=ca+"CashNCashEquivalents.";
  const totCash=G(cce+"BalWithBanks")+G(cce+"CashInHand")+G(cce+"Others");            /* 3a iiiD */
  St(cce+"TotCashNCashEquivalents", totCash);
  const totCurAst=G(ca+"Inventory")+G(ca+"SundryDebtor")+totCash+G(ca+"OtherCurrAssets"); /* 3a v */
  St(ca+"TotCurrAssets", totCurAst);
  const tot3c=totCurAst+G(cla+"LoansandAdvances");                                    /* 3c */
  St(cla+"Total", tot3c);
  const cl=cla+"CurrLiabilitiesProviosions.CurrLiability.";
  const totCurLiab=G(cl+"SundryCreditor")+G(cl+"OtherPayable");                       /* 3d iC */
  St(cl+"TotalCurrLiabilitiesProviosions", totCurLiab);
  const clp=cla+"CurrLiabilitiesProviosions.";
  const totCLP=totCurLiab+G(clp+"Provisions");                                        /* 3d iii */
  St(clp+"TotCurrLiabilitiesandprovisions", totCLP);
  const netCur=tot3c-totCLP;                                                          /* 3e */
  St(cla+"NetCurrAssets", netCur);
  const app="bs.ApplicationOfFunds.";
  const totApp=netBlk+G(app+"Investements")+netCur+G(app+"AccBalAnyOthRes");          /* B (row 57) */
  St(app+"TotalApplicationOfFunds", totApp);

  /* ---------- Schedule J · A1 — corpus movement ---------- */
  A("j.a1").forEach((r,i)=>{
    const close=N(r.OpeningBlc)+N(r.ReceivedCorpus)+N(r.TotAmtDepositedBack)-N(r.AppliedPY); /* col 7 = (1+2+5)−3 */
    St("j.a1."+i+".ClosingBlc", close);
    St("j.a1."+i+".Investment_11_5_Other", close-N(r.Investment_11_5)-N(r.AmtTxdAssYr22_23)); /* col 10 = 7−8−9 */
  });
  const a1=A("j.a1");
  set("funds.j.a1Tot",{
    TotOpeningBlc:R(SUM(a1,"OpeningBlc")), TotReceivedCorpus:R(SUM(a1,"ReceivedCorpus")),
    TotAppliedPY:R(SUM(a1,"AppliedPY")), TotAmtDepositedBack:R(SUM(a1,"AmtDepositedBack")),
    TotTotAmtDepositedBack:R(SUM(a1,"TotAmtDepositedBack")), TotClosingBlc:R(SUM(a1,"ClosingBlc")),
    TotInvestment_11_5:R(SUM(a1,"Investment_11_5")), TotAmtTxdAssYr22_23:R(SUM(a1,"AmtTxdAssYr22_23")),
    TotInvestment_11_5_Other:R(SUM(a1,"Investment_11_5_Other")) });

  /* ---------- Schedule J · A2 — loan & borrowing movement ---------- */
  A("j.a2").forEach((r,i)=>{
    St("j.a2."+i+".ClosingBlc", N(r.OpeningBlc)+N(r.LoanBorrow)-N(r.TotRepOfLoan));   /* col 7 = 1+2−6 */
  });
  const a2=A("j.a2");
  set("funds.j.a2Tot",{
    TotOpeningBlc:R(SUM(a2,"OpeningBlc")), TotLoanBorrow:R(SUM(a2,"LoanBorrow")),
    TotAppliedPY:R(SUM(a2,"AppliedPY")), TotRepayment:R(SUM(a2,"Repayment")),
    TotTotRepOfLoan:R(SUM(a2,"TotRepOfLoan")), TotClosingBlc:R(SUM(a2,"ClosingBlc")) });

  /* ---------- Schedule J · B/C/D/E — investment & contribution totals ---------- */
  set("funds.j.us11Tot",{ TotalInvestmentAmt:R(SUM(A("j.us11"),"AmtOfInvestment")) });
  const us13=A("j.us13");
  set("funds.j.us13Tot",{ TotalNoOfShares:R(SUM(us13,"NoOfSharesHeld")),
    TotalValueOfInvestment:R(SUM(us13,"NominalaValueOfInvestment")),
    TotalIncFromInvestment:R(SUM(us13,"IncFromInvestment")) });
  const oth=A("j.other");
  set("funds.j.otherTot",{ TotalNoOfShares:R(SUM(oth,"NoOfSharesHeld")),
    TotalValueOfInvestment:R(SUM(oth,"NominalaValueOfInvestment")) });
  const vc=A("j.vc");
  set("funds.j.vcTot",{ TotalValueOfContribution:R(SUM(vc,"ValueOfContribution")),
    TotalValOfContrbnAppdTwrdsObj:R(SUM(vc,"ValueOfContributionObj")),
    TotalAmtInvestedUs11:R(SUM(vc,"AmtInvestedUs11")), TotalBalIncUs11:R(SUM(vc,"BalIncUs11")) });

  /* ---------- Schedule R — corpus reconciliation ---------- */
  /* line A: Schedule J A1 closing corpus grouped by corpus type */
  const grp={CorpOutOf80G2b:0, OthCorpReceived:0, CorpOthThan:0};
  a1.forEach(r=>{ const c=st0(r.CorpusDonation), v=N(r.ClosingBlc);
    if(c==="80G2B") grp.CorpOutOf80G2b+=v;
    else if(c==="OTIA") grp.OthCorpReceived+=v;
    else if(c==="OTHER") grp.CorpOthThan+=v; });
  set("funds.r.ClosngBalSchJ",{ CorpOutOf80G2b:R(grp.CorpOutOf80G2b),
    OthCorpReceived:R(grp.OthCorpReceived), CorpOthThan:R(grp.CorpOthThan) });
  const COLS=["CorpOutOf80G2b","OthCorpReceived","CorpOthThan"];
  const rd="r.ReasonsOfDiff.", totR={}, closeBS={};
  COLS.forEach(c=>{
    const b=G(rd+"PurchFixedAsset."+c)+G(rd+"Depreciation."+c)+G(rd+"AnyOthReason."+c); /* B = Bi+Bii+Biii */
    totR[c]=R(b);
    closeBS[c]=Math.max(0, R(grp[c])+R(b));                                            /* C = A + B (schema ≥ 0) */
  });
  set("funds."+rd+"TotalReasonsOfDiff", totR);
  set("funds.r.ClosngBalBalSheet", closeBS);

  /* ---------- cross-section scalars (seams) ---------- */
  S.C.funds={

/* ================================================================
   EXPORT — writes PARTA_BS (onto the SKEL zero skeleton), and the
   optional ITRScheduleJ / ITRScheduleR blocks when they carry data.
   ================================================================ */
function _fEnum(v,allowed,def){ const t=st0(v); return allowed.indexOf(t)>=0?t:def; }
function _fClean(v){
  if(Array.isArray(v)){ const o=v.map(_fClean).filter(x=>x!==undefined); return o.length?o:undefined; }
  if(v&&typeof v==="object"){ const o={}; for(const k of Object.keys(v)){ const c=_fClean(v[k]); if(c!==undefined)o[k]=c; } return Object.keys(o).length?o:undefined; }
  if(typeof v==="number") return R(v);
  const t=st0(v); return t===""?undefined:t;
}
/* overlay src onto the SKEL subtree dst without ever creating an empty object */
function _fOverlay(dst,src){
  if(!dst||src==null||typeof src!=="object") return;
  for(const k of Object.keys(src)){
    const v=src[k];
    if(Array.isArray(v)){ const r=_fClean(v); if(r) dst[k]=r; }
    else if(v&&typeof v==="object"){ if(_fClean(v)===undefined) continue;
      if(dst[k]==null||typeof dst[k]!=="object"||Array.isArray(dst[k])) dst[k]={};
      _fOverlay(dst[k],v); }
    else if(typeof v==="number") dst[k]=R(v);
    else { const t=st0(v); if(t!=="") dst[k]=t; }
  }
}
/* Schedule J row builders — required integer leaves written even when 0 so a
   filled block covers them; enums validated to their schema codes. */
function _fA1row(r){ if(!r||typeof r!=="object") return undefined;
  const cd=_fEnum(r.CorpusDonation,["80G2B","OTIA","OTHER"],"");
  const money=["OpeningBlc","ReceivedCorpus","AppliedPY","AmtDepositedBack","TotAmtDepositedBack","ClosingBlc","Investment_11_5","AmtTxdAssYr22_23","Investment_11_5_Other"];
  if(cd===""&&!money.some(k=>N(r[k])!==0)) return undefined;
  const o={ CorpusDonation:cd||"OTHER" };
  money.forEach(k=>o[k]=R(N(r[k])));
  const fy=_fEnum(r.FinacialYr,["11","12","13","14","15"],""); if(fy) o.FinacialYr=fy;
  return o; }
function _fA2row(r){ if(!r||typeof r!=="object") return undefined;
  const money=["OpeningBlc","LoanBorrow","AppliedPY","Repayment","TotRepOfLoan","ClosingBlc"];
  if(!money.some(k=>N(r[k])!==0)) return undefined;
  const o={}; money.forEach(k=>o[k]=R(N(r[k])));
  const fy=_fEnum(r.FinacialYr,["11","12","13","14","15"],""); if(fy) o.FinacialYr=fy;
  return o; }
function _fUs11row(r){ if(!r||typeof r!=="object") return undefined;
  const mode=_fEnum(r.ModeOfInvestment,["IGSS","POSB","DSBC","IUTI","CGSG","DEBT","PUSC","FICO","PUCO","LTFU","IMMP","IDBI","POWERGRID","OTHER"],"");
  const amt=R(N(r.AmtOfInvestment));
  if(mode===""&&amt===0) return undefined;
  const o={ ModeOfInvestment:mode||"OTHER", AmtOfInvestment:amt };
  const io=_fEnum(r.InvestementOutOff,["CO80G","COOT","OTHER"],""); if(io) o.InvestementOutOff=io;
  return o; }
function _fUs13row(r){ if(!r||typeof r!=="object") return undefined;
  const nm=st0(r.NameAndAddress), cls=st0(r.ClassOfSharesHeld);
  const money=["NoOfSharesHeld","NominalaValueOfInvestment","IncFromInvestment"];
  if(nm===""&&cls===""&&!money.some(k=>N(r[k])!==0)) return undefined;

  o.NoOfSharesHeld=R(N(r.NoOfSharesHeld)); if(cls) o.ClassOfSharesHeld=cls;
  o.NominalaValueOfInvestment=R(N(r.NominalaValueOfInvestment)); o.IncFromInvestment=R(N(r.IncFromInvestment));
  const pc=_fEnum(r.PercentOfCapitalConcern,["Y","N"],""); if(pc) o.PercentOfCapitalConcern=pc;
  return o; }
function _fOtherRow(r){ if(!r||typeof r!=="object") return undefined;
  const nm=st0(r.NameAndAddress), cls=st0(r.ClassOfSharesHeld);
  const money=["NoOfSharesHeld","NominalaValueOfInvestment"];
  if(nm===""&&cls===""&&!money.some(k=>N(r[k])!==0)) return undefined;
  const o={}; if(nm) o.NameAndAddress=nm;
  const co=_fEnum(r.ConcernIsCompany,["Y","N"],""); if(co) o.ConcernIsCompany=co;
  if(cls) o.ClassOfSharesHeld=cls;
  o.NoOfSharesHeld=R(N(r.NoOfSharesHeld)); o.NominalaValueOfInvestment=R(N(r.NominalaValueOfInvestment));
  return o; }
function _fVcRow(r){ if(!r||typeof r!=="object") return undefined;

  const o={ NameAndAddress:nm||"na" };
  money.forEach(k=>o[k]=R(N(r[k])));
  return o; }
function _fRows(a,fn){ if(!Array.isArray(a)) return []; return a.map(fn).filter(v=>v!==undefined); }
const _fT=o=>{const x={};for(const k of Object.keys(o||{}))x[k]=R(N(o[k]));return x;};

function expFunds(j){

    if(clean.length) bs.SourcesOfFund.OwnFund.OtherReserve=clean;

  }catch(e){}
  _fOverlay(j.PARTA_BS, bs);

  /* ---- ITRScheduleJ (optional; A1 & A2 always present when emitted) ---- */
  const a1=_fRows(Fu.j&&Fu.j.a1,_fA1row), a2=_fRows(Fu.j&&Fu.j.a2,_fA2row),
        us11=_fRows(Fu.j&&Fu.j.us11,_fUs11row), us13=_fRows(Fu.j&&Fu.j.us13,_fUs13row),
        oth=_fRows(Fu.j&&Fu.j.other,_fOtherRow), vc=_fRows(Fu.j&&Fu.j.vc,_fVcRow);
  if(a1.length||a2.length||us11.length||us13.length||oth.length||vc.length){
    const blk={};
    const A1=_fT(Fu.j&&Fu.j.a1Tot); if(a1.length) A1.ScheduleJ_A1Dtls=a1; blk.ScheduleJ_A1=A1;
    const A2=_fT(Fu.j&&Fu.j.a2Tot); if(a2.length) A2.ScheduleJ_A2Dtls=a2; blk.ScheduleJ_A2=A2;
    if(us11.length) blk.ScheduleJUs11_5={ ScheduleJUs11_5Dtls:us11, TotalInvestmentAmt:R(N((Fu.j.us11Tot||{}).TotalInvestmentAmt)) };
    if(us13.length){ const t=_fT(Fu.j.us13Tot); t.ScheduleJUs13_3Dtls=us13; blk.ScheduleJUs13_3=t; }
    if(oth.length){ const t=_fT(Fu.j.otherTot); t.ScheduleJOtherInvstmtsDtls=oth; blk.ScheduleJOtherInvstmts=t; }
    if(vc.length){ const t=_fT(Fu.j.vcTot); t.ScheduleJVoluntaryContributionDtls=vc; blk.ScheduleJVoluntaryContribution=t; }
    j.ITRScheduleJ=blk;
  }

  /* ---- ITRScheduleR (optional; only line C is schema-required) ---- */
  const r=Fu.r||{};
  const rBlk={};
  const schJ=_fClean(r.ClosngBalSchJ); if(schJ) rBlk.ClosngBalSchJ=schJ;
  const rod={};
  ["TotalReasonsOfDiff","PurchFixedAsset","Depreciation","AnyOthReason"].forEach(n=>{
    const c=RG(r,"ReasonsOfDiff."+n,null); if(c&&typeof c==="object"){ const cl=_fClean(c); if(cl) rod[n]=cl; }});
  if(Object.keys(rod).length) rBlk.ReasonsOfDiff=rod;
  const cbs=r.ClosngBalBalSheet;
  if(cbs&&typeof cbs==="object"&&["CorpOutOf80G2b","OthCorpReceived","CorpOthThan"].some(c=>N(cbs[c])!==0)){
    rBlk.ClosngBalBalSheet={ CorpOutOf80G2b:R(N(cbs.CorpOutOf80G2b)), OthCorpReceived:R(N(cbs.OthCorpReceived)), CorpOthThan:R(N(cbs.CorpOthThan)) };
  }
  /* emit R only if it carries a reconciliation output or a reason of difference */
  if(rBlk.ClosngBalBalSheet||rBlk.ReasonsOfDiff||rBlk.ClosngBalSchJ) j.ITRScheduleR=rBlk;
}

/* ================================================================
   IMPORT — inverse: pull the three blocks back into S.funds (the
   state subtree equals the schema shape, so a copy round-trips;
   totals are re-derived by the engine on the next compute()).
   ================================================================ */
function impFunds(I){
  const read=[]; if(!I||typeof I!=="object") return read;
  const Fu=S.funds=S.funds||{};
  const bs=I.PARTA_BS;
  if(bs&&typeof bs==="object"){ Fu.bs=deep(bs);
    if(!RG(Fu,"bs.SourcesOfFund.OwnFund.OtherReserve",null)) set("funds.bs.SourcesOfFund.OwnFund.OtherReserve",[]);
    read.push("Part A — Balance Sheet"); }
  const J=I.ITRScheduleJ;
  if(J&&typeof J==="object"){ Fu.j=Fu.j||{};
    Fu.j.a1=RG(J,"ScheduleJ_A1.ScheduleJ_A1Dtls",[])||[];
    Fu.j.a2=RG(J,"ScheduleJ_A2.ScheduleJ_A2Dtls",[])||[];
    Fu.j.us11=RG(J,"ScheduleJUs11_5.ScheduleJUs11_5Dtls",[])||[];
    Fu.j.us13=RG(J,"ScheduleJUs13_3.ScheduleJUs13_3Dtls",[])||[];
    Fu.j.other=RG(J,"ScheduleJOtherInvstmts.ScheduleJOtherInvstmtsDtls",[])||[];
    Fu.j.vc=RG(J,"ScheduleJVoluntaryContribution.ScheduleJVoluntaryContributionDtls",[])||[];
    read.push("Schedule J — funds & investments"); }
  const Rr=I.ITRScheduleR;
  if(Rr&&typeof Rr==="object"){ Fu.r=Fu.r||{ReasonsOfDiff:{}};
    Fu.r.ReasonsOfDiff={
      PurchFixedAsset:RG(Rr,"ReasonsOfDiff.PurchFixedAsset",{})||{},
      Depreciation:RG(Rr,"ReasonsOfDiff.Depreciation",{})||{},
      AnyOthReason:RG(Rr,"ReasonsOfDiff.AnyOthReason",{})||{} };
    read.push("Schedule R — corpus reconciliation"); }
  return read;
}

/* ================================================================
   CHECKS — this section's own screen validations (not the CBDT engine).
   ================================================================ */
function chkFunds(){
  const out=[]; const C=S.C.funds||{}; const add=(lvl,t,m)=>out.push({lvl,t,m,sec:"funds"});
  if(C.srcTot||C.appTot){
    if(!C.balances) add("err","Balance sheet does not balance","Sources of funds (₹"+F(C.srcTot)+") must equal Total application of funds (₹"+F(C.appTot)+").");
    else add("ok","Balance sheet balances","Both halves foot to ₹"+F(C.srcTot)+".");
  }
  if(C.corpusCloseBS&&C.corpus){
    const mis=["c80g","oth","other"].some(k=>R(C.corpusCloseBS[k])!==R(C.corpus[k]));
    if(mis&&(C.corpusCloseBS.total||C.corpus.c80g||C.corpus.oth||C.corpus.other))
      add("warn","Schedule R does not tie to the Balance-Sheet corpus","Closing corpus per Balance sheet (Schedule R line C) should equal the three corpus lines of Part A-BS (1a/1b/1c).");
  }
  return out;
}

/* =====================================================================
   ITR-7 · Section "hp" — Income from house property (Schedule HP)
   Built from books/ITR-7/Schedule_HP.md only (rows 3–48, one property
   block, rules A179–A193/A360/A373/A383/A459/A485/A554/A592) and confirmed
   against the CBDT ITR-7 schema block ScheduleHP (schema §ScheduleHP /
   PropertyDetails / Rentdetails / CoOwners / TenantDetails).
   Structured on forms/ITR-6/src/70_sec_hp.js (the shell idiom: engine /
   screen / export / import / checks) — but every field, formula, enum and
   item-letter is taken from the ITR-7 book, never from ITR-6.

   ITR-7 is the return for TRUSTS, INSTITUTIONS and other bodies (sections
   139(4A)–(4F)). House property is computed head-by-head as for any
   assessee, but two things narrow the sheet (book §§ intro, 8):
     • Owner of the property = Self (SE) / Deemed owner (DO) ONLY — no
       minor / spouse / others.
     • Type of house property = Let Out (Y) / Deemed Let Out (D) ONLY —
       there is NO self-occupied, so the annual value is never nil and the
       full a–j working always runs; the gross rent (1a) is always > 0
       (rule A186).

   ITR-7 LETTERING (differs from ITR-6 — book §2, App. A):
     a AnnualLetableValue       gross rent / lettable value  (typed)
     b RentNotRealized          rent that cannot be realised (typed)
     c LocalTaxes               tax paid to local authorities(typed)
     d TotalUnrealizedAndTax    = 1b + 1c                    (A179)
     e BalanceALV               = 1a − 1d  (annual value)    (A180)
     f ThirtyPercentOfBalance   = 30% of 1e  (std ded 24a)    (A181)
     g IntOnBorwCap             interest u/s 24(b)            (A189)
     h TotalDeduct              = 1f + 1g                    (A182)
     i ArrearsUnrealizedRentRcvd arrears/unrealised recd less 30% (typed)
     j IncomeOfHP               = 1e − 1h + 1i               (A183)
   There is NO "annual value of the property owned (share × 1e)" line and
   NO AnnualOfPropOwned leaf — the 30% deduction bites at 30% of 1e
   directly (book §2 note). The assessee's share only guards the interest
   (A189): interest is admitted only when share% > 0 and 1a > 0.

   LOSS → CYLA: item 3 = Σ1j + item 2 (signed; a loss is negative). If a
   loss, it goes to 2i of Schedule CYLA capped at ₹2,00,000 (A360/A373;
   the CYLA HP-loss column xiv is itself capped at ₹2,00,000, A354), the
   balance remaining carried forward. Published as
   S.C.hp.{total, loss, lossFull, cflExcess, partBTI} for the cyla / cfl /
   tax / fsi seams (see report).
   ===================================================================== */
