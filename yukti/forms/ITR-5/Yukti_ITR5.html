/* =====================================================================
   CHECKS — chkGen(): the sheet's own rules as live messages. Consistency
   of switches, not arithmetic (book §10). ============================== */
function chkGen(){
  const out=[], P=S.pi||{}, F=S.fs||{}, A=S.aud||{}, M=S.pm||{}, C=S.C.gen||{};
  const pan=st0(P.pan).toUpperCase();
  /* Name / PAN */
  if(!st0(P.name)) out.push({lvl:"err",t:"Name required",m:"Enter the firm / organisation name (SurNameOrOrgName).",sec:"gen"});
  if(!pan) out.push({lvl:"err",t:"PAN required",m:"Enter the PAN of the assessee.",sec:"gen"});
  else if(!PAN_RE.test(pan)) out.push({lvl:"err",t:"PAN not valid",m:"The PAN must be five letters, four digits and a letter.",sec:"gen"});
  /* Status / sub-status — A14/A29: Firm ⇒ Partnership Firm or LLP */
  if(!st0(P.substatus)) out.push({lvl:"err",t:"Sub-status required",m:"Select the sub-status for the chosen status.",sec:"gen"});
  else if(P.status==="1"&&["1-Partnership Firm","2-LLP (Limited Liability Partnership)"].indexOf(st0(P.substatus))<0)
    out.push({lvl:"err",t:"Sub-status invalid for a firm",m:"A firm must have sub-status Partnership Firm or LLP (rules A14 / A29).",sec:"gen"});
  /* Date of formation — mandatory, on or before 31 March 2026 */
  const dof=D(P.formed);
  if(!dof) out.push({lvl:"err",t:"Date of formation required",m:"Enter the date of formation in DD/MM/YYYY.",sec:"gen"});
  else if(dof>YREND) out.push({lvl:"err",t:"Date of formation",m:"The date of formation must be on or before 31 March 2026.",sec:"gen"});
  /* Primary address required leaves */
  if(!st0(P.addr1)) out.push({lvl:"err",t:"Address required",m:"Flat / Door / Block number is mandatory.",sec:"gen"});
  if(!st0(P.locality)) out.push({lvl:"err",t:"Address required",m:"Area or locality is mandatory.",sec:"gen"});
  if(!st0(P.city)) out.push({lvl:"err",t:"Address required",m:"Town / city / district is mandatory.",sec:"gen"});
  if(!st0(P.state)) out.push({lvl:"err",t:"State required",m:"Select the state.",sec:"gen"});
  if((P.country||"91")==="91"&&st0(P.pin)&&!/^\d{6}$/.test(st0(P.pin)))
    out.push({lvl:"err",t:"PIN code",m:"The PIN code must be six digits.",sec:"gen"});
  /* Email / mobile */
  if(!st0(P.email)) out.push({lvl:"err",t:"Email required",m:"The primary email is mandatory — it receives the copy of ITR-V.",sec:"gen"});
  else if(!MAIL.test(st0(P.email))) out.push({lvl:"err",t:"Email not valid",m:"Enter a valid primary email address.",sec:"gen"});
  if(!st0(P.mobile)) out.push({lvl:"err",t:"Mobile required",m:"The primary mobile number is mandatory.",sec:"gen"});
  else if(!/^\d{10}$/.test(st0(P.mobile))) out.push({lvl:"warn",t:"Mobile number",m:"The primary mobile number should be ten digits.",sec:"gen"});
  /* Secondary address — mandatory when not the same as primary */
  if(P.addr2same==="N"&&(!st0(P.addr1b)||!st0(P.localityb)||!st0(P.cityb)||!st0(P.stateb)))
    out.push({lvl:"err",t:"Secondary address required",m:"The secondary address (Flat/Door, locality, town, state) is mandatory when it is not the same as the primary.",sec:"gen"});
  /* Due date & filing section (A43) */
  if(!st0(F.duedate)) out.push({lvl:"err",t:"Due date required",m:"Select the applicable due date for filing (rule A43).",sec:"gen"});
  /* MSME (A41) */
  if(F.ifMSME==="Y"&&!st0(F.msmeNum)) out.push({lvl:"err",t:"MSME number required",m:"With MSME = Yes, the MSMED Act, 2006 registration number is mandatory (rule A41).",sec:"gen"});
  /* Representative assessee (A5/A6) */
  if(F.rep==="Y"&&(!st0(F.repName)||!st0(F.repEmail)||!st0(F.repMobile)))
    out.push({lvl:"err",t:"Representative details required",m:"With representative assessee = Yes, name, email and contact are mandatory (rules A5 / A6).",sec:"gen"});
  /* Partner in a firm — ≥1 row when Yes (note r124) */
  if(F.partner==="Y"&&!(S.pi.firms||[]).length)
    out.push({lvl:"err",t:"Firm details required",m:"With 'partner in a firm' = Yes, at least one firm row is mandatory.",sec:"gen"});
  /* Unlisted shares — ≥1 row when Yes (A4) */
  if(F.unl==="Y"&&!(S.pi.unlco||[]).length)
    out.push({lvl:"err",t:"Unlisted-share details required",m:"With 'held unlisted equity shares' = Yes, at least one company row is mandatory (rule A4).",sec:"gen"});
  /* Audit condition & cash-percentage (A42/A45/A46) */
  if(A.sec44AB==="Y"&&!st0(A.cnd44AB))
    out.push({lvl:"err",t:"44AB condition required",m:"Select the condition by which the assessee is liable to audit u/s 44AB (rule A42).",sec:"gen"});
  if(A.sec44AB==="Y"&&A.acctFlg==="Y"&&!st0(A.frmPAN))
    out.push({lvl:"err",t:"Auditor PAN required",m:"The PAN of the auditor (proprietorship / firm) is mandatory.",sec:"gen"});
  if(A.incDclrdUs==="N"&&A.salesBand==="Upto10CR"){
    if(!st0(A.pctRcvd)||!st0(A.pctPaid))
      out.push({lvl:"err",t:"Cash-percentage required",m:"With turnover over ₹1 crore up to ₹10 crores, both cash-percentage fields (a2ii / a2iii) must be filled.",sec:"gen"});
    else if((A.pctRcvd==="MoreThan5Per"||A.pctPaid==="MoreThan5Per")&&A.sec44AB!=="Y")
      out.push({lvl:"warn",t:"Likely liable u/s 44AB",m:"Cash receipts or payments exceed 5% — the assessee is liable to audit u/s 44AB (rules A45 / A46).",sec:"gen"});
  }
  /* 92E acknowledgement (A1) */
  if(A.sec92E==="Y"&&A.acct92E==="Y"&&(!D(A.date92E)||!st0(A.ack92E)))
    out.push({lvl:"err",t:"92E audit detail required",m:"With 92E audit = Yes, the date and acknowledgement number of the 92E report are mandatory.",sec:"gen"});
  /* Audit forces Part A-BS / P&L (A1/A2/A13) */
  if((A.sec44AA==="Y"||A.sec44AB==="Y"||A.sec92E==="Y"))
    out.push({lvl:"warn",t:"Balance sheet & P&L required",m:"When liable to audit u/s 44AA / 44AB / 92E, Part A-BS and Part A-P&L cannot be blank (rules A1 / A2 / A13).",sec:"gen"});
  /* Table A when change = Yes (A76) */
  if(M.prevChange==="Y"&&!(S.pm.prev||[]).length)
    out.push({lvl:"err",t:"Change details required",m:"With a change in partners/members = Yes, at least one admitted/retired row is mandatory (rule A76).",sec:"gen"});
  /* Total share = 100 (A21) — firms/AOP with determinate members */
  if((S.pm.members||[]).length&&Math.abs(C.shareTotal-100)>0.01)
    out.push({lvl:"warn",t:"Total share not 100%",m:"The total percentage of share of the existing partners/members should equal 100 (rule A21). Current: "+(C.shareTotal||0)+"%.",sec:"gen"});
  /* B ⇒ C > 0 (A33) and B/C vs foreign-company member share (W3) */
  if(M.bForeign==="YES"&&!(N(M.cPct)>0))
    out.push({lvl:"err",t:"Foreign-company share required",m:"When a member is a foreign company (B = Yes), the percentage of share (C) cannot be zero (rule A33).",sec:"gen"});
  /* Nature of business mandatory (A11) */
  if(!(S.nob||[]).length)
    out.push({lvl:"err",t:"Nature of business required",m:"Disclosure of the nature of business or profession is mandatory (rule A11).",sec:"gen"});
  if(!out.some(x=>x.lvl==="err")){
    const stat=(GEN_STATUS.find(x=>x[0]===(P.status||"1"))||["","Firm"])[1];
    out.push({lvl:"ok",t:"Who is filing and filing status",m:stat+(pan?" · "+pan:"")+" · "+(F.optout==="Yes"?"old":"new")+" regime · due "+dmy(F.duedate||"2026-08-31")+".",sec:"gen"});
  }
  return out;
}

/* =====================================================================
   ITR-5 · Section "hp" — House property (Schedule HP)
   Built from books/ITR-5/HOUSE_PROPERTY.md, books/ITR-5/CYLA_BFLA.md and
   books/ITR-5/enums.json only. Self-contained: state, engine, renderer,
   export, import, checks + one reg(). Cell refs from the book are quoted in
   comments beside each formula.
   (The ITR-3 HP file was read for shell idiom/style only — never its
   numbers, item-numbers, enums or rules; ITR-5 has no self-occupied type.)

   ITR-5 FACTS (differ from ITR-3):
   - PropertyOwner enum is SE/DO (Self / Deemed Owner) — no "Others".
   - ifLetOut enum is Y/D (Let Out / Deemed Let Out) — there is NO
     self-occupied property in ITR-5, so every property computes the full
     a–k with its gross rent; there is no per-property interest cap.
   - The assessee's own share % (J6 / AssessePercentShareProp) is COMPUTED,
     not entered: co-owned "YES" -> 100 − Σ co-owner shares; "NO" -> 100.
   - The single ₹2,00,000 cap in ITR-5 HP is the AGGREGATE HP-loss set-off
     cap into Schedule CYLA (row-3 scratch P3/T3), NOT a per-loan cap.

   GTI / LOSS CONTRIBUTION (books/ITR-5/CYLA_BFLA.md):
   - Schedule CYLA reads HP.TotalIncomeChargeableUnHP directly:
       F8 = MAX(income,0)          (HP positive income into CYLA)
       G7 = ABS(MIN(income,0))     (HP loss available, taken positive)
     the ₹2,00,000 set-off cap (TotHPlossCurYrSetoff ≤ 200000, s.71(3A))
     and the new-regime zeroing (bacValue=1 ⇒ HP loss not adjustable) are
     applied inside the "loss" section. This section computes and publishes
     onto S.C.hp everything that section needs: the signed head total
     (income), the positive income (posInc), the loss available (lossAvail)
     and the book's row-3 scratch figures p3 (loss for the 2-lakh
     adjustment) / t3 (loss remaining beyond 2 lakh) / capLoss.
   ===================================================================== */

/* ---- engine ------------------------------------------------------ */
/* one property block a–k, exactly as the book's cell formulas read.
   ITR-5 has no self-occupied type, so both Let Out (Y) and Deemed Let
   Out (D) run the same rent-based computation. */
function engProp(p){
  p = p || {};
  const coShare = (p.coowners||[]).reduce((s,x)=>s+N(x.share), 0);   /* Σ co-owner shares */
  /* J6 own share%: =IF(co="Y",100-Σco,IF(co="N",100,0)) */
  const share = p.co==="YES" ? Math.max(0, R(100 - coShare))
              : p.co==="NO"  ? 100
              : 0;

  const a = R(p.rent);                             /* 1a AnnualLetableValue [J19] */
  const b = R(p.unreal);                           /* 1b RentNotRealized      [H20] */
  const c = R(p.taxes);                            /* 1c LocalTaxes           [H21] */
  const d = R(b + c);                              /* 1d [H22]=SUM(H20:H21)   = 1b+1c */
  const e = Math.max(0, R(a - d));                 /* 1e [J23]=MAX(0,J19-H22) = max(0,1a-1d) */
  const f = Math.max(0, R((share/100) * e));       /* 1f [J24]=ROUND(J23*J6/100,0) — own share bites */
  const g = Math.max(0, R(0.30 * f));              /* 1g [H25]=MAX(ROUND(0.3*J24,0),0) = 30% of 1f */

  /* h — Total interest u/s 24(b) = Σ loan rows [J34]=SUM(Intrst.24b1); no cap
     on a let-out / deemed let-out property in ITR-5. */
  const loans = (p.loans||[]).filter(l => N(l.interest) || st0(l.name) || N(l.amt));
  const hRaw  = R(loans.reduce((s,l)=>s+N(l.interest), 0));   /* Section24B.TotalInterestUs24B [J34] */
  const h = hRaw;                                  /* 1h [H26]=TotAmt.24b1 */

  const i = R(g + h);                              /* 1i [J35]=SUM(H25:H26) = 1g+1h */
  const jRecd = R(p.arrears);                      /* 1j amount received (arrears/unrealised) */
  const j = R(0.70 * jRecd);                       /* 1j less 30% (70% taken) [J36] */
  const k = R(f - i + j);                          /* 1k [J37]=J24-J35+J36 = 1f-1i+1j */

  return {coShare, share, a, b, c, d, e, f, g, hRaw, h, i, jRecd, j, k, nLoans:loans.length};
}

function engHp(){
  const H = S.hp || {};
  const C = S.C.hp = { income:0, on:!!H.on, rows:[], sum1k:0, pti:0, ptiFromSch:false,
                       posInc:0, lossAvail:0, p3:0, t3:0, capLoss:0, newRegime:isNew() };
  if(!H.on) return;

  const rows = (H.props||[]).map((p,idx)=>{ const r=engProp(p); p._=r; p._i=idx; return r; });
  const sum1k = R(rows.reduce((s,r)=>s+r.k, 0));          /* D40 = Σ1k */

  /* item 2 — Pass-through income/loss (book: from Schedule PTI). The "other"
     section computes S.C.other.pti; guarded read falls back to the manual
     figure H.pti when that section has not published (or is nil). */
  const oth = S.C.other || {};
  const ptiFromSch = (oth.pti||[]).reduce((s,b)=>s+N((b.hp||{}).net), 0);
  const usedSch = Math.abs(ptiFromSch) > 0;
  const pti = R(usedSch ? ptiFromSch : N(H.pti));          /* PassThroghIncome (row 41) */

  const income = R(sum1k + pti);                           /* row 42 TotalIncomeChargeableUnHP = Σ1k + 2 */

  C.rows = rows;
  C.sum1k = sum1k;
  C.pti = pti;
  C.ptiFromSch = usedSch;
  C.income = income;                                       /* signed head total; CYLA reads this */
  C.posInc = Math.max(0, income);                          /* CYLA F8 = MAX(income,0) */
  C.lossAvail = Math.abs(Math.min(0, income));             /* CYLA G7 = ABS(MIN(income,0)) */
  C.p3 = Math.max(income, -200000);                        /* [P3]=MAX(income,-200000) loss for 2-lakh adj */
  C.t3 = Math.max(0, (-income - 200000));                  /* [T3]=MAX(0,(-income-200000)) loss beyond 2 lakh */
  C.capLoss = Math.min(C.lossAvail, 200000);               /* HP loss set off, capped at ₹2,00,000 (s.71(3A)) */
}

/* ---- renderer ---------------------------------------------------- */
function hpBlock(p, i, ordinal){
  const r = p._ || engProp(p);
  const pre = "hp.props."+i+".", id = "hp"+i;
  const typeLbl = (HP_TYPE.find(t=>t[0]===p.type)||["","—"])[1];
  const status = (st0(p.addr)?typeLbl+" · ":"") + (r.k<0?"loss "+RS(-r.k):RS(r.k));
  let b = "";

  /* --- the property --- */
  b += sub("The property");
  b += row("Address of property", inp(pre+"addr",{max:200}), {req:1, ref:"E4", hint:"do not leave the address blank"});
  b += row("Town / City", inp(pre+"city",{max:50}), {req:1, ref:"F4"});
  b += row("Country", sel(pre+"country", HP_COUNTRY), {req:1, ref:"H4"});
  if((p.country||"91")==="91"){
    b += row("State", sel(pre+"state", HP_STATE), {req:1, ref:"G4"});
    b += row("PIN Code", inp(pre+"pin",{max:6}), {req:1, ref:"I4", hint:"100000–999999"});
  } else {
    b += row("State", sel(pre+"state", [["99","Foreign"]], {blank:false}), {req:1, ref:"G4"});
    b += row("Zip Code", inp(pre+"zip",{max:8}), {ref:"J4", hint:"for property abroad"});
  }

  /* --- ownership --- */
  b += sub("Ownership");
  b += row("Owner of the Property", sel(pre+"owner", HP_OWNER), {req:1, ref:"E6"});
  b += row("Is the property co-owned?", sel(pre+"co", HP_COOWN, {blank:false}), {req:1, ref:"G6"});
  b += row("Assessee's percentage of share in the property (%)",
           cell(r.share),
           {req:1, ref:"I6",
            hint:p.co==="YES"?"computed = 100% − co-owners' shares ("+r.coShare+"%)":
                 p.co==="NO"?"not co-owned — 100%":"select co-owned above"});
  if(p.co==="YES"){
    b += grid(pre.slice(0,-1)+".coowners",[
        {k:"name",h:"Name of other co-owner(s)",t:"txt",w:"auto",req:1,max:125},
        {k:"pan",h:"PAN of co-owner(s)",t:"txt",w:"120px",max:10},
        {k:"aadhaar",h:"Aadhaar of co-owner(s)",t:"txt",w:"140px",max:12},
        {k:"share",h:"Percentage share of co-owner(s) %",t:"num",w:"180px"}],
      p.coowners||[], {min:"780px", empty:"No co-owner listed.", add:"Add a co-owner",
        foot:[{l:1,v:"Co-owners' total share (your share = 100 − this)",span:3},{v:r.coShare}]});
    if(r.coShare>=100)
      b += note("The other co-owners' shares add to "+r.coShare+"% — they must be less than 100% so your own share is positive.","warn");
  }

  /* --- type & tenants --- */
  b += sub("Type of house property");
  b += row("Type of House property?", sel(pre+"type", HP_TYPE), {req:1, ref:"I14",
           hint:"ITR-5 has no self-occupied option"});
  b += grid(pre.slice(0,-1)+".tenants",[
      {k:"name",h:"Name(s) of Tenant(s)",t:"txt",w:"auto",req:1,max:125},
      {k:"pan",h:"PAN of Tenant(s)",t:"txt",w:"120px",max:10},
      {k:"aadhaar",h:"Aadhaar of Tenant(s)",t:"txt",w:"140px",max:12},
      {k:"pantan",h:"PAN / TAN of Tenant(s) — if TDS credit is claimed",t:"txt",w:"220px",max:10}],
    p.tenants||[], {min:"900px", empty:"No tenant listed.", add:"Add a tenant"});

  /* --- the working a–k --- */
  b += sub("Computation of income from the property");
  b += row("a · Gross rent received / receivable / letable value", inp(pre+"rent",{n:1}),
           {req:1, ref:"1a", hint:"in full — your share is applied at f"});
  b += row("b · The amount of rent which cannot be realized", inp(pre+"unreal",{n:1}), {ref:"1b"});
  b += row("c · Tax paid to local authorities", inp(pre+"taxes",{n:1}), {ref:"1c"});
  b += row("d · Total (b + c)", cell(r.d), {ref:"1d", cls:"tot"});
  b += row("e · Annual value (a − d)", cell(r.e), {ref:"1e", cls:"tot"});
  b += row("f · Annual value of the property owned (own share × e)", cell(r.f),
           {ref:"1f", cls:"tot", hint:r.share<100?r.share+"% of "+RS(r.e):""});
  b += row("g · 30% of f", cell(r.g), {ref:"1g"});

  /* --- 24(b) loan table (inside the block) --- */
  b += sub("h · Interest payable on borrowed capital — Section 24(b)");
  b += note("One row per loan; every column is required on a filled row. The interest sums into item h "+
    "(there is no ₹2,00,000 cap on a let-out or deemed let-out property).");
  b += grid(pre.slice(0,-1)+".loans",[
      {k:"from",h:"Loan taken from",t:"sel",w:"160px",req:1,opts:HP_LOANFROM},
      {k:"name",h:"Name of the bank / institution / person",t:"txt",w:"auto",req:1,max:125},
      {k:"acno",h:"Loan Account number",t:"txt",w:"170px",req:1,max:25},
      {k:"dt",h:"Date of sanction of loan",t:"date",w:"140px",req:1},
      {k:"amt",h:"Total amount of loan",t:"num",w:"150px",req:1},
      {k:"os",h:"Loan outstanding on 31-03-2026",t:"num",w:"170px",req:1},
      {k:"interest",h:"Interest on Borrowed capital u/s 24(b)",t:"num",w:"170px",req:1}],
    p.loans||[], {min:"1320px", empty:"No loan.", add:"Add a loan",
      foot:[{l:1,v:"Total Interest on borrowed capital u/s 24(b)",span:6},{v:r.hRaw}]});
  b += row("h · Interest payable on borrowed capital", cell(r.h), {ref:"1h", cls:"tot"});

  b += row("i · Total (g + h)", cell(r.i), {ref:"1i", cls:"tot"});
  b += row("j · Arrears / Unrealized rent received during the year", inp(pre+"arrears",{n:1}),
           {ref:"1j", hint:"amount received — 70% is taken (less 30%)"});
  b += row("j · Less 30%", cell(r.j), {ref:"1j", ind:1});
  b += row("k · Income from house property "+ordinal+" (f − i + j)", cell(r.k), {ref:"1k", cls:"grand"});

  return blk(id, "Property "+ordinal+(st0(p.addr)?" — "+st0(p.addr):""), status, b, "hp.props."+i);
}

function secHp(){
  const C = S.C.hp || {};
  let h = "";
  h += row("Is there income or a loss from house property?",
           sel("hp.on",[["","No"],["1","Yes"]],{blank:false}), {req:1, ref:"Schedule HP"});
  if(!S.hp.on) return h;

  h += note("One block per house property, unlimited. The Section 24(b) loan table sits inside each block "+
    "and sums into item h. Rent, unrealised rent and local taxes are entered in full; the co-owner's share "+
    "is applied once, at f. ITR-5 has no self-occupied property — every property is let out or deemed let out.");

  (S.hp.props||[]).forEach((p,i)=>h += hpBlock(p, i, i+1));
  h += '<button class="add" data-addprop="1">Add a property</button>';

  h += sub("Across all properties");
  h += row("Σ1k · Income from all properties", cell(C.sum1k), {ref:"D40", cls:"tot"});
  if(C.ptiFromSch)
    h += row("2 · Pass through income / Loss — from Schedule PTI", cell(C.pti),
             {ref:"E41", hint:"the house-property row(s) of Schedule PTI"});
  else
    h += row("2 · Pass through income / Loss (if any)", inp("hp.pti",{n:1}),
             {ref:"E41", hint:"from Schedule PTI — leave blank if none"});
  h += row('3 · Income under the head "Income from house property" (Σ1k + 2)', cell(C.income),
           {ref:"E42", cls:"grand",
            hint:C.income<0?("a loss — to 2(i) of Schedule CYLA, set off up to ₹2,00,000"+
                             (C.t3>0?"; "+RS(C.t3)+" beyond the cap carries forward":"")):""});
  if(C.income<0)
    h += note("A house-property loss can be set off against other heads only up to ₹2,00,000 (s.71(3A)); "+
      "under the new tax regime it cannot be set off at all. The set-off / carry-forward is done in "+
      "Schedule CYLA/CFL by the losses section.","warn");
  return h;
}

/* ---- export ------------------------------------------------------ */
function expHp(j){
  const C = S.C.hp || {};
  if(!(S.hp && S.hp.on && (S.hp.props||[]).length)) return;

  const items = (S.hp.props||[]).map((p,i)=>{
    const r = p._ || engProp(p);
    const ad = {
      AddrDetail:(sv(p.addr)||"NA").slice(0,200),
      CityOrTownOrDistrict:(sv(p.city)||"NA").slice(0,50),
      StateCode:(p.country||"91")==="91" ? (HP_STATE_SET[st0(p.state)]?st0(p.state):"19") : "99",
      CountryCode:(st0(p.country)||"91").slice(0,4)
    };
    if((p.country||"91")==="91"){ if(/^[1-9]\d{5}$/.test(st0(p.pin))) ad.PinCode=parseInt(p.pin,10); }
    else if(sv(p.zip)) ad.ZipCode=sv(p.zip).slice(0,8);

    /* Rentdetails — the a–k. RentNotRealized / LocalTaxes are required, so
       always emitted (0 when nil); the computed cells are required too. */
    const rd = {
      AnnualLetableValue:n0(r.a),               /* 1a */
      RentNotRealized:n0(r.b),                  /* 1b (required) */
      LocalTaxes:n0(r.c),                       /* 1c (required) */
      TotalUnrealizedAndTax:n0(r.d),            /* 1d */
      BalanceALV:n0(r.e),                       /* 1e */
      AnnualOfPropOwned:n0(r.f),                /* 1f */
      ThirtyPercentOfBalance:n0(r.g),           /* 1g */
      IntOnBorwCap:n0(r.h),                     /* 1h */
      TotalDeduct:n0(r.i),                      /* 1i */
      IncomeOfHP:sg(r.k)                        /* 1k (signed) */
    };
    if(r.j) rd.ArrearsUnrealizedRentRcvd=n0(r.j); /* 1j (optional, stored net of 30%) */

    const ln = (p.loans||[]).filter(l=>N(l.interest) || st0(l.name) || N(l.amt));
    if(ln.length){
      rd.Section24B = {
        Section24BDtls: ln.map(l=>({
          LoanTknFrom:l.from==="I"?"I":"B",
          BankOrInstnName:(sv(l.name)||"NA").slice(0,125),
          LoanAccNoOfBankOrInstnRefNo:(sv(l.acno)||"NA").slice(0,25),
          DateofLoan:ISO(l.dt)||"2025-04-01",
          TotalLoanAmt:n0(l.amt),
          LoanOutstndngAmt:n0(l.os),
          InterestUs24B:n0(l.interest)
        })),
        TotalInterestUs24B:n0(r.hRaw)
      };
    }

    const it = {
      HPSNo:i+1,
      AddressDetailWithZipCode:ad,
      PropertyOwner:p.owner==="DO"?"DO":"SE",
      PropCoOwnedFlg:p.co==="YES"?"YES":"NO",
      ifLetOut:p.type==="D"?"D":"Y",
      Rentdetails:rd
    };
    if(r.share) it.AssessePercentShareProp=R(r.share);   /* J6 computed own share % */

    const co = (p.coowners||[]).filter(x=>st0(x.name));
    if(co.length) it.CoOwners=co.map((x,k)=>{
      const c={CoOwnersSNo:k+1, NameCoOwner:st0(x.name).slice(0,125)};
      if(PAN_RE.test(st0(x.pan).toUpperCase())) c.PAN_CoOwner=st0(x.pan).toUpperCase();
      if(AADH.test(st0(x.aadhaar))) c.Aadhaar_CoOwner=st0(x.aadhaar);
      if(N(x.share)) c.PercentShareProperty=N(x.share);
      return c;
    });
    const tn = (p.tenants||[]).filter(x=>st0(x.name));
    if(tn.length) it.TenantDetails=tn.map((x,k)=>{
      const t={TenantSNo:k+1, NameofTenant:st0(x.name).slice(0,125)};
      if(PAN_RE.test(st0(x.pan).toUpperCase())) t.PANofTenant=st0(x.pan).toUpperCase();
      if(AADH.test(st0(x.aadhaar))) t.AadhaarofTenant=st0(x.aadhaar);
      if(sv(x.pantan)) t.PANTANofTenant=st0(x.pantan).toUpperCase().slice(0,10);
      return t;
    });
    return it;
  });

  /* written via put (HP is the sole writer of ScheduleHP.* — no gate-4 clash) */
  put(j,"ScheduleHP.PropertyDetails",items);
  put(j,"ScheduleHP.TotalIncomeChargeableUnHP",sg(C.income));   /* row 42; may be negative */
  if(C.pti) put(j,"ScheduleHP.PassThroghIncome",sg(C.pti));     /* row 41 (optional) */
}

/* ---- import ------------------------------------------------------ */
function impHp(I5){
  if(!(I5 && I5.ScheduleHP)) return [];
  const hp = I5.ScheduleHP;
  S.hp = {
    on:"1",
    pti:nz(hp.PassThroghIncome),
    props:(hp.PropertyDetails||[]).map(p=>{
      const ad = p.AddressDetailWithZipCode||{}, rd = p.Rentdetails||{};
      return {
        addr:ad.AddrDetail||"", city:ad.CityOrTownOrDistrict||"",
        state:ad.StateCode||"", country:ad.CountryCode||"91",
        pin:ad.PinCode!=null?String(ad.PinCode):"", zip:ad.ZipCode||"",
        owner:p.PropertyOwner==="DO"?"DO":"SE",
        co:p.PropCoOwnedFlg==="YES"?"YES":"NO",
        coowners:(p.CoOwners||[]).map(c=>({name:c.NameCoOwner||"", pan:c.PAN_CoOwner||"",
          aadhaar:c.Aadhaar_CoOwner||"", share:nz(c.PercentShareProperty)})),
        type:p.ifLetOut==="D"?"D":"Y",
        tenants:(p.TenantDetails||[]).map(t=>({name:t.NameofTenant||"", pan:t.PANofTenant||"",
          aadhaar:t.AadhaarofTenant||"", pantan:t.PANTANofTenant||""})),
        rent:nz(rd.AnnualLetableValue), unreal:nz(rd.RentNotRealized), taxes:nz(rd.LocalTaxes),
        /* 1j is stored net (70%); recover the amount received = j / 0.70 */
        arrears:rd.ArrearsUnrealizedRentRcvd?Math.round(N(rd.ArrearsUnrealizedRentRcvd)/0.70):"",
        loans:(RG(rd,"Section24B.Section24BDtls",[])||[]).map(l=>({
          from:l.LoanTknFrom||"B", name:l.BankOrInstnName||"", acno:l.LoanAccNoOfBankOrInstnRefNo||"",
          dt:dmy(l.DateofLoan)||"", amt:nz(l.TotalLoanAmt), os:nz(l.LoanOutstndngAmt),
          interest:nz(l.InterestUs24B)}))
      };
    })
  };
  return ["Schedule HP (income from house property)"];
}

/* ---- checks ------------------------------------------------------ */
function chkHp(){
  const out = [];
  if(!(S.hp && S.hp.on)) return out;
  const myPan = st0((S.pi||{}).pan).toUpperCase();

  (S.hp.props||[]).forEach((p,n)=>{
    const r = p._ || engProp(p);
    const L = "Property "+(n+1);

    /* required address / type (book: address blank not allowed; type required) */
    if(!st0(p.addr)) out.push({lvl:"err", t:L, m:"The address of the property is required.", sec:"hp"});
    if(!st0(p.city)) out.push({lvl:"err", t:L, m:"Town / City is required.", sec:"hp"});
    if((p.country||"91")==="91" && !HP_STATE_SET[st0(p.state)])
      out.push({lvl:"err", t:L, m:"State is required for a property in India.", sec:"hp"});
    if(p.type!=="Y" && p.type!=="D")
      out.push({lvl:"err", t:L, m:"Select the type of house property (let out / deemed let out).", sec:"hp"});
    if(!st0(p.owner)) out.push({lvl:"err", t:L, m:"Select the owner of the property (self / deemed owner).", sec:"hp"});

    /* let-out / deemed let-out needs a gross rent (rule #198: 1a > 0) */
    if((p.type==="Y"||p.type==="D") && !(N(p.rent)>0))
      out.push({lvl:"err", t:L, m:"A let-out or deemed let-out property needs a gross rent / lettable value (1a).", sec:"hp"});
    /* local tax not allowed if 1a is zero/null (rule #196) */
    if(N(p.taxes)>0 && !(N(p.rent)>0))
      out.push({lvl:"warn", t:L, m:"Tax paid to local authorities (1c) cannot be claimed when the gross rent (1a) is nil.", sec:"hp"});
    /* unrealised rent cannot exceed the gross rent (rule #208) */
    if(N(p.unreal) > N(p.rent))
      out.push({lvl:"warn", t:L, m:"The amount of rent that cannot be realised (1b) cannot exceed the gross rent (1a).", sec:"hp"});

    /* co-ownership: shares must total 100 (own = 100 − Σco); co-owners < 100 (#207) */
    if(p.co==="YES"){
      if(!(p.coowners||[]).some(x=>st0(x.name)))
        out.push({lvl:"err", t:L, m:"List the other co-owner(s) of the property.", sec:"hp"});
      if(r.coShare>=100)
        out.push({lvl:"err", t:L, m:"The other co-owners' shares must total less than 100% so your own share is positive.", sec:"hp"});
      /* no interest u/s 24(b) if the assessee's share of a co-owned property is nil (#195) */
      if(r.share===0 && r.hRaw>0)
        out.push({lvl:"err", t:L, m:"You cannot claim interest u/s 24(b) on a co-owned property in which your share is nil.", sec:"hp"});
    }

    /* co-owner / tenant PAN form; co-owner PAN ≠ assessee's PAN (#204) */
    (p.coowners||[]).forEach((x,m)=>{
      if(st0(x.pan) && !PAN_RE.test(st0(x.pan).toUpperCase()))
        out.push({lvl:"err", t:L+", co-owner "+(m+1), m:"The PAN is not in the correct form.", sec:"hp"});
      if(myPan && st0(x.pan).toUpperCase()===myPan)
        out.push({lvl:"err", t:L+", co-owner "+(m+1), m:"A co-owner's PAN cannot be the same as the assessee's PAN.", sec:"hp"});
    });
    (p.tenants||[]).forEach((x,m)=>{
      if(st0(x.pan) && !PAN_RE.test(st0(x.pan).toUpperCase()))
        out.push({lvl:"err", t:L+", tenant "+(m+1), m:"The PAN is not in the correct form.", sec:"hp"});
      /* 194-IB: PAN/Aadhaar of the tenant is mandatory when TDS credit is claimed */
      if(st0(x.pantan) && !st0(x.pan) && !st0(x.aadhaar))
        out.push({lvl:"warn", t:L+", tenant "+(m+1), m:"Furnish the tenant's PAN or Aadhaar when TDS credit is claimed (s.194-IB).", sec:"hp"});
    });

    /* interest u/s 24(b) needs the loan table complete (rule #206) */
    if(r.hRaw>0){
      (p.loans||[]).filter(l=>N(l.interest)).forEach((l,m)=>{
        if(!st0(l.name)||!st0(l.acno)||!st0(l.from)||!ISO(l.dt))
          out.push({lvl:"err", t:L+", loan "+(m+1), m:"Every column of the Section 24(b) loan row is required (lender, name, account no., date of sanction).", sec:"hp"});
      });
    }
  });

  return out;
}

/* ---- register ---------------------------------------------------- */
/* order 6 = HP's 1-based position in FORM.SECTIONS (gen1 bs2 pl3 oi4 bp5 hp6
   cg7 os8 loss9 …). compute() sorts engines by corder||order; this keeps HP
   (an income head) computing before the "loss" section (order 9) so CYLA/BFLA
   can read S.C.hp.income. Screen order is fixed by SCREEN_ORDER, not by this. */
reg({id:"hp", t:"House property", ref:"Schedule HP",
     f:secHp,
     s:()=>{ const C=S.C.hp||{}; if(!(S.hp&&S.hp.on)) return "None";
       return C.income<0 ? "Loss "+CR(-C.income)
            : (C.income ? "Income "+CR(C.income)
                        : ((S.hp.props||[]).length+" property")); },
     eng:engHp, exp:expHp, imp:impHp, chk:chkHp, order:6});

/* =====================================================================
   70_sec_oi.js — Other Information (Part A - OI) + Quantitative Details
   (Part A - QD).  ITR-5, A.Y. 2026-27, Phase 4.  Section id "oi".

   Built ONLY from this form's books:
     books/ITR-5/PART_A_OI.md          -> block PARTA_OI  (sheet PART - A OI)
     books/ITR-5/QUANTITATIVE_DETAILS.md -> block PARTA_QD (sheet QUANTITATIVE_DETAILS)
   plus books/ITR-5/enums.json for every dropdown, and the schema leaves
   (tools/dump.py --form ITR-5 --leaves PARTA_OI / PARTA_QD) for verbatim
   keys.  The ITR-3 file forms/ITR-3/src/70_sec_bpa.js was read for SHAPE
   only (rule 2: no engine ported — every formula below is from PART_A_OI.md
   with its cell reference in the comment).

   SHAPE FACTS specific to ITR-5 (do not carry over from ITR-3):
   - Section 6 (u/s 36) has 19 sub-items 6a..6s (ITR-3 had 18); 6t is the
     total of 6a..6s; 6u is the (optional) employee-count sub-object.
   - Section 8: 8B key is AnyAmtOfSec40AllowPrevYr (ITR-3 used a different key).
   - Section 10/11 optional key is RailwayAsstsPyble (spelling from schema).
   - Section 13 has three components 13a/13b/13c (33AB, 33ABA, 33AC).
   - Items 14,15,16,16A,17 (16A = MSMED s.23 interest, optional; 17 = 92CE).

   BLOCKS ARE OPTIONAL (not in SKEL): PARTA_OI and PARTA_QD are emitted only
   when they carry data — the whole schedule is conditionally mandatory
   (only when liable for audit u/s 44AB, header [F3]/[D3]).

   ---------------------------------------------------------------------
   SCHEMA GAP — OI row 9e / 40A(13)  (flagged in PART_A_OI.md):
   The sheet's row 9e (J74, "Marked to market loss or other expected loss
   except as allowable u/s 36(1)(xviii) [40A(13)]") has NO dedicated leaf in
   the ITR-5 schema block AmtDisallUs40A (its only leaves are AmtPaidUs40A2b,
   AmtGT20kCash, ProvPmtGrat, ContToSetupTrust, AnyOthDisallowance and the
   total TotAmtDisallUs40A — six keys for seven visible lines).  Per CLAUDE.md
   rule 3 (a live row with no schema key cannot be filed -> drop it and log)
   and the section brief ("do not invent a key"), 9e is NOT built as an input
   and is NOT exported.  Consequently the 9g total (TotAmtDisallUs40A) is
   computed here as SUM(9a,9b,9c,9d,9f) — the five schema leaves only — so the
   exported total always reconciles with the leaves present and the round-trip
   stays identical.  (On the utility the sheet formula 9g = SUM(J70:J75) also
   folds in J74/9e; that component is simply unfileable in this schema.)
   ===================================================================== */

/* ---- state: S.oi mirrors PARTA_OI; S.qd holds the three PARTA_QD grids.

S.oi = S.oi || {

const OI_5  =["Section28Items","ProformaCreditsDue","PrevYrEscalClaim","OthItemInc","CapReceipt"];                 /* 5a..5e -> 5f */
const OI_36 =["StkInsurPrem","EmpHealthInsurPrem","EmpBonusCommSum","IntOnBorrCap","ZeroCoupBondDisc","RecogPFContribAmt","AppSuperAnnFundAmt","PensionSchemeSec80CCD","AppGratFundAmt","OthFundAmt","EmpContributionCredits","BadDebtDoubtAmt","BadDebtDoubtProvn","SpecResrvTranfr","FamPlanPromoExp","SecuritiesPaidAmt","MrktLossOthExpLossICDS","ExpGovtApprovedSugarPrice","AnyOthDisallowance"]; /* 6a..6s -> 6t */

/* ================================================================
   eng — every total from PART_A_OI.md, cell reference in the comment.
   No item here is regime-closed (accounting figures are identical in
   both regimes), so nothing is gated on isNew().
   ================================================================ */
function engOi(){
  const G=p=>N(get("oi."+p)), St=(p,v)=>set("oi."+p,R(v));
  const sum=(base,keys)=>keys.reduce((a,k)=>a+G(base+"."+k),0);

  /* 3a/3b are read-only and populated from Schedule ICDS (L6 = ICDS.Total;
     L7 = ICDS.DeTotal1; rules 180/181).  Schedule ICDS is another section, so
     the feed is a cross-section seam: when that section exposes S.C.icds.total
     / S.C.icds.deTotal, take it; otherwise keep whatever is in state (0, or an
     imported value).  The cells render read-only either way. */
  const icds=(S.C&&S.C.icds)||{};
  if(icds.total   !=null) St("ProfDeviatDueAcctMeth", icds.total);   /* L6  3a */
  if(icds.deTotal !=null) St("DecProOrIncLossUs145_2", icds.deTotal);/* L7  3b */

  St("NoCredToPLAmt.TotNoCredToPLAmt", sum("NoCredToPLAmt",OI_5));                 /* L20 = SUM(J15:J19)  5f */
  St("AmtDisallUs36.TotAmtDisallUs36", sum("AmtDisallUs36",OI_36));               /* L41 = SUM(J22:J40)  6t (6a..6s) */
  St("AmtDisallUs36.NoOfEmployeesEmployed.Total",
     G("AmtDisallUs36.NoOfEmployeesEmployed.DeployedInIndia")
    +G("AmtDisallUs36.NoOfEmployeesEmployed.DeployedOutSideIndia"));             /* J45 = SUM(J43:J44)  6u.iii */
  St("AmtDisallUs37.TotAmtDisallUs37", sum("AmtDisallUs37",OI_37));               /* L56 = SUM(J47:J55)  7j */
  St("AmtDisallUs40.TotAmtDisallUs40", sum("AmtDisallUs40",OI_40));               /* L67 = SUM(J58:J66)  8Aj */
  St("AmtDisallUs40A.TotAmtDisallUs40A", sum("AmtDisallUs40A",OI_40A));           /* L76 = SUM(J70:J75) 9g — 9e (J74) unfileable, excluded (see gap note) */
  St("AmtDisallUs43BPyNowAll.AmtUs43B.TotAmtUs43b",
     sum("AmtDisallUs43BPyNowAll.AmtUs43B",OI_43B)+sum("AmtDisallUs43BPyNowAll.AmtUs43B",OI_43BO)); /* L87 = SUM(J78:J86) 10i */
  St("AmtDisall43B.AmtUs43B.TotAmtUs43b",
     sum("AmtDisall43B.AmtUs43B",OI_43B)+sum("AmtDisall43B.AmtUs43B",OI_43BO));   /* L98 = SUM(J89:J97) 11i */
  St("AmtExciseCustomsVATOutstanding.ExciseCustomsVAT.TotExciseCustomsVAT",
     sum("AmtExciseCustomsVATOutstanding.ExciseCustomsVAT",OI_12));              /* L108 = SUM(J100:J107) 12i */
  St("DeemedProfUs33ABs",
     G("DeemedProfUs33AB")+G("DeemedProfUs33ABA")+G("DeemedProfUs33AC"));        /* L109 = SUM(L110:L112) 13 */

  /* ---- feeds Schedule BP (section "bp") consumes; OI carries no income head
     of its own, so no S.C.oi.income.  Cross-schedule links per PART_A_OI.md:
       BP A14 = 6t (rule 218), BP A17 = 9g (rule 221), BP A30 = 10i (rule 228),
       BP A29 = 8B (AnyAmtOfSec40AllowPrevYr), BP 8b = item 14, BP 19 = item 15,
       BP Sl.19 = item 17 (92CE flag, rule 271),
       BP Sl.23 = SUM(5a..5d) (rule 270). ---- */
  S.C.oi={
    amtDisallUs36 : R(G("AmtDisallUs36.TotAmtDisallUs36")),                       /* 6t  -> BP A14 */
    amtDisallUs37 : R(G("AmtDisallUs37.TotAmtDisallUs37")),                       /* 7j */
    amtDisallUs40 : R(G("AmtDisallUs40.TotAmtDisallUs40")),                       /* 8Aj -> BP A?? (Us40) */
    amtDisallUs40A: R(G("AmtDisallUs40A.TotAmtDisallUs40A")),                     /* 9g  -> BP A17 */
    amtDisall43B  : R(G("AmtDisall43B.AmtUs43B.TotAmtUs43b")),                    /* 11i -> BP Us43B */
    tot43BNowAllow: R(G("AmtDisallUs43BPyNowAll.AmtUs43B.TotAmtUs43b")),          /* 10i -> BP A30 */
    amt40NowAllow : R(G("AmtDisallUs40.AnyAmtOfSec40AllowPrevYr")),               /* 8B  -> BP A29 */
    profTaxUs41   : R(G("ProfTaxAmtUs41")),                                       /* 14  -> BP 8b */
    priorPeriod   : R(G("PriorAmtIncCrDrPL")),                                    /* 15  -> BP 19 */
    exp14A        : R(G("AmountOfExpDisAllwUs14A")),                              /* 16 */
    intSMEDisallow: R(G("InterestDisAllowUs23SMEAct")),                           /* 16A */
    deemedProf33  : R(G("DeemedProfUs33ABs")),                                    /* 13 */
    sum5aTo5d     : R(G("NoCredToPLAmt.Section28Items")+G("NoCredToPLAmt.ProformaCreditsDue")+G("NoCredToPLAmt.PrevYrEscalClaim")+G("NoCredToPLAmt.OthItemInc")), /* 5a..5d -> BP Sl.23 */
    tpsaFlg       : st0(get("oi.ScheduleTPSAFlg")),                               /* 17  -> BP Sl.19 */
    qdRows        : (S.qd.trd||[]).length+(S.qd.raw||[]).length+(S.qd.fin||[]).length
  };
}

/* helper: does an object subtree carry any nonzero number / any nonempty
   string / any array row? (0 totals do not count, so an all-blank OI is not
   emitted.) */
function _oiHas(o){
  if(o==null)return false;
  if(Array.isArray(o))return o.length>0;
  if(typeof o==="object")return Object.keys(o).some(k=>_oiHas(o[k]));
  if(typeof o==="number")return R(o)!==0;
  return st0(o)!=="";
}

/* ================================================================
   sec — renderer.  Every live book row -> a field; every computed
   total -> a read-only cell().  No hidden rows are built (the sheet
   has none).  9e (40A(13)) is intentionally absent (schema gap).
   ================================================================ */
function secOi(){
  const V=p=>N(get("oi."+p));
  if(!Array.isArray(S.qd.trd))S.qd.trd=[];
  if(!Array.isArray(S.qd.raw))S.qd.raw=[];
  if(!Array.isArray(S.qd.fin))S.qd.fin=[];
  const ri =(l,pth,ref,o)=>{o=o||{};return row(l,inp("oi."+pth,{n:1}),{ref:ref,ind:o.ind,hint:o.hint,req:o.req});};
  const rc =(l,pth,ref,o)=>{o=o||{};return row(l,cell(V(pth)),{ref:ref,ind:o.ind,cls:o.cls||"tot",hint:o.hint});};
  const rsel=(l,pth,opts,ref,o)=>{o=o||{};return row(l,sel("oi."+pth,opts,{}),{ref:ref,req:o.req,hint:o.hint});};
  let h="";
  h+=formNote("Other Information is the tax-audit annexure — <b>mandatory if the firm/entity is "+
    "liable for audit under section 44AB</b>. Serial numbers marked in red are compulsory when the "+
    "schedule applies; blank numeric fields are treated as zeroes. These figures feed Schedule BP.");

  let s="";
  /* ---- 1-3 method of accounting & ICDS deviation ---- */
  s+=rsel("1 — Method of accounting employed in the previous year","MethodOfAcct",OI_MOA,"1",{req:1});
  s+=rsel("2 — Is there any change in method of accounting?","ChangeInAcctMethFlg",OI_NY,"2",{req:1});
  s+=rc("3a — Increase in profit / decrease in loss from ICDS deviation u/s 145(2)","ProfDeviatDueAcctMeth","3a",{hint:"from Schedule ICDS col XI(3)"});
  s+=rc("3b — Decrease in profit / increase in loss from ICDS deviation u/s 145(2)","DecProOrIncLossUs145_2","3b",{hint:"from Schedule ICDS col XI(4)"});

  /* ---- 4 method of valuation of closing stock ---- */
  s+=sub("4 — Method of valuation of closing stock");
  s+=rsel("4a — Raw material","MethodOfValClgStk.ValRawMaterial",OI_VAL,"4a");
  s+=rsel("4b — Finished goods","MethodOfValClgStk.ValFinishedGoods",OI_VAL,"4b");
  s+=rsel("4c — Is there any change in stock valuation method?","MethodOfValClgStk.ChngStockValMetFlg",OI_NY,"4c");
  s+=ri("4d — Increase in profit / decrease in loss from deviation u/s 145A","MethodOfValClgStk.EffectOnPL","4d");
  s+=ri("4e — Decrease in profit / increase in loss from deviation u/s 145A","MethodOfValClgStk.DecProOrIncLossUs145_A","4e");

  /* ---- 5 amounts not credited to the P&L ---- */
  s+=sub("5 — Amounts not credited to the profit and loss account");
  s+=ri("5a — Items within the scope of section 28","NoCredToPLAmt.Section28Items","5a");
  s+=ri("5b — Proforma credits, drawbacks, refunds of duty / tax admitted as due","NoCredToPLAmt.ProformaCreditsDue","5b");
  s+=ri("5c — Escalation claims accepted during the year","NoCredToPLAmt.PrevYrEscalClaim","5c");
  s+=ri("5d — Any other item of income","NoCredToPLAmt.OthItemInc","5d");
  s+=ri("5e — Capital receipt, if any","NoCredToPLAmt.CapReceipt","5e");
  s+=rc("5f — Total (5a to 5e)","NoCredToPLAmt.TotNoCredToPLAmt","5f");

  /* ---- 6 disallowable u/s 36 ---- */
  const L36=["Insurance against damage/destruction of stocks or stores [36(1)(i)]","Insurance on the health of employees [36(1)(ib)]","Bonus/commission otherwise payable as profit or dividend [36(1)(ii)]","Interest on borrowed capital [36(1)(iii)]","Discount on a zero-coupon bond [36(1)(iiia)]","Contribution to a recognised provident fund [36(1)(iv)]","Contribution to an approved superannuation fund [36(1)(iv)]","Contribution to a pension scheme u/s 80CCD [36(1)(iva)]","Contribution to an approved gratuity fund [36(1)(v)]","Contribution to any other fund","Employees' contribution not credited by due date [36(1)(va)]","Bad and doubtful debts [36(1)(vii)]","Provision for bad and doubtful debts [36(1)(viia)]","Amount transferred to any special reserve [36(1)(viii)]","Family-planning promotion expenditure [36(1)(ix)]","Securities transaction tax where income not in business income [36(1)(xv)]","Marked-to-market / other expected loss per ICDS u/s 145(2) [36(1)(xviii)]","Sugarcane purchase above the government-approved price [36(1)(xvii)]","Any other disallowance"];
  const abc="abcdefghijklmnopqrs";
  s+=sub("6 — Amounts debited to P&L, disallowable under section 36");
  OI_36.forEach((k,i)=>s+=ri("6"+abc[i]+" — "+L36[i],"AmtDisallUs36."+k,"6"+abc[i],{ind:1}));

  s+=sub("6u — Total number of employees employed (mandatory if the assessee has a recognised Provident Fund)");
  s+=ri("6u(i) — Deployed in India","AmtDisallUs36.NoOfEmployeesEmployed.DeployedInIndia","6u(i)",{ind:1});
  s+=ri("6u(ii) — Deployed outside India","AmtDisallUs36.NoOfEmployeesEmployed.DeployedOutSideIndia","6u(ii)",{ind:1});
  s+=rc("6u(iii) — Total deployed (i + ii)","AmtDisallUs36.NoOfEmployeesEmployed.Total","6u(iii)");

  /* ---- 7 disallowable u/s 37 ---- */
  const L37=["Expenditure of a capital nature [37(1)]","Expenditure of a personal nature [37(1)]","Expenditure not wholly / exclusively for business or profession [37(1)]","Advertisement in a political party's publication [37(2B)]","Penalty or fine for violation of any law","Any other penalty or fine","Expenditure for an offence or prohibited by law","Any liability of a contingent nature","Any other amount not allowable under section 37"];
  s+=sub("7 — Amounts debited to P&L, disallowable under section 37");
  OI_37.forEach((k,i)=>s+=ri("7"+abc[i]+" — "+L37[i],"AmtDisallUs37."+k,"7"+abc[i],{ind:1}));
  s+=rc("7j — Total disallowable under section 37 (7a to 7i)","AmtDisallUs37.TotAmtDisallUs37","7j");

  /* ---- 8 disallowable u/s 40 ---- */
  const L40=["40(a)(i) — non-compliance with Chapter XVII-B","40(a)(ia) — non-compliance with Chapter XVII-B","40(a)(ib) — non-compliance with Chapter VIII, Finance Act 2016 (equalisation levy)","40(a)(iii) — non-compliance with Chapter XVII-B","Tax or rate levied on the basis of profits [40(a)(ii)]","Amount paid as wealth tax [40(a)(iia)]","Royalty / licence / service fee [40(a)(iib)]","Interest, salary, bonus, commission or remuneration to a partner/member [40(b)]","Any other disallowance"];
  s+=sub("8A — Amounts debited to P&L, disallowable under section 40");
  OI_40.forEach((k,i)=>s+=ri("8A."+abc[i]+" — "+L40[i],"AmtDisallUs40."+k,"8A"+abc[i],{ind:1}));

  s+=ri("8B — Disallowed u/s 40 in an earlier year, allowable this year","AmtDisallUs40.AnyAmtOfSec40AllowPrevYr","8B",{hint:"feeds Schedule BP A29"});

  /* ---- 9 disallowable u/s 40A (9e / 40A(13) has no schema leaf — omitted) ---- */

  const R40A=["9a","9b","9c","9d","9f"];
  s+=sub("9 — Amounts debited to P&L, disallowable under section 40A");
  OI_40A.forEach((k,i)=>s+=ri(L40A[i],"AmtDisallUs40A."+k,R40A[i],{ind:1}));
  s+=note("Row 9e — marked-to-market / other expected loss u/s 40A(13) — is not shown: "+
    "the ITR-5 schema provides no field for it, so it cannot be filed and is excluded from the 9g total.");
  s+=rc("9g — Total disallowable under section 40A (9a to 9f)","AmtDisallUs40A.TotAmtDisallUs40A","9g");

  /* ---- 10 & 11 section 43B (same nine sub-items) ---- */
  const L43B=["Tax, duty, cess or fee under any law","Contribution to PF / superannuation / gratuity / welfare fund","Bonus or commission to an employee","Interest on a loan from a public FI / State FC / State IIC","Interest on a loan from a notified NBFC","Interest on a loan from a scheduled / co-operative bank","Sum payable towards leave encashment","Sum payable to Indian Railways for the use of railway assets","Sum payable to a micro / small enterprise beyond s.15 MSMED Act"];
  const R43B=["a","b","c","d","da","e","f","g","h"];
  const K43B=OI_43B.concat(OI_43BO);   /* 10a..10h / 11a..11h in sheet order */
  s+=sub("10 — Disallowed u/s 43B in an earlier year, allowable this year");
  K43B.forEach((k,i)=>s+=ri("10"+R43B[i]+" — "+L43B[i],"AmtDisallUs43BPyNowAll.AmtUs43B."+k,"10"+R43B[i],{ind:1}));
  s+=rc("10i — Total allowable under section 43B (10a to 10h)","AmtDisallUs43BPyNowAll.AmtUs43B.TotAmtUs43b","10i");

  K43B.forEach((k,i)=>s+=ri("11"+R43B[i]+" — "+L43B[i],"AmtDisall43B.AmtUs43B."+k,"11"+R43B[i],{ind:1}));
  s+=rc("11i — Total disallowable under section 43B (11a to 11h)","AmtDisall43B.AmtUs43B.TotAmtUs43b","11i");

  /* ---- 12 credit outstanding ---- */
  const L12=["Union excise duty","Service tax","VAT / Sales tax","Central GST (CGST)","State GST (SGST)","Integrated GST (IGST)","Union Territory GST (UTGST)","Any other tax"];
  s+=sub("12 — Amount of credit outstanding in the accounts");
  OI_12.forEach((k,i)=>s+=ri("12"+abc[i]+" — "+L12[i],"AmtExciseCustomsVATOutstanding.ExciseCustomsVAT."+k,"12"+abc[i],{ind:1}));
  s+=rc("12i — Total amount outstanding (12a to 12h)","AmtExciseCustomsVATOutstanding.ExciseCustomsVAT.TotExciseCustomsVAT","12i");

  /* ---- 13-17 ---- */
  s+=sub("13 — Amounts deemed to be profits and gains u/s 33AB / 33ABA / 33AC");
  s+=ri("13a — u/s 33AB","DeemedProfUs33AB","13a",{ind:1});
  s+=ri("13b — u/s 33ABA","DeemedProfUs33ABA","13b",{ind:1});
  s+=ri("13c — u/s 33AC","DeemedProfUs33AC","13c",{ind:1});
  s+=rc("13 — Total deemed profits (13a + 13b + 13c)","DeemedProfUs33ABs","13");
  s+=ri("14 — Profit chargeable to tax under section 41","ProfTaxAmtUs41","14",{req:1,hint:"feeds Schedule BP 8b"});

  s+=ri("16 — Expenditure disallowed u/s 14A","AmountOfExpDisAllwUs14A","16",{req:1});
  s+=ri("16A — Interest disallowable u/s 23 of the MSMED Act, 2006","InterestDisAllowUs23SMEAct","16A");
  s+=rsel("17 — Exercising option u/s 92CE(2A)? (if Yes, fill Schedule TPSA)","ScheduleTPSAFlg",OI_YN,"17",{req:1});

  h+=fold("oi_main","OI","Other information — tax-audit annexure (mandatory if 44AB)",
    _oiHas(S.oi)?"filled":"if 44AB",s,{def:true});

  /* ================= Quantitative Details (Part A - QD) ================= */
  let q="";
  q+=note("Mandatory if liable for audit under section 44AB. Quantities only; item names ≤ 25 characters "+
    "(the characters &lt; &gt; &amp; ' \" $ are not allowed); shortage/excess may be negative. "+
    "If the first row of a grid is left blank, later rows in that grid are ignored.");
  q+=sub("(a) Trading concern");
  q+=grid("qd.trd",[
      {k:"ItemName",h:"Item name",t:"txt",w:"auto",req:1,max:25},
      {k:"UnitOfMeasure",h:"Unit",t:"sel",w:"150px",req:1,opts:OI_UNIT},
      {k:"OpeningStock",h:"Opening",t:"num",w:"100px",req:1},

      {k:"ClgStock",h:"Closing",t:"num",w:"100px",req:1},

    S.qd.trd,{min:"820px",empty:"No trading-concern items.",add:"Add a stock item"});
  q+=sub("(b) Manufacturing concern — raw materials");
  q+=grid("qd.raw",[
      {k:"ItemName",h:"Item name",t:"txt",w:"auto",req:1,max:25},

      {k:"OpeningStock",h:"Opening",t:"num",w:"90px",req:1},
      {k:"PurchaseQty",h:"Purchase",t:"num",w:"90px",req:1},
      {k:"PrevYrConsum",h:"Consumption",t:"num",w:"100px",req:1},
      {k:"SaleQty",h:"Sales",t:"num",w:"90px",req:1},
      {k:"ClgStock",h:"Closing",t:"num",w:"90px",req:1},
      {k:"yldFinisProd",h:"Yield fin. prod.",t:"num",w:"100px",req:1},
      {k:"PercentYld",h:"% yield",t:"num",w:"80px",req:1},
      {k:"AnyShortExces",h:"Shortage/excess",t:"num",w:"110px",req:1}],
    S.qd.raw,{min:"1060px",empty:"No raw-material items.",add:"Add a raw material"});
  q+=sub("(c) Manufacturing concern — finished products / by-products");
  q+=grid("qd.fin",[
      {k:"ItemName",h:"Item name",t:"txt",w:"auto",req:1,max:25},
      {k:"UnitOfMeasure",h:"Unit",t:"sel",w:"150px",req:1,opts:OI_UNIT},
      {k:"OpeningStock",h:"Opening",t:"num",w:"100px",req:1},
      {k:"PurchaseQty",h:"Purchase",t:"num",w:"100px",req:1},
      {k:"PrevyrManfact",h:"Qty manufactured",t:"num",w:"120px",req:1},
      {k:"SaleQty",h:"Sales",t:"num",w:"100px",req:1},
      {k:"ClgStock",h:"Closing",t:"num",w:"100px",req:1},

    S.qd.fin,{min:"960px",empty:"No finished/by-product items.",add:"Add a finished/by-product"});
  const nq=S.qd.trd.length+S.qd.raw.length+S.qd.fin.length;
  h+=fold("oi_qd","QD","Quantitative details (mandatory if liable to audit u/s 44AB)",
    nq?nq+" items":"if 44AB",q,{def:false});
  return h;

/* ================================================================
   exp — write PARTA_OI and PARTA_QD onto j via put().  Both blocks are
   OPTIONAL (not in SKEL): each is emitted only when it carries data.
   Required integer leaves are written even when 0 (put keeps 0), so an
   emitted block is schema-complete; optional leaves are written only when
   nonzero.  9e / 40A(13) is never written (no schema leaf).
   ================================================================ */
const OI_STR  =["MethodOfAcct","ChangeInAcctMethFlg","ValRawMaterial","ValFinishedGoods","ChngStockValMetFlg","ScheduleTPSAFlg","ItemName","UnitOfMeasure"];
const OI_FLOAT=["PercentYld"];
function _oiVal(k,v){
  if(OI_STR.indexOf(k)>=0){const s=st0(v);return s||undefined;}
  if(OI_FLOAT.indexOf(k)>=0){const n=N(v);return n||undefined;}
  return R(N(v));                       /* integer (AnyShortExces keeps its sign) */
}
function _oiNode(o){                     /* coerce one QD row object */
  const out={};
  for(const k in o){const cv=_oiVal(k,o[k]); if(cv!==undefined)out[k]=cv;}
  return out;
}
/* first-row-governs: a grid is emitted only if its first row has an item name;
   empty rows are dropped. */
function _qdArr(rows){
  rows=Array.isArray(rows)?rows:[];
  if(!rows.length||!st0(rows[0].ItemName))return [];
  return rows.map(_oiNode).filter(r=>st0(r.ItemName));
}
function expOi(j){
  const g=p=>R(N(get("oi."+p)));
  if(_oiHas(S.oi)){
    const o={};
    /* 1,2 (string enums) */
    put(o,"MethodOfAcct", sv(get("oi.MethodOfAcct")));
    put(o,"ChangeInAcctMethFlg", sv(get("oi.ChangeInAcctMethFlg")));
    /* 3a,3b */
    put(o,"ProfDeviatDueAcctMeth", g("ProfDeviatDueAcctMeth"));
    put(o,"DecProOrIncLossUs145_2", g("DecProOrIncLossUs145_2"));
    /* 4 method of valuation (whole object optional; emit if any leaf has data) */
    if(_oiHas(S.oi.MethodOfValClgStk)){
      put(o,"MethodOfValClgStk.ValRawMaterial", sv(get("oi.MethodOfValClgStk.ValRawMaterial")));
      put(o,"MethodOfValClgStk.ValFinishedGoods", sv(get("oi.MethodOfValClgStk.ValFinishedGoods")));
      put(o,"MethodOfValClgStk.ChngStockValMetFlg", sv(get("oi.MethodOfValClgStk.ChngStockValMetFlg")));
      put(o,"MethodOfValClgStk.EffectOnPL", g("MethodOfValClgStk.EffectOnPL"));
      put(o,"MethodOfValClgStk.DecProOrIncLossUs145_A", g("MethodOfValClgStk.DecProOrIncLossUs145_A"));
    }
    /* 5 */
    OI_5.forEach(k=>put(o,"NoCredToPLAmt."+k, g("NoCredToPLAmt."+k)));
    put(o,"NoCredToPLAmt.TotNoCredToPLAmt", g("NoCredToPLAmt.TotNoCredToPLAmt"));
    /* 6 */
    OI_36.forEach(k=>put(o,"AmtDisallUs36."+k, g("AmtDisallUs36."+k)));
    put(o,"AmtDisallUs36.TotAmtDisallUs36", g("AmtDisallUs36.TotAmtDisallUs36"));
    /* 6u — optional sub-object; emit only if it carries data */
    if(_oiHas(S.oi.AmtDisallUs36&&S.oi.AmtDisallUs36.NoOfEmployeesEmployed)){
      put(o,"AmtDisallUs36.NoOfEmployeesEmployed.DeployedInIndia", g("AmtDisallUs36.NoOfEmployeesEmployed.DeployedInIndia"));
      put(o,"AmtDisallUs36.NoOfEmployeesEmployed.DeployedOutSideIndia", g("AmtDisallUs36.NoOfEmployeesEmployed.DeployedOutSideIndia"));
      put(o,"AmtDisallUs36.NoOfEmployeesEmployed.Total", g("AmtDisallUs36.NoOfEmployeesEmployed.Total"));
    }
    /* 7 */
    OI_37.forEach(k=>put(o,"AmtDisallUs37."+k, g("AmtDisallUs37."+k)));
    put(o,"AmtDisallUs37.TotAmtDisallUs37", g("AmtDisallUs37.TotAmtDisallUs37"));
    /* 8 */
    OI_40.forEach(k=>put(o,"AmtDisallUs40."+k, g("AmtDisallUs40."+k)));
    put(o,"AmtDisallUs40.TotAmtDisallUs40", g("AmtDisallUs40.TotAmtDisallUs40"));
    put(o,"AmtDisallUs40.AnyAmtOfSec40AllowPrevYr", g("AmtDisallUs40.AnyAmtOfSec40AllowPrevYr"));
    /* 9  (9e / 40A(13) intentionally not written — no schema leaf) */
    OI_40A.forEach(k=>put(o,"AmtDisallUs40A."+k, g("AmtDisallUs40A."+k)));
    put(o,"AmtDisallUs40A.TotAmtDisallUs40A", g("AmtDisallUs40A.TotAmtDisallUs40A"));
    /* 10 */
    OI_43B.forEach(k=>put(o,"AmtDisallUs43BPyNowAll.AmtUs43B."+k, g("AmtDisallUs43BPyNowAll.AmtUs43B."+k)));
    OI_43BO.forEach(k=>{const v=g("AmtDisallUs43BPyNowAll.AmtUs43B."+k); if(v)put(o,"AmtDisallUs43BPyNowAll.AmtUs43B."+k, v);});
    put(o,"AmtDisallUs43BPyNowAll.AmtUs43B.TotAmtUs43b", g("AmtDisallUs43BPyNowAll.AmtUs43B.TotAmtUs43b"));
    /* 11 */
    OI_43B.forEach(k=>put(o,"AmtDisall43B.AmtUs43B."+k, g("AmtDisall43B.AmtUs43B."+k)));
    OI_43BO.forEach(k=>{const v=g("AmtDisall43B.AmtUs43B."+k); if(v)put(o,"AmtDisall43B.AmtUs43B."+k, v);});
    put(o,"AmtDisall43B.AmtUs43B.TotAmtUs43b", g("AmtDisall43B.AmtUs43B.TotAmtUs43b"));
    /* 12 */
    OI_12.forEach(k=>put(o,"AmtExciseCustomsVATOutstanding.ExciseCustomsVAT."+k, g("AmtExciseCustomsVATOutstanding.ExciseCustomsVAT."+k)));
    put(o,"AmtExciseCustomsVATOutstanding.ExciseCustomsVAT.TotExciseCustomsVAT", g("AmtExciseCustomsVATOutstanding.ExciseCustomsVAT.TotExciseCustomsVAT"));
    /* 13 (total required; 13a/13b/13c optional) */
    put(o,"DeemedProfUs33ABs", g("DeemedProfUs33ABs"));
    ["DeemedProfUs33AB","DeemedProfUs33ABA","DeemedProfUs33AC"].forEach(k=>{const v=g(k); if(v)put(o,k,v);});
    /* 14,15,16 (required) */
    put(o,"ProfTaxAmtUs41", g("ProfTaxAmtUs41"));
    put(o,"PriorAmtIncCrDrPL", g("PriorAmtIncCrDrPL"));   /* may be negative */
    put(o,"AmountOfExpDisAllwUs14A", g("AmountOfExpDisAllwUs14A"));
    /* 16A optional */
    {const v=g("InterestDisAllowUs23SMEAct"); if(v)put(o,"InterestDisAllowUs23SMEAct", v);}
    /* 17 */
    put(o,"ScheduleTPSAFlg", sv(get("oi.ScheduleTPSAFlg")));
    j.PARTA_OI=o;
  }
  /* ---- Part A - QD ---- */
  const qd={}, mc={};
  const t=_qdArr(S.qd.trd); if(t.length) qd.TradingConcern={QuantitDet:t};
  const raw=_qdArr(S.qd.raw); if(raw.length) mc.RawMaterial={QuantitDet:raw};
  const fin=_qdArr(S.qd.fin); if(fin.length) mc.FinishrByProd={QuantitDet:fin};
  if(Object.keys(mc).length) qd.ManfactrConcern=mc;
  if(Object.keys(qd).length) j.PARTA_QD=qd;
}

/* ================================================================
   imp — read PARTA_OI / PARTA_QD back into S.oi / S.qd, then restore the
   default container skeleton so every object/array the renderer touches
   exists.
   ================================================================ */
function _oiFill(dst,def){
  for(const k in def){
    if(dst[k]===undefined||dst[k]===null)dst[k]=deep(def[k]);
    else if(def[k]&&typeof def[k]==="object"&&!Array.isArray(def[k])&&typeof dst[k]==="object"&&!Array.isArray(dst[k]))_oiFill(dst[k],def[k]);
  }
}
function impOi(I){
  const got=[];
  if(I&&I.PARTA_OI){S.oi=deep(I.PARTA_OI);got.push("Part A - OI");}
  if(I&&I.PARTA_QD){const q=I.PARTA_QD;
    S.qd={
      trd:deep((q.TradingConcern&&q.TradingConcern.QuantitDet)||[]),
      raw:deep((q.ManfactrConcern&&q.ManfactrConcern.RawMaterial&&q.ManfactrConcern.RawMaterial.QuantitDet)||[]),
      fin:deep((q.ManfactrConcern&&q.ManfactrConcern.FinishrByProd&&q.ManfactrConcern.FinishrByProd.QuantitDet)||[])};
    got.push("Quantitative Details");}
  _oiFill(S.oi,{MethodOfValClgStk:{},NoCredToPLAmt:{},AmtDisallUs36:{NoOfEmployeesEmployed:{}},AmtDisallUs37:{},AmtDisallUs40:{},AmtDisallUs40A:{},AmtDisallUs43BPyNowAll:{AmtUs43B:{}},AmtDisall43B:{AmtUs43B:{}},AmtExciseCustomsVATOutstanding:{ExciseCustomsVAT:{}}});
  if(!S.qd)S.qd={trd:[],raw:[],fin:[]};
  ["trd","raw","fin"].forEach(k=>{if(!Array.isArray(S.qd[k]))S.qd[k]=[];});
  return got;
}

/* ================================================================
   chk — the sheet's own rules as live messages (from the books).
   ================================================================ */
const OI_BADCHARS=/[<>&'"$]/;
function chkOi(){
  const out=[], C=(S.C&&S.C.oi)||{}, V=p=>N(get("oi."+p));

  /* 6u mandatory when a recognised PF contribution (6f) is disclosed [F42] */
  if(V("AmtDisallUs36.RecogPFContribAmt")>0 &&
     !(V("AmtDisallUs36.NoOfEmployeesEmployed.DeployedInIndia")+V("AmtDisallUs36.NoOfEmployeesEmployed.DeployedOutSideIndia")))
    out.push({lvl:"warn",t:"Employee count missing",m:"A recognised Provident Fund contribution (6f) is disclosed, so the total number of employees (6u) is mandatory.",sec:"oi"});

  /* 17: option u/s 92CE(2A) = Yes -> Schedule TPSA must be filled (rule 190) */
  if(st0(get("oi.ScheduleTPSAFlg"))==="Yes")
    out.push({lvl:"warn",t:"Schedule TPSA required",m:"Option u/s 92CE(2A) is 'Yes' (item 17) — Schedule TPSA must be filled (rule 190).",sec:"oi"});

  /* QD grid validators (VBA + data-validation from QUANTITATIVE_DETAILS.md) */
  const grids=[["Trading",S.qd.trd,false],["Raw material",S.qd.raw,true],["Finished/by-product",S.qd.fin,false]];
  grids.forEach(([lbl,rows,isRaw])=>{
    rows=rows||[];
    /* first-row-governs (D3): a filled later row is ignored if the first is blank */
    if(rows.length>1 && !st0(rows[0].ItemName) && rows.slice(1).some(r=>st0(r.ItemName)))
      out.push({lvl:"warn",t:lbl+": first row blank",m:"The first row of the "+lbl.toLowerCase()+" grid is blank, so its later rows will be ignored.",sec:"oi"});
    rows.forEach((r,i)=>{
      const nm=st0(r.ItemName); if(!nm)return;
      if(nm.length>25)
        out.push({lvl:"err",t:lbl+": item name too long",m:"Item name in row "+(i+1)+" exceeds 25 characters.",sec:"oi"});
      if(OI_BADCHARS.test(nm))
        out.push({lvl:"err",t:lbl+": invalid characters",m:"Item name in row "+(i+1)+" uses a disallowed character (< > & ' \" $).",sec:"oi"});
      if(!st0(r.UnitOfMeasure))
        out.push({lvl:"err",t:lbl+": unit missing",m:"Select a unit of measure for row "+(i+1)+".",sec:"oi"});
      if(isRaw){const p=N(r.PercentYld); if(p<0||p>100)
        out.push({lvl:"err",t:lbl+": % yield out of range",m:"Percentage of yield in row "+(i+1)+" must be between 0 and 100.",sec:"oi"});}
    });
  });

  /* Schedule-mandatory when liable for audit u/s 44AB (VBA trigger): at least
     one row across the Trading or Raw-material grids.  LiableSec44ABflg lives
     in PartA_GEN2 (section "gen"); its state key is a cross-section seam, so
     this is checked only when the flag can be read, else skipped (no false
     error).  When "gen" exposes its flag the integrator can point this here. */
  const flag=(S.gen&&S.gen.LiableSec44ABflg)||(S.gen2&&S.gen2.LiableSec44ABflg)||(S.C&&S.C.gen&&S.C.gen.liable44AB);

   MANUFACTURING_ACCOUNT.md, TRADING_ACCOUNT.md, PROFIT_LOSS.md — plus
   enums.json for every dropdown (the PL_* tables above, verbatim).
   Schema blocks (books/ITR-5/section_map.json, section "pl"):
     ManufacturingAccount, TradingAccount, PARTA_PL.

   ITR-5 facts that differ from ITR-3 (read from this form's own books):
   - Every P&L debit head nests one level deeper, under
     DebitsToPL.DebitPlAcnt.*  (ITR-3 had them under DebitsToPL.* ).
   - Tax provisions / appropriations are DebitsToPL.TaxProvAppr.* and the
     item-61 balance carried is PartnerAccBalTrf (not ProprietorAccBalTrf);
     item 60 is DebitsToPL.TaxProvAppr.Appropriations.TrfToReserves.
   - Interest (52) has four legs: to Partners / to others, each split into
     non-resident (NonResOtherCompany / Others) and resident (ResPartners /
     ResOthers); 52iii InterestExpdr = the sum of all four.
   - Item 46 is Salary/Remuneration to Partners (DebitPlAcnt.SalRemuneration);
     item 47 Other expenses carries the array total in DebitPlAcnt.OtherExpenses.
   - Credits 14xi has only Liabilities-written-back (a) and interest from firm
     (b) — no "remuneration from firm" line (that key does not exist here).
   - Trading item numbering: 8 = Purchases, 9 = Direct Expenses; the item-9
     grand total is DirectExpenses (L31) and the 9(iii) array total is the
     required DirectExpensesTotal (J38) — two distinct keys.
   - 44AE carries TotalPrsumptvIncUs44EGoods and TotalPrsumptvIncGCUs44E as
     the col-5 totals, SalRemrtnToPartnerFirm (64iii) and the required
     TotalPrsumptvIncUs44E (64iv) = MAX(0, 64ii − 64iii).

   HEAD ROLL-UP: this section produces the *accounts* only. The PGBP head is
   computed by Schedule BP (section "bp"), which consumes these figures via
   S.C.pl.* and rolls the business head into GTI. So S.C.pl.income = 0 to
   avoid a double count. No item here is regime-closed — accounting figures
   are identical in both regimes, so nothing is gated on isNew().
   ===================================================================== */

/* turnover-cap helpers (PROFIT_LOSS.md rows 158/172):
   44AD  T148 = IF(cash>5% of turnover, MIN(turnover,2cr), MIN(turnover,3cr))
   44ADA T161 = IF(cash>5% of receipts, MIN(receipts,50L), MIN(receipts,75L)) */
function _plCapAD(bank,cash,other){
  const turn=N(bank)+N(cash)+N(other), five=turn*5/100; /* T144, T142 */
  return N(cash)>five?Math.min(turn,20000000):Math.min(turn,30000000); /* T148 */
}
function _plCapADA(bank,cash,other){
  const rec=N(bank)+N(cash)+N(other), five=rec*5/100; /* T157, T155 */
  return N(cash)>five?Math.min(rec,5000000):Math.min(rec,7500000); /* T161 */
}

function engPl(){
  const G=p=>N(get("pl."+p)), St=(p,v)=>set("pl."+p,R(v)),
        A=p=>get("pl."+p)||[], SUM=(arr,k)=>(arr||[]).reduce((a,r)=>a+N(r[k]),0);

  /* ---------- Manufacturing Account (MANUFACTURING_ACCOUNT.md) ---------- */
  const mOpngTot=Math.max(0, G("mfg.OpeningInventory.OpngStckRawMat")+G("mfg.OpeningInventory.OpngStckWrkinPrgrs")); /* Q8  1Aiii = Ai+Aii */
  St("mfg.OpeningInventory.OpngInvntryTotal", mOpngTot);
  const mDirExp=G("mfg.OpeningInventory.CarriageInward")+G("mfg.OpeningInventory.PowerAndFuel")+G("mfg.OpeningInventory.OthDirectExpenses"); /* Q11 1D = Di+Dii+Diii */
  St("mfg.OpeningInventory.DirectExpenses", mDirExp);
  const mFO=G("mfg.OpeningInventory.IndirectWages")+G("mfg.OpeningInventory.FactoryRentAndRates")+G("mfg.OpeningInventory.FactoryInsurance")+G("mfg.OpeningInventory.FactoryFuelAndPower")+G("mfg.OpeningInventory.FactoryGeneralExpenses")+G("mfg.OpeningInventory.DeprctnOfFactoryMachinery"); /* Q22 1Evii = Ei..Evi */
  St("mfg.OpeningInventory.TotalFactoryOverheads", mFO);
  const mDebits=mOpngTot+G("mfg.OpeningInventory.Purchases")+G("mfg.OpeningInventory.DirectWages")+mDirExp+mFO; /* Q23 1F = Aiii+B+C+D+Evii */
  St("mfg.OpeningInventory.TotalDebtsManfctrngAcc", mDebits);
  const mClose=G("mfg.ClosingStock.ClsngStckRawMaterial")+G("mfg.ClosingStock.ClsngStckWrkInPrgrs"); /* Q27 2iii = 2i+2ii */
  St("mfg.ClosingStock.ClsngStckTotal", mClose);
  const mCOGP=mDebits-mClose; /* Q28 3 = 1F − 2 (may be negative) */
  St("mfg.CostOfGoodsPrdcd", mCOGP);

  /* ---------- Trading Account (TRADING_ACCOUNT.md) ---------- */
  const tOOR=SUM(A("trd.OtherOperatingRevenueDtls"),"OperatingRevenueAmt"); /* J12 4A(iii) total */
  St("trd.OperatingRevenueTotal", tOOR);
  const tAiv=G("trd.SaleOfGoods")+G("trd.SaleOfServices")+tOOR; /* L14 4A(iv) = i+ii+iiic */
  St("trd.SalesGrossReceiptsTotal", tAiv);
  const t4Cix=G("trd.ExciseCustomsVAT.UnionExciseDuty")+G("trd.ExciseCustomsVAT.ServiceTax")+G("trd.ExciseCustomsVAT.VATorSaleTax")+G("trd.ExciseCustomsVAT.CentralGoodServiceTax")+G("trd.ExciseCustomsVAT.StateGoodServiceTax")+G("trd.ExciseCustomsVAT.IntegratedGoodServiceTax")+G("trd.ExciseCustomsVAT.UnionTerrGoodServiceTax")+G("trd.ExciseCustomsVAT.OthDutyTaxCess"); /* L25 4C(ix) = 4Ci..4Cviii */
  St("trd.ExciseCustomsVAT.TotExciseCustomsVAT", t4Cix);
  const t4D=tAiv+G("trd.GrossRcptFromProfession")+t4Cix; /* L26 4D = Aiv+B+Cix */
  St("trd.TotRevenueFrmOperations", t4D);
  const tCred=t4D+G("trd.ClsngStckOfFinishedStcks"); /* L28 item 6 = 4D + 5 */
  St("trd.TardingAccTotCred", tCred);
  const tODE=SUM(A("trd.OtherDirectExpenses"),"Amount"); /* J38 item 9iii array total */
  St("trd.DirectExpensesTotal", tODE);
  const t9=G("trd.CarriageInward")+G("trd.PowerAndFuel")+tODE; /* L31 item 9 = 9i+9ii+9iii */
  St("trd.DirectExpenses", t9);
  const t10xii=G("trd.DutyTaxPay.ExciseCustomsVAT.CustomDuty")+G("trd.DutyTaxPay.ExciseCustomsVAT.CounterVailDuty")+G("trd.DutyTaxPay.ExciseCustomsVAT.SplAddDuty")+G("trd.DutyTaxPay.ExciseCustomsVAT.UnionExciseDuty")+G("trd.DutyTaxPay.ExciseCustomsVAT.ServiceTax")+G("trd.DutyTaxPay.ExciseCustomsVAT.VATorSaleTax")+G("trd.DutyTaxPay.ExciseCustomsVAT.CentralGoodServiceTax")+G("trd.DutyTaxPay.ExciseCustomsVAT.StateGoodServiceTax")+G("trd.DutyTaxPay.ExciseCustomsVAT.IntegratedGoodServiceTax")+G("trd.DutyTaxPay.ExciseCustomsVAT.UnionTerrGoodServiceTax")+G("trd.DutyTaxPay.ExciseCustomsVAT.OthDutyTaxCess"); /* L52 10xii = 10i..10xi */
  St("trd.DutyTaxPay.ExciseCustomsVAT.TotExciseCustomsVAT", t10xii);
  St("trd.GoodsCostPrdcdFrmMA", mCOGP); /* L53 item 11 = Mfg Sl.No.3 (cross-block feed) */
  const tGP=tCred-G("trd.OpngStckOfFinishedStcks")-G("trd.Purchases")-t9-t10xii-mCOGP; /* L54 item 12 = 6−7−8−9−10xii−11 */
  St("trd.GrossProfitFrmBusProf", tGP);
  /* 12a/12c turnover are inputs; 12b/12d income inputs (12b<=12a, 12d<=12c checked) */

  /* ---------- Profit & Loss (PROFIT_LOSS.md) ---------- */
  const p=n=>"pl."+n;
  const t12b=G("trd.IntradayTradingIncome"), t12d=G("trd.IncomeFutureTrd");
  const gpTr=tGP+t12b+t12d; /* O4 item 13 = 12 + 12b + 12d */
  St(p("CreditsToPL.GrossProfitTrnsfFrmTrdAcc"), gpTr);
  const oiArr=SUM(A(p("CreditsToPL.OthIncome.OtherIncDtls")),"Amount");
  const misc=oiArr+G(p("CreditsToPL.OthIncome.LiabilityWrittenBack"))+G(p("CreditsToPL.OthIncome.AmtofInterest")); /* H23 14xi total = SUM(Amount)+LiabWrittenBack+AmtofInterest */
  St(p("CreditsToPL.OthIncome.MiscOthIncome"), misc);
  const totOI=G(p("CreditsToPL.OthIncome.RentInc"))+G(p("CreditsToPL.OthIncome.Comissions"))+G(p("CreditsToPL.OthIncome.Dividends"))+G(p("CreditsToPL.OthIncome.InterestInc"))+G(p("CreditsToPL.OthIncome.ProfitOnSaleFixedAsset"))+G(p("CreditsToPL.OthIncome.ProfitOnInvChrSTT"))+G(p("CreditsToPL.OthIncome.ProfitOnOthInv"))+G(p("CreditsToPL.OthIncome.ProfitOnCurrFluct"))+G(p("CreditsToPL.OthIncome.ProfitOnCnvInvntryToCapAsst"))+G(p("CreditsToPL.OthIncome.ProfitOnAgriIncome"))+misc; /* O25 14xii = 14i..14x + 14xi */
  St(p("CreditsToPL.OthIncome.TotOthIncome"), totOI);
  const totCred=gpTr+totOI; /* O26 item 15 = 13 + 14xii */
  St(p("CreditsToPL.TotCreditsToPL"), totCred);

  const d="DebitsToPL.DebitPlAcnt.";
  const empT=G(p(d+"EmployeeComp.SalsWages"))+G(p(d+"EmployeeComp.Bonus"))+G(p(d+"EmployeeComp.MedExpReimb"))+G(p(d+"EmployeeComp.LeaveEncash"))+G(p(d+"EmployeeComp.LeaveTravelBenft"))+G(p(d+"EmployeeComp.ContToSuperAnnFund"))+G(p(d+"EmployeeComp.ContToPF"))+G(p(d+"EmployeeComp.ContToGratFund"))+G(p(d+"EmployeeComp.ContToOthFund"))+G(p(d+"EmployeeComp.OthEmpBenftExpdr")); /* O44 22xi = 22i..22x */
  St(p(d+"EmployeeComp.TotEmployeeComp"), empT);
  const insT=G(p(d+"Insurances.MedInsur"))+G(p(d+"Insurances.LifeInsur"))+G(p(d+"Insurances.KeyManInsur"))+G(p(d+"Insurances.OthInsur")); /* O52 23v = 23i..23iv */
  St(p(d+"Insurances.TotInsurances"), insT);
  const commT=G(p(d+"CommissionExpdrDtls.NonResOtherCompany"))+G(p(d+"CommissionExpdrDtls.Others")); St(p(d+"CommissionExpdrDtls.Total"),commT); /* O62 30iii */
  const royT=G(p(d+"RoyalityDtls.NonResOtherCompany"))+G(p(d+"RoyalityDtls.Others")); St(p(d+"RoyalityDtls.Total"),royT); /* O66 31iii */
  const profT=G(p(d+"ProfessionalConstDtls.NonResOtherCompany"))+G(p(d+"ProfessionalConstDtls.Others")); St(p(d+"ProfessionalConstDtls.Total"),profT); /* O70 32iii */
  const rtE=d+"RatesTaxesPays.ExciseCustomsVAT.";
  const rt44x=G(p(rtE+"UnionExciseDuty"))+G(p(rtE+"ServiceTax"))+G(p(rtE+"VATorSaleTax"))+G(p(rtE+"Cess"))+G(p(rtE+"CentralGoodServiceTax"))+G(p(rtE+"StateGoodServiceTax"))+G(p(rtE+"IntegratedGoodServiceTax"))+G(p(rtE+"UnionTerrGoodServiceTax"))+G(p(rtE+"OthDutyTaxCess")); /* O92 44x = 44i..44ix */
  St(p(rtE+"TotExciseCustomsVAT"), rt44x);
  const oExp=SUM(A(p(d+"OtherExpensesDtls")),"Amount"); St(p(d+"OtherExpenses"),oExp); /* O100 item 47 total */
  const bd1=SUM(A(p(d+"BadDebtDtls.BadDebtAmtDtls")),"Amount"); St(p(d+"BadDebtDtls.BadDebtAmtDtlsTotal"),bd1); /* H105 48i total */
  const bd2=SUM(A(p(d+"BadDebtDtls.OthersPANNotAvlblDtl")),"Amount"); St(p(d+"BadDebtDtls.OthersPANNotAvlblDtlTotal"),bd2); /* O111 48ii total */
  const badTot=bd1+bd2+G(p(d+"BadDebtDtls.OthersAmtLt1Lakh")); /* O114 48iv = 48i+48ii+48iii */
  St(p(d+"BadDebtDtls.BadDebt"), badTot);
  const debHeads=G(p(d+"Freight"))+G(p(d+"ConsumptionOfStores"))+G(p(d+"PowerFuel"))+G(p(d+"RentExpdr"))+G(p(d+"RepairsBldg"))+G(p(d+"RepairMach"))
    +empT+insT
    +G(p(d+"StaffWelfareExp"))+G(p(d+"Entertainment"))+G(p(d+"Hospitality"))+G(p(d+"Conference"))+G(p(d+"SalePromoExp"))+G(p(d+"Advertisement"))
    +commT+royT+profT
    +G(p(d+"HotelBoardLodge"))+G(p(d+"TravelExp"))+G(p(d+"ForeignTravelExp"))+G(p(d+"ConveyanceExp"))+G(p(d+"TelephoneExp"))+G(p(d+"GuestHouseExp"))+G(p(d+"ClubExp"))+G(p(d+"FestivalCelebExp"))+G(p(d+"Scholarship"))+G(p(d+"Gift"))+G(p(d+"Donation"))
    +rt44x+G(p(d+"AuditFee"))+G(p(d+"SalRemuneration"))+oExp+badTot+G(p(d+"ProvForBadDoubtDebt"))+G(p(d+"OthProvisionsExpdr")); /* item-51 subtractor: 16..21+22xi+23v+24..29+30iii+31iii+32iii+33..43+44x+45+46+47+48iv+49+50 */
  const pbidta=totCred-debHeads; /* O117 item 51 PBIDTA */
  St(p(d+"PBIDTA"), pbidta);
  const intT=G(p(d+"InterestExpdrtDtls.NonResOtherCompany"))+G(p(d+"InterestExpdrtDtls.Others"))+G(p(d+"InterestExpdrtDtls.ResPartners"))+G(p(d+"InterestExpdrtDtls.ResOthers")); /* O125 52iii = 52ia+52ib+52iia+52iib */
  St(p(d+"InterestExpdrtDtls.InterestExpdr"),intT);
  const pbt=pbidta-intT-G(p(d+"DepreciationAmort")); /* O127 item 54 = 51 − 52iii − 53 */
  St(p(d+"PBT"), pbt);
  const tp="DebitsToPL.TaxProvAppr.";
  const pat=pbt-G(p(tp+"ProvForCurrTax"))-G(p(tp+"ProvDefTax")); St(p(tp+"ProfitAfterTax"),pat); /* O131 item 57 = 54 − 55 − 56 */
  const avl=pat+G(p(tp+"BalBFPrevYr")); St(p(tp+"AmtAvlAppr"),avl); /* O133 item 59 = 57 + 58 */
  St(p(tp+"PartnerAccBalTrf"), avl-G(p(tp+"Appropriations.TrfToReserves"))); /* O135 item 61 = 59 − 60 */

  /* presumptive 44AD (62) */
  const ad62i=G(p("PersumptiveInc44AD.GrsTrnOverBank"))+G(p("PersumptiveInc44AD.GrsTotalTrnOverInCash"))+G(p("PersumptiveInc44AD.GrsTrnOverAnyOthMode")); St(p("PersumptiveInc44AD.GrsTrnOverOrReceipt"),ad62i); /* O142 62i = iA+iB+iC */
  const ad62ii=G(p("PersumptiveInc44AD.PersumptiveInc44AD6Per"))+G(p("PersumptiveInc44AD.PersumptiveInc44AD8Per")); St(p("PersumptiveInc44AD.TotPersumptiveInc44AD"),ad62ii); /* O146 62ii = iiA+iiB */
  /* presumptive 44ADA (63) */
  const ada63i=G(p("PersumptiveInc44ADA.GrsTrnOverBank44ADA"))+G(p("PersumptiveInc44ADA.GrsTotalTrnOverInCash44ADA"))+G(p("PersumptiveInc44ADA.GrsTrnOverAnyOthMode44ADA")); St(p("PersumptiveInc44ADA.GrsReceipt"),ada63i); /* O155 63i = iA+iB+iC */
  const ada63ii=G(p("PersumptiveInc44ADA.TotPersumptiveInc44ADA")); /* 63ii typed (>=50% of 63i) */
  /* presumptive 44AE (64): per-carriage income Rs.1000/ton/month if >12MT else Rs.7500/month */
  const goods=A(p("GoodsDtlsUs44AE")); let aeMonths=0, aeInc=0;
  goods.forEach((r,i)=>{const t=N(r.TonnageCapacity),m=N(r.HoldingPeriod);
    const pi=t>12?Math.round(1000*t*m):Math.round(7500*m); /* col 5 */
    set("pl."+p("GoodsDtlsUs44AE")+"."+i+".PresumptiveIncome", R(pi));
    aeMonths+=m; aeInc+=pi;});
  St(p("TotalNumOfMonths"), aeMonths);           /* I172 total col 4 (<=120) */
  St(p("TotalPrsumptvIncUs44EGoods"), aeInc);    /* J172 total col 5 */
  St(p("TotalPrsumptvIncGCUs44E"), aeInc);       /* O175 64ii */
  const ae64iv=Math.max(0, aeInc-G(p("SalRemrtnToPartnerFirm"))); St(p("TotalPrsumptvIncUs44E"), ae64iv); /* O177 64iv = MAX(0, 64ii − 64iii) */
  /* no-account (65) */
  St(p("NoBooksOfAccPL.GrossReceipt"), G(p("NoBooksOfAccPL.GrsRcptAccPayeeOrBankMode"))+G(p("NoBooksOfAccPL.GrsRcptOtherMode"))); /* O180 65(i)a = a1+a2 */
  const nbBus=Math.max(0, G(p("NoBooksOfAccPL.GrossProfit"))-G(p("NoBooksOfAccPL.Expenses"))); St(p("NoBooksOfAccPL.NetProfit"),nbBus); /* O185 65(i)d = MAX(0, b − c) */
  St(p("NoBooksOfAccPL.GrossReceiptPrf"), G(p("NoBooksOfAccPL.GrsRcptAccPayeeOrBankModePrf"))+G(p("NoBooksOfAccPL.GrsRcptOtherModePrf"))); /* O187 65(ii)a */
  const nbPrf=Math.max(0, G(p("NoBooksOfAccPL.GrossProfitPrf"))-G(p("NoBooksOfAccPL.ExpensesPrf"))); St(p("NoBooksOfAccPL.NetProfitPrf"),nbPrf); /* O192 65(ii)d */
  const nbTot=nbBus+nbPrf; St(p("NoBooksOfAccPL.TotBusinessProfession"),nbTot); /* O193 65 total */
  /* speculative (66) */
  const specNet=G(p("GrossProfit"))-G(p("Expenditure")); St(p("NetIncomeFrmSpecActivity"),specNet); /* O197 66iv = 66ii − 66iii */
  /* non-resident (67) */
  const nrArr=A(p("NonResidentPLDetails"));
  const nrGross=SUM(nrArr,"GrossReceipt"), nrNet=SUM(nrArr,"NetProfit");
  St(p("NonResidentPL.GrossReceipt"), nrGross); /* O199 67a = SUM(ai..av) */
  St(p("NonResidentPL.NetProfit"), nrNet);      /* O205 67b = SUM(bi..bv) */

  /* ================= feeds & head roll-up =================
     PGBP head is computed in Schedule BP (section "bp"); pl contributes 0
     directly so GTI is not double-counted. The feeds bp/checks consume: */
  S.C.pl={
    income:0,
    costOfGoodsPrdcd:R(mCOGP),                 /* Mfg item 3 -> Trading item 11 */
    factoryDepreciation:R(G("mfg.OpeningInventory.DeprctnOfFactoryMachinery")), /* 1Evi -> BP depreciation check */
    grossProfitTrading:R(tGP),                 /* Trading item 12 */
    grossProfitTransfPL:R(gpTr),               /* P&L item 13 */
    pbidta:R(pbidta),                          /* P&L item 51 */
    pbt:R(pbt),                                /* P&L item 54 (net profit before tax) */
    depreciationPL:R(G(p(d+"DepreciationAmort"))), /* P&L 53 -> BP Sl.11 */
    salRemPartner:R(G(p(d+"SalRemuneration"))),    /* item 46 -> Part A-General-2 remuneration tie (with 64iii) */
    salRem44AE:R(G(p("SalRemrtnToPartnerFirm"))),  /* item 64iii */
    presAD:R(ad62ii), presADA:R(ada63ii), presAE:R(ae64iv), /* BP 35(i)/(ii)/(iii) */
    presADturnover:R(ad62i), presADAreceipt:R(ada63i),
    capAD:R(_plCapAD(G(p("PersumptiveInc44AD.GrsTrnOverBank")),G(p("PersumptiveInc44AD.GrsTotalTrnOverInCash")),G(p("PersumptiveInc44AD.GrsTrnOverAnyOthMode")))),
    capADA:R(_plCapADA(G(p("PersumptiveInc44ADA.GrsTrnOverBank44ADA")),G(p("PersumptiveInc44ADA.GrsTotalTrnOverInCash44ADA")),G(p("PersumptiveInc44ADA.GrsTrnOverAnyOthMode44ADA")))),
    specTurnover:R(G(p("TurnverFrmSpecActivity"))), specNet:R(specNet),
    nrGross:R(nrGross), nrNet:R(nrNet),
    noBooksProfit:R(nbTot)                      /* 65 total */
  };
}

/* helper: does an object subtree carry any nonzero number / any array row? */
function _plHas(o){
  if(o==null)return false;
  if(Array.isArray(o))return o.length>0;
  if(typeof o==="object")return Object.keys(o).some(k=>_plHas(o[k]));
  if(typeof o==="number")return R(o)!==0;
  return st0(o)!=="";
}

/* ================================================================
   secPl — renderer. Three faces:
     (1) regular-books P&L (Manufacturing + Trading + items 13-61),
     (2) presumptive (62/63/64),
     (3) no-account / speculative / non-resident (65/66/67).
   Every live book row -> a field; every computed cell -> cell().
   No item is regime-closed (accounting figures are the same in both), so
   there is no isNew() gating anywhere here.
   ================================================================ */
function secPl(){
  const B=S.pl, V=p=>N(get("pl."+p));
  /* defensive: guarantee containers/arrays the renderer reads */
  _plFillMissing(B,_plState());
  const ri=(l,pth,ref,o)=>{o=o||{};return row(l,inp("pl."+pth,{n:1}),{ref:ref,ind:o.ind,hint:o.hint,req:o.req,cls:o.cls});};
  const rc=(l,pth,ref,o)=>{o=o||{};return row(l,cell(V(pth)),{ref:ref,ind:o.ind,cls:o.cls||"tot",hint:o.hint});};
  const rsel=(l,pth,opts,ref,o)=>{o=o||{};return row(l,sel("pl."+pth,opts,{blank:o.blank}),{ref:ref,req:o.req,hint:o.hint});};
  let h="";
  h+=formNote("Part A accounts are the business/profession statements. Fill the Manufacturing, "+
    "Trading and Profit &amp; Loss accounts where regular books are maintained (mandatory if liable "+
    "to audit u/s 44AB or 92E, or liable to maintain accounts u/s 44AA); otherwise use the "+
    "presumptive faces (62-64) or the no-account rows (65). These figures feed Schedule BP, which "+
    "computes the business head.");

  /* ---- Face 1a — Manufacturing Account (items 1-3) ---- */
  let m="";
  m+=sub("1 — Debits to the Manufacturing Account");
  m+=ri("Opening stock of raw material","mfg.OpeningInventory.OpngStckRawMat","1Ai");
