<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YUKTI Tax Compliance — ITR-2, A.Y. 2026-27</title>
<style>
:root{
  --maroon:#7A1F2B; --maroon-d:#5C1720; --maroon-w:#F6EBEC;
  --white:#FFFFFF; --bone:#F5F4F1; --rule:#DCDCD6; --rule-2:#EDEBE6;
  --ink:#16161A; --ink-2:#4A4A52; --ink-3:#7C7C86;
  --red:#C0392B; --green:#1C5D4A; --green-w:#E9F1EE;
  --sienna:#9C4A15; --sienna-w:#FAEFE6;
  --field:#FFFEF9; --field-b:#C9C3AD; --closed:#F0EFEB;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"SF Mono",Consolas,"DejaVu Sans Mono",monospace;
  --rail:268px; --top:52px; --band:54px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bone);color:var(--ink);font:13.5px/1.45 var(--sans);
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--maroon);outline-offset:1px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* masthead — three things and nothing else */
.top{position:fixed;inset:0 0 auto 0;height:var(--top);z-index:60;background:var(--maroon);
  color:#fff;display:flex;align-items:center;gap:26px;padding:0 20px;
  border-bottom:2px solid var(--maroon-d)}
.top .b{font:600 19px/1 var(--serif);letter-spacing:.3px;white-space:nowrap}
.top .b em{font-style:normal;opacity:.64;font-size:12.5px;font-family:var(--sans);
  font-weight:400;margin-left:9px}
.top .frm{font:600 17px/1 var(--serif)}
.top .y{font-size:13px;opacity:.76;white-space:nowrap}
.top .sp{flex:1}
.tbtn{height:28px;padding:0 13px;white-space:nowrap;border:1px solid rgba(255,255,255,.42);border-radius:3px;
  font-size:12.5px;font-weight:500}
.tbtn:hover{background:rgba(255,255,255,.14)}
.tbtn.solid{background:#fff;color:var(--maroon);border-color:#fff;font-weight:600}
.tbtn.solid:hover{background:#F0E2E4}

/* index rail */
.rail{position:fixed;top:var(--top);bottom:var(--band);left:0;width:var(--rail);z-index:40;
  background:var(--bone);border-right:1px solid var(--rule);overflow-y:auto;padding:10px 0 20px}
.rail h2{font:500 10.5px/1 var(--sans);color:var(--ink-3);letter-spacing:.7px;padding:9px 18px 8px}
.nv{display:block;width:100%;text-align:left;padding:8px 16px 8px 15px;
  border-left:3px solid transparent;position:relative}
.nv:hover{background:#ECEAE5}
.nv.on{background:var(--white);border-left-color:var(--maroon)}
.nv .t{display:block;font:600 13.5px/1.25 var(--serif)}
.nv.on .t{color:var(--maroon)}
.nv .s{display:block;font-size:11px;color:var(--ink-3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nv .s.done{color:var(--green)} .nv .s.bad{color:var(--red);font-weight:600}

/* the sheet */
.wrap{position:absolute;top:var(--top);left:var(--rail);right:0;bottom:var(--band);
  overflow-y:auto;background:var(--bone)}
.sheet{max-width:1080px;margin:0 auto;padding:22px 26px 70px}

/* a section: maroon bar that opens and shuts */
section{background:var(--white);border:1px solid var(--rule);border-radius:3px;
  margin:0 0 14px;overflow:hidden;scroll-margin-top:14px}
.bar{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--maroon);color:#fff;padding:10px 14px}
.bar:hover{background:#8B2532}
.bar .cv{width:17px;height:17px;flex:none;border:1px solid rgba(255,255,255,.5);
  border-radius:2px;font-size:12px;line-height:15px;text-align:center}
.bar .t{font:600 15px/1.2 var(--serif);flex:1}
.bar .r{font-size:11.5px;opacity:.72;flex:none}
.bar .v{font:600 14px/1 var(--mono);flex:none;margin-left:14px}
.body{display:none;padding:4px 0 10px}
.body.open{display:block}

/* rows */
.r{display:flex;align-items:center;min-height:33px;border-bottom:1px solid var(--rule-2);
  padding:0 14px;gap:9px}
.r:hover{background:#FBFAF8}
.r.sub{background:#F7F6F3;min-height:28px}
.r.sub .l{font-weight:600;font-size:12px;color:var(--ink-2)}
.r.tot{border-top:1px solid var(--ink);border-bottom:2px solid var(--ink);background:#F7F6F3}
.r.tot .l,.r.tot .v{font-weight:700}
.r.grand{background:var(--maroon-w);border-top:1px solid var(--maroon);
  border-bottom:2px solid var(--maroon)}
.r.grand .l,.r.grand .v{font-weight:700;color:var(--maroon-d)}
.r.closed{background:var(--closed);opacity:.72}
.l{flex:1;min-width:0;padding:5px 0;font-size:13.5px}
.l.req{color:var(--red);font-weight:600}
.l .i1{padding-left:20px;display:inline-block}
.l .hint{color:var(--ink-3);font-size:11px;font-weight:400;margin-left:7px}
.ref{flex:none;width:52px;font-size:11px;color:var(--ink-3);font-family:var(--serif)}
.v{flex:none;width:160px;text-align:right}
.v2{flex:none;width:150px;text-align:right}
.hd2{font-size:10.5px;color:var(--ink-3);font-weight:600}

/* fields */
.f{width:100%;height:27px;padding:0 7px;border:1px solid var(--field-b);border-radius:2px;
  background:var(--field);font-size:13.5px}
.f:focus{border-color:var(--maroon);background:#fff}
.f.n{text-align:right;font-family:var(--mono);font-size:13px}
.f.over{background:var(--sienna-w);border-color:#D8B492;color:var(--sienna)}
.f[disabled]{background:var(--closed);color:var(--ink-3);cursor:not-allowed}
select.f{padding:0 4px;cursor:pointer}
.c{display:block;font-family:var(--mono);font-size:13px;color:var(--green);
  padding:5px 7px 5px 0;font-weight:600}
.c.zero{color:#B4B4BB;font-weight:400} .c.neg{color:var(--red)}
.dt{font-size:10.5px;color:var(--ink-3);display:block;text-align:right;margin-top:1px}

/* optional card */
.card{margin:8px 14px;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.card .ch{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 12px;background:#FAF9F6}
.card .ch:hover{background:#F3F1EC}
.card.on .ch{background:var(--maroon-w);border-bottom:1px solid var(--rule)}
.card .ch .sw{width:34px;height:18px;flex:none;border-radius:9px;background:#CFCCC4;
  position:relative;transition:background .12s}
.card.on .ch .sw{background:var(--maroon)}
.card .ch .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;
  border-radius:50%;background:#fff;transition:left .12s}
.card.on .ch .sw::after{left:18px}
.card .ch .t{flex:1;font:600 13px/1.2 var(--serif)}
.card .ch .st{font-size:11.5px;color:var(--ink-3);flex:none}
.card.on .ch .st{color:var(--maroon-d);font-weight:600;font-family:var(--mono)}
.card .cb{display:none;padding:4px 0 8px} .card.on .cb{display:block}

/* tables */
.gt{width:100%;border-collapse:collapse;margin:4px 0}
.gt th{font-size:10.5px;font-weight:600;color:var(--ink-2);text-align:right;padding:6px 7px;
  border-bottom:1px solid var(--ink);white-space:nowrap}
.gt th.l,.gt td.l{text-align:left}
.gt th.req{color:var(--red)}
.gt td{padding:2px 4px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
.gt td.num{padding:5px 7px;text-align:right}
.gt tfoot td{border-top:1px solid var(--ink);border-bottom:2px solid var(--ink);
  background:#F7F6F3;font-weight:700;padding:6px 7px;text-align:right}
.gt tfoot td.l{text-align:left}
.gt .x{width:28px;text-align:center}
.gt .x button{color:var(--ink-3);font-size:15px;line-height:1;padding:2px 5px;border-radius:2px}
.gt .x button:hover{background:var(--maroon-w);color:var(--maroon)}
.gt .f{height:25px}
.full{overflow-x:auto;padding:0 14px}
.add{margin:5px 14px 2px;height:27px;padding:0 13px;border:1px solid var(--maroon);
  border-radius:3px;color:var(--maroon);font-size:12.5px;font-weight:600;background:#fff}
.add:hover{background:var(--maroon);color:#fff}
.emp{padding:13px 6px;color:var(--ink-3);font-size:12.5px;font-style:italic}

/* property block */
.blk{margin:8px 14px;border:1px solid var(--rule);border-radius:3px}
.blk .bh{display:flex;align-items:center;gap:6px;padding:0 8px 0 0;background:#FAF9F6;
  border-bottom:1px solid var(--rule)}
.blk .bhx{flex:1;display:flex;align-items:center;gap:10px;padding:8px 12px;text-align:left;
  background:none;border:0;cursor:pointer;font:inherit}
.blk .bhx:hover{background:#F1EFEA}
.blk .cv2{width:16px;height:16px;flex:none;border:1px solid var(--rule);border-radius:2px;
  font-size:12px;line-height:14px;text-align:center;color:var(--ink-3)}
.blk .blkdel{flex:none;color:var(--ink-3);padding:6px 8px;border-radius:3px;cursor:pointer}
.blk .blkdel:hover{background:var(--maroon-w);color:var(--maroon)}
.blk .bh .t{flex:1;font:600 13px/1.2 var(--serif)}
.blk .bh .s{font-size:11.5px;color:var(--ink-3)}
.blk .bb{display:none;padding:2px 0 6px} .blk.on .bb{display:block}

/* notes and checks */
.note{border-left:3px solid var(--rule);padding:9px 13px;margin:9px 14px;font-size:12.5px;
  color:var(--ink-2);background:#FAF9F6;max-width:74ch}
.note.warn{border-left-color:var(--sienna);background:var(--sienna-w);color:#6B3410}
.note.stop{border-left-color:var(--red);background:var(--maroon-w);color:var(--maroon-d)}
.note.form{border-left-color:var(--maroon);background:var(--maroon-w);color:var(--maroon-d)}
.note b{font-weight:600}
.cks{margin:10px 14px 4px;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.ck{padding:8px 12px;border-bottom:1px solid var(--rule-2);font-size:12.5px;display:flex;
  gap:10px;align-items:baseline}
.ck:last-child{border-bottom:0}
.ck b{flex:none;width:180px;font-weight:600} .ck span{flex:1}
.ck.err{border-left:3px solid var(--red);background:var(--maroon-w)} .ck.err b{color:var(--maroon-d)}
.ck.warn{border-left:3px solid var(--sienna);background:var(--sienna-w)} .ck.warn b{color:#6B3410}
.ck.ok{border-left:3px solid var(--green);background:var(--green-w)} .ck.ok b{color:var(--green)}

/* capital-gains nesting */
.cgband{background:var(--maroon);color:#fff;font:600 14px/1 var(--serif);padding:9px 14px;
  margin:14px 0 0;border-radius:3px 3px 0 0}
.cgsubband{font:600 12.5px/1 var(--serif);color:var(--maroon-d);background:var(--maroon-w);
  padding:8px 14px;margin:10px 0 0;border-left:3px solid var(--maroon)}
.cghead{border:1px solid var(--rule);border-top:0}
.cgh{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 14px;
  background:#F7F6F3;border:0;cursor:pointer;font:inherit;border-bottom:1px solid var(--rule)}
.cgh:hover{background:#F1EFEA}
.cght{flex:1;font:600 13.5px/1.2 var(--serif)}
.cghv{font:600 14px/1 var(--mono);color:var(--green)}
.cghb{display:none;padding:2px 0 8px} .cghb.open{display:block}
.sub2{margin:6px 14px;border:1px solid var(--rule-2);border-radius:3px;overflow:hidden}
.s2h{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 11px;
  background:#FBFAF8;border:0;cursor:pointer;font:inherit}
.s2h:hover{background:#F4F2EC}
.sub2.on .s2h{background:var(--maroon-w);border-bottom:1px solid var(--rule-2)}
.cv3{width:15px;height:15px;flex:none;border:1px solid var(--rule);border-radius:2px;
  font-size:11px;line-height:13px;text-align:center;color:var(--ink-3)}
.s2ref{flex:none;width:34px;font:600 11px/1 var(--serif);color:var(--ink-3)}
.s2t{flex:1;font-size:13px}
.s2v{font-size:11.5px;color:var(--ink-3)}
.sub2.on .s2v{color:var(--maroon-d);font-family:var(--mono)}
.s2b{display:none;padding:2px 0 6px} .s2b.open{display:block}

/* the band */
.band{position:fixed;left:0;right:0;bottom:0;height:var(--band);z-index:60;
  background:var(--maroon);color:#fff;display:flex;align-items:center;padding:0 18px;
  border-top:2px solid var(--maroon-d)}
.m{flex:none;padding-right:22px;margin-right:22px;border-right:1px solid rgba(255,255,255,.22)}
.m:last-of-type{border-right:0}
.m span{display:block;font-size:10.5px;color:rgba(255,255,255,.66);margin-bottom:1px;white-space:nowrap}
.m b{display:block;font:600 16px/1.1 var(--mono);white-space:nowrap}
.m.pay b{color:#FFD9A0} .m.ref b{color:#A8E6C9}
.gap{flex:1}
.st{font-size:11.5px;color:rgba(255,255,255,.82);text-align:right;line-height:1.35;white-space:nowrap}
.st b{color:#fff}
.st a{color:#FFD9A0;cursor:pointer;text-decoration:underline}
@media(max-width:900px){:root{--rail:0px}.rail{display:none}.sheet{padding:16px 12px 60px}}
</style></head><body>

<header class="top">
  <div class="b">YUKTI<em>Tax Compliance</em></div>
  <div class="frm" id="frm">ITR-X</div>
  <div class="y" id="ay">A.Y. 2026-27</div>
  <div class="sp"></div>
  <button class="tbtn" id="b_open">Open file</button>
  <button class="tbtn" id="b_save">Save file</button>
  <button class="tbtn solid" id="b_json">Export return</button>
</header>

<main class="wrap" id="wrap"><div class="sheet" id="sheet"></div></main>

<footer class="band">
  <div class="m"><span>Gross total income</span><b id="s_gti">—</b></div>
  <div class="m"><span>Total income</span><b id="s_ti">—</b></div>

</footer>

/* =====================================================================
   Phase 4 registry — every section self-registers here, so section
   files never edit a shared file. Load order (assemble globs *.js):
   00_form < 08_registry < 10_state < 20_engine_<id> < 30_sec_<id>
   < 40_exp_<id> < 50_imp_<id> < 55_chk_<id> < 90_wiring.
   Section files run reg({...}) at load; 90_wiring consumes the arrays.
   ===================================================================== */
const _SECREG=[];            /* {id,t,ref,f,s,eng,exp,imp,chk,order} */
/* screen order from books/ITR-4/structure.md — SECS is sorted by this */
const SCREEN_ORDER=["who","ret","inc","hp","ded","tax","paid","bank"];

   duplicate-writer grep (which scans `put(x,"key"`) does not false-flag the same
   leaf key written onto different array elements/blocks. Real full-path stale
   writes onto j still use put() and are still checked. */
function pf(o,p,v){return put(o,p,v);}

   each calling ruleset(fn). runRules() runs them all with its A/Dd collectors, so

const _RULEBATCHES=[];
function ruleset(fn){_RULEBATCHES.push(fn);}

  /* ---- Taxes paid / TDS / TCS / IT consistency ---- */
  A(54, REQ(N(RG(I,"TaxComputation.TotTaxPlusIntrstPay",0)),
            N(RG(I,"TaxComputation.NetTaxLiability",0))
            + N(RG(I,"TaxComputation.IntrstPay.IntrstPayUs234A",0))
            + N(RG(I,"TaxComputation.IntrstPay.IntrstPayUs234B",0))
            + N(RG(I,"TaxComputation.IntrstPay.IntrstPayUs234C",0))
            + N(RG(I,"TaxComputation.IntrstPay.LateFilingFee234F",0))
            + N(RG(I,"TaxComputation.IntrstPay.FeeFurnish234I",0)), 2),

  A(111, TCS.every(function(r){ return N(r.AmtTCSClaimedThisYear) <= N(r.TotalTCS) + 1; }),
    "In Schedule TCS, the amount of TCS claimed this year cannot exceed the tax collected.");

  A(120, REQ(N(RG(I,"ScheduleTDS3Dtls.TotalTDS3Details",0)), RSUM(TDS3,"TDSClaimed"), 1),
    "In Schedule TDS3, the total of TDS credit claimed this year must equal the sum of the individual rows.");

  A(126, REQ(N(RG(I,"TaxPaid.TaxesPaid.TDS",0)),
             N(RG(I,"TDSonSalaries.TotalTDSonSalaries",0))
             + N(RG(I,"TDSonOthThanSals.TotalTDSonOthThanSals",0))
             + N(RG(I,"ScheduleTDS3Dtls.TotalTDS3Details",0)), 2)
     && REQ(N(RG(I,"TaxPaid.TaxesPaid.AdvanceTax",0)) + N(RG(I,"TaxPaid.TaxesPaid.SelfAssessmentTax",0)),

             Math.round(Math.max(0, N(RG(I,"TaxComputation.TotTaxPlusIntrstPay",0)) - N(RG(I,"TaxPaid.TaxesPaid.TotalTaxesPaid",0)))/10)*10, 1),
    "Amount of tax payable is inconsistent with the difference of Total Tax, Fee and Interest and Total Taxes Paid.");

  A(132, REQ(N(RG(I,"TaxPaid.TaxesPaid.TCS",0)), N(RG(I,"ScheduleTCS.TotalSchTCS",0)), 1),
    "Total TCS claimed in the Tax Paid schedule must equal the total TCS claimed in Schedule TCS.");

  /* ---- New-regime (115BAC) closures ---- */
  A(189, !isNew() || N(RG(I,"Schedule80C.TotalAmt",0))===0,
    "Under the new tax regime, deductions u/s 80C/80CCC/80CCD(1) must be zero.");

  A(195, !isNew() || N(RG(I,"IncomeDeductions.ProfessionalTaxUs16iii",0))===0,
    "Under the new tax regime, professional tax u/s 16(iii) must be zero.");

  A(198, !isNew() || AL.every(function(r){ return r.SalNatureDesc!=="10(5)" || N(r.SalOthAmount)===0; }),
    "Under the new tax regime, Sec 10(5) leave travel concession must be zero.");

  A(201, !isNew() || AL.every(function(r){ return r.SalNatureDesc!=="10(14)(ii)" || N(r.SalOthAmount)===0; }),
    "Under the new tax regime, Sec 10(14)(ii) prescribed allowances must be zero.");

      return RG(p,"ifLetOut","")!=="S" || N(RG(p,"Rentdetails.IntOnBorwCap",0))===0;
    }),
    "Under the new tax regime, interest on borrowed capital for a self-occupied house property must be zero.");

  A(210, !isNew() || N(RG(I,"Schedule80EEB.TotalInterest80EEB",0))===0,
    "Under the new tax regime, deduction u/s 80EEB must be zero.");
});

/* ===================================================================
   Schedule 80D engine — self/family and parents, non-senior/senior blocks;
   ₹25,000 / ₹50,000 ceilings; ₹5,000 preventive-check-up cap shared across
   all; medical expenditure only for a senior citizen where no insurance is
   taken; overall eligible capped at ₹1,00,000 (C6). (Income_Details.md C6.)
   =================================================================== */
function engDed80D(){
  const d=S.ded.d80||{}; const g=k=>N(d[k]);
  const ins=k=>(d[k]||[]).reduce((s,r)=>s+N(r.amt),0);
  const aHI=ins("selfIns"),aPHC=g("selfPHC");
  const bHI=ins("selfSrIns"),bPHC=g("selfSrPHC"),bMed=g("selfSrMed");
  const cHI=ins("parIns"),cPHC=g("parPHC");
  const dHI=ins("parSrIns"),dPHC=g("parSrPHC"),dMed=g("parSrMed");
  const selfSr=d.selfSr==="Y",parSr=d.parSr==="Y";
  const selfClaim=d.selfSr!=="N/A",parClaim=d.parSr!=="N/A";
  let phcAll=5000; const take=v=>{const t=Math.min(v,phcAll);phcAll-=t;return t;}; /* ₹5,000 in all */
  const aPHCu=selfClaim&&!selfSr?take(aPHC):0, bPHCu=selfClaim&&selfSr?take(bPHC):0;
  const cPHCu=parClaim&&!parSr?take(cPHC):0, dPHCu=parClaim&&parSr?take(dPHC):0;
  const selfTot=selfClaim?(selfSr?Math.min(50000,bHI+bMed+bPHCu):Math.min(25000,aHI+aPHCu)):0;
  const parTot =parClaim?(parSr?Math.min(50000,dHI+dMed+dPHCu):Math.min(25000,cHI+cPHCu)):0;
  return {aHI:R(aHI),aPHC:R(aPHC),aPHCu:R(aPHCu),bHI:R(bHI),bPHC:R(bPHC),bPHCu:R(bPHCu),bMed:R(bMed),
    cHI:R(cHI),cPHC:R(cPHC),cPHCu:R(cPHCu),dHI:R(dHI),dPHC:R(dPHC),dPHCu:R(dPHCu),dMed:R(dMed),
    selfTot:R(selfTot),parTot:R(parTot),eligible:R(Math.min(100000,selfTot+parTot)),
    selfSr,parSr,selfClaim,parClaim};
}

/* Schedule 80G eligible amount — buckets A/B/C/D; a cash donation over ₹2,000
   gives no deduction (rule A108/A109); C & D subject to the 10%-of-GTI
   qualifying limit; A at 100%, B at 50%, C at 100% and D at 50%. */
function engDed80G(gtiLimit){
  const rows=S.ded.g80||[];
  const base=r=>N(r.other)+(N(r.cash)>2000?0:N(r.cash));   /* cash > ₹2,000 disallowed */
  let A=0,B=0,C=0,D=0,gross=0,cash=0,other=0;
  rows.forEach(r=>{const b=base(r);gross+=N(r.amt)||N(r.cash)+N(r.other);cash+=N(r.cash);other+=N(r.other);
    if(r.bucket==="A")A+=b; else if(r.bucket==="B")B+=b; else if(r.bucket==="C")C+=b; else if(r.bucket==="D")D+=b;});
  const ql=Math.max(0,R(0.1*Math.max(0,gtiLimit)));        /* qualifying limit for C + D */
  const cE=Math.min(C,ql), dPool=Math.max(0,ql-cE), dE=Math.min(D,dPool);
  const eligible=R(A + 0.5*B + cE + 0.5*dE);
  return {eligible,gross:R(gross),cash:R(cash),other:R(other)};
}

/* Schedule EA 10(13A) — HRA exemption. Old regime and salaried only (the
   sheet gates on bacValue=2 AND NatureofEmployment not "Not…").
   salary17 = Basic + DA [G7]; B = rent − 10% salary [G10];
   C = 50% (Metro) / 40% (Non-Metro) of salary [G11];
   eligible = min(HRA received, B, C) [G12]. */
function engDedHRA(){
  const h=S.ded.hra||{};
  const emp=st0((S.pi||{}).empcat||(S.fs||{}).empcat||"");
  const salaried=emp?!/^not/i.test(emp):true;               /* unknown → treat as salaried */
  const basic=N(h.basic),da=N(h.da);
  const sal=Math.max(0,basic+da);                            /* [G7] */
  const hraRcv=N(h.hraRecv),rent=N(h.rent);
  const B=Math.max(0,rent-R(sal*0.1));                       /* [G10] */
  const metro=st0(h.place)==="1";
  const C=R((metro?0.5:0.4)*sal);                            /* [G11] 50% metro / 40% non-metro */
  const gate=!isNew()&&salaried;                             /* closed under 115BAC */
  const eligible=gate&&(hraRcv||rent)?Math.max(0,Math.min(hraRcv,B,C)):0; /* [G12] */
  return {sal:R(sal),B:R(B),C:R(C),eligible:R(eligible),hraRcv:R(hraRcv),rent:R(rent),
    basic:R(basic),da:R(da),metro,gate,salaried};
}

/* ===================================================================
   engDed — build S.C.ded from S.ded.  Deductions do not add to GTI, so
   S.C.ded.income = 0.  S.C.ded.total is the ALLOWED Chapter VI-A total
   (regime-gated, clamped to GTI) that inccore subtracts for Total Income;
   S.C.ded.usr / S.C.ded.cap are the two schema objects (claimed / allowed)
   inccore writes into IncomeDeductions.  S.C.ded.hra feeds the salary
   10(13A) exempt allowance owned by inccore.
   =================================================================== */
function engDed(){
  const status=(S.pi||{}).status||"I";              /* I individual, H HUF, F firm(other than LLP) */
  const isHUF=status==="H", isFirm=status==="F", nonInd=status!=="I";
  const nri=(S.pi||{}).res!=="RES";

  /* best-effort GTI: sum of every income head inccore has posted (each as
     S.C.<head>.income) except this section. inccore (order 80) re-applies
     the authoritative cap on Total Income; this is only for the clamps. */
  let gtiEst=0; Object.keys(S.C||{}).forEach(k=>{if(k!=="ded"){const v=(S.C[k]||{}).income;if(typeof v==="number")gtiEst+=v;}});
  gtiEst=R(gtiEst); const gtiLimit=Math.max(0,gtiEst);   /* GTI (incl. LTCG 112A) ceiling [#95] */

  const d80=engDed80D(); S.C.d80=d80;
  const g80=engDed80G(gtiLimit); S.C.g80=g80;
  const hra=engDedHRA(); S.C.hra=hra;
  const et=k=>(S.ded.e80[k]||[]).reduce((s,r)=>s+N(r.interest),0);
  const ggc=(S.ded.ggc||[]).reduce((s,r)=>s+(r.mode==="CASH"?0:N(r.amt)),0); /* cash 80GGC gives none */

  /* claimed amount per VI-A letter (fed from a sub-schedule where one exists) */
  const fed={
    c80c:(S.ded.c80c||[]).length?(S.ded.c80c||[]).reduce((s,r)=>s+N(r.amt),0):N(S.ded.v.c80c),
    c80ccc:(S.ded.pen80ccc||[]).length?(S.ded.pen80ccc||[]).reduce((s,r)=>s+N(r.amt),0):N(S.ded.v.c80ccc),
    c80d:d80.eligible, c80dd:N(S.ded.dd80.amt), c80u:N(S.ded.u80.amt),
    c80e:et("e"), c80ee:et("ee"), c80eea:et("eea"), c80eeb:et("eeb"),
    c80g:g80.eligible, c80ggc:ggc};
  const claim=k=>fed[k]!==undefined?N(fed[k]):N(S.ded.v[k]);

  const out={},why={},allow=k=>!isNew()||D4_VIA_NEW.indexOf(k)>=0;
  D4_VIA.forEach(x=>{const k=x[0],cap=x[3]; let c=claim(k);
    /* claimant-dependent statutory caps (fixed-sum for 80DD/80U) */
    if(k==="c80dd"&&c){const cp=(S.ded.dd80||{}).nature==="2"?125000:75000;if(c>cp){why[k]="fixed at "+RS(cp);}c=Math.min(c,cp);}
    if(k==="c80u"&&c){const cp=(S.ded.u80||{}).nature==="2"?125000:75000;if(c>cp){why[k]="fixed at "+RS(cp);}c=Math.min(c,cp);}
    if(k==="c80ddb"&&c){const cp=(S.ded.v.ddb_type==="2")?100000:40000;if(c>cp){why[k]="capped at "+RS(cp);}c=Math.min(c,cp);} /* ₹40,000 / ₹1,00,000 senior */
    /* entity restrictions (Income_Details.md / rules A20/A23/A24/A26/A27/A28/A31/A32/A43) */
    if(k==="c80ccc"&&isFirm&&c){why[k]="a firm cannot claim 80CCC";c=0;}
    if(k==="c80ccd1"&&nonInd&&c){why[k]="only an individual can claim 80CCD(1)";c=0;}
    if(k==="c80ccd1b"&&nonInd&&c){why[k]="only an individual can claim 80CCD(1B)";c=0;}
    if(k==="c80c"&&isFirm&&c){why[k]="a firm cannot claim 80C";c=0;}
    if(k==="c80d"&&isFirm&&c){why[k]="a firm cannot claim 80D";c=0;}
    if(k==="c80dd"&&isFirm&&c){why[k]="a firm cannot claim 80DD";c=0;}
    if(k==="c80ddb"&&isFirm&&c){why[k]="a firm cannot claim 80DDB";c=0;}
    if((k==="c80ee")&&(isHUF||isFirm)&&c){why[k]="80EE cannot be claimed by a HUF or firm";c=0;}
    if(k==="c80u"&&(isHUF||isFirm)&&c){why[k]="80U cannot be claimed by a HUF or firm";c=0;}
    if(k==="c80ccd2"&&(isHUF||isFirm)&&c){why[k]="80CCD(2) cannot be claimed by a HUF or firm";c=0;}
    if(!allow(k)){out[k]=0;why[k]=c?"closed by section 115BAC":(why[k]||"");return;}
    if(cap&&c>cap&&!why[k]){why[k]="capped at "+RS(cap);c=cap;}
    else if(cap&&c>cap)c=cap;
    out[k]=R(c);});

  /* 80C + 80CCC + 80CCD(1) share the ₹1,50,000 ceiling (rule A21) */
  const cce=out.c80c+out.c80ccc+out.c80ccd1;
  if(cce>150000){const f=150000/cce;out.c80c=R(out.c80c*f);out.c80ccc=R(out.c80ccc*f);
    out.c80ccd1=Math.max(0,150000-out.c80c-out.c80ccc);
    why.c80c=(why.c80c?why.c80c+", ":"")+"80C, 80CCC and 80CCD(1) together stop at ₹1,50,000";}

  /* 80CCD(1) not more than 20% of GTI (rule A22/A23) */
  if(out.c80ccd1){const cp=R(0.2*gtiLimit);if(gtiLimit>0&&out.c80ccd1>cp){why.c80ccd1=(why.c80ccd1?why.c80ccd1+", ":"")+"limited to 20% of gross total income = "+RS(cp);out.c80ccd1=cp;}}

  /* 80CCD(2) employer limit — 14% of salary (CG/SG) else 10% (rules A25/A47) */
  if(out.c80ccd2){const base=R(((S.C||{}).sal||{}).basicDA||((S.C||{}).inc||{}).basicDA||0);
    if(base>0){const emp=st0((S.pi||{}).empcat||"");const govt=/^CG|^SG|^CGOV|^SGOV|Central|State/i.test(emp);
      const cp=R((govt?0.14:0.10)*base);
      if(out.c80ccd2>cp){why.c80ccd2="limited to "+(govt?"14%":"10%")+" of salary = "+RS(cp);out.c80ccd2=cp;}}}

  /* 80TTA / 80TTB — mutually exclusive, and restricted to interest earned
     (rules A38/A39/A40/A41). 80TTB only for a resident senior citizen. */
  const os={sav:R(((S.C||{}).os||{}).sav||((S.C||{}).inc||{}).savInt||0),
            dep:R(((S.C||{}).os||{}).dep||((S.C||{}).inc||{}).depInt||0)};
  if(senior()){if(out.c80tta){why.c80tta="a senior citizen claims 80TTB instead";out.c80tta=0;}}
  else if(out.c80ttb){why.c80ttb="80TTB is only for a resident senior citizen";out.c80ttb=0;}
  if(isHUF||isFirm){if(out.c80ttb){why.c80ttb="80TTB cannot be claimed by a HUF or firm";out.c80ttb=0;}}
  if(out.c80tta&&os.sav>0&&out.c80tta>os.sav){why.c80tta="limited to the savings-bank interest";out.c80tta=os.sav;}
  if(out.c80ttb&&(os.sav+os.dep)>0&&out.c80ttb>os.sav+os.dep){why.c80ttb="limited to the interest earned";out.c80ttb=R(os.sav+os.dep);}

  /* a non-resident cannot claim 80DD / 80DDB / 80U / 80TTB */
  if(nri){["c80dd","c80ddb","c80u","c80ttb"].forEach(k=>{if(out[k]){why[k]="not available to a non-resident";out[k]=0;}});}

  /* totals — the raw claimed sum, and the allowed sum clamped to GTI (rule A19) */
  const keys=D4_VIA.map(x=>x[0]);
  const rawTotal=keys.reduce((a,k)=>a+R(out[k]||0),0);
  const allowed=Math.max(0,Math.min(rawTotal,gtiLimit));
  const clipped=rawTotal>gtiLimit;

  /* build the two schema objects inccore drops into IncomeDeductions.
     Under the new regime the claimed side carries only the surviving items. */
  const usr={},cap={},regOpen=k=>!isNew()||D4_VIA_NEW.indexOf(k)>=0;
  Object.keys(D4_MAP).forEach(k=>{const f=D4_MAP[k];const c=claim(k);
    if(c&&regOpen(k))usr[f]=n0(c);
    if(out[k])cap[f]=n0(out[k]);});
  /* 80CCH + any-other → AnyOthSec80CCH (cap ₹2,88,000) */
  const cchClaim=(regOpen("c80cch")?N(S.ded.v.c80cch):0)+(regOpen("c80oth")?N(S.ded.v.c80oth):0);
  const cchOut=n0(out.c80cch)+n0(out.c80oth);
  if(cchClaim)usr.AnyOthSec80CCH=n0(Math.min(cchClaim,288000));
  if(cchOut)cap.AnyOthSec80CCH=n0(Math.min(cchOut,288000));
  /* qualifier fields the UsrDeductUndChapVIA schema carries beside the amounts;
     only when the matching claim survives (all close under 115BAC). impDed reads
     each back, so writing them here is what makes the return round-trip. */
  if(usr.Section80CCD1B&&/^\d{12}$/.test(st0(S.ded.v.pran)))usr.PRANDtls=[{PRANNum:st0(S.ded.v.pran)}];
  if(usr.Section80DDB){if(st0(S.ded.v.ddb_type))usr.Section80DDBUsrType=st0(S.ded.v.ddb_type)==="2"?"2":"1";
    if(st0(S.ded.v.ddb_disease))usr.NameOfSpecDisease80DDB=st0(S.ded.v.ddb_disease);}
  if(usr.Section80GG&&/^\d{15}$/.test(st0(S.ded.v.ack10ba)))usr.Form10BAAckNum=st0(S.ded.v.ack10ba);
  if(usr.Section80CCC){const pc=(S.ded.pen80ccc||[]).filter(r=>N(r.amt)).map(r=>({
      TypeofIdentifier:r.type==="OTHPRAN"?"OTHPRAN":"PRAN",NameofIdentifier:(sv(r.id)||"NA").slice(0,125),Amount:n0(r.amt)}));
    if(pc.length)usr.PensionContribution80CCC=pc;}
  const usrTotal=keys.reduce((a,k)=>a+(regOpen(k)?R(claim(k)):0),0);
  usr.TotalChapVIADeductions=n0(usrTotal);
  cap.TotalChapVIADeductions=n0(allowed);

  S.C.ded={income:0,                 /* a deduction head contributes 0 to GTI */
    out,why,fed,usr,cap,
    total:R(allowed),                /* the number the contract names — allowed VI-A total */
    allowed:R(allowed),usrTotal:R(usrTotal),rawTotal:R(rawTotal),clipped,
    gtiEst,gtiLimit,conc:isNew(),
    hra:hra.eligible,hraD:hra};
}

  if(c80.length)j.Schedule80C={Schedule80CDtls:c80.map(r=>({Amount:n0(r.amt),IdentificationNo:(sv(r.id)||"NA").slice(0,50)})),

      Parents:n0(D8.parSr?0:D8.parTot),ParentsSeniorCitizen:n0(D8.parSr?D8.parTot:0),EligibleAmountOfDedn:n0(D8.eligible)};

    if(D8.aHI){blk.HealthInsPremSlfFam=n0(D8.aHI);const a=insArr("selfIns");if(a.length)blk.Sec80DSelfFamHIDtls={Sch80DInsDtls:a,TotalPayments:n0(D8.aHI)};}
    if(D8.aPHCu)blk.PrevHlthChckUpSlfFam=n0(D8.aPHCu);
    if(D8.bHI){blk.HlthInsPremSlfFamSrCtzn=n0(D8.bHI);const a=insArr("selfSrIns");if(a.length)blk.Sec80DSelfFamSrCtznHIDtls={Sch80DInsDtls:a,TotalPayments:n0(D8.bHI)};}

    TypeOfDisability:x.type==="2"?"2":"1",DeductionAmount:n0(out.c80dd),DependentType:st0(x.dep)||"1"};

/* =====================================================================
   ENGINE HELPERS — tax on the slabs (Finance Act 2025; see NOTE above)
   ===================================================================== */
function icAge(){                                  /* age at 31-Mar-2026 (shell YREND) */
  return (typeof age==="function")?age():0;
}
function icBrackets(brks,ti){                        /* progressive tax over [lo,hi,rate] triples */
  let t=0,prev=0;
  for(const b of brks){ const lim=b[0], rate=b[1];
    const seg=Math.max(0, Math.min(ti,lim)-prev);
    t+=seg*rate; prev=Math.max(prev,lim); }
  return R(t);
}
/* NEW regime 115BAC(1A), AY 2026-27 — individual & HUF, no age benefit */
function icTaxNew(ti){
  return icBrackets([[400000,0],[800000,0.05],[1200000,0.10],[1600000,0.15],
    [2000000,0.20],[2400000,0.25],[Infinity,0.30]], ti);
}
/* OLD regime — individual (age slab) / HUF (uses <60 basic exemption) */
function icTaxOld(ti){
  const a=icAge(); const status=S.pi.status||"I";
  let basic=250000;
  if(status==="I"){ if(a>=80)basic=500000; else if(a>=60)basic=300000; }
  return icBrackets([[basic,0],[500000,0.05],[1000000,0.20],[Infinity,0.30]], ti);
}

/* =====================================================================
   ENGINE — engInc(): all income heads → S.C.inc / S.C.hp (order 20)
   ===================================================================== */
function engInc(){
  const A={income:0};

  /* ---- Salary (Income_Details B1 salary rows H111–H135) ---- */
  const s1=N(IC.sal.s17_1), s2=N(IC.sal.s17_2), s3=N(IC.sal.s17_3);
  const gross=s1+s2+s3;                                             /* H111 (i)=ia+ib+ic */
  let exempt=0;
  (IC.sal.alw||[]).forEach(r=>{
    const nat=st0(r.nat), amt=N(r.amt);
    if(isNew() && ALW_CLOSED_NEW[nat]) return;                      /* rules #920/#990/#1000 — closed in new */
    exempt+=amt;
  });
  const netSal=Math.max(0, gross-exempt);                          /* H130 (iii) Net Salary = i − ii  [#320] */
  const stdDed = gross>0 ? Math.min(75000, netSal) : 0;            /* H132 16(ia) std ded, max 75000 (both regimes) */
  const ent = isNew()?0:Math.min(5000, N(IC.sal.ent));            /* H133 16(ii) — old regime only, max 5000 */
  const ptax= isNew()?0:Math.min(5000, N(IC.sal.ptax));          /* H134 16(iii) — old regime only, max 5000 */
  const ded16=stdDed+ent+ptax;                                    /* H131 (iv) = iva+ivb+ivc  [#325] */
  const incSal=Math.max(0, netSal-ded16);                         /* H135 (v) = iii − iv  [#330] */

  /* ---- Presumptive business/profession — Schedule BP → E8 (B1) ---- */
  const ad=IC.bp.ad||{};
  const e1a=N(ad.bank), e1b=N(ad.cash), e1c=N(ad.other);
  const e1=e1a+e1b+e1c;                                            /* [I19] E1 = a+b+c */
  const p6=R(0.06*e1a);                                            /* E2a 6% of E1a */
  const p8=R(0.08*(e1b+e1c));                                     /* E2b 8% of (E1b+E1c) */
  const e2a=Math.max(p6, N(ad.claim6));                            /* or amount claimed, whichever higher */
  const e2b=Math.max(p8, N(ad.claim8));
  const e2c=(e1>0)?(e2a+e2b):0;                                    /* [I26] E2c = a+b */

  const ada=IC.bp.ada||{};
  const e3a=N(ada.bank), e3b=N(ada.cash), e3c=N(ada.other);
  const e3=e3a+e3b+e3c;                                            /* [I37] E3 = a+b+c */
  const e4=(e3>0)?Math.max(R(0.50*e3), N(ada.claim)):0;           /* E4 = 50% of E3 or claimed, higher */

  let e5=0;                                                        /* [I65] E5 = Σ per-vehicle presumptive */
  (IC.bp.gcv||[]).forEach(v=>{ e5+=N(v.pi); });
  const e6=(S.pi.status==="F")?N(IC.bp.ae.salint):0;              /* E6 salary/interest to partners — firms only */
  const e7=Math.max(0, e5-e6);                                    /* [I71] E7 = max(0, E5 − E6) */
  const e8=Math.max(0, e2c+e4+e7);                               /* [I72] E8 = E2c + E4 + E7 = IncomeFromBusinessProf */

  /* ---- House property (HP.md; PropertyDetails[]) ---- */
  let hpHead=0; const hpCalc=[];
  (IC.hp||[]).forEach(p=>{
    const self=(p.let==="S");
    const a=self?0:N(p.gross);                                     /* a gross rent (nil if self-occupied) */
    const b=N(p.notReal);                                          /* b rent not realised */
    const c=self?0:N(p.localTax);                                  /* c local taxes — not allowed for self-occ [#305] */
    const d=b+c;                                                   /* d = b + c  [I28] */
    const e=Math.max(a-d,0);                                       /* e annual value = max(a−d,0)  [K29] */
    const share=(p.share===""||p.share==null)?100:N(p.share);
    const f=self?0:Math.max(0,R(share/100*e));                     /* f = share% × e  [K30] */
    const g=R(0.30*f);                                             /* g 30% of f  [I31] */
    let intr=0; (p.loans||[]).forEach(l=>{ intr+=N(l.intr); });    /* Σ Section24B InterestUs24B  [K41] */
    if(self||p.let==="D"){ intr=Math.min(intr,200000); }          /* not let out → cap 2 lakh (H73) */
    if(isNew() && self){ intr=0; }                                 /* new regime: self-occupied 24(b) closes */
    const totDed=g+intr;                                           /* i = g + h  [K42] */
    const j=N(p.arrears);                                          /* j arrears/unrealised less 30% */
    const k=f-totDed+j;                                            /* k = f − i + j  [K44] (may be negative) */
    hpHead+=k;
    hpCalc.push({a,b,c,d,e,f,g,intr,totDed,j,k,share});
  });
  /* [K87] head = max(-200000, Σk); new regime disallows HP loss set-off → floor 0 */
  hpHead = isNew() ? Math.max(0, hpHead) : Math.max(-200000, hpHead);

  /* ---- Other sources (B4) ---- */
  let osGross=0; const osCalc=[]; let famPension=0; let savInt=0; let depInt=0;
  (IC.os.rows||[]).forEach(r=>{
    let amt;
    if(r.nat==="DIV"){ amt=N(r.q1)+N(r.q2)+N(r.q3)+N(r.q4)+N(r.q5); }  /* dividend quarter split H163–H168 */
    else { amt=N(r.amt); }
    if(r.nat==="FAP") famPension+=amt;
    if(r.nat==="SAV") savInt+=amt;                                    /* savings-bank interest → 80TTA cap */
    if(r.nat==="IFD") depInt+=amt;                                    /* deposit interest → 80TTB cap */
    osGross+=amt; osCalc.push({amt});
  });
  /* F170 57(iia) family-pension deduction: old regime only; ≤ lower of 1/3 FP or 15,000 [#475/#480] */
  let ded57=0;
  if(!isNew() && famPension>0){ ded57=Math.min(N(IC.os.fp57), Math.round(famPension/3), 15000); if(ded57<0)ded57=0; }
  const incOS=Math.max(0, osGross-ded57);                          /* IncomeOthSrc */

  /* ---- LTCG u/s 112A not chargeable (D20a) — capped at 1,25,000 [I21] ---- */
  const ltSale=N(IC.ltcg.sale), ltCost=N(IC.ltcg.cost);
  const ltGain=Math.max(0, ltSale-ltCost);
  const long112a=(ltGain>125000)?0:ltGain;                          /* > 1.25L ⇒ report 0 (schema max 125000) */

  /* ---- roll into S.C ---- */
  A.salary=incSal; A.bp=e8; A.os=incOS; A.income=incSal+e8+incOS;
  A.ltcg112a=long112a;
  A.detail={ gross, exempt, netSal, stdDed, ent, ptax, ded16, incSal,
             e1,e1a,e1b,e1c,e2a,e2b,e2c, e3,e3a,e3b,e3c,e4, e5,e6,e7,e8,
             osGross, famPension, ded57, incOS, ltSale,ltCost,ltGain,long112a };
  S.C.inc=A;
  S.C.hp={ income:hpHead, calc:hpCalc };
  /* bases the Chapter VI-A engine (70_sec_ded.js) reads to clamp its caps:
     80CCD(2) → basicDA (the 17(1) salary, the closest proxy this form captures
     for basic+DA); 80TTA → savings-bank interest; 80TTB → deposit interest. */
  S.C.sal={ basicDA:s1 };
  S.C.os={ sav:savInt, dep:depInt };
}

/* =====================================================================
   ENGINE — engTax(): Part D roll-up → footer contract (order 80)
   ===================================================================== */
function engTax(){
  const inc=S.C.inc||{}, hp=S.C.hp||{};
  const salary=N(inc.salary), bp=N(inc.bp), os=N(inc.os), hpinc=N(hp.income);
  const ltcg=N(inc.ltcg112a);

  const gti = salary+bp+os+hpinc;                                  /* B5 GrossTotIncome (without LTCG112A) */
  const gtiInc = gti+ltcg;                                         /* GrossTotIncomeIncLTCG112A */
  let via = (S.C.ded||{}).total||0;                                /* Chapter VI-A, regime-gated by `ded` */
  via = Math.max(0, Math.min(via, Math.max(0,gtiInc)));            /* VI-A cannot exceed GTI [#95] */
  const ti = Math.max(0, gtiInc-via);                             /* C20 TotalIncome = B5 − C19  [#230] */

  /* slab base excludes the non-chargeable LTCG112A part */
  const base=Math.max(0, ti-ltcg);
  const status=S.pi.status||"I", resident=(S.pi.res||"RES")==="RES";
  let d1;                                                          /* D1 tax on total income */
  if(status==="F"){ d1=R(0.30*base); }                            /* firm — flat 30% */
  else { d1 = isNew()?icTaxNew(base):icTaxOld(base); }

  /* D2 rebate 87A — resident individual only (rules #1135 new / #1145 old) */
  let d2=0;
  if(status==="I" && resident){
    if(isNew()){
      if(base<=1200000) d2=Math.min(d1,60000);
      else { const marg=d1-(base-1200000); if(marg>0) d2=Math.min(d1,marg); }  /* marginal rebate */
    } else {
      if(base<=500000) d2=Math.min(d1,12500);
    }
  }
  const d3=Math.max(0, d1-d2);                                     /* D3 tax after rebate = D1 − D2  [#260] */
  const d4=R(0.04*d3);                                            /* D4 cess @ 4% on D3 */
  const d5=d3+d4;                                                 /* D5 total tax & cess = D3 + D4  [#265] */
  const d6=N(IC.d.relief89);                                      /* D6 relief u/s 89 (input) */
  const d7=Math.max(0, d5-d6);                                    /* D7 balance tax after relief = D5 − D6  [#280] */
  const i234a=N(IC.d.int234a), i234b=N(IC.d.int234b), i234c=N(IC.d.int234c);
  const fee234f=Math.min(5000, N(IC.d.fee234f)), fee234i=Math.min(5000, N(IC.d.fee234i));
  const d12=d7+i234a+i234b+i234c+fee234f+fee234i;                 /* D12 total tax, fee & interest  [#270] */

  const paid=(S.C.paid||{}).total||0;                             /* taxes paid (by `paidbank`) */
  const balance=R(Math.max(0, d12-paid)/10)*10;                  /* D18 amount payable, round to ₹10  [I9] */
  const refund =R(Math.max(0, paid-d12)/10)*10;                  /* D19 refund, round to ₹10  [I10] */

  /* footer contract the shell's band()/#s_gti/#s_ti/#s_tax/#s_b read */
  S.C.gti=gtiInc;
  S.C.ti=ti;
  S.C.tax={ gross:d5, regime:isNew()?"New":"Old", rebate:d2, liability:d12 };
  S.C.int={ net:d7, balance:balance, refund:refund };
  S.C.taxc={ d1,d2,d3,d4,d5,d6,d7,i234a,i234b,i234c,fee234f,fee234i,d12,
             gti,gtiInc,via,ti,base,paid };
}

        {k:"nat",h:"Condition",t:"sel",w:"560px",req:1,opts:CLAUSE7},
        {k:"amt",h:"Amount",t:"num",w:"150px",req:1}],
        S.fs.clause7||[],{min:"760px",empty:"No condition added.",add:"Add a condition"});
  }

  h+=sub("Representative assessee");
  h+=row("Is this return being filed by a representative assessee?",sel("fs.rep",YN,{blank:false}),{req:1,ref:"F98"});
  if(S.fs.rep==="Y"){
    h+=row("Name of the representative assessee",inp("fs.repName",{max:125}),{req:1,ind:1,ref:"G99"});
    h+=row("Email-ID of the representative assessee",inp("fs.repEmail",{max:125}),{req:1,ind:1,ref:"G100"});
    h+=row("Contact number of the representative assessee",inp("fs.repMobile",{n:1}),{req:1,ind:1,ref:"G101"});
  }
  return h;
}

/* ---- inc — Income (salary + presumptive business + other sources + 112A/D20) ---- */
function secInc(){
  const inc=S.C.inc||{}, D=inc.detail||{}; const nw=isNew(); let h="";

  /* B1 salary */
  const salOff=(S.pi.empcat==="NA");
  h+=fold("ic_sal","B1","Salary","",(salOff?
      note("Nature of Employment is 'Not Applicable' — the salary schedule is greyed off."):(
      row("(a) Salary as per section 17(1)",inp("ic.sal.s17_1",{n:1}),{ref:"H112"})+
      row("(b) Value of perquisites u/s 17(2)",inp("ic.sal.s17_2",{n:1}),{ref:"H113"})+
      row("(c) Profit in lieu of salary u/s 17(3)",inp("ic.sal.s17_3",{n:1}),{ref:"H114"})+
      row("(i) Gross Salary (a+b+c)",cell(D.gross),{ref:"H111"})+
      row("(ii) Less: Allowances exempt u/s 10",cell(D.exempt),{ref:"H121",
        hint:nw?"HRA/LTC/10(14) close in the new regime":""})+
      grid("ic.sal.alw",[
        {k:"nat",h:"Nature of exempt allowance",t:"sel",w:"420px",req:1,opts:ALW_NAT},
        {k:"amt",h:"Amount",t:"num",w:"150px",req:1}],
        S.ic.sal.alw||[],{min:"620px",empty:"No exempt allowance.",add:"Add an allowance"})+
      row("(iii) Net Salary (i − ii)",cell(D.netSal),{ref:"H130"})+
      row("(iv) Deductions u/s 16 (iva+ivb+ivc)",cell(D.ded16),{ref:"H131"})+
      row("(a) Standard Deduction u/s 16(ia)",cell(D.stdDed),{ref:"H132",ind:1,hint:"max ₹75,000"})+
      (nw?row("(b) Entertainment allowance u/s 16(ii)",cell(0),{ref:"H133",ind:1,hint:"closed in the new regime"})
         :row("(b) Entertainment allowance u/s 16(ii)",inp("ic.sal.ent",{n:1}),{ref:"H133",ind:1,hint:"max ₹5,000"}))+
      (nw?row("(c) Professional tax u/s 16(iii)",cell(0),{ref:"H134",ind:1,hint:"closed in the new regime"})
         :row("(c) Professional tax u/s 16(iii)",inp("ic.sal.ptax",{n:1}),{ref:"H134",ind:1,hint:"max ₹5,000"}))+
      row("(v) Income chargeable under 'Salaries' (iii − iv)",cell(D.incSal),{ref:"H135"})
    )),{def:1});

  /* B1 presumptive business/profession — Schedule BP */
  h+=fold("ic_bp","BP","Presumptive business / profession (44AD / 44ADA / 44AE)",
    (R(D.e8)?RS(D.e8):""),(
    /* 44AD */
    sub("Section 44AD — business")+
    grid("ic.bp.nad",[
      {k:"name",h:"Name of business",t:"txt",w:"260px",req:1,max:75},
      {k:"code",h:"Business code",t:"txt",w:"110px",req:1,max:8,ph:"e.g. 09028"},
      {k:"desc",h:"Description",t:"txt",w:"260px",max:75}],
      S.ic.bp.nad||[],{min:"680px",empty:"No 44AD business.",add:"Add a 44AD business"})+
    row("E1(a) Turnover via bank / digital modes",inp("ic.bp.ad.bank",{n:1}),{ref:"E1a"})+
    row("E1(b) Receipts in cash",inp("ic.bp.ad.cash",{n:1}),{ref:"E1b"})+
    row("E1(c) Any other mode",inp("ic.bp.ad.other",{n:1}),{ref:"E1c"})+
    row("E1 Gross Turnover / Gross Receipts",cell(D.e1),{ref:"E1",hint:"cap ₹2 cr (₹3 cr if cash ≤ 5%)"})+
    row("E2(a) 6% of E1(a) or amount claimed",inp("ic.bp.ad.claim6",{n:1}),{ref:"E2a",v2:cell(D.e2a)})+
    row("E2(b) 8% of (E1b+E1c) or amount claimed",inp("ic.bp.ad.claim8",{n:1}),{ref:"E2b",v2:cell(D.e2b)})+
    row("E2(c) Presumptive income u/s 44AD (a+b)",cell(D.e2c),{ref:"E2c"})+
    /* 44ADA */
    sub("Section 44ADA — profession")+
    grid("ic.bp.nada",[
      {k:"name",h:"Name of business / profession",t:"txt",w:"260px",req:1,max:75},
      {k:"code",h:"Profession code",t:"txt",w:"110px",req:1,max:8,ph:"e.g. 16003"},
      {k:"desc",h:"Description",t:"txt",w:"260px",max:75}],
      S.ic.bp.nada||[],{min:"680px",empty:"No 44ADA profession.",add:"Add a 44ADA profession"})+
    row("E3(a) Receipts via bank / digital modes",inp("ic.bp.ada.bank",{n:1}),{ref:"E3a"})+
    row("E3(b) Receipts in cash",inp("ic.bp.ada.cash",{n:1}),{ref:"E3b"})+
    row("E3(c) Any other mode",inp("ic.bp.ada.other",{n:1}),{ref:"E3c"})+
    row("E3 Gross Receipts",cell(D.e3),{ref:"E3",hint:"cap ₹50 L (₹75 L if cash ≤ 5%)"})+
    row("E4 Presumptive income u/s 44ADA (50% of E3 or claimed)",inp("ic.bp.ada.claim",{n:1}),{ref:"E4",v2:cell(D.e4)})+
    /* 44AE */
    sub("Section 44AE — goods carriages")+
    grid("ic.bp.nae",[
      {k:"name",h:"Name of business",t:"txt",w:"260px",req:1,max:75},
      {k:"code",h:"Business code",t:"sel",w:"200px",req:1,opts:NOB44AE},
      {k:"desc",h:"Description",t:"txt",w:"220px",max:75}],
      S.ic.bp.nae||[],{min:"720px",empty:"No 44AE business.",add:"Add a 44AE business"})+
    grid("ic.bp.gcv",[
      {k:"reg",h:"Registration No.",t:"txt",w:"140px",req:1,max:11},
      {k:"flag",h:"Owned/Leased/Hired",t:"sel",w:"150px",req:1,opts:OWN_LEASE},
      {k:"tonnage",h:"Tonnage (MT)",t:"num",w:"110px",req:1},
      {k:"months",h:"Months held",t:"num",w:"110px",req:1},
      {k:"pi",h:"Presumptive income",t:"num",w:"150px",req:1}],
      S.ic.bp.gcv||[],{min:"720px",empty:"No goods carriage (max 10).",add:"Add a vehicle"})+
    (( (S.ic.bp.gcv||[]).length)?note("Per-vehicle presumptive income ≥ max(₹1,000/MT/month, ₹7,500/month); "+
      "months 1–12; registration numbers must be unique."):"")+
    (S.pi.status==="F"?row("E6 Salary & interest paid to partners (firms only)",inp("ic.bp.ae.salint",{n:1}),{ref:"E6"}):"")+
    row("E5 Presumptive income from goods carriages",cell(D.e5),{ref:"E5"})+
    row("E7 Presumptive income u/s 44AE (E5 − E6)",cell(D.e7),{ref:"E7"})+
    row("E8 Income chargeable under Business or Profession (E2c+E4+E7)",cell(D.e8),{ref:"E8 → B1"})+
    /* GST turnover reported */
    sub("Turnover / gross receipt reported for GST")+
    grid("ic.bp.gstn",[
      {k:"gstin",h:"GSTIN No.",t:"txt",w:"200px",req:1,max:20},
      {k:"amt",h:"Annual value of outward supplies per GST return",t:"num",w:"260px",req:1}],
      S.ic.bp.gstn||[],{min:"520px",empty:"No GSTIN reported.",add:"Add a GSTIN"})+
    /* Financial particulars E11–E25 */
    sub("Financial particulars of the business (as on 31-Mar-2026)")+
    row("E15 Sundry creditors",inp("ic.bp.fin.creditors",{n:1}),{req:1})+
    row("E19 Inventories",inp("ic.bp.fin.inventories",{n:1}),{req:1})+
    row("E20 Sundry debtors",inp("ic.bp.fin.debtors",{n:1}),{req:1})+
    row("E21 Balance with banks",inp("ic.bp.fin.bank",{n:1}),{req:1})+
    row("E22 Cash-in-hand",inp("ic.bp.fin.cash",{n:1}),{req:1})+
    note("E15, E19, E20, E21, E22 are mandatory; other financial-particulars lines if available.")
  ),{});

  /* B4 other sources */
  h+=fold("ic_os","B4","Income from other sources",(R(D.incOS)?RS(D.incOS):""),(
    grid("ic.os.rows",[
      {k:"nat",h:"Nature of income",t:"sel",w:"340px",req:1,opts:(S.pi.status==="I"?OS_NAT:OS_NAT.filter(x=>x[0]!=="FAP"))},
      {k:"amt",h:"Amount (non-dividend)",t:"num",w:"160px"}],
      S.ic.os.rows||[],{min:"560px",empty:"No other-source income.",add:"Add an income"})+
    ((S.ic.os.rows||[]).some(r=>r.nat==="DIV")?
      (sub("Dividend — quarter split (for rows marked Dividend)")+
       note("Enter the dividend across the five statutory periods; each dividend row's amount is the sum of its quarters."))
      :"")+
    (S.ic.os.rows||[]).map((r,i)=> r.nat==="DIV"?(
       row("Dividend row "+(i+1)+" — up to 15/06/2025",inp("ic.os.rows."+i+".q1",{n:1}),{ind:1,ref:"H164"})+
       row("16/06–15/09/2025",inp("ic.os.rows."+i+".q2",{n:1}),{ind:1,ref:"H165"})+
       row("16/09–15/12/2025",inp("ic.os.rows."+i+".q3",{n:1}),{ind:1,ref:"H166"})+
       row("16/12/2025–15/03/2026",inp("ic.os.rows."+i+".q4",{n:1}),{ind:1,ref:"H167"})+
       row("16/03–31/03/2026",inp("ic.os.rows."+i+".q5",{n:1}),{ind:1,ref:"H168"})
    ):"").join("")+
    (nw?row("Less: Deduction u/s 57(iia) (family pension)",cell(0),{ref:"F170",hint:"closed in the new regime"})
       :row("Less: Deduction u/s 57(iia) (family pension only)",inp("ic.os.fp57",{n:1}),{ref:"F170",
         hint:"≤ lower of 1/3 of family pension or ₹15,000"}))+
    row("B4 Income from other sources",cell(D.incOS),{ref:"F146"})
  ),{});

  /* D20(a) LTCG 112A not chargeable (block LTCG112A — owned here, feeds GTI incl 112A) */
  h+=fold("ic_ltcg","D20(a)","LTCG u/s 112A not chargeable to tax",(R(D.long112a)?RS(D.long112a):""),(
    row("(i) Total sale consideration",inp("ic.ltcg.sale",{n:1}),{ref:"D20a(i)"})+
    row("(ii) Total cost of acquisition",inp("ic.ltcg.cost",{n:1}),{ref:"D20a(ii)"})+
    row("(iii) Long-term capital gains as per sec 112A",cell(D.long112a),{ref:"D20a(iii)",
      hint:"reported only up to ₹1,25,000; above that it is 0"})
  ),{});

  /* D20 exempt income for reporting (block TaxExmpIntIncDtls — owned here) */
  let exTot=0; (S.ic.exmp||[]).forEach(r=>exTot+=N(r.amt));
  h+=fold("ic_exmp","D20","Exempt income (for reporting only)",(R(exTot)?RS(exTot):""),(
    note("For reporting only, not taxed. Agricultural income above ₹5,000 forces ITR-3/5.")+
    grid("ic.exmp",[
      {k:"cat",h:"Category",t:"sel",w:"320px",req:1,opts:EXMP_CAT},
      {k:"sub",h:"Sub-category",t:"txt",w:"140px",max:20,ph:"e.g. 10(1)"},
      {k:"desc",h:"Description",t:"txt",w:"200px",max:125},
      {k:"amt",h:"Amount",t:"num",w:"140px",req:1}],
      S.ic.exmp||[],{min:"820px",empty:"No exempt income.",add:"Add an exempt income"})+
    row("Total exempt income",cell(exTot),{ref:"D20 total"})
  ),{});
  return h;
}

/* ---- hp — House property (IncomeDeductions.PropertyDetails) ----------- */
function secHP(){
  const hp=S.C.hp||{}, calc=hp.calc||[]; const nw=isNew(); let h="";
  h+=note("Up to two house properties. In ITR-4 there is no Schedule HP — this feeds "+
    "IncomeDeductions.PropertyDetails[] and B3 'Income chargeable under House Property'.");
  (S.ic.hp||[]).forEach((p,i)=>{
    const c=calc[i]||{}; const self=(p.let==="S");
    let inner="";
    inner+=row("Address",inp("ic.hp."+i+".addr",{max:50}),{req:1});
    inner+=row("Town / City",inp("ic.hp."+i+".city",{max:50}),{req:1});
    inner+=row("State",sel("ic.hp."+i+".state",STATE_CODES),{req:1});
    inner+=row("PIN Code",inp("ic.hp."+i+".pin",{n:1,max:6}),{});
    inner+=row("Owner of the property",sel("ic.hp."+i+".owner",PROP_OWNER),{req:1});
    if(p.owner==="OT") inner+=row("If others, specify",inp("ic.hp."+i+".ownerOth",{max:50}),{ind:1});
    inner+=row("Type of house property",sel("ic.hp."+i+".let",IF_LETOUT),{req:1});
    inner+=row("Is the property co-owned?",sel("ic.hp."+i+".co",COOWN,{blank:false}),{});
    inner+=row("Your percentage of share (%)",inp("ic.hp."+i+".share",{n:1,ph:"100"}),{});
    if(p.co==="YES")
      inner+=grid("ic.hp."+i+".coown",[
        {k:"name",h:"Name of co-owner",t:"txt",w:"220px",req:1,max:125},
        {k:"pan",h:"PAN",t:"txt",w:"120px",max:10},
        {k:"aadhaar",h:"Aadhaar",t:"txt",w:"140px",max:12},
        {k:"share",h:"Share (%)",t:"num",w:"110px"}],
        p.coown||[],{min:"640px",empty:"No co-owner.",add:"Add a co-owner"});
    if(p.let==="L")
      inner+=grid("ic.hp."+i+".tenant",[
        {k:"name",h:"Name of tenant",t:"txt",w:"220px",req:1,max:125},
        {k:"pan",h:"PAN",t:"txt",w:"120px",max:10},
        {k:"aadhaar",h:"Aadhaar",t:"txt",w:"140px",max:12},
        {k:"pantan",h:"PAN/TAN (if TDS u/s 194-IB)",t:"txt",w:"180px"}],
        p.tenant||[],{min:"760px",empty:"No tenant.",add:"Add a tenant"});
    inner+=sub("Rent & annual value");
    if(self){
      inner+=note("Self-occupied — annual value is nil u/s 23(2); tax to local authorities is not allowed.");
    } else {
      inner+=row("(a) Gross rent received / receivable / lettable value",inp("ic.hp."+i+".gross",{n:1}),{ref:"a"});
      inner+=row("(b) Rent which cannot be realised",inp("ic.hp."+i+".notReal",{n:1}),{ref:"b"});
      inner+=row("(c) Tax paid to local authorities",inp("ic.hp."+i+".localTax",{n:1}),{ref:"c"});
      inner+=row("(d) Total (b + c)",cell(c.d),{ref:"d"});
      inner+=row("(e) Annual value (a − d)",cell(c.e),{ref:"e"});
      inner+=row("(f) Annual value of the property owned (share% × e)",cell(c.f),{ref:"f"});
      inner+=row("(g) 30% of annual value",cell(c.g),{ref:"g"});
    }
    inner+=sub("Interest on borrowed capital u/s 24(b)");
    if(nw && self){
      inner+=note("New regime — interest u/s 24(b) on a self-occupied house is not allowed (set to 0).","warn");
    } else {
      inner+=grid("ic.hp."+i+".loans",[
        {k:"from",h:"Loan taken from",t:"sel",w:"150px",req:1,opts:LOAN_FROM},
        {k:"name",h:"Bank / Institution / Person",t:"txt",w:"200px",req:1},
        {k:"accno",h:"Loan A/c No.",t:"txt",w:"140px",req:1},
        {k:"date",h:"Date of sanction",t:"date",w:"140px",req:1},
        {k:"total",h:"Total loan amount",t:"num",w:"140px",req:1},
        {k:"outst",h:"Outstanding",t:"num",w:"130px",req:1},
        {k:"intr",h:"Interest u/s 24(b)",t:"num",w:"140px",req:1}],
        p.loans||[],{min:"1080px",empty:"No loan.",add:"Add a loan"});
      inner+=row("(h) Interest payable on borrowed capital",cell(c.intr),{ref:"h",
        hint:(self||p.let==="D")?"capped at ₹2,00,000 (not let out)":""});
    }
    inner+=row("(i) Total deduction (g + h)",cell(c.totDed),{ref:"i"});
    inner+=row("(j) Arrears / unrealised rent received (less 30%)",inp("ic.hp."+i+".arrears",{n:1}),{ref:"j"});
    inner+=row("(k) Income of this house property (f − i + j)",cell(c.k),{ref:"k"});
    h+=blk("ichp"+i,"Property "+(i+1),(p.let?(IF_LETOUT.find(x=>x[0]===p.let)||["",""])[1]:"—"),inner,"ic.hp."+i);
  });
  if((S.ic.hp||[]).length<2)
    h+='<button class="add" data-add="ic.hp">Add a house property</button>';
  else h+=note("Maximum two house properties in ITR-4.");
  h+=row("B3 Income chargeable under the head 'House Property'",cell(hp.income),{ref:"H145",
    hint:nw?"new regime: HP loss not set off (floored at 0)":"aggregate loss floored at −₹2,00,000"});
  return h;
}

/* ---- tax — Part B → GTI → VI-A → TI → tax → 87A → cess → 234 → liability ---- */
function secTax(){
  const t=S.C.taxc||{}; const nw=isNew(); let h="";
  h+=sub("Part B — Gross Total Income");
  h+=row("B1 Salary",cell((S.C.inc||{}).salary),{ref:"H135"});
  h+=row("B1 Business & Profession (presumptive E8)",cell((S.C.inc||{}).bp),{ref:"F110"});
  h+=row("B3 House Property",cell((S.C.hp||{}).income),{ref:"H145"});
  h+=row("B4 Other Sources",cell((S.C.inc||{}).os),{ref:"F146"});
  h+=row("D20(a)(iii) LTCG u/s 112A (not chargeable)",cell((S.C.inc||{}).ltcg112a),{ref:"D20a"});
  h+=row("B5 Gross Total Income",cell(t.gti),{ref:"F172"});
  h+=row("Gross Total Income incl. LTCG 112A",cell(t.gtiInc),{ref:"GrossTotIncomeIncLTCG112A"});

  h+=sub("Part C — Chapter VI-A deductions");
  h+=row("C19 Total Chapter VI-A deductions (from Deductions screen)",cell(t.via),{ref:"C19",
    hint:nw?"most deductions close in the new regime":"read from the ded builder (S.C.ded.total)"});
  h+=row("C20 Total Income (B5 − C19)",cell(t.ti),{ref:"F224",hint:"Sugam ceiling ~₹50 lakh"});

  h+=sub("Part D — Tax computation");
  h+=row("D1 Tax payable on Total Income",cell(t.d1),{ref:"F226",
    hint:(S.pi.status==="F")?"firm — flat 30%":(nw?"new regime slabs 115BAC(1A)":"old regime slabs")});
  h+=row("D2 Rebate u/s 87A",cell(t.d2),{ref:"F227",
    hint:nw?"up to ₹60,000 for total income up to ₹12L":"₹12,500 for total income up to ₹5L"});
  h+=row("D3 Tax payable after rebate (D1 − D2)",cell(t.d3),{ref:"F228"});
  h+=row("D4 Health & Education Cess @ 4%",cell(t.d4),{ref:"F230"});
  h+=row("D5 Total Tax & Cess (D3 + D4)",cell(t.d5),{ref:"F231"});
  h+=row("D6 Relief u/s 89 (submit Form 10E)",inp("ic.d.relief89",{n:1}),{ref:"F232"});
  h+=row("D7 Balance Tax after Relief (D5 − D6)",cell(t.d7),{ref:"F234"});
  h+=row("D8 Interest u/s 234A",inp("ic.d.int234a",{n:1}),{ref:"F235"});
  h+=row("D9 Interest u/s 234B",inp("ic.d.int234b",{n:1}),{ref:"F236"});
  h+=row("D10 Interest u/s 234C",inp("ic.d.int234c",{n:1}),{ref:"F237"});
  h+=row("D11 Fee u/s 234F",inp("ic.d.fee234f",{n:1}),{ref:"F238",hint:"max ₹5,000"});
  h+=row("D11a Fee u/s 234-I (revised return)",inp("ic.d.fee234i",{n:1}),{ref:"F240",hint:"max ₹5,000"});
  h+=row("D12 Total Tax, Fee & Interest",cell(t.d12),{ref:"F241"});
  h+=note("Taxes paid, balance payable and refund are computed on the Taxes-paid and "+
    "Bank screens; the balance/refund figure appears in the footer strip.");
  return h;
}

/* =====================================================================
   EXPORT — expInc(j): write ALL owned blocks. put() skips empties; SKEL
   keeps the required leaves present at 0.
   ===================================================================== */
function expInc(j){
  const inc=S.C.inc||{}, D=inc.detail||{}, hp=S.C.hp||{}, calc=hp.calc||[], t=S.C.taxc||{};
  /* build a plain object, keeping only non-empty leaves */
  const ob=o=>{const r={};for(const k in o){const v=o[k];if(v!==undefined&&v!==null&&v!=="")r[k]=v;}return r;};

  /* ---- PersonalInfo ---- */
  put(j,"PersonalInfo.AssesseeName.FirstName",sv(S.pi.first));
  put(j,"PersonalInfo.AssesseeName.MiddleName",sv(S.pi.mid));
  put(j,"PersonalInfo.AssesseeName.SurNameOrOrgName",sv(S.pi.last));
  put(j,"PersonalInfo.PAN",sv(S.pi.pan));
  put(j,"PersonalInfo.Address.ResidenceNo",sv(S.pi.resNo));
  put(j,"PersonalInfo.Address.ResidenceName",sv(S.pi.resName));
  put(j,"PersonalInfo.Address.RoadOrStreet",sv(S.pi.road));
  put(j,"PersonalInfo.Address.LocalityOrArea",sv(S.pi.locality));
  put(j,"PersonalInfo.Address.CityOrTownOrDistrict",sv(S.pi.city));
  put(j,"PersonalInfo.Address.StateCode",sv(S.pi.state));
  put(j,"PersonalInfo.Address.CountryCode",sv(S.pi.country||"91"));
  if(N(S.pi.pin)) put(j,"PersonalInfo.Address.PinCode",R(N(S.pi.pin)));
  put(j,"PersonalInfo.Address.ZipCode",sv(S.pi.zip));
  if(N(S.pi.std))    put(j,"PersonalInfo.Address.Phone.STDcode",R(N(S.pi.std)));
  put(j,"PersonalInfo.Address.Phone.PhoneNo",sv(S.pi.phone));
  put(j,"PersonalInfo.Address.CountryCodeMobile",R(N(S.pi.mobcc)||91));
  if(N(S.pi.mobile)) put(j,"PersonalInfo.Address.MobileNo",R(N(S.pi.mobile)));
  put(j,"PersonalInfo.Address.EmailAddress",sv(S.pi.email));
  put(j,"PersonalInfo.Address.EmailAddressSec",sv(S.pi.emailSec));
  put(j,"PersonalInfo.SecondaryAdd",sv(S.pi.secAdd||"Y"));
  if(S.pi.secAdd==="N"){
    put(j,"PersonalInfo.AlternateAddress.ResidenceNo",sv(S.pi.altRes));
    put(j,"PersonalInfo.AlternateAddress.LocalityOrArea",sv(S.pi.altLoc));
    put(j,"PersonalInfo.AlternateAddress.CityOrTownOrDistrict",sv(S.pi.altCity));
    put(j,"PersonalInfo.AlternateAddress.StateCode",sv(S.pi.altState));
  }
  put(j,"PersonalInfo.DOB",ISO(S.pi.dob));
  put(j,"PersonalInfo.EmployerCategory",sv(S.pi.empcat||"OTH"));

    S.ic.bp.nada=(BP.NatOfBus44ADA||[]).map(r=>({name:r.NameOfBusiness||"",code:r.CodeADA||"",desc:r.Description||""}));
    const ada=BP.PersumptiveInc44ADA||{}; S.ic.bp.ada={bank:ada.GrsTrnOverBank44ADA||"",cash:ada.GrsTotalTrnOverInCash44ADA||"",other:ada.GrsTrnOverAnyOthMode44ADA||"",claim:ada.TotPersumptiveInc44ADA||""};
    S.ic.bp.nae=(BP.NatOfBus44AE||[]).map(r=>({name:r.NameOfBusiness||"",code:r.CodeAE||"",desc:r.Description||""}));
    S.ic.bp.gcv=(BP.GoodsDtlsUs44AE||[]).map(v=>({reg:v.RegNumberGoodsCarriage||"",flag:v.OwnedLeasedHiredFlag||"",tonnage:v.TonnageCapacity||"",months:v.HoldingPeriod||"",pi:v.PresumptiveIncome||""}));
    S.ic.bp.ae={salint:(BP.PersumptiveInc44AE||{}).SalInterestByFirm||""};
    S.ic.bp.gstn=(BP.TurnoverGrsRcptForGSTIN||[]).map(r=>({gstin:r.GSTINNo||"",amt:r.AmtTurnGrossRcptGSTIN||""}));
    const f=BP.FinanclPartclrOfBusiness||{}; S.ic.bp.fin={creditors:f.SundryCreditors||"",inventories:f.Inventories||"",debtors:f.SundryDebtors||"",bank:f.BalWithBanks||"",cash:f.CashInHand||""};
    read.push("presumptive business (BP)");
  }
  if(TC){
    S.ic.d.relief89=TC.Section89||""; const ip=TC.IntrstPay||{};
    S.ic.d.int234a=ip.IntrstPayUs234A||""; S.ic.d.int234b=ip.IntrstPayUs234B||""; S.ic.d.int234c=ip.IntrstPayUs234C||"";
    S.ic.d.fee234f=ip.LateFilingFee234F||""; S.ic.d.fee234i=ip.FeeFurnish234I||"";
    read.push("tax computation");
  }
  if(LT){ S.ic.ltcg={sale:LT.TotSaleCnsdrn||"",cost:LT.TotCstAcqisn||""}; read.push("LTCG 112A"); }
  if(EX){ S.ic.exmp=((EX.OthersInc||{}).OthersIncDtls||[]).map(r=>({cat:r.Category||"",sub:r.SubCategory||"",desc:r.Description||"",amt:r.OthAmount||""})); read.push("exempt income"); }
  return read;
}

function chkWho(){
  const out=[];
  if(!st0(S.pi.last)) out.push({lvl:"err",t:"Name required",m:"Surname / last name (or firm name) is mandatory.",sec:"who"});
  if(st0(S.pi.pan)&&!PAN_RE.test(String(S.pi.pan).toUpperCase())) out.push({lvl:"err",t:"PAN not valid",m:"PAN must be 10 characters: AAAAA9999A.",sec:"who"});
  if(st0(S.pi.pin)&&!/^[1-9][0-9]{5}$/.test(String(S.pi.pin))) out.push({lvl:"warn",t:"PIN not valid",m:"PIN is 6 digits, 100000–999999.",sec:"who"});
  if(st0(S.pi.email)&&!MAIL.test(S.pi.email)) out.push({lvl:"warn",t:"Email looks wrong",m:"Enter a valid primary email.",sec:"who"});
  return out;
}
function chkRet(){
  const out=[], sec=+S.fs.sec;
  if(!st0(S.fs.f10ieaEarlier)) out.push({lvl:"err",t:"Form 10-IEA (earlier AY) required",m:"Answer whether Form 10-IEA was filed within the due date for an earlier AY (mandatory).",sec:"ret"});
  if(S.fs.optout==="Yes"){
    if(!st0(S.fs.f10ieaAckCur)) out.push({lvl:"err",t:"Form 10-IEA acknowledgement required",m:"Opting out of the new regime is exercised only through Form 10-IEA — furnish its acknowledgement number.",sec:"ret"});
    if(!D(S.fs.f10ieaDateCur)) out.push({lvl:"err",t:"Form 10-IEA date required",m:"Furnish the date of filing of Form 10-IEA for AY 2026-27.",sec:"ret"});
  }
  if([13,14,16,18,20].indexOf(sec)>=0 && !st0(S.fs.noticeNo)) out.push({lvl:"err",t:"DIN required",m:"A return filed against a 142(1)/148/153C/139(9) notice or 119(2)(b) order needs the DIN.",sec:"ret"});
  if(sec===17 && !st0(S.fs.receipt)) out.push({lvl:"err",t:"Receipt number required",m:"A revised return (139(5)) needs the receipt number of the original return.",sec:"ret"});
  if(S.fs.rep==="Y"){
    if(st0(S.fs.repEmail)&&st0(S.pi.email)&&S.fs.repEmail.toLowerCase()===st0(S.pi.email).toLowerCase())
      out.push({lvl:"err",t:"Representative email clashes",m:"The representative's email must differ from the taxpayer's.",sec:"ret"});
  }
  return out;
}
function chkInc(){
  const out=[], D=(S.C.inc||{}).detail||{};
  /* 44AD turnover / audit thresholds (BP.md [O26]) */
  if(N(D.e1)>0){
    const cashPct=N(D.e1)?(N(D.e1b)/N(D.e1)*100):0;
    const cap=cashPct>5?20000000:30000000;
    if(N(D.e1)>cap) out.push({lvl:"warn",t:"44AD turnover exceeds cap",m:"Gross turnover exceeds the ₹"+(cap/10000000)+" crore presumptive cap"+(cashPct>5?" (cash > 5%)":"")+".",sec:"inc"});
  }
  if(N(D.e3)>7500000) out.push({lvl:"warn",t:"44ADA receipts exceed cap",m:"Gross receipts u/s 44ADA exceed the ₹75 lakh cap.",sec:"inc"});
  if((S.ic.bp.gcv||[]).length>10) out.push({lvl:"err",t:"Too many goods carriages",m:"Schedule 44AE allows at most 10 goods-carriage rows.",sec:"inc"});
  (S.ic.bp.gcv||[]).forEach((v,i)=>{ const m=N(v.months); if(v.months!==""&&(m<1||m>12)) out.push({lvl:"err",t:"Vehicle months out of range",m:"Vehicle "+(i+1)+": months owned/leased/hired must be 1–12.",sec:"inc"}); });
  /* new-regime closed exempt allowances carrying value */
  if(isNew()) (S.ic.sal.alw||[]).forEach(r=>{ if(ALW_CLOSED_NEW[st0(r.nat)]&&N(r.amt)>0)
    out.push({lvl:"warn",t:"Exempt allowance closed in new regime",m:st0(r.nat)+" is not exempt under the new regime and is treated as 0.",sec:"inc"}); });
  if(N(D.ltGain)>125000) out.push({lvl:"warn",t:"LTCG 112A above ₹1.25L",m:"LTCG u/s 112A exceeds ₹1,25,000; it is reported as 0 here and this return may not be eligible for ITR-4.",sec:"inc"});
  return out;
}
function chkHP(){
  const out=[];
  if((S.ic.hp||[]).length>2) out.push({lvl:"err",t:"Too many house properties",m:"ITR-4 allows at most two house properties.",sec:"hp"});
  (S.ic.hp||[]).forEach((p,i)=>{
    if(p.let==="S"&&N(p.localTax)>0) out.push({lvl:"warn",t:"Local tax on self-occupied",m:"Property "+(i+1)+": tax paid to local authorities is not allowed for a self-occupied house.",sec:"hp"});
    if(p.co==="YES"&&!(p.coown||[]).length) out.push({lvl:"err",t:"Co-owner table empty",m:"Property "+(i+1)+": you marked it co-owned — list each co-owner.",sec:"hp"});
    let intr=0;(p.loans||[]).forEach(l=>intr+=N(l.intr));
    if((p.let==="S"||p.let==="D")&&intr>200000) out.push({lvl:"warn",t:"24(b) interest capped",m:"Property "+(i+1)+": interest on a not-let-out house is capped at ₹2,00,000.",sec:"hp"});
  });
  return out;
}
function chkTax(){
  const out=[], t=S.C.taxc||{};
  if(N(t.ti)>5125000) out.push({lvl:"err",t:"Total income above the Sugam ceiling",m:"Total income exceeds ₹51,25,000 — ITR-4 (Sugam) cannot be used; file ITR-3.",sec:"tax"});
  if(S.pi.status!=="I" && N(t.d2)>0) out.push({lvl:"warn",t:"87A rebate not available",m:"Rebate u/s 87A is available only to a Resident Individual (rules #250/#255).",sec:"tax"});
  if(N(t.fee234f)>5000) out.push({lvl:"warn",t:"Fee 234F over cap",m:"Late-filing fee u/s 234F is capped at ₹5,000.",sec:"tax"});
  if(!out.length) out.push({lvl:"ok",t:"Tax computation",m:(isNew()?"New":"Old")+" regime · total income "+RS(t.ti||0)+" · tax & cess "+RS(t.d5||0)+".",sec:"tax"});
  return out;
}

/* =====================================================================
   ITR-4 · A.Y. 2026-27 — builder "paidbank" — two screen sections:
     · paid  (order 60) — "Taxes paid" — the TDS/TCS/IT sheet
     · bank  (order 95) — "Bank and verification" — the closing sheet
   Books: books/ITR-4/TDS.md, TCS.md, IT.md, Taxes_Paid_and_Verification.md.
   Structure/refs: books/ITR-4/structure.md.

   Schema blocks OWNED (export/import) by this builder — no other section
   writes these keys:
     paid:  TDSonSalaries, TDSonOthThanSals, ScheduleTDS3Dtls,
            ScheduleTCS, ScheduleIT
     bank:  TaxPaid, Refund, Verification, TaxReturnPreparer

   NOT owned here (rendered/exported by inccore): TaxComputation,
   IncomeDeductions, TaxExmpIntIncDtls (D20 exempt income) and
   LTCG112A (D20a). The bank screen only points to those; it does not
   write their keys — one section owns each block (CLAUDE.md rule 11).

   REGIME: there is no books/ITR-4/REGIME.md; taxes paid / bank /
   verification are regime-neutral (as in the ITR-3 precedent) — no item
   in either screen closes or opens on the new-vs-old regime, so there is
   no isNew() closure (cell(0)/note) to build here and both regime paths
   render and compute identically.

   Compute contract (dispatch):
     · engPaid (order 60) sets S.C.paid.total = advance + TDS + TCS + SAT,
       which inccore's tax roll-up (order 80) reads.
     · engBank (order 95, last) reads (S.C.tax||{}).liability to compute
       the balance payable / refund and sets S.C.int.{balance,refund}
       for the footer band.
   Neither head adds to Gross Total Income: S.C.paid.income = 0 and
   S.C.bank.income = 0 (taxes paid are credits; bank/verification carry
   no income), so the tax section's Σ S.C.<head>.income is unaffected.
   ===================================================================== */

/* =====================================================================
   PAID — engine (order 60): the five payment schedules → S.C.paid
   ===================================================================== */
function engPaid(){
  const P={income:0};                 /* taxes paid contribute nothing to GTI */

  /* TDS 1 (Sch TDS1) — S4=SUM(IncChrgSal); H11=SUM(TotalTDSSal)=TotalTDSonSalaries */
  const t1  =(S.paid.tds1||[]).reduce((a,r)=>a+N(r.tds),0);
  const t1in=(S.paid.tds1||[]).reduce((a,r)=>a+N(r.inc),0);

  /* TDS 2(i) — M30=MAX(0, bf + deducted − claimed); J35=SUM(TDSClaimed) */
  (S.paid.tds2||[]).forEach(r=>{
    const avail=N(r.bf)+N(r.ded);
    r._avail=avail; r._cf=Math.max(0,avail-N(r.claim)); r._over=N(r.claim)>avail;});
  const t2=(S.paid.tds2||[]).reduce((a,r)=>a+N(r.claim),0);

  /* TDS 2(ii) — N42=MAX(0, bf + deducted − claimed); K47=SUM(TDSClaimed) */
  (S.paid.tds3||[]).forEach(r=>{
    const avail=N(r.bf)+N(r.ded);
    r._avail=avail; r._cf=Math.max(0,avail-N(r.claim)); r._over=N(r.claim)>avail;});
  const t3=(S.paid.tds3||[]).reduce((a,r)=>a+N(r.claim),0);

  /* Schedule TCS — I11=SUM(AmtTCSClaimedThisYear)=TotalSchTCS; claimed ≤ TotalTCS */
  (S.paid.tcs||[]).forEach(r=>{ r._over=N(r.claim)>N(r.coll); });
  const tcs=(S.paid.tcs||[]).reduce((a,r)=>a+N(r.claim),0);

  /* Schedule IT — advance vs self-assessment split by deposit date (FormulaOFS):
     a challan on or before 31 Mar 2026 (YREND) is advance tax; on/after 1 Apr 2026
     is self-assessment tax. H12=SUM(Amt)=TotalTaxPayments; O5=SAT total; Q5=advance. */
  const isSAT=c=>{const d=D(c.dt);return d?d>YREND:false;};
  const challans=(S.paid.it||[]).map(c=>({amt:R(N(c.amt)),dt:c.dt,sat:isSAT(c),valid:!!D(c.dt)}));
  const adv=challans.filter(c=>!c.sat).reduce((a,c)=>a+c.amt,0);
  const sat=challans.filter(c=> c.sat).reduce((a,c)=>a+c.amt,0);

  P.t1=R(t1); P.t1in=R(t1in); P.t2=R(t2); P.t3=R(t3);
  P.tds=R(t1+t2+t3);                 /* D15 / 10b = TDS1 col4 + TDS2(i) col6 + TDS2(ii) col6 */
  P.tcs=R(tcs);                      /* D16 = TCS col 5 */
  P.adv=R(adv); P.sat=R(sat); P.itTotal=R(adv+sat);   /* TotalTaxPayments (before rounding) */
  P.total=R(adv+P.tds+tcs+sat);      /* S.C.paid.total = advance + TDS + TCS + SAT */
  P.paid=P.total;                    /* alias for display */
  P.challans=challans;
  P.income=0;
  S.C.paid=P;
}
