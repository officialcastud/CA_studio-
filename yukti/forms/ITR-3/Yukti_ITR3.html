      gain:Z(),loss:Z(),used:Z(),absorbed:Z(),after:Z(),matrix:{},F:{},
      s112a:engScrip([]),s115ad:engScrip([]),vda:{bi:0,cg:0},
      buckets:{},dedD:{},dedTotal:0,shortTerm:0,longTerm:0,total:0,income:0};
    return;
  }
  const s112a=engScrip(C.s112a);
  const s115ad=engScrip(C.s115ad);
  const vda=engVDA(C.vda);

  /* ---- Part A · short-term ---------------------------------------- */
  const land={st:[],lt:[]};
  (C.land||[]).forEach((p,i)=>{const r=engLand(p);p._=r;p._i=i;(r.isLT?land.lt:land.st).push(p);});
  const A={};
  A.a1 = R(land.st.reduce((a,p)=>a+p._.gain,0));            /* A1e r21 */
  A.a2 = engSlump(C.a2,false);                             /* A2c r35 */
  A.a3i= engAgg(C.a3i,{loss94:1});                         /* A3ie r45 (111A equity STT) */
  A.a6 = engAgg(C.a6,{unq:1,loss94:1,dcg:1,deds:["s54G","s54GA"]}); /* A6g r96 */
  const a7t=(C.a7&&C.a7.deem||[]).reduce((a,x)=>a+N(x.unused),0)+N((C.a7||{}).other);
  A.a7 = {gain:R(a7t)};                                     /* A7 r104 */
  A.a8 = {gain:R(["r20","r30","rApp"].reduce((a,k)=>a+N((C.a8||{})[k]),0))}; /* A8 r106 */
  const a9a=(C.a9||[]).filter(x=>x.rate==="NIL"||N(x.rate)===0).reduce((a,x)=>a+N(x.amt),0);
  A.a9 = {notTax:R(a9a), special:R((C.a9||[]).reduce((a,x)=>a+N(x.amt),0)-a9a)}; /* A9a/A9b r120/121 */
  A.aA = {loss:R((C.aA||[]).reduce((a,x)=>a+N(x.amt),0))};  /* A(A) r135 buy-back STCL */
  /* A10 r140 = A1e+A2c+A3ie+A6g+A7+A8−A9a + A(A) */
  A.total=R(A.a1+A.a2.gain+A.a3i.gain+A.a6.gain+A.a7.gain+A.a8.gain-A.a9.notTax-A.aA.loss);

  /* ---- Part B · long-term ----------------------------------------- */
  const B={};
  B.b1=R(land.lt.reduce((a,p)=>a+p._.gain,0));              /* B1g r185 */
  B.b1excess=R(land.lt.reduce((a,p)=>a+p._.excess,0));     /* B1h ΣB1eii r188 */
  B.b2=engSlump(C.b2,true);                                /* B2e r200 */
  B.b3i=engAgg(C.b3i,{deds:["s54F"]});                     /* B3ie r233 (112(1) listed sec/ZCB) */
  B.b3ii=engAgg(C.b3ii,{deds:["s54F"]});                   /* B3iie r252 (115ACA GDR) */
  const b4ded=N((C.b4||{}).s54F);
  B.b4={a:s112a.bal, ded:R(b4ded), gain:R(s112a.bal-Math.min(b4ded,Math.max(0,s112a.bal)))}; /* B4c r262 (=Col14 112A) */
  B.b7=isNr?{a:s115ad.bal, gain:R(s115ad.bal-Math.min(N((C.b7||{}).s54F),Math.max(0,s115ad.bal)))}:{a:0,gain:0}; /* B7c r336 (=Col14 115AD) */
  B.b9=engAgg(C.b9,{unq:1,deds:["s54D","s54F","s54G","s54GA"]}); /* B9e r374 */
  const b10t=(C.b10&&C.b10.deem||[]).reduce((a,x)=>a+N(x.unused),0)+N((C.b10||{}).other);
  B.b10={gain:R(b10t)};                                     /* B10 r397 */
  B.b11={gain:R(["r125a","r125o"].reduce((a,k)=>a+N((C.b11||{})[k]),0))}; /* B11 r400 */
  const b12a=(C.b12||[]).filter(x=>x.rate==="NIL"||N(x.rate)===0).reduce((a,x)=>a+N(x.amt),0);
  B.b12={notTax:R(b12a), special:R((C.b12||[]).reduce((a,x)=>a+N(x.amt),0)-b12a)}; /* B12a/B12b r413/414 */
  B.bA={loss:R((C.bA||[]).reduce((a,x)=>a+N(x.amt),0))};    /* B(A) r420 */
  /* B13 r425 = B1g+B2e+B3ie+B3iie+B4c+B7c+B9e+B10+B11−B12a + B(A) */
  B.total=R(B.b1+B.b2.gain+B.b3i.gain+B.b3ii.gain+B.b4.gain+B.b7.gain+B.b9.gain
    +B.b10.gain+B.b11.gain-B.b12.notTax-B.bA.loss);

  /* ---- Part E · set-off matrix on the six rate-slots -------------- */
  /* Composition (CG book Table E rows r539-r547, and the A10/B13 heads):
     20%   = A3ie (111A equity STT) + A8 r20 (PTI 20%)                   − STL20
     30%   = A8 r30 (PTI 30%)                                            − STL30
     app.  = A1e + A2c + A6g + A7 + A8 rApp (PTI applicable)             − STLAR
     DTAA  = A9b
     12.5% = B1g + B2e + B3ie + B3iie + B4c + B7c + B9e + B10 + B11      − B(A)
     LTDTAA= B12b                                                             */
  const bbAt=code=>R((C.aA||[]).filter(x=>(x.rate||"STL20")===code).reduce((a,x)=>a+N(x.amt),0));
  const E={
    st20:R(A.a3i.gain+N((C.a8||{}).r20)-bbAt("STL20")),
    st30:R(N((C.a8||{}).r30)-bbAt("STL30")),
    stApp:R(A.a1+A.a2.gain+A.a6.gain+A.a7.gain+N((C.a8||{}).rApp)-bbAt("STLAR")),
    stDTAA:R(A.a9.special),
    lt125:R(B.b1+B.b2.gain+B.b3i.gain+B.b3ii.gain+B.b4.gain+B.b7.gain+B.b9.gain+B.b10.gain+B.b11.gain-B.bA.loss),
    ltDTAA:R(B.b12.special)};
  const gain={},loss={},used={},absorbed={},matrix={};
  KEYS.forEach(k=>{gain[k]=Math.max(0,E[k]);loss[k]=Math.max(0,-E[k]);used[k]=0;absorbed[k]=0;matrix[k]={};});
  const isLong=k=>k.charAt(0)==="l";
  if(C.editE && C.Eover){                                   /* r535 "Do you want to edit" override */
    KEYS.forEach(gk=>KEYS.forEach(lk=>{const v=N(((C.Eover[gk]||{})[lk]));
      if(v>0){matrix[gk][lk]=v;absorbed[gk]+=v;used[lk]+=v;}}));
  } else {
    /* auto set-off: a STCL sets off any CG; a LTCL sets off only LTCG (Part E rule) */
    KEYS.forEach(lk=>{if(!loss[lk])return;let avail=loss[lk];
      KEYS.forEach(gk=>{if(avail<=0||gk===lk||!gain[gk])return;
        if(isLong(lk)&&!isLong(gk))return;
        const u=Math.min(avail,gain[gk]-absorbed[gk]);if(u<=0)return;
        matrix[gk][lk]=(matrix[gk][lk]||0)+u;absorbed[gk]+=u;used[lk]+=u;avail-=u;});});
  }
  const after={};let C1=0;
  KEYS.forEach(k=>{after[k]=R(gain[k]-absorbed[k]);C1+=after[k];}); /* C1 r426 = Σ 8ii..8vii of Table E */

  /* ---- Part F · quarters (auto from sale dates; editable) --------- */
  const Fauto={};KEYS.forEach(k=>Fauto[k]=[0,0,0,0,0]);
  (C.land||[]).forEach(p=>{const r=p._;if(!r)return;const q=cgQtr(p.sale);
    const k=r.isLT?"lt125":"stApp"; if(r.gain>0)Fauto[k][q]+=r.gain;});
  const F={};KEYS.forEach(k=>{const ov=(C.Fover||{})[k];
    F[k]=(C.editF&&ov)?ov.map(N):Fauto[k].slice();});

  /* ---- Part C · summary ------------------------------------------- */
  const C2=vda.cg;                                          /* C2 r427 = Sch VDA item B (capital-gain) */
  const C3=R(C1+C2);                                         /* C3 r428 = C1 + C2 */

  /* ---- Part D · deduction particulars ----------------------------- */
  const dedD={};
  const addD=(sec,amt,src)=>{if(!N(amt))return;(dedD[sec]=dedD[sec]||[]).push({amt:N(amt),src});};
  (C.land||[]).forEach((p,i)=>Object.keys(p.ded||{}).forEach(k=>addD(k.replace("s",""),(p.ded||{})[k],"land"+i)));
  [["a6",C.a6],["b3i",C.b3i],["b3ii",C.b3ii],["b9",C.b9],["b2",C.b2]].forEach(([h,o])=>
    Object.keys((o||{}).ded||{}).forEach(k=>addD(k.replace("s",""),(o.ded||{})[k],h)));
  if(N((C.b4||{}).s54F))addD("54F",C.b4.s54F,"b4");
  const dedTotal=Object.values(dedD).reduce((a,rows)=>a+rows.reduce((b,r)=>b+r.amt,0),0);

  /* ---- special-rate buckets for the tax section (Schedule SI) ----- */
  const buckets={
    si111a20:after.st20,          /* STCG 111A @20% */
    si30:after.st30,              /* STCG @30% */
    stApp:after.stApp,            /* STCG at applicable rates */
    stDTAA:after.stDTAA,
    si112a:Math.max(0,Math.min(after.lt125,Math.max(0,B.b4.gain+B.b7.gain))), /* 112A @12.5% (₹1.25L exempt applied at tax) */
    si112:Math.max(0,after.lt125-Math.max(0,B.b4.gain+B.b7.gain)),            /* other LTCG @12.5% */
    ltDTAA:after.ltDTAA,
    si115bbh:vda.cg};             /* VDA @30% u/s 115BBH */

  S.C.cg={on:true,nri:isNr,land,A,B,E,gain,loss,used,absorbed,matrix,after,F,Fauto,
    s112a,s115ad,vda,buckets,dedD,dedTotal:R(dedTotal),
    C1:R(C1),C2:R(C2),C3:R(C3),
    shortTerm:A.total,longTerm:B.total,total:R(C3),
    income:R(C3)};   /* head's contribution to Gross Total Income (signed) — C3 (≥0; net loss carries via loss section) */
}

function moneyRow(label,ref,path,ind){return row(label,inp(path,{n:1}),{ref:ref,ind:ind});}
function calcRow(label,ref,n,ind){return row(label,cell(n),{ref:ref,ind:ind});}

function landBlock(p,i,lt){const r=p._||engLand(p);let h="";
  h+=row("Date of purchase / acquisition",dte("cg.land."+i+".buy"),{ref:lt?"B1":"A1"});
  h+=row("Date of sale / transfer",dte("cg.land."+i+".sale"),{});
  h+=row("a i · Full value of consideration",inp("cg.land."+i+".cons",{n:1}),{ref:"ai"});
  h+=row("ii · Value per stamp valuation authority",inp("cg.land."+i+".sdv",{n:1}),{ref:"aii"});
  h+=calcRow("iii · Full value of consideration u/s 50C","aiii",r.value);
  if(!r.safe)h+=note("Stamp value exceeds consideration by more than 10% — u/s 50C the stamp value is adopted.","warn");
  h+=row("b i · Cost of acquisition (without indexation)",inp("cg.land."+i+".cost",{n:1}),{ref:"bi"});
  if(lt&&r.canIndex)h+=calcRow("Cost of acquisition (with indexation)","biia",r.costIdx,1);
  h+=grid("cg.land."+i+".improve",[
      {h:"Cost of improvement",k:"amt",t:"num"},
      {h:"Year",k:"yr",t:"txt",ph:"YYYY-YY"}
    ],(p.improve||[]),{empty:"No improvement.",add:"Add improvement"});
  h+=row("iii · Expenditure wholly & exclusively on transfer",inp("cg.land."+i+".exp",{n:1}),{ref:"biii"});
  h+=calcRow("iv · Total deductions u/s 48 (bi + Σbiib + biii)","biv",r.biv);
  h+=calcRow("c · Balance (aiii − biv)",lt?"1c":"c",r.c);
  /* deductions Dbelow */
  const ex=lt?EXLT_LAND:EXST_LAND;
  ex.forEach(([code,lbl])=>{h+=row("d · Deduction u/s "+code,inp("cg.land."+i+".ded.s"+code,{n:1}),{ref:lbl,ind:1});});
  h+=calcRow(lt?"e · LTCG on Immovable property (1c − 1d)":"e · STCG on Immovable property (1c − 1d)",lt?"B1e":"A1e",r.e);
  if(lt&&r.canIndex){
    h+=calcRow("ei(A) · Tax as per 112(1)(a)(ii)(B) [1e × 12.5%]","B1ei(A)",r.taxA,1);
    h+=calcRow("ei(B) · Tax for 2nd proviso to 112(1)(a) [1ea × 20%]","B1ei(B)",r.taxB,1);
    h+=calcRow("eii · Excess tax to be ignored (2nd proviso)","B1eii",r.excess,1);
  }
  /* buyer table (194-IA) */
  h+=grid("cg.land."+i+".buyers",[
      {h:"Name of buyer",k:"name",t:"txt"},
      {h:"PAN",k:"pan",t:"txt",max:10},
      {h:"% share",k:"share",t:"num"},
      {h:"Amount",k:"amt",t:"num"}
    ],(p.buyers||[]),{empty:"No buyer detail.",add:"Add a buyer",min:"720px"});
  return blk("cgland"+(lt?"L":"S")+i,(lt?"Long-term property ":"Short-term property ")+(i+1),
    RS(r.gain),h,"cg.land."+i);
}

function aggBlock(id,title,ref,path,o,r,opts){opts=opts||{};let h="";
  if(opts.unq){
    h+=row("a · Full value — unquoted shares (received/receivable)",inp(path+".unqCons",{n:1}),{ref:"6aia"});
    h+=row("b · Fair market value of unquoted shares (Rule 11UA)",inp(path+".unqFmv",{n:1}),{ref:"aib"});
    h+=row("ii · Full value — assets other than unquoted shares",inp(path+".othCons",{n:1}),{ref:"aii"});
    h+=calcRow("iii · Total consideration (higher of a/b + ii)","aiii",r.cons);
  } else {
    h+=row("a · Full value of consideration",inp(path+".cons",{n:1}),{ref:"ia"});
  }
  h+=row("bi · Cost of acquisition (without indexation)",inp(path+".cost",{n:1}),{ref:"bi",ind:1});
  h+=row("bii · Cost of improvement (without indexation)",inp(path+".improve",{n:1}),{ref:"bii",ind:1});
  h+=row("biii · Expenditure w&e on transfer",inp(path+".exp",{n:1}),{ref:"biii",ind:1});
  h+=calcRow("biv · Total deductions u/s 48","biv",r.biv);
  h+=calcRow("c · Balance",id.charAt(0)==="a"?"c":"3c",r.c);
  if(opts.loss94)h+=row("d · Loss disallowed u/s 94(7)/94(8)",inp(path+".loss94",{n:1}),{ref:"id"});
  if(opts.dcg)h+=row("e · Deemed STCG on depreciable assets (Sch DCG item 6)",inp(path+".dcg",{n:1}),{ref:"A6e"});
  (opts.deds||[]).forEach(code=>h+=row("d · Deduction u/s "+code,inp(path+".ded.s"+code,{n:1}),{ref:code,ind:1}));
  h+=calcRow(title+" gain",ref,r.gain);
  return fold(id,ref,title,RS(r.gain),h,{});
}

function setoffTable(G){
  const KEYS=["st20","st30","stApp","stDTAA","lt125","ltDTAA"];
  const LBL={st20:"STCG @20%",st30:"STCG @30%",stApp:"STCG applicable",stDTAA:"STCG DTAA",
    lt125:"LTCG @12.5%",ltDTAA:"LTCG DTAA"};
  let h='<div class="full"><table class="gt" style="min-width:720px"><thead><tr>'+
    '<th class="l">Type of capital gain</th><th>Gain of CY</th><th>Loss set off</th><th>Remaining</th></tr></thead><tbody>';
  KEYS.forEach(k=>{h+='<tr><td class="l">'+esc(LBL[k])+'</td><td class="num">'+cell(G.gain[k])+
    '</td><td class="num">'+cell(G.absorbed[k])+'</td><td class="num">'+cell(G.after[k])+'</td></tr>';});
  h+='</tbody></table></div>';

}

function quartersTable(G){
  const KEYS=["st20","st30","stApp","stDTAA","lt125","ltDTAA"];
  const LBL={st20:"STCG @20%",st30:"STCG @30%",stApp:"STCG applicable",stDTAA:"STCG DTAA",
    lt125:"LTCG @12.5%",ltDTAA:"LTCG DTAA"};
  const ed=!!S.cg.editF;
  let h='<div class="full"><table class="gt" style="min-width:820px"><thead><tr><th class="l">Gain</th>'+
    '<th>Upto 15/6</th><th>16/6–15/9</th><th>16/9–15/12</th><th>16/12–15/3</th><th>16/3–31/3</th></tr></thead><tbody>';
  KEYS.forEach(k=>{h+='<tr><td class="l">'+esc(LBL[k])+'</td>';
    for(let q=0;q<5;q++){const v=(G.F[k]||[])[q]||0;
      h+='<td>'+(ed?inp("cg.Fover."+k+"."+q,{n:1}):cell(v))+'</td>';}
    h+='</tr>';});
  h+='</tbody></table></div>';
  return h;
}

function secCg(){
  const G=S.C.cg||{on:false};
  if(!G.on){
    return note("Turn this on to open Schedule CG — land/building, slump sale, listed equity (112A), other assets, deemed gains, pass-through, DTAA, buy-back losses, and Virtual Digital Assets.")+
      row("Report capital gains?",sel("cg.on",[["true","Yes"]],{blank:true}),{ref:"Schedule CG · C3"});
  }
  const C=S.cg;let h="";
  /* master toggle */
  h+=row("Report capital gains?",sel("cg.on",[["false","No"],["true","Yes"]],{blank:false}),{ref:"Schedule CG"});
  /* ---- A · short-term ---- */
  let a="";
  (G.land.st||[]).forEach(p=>a+=landBlock(p,p._i,false));
  a+='<button class="add" data-addland="Short">Add a short-term property (A1)</button>';
  a+=fold("cga2","A2c","A2 · Slump sale (STCG)",RS(G.A.a2.gain),
    row("ai · FMV as per Rule 11UAE(2)",inp("cg.a2.fmv2",{n:1}),{ref:"2ai"})+
    row("aii · FMV as per Rule 11UAE(3)",inp("cg.a2.fmv3",{n:1}),{ref:"2aii"})+
    calcRow("aiii · Full value (higher of ai/aii)","2aiii",G.A.a2.value)+
    row("b · Net worth of the undertaking",inp("cg.a2.networth",{n:1}),{ref:"2b"})+
    calcRow("c · STCG from slump sale (2aiii − 2b)","A2c",G.A.a2.gain),{});
  a+=aggBlock("cga3i","A3(i) · 111A equity share / EOMF (STT paid)","A3ie","cg.a3i",C.a3i,G.A.a3i,{loss94:1});
  a+=aggBlock("cga6","A6 · STCG on other assets","A6g","cg.a6",C.a6,G.A.a6,{unq:1,loss94:1,dcg:1,deds:["54G","54GA"]});
  /* A7 deemed */
  a+=fold("cga7","A7","A7 · Amount deemed to be STCG",RS(G.A.a7.gain),
    grid("cg.a7.deem",[
      {h:"PY of transfer",k:"py",t:"sel",opts:DEEM_ST_PY},
      {h:"Section",k:"sec",t:"sel",opts:DEEM_ST_SEC},
      {h:"Amount unutilised",k:"unused",t:"num"}
    ],(C.a7||{}).deem||[],{empty:"No unutilised CGAS.",add:"Add a row",min:"620px"})+
    row("b · Other amount deemed STCG u/s 54B/54G/54GA",inp("cg.a7.other",{n:1}),{ref:"7b"})+
    calcRow("Total deemed STCG","A7",G.A.a7.gain),{});
  /* A8 PTI */
  a+=fold("cga8","A8","A8 · Pass-through STCG (Sch PTI)",RS(G.A.a8.gain),
    row("a · chargeable @ 20%",inp("cg.a8.r20",{n:1}),{ref:"8a"})+
    row("b · chargeable @ 30%",inp("cg.a8.r30",{n:1}),{ref:"8b"})+
    row("c · at applicable rates",inp("cg.a8.rApp",{n:1}),{ref:"8c"})+
    calcRow("Total pass-through STCG","A8",G.A.a8.gain),{});
  /* A(A) buy-back STCL */
  a+=fold("cgaA","A(A)","A(A) · Capital loss on buy-back of shares (STCL)",RS(-G.A.aA.loss),
    grid("cg.aA",[{h:"Rate",k:"rate",t:"sel",opts:BBST},{h:"Loss amount",k:"amt",t:"num"}],
      C.aA||[],{empty:"No buy-back loss.",add:"Add a row",min:"560px"}),{});
  a+=calcRow("A10 · Total short-term capital gain","A10",G.A.total);
  h+=fold("cgA","A · STCG","Short-term capital gains",RS(G.A.total),a,{def:true});

  /* ---- B · long-term ---- */
  let b="";
  (G.land.lt||[]).forEach(p=>b+=landBlock(p,p._i,true));
  b+='<button class="add" data-addland="Long">Add a long-term property (B1)</button>';
  b+=fold("cgb2","B2e","B2 · Slump sale (LTCG)",RS(G.B.b2.gain),
    row("ai · FMV as per Rule 11UAE(2)",inp("cg.b2.fmv2",{n:1}),{ref:"2ai"})+
    row("aii · FMV as per Rule 11UAE(3)",inp("cg.b2.fmv3",{n:1}),{ref:"2aii"})+
    calcRow("aiii · Full value (higher of ai/aii)","2aiii",G.B.b2.value)+
    row("b · Net worth of the undertaking",inp("cg.b2.networth",{n:1}),{ref:"2b"})+
    calcRow("c · Balance (2aiii − 2b)","2c",G.B.b2.c)+
    row("di · Deduction u/s 54EC",inp("cg.b2.ded.s54EC",{n:1}),{ref:"di",ind:1})+
    row("dii · Deduction u/s 54F",inp("cg.b2.ded.s54F",{n:1}),{ref:"dii",ind:1})+

/* =====================================================================
   CHECKS
   ===================================================================== */
function chkCg(){
  const out=[];const G=S.C.cg;if(!G||!G.on)return out;
  const C=S.cg;
  /* 50C — stamp value more than 10% above consideration (CG book Q10/Q147) */
  (C.land||[]).forEach((p,i)=>{const r=p._;if(r&&!r.safe)
    out.push({lvl:"warn",t:"Property "+(i+1)+" · section 50C",
      m:"Stamp value exceeds consideration by more than 10% — the stamp value is adopted as full value.",sec:"cg"});});
  /* mutual exclusion 112A vs 115AD (both books §8) */
  const has112=(C.s112a||[]).some(r=>N((r._||{}).sale)||N(r.cost));
  const has115=(C.s115ad||[]).some(r=>N((r._||{}).sale)||N(r.cost));
  if(has112&&has115)out.push({lvl:"err",t:"Schedule 112A vs 115AD",
    m:"A row filled in Schedule 112A bars Schedule 115AD(1)(iii) proviso, and vice versa.",sec:"cg"});
  /* 115AD is FII/FPI (non-resident) only */
  if(has115&&!G.nri)out.push({lvl:"err",t:"Schedule 115AD",
    m:"Schedule 115AD(1)(iii) proviso applies only to a non-resident FII/FPI.",sec:"cg"});
  /* VDA: dates not after 31 March of the FY; loss floored to nil */
  (C.vda||[]).forEach((r,i)=>{const dS=D(r.sale),dA=D(r.buy);
    if((dS&&dS>YREND)||(dA&&dA>YREND))out.push({lvl:"err",t:"Schedule VDA row "+(i+1),
      m:"Date of acquisition/transfer cannot be after 31 March of the financial year.",sec:"cg"});});
  /* consideration nil but expenses claimed (CG book §3 cross-rule) */
  (C.land||[]).forEach((p,i)=>{if(!N(p.cons)&&(N(p.cost)||N(p.exp)))
    out.push({lvl:"warn",t:"Property "+(i+1)+" · section 48",
      m:"Where full value of consideration is zero, deductions u/s 48 cannot be claimed.",sec:"cg"});});
  /* everything reconciled */
  if(G.C3!==0||G.A.total||G.B.total)
    out.push({lvl:"ok",t:"Capital gains",m:"C3 income chargeable under CAPITAL GAINS = "+RS(G.C3)+".",sec:"cg"});
  return out;
}

reg({id:"cg", t:"Capital gains", ref:"Schedule CG · 112A · 115AD · VDA",

/* ===================================================================
   Schedule 80D engine — the four self/parents (non-senior / senior)
   blocks, the ₹25,000 / ₹50,000 ceilings, ₹5,000 shared preventive
   check-up cap, medical expenditure only where no insurance is taken
   (VI_A.md: helper rows R30/R32/S34/T34; Q34/Q35/R34/R35 sub-caps).
   =================================================================== */
function engDed80D(){
  const d=S.ded.d80||{}; const g=k=>N(d[k]);
  const ins=k=>(d[k]||[]).reduce((s,r)=>s+N(r.amt),0);
  const aHI=ins("selfIns"),aPHC=g("selfPHC");
  const bHI=ins("selfSrIns"),bPHC=g("selfSrPHC"),bMed=g("selfSrMed");
  const cHI=ins("parIns"),cPHC=g("parPHC");
  const dHI=ins("parSrIns"),dPHC=g("parSrPHC"),dMed=g("parSrMed");
  const selfSr=d.selfSr==="Y",parSr=d.parSr==="Y";
  const selfClaim=d.selfSr!=="N/A",parClaim=d.parSr!=="N/A";
  let phcAll=5000; const take=v=>{const t=Math.min(v,phcAll);phcAll-=t;return t;};   /* ₹5,000 in all */
  const aPHCu=selfClaim&&!selfSr?take(aPHC):0, bPHCu=selfClaim&&selfSr?take(bPHC):0;
  const cPHCu=parClaim&&!parSr?take(cPHC):0, dPHCu=parClaim&&parSr?take(dPHC):0;
  const selfTot=selfClaim?(selfSr?Math.min(50000,bHI+bMed+bPHCu):Math.min(25000,aHI+aPHCu)):0;
  const parTot =parClaim?(parSr?Math.min(50000,dHI+dMed+dPHCu):Math.min(25000,cHI+cPHCu)):0;
  return {aHI:R(aHI),aPHC:R(aPHC),aPHCu:R(aPHCu),bHI:R(bHI),bPHC:R(bPHC),bPHCu:R(bPHCu),bMed:R(bMed),
    cHI:R(cHI),cPHC:R(cPHC),cPHCu:R(cPHCu),dHI:R(dHI),dPHC:R(dPHC),dPHCu:R(dPHCu),dMed:R(dMed),
    selfTot:R(selfTot),parTot:R(parTot),eligible:R(Math.min(100000,selfTot+parTot)),
    selfSr,parSr,selfClaim,parClaim};
}

/* Schedule 80G eligible amount — buckets A/B/C/D, cash>2,000 disallowed,
   C & D subject to the 10%-of-adjusted-GTI qualifying limit (100%/50%). */
function engDed80G(gtiLimit){
  const rows=S.ded.g80||[];
  const base=r=>N(r.other)+(N(r.cash)>2000?0:N(r.cash));  /* cash over ₹2,000 gives no deduction */
  let A=0,B=0,C=0,D=0,gross=0,cash=0,other=0;
  rows.forEach(r=>{const b=base(r);gross+=N(r.amt);cash+=N(r.cash);other+=N(r.other);
    if(r.bucket==="A")A+=b; else if(r.bucket==="B")B+=b; else if(r.bucket==="C")C+=b; else if(r.bucket==="D")D+=b;});
  const ql=Math.max(0,R(0.1*Math.max(0,gtiLimit)));           /* qualifying limit for C + D */
  const cE=Math.min(C,ql), dPool=Math.max(0,ql-cE), dE=Math.min(D,dPool);
  const eligible=R(A + 0.5*B + cE + 0.5*dE);
  return {eligible,gross:R(gross),cash:R(cash),other:R(other)};
}

/* ===================================================================
   engDed — build S.C.ded from S.ded. Deductions do NOT add to GTI, so
   S.C.ded.income = 0; the allowed VI-A total is exposed for the tax
   section to subtract when it rolls up Total Income (= GTI − VI-A).
   =================================================================== */
function engDed(){
  const V={};                                    /* the result object */
  const status=(S.pi||{}).status||"I";           /* I individual, H HUF */
  const isHUF=status==="H";
  const nri=(S.pi||{}).res!=="RES";
  /* best-effort GTI (heads run at order < 40). Sheet8b GrossTotalIncome
     less income taxed at special rates → the ceiling W3 (VI_A.md). The tax
     section (order 90) re-applies the authoritative cap on Total Income. */
  const head=h=>((S.C||{})[h]||{}).income||0;
  const gtiEst=R(head("sal")+head("hp")+head("bp")+head("cg")+head("os"));
  const splRate=R(((S.C||{}).cg||{}).splRate||0)+R(((S.C||{}).os||{}).splRate||0);
  const gtiLimit=Math.max(0,gtiEst-splRate);     /* [W3] */

  const d80=engDed80D(); S.C.d80=d80;
  const g80=engDed80G(gtiLimit); S.C.g80=g80;
  const et=k=>(S.ded.e80[k]||[]).reduce((s,r)=>s+N(r.interest),0);
  /* 80GGA cash>10,000 gives no deduction; 80GGC in cash gives none */
  const gga=(S.ded.gga||[]).reduce((s,r)=>s+(r.mode==="CASH"&&N(r.amt)>10000?0:N(r.amt)),0);
  const ggc=(S.ded.ggc||[]).reduce((s,r)=>s+(r.mode==="CASH"?0:N(r.amt)),0);

  /* claimed amounts per VI-A letter (fed from a sub-schedule where one exists) */
  const fed={
    c80c:(S.ded.c80c||[]).length?(S.ded.c80c||[]).reduce((s,r)=>s+N(r.amt),0):N(S.ded.v.c80c),
    c80ccc:(S.ded.pen80ccc||[]).length?(S.ded.pen80ccc||[]).reduce((s,r)=>s+N(r.amt),0):N(S.ded.v.c80ccc),
    c80d:d80.eligible, c80dd:N(S.ded.dd80.amt),
    c80e:et("e"), c80ee:et("ee"), c80eea:et("eea"), c80eeb:et("eeb"),
    c80g:g80.eligible, c80gga:gga, c80ggc:ggc,
    c80ia:N(S.ded.ia.amt), c80ib:N(S.ded.ib.amt), c80ie:N(S.ded.ie.amt),
    c80u:N(S.ded.u80.amt)};
  const claim=k=>fed[k]!==undefined?N(fed[k]):N(S.ded.v[k]);

  const out={},why={},allow=k=>!isNew()||DED_VIA_NEW.indexOf(k)>=0;
  DED_VIA.forEach(x=>{const k=x[0],cap=x[3]; let c=claim(k);
    /* per-item statutory caps that depend on the claimant */
    if(k==="c80dd"&&c){const sev=(S.ded.dd80||{}).nature==="2";const cp=sev?125000:75000;if(c>cp){why[k]="capped at "+RS(cp);c=cp;}}
    if(k==="c80u"&&c){const sev=(S.ded.u80||{}).nature==="2";const cp=sev?125000:75000;if(c>cp){why[k]="capped at "+RS(cp);c=cp;}}
    if(k==="c80ddb"&&c){const cp=(S.ded.v.ddb_type==="2")?100000:40000;if(c>cp){why[k]="capped at "+RS(cp);c=cp;}}
    if(k==="c80ccc"&&isHUF&&c){why[k]="a HUF cannot claim 80CCC";c=0;}      /* K7 */
    if(k==="c80e"&&isHUF&&c){why[k]="a HUF cannot claim 80E";c=0;}          /* K39 */
    if(k==="c80gga"&&c&&head("bp")>0){why[k]="not available where there is business income";c=0;} /* K46 */
    if(!allow(k)){out[k]=0;why[k]=c?"closed by section 115BAC":"";return;}
    if(cap&&c>cap&&!why[k]){why[k]="capped at "+RS(cap);c=cap;}
    out[k]=R(c);});

  /* 80C + 80CCC + 80CCD(1) share the ₹1,50,000 ceiling (W5/K6/K7/K13) */
  const cce=out.c80c+out.c80ccc+out.c80ccd1;
  if(cce>150000){const f=150000/cce;out.c80c=R(out.c80c*f);out.c80ccc=R(out.c80ccc*f);
    out.c80ccd1=150000-out.c80c-out.c80ccc;
    why.c80c=(why.c80c?why.c80c+", ":"")+"80C, 80CCC and 80CCD(1) together stop at ₹1,50,000";}

  /* 80CCD(2) employer limit — 14% (Govt) / 10% of basic+DA where known (K29/A783) */
  if(out.c80ccd2){const base=R(((S.C||{}).sal||{}).basicDA||((S.C||{}).sal||{}).basic||0);
    if(base>0){const govt=!!((S.C||{}).sal||{}).anyGovt;const cp=R((govt?0.14:0.10)*base);
      if(out.c80ccd2>cp){why.c80ccd2="limited to "+(govt?"14%":"10%")+" of basic + DA = "+RS(cp);out.c80ccd2=cp;}}}

  /* 80TTA / 80TTB — mutually exclusive; limited to the interest actually earned (K64/K65) */
  const os={sav:((S.C||{}).os||{}).sav||0,dep:((S.C||{}).os||{}).dep||0};
  if(senior()){if(out.c80tta){why.c80tta="a senior citizen claims 80TTB instead";out.c80tta=0;}}
  else if(out.c80ttb){why.c80ttb="80TTB is only for a resident senior citizen";out.c80ttb=0;}
  if(out.c80tta&&out.c80tta>os.sav){why.c80tta="limited to the savings-bank interest";out.c80tta=R(os.sav);}
  if(out.c80ttb&&out.c80ttb>os.sav+os.dep){why.c80ttb="limited to the interest earned";out.c80ttb=R(os.sav+os.dep);}

  /* non-resident restrictions (VI_A.md K36/K66/K37; 80TTB/80QQB/80RRB) */
  if(nri){["c80dd","c80ddb","c80u","c80ttb","c80qqb","c80rrb"].forEach(k=>{if(out[k]){why[k]="not available to a non-resident";out[k]=0;}});}
  /* 80U/80TTB cannot be claimed by a HUF (A766/A772) */
  if(isHUF){["c80u","c80ttb"].forEach(k=>{if(out[k]){why[k]="not available to a HUF";out[k]=0;}});}

  /* part totals (K48 / K62 / K69), each min'd against the GTI ceiling */
  const sumOf=arr=>arr.reduce((a,k)=>a+R(out[k]||0),0);
  const rawB=sumOf(DED_PARTB), rawC=sumOf(DED_PARTC), rawCAD=sumOf(DED_PARTCAD);
  const partB=Math.max(0,Math.min(rawB,gtiLimit));
  const partC=Math.max(0,Math.min(rawC,gtiLimit));
  const partCAandD=Math.max(0,Math.min(rawCAD,gtiLimit));
  const total=rawB+rawC+rawCAD;                         /* v · total of a to ib */
  const allowed=Math.max(0,Math.min(R(partB+partC+partCAandD),gtiLimit));  /* K70 */

  /* Schedule 10AA (SEZ) — a section-10AA deduction, NOT Chapter VI-A; closed
     under the new regime (A633). Shown on Part B-TI as DeductionsUnder10Aor10AA. */
  const aa10Raw=(S.ded.aa10||[]).reduce((s,r)=>s+N(r.amt),0);
  const ded10AA=isNew()?0:Math.max(0,Math.min(R(aa10Raw),gtiLimit));

  S.C.ded={income:0,           /* a deduction head contributes 0 to GTI */
    out,why,fed,total:R(total),partB:R(partB),partC:R(partC),partCAandD:R(partCAandD),
    allowed:R(allowed),clipped:total>gtiLimit,ded10AA:R(ded10AA),aa10Raw:R(aa10Raw),
    gtiEst,gtiLimit,conc:isNew()};
}

  /* 80GGC */
  const ggcsum=(S.ded.ggc||[]).reduce((s,r)=>s+N(r.amt),0);
  h+=card("d80ggc","Schedule 80GGC — contribution to a political party / electoral trust",ggcsum?RS(ggcsum):"",

      {k:"pan",h:"PAN",t:"txt",w:"120px",max:10,req:1},{k:"mode",h:"Mode",t:"sel",w:"120px",req:1,opts:[["CASH","Cash"],["OTH","Other than cash"]]},
      {k:"ref",h:"Transaction reference",t:"txt",w:"160px",max:50},{k:"ifsc",h:"IFSC",t:"txt",w:"120px",max:11},{k:"amt",h:"Amount",t:"num",w:"120px",req:1}],
      S.ded.ggc||[],{min:"1100px",empty:"No contribution listed.",add:"Add a contribution"})+
    note("A contribution in cash gives no deduction at all.","warn"));
  /* 10AA (SEZ) — a section-10AA deduction, kept with the deductions screen */
  const aasum=(S.ded.aa10||[]).reduce((s,r)=>s+N(r.amt),0);
  h+=card("d10aa","Schedule 10AA — units in a Special Economic Zone",(V.ded10AA||0)?RS(V.ded10AA):(aasum?RS(aasum):""),
    (isNew()?note("Closed under the new regime (section 115BAC).","stop"):"")+
    grid("ded.aa10",[{k:"ay",h:"Assessment year the unit began to manufacture / provide services",t:"txt",w:"auto",req:1,ph:"e.g. 2019-20"},
      {k:"amt",h:"Amount of deduction",t:"num",w:"200px",req:1}],S.ded.aa10||[],{min:"640px",empty:"No unit listed.",add:"Add a unit",
      foot:[{l:1,v:"Total deduction under section 10AA",span:1},{v:aasum}]})+
    note("Under section 10AA(1) the deduction is available up to assessment year 2022-23.","warn"));

  /* how the total income comes out */
  h+='<div class="cgband">How the total income comes out</div>';
  h+=row("Gross total income",cell(S.C.gti||V.gtiEst||0),{cls:"tot",hint:"set by Part B — total income and tax"});

   expDed — write the schema blocks onto j
   =================================================================== */
function expDed(j){
  const V=S.C.ded||{out:{},fed:{}}; const out=V.out||{}, fed=V.fed||{};
  const claim=k=>fed[k]!==undefined?N(fed[k]):N(S.ded.v[k]);

  /* ---- ScheduleVIA (always present; required totals even at zero) ---- */
  const usr={},ded={};
  const regOpen=k=>!isNew()||DED_VIA_NEW.indexOf(k)>=0;   /* claimed side blank for items closed by 115BAC */
  Object.keys(DED_MAP).forEach(k=>{const f=DED_MAP[k];const c=claim(k);
    if(c&&regOpen(k))put(usr,f,n0(c));
    if(out[k])put(ded,f,n0(out[k]));});
  /* 80CCH + any-other roll into AnyOthSec80CCH */
  const cchClaim=claim("c80cch")+(regOpen("c80oth")?claim("c80oth"):0);
  const cchOut=n0(out.c80cch)+n0(out.c80oth);
  if(cchClaim)usr.AnyOthSec80CCH=n0(Math.min(cchClaim,288000));
  if(cchOut)ded.AnyOthSec80CCH=n0(Math.min(cchOut,288000));

  /* the four totals on the user (claimed) side */
  usr.TotPartBchapterVIA=n0(V.partB);
  usr.TotPartCchapterVIA=n0(V.partC);
  usr.TotPartCAandDchapterVIA=n0(V.partCAandD);
  usr.TotalChapVIADeductions=n0(V.total);
  /* the four totals on the calculated (allowed) side — trim to the allowed cap */
  ded.TotPartBchapterVIA=n0(V.partB);
  ded.TotPartCchapterVIA=n0(V.partC);
  ded.TotPartCAandDchapterVIA=n0(V.partCAandD);
  ded.TotalChapVIADeductions=n0(V.allowed);

  /* identifier / PRAN / ddb / ack — on the claimed object (VI_A.md) */

/* ===================================================================
   chkDed — the sheet's own rules, regime-aware
   =================================================================== */
function chkDed(){
  const out=[]; const V=S.C.ded||{out:{},why:{}}; const o=V.out||{};
  const add=(lvl,t,m)=>out.push({lvl,t,m,sec:"ded"});
  const isHUF=(S.pi||{}).status==="H";
  /* new regime — warn where a closed item still carries a claimed value (A696/A710/A766/A646/A652/A661/A687/A688/A633) */
  if(isNew()){
    const barred=DED_VIA.filter(x=>DED_VIA_NEW.indexOf(x[0])<0)
      .filter(x=>{const k=x[0];const c=V.fed&&V.fed[k]!==undefined?N(V.fed[k]):N(S.ded.v[k]);return c>0;}).map(x=>x[2].split(" — ")[0]);
    if(barred.length)add("warn","Closed under the new regime","These are not allowed under section 115BAC and have been set to zero: "+barred.join(", ")+". Only 80CCD(2), 80CCH and 80JJAA survive (rules A696/A710/A646/A652/A661/A687/A688).");
    if((S.ded.aa10||[]).some(r=>N(r.amt)))add("warn","Schedule 10AA closed","Schedule 10AA must be blank under the new regime (rule A633); it has been set to zero.");
  }
  /* PRAN required for 80CCD(1B) (VI_A.md K18) */
  if((N(S.ded.v.c80ccd1b)||o.c80ccd1b)&&!/^\d{12}$/.test(st0(S.ded.v.pran)))
    add("err","PRAN required","A 12-digit PRAN is required to claim 80CCD(1B).");
  /* Form 10BA for 80GG */
  if(N(S.ded.v.c80gg)&&!/^\d{15}$/.test(st0(S.ded.v.ack10ba)))
    add("err","Form 10BA acknowledgement","A 15-digit Form 10BA acknowledgement number is required to claim 80GG.");
  /* Form 10CCD / 10CCE for 80QQB / 80RRB */
  if(N(S.ded.v.c80qqb)&&!/^\d{15}$/.test(st0(S.ded.v.ack10ccd)))add("err","Form 10CCD acknowledgement","80QQB is allowed only if Form 10CCD is filed — enter its 15-digit acknowledgement number.");
  if(N(S.ded.v.c80rrb)&&!/^\d{15}$/.test(st0(S.ded.v.ack10cce)))add("err","Form 10CCE acknowledgement","80RRB is allowed only if Form 10CCE is filed — enter its 15-digit acknowledgement number.");
  /* 80CCD(2) 14% / 10% ceiling (A783/A797) */
  if(V.why&&V.why.c80ccd2)add("warn","80CCD(2) limited",V.why.c80ccd2+" (rules A783/A797).");
  /* HUF cannot claim 80U / 80TTB (A766/A772) / 80CCC / 80E */
  if(isHUF&&(N(S.ded.u80&&S.ded.u80.amt)||N(S.ded.v.c80ttb)))add("warn","Not available to a HUF","80U and 80TTB cannot be claimed by a HUF (rules A766/A772); they have been set to zero.");
  /* 80GGA not with business income (K46) */
  if(V.why&&V.why.c80gga==="not available where there is business income")add("warn","80GGA and business income","80GGA cannot be claimed where there is business or professional income (VI-A rule K46); it has been set to zero.");
  /* Chapter VI-A capped at GTI */
  if(V.clipped)add("warn","Deductions capped","The Chapter VI-A total is limited to the gross total income less income taxed at special rates.");
  /* a settled figure */
  if((V.allowed||0)>0)add("ok","Deductions allowed","Chapter VI-A deduction allowed: "+RS(V.allowed)+(V.ded10AA?"; section 10AA: "+RS(V.ded10AA):"")+".");
  return out;
}

function engEi(){

  isNew();  /* regime read — no closures apply to Schedule EI (see header) */

  /* line 1 */

  /* line 2 — the agricultural working */
  const grossAgri = R(E.grossAgri);                                 /* 2i  GrossAgriRecpt */
  const expAgri   = R(E.expAgri);                                   /* 2ii ExpIncAgri */
  const unabAgri  = R(E.unabAgri);                                  /* 2iii UnabAgriLossPrev8 */
  /* 2iv = MAX(0, Sch BP Sl.No.38 balance income deemed to be from agriculture) [J10] */

  /* land rows (2vi) — only meaningful when net2v > 5 lakh */

    district:st0((r||{}).district), pin:st0((r||{}).pin),
    meas:N((r||{}).meas), owned:st0((r||{}).owned), irr:st0((r||{}).irr),
    filled: !!(st0((r||{}).district)||st0((r||{}).pin)||N((r||{}).meas)||st0((r||{}).owned)||st0((r||{}).irr))
  }));

    cat:st0((r||{}).cat), sub:st0((r||{}).sub), desc:st0((r||{}).desc),

  const passThr = R(E.passThr);                                     /* PassThrIncNotChrgblTax */

  const total6 = Math.max(0, interest + net2v + Others + dtaaTotal + passThr); /* TotalExemptInc */

  C.passThr = passThr;
  C.total = total6;
  C.needLand = net2v > EI_5L;

  /* rate effect — publish net agri income for the tax section (partial integration) */
  S.C.eiAgri = net2v;

  /* exempt income adds nothing to Gross Total Income */
  C.income = 0;
}

/* ---- renderer ---------------------------------------------------- */
function secEi(){
  const E = S.ei||{}, C = S.C.ei||{};
  let h = "";
  h += note('Schedule EI collects income that is not chargeable to tax. Nothing here is taxed. Two figures still matter: the <b>net agricultural income</b> at Sl. No. 2 is carried for rate purposes (partial integration), and Sl. No. 2(iv) &amp; Sl. No. 5 reconcile to Schedule BP (Sl. No. 38) and Schedule PTI. Exempt income is unaffected by the new tax regime.');

  /* ===== 1 · Interest income ===== */
  h += row("1 · Interest income", inp("ei.interest",{n:1}), {ref:"InterestInc"});

  /* ===== 2 · Agricultural income working ===== */
  h += sub("2 · Agricultural income");
  h += row("i · Gross agricultural receipts (other than income excluded under rule 7A/7B/8)",
           inp("ei.grossAgri",{n:1}), {ref:"GrossAgriRecpt", ind:1});
  h += row("ii · Expenditure incurred on agriculture", inp("ei.expAgri",{n:1}),
           {ref:"ExpIncAgri", ind:1});
  h += row("iii · Unabsorbed agricultural loss of the previous eight assessment years",
           inp("ei.unabAgri",{n:1}), {ref:"UnabAgriLossPrev8", ind:1});
  h += row("iv · Agricultural income portion under Rule 7/7A/7B(1)/7B(1A)/8 (from Sl. No. 38 of Schedule BP)",
           cell(C.agri4), {ref:"AgriIncRule7and8", ind:1, hint:"= MAX(0, Sch BP Sl.No.38); auto-pulled"});
  h += row("v · Net agricultural income for the year (i − ii − iii + iv; nil if loss)",
           cell(C.net2v), {ref:"NetAgriIncOrOthrIncRule7", ind:1, req:1});

  /* 2(vi) — land details, only when 2(v) > Rs.5 lakh */
  if(C.needLand){
    h += note("Net agricultural income exceeds ₹5,00,000 — the details of each agricultural land are mandatory (Sl. No. 2(vi)).","warn");
    h += grid("ei.land",[
      {k:"district",h:"District (with PIN)",t:"txt",max:125,w:"200px",req:1},
      {k:"pin",h:"PIN code",t:"txt",max:6,w:"100px",req:1,ph:"6-digit"},
      {k:"meas",h:"Measurement (Acre)",t:"num",w:"130px",req:1},
      {k:"owned",h:"Owned / Leased",t:"sel",opts:EI_OWNED,w:"150px",req:1},
      {k:"irr",h:"Irrigated / Rain-fed",t:"sel",opts:EI_IRR,w:"160px",req:1}
    ], E.land||[], {min:"760px", empty:"Add each agricultural land parcel.", add:"Add a land parcel"});
  } else {
    h += note("The land table (Sl. No. 2(vi)) opens only when net agricultural income exceeds ₹5,00,000.");
  }

  /* ===== 3 · Other exempt income ===== */
  h += sub("3 · Other exempt income (including exempt income of a minor child)");
  {
    let t = '<div class="full"><table class="gt" style="min-width:820px"><thead><tr>'+
      '<th>Sl</th><th class="l">Category</th><th class="l">Sub-Category</th>'+
      '<th class="l">Description</th><th class="req">Amount</th><th class="x"></th></tr></thead><tbody>';
    const rows = E.others||[];
    if(!rows.length){
      t += '<tr><td class="emp" colspan="6">Nothing entered.</td></tr>';
    } else {
      rows.forEach((r,i)=>{
        const pre = "ei.others."+i+".";
        const subOpts = eiSubOpts(st0(r.cat));
        t += '<tr><td class="num">'+(i+1)+'</td>'+
          '<td class="l">'+sel(pre+"cat", EI_CAT, {style:"width:100%"})+'</td>'+
          '<td class="l">'+sel(pre+"sub", subOpts, {style:"width:100%"})+'</td>'+
          '<td>'+inp(pre+"desc",{max:125})+'</td>'+
          '<td>'+inp(pre+"amt",{n:1})+'</td>'+
          '<td class="x"><button data-del="ei.others.'+i+'" title="Remove">'+TRASH+'</button></td></tr>';
      });
      t += '<tr><td class="l" colspan="4"><b>Total (other exempt income)</b></td>'+
        '<td class="num">'+cell(C.othersTot)+'</td><td></td></tr>';
    }
    t += '</tbody></table></div><button class="add" data-add="ei.others">Add an exempt-income row</button>';
    h += t;
    h += note("Choose the Category first; the Sub-Category list is filtered to that category (dependent dropdown). The row total feeds Sl. No. 3 (Others).");
  }

  /* ===== 4 · Income not chargeable as per DTAA (non-residents only) ===== */
  h += sub("4 · Income claimed not chargeable to tax as per DTAA (non-residents only)");
  h += grid("ei.dtaa",[
    {k:"amt",h:"Amount of income",t:"num",w:"140px",req:1},
    {k:"nature",h:"Nature of income",t:"txt",max:75,w:"170px"},
    {k:"cname",h:"Country name",t:"txt",max:55,w:"160px",req:1},
    {k:"ccode",h:"Country code",t:"sel",opts:EI_CTRY,w:"200px",req:1},
    {k:"article",h:"Article of DTAA",t:"txt",max:16,w:"130px"},
    {k:"head",h:"Head of income",t:"sel",opts:EI_HEAD,w:"200px",req:1},
    {k:"trc",h:"TRC obtained",t:"sel",opts:EI_TRC,w:"120px"}
  ], E.dtaa||[], {min:"1120px", empty:"For non-residents only.", add:"Add a DTAA row",
     foot:[{v:(C.dtaaTotal||0)},{l:1,v:"Total income from DTAA claimed not chargeable (Sl. No. 4)",span:6}]});

  /* ===== 5 · Pass-through income ===== */
  h += row("5 · Pass-through income claimed not chargeable to tax (Schedule PTI)",
           inp("ei.passThr",{n:1}), {ref:"PassThrIncNotChrgblTax",
           hint:"must equal the exempt pass-through in Schedule PTI"});

  /* ===== 6 · Total ===== */
  h += row("6 · Total exempt income (1 + 2(v) + 3 + 4 + 5)", cell(C.total),
           {ref:"TotalExemptInc", req:1, cls:"tot"});

  return h;
}

/* ---- export ------------------------------------------------------ */
function expEi(j){
  const C = S.C.ei||{}, E = S.ei||{};
  const o = {};

  /* single figures (written only when non-zero, except the two required totals) */
  put(o,"InterestInc", C.interest ? sg(C.interest) : undefined);
  if(C.grossAgri) put(o,"GrossAgriRecpt", sg(C.grossAgri));
  if(C.expAgri)   put(o,"ExpIncAgri", sg(C.expAgri));
  if(C.unabAgri)  put(o,"UnabAgriLossPrev8", sg(C.unabAgri));
  if(C.agri4)     put(o,"AgriIncRule7and8", n0(C.agri4));
  /* required total — always present, even at zero */
  o.NetAgriIncOrOthrIncRule7 = n0(C.net2v);

  /* 2(vi) land table — only when it has rows carrying data */
  const land = (C.land||[]).filter(r=>r.filled);
  if(land.length){
    o.ExcNetAgriInc = { ExcNetAgriIncDtls: land.map(r=>{
      const d = {};
      put(d,"NameOfDistrict",(sv(r.district)||"NA").slice(0,125));
      put(d,"PinCode", R(r.pin)||undefined);
      put(d,"MeasurementOfLand", r.meas ? r.meas : undefined);
      put(d,"AgriLandOwnedFlag", sv(r.owned));
      put(d,"AgriLandIrrigatedFlag", sv(r.irr));
      return d;
    })};
  }

  /* line 3 — other exempt income; write rows carrying an amount */
  const others = (C.others||[]).filter(r=>r.amt || st0(r.cat) || st0(r.sub) || st0(r.desc));
  if(others.length){
    o.OthersInc = { OthersIncDtls: others.map(r=>{
      const d = {};
      put(d,"Category", sv(r.cat));
      put(d,"SubCategory", sv(r.sub));
      put(d,"Description", sv(r.desc) ? sv(r.desc).slice(0,125) : undefined);
      d.OthAmount = n0(r.amt);
      return d;
    })};
    put(o,"Others", n0(C.othersTot));
  }

  /* line 4 — DTAA */
  const dtaa = (C.dtaa||[]).filter(r=>r.amt || st0(r.cname) || st0(r.ccode));
  if(dtaa.length){
    o.IncNotChrgblAsPerDTAA = { IncNotChrgblAsPerDTAADtls: dtaa.map(r=>{
      const d = {};
      d.AmountOfIncome = n0(r.amt);
      put(d,"NatureOfIncome", sv(r.nature) ? sv(r.nature).slice(0,75) : undefined);
      pf(d,"CountryName",(sv(r.cname)||"NA").slice(0,55));
      pf(d,"CountryCodeExcludingIndia", sv(r.ccode));
      put(d,"ArticleOfDTAA", sv(r.article) ? sv(r.article).slice(0,16) : undefined);
      put(d,"HeadOfIncome", sv(r.head));
      put(d,"TRCFlag", sv(r.trc));
      return d;
    })};
    put(o,"IncChrgblAsPerDTAA", n0(C.dtaaTotal));
  }

  /* line 5 */
  if(C.passThr) put(o,"PassThrIncNotChrgblTax", sg(C.passThr));

  /* required total — always present, even at zero */
  o.TotalExemptInc = n0(C.total);

  j.ScheduleEI = o;
}

/* ---- import ------------------------------------------------------ */
function impEi(I3){
  const read = [];
  const EI = I3 && I3.ScheduleEI;
  if(!EI) return read;
  S.ei = S.ei || {};
  const E = S.ei;

  E.interest  = nz(EI.InterestInc);
  E.grossAgri = nz(EI.GrossAgriRecpt);
  E.expAgri   = nz(EI.ExpIncAgri);
  E.unabAgri  = nz(EI.UnabAgriLossPrev8);
  E.passThr   = nz(EI.PassThrIncNotChrgblTax);

  const land = ((EI.ExcNetAgriInc||{}).ExcNetAgriIncDtls)||[];
  E.land = land.map(r=>({
    district:r.NameOfDistrict||"", pin:(r.PinCode!=null?String(r.PinCode):""),
    meas:(r.MeasurementOfLand!=null?String(r.MeasurementOfLand):""),
    owned:r.AgriLandOwnedFlag||"", irr:r.AgriLandIrrigatedFlag||""
  }));

  const others = ((EI.OthersInc||{}).OthersIncDtls)||[];
  E.others = others.map(r=>({
    cat:r.Category||"", sub:r.SubCategory||"", desc:r.Description||"", amt:nz(r.OthAmount)
  }));

  const dtaa = ((EI.IncNotChrgblAsPerDTAA||{}).IncNotChrgblAsPerDTAADtls)||[];
  E.dtaa = dtaa.map(r=>({
    amt:nz(r.AmountOfIncome), nature:r.NatureOfIncome||"", cname:r.CountryName||"",
    ccode:r.CountryCodeExcludingIndia||"", article:r.ArticleOfDTAA||"",
    head:r.HeadOfIncome||"", trc:r.TRCFlag||""
  }));

  read.push("Schedule EI");
  if(E.land.length)   read.push("EI agricultural land");
  if(E.others.length) read.push("EI other exempt income");
  if(E.dtaa.length)   read.push("EI DTAA income");
  return read;
}

/* ---- checks ------------------------------------------------------ */
function chkEi(){
  const out = [], C = S.C.ei||{}, E = S.ei||{};

  /* net agri income > 5 lakh requires the land table (cross-sheet rule) */
  if(C.needLand){
    const rows = (C.land||[]).filter(r=>r.filled);
    if(!rows.length){
      out.push({lvl:"err", t:"Schedule EI · agricultural land",
        m:"Net agricultural income exceeds ₹5,00,000, so the details of each agricultural land (Sl. No. 2(vi)) are mandatory.", sec:"ei"});
    } else {
      rows.forEach((r,i)=>{
        if(!st0(r.district) || !/^\d{6}$/.test(st0(r.pin)) || !(r.meas>0) || !st0(r.owned) || !st0(r.irr))
          out.push({lvl:"err", t:"Schedule EI · agricultural land",
            m:"Land row "+(i+1)+": district, a 6-digit PIN code, measurement, owned/leased and irrigated/rain-fed are all required.", sec:"ei"});
      });
    }
  }

  /* other exempt income rows — amount and category */
  (C.others||[]).forEach((r,i)=>{
    if(r.amt && !st0(r.cat))
      out.push({lvl:"warn", t:"Schedule EI · other exempt income",
        m:"Row "+(i+1)+": an amount is entered but no Category is chosen.", sec:"ei"});
    if((st0(r.cat)||st0(r.sub)||st0(r.desc)) && !r.amt)
      out.push({lvl:"warn", t:"Schedule EI · other exempt income",
        m:"Row "+(i+1)+": a category/description is set but the amount is nil.", sec:"ei"});
  });

  /* DTAA rows — required fields and non-resident applicability */
  const dtaaRows = (C.dtaa||[]).filter(r=>r.amt || st0(r.cname) || st0(r.ccode));
  dtaaRows.forEach((r,i)=>{
    if(!r.amt || !st0(r.cname) || !st0(r.ccode) || !st0(r.head))
      out.push({lvl:"err", t:"Schedule EI · DTAA",
        m:"DTAA row "+(i+1)+": amount, country name, country code and head of income are mandatory.", sec:"ei"});
  });
  if(dtaaRows.length && st0(S.pi&&S.pi.res)==="RES")
    out.push({lvl:"warn", t:"Schedule EI · DTAA",
      m:"The DTAA not-chargeable table (Sl. No. 4) is applicable for non-residents only, but the residential status is Resident.", sec:"ei"});

  /* line 5 must reconcile to Schedule PTI exempt pass-through (guarded cross-read) */
  const ptiExempt = ((S.C.other||{}).pti||[]).reduce((a,b)=>a+R((b.exTot||{}).net||0),0);
  if(R(C.passThr)!==R(ptiExempt) && (R(C.passThr)||R(ptiExempt)))
    out.push({lvl:"warn", t:"Schedule EI · pass-through",
      m:"Sl. No. 5 pass-through income ("+RS(C.passThr)+") should equal the exempt pass-through in Schedule PTI ("+RS(ptiExempt)+").", sec:"ei"});

  return out;
}

const FA_RELSEC=[["90","90"],["90A","90A"],["91","91"]];   /* TR relief section */
const FA_REFFLAG=[["YES","YES"],["NO","NO"]];              /* TR refund flag */

/* ================================================================
   ENGINE — eng<Id>()
   ================================================================ */
function engFa(){
  const C=S.C.fa={income:0, fsi:[], trRows:[], paidTot:0, reliefTot:0, dtaa:0, notDtaa:0};
  /* GTI contribution — foreign income is already inside Part B-TI (FSI.md).
     This head adds nothing to Gross Total Income. */
  C.income=0;

  const res=(S.pi||{}).res||"RES";
  const fsiOn=(res==="RES"||res==="NOR");   /* FSI/TR only for residents */

  if(!fsiOn){S.fa.fsi=S.fa.fsi||[];return;} /* NRI: schedule not applicable — nothing computed */

  (S.fa.fsi||[]).forEach(blk=>{
    const heads=["sal","hp","bus","cg","os"];
    let tb=0,tc=0,td=0,te=0;
    const hc={};
    heads.forEach(k=>{
      const h=blk[k]||{};
      const b=n0(h.b), c=n0(h.c), d=n0(h.d);
      const e=Math.min(c,d);            /* [L7]=MIN(J7,K7): relief = lower of (c) tax paid, (d) tax payable */
      hc[k]={b,c,d,e};
      tb+=b; tc+=c; td+=d; te+=e;       /* [I12..L12]=SUM of the five heads for b,c,d,e */
    });
    const rowC={code:blk.code||"", name:FA_CONM[blk.code]||blk.name||"", tin:blk.tin||"",
                sec:blk.sec||"", heads:hc, tot:{b:tb,c:tc,d:td,e:te}};
    C.fsi.push(rowC);
    /* Schedule TR row is generated from FSI per country:
       (c) = country total tax paid outside India; (d) = country total relief (e) */
    if(blk.code){
      C.trRows.push({code:blk.code, name:FA_CONM[blk.code]||blk.name||"", tin:blk.tin||"",
                     paid:tc, relief:te, sec:blk.sec||""});
    }
  });

  /* TR totals (TR_FA.md rules) */
  C.paidTot   = C.trRows.reduce((a,r)=>a+n0(r.paid),0);     /* [G11]=SUM(TR_TaxPaidOutsideIndia) */
  C.reliefTot = C.trRows.reduce((a,r)=>a+n0(r.relief),0);   /* [H11]=SUM(TR_TaxReliefOutsideIndia) */
  C.notDtaa   = C.trRows.reduce((a,r)=>a+(r.sec==="91"?n0(r.relief):0),0); /* [J14]=SUMIF section="91" */
  C.dtaa      = Math.max(C.reliefTot - C.notDtaa, 0);       /* [J13]=MAX(total - notDtaa,0) */
}

/* ================================================================
   RENDERER — sec<Id>()

function secFa(){

  /* ---------- Schedule TR ---------- */

    faInner+=fold("fa_a4","A4","Foreign Cash Value Insurance / Annuity", cnt(S.fa.a4),

    /* B — Financial Interest in any Entity */
    faInner+=fold("fa_b","B","Financial Interest in any Entity", cnt(S.fa.b),
      grid("fa.b",[

  H+=fold("fa_fa","Schedule FA","Foreign assets & income from any source outside India",

/* small local helpers */
function cnt(a){a=a||[];return a.length?(a.length+" row"+(a.length>1?"s":"")):"None";}
/* a lighter block wrapper for FSI country cards (uses shell blk) */
function blk_(id,title,status,inner,delPath){return blk(id,title,status,inner,delPath);}

/* ================================================================
   EXPORT — exp<Id>(j)   (schema keys verbatim from --leaves)
   ================================================================ */
function expFa(j){
  const res=(S.pi||{}).res||"RES";
  const C=S.C.fa||{fsi:[],trRows:[],paidTot:0,reliefTot:0,dtaa:0,notDtaa:0};
  if(res==="NRI")return;   /* FSI/TR/FA not applicable to non-resident */

  /* ---- ScheduleFSI ---- */
  const fsiArr=[];
  (C.fsi||[]).forEach(cr=>{
    if(!cr.code)return;    /* no country code → row not considered (E5 note) */
    const el={};
    pf(el,"CountryName", cr.name||FA_CONM[cr.code]||"");
    pf(el,"CountryCodeExcludingIndia", cr.code);
    pf(el,"TaxIdentificationNo", cr.tin);
    const H=cr.heads||{};
    const obj=(key,h)=>{h=h||{b:0,c:0,d:0,e:0};const o={};
      /* four required integer leaves, present even at zero */
      o.IncFrmOutsideInd=n0(h.b); o.TaxPaidOutsideInd=n0(h.c);
      o.TaxPayableinInd=n0(h.d);  o.TaxReliefinInd=n0(h.e);
      const art=sv((((S.fa.fsi||[]).find(b=>b.code===cr.code)||{})[key.k]||{}).art);
      if(art&&key.dtaa)o.DTAAReliefUs90or90A=art;
      return o;};
    el.IncFromSal     =obj({k:"sal",dtaa:1},H.sal);
    el.IncFromHP      =obj({k:"hp", dtaa:1},H.hp);
    el.IncFromBusiness=obj({k:"bus",dtaa:1},H.bus);
    el.IncCapGain     =obj({k:"cg", dtaa:1},H.cg);
    el.IncOthSrc      =obj({k:"os", dtaa:1},H.os);
    const t=cr.tot||{b:0,c:0,d:0,e:0};
    el.TotalCountryWise={IncFrmOutsideInd:n0(t.b),TaxPaidOutsideInd:n0(t.c),
                         TaxPayableinInd:n0(t.d),TaxReliefinInd:n0(t.e)};
    fsiArr.push(el);
  });
  if(fsiArr.length)put(j,"ScheduleFSI.ScheduleFSIDtls",fsiArr);

  /* ---- ScheduleTR1 ---- */
  const trArr=[];
  (C.trRows||[]).forEach(r=>{
    const el={};
    pf(el,"CountryName", r.name||FA_CONM[r.code]||"");
    pf(el,"CountryCodeExcludingIndia", r.code);
    pf(el,"TaxIdentificationNo", r.tin);
    el.TaxPaidOutsideIndia=n0(r.paid);
    el.TaxReliefOutsideIndia=n0(r.relief);
    if(sv(r.sec))el.ReliefClaimedUsSection=r.sec;
    trArr.push(el);
  });
  if(trArr.length)put(j,"ScheduleTR1.ScheduleTR",trArr);
  if(trArr.length||C.reliefTot||C.paidTot){
    /* required totals — present even at zero once TR is filed */
    put(j,"ScheduleTR1.TotalTaxPaidOutsideIndia",n0(C.paidTot));
    put(j,"ScheduleTR1.TotalTaxReliefOutsideIndia",n0(C.reliefTot));
    put(j,"ScheduleTR1.TaxReliefOutsideIndiaDTAA",n0(C.dtaa));
    put(j,"ScheduleTR1.TaxReliefOutsideIndiaNotDTAA",n0(C.notDtaa));
    if(sv(S.fa.trFlag))put(j,"ScheduleTR1.TaxPaidOutsideIndFlg",S.fa.trFlag);
    if(S.fa.trFlag==="YES"){
      if(N(S.fa.trAmt))put(j,"ScheduleTR1.AmtTaxRefunded",n0(S.fa.trAmt));
      if(sv(S.fa.trAY))put(j,"ScheduleTR1.AssmtYrTaxRelief",st0(S.fa.trAY));
    }
  }

  /* ---- ScheduleFA ---- (resident & ordinarily resident only) ---- */
  if(res!=="RES")return;
  const hasCode=r=>st0(r.code)!=="";

/* ================================================================
   CHECKS — chk<Id>()   (regime-aware; regime closes nothing here)
   ================================================================ */
function chkFa(){
  const out=[];
  const res=(S.pi||{}).res||"RES";
  const C=S.C.fa||{fsi:[],trRows:[],reliefTot:0};
  const anyFsi=(S.fa.fsi||[]).length>0;
  const faCnt=["a1","a2","a3","a4","b","c","d","e","f","g"].reduce((a,k)=>a+((S.fa[k]||[]).length),0);

  /* Not applicable to non-resident (FSI/TR/FA) — rules doc */
  if(res==="NRI"&&(anyFsi||faCnt>0)){
    out.push({lvl:"err",t:"Foreign schedules not applicable",
      m:"Residential status is Non-Resident. Schedules FSI, TR and FA are not applicable — remove the foreign entries or correct the residential status.",sec:"fa"});
  }
  /* Schedule FA is for resident-and-ordinarily-resident only */
  if(res==="NOR"&&faCnt>0){
    out.push({lvl:"err",t:"Schedule FA not applicable to RNOR",
      m:"Schedule FA is only for a person resident and ordinarily resident. A Resident-but-Not-Ordinarily-Resident cannot file it — remove the foreign-asset rows.",sec:"fa"});
  }

  if(res==="NRI")return out.length?out:[{lvl:"ok",t:"Foreign income & assets",m:"Not applicable to a non-resident.",sec:"fa"}];

  /* Country-code note: a country block with figures but no code is ignored */
  (S.fa.fsi||[]).forEach((b,i)=>{
    const t=(C.fsi||[])[i]||{tot:{b:0,c:0,d:0}};
    const anyVal=(t.tot.b||t.tot.c||t.tot.d);
    if(!b.code&&anyVal)
      out.push({lvl:"warn",t:"FSI country "+(i+1)+" has no Country Code",
        m:"Figures are entered but no Country Code is chosen — the utility ignores a row with a blank Country Code (E5 note). Pick a country or clear the row.",sec:"fa"});
    if(b.code&&!st0(b.tin)&&anyVal)
      out.push({lvl:"warn",t:"FSI country "+(i+1)+" missing TIN",
        m:"Taxpayer Identification Number is required for each FSI country block.",sec:"fa"});
  });

  /* (e) is always MIN(c,d) — flag a head where relief was expected but (d) is zero */
  (C.fsi||[]).forEach((cr,i)=>{
    ["sal","hp","bus","cg","os"].forEach(k=>{const h=(cr.heads||{})[k]||{};
      if(n0(h.c)>0&&n0(h.d)===0)
        out.push({lvl:"warn",t:"No relief for country "+(i+1),
          m:"Tax was paid outside India on a head but tax payable in India (d) is nil, so relief (e)=min(c,d)=0. Enter (d) at the average Indian rate on that income.",sec:"fa"});
    });
  });

  /* TR refund follow-up */
  if(S.fa.trFlag==="YES"){
    if(!N(S.fa.trAmt))out.push({lvl:"warn",t:"Refund amount missing",m:"You answered that foreign tax relief was refunded — enter the amount of tax refunded (4a).",sec:"fa"});
    if(!st0(S.fa.trAY))out.push({lvl:"warn",t:"Refund AY missing",m:"Enter the assessment year in which the relief was allowed in India (4b).",sec:"fa"});
  }

  if(!out.length){
    out.push({lvl:"ok",t:"Foreign income & assets",
      m:(anyFsi||faCnt)?("FSI/TR relief "+RS(C.reliefTot||0)+"; FA rows "+faCnt+"."):"No foreign income, relief or assets.",sec:"fa"});
  }
  return out;
}

  ["1284","Virgin Islands (british)"],["1340","Virgin Islands (u.s.)"],["681","Wallis And Futuna"],

/* ---- engine ------------------------------------------------------ */
/* one property block a–k, exactly as the book's cell formulas read */
function engProp(p){
  p = p || {};
  const self = p.type==="S";
  const co   = p.co==="YES";
  /* share% — 100 if not co-owned; the co-owner's own % if co-owned (K6) */
  const share = co ? Math.min(100, Math.max(0, N(p.share))) : 100;

  const a = self ? 0 : R(p.rent);                 /* 1a AnnualLetableValue — nil if self-occupied */
  const b = self ? 0 : R(p.unreal);               /* 1b RentNotRealized */
  const c = self ? 0 : R(p.taxes);                /* 1c LocalTaxes */
  const d = R(b + c);                             /* 1d [I23]=SUM(I21:I22) */
  const e = self ? 0 : Math.max(0, R(a - d));     /* 1e [K24]=MAX(0,(K20-I23)) — nil if self-occ (23(2)) */
  const f = Math.max(0, R((share/100) * e));      /* 1f [K25]=MAX(0,ROUND((K7/100)*K24,0)) — share bites here */
  const g = R(Math.max(0, 0.30 * f));             /* 1g [I26]=ROUND(30% of 1f,0) */

  /* h — Total interest u/s 24(b) = Σ loan rows [K35]; the ceiling bites here */
  const loans = (p.loans||[]).filter(l => N(l.interest));
  const hRaw  = R(loans.reduce((s,l)=>s+N(l.interest), 0));   /* Section24B.TotalInterestUs24B */
  let h = hRaw, cut = 0, barred = false;
  if(self){                                       /* "Cannot exceed 2 lacs if not let out" [H27] */
    if(isNew()){ cut = hRaw; h = 0; barred = true; }          /* new regime: self-occ interest disallowed (A224/A232) */
    else if(hRaw > 200000){ cut = hRaw - 200000; h = 200000; }/* old regime: capped at ₹2,00,000 */
  }
  const i = R(g + h);                             /* 1i [K36]=SUM(I26,I27) */
  const jRecd = R(p.arrears);                     /* 1j amount received (arrears/unrealised) */
  const j = R(0.70 * jRecd);                      /* 1j less 30% (70% taken) */
  const k = R(f - i + j);                         /* 1k [K38]=(K25-K36+K37) */

  const coShare = (p.coowners||[]).reduce((s,x)=>s+N(x.share), 0);
  return {self, co, share, a, b, c, d, e, f, g, hRaw, h, cut, barred,
          i, jRecd, j, k, nLoans:loans.length, coShare};
}

function engHp(){
  const H = S.hp || {};
  const C = S.C.hp = { income:0, on:!!H.on, rows:[], sum1k:0, pti:0, cut:0,
                       selfCount:0, ptiFromSch:false };
  if(!H.on) return;

  const rows = (H.props||[]).map((p,idx)=>{ const r=engProp(p); p._=r; p._i=idx; return r; });
  const sum1k = R(rows.reduce((s,r)=>s+r.k, 0));           /* Σ1k */

  /* item 2 — Pass-through income/loss from Schedule PTI (book: from Sch PTI).
     The "other" section computes S.C.other.pti (order 24, after this at 12);
     guarded read — falls back to the manual figure H.pti. */
  const oth = S.C.other || {};
  const ptiFromSch = (oth.pti||[]).reduce((s,b)=>s+N((b.hp||{}).net), 0);
  const usedSch = Math.abs(ptiFromSch) > 0;
  const pti = R(usedSch ? ptiFromSch : N(H.pti));          /* PassThroghIncome */

  const income = R(sum1k + pti);                           /* item 3 = Σ1k + 2 = TotalIncomeChargeableUnHP */

  C.rows = rows;
  C.sum1k = sum1k;
  C.pti = pti;
  C.ptiFromSch = usedSch;
  C.income = income;                                       /* signed head total for CYLA/GTI roll-up */
  C.cut = R(rows.reduce((s,r)=>s+r.cut, 0));
  C.selfCount = (H.props||[]).filter(p=>p.type==="S").length;
}

/* ---- renderer ---------------------------------------------------- */
function hpBlock(p, i, ordinal){
  const r = p._ || engProp(p);
  const pre = "hp.props."+i+".", id = "hp"+i;
  const typeLbl = (HP_TYPE.find(t=>t[0]===p.type)||["","—"])[1];
  const status = (st0(p.addr)?typeLbl+" · ":"") + (r.k<0?"loss "+RS(-r.k):RS(r.k));
  let b = "";

  /* --- the property --- */
  b += sub("The property");
  b += row("Address of property", inp(pre+"addr",{max:200}), {req:1, ref:"F4", hint:"do not leave the address blank"});
  b += row("Town / City", inp(pre+"city",{max:50}), {req:1, ref:"G4"});
  b += row("Country", sel(pre+"country", HP_COUNTRY), {req:1, ref:"I4"});
  if((p.country||"91")==="91"){
    b += row("State", sel(pre+"state", HP_STATE), {req:1, ref:"H4"});
    b += row("PIN Code", inp(pre+"pin",{max:6}), {req:1, ref:"J4", hint:"100000–999999"});
  } else {
    b += row("State", sel(pre+"state", [["99","Foreign"]], {blank:false}), {req:1, ref:"H4"});
    b += row("Zip Code", inp(pre+"zip",{max:8}), {ref:"K4", hint:"for property abroad"});
  }

  /* --- ownership --- */
  b += sub("Ownership");
  b += row("Owner of the Property", sel(pre+"owner", HP_OWNER), {req:1, ref:"F6"});
  if(p.owner==="OT") b += row("Please specify (Others)", inp(pre+"ownerOther",{max:50}), {req:1, ind:1, ref:"F6"});
  b += row("Is the property co-owned?", sel(pre+"co", HP_COOWN, {blank:false}), {req:1, ref:"I6"});
  b += row("Your percentage of share in the property (%)",
           p.co==="YES" ? inp(pre+"share",{n:1}) : cell(100),
           {req:1, ref:"K6", hint:p.co==="YES"?"co-owners below must bring the total to 100%":"not co-owned — 100%"});
  if(p.co==="YES"){
    b += grid(pre.slice(0,-1)+".coowners",[
        {k:"name",h:"Name of co-owner(s)",t:"txt",w:"auto",req:1,max:125},
        {k:"pan",h:"PAN of Co-owner(s)",t:"txt",w:"120px",max:10},
        {k:"aadhaar",h:"Aadhaar of Co-owner(s)",t:"txt",w:"140px",max:12},
        {k:"share",h:"Percentage share of co-owner(s) %",t:"num",w:"160px"}],
      p.coowners||[], {min:"760px", empty:"No co-owner listed.", add:"Add a co-owner",
        foot:[{l:1,v:"Shares — yours "+(N(p.share)||0)+"% + co-owners "+r.coShare+"%",span:3},{v:(N(p.share)||0)+r.coShare}]});
    if(Math.abs((N(p.share)||0)+r.coShare-100)>0.01)
      b += note("The owner + co-owner shares add to "+((N(p.share)||0)+r.coShare)+"%, not 100%.","warn");
  }

  /* --- type --- */
  b += sub("Type of house property");
  b += row("Type Of House Property?", sel(pre+"type", HP_TYPE, {blank:false}), {req:1, ref:"F15"});
  if(p.type!=="S"){
    b += grid(pre.slice(0,-1)+".tenants",[
        {k:"name",h:"Name(s) of Tenant(s)",t:"txt",w:"auto",req:1,max:125},
        {k:"pan",h:"PAN of Tenant(s)",t:"txt",w:"120px",max:10},
        {k:"aadhaar",h:"Aadhaar of Tenant(s)",t:"txt",w:"140px",max:12},
        {k:"pantan",h:"PAN / TAN of Tenant(s) — if TDS credit is claimed",t:"txt",w:"220px",max:10}],
      p.tenants||[], {min:"880px", empty:"No tenant listed.", add:"Add a tenant"});
  }

  /* --- the working a–k --- */
  b += sub("Computation of income from the property");
  if(r.self){
    b += note("Self-occupied — the annual value is nil under section 23(2), so only interest u/s 24(b) counts."+
      (isNew()?" <b>Under the new regime section 115BAC disallows even that</b> (item 1h is closed)."
              :" Under the old regime it is allowed up to ₹2,00,000."));
    b += row("a · Gross Rent received or receivable or letable value", cell(0), {ref:"1a"});
    b += row("e · Annual value (nil, self-occupied — s.23(2))", cell(0), {ref:"1e"});
    b += row("f · Annual value of the property owned", cell(0), {ref:"1f"});
    b += row("g · 30% of f", cell(0), {ref:"1g"});
  } else {
    b += row("a · Gross Rent received or receivable or letable value", inp(pre+"rent",{n:1}),
             {req:1, ref:"1a", hint:"in full — your share is applied at f"});
    b += row("b · The amount of rent which cannot be realized", inp(pre+"unreal",{n:1}), {ref:"1b"});
    b += row("c · Tax paid to local authorities", inp(pre+"taxes",{n:1}), {ref:"1c"});
    b += row("d · Total (b + c)", cell(r.d), {ref:"1d", cls:"tot"});
    b += row("e · Annual value (a − d)", cell(r.e), {ref:"1e", cls:"tot"});
    b += row("f · Annual value of the property owned (own share × e)", cell(r.f),
             {ref:"1f", cls:"tot", hint:r.share<100?r.share+"% of "+RS(r.e):""});
    b += row("g · 30% of f", cell(r.g), {ref:"1g"});
  }

  /* --- 24(b) loan table (inside the block) --- */
  b += sub("h · Interest payable on borrowed capital — Section 24(b)");
  b += note("One row per loan; every column is required on a filled row. The interest sums into item h."+
    (r.self?" On a self-occupied house the sheet caps this at ₹2,00,000 (nil under the new regime).":""));
  if(!(r.self && isNew())){
    b += grid(pre.slice(0,-1)+".loans",[
        {k:"from",h:"Loan taken from",t:"sel",w:"160px",req:1,opts:HP_LOANFROM},
        {k:"name",h:"Name of the bank / institution / person",t:"txt",w:"auto",req:1,max:125},
        {k:"acno",h:"Loan Account number",t:"txt",w:"170px",req:1,max:25},
        {k:"dt",h:"Date of sanction of loan",t:"date",w:"140px",req:1},
        {k:"amt",h:"Total amount of loan",t:"num",w:"150px",req:1},
        {k:"os",h:"Loan outstanding on 31-03-2026",t:"num",w:"170px",req:1},
        {k:"interest",h:"Interest on Borrowed capital u/s 24(b)",t:"num",w:"170px",req:1}],
      p.loans||[], {min:"1320px", empty:"No loan.", add:"Add a loan",
        foot:[{l:1,v:"Total Interest on borrowed capital u/s 24(b)",span:6},{v:r.hRaw}]});
    b += row("h · Interest payable on borrowed capital", cell(r.h),
             {ref:"1h", cls:"tot", hint:r.cut?("capped at ₹2,00,000 — "+RS(r.cut)+" above the ceiling"):""});
  } else {
    /* regime-closed: self-occupied interest under the new regime */
    b += note("Closed by section 115BAC — interest on a self-occupied house cannot be claimed in the new regime.","stop");
    b += row("h · Interest payable on borrowed capital", cell(0), {ref:"1h", cls:"tot"});
  }

  b += row("i · Total (g + h)", cell(r.i), {ref:"1i", cls:"tot"});
  b += row("j · Arrears / Unrealized Rent received during the year", inp(pre+"arrears",{n:1}),
           {ref:"1j", hint:"amount received — 70% is taken (less 30%)"});
  b += row("j · Less 30%", cell(r.j), {ref:"1j", ind:1});
  b += row("k · Income from house property "+ordinal+" (f − i + j)", cell(r.k), {ref:"1k", cls:"grand"});

  return blk(id, "Property "+ordinal+(st0(p.addr)?" — "+st0(p.addr):""), status, b, "hp.props."+i);
}

function secHp(){
  const C = S.C.hp || {};
  let h = "";
  h += row("Is there income or a loss from house property?",
           sel("hp.on",[["","No"],["1","Yes"]],{blank:false}), {req:1, ref:"Schedule HP"});
  if(!S.hp.on) return h;

  h += note("One block per property, unlimited. The Section 24(b) loan table sits inside each block and "+
    "sums into item h. Rent, unrealised rent and local taxes are entered in full; a co-owner's share is "+
    "applied once, at f.");
  if(isNew())
    h += note("New regime — interest on a self-occupied house gives nothing, and an HP loss cannot be set "+
      "off against any other head or carried forward.","warn");
  if((C.selfCount||0) > 2)
    h += note("No more than two houses may be self-occupied (section 23(4)). The third and any further "+
      "self-occupied property must be treated as <b>deemed let out</b> — change its type.","stop");

  (S.hp.props||[]).forEach((p,i)=>h += hpBlock(p, i, i+1));
  h += '<button class="add" data-addprop="1">Add a property</button>';

  h += sub("Across all properties");
  h += row("Σ1k · Income from all properties", cell(C.sum1k), {cls:"tot"});
  if(C.ptiFromSch)
    h += row("2 · Pass through income / Loss — from Schedule PTI", cell(C.pti),
             {ref:"2", hint:"the house-property row(s) of Schedule PTI"});
  else
    h += row("2 · Pass through income / Loss (if any)", inp("hp.pti",{n:1}),
             {ref:"2", hint:"from Schedule PTI — leave blank if none"});
  h += row('3 · Income under the head "Income from house property" (Σ1k + 2)', cell(C.income),
           {ref:"3", cls:"grand",
            hint:C.income<0?(isNew()?"a loss — not set off under the new regime"
                                    :"a loss — to 2(i) of Schedule CYLA, capped at ₹2,00,000"):""});
  return h;
}

/* ---- export ------------------------------------------------------ */
function expHp(j){
  const C = S.C.hp || {};
  if(!(S.hp && S.hp.on && (S.hp.props||[]).length)) return;

  const items = (S.hp.props||[]).map((p,i)=>{
    const r = p._ || engProp(p);
    const ad = {
      AddrDetail:(sv(p.addr)||"NA").slice(0,200),
      CityOrTownOrDistrict:(sv(p.city)||"NA").slice(0,50),
      StateCode:(p.country||"91")==="91" ? (HP_STATE_SET[st0(p.state)]?st0(p.state):"19") : "99",
      CountryCode:(st0(p.country)||"91").slice(0,4)
    };
    if((p.country||"91")==="91"){ if(/^[1-9]\d{5}$/.test(st0(p.pin))) ad.PinCode=parseInt(p.pin,10); }
    else if(sv(p.zip)) ad.ZipCode=sv(p.zip).slice(0,8);

    const rd = {
      AnnualLetableValue:n0(r.a),               /* 1a */
      TotalUnrealizedAndTax:n0(r.d),            /* 1d */
      BalanceALV:n0(r.e),                       /* 1e */
      AnnualOfPropOwned:sg(r.f),                /* 1f */
      ThirtyPercentOfBalance:n0(r.g),           /* 1g */
      IntOnBorwCap:n0(r.h),                     /* 1h */
      TotalDeduct:n0(r.i),                      /* 1i */
      IncomeOfHP:sg(r.k)                        /* 1k */
    };
    if(r.b) rd.RentNotRealized=n0(r.b);         /* 1b (optional) */
    if(r.c) rd.LocalTaxes=n0(r.c);              /* 1c (optional) */
    if(r.j) rd.ArrearsUnrealizedRentRcvd=n0(r.j); /* 1j (optional) */

    const ln = (p.loans||[]).filter(l=>N(l.interest));
    if(ln.length){
      rd.Section24B = {
        Section24BDtls: ln.map(l=>({
          LoanTknFrom:l.from==="I"?"I":"B",
          BankOrInstnName:(sv(l.name)||"NA").slice(0,125),
          LoanAccNoOfBankOrInstnRefNo:(sv(l.acno)||"NA").slice(0,25),
          DateofLoan:ISO(l.dt)||"2025-04-01",
          TotalLoanAmt:n0(l.amt),
          LoanOutstndngAmt:n0(l.os),
          InterestUs24B:n0(l.interest)
        })),
        TotalInterestUs24B:n0(r.hRaw)
      };
    }

    const it = {
      HPSNo:i+1,
      AddressDetailWithZipCode:ad,
      PropertyOwner:p.owner||"SE",
      PropCoOwnedFlg:p.co==="YES"?"YES":"NO",
      ifLetOut:p.type||"S",
      Rentdetails:rd
    };
    if(N(r.share)) it.AsseseeShareProperty=N(r.share);
    if(p.owner==="OT" && sv(p.ownerOther)) it.PropertyOwnerOther=sv(p.ownerOther).slice(0,50);

    const co = (p.coowners||[]).filter(x=>st0(x.name));
    if(co.length) it.CoOwners=co.map((x,k)=>{
      const c={CoOwnersSNo:k+1, NameCoOwner:st0(x.name).slice(0,125)};
      if(PAN_RE.test(st0(x.pan).toUpperCase())) c.PAN_CoOwner=st0(x.pan).toUpperCase();
      if(AADH.test(st0(x.aadhaar))) c.Aadhaar_CoOwner=st0(x.aadhaar);
      if(N(x.share)) c.PercentShareProperty=N(x.share);
      return c;
    });
    const tn = (p.tenants||[]).filter(x=>st0(x.name));
    if(tn.length) it.TenantDetails=tn.map((x,k)=>{
      const t={TenantSNo:k+1, NameofTenant:st0(x.name).slice(0,125)};
      if(PAN_RE.test(st0(x.pan).toUpperCase())) t.PANofTenant=st0(x.pan).toUpperCase();
      if(AADH.test(st0(x.aadhaar))) t.AadhaarofTenant=st0(x.aadhaar);
      if(sv(x.pantan)) t.PANTANofTenant=st0(x.pantan).toUpperCase().slice(0,10);
      return t;
    });
    return it;
  });

  j.ScheduleHP = { PropertyDetails:items, TotalIncomeChargeableUnHP:sg(C.income) };
  if(C.pti) j.ScheduleHP.PassThroghIncome=sg(C.pti);
}

        coowners:(p.CoOwners||[]).map(c=>({name:c.NameCoOwner||"", pan:c.PAN_CoOwner||"",
          aadhaar:c.Aadhaar_CoOwner||"", share:nz(c.PercentShareProperty)})),
        type:p.ifLetOut||"S",
