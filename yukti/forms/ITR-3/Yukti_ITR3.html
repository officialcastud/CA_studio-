/* =====================================================================
   CHECKS — chkRet(): the sheet's own rules as live messages.
   ===================================================================== */
function chkRet(){
  const out=[], sec=+S.fs.sec;
  /* Notice / order sections → DIN + date mandatory (rules.json, rows 34-35) */
  if(RET_NOTICE.indexOf(sec)>=0){
    if(!st0(S.fs.din)) out.push({lvl:"err",t:"DIN required",m:"A return filed under 142(1)/148/153C/139(9) or an order u/s 119(2)(b) needs the Unique Number / Document Identification Number.",sec:"ret"});
    if(!D(S.fs.noticedate)) out.push({lvl:"err",t:"Notice date required",m:"Enter the date of the notice or order.",sec:"ret"});
  }
  if(RET_ORIG.indexOf(sec)>=0){
    if(!st0(S.fs.receipt)) out.push({lvl:"err",t:"Receipt number required",m:"A revised (139(5)) or modified (92CD) return needs the receipt number of the original return.",sec:"ret"});
    if(!D(S.fs.origdate)) out.push({lvl:"err",t:"Original-return date required",m:"Enter the date of filing of the original return.",sec:"ret"});
  }
  /* Regime: opting old with business income needs Form 10-IEA (A45) */
  if(S.fs.optout==="Yes"&&S.fs.incBP==="Y"){
    if(!st0(S.fs.f10ieaAck)) out.push({lvl:"err",t:"Form 10-IEA acknowledgement required",m:"A business filer opts out of the new regime only through Form 10-IEA — furnish its acknowledgement number.",sec:"ret"});
    if(!D(S.fs.f10ieaDate)) out.push({lvl:"err",t:"Form 10-IEA date required",m:"Furnish the date of filing of Form 10-IEA for AY 2026-27.",sec:"ret"});
    /* old regime cannot be opted after the 139(1) due date */
    if(D(S.fs.filed)&&D(S.fs.duedate?dmy(S.fs.duedate):"")&&D(S.fs.filed)>D(dmy(S.fs.duedate)))
      out.push({lvl:"warn",t:"Old regime after due date",m:"The old regime under 115BAC(6) cannot be opted after the due date under 139(1).",sec:"ret"});
  }
  /* Yes-then-table gates */
  if(S.fs.dir==="Y"&&!(S.pi.dirco||[]).length) out.push({lvl:"err",t:"Director table empty",m:"You answered Yes to being a Director — list each company.",sec:"ret"});
  if(S.fs.partner==="Y"&&!(S.pi.firms||[]).length) out.push({lvl:"err",t:"Partner table empty",m:"You answered Yes to being a Partner — list each firm.",sec:"ret"});
  if(S.fs.unl==="Y"&&!(S.pi.unlco||[]).length) out.push({lvl:"err",t:"Unlisted-shares table empty",m:"You answered Yes to holding unlisted equity shares — fill the shares table.",sec:"ret"});
  if(S.fs.rep==="Y"){
    if(st0(S.fs.repEmail)&&st0(S.pi.email)&&st0(S.fs.repEmail).toLowerCase()===st0(S.pi.email).toLowerCase())
      out.push({lvl:"err",t:"Representative email clashes",m:"The representative's email must differ from the taxpayer's primary email.",sec:"ret"});
    if(st0(S.fs.repMobile)&&st0(S.pi.mobile)&&st0(S.fs.repMobile)===st0(S.pi.mobile))
      out.push({lvl:"err",t:"Representative contact clashes",m:"The representative's contact number must differ from the taxpayer's primary mobile.",sec:"ret"});
  }
  /* Audit: 44AB liable + accountant-audited → auditor / report mandatory; date not future */
  if(S.aud.sec44AB==="Y"){
    if(!st0(S.aud.cnd44AB)) out.push({lvl:"err",t:"44AB condition required",m:"Select the condition by virtue of which you are liable for audit u/s 44AB.",sec:"ret"});
    if(S.aud.acctFlg==="Y"){
      if(!D(S.aud.repDate)) out.push({lvl:"err",t:"Audit-report date required",m:"When accounts are audited by an accountant, the date of furnishing the audit report is mandatory.",sec:"ret"});
      else if(D(S.aud.repDate)>new Date()) out.push({lvl:"warn",t:"Audit-report date in the future",m:"The date of the audit report cannot be after the system date.",sec:"ret"});
      if(!st0(S.aud.repAck)) out.push({lvl:"err",t:"Audit-report acknowledgement required",m:"Enter the acknowledgement number of the 44AB audit report.",sec:"ret"});
      if(!st0(S.aud.frmName)) out.push({lvl:"err",t:"Auditor name required",m:"Enter the name of the auditor (proprietorship / firm).",sec:"ret"});
    }
  }
  /* a2i turnover band drives a2ii/a2iii; > 5% → liable to 44AB */
  if(S.aud.incDclrdUs==="N"&&S.aud.salesBand==="Upto10CR"){
    if(!st0(S.aud.pctRcvd)||!st0(S.aud.pctPaid))
      out.push({lvl:"err",t:"Cash-percentage required",m:"With turnover over ₹1 crore up to ₹10 crores, both a2ii and a2iii percentages must be filled.",sec:"ret"});
    else if((S.aud.pctRcvd==="MoreThan5Per"||S.aud.pctPaid==="MoreThan5Per")&&S.aud.sec44AB!=="Y")
      out.push({lvl:"warn",t:"Likely liable u/s 44AB",m:"Cash receipts or payments exceed 5% — the assessee is liable to audit u/s 44AB.",sec:"ret"});
  }
  if(S.aud.sec92E==="Y"&&S.aud.acct92E==="Y"){
    if(!D(S.aud.date92E)) out.push({lvl:"err",t:"92E audit date required",m:"Enter the date of the 92E audit report.",sec:"ret"});
    if(!st0(S.aud.ack92E)) out.push({lvl:"err",t:"92E acknowledgement required",m:"Enter the acknowledgement number of the 92E audit report.",sec:"ret"});
  }
  /* Nature of business is mandatory for a business filer (NatureOfBusiness[].Code) */
  if(S.fs.incBP==="Y"&&!(S.nob||[]).length)
    out.push({lvl:"err",t:"Nature of business required",m:"A filer with business/profession income must enter at least one nature-of-business code.",sec:"ret"});
  if(!out.length) out.push({lvl:"ok",t:"Return and regime",m:(S.fs.optout==="Yes"?"Old":"New")+" regime · filed under "+((RET_SEC.find(x=>+x[0]===sec)||["",""])[1]||"section "+sec)+".",sec:"ret"});
  return out;
}

/* helpers scoped to this section */
const _salEntEligible=cat=>cat==="CGOV"||cat==="SGOV"||cat==="PSU"; /* 16(ii) — book */
const _salIsGovt=cat=>cat==="CGOV"||cat==="SGOV";                   /* 80CCD(2) 14% */

/* ==================================================================
   ENGINE — engSal(): numbers from S.sal into S.C.sal
   ================================================================== */
function engSal(){
  const emp=S.sal.emp||[];
  let gS=0,gP=0,gPr=0,g89d=0,g89e=0,g89f=0,basicDA=0,basic=0;
  let entEligible=false,anyGovt=false;
  emp.forEach(e=>{
    const sumOf=arr=>(arr||[]).reduce((a,r)=>a+N(r.amt),0);
    /* 1a/1b/1c totals: from the breakup rows when present, else the typed total */
    if((e.nsal||[]).length)  e.s17_1=sumOf(e.nsal);
    if((e.nperq||[]).length) e.s17_2=sumOf(e.nperq);
    if((e.nprof||[]).length) e.s17_3=sumOf(e.nprof);
    const s=N(e.s17_1),perq=N(e.s17_2),prof=N(e.s17_3);
    /* basic (code 1) and basic+DA (codes 1,2) from the 1a breakup */
    e._basic  =(e.nsal||[]).filter(r=>r.code==="1").reduce((a,r)=>a+N(r.amt),0);
    e._basicDA=(e.nsal||[]).filter(r=>r.code==="1"||r.code==="2").reduce((a,r)=>a+N(r.amt),0);
    /* 1d — income from notified countries (US/UK/CA rows) */
    const d=SAL_NOT89.reduce((a,c)=>a+N(e["n89_"+c[0]]),0);
    const eOther=N(e.oth89a);   /* 1e */
    const fPrev=N(e.prev89a);   /* 1f */
    /* [E7/E33] Gross Salary = 1a+1b+1c+1d+1e+1f */
    e._gross=Math.max(0,R(s+perq+prof+d+eOther+fPrev));
    e._d=R(d); e._e=R(eOther); e._f=R(fPrev);
    gS+=s;gP+=perq;gPr+=prof;g89d+=d;g89e+=eOther;g89f+=fPrev;
    basic+=e._basic; basicDA+=e._basicDA;
    if(_salEntEligible(e.empcat)) entEligible=true;
    if(_salIsGovt(e.empcat))      anyGovt=true;
  });
  /* [E57] Total gross salary from all employers = sum over employers */
  const gross=Math.max(0,R(gS+gP+gPr+g89d+g89e+g89f));

  /* --- HRA 10(13A) working (Section10_13A) --- */
  const H=S.sal.hra||{};
  const salHRA=N(H.salary), aHRA=N(H.hra), rent=N(H.rent);
  const metro=st0(H.place)==="1";
  /* [J72] B = round(rent - 10% of salary) */
  const hraB=R(rent-salHRA*0.10);
  /* [E73] C = 50% (metro) / 40% (non-metro) of salary */
  const hraC=R((metro?0.50:0.40)*salHRA);
  /* [J74] eligible = max(0, min(A,B,C)); [J69] nil under new regime (bacValue=1) */
  const hra13a=isNew()?0:Math.max(0,R(Math.min(aHRA,hraB,hraC)));

  /* --- allowances exempt u/s 10 (rows 60-64) --- */
  let exemptDrop=0;
  (S.sal.alw||[]).forEach(a=>{
    a._ok=!isNew()||SAL_ALW10_NEW.indexOf(a.sec)>=0; /* REGIME.md 10(14) subset only */
    if(a._ok) exemptDrop+=N(a.amt);
  });
  /* [L59] Allowances exempt u/s 10 = SUM(dropdowns) + HRA table output */
  let exempt=R(exemptDrop+hra13a);
  exempt=Math.min(exempt,gross);

  /* relief u/s 89A (3a on sheet, "2a" in the E75 formula) — only if 1d exists */
  const rel89a=(g89d>0)?N(S.sal.rel89a):0;

  /* [L75] Net Salary = max(0, gross - 2a - 3) = gross - rel89a - exempt */
  const net=Math.max(0,R(gross-rel89a-exempt));

  /* [J77] Std deduction 16(ia) = min(net, 75000 new / 50000 old) */
  const d16ia=Math.min(net,isNew()?75000:50000);
  /* 16(ii): closed under new regime; else CG/SG/PSU only, min(5000, entered, 1/5 basic) */
  const ent=(isNew()||!entEligible)?0:Math.min(5000,N(S.sal.ent),Math.floor(basic/5));
  /* 16(iii): closed under new regime; else min(5000, entered) (book cap 5000) */
  const pt=isNew()?0:Math.min(5000,N(S.sal.pt));
  /* [L76] Deduction u/s 16 = 5a+5b+5c */
  const d16=R(d16ia+ent+pt);
  /* [L80] Income chargeable under Salaries = max(0, net - deduction16) */
  const income=Math.max(0,R(net-d16));

  return {gross:R(gross),grossS:R(gS),grossP:R(gP),grossPr:R(gPr),
    n89d:R(g89d),n89e:R(g89e),n89f:R(g89f),
    hraB,hraC,hra13a:R(hra13a),exemptDrop:R(exemptDrop),exempt:R(exempt),
    rel89a:R(rel89a),net:R(net),d16ia:R(d16ia),ent:R(ent),pt:R(pt),d16:R(d16),
    basic:R(basic),basicDA:R(basicDA),entEligible,anyGovt,
    income:R(income)};
}

/* ==================================================================
   RENDERER — secSal()
   ================================================================== */
function secSal(){
  const A=S.C.sal||engSal();
  let h="";
  if(st0(S.pi.status)==="H"){
    h+=note("<b>Schedule S does not apply to an HUF.</b> Salary income is not "+
      "assessable in the hands of a Hindu Undivided Family, so this schedule is "+
      "left blank.","warn");
    return h;
  }
  h+=formNote("Take these from Part B of each Form 16. Add one employer block per "+
    "Form 16 you hold — the return carries an unbounded list of employers.");

  (S.sal.emp||[]).forEach((e,i)=>{
    const g=e._gross||0;
    const status=st0(e.name)?(st0(e.name)+" · "+RS(g)):"not filled";
    let b=sub("The employer");
    b+=row("Name of employer",inp("sal.emp."+i+".name",{max:125}),{req:1});
    b+=row("Nature of employer",sel("sal.emp."+i+".empcat",SAL_EMPCAT,{blank:false}),{req:1});
    b+=row("TAN of employer",inp("sal.emp."+i+".tan",{max:10}),
      {hint:"mandatory if tax is deducted"});
    b+=row("Address of employer",inp("sal.emp."+i+".addr",{max:200}),{req:1});
    b+=row("Town / City",inp("sal.emp."+i+".city",{max:50}),{req:1});
    b+=row("State",sel("sal.emp."+i+".state",SAL_STATE),{req:1});
    b+=row("Pin code",inp("sal.emp."+i+".pin",{max:6}));
    b+=row("Zip code",inp("sal.emp."+i+".zip",{max:8}),{hint:"for a foreign address"});

    b+=sub("Gross salary from this employer");
    const natGrid=(k,opts)=>grid("sal.emp."+i+"."+k,
      [{k:"code",h:"Nature",t:"sel",w:"auto",req:1,opts:opts.map(o=>[o[0],o[1]])},
       {k:"desc",h:"If others, specify",t:"txt",w:"200px"},
       {k:"amt",h:"Amount",t:"num",w:"140px",req:1}],
      e[k]||[],{min:"760px",empty:"No breakup yet — the total stays typeable until a row is added.",add:"Add a nature"});
    b+=fold("nsal_"+i,"1a","Salary as per section 17(1) — nature-wise breakup",
      (e.nsal||[]).length?(e.nsal||[]).length+" rows":"if any",natGrid("nsal",SAL_S17_1));
    b+=row("a — Salary as per section 17(1)",
      (e.nsal||[]).length?cell(N(e.s17_1)):inp("sal.emp."+i+".s17_1",{n:1}),
      {ref:"1a",req:1,hint:(e.nsal||[]).length?"the sum of the rows above":""});
    b+=fold("nperq_"+i,"1b","Value of perquisites as per section 17(2) — nature-wise breakup",
      (e.nperq||[]).length?(e.nperq||[]).length+" rows":"if any",natGrid("nperq",SAL_S17_2));
    b+=row("b — Value of perquisites as per section 17(2)",
      (e.nperq||[]).length?cell(N(e.s17_2)):inp("sal.emp."+i+".s17_2",{n:1}),{ref:"1b",req:1});
    b+=fold("nprof_"+i,"1c","Profit in lieu of salary as per section 17(3) — nature-wise breakup",
      (e.nprof||[]).length?(e.nprof||[]).length+" rows":"if any",natGrid("nprof",SAL_S17_3));
    b+=row("c — Profit in lieu of salary as per section 17(3)",
      (e.nprof||[]).length?cell(N(e.s17_3)):inp("sal.emp."+i+".s17_3",{n:1}),{ref:"1c",req:1});
    b+=row("d — Income from a retirement benefit account in a notified country u/s 89A",
      cell(e._d||0),{ref:"1d",hint:"the sum of the three countries below"});
    SAL_NOT89.forEach(c=>b+=row(c[1],inp("sal.emp."+i+".n89_"+c[0],{n:1}),{ind:1}));
    b+=row("e — Income from a retirement benefit account in a country other than a notified one u/s 89A",
      inp("sal.emp."+i+".oth89a",{n:1}),{ref:"1e"});
    b+=row("f — Income taxable this year on which relief u/s 89A was claimed in an earlier year",
      inp("sal.emp."+i+".prev89a",{n:1}),{ref:"1f"});
    b+=row("Gross Salary (1a + 1b + 1c + 1d + 1e + 1f)",cell(g),{cls:"tot",ref:"1",
      hint:"worked out for you"});
    h+=blk("emp"+i,"Employer "+(i+1)+(st0(e.name)?" — "+st0(e.name):""),status,b,"sal.emp."+i);
  });
  h+='<button class="add" data-addemp="1">Add an employer</button>';

  /* --- summary block: one figure for all employers --- */
  h+=sub("Summary — all employers");
  h+=row("Total gross salary from all employers",cell(A.gross),{cls:"tot",ref:"2",
    hint:"the sum of every employer above"});

  h+=card("s89a","Income claimed for relief from taxation u/s 89A",
    (A.rel89a?F(A.rel89a):""),
    note("The income itself is entered employer by employer above, under 1d/1e/1f. "+
      "Enter here only the amount for which relief u/s 89A is claimed this year. "+
      "It cannot be claimed unless 1d (notified-country income) is non-zero.")+
    row("Income claimed for relief u/s 89A",inp("sal.rel89a",{n:1}),{ref:"3a"}));

  h+=sub("Allowances to the extent exempt u/s 10");
  if(isNew())h+=note("Section 115BAC closes most of these — house rent allowance, "+
    "leave travel concession and the ordinary 10(14) allowances among them. Only the "+
    "115BAC-permitted 10(14) allowances stay exempt; every other row is shown at nil.","warn");
  h+=grid("sal.alw",
    [{k:"sec",h:"Nature of exempt allowance",t:"sel",w:"360px",req:1,
      opts:SAL_ALW10.map(a=>[a[0],a[0]+" — "+a[1]])},
     {k:"desc",h:"Description",t:"txt",w:"180px"},
     {k:"amt",h:"Amount",t:"num",w:"150px",req:1},
     {k:"ok",h:"Exempt",t:"calc",w:"130px",f:r=>r._ok?N(r.amt):0}],
    S.sal.alw,{min:"820px",empty:"No exempt allowance claimed.",add:"Add an allowance"});

  h+=card("hra13a","Section 10(13A) — House Rent Allowance working",
    (A.hra13a?F(A.hra13a):(isNew()?"nil (115BAC)":"")),
    (isNew()?note("House rent allowance is not exempt under the new regime "+
        "(section 115BAC) — the exemption is shown at nil.","warn"):"")+
    row("Place of Residence",sel("sal.hra.place",SAL_PLACE),{req:1})+
    row("Details of salary as per section 17(1) for HRA (basic + DA)",inp("sal.hra.salary",{n:1}),{ref:"E71",req:1})+
    row("Actual HRA received (A)",inp("sal.hra.hra",{n:1}),{ref:"E69",req:1})+
    row("Actual rent paid",inp("sal.hra.rent",{n:1}),{ref:"E70",req:1})+
    row("Actual rent paid − 10% of salary (B)",cell(A.hraB),{ref:"E72"})+
    row((st0(S.sal.hra.place)==="1"?"50%":"40%")+" of salary (C)",cell(A.hraC),{ref:"E73"})+
    row("Eligible exempt allowance u/s 10(13A)",cell(A.hra13a),{cls:"tot",ref:"E74",
      hint:"the least of A, B and C"}));
  h+=row("Total allowances exempt u/s 10",cell(A.exempt),{cls:"tot",ref:"3",
    hint:"the dropdowns above plus the 10(13A) working"});

  h+=row("Net Salary (2 − 2a − 3)",cell(A.net),{cls:"tot",ref:"4"});

  h+=sub("Deduction u/s 16");
  h+=row("a — Standard deduction u/s 16(ia)",cell(A.d16ia),{ref:"5a",
    hint:isNew()?"₹75,000, or the net salary if less":"₹50,000, or the net salary if less"});
  h+=row("b — Entertainment allowance u/s 16(ii)",
    isNew()?cell(0):inp("sal.ent",{n:1}),{ref:"5b",
    hint:isNew()?"closed by section 115BAC":"Central/State Govt or PSU only — up to ₹5,000 or 1/5 of basic"});
  h+=row("c — Professional tax u/s 16(iii)",
    isNew()?cell(0):inp("sal.pt",{n:1}),{ref:"5c",
    hint:isNew()?"closed by section 115BAC":"up to ₹5,000"});
  h+=row("Deduction u/s 16 (5a + 5b + 5c)",cell(A.d16),{cls:"tot",ref:"5"});

  h+=row("Income chargeable under the head 'Salaries' (4 − 5)",cell(A.income),{cls:"grand",ref:"6"});
  return h;
}

/* ==================================================================
   EXPORT — expSal(j): write ScheduleS block onto j
   ================================================================== */
function expSal(j){
  const A=S.C.sal||engSal();
  if(st0(S.pi.status)==="H") return;              /* HUF: Schedule S blank */
  if(!(A.income||A.gross)) return;                /* nothing to write */

  const sch={
    Salaries:(S.sal.emp||[]).filter(e=>e._gross).map(e=>{
      const o={
        NameOfEmployer:(sv(e.name)||"NA").slice(0,125),
        NatureOfEmployment:SAL_EMPCAT.some(c=>c[0]===e.empcat)?e.empcat:"OTH",
        AddressDetail:{
          AddrDetail:(sv(e.addr)||sv(e.city)||"NA").slice(0,200),
          CityOrTownOrDistrict:(sv(e.city)||"NA").slice(0,50),
          StateCode:SAL_STATE.some(s=>s[0]===st0(e.state))?st0(e.state):"19"
        },
        Salarys:(()=>{
          const sy={
            GrossSalary:n0(e._gross),
            Salary:n0(e.s17_1),
            ValueOfPerquisites:n0(e.s17_2),
            ProfitsinLieuOfSalary:n0(e.s17_3)
          };
          const nat=(arr,valid)=>{
            const rows=(arr||[]).filter(r=>N(r.amt));
            if(!rows.length) return undefined;
            return {OthersIncDtls:rows.map(r=>{
              const q={NatureDesc:valid.some(x=>x[0]===r.code)?r.code:"OTH",OthAmount:n0(r.amt)};
              if(q.NatureDesc==="OTH") q.OthNatOfInc=(sv(r.desc)||"Others").slice(0,50);
              return q;})};
          };
          const n1=nat(e.nsal,SAL_S17_1),n2=nat(e.nperq,SAL_S17_2),n3=nat(e.nprof,SAL_S17_3);
          if(n1) sy.NatureOfSalary=n1;
          if(n2) sy.NatureOfPerquisites=n2;
          if(n3) sy.NatureOfProfitInLieuOfSalary=n3;
          if(e._d) sy.IncomeNotified89A=n0(e._d);
          const cc=SAL_NOT89.filter(c=>N(e["n89_"+c[0]])).map(c=>({
            NOT89ACountrycode:c[0],NOT89AAmount:n0(e["n89_"+c[0]])}));
          if(cc.length) sy.IncomeNotified89AType=cc;
          if(e._e) sy.IncomeNotifiedOther89A=n0(e._e);
          if(e._f) sy.IncomeNotifiedPrYr89A=n0(e._f);
          return sy;
        })()
      };
      if(TAN_RE.test(st0(e.tan).toUpperCase())) o.TANofEmployer=st0(e.tan).toUpperCase();
      if(/^[1-9]\d{5}$/.test(st0(e.pin))) o.AddressDetail.PinCode=parseInt(e.pin,10);
      if(sv(e.zip)) o.AddressDetail.ZipCode=st0(e.zip).slice(0,8);
      return o;
    })
  };
  /* required root totals — present even at zero */
  sch.TotalGrossSalary=n0(A.gross);
  sch.AllwncExtentExemptUs10=n0(A.exempt);
  sch.NetSalary=n0(A.net);
  sch.DeductionUS16=n0(A.d16);
  sch.DeductionUnderSection16ia=n0(A.d16ia);
  sch.EntertainmntalwncUs16ii=n0(A.ent);
  sch.ProfessionalTaxUs16iii=n0(A.pt);
  sch.TotIncUnderHeadSalaries=n0(A.income);
  if(A.rel89a) sch.Increliefus89A=n0(A.rel89a);

  /* exempt-allowance breakup (only the rows the regime allows) */
  const al=(S.sal.alw||[]).filter(a=>a._ok&&N(a.amt));
  const dtls=al.map(a=>{
    const q={SalNatureDesc:SAL_ALW10.some(x=>x[0]===a.sec)?a.sec:"10(17)",SalOthAmount:n0(a.amt)};
    if(sv(a.desc)) q.SalOthNatOfInc=st0(a.desc).slice(0,50);
    return q;});
  /* HRA 10(13A) is itself a drop-down row: aggregate AllwncExtentExemptUs10 = dropdowns + HRA,
     so the 10(13A) exemption must appear here too (rules A38/A162). */
  if(!isNew()&&N(A.hra13a)&&!dtls.some(q=>q.SalNatureDesc==="10(13A)"))
    dtls.push({SalNatureDesc:"10(13A)",SalOthAmount:n0(A.hra13a)});
  if(dtls.length) sch.AllwncExemptUs10={AllwncExemptUs10Dtls:dtls};

  /* Section10_13A HRA object — only when it carries a working (old regime) */
  const H=S.sal.hra||{};
  if(!isNew()&&(N(H.hra)||N(H.rent)||N(H.salary))) sch.Section10_13A={
    Placeofwork:SAL_PLACE.some(p=>p[0]===st0(H.place))?st0(H.place):"2",
    ActlHRARecv:n0(H.hra),
    ActlRentPaid:n0(H.rent),
    DtlsSalUsSec171:n0(H.salary),
    ActlRentPaid10Per:n0(A.hraB),
    Sal40Or50Per:n0(A.hraC),
    EligbleExmpAllwncUs13A:n0(A.hra13a)
  };

  put(j,"ScheduleS",sch);
}

/* ==================================================================
   IMPORT — impSal(I3): read ScheduleS back into S.sal
   ================================================================== */
function impSal(I3){
  const got=[];
  const g_=(o,p)=>{try{return p.split(".").reduce((t,k)=>t==null?undefined:t[k],o);}catch(e){return undefined;}};
  const sc=I3&&I3.ScheduleS;
  if(!sc) return got;
  const back=n=>(g_(n,"OthersIncDtls")||[]).map(r=>({code:r.NatureDesc,desc:r.OthNatOfInc||"",amt:r.OthAmount}));
  S.sal.emp=(sc.Salaries||[]).map(e=>{
    const sy=e.Salarys||{};
    const o={name:e.NameOfEmployer||"",empcat:e.NatureOfEmployment||"OTH",tan:e.TANofEmployer||"",
      addr:g_(e,"AddressDetail.AddrDetail")||"",city:g_(e,"AddressDetail.CityOrTownOrDistrict")||"",
      state:g_(e,"AddressDetail.StateCode")||"",pin:nz(g_(e,"AddressDetail.PinCode"))+"",
      zip:g_(e,"AddressDetail.ZipCode")||"",
      s17_1:nz(sy.Salary),s17_2:nz(sy.ValueOfPerquisites),s17_3:nz(sy.ProfitsinLieuOfSalary),
      oth89a:nz(sy.IncomeNotifiedOther89A),prev89a:nz(sy.IncomeNotifiedPrYr89A)};
    (sy.IncomeNotified89AType||[]).forEach(c=>o["n89_"+c.NOT89ACountrycode]=c.NOT89AAmount);
    o.nsal=back(sy.NatureOfSalary);
    o.nperq=back(sy.NatureOfPerquisites);
    o.nprof=back(sy.NatureOfProfitInLieuOfSalary);
    return o;
  });
  S.sal.alw=(g_(sc,"AllwncExemptUs10.AllwncExemptUs10Dtls")||[]).map(a=>({
    sec:a.SalNatureDesc,desc:a.SalOthNatOfInc||"",amt:a.SalOthAmount}));
  const H=sc.Section10_13A;
  if(H) S.sal.hra={place:H.Placeofwork||"",salary:nz(H.DtlsSalUsSec171),
    hra:nz(H.ActlHRARecv),rent:nz(H.ActlRentPaid)};
  S.sal.rel89a=nz(sc.Increliefus89A);
  S.sal.ent=nz(sc.EntertainmntalwncUs16ii);
  S.sal.pt=nz(sc.ProfessionalTaxUs16iii);
  got.push("Schedule S (salary)");
  return got;
}

/* ==================================================================
   CHECKS — chkSal(): the sheet's own rules as live messages
   ================================================================== */
function chkSal(){
  const out=[],A=S.C.sal||engSal();
  const add=(lvl,t,m)=>out.push({lvl,t,m,sec:"sal"});

  if(st0(S.pi.status)==="H"){
    if((S.sal.emp||[]).some(e=>e._gross))
      add("err","Schedule S — HUF","Salary income cannot be shown for an HUF; Schedule S must be blank.");
    return out;
  }

  (S.sal.emp||[]).forEach((e,i)=>{
    const nm="Employer "+(i+1);
    if(e._gross&&!st0(e.name)) add("err",nm+" — name","Name of employer is required.");
    if(e._gross&&!SAL_EMPCAT.some(c=>c[0]===e.empcat)) add("err",nm+" — nature","Nature of employer is required.");
    if(e._gross&&!st0(e.addr)) add("warn",nm+" — address","Address of employer is required.");
    if(e._gross&&!st0(e.city)) add("warn",nm+" — city","Town/City of employer is required.");
    if(e._gross&&!st0(e.state)) add("warn",nm+" — state","State of employer is required.");
    if(st0(e.tan)&&!TAN_RE.test(st0(e.tan).toUpperCase()))
      add("err",nm+" — TAN","TAN must be 4 letters, 5 digits and 1 letter.");
    if(st0(e.pin)&&!/^[1-9]\d{5}$/.test(st0(e.pin)))
      add("warn",nm+" — PIN","Pin code must be six digits (100000–999999).");
    /* 'Others' rows must name the nature */
    [["nsal","1a"],["nperq","1b"],["nprof","1c"]].forEach(([k,ref])=>
      (e[k]||[]).forEach((r,n)=>{if(N(r.amt)&&r.code==="OTH"&&!st0(r.desc))
        add("err",nm+" — "+ref,"Row "+(n+1)+" is 'Others' — specify the nature.");}));
  });

  /* relief u/s 89A only if 1d exists (book) */
  if(N(S.sal.rel89a)&&!A.n89d)
    add("err","Relief u/s 89A","Relief cannot be claimed unless income from a notified country (1d) is entered.");

  /* 16(ii) — CG/SG/PSU only (book) */
  if(!isNew()&&N(S.sal.ent)&&!A.entEligible)
    add("err","Entertainment allowance 16(ii)","Allowed only to a Central/State Government or Public Sector Undertaking employee — remove it.");

  /* caps carried by the schedule (book) */
  (S.sal.alw||[]).forEach((a,n)=>{
    if(a.sec==="10(10C)"&&N(a.amt)>500000)
      add("warn","10(10C)","Voluntary retirement exemption cannot exceed ₹5,00,000.");
    if(a.sec==="10(10B)(ii)"&&N(a.amt)>500000)
      add("warn","10(10B)(ii)","Compensation exemption under the second proviso cannot exceed ₹5,00,000.");
    if(a.sec==="10(10)"&&N(a.amt)>(A.anyGovt?2500000:2000000))
      add("warn","10(10)","Gratuity exemption cannot exceed "+(A.anyGovt?"₹25,00,000":"₹20,00,000")+".");
  });

  /* regime closures — warn when a closed item still carries a value (REGIME.md) */
  if(isNew()){
    if(N(S.sal.ent)) add("warn","16(ii) — new regime","Entertainment allowance is closed by section 115BAC; it is treated as nil.");
    if(N(S.sal.pt))  add("warn","16(iii) — new regime","Professional tax is closed by section 115BAC; it is treated as nil.");
    if((S.sal.hra&&(N(S.sal.hra.hra)||N(S.sal.hra.rent))))
      add("warn","10(13A) — new regime","House rent allowance is not exempt under section 115BAC; the exemption is nil.");
    (S.sal.alw||[]).forEach(a=>{if(N(a.amt)&&SAL_ALW10_NEW.indexOf(a.sec)<0)
      add("warn","Exempt allowance — new regime",(a.sec||"An allowance")+" is not exempt under section 115BAC; it is treated as nil.");});
  }

  if(A.income&&!out.some(x=>x.lvl==="err"))
    add("ok","Salary","Income chargeable under 'Salaries' is "+RS(A.income)+".");
  return out;
}

/* =====================================================================
   ITR-3 · Section "si" — Specified persons, special rates & firms
   Schedules SPI · SI · IF, built strictly from books/ITR-3/SPI_SI_IF.md
   (never ITR-2's numbers/item-numbers). Self-contained: state seed,
   engSi, secSi, expSi, impSi, chkSi and one reg() at the bottom.
   compute order 28 (after the income heads — cg@14, sal@10, bp@22,
   other@24 — before tax roll-up @90). Regime-gated per REGIME.md.

   Heads:
   · SPI (book Part 1) — a plain disclosure table of clubbed income of
     specified persons; the amount is taxed under the named head
     elsewhere, so SPI adds nothing to Gross Total Income (book: "SPI
     does not add income itself").  Total I12 = Σ AmtIncluded.
   · SI (book Part 2) — the special-rate engine. One computed row per
     live special-rate head, auto-populated from the capital-gains
     buckets (S.C.cg.buckets, published by cg@14) plus the manually
     disclosed OS / DTAA / PTI / NRI heads (the sheet's "edit the
     auto-populated details?" override, EditAutopoulatedDetail). It
     re-presents income already inside GTI, so it too adds nothing to
     GTI — but its tax (TotSplRateIncTax) is what Part B-TTI adds to the
     normal-rate tax.  Implements the ₹1,25,000 s.112A exemption share
     (own-112A → PTI-112A → 115AD proviso) and the resident basic-
     exemption walk, highest special rate first (book rules O4/P4/…).
   · IF (book Part 3) — a disclosure table of the partnership firms in
     which the assessee was a partner; four column totals. Adds nothing
     to GTI (firm share flows through Schedule BP).

   Therefore S.C.si.income = 0 (this head's contribution to GTI is nil —
   every rupee here is already counted under CG / OS / BP). S.C.si.totTax
   is the special-rate tax the tax section rolls up.
   ===================================================================== */

/* the SplRatePercent enum — book "Dropdowns" / enums.json (12 values) */
const SI_RATES=["1","4","5","9","10","12.5","15","20","25","30","50","60"];
/* a friendly default rate per code, from the section's statutory rate
   (AY 2026-27, post-23-Jul-2024). Used to seed a fresh manual row and to
   rate the auto-populated CG heads. The filer can still pick any enum
   rate. Rates the book leaves to the DTAA are seeded blank.               */
const SI_RATE_DEF={"1":"","1A":"20","21":"20","22":"12.5","21ciii":"12.5","2A":"12.5",
  "5A1ai":"20","5A1aA":"10","5A1aii":"20","5A1aiia":"5","5A1aiiaa":"5","5A1aiiaaP":"5",
  "5A1aiiaa2P":"9","5A1aiiab":"5","5A1aiiac":"5","5A1aiii":"20","5A1bA":"10","5AC1ab":"10",
  "5AC1abD":"10","5AC1c":"12.5","5ACA1a":"10","5ACA1b":"12.5","5AD1i":"20","5AD1iDiv":"20",
  "5AD1iP":"5","5ADii":"30","5AD1biip":"20","5ADiii":"12.5","5ADiiiP":"12.5","5BB":"30",
  "5BBJ":"30","5BBA":"20","5BBH":"30","5BBH_BP":"30","5BBE":"60","5BBF":"10","5BBF_BP":"10",
  "5BBG":"10","5BBG_BP":"10","5Ea":"20","5Eb":"12.5","DTAASTCG":"","DTAALTCG":"","DTAAOS":"",
  "PTI_STCG20P":"20","PTI_STCG30P":"30","PTI_LTCG12_5P112A":"12.5","PTI_LTCG12_5P":"12.5"};
const codeLabel=c=>{const r=SI_CODE_OPTS.find(x=>x[0]===c);return r?r[1]:c;};

/* ---- classification sets (book Part 2 rules) ------------------------- */
/* the ₹1,25,000 s.112A exemption family, in the book's sharing order
   (O4/P4 own-112A → O6/P6 PTI-112A → O7/P7 115AD(1)(b)(iii) proviso).     */
const SI_112A_ORDER=["2A","PTI_LTCG12_5P112A","5ADiiiP"];
/* the capital-gain special heads that share the resident basic-exemption
   slack, highest rate first (book col-X walk 1st..12th; matched by
   descending rate at engine time among the codes present).               */
const SI_CG_WALK=["1A","21","22","2A","5ADiiiP","5ADii","PTI_STCG20P","PTI_STCG30P",
  "PTI_LTCG12_5P112A","PTI_LTCG12_5P"];
/* codes whose tax is surcharge-capped at 15% (CG + dividend) — feeds
   S.C.si.cgDivTax, read by the tax section's surcharge cap.               */
const SI_CGDIV=["1A","21","22","2A","5ADiii","5ADiiiP","5ADii","5AD1biip","PTI_STCG20P",
  "PTI_STCG30P","PTI_LTCG12_5P112A","PTI_LTCG12_5P","5A1ai","5A1aA","5AC1abD","5ACA1a",
  "5AD1iDiv","PTI_5A1ai","PTI_5A1aA","PTI_5AD1iDiv"];
const SI_115AD=["5AD1i","5AD1iDiv","5AD1iP","5ADii","5AD1biip","5ADiii","5ADiiiP",
  "PTI_5AD1i","PTI_5AD1iDiv","PTI_5AD1iP"];

/* ---- engine --------------------------------------------------------- */
/* Cross-reads are guarded (never throw). CG publishes S.C.cg.buckets
   (cg@14): si112a (112A @12.5, ₹1.25L exempt here), si112 (other LTCG
   @12.5), si111a20 (STCG 111A @20), si115bbh (VDA @30), stDTAA / ltDTAA.  */
function engSi(){
  const New=isNew();
  const resident=S.pi&&S.pi.res==="RES";
  const cg=(S.C.cg||{}), cgB=(cg.buckets||{});

  /* ----- SPI total (book I12 = Σ AmtIncluded) — a disclosure ------- */
  const spiTotal=R((S.si.spi||[]).reduce((a,p)=>a+N(p.amt),0));

  /* ----- IF totals (book row 132) --------------------------------- */
  const ifRows=S.si.firms||[];
  const ifTot={
    profit:R(ifRows.reduce((a,f)=>a+N(f.profit),0)),   /* K132 TotalProfitShareAmt */
    interest:R(ifRows.reduce((a,f)=>a+N(f.interest),0)),/* L132 TotalIntrstAmtDueOrRecv */
    remun:R(ifRows.reduce((a,f)=>a+N(f.remun),0)),      /* M132 TotalRemunernAmtDueOrRecv */
    capbal:R(ifRows.reduce((a,f)=>a+N(f.capbal),0))};   /* N132 TotalFirmCapBalOn31Mar */

  /* ----- SI rows: auto (from Schedule CG) + manual (OS/DTAA/PTI…) -- */
  const rows=[];
  const push=(code,rate,inc,src)=>{if(R(inc)===0)return;
    rows.push({code,rate:st0(rate),inc:R(inc),src});};
  /* auto-populate the capital-gains special heads from cg buckets.
     (book Part 2 note: "SI is a computed table … auto-populated".)        */
  push("2A","12.5",cgB.si112a,"cg");        /* 112A @12.5 — ₹1.25L exemption applied below */
  push("22","12.5",cgB.si112,"cg");         /* 112(1) other LTCG @12.5 */
  push("1A","20",cgB.si111a20,"cg");        /* 111A STCG @20 */
  push("5BBH","30",cgB.si115bbh,"cg");      /* 115BBH VDA (capital gains) @30 */
  push("DTAASTCG",(cg.dtaaStcgRate||""),cgB.stDTAA,"cg");  /* STCG at DTAA rate */
  push("DTAALTCG",(cg.dtaaLtcgRate||""),cgB.ltDTAA,"cg");  /* LTCG at DTAA rate */
  /* the manually disclosed heads (the sheet's edit override) */
  (S.si.rows||[]).forEach(r=>{if(!r||!r.code)return;
    push(r.code,r.rate||SI_RATE_DEF[r.code]||"",N(r.inc),"man");});

  /* ----- taxable income after the ₹1,25,000 s.112A exemption ------- */
  /* book O4/P4/O6/P6/O7/P7: one ₹1,25,000 pool shared across the 112A
     family in order own-112A → PTI-112A → 115AD proviso.                 */
  let pool112A=125000;
  const taxable={};                         /* col H per row index */
  rows.forEach((r,i)=>{taxable[i]=r.inc;});
  SI_112A_ORDER.forEach(code=>{
    rows.forEach((r,i)=>{if(r.code!==code)return;
      const ex=Math.min(pool112A,Math.max(0,taxable[i]));
      taxable[i]=Math.max(0,taxable[i]-ex);pool112A-=ex;});});
  const exemption112A=125000-pool112A;

  /* ----- resident basic-exemption walk (book U19/col-X) ----------- */
  /* U19: a resident's unused basic exemption (₹4,00,000 new regime, else
     by age) feeds the adjustment; nil for a non-resident. U22: it is the
     slack over the normal-rate income — max(0, basic − (GTI − splInc)).
     Set off against the capital-gain heads, highest rate first.           */
  const basic = resident ? (New?400000:(superSr()?500000:senior()?300000:250000)) : 0;
  const splIncTotal=rows.reduce((a,r)=>a+r.inc,0);
  const normalRateInc=Math.max(0,R((S.C.gti||0))-splIncTotal);   /* stale GTI ok; converges over paints */
  let slack=Math.max(0,basic-normalRateInc);
  /* order the CG-walk rows by descending rate, then set off */
  const walkIdx=rows.map((r,i)=>i)
    .filter(i=>SI_CG_WALK.indexOf(rows[i].code)>=0)
    .sort((a,b)=>N(rows[b].rate)-N(rows[a].rate));
  walkIdx.forEach(i=>{if(slack<=0)return;
    const u=Math.min(slack,taxable[i]);taxable[i]-=u;slack-=u;});
  const exemptionBasic=Math.max(0,basic-normalRateInc)-slack;

  /* ----- tax thereon (book I = ROUND(H*F/100,0)) ------------------- */
  let totInc=0,totCalc=0,totTax=0,tax112A=0,tax115AD=0,bbeTax=0,cgDivTax=0;
  rows.forEach((r,i)=>{
    const h=Math.max(0,R(taxable[i]));
    const tax=R(h*N(r.rate)/100);           /* ROUND(H*F/100,0) */
    r.taxable=h; r.tax=tax;
    totInc+=r.inc; totCalc+=h; totTax+=tax;
    if(SI_112A_ORDER.indexOf(r.code)>=0) tax112A+=tax;
    if(SI_115AD.indexOf(r.code)>=0) tax115AD+=tax;
    if(r.code==="5BBE") bbeTax+=tax;
    if(SI_CGDIV.indexOf(r.code)>=0) cgDivTax+=tax;});

  S.C.si={
    on:rows.length>0||spiTotal>0||ifRows.length>0,
    rows, spiTotal, ifTot,
    totInc:R(totInc), totCalc:R(totCalc), totTax:R(totTax),
    tax112A:R(tax112A), tax115AD:R(tax115AD), bbeTax:R(bbeTax), cgDivTax:R(cgDivTax),
    exemption112A:R(exemption112A), exemptionBasic:R(exemptionBasic),
    /* this head adds nothing to Gross Total Income — SPI is a disclosure,
       SI re-presents CG/OS income, IF discloses firm partnership. */
    income:0};
}

/* =====================================================================
   RENDERER
   ===================================================================== */
function secSi(){
  const G=S.C.si||{}; let h="";
  const resident=S.pi&&S.pi.res==="RES"; const New=isNew();

  /* ===== Schedule SPI ============================================== */
  h+='<div class="cgband">Schedule SPI — income of specified persons includable u/s 64</div>';
  h+=note("Income of a specified person (spouse, minor child etc.) that section 64 includes in your income. "+
    "This is a disclosure of who it came from — the amount is taxed under the head named in the last column, "+
    "so it is not added again here.");
  h+=grid("si.spi",[
    {h:"Name of person",k:"name",t:"txt",max:125,req:1},
    {h:"PAN (optional)",k:"pan",t:"txt",max:10},
    {h:"Aadhaar (optional)",k:"aadhaar",t:"txt",max:12},
    {h:"Relationship",k:"rel",t:"txt",max:50,req:1},
    {h:"Amount (Rs)",k:"amt",t:"num",req:1},
    {h:"Head included under",k:"head",t:"sel",opts:SPI_HEADS,req:1}],
    S.si.spi||[],
    {empty:"No clubbed income disclosed.",add:"Add a specified person",
     foot:[{l:1,v:"Total amount included (I12)",span:5},{v:G.spiTotal||0}]});

  /* ===== Schedule SI =============================================== */
  h+='<div class="cgband">Schedule SI — income chargeable to tax at special rates</div>';
  h+=note("Income taxed at a special rate (please see instruction No. 7 for the rate). The capital-gains heads "+
    "are picked up automatically from Schedule CG; use the override below to disclose the other-sources, DTAA, "+
    "pass-through and non-resident heads. Tax is rate × the income after the ₹1,25,000 section-112A exemption"+
    (resident?" and, for a resident, the basic-exemption set-off":"")+".");
  const rows=G.rows||[];
  h+='<div class="full"><table class="gt" style="min-width:820px"><thead><tr>'+
     '<th class="l" style="width:40px">Sl.</th><th class="l" style="min-width:340px">Section</th>'+
     '<th style="width:90px">Rate (%)</th><th style="width:130px">Income (i)</th>'+
     '<th style="width:150px">Taxable after Min-Chg adj. (ii)</th><th style="width:130px">Tax thereon (iii)</th></tr></thead><tbody>';
  if(!rows.length)h+='<tr><td class="emp" colspan="6">No special-rate income.</td></tr>';
  rows.forEach((r,i)=>{h+='<tr><td class="l">'+(i+1)+'</td>'+
    '<td class="l">'+esc(codeLabel(r.code))+(r.src==="cg"?'<span class="dt">from Schedule CG</span>':'')+'</td>'+
    '<td class="num">'+(r.rate?esc(r.rate):"—")+'</td>'+
    '<td class="num">'+cell(r.inc)+'</td><td class="num">'+cell(r.taxable)+'</td>'+
    '<td class="num">'+cell(r.tax)+'</td></tr>';});
  h+='</tbody><tfoot><tr><td class="l" colspan="3">Total (row 119)</td>'+
     '<td>'+F(G.totInc||0)+'</td><td>'+F(G.totCalc||0)+'</td><td>'+F(G.totTax||0)+'</td></tr></tfoot></table></div>';
  if(R(G.exemption112A)>0)h+=note("₹"+F(G.exemption112A)+" of the ₹1,25,000 section-112A exemption applied to the 112A / PTI-112A / 115AD-proviso heads.");
  if(resident&&R(G.exemptionBasic)>0)h+=note("₹"+F(G.exemptionBasic)+" of unused basic exemption ("+RS(New?400000:(superSr()?500000:senior()?300000:250000))+") set off against the capital-gains special heads, highest rate first.");
  else if(!resident)h+=note("Basic-exemption set-off against special-rate income is not available to a non-resident (book U19).");

  /* override switch — book I120 "Do you want to edit the details auto-populated…" */
  h+=row("Do you want to edit the details auto-populated in the table above?",
    sel("si.edit",[["Yes","Yes"],["No","No"]],{blank:false}),{ref:"I120",hint:"EditAutopoulatedDetail"});
  if(S.si.edit==="Yes"){
    h+=note("Disclose the special-rate heads that do not come from Schedule CG — other sources, DTAA, pass-through and non-resident 115A/AC/AD/E income. Pick the section, its rate and the income; the ₹1,25,000 and basic-exemption adjustments are applied automatically.");
    h+=grid("si.rows",[
      {h:"Section",k:"code",t:"sel",opts:SI_CODE_OPTS,req:1},
      {h:"Rate (%)",k:"rate",t:"sel",opts:SI_RATES.map(x=>[x,x])},
      {h:"Income",k:"inc",t:"num",req:1}],
      S.si.rows||[],
      {empty:"No manual special-rate head added.",add:"Add a special-rate head"});
  }

  /* ===== Schedule IF =============================================== */
  h+='<div class="cgband">Schedule IF — partnership firms in which you are a partner</div>';
  h+=note("Every partnership firm in which you were a partner at any time during the previous year. "+
    "The share of profit, interest and remuneration flow through Schedule BP; the capital balance is as on 31 March.");
  const fc=(S.si.firms||[]).length;
  h+=row("Number of firms in which you are a partner",cell(fc),{ref:"row 123"});
  h+=grid("si.firms",[
    {h:"Name of the firm",k:"name",t:"txt",max:125,req:1},
    {h:"PAN of the firm",k:"pan",t:"txt",max:10,req:1},
    {h:"Liable for audit? (Y/N)",k:"audit",t:"sel",opts:[["Y","Y"],["N","N"]]},
    {h:"Section 92E applicable? (Y/N)",k:"sec92e",t:"sel",opts:[["Y","Y"],["N","N"]]},
    {h:"% share in profit",k:"pct",t:"num",req:1},
    {h:"Share in profit (i)",k:"profit",t:"num",req:1},
    {h:"Interest due/received (ii)",k:"interest",t:"num"},
    {h:"Remuneration due/received (iii)",k:"remun",t:"num"},
    {h:"Capital balance 31-Mar (iv)",k:"capbal",t:"num",req:1}],
    S.si.firms||[],
    {min:"1000px",empty:"No partnership firm disclosed.",add:"Add a firm",
     foot:[{l:1,v:"Column totals (row 132)",span:5},
       {v:(G.ifTot||{}).profit||0},{v:(G.ifTot||{}).interest||0},
       {v:(G.ifTot||{}).remun||0},{v:(G.ifTot||{}).capbal||0}]});

  return h;
}

/* =====================================================================
   EXPORT — ScheduleSPI / ScheduleSI / ScheduleIF
   ===================================================================== */
function expSi(j){
  const G=S.C.si||engSi()||S.C.si||{};

  /* ===== ScheduleSPI ===== */
  const spi=(S.si.spi||[]).filter(p=>st0(p.name)||N(p.amt)||st0(p.rel));
  if(spi.length){
    const arr=spi.map(p=>{const o={
      SpecifiedPersonName:sv(p.name),
      ReltnShip:sv(p.rel),
      AmtIncluded:n0(p.amt),
      HeadIncIncluded:sv(p.head)||"OS"};      /* required per element */
      const pan=sv(p.pan); if(pan)o.PANofSpecPerson=String(pan).toUpperCase();
      const aad=sv(p.aadhaar); if(aad)o.AaadhaarOfSpecPerson=aad;
      return o;});
    j.ScheduleSPI={SpecifiedPerson:arr};
  }

  /* ===== ScheduleSI ===== */
  const si=(G.rows||[]).filter(r=>r.code&&N(r.rate));
  const SI={
    TotSplRateInc:n0(G.totInc),          /* G119 — required even at zero */
    TotSplRateIncTax:n0(G.totTax)};      /* I119 — required even at zero */
  if(si.length){
    SI.SplCodeRateTax=si.map(r=>({
      SecCode:r.code,
      SplRatePercent:N(r.rate),
      SplRateInc:n0(r.inc),
      SplRateIncTax:n0(r.tax)}));
  }
  if(S.si.edit==="Yes")SI.EditAutopoulatedDetail="Y"; else if(si.length)SI.EditAutopoulatedDetail="N";
  j.ScheduleSI=SI;

  /* ===== ScheduleIF ===== */
  const firms=(S.si.firms||[]).filter(f=>st0(f.name)||st0(f.pan)||N(f.profit)||N(f.capbal));
  if(firms.length){
    const arr=firms.map(f=>{const o={
      FirmName:sv(f.name),
      FirmPAN:sv(f.pan)?String(f.pan).toUpperCase():undefined,
      ProfitSharePercent:N(f.pct),
      ProfitShareAmt:sg(f.profit),         /* signed — a share of loss is negative */
      FirmCapBalOn31Mar:sg(f.capbal)};     /* required per element */
      if(f.audit==="Y"||f.audit==="N")o.IsLiableToAudit=f.audit;
      if(f.sec92e==="Y"||f.sec92e==="N")o.Sec92EFirmFlag=f.sec92e;
      if(N(f.interest))o.IntrstAmtDueOrRecv=n0(f.interest);
      if(N(f.remun))o.RemunernAmtDueOrRecv=n0(f.remun);
      return o;});
    const T=G.ifTot||{};
    j.ScheduleIF={
      PartnerFirmDetails:arr,
      TotalProfitShareAmt:sg(T.profit),      /* required (signed) */
      TotalIntrstAmtDueOrRecv:n0(T.interest),
      TotalRemunernAmtDueOrRecv:n0(T.remun),
      TotalFirmCapBalOn31Mar:sg(T.capbal)};  /* required */
  }
}

/* =====================================================================
   IMPORT — the inverse
   ===================================================================== */
function impSi(I3){
  const read=[];
  const spi=I3.ScheduleSPI, si=I3.ScheduleSI, iff=I3.ScheduleIF;

  if(spi&&Array.isArray(spi.SpecifiedPerson)){
    S.si.spi=spi.SpecifiedPerson.map(p=>({
      name:p.SpecifiedPersonName||"", pan:p.PANofSpecPerson||"",
      aadhaar:p.AaadhaarOfSpecPerson||"", rel:p.ReltnShip||"",
      amt:nz(p.AmtIncluded), head:p.HeadIncIncluded||"OS"}));
    read.push("Schedule SPI (specified persons)");
  }

  if(si){
    S.si.edit=(si.EditAutopoulatedDetail==="Y")?"Yes":(si.EditAutopoulatedDetail==="N"?"No":S.si.edit);
    /* only the non-CG (manual) heads are read back into S.si.rows — the
       capital-gains heads are re-derived from Schedule CG each compute. */
    if(Array.isArray(si.SplCodeRateTax)){
      const autoCG=["2A","22","1A","5BBH","DTAASTCG","DTAALTCG"];
      S.si.rows=si.SplCodeRateTax
        .filter(r=>autoCG.indexOf(r.SecCode)<0)
        .map(r=>({code:r.SecCode, rate:r.SplRatePercent!=null?String(r.SplRatePercent):"",
          inc:nz(r.SplRateInc)}));
      read.push("Schedule SI (special-rate income)");
    }
  }

  if(iff&&Array.isArray(iff.PartnerFirmDetails)){
    S.si.firms=iff.PartnerFirmDetails.map(f=>({
      name:f.FirmName||"", pan:f.FirmPAN||"",
      audit:f.IsLiableToAudit||"", sec92e:f.Sec92EFirmFlag||"",
      pct:nz(f.ProfitSharePercent), profit:nz(f.ProfitShareAmt),
      interest:nz(f.IntrstAmtDueOrRecv), remun:nz(f.RemunernAmtDueOrRecv),
      capbal:nz(f.FirmCapBalOn31Mar)}));
    read.push("Schedule IF (partnership firms)");
  }
  return read;
}

/* =====================================================================
   CHECKS — the sheet's own rules, regime-aware
   ===================================================================== */
function chkSi(){
  const out=[]; const G=S.C.si||engSi()||S.C.si||{};
  const add=(lvl,t,m)=>out.push({lvl,t,m,sec:"si"});

  /* SPI — each disclosed person needs name / relationship / amount / head */
  (S.si.spi||[]).forEach((p,i)=>{
    if((st0(p.name)||N(p.amt)||st0(p.rel))&&(!st0(p.name)||!st0(p.rel)||!N(p.amt)||!st0(p.head)))
      add("err","Schedule SPI row "+(i+1)+" incomplete","A specified-person row needs the name, relationship, amount and the head it is included under.");
    if(st0(p.pan)&&!PAN_RE.test(String(p.pan).toUpperCase()))
      add("warn","Schedule SPI PAN","The PAN of "+(st0(p.name)||"the specified person")+" is not in the AAAAA9999A format.");
  });

  /* SI — a rated row must carry a rate; total tax cross-check */
  (G.rows||[]).forEach(r=>{if(r.inc&&!N(r.rate))
    add("err","Special rate missing","The special-rate head \""+codeLabel(r.code)+"\" has income of ₹"+F(r.inc)+" but no rate.");});
  if((G.rows||[]).length){
    const sumTax=(G.rows||[]).reduce((a,r)=>a+N(r.tax),0);
    if(Math.abs(sumTax-N(G.totTax))>1)
      add("err","Schedule SI total","Total tax at special rates (row 119) must equal the sum of the rows.");
  }

  /* IF — every firm row needs name / PAN / % share / capital balance */
  (S.si.firms||[]).forEach((f,i)=>{
    const any=st0(f.name)||st0(f.pan)||N(f.profit)||N(f.capbal);
    if(any&&(!st0(f.name)||!st0(f.pan)||f.pct==null||f.pct===""||f.capbal==null||f.capbal===""))
      add("err","Schedule IF row "+(i+1)+" incomplete","A firm row needs the name, PAN, percentage share of profit and the 31-March capital balance.");
    if(st0(f.pan)&&!PAN_RE.test(String(f.pan).toUpperCase()))
      add("err","Schedule IF PAN","\""+(st0(f.name)||"Firm "+(i+1))+"\" — the firm PAN is not a valid PAN.");
    if((N(f.pct)<0||N(f.pct)>100)&&any)
      add("err","Schedule IF share %","The percentage share of profit for \""+(st0(f.name)||"firm "+(i+1))+"\" must be between 0 and 100.");
  });
  /* IF gates Schedule BP A5a — share of firm income cannot exceed IF profit share (book note 6) */
  if((G.ifTot||{}).profit>0){
    const bpShare=R(((S.C.bp||{}).firmShare)||0);
    if(bpShare>R(G.ifTot.profit)+1)
      add("warn","Firm share vs Schedule BP","Share of firm income in Schedule BP (₹"+F(bpShare)+") exceeds the total profit share disclosed in Schedule IF (₹"+F(G.ifTot.profit)+").");
  }

  if((G.totTax||0)>0)add("ok","Tax at special rates","₹"+F(G.totTax)+" of tax at special rates, added to the normal-rate tax in Part B-TTI.");
  if((G.spiTotal||0)>0)add("ok","Clubbed income disclosed","₹"+F(G.spiTotal)+" of specified-person income disclosed in Schedule SPI.");
  return out;
}

/* ---- register ------------------------------------------------------- */
reg({id:"si", t:"Specified persons, special rates & firms", ref:"SPI · SI · IF",
  f:secSi, s:()=>{const G=S.C.si||{};
    return (G.totTax?RS(G.totTax)+" special-rate tax":((G.spiTotal||(G.ifTot||{}).profit)?"disclosed":""));},
  eng:engSi, exp:expSi, imp:impSi, chk:chkSi, order:28});

/* =====================================================================
   ITR-3 · Section "tax" (order 90) — Part B roll-up.
   Books: books/ITR-3/Part_B_TI_TTI.md, AMTC.md, TPSA.md
          + hidden sheets AMT and "Tax Calculated" (read via dump),
          + REGIME.md (regime gating), rules.json.
   Schema blocks exported/imported: PartB-TI, PartB_TTI,
          ScheduleAMT, ScheduleAMTC, ScheduleTPSA.
   This is the Part B roll-up: it reads every income head via
   S.C.<head>.income, aggregates to Gross Total Income, subtracts
   Chapter VI-A (S.C.ded), applies the loss set-off (S.C.loss),
   computes tax on the regime slabs / surcharge / cess / 87A rebate,
   AMT (old regime only), AMTC credit, TPSA and 234A/B/C interest,
   and SETS the footer contract S.C.{gti,ti,tax,int,amt,amtc}.
   Every formula carries its cell ref from the book. Rule 2: numbers
   are ITR-3's own (Tax Calculated / AMT / Part B - TI TTI sheets),
   never ported from ITR-2. Cross-reads are guarded (S.C.x||{}).y||0.
   ===================================================================== */

/* ---- state (my namespace S.tax) ---- */
S.tax = S.tax || {};
if(S.tax.amtc==null) S.tax.amtc={};              /* {AssYr:{gross,setoff}} typed prior-year AMT credit */
if(S.tax.tpsa==null) S.tax.tpsa={rows:[]};        /* TPSA 92CE amount + challan table */
if(!Array.isArray(S.tax.tpsa.rows)) S.tax.tpsa.rows=[];
SEED["tax.tpsa.rows"]=SEED["tax.tpsa.rows"]||{};   /* challan row */

/* the thirteen prior assessment years of the AMTC utilisation table (AMTC.md, rows i–xiii) */
const TAX_AMTC_YRS=["2013-14","2014-15","2015-16","2016-17","2017-18","2018-19","2019-20",
  "2020-21","2021-22","2022-23","2023-24","2024-25","2025-26"];

/* the utility's advance-tax instalment cutoffs (Tax Calculated / IT sheet): 16 Jun · 20 Sep · 15 Dec · 16 Mar; 17–31 Mar is the fifth slot */
const TAX_Q_CUT=[new Date(2025,5,16),new Date(2025,8,20),new Date(2025,11,15),new Date(2026,2,16)];

/* exemption limit (Tax Calculated C33/C34): new regime 400000 (bacValue=1); else age-banded by residential status. NRI never gets the senior band. */
function taxExemptionLimit(){
  if(isNew())return 400000;
  if(S.pi.status==="I"&&S.pi.res!=="NRI"){ if(superSr())return 500000; if(senior())return 300000; }
  return 250000;
}
/* the regime slab bands (Tax Calculated: G25 new; B27 senior, B28 super-senior, B29 normal — old) */
function taxBands(){
  const SLAB_NEW=[[400000,0],[800000,5],[1200000,10],[1600000,15],[2000000,20],[2400000,25],[Infinity,30]]; /* G25 */
  const SLAB_OLD=[[250000,0],[500000,5],[1000000,20],[Infinity,30]];                                        /* B29 */
  const SLAB_SR =[[300000,0],[500000,5],[1000000,20],[Infinity,30]];                                        /* B27 */
  const SLAB_SSR=[[500000,0],[1000000,20],[Infinity,30]];                                                   /* B28 */
  if(isNew())return SLAB_NEW;
  if(S.pi.status==="I"&&S.pi.res!=="NRI")return superSr()?SLAB_SSR:(senior()?SLAB_SR:SLAB_OLD);
  return SLAB_OLD;
}
function taxSlab(inc,bands){let t=0,l=0;for(const b of bands){const u=b[0],r=b[1];if(inc>l)t+=(Math.min(inc,u)-l)*r/100;l=u;if(inc<=u)break;}return R(t);}
/* tax + surcharge at a given total income — used for the marginal-relief cutoff comparison (Part_B_TI_TTI.md L76 surcharge; 25% new / 37% old cap) */
function taxPlusSurAt(ti,splTax,cgDivTax,bbeTax,normalInc){
  const normalTax=taxSlab(normalInc,taxBands());const taxOn=normalTax+splTax;
  const scr= ti>50000000?(isNew()?25:37): ti>20000000?25: ti>10000000?15: ti>5000000?10:0;
  const capRate=Math.min(scr,15);                          /* CG/dividend surcharge held to 15% */
  const other=taxOn-cgDivTax-bbeTax;
  return {taxOn,sur:R(other*scr/100+cgDivTax*capRate/100+bbeTax*0.25),scr,capRate};
}

/* ---- the engine: rolls up Part B and sets the whole S.C tax contract ---- */
function engTax(){
  /* ===== read the income heads via the S.C.<head>.income convention (guarded) ===== */
  const SAL=(S.C.sal||{}), HP=(S.C.hp||{}), BP=(S.C.bp||{}), CG=(S.C.cg||{}), OS=(S.C.os||{});
  const salaries=R(SAL.income||0);                                       /* Part B-TI 1 */
  const hpInc=R(HP.income||0);                                           /* signed; item 2 = MAX(0,·) (L5) */

  /* PGBP (item 3): 3i non-spec (A37), 3ii speculative, 3iii specified, 3iv special-rate 115BBF/G/H; each MAX(0,·) (J7–J10) */
  const b3i=Math.max(0, BP.noSpec!=null?R(BP.noSpec):R(BP.income||0));
  const b3ii=Math.max(0,R(BP.spec||0));
  const b3iii=Math.max(0,R(BP.specified||0));
  const b3iv=Math.max(0,R(BP.spl||0));
  const b3v=Math.max(0,b3i+b3ii+b3iii+b3iv);                             /* L11: nil if the sum is a loss */

  /* Capital gains (item 4): after set-off components, floored (J15–J25); 4d = VDA @30% 115BBH (L27) */
  const cga=CG.after||{}, hasCG=CG.after!=null||CG.shortTerm!=null||CG.longTerm!=null;
  const st20=Math.max(0,R(cga.st20||0)), st30=Math.max(0,R(cga.st30||0)), stApp=Math.max(0,R(cga.stApp||0)), stDTAA=Math.max(0,R(cga.stDTAA||0));
  const lt125=Math.max(0,R(cga.lt125||0)), ltDTAA=Math.max(0,R(cga.ltDTAA||0));
  let totST=CG.shortTerm!=null?Math.max(0,R(CG.shortTerm)):st20+st30+stApp+stDTAA;
  let totLT=CG.longTerm!=null?Math.max(0,R(CG.longTerm)):lt125+ltDTAA;
  let cgC2=CG.C2!=null?R(CG.C2):R((CG.vda||{}).cg||0);                    /* 4d 115BBH */
  let cg4c=Math.max(0,totST+totLT);                                      /* L26 */
  if(!hasCG && CG.income!=null){ cg4c=Math.max(0,R(CG.income)); totST=cg4c; totLT=0; }
  const cg4e=Math.max(0,cg4c+cgC2);                                      /* L28 */

  /* Other sources (item 5): 5a normal (J30), 5b special (J31), 5c race horses (J32); 5d = MAX(0,Σ) (L33) */
  const os5a=Math.max(0,R(OS.six!=null?OS.six:(OS.normal!=null?OS.normal:(OS.income||0))));
  const os5b=R(OS.special||0);
  const os5c=Math.max(0,R(OS.horse?(OS.horse.bal!=null?OS.horse.bal:OS.horse):(OS.raceHorse||0)));
  const os5d=Math.max(0,os5a+os5b+os5c);

  /* item 6 — total of head-wise income (1 + 2 + 3v + 4e + 5d) (L34) */
  const item2=Math.max(0,hpInc);
  const totalTI=R(salaries+item2+b3v+cg4e+os5d);

  /* ===== loss set-off (S.C.loss, guarded): CYLA current-year (item 7), BFLA brought-forward (item 9) ===== */
  const L=(S.C.loss||{});
  const cyl=R(L.cyla!=null?L.cyla:(L.cySetoff!=null?L.cySetoff:((L.totHPset||0)+(L.totBusset||0)+(L.totOSset||0))));  /* L35 */
  const balAfterCYLA=Math.max(0,totalTI-cyl);                            /* item 8 (L36) */
  const bfl=R(L.bfla!=null?L.bfla:(L.bfSetoff!=null?L.bfSetoff:((L.totBFset||0)+(L.totUnabsDep||0)+(L.tot35_4||0))));  /* L37 */
  const gti=Math.max(0,balAfterCYLA-bfl);                                /* item 10 Gross Total Income (L38) */

  /* item 11 — special-rate income under 111A/112/112A etc. included in GTI (S.C.si.totInc) (L39) */
  const SI=(S.C.si||{});
  const splInc=R(SI.totInc||0);

  /* ===== Chapter VI-A (S.C.ded, guarded) — Part B/CA/D and Part C, capped at (GTI − 11) (J41/L43) ===== */
  const DED=(S.C.ded||{});
  const viaPartB=Math.max(0,R(DED.partB!=null?DED.partB:(DED.PartBchapterVIA||0)));
  const viaPartC=Math.max(0,R(DED.partC!=null?DED.partC:(DED.PartCchapterVIA||0)));
  const viaCap=Math.max(0,gti-splInc);
  const viaTot=Math.max(0,Math.min(viaPartB+viaPartC,viaCap));           /* item 12c (L43) */

  /* item 13 — deduction u/s 10AA (S.C.ded.us10AA), capped at (GTI − special − VI-A) (L44) */
  const us10AA=Math.max(0,Math.min(R(DED.us10AA!=null?DED.us10AA:(DED.ded10AA||0)),Math.max(0,gti-splInc-viaTot)));

  /* item 14 — total income = round-to-ten of MAX(0, GTI − 12c − 13) (L45) */
  const ti=Math.max(0,Math.round((gti-viaTot-us10AA)/10)*10);

  /* item 16 — net agricultural income for rate, only if > 5000 (S.C.ei / eiAgri) (L47) */
  const agriRaw=R((S.C.ei2||{}).netAgri!=null?(S.C.ei2||{}).netAgri:(S.C.eiAgri||0));
  const agri=agriRaw>5000?agriRaw:0;

  /* ===== tax on total income (Part B-TTI 2), from the regime slabs ===== */
  const bands=taxBands();
  const splIncInTI=Math.min(splInc,ti);                                  /* item 15 */
  const normalInc=Math.max(0,ti-splIncInTI);
  const exempt=taxExemptionLimit();
  const aggFlag=normalInc>exempt&&agri>5000;                             /* aggregate income applies (L48) */
  const normalTax=taxSlab(aggFlag?normalInc+agri:normalInc,bands);       /* 2a */
  const agriRebate=aggFlag?taxSlab(exempt+agri,bands):0;                 /* 2c */
  const splTax=R(SI.totTax||0);                                          /* 2b */
  const taxOn=Math.max(0,normalTax+splTax-agriRebate);                   /* 2d (L61) */

  /* 2e — rebate under section 87A (Tax Calculated: new 60000 @ TI≤12L with marginal relief; old 12500 @ TI≤5L, not against 112A/115AD) */
  let rebate=0,marginal=0;
  if(S.pi.status==="I"&&S.pi.res!=="NRI"){
    if(isNew()){
      if(ti<=1200000)rebate=Math.min(taxOn,60000);
      else{const excess=ti-1200000;if(normalTax>excess){marginal=normalTax-excess;rebate=Math.min(taxOn,marginal);}}
    } else if(ti<=500000){rebate=Math.min(taxOn-R(SI.tax112A||0)-R(SI.tax115AD||0),12500);}
  }
  rebate=Math.max(0,R(rebate));
  const after=Math.max(0,taxOn-rebate);                                  /* 2f (L66) */

  /* 2g — surcharge: 25% on 115BBE (never relieved) + tiered on the rest, 15% cap on CG/dividend, marginal relief at four thresholds (L76) */
  const bbeTax=R(SI.bbeTax||0), cgDivTax=R(SI.cgDivTax||0);
  const here=taxPlusSurAt(ti,splTax,cgDivTax,bbeTax,normalInc);
  let surII=R((after-bbeTax-cgDivTax)*here.scr/100+cgDivTax*here.capRate/100), surI=R(bbeTax*0.25), mr=0;
  [5000000,10000000,20000000,50000000].forEach(th=>{ if(ti>th){
    const cut=taxPlusSurAt(th,Math.min(splTax,th),Math.min(cgDivTax,th),bbeTax,Math.max(0,th-splInc));
    const relief=Math.max(0,(after+surII)-(cut.taxOn+cut.sur)-(ti-th));
    if(relief>mr)mr=relief;
  }});
  surII=Math.max(0,surII-mr);
  const sur=surI+surII;                                                  /* 2gBiv */
  const cess=R((after+sur)*0.04);                                        /* 2h */
  const grossTaxLiability=R(after+sur+cess);                             /* 2i (L78) */

  /* ===== AMT (Schedule AMT) — old regime only; 18.5% of adjusted TI if > 20 lakh (REGIME.md A830/A835) ===== */
  /* add-backs (AMT sheet 2a Part C VI-A, 2b 10AA, 2c 35AD); adjusted TI = 14 of Part B-TI + 2d */
  const amtPartC=viaPartC, amt10AA=us10AA, amt35AD=Math.max(0,R(BP.ded35AD!=null?BP.ded35AD:(DED.ded35AD||0)));
  const amtAdj=Math.max(0,ti+amtPartC+amt10AA+amt35AD);                  /* item 3 (J10) */
  const amtIFSC=Math.max(0,Math.min(R(S.tax.amtIFSC||0),amtAdj));        /* 3a IFSC units @9% */
  const amtOther=Math.max(0,amtAdj-amtIFSC);                            /* 3b other units @18.5% */
  const amtApplies=!isNew() && (amtPartC+amt10AA+amt35AD)>0 && amtAdj>2000000; /* bacValue=1 → 0 in new regime */
  const amt115JC=amtApplies?R(amtIFSC*0.09+amtOther*0.185):0;            /* item 4 (J13) */
  const amtScr= amtAdj>50000000?37: amtAdj>20000000?25: amtAdj>10000000?15: amtAdj>5000000?10:0;
  const amtSur=amtApplies?R(amt115JC*amtScr/100):0;                      /* TTI 1b */
  const amtCess=amtApplies?R((amt115JC+amtSur)*0.04):0;                  /* TTI 1c */
  const amtTotal=amtApplies?R(amt115JC+amtSur+amtCess):0;               /* TTI 1d TotalTax_DI */

  /* ===== Part B-TTI item 3 — gross tax payable = higher of 1d and 2i (L79) ===== */
  const grossTaxPayable=Math.max(grossTaxLiability,amtTotal);

  /* ===== AMTC (Schedule AMTC) — credit under 115JD, utilisation oldest-year first ===== */
  const amtcTax115JC=amtTotal;                                          /* AMTC 1 = 1d of B-TTI (L4) */
  const amtcTaxOther=grossTaxLiability;                                 /* AMTC 2 = 2i of B-TTI (L5) */
  const amtcAvail=Math.max(0,amtcTaxOther-amtcTax115JC);               /* AMTC 3 (L6) */
  const amtcRows=TAX_AMTC_YRS.map(y=>{const r=(S.tax.amtc||{})[y]||{};const g=R(N(r.gross)),so=R(N(r.setoff));
    return {y,gross:g,setoff:so,bf:Math.max(0,g-so),used:0,cf:0};});    /* B3 = MAX(B1−B2,0) */
  if(!isNew()){ let rem=amtcAvail; amtcRows.forEach(r=>{const u=Math.min(rem,r.bf);r.used=u;rem-=u;r.cf=r.bf-u;}); }
  else amtcRows.forEach(r=>{r.used=0;r.cf=r.bf;});                       /* REGIME.md A: col C/D must be 0 in the new regime */
  const amtcCurr=(!isNew())?Math.max(0,amtcTax115JC-amtcTaxOther):0;    /* xiv current-AY new credit (G22) */
  const amtcUsed=R(amtcRows.reduce((a,r)=>a+r.used,0));                 /* item 5 col C (K24) */
  const amtcCF=R(amtcRows.reduce((a,r)=>a+r.cf,0)+amtcCurr);           /* item 6 col D (K25) */

  /* ===== Part B-TTI 4–7: credit, relief, net tax liability ===== */
  const credit=(grossTaxLiability>amtTotal)?amtcUsed:0;                 /* item 4 (L83) */
  const esopDef=R(N((S.C.esop||{}).deferNow||(S.esop||{}).deferNow||0));/* 3b tax deferred this year */
  const esopDue=R((S.C.esopDue!=null?S.C.esopDue:(S.C.esop||{}).due)||0);/* 3c ESOP deferred earlier, now payable */
  const taxInc17=Math.max(0,grossTaxPayable-esopDef);                   /* 3a (L80) */
  const afterCredit=Math.max(0,taxInc17+esopDue-credit);               /* item 5 (L84) */
  const rel89=Math.max(0,R(N(S.tax.s89)));                              /* 6a */
  const rel90=R((S.C.trDTAA!=null?S.C.trDTAA:(S.C.fsi||{}).dtaaRel)||0);/* 6b Section 90/90A (2 of TR) */
  const rel91=R((S.C.trNoDTAA!=null?S.C.trNoDTAA:(S.C.fsi||{}).noDtaaRel)||0);/* 6c Section 91 (3 of TR) */
  const relief=R(rel89+rel90+rel91);                                    /* 6e (L90) */
  const net=Math.max(0,R(afterCredit-relief));                          /* item 7 net tax liability (L91) */

  /* ===== taxes paid (S.C.paid, guarded) ===== */
  const P=(S.C.paid||{});
  const adv=R(P.adv||0), tds=R(P.tds||0), tcs=R(P.tcs||0), sat=R(P.sat||0);
  const paidTot=R(P.paid!=null?P.paid:(adv+tds+tcs+sat));

  /* ===== interest & fee (Tax Calculated sheet) ===== */
  const dueDate=D(S.fs.dueExt)||DUE;
  const filed=D(S.fs.filed);
  const endA=([17,18].indexOf(+S.fs.sec)>=0&&D(S.fs.origdate))?D(S.fs.origdate):filed;   /* B12: revised/defective → original date */
  const late=!!(endA&&endA>dueDate);
  const IT=Array.isArray(S.it)?S.it:[];
  const isSAT=c=>{const d=D(c.dt);return d?d>YREND:false;};
  const satIn=(a,b)=>IT.filter(c=>isSAT(c)&&D(c.dt)&&D(c.dt)>=a&&D(c.dt)<=b).reduce((s,c)=>s+N(c.amt),0);

  /* 234A: net less advance/TDS/TCS/SAT-by-due, 1%/month, principal floored to 100 (B3/B4/B15) */
  const matchedSAT=satIn(new Date(2026,3,1),dueDate);
  let p234a=Math.max(0,net-adv-tds-tcs-matchedSAT); if(p234a>100)p234a=Math.floor(p234a/100)*100;
  const m234a=late?MPART(dueDate,endA):0;
  const i234a=R(p234a*0.01*m234a);

  /* 234F late fee (≤ 5000; 1000 if TI ≤ 5L) and 234-I revised-return fee */
  const f234f=late?(ti<=500000?1000:5000):0;
  const f234i=(+S.fs.sec===17)?Math.min(99999,R(N(S.tax.f234i))):0;

  /* 234C: quarterly shortfall (QDEF 15/45/75/100, safe-harbour 12/36 for Q1/Q2). Special income is treated as accruing from Q1 unless a quarter-wise breakdown is published. */
  const seniorRes=S.pi.res!=="NRI"&&S.pi.status==="I"&&senior();
  const amtCase=amtApplies&&amtTotal>grossTaxLiability;
  const gate234c=net>=10000&&!seniorRes;
  const upto=d=>IT.filter(c=>!isSAT(c)&&D(c.dt)&&D(c.dt)<=d).reduce((a,c)=>a+N(c.amt),0);
  const paidIn5=IT.filter(c=>!isSAT(c)&&D(c.dt)&&D(c.dt)>TAX_Q_CUT[3]&&D(c.dt)<=YREND).reduce((a,c)=>a+N(c.amt),0);
  /* tax cumulative to each instalment — the whole year's liability accrues from Q1 in the safe default */
  const taxCum=k=>amtCase?amtTotal:net;
  const QDEF=[[0.15,0.12,3],[0.45,0.36,3],[0.75,null,3],[1,null,1]];
  const qs=QDEF.map((q,k)=>{const pc=q[0],safe=q[1],mo=q[2];
    const base=Math.max(0,taxCum(k)-tds-tcs-relief);const need=R(base*pc),got=upto(TAX_Q_CUT[k]);
    let sh=(safe!==null&&got>=Math.floor(base*safe/100)*100)?0:Math.floor(Math.max(0,need-got)/100)*100;
    if(!gate234c)sh=0;
    return {base:R(base),need,got:R(got),short:sh,mo,int:R(sh*0.01*mo)};});
  const q5base=amtCase?0:Math.max(0,taxCum(4)-taxCum(3));                /* the fifth slot: income arising 16–31 Mar */
  const q5short=gate234c?Math.floor(Math.max(0,q5base-paidIn5)/100)*100:0;
  qs.push({base:R(q5base),need:R(q5base),got:R(paidIn5),short:q5short,mo:1,int:R(q5short*0.01)});
  const i234c=R(qs.reduce((a,q)=>a+q.int,0));

  /* 234B: monthly cycle Apr→filing; a self-assessment challan pays accrued interest first then principal (B82/B83) */
  const assessed=net-tds-tcs; let i234b=0; const cycles=[];
  if(assessed>=10000&&net>=10000&&adv<0.9*assessed){
    let principal=Math.floor(Math.max(0,net-adv-tds-tcs)/100)*100;
    let balInt=f234f+i234a+i234c;
    const end=filed||new Date();const months=Math.min(24,MPART(new Date(2026,3,1),end)||1);
    for(let m=0;m<months;m++){const mStart=new Date(2026,3+m,1),mEnd=new Date(2026,4+m,0);
      const intr=R(principal*0.01);i234b+=intr;balInt+=intr;
      const s=satIn(mStart,mEnd);const toInt=Math.min(s,balInt);const toPrin=Math.max(0,Math.min(s-toInt,principal));
      cycles.push({m:m+1,principal:R(principal),intr,sat:R(s),toInt:R(toInt),toPrin:R(toPrin)});
      balInt-=toInt;principal=Math.max(0,principal-toPrin);}
  }
  const intTotal=R(i234a+i234b+i234c+f234f+f234i);                      /* 8e (L98) */
  const aggregate=R(net+intTotal);                                     /* item 9 (L99) */
  const bal=aggregate-paidTot;
  const balance=R(Math.round(Math.max(0,bal)/10)*10);                  /* item 11 (L106) */
  const refund=R(Math.round(Math.max(0,-bal)/10)*10);                  /* item 12 (L107) */

  /* ===== TPSA (Schedule TPSA) — tax on secondary adjustments u/s 92CE(2A); gated on the Part A-OI 92CE flag ===== */
  const tpsaOn=st0(S.tax.tpsaOn)==="Yes";
  const tpsaAmt=tpsaOn?Math.max(0,R(N(S.tax.tpsa.amt))):0;              /* item 1 (typed) */
  const tpsa18=R(tpsaAmt*0.18);                                        /* 2a (P8) */
  const tpsa12=R(tpsa18*0.12);                                         /* 2b (P9) */
  const tpsaCess=R((tpsa18+tpsa12)*0.04);                              /* 2c (P10) */
  const tpsaTotal=R(tpsa18+tpsa12+tpsaCess);                           /* 2d (P11) */
  const tpsaDeposited=R((S.tax.tpsa.rows||[]).reduce((a,r)=>a+N(r.amt),0)); /* H19 */
  const tpsaPaid=tpsaDeposited;                                        /* item 3 = table total (P12) */
  const tpsaNet=Math.max(0,R(tpsaTotal-tpsaPaid));                     /* item 4 (P13) */

  /* ===== publish the S.C contract ===== */
  S.C.gti=R(gti);
  S.C.ti=R(ti);
  S.C.tax={regime:isNew()?"New":"Old",
    salaries,item2,b3i,b3ii,b3iii,b3iv,b3v,st20,st30,stApp,stDTAA,totST,lt125,ltDTAA,totLT,cgC2,cg4c,cg4e,

    bands,normalInc:R(normalInc),normalTax,aggFlag,agriRebate:R(agriRebate),splTax,taxOn:R(taxOn),
    rebate,marginal:R(marginal),after:R(after),scr:here.scr,scrCap:here.capRate,surI,surII:R(surII),mr:R(mr),
    sur:R(sur),cess,gross:R(grossTaxLiability),grossPayable:R(grossTaxPayable),age:age()};
  S.C.amt={applies:amtApplies,partC:amtPartC,d10AA:amt10AA,d35AD:amt35AD,adjusted:R(amtAdj),
    ifsc:R(amtIFSC),other:R(amtOther),amt:R(amt115JC),sur:R(amtSur),cess:R(amtCess),total:R(amtTotal)};
  S.C.amtc={tax115JC:amtcTax115JC,taxOther:amtcTaxOther,avail:R(amtcAvail),rows:amtcRows,curr:R(amtcCurr),
    used:amtcUsed,cfTotal:amtcCF,gross:R(amtcRows.reduce((a,r)=>a+r.gross,0)),setoff:R(amtcRows.reduce((a,r)=>a+r.setoff,0)),
    bf:R(amtcRows.reduce((a,r)=>a+r.bf,0)),credit:R(credit)};
  S.C.tpsa={on:tpsaOn,amt:tpsaAmt,t18:tpsa18,t12:tpsa12,cess:tpsaCess,total:tpsaTotal,paid:tpsaPaid,net:tpsaNet,deposited:tpsaDeposited};
  S.C.int={late,filed,endA,dueDate,grossPayable:R(grossTaxPayable),esopDef,esopDue,credit:R(credit),
    taxInc17:R(taxInc17),afterCredit:R(afterCredit),rel89,rel90,rel91,relief,net,
    matchedSAT:R(matchedSAT),p234a:R(p234a),m234a,i234a,assessed:R(assessed),i234b:R(i234b),cycles,
    qs,i234c,f234f,f234i:R(f234i),amtCase,total:intTotal,aggregate,
    adv,tds,tcs,sat,paid:paidTot,balance,refund};
}

  /* ===== Part B-TTI ===== */

  h+=r("2f","Tax payable after rebate (2d − 2e)",T.after||0,{cls:"tot"});
  h+=sub("2g · Surcharge");

  h+=r("2gB(i)","After marginal relief — 25% of 17(ii) of SI",T.surI||0,{ind:1});
  h+=r("2gB(ii)","After marginal relief — 10%/15% as applicable",T.surII||0,{ind:1});

  h+=r("2gBiv","Total surcharge",T.sur||0,{cls:"tot"});
  h+=r("2h","Health & education cess at 4% on (2f + 2giv)",T.cess||0);
  h+=r("2i","Gross tax liability (2f + 2giv + 2h)",T.gross||0,{cls:"tot"});

  h+=r("3b","Tax deferred relatable to the 17(2)(vi) perquisite",I.esopDef||0,{ind:1});
  h+=r("3c","Tax deferred from earlier years, payable now — col 7 of Schedule ESOP",I.esopDue||0,{ind:1});
  h+=r("4","Credit under 115JD of tax paid in earlier years (only if 2i > 1d)",-(I.credit||0));
  h+=r("5","Tax payable after credit (3a + 3c − 4)",I.afterCredit||0,{cls:"tot"});
  h+=sub("6 · Tax relief");
  h+=row("6a · Section 89 (submit Form 10E)",inp("tax.s89",{n:1}),{ref:"6a",ind:1});
  if(N(S.tax.s89))h+=row("Acknowledgement number of Form 10E",inp("tax.e10ack",{max:15}),{req:1,ind:1});
  h+=r("6b","Section 90 / 90A — 2 of Schedule TR",I.rel90||0,{ind:1});
  h+=r("6c","Section 91 — 3 of Schedule TR",I.rel91||0,{ind:1});
  h+=r("6e","Total (6a + 6b + 6c)",I.relief||0,{cls:"tot"});
  h+=r("7","Net tax liability (5 − 6e) — nil if negative",I.net||0,{cls:"grand"});
  h+=sub("8 · Interest and fee payable");
  h+=row("Date of filing the return",dte("fs.filed"),{req:1,hint:"due "+DISP(I.dueDate||DUE)});
  h+=r("8a","Interest for default in furnishing the return — 234A",I.i234a||0,{ind:1,hint:I.m234a?I.m234a+" month"+(I.m234a>1?"s":"")+" on "+RS(I.p234a||0):""});
  h+=r("8b","Interest for default in payment of advance tax — 234B",I.i234b||0,{ind:1,hint:(I.cycles||[]).length?(I.cycles.length+" monthly cycles"):""});
  h+=r("8c","Interest for deferment of advance tax — 234C",I.i234c||0,{ind:1,hint:I.amtCase?"on the alternate minimum tax":""});
  h+=r("8d","Fee for default in furnishing the return — 234F",I.f234f||0,{ind:1});
  h+=row("8da · Fee for furnishing a revised return — 234-I",(+S.fs.sec===17)?inp("tax.f234i",{n:1}):cell(0),{ref:"8da",ind:1});

    r("5","Credit under 115JD utilised during the year — total of 4(C) → item 4 of Part B-TTI",AC.used||0,{cls:"tot"})+

      r("2c","Health & education cess on (a + b)",TP.cess||0,{ind:1})+

        S.tax.tpsa.rows,{min:"820px",empty:"No challan entered.",add:"Add a challan"})+
      r("—","Amount deposited (total of the table)",TP.deposited||0,{cls:"tot"})+
      r("3","Taxes paid",TP.paid||0)+
      r("4","Net tax payable (2d − 3)",TP.net||0,{cls:"grand"})
    ):note("Filled only when the option under section 92CE(2A) is exercised on Part A-OI.")));
  return h;
}

function impTax(I3){

  const CTL=g(I3,"PartB_TTI.ComputationOfTaxLiability")||{};
  const s89=g(CTL,"TaxRelief.Section89"), f234i=g(CTL,"IntrstPay.FeeFurnish234I");
  if(s89!=null||f234i!=null){S.tax.s89=nz(s89);S.tax.f234i=nz(f234i);read.push("reliefs & fees (Part B-TTI)");}
  if(I3&&I3["PartB-TI"])read.push("Part B-TI (computed on import)");
  const AC=I3&&I3.ScheduleAMTC;
  if(AC){S.tax.amtc={};(AC.ScheduleAMTCDtls||[]).forEach(r=>{S.tax.amtc[r.AssYr]={gross:r.AmtCreditFwd,setoff:r.AmtCreditSetOfEy};});read.push("Schedule AMTC");}
  const TP=I3&&I3.ScheduleTPSA;
  if(TP){S.tax.tpsaOn="Yes";S.tax.tpsa={amt:TP.AmtPrimaryAdjUs92CE_2A,
    rows:(TP.DtlsTaxesPaid||[]).map(r=>({bsr:r.BSRCode,bank:r.BankBranchName,dt:dmy(r.DateDep),chln:r.SrlNoOfChaln,amt:r.Amount}))};
    read.push("Schedule TPSA");}

/* ---- checks (regime-aware, from the book's rules) ---- */
function chkTax(){
  const o=[],add=(l,t,m)=>o.push({lvl:l,t,m,sec:"tax"});
  const T=S.C.tax||{},I=S.C.int||{},AM=S.C.amt||{},AC=S.C.amtc||{},TP=S.C.tpsa||{};

  /* AMT must be blank in the new regime (REGIME.md A836) */
  if(isNew()&&(AM.partC||AM.d10AA||AM.d35AD))
    add("warn","Schedule AMT closed by the new regime","Adjusted-income add-backs of "+RS((AM.partC||0)+(AM.d10AA||0)+(AM.d35AD||0))+" are ignored — AMT (section 115JC) does not apply under section 115BAC.");
  else if(AM.applies)
    add("ok","Alternate minimum tax applies","Adjusted total income "+RS(AM.adjusted)+" exceeds ₹20 lakh — tax under 115JC is "+RS(AM.total)+" (higher-of comparison with the normal tax).");

  /* AMTC utilisation must be zero in the new regime (AMTC.md rules line 4240) */
  if(isNew()&&(AC.used||AC.cfTotal))
    add("warn","AMT credit under the new regime","Under the new regime the credit utilised and carried forward are held to zero.");
  else if((AC.used||0)>0)
    add("ok","AMT credit utilised",RS(AC.used)+" of section-115JD credit is set off this year; "+RS(AC.cfTotal)+" carries forward.");

  /* AMTC 2025-26 set-off-in-earlier-years cap (AMTC.md rules line 4230) */
  const r2526=(S.tax.amtc||{})["2025-26"]||{};
  if(N(r2526.setoff)>0)add("err","Schedule AMTC — 2025-26","Set off in earlier years cannot be claimed for A.Y. 2025-26; column B2 must be zero.");

  /* the 87A rebate */
  if(T.marginal>0)add("ok","Marginal relief under section 87A","Tax is held to the income above ₹12,00,000; "+RS(T.rebate)+" falls away.");
  else if(T.rebate>0)add("ok","Rebate under section 87A",RS(T.rebate)+" of tax falls away.");

  /* surcharge cap on capital gains / dividend */
  if((T.scr||0)>15&&(T.scrCap||0)===15&&((T.cgC2||0)||(S.C.si||{}).cgDivTax))
    add("ok","Surcharge on capital gains capped","The surcharge on the capital-gains and dividend portion is held to 15 per cent.");

  /* TPSA (section 92CE(2A)) */
  if(TP.on){
    if(!(TP.amt>0))add("err","Schedule TPSA","The option under section 92CE(2A) is exercised but no primary-adjustment amount is entered.");
    const sysISO=new Date().toISOString().slice(0,10);
    (S.tax.tpsa.rows||[]).forEach((x,i)=>{
      const iso=ISO(x.dt);
      if(st0(x.dt)&&!iso)add("err","TPSA challan "+(i+1),"The date of deposit is not a valid date.");
      else if(iso&&iso<"2025-04-01")add("err","TPSA challan "+(i+1),"The date of deposit cannot be before 01-04-2025.");
      else if(iso&&iso>sysISO)add("err","TPSA challan "+(i+1),"The date of deposit cannot be after today.");
      if(st0(x.bsr)&&!/^[0-9]{3}[0-9A-Z]{4}$/.test(st0(x.bsr).toUpperCase()))add("err","TPSA challan "+(i+1),"The BSR code must be a valid seven-character code.");
    });
    if((TP.paid||0)>(TP.total||0))add("warn","Schedule TPSA","Taxes paid exceed the total additional tax; the net payable is held to zero.");
  }

  /* balance / refund summary */
  if((I.balance||0)>0)add("ok","Balance payable",RS(I.balance)+" is payable, including "+RS(I.total)+" of interest and fee.");
  else if((I.refund||0)>0)add("ok","Refund due",RS(I.refund)+" will be credited to the bank account nominated under Bank and verification.");
  if((I.i234a||0)+(I.i234b||0)+(I.i234c||0)+(I.f234f||0)>0&&I.late)
    add("warn","Filed after the due date","Interest and fee of "+RS(I.total)+" arise because the return is filed after "+DISP(I.dueDate||DUE)+".");

  return o;
}
