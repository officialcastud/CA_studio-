          aadhaar:t.AadhaarofTenant||"", pantan:t.PANTANofTenant||""})),
        rent:nz(rd.AnnualLetableValue), unreal:nz(rd.RentNotRealized), taxes:nz(rd.LocalTaxes),
        /* 1j is stored net (70%); recover the amount received = j / 0.70 */
        arrears:rd.ArrearsUnrealizedRentRcvd?Math.round(N(rd.ArrearsUnrealizedRentRcvd)/0.70):"",
        loans:(RG(rd,"Section24B.Section24BDtls",[])||[]).map(l=>({
          from:l.LoanTknFrom||"B", name:l.BankOrInstnName||"", acno:l.LoanAccNoOfBankOrInstnRefNo||"",
          dt:dmy(l.DateofLoan)||"", amt:nz(l.TotalLoanAmt), os:nz(l.LoanOutstndngAmt),
          interest:nz(l.InterestUs24B)}))
      };
    })
  };
  return ["Schedule HP (income from house property)"];
}

/* ---- checks ------------------------------------------------------ */
function chkHp(){
  const out = [];
  if(!(S.hp && S.hp.on)) return out;
  const C = S.C.hp || {};
  const myPan = st0((S.pi||{}).pan).toUpperCase();

  (S.hp.props||[]).forEach((p,n)=>{
    const r = p._ || engProp(p);
    const L = "Property "+(n+1);

    /* required address (book: do not leave address blank) */
    if(!st0(p.addr)) out.push({lvl:"err", t:L, m:"The address of the property is required.", sec:"hp"});
    if(!st0(p.city)) out.push({lvl:"err", t:L, m:"Town / City is required.", sec:"hp"});
    if((p.country||"91")==="91" && !HP_STATE_SET[st0(p.state)])
      out.push({lvl:"err", t:L, m:"State is required for a property in India.", sec:"hp"});
    if(!st0(p.type)) out.push({lvl:"err", t:L, m:"Select the type of house property (self-occupied / let out / deemed let out).", sec:"hp"});
    if(p.owner==="OT" && !st0(p.ownerOther))
      out.push({lvl:"err", t:L, m:'Owner is "Others" — please specify.', sec:"hp"});

    /* let-out / deemed let-out needs a gross rent (book: 1a > 0 if let out / deemed) */
    if((p.type==="L"||p.type==="D") && !(N(p.rent)>0))
      out.push({lvl:"err", t:L, m:"A let-out or deemed let-out property needs a gross rent / lettable value (1a).", sec:"hp"});
    /* local tax not allowed if 1a is zero/null (book: 1c note) */
    if(N(p.taxes)>0 && !(N(p.rent)>0))
      out.push({lvl:"warn", t:L, m:"Tax paid to local authorities (1c) cannot be claimed when the gross rent (1a) is nil.", sec:"hp"});
    /* unrealised rent cannot exceed the gross rent */
    if(N(p.unreal) > N(p.rent))
      out.push({lvl:"warn", t:L, m:"The amount of rent that cannot be realised (1b) cannot exceed the gross rent (1a).", sec:"hp"});

    /* co-ownership: shares must total 100; assessee share must not be 100 if co-owned */
    if(p.co==="YES"){
      if(N(p.share)===100)
        out.push({lvl:"err", t:L, m:"The property is co-owned, so your own share must be less than 100%.", sec:"hp"});
      if(!(p.coowners||[]).some(x=>st0(x.name)))
        out.push({lvl:"err", t:L, m:"List the other co-owner(s) of the property.", sec:"hp"});
      if(Math.abs((N(p.share)||0)+r.coShare-100)>0.01)
        out.push({lvl:"err", t:L, m:"Your share plus the co-owners' shares must total 100%.", sec:"hp"});
      if(r.coShare>=100)
        out.push({lvl:"warn", t:L, m:"The other co-owners' shares must total less than 100%.", sec:"hp"});
      /* assessee cannot claim interest if his share of a co-owned property is zero */
      if(N(p.share)===0 && r.hRaw>0)
        out.push({lvl:"err", t:L, m:"You cannot claim interest u/s 24(b) on a co-owned property in which your share is nil.", sec:"hp"});
    }

    /* co-owner / tenant PAN form; co-owner PAN cannot equal the assessee's PAN */
    (p.coowners||[]).forEach((x,m)=>{
      if(st0(x.pan) && !PAN_RE.test(st0(x.pan).toUpperCase()))
        out.push({lvl:"err", t:L+", co-owner "+(m+1), m:"The PAN is not in the correct form.", sec:"hp"});
      if(myPan && st0(x.pan).toUpperCase()===myPan)
        out.push({lvl:"err", t:L+", co-owner "+(m+1), m:"A co-owner's PAN cannot be the same as the assessee's PAN.", sec:"hp"});
    });
    (p.tenants||[]).forEach((x,m)=>{
      if(st0(x.pan) && !PAN_RE.test(st0(x.pan).toUpperCase()))
        out.push({lvl:"err", t:L+", tenant "+(m+1), m:"The PAN is not in the correct form.", sec:"hp"});
    });

    /* interest ceiling on a self-occupied house (regime-aware) */
    if(p.type==="S"){
      if(isNew() && r.hRaw>0)
        out.push({lvl:"warn", t:L, m:"New regime — interest on a self-occupied house cannot be claimed; it has been set to nil (section 115BAC).", sec:"hp"});
      else if(!isNew() && r.hRaw>200000)
        out.push({lvl:"warn", t:L, m:"Interest on a self-occupied house is limited to ₹2,00,000 under the old regime; the excess of "+RS(r.hRaw-200000)+" has been set aside.", sec:"hp"});
    }

    /* interest u/s 24(b) needs the loan table (book: details of loan mandatory to claim) */
    if(r.hRaw>0){
      (p.loans||[]).filter(l=>N(l.interest)).forEach((l,m)=>{
        if(!st0(l.name)||!st0(l.acno)||!st0(l.from)||!ISO(l.dt))
          out.push({lvl:"err", t:L+", loan "+(m+1), m:"Every column of the Section 24(b) loan row is required (lender, name, account no., date of sanction).", sec:"hp"});
      });
    }
  });

  /* no more than two self-occupied houses (section 23(4)) */
  if((C.selfCount||0) > 2)
    out.push({lvl:"err", t:"House property", m:"No more than two houses may be self-occupied — treat the others as deemed let out.", sec:"hp"});

  return out;
}

/* ---- register ---------------------------------------------------- */
reg({id:"hp", t:"House property", ref:"Schedule HP",
     f:secHp,
     s:()=>{ const C=S.C.hp||{}; if(!(S.hp&&S.hp.on)) return "None";
       return C.income<0 ? "Loss "+CR(-C.income)
            : (C.income ? "Income "+CR(C.income)
                        : ((S.hp.props||[]).length+" property")); },
     eng:engHp, exp:expHp, imp:impHp, chk:chkHp, order:12});

/* =====================================================================
   ITR-3 · Section "loss" — Losses: set-off and carry-forward
   Schedules CYLA · BFLA · CFL, built strictly from the ITR-3 books
   books/ITR-3/CYLA_BFLA.md and books/ITR-3/CFL.md (never ITR-2's numbers).
   Self-contained: state seed, engLoss, secLoss, expLoss, impLoss, chkLoss,
   and one reg() at the bottom. compute order 45 (after every income head,
   before tax roll-up). Regime-gated per books/ITR-3/REGIME.md.
   ===================================================================== */

/* ---- state ---------------------------------------------------------- */
/* S.loss.cfl is keyed by assessment year; each year holds the person's
   own inputs (date of filing + the historic per-column loss figures).
   editC / editB are the CYLA / BFLA "edit auto-populated details?" flags;
   the *Over objects hold the manual overrides behind those switches.     */
S.loss = S.loss || { cfl:{}, editC:"", editB:"", cylaOver:{}, busOver:{}, osOver:{}, bflaOver:{} };

/* the fourteen live income heads, in the book's row order (CYLA ii..xv /
   BFLA i..xiv). The three superseded CG rate rows (@15/@10/@20) are hidden
   in the book and never built. Flags:
     cyHP/cyBus/cyOS : which current-year set-off column exists on this row
                       (verbatim from the schema — see CYLA_BFLA.md leaves)
     bf2   : which brought-forward column feeds BFLA col-2 for this head
     bfDep : whether BFLA carries the depreciation / 35(4) columns          */
const LOSS_ROWS=[
 ["sal","Salaries","Salary",{cyHP:1,cyBus:0,cyOS:1},{bf2:0,bfDep:0}],
 ["hp","House property","HP",{cyHP:0,cyBus:1,cyOS:1},{bf2:"hp",bfDep:1}],
 ["bus","Business income (excluding speculation & specified business) or profession","BusProfExclSpecProf",{cyHP:1,cyBus:0,cyOS:1},{bf2:"bus",bfDep:1}],
 ["spec","Speculative income","SpeculativeInc",{cyHP:1,cyBus:0,cyOS:1},{bf2:"spec",bfDep:1}],
 ["specified","Specified business income","SpecifiedInc",{cyHP:1,cyBus:0,cyOS:1},{bf2:"specified",bfDep:1}],
 ["st20","Short-term capital gain taxable @ 20%","STCG20Per",{cyHP:1,cyBus:1,cyOS:1},{bf2:"st",bfDep:1}],
 ["st30","Short-term capital gain taxable @ 30%","STCG30Per",{cyHP:1,cyBus:1,cyOS:1},{bf2:"st",bfDep:1}],
 ["stApp","Short-term capital gain taxable at applicable rates","STCGAppRate",{cyHP:1,cyBus:1,cyOS:1},{bf2:"st",bfDep:1}],
 ["stDTAA","Short-term capital gain taxable at special rate as per DTAA","STCGDTAARate",{cyHP:1,cyBus:1,cyOS:1},{bf2:"st",bfDep:1}],
 ["lt125","Long-term capital gain taxable @ 12.5%","LTCG12_5Per",{cyHP:1,cyBus:1,cyOS:1},{bf2:"lt",bfDep:1}],
 ["ltDTAA","Long-term capital gain taxable at special rate as per DTAA","LTCGDTAARate",{cyHP:1,cyBus:1,cyOS:1},{bf2:"lt",bfDep:1}],
 ["os","Net income from other sources chargeable at normal applicable rates","OthSrcExclRaceHorse",{cyHP:1,cyBus:1,cyOS:0},{bf2:0,bfDep:1}],
 ["horse","Profit from activity of owning and maintaining race horses","OthSrcRaceHorse",{cyHP:1,cyBus:1,cyOS:1},{bf2:"horse",bfDep:1}],
 ["osDTAA","Income from other sources taxable at special rates as per DTAA","IncOSDTAA",{cyHP:1,cyBus:1,cyOS:1},{bf2:0,bfDep:1}]];

/* the set-off walk orders (heads that can absorb each current-year loss).
   HP & business loss reach every head that carries their column; the OS
   loss is set first against race horses and OS-DTAA (CYLA_BFLA.md rule).   */
const CY_ORDER_HP =["sal","os","horse","osDTAA","spec","specified","st30","stApp","st20","stDTAA","lt125","ltDTAA"];
const CY_ORDER_BUS=["hp","os","horse","osDTAA","st30","stApp","st20","stDTAA","lt125","ltDTAA"];
const CY_ORDER_OS =["horse","osDTAA","sal","hp","bus","spec","specified","st30","stApp","st20","stDTAA","lt125","ltDTAA"];
/* BFLA: a long-term loss goes first on the two long slots; a short-term
   loss then on all six capital slots (short first, long after).            */
const BF_ORDER_LT=["lt125","ltDTAA"];
const BF_ORDER_ST=["st30","stApp","st20","stDTAA","lt125","ltDTAA"];

/* Schedule CFL — the fixed sixteen year-rows, each with its own schema
   block and the set of columns that are live in that row's carry window
   (CFL.md: HP/business(5c)/STCG/LTCG carry 8 yrs = rows ix..xvi 2018-19+;
   speculative & race-horse carry 4 yrs = rows xiii..xvi 2022-23+;
   specified business u/s 35AD carries indefinitely = every row).            */
const F_SPEC={specified:1};
const F_8YR ={hp:1,bus:1,specified:1,st:1,lt:1};
const F_FULL={hp:1,bus:1,spec:1,specified:1,st:1,lt:1,horse:1};
const CFL_YEARS=[
 ["2010-11","LossCFFromPrev9thYearFromAY",F_SPEC],
 ["2011-12","LossCFFromPrev8thYearFromAY",F_SPEC],
 ["2012-13","LossCFFromPrev7thYearFromAY",F_SPEC],
 ["2013-14","LossCFFromPrev6thYearFromAY",F_SPEC],
 ["2014-15","LossCFFromPrev5thYearFromAY",F_SPEC],
 ["2015-16","LossCFFromPrev4thYearFromAY",F_SPEC],
 ["2016-17","LossCFFromPrev3rdYearFromAY",F_SPEC],
 ["2017-18","LossCFFromPrev2ndYearFromAY",F_SPEC],
 ["2018-19","LossCFFromPrevYrToAY",F_8YR],
 ["2019-20","LossCFCurrentAssmntYear",F_8YR],
 ["2020-21","LossCFCurrentAssmntYear2021",F_8YR],
 ["2021-22","LossCFCurrentAssmntYear2022",F_8YR],
 ["2022-23","LossCFCurrentAssmntYear2023",F_FULL],
 ["2023-24","LossCFCurrentAssmntYear2024",F_FULL],
 ["2024-25","LossCFCurrentAssmntYear2025",F_FULL],
 ["2025-26","LossCFCurrentAssmntYear2026",F_FULL]];
/* the oldest year in each carry window — its unrelieved figure lapses (CFL
   [G25]/[L25]/[M25]/[O25]/[R25]/[U25]); specified business never lapses.    */
const CFL_OLDEST_8="2018-19", CFL_OLDEST_4="2022-23";

/* ---- engine --------------------------------------------------------- */
/* Every cross-head figure is read defensively (never throw). The assumed
   S.C.<head> contract each income section publishes (guarded, default 0):
     sal.income                    salary head income
     hp.income                     house-property head income (signed)
     bp.busExcl / bp.spec / bp.specified   adjusted P&L per business kind (signed)
     cg.after.{st20,st30,stApp,stDTAA,lt125,ltDTAA}  current-yr gains after CG set-off
     cg.cflSTCL / cg.cflLTCL       Table E unabsorbed STCL/LTCL (current-yr carry)
     os.balanceNoRaceHorse         net OS at normal rates (signed)
     os.raceHorseBal               race-horse balance (signed)
     os.dtaa                       OS income taxable at special DTAA rates
   Each falls back to .income where a finer key is absent.                  */
function engLoss(){
  const g=(o)=>o||{};
  const sal=g(S.C.sal), hp=g(S.C.hp), bp=g(S.C.bp), cg=g(S.C.cg), os=g(S.C.os), ud=g(S.C.ud);
  const cgAfter=g(cg.after);
  const busExcl   = ("busExcl"   in bp)?N(bp.busExcl)   : N(bp.income);  /* NetPLBusOthThanSpec7A7B7C */
  const specPL    = ("spec"      in bp)?N(bp.spec)      : 0;             /* AdjustedPLFrmSpecuBus     */
  const specifiedPL=("specified" in bp)?N(bp.specified) : 0;            /* AdjustedPLFrmSpecifiedBus */
  const osNorm    = ("balanceNoRaceHorse" in os)?N(os.balanceNoRaceHorse) : N(os.income); /* os.BalanceNoRaceHorse */
  const osHorseBal= ("raceHorseBal" in os)?N(os.raceHorseBal) : 0;      /* os.BalanceOwnRaceHorse */
  const osDtaa    = N(os.dtaa);                                         /* os.DTAA_Amt */
  const New=isNew();

  /* ---- CYLA row i · the three incoming current-year losses ---------- */
  const hpTotal = Math.max(0,-N(hp.income));                            /* G6 = ABS(MIN(HP.TotalIncomeChargeableUnHP,0)) */
  const hpCapped= New?0:Math.min(hpTotal,200000);                       /* new regime: HP loss not set off (A572/A579) */
  const hpExcess= New?0:Math.max(0,hpTotal-200000);                     /* over ₹2,00,000 → straight to CFL */
  const busLoss = Math.max(0,-R(busExcl+Math.max(0,specPL)+Math.max(0,specifiedPL))); /* H6 */
  const osLoss  = Math.max(0,-osNorm);                                  /* I6 = ABS(MIN(os.BalanceNoRaceHorse,0)) */

  /* ---- CYLA col 1 · income of the current year (positive only) ------ */
  const inc={
    sal:Math.max(0,N(sal.income)), hp:Math.max(0,N(hp.income)),
    bus:Math.max(0,busExcl), spec:Math.max(0,specPL), specified:Math.max(0,specifiedPL),
    st20:Math.max(0,N(cgAfter.st20)), st30:Math.max(0,N(cgAfter.st30)),
    stApp:Math.max(0,N(cgAfter.stApp)), stDTAA:Math.max(0,N(cgAfter.stDTAA)),
    lt125:Math.max(0,N(cgAfter.lt125)), ltDTAA:Math.max(0,N(cgAfter.ltDTAA)),
    os:Math.max(0,osNorm), horse:Math.max(0,osHorseBal), osDTAA:Math.max(0,osDtaa)};

  /* ---- CYLA cols 2/3/4 · set-off (greedy, respecting 2+3+4 ≤ 1) ----- */
  const setHP={},setBus={},setOS={},remInc={};
  LOSS_ROWS.forEach(r=>{setHP[r[0]]=0;setBus[r[0]]=0;setOS[r[0]]=0;remInc[r[0]]=inc[r[0]];});
  const flag={};LOSS_ROWS.forEach(r=>flag[r[0]]=r[3]);
  const over=S.loss.editC;
  if(over){                                                            /* manual override behind the sheet's own switch */
    LOSS_ROWS.forEach(r=>{const k=r[0],f=r[3];
      if(f.cyHP){setHP[k]=Math.min(N((S.loss.cylaOver[k]||{}).hp),remInc[k]);remInc[k]-=setHP[k];}
      if(f.cyBus){setBus[k]=Math.min(N((S.loss.busOver[k]||{}).bus),remInc[k]);remInc[k]-=setBus[k];}
      if(f.cyOS){setOS[k]=Math.min(N((S.loss.osOver[k]||{}).os),remInc[k]);remInc[k]-=setOS[k];}});
  }else{
    let rem=hpCapped;CY_ORDER_HP.forEach(k=>{if(rem<=0||!flag[k].cyHP)return;const t=Math.min(rem,remInc[k]);setHP[k]=t;remInc[k]-=t;rem-=t;});
    rem=busLoss;   CY_ORDER_BUS.forEach(k=>{if(rem<=0||!flag[k].cyBus)return;const t=Math.min(rem,remInc[k]);setBus[k]=t;remInc[k]-=t;rem-=t;});
    rem=osLoss;    CY_ORDER_OS.forEach(k=>{if(rem<=0||!flag[k].cyOS)return;const t=Math.min(rem,remInc[k]);setOS[k]=t;remInc[k]-=t;rem-=t;});
  }
  const sum=o=>Object.keys(o).reduce((a,k)=>a+o[k],0);
  const totHPset =Math.min(sum(setHP),hpTotal,200000);                 /* G25, capped at ₹2,00,000 (s.71(3A)) */
  const totBusset=sum(setBus);                                         /* business-loss column total */
  const totOSset =sum(setOS);                                          /* I25 */
  const hpRemain = New?0:(totHPset<200000?Math.max(0,(hpCapped-totHPset)+hpExcess):hpExcess); /* G26 → CFL */
  const busRemain= Math.max(0,busLoss-totBusset);                      /* business loss to CFL */
  const osRemain = Math.max(0,osLoss-totOSset);                        /* I26 — normal OS loss lapses */
  const afterC={};LOSS_ROWS.forEach(r=>{const k=r[0];afterC[k]=R(inc[k]-setHP[k]-setBus[k]-setOS[k]);}); /* col 5 = 1−2−3−4 */

  /* ---- CFL · brought-forward figures from the year-rows ------------- */
  const cflRow=y=>(S.loss.cfl||{})[y]||{};
  const b5c=r=>Math.max(0,N(r.bus5a)-(New?N(r.bus5b):0));              /* 5c = MAX(0, 5a − 5b); 5b only in new regime */
  const bf={hp:0,bus:0,spec:0,specified:0,st:0,lt:0,horse:0};
  CFL_YEARS.forEach(([y,,F])=>{const r=cflRow(y);
    if(F.hp)bf.hp+=N(r.hp); if(F.bus)bf.bus+=b5c(r); if(F.spec)bf.spec+=N(r.spec);
    if(F.specified)bf.specified+=N(r.specified); if(F.st)bf.st+=N(r.st);
    if(F.lt)bf.lt+=N(r.lt); if(F.horse)bf.horse+=N(r.horse);});

  /* ---- BFLA col 2 · brought-forward loss set off against col-1 (=CYLA5) */
  const setBF={};LOSS_ROWS.forEach(r=>setBF[r[0]]=0);
  const overB=S.loss.editB;
  if(overB){
    LOSS_ROWS.forEach(r=>{const k=r[0],c2=r[4].bf2;if(c2)setBF[k]=Math.min(N(S.loss.bflaOver[k]),afterC[k]);});
  }else{
    setBF.hp       =Math.min(bf.hp,afterC.hp);
    setBF.bus      =Math.min(bf.bus,afterC.bus);
    setBF.spec     =Math.min(bf.spec,afterC.spec);
    setBF.specified=Math.min(bf.specified,afterC.specified);
    let remLT=bf.lt;BF_ORDER_LT.forEach(k=>{if(remLT<=0)return;const t=Math.min(remLT,afterC[k]-setBF[k]);setBF[k]+=t;remLT-=t;}); /* LTCL first, long slots only */
    let remST=bf.st;BF_ORDER_ST.forEach(k=>{if(remST<=0)return;const t=Math.min(remST,afterC[k]-setBF[k]);setBF[k]+=t;remST-=t;}); /* STCL against any CG slot */
    setBF.horse    =Math.min(bf.horse,afterC.horse);
  }
  /* how much of each brought-forward column was actually used (for CFL xviii) */
  const usedBF={hp:setBF.hp,bus:setBF.bus,spec:setBF.spec,specified:setBF.specified,horse:setBF.horse,st:0,lt:0};
  {const ltUsed=Math.min(bf.lt,BF_ORDER_LT.reduce((a,k)=>a+setBF[k],0));
   const stUsed=Math.min(bf.st,BF_ORDER_ST.reduce((a,k)=>a+setBF[k],0)-ltUsed);
   usedBF.lt=Math.max(0,ltUsed);usedBF.st=Math.max(0,stUsed);}

  /* BFLA cols 3/4 · brought-forward depreciation & 35(4) allowance from
     Schedule UD (owned by the bp section); read guarded, default nil.      */
  const depr=g(ud.deprByHead), all35=g(ud.all35ByHead);
  const setDep={},set35={};LOSS_ROWS.forEach(r=>{setDep[r[0]]=r[4].bfDep?N(depr[r[0]]):0;set35[r[0]]=r[4].bfDep?N(all35[r[0]]):0;});

  const afterB={};let gti=0;
  LOSS_ROWS.forEach(r=>{const k=r[0];afterB[k]=R(Math.max(0,afterC[k]-setBF[k]-setDep[k]-set35[k]));gti+=afterB[k];}); /* J = MAX(0,F−G−H−I) */
  const totBFset=sum(setBF), totDep=sum(setDep), tot35=sum(set35);

  /* ---- CFL xix · current-year losses to carry forward -------------- */
  const cur={
    hp:hpRemain,                                                       /* [G24] = CYLA HP balance */
    bus:busRemain,                                                     /* [L24] = CYLA business balance */
    spec:Math.max(0,-R(specPL)),                                       /* [M24] = ABS(MIN(0, AdjustedPLFrmSpecuBus)) */
    specified:Math.max(0,-R(specifiedPL)),                             /* [N24] = ABS(MIN(0, AdjustedPLFrmSpecifiedBus)) */
    st:Math.max(0,R(("cflSTCL" in cg)?N(cg.cflSTCL):0)),               /* [O24] = CG Table E unabsorbed STCL */
    lt:Math.max(0,R(("cflLTCL" in cg)?N(cg.cflLTCL):0)),               /* [R24] = CG Table E unabsorbed LTCL */
    horse:Math.max(0,-R(osHorseBal))};                                 /* [U24] = ABS(MIN(0, os.BalanceOwnRaceHorse)) */

  /* ---- CFL xx · total carried forward, with the window lapse rule --- */
  const old8=cflRow(CFL_OLDEST_8), old4=cflRow(CFL_OLDEST_4);
  const oldest={hp:N(old8.hp),bus:b5c(old8),st:N(old8.st),lt:N(old8.lt),spec:N(old4.spec),horse:N(old4.horse)};
  const cf={};
  ["hp","bus","st","lt"].forEach(k=>{cf[k]=Math.max(0,bf[k]-Math.max(usedBF[k],oldest[k])+cur[k]);}); /* 8-yr window lapse */
  ["spec","horse"].forEach(k=>{cf[k]=Math.max(0,bf[k]-Math.max(usedBF[k],oldest[k])+cur[k]);});       /* 4-yr window lapse */
  cf.specified=Math.max(0,bf.specified-usedBF.specified+cur.specified);                               /* no lapse — indefinite */
  const lapsed={};["hp","bus","st","lt","spec","horse"].forEach(k=>{lapsed[k]=Math.max(0,oldest[k]-usedBF[k]);});
  cf.total=cf.hp+cf.bus+cf.spec+cf.specified+cf.st+cf.lt+cf.horse;

  /* ---- BFLA validators (CFL.md / rules.json) ----------------------- */
  const val=[];
  const stSetTotal=BF_ORDER_ST.reduce((a,k)=>a+setBF[k],0), ltSetTotal=BF_ORDER_LT.reduce((a,k)=>a+setBF[k],0);
  if(stSetTotal>bf.st+bf.lt+1) val.push("Losses set off against capital gains cannot exceed the capital loss brought forward in Schedule CFL.");
  if(ltSetTotal>bf.lt+1)       val.push("Losses set off against long-term gains cannot exceed the long-term loss brought forward in Schedule CFL.");

  /* ---- this head's contribution to gross total income --------------
     GTI = BFLA total (income after CYLA & BFLA, all heads). The other
     heads publish their own signed income; loss.income is the correction
     that makes Σ S.C.<head>.income equal that true GTI (losses set off /
     carried forward, and the ₹2L cap, are all folded in here).            */
  const otherHeads=N(sal.income)+N(hp.income)+N(bp.income)+N(cg.income)+N(os.income);
  const income=R(gti)-R(otherHeads);

  S.C.loss={
    inc,hpTotal:R(hpTotal),hpCapped:R(hpCapped),hpExcess:R(hpExcess),busLoss:R(busLoss),osLoss:R(osLoss),
    setHP,setBus,setOS,totHPset:R(totHPset),totBusset:R(totBusset),totOSset:R(totOSset),
    hpRemain:R(hpRemain),busRemain:R(busRemain),osRemain:R(osRemain),afterC,
    bf,setBF,setDep,set35,usedBF,totBFset:R(totBFset),totDep:R(totDep),tot35:R(tot35),afterB,gti:R(gti),
    cur,cf,oldest,lapsed,val,income:R(income),
    cylaTotal:R(totHPset+totBusset+totOSset), bflaTotal:R(totBFset)};
  return S.C.loss;
}

/* ---- renderer ------------------------------------------------------- */
function secLoss(){
  const L=S.C.loss||engLoss();let h="";
  const New=isNew();
  const closed='style="background:var(--closed)"';

  /* ===== Schedule CYLA ===== */
  h+='<div class="cgband">Schedule CYLA — set-off of the current year\'s losses</div>';
  h+=note("This year's house-property loss, business loss and normal other-sources loss are set against the other heads in the order the utility uses. "+
    "A house-property loss is set against other heads only up to ₹2,00,000"+(New?" — and not at all under the new regime, where it lapses":"; the excess goes to Schedule CFL")+
    ". A normal other-sources loss not set off here lapses.");
  const ed=!!S.loss.editC;
  h+='<div class="full"><table class="gt" style="min-width:1120px"><thead><tr><th class="l" style="width:34px">Sl.</th>'+
     '<th class="l" style="min-width:320px">Head / source of income</th><th style="width:120px">Income of current year (1)</th>'+
     '<th style="width:130px">HP loss set off (2)</th><th style="width:150px">Business loss set off (3)</th>'+
     '<th style="width:150px">OS loss set off (4)</th><th style="width:130px">Remaining after set-off (5)</th></tr></thead><tbody>';
  h+='<tr><td class="l">i</td><td class="l"><b>Loss to be set off (fill only if the computed figure is negative)</b></td><td></td>'+
     '<td class="num">'+cell(-L.hpTotal)+(L.hpExcess?'<span class="dt">+ '+F(L.hpExcess)+' over ₹2L → CFL</span>':'')+'</td>'+
     '<td class="num">'+cell(-L.busLoss)+'</td><td class="num">'+cell(-L.osLoss)+'</td><td></td></tr>';
  const slC=["ii","iii","iv","v","vi","vii","viii","ix","x","xi","xii","xiii","xiv","xv"];
  LOSS_ROWS.forEach((r,i)=>{const [k,label,,f]=r;
    h+='<tr><td class="l">'+slC[i]+'</td><td class="l">'+esc(label)+'</td><td class="num">'+cell(L.inc[k])+'</td>'+
       '<td class="num"'+(f.cyHP?'':' '+closed)+'>'+(f.cyHP?(ed?inp("loss.cylaOver."+k+".hp",{n:1}):cell(L.setHP[k])):'')+'</td>'+
       '<td class="num"'+(f.cyBus?'':' '+closed)+'>'+(f.cyBus?(ed?inp("loss.busOver."+k+".bus",{n:1}):cell(L.setBus[k])):'')+'</td>'+
       '<td class="num"'+(f.cyOS?'':' '+closed)+'>'+(f.cyOS?(ed?inp("loss.osOver."+k+".os",{n:1}):cell(L.setOS[k])):'')+'</td>'+
       '<td class="num">'+cell(L.afterC[k])+'</td></tr>';});
  h+='</tbody><tfoot>'+
     '<tr><td class="l">xvi</td><td class="l">Total loss set off</td><td></td><td>'+F(L.totHPset)+'</td><td>'+F(L.totBusset)+'</td><td>'+F(L.totOSset)+'</td><td></td></tr>'+

function expLoss(j){

    if(b.bf2)o.BFlossPrevYrUndSameHeadSetoff=n0(L.setBF[k]);
    if(b.bfDep){o.BFUnabsorbedDeprSetoff=n0(L.setDep[k]);o.BFAllUs35Cl4Setoff=n0(L.set35[k]);}
    const req=["Salary","STCG20Per","STCG30Per","STCGAppRate","STCGDTAARate","LTCG12_5Per","LTCGDTAARate"].indexOf(key)>=0;
    if(req||L.afterC[k]||L.setBF[k])BF[key]={IncBFLA:o};});
  BF.TotalBFLossSetOff={TotBFLossSetoff:n0(L.totBFset),TotUnabsorbedDeprSetoff:n0(L.totDep),TotAllUs35cl4Setoff:n0(L.tot35)};
  BF.IncomeOfCurrYrAftCYLABFLA=n0(L.gti);
  BF.EditAutopoulatedDetail=S.loss.editB?"Y":"N";
  j.ScheduleBFLA=BF;

  /* ===== ScheduleCFL ===== */
  const anyYear=CFL_YEARS.some(([y,,F])=>{const r=(S.loss.cfl||{})[y]||{};
    return (F.hp&&N(r.hp))||(F.bus&&N(r.bus5a))||(F.spec&&N(r.spec))||(F.specified&&N(r.specified))||(F.st&&N(r.st))||(F.lt&&N(r.lt))||(F.horse&&N(r.horse));});
  if(anyYear||L.cf.total>0||L.bf.hp+L.bf.bus+L.bf.spec+L.bf.specified+L.bf.st+L.bf.lt+L.bf.horse>0){
    const C={};const New=isNew();
    CFL_YEARS.forEach(([y,key,F])=>{const r=(S.loss.cfl||{})[y]||{};
      const b5c=Math.max(0,N(r.bus5a)-(New?N(r.bus5b):0));
      const any=(F.hp&&N(r.hp))||(F.bus&&N(r.bus5a))||(F.spec&&N(r.spec))||(F.specified&&N(r.specified))||(F.st&&N(r.st))||(F.lt&&N(r.lt))||(F.horse&&N(r.horse));
      if(!any)return;
      const d={DateOfFiling:ISO(r.dt)||"2025-07-31"};
      if(F.hp&&N(r.hp))d.TotalHPPTILossCF=n0(r.hp);
      if(F.bus&&N(r.bus5a)){d.BrtFwdBusLoss=n0(r.bus5a);if(New&&N(r.bus5b))d.AdjustAccTax115BACAmt=n0(r.bus5b);d.BusLossOthThanSpecLossCF=n0(b5c);}
      if(F.spec&&N(r.spec))d.LossFrmSpecBusCF=n0(r.spec);
      if(F.specified&&N(r.specified))d.LossFrmSpecifiedBusCF=n0(r.specified);
      if(F.st&&N(r.st))d.TotalSTCGPTILossCF=n0(r.st);
      if(F.lt&&N(r.lt))d.TotalLTCGPTILossCF=n0(r.lt);

    const summ=o=>({LossSummaryDetail:{TotalHPPTILossCF:n0(o.hp),BusLossOthThanSpecLossCF:n0(o.bus),LossFrmSpecBusCF:n0(o.spec),
      LossFrmSpecifiedBusCF:n0(o.specified),TotalSTCGPTILossCF:n0(o.st),TotalLTCGPTILossCF:n0(o.lt),OthSrcLossRaceHorseCF:n0(o.horse)}});
    C.TotalOfBFLossesEarlierYrs=summ(L.bf);

function impLoss(I3){
  const read=[];
  const rg=(o,p)=>{let t=o;for(const k of p.split(".")){if(t==null)return undefined;t=t[k];}return t;};
  const cy=I3.ScheduleCYLA, bf=I3.ScheduleBFLA, cf=I3.ScheduleCFL;
  if(cy){S.loss.editC=(cy.EditAutopoulatedDetail==="Y")?"Y":"";
    if(S.loss.editC){S.loss.cylaOver={};S.loss.busOver={};S.loss.osOver={};
      LOSS_ROWS.forEach(r=>{const k=r[0],b=cy[r[2]]&&cy[r[2]].IncCYLA;if(!b)return;
        if(r[3].cyHP)S.loss.cylaOver[k]={hp:N(b.HPlossCurYrSetoff)};
        if(r[3].cyBus)S.loss.busOver[k]={bus:N(b.BusLossSetoff)};
        if(r[3].cyOS)S.loss.osOver[k]={os:N(b.OthSrcLossNoRaceHorseSetoff)};});}
    read.push("Schedule CYLA");}
  if(bf){S.loss.editB=(bf.EditAutopoulatedDetail==="Y")?"Y":"";
    if(S.loss.editB){S.loss.bflaOver={};
      LOSS_ROWS.forEach(r=>{const k=r[0],b=bf[r[2]]&&bf[r[2]].IncBFLA;if(b&&r[4].bf2)S.loss.bflaOver[k]=N(b.BFlossPrevYrUndSameHeadSetoff);});}
    read.push("Schedule BFLA");}
  if(cf){S.loss.cfl=S.loss.cfl||{};
    CFL_YEARS.forEach(([y,key,F])=>{const d=rg(cf,key+".CarryFwdLossDetail");if(!d)return;
      const row={dt:dmy(d.DateOfFiling)};
      if(F.hp)row.hp=nz(d.TotalHPPTILossCF);
      if(F.bus){row.bus5a=nz(d.BrtFwdBusLoss);row.bus5b=nz(d.AdjustAccTax115BACAmt);}
      if(F.spec)row.spec=nz(d.LossFrmSpecBusCF);
      if(F.specified)row.specified=nz(d.LossFrmSpecifiedBusCF);
      if(F.st)row.st=nz(d.TotalSTCGPTILossCF);
      if(F.lt)row.lt=nz(d.TotalLTCGPTILossCF);
      if(F.horse)row.horse=nz(d.OthSrcLossRaceHorseCF);
      S.loss.cfl[y]=row;});
    read.push("Schedule CFL (losses carried forward)");}
  return read;
}

/* ---- checks --------------------------------------------------------- */
function chkLoss(){
  const out=[];const L=S.C.loss||engLoss();const New=isNew();
  const add=(lvl,t,m)=>out.push({lvl,t,m,sec:"loss"});

  /* CYLA ₹2,00,000 cap on the HP set-off (s.71(3A) / rule: 2xvi ≤ 200000) */
  if(L.totHPset>200000) add("err","House-property set-off cap","The current-year house-property loss set off (₹"+F(L.totHPset)+") exceeds the ₹2,00,000 limit of section 71(3A).");

  /* Regime closures on house-property loss (A572 / A573 / A579) */
  if(New&&L.totHPset>0) add("err","HP loss set off under the new regime","Under section 115BAC(1A) a house-property loss cannot be set off against any other head. Set it to nil or opt out of the new regime.");

  /* 5b (115BAC(1A) adjustment) only in the new regime (rules.json) */
  if(!New){const bad=CFL_YEARS.filter(([y,,F])=>F.bus&&N(((S.loss.cfl||{})[y]||{}).bus5b)>0).map(x=>x[0]);
    if(bad.length) add("warn","115BAC adjustment without the new regime","Schedule CFL 5b (amount adjusted on account of section 115BAC(1A)) is filled for "+bad.join(", ")+" but must be nil unless the new regime is selected.");}

  /* CFL — a carried-forward loss needs the year's date of filing */
  const noDate=CFL_YEARS.filter(([y,,F])=>{const r=(S.loss.cfl||{})[y]||{};
    const has=(F.hp&&N(r.hp))||(F.bus&&N(r.bus5a))||(F.spec&&N(r.spec))||(F.specified&&N(r.specified))||(F.st&&N(r.st))||(F.lt&&N(r.lt))||(F.horse&&N(r.horse));
    return has&&!ISO(r.dt);}).map(x=>x[0]);
  if(noDate.length) add("err","Date of filing required in Schedule CFL","A brought-forward loss carries only if that year's return was filed in time — enter the date of filing for "+noDate.join(", ")+".");

  /* BFLA arithmetic validators */
  (L.val||[]).forEach(m=>add("err","Schedule BFLA",m));

  /* informational */
  if(L.cylaTotal>0) add("ok","Current-year losses set off","₹"+F(L.cylaTotal)+" of this year's losses set against other heads in Schedule CYLA.");
  if(L.totBFset>0) add("ok","Brought-forward losses set off","₹"+F(L.totBFset)+" of earlier-year losses set off in Schedule BFLA.");
  if(L.cf.total>0) add("ok","Carried forward to future years","₹"+F(L.cf.total)+" of losses carried forward through Schedule CFL.");
  return out;
}

/* ---- engine ------------------------------------------------------ */
function engOs(){
  S.os = S.os || {};
  const O = S.os;
  const C = S.C.os = { income:0 };
  isNew();  /* regime read — no OS item closes under 115BAC (see header) */

  /* ===== item 1 — gross income at normal applicable rates ===== */
  /* 1a (J5) = 1a(i) + 1a(ii) + 1a(iii) */
  const div_i=R(O.divOth), div_ii=R(O.div22e), div_iii=R(O.div22f);
  const a1 = div_i + div_ii + div_iii;                                    /* DividendGross */
  /* 1b (J9) = nine interest lines; PTI interest (1b(iv)) may be negative */
  const bi=R(O.intSaving), bii=R(O.intDeposit), biii=R(O.intRefund), biv=R(O.intPTI),
        bv=R(O.int10_11_1), bvi=R(O.int10_11_2), bvii=R(O.int10_12_1), bviii=R(O.int10_12_2), bix=R(O.intOthers);
  const b1 = bi+bii+biii+biv+bv+bvi+bvii+bviii+bix;                        /* InterestGross */
  /* 1c */
  const c1 = R(O.rentMach);                                               /* RentFromMachPlantBldgs */
  /* 1d (J20) = MAX(0, 56(2)(x) five lines) */
  const d_i=R(O.giftMoney), d_ii=R(O.giftImmovWo), d_iii=R(O.giftImmovInadeq),
        d_iv=R(O.giftOthWo), d_v=R(O.giftOthInadeq);
  const d1 = Math.max(0, d_i+d_ii+d_iii+d_iv+d_v);                         /* Tot562x */
  /* 1e (J26) — family pension + OthersInc rows + 89A lines + 56(2)(xii)/(xiii) */
  const not89aOS = R(O.not89aUS)+R(O.not89aUK)+R(O.not89aCA);             /* J29 IncomeNotified89AOS */
  const othersSum = (O.others||[]).reduce((s,r)=>s+R(r.amt),0);
  const fp = R(O.familyPension);
  const e1 = fp + othersSum + not89aOS + R(O.not89aOther) + R(O.not89aPrYr)
             + R(O.sum562xii) + R(O.sum562xiii);                          /* AnyOtherIncome */
  const item1 = a1 + b1 + c1 + d1 + e1;                                   /* J4 GrossIncChrgblTaxAtAppRate */

  /* ===== item 2 — special rates ===== */
  const s2ai = R(O.win115BB);                                             /* LtryPzzlChrgblUs115BB */
  const s2aii = R(O.win115BBJ);                                           /* IncChrgblUs115BBJ (visible r45) */
  /* 2b (J46) = MAX(0, six 68/69 lines) */
  const b2 = Math.max(0, R(O.cc68)+R(O.ui69)+R(O.um69a)+R(O.udi69b)+R(O.ue69c)+R(O.hundi69d)); /* IncChrgblUs115BBE */
  /* 2c — accumulated PF u/s 111: TotalIncomeBenefit (J53) drives item 2 */
  const pfInc = (O.pf111||[]).reduce((s,r)=>s+R(r.incBenefit),0);         /* TotalIncomeBenefit */
  const pfTax = (O.pf111||[]).reduce((s,r)=>s+R(r.taxBenefit),0);         /* TotalTaxBenefit */
  /* 2d (J60) = Σ SourceAmount */
  const d2 = (O.spl||[]).reduce((s,r)=>s+R(r.amt),0);                     /* OthersGross */
  /* 2e (J69) = Σ PTI amounts */
  const e2 = (O.pti||[]).reduce((s,r)=>s+R(r.amt),0);                     /* PassThrIncOSChrgblSplRate */
  /* 2f (N78) DTAA total — for NRI only TRC="Y" rows count; residents: all rows */
  const dtaaRows = (O.dtaa||[]).map(r=>{
    const treaty = st0(r.treaty).toUpperCase()==="NIL" ? 0 : N(r.treaty);
    const itact  = N(r.itact);
    /* applicable rate (col 10) = lower of treaty (col 6) and IT-Act (col 9) */
    const appl = (r.treaty!==""&&r.treaty!=null) ? (r.itact!==""&&r.itact!=null ? Math.min(treaty,itact) : treaty)
                                                 : itact;
    const counts = os_isNRI() ? (r.trc==="Y") : true;                     /* rules.json line 2620/N78 */
    return {amt:R(r.amt), nature:st0(r.nature), itemno:st0(r.itemno), treaty, itact, appl,
            trc:r.trc||"", counts, natdesc:st0(r.natdesc), cname:st0(r.cname), cc:st0(r.cc), article:st0(r.article)};
  });
  const f2 = dtaaRows.filter(r=>r.counts).reduce((s,r)=>s+r.amt,0);       /* TotalAmtTaxUsDTAASchOs */
  /* item 2 (J40) = 2ai + 2aii + 2b + 2c(IncomeBenefit) + 2d + 2e
     (2f is a re-classification of amounts already in 1 & 2 — not added here) */
  const item2 = s2ai + s2aii + b2 + pfInc + d2 + e2;                      /* IncChargeableSpecialRates */

  /* ===== item 3 — section 57 deductions ===== */
  const expenses = R(O.dExpenses);                                        /* 3a(i) Expenses */
  /* 3a(ii) family-pension deduction (J88) = MIN(1/3 family pension, 25000), only if fp>0 */
  const fpDed = fp>0 ? Math.min(R(fp/3), 25000) : 0;                      /* DeductionUs57iia (max 25000) */
  /* 3b depreciation — allowed only if rental income (1c) offered */
  const dep = c1>0 ? Math.max(0,R(O.dDep)) : 0;                           /* Depreciation */
  /* 3c interest expenditure u/s 57(1): eligible ≤ 20% of dividend at 1a(i)/1a(ii);
     allowed only if that dividend is offered */
  const claimedInt = Math.max(0,R(O.dIntClaimed));                        /* UsrIntExp57 */
  const divForInt = div_i + div_ii;                                      /* 1a(i)+1a(ii) */
  const eligInt = divForInt>0 ? Math.min(claimedInt, R(0.20*divForInt)) : 0; /* IntExp57 (3c(i)) */
  const totDed = expenses + fpDed + dep + eligInt;                       /* J93 TotDeductions */

  /* ===== items 4,5,5a ===== */
  const notDed58 = R(O.notDed58);                                        /* AmtNotDeductibleUs58 */
  const profit59 = R(O.profit59);                                        /* ProfitChargTaxUs59 */
  const relief89a = R(O.relief89a);                                      /* Increliefus89AOS */

  /* ===== item 6 — net normal-rate (L97), signed ===== */
  /* DTAA amounts attributable to the item-1 normal-rate lines reduce item 6 */
  const dtaaItem1 = dtaaRows.filter(r=>r.counts && ["1ai","1aiii","1b","1c","1d"].indexOf(r.nature)>=0)
                            .reduce((s,r)=>s+r.amt,0);
  const item6 = item1 - totDed + notDed58 + profit59 - relief89a - dtaaItem1; /* L97 */

  /* ===== item 7 (L98) = 2 + MAX(0, 6) ; item-6 loss floored to nil here ===== */
  const item7 = item2 + Math.max(0, item6);                              /* BalanceNoRaceHorse / TotOthSrcNoRaceHorse */

  /* ===== item 8 — race horses (L104) ===== */
  const H = O.horse||{};
  const hReceipts=R(H.receipts), hDed57=Math.max(0,R(H.ded57)), hNot58=R(H.notDed58), hProfit59=R(H.profit59);
  const item8e = hReceipts - hDed57 + hNot58 + hProfit59;                /* BalanceOwnRaceHorse (signed; <0 → CFL 10xii) */

  /* ===== item 9 (L105) = 7 + MAX(0, 8e) ===== */
  const item9 = item7 + Math.max(0, item8e);                             /* IncChargeable (floored) */

  /* ---- expose the working ---- */
  C.a1={i:div_i,ii:div_ii,iii:div_iii,tot:a1};
  C.b1={i:bi,ii:bii,iii:biii,iv:biv,v:bv,vi:bvi,vii:bvii,viii:bviii,ix:bix,tot:b1};
  C.c1=c1;
  C.d1={i:d_i,ii:d_ii,iii:d_iii,iv:d_iv,v:d_v,tot:d1};
  C.e1={fp:fp, others:othersSum, not89aOS:not89aOS, tot:e1};
  C.item1=item1;
  C.s2ai=s2ai; C.s2aii=s2aii; C.b2=b2;
  C.pf={inc:pfInc, tax:pfTax};
  C.d2=d2; C.e2=e2; C.f2=f2; C.dtaaRows=dtaaRows;
  C.item2=item2;
  C.ded={expenses, fpDed, dep, claimedInt, eligInt, tot:totDed};
  C.notDed58=notDed58; C.profit59=profit59; C.relief89a=relief89a; C.dtaaItem1=dtaaItem1;
  C.item6=item6; C.item7=item7;
  C.horse={receipts:hReceipts, ded57:hDed57, not58:hNot58, profit59:hProfit59, bal:item8e};
  C.item9=item9;

  /* ---- rolls for other sections ---- */
  C.netNormal  = R(item6);                 /* signed; <0 → CYLA OS loss */
  C.special    = R(item2);                 /* special-rate OS income → Schedule SI */
  C.raceHorse  = R(item8e);                /* signed; <0 → Schedule CFL 10xii */
  C.chargeable = R(item9);                 /* exported IncChargeable (floored) */
  C.dtaaTotal  = R(f2);                    /* → Schedule SI DTAA rates */
  /* GTI contribution — signed on the normal leg so losses reach CYLA */
  C.income = R(item2 + item6 + Math.max(0, item8e));
}

       foot:[{l:1,v:"Total"},{v:(C.pf||{}).inc},{v:(C.pf||{}).tax}]});
    /* 2d — other special-rate sources */
    b += sub("2d · Any other income chargeable at special rate");
    b += grid("os.spl",[
      {k:"code",h:"Nature (NRI special-rate section)",t:"sel",opts:OS_SPL,req:1},
      {k:"amt",h:"Amount",t:"num",w:"150px"}
    ], O.spl||[], {min:640, empty:"No special-rate rows.", add:"Add a special-rate row",
       foot:[{l:1,v:"2d Total"},{v:C.d2}]});
    /* 2e — PTI special-rate */
    b += sub("2e · Pass through income in the nature of income from other sources at special rate");
    b += grid("os.pti",[
      {k:"code",h:"Nature (PTI NRI special-rate section)",t:"sel",opts:OS_PTI,req:1},

    ], O.pti||[], {min:640, empty:"No PTI special-rate rows.", add:"Add a PTI row",

    /* 2f — DTAA */
    b += sub("2f · Amount included in 1 and 2 above, chargeable at special rates in India as per DTAA");

    b += grid("os.dtaa",[

      {k:"itemno",h:"Section",t:"sel",opts:OS_DTAA_ITEM,req:1},

    ], O.dtaa||[], {min:1180, empty:"No DTAA rows.", add:"Add a DTAA row",

    b += row("2 · Income chargeable at special rates (2ai+2aii+2b+2c+2d+2e)", cell(C.item2), {ref:"2", cls:"tot"});
    h += fold("os_2","2","Income chargeable at special rates", RS(C.item2||0), b);

  /* ===== item 3 — section 57 deductions ===== */
  {
    const D = C.ded||{};
    let b = "";
    b += row("3a(i) · Expenses / deductions (other than family pension)", inp("os.dExpenses",{n:1}), {ref:"3a(i)"});

    b += row("3b · Depreciation", (C.c1>0?inp("os.dDep",{n:1}):cell(0)), {ref:"3b",
      hint:(C.c1>0?"allowed against rental income at 1c":"available only if rental income is offered at 1c")});
    b += row("3c · Interest expenditure u/s 57(1) claimed", inp("os.dIntClaimed",{n:1}), {ref:"3c",

  /* ===== items 4–7 ===== */

    h += fold("os_8","8","Income from owning and maintaining race horses", RS((C.horse||{}).bal||0), b);

  /* ===== item 9 ===== */
  h += row("9 · Income under the head Income from other sources (7 + 8e; 8e as nil if negative)",
           cell(C.item9), {ref:"9", cls:"tot"});

  /* ===== item 10 — quarterly accrual/receipt ===== */
  {

    b += t;
    h += fold("os_10","10","Information about accrual / receipt of income from Other Sources", "", b);
  }

  return h;
}

  /* optional interest PF-proviso lines */

  if(R(O.int10_11_2)) io.IntrstSec10XISecondProviso  = sg(R(O.int10_11_2));
  if(R(O.int10_12_1)) io.IntrstSec10XIIFirstProviso  = sg(R(O.int10_12_1));

  if(R(O.div22f))     io.Dividend22f = sg(R(O.div22f));

  /* 1e extra fixed lines */

  if(R(O.not89aPrYr))  io.IncomeNotifiedPrYr89AOS  = sg(R(O.not89aPrYr));
  if(R(O.sum562xii))   io.SumRecdPrYrBusTRU562xii   = sg(R(O.sum562xii));
  if(R(O.sum562xiii))  io.SumRecdPrYrLifIns562xiii  = sg(R(O.sum562xiii));
  if(R(O.notDed58))    io.AmtNotDeductibleUs58 = sg(C.notDed58);
  if(R(O.profit59))    io.ProfitChargTaxUs59   = sg(C.profit59);
  if(R(O.relief89a))   io.Increliefus89AOS     = sg(C.relief89a);
  /* 1e OthersInc array */
  const others = (O.others||[]).filter(r=>st0(r.nat)||R(r.amt));
  if(others.length) io.OthersInc = { OthersIncDtls: others.map(r=>({
    OthNatOfInc:(sv(r.nat)||"NA").slice(0,50), OthAmount:sg(R(r.amt)) })) };
  /* 1e 89A notified-country array */
  const not89a = [["US",R(O.not89aUS)],["UK",R(O.not89aUK)],["CA",R(O.not89aCA)]].filter(x=>x[1]);
  if(not89a.length) io.IncomeNotified89ATypeOS = not89a.map(x=>({NOT89ACountrycode:x[0], NOT89AAmount:sg(x[1])}));
  /* 2c accumulated-PF table */
  const pf = (O.pf111||[]).filter(r=>st0(r.ay)||R(r.incBenefit)||R(r.taxBenefit));

  const RH = C.horse||{};

    OS.IncFromOwnHorse = rh;
  }

  /* ---- item 9 ---- */
  OS.IncChargeable = sg(C.item9);

  /* ---- item 10 quarterly DateRange objects (required ones always present) ---- */
  const q = O.q||{};
  OS_QROWS.forEach(qr=>{
    const src = q[qr.k]||{};
    const dr = {}; let any=false;
    qr.p.forEach(pk=>{ const v=sg(R(src[pk])); dr[pk]=v; if(v) any=true; });
    if(qr.req || any) OS[qr.o] = { DateRange: dr };
  });

  j.ScheduleOS = OS;
}

  const OS = I3.ScheduleOS, io = OS.IncOthThanOwnRaceHorse||{};
  S.os = S.os || {};

/* ---- checks ------------------------------------------------------ */
function chkOs(){
  const out = [], C = S.C.os||{}, O = S.os||{};
  const D = C.ded||{};

  /* 3b depreciation only if rental income (1c) is offered */
  if(R(O.dDep)>0 && !(C.c1>0))
    out.push({lvl:"err", t:"Section 57 · depreciation", m:"Depreciation (3b) can be claimed only when rental income from machinery/plant/buildings is offered at 1c.", sec:"os"});

  /* 3c interest expenditure — only against dividend at 1a(i)/1a(ii), and ≤ 20% of it */
  const divForInt = (C.a1||{}).i + (C.a1||{}).ii;
  if(R(O.dIntClaimed)>0 && !(divForInt>0))
    out.push({lvl:"err", t:"Section 57 · interest expenditure", m:"Interest expenditure u/s 57(1) (3c) is available only when dividend income is offered at 1a(i) and/or 1a(ii).", sec:"os"});
  else if(R(O.dIntClaimed) > (D.eligInt||0))
    out.push({lvl:"warn", t:"Section 57 · interest expenditure", m:"Interest expenditure u/s 57(1) is restricted to 20% of the dividend income; only "+RS(D.eligInt||0)+" is eligible against "+RS(R(O.dIntClaimed))+" claimed.", sec:"os"});

  /* family-pension deduction cap */
  if(R(O.familyPension)>0 && (D.fpDed||0)===25000 && R(O.familyPension/3)>25000)
    out.push({lvl:"ok", t:"Family pension", m:"Deduction u/s 57(iia) capped at ₹25,000 (one-third of family pension exceeds the cap).", sec:"os"});

  /* 2f DTAA — NRI/TRC gate and applicable-rate note */
  (C.dtaaRows||[]).forEach((r,i)=>{
    if(os_isNRI() && r.amt>0 && r.trc!=="Y")
      out.push({lvl:"warn", t:"DTAA row "+(i+1), m:"You are a non-resident and no TRC is obtained for this row, so its "+RS(r.amt)+" is not counted in the 2f DTAA total (rules.json).", sec:"os"});
    if(r.amt>0 && r.treaty!=null && r.itact!=null && r.appl===0 && !(r.treaty===0))
      out.push({lvl:"warn", t:"DTAA row "+(i+1), m:"The applicable rate is the lower of the treaty rate and the Income-tax Act rate.", sec:"os"});
  });

  /* item-1 gift 56(2)(x) floored at nil */
  const d1=C.d1||{};
  if((d1.i+d1.ii+d1.iii+d1.iv+d1.v)<0)
    out.push({lvl:"warn", t:"Section 56(2)(x)", m:"The 56(2)(x) sub-lines sum below nil; item 1d is taken as nil.", sec:"os"});

  /* race-horse loss goes to CFL */
  if(R((C.horse||{}).bal)<0)
    out.push({lvl:"ok", t:"Race horses", m:"The race-horse balance (8e) is a loss of "+RS((C.horse||{}).bal)+"; it is carried to Schedule CFL 10xii and taken as nil at item 9.", sec:"os"});

  /* item-6 loss to CYLA */
  if(R(C.item6)<0)
    out.push({lvl:"ok", t:"Other sources loss", m:"Net income at normal rates (item 6) is a loss of "+RS(C.item6)+"; it is available for set-off in Schedule CYLA.", sec:"os"});

  return out;
}

/* =====================================================================
   ITR-3 · Section "other" — Other schedules (Sch 5A · PTI · ESOP)
   Books: books/ITR-3/Sch_5A.md, books/ITR-3/PTI.md, books/ITR-3/ESOP.md
   Schema blocks: Schedule5A2014, SchedulePTI, ScheduleESOP
   Compute order: 24 (after the income heads, before tax @ 90).

   REGIME (books/ITR-3/REGIME.md): none of these three schedules appears in
   the 115BAC closure list — Schedule 5A (apportionment disclosure), Schedule
   PTI (pass-through disclosure, income already carried by each head's own
   schedule) and Schedule ESOP (tax deferral, not an income concession) are
   unaffected by the new-vs-old regime. So this section carries NO regime-gated
   item: it renders and computes identically with isNew() true or false. The
   engine still guards every cross-read and reads isNew() only to keep the
   contract explicit.

   GTI CONTRIBUTION: all three are disclosures/tax-deferral — none independently
   adds to Gross Total Income (Sch 5A only apportions receipts already sitting
   in the person's own head schedules; PTI's net per head "reappears in that
   head's own schedule" per the book; ESOP is deferred *tax*, not income). So
   S.C.other.income = 0. ESOP's column-7 (tax that has fallen due this year) is
   exposed separately as S.C.other.esopTaxPayable for the tax section's
   Part B-TTI 8c roll-up.
   ===================================================================== */

/* ---- state ------------------------------------------------------- */
S.other = S.other || {
  /* Schedule 5A — single non-repeating spouse block (four heads) */
  s5a:{ name:"", pan:"", aadhaar:"", aud44ab:"", aud92e:"",
        hp:{inc:"",spouse:"",tds:"",tdsSp:""},
        bp:{inc:"",spouse:"",tds:"",tdsSp:""},
        cg:{inc:"",spouse:"",tds:"",tdsSp:""},
        os:{inc:"",spouse:"",tds:"",tdsSp:""} },
  /* Schedule PTI — repeatable, one object per business trust / investment fund */
  pti:[],
  /* Schedule ESOP — two header fields, six fixed year rows, one sale sub-table */
  esop:{ pan:"", dpiit:"", defer2627:"",
         yrs:{ "2021-22":{bf:"",sec:"",ceased:"",dtCease:""},
               "2022-23":{bf:"",sec:"",ceased:"",dtCease:""},
               "2023-24":{bf:"",sec:"",ceased:"",dtCease:""},
               "2024-25":{bf:"",sec:"",ceased:"",dtCease:""},
               "2025-26":{bf:"",sec:"",ceased:"",dtCease:""} },
         sales:[] }
};

/* SEED defaults for new repeatable rows (the shared shell add-handler keeps its
   own SEED map; these are harmless and document the empty-row shape). */
SEED.pti = SEED.pti || {};
SEED.sales = SEED.sales || {};

/* dropdown value lists — from books/ITR-3/enums.json where present, else the book */
const OTH_SECTYPE = [["FS","Fully Sold"],["PS","Partly Sold"],["NS","Not sold"]]; /* ScheduleESOP…SecurityType */
const OTH_CEASED  = [["Y","Yes"],["N","No"]];                                     /* ScheduleESOP…CeasedEmployee */
const OTH_YN      = [["Y","Yes"],["N","No"]];                                     /* Schedule5A2014 audit flags */
const OTH_SALEAY  = [["2021-22","2021-22"],["2022-23","2022-23"],["2023-24","2023-24"],
                     ["2024-25","2024-25"],["2025-26","2025-26"]];                /* sale sub-table AY (E18:E21) */
const OTH_PTIKIND = [["A","Section 115UA"],["B","Section 115UB"],["C","Section 115U"]]; /* InvstmntCvrdUs115UA115UB A/B/C (book) */
const OTH_ESOP_YRS = ["2021-22","2022-23","2023-24","2024-25","2025-26"];         /* the five active allotment years */
/* per-year schema object suffix and its TotalTaxAttributedAmt<nn> key (from --leaves) */
const OTH_ESOP_OBJ = {"2021-22":"2122","2022-23":"2223","2023-24":"2324","2024-25":"2425","2025-26":"2526"};
const OTH_ESOP_TTA = {"2021-22":"21","2022-23":"22","2023-24":"22","2024-25":"22","2025-26":"25"};

/* the Portuguese-Civil-Code master switch lives in Part A General (the "who"
   section), mirroring ITR-2's S.pi.s5a. Guarded read — if "who" is not built
   yet the card shows its "opens when Yes" note. */
const oth_s5a = ()=> (S.pi && S.pi.s5a) === "Yes";

/* ---- engine ------------------------------------------------------ */
function engOther(){
  S.other = S.other || {};
  const O = S.other;
  const C = S.C.other = { income:0 };
  isNew(); /* regime read — no closures apply to this section (see header) */

  /* ---------- Schedule 5A (book Sch_5A.md) ---------- */
  /* four heads HP/BP/CG/OS, each with (ii) receipts, (iii) spouse share,
     (iv) TDS deducted, (v) TDS apportioned. Total row = SUM of the four. */
  const s5 = O.s5a || {};
  const HEADS5A = ["hp","bp","cg","os"];
  const h5 = HEADS5A.map(h=>{const r=s5[h]||{};
    return {h, inc:R(r.inc), spouse:R(r.spouse), tds:Math.max(0,R(r.tds)), tdsSp:Math.max(0,R(r.tdsSp))};});
  const t5 = {inc:0,spouse:0,tds:0,tdsSp:0};
  h5.forEach(x=>{t5.inc+=x.inc; t5.spouse+=x.spouse; t5.tds+=x.tds; t5.tdsSp+=x.tdsSp;}); /* [I14][J14][K14][L14] */
  C.s5a = {heads:h5, tot:t5, on:oth_s5a()};

  /* ---------- Schedule PTI (book PTI.md) ---------- */
  /* each block: net = income − loss per leaf; CG/OS/exempt aggregate rows. */
  const leaf   = r => {r=r||{}; const inc=R(r.inc), loss=R(r.loss), tds=Math.max(0,R(r.tds));
                        return {inc, loss, net:inc-loss, tds};};        /* N=L−M */
  const leaf3  = r => {r=r||{}; const inc=R(r.inc), tds=Math.max(0,R(r.tds));
                        return {inc, net:inc, tds};};                    /* OS/exempt: no loss col */
  const add4   = (a,b)=>({inc:a.inc+b.inc, loss:a.loss+b.loss, net:a.net+b.net, tds:a.tds+b.tds});
  const add3   = (a,b)=>({inc:a.inc+b.inc, net:a.net+b.net, tds:a.tds+b.tds});
  C.pti = (O.pti||[]).map(b=>{
    b = b||{};
    const hp = leaf(b.hp);
    const st111a = leaf(b.st111a), stOth = leaf(b.stOth);
    const lt112a = leaf(b.lt112a), ltOth = leaf(b.ltOth);
    const stAgg = add4(st111a, stOth);      /* [L7]=L8+L9 … */
    const ltAgg = add4(lt112a, ltOth);      /* [L10]=L11+L12 … */
    const osDiv = leaf3(b.osDiv), osOth = leaf3(b.osOth);
    const osAgg = add3(osDiv, osOth);       /* [L13]=L14+L15, [N13]=N14+N15 */
    const ex23  = leaf3(b.ex23fbb);
    const exB   = {code:st0(b.exBcode), inc:R((b.exB||{}).inc), loss:R((b.exB||{}).loss),
                   tds:Math.max(0,R((b.exB||{}).tds))}; exB.net = exB.inc - exB.loss;
    const exC   = {code:st0(b.exCcode), inc:R((b.exC||{}).inc), loss:R((b.exC||{}).loss),
                   tds:Math.max(0,R((b.exC||{}).tds))}; exC.net = exC.inc - exC.loss;
    const exTot = {inc:ex23.inc+exB.inc+exC.inc, net:ex23.net+exB.net+exC.net,
                   tds:ex23.tds+exB.tds+exC.tds};                        /* [L16]=L17+L18+L19 */
    const hasVal = !!(st0(b.name)||st0(b.pan)|| hp.inc||hp.loss||stAgg.inc||ltAgg.inc||osAgg.inc||exTot.inc);
    return {kind:b.kind||"", name:st0(b.name), pan:st0(b.pan).toUpperCase(),
            hp, st111a, stOth, lt112a, ltOth, stAgg, ltAgg,
            osDiv, osOth, osAgg, ex23, exB, exC, exTot, hasVal};
  });

  /* ---------- Schedule ESOP (book ESOP.md) ---------- */
  const E = O.esop || {};
  const sales = (E.sales||[]);
  /* column 4(ii) H per year: SUMIF(sale rows tagged to this AY) unless fully
     sold or ceased employee (then the whole b/f falls due) */
  const esopYear = y => {
    const r = (E.yrs||{})[y] || {};
    const bf = R(r.bf);
    const sumSales = sales.filter(s=>s.ay===y).reduce((a,s)=>a+Math.max(0,R(s.amt)),0);
    /* [H8] IF(OR(FS, ceased Yes), TaxPrevAY, SUMIF(...)) */
    const h = (r.sec==="FS" || r.ceased==="Y") ? bf : sumSales;
    /* [L] column 7 */
    let l;
    if(y==="2021-22"){
      l = bf;                                   /* [L8] = TaxPrevAY — 48-month expiry falls due */
    } else {
      /* [L9] nested IF, in the book's order */
      if(r.sec==="FS")                     l = bf;            /* ceased Y or N & Fully Sold ⇒ F */
      else if(r.sec==="PS" && r.ceased==="Y") l = bf;         /* ceased Y & Partly Sold ⇒ F */
      else if(r.sec==="FS" || r.sec==="PS")   l = h;          /* remaining sold (PS & ceased N) ⇒ H */
      else if(r.sec==="NS" && r.ceased==="N") l = 0;          /* Not sold & ceased N ⇒ 0 */
      else                                    l = (h>0 ? h : bf); /* else (Not sold & ceased Y, or blank) */
    }
    const bal = Math.max(0, bf - l);            /* [M] = MAX(0, col3 − col7) */
    return {y, bf, h, l, bal, sumSales, sec:r.sec||"", ceased:r.ceased||"", dtCease:r.dtCease||""};
  };
  const esopRows = OTH_ESOP_YRS.map(esopYear);
  let esopDue = 0; esopRows.forEach(r=>{esopDue += r.l;});            /* Σ col 7 → Part B-TTI 8c */
  /* whole-schedule sum of tax attributed (TotalTaxAttributedAmt) */
  const esopSoldTotal = sales.reduce((a,s)=>a+Math.max(0,R(s.amt)),0);
  /* 2026-27 balance [M13] ties to Part B-TTI Gross Tax Payable (3b/8b). tax
     computes at order 90 (after this section), so read it guarded; a manual
     defer2627 override wins when the user supplies it. */
  const defer2627 = st0(E.defer2627)!=="" ? R(E.defer2627) : R((S.C.tax||{}).gross||0);
  C.esop = {rows:esopRows, due:R(esopDue), soldTotal:R(esopSoldTotal), defer2627:R(defer2627)};
  C.esopTaxPayable = R(esopDue);

  /* GTI contribution — disclosures only, nothing added here (see header) */
  C.income = 0;
}

/* ---- renderer ---------------------------------------------------- */
function secOther(){
  const O = S.other||{}, C = S.C.other||{};
  let h = "";

  /* ===== Schedule 5A ===== */
  {
    const A5 = C.s5a || {heads:[],tot:{}};
    const on = oth_s5a();
    let inner;
    if(!on){
      inner = note('Opens when "Are you governed by the Portuguese Civil Code under section 5A?" is answered Yes in <b>Who is filing</b> (Part A General). When No, Schedule 5A must not be filed (rule A14 equivalent).');
    } else {
      let b = "";
      b += row("Name of the Spouse", inp("other.s5a.name",{max:125}), {req:1, ref:"[D4]"});
      b += row("PAN of the Spouse", inp("other.s5a.pan",{max:10}), {req:1, ref:"[D5]"});
      b += row("Aadhaar of the spouse", inp("other.s5a.aadhaar",{max:12}), {ref:"[D6]"});
      b += row("Whether books of accounts of spouse is audited u/s 44AB or under any other provisions",
               sel("other.s5a.aud44ab", OTH_YN), {ref:"[D7]"});
      b += row("Whether your spouse is liable for audit u/s 92E (or a partner of a firm liable for audit u/s 92E)",
               sel("other.s5a.aud92e", OTH_YN), {ref:"[D8]"});
      /* the apportionment table — four heads + computed Total */
      const heads = [["hp","House Property"],["bp","Business or profession"],
                     ["cg","Capital Gains"],["os","Other Sources"]];
      let t = '<div class="full"><table class="gt" style="min-width:640px"><thead><tr>'+
        '<th class="l">Heads of Receipts (i)</th>'+
        '<th class="req">Receipts under the head (ii)</th>'+
        '<th class="req">Amount apportioned to spouse (iii)</th>'+
        '<th class="req">TDS deducted on (ii) (iv)</th>'+
        '<th class="req">TDS apportioned to spouse (v)</th></tr></thead><tbody>';
      heads.forEach(([k,lbl])=>{
        t += '<tr><td class="l">'+esc(lbl)+'</td>'+
          '<td>'+inp("other.s5a."+k+".inc",{n:1})+'</td>'+
          '<td>'+inp("other.s5a."+k+".spouse",{n:1})+'</td>'+
          '<td>'+inp("other.s5a."+k+".tds",{n:1})+'</td>'+
          '<td>'+inp("other.s5a."+k+".tdsSp",{n:1})+'</td></tr>';
      });
      const T = A5.tot||{};
      t += '<tr><td class="l"><b>Total (1+2+3+4)</b></td>'+
        '<td class="num">'+cell(T.inc)+'</td><td class="num">'+cell(T.spouse)+'</td>'+
        '<td class="num">'+cell(T.tds)+'</td><td class="num">'+cell(T.tdsSp)+'</td></tr>';
      t += '</tbody></table></div>';
      b += t;
      b += note("Column (ii) is the whole receipt under the head; column (iii) is the spouse's half. Salary is not apportioned. TDS in column (v) is credited to the spouse (Schedule TDS, with the spouse's PAN).");
      inner = b;
    }
    h += card("s5a","Schedule 5A — Apportionment of receipts between spouses (Portuguese Civil Code, section 5A)",
              (on?RS((A5.tot||{}).spouse||0):""), inner);
  }

  /* ===== Schedule PTI ===== */
  {
    let b = note("Pass-through income from a business trust (REIT/InvIT), investment fund (AIF I/II) or venture capital fund/company under sections 115U / 115UA / 115UB. Each head's net reappears in that head's own schedule (HP item 2, OS Sl.10 dividend, SI special rates); TDS in column (10) flows to Schedule TDS.");
    const blocks = C.pti || [];
    (O.pti||[]).forEach((raw,i)=>{
      const cb = blocks[i] || {};
      const pre = "other.pti."+i+".";
      const title = "Trust / fund " + (i+1) + (st0(raw.name)?" — "+esc(st0(raw.name)):"");
      let inner = "";
      inner += row("Investment covered by section", sel(pre+"kind", OTH_PTIKIND), {req:1, ref:"(2)"});
      inner += row("Name of business trust / investment fund", inp(pre+"name",{max:125}), {req:1, ref:"(3)"});
      inner += row("PAN of business trust / investment fund", inp(pre+"pan",{max:10}), {req:1, ref:"(4)"});
      /* body table: head | income (7) | loss (8) | net (9) | TDS (10) */
      const money4 = (k,lbl,ind)=> '<tr><td class="l"'+(ind?' style="padding-left:'+ind+'px"':'')+'>'+esc(lbl)+'</td>'+
        '<td>'+inp(pre+k+".inc",{n:1})+'</td><td>'+inp(pre+k+".loss",{n:1})+'</td>'+
        '<td class="num">'+cell((cb[k]||{}).net)+'</td><td>'+inp(pre+k+".tds",{n:1})+'</td></tr>';
      const money3 = (k,lbl,ind)=> '<tr><td class="l"'+(ind?' style="padding-left:'+ind+'px"':'')+'>'+esc(lbl)+'</td>'+
        '<td>'+inp(pre+k+".inc",{n:1})+'</td><td class="num">'+cell(0)+'</td>'+

/* ---- checks ------------------------------------------------------ */
function chkOther(){
  const out = [], C = S.C.other||{}, O = S.other||{};

  /* Schedule 5A — mandatory when governed by Portuguese Civil Code (rule A6 eq.),
     must not be filed otherwise (rule A14 eq.) */
  if(oth_s5a()){
    const T = (C.s5a||{}).tot||{};
    if(!(T.inc||T.spouse||T.tds||T.tdsSp))
      out.push({lvl:"err", t:"Schedule 5A", m:"Governed by the Portuguese Civil Code is Yes, so Schedule 5A must carry the apportionment of receipts between the spouses.", sec:"other"});
    const X = O.s5a||{};
    if(!PAN_RE.test(st0(X.pan).toUpperCase()))
      out.push({lvl:"err", t:"Schedule 5A", m:"The spouse's PAN is required and must be a valid PAN.", sec:"other"});
  } else if(O.s5a && st0(O.s5a.name)){
    out.push({lvl:"warn", t:"Schedule 5A", m:"Spouse details are filled, but the Portuguese Civil Code answer is not Yes — Schedule 5A will not be written (rule A14 equivalent).", sec:"other"});
  }

  /* Schedule PTI — required header fields when a block carries a value */
  (C.pti||[]).forEach((b,i)=>{
    if(!b.hasVal) return;
    if(!st0(b.name) || !PAN_RE.test(b.pan) || !st0(b.kind))
      out.push({lvl:"err", t:"Schedule PTI", m:"Block "+(i+1)+": the section covered, name and a valid PAN of the trust/fund are mandatory.", sec:"other"});
  });

  /* Schedule ESOP — rule-document checks */
  (((C.esop||{}).rows)||[]).forEach(r=>{
    /* balance = col3 − col7 (computed, so always holds); the ties below are the warnings */
    if(r.bf>0 && !st0(r.sec) && !st0(r.ceased))
      out.push({lvl:"warn", t:"Schedule ESOP", m:r.y+": tax is deferred but no event (sold / ceased / 48-month) is answered — column 7 has been taken as the whole b/f.", sec:"other"});
    if(r.sec==="NS" && r.ceased==="N" && r.l!==0)
      out.push({lvl:"warn", t:"Schedule ESOP", m:r.y+": Not sold and not ceased — tax payable this year should be zero.", sec:"other"});
  });
  const CE = C.esop||{};
  if(st0((O.esop||{}).pan) && !PAN_RE.test(st0(O.esop.pan).toUpperCase()))
    out.push({lvl:"err", t:"Schedule ESOP", m:"The employer (start-up) PAN is not a valid PAN.", sec:"other"});
  if(st0((O.esop||{}).defer2627)==="")
    ; /* 2026-27 balance ties to Part B-TTI 3b/8b — resolved by the tax section */

  return out;
}

const TDS2_HEADS=[["HP","House property"],["BP","Business & profession"],["CG","Capital gains"],["OS","Other sources"],["EI","Exempt income"],["NA","Not applicable (194N)"]];
const TDS3_HEADS=TDS2_HEADS.slice(0,5);
/* head-of-income pre-fill from the section (a convenience default from the
   book's own section meanings; editable; not a tax figure) */
const TDS_HEAD_OF3={"4-IA":"HP","4-IB":"HP","4IA":"HP","4IB":"HP","4IC":"HP","4IA_S":"CG",
  "4LA":"CG","94S":"CG","94S-P":"CG",
  "193":"OS","194":"OS","94A":"OS","94B":"OS","94BA":"OS","4BB":"OS","94B-P":"OS","94BA-P":"OS",
  "4DA":"OS","4EE":"OS","94K":"OS","4LB":"OS","4LD":"OS","4BA1":"OS","4BA2":"OS","LBA1":"OS",
  "LBA2":"OS","LBA3":"OS","LBB":"OS","LBC":"OS","96A":"OS","96B":"OS","96C":"OS","96D":"OS","96DA":"OS",
  "94C":"BP","94D":"BP","4F":"OS","4G":"OS","4H":"BP","94J-A":"BP","94J-B":"BP","94M":"BP","94O":"BP",
  "94Q":"BP","94R":"BP","94R-P":"BP","94T":"BP","192A":"OS","94E":"OS","195":"OS"};

/* ---- engine ------------------------------------------------------- */
function engPaid(){
  const P={income:0};

  /* TDS 1 (17B) — G13=SUM(IncChrgSal), H13=SUM(TotalTDSSal)=TotalTDSonSalaries */
  const t1  =(S.paid.tds1||[]).reduce((a,r)=>a+N(r.tds),0);
  const t1in=(S.paid.tds1||[]).reduce((a,r)=>a+N(r.inc),0);

  /* TDS 2 (17C1) / TDS 3 (18C2) — per-row carried forward:
     W23=MAX(0, bf + dedOwn + dedOthTDS − claimOwn − claimOthTDS)  (TDS 2)
     X38=MAX(0, bf + dedOwn + dedOthTDS − claimOwn − claimOthTDS)  (TDS 3, same shape) */
  const rowCF=rows=>(rows||[]).forEach(r=>{
    const avail=N(r.bf)+N(r.dedOwn)+N(r.dedOthTds);
    const claimed=N(r.claimOwn)+N(r.claimOthTds);
    r._avail=avail; r._claimed=claimed; r._cf=Math.max(0,avail-claimed); r._over=claimed>avail;});
  rowCF(S.paid.tds2); rowCF(S.paid.tds3);
  const t2=(S.paid.tds2||[]).reduce((a,r)=>a+N(r.claimOwn),0); /* P28=SUM(TaxClaimedOwnHands) */
  const t3=(S.paid.tds3||[]).reduce((a,r)=>a+N(r.claimOwn),0); /* Q43=SUM(TaxClaimedOwnHands) */

  /* Schedule TCS (15C) — per-row carried forward:
     O67=MAX(0, bf + collOwn + collOth − claimOwn − claimOth) */
  (S.paid.tcs||[]).forEach(r=>{
    const avail=N(r.bf)+N(r.collOwn)+N(r.collOth);
    const claimed=N(r.claimOwn)+N(r.claimOth);
    r._avail=avail; r._claimed=claimed; r._cf=Math.max(0,avail-claimed); r._over=claimed>avail;});
  const tcs=(S.paid.tcs||[]).reduce((a,r)=>a+N(r.claimOwn),0); /* L73=SUM(7i own hands) */

  /* Schedule IT (17A) — advance vs self-assessment split by deposit date.
     The sheet's helper (T7/FormulaOFS): T7<2 ⇒ advance, T7>=2 ⇒ self-assessment,
     i.e. a challan on or before 31 Mar 2026 (YREND) is advance tax [T31=SUMIF(<2)],
     one on or after 1 Apr 2026 is self-assessment tax [R31=SUMIF(>=2)].
     Advance total → Part B-TTI 10a; self-assessment total → 10d (row-18 note). */
  const isSAT=c=>{const d=D(c.dt);return d?d>YREND:false;};
  const challans=(S.paid.it||[]).map(c=>({amt:R(N(c.amt)),dt:c.dt,sat:isSAT(c),valid:!!D(c.dt)}));
  const adv=challans.filter(c=>!c.sat).reduce((a,c)=>a+c.amt,0);
  const sat=challans.filter(c=> c.sat).reduce((a,c)=>a+c.amt,0);

  P.t1=R(t1); P.t1in=R(t1in); P.t2=R(t2); P.t3=R(t3);
  P.tds=R(t1+t2+t3);                 /* 10b = TDS1 col5 + TDS2 col9 + TDS3 col9 */
  P.tcs=R(tcs);                      /* 10c = TCS col 7i */
  P.adv=R(adv); P.sat=R(sat); P.itTotal=R(adv+sat); /* TotalTaxPayments */
  P.paid=R(adv+t1+t2+t3+tcs+sat);
  P.challans=challans;
  P.income=0;                        /* taxes paid contribute nothing to GTI */
  S.C.paid=P;
}

}

/* ---- export ------------------------------------------------------- */
function expPaid(j){
  const P=S.C.paid||{};

  /* ScheduleTDS1 — TotalTDSonSalaries present even at zero */
  const t1=(S.paid.tds1||[]).filter(r=>N(r.tds)&&TAN_RE.test(st0(r.tan).toUpperCase()));
  j.ScheduleTDS1={TotalTDSonSalaries:n0(P.t1)};
  if(t1.length)j.ScheduleTDS1.TDSonSalary=t1.map(r=>({
    EmployerOrDeductorOrCollectDetl:{TAN:st0(r.tan).toUpperCase(),
      EmployerOrDeductorOrCollecterName:(sv(r.name)||"NA").slice(0,125)},
    IncChrgSal:n0(r.inc),TotalTDSSal:n0(r.tds)}));

  /* the shared TDS 2 / TDS 3 credit row */
  const tdsRow=(r,buyer)=>{
    const o={TDSCreditName:r.who==="O"?"O":"S"};
    if(r.who==="O"){
      if(PAN_RE.test(st0(r.othPan).toUpperCase()))o.PANofOtherPerson=st0(r.othPan).toUpperCase();
      if(AADH.test(st0(r.othAadh)))o.AadhaarOfOtherPerson=st0(r.othAadh);}
    if(buyer){
      o.PANOfBuyerTenant=PAN_RE.test(st0(r.pan).toUpperCase())?st0(r.pan).toUpperCase():"AAAAA0000A";
      if(AADH.test(st0(r.aadh)))o.AadhaarOfBuyerTenant=st0(r.aadh);}
    else o.TANOfDeductor=st0(r.tan).toUpperCase();
    o.TDSSection=TDSSEC_CODES.indexOf(st0(r.sec))>=0?st0(r.sec):"94A";
    if(N(r.bf)&&DEDYR_PAID.indexOf(st0(r.yr))>=0){o.DeductedYr=parseInt(r.yr,10);o.BroughtFwdTDSAmt=n0(r.bf);}
    const c={TaxClaimedOwnHands:n0(r.claimOwn)};
    if(N(r.dedOwn))c.TaxDeductedOwnHands=n0(r.dedOwn);
    if(N(r.dedOthInc))c.TaxDeductedIncome=n0(r.dedOthInc);
    if(N(r.dedOthTds))c.TaxDeductedTDS=n0(r.dedOthTds);
    if(N(r.claimOthInc))c.TaxClaimedIncome=n0(r.claimOthInc);
    if(N(r.claimOthTds))c.TaxClaimedTDS=n0(r.claimOthTds);
    if(PAN_RE.test(st0(r.claimOthPan).toUpperCase()))c.TaxClaimedSpouseOthPrsnPAN=st0(r.claimOthPan).toUpperCase();
    if(AADH.test(st0(r.claimOthAadh)))c.SpouseOthPrsnAadhaar=st0(r.claimOthAadh);
    o.TaxDeductCreditDtls=c;
    if(N(r.gross))o.GrossAmount=n0(r.gross);
    const heads=buyer?TDS3_HEADS:TDS2_HEADS;
    let hd=st0(r.head)||TDS_HEAD_OF3[r.sec]||(buyer?"OS":"NA");
    if(!heads.some(x=>x[0]===hd))hd=buyer?"OS":"NA";
    o.HeadOfIncome=hd;
    o.AmtCarriedFwd=n0(r._cf||0);
    return o;};

  /* ScheduleTDS2 — TotalTDSonOthThanSals present even at zero */
  const t2=(S.paid.tds2||[]).filter(r=>(N(r.claimOwn)||N(r.dedOwn)||N(r.bf))&&TAN_RE.test(st0(r.tan).toUpperCase()));
  j.ScheduleTDS2={TotalTDSonOthThanSals:n0(P.t2)};
  if(t2.length)j.ScheduleTDS2.TDSOthThanSalaryDtls=t2.map(r=>tdsRow(r,false));

  /* ScheduleTDS3 — TotalTDS3OnOthThanSal present even at zero */
  const t3=(S.paid.tds3||[]).filter(r=>N(r.claimOwn)||N(r.dedOwn)||N(r.bf));
  j.ScheduleTDS3={TotalTDS3OnOthThanSal:n0(P.t3)};
  if(t3.length)j.ScheduleTDS3.TDS3onOthThanSalDtls=t3.map(r=>tdsRow(r,true));

  /* ScheduleTCS — TotalSchTCS present even at zero */
  const tc=(S.paid.tcs||[]).filter(r=>(N(r.claimOwn)||N(r.collOwn)||N(r.bf))&&st0(r.tan));
  j.ScheduleTCS={TotalSchTCS:n0(P.tcs)};
  if(tc.length)j.ScheduleTCS.TCS=tc.map(r=>{
    const o={TCSCreditOwner:r.who==="2"?"2":"1",EmployerOrDeductorOrCollectTAN:st0(r.tan).toUpperCase().slice(0,10)};
    if(r.who==="2"&&PAN_RE.test(st0(r.othPan).toUpperCase()))o.PANOfSpouseOrOthrPrsn=st0(r.othPan).toUpperCase();
    if(N(r.bf)&&DEDYR_PAID.indexOf(st0(r.yr))>=0){o.DeductedYr=parseInt(r.yr,10);o.BroughtFwdTDSAmt=n0(r.bf);}
    o.TCSCurrFYDtls={TCSAmtCollOwnHand:n0(r.collOwn),TCSAmtCollSpouseOrOthrHand:n0(r.collOth)};
    const cl={TCSAmtCollOwnHand:n0(r.claimOwn)};
    if(N(r.claimOth)||PAN_RE.test(st0(r.claimOthPan).toUpperCase())){
      const oth={TCSAmtCollSpouseOrOthrHand:n0(r.claimOth)};
      if(PAN_RE.test(st0(r.claimOthPan).toUpperCase()))oth.PANOfSpouseOrOthrPrsn=st0(r.claimOthPan).toUpperCase();
      cl.TCSAmtCollOthrHands=oth;}
    o.TCSClaimedThisYearDtls=cl;
    o.AmtCarriedFwd=n0(r._cf||0);
    return o;});

  /* ScheduleIT — TotalTaxPayments present even at zero; DateDep as YYYY-MM-DD */
  const ch=(S.paid.it||[]).filter(c=>N(c.amt)&&BSR.test(st0(c.bsr).toUpperCase())&&ISO(c.dt)&&/^\d{1,5}$/.test(st0(c.sn)));
  j.ScheduleIT={TotalTaxPayments:n0(P.itTotal)};
  if(ch.length)j.ScheduleIT.TaxPayment=ch.map(c=>({BSRCode:st0(c.bsr).toUpperCase(),
    DateDep:ISO(c.dt),SrlNoOfChaln:parseInt(c.sn,10),Amt:n0(c.amt)}));
}

/* ---- import (inverse) --------------------------------------------- */
function impPaid(I3){
  const read=[]; const g=(o,p)=>p.split(".").reduce((t,k)=>t==null?undefined:t[k],o);
  if(I3.ScheduleTDS1){
    S.paid.tds1=(I3.ScheduleTDS1.TDSonSalary||[]).map(r=>({
      tan:g(r,"EmployerOrDeductorOrCollectDetl.TAN")||"",
      name:g(r,"EmployerOrDeductorOrCollectDetl.EmployerOrDeductorOrCollecterName")||"",
      inc:nz(r.IncChrgSal),tds:nz(r.TotalTDSSal)}));
    read.push("TDS on salary");}
  const back=(r,buyer)=>{const c=r.TaxDeductCreditDtls||{};return {
    who:r.TDSCreditName||"S",othPan:r.PANofOtherPerson||"",othAadh:r.AadhaarOfOtherPerson||"",
    tan:r.TANOfDeductor||"",pan:r.PANOfBuyerTenant||"",aadh:r.AadhaarOfBuyerTenant||"",
    sec:r.TDSSection||"",yr:nz(r.DeductedYr)+"",bf:nz(r.BroughtFwdTDSAmt),
    dedOwn:nz(c.TaxDeductedOwnHands),dedOthInc:nz(c.TaxDeductedIncome),dedOthTds:nz(c.TaxDeductedTDS),
    claimOwn:nz(c.TaxClaimedOwnHands),claimOthInc:nz(c.TaxClaimedIncome),claimOthTds:nz(c.TaxClaimedTDS),
    claimOthPan:c.TaxClaimedSpouseOthPrsnPAN||"",claimOthAadh:c.SpouseOthPrsnAadhaar||"",
    gross:nz(r.GrossAmount),head:r.HeadOfIncome||""};};
  if(I3.ScheduleTDS2){S.paid.tds2=(I3.ScheduleTDS2.TDSOthThanSalaryDtls||[]).map(r=>back(r,false));read.push("TDS 2 (other than salary)");}
  if(I3.ScheduleTDS3){S.paid.tds3=(I3.ScheduleTDS3.TDS3onOthThanSalDtls||[]).map(r=>back(r,true));read.push("TDS 3 (16B/16C/16D/16E)");}
  if(I3.ScheduleTCS){S.paid.tcs=(I3.ScheduleTCS.TCS||[]).map(r=>({
    who:r.TCSCreditOwner||"1",tan:r.EmployerOrDeductorOrCollectTAN||"",othPan:r.PANOfSpouseOrOthrPrsn||"",
    yr:nz(r.DeductedYr)+"",bf:nz(r.BroughtFwdTDSAmt),
    collOwn:nz(g(r,"TCSCurrFYDtls.TCSAmtCollOwnHand")),collOth:nz(g(r,"TCSCurrFYDtls.TCSAmtCollSpouseOrOthrHand")),
    claimOwn:nz(g(r,"TCSClaimedThisYearDtls.TCSAmtCollOwnHand")),
    claimOth:nz(g(r,"TCSClaimedThisYearDtls.TCSAmtCollOthrHands.TCSAmtCollSpouseOrOthrHand")),
    claimOthPan:g(r,"TCSClaimedThisYearDtls.TCSAmtCollOthrHands.PANOfSpouseOrOthrPrsn")||""}));
    read.push("Schedule TCS");}
  if(I3.ScheduleIT){S.paid.it=(I3.ScheduleIT.TaxPayment||[]).map(c=>({
    bsr:c.BSRCode||"",dt:dmy(c.DateDep),sn:c.SrlNoOfChaln!=null?String(c.SrlNoOfChaln):"",amt:nz(c.Amt)}));
    read.push("advance / self-assessment tax");}
  return read;
}

/* ---- checks (regime-aware; taxes-paid has no regime closures) ------ */
function chkPaid(){
  const out=[]; engPaid(); /* ensure row helpers set even if called stand-alone */
  const needYr=(rows,lbl)=>(rows||[]).forEach((r,i)=>{
    if(N(r.bf)>0 && DEDYR_PAID.indexOf(st0(r.yr))<0)
      out.push({lvl:"err",t:lbl+" row "+(i+1),m:"Unclaimed TDS brought forward is claimed but the financial year of deduction is not given.",sec:"paid"});});
  needYr(S.paid.tds2,"TDS 2"); needYr(S.paid.tds3,"TDS 3");
  const needOth=(rows,lbl,code)=>(rows||[]).forEach((r,i)=>{
    if(st0(r.who)===code && !(PAN_RE.test(st0(r.othPan).toUpperCase())||AADH.test(st0(r.othAadh))))
      out.push({lvl:"err",t:lbl+" row "+(i+1),m:"Credit relates to another person — give that person’s PAN or Aadhaar.",sec:"paid"});});
  needOth(S.paid.tds2,"TDS 2","O"); needOth(S.paid.tds3,"TDS 3","O");
  (S.paid.tcs||[]).forEach((r,i)=>{
    if(N(r.bf)>0 && DEDYR_PAID.indexOf(st0(r.yr))<0)
      out.push({lvl:"warn",t:"TCS row "+(i+1),m:"TCS brought forward is claimed but the year of collection is not given.",sec:"paid"});

    out.push({lvl:"warn",t:lbl+" row "+(i+1)+" over-claimed",m:"Claimed "+RS(r._claimed)+" exceeds the "+RS(r._avail)+" deducted and brought forward; carry-forward is held at zero.",sec:"paid"});});
  over(S.paid.tds2,"TDS 2"); over(S.paid.tds3,"TDS 3"); over(S.paid.tcs,"TCS");
  (S.paid.it||[]).forEach((c,i)=>{
    if(N(c.amt)&&!D(c.dt))
      out.push({lvl:"warn",t:"Challan "+(i+1),m:"An amount is entered but the date of deposit is missing or not DD/MM/YYYY — advance vs self-assessment cannot be decided.",sec:"paid"});
    if(N(c.amt)&&!BSR.test(st0(c.bsr).toUpperCase()))
      out.push({lvl:"warn",t:"Challan "+(i+1),m:"BSR code should be 7 characters.",sec:"paid"});});
  const P=S.C.paid||{};
  if(P.paid>0)out.push({lvl:"ok",t:"Taxes paid",m:RS(P.paid)+" total — advance "+RS(P.adv)+", TDS "+RS(P.tds)+", TCS "+RS(P.tcs)+", self-assessment "+RS(P.sat)+".",sec:"paid"});
  return out;
}

/* =====================================================================

function engRet(){
  const A={income:0};                         /* contribution to GTI = 0 */

  A.regime  = A.optOld?"Old":"New";
  A.hasBP   = (S.fs.incBP==="Y");             /* A19(b) — business/profession income */
  /* Form 10-IEA is the sticky opt-out mechanism, and is REQUIRED to opt out
     of the new regime only when there is business/profession income
     (REGIME.md · A45). A person without BP income opts in the return itself. */
  A.need10IEA = A.optOld && A.hasBP;
  S.C.ret=A;
}

/* =====================================================================
   New-vs-Old comparison — compute the whole return both ways.
   Reads other heads' compute output defensively; never throws.
   (REGIME.md: "the ret section shows the both-ways comparison".)
   ===================================================================== */
function retCompare(){
  if(typeof compute!=="function" || S._retCmp) return null;
  S._retCmp=1;
  const keep=S.fs.optout;
  const pick=()=>({ via:((S.C.ded||{}).allowed||(S.C.via||{}).allowed||0),
                    ti:(S.C.ti||0),
                    tax:(((S.C.int||{}).net!=null?(S.C.int||{}).net:((S.C.tax||{}).gross||0))||0) });
  let a={via:0,ti:0,tax:0}, b={via:0,ti:0,tax:0};
  try{ S.fs.optout="No";  compute(); a=pick(); }catch(e){}
  try{ S.fs.optout="Yes"; compute(); b=pick(); }catch(e){}
  S.fs.optout=keep; try{ compute(); }catch(e){}
  S._retCmp=0;
  return {a,b};
}
function regimeTable(){
  const c=retCompare();
  if(!c) return note("The New-vs-Old comparison appears once the income and tax "+
    "sections are computed.");
  const a=c.a,b=c.b,gap=Math.abs(R(a.tax)-R(b.tax)),better=R(a.tax)<=R(b.tax)?"new":"old";
  let h='<div class="full"><table class="gt" style="min-width:640px"><thead><tr>'+
    '<th class="l">Regime</th><th style="width:170px">Chapter VI-A allowed</th>'+
    '<th style="width:150px">Total income</th><th style="width:150px">Tax after credit</th>'+
    '</tr></thead><tbody>'+
    '<tr><td class="l">New — section 115BAC(1A)</td><td class="num">'+cell(a.via)+
      '</td><td class="num">'+cell(a.ti)+'</td><td class="num">'+cell(a.tax)+'</td></tr>'+
    '<tr><td class="l">Old</td><td class="num">'+cell(b.via)+'</td><td class="num">'+
      cell(b.ti)+'</td><td class="num">'+cell(b.tax)+'</td></tr></tbody></table></div>';
  h+=(gap?note("On the figures entered so far the <b>"+better+" regime costs "+RS(gap)+
      " less</b>. A business filer opts out of the new regime only through Form 10-IEA — "+
      "settle it before filing.")
        :note("On the figures entered so far the two regimes come to the same tax."));
  return h;
}

    h+=row("c · Have the accounts been audited by an accountant?",sel("aud.acctFlg",YN),{ind:1,ref:"F161"});
    if(S.aud.acctFlg==="Y"){
      h+=row("Date of furnishing of the audit report",dte("aud.repDate"),{ind:1,req:1,ref:"G162",hint:"cannot be after today"});
      h+=row("Acknowledgement number of the audit report",inp("aud.repAck",{max:15}),{ind:1,req:1,ref:"N163"});
      h+=row("Name of the auditor (proprietorship / firm)",inp("aud.frmName"),{ind:1,req:1,ref:"G166"});

      h+=row("Aadhaar of the proprietorship",inp("aud.frmAadhaar",{max:12}),{ind:1,ref:"G169"});
    }
  }
  h+=row("d(i) · Are you liable for audit u/s 92E?",sel("aud.sec92E",YN,{blank:false}),{req:1,ref:"F173"});
  if(S.aud.sec92E==="Y"){
    h+=row("d(ii) · Have the accounts been audited u/s 92E?",sel("aud.acct92E",YN,{blank:false}),{ind:1,req:1,ref:"W173"});
    if(S.aud.acct92E==="Y"){

      {k:"ack",h:"Acknowledgement number",t:"txt",w:"180px",max:15}],
      S.aud.oth||[],{min:"640px",empty:"No other audit report.",add:"Add an audit report"}));
  h+=fold("audact","Other Act","Audits under an Act other than the Income-tax Act",
    (S.aud.act||[]).length?(S.aud.act||[]).length+" rows":"if any",

      {k:"act",h:"Act",t:"sel",w:"320px",req:1,opts:AUD_ACT},

  h+=note("Codes are the department's NatureOfBusiness list (357 entries); enter the five-digit code as it appears in the utility.");
