<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YUKTI Tax Compliance — ITR-2, A.Y. 2026-27</title>
<style>
:root{
  --maroon:#7A1F2B; --maroon-d:#5C1720; --maroon-w:#F6EBEC;
  --white:#FFFFFF; --bone:#F5F4F1; --rule:#DCDCD6; --rule-2:#EDEBE6;
  --ink:#16161A; --ink-2:#4A4A52; --ink-3:#7C7C86;
  --red:#C0392B; --green:#1C5D4A; --green-w:#E9F1EE;
  --sienna:#9C4A15; --sienna-w:#FAEFE6;
  --field:#FFFEF9; --field-b:#C9C3AD; --closed:#F0EFEB;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"SF Mono",Consolas,"DejaVu Sans Mono",monospace;
  --rail:268px; --top:52px; --band:54px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bone);color:var(--ink);font:13.5px/1.45 var(--sans);
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--maroon);outline-offset:1px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* masthead — three things and nothing else */
.top{position:fixed;inset:0 0 auto 0;height:var(--top);z-index:60;background:var(--maroon);
  color:#fff;display:flex;align-items:center;gap:26px;padding:0 20px;
  border-bottom:2px solid var(--maroon-d)}
.top .b{font:600 19px/1 var(--serif);letter-spacing:.3px;white-space:nowrap}
.top .b em{font-style:normal;opacity:.64;font-size:12.5px;font-family:var(--sans);
  font-weight:400;margin-left:9px}
.top .frm{font:600 17px/1 var(--serif)}
.top .y{font-size:13px;opacity:.76;white-space:nowrap}
.top .sp{flex:1}
.tbtn{height:28px;padding:0 13px;white-space:nowrap;border:1px solid rgba(255,255,255,.42);border-radius:3px;
  font-size:12.5px;font-weight:500}
.tbtn:hover{background:rgba(255,255,255,.14)}
.tbtn.solid{background:#fff;color:var(--maroon);border-color:#fff;font-weight:600}
.tbtn.solid:hover{background:#F0E2E4}

/* index rail */
.rail{position:fixed;top:var(--top);bottom:var(--band);left:0;width:var(--rail);z-index:40;
  background:var(--bone);border-right:1px solid var(--rule);overflow-y:auto;padding:10px 0 20px}
.rail h2{font:500 10.5px/1 var(--sans);color:var(--ink-3);letter-spacing:.7px;padding:9px 18px 8px}
.nv{display:block;width:100%;text-align:left;padding:8px 16px 8px 15px;
  border-left:3px solid transparent;position:relative}
.nv:hover{background:#ECEAE5}
.nv.on{background:var(--white);border-left-color:var(--maroon)}
.nv .t{display:block;font:600 13.5px/1.25 var(--serif)}
.nv.on .t{color:var(--maroon)}
.nv .s{display:block;font-size:11px;color:var(--ink-3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nv .s.done{color:var(--green)} .nv .s.bad{color:var(--red);font-weight:600}

/* the sheet */
.wrap{position:absolute;top:var(--top);left:var(--rail);right:0;bottom:var(--band);
  overflow-y:auto;background:var(--bone)}
.sheet{max-width:1080px;margin:0 auto;padding:22px 26px 70px}

/* a section: maroon bar that opens and shuts */
section{background:var(--white);border:1px solid var(--rule);border-radius:3px;
  margin:0 0 14px;overflow:hidden;scroll-margin-top:14px}
.bar{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--maroon);color:#fff;padding:10px 14px}
.bar:hover{background:#8B2532}
.bar .cv{width:17px;height:17px;flex:none;border:1px solid rgba(255,255,255,.5);
  border-radius:2px;font-size:12px;line-height:15px;text-align:center}
.bar .t{font:600 15px/1.2 var(--serif);flex:1}
.bar .r{font-size:11.5px;opacity:.72;flex:none}
.bar .v{font:600 14px/1 var(--mono);flex:none;margin-left:14px}
.body{display:none;padding:4px 0 10px}
.body.open{display:block}

/* rows */
.r{display:flex;align-items:center;min-height:33px;border-bottom:1px solid var(--rule-2);
  padding:0 14px;gap:9px}
.r:hover{background:#FBFAF8}
.r.sub{background:#F7F6F3;min-height:28px}
.r.sub .l{font-weight:600;font-size:12px;color:var(--ink-2)}
.r.tot{border-top:1px solid var(--ink);border-bottom:2px solid var(--ink);background:#F7F6F3}
.r.tot .l,.r.tot .v{font-weight:700}
.r.grand{background:var(--maroon-w);border-top:1px solid var(--maroon);
  border-bottom:2px solid var(--maroon)}
.r.grand .l,.r.grand .v{font-weight:700;color:var(--maroon-d)}
.r.closed{background:var(--closed);opacity:.72}
.l{flex:1;min-width:0;padding:5px 0;font-size:13.5px}
.l.req{color:var(--red);font-weight:600}
.l .i1{padding-left:20px;display:inline-block}
.l .hint{color:var(--ink-3);font-size:11px;font-weight:400;margin-left:7px}
.ref{flex:none;width:52px;font-size:11px;color:var(--ink-3);font-family:var(--serif)}
.v{flex:none;width:160px;text-align:right}
.v2{flex:none;width:150px;text-align:right}
.hd2{font-size:10.5px;color:var(--ink-3);font-weight:600}

/* fields */
.f{width:100%;height:27px;padding:0 7px;border:1px solid var(--field-b);border-radius:2px;
  background:var(--field);font-size:13.5px}
.f:focus{border-color:var(--maroon);background:#fff}
.f.n{text-align:right;font-family:var(--mono);font-size:13px}
.f.over{background:var(--sienna-w);border-color:#D8B492;color:var(--sienna)}
.f[disabled]{background:var(--closed);color:var(--ink-3);cursor:not-allowed}
select.f{padding:0 4px;cursor:pointer}
.c{display:block;font-family:var(--mono);font-size:13px;color:var(--green);
  padding:5px 7px 5px 0;font-weight:600}
.c.zero{color:#B4B4BB;font-weight:400} .c.neg{color:var(--red)}
.dt{font-size:10.5px;color:var(--ink-3);display:block;text-align:right;margin-top:1px}

/* optional card */
.card{margin:8px 14px;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.card .ch{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 12px;background:#FAF9F6}
.card .ch:hover{background:#F3F1EC}
.card.on .ch{background:var(--maroon-w);border-bottom:1px solid var(--rule)}
.card .ch .sw{width:34px;height:18px;flex:none;border-radius:9px;background:#CFCCC4;
  position:relative;transition:background .12s}
.card.on .ch .sw{background:var(--maroon)}
.card .ch .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;
  border-radius:50%;background:#fff;transition:left .12s}
.card.on .ch .sw::after{left:18px}
.card .ch .t{flex:1;font:600 13px/1.2 var(--serif)}
.card .ch .st{font-size:11.5px;color:var(--ink-3);flex:none}
.card.on .ch .st{color:var(--maroon-d);font-weight:600;font-family:var(--mono)}
.card .cb{display:none;padding:4px 0 8px} .card.on .cb{display:block}

/* tables */
.gt{width:100%;border-collapse:collapse;margin:4px 0}
.gt th{font-size:10.5px;font-weight:600;color:var(--ink-2);text-align:right;padding:6px 7px;
  border-bottom:1px solid var(--ink);white-space:nowrap}
.gt th.l,.gt td.l{text-align:left}
.gt th.req{color:var(--red)}
.gt td{padding:2px 4px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
.gt td.num{padding:5px 7px;text-align:right}
.gt tfoot td{border-top:1px solid var(--ink);border-bottom:2px solid var(--ink);
  background:#F7F6F3;font-weight:700;padding:6px 7px;text-align:right}
.gt tfoot td.l{text-align:left}
.gt .x{width:28px;text-align:center}
.gt .x button{color:var(--ink-3);font-size:15px;line-height:1;padding:2px 5px;border-radius:2px}
.gt .x button:hover{background:var(--maroon-w);color:var(--maroon)}
.gt .f{height:25px}
.full{overflow-x:auto;padding:0 14px}
.add{margin:5px 14px 2px;height:27px;padding:0 13px;border:1px solid var(--maroon);
  border-radius:3px;color:var(--maroon);font-size:12.5px;font-weight:600;background:#fff}
.add:hover{background:var(--maroon);color:#fff}
.emp{padding:13px 6px;color:var(--ink-3);font-size:12.5px;font-style:italic}

/* property block */
.blk{margin:8px 14px;border:1px solid var(--rule);border-radius:3px}
.blk .bh{display:flex;align-items:center;gap:6px;padding:0 8px 0 0;background:#FAF9F6;
  border-bottom:1px solid var(--rule)}
.blk .bhx{flex:1;display:flex;align-items:center;gap:10px;padding:8px 12px;text-align:left;
  background:none;border:0;cursor:pointer;font:inherit}
.blk .bhx:hover{background:#F1EFEA}
.blk .cv2{width:16px;height:16px;flex:none;border:1px solid var(--rule);border-radius:2px;
  font-size:12px;line-height:14px;text-align:center;color:var(--ink-3)}
.blk .blkdel{flex:none;color:var(--ink-3);padding:6px 8px;border-radius:3px;cursor:pointer}
.blk .blkdel:hover{background:var(--maroon-w);color:var(--maroon)}
.blk .bh .t{flex:1;font:600 13px/1.2 var(--serif)}
.blk .bh .s{font-size:11.5px;color:var(--ink-3)}
.blk .bb{display:none;padding:2px 0 6px} .blk.on .bb{display:block}

/* notes and checks */
.note{border-left:3px solid var(--rule);padding:9px 13px;margin:9px 14px;font-size:12.5px;
  color:var(--ink-2);background:#FAF9F6;max-width:74ch}
.note.warn{border-left-color:var(--sienna);background:var(--sienna-w);color:#6B3410}
.note.stop{border-left-color:var(--red);background:var(--maroon-w);color:var(--maroon-d)}
.note.form{border-left-color:var(--maroon);background:var(--maroon-w);color:var(--maroon-d)}
.note b{font-weight:600}
.cks{margin:10px 14px 4px;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.ck{padding:8px 12px;border-bottom:1px solid var(--rule-2);font-size:12.5px;display:flex;
  gap:10px;align-items:baseline}
.ck:last-child{border-bottom:0}
.ck b{flex:none;width:180px;font-weight:600} .ck span{flex:1}
.ck.err{border-left:3px solid var(--red);background:var(--maroon-w)} .ck.err b{color:var(--maroon-d)}
.ck.warn{border-left:3px solid var(--sienna);background:var(--sienna-w)} .ck.warn b{color:#6B3410}
.ck.ok{border-left:3px solid var(--green);background:var(--green-w)} .ck.ok b{color:var(--green)}

/* capital-gains nesting */
.cgband{background:var(--maroon);color:#fff;font:600 14px/1 var(--serif);padding:9px 14px;
  margin:14px 0 0;border-radius:3px 3px 0 0}
.cgsubband{font:600 12.5px/1 var(--serif);color:var(--maroon-d);background:var(--maroon-w);
  padding:8px 14px;margin:10px 0 0;border-left:3px solid var(--maroon)}
.cghead{border:1px solid var(--rule);border-top:0}
.cgh{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 14px;
  background:#F7F6F3;border:0;cursor:pointer;font:inherit;border-bottom:1px solid var(--rule)}
.cgh:hover{background:#F1EFEA}
.cght{flex:1;font:600 13.5px/1.2 var(--serif)}
.cghv{font:600 14px/1 var(--mono);color:var(--green)}
.cghb{display:none;padding:2px 0 8px} .cghb.open{display:block}
.sub2{margin:6px 14px;border:1px solid var(--rule-2);border-radius:3px;overflow:hidden}
.s2h{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 11px;
  background:#FBFAF8;border:0;cursor:pointer;font:inherit}
.s2h:hover{background:#F4F2EC}
.sub2.on .s2h{background:var(--maroon-w);border-bottom:1px solid var(--rule-2)}
.cv3{width:15px;height:15px;flex:none;border:1px solid var(--rule);border-radius:2px;
  font-size:11px;line-height:13px;text-align:center;color:var(--ink-3)}
.s2ref{flex:none;width:34px;font:600 11px/1 var(--serif);color:var(--ink-3)}
.s2t{flex:1;font-size:13px}
.s2v{font-size:11.5px;color:var(--ink-3)}
.sub2.on .s2v{color:var(--maroon-d);font-family:var(--mono)}
.s2b{display:none;padding:2px 0 6px} .s2b.open{display:block}

/* the band */
.band{position:fixed;left:0;right:0;bottom:0;height:var(--band);z-index:60;
  background:var(--maroon);color:#fff;display:flex;align-items:center;padding:0 18px;
  border-top:2px solid var(--maroon-d)}
.m{flex:none;padding-right:22px;margin-right:22px;border-right:1px solid rgba(255,255,255,.22)}
.m:last-of-type{border-right:0}
.m span{display:block;font-size:10.5px;color:rgba(255,255,255,.66);margin-bottom:1px;white-space:nowrap}
.m b{display:block;font:600 16px/1.1 var(--mono);white-space:nowrap}
.m.pay b{color:#FFD9A0} .m.ref b{color:#A8E6C9}
.gap{flex:1}
.st{font-size:11.5px;color:rgba(255,255,255,.82);text-align:right;line-height:1.35;white-space:nowrap}
.st b{color:#fff}
.st a{color:#FFD9A0;cursor:pointer;text-decoration:underline}
@media(max-width:900px){:root{--rail:0px}.rail{display:none}.sheet{padding:16px 12px 60px}}
</style></head><body>

  <div class="b">YUKTI<em>Tax Compliance</em></div>
  <div class="frm" id="frm">ITR-X</div>
  <div class="y" id="ay">A.Y. 2026-27</div>
  <div class="sp"></div>
  <button class="tbtn" id="b_open">Open file</button>
  <button class="tbtn" id="b_save">Save file</button>
  <button class="tbtn solid" id="b_json">Export return</button>
</header>

<nav class="rail"><h2>SECTIONS</h2><div id="nav"></div></nav>
<main class="wrap" id="wrap"><div class="sheet" id="sheet"></div></main>

<footer class="band">
  <div class="m"><span>Gross total income</span><b id="s_gti">—</b></div>
  <div class="m"><span>Total income</span><b id="s_ti">—</b></div>

</footer>

  R_("gross tax liability does not add up",g(C+"GrossTaxLiability"),
    Math.max(0,g(C+"TaxPayableOnTotInc")-g(C+"Rebate87A"))+g(C+"TotalSurcharge")+g(C+"EducationCess"),2);
  R_("the taxes paid do not add up",g("PartB_TTI.TaxPaid.TaxesPaid.TotalTaxesPaid"),
    g("PartB_TTI.TaxPaid.TaxesPaid.AdvanceTax")+g("PartB_TTI.TaxPaid.TaxesPaid.TDS")
    +g("PartB_TTI.TaxPaid.TaxesPaid.TCS")+g("PartB_TTI.TaxPaid.TaxesPaid.SelfAssessmentTax"));
  return out;
}

   Compute order: 30 (a disclosure — after the income heads, before tax @ 90).

/* ---- engine ------------------------------------------------------ */
function engAl(){
  S.al = S.al || {};
  const A = S.al;
  const C = S.C.al = { income:0 };
  isNew();   /* regime read — Schedule AL stays OPEN in both regimes (REGIME.md); no closures */

  /* ---------- Part B — movable asset (eight fixed lines, non-negative) ---------- */
  const M = A.mov || {};
  const mov = {
    jewellery:n0(M.jewellery),   /* [E16] JewelleryBullionEtc */
    art:n0(M.art),               /* [E17] ArchCollDrawPaintSulpArt */
    vehicles:n0(M.vehicles),     /* [E18] VehiclYachtsBoatsAircrafts */
    bank:n0(M.bank),             /* [E20] DepositsInBank */
    shares:n0(M.shares),         /* [E21] SharesAndSecurities */
    insurance:n0(M.insurance),   /* [E22] InsurancePolicies */
    loans:n0(M.loans),           /* [E23] LoansAndAdvancesGiven */
    cash:n0(M.cash)              /* [E24] CashInHand */
  };
  mov.total = mov.jewellery+mov.art+mov.vehicles+mov.bank+mov.shares+mov.insurance+mov.loans+mov.cash;
  C.mov = mov;

  /* ---------- Part A — immovable (unlimited table, amount at cost) ---------- */
  C.immCount = (A.imm||[]).length;
  C.immTotal = (A.imm||[]).reduce((a,r)=>a+n0((r||{}).amount),0);   /* Σ Amount [O6] */

  /* ---------- Part C — interest in a firm/AOP (unlimited table) ---------- */
  C.aopCount = (A.aop||[]).length;
  C.aopTotal = (A.aop||[]).reduce((a,r)=>a+n0((r||{}).invest),0);   /* Σ AssesseInvestment [P26] */
  C.aopFlag  = (st0(A.aopFlag)==="Y" || C.aopCount) ? "Y" : (st0(A.aopFlag)==="N" ? "N" : "");

  /* ---------- Part D — liabilities in relation to Assets at (A + B + C) ---------- */
  C.liab = n0(A.liab);                                              /* [O34] LiabilityInRelatAssets */
  C.assetsABC = C.immTotal + mov.total + C.aopTotal;                /* A + B + C (Part D relates to this) */

  /* GTI contribution — a disclosure schedule, nothing added to income (see header) */
  C.income = 0;
}

/* ---- shared address helpers (renderer + export) ------------------ */
function alAddrRows(pre,r){
  r = r || {};
  const india = (st0(r.country)||"91")==="91";
  let h = "";
  h += row("Flat / Door / Block No.", inp(pre+"resNo",{max:50}), {req:1, ref:"[F7]"});
  h += row("Name of Premises / Building / Village", inp(pre+"resName",{max:50}), {ref:"[G7]"});
  h += row("Road / Street / Post Office", inp(pre+"road",{max:50}), {ref:"[H7]"});
  h += row("Area / locality", inp(pre+"area",{max:50}), {req:1, ref:"[I7]"});
  h += row("Town / City / District", inp(pre+"city",{max:50}), {req:1, ref:"[J7]"});
  h += row("State", sel(pre+"state",AL_STATE), {req:1, ref:"[K7]"});
  h += row("Country", sel(pre+"country",AL_COUNTRY), {req:1, ref:"[L7]"});
  if(india) h += row("Pin code", inp(pre+"pin",{max:6}), {req:1, ref:"[M7]", hint:"6 digits — India"});
  else      h += row("Zip code", inp(pre+"zip",{max:8}), {req:1, ref:"[N7]", hint:"foreign address"});
  return h;
}
function alAddrOut(r){
  r = r || {};
  const country = sv(r.country) || "91";
  const a = {
    ResidenceNo:(sv(r.resNo)||"NA").slice(0,50),
    LocalityOrArea:(sv(r.area)||"NA").slice(0,50),
    CityOrTownOrDistrict:(sv(r.city)||"NA").slice(0,50),
    StateCode:sv(r.state)||"99",
    CountryCode:country.slice(0,4)
  };
  if(sv(r.resName)) a.ResidenceName = st0(r.resName).slice(0,50);
  if(sv(r.road))    a.RoadOrStreet  = st0(r.road).slice(0,50);
  if(country==="91"){ const p=R(r.pin); if(p>=100000 && p<=999999) a.PinCode = p; }
  else { if(sv(r.zip)) a.ZipCode = st0(r.zip).slice(0,8); }
  return a;
}

/* ---- renderer ---------------------------------------------------- */
function secAl(){
  const A = S.al||{}, C = S.C.al||{};
  const TI = R((S.C.ti)||0);
  let h = "";

  h += note("<b>Schedule AL — Assets and Liabilities at the end of the year</b> (other than those included in Part A-BS). Applicable when Total Income exceeds Rs. 1 crore (the utility prompts these fields once Total Income exceeds Rs. 50 lakh). Every amount is at <b>cost</b>, in rupees. Assets are disclosed here only — Schedule AL adds nothing to your total income.");
  if(TI>10000000) h += note("Your Total Income is above Rs. 1 crore — Schedule AL is <b>required</b> to be filled.","form");
  else if(TI>5000000) h += note("Your Total Income is above Rs. 50 lakh — please complete the dropdowns and amount fields of Schedule AL.","warn");

  /* ===== Part A — immovable asset ===== */
  h += sub("A · Details of immovable asset");
  h += row("Do you own any immovable asset?", sel("al.ownImm",AL_YESNO), {req:1, ref:"[J4]"});
  if(st0(A.ownImm)==="Yes"){
    (A.imm||[]).forEach((raw,i)=>{
      raw = raw||{};
      const pre = "al.imm."+i+".";
      const title = "Immovable asset " + (i+1) + (st0(raw.desc)?" — "+esc(st0(raw.desc)):"");
      let inner = "";
      inner += row("Description", inp(pre+"desc",{max:25}), {req:1, ref:"[E6]", hint:"max 25 characters"});
      inner += sub("Address [F6]");
      inner += alAddrRows(pre,raw);
      inner += row("Amount (cost) in Rs.", inp(pre+"amount",{n:1}), {req:1, ref:"[O6]"});
      h += blk("imm"+i, title, (n0(raw.amount)?RS(n0(raw.amount)):"—"), inner, "al.imm."+i);
    });
    h += '<button class="add" data-add="al.imm">Add an immovable asset</button>';
    h += row("Total immovable assets (Part A)", cell(C.immTotal||0));
  } else if(st0(A.ownImm)==="No"){
    h += note("No immovable asset declared. Part A will not be written.");
  }

  /* ===== Part B — movable asset ===== */
  h += sub("B · Details of movable asset");
  h += note("Enter the cost of each movable asset held at year end. All eight lines are required — enter zeros if nil.");
  h += row("(i) Jewellery, bullion etc.", inp("al.mov.jewellery",{n:1}), {ref:"[E16]"});
  h += row("(ii) Archaeological collections, drawings, painting, sculpture or any work of art", inp("al.mov.art",{n:1}), {ref:"[E17]"});
  h += row("(iii) Vehicles, yachts, boats and aircrafts", inp("al.mov.vehicles",{n:1}), {ref:"[E18]"});
  h += row("(iv) Financial asset", "", {ref:"[E19]", cls:"sub"});
  h += row("(a) Bank (including all deposits)", inp("al.mov.bank",{n:1}), {ref:"[E20]", ind:1});
  h += row("(b) Shares and securities", inp("al.mov.shares",{n:1}), {ref:"[E21]", ind:1});
  h += row("(c) Insurance policies", inp("al.mov.insurance",{n:1}), {ref:"[E22]", ind:1});
  h += row("(d) Loans and advances given", inp("al.mov.loans",{n:1}), {ref:"[E23]", ind:1});
  h += row("(e) Cash in hand", inp("al.mov.cash",{n:1}), {ref:"[E24]", ind:1});
  h += row("Total movable assets (Part B)", cell((C.mov||{}).total||0));

  /* ===== Part C — interest in a firm/AOP ===== */
  h += sub("C · Interest held in the assets of a firm or AOP as a partner or member");
  h += row("Do you have any Interest held in the assets of a firm or association of persons (AOP) as a partner or member?",
           sel("al.aopFlag",AL_YN), {req:1, ref:"[M25]"});
  if(st0(A.aopFlag)==="Y"){
    (A.aop||[]).forEach((raw,i)=>{
      raw = raw||{};
      const pre = "al.aop."+i+".";
      const title = "Firm / AOP " + (i+1) + (st0(raw.name)?" — "+esc(st0(raw.name)):"");
      let inner = "";
      inner += row("Name of the firm(s) / AOP(s)", inp(pre+"name",{max:50}), {req:1, ref:"[E26]", hint:"max 50 characters"});
      inner += sub("Address [F26]");
      inner += alAddrRows(pre,raw);
      inner += row("PAN of the firm / AOP", inp(pre+"pan",{max:10}), {req:1, ref:"[O26]"});
      inner += row("Assessee's investment in the firm / AOP on cost basis", inp(pre+"invest",{n:1}), {req:1, ref:"[P26]"});
      h += blk("aop"+i, title, (n0(raw.invest)?RS(n0(raw.invest)):"—"), inner, "al.aop."+i);
    });
    h += '<button class="add" data-add="al.aop">Add a firm / AOP</button>';
    h += row("Total investment in firms / AOPs (Part C)", cell(C.aopTotal||0));
  } else if(st0(A.aopFlag)==="N"){
    h += note("No interest in a firm or AOP declared. Part C will not be written.");
  }

  /* ===== Part D — liabilities ===== */
  h += sub("D · Liabilities");
  h += row("Liabilities in relation to Assets at (A + B + C)", inp("al.liab",{n:1}), {req:1, ref:"[O34]"});
  h += row("Assets at (A + B + C) — for reference", cell(C.assetsABC||0));

  /* cross-check reminders (warnings only — cost differs from value; see book point 6) */
  h += note("Cross-checks (warnings only, since Schedule AL is at cost): immovable assets against Schedule HP / Schedule FA; bank deposits against Part B-TTI bank details and FA; shares and securities against Schedule CG and the unlisted-share table; the firm/AOP interest against Schedule IF / partner details.");

  return h;
}

/* ---- export ------------------------------------------------------ */
function expAl(j){
  const A = S.al||{}, C = S.C.al||{};
  const mov = C.mov||{};
  const TI = R((S.C.ti)||0);

  /* emit ScheduleAL when the schedule is being filled or is applicable (TI > 50L) */
  const present = st0(A.ownImm) || st0(A.aopFlag) || (A.imm&&A.imm.length) ||
                  (A.aop&&A.aop.length) || (mov.total||0) || n0(A.liab) || TI>5000000;
  if(!present) return;

  const o = {};

  /* Part A — ImmovableDetails[] only when "Yes" and rows carry a value */
  if(st0(A.ownImm)==="Yes"){
    const rows = (A.imm||[]).filter(r=>st0((r||{}).desc)||n0((r||{}).amount)||st0((r||{}).city));
    if(rows.length){
      o.ImmovableDetails = rows.map(r=>({
        Description:(sv(r.desc)||"NA").slice(0,25),
        AddressAL:alAddrOut(r),
        Amount:n0(r.amount)
      }));
    }
  }

  /* Part B — MovableAsset (required; all eight lines always, zeros if nil) */
  o.MovableAsset = {
    DepositsInBank:n0(mov.bank),
    SharesAndSecurities:n0(mov.shares),
    InsurancePolicies:n0(mov.insurance),
    LoansAndAdvancesGiven:n0(mov.loans),
    CashInHand:n0(mov.cash),
    JewelleryBullionEtc:n0(mov.jewellery),
    ArchCollDrawPaintSulpArt:n0(mov.art),
    VehiclYachtsBoatsAircrafts:n0(mov.vehicles)
  };

  /* Part C — InterstAOPFlag (required Y/N) + InterestHeldInaAsset[] on Y with rows */
  const flag = (st0(A.aopFlag)==="Y" || (A.aop&&A.aop.length)) ? "Y" : "N";
  o.InterstAOPFlag = flag;
  if(flag==="Y"){
    const rows = (A.aop||[]).filter(r=>st0((r||{}).name)||n0((r||{}).invest)||st0((r||{}).pan));
    if(rows.length){
      o.InterestHeldInaAsset = rows.map(r=>({
        NameOfFirm:(sv(r.name)||"NA").slice(0,50),
        AddressAL:alAddrOut(r),
        PanOfFirm:PAN_RE.test(st0(r.pan).toUpperCase())?st0(r.pan).toUpperCase():"AAAAA0000A",
        AssesseInvestment:n0(r.invest)
      }));
    }
  }

  /* Part D — LiabilityInRelatAssets (required) */
  o.LiabilityInRelatAssets = n0(A.liab);

  j.ScheduleAL = o;
}

/* ---- import ------------------------------------------------------ */
function impAl(I3){
  const read = [];
  if(!(I3 && I3.ScheduleAL)) return read;
  const A = I3.ScheduleAL;
  S.al = S.al || {};

  const addrIn = x => { x = x||{}; return {
    resNo:x.ResidenceNo||"", resName:x.ResidenceName||"", road:x.RoadOrStreet||"",
    area:x.LocalityOrArea||"", city:x.CityOrTownOrDistrict||"", state:x.StateCode||"",
    country:x.CountryCode||"91", pin:x.PinCode!=null?String(x.PinCode):"", zip:x.ZipCode||""
  };};

  if(Array.isArray(A.ImmovableDetails)){
    S.al.imm = A.ImmovableDetails.map(r=>Object.assign(
      {desc:r.Description||"", amount:nz(r.Amount)}, addrIn(r.AddressAL)));
    S.al.ownImm = "Yes";
    read.push("Schedule AL Part A (immovable assets)");
  }
  if(A.MovableAsset){
    const m = A.MovableAsset;
    S.al.mov = {
      jewellery:nz(m.JewelleryBullionEtc), art:nz(m.ArchCollDrawPaintSulpArt),
      vehicles:nz(m.VehiclYachtsBoatsAircrafts), bank:nz(m.DepositsInBank),
      shares:nz(m.SharesAndSecurities), insurance:nz(m.InsurancePolicies),
      loans:nz(m.LoansAndAdvancesGiven), cash:nz(m.CashInHand)
    };
    read.push("Schedule AL Part B (movable assets)");
  }
  if(A.InterstAOPFlag){ S.al.aopFlag = A.InterstAOPFlag; read.push("Schedule AL Part C flag"); }
  if(Array.isArray(A.InterestHeldInaAsset)){
    S.al.aop = A.InterestHeldInaAsset.map(r=>Object.assign(
      {name:r.NameOfFirm||"", pan:r.PanOfFirm||"", invest:nz(r.AssesseInvestment)}, addrIn(r.AddressAL)));
    if(!st0(S.al.aopFlag)) S.al.aopFlag = "Y";
    read.push("Schedule AL Part C (firm/AOP interest)");
  }
  if(A.LiabilityInRelatAssets!=null){ S.al.liab = nz(A.LiabilityInRelatAssets); read.push("Schedule AL Part D (liabilities)"); }

  return read;
}

/* ---- checks ------------------------------------------------------ */
function chkAl(){
  const out = [], A = S.al||{}, C = S.C.al||{};
  const TI = R((S.C.ti)||0);
  const applic50 = TI>5000000;      /* VBA prompt threshold */

  /* Dropdown-not-blank (VBA) — both flags mandatory once income exceeds threshold */
  if(applic50){
    if(!st0(A.ownImm))
      out.push({lvl:"err", t:"Schedule AL — Part A", m:'"Do you own any immovable asset?" [J4] must be answered when Total Income exceeds Rs. 50 lakh.', sec:"al"});
    if(!st0(A.aopFlag))
      out.push({lvl:"err", t:"Schedule AL — Part C", m:'The interest-in-firm/AOP flag [M25] must be answered when Total Income exceeds Rs. 50 lakh.', sec:"al"});
  }

  /* Part A completeness (VBA) — when Yes, at least one row, each row complete */
  if(st0(A.ownImm)==="Yes"){
    const rows = (A.imm||[]);
    if(!rows.length || !rows.some(r=>st0((r||{}).desc)||n0((r||{}).amount)))
      out.push({lvl:"err", t:"Schedule AL — Part A", m:"At least one immovable asset detail is required when the answer is Yes.", sec:"al"});
    rows.forEach((r,i)=>{
      r = r||{};
      const has = st0(r.desc)||n0(r.amount)||st0(r.city)||st0(r.resNo);
      if(!has) return;
      const miss = [];
      if(!st0(r.desc)) miss.push("Description");
      if(!st0(r.resNo)) miss.push("Flat/Door/Block No.");
      if(!st0(r.area)) miss.push("Area/locality");
      if(!st0(r.city)) miss.push("Town/City/District");
      if(!st0(r.state)) miss.push("State");
      if(!st0(r.country)) miss.push("Country");
      if(!(n0(r.amount)>0)) miss.push("Amount");
      if(miss.length)
        out.push({lvl:"err", t:"Schedule AL — Part A", m:"Immovable asset "+(i+1)+": please fill "+miss.join(", ")+".", sec:"al"});
      alRowAddrChecks(out, r, "Immovable asset "+(i+1));
      if(n0(r.amount)>AL_MAX14)
        out.push({lvl:"warn", t:"Schedule AL — Part A", m:"Immovable asset "+(i+1)+": amount should not exceed 14 digits.", sec:"al"});
    });
  }

  /* Part B / D non-blank (VBA) — the eight lines and the liability export as zeros
     when blank, which satisfies the "enter zeros if nil" rule; only flag over-length */
  const mov = C.mov||{};
  [["Jewellery, bullion etc.",mov.jewellery],["Archaeological collections/art",mov.art],
   ["Vehicles, yachts, boats and aircrafts",mov.vehicles],["Bank (including all deposits)",mov.bank],
   ["Shares and securities",mov.shares],["Insurance policies",mov.insurance],
   ["Loans and advances given",mov.loans],["Cash in hand",mov.cash]].forEach(([lbl,v])=>{
    if(n0(v)>AL_MAX14)
      out.push({lvl:"warn", t:"Schedule AL — Part B", m:lbl+": amount should be non-negative and not exceed 14 digits.", sec:"al"});
  });
  if(n0(A.liab)>AL_MAX14)
    out.push({lvl:"warn", t:"Schedule AL — Part D", m:"Liability in relation to assets should be non-negative and not exceed 14 digits.", sec:"al"});

  /* Part C completeness (VBA) — when Y, at least one row, each row complete */
  if(st0(A.aopFlag)==="Y"){
    const rows = (A.aop||[]);
    if(!rows.length || !rows.some(r=>st0((r||{}).name)||n0((r||{}).invest)))
      out.push({lvl:"err", t:"Schedule AL — Part C", m:"At least one firm/AOP detail is required when the answer is Yes.", sec:"al"});
    rows.forEach((r,i)=>{
      r = r||{};
      const has = st0(r.name)||n0(r.invest)||st0(r.pan)||st0(r.city)||st0(r.resNo);
      if(!has) return;
      const miss = [];
      if(!st0(r.name)) miss.push("Name of firm/AOP");
      if(!st0(r.resNo)) miss.push("Flat/Door/Block No.");
      if(!st0(r.area)) miss.push("Area/locality");
      if(!st0(r.city)) miss.push("Town/City/District");
      if(!st0(r.state)) miss.push("State");
      if(!st0(r.country)) miss.push("Country");
      if(!(n0(r.invest)>0)) miss.push("Investment");
      if(miss.length)
        out.push({lvl:"err", t:"Schedule AL — Part C", m:"Firm/AOP "+(i+1)+": please fill "+miss.join(", ")+".", sec:"al"});
      if(st0(r.pan) && !PAN_RE.test(st0(r.pan).toUpperCase()))
        out.push({lvl:"err", t:"Schedule AL — Part C", m:"Firm/AOP "+(i+1)+": PAN is not a valid PAN.", sec:"al"});
      else if(!st0(r.pan) && has)
        out.push({lvl:"err", t:"Schedule AL — Part C", m:"Firm/AOP "+(i+1)+": PAN of the firm/AOP is required.", sec:"al"});
      alRowAddrChecks(out, r, "Firm/AOP "+(i+1));
      if(n0(r.invest)>AL_MAX14)
        out.push({lvl:"warn", t:"Schedule AL — Part C", m:"Firm/AOP "+(i+1)+": investment should not exceed 14 digits.", sec:"al"});
    });
  }

  return out;
}

/* Pin vs Zip and Country/State mapping checks for one address row (VBA) */
function alRowAddrChecks(out, r, who){
  r = r || {};
  const country = st0(r.country), state = st0(r.state);
  const india = country==="91";
  if(country){
    if(india){
      const p = R(r.pin);
      if(!(p>=100000 && p<=999999))
        out.push({lvl:"err", t:"Schedule AL — address", m:who+": Pin Code is mandatory for an Indian address and cannot exceed 6 digits.", sec:"al"});
    } else {
      if(!st0(r.zip))
        out.push({lvl:"err", t:"Schedule AL — address", m:who+": Zip Code is mandatory for a foreign address (max 8 characters).", sec:"al"});
      else if(st0(r.zip).length>8 || ZIP_BAD.test(st0(r.zip)))
        out.push({lvl:"err", t:"Schedule AL — address", m:who+": Zip Code cannot exceed 8 characters and cannot contain < > & ' \".", sec:"al"});
    }
  }
  /* Country/State mapping — Indian state (not 99) needs India (91); state 99 needs a foreign country */
  if(state && country){
    if(state!=="99" && country!=="91")
      out.push({lvl:"err", t:"Schedule AL — address", m:who+": an Indian state requires Country = India (91).", sec:"al"});
    if(state==="99" && country==="91")
      out.push({lvl:"err", t:"Schedule AL — address", m:who+": State '99-Foreign' requires a non-India country.", sec:"al"});
  }
}

/* ---- register ---------------------------------------------------- */
reg({id:"al", t:"Assets and liabilities", ref:"Schedule AL",
     f:secAl, s:()=>{const C=S.C.al||{};
       const tot=(C.immTotal||0)+((C.mov||{}).total||0)+(C.aopTotal||0);
       return tot?RS(tot)+" assets":"";},
     eng:engAl, exp:expAl, imp:impAl, chk:chkAl, order:30});

/* =====================================================================
   ITR-3 · Section "bank" — Bank and verification
   Screen ref: Verification · compute order 95 (last section).
   Owns schema blocks:
     · Verification         (Declaration + Capacity + Place + Date)
     · TaxReturnPreparer    (optional single block)
   and renders/exports the refund bank accounts that hang off the tax
   block PartB_TTI.Refund.BankAccountDtls — the tax section (order 90)
   deliberately leaves the account list to this screen (its own note:
   "Bank-account details for the refund … are entered under Bank and
   verification"), and no other builder writes AddtnlBankDetails, so this
   section fills BankDtlsFlag + AddtnlBankDetails to keep the return valid.

   Built ONLY from books/ITR-3/Verification.md (rows 4–9, r8/r10 hidden or
   note-only, not built), books/ITR-3/REGIME.md, and books/ITR-3/enums.json
   (Verification.Capacity, AccountType). Nothing on this screen is an income
   head and nothing closes on the regime — Verification/TRP/bank details are
   the same under both regimes — so S.C.bank.income = 0 and there is no
   isNew() closure (cell(0)/note) to build here.  Rules encoded from the
   book: rules.json #45 (representative→Part A flag), #40 (rep PAN = uploader
   PAN), #60/#3275 (verification PAN ≠ donee PAN in 80G/80GGA).
   ===================================================================== */

/* ---- account-type codes (schema enum AccountType; clean labels) ------ */
const ACCT_B=[["SB","Savings account"],["CA","Current account"],
  ["CC","Cash credit account"],["OD","Overdraft account"],
  ["NRO","Non-resident (ordinary) account"],
  ["CGAS","Capital Gains Accounts Scheme"],["OTH","Other"]];
/* Capacity codes — from enums.json Verification.Capacity (I6 dropdown) */
const VCAP=[["S","Self"],["R","Representative assessee"],
  ["K","Karta of a Hindu undivided family"],["A","Authorised signatory"]];

/* ---- state (seed only what is absent; never clobber shell/import) ----- */
const _verToday=()=>{const d=new Date();
  return String(d.getDate()).padStart(2,"0")+"/"+
         String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();};
S.bank = S.bank || [];              /* refund accounts → Refund.BankAccountDtls */
S.ver  = S.ver  || {};
if(S.ver.cap===undefined)   S.ver.cap="S";     /* Verification.Capacity (I6, default Self) */
if(S.ver.name===undefined)  S.ver.name="";     /* Declaration.AssesseeVerName (C4) */
if(S.ver.father===undefined)S.ver.father="";   /* Declaration.FatherName (I4) */
if(S.ver.pan===undefined)   S.ver.pan="";      /* Declaration.AssesseeVerPAN (C7/G7) */
if(S.ver.place===undefined) S.ver.place="";    /* Verification.Place (H9) */
if(S.ver.date===undefined)  S.ver.date=_verToday();  /* Verification.Date (J9/L9), DD/MM/YYYY on screen */
if(S.ver.nacc===undefined)  S.ver.nacc="";     /* number of accounts held at any time (guidance) */
S.trp  = S.trp  || {};              /* TaxReturnPreparer (optional block) */
SEED.bank = SEED.bank || {type:"SB"};

/* ---- engine — this head carries NO income; roll-up contribution = 0 --- */
function engBank(){
  const B={income:0};                                  /* Bank/Verification add nothing to GTI */
  /* count accounts that are complete enough to export (IFSC + name + a/c no) */
  const valid=(S.bank||[]).filter(b=>IFSC_RE.test(st0(b.ifsc).toUpperCase())&&st0(b.acno)&&st0(b.bank));
  B.nAcc   = valid.length;
  B.hasRefund = (S.bank||[]).some(b=>b.refund==="Y");
  B.trpOn  = !!(st0((S.trp||{}).name)||st0((S.trp||{}).id));
  S.C.bank = B;
}

/* ---- renderer ------------------------------------------------------- */
function secBank(){
  let h="";

  /* --- refund bank accounts (Refund.BankAccountDtls) --- */
  h+=sub("Bank accounts");
  h+=row("Number of accounts held at any time during the year",inp("ver.nacc",{n:1}),
    {hint:"dormant accounts excluded"});
  h+=note("Every account held at any time in the year must be reported, except a dormant one. "+
    "Tick the one the refund should be credited to.");
  h+=grid("bank",[{k:"ifsc",h:"IFS code",t:"txt",w:"140px",max:11,req:1},
    {k:"bank",h:"Name of the bank",t:"txt",w:"auto",max:125,req:1},
    {k:"acno",h:"Account number",t:"txt",w:"200px",max:20,req:1},
    {k:"type",h:"Type",t:"sel",w:"200px",req:1,opts:ACCT_B},
    {k:"refund",h:"For the refund",t:"chk",w:"120px"}],
    S.bank,{min:"980px",empty:"No account given — a refund cannot be credited.",add:"Add an account"});
  h+=note("Type the IFS code and the name of the bank fills itself.");

  /* --- Verification (Verification.md rows 4–9) --- */
  h+=sub("Verification");
  h+=note("<b>I,</b> the person named below, <b>solemnly declare</b> that to the best of my knowledge "+
    "and belief the information given in this return and the schedules is correct and complete, and that "+
    "I am competent to make this return and verify it.");                       /* r5/r6 tail — declaration text, no input */
  h+=row("I, (full name in block letters)",inp("ver.name",{max:125}),{req:1,ref:"C4"});
  h+=row("son / daughter of",inp("ver.father",{max:125}),{req:1,ref:"I4"});
  h+=row("making this return in my capacity as",sel("ver.cap",VCAP,{blank:false}),{req:1,ref:"I6"});
  h+=row("holding permanent account number (PAN)",inp("ver.pan",{max:10}),{req:1,ref:"C7"});
  h+=row("Place",inp("ver.place",{max:50}),{req:1,ref:"H9"});
  h+=row("Date",dte("ver.date"),{req:1,ref:"J9",hint:"signing date; exported as YYYY-MM-DD"});
  h+=note("The e-Filing portal stamps the submission with its own system date; this is the date of signing.");

  /* --- Tax return preparer (TaxReturnPreparer, optional block) --- */
  h+=card("trp","Prepared by a tax return preparer (TRP)",
    (st0((S.trp||{}).name)?st0(S.trp.name):""),
    row("Identification number of the TRP",inp("trp.id",{max:10}),{req:1})+
    row("Name of the TRP",inp("trp.name",{max:125}),{req:1})+
    row("Amount reimbursed from the Government, if any",inp("trp.reimb",{n:1}),{hint:"leave blank if none"})+
    formNote("Give the TRP's identification number and name; the reimbursement is optional."));

  /* --- the department's validation rules (shell panel) --- */
  h+=rulesPanel();

  /* --- export / save --- */
  h+=sub("Export");
  const errs=S.C.checks.filter(c=>c.lvl==="err").length;
  h+= errs
    ? note("<b>"+errs+" thing"+(errs>1?"s":"")+" still to fix.</b> Each sits against its own section.","stop")
    : note("Every check passes. The JSON is validated against the schema skeleton before it is written. "+
      "Import it into the government utility to seal and upload.","form");
  h+='<div style="padding:8px 14px;display:flex;gap:10px">'+
     '<button class="add" id="b_json2" style="height:32px;padding:0 18px;margin:0'+
     (errs?";opacity:.45":"")+'"'+(errs?" disabled":"")+'>Export the return as JSON</button>'+
     '<button class="add" id="b_save2" style="height:32px;padding:0 18px;margin:0">Save the working file</button></div>';
  return h;
}

/* ---- export --------------------------------------------------------- */
function expBank(j){
  /* refund accounts → PartB_TTI.Refund.BankAccountDtls (flag present even with none) */
  const bk=(S.bank||[]).filter(b=>IFSC_RE.test(st0(b.ifsc).toUpperCase())&&st0(b.acno)&&st0(b.bank));
  put(j,"PartB_TTI.Refund.BankAccountDtls.BankDtlsFlag",bk.length?"Y":"N");
  if(bk.length){
    if(j.PartB_TTI==null)j.PartB_TTI={};
    if(j.PartB_TTI.Refund==null)j.PartB_TTI.Refund={};
    if(j.PartB_TTI.Refund.BankAccountDtls==null)j.PartB_TTI.Refund.BankAccountDtls={};
    j.PartB_TTI.Refund.BankAccountDtls.AddtnlBankDetails=bk.map(b=>({
      IFSCCode:st0(b.ifsc).toUpperCase(),
      BankName:st0(b.bank).slice(0,125),
      BankAccountNo:st0(b.acno).slice(0,20),
      AccountType:ACCT_B.some(a=>a[0]===b.type)?b.type:"SB",
      UseForRefund:b.refund==="Y"?"true":"false"}));
  }

  /* Verification — required keys always present */
  put(j,"Verification.Declaration.AssesseeVerName",(sv(S.ver.name)||"NA").slice(0,125));
  put(j,"Verification.Declaration.FatherName",(sv(S.ver.father)||"NA").slice(0,125));
  put(j,"Verification.Declaration.AssesseeVerPAN",(sv(st0(S.ver.pan).toUpperCase())||"NA"));
  put(j,"Verification.Capacity",VCAP.some(c=>c[0]===S.ver.cap)?S.ver.cap:"S");   /* I6 → S/R/K/A */
  put(j,"Verification.Place",(sv(S.ver.place)||"NA").slice(0,50));
  put(j,"Verification.Date",ISO(S.ver.date)||ISO(_verToday()));                  /* DD/MM/YYYY → YYYY-MM-DD */

  /* TaxReturnPreparer — only when the optional block carries id + name */
  const tp=S.trp||{};
  if(st0(tp.id)&&st0(tp.name)){
    const o={IdentificationNoOfTRP:st0(tp.id).slice(0,10),NameOfTRP:st0(tp.name).slice(0,125)};
    if(N(tp.reimb)>0)o.ReImbFrmGov=n0(tp.reimb);                                 /* optional, min 0 */
    j.TaxReturnPreparer=o;
  }
}

/* ---- import (inverse) ---------------------------------------------- */
function impBank(I3){
  const read=[]; const g=(o,p)=>p.split(".").reduce((t,k)=>t==null?undefined:t[k],o);
  const bk=g(I3,"PartB_TTI.Refund.BankAccountDtls.AddtnlBankDetails")||[];
  if(Array.isArray(bk)&&bk.length){
    S.bank=bk.map(b=>({ifsc:b.IFSCCode||"",bank:b.BankName||"",acno:b.BankAccountNo||"",
      type:ACCT_B.some(a=>a[0]===b.AccountType)?b.AccountType:"SB",
      refund:b.UseForRefund==="true"?"Y":"N"}));
    read.push("bank accounts");
  }
  const V=I3.Verification;
  if(V){
    S.ver=S.ver||{};
    S.ver.name  = g(V,"Declaration.AssesseeVerName")||"";
    S.ver.father= g(V,"Declaration.FatherName")||"";
    S.ver.pan   = g(V,"Declaration.AssesseeVerPAN")||"";
    S.ver.cap   = VCAP.some(c=>c[0]===V.Capacity)?V.Capacity:"S";
    S.ver.place = V.Place||"";
    if(V.Date)S.ver.date=dmy(V.Date)||S.ver.date;                                /* YYYY-MM-DD → DD/MM/YYYY */
    read.push("verification");
  }
  if(I3.TaxReturnPreparer){
    S.trp={id:I3.TaxReturnPreparer.IdentificationNoOfTRP||"",
           name:I3.TaxReturnPreparer.NameOfTRP||"",
           reimb:nz(I3.TaxReturnPreparer.ReImbFrmGov)};
    read.push("tax return preparer");
  }
  return read;
}

/* ---- checks (regime-aware; no regime closures on this screen) ------- */
function chkBank(){
  const out=[]; engBank();

  /* --- bank accounts --- */
  if(!(S.bank||[]).length)
    out.push({lvl:"err",t:"Bank account",m:"At least one account is needed for the refund.",sec:"bank"});
  else if(!S.bank.some(b=>b.refund==="Y"))
    out.push({lvl:"err",t:"Refund account",m:"Tick one account to receive the refund.",sec:"bank"});
  (S.bank||[]).forEach((b,i)=>{
    if(st0(b.ifsc)&&!IFSC_RE.test(st0(b.ifsc).toUpperCase()))
      out.push({lvl:"err",t:"Bank row "+(i+1),m:"The IFSC is four letters, a zero, then six characters.",sec:"bank"});
    if(!st0(b.bank))out.push({lvl:"err",t:"Bank row "+(i+1),m:"The name of the bank is required.",sec:"bank"});
    if(!st0(b.acno))out.push({lvl:"err",t:"Bank row "+(i+1),m:"The account number is required.",sec:"bank"});
  });

  /* --- verification (C4/I4/C7/I6/H9/J9) --- */
  if(!st0(S.ver.name))
    out.push({lvl:"err",t:"Verification",m:"The full name of the person verifying the return is required.",sec:"bank"});
  if(!st0(S.ver.father))
    out.push({lvl:"err",t:"Father's name",m:"The schema makes the father's name compulsory.",sec:"bank"});
  if(!PAN_RE.test(st0(S.ver.pan).toUpperCase()))
    out.push({lvl:"err",t:"Verifier's PAN",m:"A valid ten-character PAN of the person verifying is required.",sec:"bank"});
  else if(!VPAN.test(st0(S.ver.pan).toUpperCase()))
    out.push({lvl:"warn",t:"Verifier's PAN",m:"An ITR-3 is verified by an individual or HUF — expected the fourth PAN character to be P or H.",sec:"bank"});
  if(!VCAP.some(c=>c[0]===S.ver.cap))
    out.push({lvl:"err",t:"Capacity",m:"Select the capacity in which the return is made (Self / Representative / Karta / Authorised signatory).",sec:"bank"});
  if(!st0(S.ver.place))
    out.push({lvl:"err",t:"Place",m:"The place of signing is required in the verification.",sec:"bank"});
  if(!ISO(S.ver.date))
    out.push({lvl:"err",t:"Date",m:"The date of signing is required, as "+DF+".",sec:"bank"});

  /* --- representative rules from the book --- */
  if(S.ver.cap==="R"){
    /* rules.json #45 — Representative capacity requires the Part A representative flag = Yes */
    if(((S.fs||{}).rep)!=="Y")
      out.push({lvl:"err",t:"Representative assessee",m:"Capacity is Representative, so 'Whether this return is being filed by a representative assessee?' in Part A - General must be Yes, with the representative's details.",sec:"bank"});
    /* rules.json #40 — verification PAN must be the PAN of the person uploading (informational) */
    out.push({lvl:"warn",t:"Representative PAN",m:"The PAN quoted in the verification must be the same as the PAN of the person uploading the return.",sec:"bank"});
  } else {
    /* self-filing: the verifier's PAN is normally the assessee's own PAN */
    if(PAN_RE.test(st0(S.ver.pan).toUpperCase())&&PAN_RE.test(st0((S.pi||{}).pan).toUpperCase())&&
       st0(S.ver.pan).toUpperCase()!==st0(S.pi.pan).toUpperCase())
      out.push({lvl:"warn",t:"Verifier's PAN",m:"The verification PAN differs from the assessee's PAN in Part A - General; for self-filing they should match.",sec:"bank"});
  }

  /* rules.json #60 / #3275 — verification PAN cannot equal a donee PAN in Schedule 80G / 80GGA */
  const doneePans=[]
    .concat((S.g80||[]).map(r=>r&&r.pan))
    .concat((S.gga||[]).map(r=>r&&r.pan))
    .filter(p=>PAN_RE.test(st0(p).toUpperCase())).map(p=>st0(p).toUpperCase());
  if(PAN_RE.test(st0(S.ver.pan).toUpperCase())&&doneePans.indexOf(st0(S.ver.pan).toUpperCase())>=0)
    out.push({lvl:"err",t:"Verifier's PAN",m:"The verification PAN cannot be the same as a donee PAN reported under Schedule 80G / 80GGA.",sec:"bank"});

  /* --- TRP (only validate when the optional block is in use) --- */
  const tp=S.trp||{};
  if(st0(tp.id)||st0(tp.name)||N(tp.reimb)){
    if(!st0(tp.id))out.push({lvl:"err",t:"Tax return preparer",m:"The TRP's identification number is required when the TRP block is filled.",sec:"bank"});
    if(!st0(tp.name))out.push({lvl:"err",t:"Tax return preparer",m:"The TRP's name is required when the TRP block is filled.",sec:"bank"});
    if(N(tp.reimb)<0)out.push({lvl:"err",t:"Tax return preparer",m:"The amount reimbursed from the Government cannot be negative.",sec:"bank"});
  }

  if(!out.length)
    out.push({lvl:"ok",t:"Bank and verification",m:"Verified by "+st0(S.ver.name)+" in the capacity of "+
      ((VCAP.find(c=>c[0]===S.ver.cap)||["","Self"])[1])+"; every check passes.",sec:"bank"});
  return out;
}

/* =====================================================================
   ITR-3 · Section "bp" — Business — BP & depreciation
   Books: BP.md, DEP_DCG.md, DPM_DOA.md, ESR.md, ICDS.md,
          Unabsorbed_Depreciation.md   (books/ITR-3/)
   Schema blocks: ITR3ScheduleBP, ITR3ScheduleUD, ScheduleDCG,
                  ScheduleDEP, ScheduleDOA, ScheduleDPM, ScheduleESR,
                  ScheduleICDS.
   Compute order 22. Sets S.C.bp.income = PGBP contribution to GTI
   (item D of Schedule BP, K157, signed).
   Regime gating per books/ITR-3/REGIME.md (isNew()):
     - DPM additional depreciation -> 0 (A309); 45% block dep -> 0 (A310)
     - 35AD deduction cannot be claimed (A287)
     - ESR col-3 allowable for 35(1)(ii)/(iia)/(iii)/(2AA)/35CCC -> 0 (A354)
     - UD 3a 115BAC adjustment only in new regime (rule 624)
   BP is a computed adjustment ladder: almost every line is fed from
   upstream schedules (P&L, Trading, Part A-OI, DEP, ESR, ICDS, EI,
   sheet10/11/12). Those upstream sheets belong to other builders, so
   their leaf figures are captured here as guarded inputs in S.bp; the
   two genuine BP user inputs (5c "any other exempt income" and the
   35AD(5) clause) are surfaced as such. DEP/DPM/DOA/ESR/UD/ICDS are
   owned in full here and feed BP internally (12i<-DEP 6, 28<-ESR X4,
   25/32<-ICDS totals).
   ===================================================================== */

/* ---- depreciation block engine (DPM & DOA) ---- */
function bpBlock(b,rate,opts){
  b=b||{};opts=opts||{};
  const addlOK   = opts.addl!==false && !isNew();   /* additional depr: old regime only (A309) */
  const blocked  = opts.blocked && isNew();          /* 45% block: no dep in new regime (A310) */
  const halfOK   = opts.half!==false;                /* Rate45 & Land carry no half-rate row */
  const wdv = N(b.WDVFirstDay);
  const adj = isNew()?N(b.AdjustmentSec115BAC):0;    /* 2nd proviso 115BAC WDV adj (new regime) */
  const tot3 = Math.max(0, wdv+adj);                          /* [F12] Total(3a+3b) */
  const add180 = N(b.AdditionsGrThan180Days), realTot = N(b.RealizationTotalPeriod);
  const fullBase = tot3 + add180 - realTot;
  const fullAmt = Math.max(0, fullBase);                      /* [F15] Sl.6 */
  const addLess = halfOK?N(b.AdditionsLessThan180Days):0, realLess = halfOK?N(b.RealizationPeriodLessThan180days):0;
  const halfAmt = halfOK?Math.max(0, addLess - realLess + Math.min(0,fullBase)):0;   /* [F18] Sl.9 */
  let depFull = Math.round(fullAmt*rate/100);                 /* [F19] Sl.10 */
  let depHalf = halfOK?Math.round(halfAmt*rate/200):0;        /* [F20] Sl.11 half = rate/200 */
  const addl1 = addlOK?N(b.AddlnDeprOnGT180DayAdditions):0;
  const addl2 = addlOK?N(b.AddlnDeprOnLessThan180DayAdditions):0;
  const addl3 = addlOK?N(b.AddlnDeprOnAssetLessThan180Days):0;
  if(blocked){depFull=0;depHalf=0;}
  const totDep = depFull+depHalf+addl1+addl2+addl3;           /* [F24] Sl.15 */
  const disallow = N(b.DepDisAllowUs38_2);                    /* Sl.16 */
  const netAgg = Math.max(0, totDep-disallow);               /* [F26] Sl.17 */
  const pro = N(b.ProportionateAggDepreciation);             /* Sl.18 */
  const wdvLast = Math.max(0, fullAmt+halfAmt-totDep);       /* [F30] (6+9-15) */
  const cg50 = sg(b.CapGainUs50);                            /* Sl.20 (may be negative) */
  return {rate,wdv,adj,tot3,add180,realTot,fullAmt,addLess,realLess,halfAmt,
    depFull,depHalf,addl1,addl2,addl3,totDep,disallow,netAgg,pro,wdvLast,cg50,
    dep:(pro>0?pro:netAgg)};   /* DEP summary: proportionate if >0 else net aggregate */
}

/* =====================================================================
   ENGINE
   ===================================================================== */
function engBp(){
  const B=S.bp||{};
  const nb=k=>N(B[k]), sgb=k=>sg(B[k]);

  /* ---------- ICDS (feeds BP 25 / 32) ---------- */
  const icds={rows:{}};
  let icdsInc=0, icdsDec=0;
  ICDS_ROWS.forEach(r=>{
    const o=(S.icds||{})[r[0]]||{};
    const inc=N(o.inc), dec=N(o.dec);
    icds.rows[r[0]]={inc:R(inc),dec:R(dec),net:R(inc-dec)};    /* [H6] Net = In - De */
    icdsInc+=inc; icdsDec+=dec;
  });
  icds.totInc=Math.max(0,R(icdsInc));   /* [F16] */
  icds.totDec=Math.max(0,R(icdsDec));   /* [G16] */
  icds.totNet=R(icdsInc-icdsDec);       /* [H16] */
  S.C.icds=icds;

  /* ---------- ESR (feeds BP 28 and 24e) ---------- */
  const esr={rows:{}}; let eDeb=0,eAllow=0,eExcess=0,eShort=0;
  ESR_ROWS.forEach(r=>{
    const o=(S.esr||{})[r[0]]||{};
    const deb=N(o.deb);
    let allow=N(o.allow);
    if(isNew()&&r[3])allow=0;                     /* A354: col-3 = 0 for gated rows, new regime */
    const excess=Math.max(0, allow-deb);          /* [G5] (4)=(3)-(2), floored 0 */
    if(allow-deb<0)eShort+=Math.abs(allow-deb);   /* neg (col3-col2) -> BP 24(e) */
    esr.rows[r[0]]={deb:R(deb),allow:R(allow),excess:R(excess),gatedZeroed:isNew()&&r[3]&&N(o.allow)>0};
    eDeb+=deb; eAllow+=allow; eExcess+=excess;
  });
  esr.totDeb=R(eDeb); esr.totAllow=R(eAllow); esr.totExcess=R(eExcess); esr.shortfall=R(eShort);
  S.C.esr=esr;

  /* ---------- DPM ---------- */
  const dpm={
    r15:bpBlock(S.dpm&&S.dpm.r15,15,{}),
    r30:bpBlock(S.dpm&&S.dpm.r30,30,{}),
    r40:bpBlock(S.dpm&&S.dpm.r40,40,{}),
    r45:bpBlock(S.dpm&&S.dpm.r45,45,{half:false,addl:false,blocked:true})   /* no half/addl; blocked new regime */
  };
  S.C.dpm=dpm;
  /* ---------- DOA ---------- */
  const landB=(S.doa&&S.doa.land)||{};
  const land={wdv:N(landB.WDVFirstDay),wdvLast:Math.max(0,N(landB.WDVFirstDay)),dep:0,cg50:0};  /* Nil rate [F55] */
  const doa={
    land:land,
    b5:bpBlock(S.doa&&S.doa.b5,5,{addl:false}),
    b10:bpBlock(S.doa&&S.doa.b10,10,{addl:false}),
    b40:bpBlock(S.doa&&S.doa.b40,40,{addl:false}),
    furn:bpBlock(S.doa&&S.doa.furn,10,{addl:false}),
    intang:bpBlock(S.doa&&S.doa.intang,25,{addl:false}),
    ships:bpBlock(S.doa&&S.doa.ships,20,{addl:false})
  };
  S.C.doa=doa;

  /* ---------- DEP (summary of depreciation, from DPM/DOA) ---------- */
  const dep={};
  dep.pm15=dpm.r15.dep; dep.pm30=dpm.r30.dep; dep.pm40=dpm.r40.dep; dep.pm45=dpm.r45.dep;
  dep.totPM=R(dep.pm15+dep.pm30+dep.pm40+dep.pm45);                 /* [J13] 1e */
  dep.b5=doa.b5.dep; dep.b10=doa.b10.dep; dep.b40=doa.b40.dep;
  dep.totBld=R(dep.b5+dep.b10+dep.b40);                            /* [J18] 2d */
  dep.furn=doa.furn.dep; dep.intang=doa.intang.dep; dep.ships=doa.ships.dep;
  dep.total=Math.max(0,R(dep.totPM+dep.totBld+dep.furn+dep.intang+dep.ships));   /* [J22] item 6 */
  S.C.dep=dep;

  /* ---------- DCG (deemed capital gains u/s 50, from DPM/DOA) ---------- */
  const dcg={};
  dcg.pm15=dpm.r15.cg50; dcg.pm30=dpm.r30.cg50; dcg.pm40=dpm.r40.cg50; dcg.pm45=dpm.r45.cg50;
  dcg.totPM=R(dcg.pm15+dcg.pm30+dcg.pm40+dcg.pm45);                /* [J34] */
  dcg.b5=doa.b5.cg50; dcg.b10=doa.b10.cg50; dcg.b40=doa.b40.cg50;
  dcg.totBld=R(dcg.b5+dcg.b10+dcg.b40);                            /* [J39] */
  dcg.furn=doa.furn.cg50; dcg.intang=doa.intang.cg50; dcg.ships=doa.ships.cg50;
  dcg.total=R(dcg.totPM+dcg.totBld+dcg.furn+dcg.intang+dcg.ships); /* [J43] (signed) */
  S.C.dcg=dcg;

  /* ---------- UD (unabsorbed depreciation / 35(4) allowance) ---------- */
  const ud={rows:[]};
  let tBF=0,tAdj=0,tSO=0,tBal=0,tBFa=0,tSOa=0,tBala=0;
  (S.ud&&S.ud.rows||[]).forEach(r=>{
    const bf=N(r.AmtBFUD), adj=isNew()?N(r.AdjustAccTax115BACAmt):0;   /* 3a only new regime (rule 624) */
    const so=N(r.AmtDeprSOCY), bal=Math.max(0, bf-adj-so);            /* [H8] (5)=(3)-(3a)-(4) */
    const bfa=N(r.AmtBFUAllow), soa=N(r.AmtAllowSOCY), bala=Math.max(0, bfa-soa);  /* [K8] (8)=(6)-(7) */
    ud.rows.push({ay:st0(r.AssYr),bf:R(bf),adj:R(adj),so:R(so),bal:R(bal),bfa:R(bfa),soa:R(soa),bala:R(bala)});
    tBF+=bf;tAdj+=adj;tSO+=so;tBal+=bal;tBFa+=bfa;tSOa+=soa;tBala+=bala;
  });
  ud.curDep=R(N(S.ud&&S.ud.curDep));    /* current AY balance CF (5) */
  ud.curAllow=R(N(S.ud&&S.ud.curAllow));/* current AY balance CF (8) */
  ud.totBF=R(tBF); ud.totAdj=R(tAdj); ud.totSO=R(tSO);
  ud.totBal=R(tBal+ud.curDep);          /* [H19] incl. current-year balance */
  ud.totBFa=R(tBFa); ud.totSOa=R(tSOa);
  ud.totBala=R(tBala+ud.curAllow);      /* [K19] incl. current-year balance */
  S.C.ud=ud;

  /* ================= BP LADDER — Part A ================= */
  const K5 = R(nb("pbt"));                                    /* 1 */
  const _2a = sgb("nplSpec"), _2b = sgb("nplSpecified");      /* 2a, 2b */
  const _3d = R(nb("a3di")+nb("a3dii"));                       /* 3d = div + other */
  const sum3 = R(nb("a3a")+nb("a3b")+nb("a3c")+_3d+nb("a3e")+nb("a3f")+nb("a3g"));
  const _4a = R(sgb("p44AD")+sgb("p44ADA")+sgb("p44AE")+sgb("p44B")+sgb("p44BB")+sgb("p44BBA")+sgb("p44BBC")+sgb("p44BBD")+sgb("p44DA")); /* [I18] */
  const _4b = R(nb("r7")+nb("r7A")+nb("r7B1")+nb("r7B1A")+nb("r8"));    /* [I29] */
  const othExemptTot = R((B.othExempt||[]).reduce((a,r)=>a+N(r.amt),0));
  const _5ciii = R(nb("divExempt")+othExemptTot);             /* [I46] */
  const _5d = R(nb("a5a")+nb("a5b")+_5ciii);                  /* [I47] 5d */
  const _5A = R(nb("a5A"));
  const _6 = R(K5 - _2a - _2b - sum3 - _4a - _4b - _5d - _5A);/* [K49] 6 */
  const _9 = R(nb("e7a")+nb("e7b")+nb("e7c")+nb("e7d")+nb("e7e")+nb("e7f")+nb("e7g")+nb("e8a")+nb("e8b")); /* [I60] 9 */
  const _10 = R(_6+_9);                                       /* [K61] 10 */
  const _11 = R(nb("depDebPL"));                              /* 11 */
  const _12i = R(dep.total>0?dep.total:0);                    /* [I64] 12i = DEP col6 */
  const _12ii = R(nb("dep32_1_i"));                           /* 12ii */
  const _12iii = R(_12i+_12ii);                              /* [K66] */
  const _13 = R(_10+_11-_12iii);                             /* [K67] 13 */
  const _20 = R(nb("deem41"));                                /* 20 */
  const _21 = Math.max(0, R(nb("d21_32AD")+nb("d21_33AB")+nb("d21_33ABA")+nb("d21_35ABA")+nb("d21_35ABB")+nb("d21_40A3A")+nb("d21_72A")+nb("d21_80HHD")+nb("d21_80IA"))); /* [I75] 21 */
  const e24e = R(nb("i24e") || esr.shortfall);               /* 24e (ESR neg (3-2) if not entered) */
  const _24 = R(nb("i24a")+nb("i24b")+nb("i24c")+nb("i24d")+e24e); /* [I88] 24 */
  const _25 = R(nb("i25")+icds.totInc);                      /* [K94] 25 (OI stock-dev + ICDS increase) */
  const _26 = R(nb("d14")+nb("d15")+nb("d16")+nb("d17")+nb("d18")+nb("d19")+_20+_21+nb("d22")+nb("d23")+_24+_25); /* [K95] 26 = 14..25 */
  const _28 = R(esr.totExcess);                              /* [I98] 28 = ESR X(4) */
  const _32 = R(nb("i32")+icds.totDec);                      /* [K106] 32 (OI stock-dev + ICDS decrease) */
  const _33 = R(nb("d27")+_28+nb("d29")+nb("d30")+nb("d31")+_32);  /* [K107] 33 = 27..32 */
  const _34 = R(_13+_26-_33);                                /* [K108] 34 = 13+26-33 */
  const _35 = Math.max(0, R(nb("d35_44AD")+nb("d35_44ADA")+nb("d35_44AE")+nb("d35_44B")+nb("d35_44BB")+nb("d35_44BBA")+nb("d35_44BBC")+nb("d35_44BBD")+nb("d35_44DA"))); /* [K122] 35viii */
  const _36 = R(_34+_35);                                    /* [K130] 36 = 34+35viii */
  const _37f = _36;                                          /* [I137] 37f = item 36 */
  const A37 = R(nb("r37a")+nb("r37b")+nb("r37c")+nb("r37d")+nb("r37e")+_37f);  /* [K131] A37 */
  const _38 = Math.max(0, R(_4b - (nb("r37a")+nb("r37b")+nb("r37c")+nb("r37d")+nb("r37e"))));   /* [K138] 38 */

  /* ================= Part B — speculative ================= */
  const _39 = _2a;                                           /* [K140] 39 = 2a */
  const _40 = R(nb("s40")), _41 = R(nb("s41"));
  const B42 = R(_39+_40-_41);                                /* [K143] B42 = 39+40-41 */

  /* ================= Part C — specified 35AD ================= */
  const _43 = _2b;                                           /* [K145] 43 = 2b */
  const _44 = R(nb("sp44")), _45 = R(nb("sp45"));
  const _46 = R(_43+_44-_45);                                /* [K148] 46 = 43+44-45 */
  const _47 = isNew()?0:R(nb("sp47"));                       /* A287: 35AD deduction barred new regime */
  const C48 = R(_46-_47);                                    /* [K152] C48 = 46-47 */

  /* ================= Part D ================= */
  const D = R(Math.max(0,C48)+Math.max(0,B42)+A37);          /* [K157] D = A37 + B42 + C48 */

  /* ================= Part E — intra-head set off ================= */
  const lossSetOff = Math.abs(Math.min(0, A37));             /* [I166] loss to set off */
  const specInc = Math.max(0, B42);                          /* [G167] */
  const specifiedInc = Math.max(0, C48);                     /* [G168] */
  const specSet = Math.min(lossSetOff, specInc);            /* [I167] */
  const specifiedSet = Math.min(lossSetOff-specSet, specifiedInc); /* [I168] */
  const totSet = R(specSet+specifiedSet);                    /* [I169] */
  const lossRemain = R(Math.max(0, lossSetOff-totSet));      /* [I170] */

  S.C.bp = {
    on:true,
    a:{K5,_2a,_2b,sum3,_3d,_4a,_4b,_5ciii,_5d,_5A,_6,_9,_10,_11,_12i,_12ii,_12iii,_13,
       _20,_21,e24e,_24,_25,_26,_28,_32,_33,_34,_35,_36,_37f,A37,_38},
    b:{_39,_40,_41,B42},
    c:{_43,_44,_45,_46,_47,C48},
    d:D,
    e:{lossSetOff,specInc,specifiedInc,specSet,specifiedSet,totSet,lossRemain},
    /* the head's signed contribution to Gross Total Income (rolled up by tax section) */
    income:D
  };
}

function depFold(){

  inner+=oneBlockTable("Rate 30%","dpm.r30",D.r30||{},{});
  inner+=oneBlockTable("Rate 40%","dpm.r40",D.r40||{},{});
  inner+=oneBlockTable("Rate 45% (no half-rate / additional; new regime: nil)","dpm.r45",D.r45||{},{half:false,addl:false});
  inner+=sub("Schedule DOA — Other assets");

    '<tr><td class="l">WDV on last day</td><td class="num">'+cell((O.land||{}).wdvLast)+'</td></tr></tbody></table></div>';
  inner+=oneBlockTable("Building @ 5%","doa.b5",O.b5||{},{addl:false});
  inner+=oneBlockTable("Building @ 10%","doa.b10",O.b10||{},{addl:false});
  inner+=oneBlockTable("Building @ 40%","doa.b40",O.b40||{},{addl:false});

  inner+=oneBlockTable("Intangible assets @ 25%","doa.intang",O.intang||{},{addl:false});
  inner+=oneBlockTable("Ships @ 20%","doa.ships",O.ships||{},{addl:false});
  /* DEP summary */
  inner+=sub("Schedule DEP — Summary of depreciation (computed)");
  inner+=summaryTable([["1a P&M @15%",dep.pm15],["1b P&M @30%",dep.pm30],["1c P&M @40%",dep.pm40],
    ["1d P&M @45%",dep.pm45],["1e Total P&M",dep.totPM],["2a Building @5%",dep.b5],["2b Building @10%",dep.b10],
    ["2c Building @40%",dep.b40],["2d Total building",dep.totBld],["3 Furniture & fittings",dep.furn],
    ["4 Intangible assets",dep.intang],["5 Ships",dep.ships],["6 Total depreciation → BP 12i",dep.total]]);
  /* DCG summary */
  inner+=sub("Schedule DCG — Deemed capital gains u/s 50 (computed, signed)");
  inner+=summaryTable([["1a P&M @15%",dcg.pm15],["1b P&M @30%",dcg.pm30],["1c P&M @40%",dcg.pm40],
    ["1d P&M @45%",dcg.pm45],["1e Total P&M",dcg.totPM],["2a Building @5%",dcg.b5],["2b Building @10%",dcg.b10],
    ["2c Building @40%",dcg.b40],["2d Total building",dcg.totBld],["3 Furniture & fittings",dcg.furn],
    ["4 Intangible assets",dcg.intang],["5 Ships",dcg.ships],["Total deemed capital gains",dcg.total]]);
  return fold("bp_dep","DPM · DOA · DEP · DCG","Depreciation & deemed capital gains",
    (dep.total?"Depreciation "+RS(dep.total):"Not entered"),inner);
}

function chkBp(){

    if(N(B.sp47))out.push({lvl:"warn",t:"35AD deduction closed",m:"In the new regime the deduction under section 35AD cannot be claimed (A287); item 47 is zeroed.",sec:"bp"});
  }else{
    if((S.ud&&S.ud.rows||[]).some(r=>N(r.AdjustAccTax115BACAmt)))out.push({lvl:"warn",t:"115BAC adjustment in old regime",m:"Schedule UD col (3a) 115BAC adjustment should be nil when the new regime is not opted (rule 624).",sec:"bp"});
  }

  if(ESR_ROWS.some(r=>["ii","iii","iv","vi"].indexOf(r[0])>=0 && N(((S.esr||{})[r[0]]||{}).allow)))
    out.push({lvl:"warn",t:"Schedule RA required",m:"A deduction is claimed under 35(1)(ii)/(iia)/(iii) or 35(2AA) — Schedule RA details are mandatory.",sec:"bp"});
  /* 5c dividend cannot exceed 3d(i) */

  /* UD: duplicate / out-of-range AY */
  const ays=(S.ud&&S.ud.rows||[]).map(r=>st0(r.AssYr)).filter(Boolean);
  if(new Set(ays).size<ays.length)out.push({lvl:"err",t:"Duplicate assessment year",m:"In Schedule UD the same assessment year cannot appear more than once.",sec:"bp"});
  if(ays.some(a=>!/^\d{4}-\d{2}$/.test(a)))out.push({lvl:"warn",t:"Check assessment year format",m:"Schedule UD assessment years must read like 2024-25.",sec:"bp"});
  if(ays.some(a=>/^\d{4}-\d{2}$/.test(a) && +a.slice(0,4)>2025))out.push({lvl:"err",t:"Assessment year too recent",m:"Schedule UD prior-year rows cannot exceed AY 2025-26.",sec:"bp"});
  /* UD current-year (5) vs BP 12iii */
  if(N(ud.curDep)>N(A._12iii)+0 && N(A._12iii)>0 && N(ud.curDep)>N(A._12iii))
    out.push({lvl:"warn",t:"UD current-year balance high",m:"Schedule UD current-year depreciation balance CF should not exceed BP item 12iii.",sec:"bp"});
  /* income summary */

    const d=S.C.bp.income;
    if(d<0)out.push({lvl:"ok",t:"Business loss",m:RS(-d)+" goes to Schedule CYLA / CFL for set off.",sec:"bp"});
    else if(d>0)out.push({lvl:"ok",t:"Business income",m:RS(d)+" chargeable under Profits and gains from Business or profession.",sec:"bp"});
  }
  return out;
}

  /* ---------- Manufacturing Account (Manufacturing_Account.md) ---------- */
  const mOpngTot=Math.max(0, G("mfg.OpeningInventory.OpngStckRawMat")+G("mfg.OpeningInventory.OpngStckWrkinPrgrs")); /* R8 1Aiii */

  const tOOR=SUM(A("trd.OtherOperatingRevenueDtls"),"OperatingRevenueAmt"); /* K14 4A(iiic) */

  const t12b=Math.min(G("trd.IncomeIntradayTrd"),G("trd.TurnoverIntradayTrd")||G("trd.IncomeIntradayTrd")); /* 12b <= 12a */

  St(p("CreditsToPL.GrossProfitTrnsfFrmTrdAcc"), gpTr);

  const profT=G(p("DebitsToPL.ProfessionalConstDtls.NonResOtherCompany"))+G(p("DebitsToPL.ProfessionalConstDtls.Others")); St(p("DebitsToPL.ProfessionalConstDtls.Total"),profT); /* L72 32iii */
  const rtE="DebitsToPL.RatesTaxesPays.ExciseCustomsVAT.";
  const rt44x=G(p(rtE+"UnionExciseDuty"))+G(p(rtE+"ServiceTax"))+G(p(rtE+"VATorSaleTax"))+G(p(rtE+"Cess"))+G(p(rtE+"CentralGoodServiceTax"))+G(p(rtE+"StateGoodServiceTax"))+G(p(rtE+"IntegratedGoodServiceTax"))+G(p(rtE+"UnionTerrGoodServiceTax"))+G(p(rtE+"OthDutyTaxCess")); /* L94 44x */

  const bd2=SUM(A(p("DebitsToPL.BadDebtDtls.OthersPANNotAvlblDtl")),"Amount"); St(p("DebitsToPL.BadDebtDtls.OthersPANNotAvlblDtlTotal"),bd2); /* Q122 47ii */
  const badTot=Math.max(0, bd1+bd2+G(p("DebitsToPL.BadDebtDtls.OthersAmtLt1Lakh"))); /* L124 47iv */
  St(p("DebitsToPL.BadDebtDtls.BadDebt"), badTot);
  const debHeads=G(p("DebitsToPL.Freight"))+G(p("DebitsToPL.ConsumptionOfStores"))+G(p("DebitsToPL.PowerFuel"))+G(p("DebitsToPL.RentExpdr"))+G(p("DebitsToPL.RepairsBldg"))+G(p("DebitsToPL.RepairMach"))+empT+insT+G(p("DebitsToPL.StaffWelfareExp"))+G(p("DebitsToPL.Entertainment"))+G(p("DebitsToPL.Hospitality"))+G(p("DebitsToPL.Conference"))+G(p("DebitsToPL.SalePromoExp"))+G(p("DebitsToPL.Advertisement"))+commT+royT+profT+G(p("DebitsToPL.HotelBoardLodge"))+G(p("DebitsToPL.TravelExp"))+G(p("DebitsToPL.ForeignTravelExp"))+G(p("DebitsToPL.ConveyanceExp"))+G(p("DebitsToPL.TelephoneExp"))+G(p("DebitsToPL.GuestHouseExp"))+G(p("DebitsToPL.ClubExp"))+G(p("DebitsToPL.FestivalCelebExp"))+G(p("DebitsToPL.Scholarship"))+G(p("DebitsToPL.Gift"))+G(p("DebitsToPL.Donation"))+rt44x+G(p("DebitsToPL.AuditFee"))+oExp+badTot+G(p("DebitsToPL.ProvForBadDoubtDebt"))+G(p("DebitsToPL.OthProvisionsExpdr")); /* item 50 denominator */

/* helper: does an object subtree carry any nonzero number / any array row? */
function _bpaHas(o){
  if(o==null)return false;
  if(Array.isArray(o))return o.length>0;
  if(typeof o==="object")return Object.keys(o).some(k=>_bpaHas(o[k]));
  if(typeof o==="number")return R(o)!==0;
  return st0(o)!=="";
}

/* ================================================================
   exp — write the eight schema blocks. Leaf coercion by key name.
   ================================================================ */
const BPA_STR=["MethodOfAcct","ChangeInAcctMethFlg","ValRawMaterial","ValFinishedGoods","ChngStockValMetFlg","ScheduleTPSAFlg","OperatingRevenueName","NatureOfIncome","ExpenseNature","Code","TradeName1","Description","NameOfBusiness","CodeAD","CodeADA","CodeAE","RegNumberGoodsCarriage","OwnedLeasedHiredFlag","Section","ItemName","UnitOfMeasure","GSTINNo","PAN","Aadhaar","Name","FlatDoorBlockNumber","PremisesBuildingName","RoadStreetPostOffice","AreaLocality","TownCityDistrict","StateCode","CountryCode","ZipCode","AnyCompPaidToNonRes"];
const BPA_FLOAT=["PercentYld","TonnageCapacity"];
function _bpaVal(k,v){
  if(BPA_STR.indexOf(k)>=0){const s=st0(v);return s||undefined;}
  if(BPA_FLOAT.indexOf(k)>=0){return N(v);}
  return R(N(v)); /* integer */
}
function _bpaNode(o){                        /* coerce an object subtree */
  const out={};
  for(const k in o){const v=o[k];
    if(Array.isArray(v)){const rows=v.map(_bpaNode).filter(r=>r&&Object.keys(r).length);if(rows.length)out[k]=rows;}
    else if(v&&typeof v==="object"){const sub=_bpaNode(v);if(sub&&Object.keys(sub).length)out[k]=sub;}
    else{const cv=_bpaVal(k,v);if(cv!==undefined)out[k]=cv;}}
  return out;
}
function _bpaAssign(t,s){                     /* merge coerced values over SKEL defaults */
  for(const k in s){
    if(Array.isArray(s[k]))t[k]=s[k];
    else if(s[k]&&typeof s[k]==="object"){if(typeof t[k]!=="object"||!t[k]||Array.isArray(t[k]))t[k]={};_bpaAssign(t[k],s[k]);}
    else t[k]=s[k];}
}
function expBpa(j){
  const B=S.bpa;
  /* BS and PL live in SKEL and are required — merge onto the zero skeleton */
  _bpaAssign(j.PARTA_BS, _bpaNode(B.bs));
  _bpaAssign(j.PARTA_PL, _bpaNode(B.pl));
  /* the rest are emitted only when they carry data (rule: block only with a value) */
  if(_bpaHas(B.mfg)) j.ManufacturingAccount=_bpaNode(B.mfg);
  if(_bpaHas(B.trd)) j.TradingAccount=_bpaNode(B.trd);
  if(_bpaHas(B.oi))  j.PARTA_OI=_bpaNode(B.oi);
  /* Quantitative details */
  const qd={};
  if((B.qd.trd||[]).length) qd.TradingConcern={QuantitDet:B.qd.trd.map(_bpaNode).filter(r=>Object.keys(r).length)};
  const mc={};
  if((B.qd.raw||[]).length) mc.RawMaterial={QuantitDet:B.qd.raw.map(_bpaNode).filter(r=>Object.keys(r).length)};
  if((B.qd.fin||[]).length) mc.FinishrByProd={QuantitDet:B.qd.fin.map(_bpaNode).filter(r=>Object.keys(r).length)};
  if(Object.keys(mc).length) qd.ManfactrConcern=mc;
  if(Object.keys(qd).length) j.PARTA_QD=qd;
  /* GST */
  const gst=(B.gst||[]).map(_bpaNode).filter(r=>Object.keys(r).length);
  if(gst.length) j.ScheduleGST={TurnoverGrsRcptForGSTIN:gst};

/* ================================================================
   chk — the sheet's own rules as live messages (from the books).
   ================================================================ */
function chkBpa(){
  const out=[], B=S.bpa, V=p=>N(get("bpa."+p)), C=S.C.bpa||{};
  /* Part A - BS A52 (vbCritical): sources must equal application */
  if(_bpaHas(B.bs) && C.bsMismatch)
    out.push({lvl:"err",t:"Balance sheet does not balance",m:"Sources of funds ("+RS(C.fundSrc)+") must equal application of funds ("+RS(C.fundApply)+") — Part A-BS rule A52.",sec:"bpa"});
  /* Trading 12b<=12a, 12d<=12c */
  if(V("trd.IncomeIntradayTrd")>V("trd.TurnoverIntradayTrd"))
    out.push({lvl:"warn",t:"Intraday income exceeds turnover",m:"Item 12b (income from intraday) cannot exceed item 12a (turnover).",sec:"bpa"});
  if(V("trd.IncomeFutureTrd")>V("trd.TurnoverFutureTrd"))
    out.push({lvl:"warn",t:"F&O income exceeds turnover",m:"Item 12d (income from F&O) cannot exceed item 12c (turnover).",sec:"bpa"});
  /* Nature of business: duplicate Code not allowed (VBA) */
  const codes=(B.nob||[]).map(r=>st0(r.Code)).filter(Boolean);
  if(new Set(codes).size<codes.length)
    out.push({lvl:"err",t:"Duplicate business code",m:"Duplicate Code-Sub Sector is not allowed in Nature of business.",sec:"bpa"});
  /* Presumptive: selecting a code makes that section's income mandatory (n=105/107/109) */
  if((B.pl.NatOfBus44AD||[]).some(r=>st0(r.CodeAD)) && !V("pl.PersumptiveInc44AD.TotPersumptiveInc44AD"))
    out.push({lvl:"err",t:"44AD income missing",m:"A 44AD business code is selected, so presumptive income u/s 44AD (61ii) must be declared.",sec:"bpa"});
  if((B.pl.NatOfBus44ADA||[]).some(r=>st0(r.CodeADA)) && !V("pl.PersumptiveInc44ADA.TotPersumptiveInc44ADA"))
    out.push({lvl:"err",t:"44ADA income missing",m:"A 44ADA business code is selected, so presumptive income u/s 44ADA (62ii) must be declared.",sec:"bpa"});
  if((B.pl.NatOfBus44AE||[]).some(r=>st0(r.CodeAE)) && !V("pl.TotalPrsumptvIncUs44E"))
    out.push({lvl:"err",t:"44AE income missing",m:"A 44AE business code is selected, so presumptive income u/s 44AE (63ii) must be declared.",sec:"bpa"});
  /* 44AD turnover caps */
  if(V("pl.PersumptiveInc44AD.GrsTrnOverOrReceipt")>30000000)
    out.push({lvl:"warn",t:"44AD turnover above cap",m:"Gross turnover u/s 44AD exceeds Rs 3 crore — tax audit u/s 44AB is mandatory.",sec:"bpa"});
  if(V("pl.PersumptiveInc44ADA.GrsReceipt")>7500000)
    out.push({lvl:"warn",t:"44ADA receipts above cap",m:"Gross receipts u/s 44ADA exceed Rs 75 lakh — tax audit is mandatory.",sec:"bpa"});
  /* 44AE: total months <=120; more than 10 carriages -> books/audit */
  if(V("pl.TotalNumOfMonths")>120)
    out.push({lvl:"err",t:"44AE months exceed 120",m:"Total months of goods carriages (column 4) cannot exceed 120.",sec:"bpa"});
  if((B.pl.GoodsDtlsUs44AE||[]).length>10)
    out.push({lvl:"warn",t:"More than 10 goods carriages",m:"Owning/leasing/hiring more than 10 goods carriages bars 44AE — maintain books and get them audited.",sec:"bpa"});
  /* Registration number must not repeat */
  const regs=(B.pl.GoodsDtlsUs44AE||[]).map(r=>st0(r.RegNumberGoodsCarriage)).filter(Boolean);
  if(new Set(regs).size<regs.length)
    out.push({lvl:"err",t:"Duplicate goods-carriage registration",m:"Registration number of a goods carriage must not repeat (item 63i).",sec:"bpa"});
  /* 92CE(2A) option -> Schedule TPSA */
  if(st0(get("bpa.oi.ScheduleTPSAFlg"))==="Yes")
    out.push({lvl:"warn",t:"Schedule TPSA required",m:"Option u/s 92CE(2A) is 'Yes' — Schedule TPSA must be filled.",sec:"bpa"});
  return out;
}
