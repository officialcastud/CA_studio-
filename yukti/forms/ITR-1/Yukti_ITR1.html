<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YUKTI Tax Compliance — ITR-2, A.Y. 2026-27</title>
<style>
:root{
  --maroon:#7A1F2B; --maroon-d:#5C1720; --maroon-w:#F6EBEC;
  --white:#FFFFFF; --bone:#F5F4F1; --rule:#DCDCD6; --rule-2:#EDEBE6;
  --ink:#16161A; --ink-2:#4A4A52; --ink-3:#7C7C86;
  --red:#C0392B; --green:#1C5D4A; --green-w:#E9F1EE;
  --sienna:#9C4A15; --sienna-w:#FAEFE6;
  --field:#FFFEF9; --field-b:#C9C3AD; --closed:#F0EFEB;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"SF Mono",Consolas,"DejaVu Sans Mono",monospace;
  --rail:268px; --top:52px; --band:54px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bone);color:var(--ink);font:13.5px/1.45 var(--sans);
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--maroon);outline-offset:1px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* masthead — three things and nothing else */
.top{position:fixed;inset:0 0 auto 0;height:var(--top);z-index:60;background:var(--maroon);
  color:#fff;display:flex;align-items:center;gap:26px;padding:0 20px;
  border-bottom:2px solid var(--maroon-d)}
.top .b{font:600 19px/1 var(--serif);letter-spacing:.3px;white-space:nowrap}
.top .b em{font-style:normal;opacity:.64;font-size:12.5px;font-family:var(--sans);
  font-weight:400;margin-left:9px}
.top .frm{font:600 17px/1 var(--serif)}
.top .y{font-size:13px;opacity:.76;white-space:nowrap}
.top .sp{flex:1}
.tbtn{height:28px;padding:0 13px;white-space:nowrap;border:1px solid rgba(255,255,255,.42);border-radius:3px;
  font-size:12.5px;font-weight:500}
.tbtn:hover{background:rgba(255,255,255,.14)}
.tbtn.solid{background:#fff;color:var(--maroon);border-color:#fff;font-weight:600}
.tbtn.solid:hover{background:#F0E2E4}

/* index rail */
.rail{position:fixed;top:var(--top);bottom:var(--band);left:0;width:var(--rail);z-index:40;
  background:var(--bone);border-right:1px solid var(--rule);overflow-y:auto;padding:10px 0 20px}
.rail h2{font:500 10.5px/1 var(--sans);color:var(--ink-3);letter-spacing:.7px;padding:9px 18px 8px}
.nv{display:block;width:100%;text-align:left;padding:8px 16px 8px 15px;
  border-left:3px solid transparent;position:relative}
.nv:hover{background:#ECEAE5}
.nv.on{background:var(--white);border-left-color:var(--maroon)}
.nv .t{display:block;font:600 13.5px/1.25 var(--serif)}
.nv.on .t{color:var(--maroon)}
.nv .s{display:block;font-size:11px;color:var(--ink-3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nv .s.done{color:var(--green)} .nv .s.bad{color:var(--red);font-weight:600}

/* the sheet */
.wrap{position:absolute;top:var(--top);left:var(--rail);right:0;bottom:var(--band);
  overflow-y:auto;background:var(--bone)}
.sheet{max-width:1080px;margin:0 auto;padding:22px 26px 70px}

/* a section: maroon bar that opens and shuts */
section{background:var(--white);border:1px solid var(--rule);border-radius:3px;
  margin:0 0 14px;overflow:hidden;scroll-margin-top:14px}
.bar{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--maroon);color:#fff;padding:10px 14px}
.bar:hover{background:#8B2532}
.bar .cv{width:17px;height:17px;flex:none;border:1px solid rgba(255,255,255,.5);
  border-radius:2px;font-size:12px;line-height:15px;text-align:center}
.bar .t{font:600 15px/1.2 var(--serif);flex:1}
.bar .r{font-size:11.5px;opacity:.72;flex:none}
.bar .v{font:600 14px/1 var(--mono);flex:none;margin-left:14px}
.body{display:none;padding:4px 0 10px}
.body.open{display:block}

/* rows */
.r{display:flex;align-items:center;min-height:33px;border-bottom:1px solid var(--rule-2);
  padding:0 14px;gap:9px}
.r:hover{background:#FBFAF8}
.r.sub{background:#F7F6F3;min-height:28px}
.r.sub .l{font-weight:600;font-size:12px;color:var(--ink-2)}
.r.tot{border-top:1px solid var(--ink);border-bottom:2px solid var(--ink);background:#F7F6F3}
.r.tot .l,.r.tot .v{font-weight:700}
.r.grand{background:var(--maroon-w);border-top:1px solid var(--maroon);
  border-bottom:2px solid var(--maroon)}
.r.grand .l,.r.grand .v{font-weight:700;color:var(--maroon-d)}
.r.closed{background:var(--closed);opacity:.72}
.l{flex:1;min-width:0;padding:5px 0;font-size:13.5px}
.l.req{color:var(--red);font-weight:600}
.l .i1{padding-left:20px;display:inline-block}
.l .hint{color:var(--ink-3);font-size:11px;font-weight:400;margin-left:7px}
.ref{flex:none;width:52px;font-size:11px;color:var(--ink-3);font-family:var(--serif)}
.v{flex:none;width:160px;text-align:right}
.v2{flex:none;width:150px;text-align:right}
.hd2{font-size:10.5px;color:var(--ink-3);font-weight:600}

/* fields */
.f{width:100%;height:27px;padding:0 7px;border:1px solid var(--field-b);border-radius:2px;
  background:var(--field);font-size:13.5px}
.f:focus{border-color:var(--maroon);background:#fff}
.f.n{text-align:right;font-family:var(--mono);font-size:13px}
.f.over{background:var(--sienna-w);border-color:#D8B492;color:var(--sienna)}
.f[disabled]{background:var(--closed);color:var(--ink-3);cursor:not-allowed}
select.f{padding:0 4px;cursor:pointer}
.c{display:block;font-family:var(--mono);font-size:13px;color:var(--green);
  padding:5px 7px 5px 0;font-weight:600}
.c.zero{color:#B4B4BB;font-weight:400} .c.neg{color:var(--red)}
.dt{font-size:10.5px;color:var(--ink-3);display:block;text-align:right;margin-top:1px}

/* optional card */
.card{margin:8px 14px;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.card .ch{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 12px;background:#FAF9F6}
.card .ch:hover{background:#F3F1EC}
.card.on .ch{background:var(--maroon-w);border-bottom:1px solid var(--rule)}
.card .ch .sw{width:34px;height:18px;flex:none;border-radius:9px;background:#CFCCC4;
  position:relative;transition:background .12s}
.card.on .ch .sw{background:var(--maroon)}
.card .ch .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;
  border-radius:50%;background:#fff;transition:left .12s}
.card.on .ch .sw::after{left:18px}
.card .ch .t{flex:1;font:600 13px/1.2 var(--serif)}
.card .ch .st{font-size:11.5px;color:var(--ink-3);flex:none}
.card.on .ch .st{color:var(--maroon-d);font-weight:600;font-family:var(--mono)}
.card .cb{display:none;padding:4px 0 8px} .card.on .cb{display:block}

/* tables */
.gt{width:100%;border-collapse:collapse;margin:4px 0}
.gt th{font-size:10.5px;font-weight:600;color:var(--ink-2);text-align:right;padding:6px 7px;
  border-bottom:1px solid var(--ink);white-space:nowrap}
.gt th.l,.gt td.l{text-align:left}
.gt th.req{color:var(--red)}
.gt td{padding:2px 4px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
.gt td.num{padding:5px 7px;text-align:right}
.gt tfoot td{border-top:1px solid var(--ink);border-bottom:2px solid var(--ink);
  background:#F7F6F3;font-weight:700;padding:6px 7px;text-align:right}
.gt tfoot td.l{text-align:left}
.gt .x{width:28px;text-align:center}
.gt .x button{color:var(--ink-3);font-size:15px;line-height:1;padding:2px 5px;border-radius:2px}
.gt .x button:hover{background:var(--maroon-w);color:var(--maroon)}
.gt .f{height:25px}
.full{overflow-x:auto;padding:0 14px}
.add{margin:5px 14px 2px;height:27px;padding:0 13px;border:1px solid var(--maroon);
  border-radius:3px;color:var(--maroon);font-size:12.5px;font-weight:600;background:#fff}
.add:hover{background:var(--maroon);color:#fff}
.emp{padding:13px 6px;color:var(--ink-3);font-size:12.5px;font-style:italic}

/* property block */
.blk{margin:8px 14px;border:1px solid var(--rule);border-radius:3px}
.blk .bh{display:flex;align-items:center;gap:6px;padding:0 8px 0 0;background:#FAF9F6;
  border-bottom:1px solid var(--rule)}
.blk .bhx{flex:1;display:flex;align-items:center;gap:10px;padding:8px 12px;text-align:left;
  background:none;border:0;cursor:pointer;font:inherit}
.blk .bhx:hover{background:#F1EFEA}
.blk .cv2{width:16px;height:16px;flex:none;border:1px solid var(--rule);border-radius:2px;
  font-size:12px;line-height:14px;text-align:center;color:var(--ink-3)}
.blk .blkdel{flex:none;color:var(--ink-3);padding:6px 8px;border-radius:3px;cursor:pointer}
.blk .blkdel:hover{background:var(--maroon-w);color:var(--maroon)}
.blk .bh .t{flex:1;font:600 13px/1.2 var(--serif)}
.blk .bh .s{font-size:11.5px;color:var(--ink-3)}
.blk .bb{display:none;padding:2px 0 6px} .blk.on .bb{display:block}

/* notes and checks */
.note{border-left:3px solid var(--rule);padding:9px 13px;margin:9px 14px;font-size:12.5px;
  color:var(--ink-2);background:#FAF9F6;max-width:74ch}
.note.warn{border-left-color:var(--sienna);background:var(--sienna-w);color:#6B3410}
.note.stop{border-left-color:var(--red);background:var(--maroon-w);color:var(--maroon-d)}
.note.form{border-left-color:var(--maroon);background:var(--maroon-w);color:var(--maroon-d)}
.note b{font-weight:600}
.cks{margin:10px 14px 4px;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.ck{padding:8px 12px;border-bottom:1px solid var(--rule-2);font-size:12.5px;display:flex;
  gap:10px;align-items:baseline}
.ck:last-child{border-bottom:0}
.ck b{flex:none;width:180px;font-weight:600} .ck span{flex:1}
.ck.err{border-left:3px solid var(--red);background:var(--maroon-w)} .ck.err b{color:var(--maroon-d)}
.ck.warn{border-left:3px solid var(--sienna);background:var(--sienna-w)} .ck.warn b{color:#6B3410}
.ck.ok{border-left:3px solid var(--green);background:var(--green-w)} .ck.ok b{color:var(--green)}

/* capital-gains nesting */
.cgband{background:var(--maroon);color:#fff;font:600 14px/1 var(--serif);padding:9px 14px;
  margin:14px 0 0;border-radius:3px 3px 0 0}
.cgsubband{font:600 12.5px/1 var(--serif);color:var(--maroon-d);background:var(--maroon-w);
  padding:8px 14px;margin:10px 0 0;border-left:3px solid var(--maroon)}
.cghead{border:1px solid var(--rule);border-top:0}
.cgh{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 14px;
  background:#F7F6F3;border:0;cursor:pointer;font:inherit;border-bottom:1px solid var(--rule)}
.cgh:hover{background:#F1EFEA}
.cght{flex:1;font:600 13.5px/1.2 var(--serif)}
.cghv{font:600 14px/1 var(--mono);color:var(--green)}
.cghb{display:none;padding:2px 0 8px} .cghb.open{display:block}
.sub2{margin:6px 14px;border:1px solid var(--rule-2);border-radius:3px;overflow:hidden}
.s2h{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 11px;
  background:#FBFAF8;border:0;cursor:pointer;font:inherit}
.s2h:hover{background:#F4F2EC}
.sub2.on .s2h{background:var(--maroon-w);border-bottom:1px solid var(--rule-2)}
.cv3{width:15px;height:15px;flex:none;border:1px solid var(--rule);border-radius:2px;
  font-size:11px;line-height:13px;text-align:center;color:var(--ink-3)}
.s2ref{flex:none;width:34px;font:600 11px/1 var(--serif);color:var(--ink-3)}
.s2t{flex:1;font-size:13px}
.s2v{font-size:11.5px;color:var(--ink-3)}
.sub2.on .s2v{color:var(--maroon-d);font-family:var(--mono)}
.s2b{display:none;padding:2px 0 6px} .s2b.open{display:block}

/* the band */
.band{position:fixed;left:0;right:0;bottom:0;height:var(--band);z-index:60;
  background:var(--maroon);color:#fff;display:flex;align-items:center;padding:0 18px;
  border-top:2px solid var(--maroon-d)}
.m{flex:none;padding-right:22px;margin-right:22px;border-right:1px solid rgba(255,255,255,.22)}
.m:last-of-type{border-right:0}
.m span{display:block;font-size:10.5px;color:rgba(255,255,255,.66);margin-bottom:1px;white-space:nowrap}
.m b{display:block;font:600 16px/1.1 var(--mono);white-space:nowrap}
.m.pay b{color:#FFD9A0} .m.ref b{color:#A8E6C9}
.gap{flex:1}
.st{font-size:11.5px;color:rgba(255,255,255,.82);text-align:right;line-height:1.35;white-space:nowrap}
.st b{color:#fff}
.st a{color:#FFD9A0;cursor:pointer;text-decoration:underline}
@media(max-width:900px){:root{--rail:0px}.rail{display:none}.sheet{padding:16px 12px 60px}}
</style></head><body>

<header class="top">
  <div class="b">YUKTI<em>Tax Compliance</em></div>
  <div class="frm" id="frm">ITR-X</div>
  <div class="y" id="ay">A.Y. 2026-27</div>
  <div class="sp"></div>
  <button class="tbtn" id="b_open">Open file</button>
  <button class="tbtn" id="b_save">Save file</button>
  <button class="tbtn solid" id="b_json">Export return</button>
</header>

<nav class="rail"><h2>SECTIONS</h2><div id="nav"></div></nav>
<main class="wrap" id="wrap"><div class="sheet" id="sheet"></div></main>

<footer class="band">
  <div class="m"><span>Gross total income</span><b id="s_gti">—</b></div>
  <div class="m"><span>Total income</span><b id="s_ti">—</b></div>
  <div class="m"><span>Tax and cess</span><b id="s_tax">—</b></div>
  <div class="m" id="s_bw"><span id="s_bl">Balance payable</span><b id="s_b">—</b></div>
  <div class="gap"></div>
  <div class="st" id="s_st"></div>
</footer>

<input type="file" id="filepick" accept=".json,.yukti" hidden>
<script>
/* =====================================================================
   ITR-1 (SAHAJ) · A.Y. 2026-27 — base scaffold (STUB).
   ITR-1 is the return for a RESIDENT INDIVIDUAL (ordinarily resident,
   not a director, no unlisted equity, income up to Rs.50 lakh) with
   income from salary/pension, one house property, other sources
   (interest, dividend, family pension) and long-term capital gains u/s
   112A up to Rs.1.25 lakh. Every on-screen section is present with its
   title and a "being built" placeholder body; the real fields, engines,
   exports, imports and rule bodies arrive in the section-builder phase.
   Modelled on forms/ITR-7/src/00_form.js (the shell reg() contract) with
   the ITR-1 tax ladder from forms/ITR-1/Yukti_ITR1_prev.html.
   ===================================================================== */
/* FORM.due = 2026-07-31 is the ITR-1 filer's ordinary 139(1) due date:
   a resident individual filing ITR-1 has no accounts to audit and no 92E
   report, so the utility's finalDuedate carries the 31/07/2026 literal.
   (The audit / 92E branches of finalDuedate never apply to an ITR-1
   filer — those cases fall out of ITR-1 eligibility entirely.)
   FORM.sw is the CBDT software-vendor id emitted into CreationInfo; it
   matches the schema pattern [S][W][0-9]{8} and equals the SKEL default. */
window.FORM={id:"ITR-1",name:"ITR-1",ay:"2026-27",sw:"SW10000000",due:"2026-07-31"};

/* ---- code tables the shell's commit() reads (00_form.js contract) ----
   When the filer edits pi.pin the shell resolves the PIN's first two
   digits to a state code (PIN2ST); when the filer edits a bank row's IFSC
   the shell resolves the first four characters to a bank name (BANK).
   Both are lifted verbatim from the prior functional builder. */
const PIN2ST={"11":"09","12":"12","13":"12","14":"26","15":"26","16":"06","17":"13","18":"14",
"19":"14","20":"31","21":"31","22":"31","23":"31","24":"31","25":"34","26":"34","27":"31",
"28":"31","30":"27","31":"27","32":"27","33":"27","34":"27","36":"11","37":"11","38":"11",
"39":"11","40":"19","41":"19","42":"19","43":"19","44":"19","45":"18","46":"18","47":"18",
"48":"18","49":"33","50":"36","51":"02","52":"02","53":"02","56":"15","57":"15","58":"15",
"59":"15","60":"29","61":"29","62":"29","63":"29","64":"29","67":"16","68":"16","69":"16",
"70":"32","71":"32","72":"32","73":"32","74":"32","75":"24","76":"24","77":"24","78":"04",
"79":"03","80":"05","81":"05","82":"05","83":"35","84":"05","85":"05"};   /* PIN first-two-digits -> state code */
const BANK={ABHY:"Abhyudaya Co-op Bank",AUBL:"AU Small Finance Bank",BARB:"Bank of Baroda",
BDBL:"Bandhan Bank",BKID:"Bank of India",CBIN:"Central Bank of India",CIUB:"City Union Bank",
CNRB:"Canara Bank",CSBK:"CSB Bank",DBSS:"DBS Bank India",DCBL:"DCB Bank",
ESFB:"Equitas Small Finance Bank",FDRL:"Federal Bank",HDFC:"HDFC Bank",HSBC:"HSBC India",
IBKL:"IDBI Bank",ICIC:"ICICI Bank",IDFB:"IDFC FIRST Bank",INDB:"IndusInd Bank",
IOBA:"Indian Overseas Bank",IDIB:"Indian Bank",JAKA:"Jammu & Kashmir Bank",KARB:"Karnataka Bank",
KKBK:"Kotak Mahindra Bank",KVBL:"Karur Vysya Bank",MAHB:"Bank of Maharashtra",
PSIB:"Punjab & Sind Bank",PUNB:"Punjab National Bank",RATN:"RBL Bank",SBIN:"State Bank of India",
SIBL:"South Indian Bank",SRCB:"Saraswat Co-op Bank",TMBL:"Tamilnad Mercantile Bank",
UBIN:"Union Bank of India",UCBA:"UCO Bank",UTIB:"Axis Bank",
UTKS:"Utkarsh Small Finance Bank",YESB:"YES Bank"};   /* IFSC first-four-chars -> bank name */

/* =====================================================================
   Registry — every section self-registers here, so section files never
   edit a shared file. Load order (assemble globs *.js by name):
   00_form < 08_registry < 10_state < 20_engine_<id> < 30_sec_<id>
   < 40_exp_<id> < 50_imp_<id> < 55_chk_<id> < 60_rules < 90_wiring.
   Section files run reg({...}) at load; 90_wiring consumes the arrays.
   Copied from forms/ITR-7/src/08_registry.js — this is the shell reg()
   contract, not form-specific — with the ITR-1 screen order.
   ===================================================================== */
const _SECREG=[];            /* {id,t,ref,f,s,eng,exp,imp,chk,order,corder} */
/* screen order from books/ITR-1/sections.md + section_map.json (the 10
   sections). The utility's own tab flow: Personal info -> Filing status &
   regime -> the income heads (salary, house property, other sources) ->
   Chapter-VI-A deductions -> exempt income -> Part B tax computation ->
   taxes paid -> bank & verification. */
const SCREEN_ORDER=["who","ret","sal","hp","os","ded","ei","tax","paid","bank"];
function reg(o){_SECREG.push(o);}   /* a section-builder calls reg({id, t, ref, f:sec<Id>, s, eng:eng<Id>, exp:exp<Id>, imp:imp<Id>, chk:chk<Id>, order, corder}) */

/* pf: put onto a local (array-element) object — same as put, but named so the gate
   duplicate-writer grep (which scans `put(x,"key"`) does not false-flag the same
   leaf key written onto different array elements/blocks. Real full-path stale
   writes onto j still use put() and are still checked. */
function pf(o,p,v){return put(o,p,v);}

/* Rule batches: additional runRules checks live in 61_rules_*.js files, each
   calling ruleset(fn). runRules() runs them all with its A/Dd collectors, so the
   rule set can be extended in disjoint files (parallel encoding, no conflicts). */
const _RULEBATCHES=[];
function ruleset(fn){_RULEBATCHES.push(fn);}

/* =====================================================================
   State, seeds and the schema skeleton (ITR-1 base scaffold — STUB).
   ITR-1 (SAHAJ) is the return for a resident individual. Modelled on
   forms/ITR-7/src/10_state.js.
   ===================================================================== */
/* S — the working state. The shell contract (shell/README.md) requires
   meta, pi, fs, bank, ver, open:{} and C:{}; those are seeded enough that
   compute() and buildReturn() never throw; every real field is added in
   the section-builder phase. The per-screen-section namespaces (who/ret/
   sal/hp/os/ded/ei/tax/paid) are intentionally NOT pre-seeded here: each
   section builder initialises its own with `S.<ns> = S.<ns> || {..defaults}`,
   and a `{}` placeholder is truthy — it would short-circuit that `||` and
   drop the section's defaults (the ITR-6 lesson). Left undefined so each
   section's own seed runs. `bank` is both the shell array and the bank
   (verification) section's namespace, so it is seeded as [].
   Defaults below are the shell-contract identity for a resident individual:
   OptOutNewTaxRegime "No" (new regime, the A.Y. 2026-27 default), filing
   section 11 (139(1)), verification capacity "S" (self) — schema-valid. */
const S={
  meta:{app:"yukti",form:"ITR-1",ay:"2026-27",ver:1},
  /* shell-contract identity: the individual's personal-info fields the shell reads */
  pi:{first:"",mid:"",last:"",name:"",pan:"",dob:"",aadhaar:"",
      addr:"",locality:"",city:"",state:"",pin:"",mobile:"",email:"",empcat:"OTH"},
  fs:{optout:"No",retsec:11,filed:""},   /* optout "No" => new regime (default); isNew()===true */
  bank:[],        /* shell array; also the 'bank' (verification) section's namespace */
  ver:{cap:"S"},  /* verification capacity: S = self */
  open:{}, C:{}
};

/* =====================================================================
   ITR-1 · A.Y. 2026-27 — the rule driver (the rule bodies arrive later).
   runRules(I,S_) returns [{cat:"A"|"D", n, msg}] — one entry per rule whose
   lawful assertion is FALSE (a violation). I is the built ITR1 object (schema
   keys); S_ is the live state. Every actual CBDT check lives in the
   61_rules_*.js ruleset() batches (Category A blocking, Category D advisory),
   registered into _RULEBATCHES (08_registry.js); they are encoded later from
   each rule's own text, with guarded reads (RG / (X||{})).

   This scaffold ships the DRIVER only. Fault tolerance is PER RULE, following
   the fixed forms/ITR-7/src/60_rules.js: each A()/Dd() assertion is evaluated
   inside its own try/catch, so one rule that throws (e.g. on a wrong-typed
   imported field) is skipped — and recorded as an advisory — without aborting
   the sibling rules that follow it in the same batch. A rule may pass its
   condition either as a value (evaluated eagerly by the batch) or as a thunk
   `()=>cond` (evaluated here, which gives a throwing rule true per-rule
   isolation). A batch-level try/catch is retained only as a backstop for a
   fault in a batch's shared setup.

   RG / N / RSUM / REQ / isNew and the other helpers come from the shell
   (shell/shell.js); the rules do not redefine them.
   ===================================================================== */
function runRules(I,S_){
  I=I||{};
  const out=[];
  const fire=(cat,n,cond,msg)=>{
    let c;
    try{ c=(typeof cond==="function")?cond():cond; }
    catch(e){ out.push({cat:"D", n:n, msg:"[rule "+n+" skipped — "+((e&&e.message)||e)+"]"}); return; }  /* a throwing rule is skipped & recorded, never aborts its siblings */
    if(!c) out.push({cat:cat, n:n, msg:msg});
  };
  const A =(n,cond,msg)=>fire("A",n,cond,msg);   /* Category A — return not allowed to upload */
  const Dd=(n,cond,msg)=>fire("D",n,cond,msg);   /* Category D — advisory / may be defective u/s 139(9) */
  if(typeof _RULEBATCHES!=="undefined"){
    _RULEBATCHES.forEach(rb=>{ try{ rb(I,S_,A,Dd); }catch(e){ /* backstop: a fault in a batch's shared setup skips the rest of THAT batch only, never the other batches */ } });
  }
  return out;
}

/* =====================================================================
   auditRules(b) — the form's OWN arithmetic audit on the built return
   (belt-and-braces roll-up checks), returning string messages, [] when the
   return agrees with itself. This is NOT the department's validation rules
   (that is runRules); the shell calls this separately as the "does not agree
   with itself" gate, so it carries no Category-D advisories. Keyed to
   ITR-1's ITR1_TaxComputation and TaxPaid blocks. The section-builder phase
   fills the figures these check; until then the return has zeros and the
   audit is silent.
   ===================================================================== */
function auditRules(b){
  const out=[];
  const j=(b&&b.ITR&&(b.ITR.ITR1||b.ITR[Object.keys(b.ITR)[0]]))||{};
  const g=(p,d)=>{let o=j;for(const k of p.split(".")){if(o&&k in o)o=o[k];else return d===undefined?0:d;}return o==null?(d===undefined?0:d):o;};
  const R_=(w,l,r,t)=>{if(Math.abs(N(l)-N(r))>(t||1))out.push(w+" (out by "+(N(l)-N(r))+")");};
  const T="ITR1_TaxComputation.";
  /* tax payable after 87A rebate = total tax payable less the rebate (floored at 0) */
  R_("tax payable after rebate does not agree with total tax payable less rebate 87A",g(T+"TaxPayableOnRebate"),
    Math.max(0,g(T+"TotalTaxPayable")-g(T+"Rebate87A")),2);
  /* gross tax liability = tax payable after rebate + 4% health & education cess */
  R_("gross tax liability does not add up",g(T+"GrossTaxLiability"),
    g(T+"TaxPayableOnRebate")+g(T+"EducationCess"),2);
  /* net tax liability = gross tax liability less relief u/s 89 (floored at 0) */
  R_("net tax liability is not gross tax liability less relief u/s 89",g(T+"NetTaxLiability"),
    Math.max(0,g(T+"GrossTaxLiability")-g(T+"Section89")),2);
  /* total interest & fee = 234A + 234B + 234C + 234F + 234-I */
  R_("total interest payable does not add up",g(T+"TotalIntrstPay"),
    g(T+"IntrstPay.IntrstPayUs234A")+g(T+"IntrstPay.IntrstPayUs234B")+g(T+"IntrstPay.IntrstPayUs234C")
    +g(T+"IntrstPay.LateFilingFee234F")+g(T+"IntrstPay.FeeFurnish234I"),2);
  /* aggregate tax + interest = net tax liability + total interest payable */
  R_("aggregate tax plus interest does not add up",g(T+"TotTaxPlusIntrstPay"),
    g(T+"NetTaxLiability")+g(T+"TotalIntrstPay"),2);
  /* taxes paid = advance + TDS + TCS + self-assessment */
  R_("the taxes paid do not add up",g("TaxPaid.TaxesPaid.TotalTaxesPaid"),
    g("TaxPaid.TaxesPaid.AdvanceTax")+g("TaxPaid.TaxesPaid.TDS")
    +g("TaxPaid.TaxesPaid.TCS")+g("TaxPaid.TaxesPaid.SelfAssessmentTax"));
  return out;
}

/* =====================================================================
   ITR-1 · A.Y. 2026-27 — Category-A validation rules, batch enc_01 (Phase 6).
   Serial range A1–A50 (Chapter VI-A ceilings 80C/80CCD/80DDB/80TTA/80TTB and
   the VI-A totals, the Part-B tax-computation roll-ups, the gross-/total-income
   identities, the Schedule-80G opening checks, the exempt-income single-select
   rules, the salary-schedule 10(17) allowance uniqueness, the house-property
   arithmetic + self-occupied caps, and the Other-Sources single-selects).

   Registered via ruleset(fn); runRules() (forms/ITR-1/src/60_rules.js) invokes
   it with (I,S_,A,Dd). A(n,cond,msg) fires (pushes a Category-A block) when cond
   — the "this return is lawful" assertion — is FALSE. Every read is guarded
   (RG / N / (X||{}) / S0); nothing throws. Keys are the built-return ITR1 schema
   paths (I = Object.values(buildReturn().ITR)[0]); the paths and enum codes were
   taken from books/ITR-1/schema_tree.md, blocks.json, caps.md, enums.json and
   the section builders (70_sec_ded expDed, 70_sec_sal expSal, 70_sec_hp expHP,
   70_sec_os expOs, 70_sec_ei expEi, 70_sec_tax expTax, 70_sec_paid expPaid).
   Encoded from each rule's own text (constitution rule 6).

   The rules.json line-wrap offsets each serial's text by ~one physical line
   (raw entry n = tail of rule n−1 + head of rule n); the assertions below are
   encoded to the RE-JOINED semantic rule, not the raw fragment.

   Regime gate: FilingStatus.OptOutNewTaxRegime — "Y" = OLD regime (the ceilings
   in this batch apply), "N" = NEW regime (default). The new-regime "must be 0"
   mirrors live in later batches (enc_04). The Chapter-VI-A DETAIL schedules are
   built only under the OLD regime (schema_tree §19 / caps §1), so schedule reads
   are additionally guarded by `if(I.<block>)`.

   Serials in A1–A50 NOT encoded here, and why (bucketed in the census —
   books/ITR-1/rule_census.md — never faked):
     A7  — OFFLINE-IMPOSSIBLE. 80DDB "Self or Dependent" Rs.40,000 vs senior-
            patient Rs.1,00,000 turns on Section80DDBUsrType, which expDed does
            NOT emit to the built return; only the <=1,00,000 bound (A5) is
            offline-checkable, so the 40,000 branch is not faithfully encodable.
     A19 — OFFLINE-IMPOSSIBLE. Name in the return vs the PAN database — external
            DB not shipped (the portal resolves it at upload).
   ===================================================================== */
ruleset(function(I,S_,A,Dd){
  I=I||{};
  const S0=v=>v!=null&&String(v).trim()!=="";          /* "present / non-blank" */
  const inL=(v,a)=>a.indexOf(v)>=0;
  const tol=1;

  /* ---- guarded reads ---- */
  const ID  = RG(I,"ITR1_IncomeDeductions",{})||{};
  const usr = RG(ID,"UsrDeductUndChapVIA",{})||{};      /* entered Chapter VI-A */
  const alw = RG(ID,"DeductUndChapVIA",{})||{};         /* allowed  Chapter VI-A */
  const FS  = RG(I,"FilingStatus",{})||{};
  const PI  = RG(I,"PersonalInfo",{})||{};
  const TC  = RG(I,"ITR1_TaxComputation",{})||{};
  const IP  = RG(TC,"IntrstPay",{})||{};
  const LT  = RG(I,"LTCG112A",{})||{};
  const TP  = RG(I,"TaxPaid",{})||{};

  const old    = String(FS.OptOutNewTaxRegime)==="Y";   /* Y = OLD regime */
  const empcat = String(PI.EmployerCategory==null?"":PI.EmployerCategory);
  const dob    = PI.DOB;                                 /* ISO yyyy-mm-dd */
  const PENS   = ["PE","PESG","PEPS","PEO","NA"];        /* pensioners / Not-Applicable */
  const GOVT   = ["CGOV","SGOV"];                        /* Central / State Government */

  /* salary head */
  const sal17 = N(ID.Salary);                            /* salary as per 17(1) */
  const perq  = N(ID.PerquisitesValue);                  /* 17(2) */
  const prof  = N(ID.ProfitsInSalary);                   /* 17(3) */
  const gross = N(ID.GrossSalary);
  const netSal= N(ID.NetSalary);
  const d16   = N(ID.DeductionUs16);
  const d16ia = N(ID.DeductionUs16ia);
  const ent16 = N(ID.EntertainmentAlw16ii);
  const pt16  = N(ID.ProfessionalTaxUs16iii);
  const incSal= N(ID.IncomeFromSal);
  const exAllw= N(RG(ID,"AllwncExemptUs10.TotalAllwncExemptUs10",0));

  /* income aggregates */
  const gti   = N(ID.GrossTotIncome);                    /* GTI excl LTCG 112A */
  const gtiL  = N(ID.GrossTotIncomeIncLTCG112A);         /* GTI incl LTCG 112A */
  const totInc= N(ID.TotalIncome);
  const incHP = N(ID.TotalIncomeChargeableUnHP);
  const incOS = N(ID.IncomeOthSrc);
  const ltcg  = N(LT.LongCap112A);
  const tpPaid= N(RG(TP,"TaxesPaid.TotalTaxesPaid",0));

  /* repeating rows */
  const osRows = RG(ID,"OthersInc.OthersIncDtlsOthSrc",[])||[];
  const eiRows = RG(ID,"ExemptIncAgriOthUs10.ExemptIncAgriOthUs10Dtls",[])||[];
  const eiTot  = N(RG(ID,"ExemptIncAgriOthUs10.ExemptIncAgriOthUs10Total",0));
  const allw10 = RG(ID,"AllwncExemptUs10.AllwncExemptUs10Dtls",[])||[];
  const props  = RG(ID,"PropertyDetails",[])||[];

  const osAmt   = code => osRows.filter(r=>r&&String(r.OthSrcNatureDesc)===code)
                                .reduce((a,r)=>a+N(r.OthSrcOthAmount),0);
  const osCount = code => osRows.filter(r=>r&&String(r.OthSrcNatureDesc)===code).length;
  const eiCount = code => eiRows.filter(r=>r&&String(r.SubCategory)===code).length;
  const allwCnt = code => allw10.filter(r=>r&&String(r.SalNatureDesc)===code).length;

  /* the allowed 20 VI-A section keys (schema_tree §7.7) */
  const DEDK=["Section80C","Section80CCC","Section80CCDEmployeeOrSE","Section80CCD1B",
    "Section80CCDEmployer","Section80D","Section80DD","Section80DDB","Section80E","Section80EE",
    "Section80EEA","Section80EEB","Section80G","Section80GG","Section80GGA","Section80GGC",
    "Section80U","Section80TTA","Section80TTB","AnyOthSec80CCH"];
  const alwSum = DEDK.reduce((a,k)=>a+N(alw[k]),0);

  /* ===================== Chapter VI-A ceilings (OLD regime) ===================== */
  /* A1 — old: 80C + 80CCC + 80CCD(1) aggregate <= Rs.1,50,000. */
  A(1, !old || (N(usr.Section80C)+N(usr.Section80CCC)+N(usr.Section80CCDEmployeeOrSE))<=150000+tol,
    "Old regime: the aggregate deduction u/s 80C, 80CCC and 80CCD(1) cannot exceed Rs.1,50,000.");
  /* A2 — old & pensioner/Not-Applicable employer: 80CCD(1) <= 20% of GTI. */
  A(2, !old || !inL(empcat,PENS) || N(usr.Section80CCDEmployeeOrSE)<=0.20*gti+tol,
    "Old regime: for a pensioner / Not-Applicable employer category the deduction u/s 80CCD(1) cannot exceed 20% of gross total income.");
  /* A3 — old & employer NOT pensioner/NA: 80CCD(1) <= 10% of salary. */
  A(3, !old || inL(empcat,PENS) || N(usr.Section80CCDEmployeeOrSE)<=0.10*sal17+tol,
    "Old regime: for an employer other than the pensioner / Not-Applicable categories the deduction u/s 80CCD(1) cannot exceed 10% of salary.");
  /* A4 — old & non-Government employer: 80CCD(2) <= 10% of salary. */
  A(4, !old || inL(empcat,GOVT) || N(usr.Section80CCDEmployer)<=0.10*sal17+tol,
    "Old regime: deduction u/s 80CCD(2) cannot exceed 10% of salary for an employer other than the Central or State Government.");
  /* A5 — old: 80DDB (resident) <= Rs.1,00,000. */
  A(5, !old || N(usr.Section80DDB)<=100000+tol,
    "Old regime: the resident assessee cannot claim more than the maximum limit of Rs.1,00,000 u/s 80DDB.");
  /* A6 — old & 80DDB claimed: the specified-disease description must be provided. */
  A(6, !old || !(N(usr.Section80DDB)>0) || S0(usr.NameOfSpecDisease80DDB),
    "Old regime: deduction u/s 80DDB is claimed but the eligible specified-disease description is not provided.");
  /* A7 — OFFLINE-IMPOSSIBLE (Section80DDBUsrType not emitted); see header. */

  /* ===================== Schedule 80G opening checks (OLD regime) ===================== */
  const G = RG(I,"Schedule80G",{})||{};
  /* A8 — old & 80G claimed: the donation details must be provided in Schedule 80G. */
  A(8, !old || !(N(usr.Section80G)>0) || !!I.Schedule80G,
    "Old regime: deduction u/s 80G is claimed but the donation details are not provided in Schedule 80G.");
  /* A9 — Schedule 80G Table F total = sum of the four bucket donation totals. */
  A(9, !I.Schedule80G || REQ(N(G.TotalDonationsUs80G),
      N(RG(G,"Don100Percent.TotDonDon100Percent",0))
      +N(RG(G,"Don50PercentNoApprReqd.TotDonDon50PercentNoApprReqd",0))
      +N(RG(G,"Don100PercentApprReqd.TotDonDon100PercentApprReqd",0))
      +N(RG(G,"Don50PercentApprReqd.TotDonDon50PercentApprReqd",0)),2),
    "Schedule 80G Table F: total donation must equal the sum of the four bucket donation totals (100%/50%, with and without qualifying limit).");
  /* A10 — old: the 80G deduction claimed in Schedule VIA <= eligible donation in Schedule 80G. */
  A(10, !old || !I.Schedule80G || N(usr.Section80G)<=N(G.TotalEligibleDonationsUs80G)+tol,
    "Old regime: the deduction claimed u/s 80G in Schedule VIA cannot exceed the eligible amount of donation in Schedule 80G.");

  /* ===================== 80TTA / 80TTB (OLD regime + senior gates) ===================== */
  /* A11 — old: 80TTA <= Rs.10,000. */
  A(11, !old || N(usr.Section80TTA)<=10000+tol,
    "Old regime: deduction u/s 80TTA cannot exceed the maximum limit of Rs.10,000.");
  /* A12 — old: 80TTA restricted to savings-account interest (SAV) under Other Sources. */
  A(12, !old || N(usr.Section80TTA)<=osAmt("SAV")+tol,
    "Old regime: deduction u/s 80TTA is restricted to the savings-account interest income offered under Income from Other Sources.");
  /* A13 — 80TTA barred for a senior citizen (DOB on or before 01.04.1966). */
  A(13, !(N(usr.Section80TTA)>0) || !S0(dob) || dob>"1966-04-01",
    "Deduction u/s 80TTA cannot be claimed by a senior citizen (date of birth on or before 01.04.1966).");
  /* A14 — old: 80TTB <= Rs.50,000. */
  A(14, !old || N(usr.Section80TTB)<=50000+tol,
    "Old regime: deduction u/s 80TTB cannot exceed the maximum limit of Rs.50,000.");
  /* A15 — 80TTB only for a senior citizen (DOB before 02.04.1966). */
  A(15, !(N(usr.Section80TTB)>0) || !S0(dob) || dob<"1966-04-02",
    "Deduction u/s 80TTB can be claimed only by a senior citizen (date of birth before 02.04.1966).");
  /* A16 — old: 80TTB restricted to interest income under Other Sources. */
  A(16, !old || N(usr.Section80TTB)<=(osAmt("SAV")+osAmt("IFD")+osAmt("TAX")+osAmt("OII"))+tol,
    "Old regime: a senior citizen's deduction u/s 80TTB is restricted to interest income offered under Income from Other Sources.");

  /* ===================== VI-A totals ===================== */
  /* A17 — total Chapter VI-A deduction = sum of the individual (allowed) deductions. */
  A(17, REQ(N(alw.TotalChapVIADeductions), alwSum, 2),
    "The total of Chapter VI-A deductions must equal the sum of the individual deductions (restricted to gross total income).");
  /* A18 — Chapter VI-A deductions cannot exceed gross total income. */
  A(18, N(alw.TotalChapVIADeductions)<=gti+tol,
    "Deductions claimed under Chapter VI-A cannot be more than the gross total income.");
  /* A19 — OFFLINE-IMPOSSIBLE (name vs PAN database); see header. */

  /* ===================== Part-B tax computation roll-ups ===================== */

  const itRows  = RG(IT,"TaxPayment",[])||[];
  const TCS     = RG(I,"ScheduleTCS",{})||{};
  const tcsRows = RG(TCS,"TCS",[])||[];
  const TDS2    = RG(I,"TDSonOthThanSals",{})||{};
  const tds2Rows= RG(TDS2,"TDSonOthThanSal",[])||[];
  const TDS3    = RG(I,"ScheduleTDS3Dtls",{})||{};
  const tds3Rows= RG(TDS3,"TDS3Details",[])||[];
  const TDS1    = RG(I,"TDSonSalaries",{})||{};
  const tds1Rows= RG(TDS1,"TDSonSalary",[])||[];
  /* A95 — Schedule IT col 4 total (tax paid) = sum of the individual challan amounts. */
  A(95, !I.TaxPayments || REQ(N(IT.TotalTaxPayments), itRows.reduce((a,r)=>a+N(r&&r.Amt),0), 2),

  /* A97 — Schedule TCS col 6 total = sum of the TCS claimed this year. */
  A(97, !I.ScheduleTCS || REQ(N(TCS.TotalSchTCS), tcsRows.reduce((a,r)=>a+N(r&&r.AmtTCSClaimedThisYear),0), 2),

  A(98, !I.TDSonOthThanSals || tds2Rows.every(r=> N(r&&r.ClaimOutOfTotTDSOnAmtPaid) <= N(r&&r.TotTDSOnAmtPaid)+tol),
    "Schedule TDS2 (other than salary): the amount of TDS claimed this year cannot be more than the tax deducted.");
  /* A99 — TDS2 / TDS3 / TCS year of deduction/collection cannot be 0 or null where a credit is claimed. */

     && (!I.ScheduleTDS3Dtls || tds3Rows.every(r=> !(N(r&&r.TDSClaimed)>0) || yrOk(r&&r.DeductedYr)))
     && (!I.ScheduleTCS      || tcsRows.every(r=> !(N(r&&r.AmtTCSClaimedThisYear)>0) || yrOk(r&&r.CollectedYr))),
    "Schedule TDS2, TDS3 / TCS: the year of tax deduction/collection cannot be 0 or null where a TDS/TCS credit is claimed.");
  /* A100 — Schedule TDS1 col 5 total (total tax deducted) = sum of the individual values. */
  A(100, !I.TDSonSalaries || REQ(N(TDS1.TotalTDSonSalaries), tds1Rows.reduce((a,r)=>a+N(r&&r.TotalTDSSal),0), 2),

/* =====================================================================
   ITR-1 · A.Y. 2026-27 — Category-A validation rules, batch enc_03 (Phase 6).
   Serial range A101–A150 (the Taxes-Paid / TDS / TCS / Schedule-IT reconciliation
   tail and the Refund/Balance identities, the Chapter-VI-A ceilings and detail-
   presence checks 80GG/80CCD(1B)/80CCD(2)/80EE/80EEA/80EEB and the new-regime
   B5 zero-bar, the full Schedule-80D age-based ladder Sl.No 1a/1b/2a/2b/3, the
   80G eligible<=total and cross-bucket-PAN checks, the Part-B "total tax, fee &
   interest" roll-up, the exempt/salary single-selects and caps (10(17A),
   10(10AA), standard deduction 16(ia)), the 80GGA cash/PAN checks, the dividend
   quarterly-breakup identity, and the new-/old-regime section-10(14) allowance
   bars).

   Registered via ruleset(fn); runRules() (forms/ITR-1/src/60_rules.js) invokes
   it with (I,S_,A,Dd). A(n,cond,msg) fires (pushes a Category-A block) when cond
   — the "this return is lawful" assertion — is FALSE. Every read is guarded
   (RG / N / (X||{}) / S0); nothing throws. Keys are the built-return ITR1 schema
   paths (I = Object.values(buildReturn().ITR)[0]); the paths and enum codes were
   taken from books/ITR-1/schema_tree.md, caps.md, enums.json and the section
   builders (70_sec_paid expPaid, 70_sec_ded expDed, 70_sec_sal expSal,
   70_sec_os expOs, 70_sec_tax expTax). Encoded from each rule's own re-joined
   text (constitution rule 6); the rules.json line-wrap offsets each serial by
   ~one physical line, so the assertions below are encoded to the RE-JOINED
   semantic rule, not the raw fragment.

   Regime gate: FilingStatus.OptOutNewTaxRegime — "Y" = OLD regime, "N" = NEW.
   Old-regime rules are guarded `!old || …`; new-regime rules `old || …`.

   Serials in A101–A150 NOT encoded here, and why (bucketed in the census —
   books/ITR-1/rule_census.md — never faked):
     A107 — OFFLINE-IMPOSSIBLE. IFSC in Bank Details / Schedule 80G / 80GGC vs
            the RBI / GIFT IFSC database — external DB not shipped (the portal
            resolves it at upload).
     A113 — NA. TDS claimed but receipts per Form 26AS not offered — an AIS/26AS

     A126 — NA. Original return u/s 142(1) then no 139 return — checked at upload

ruleset(function(I,S_,A,Dd){

  const S0=v=>v!=null&&String(v).trim()!=="";          /* "present / non-blank" */

  const tol=1;

  /* ---- guarded reads ---- */
  const ID  = RG(I,"ITR1_IncomeDeductions",{})||{};
  const usr = RG(ID,"UsrDeductUndChapVIA",{})||{};      /* entered Chapter VI-A */
  const alw = RG(ID,"DeductUndChapVIA",{})||{};         /* allowed  Chapter VI-A */
  const FS  = RG(I,"FilingStatus",{})||{};
  const PI  = RG(I,"PersonalInfo",{})||{};
  const TC  = RG(I,"ITR1_TaxComputation",{})||{};
  const LT  = RG(I,"LTCG112A",{})||{};
  const TP  = RG(I,"TaxPaid",{})||{};
  const TPP = RG(TP,"TaxesPaid",{})||{};
  const RFD = RG(I,"Refund",{})||{};
  const G   = RG(I,"Schedule80G",{})||{};
  const GGA = RG(I,"Schedule80GGA",{})||{};
  const D8  = RG(I,"Schedule80D.Sec80DSelfFamSrCtznHealth",{})||{};

  const TS  = RG(I,"TDSonSalaries",{})||{};
  const TO  = RG(I,"TDSonOthThanSals",{})||{};
  const T3  = RG(I,"ScheduleTDS3Dtls",{})||{};
  const SCTCS = RG(I,"ScheduleTCS",{})||{};
  const PY  = RG(I,"TaxPayments",{})||{};

  const old    = String(FS.OptOutNewTaxRegime)==="Y";   /* Y = OLD regime */
  const empcat = String(PI.EmployerCategory==null?"":PI.EmployerCategory);
  const GOVT   = ["CGOV","SGOV"];                        /* Central / State Government */
  const CGSGPSU_PEN = ["PE","PESG","PEPS"];              /* CG / SG / PSU pensioners */
  const GOVT_PEN10AA= ["CGOV","SGOV","PE","PESG"];       /* govt + CG/SG pensioners (10(10AA) high limit) */

  /* salary head */
  const sal17 = N(ID.Salary);                            /* salary as per 17(1) */
  const perq  = N(ID.PerquisitesValue);                  /* 17(2) */
  const prof  = N(ID.ProfitsInSalary);                   /* 17(3) */
  const d16ia = N(ID.DeductionUs16ia);                   /* standard deduction 16(ia) */

  /* income aggregates */
  const gti   = N(ID.GrossTotIncome);                    /* GTI excl LTCG 112A */
  const totInc= N(ID.TotalIncome);
  const ltcg  = N(LT.LongCap112A);

  /* repeating rows */
  const osRows = RG(ID,"OthersInc.OthersIncDtlsOthSrc",[])||[];
  const eiRows = RG(ID,"ExemptIncAgriOthUs10.ExemptIncAgriOthUs10Dtls",[])||[];
  const allw10 = RG(ID,"AllwncExemptUs10.AllwncExemptUs10Dtls",[])||[];
  const tds2Rows = RG(TO,"TDSonOthThanSal",[])||[];
  const tds3Rows = RG(T3,"TDS3Details",[])||[];
  const tcsRows  = RG(SCTCS,"TCS",[])||[];
  const itRows   = RG(PY,"TaxPayment",[])||[];

  const osAmt  = code => osRows.filter(r=>r&&String(r.OthSrcNatureDesc)===code)
                               .reduce((a,r)=>a+N(r.OthSrcOthAmount),0);
  const eiCount= code => eiRows.filter(r=>r&&String(r.SubCategory)===code).length;
  const alwAmt = code => allw10.filter(r=>r&&String(r.SalNatureDesc)===code)
                               .reduce((a,r)=>a+N(r.SalOthAmount),0);
  /* a DoneePAN appears more than once across the given rows */
  const dupPan = rows=>{const seen={};for(const r of (rows||[])){if(!r)continue;
    const p=String(r.DoneePAN||"").toUpperCase();if(!p)continue;
    if(seen[p])return true;seen[p]=1;}return false;};

  /* ===================== Taxes-Paid / TDS / TCS reconciliation ===================== */
  /* A101 — Schedule TDS2 col-6 total = sum of the per-row credit-claimed values. */
  A(101, REQ(N(TO.TotalTDSonOthThanSals),
      tds2Rows.reduce((a,r)=>a+N(r&&r.ClaimOutOfTotTDSOnAmtPaid),0), 2),
    "Schedule TDS2: the total 'TDS credit out of (5) claimed this year' must equal the sum of the individual col-6 values.");
  /* A102 — Schedule TDS3 col-7 total = sum of the per-row TDS-claimed values. */
  A(102, REQ(N(T3.TotalTDS3Details),
      tds3Rows.reduce((a,r)=>a+N(r&&r.TDSClaimed),0), 2),
    "Schedule TDS3: the total 'TDS credit out of (5) claimed this year' must equal the sum of the individual col-7 values.");
  /* A103 — Taxes-Paid total = the details paid in Schedule IT + TDS1 + TDS2 + TDS3 + TCS. */
  A(103, REQ(N(TPP.TotalTaxesPaid),
      N(PY.TotalTaxPayments)+N(TS.TotalTDSonSalaries)+N(TO.TotalTDSonOthThanSals)
      +N(T3.TotalTDS3Details)+N(SCTCS.TotalSchTCS), 2),
    "TDS, TCS and tax paid claimed in 'Taxes Paid and Verification' must equal the amounts provided in Schedule IT, Schedule TDS1, TDS2, TDS3 and Schedule TCS.");
  /* A104 — Total Taxes Paid = Advance Tax + TDS + TCS + Self-Assessment Tax. */
  A(104, REQ(N(TPP.TotalTaxesPaid),
      N(TPP.AdvanceTax)+N(TPP.TDS)+N(TPP.TCS)+N(TPP.SelfAssessmentTax), 2),
    "Total Taxes Paid must equal the sum of TDS, TCS, Advance Tax and Self-Assessment Tax.");
  /* A105 — Refund due = Total Taxes Paid − Total Tax & Interest payable (floored at 0). */
  A(105, REQ(N(RFD.RefundDue), Math.max(0, N(TPP.TotalTaxesPaid)-N(TC.TotTaxPlusIntrstPay)), 2),
    "Refund claimed must equal Total Taxes Paid less Total Tax and Interest payable.");
  /* A106 — Balance tax payable = Total Tax & Interest payable − Total Taxes Paid (floored at 0). */
  A(106, REQ(N(TP.BalTaxPayable), Math.max(0, N(TC.TotTaxPlusIntrstPay)-N(TPP.TotalTaxesPaid)), 2),
    "Tax payable must equal Total Tax and Interest payable less Total Taxes Paid.");
  /* A107 — OFFLINE-IMPOSSIBLE (IFSC vs RBI/GIFT database); see header. */
  /* A108 — Taxes-Paid TDS = the totals of Schedule TDS1 + TDS2 + TDS3. */
  A(108, REQ(N(TPP.TDS),
      N(TS.TotalTDSonSalaries)+N(TO.TotalTDSonOthThanSals)+N(T3.TotalTDS3Details), 2),
    "Total TDS claimed in 'Taxes Paid and Verification' must equal the sum of the TDS claimed in Schedule TDS1, TDS2 and TDS3.");
  /* A109 — Taxes-Paid TCS = the total of Schedule TCS. */
  A(109, REQ(N(TPP.TCS), N(SCTCS.TotalSchTCS), 2),
    "Total TCS claimed in 'Taxes Paid and Verification' must equal the total TCS claimed in the TCS schedule.");
  /* A110 — Advance tax = the Schedule-IT challans deposited on or before 31 March 2026. */
  A(110, REQ(N(TPP.AdvanceTax),
      itRows.filter(r=>r&&S0(r.DateDep)&&String(r.DateDep)<="2026-03-31")
            .reduce((a,r)=>a+N(r.Amt),0), 2),
    "Total Advance Tax paid must equal the sum of the Schedule-IT challans deposited between 01/04/2025 and 31/03/2026.");
  /* A111 — Self-assessment tax = the Schedule-IT challans deposited after 31 March 2026. */
  A(111, REQ(N(TPP.SelfAssessmentTax),
      itRows.filter(r=>r&&S0(r.DateDep)&&String(r.DateDep)>"2026-03-31")
            .reduce((a,r)=>a+N(r.Amt),0), 2),
    "Total Self-Assessment Tax paid must equal the sum of the Schedule-IT challans deposited after 31/03/2026.");

  /* ===================== Salary — standard deduction 16(ia) ===================== */
  /* A112 — old: the standard deduction u/s 16(ia) is capped at Rs.50,000. */
  A(112, !old || d16ia<=50000+tol,
    "Old regime: a salaried taxpayer can claim the standard deduction u/s 16(ia) only to the extent of Rs.50,000.");
  /* A113 — NA (TDS vs Form 26AS reconciliation); see header. */

  /* ===================== Chapter VI-A ceilings & bars ===================== */
  /* A114 — old: 80GG <= least(Rs.60,000, 25% of total income excl LTCG). */
  A(114, !old || N(usr.Section80GG)<=Math.min(60000, 0.25*gti)+tol,
    "The deduction u/s 80GG cannot exceed the lower of Rs.60,000 and 25% of total income (excluding LTCG) before allowing this deduction.");
  /* A115 — old: 80CCD(1B) <= Rs.50,000. */
  A(115, !old || N(usr.Section80CCD1B)<=50000+tol,

  /* A116 — 80CCD(2) barred for a CG / SG / PSU pensioner. */
  A(116, !inL(empcat,CGSGPSU_PEN) || N(usr.Section80CCDEmployer)===0,

  A(117, (totInc-ltcg)<=5000000+tol,

  if(I.Schedule80GGA){

    A(143, ggaRows.every(r=>!r||N(r.DonationAmtCash)<=2000+tol),
      "Deduction u/s 80GGA is not allowed for a donation made in cash above Rs.2,000.");
    /* A144 — 80GGA: the same donee PAN cannot appear more than once (any mode). */
    A(144, !dupPan(ggaRows),
      "Schedule 80GGA: the same donee PAN cannot appear more than once.");
  }
  /* A119 — HRA u/s 10(13A) claimed => deduction u/s 80GG not allowed. */
  A(119, !(alwAmt("10(13A)")>0) || N(usr.Section80GG)===0,
    "House rent allowance u/s 10(13A) is claimed, so the deduction u/s 80GG is not allowed for the corresponding period.");

  A(120, !old || !inL(empcat,GOVT) || N(usr.Section80CCDEmployer)<=0.14*sal17+tol,

  A(121, !old || N(usr.Section80EE)<=50000+tol,
    "Old regime: the deduction claimed u/s 80EE cannot exceed the maximum limit of Rs.50,000.");
  /* A122 — old: 80EEA <= Rs.1,50,000. */
  A(122, !old || N(usr.Section80EEA)<=150000+tol,
    "Old regime: the deduction claimed u/s 80EEA cannot exceed the maximum limit of Rs.1,50,000.");
  /* A123 — 80EE and 80EEA are mutually exclusive: 80EEA claimed => 80EE must be 0. */
  A(123, !(N(usr.Section80EEA)>0) || N(usr.Section80EE)===0,
    "Only one of the deductions u/s 80EE / 80EEA is allowed; where 80EEA is claimed the deduction u/s 80EE cannot be greater than zero.");
  /* A124 — old: 80EEB <= Rs.1,50,000. */
  A(124, !old || N(usr.Section80EEB)<=150000+tol,
    "Old regime: the deduction claimed u/s 80EEB cannot exceed Rs.1,50,000.");
  /* A125 — relief u/s 89 needs salary 17(1) / perquisite 17(2) / profit 17(3) / family pension present. */
  A(125, !(N(TC.Section89)>0) || sal17>0 || perq>0 || prof>0 || osAmt("FAP")>0,

  /* A126 — NA (original return u/s 142(1) then no 139 return); see header. */

  /* ===================== Schedule 80D — age-based ladder (OLD regime) ===================== */
  if(I.Schedule80D){

    const hiSelf    = N(D8.HealthInsPremSlfFam);
    const phcSelf   = N(D8.PrevHlthChckUpSlfFam);
    const selfFamSr = N(D8.SelfAndFamilySeniorCitizen);     /* Sl.No 1b */
    const hiSelfSr  = N(D8.HlthInsPremSlfFamSrCtzn);
    const phcSelfSr = N(D8.PrevHlthChckUpSlfFamSrCtzn);
    const medSelfSr = N(D8.MedicalExpSlfFamSrCtzn);
    const par       = N(D8.Parents);                        /* Sl.No 2a */
    const hiPar     = N(D8.HlthInsPremParents);
    const phcPar    = N(D8.PrevHlthChckUpParents);
    const parSr     = N(D8.ParentsSeniorCitizen);           /* Sl.No 2b */
    const hiParSr   = N(D8.HlthInsPremParentsSrCtzn);
    const phcParSr  = N(D8.PrevHlthChckUpParentsSrCtzn);
    const medParSr  = N(D8.MedicalExpParentsSrCtzn);
    const elig80D   = N(D8.EligibleAmountOfDedn);           /* Sl.No 3 */
    const sum4      = selfFam+selfFamSr+par+parSr;

    /* A127 — old: 80D Sl.No 1a (Self & Family) <= Rs.25,000. */
    A(127, !old || selfFam<=25000+tol,

    /* A128 — 80D Sl.No 1a = health-insurance premium + preventive check-up (capped at Rs.5,000). */
    A(128, REQ(selfFam, hiSelf+Math.min(phcSelf,5000), 2),
      "Schedule 80D: the deduction at Sl.No 1a must equal the sum of (i) health-insurance premium and (ii) preventive health check-up.");
    /* A129 — old: the preventive health check-up across all four fields combined <= Rs.5,000. */
    A(129, !old || (phcSelf+phcSelfSr+phcPar+phcParSr)<=5000+tol,
      "Old regime: Schedule 80D — the preventive health check-up amount of all the fields combined together cannot exceed Rs.5,000.");
    /* A130 — old: 80D Sl.No 1b (Self & Family, senior) <= Rs.50,000. */
    A(130, !old || selfFamSr<=50000+tol,
      "Old regime: Schedule 80D — the deduction at Sl.No 1b (Self and Family, senior citizen) is allowed only to the extent of Rs.50,000.");
    /* A131 — 80D Sl.No 1b = i + ii (preventive capped at Rs.5,000) + iii (medical expenditure). */
    A(131, REQ(selfFamSr, hiSelfSr+Math.min(phcSelfSr,5000)+medSelfSr, 2),
      "Schedule 80D: the deduction at Sl.No 1b must equal the sum of (i) health-insurance premium, (ii) preventive check-up and (iii) medical expenditure.");
    /* A132 — old: 80D Sl.No 2a (Parents) <= Rs.25,000. */
    A(132, !old || par<=25000+tol,
      "Old regime: Schedule 80D — the deduction at Sl.No 2a (Parents) is allowed only to the extent of Rs.25,000.");
    /* A133 — old: 80D Sl.No 2a = health-insurance premium + preventive check-up (capped at Rs.5,000). */
    A(133, !old || REQ(par, hiPar+Math.min(phcPar,5000), 2),
      "Old regime: Schedule 80D — the deduction at Sl.No 2a must equal the sum of (i) health-insurance premium and (ii) preventive health check-up.");
    /* A134 — old: 80D Sl.No 2b (Parents, senior) <= Rs.50,000. */
    A(134, !old || parSr<=50000+tol,
      "Old regime: Schedule 80D — the deduction at Sl.No 2b (Parents, senior citizen) cannot exceed Rs.50,000.");
    /* A135 — 80D Sl.No 2b = i + ii (preventive capped at Rs.5,000) + iii (medical expenditure). */
    A(135, REQ(parSr, hiParSr+Math.min(phcParSr,5000)+medParSr, 2),
      "Schedule 80D: the deduction at Sl.No 2b must equal the sum of (i) health-insurance premium, (ii) preventive check-up and (iii) medical expenditure.");
    /* A136 — old: 80D Sl.No 3 eligible amount of deduction <= Rs.1,00,000. */
    A(136, !old || elig80D<=100000+tol,
      "Old regime: Schedule 80D — the eligible amount of deduction at Sl.No 3 cannot exceed Rs.1,00,000.");

       GTI roll-up now wired (ITR1_IncomeDeductions.GrossTotIncome, populated by the tax section) the
       Math.min(sum4, gti) restriction is faithful and stays silent on a lawful return. */
    A(137, !(sum4<=100000) || REQ(elig80D, Math.min(sum4, gti), 2),
      "Schedule 80D: the eligible amount of deduction at Sl.No 3 must equal the sum of (1a + 1b + 2a + 2b) restricted to gross total income.");
  }

  A(138, !(N(alw.Section80D)>0) || (!!I.Schedule80D && REQ(N(alw.Section80D), N(D8.EligibleAmountOfDedn), 2)),
    "Where 80D is claimed in the Chapter-VI-A deductions the same amount and details must be provided in Schedule 80D.");

  /* ===================== Schedule 80G ===================== */
  /* A139 — 80G eligible amount of donations <= total donations. */
