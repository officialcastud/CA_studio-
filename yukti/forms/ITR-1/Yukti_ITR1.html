  /* ---- guarded reads ---- */
  const ID  = RG(I,"ITR1_IncomeDeductions",{})||{};
  const usr = RG(ID,"UsrDeductUndChapVIA",{})||{};      /* entered Chapter VI-A */
  const alw = RG(ID,"DeductUndChapVIA",{})||{};         /* allowed  Chapter VI-A */
  const FS  = RG(I,"FilingStatus",{})||{};
  const PI  = RG(I,"PersonalInfo",{})||{};
  const VF  = RG(I,"Verification",{})||{};
  const LT  = RG(I,"LTCG112A",{})||{};

  const old    = String(FS.OptOutNewTaxRegime)==="Y";   /* Y = OLD regime */
  const empcat = String(PI.EmployerCategory==null?"":PI.EmployerCategory);
  const asPAN  = String(PI.PAN==null?"":PI.PAN).toUpperCase().trim();
  const GRAT   = ["CGOV","SGOV","PE","PESG"];            /* CG / SG + their pensioners */
  const CGSG   = ["CGOV","SGOV"];                        /* serving Central / State Government */
  const SEC192 = ["92A","92B","92C"];                   /* the three "192-Salary" TDS codes */

  /* income aggregates */
  const gti   = N(ID.GrossTotIncome);                    /* GTI excl LTCG 112A */
  const gtiL  = N(ID.GrossTotIncomeIncLTCG112A);         /* GTI incl LTCG 112A */
  const sal17 = N(ID.Salary);                            /* salary as per 17(1) */
  const incSal= N(ID.IncomeFromSal);

  /* salary allowances exempt u/s 10 */
  const allw10 = RG(ID,"AllwncExemptUs10.AllwncExemptUs10Dtls",[])||[];
  const exAllw = N(RG(ID,"AllwncExemptUs10.TotalAllwncExemptUs10",0));
  const allwAmt = code => allw10.filter(r=>r&&String(r.SalNatureDesc)===code)
                                .reduce((a,r)=>a+N(r.SalOthAmount),0);

  const props  = RG(ID,"PropertyDetails",[])||[];

  /* ===================== 80EE / 80EEB loan schedules ===================== */
  /* A251 — Schedule 80EEB: sum of the individual "interest paid" rows = the total. */
  if(I.Schedule80EEB){
    const rows=RG(I,"Schedule80EEB.Schedule80EEBDtls",[])||[];
    A(251, REQ(N(RG(I,"Schedule80EEB.TotalInterest80EEB",0)),
        rows.reduce((a,r)=>a+N(r&&r.Interest80EEB),0), 2),
      "Schedule 80EEB: the sum of the individual rows for interest paid must equal the total of payments in the schedule.");
  }
  /* A252 — Schedule 80EE: the date of sanction of the loan must fall in FY 2016-17. */
  if(I.Schedule80EE){
    const rows=RG(I,"Schedule80EE.Schedule80EEDtls",[])||[];
    const bad = rows.some(r=>{ const d=r&&r.DateofLoan; return S0(d) && (String(d)<"2016-04-01"||String(d)>"2017-03-31"); });
    A(252, !bad,
      "Schedule 80EE: the date of sanction of the loan must be between 01.04.2016 and 31.03.2017.");
  }

  /* ===================== Schedule 80D presence + insurer details ===================== */
  /* A254 — old & 80D claimed: the Schedule 80D details must be provided. */
  A(254, !old || !(N(usr.Section80D)>0) || !!I.Schedule80D,
    "Old regime: deduction u/s 80D is claimed but the details are not provided in Schedule 80D.");
  /* A256–A259 — a health-insurance row present at sl. 1a(i)/1b(i)/2a(i)/2b(i) must
     carry the insurer's name and the policy number (well-formedness; silent when absent). */
  const SDH = RG(I,"Schedule80D.Sec80DSelfFamSrCtznHealth",{})||{};
  const insWF = sub => (RG(SDH,sub+".Sch80DInsDtls",[])||[])
    .every(r=>!r || (S0(r.InsurerName) && S0(r.PolicyNo)));
  A(256, insWF("Sec80DSelfFamHIDtls"),
    "Schedule 80D sl. 1a(i): the name of the insurer and the policy number are required to claim the health-insurance deduction.");
  A(257, insWF("Sec80DSelfFamSrCtznHIDtls"),
    "Schedule 80D sl. 1b(i): the name of the insurer and the policy number are required to claim the health-insurance deduction.");
  A(258, insWF("Sec80DParentsHIDtls"),
    "Schedule 80D sl. 2a(i): the name of the insurer and the policy number are required to claim the health-insurance deduction.");
  A(259, insWF("Sec80DParentsSrCtznHIDtls"),
    "Schedule 80D sl. 2b(i): the name of the insurer and the policy number are required to claim the health-insurance deduction.");

  /* ===================== New-regime schedule bar ===================== */
  /* A255 — new regime (individual): none of the 80C / 10(13A) / 80E / 80EE / 80EEA / 80EEB
     schedules may be filled (they belong to the old-regime deduction ladder). */
  A(255, old || (!I.Schedule80C && !I.ScheduleEA10_13A && !I.Schedule80E
      && !I.Schedule80EE && !I.Schedule80EEA && !I.Schedule80EEB),
    "New regime: none of the Schedule 80C, 10(13A), 80E, 80EE, 80EEA or 80EEB may be filled.");

  /* ===================== Section-192 mis-selection in the non-salary TDS schedules ===================== */
  /* A260 — a "192-Salary" section code must not be selected in the TDS-on-other-than-salary
     schedules (TDSonOthThanSals / ScheduleTDS3Dtls). */
  const tds2 = RG(I,"TDSonOthThanSals.TDSonOthThanSal",[])||[];
  const tds3 = RG(I,"ScheduleTDS3Dtls.TDS3Details",[])||[];
  A(260, !tds2.some(r=>r&&inL(String(r.TDSSection),SEC192))
       && !tds3.some(r=>r&&inL(String(r.TDSSection),SEC192)),
    "Section 192 (TDS on salary) cannot be selected in the schedules for TDS on income other than salary.");

  /* ===================== Schedule EA 10(13A) — HRA (old regime, real employer) ===================== */
  if(I.ScheduleEA10_13A){
    const EA   = RG(I,"ScheduleEA10_13A",{})||{};
    const hraR = N(EA.ActlHRARecv);
    const rent10= N(EA.ActlRentPaid10Per);              /* actual rent paid − 10% of (basic+DA) */
    const pct  = N(EA.Sal40Or50Per);                    /* 40% (non-metro) / 50% (metro) of (basic+DA) */
    const elig = N(EA.EligbleExmpAllwncUs13A);
    const basic= N(EA.BasicSalary);
    const da   = N(EA.DearnessAllwnc);
    /* A261 — HRA exemption <= actual rent paid − 10% of (basic + DA). */
    A(261, elig<=rent10+tol,
      "House rent allowance u/s 10(13A) cannot be more than the actual rent paid after deducting 10% of basic salary and dearness allowance.");
    /* A262 — HRA exemption <= 40%/50% of (basic + DA) (non-metro / metro). */
    A(262, elig<=pct+tol,
      "House rent allowance u/s 10(13A) cannot be more than 40% (non-metro) / 50% (metro) of basic salary and dearness allowance.");
    /* A263 — HRA exemption = the least of actual HRA, rent−10%, and 40/50% of salary. */
    A(263, REQ(elig, Math.max(0, Math.min(hraR, rent10, pct)), 2),
      "Schedule 10(13A): the HRA exemption must be the lowest of the actual HRA received, rent paid less 10% of salary, and 40%/50% of salary.");
    /* A266 — basic + DA + actual HRA received <= salary as per section 17(1). */
    A(266, (basic+da+hraR)<=sal17+tol,
      "The sum of basic salary, dearness allowance and the actual HRA received cannot be more than the salary as per section 17(1).");
  }
  /* A264 — where there is salary income and exempt allowances, the nature of employment is required. */
  A(264, !(incSal>0 && exAllw>0) || S0(empcat),
    "The nature of employment must be provided where the return has salary income and exempt allowances.");
  /* A265 — Schedule 10(13A) must be filled to claim the 10(13A) exempt allowance. */
  A(265, !(allwAmt("10(13A)")>0) || !!I.ScheduleEA10_13A,
    "Schedule 10(13A) must be filled to claim the exempt allowance u/s 10(13A).");
  /* A269 — the 10(13A) exempt allowance in the salary schedule = the eligible amount in Schedule EA. */
  if(I.ScheduleEA10_13A)
    A(269, REQ(allwAmt("10(13A)"), N(RG(I,"ScheduleEA10_13A.EligbleExmpAllwncUs13A",0)), 2),
      "The exempt allowance u/s 10(13A) in the salary schedule must match the eligible allowance u/s 10(13A) in Schedule 10(13A).");

  /* ===================== Salary-head 10(10) / EIC allowance checks ===================== */
  /* A267 — 10(10) death-cum-retirement gratuity <= Rs.25,00,000 for CG/SG (and their pensioners). */
  A(267, !inL(empcat,GRAT) || allwAmt("10(10)")<=2500000+tol,
    "Exempt allowance u/s 10(10) (death-cum-retirement gratuity) cannot exceed Rs.25,00,000 for a Central/State Government employee or pensioner.");
  /* A270 — the judge's exempt income (EIC) can be claimed only by a CG/SG employee. */
  A(270, !(allwAmt("EIC")>0) || inL(empcat,CGSG),
    "The exempt income of a judge (Supreme Court / High Court Judges Act) can be claimed only by a Central or State Government employee.");

  /* ===================== House property (per PropertyDetails[]) ===================== */
  props.forEach((p,i)=>{
    p=p||{};
    const rd  = RG(p,"Rentdetails",{})||{};
    const type= String(p.ifLetOut==null?"":p.ifLetOut);     /* S / L / D */
    const co  = String(p.PropCoOwnedFlg)==="YES";
    const share=N(p.AsseseeShareProperty);
    const bal = N(rd.BalanceALV);
    const aop = N(rd.AnnualOfPropOwned);
    const rnr = N(rd.RentNotRealized);
    const taxes=N(rd.LocalTaxes);
    const unrl= N(rd.TotalUnrealizedAndTax);
    const std = N(rd.ThirtyPercentOfBalance);
    const intc= N(rd.IntOnBorwCap);
    const totd= N(rd.TotalDeduct);
    const int24b=N(RG(rd,"Section24B.TotalInterestUs24B",0));
    const cos = RG(p,"CoOwners",[])||[];
    const tag = " (property "+(i+1)+")";
    /* A253 — new regime: no 24(b) interest for a self-occupied property. */
    A(253, old || type!=="S" || (intc===0 && int24b===0),
      "New regime: interest on borrowed capital u/s 24(b) cannot be claimed for a self-occupied house property."+tag);
    /* A271 — the type of house property is mandatory where 24(b) interest is claimed. */
    A(271, !(intc>0 || int24b>0) || S0(type),
      "The type of house property is mandatory when interest on borrowed capital u/s 24(b) is claimed."+tag);
    /* A298 — Sl.1d total = Sl.1b + Sl.1c (unrealised rent + local taxes). */
    A(298, REQ(unrl, rnr+taxes, 2),
      "House property Sl.1d (total) must equal the sum of Sl.1b (rent not realised) and Sl.1c (local taxes)."+tag);
    /* A299 — Sl.1i total = Sl.1g + Sl.1h (30% deduction + interest on borrowed capital). */
    A(299, REQ(totd, std+intc, 2),
      "House property Sl.1i (total) must equal the sum of Sl.1g (30% deduction) and Sl.1h (interest on borrowed capital)."+tag);
    /* ---- co-ownership-scoped checks ---- */
    if(co){
      const coShare = cos.reduce((a,c)=>a+N(c&&c.PercentShareProperty),0);
      /* A295 — assessee's share + the co-owners' shares = 100%. */
      A(295, REQ(share+coShare, 100, 0.01),
        "Co-owned property: the assessee's share and the co-owners' shares must add up to 100%."+tag);
      /* A296 — annual value of the property owned = own share% × annual value (balance ALV). */
      A(296, REQ(aop, Math.round(share/100*bal), 1),
        "Co-owned property: the annual value of the property owned must be the assessee's percentage share of the annual value."+tag);
      /* A297 — a zero assessee share bars any interest on borrowed capital. */
      A(297, !(share===0) || (intc===0 && int24b===0),
        "Co-owned property: where the assessee's share is zero the interest on borrowed capital cannot be more than zero."+tag);
      /* A300 — the assessee's PAN cannot equal a co-owner's PAN. */
      A(300, !S0(asPAN) || cos.every(c=>!c||!S0(c.PAN_CoOwner)||String(c.PAN_CoOwner).toUpperCase().trim()!==asPAN),
        "Co-owned property: the assessee's PAN and a co-owner's PAN cannot be the same."+tag);
    }
  });

  /* ===================== Chapter VI-A: allowed <= entered (per section) ===================== */
  /* A272–A291 — the eligible (allowed/capped) deduction cannot exceed the user-entered amount. */
  A(272, N(alw.Section80C)<=N(usr.Section80C)+tol,
    "The eligible amount of deduction claimed u/s 80C cannot exceed the amount you entered.");
  A(273, N(alw.Section80CCC)<=N(usr.Section80CCC)+tol,
    "The eligible amount of deduction claimed u/s 80CCC cannot exceed the amount you entered.");
  A(274, N(alw.Section80CCDEmployeeOrSE)<=N(usr.Section80CCDEmployeeOrSE)+tol,
    "The eligible amount of deduction claimed u/s 80CCD(1) cannot exceed the amount you entered.");
  A(275, N(alw.Section80CCD1B)<=N(usr.Section80CCD1B)+tol,
    "The eligible amount of deduction claimed u/s 80CCD(1B) cannot exceed the amount you entered.");
  A(276, N(alw.Section80CCDEmployer)<=N(usr.Section80CCDEmployer)+tol,
    "The eligible amount of deduction claimed u/s 80CCD(2) cannot exceed the amount you entered.");
  A(277, N(alw.Section80D)<=N(usr.Section80D)+tol,
    "The eligible amount of deduction claimed u/s 80D cannot exceed the amount you entered.");
  A(278, N(alw.Section80DD)<=N(usr.Section80DD)+tol,
    "The eligible amount of deduction claimed u/s 80DD cannot exceed the amount you entered.");
  A(279, N(alw.Section80DDB)<=N(usr.Section80DDB)+tol,
    "The eligible amount of deduction claimed u/s 80DDB cannot exceed the amount you entered.");
  A(280, N(alw.Section80E)<=N(usr.Section80E)+tol,
    "The eligible amount of deduction claimed u/s 80E cannot exceed the amount you entered.");
  A(281, N(alw.Section80EE)<=N(usr.Section80EE)+tol,
    "The eligible amount of deduction claimed u/s 80EE cannot exceed the amount you entered.");
  A(282, N(alw.Section80EEA)<=N(usr.Section80EEA)+tol,
    "The eligible amount of deduction claimed u/s 80EEA cannot exceed the amount you entered.");
  A(283, N(alw.Section80EEB)<=N(usr.Section80EEB)+tol,
    "The eligible amount of deduction claimed u/s 80EEB cannot exceed the amount you entered.");
  A(284, N(alw.Section80G)<=N(usr.Section80G)+tol,
    "The eligible amount of deduction claimed u/s 80G cannot exceed the amount you entered.");
  A(285, N(alw.Section80GG)<=N(usr.Section80GG)+tol,
    "The eligible amount of deduction claimed u/s 80GG cannot exceed the amount you entered.");
  A(286, N(alw.Section80GGA)<=N(usr.Section80GGA)+tol,
    "The eligible amount of deduction claimed u/s 80GGA cannot exceed the amount you entered.");
  A(287, N(alw.Section80GGC)<=N(usr.Section80GGC)+tol,
    "The eligible amount of deduction claimed u/s 80GGC cannot exceed the amount you entered.");
  A(288, N(alw.Section80TTA)<=N(usr.Section80TTA)+tol,
    "The eligible amount of deduction claimed u/s 80TTA cannot exceed the amount you entered.");
  A(289, N(alw.Section80TTB)<=N(usr.Section80TTB)+tol,
    "The eligible amount of deduction claimed u/s 80TTB cannot exceed the amount you entered.");
  A(290, N(alw.Section80U)<=N(usr.Section80U)+tol,
    "The eligible amount of deduction claimed u/s 80U cannot exceed the amount you entered.");
  A(291, N(alw.AnyOthSec80CCH)<=N(usr.AnyOthSec80CCH)+tol,
    "The eligible amount of deduction claimed u/s 80CCH cannot exceed the amount you entered.");

  /* ===================== LTCG u/s 112A identity ===================== */
  /* A292 — LTCG u/s 112A = GTI (incl LTCG) − GTI (excl LTCG). */
  A(292, REQ(N(LT.LongCap112A), gtiL - gti, 2),
    "LTCG u/s 112A must equal the difference between gross total income including LTCG and gross total income excluding LTCG.");

  /* ===================== Representative assessee ===================== */
  const REP = RG(FS,"AssesseeRep",{})||{};
  const repOK = S0(REP.RepName) && S0(REP.RepEmailID) && S0(REP.RepMobileNo);
  /* A293 — verification capacity "Representative": name, e-mail and contact are mandatory. */
  A(293, String(VF.Capacity)!=="R" || repOK,
    "Where the verification capacity is 'Representative', the representative's name, e-mail ID and contact number are mandatory.");
  /* A294 — the representative-assessee flag is 'Y': the representative's details must be provided. */
  A(294, String(FS.AsseseeRepFlg)!=="Y" || repOK,
    "Where the return is filed by a representative assessee, the representative's details must be provided.");
});

/* =====================================================================
   ITR-1 · A.Y. 2026-27 — Category-A validation rules, batch enc_07 (Phase 6).
   Serial range A301–A339 (the new-regime EIC-judge exempt-allowance bar; the
   80CCC row-sum identity plus its "add a row" and PRAN gates; the twenty-plus
   ExemptIncAgriOthUs10 single-select drop-downs and the new-regime 10(32) bar;
   the Schedule-80G non-cash IFSC/transaction-reference mandate and the cash
   Rs.2,000 eligibility cap; the Schedule-80GGC name/PAN and mode gates; the
   representative-assessee contact-collision rule; the co-owned house-property
   share rules and the unrealised-rent ceiling; and the Part-A-General
   secondary-address rules).

   Registered via ruleset(fn); runRules() (forms/ITR-1/src/60_rules.js) invokes
   it with (I,S_,A,Dd). A(n,cond,msg) fires (pushes a Category-A block) when cond
   — the "this return is lawful" assertion — is FALSE. Every read is guarded
   (RG / N / (X||{}) / S0); nothing throws. Keys are the built-return ITR1 schema
   paths (I = Object.values(buildReturn().ITR)[0]); the paths and enum codes were
   taken from books/ITR-1/schema_tree.md, rule_census.md, caps.md, enums.json and
   the section builders (70_sec_sal expSal — AllwncExemptUs10 SalNatureDesc/
   SalOthAmount; 70_sec_ded expDed — UsrDeductUndChapVIA.{PensionContribution80CCC,
   PRANDtls,Section80CCC/CCD}, Schedule80G four buckets, Schedule80GGC; 70_sec_ei
   expEi — ExemptIncAgriOthUs10 SubCategory/OthAmount; 70_sec_hp expHP —
   PropertyDetails[] PropCoOwnedFlg/AsseseeShareProperty/CoOwners; 70_sec_ret
   expRet — FilingStatus.AssesseeRep; 70_sec_who expWho — PersonalInfo.Address /
   SecondaryAdd / AlternateAddress). Encoded from each rule's own text (rule 6).

   Regime gate: FilingStatus.OptOutNewTaxRegime — "Y" = OLD regime, "N"/absent =
   NEW regime (default). A301 and A323 are the NEW-regime "must be 0" bars (the
   EIC judge allowance and the 10(32) minor-child exemption). The Chapter-VI-A
   nested leaves (PensionContribution80CCC, PRANDtls) are built only under the
   OLD regime (expDed), which is why A302/A335/A337 read them under a presence
   guard rather than a regime gate.

   Secondary-address note (A339): in the built return PersonalInfo.SecondaryAdd
   is the utility's "add a distinct secondary/communication address?" flag —
   "Y" is the branch under which expWho emits PersonalInfo.AlternateAddress
   (70_sec_who §"SecondaryAdd + AlternateAddress"). So the faithful encoding of
   "the secondary address must not be the same as the primary address" is: when
   SecondaryAdd==="Y" the AlternateAddress signature must differ from the primary
   Address signature. A338 only asks that the flag itself be present.

   Serials in A301–A339 NOT encoded here, and why (bucketed in the census —
   books/ITR-1/rule_census.md — never faked):
     A324 — NA (census). 234-I fee = Rs.1,000 for a 139(5) revised return filed
            after 31.12.2026 with total income <= Rs.5,00,000 — keyed to the
            FILING TIMESTAMP, which the built return does not carry (the portal
            applies it at upload).
     A328 — NA (census). 234-I fee = Rs.5,000 for the same, total income >
            Rs.5,00,000 — filing-timestamp keyed; see A324.
   ===================================================================== */
ruleset(function(I,S_,A,Dd){
  I=I||{};
  const S0=v=>v!=null&&String(v).trim()!=="";          /* "present / non-blank" */
  const LC=v=>String(v==null?"":v).trim().toLowerCase();
  const tol=1;

  /* ---- guarded reads ---- */
  const ID  = RG(I,"ITR1_IncomeDeductions",{})||{};
  const usr = RG(ID,"UsrDeductUndChapVIA",{})||{};      /* entered Chapter VI-A */
  const FS  = RG(I,"FilingStatus",{})||{};
  const PI  = RG(I,"PersonalInfo",{})||{};
  const AD  = RG(PI,"Address",{})||{};
  const AA  = RG(PI,"AlternateAddress",{})||{};
  const AR  = RG(FS,"AssesseeRep",{})||{};

  const old = String(FS.OptOutNewTaxRegime)==="Y";      /* Y = OLD regime */

  /* repeating rows */
  const allw10 = RG(ID,"AllwncExemptUs10.AllwncExemptUs10Dtls",[])||[];
  const eiRows = RG(ID,"ExemptIncAgriOthUs10.ExemptIncAgriOthUs10Dtls",[])||[];
  const pen    = RG(usr,"PensionContribution80CCC",[])||[];   /* 80CCC rows */
  const pran   = RG(usr,"PRANDtls",[])||[];                   /* NPS PRAN rows */
  const props  = RG(ID,"PropertyDetails",[])||[];

  const allwAmt = code => allw10.filter(r=>r&&String(r.SalNatureDesc)===code)
                                .reduce((a,r)=>a+N(r.SalOthAmount),0);
  const eiCount = code => eiRows.filter(r=>r&&String(r.SubCategory)===code).length;
  const eiAmt   = code => eiRows.filter(r=>r&&String(r.SubCategory)===code)
                                .reduce((a,r)=>a+N(r.OthAmount),0);

  /* ===================== Salary — exempt allowances (new regime) ===================== */
  /* A301 — new regime: the judge's exempt income (EIC, Supreme/High Court Judges Act) must be 0. */
  A(301, old || !(allwAmt("EIC")>0),
    "New regime: the exempt allowance for income received by a judge covered under the Supreme Court / High Court Judges (Salaries) Act cannot be more than zero.");

  /* ===================== 80CCC — pension-fund contribution rows ===================== */
  /* A302 — the sum of the individual 80CCC "Amount" rows must equal the 80CCC total. */
  A(302, !pen.length || REQ(N(usr.Section80CCC), pen.reduce((a,r)=>a+N(r&&r.Amount),0), 2),
    "The sum of the individual 80CCC contribution rows (Amount) must equal the total deduction shown against 80CCC in the income details.");

  /* ===================== Exempt income — single-select drop-downs ===================== */
  /* A303–A322 — each ExemptIncAgriOthUs10 sub-category can be selected only once. */
  A(303, eiCount("10(2)")<=1,     "Exempt income: Sec 10(2) (member's share from a HUF) can be selected only once.");
  A(304, eiCount("10(10BB)")<=1,  "Exempt income: Sec 10(10BB) (Bhopal Gas Leak Disaster payments) can be selected only once.");
  A(305, eiCount("10(11A)")<=1,   "Exempt income: Sec 10(11A) (Sukanya Samriddhi Yojana account) can be selected only once.");
  A(306, eiCount("10(12A)")<=1,   "Exempt income: Sec 10(12A) (NPS partial withdrawal) can be selected only once.");
  A(307, eiCount("10(12AA)")<=1,  "Exempt income: Sec 10(12AA) (payment from the National Pension System Trust) can be selected only once.");
  A(308, eiCount("10(12AB)")<=1,  "Exempt income: Sec 10(12AB) (lump sum per notification FX-1/3/2024-PR) can be selected only once.");
  A(309, eiCount("10(12B)")<=1,   "Exempt income: Sec 10(12B) (NPS lump sum at exit/closure) can be selected only once.");
  A(310, eiCount("10(12BA)")<=1,  "Exempt income: Sec 10(12BA) (partial withdrawal from the National Pension System) can be selected only once.");
  A(311, eiCount("10(12C)")<=1,   "Exempt income: Sec 10(12C) (Agniveer Corpus Fund income) can be selected only once.");
  A(312, eiCount("10(15)")<=1,    "Exempt income: Sec 10(15) (interest on specified securities/investments) can be selected only once.");
  A(313, eiCount("10(19A)")<=1,   "Exempt income: Sec 10(19A) (annual value of one palace of an ex-ruler) can be selected only once.");
  A(314, eiCount("10(23AA)")<=1,  "Exempt income: Sec 10(23AA) (sum received on behalf of an armed-forces Fund) can be selected only once.");
  A(315, eiCount("10(23FBB)")<=1, "Exempt income: Sec 10(23FBB) (Sec 115UB income to a unit holder of an investment fund) can be selected only once.");
  A(316, eiCount("10(23FD)")<=1,  "Exempt income: Sec 10(23FD) (unit-holder income from a Business Trust, certain parts) can be selected only once.");
  A(317, eiCount("10(25)")<=1,    "Exempt income: Sec 10(25) (sum received by trustees of an approved superannuation/gratuity/pension fund) can be selected only once.");
  A(318, eiCount("10(32)")<=1,    "Exempt income: Sec 10(32) (minor child's income — small exemption) can be selected only once.");
  A(319, eiCount("10(35)")<=1,    "Exempt income: Sec 10(35) (income from specified Mutual Funds) can be selected only once.");
  A(320, eiCount("10(35A)")<=1,   "Exempt income: Sec 10(35A) (distributed income u/s 115TA from a securitisation trust) can be selected only once.");
  A(321, eiCount("10(43)")<=1,    "Exempt income: Sec 10(43) (reverse-mortgage payments to senior citizens) can be selected only once.");
  A(322, eiCount("10(44)")<=1,    "Exempt income: Sec 10(44) (income for/on behalf of the New Pension System Trust) can be selected only once.");
  /* A323 — new regime: exempt income u/s 10(32) (minor child) must be 0. */
  A(323, old || !(eiAmt("10(32)")>0),
    "New regime: exempt income u/s 10(32) (minor child's income) cannot be more than zero.");

  /* A324 — NA (234-I fee, filing-timestamp keyed); see header. */

  /* ===================== Schedule 80G — donee rows ===================== */
  const G80 = RG(I,"Schedule80G",{})||{};
  const G80BUCKETS=["Don100Percent","Don50PercentNoApprReqd","Don100PercentApprReqd","Don50PercentApprReqd"];
  const g80rows = [];
  if(I.Schedule80G) G80BUCKETS.forEach(bk=>{
    (RG(G80,bk+".DoneeWithPan",[])||[]).forEach(r=>{ if(r) g80rows.push(r); });
  });
  /* A325 — non-cash donation: IFSC and the transaction reference number are mandatory. */
  const g80NoRef = g80rows.some(r=>N(r.DonationAmtOtherMode)>0 && !(S0(r.IFSCCode)&&S0(r.TransactionRefNum)));
  A(325, !g80NoRef,
    "Schedule 80G: the IFSC and the transaction reference number (UPI / cheque / IMPS / NEFT / RTGS) are mandatory when a donation is made in a mode other than cash.");
  /* A326 — duplicate of A325 (both serials present in rules.json). */
  A(326, !g80NoRef,
    "Schedule 80G: the IFSC and the transaction reference number are mandatory when a donation is made in a mode other than cash.");
  /* A327 — a cash donation is eligible only to the extent of Rs.2,000 (or claimed, whichever is lower). */
  const g80Over = g80rows.some(r=>N(r.EligibleDonationAmt) > N(r.DonationAmtOtherMode)+Math.min(N(r.DonationAmtCash),2000)+tol);
  A(327, !g80Over,
    "Schedule 80G: the eligible amount of a cash donation is allowed only to the extent of Rs.2,000 or the amount claimed, whichever is lower.");

  /* A328 — NA (234-I fee, filing-timestamp keyed); see header. */

  /* ===================== Schedule 80GGC — donation to a political party ===================== */
  const ggc = RG(I,"Schedule80GGC.Schedule80GGCDetails",[])||[];
  /* A329 — the political party's name and PAN are necessary to claim the 80GGC deduction. */
  A(329, !I.Schedule80GGC || ggc.every(r=>!r || (S0(r.PoliticalPartyName)&&S0(r.PoliticalPartyPAN))),
    "The name and PAN of the political party are required to claim the deduction u/s 80GGC.");
  /* A330 — each 80GGC row must carry either a cash donation or a donation in another mode. */
  A(330, !I.Schedule80GGC || ggc.every(r=>!r || N(r.DonationAmtCash)>0 || N(r.DonationAmtOtherMode)>0),
    "Schedule 80GGC: either a cash donation or a donation in another mode must be entered under each row.");

  /* ===================== Representative assessee ===================== */
  /* A331 — the representative's email / contact must not match the taxpayer's (primary or secondary). */
  const taxEmails  = [AD.EmailAddress, AD.EmailAddressSec].filter(S0).map(LC);
  const taxMobiles = [AD.MobileNo, AD.MobileNoSec].filter(S0).map(v=>String(v).trim());
  const repEmailClash  = S0(AR.RepEmailID) && taxEmails.indexOf(LC(AR.RepEmailID))>=0;
  const repMobileClash = S0(AR.RepMobileNo) && taxMobiles.indexOf(String(AR.RepMobileNo).trim())>=0;
  A(331, String(FS.AsseseeRepFlg)!=="Y" || !(repEmailClash || repMobileClash),
    "Part A General: the representative assessee's email id and contact number must not match the taxpayer's email id or contact number (primary or secondary).");

  /* ===================== House property — co-ownership & unrealised rent ===================== */
  props.forEach((p,i)=>{
    p=p||{};
    const rd  = RG(p,"Rentdetails",{})||{};
    const co  = String(p.PropCoOwnedFlg)==="YES";
    const shr = N(p.AsseseeShareProperty);
    const cos = RG(p,"CoOwners",[])||[];
    const alv = N(rd.AnnualLetableValue);
    const rnr = N(rd.RentNotRealized);
    const tag = " (property "+(i+1)+")";
    /* A332 — co-owned: the assessee's share must be less than 100%. */
    A(332, !co || shr<100,
      "For a co-owned house property the assessee's percentage share must be less than 100%."+tag);
    /* A333 — co-owned: every other co-owner's share must be greater than 0 and less than 100%. */
    A(333, !co || cos.every(c=>{const s=N(c&&c.PercentShareProperty); return s>0 && s<100;}),
      "For a co-owned house property each other co-owner's percentage share must be greater than 0 and less than 100%."+tag);
    /* A334 — not co-owned: the assessee's share must be 100%. */
    A(334, co || REQ(shr,100,0.5),
      "For a property that is not co-owned the assessee's percentage share must be 100%."+tag);
    /* A336 — unrealised rent cannot exceed the gross rent / annual lettable value. */
    A(336, rnr<=alv+tol,
      "The amount of rent which cannot be realised cannot be more than the gross rent received / receivable (annual lettable value)."+tag);
  });

  /* ===================== NPS PRAN & 80CCC completeness ===================== */
  /* A335 — a PRAN is entered but both 80CCD(1) and 80CCD(1B) are zero. */
  A(335, !(pran.length>0) || N(usr.Section80CCDEmployeeOrSE)>0 || N(usr.Section80CCD1B)>0,
    "A PRAN has been entered but the amounts claimed u/s 80CCD(1) and 80CCD(1B) are both zero.");
  /* A337 — 80CCC claimed: at least one row must carry the identifier type, number and amount. */
  A(337, !(N(usr.Section80CCC)>0) || pen.some(r=>r && S0(r.TypeofIdentifier) && S0(r.NameofIdentifier) && N(r.Amount)>0),
    "When a deduction u/s 80CCC is claimed, at least one row with the type of identifier, the identifier number and the amount must be provided.");

  /* ===================== Part A General — secondary address ===================== */
  /* A338 — the secondary-address flag must be present in the return (Part A General is built). */
  A(338, !I.PersonalInfo || S0(PI.SecondaryAdd),
    "Part A General Information: the secondary-address selection is mandatory in the return of income.");
  /* A339 — when a distinct secondary address is added it must not equal the primary address. */
  const addrSig = a => [a.ResidenceNo,a.ResidenceName,a.RoadOrStreet,a.LocalityOrArea,
    a.CityOrTownOrDistrict,a.StateCode,a.CountryCode,a.PinCode,a.ZipCode]
    .map(v=>LC(v)).join("|");
  A(339, String(PI.SecondaryAdd)!=="Y" || !PI.AlternateAddress || addrSig(AA)!==addrSig(AD),
    "Part A General Information: the secondary address must not be the same as the primary address.");
});

/* =====================================================================
   ITR-1 · A.Y. 2026-27 — Category-D advisory rules, batch enc_08 (Phase 6).
   Serial range D1–D9 (a SEPARATE `n` sequence from the Category-A serials;
   see rule_census.md §"Category D"). Category-D checks are advisory — the
   return may be defective u/s 139(9) but is not blocked — so each fires via
   Dd(n,cond,msg) with the msg prefixed "[D] ". cond is the "lawful / no
   advisory" assertion: TRUE on a compliant return, FALSE on the violation.

   Registered via ruleset(fn); runRules() (forms/ITR-1/src/60_rules.js) invokes
   it with (I,S_,A,Dd). Every read is guarded (RG / N / (X||{})); nothing
   throws. Schedule-scoped blocks sit under `if(I.<block>){...}` so a serial is
   silent when the schedule it targets is absent from the built return. Keys
   are the built-return ITR1 schema paths (I = Object.values(buildReturn().ITR)
   [0]); paths/enum codes taken from books/ITR-1/schema_tree.md §7/§14/§15/§16,
   enums.json and the TDS section-code table PD_TDSSEC in 70_sec_paid.js.

   The rules.json line-wrap offsets each serial's text by ~one physical line
   (raw entry n = tail of semantic rule n−1 + head of semantic rule n); the
   assertions below are encoded to the RE-JOINED semantic rule (constitution
   rule 6), which resolves the wrap into nine clean checks:
     D1        relief u/s 89(1) claimed → furnish Form 10E; quote Aadhaar 139AA.
     D2/D4/D6  a special-rate / not-applicable TDS section code selected in
               Schedule TDS2 (TDSonOthThanSals) →
                 D2 = 194B/194BB/194BA/194IA/194IC/194LA/194S,
                 D4 = 194E/194LB/194LC/194LBA(a)(b)(c)/195/196A/196B/196C/
                      196D/196D(1A),
                 D6 = 194Q/194C/194R.
     D3/D5/D7  the same three code-sets selected in Schedule TDS3
               (ScheduleTDS3Dtls) — ITR-1 not eligible / not applicable.
     D8/D9     TDS on salary (Schedule TDS1) cannot exceed Total Gross Salary
               (D8 = the aggregate TotalTDSonSalaries; D9 = any single TDS1
               row's TotalTDSSal).
   All nine are ENFORCED per rule_census.md (bucket "ENFORCED (Dd)"); none is
   NA / OFFLINE, so none is skipped.

   Note: a special-rate TDS code (e.g. 194B) is offered on the TDS2 grid but
   not on the narrower TDS3 (26QB) grid, so D3/D5/D7 rarely have a code to
   catch in practice — but they read the TDSSection leaf faithfully and stay
   silent when it does not appear, so they cost nothing and mis-fire never.
   ===================================================================== */
ruleset(function(I,S_,A,Dd){
  I=I||{};
  const tol=1;

  /* ---- guarded reads ---- */
  const TC = RG(I,"ITR1_TaxComputation",{})||{};
  const ID = RG(I,"ITR1_IncomeDeductions",{})||{};
  const relief89 = N(TC.Section89);          /* relief u/s 89(1) */
  const grossSal = N(ID.GrossSalary);        /* Total Gross Salary (salary head) */

  /* TDSSection enum codes (verbatim from 70_sec_paid.js PD_TDSSEC / enums.json).
     Each named section is taken with its sub-variant proviso codes, since those
     carry the same special-rate income the advisory is about. */
  const SPECIAL = ["94B","94B-P","4BB","94BA","94BA-P","4IA","4IC","4LA","94S","94S-P"];
    /* 194B / 194BB / 194BA / 194IA / 194IC / 194LA / 194S */
  const NONRES  = ["94E","4LB","4LC1","4LC2","4LC3","4BA1","4BA2","LBA1","LBA2","LBA3",
                   "195","96A","96B","96C","96D","96DA"];
    /* 194E / 194LB / 194LC(2)(i-ic) / 194LBA(a)(b)(c) / 195 / 196A / 196B / 196C / 196D / 196D(1A) */
  const NOTAPPL = ["94Q","94C","94R","94R-P"];
    /* 194Q / 194C / 194R */

  const rows2 = RG(I,"TDSonOthThanSals.TDSonOthThanSal",[])||[];   /* Schedule TDS2 rows */
  const rows3 = RG(I,"ScheduleTDS3Dtls.TDS3Details",[])||[];       /* Schedule TDS3 rows */
  const sal1  = RG(I,"TDSonSalaries.TDSonSalary",[])||[];          /* Schedule TDS1 rows */
  const hasSec=(rows,set)=>rows.some(r=>r&&set.indexOf(String(r.TDSSection))>=0);

  /* ===================== D1 — relief u/s 89(1) / Form 10E ===================== */
  Dd(1, !(relief89>0),
    "[D] Relief u/s 89(1) has been claimed: Form 10E must be furnished on the portal before this return is filed, and Aadhaar must be quoted u/s 139AA in the eligible cases (Circular 03/2023).");

  /* ===== D2/D4/D6 — special-rate & not-applicable TDS codes in Schedule TDS2 ===== */
  if(I.TDSonOthThanSals){
    Dd(2, !hasSec(rows2,SPECIAL),
      "[D] A special-rate TDS section code (194B / 194BB / 194BA / 194IA / 194IC / 194LA / 194S) is selected in Schedule TDS2 (TDS on income other than salary): income taxed at a special rate cannot be returned on ITR-1.");
    Dd(4, !hasSec(rows2,NONRES),
      "[D] A TDS section code applicable only to non-resident / special-rate income (194E / 194LB / 194LC / 194LBA(a)(b)(c) / 195 / 196A / 196B / 196C / 196D / 196D(1A)) is selected in Schedule TDS2: an assessee having such income is not eligible to file ITR-1.");
    Dd(6, !hasSec(rows2,NOTAPPL),
      "[D] A TDS section code for which ITR-1 is not applicable (194Q / 194C / 194R) is selected in Schedule TDS2.");
  }

  /* ===== D3/D5/D7 — the same three code-sets in Schedule TDS3 (26QB) ===== */
  if(I.ScheduleTDS3Dtls){
    Dd(3, !hasSec(rows3,SPECIAL),
      "[D] A special-rate TDS section code (194B / 194BB / 194BA / 194IA / 194IC / 194LA / 194S) is selected in Schedule TDS3 (TDS on income other than salary): income taxed at a special rate cannot be returned on ITR-1.");
    Dd(5, !hasSec(rows3,NONRES),
      "[D] A TDS section code applicable only to non-resident / special-rate income (194E / 194LB / 194LC / 194LBA(a)(b)(c) / 195 / 196A / 196B / 196C / 196D / 196D(1A)) is selected in Schedule TDS3: an assessee having such income is not eligible to file ITR-1.");
    Dd(7, !hasSec(rows3,NOTAPPL),
      "[D] A TDS section code for which ITR-1 is not applicable (194Q / 194C / 194R) is selected in Schedule TDS3.");
  }

  /* ===================== D8/D9 — TDS on salary <= Gross Salary ===================== */
  if(I.TDSonSalaries){
    const totTdsSal = N(RG(I,"TDSonSalaries.TotalTDSonSalaries",0));
    Dd(8, totTdsSal<=grossSal+tol,
      "[D] The total tax deducted at source on salary (Schedule TDS1) cannot be more than the Total Gross Salary declared under the Salary head.");
    const maxRow = sal1.reduce((m,r)=>Math.max(m,N(r&&r.TotalTDSSal)),0);
    Dd(9, maxRow<=grossSal+tol,
      "[D] The tax deducted at source shown in a Schedule TDS1 row cannot be more than the Total Gross Salary declared under the Salary head.");
  }
});

/* =====================================================================
   ITR-1 · Section "bank" — Refund bank account & Verification
   Screen order 95; compute order (corder) 95 — the last section.

   Built ONLY from books/ITR-1:
     · schema_tree.md §11 Refund (lines 37499-37606) and §12 Verification
       (lines 35155-35182)
     · enums.json  AccountType (SB/CA/CC/OD/NRO/OTH, AY26-27 codes) and
       Verification_Capacity (S/R)
     · sections.md §S10
     · skeleton.json (Refund.BankAccountDtls.AddtnlBankDetails=[] and the
       Verification block pre-seeded)

   Owns / writes on export (nobody else writes these leaves):
     · Refund.BankAccountDtls.AddtnlBankDetails[]
         { IFSCCode, BankName, BankAccountNo, AccountType, UseForRefund }
     · Verification.Declaration.{ AssesseeVerName, FatherName, AssesseeVerPAN }
     · Verification.Capacity   (enum S/R — at the Verification level, NOT under
       Declaration; matches the utility's Verification() Mid(...,1,1))
     · Verification.Place

   SEAM with the taxes-paid section (compute order 92): that section OWNS and
   exports Refund.RefundDue (IncD.RefundDue). This section NEVER writes
   RefundDue — it only renders the refund figure read-only (from S.C.paid.refund)
   for context, and fills the bank block + the Verification declaration.

   ITR-1 notes (differ from the ITR-7 reference this mirrors):
     · Refund is a TOP-LEVEL block (Refund.*), not PartB_TTI.Refund.
     · ITR-1 has NO BankDtlsFlag, NO ForeignBankDetails, NO AssetOutsideIndiaFlg.
     · AccountType list EXCLUDES CGAS (Capital Gains scheme) — six codes only.
     · Capacity is Self / Representative assessee (S/R).
     · The utility emits NO Verification.Date leaf for ITR-1 (the e-Filing
       portal stamps the signing date). The date-of-signing field is shown for
       the assessee's convenience but is NOT part of the ITR-1 JSON.
   ===================================================================== */

/* ---- account-type codes — enums.json AccountType (six codes; no CGAS) --- */
const ACCT1=[
  ["SB","Savings Account"],["CA","Current Account"],
  ["CC","Cash Credit Account"],["OD","Over draft account"],
  ["NRO","Non Resident Account"],["OTH","Other"]];
/* ---- capacity codes — enums.json Verification_Capacity (S/R) ----------- */
const VCAP1=[["S","Self"],["R","Representative assessee"]];
/* Yes/No for the "do you hold an account in India" convenience prompt */
const BFLAG1=[["Y","Yes"],["N","No"]];

/* today as DD/MM/YYYY (screen convenience only; not exported for ITR-1) */
const _verToday1=()=>{const d=new Date();
  return String(d.getDate()).padStart(2,"0")+"/"+
         String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();};

/* the refund figure computed by the taxes-paid section (display only) */
function _refundFig1(){const P=S.C.paid||{},T=S.C.tax||{};
  const v=[P.refund,P.refundDue,P.RefundDue,T.refund,T.refundDue].find(x=>x!=null);
  return v==null?0:v;}

/* ---- state (seed only when absent — never clobber shell/import) -------- */
S.bank = S.bank || [];             /* India accounts -> AddtnlBankDetails[] */
S.trp  = S.trp  || {};             /* TaxReturnPreparer (optional; only if a TRP prepared it) */
S.ver  = S.ver  || {};
if(S.ver.cap===undefined)     S.ver.cap="S";             /* Verification.Capacity */
if(S.ver.name===undefined)    S.ver.name="";             /* Declaration.AssesseeVerName */
if(S.ver.father===undefined)  S.ver.father="";           /* Declaration.FatherName */
if(S.ver.pan===undefined)     S.ver.pan="";              /* Declaration.AssesseeVerPAN */
if(S.ver.place===undefined)   S.ver.place="";            /* Verification.Place */
if(S.ver.date===undefined)    S.ver.date=_verToday1();   /* signing date — screen only */
if(S.ver.hasbank===undefined) S.ver.hasbank="Y";         /* convenience prompt only */
if(S.ver.nacc===undefined)    S.ver.nacc="";             /* guidance only, not exported */

/* helper: a genuinely-filled bank row (valid IFSC + account no + bank name) */
function _bkValid1(b){b=b||{};
  return IFSC_RE.test(st0(b.ifsc).toUpperCase())&&!!st0(b.acno)&&!!st0(b.bank);}

/* ---- engine — carries no income; publishes the account count ---------- */
function engBank(){
  const valid=(S.bank||[]).filter(_bkValid1);
  S.C.bank={
    income:0,                                 /* Bank/Verification add nothing to GTI */
    nAcc:valid.length,
    hasRefund:(S.bank||[]).some(b=>(b||{}).refund==="Y")};
}

/* ---- renderer --------------------------------------------------------- */
function secBank(){
  let h="";
  const V=S.ver||{};

  /* --- bank accounts (AddtnlBankDetails[]) --- */
  h+=sub("Bank account for the refund");
  h+=row("Do you hold a bank account in India?",sel("ver.hasbank",BFLAG1,{blank:false}),{req:1});
  h+=row("Number of accounts held at any time during the year",inp("ver.nacc",{n:1}),
    {hint:"dormant accounts excluded"});
  h+=note("Every account held at any time in the year must be reported, except a dormant one. "+
    "Tick at least one account so the refund can be credited to it.");

  h+=grid("bank",[
    {k:"ifsc",h:"IFS code of the bank",t:"txt",w:"150px",max:11,req:1},
    {k:"bank",h:"Name of the bank",t:"txt",w:"auto",max:125,req:1},
    {k:"acno",h:"Account number",t:"txt",w:"200px",max:30,req:1},
    {k:"type",h:"Type of account",t:"sel",w:"210px",req:1,opts:ACCT1},
    {k:"refund",h:"For the refund",t:"chk",w:"120px"}],
    S.bank,{min:"1000px",empty:"No account given — a refund cannot be credited.",add:"Add an account"});
  h+=note("The IFS code is eleven characters: four letters, then a zero, then six letters or digits.");

  /* --- refund figure (owned by the taxes-paid section; read-only here) --- */
  h+=row("Refund due (computed on the taxes-paid screen)",cell(_refundFig1()),
    {ref:"Refund.RefundDue",hint:"credited to the ticked account above"});

  /* --- Verification (Verification block) --- */
  h+=sub("Verification");
  h+=note("<b>I,</b> the person named below, <b>solemnly declare</b> that to the best of my knowledge "+
    "and belief the information given in this return is correct and complete and is in accordance with "+
    "the provisions of the Income-tax Act, 1961, and that I am competent to make this return and verify it.");
  h+=row("I, (full name in block letters)",inp("ver.name",{max:125}),{req:1,ref:"AssesseeVerName"});
  h+=row("Son / daughter of",inp("ver.father",{max:125}),{req:1,ref:"FatherName"});
  h+=row("PAN of the person verifying",inp("ver.pan",{max:10}),
    {req:1,ref:"AssesseeVerPAN",hint:"an individual PAN — the fourth letter must be P"});
  h+=row("Making this return in my capacity as",sel("ver.cap",VCAP1,{blank:false}),{req:1,ref:"Capacity"});
  h+=row("Place",inp("ver.place",{max:50}),{req:1,ref:"Place"});
  h+=row("Date of signing",dte("ver.date"),
    {hint:"ITR-1's JSON carries no signing-date field — the e-Filing portal stamps it"});
  if(V.cap==="R")
    h+=note("Capacity is <b>Representative assessee</b>: the representative's details and the "+
      "Secondary Address in Personal Information must be completed.","warn");

  /* --- Tax return preparer (TaxReturnPreparer — optional, only if a TRP prepared it) --- */
  h+=sub("Tax return preparer");
  h+=note("Fill this only if a Tax Return Preparer prepared the return. Leave it blank otherwise "+
    "— the TaxReturnPreparer block is then omitted.");
  h+=row("Identification number of the TRP",inp("trp.id",{max:20}),
    {ref:"TaxReturnPreparer.IdentificationNoOfTRP"});
  h+=row("Name of the TRP",inp("trp.name",{max:125}),{ref:"TaxReturnPreparer.NameOfTRP"});
  h+=row("Amount to be reimbursed by the Government to the TRP",inp("trp.reimb",{n:1}),
    {ref:"TaxReturnPreparer.ReImbFrmGov"});

  return h;
}

/* ---- export — writes ONLY the bank block + the Verification declaration - */
function expBank(j){
  const V=S.ver||{};

  /* India accounts -> AddtnlBankDetails[] (only complete rows) */
  const bk=(S.bank||[]).filter(_bkValid1);
  if(bk.length){
    if(!j.Refund) j.Refund={};
    if(!j.Refund.BankAccountDtls) j.Refund.BankAccountDtls={};
    j.Refund.BankAccountDtls.AddtnlBankDetails=bk.map(b=>({
      IFSCCode:st0(b.ifsc).toUpperCase(),
      BankName:st0(b.bank).slice(0,125),
      BankAccountNo:st0(b.acno).slice(0,30),
      AccountType:ACCT1.some(a=>a[0]===b.type)?b.type:"SB",
      UseForRefund:b.refund==="Y"?"true":"false"}));
  }
  /* NOTE: Refund.RefundDue is owned and written by the taxes-paid section. */

  /* Verification — all leaves required; always present (NA fallback). */
  put(j,"Verification.Declaration.AssesseeVerName",(sv(V.name)||"NA").slice(0,125));
  put(j,"Verification.Declaration.FatherName",(sv(V.father)||"NA").slice(0,125));
  put(j,"Verification.Declaration.AssesseeVerPAN",(sv(st0(V.pan).toUpperCase())||"AAAPA0000A"));
  put(j,"Verification.Capacity",V.cap==="R"?"R":"S");
  put(j,"Verification.Place",(sv(V.place)||"NA").slice(0,50));

  /* TaxReturnPreparer — conditional block; emitted ONLY when a TRP identification
     number is present (schema §13). Absent here (self-filed) -> block omitted (NA). */
  const T=S.trp||{};
  if(sv(T.id)){
    put(j,"TaxReturnPreparer.IdentificationNoOfTRP",sv(T.id).slice(0,20));
    put(j,"TaxReturnPreparer.NameOfTRP",(sv(T.name)||"NA").slice(0,125));
    put(j,"TaxReturnPreparer.ReImbFrmGov",n0(T.reimb));
  }
}

/* ---- import (inverse) — seeds S.bank / S.ver from a return ------------- */
function impBank(I){
  const read=[]; const g=(o,p)=>p.split(".").reduce((t,k)=>t==null?undefined:t[k],o);
  const bk=g(I,"Refund.BankAccountDtls.AddtnlBankDetails");
  if(Array.isArray(bk)&&bk.length){
    S.bank=bk.map(b=>({
      ifsc:b.IFSCCode||"",bank:b.BankName||"",acno:b.BankAccountNo||"",
      type:ACCT1.some(a=>a[0]===b.AccountType)?b.AccountType:"SB",
      refund:b.UseForRefund==="true"?"Y":"N"}));
    read.push("bank accounts ("+S.bank.length+")");
  }
  const Vb=I&&I.Verification;
  if(Vb){
    S.ver=S.ver||{};
    if(Vb.Place)S.ver.place=Vb.Place;
    S.ver.cap=VCAP1.some(c=>c[0]===Vb.Capacity)?Vb.Capacity:(S.ver.cap||"S");
    const D=Vb.Declaration||{};
    S.ver.name  = D.AssesseeVerName||S.ver.name||"";
    S.ver.father= D.FatherName||S.ver.father||"";
    S.ver.pan   = D.AssesseeVerPAN||S.ver.pan||"";
    read.push("verification");
  }
  const T=I&&I.TaxReturnPreparer;
  if(T){
    S.trp=S.trp||{};
    if(T.IdentificationNoOfTRP!=null)S.trp.id=T.IdentificationNoOfTRP;
    if(T.NameOfTRP!=null)S.trp.name=T.NameOfTRP;
    if(T.ReImbFrmGov!=null)S.trp.reimb=T.ReImbFrmGov;
    read.push("tax return preparer");
  }
  return read;
}

/* ---- checks — the section's own screen validations -------------------- */
function chkBank(){
  const out=[]; engBank();
  const V=S.ver||{};
  const noBank=V.hasbank==="N";

  /* --- bank accounts --- */
  if(!(S.bank||[]).length){
    out.push({lvl:noBank?"warn":"err",t:"Bank account",
      m:"At least one bank account in India is needed for the refund to be credited.",sec:"bank"});
  } else {
    if(!S.bank.some(b=>b.refund==="Y"))
      out.push({lvl:"err",t:"Refund account",m:"Tick at least one account to receive the refund.",sec:"bank"});
    (S.bank||[]).forEach((b,i)=>{
      b=b||{};const n=i+1;
      const started=st0(b.ifsc)||st0(b.acno)||st0(b.bank);
      if(!started) return;
      if(!IFSC_RE.test(st0(b.ifsc).toUpperCase()))
        out.push({lvl:"err",t:"Bank row "+n,m:"The IFS code is four letters, a zero, then six letters or digits.",sec:"bank"});
      if(!st0(b.bank))out.push({lvl:"err",t:"Bank row "+n,m:"The name of the bank is required.",sec:"bank"});
      if(!st0(b.acno))out.push({lvl:"err",t:"Bank row "+n,m:"The account number is required.",sec:"bank"});
      if(!ACCT1.some(a=>a[0]===b.type))out.push({lvl:"err",t:"Bank row "+n,m:"Select the type of account.",sec:"bank"});
    });
  }

  /* --- verification --- */
  if(!st0(V.name))
    out.push({lvl:"err",t:"Verification",m:"The full name of the person verifying the return is required.",sec:"bank"});
  if(!st0(V.father))
    out.push({lvl:"err",t:"Father's name",m:"The schema makes the father's name compulsory.",sec:"bank"});
  const pan=st0(V.pan).toUpperCase();
  if(!PAN_RE.test(pan))
    out.push({lvl:"err",t:"Verifier's PAN",m:"A valid ten-character PAN of the person verifying is required.",sec:"bank"});
  else if(pan.charAt(3)!=="P")
    out.push({lvl:"warn",t:"Verifier's PAN",m:"The fourth letter of an individual's PAN should be P.",sec:"bank"});
  if(!VCAP1.some(c=>c[0]===V.cap))
    out.push({lvl:"err",t:"Capacity",m:"Select the capacity in which the return is made.",sec:"bank"});
  if(!st0(V.place))
    out.push({lvl:"err",t:"Place",m:"The place of signing is required in the verification.",sec:"bank"});

  if(!out.length){
    const n=(S.C.bank||{}).nAcc||0;
    out.push({lvl:"ok",t:"Bank and verification",
      m:"Verified by "+st0(V.name)+" as "+((VCAP1.find(c=>c[0]===V.cap)||["","Self"])[1])+
        "; "+n+" account"+(n===1?"":"s")+" reported; every check passes.",sec:"bank"});
  }
  return out;
}

/* =====================================================================
   ITR-1 · Section "ded" — Chapter VI-A deductions  (screen order 60,
   compute order 50).  The heaviest section: it owns the entered block, the
   allowed/capped block, AND every old-regime detail schedule (the prior
   builder collected these but never exported them — here they are emitted
   and they feed the allowed figure).

   OWNS, on export:
     ITR1_IncomeDeductions.UsrDeductUndChapVIA   (entered — 20 sections)
        + PensionContribution80CCC[]  (80CCC: TypeofIdentifier/Name/Amount)
        + PRANDtls[]                  (80CCD(1)/(1B) PRAN numbers)
        + NameOfSpecDisease80DDB      (80DDB disease enum)
        + Form10BAAckNum              (80GG Form 10BA)
        + TotalChapVIADeductions
     ITR1_IncomeDeductions.DeductUndChapVIA      (allowed/capped — 20 sections)
        + TotalChapVIADeductions
     Old-regime detail schedules (emitted only when OptOutNewTaxRegime=='Y'):
        Schedule80C, Schedule80D, Schedule80DD, Schedule80U,
        Schedule80E, Schedule80EE, Schedule80EEA, Schedule80EEB,
        Schedule80G, Schedule80GGA, Schedule80GGC

   Caps enforced EXACTLY (books/ITR-1/caps.md §3-§4):
     80C+80CCC+80CCD(1) group  1,50,000 (proportional trim)
     80CCD(1)  10% of salary   ·  80CCD(1B)  50,000
     80CCD(2)  14% (CGOV/SGOV) / 10% (other) of salary   [survives new regime]
     80CCH(2)  no fixed cap                               [survives new regime]
     80D  age-based least-of over the four insurer sub-blocks (25k/50k)
     80DD 75,000 (40-80%) / 1,25,000 (severe ≥80%)
     80DDB 40,000 / 1,00,000 (senior patient)
     80U  75,000 / 1,25,000 (severe)
     80E full · 80EE 50,000 · 80EEA 1,50,000 · 80EEB 1,50,000
     80G eligible per bucket (100/50 %, with/without the 10%-of-adjusted-GTI limit)
     80GG 60,000 · 80GGA full (cash >2,000 barred) · 80GGC full (cash barred)
     80TTA 10,000 (savings interest, non-senior)
     80TTB 50,000 (deposit interest, resident senior)
   NEW regime: only 80CCD(2)+80CCH(2) stand; everything else 0 and the detail
   schedules are neither rendered nor exported.

   Publishes S.C.ded.total (the allowed Chapter-VI-A total, capped at income).
   Reads S.C.ret.regime, S.C.who.senior, S.C.sal.netSalary, S.C.os.{sav,dep},
   S.C.sal.income / S.C.hp.income / S.C.os.income (adjusted-GTI base for 80G).
   Every read guarded; nothing throws.
   ===================================================================== */

/* ---- cross-section reads (guarded) --------------------------------- */
function ded_regOld(){
  const r = RG(S.C,"ret.regime",null);
  if(r==null||r==="") return (typeof isNew==="function") ? !isNew() : ((S.fs||{}).optout==="Yes");
  const s = String(r).toLowerCase();
  return s==="old"||s==="y"||s==="yes"||s==="2";
}
function ded_senior(){
  /* 80TTB is for a resident senior citizen aged 60 or above — this MUST
     include super-seniors (>=80), so gate on who.seniorAny (age>=60), not
     who.senior (which is 60-79 only, dropping the super-senior). */
  const w = RG(S.C,"who.seniorAny",null);
  if(w!=null) return !!w;
  const w2 = RG(S.C,"who.senior",null);
  if(w2!=null) return !!w2;
  return (typeof senior==="function") ? senior() : false;
}
function ded_netSal(){ return N(RG(S.C,"sal.netSalary",0)); }
function ded_govt(){ const e=st0(RG(S,"pi.empcat","")); return e==="CGOV"||e==="SGOV"; }

/* ---- small builders ------------------------------------------------ */
function ded_loanInt(arr){ return (arr||[]).reduce((a,r)=>a+n0(r.int),0); }
/* a donation row's eligible base before the 100/50 % factor: the "other mode"
   amount always counts; cash counts only up to ₹2,000 (cash > 2,000 barred) */
function ded_gBase(r){ const cash=n0(r.cash); return n0(r.other)+(cash<=2000?cash:0); }

/* ---- 80D age-based eligible (caps.md §4) --------------------------- */
function ded_80D(){
  const d = S.ded.d80||{};
  const block = (flag, prem, prev, med, skipCode) => {
    if(flag===skipCode) return 0;
    const sr  = flag==="Y";
    const cap = sr?50000:25000;
    const base = n0(prem) + (sr?n0(med):0) + Math.min(n0(prev),5000);
    return Math.min(base, cap);
  };
  const self = block(d.selfSr||"N",
      (d.selfSr==="Y"?d.hiSelfSr:d.hiSelf),
      (d.selfSr==="Y"?d.phcSelfSr:d.phcSelf),
      d.medSelfSr, "S");
  const par  = block(d.parSr||"P",
      (d.parSr==="Y"?d.hiParSr:d.hiPar),
      (d.parSr==="Y"?d.phcParSr:d.phcPar),
      d.medParSr, "P");
  return { self:R(self), par:R(par), total:R(self+par) };
}

/* ---- 80G eligible with the qualifying limit ------------------------ */
function ded_80G(adjGTI){
  const A=S.ded.g100||[], B=S.ded.g50||[], C=S.ded.g100q||[], Dq=S.ded.g50q||[];
  const sumBase = arr => (arr||[]).reduce((a,r)=>a+ded_gBase(r),0);
  const baseA=sumBase(A), baseB=sumBase(B), baseC=sumBase(C), baseD=sumBase(Dq);
  const eligA=baseA;                 /* 100% no limit */
  const eligB=R(0.5*baseB);          /* 50% no limit */
  /* qualifying-limit buckets: 10% of adjusted GTI, C then D, proportional */
  const qLimit = Math.max(0, R(0.10*adjGTI));
  const qTotal = baseC + baseD;
  let eligC=0, eligD=0, scale=1;
  if(qTotal>0){
    const allowedQ = Math.min(qTotal, qLimit);
    scale = allowedQ/qTotal;
    eligC = R(baseC*scale);          /* 100% of the scaled portion */
    eligD = R(0.5*baseD*scale);      /*  50% of the scaled portion */
  }
  return { baseA,baseB,baseC,baseD, eligA,eligB,eligC,eligD, scale, qLimit,
    total:R(eligA+eligB+eligC+eligD) };
}

/* ---- the engine ---------------------------------------------------- */
function engDed(){
  const D = S.ded, old = ded_regOld(), sr = ded_senior(), net = ded_netSal();
  const C = S.C.ded = { old, ent:{}, alw:{}, why:{}, total:0 };

  /* ===== entered amounts (from the schedules / direct inputs) ===== */
  const ent = {};
  ent.Section80C   = (D.c80c||[]).reduce((a,r)=>a+n0(r.amt),0);
  ent.Section80CCC = (D.pen ||[]).reduce((a,r)=>a+n0(r.amt),0);
  ent.Section80CCDEmployeeOrSE = n0(D.ccd1);
  ent.Section80CCD1B           = n0(D.ccd1b);
  ent.Section80CCDEmployer     = n0(D.ccd2);
  ent.AnyOthSec80CCH           = n0(D.cch);
  const d80 = ded_80D();
  ent.Section80D = R(d80.self+d80.par);
  ent.Section80DD  = st0((D.dd||{}).nature) ? ((D.dd.nature==="2")?125000:75000) : 0;
  ent.Section80U   = st0((D.u ||{}).nature) ? ((D.u.nature ==="2")?125000:75000) : 0;
  ent.Section80DDB = n0((D.ddb||{}).amt);
  ent.Section80E   = ded_loanInt(D.e80);
  ent.Section80EE  = ded_loanInt(D.ee80);
  ent.Section80EEA = ded_loanInt(D.eea80);
  ent.Section80EEB = ded_loanInt(D.eeb80);
  const gAll = ded_80G(0);   /* base donations, before the qualifying limit */
  ent.Section80G   = R(gAll.baseA + gAll.baseB + gAll.baseC + gAll.baseD);
  ent.Section80GG  = n0((D.gg||{}).amt);
  ent.Section80GGA = (D.gga||[]).reduce((a,r)=>a+ded_gBase(r),0);
  ent.Section80GGC = (D.ggc||[]).reduce((a,r)=>a+n0(r.other),0);   /* political: cash barred */
  ent.Section80TTA = n0(D.tta);
  ent.Section80TTB = n0(D.ttb);

  /* ===== allowed amounts (caps) ===== */
  const alw = {}, why = {};
  const set = (k,v,reason)=>{ alw[k]=R(Math.max(0,v)); if(reason) why[k]=reason; };

  /* the two that survive the new regime */
  const govtPct = ded_govt()?0.14:0.10;
  set("Section80CCDEmployer", Math.min(ent.Section80CCDEmployer, R(govtPct*net)),
    ent.Section80CCDEmployer>R(govtPct*net)?"limited to "+(ded_govt()?"14":"10")+"% of salary":"");
  set("AnyOthSec80CCH", ent.AnyOthSec80CCH);

  if(!old){
    /* new regime — everything else is disallowed and zero */
    ["Section80C","Section80CCC","Section80CCDEmployeeOrSE","Section80CCD1B",
     "Section80D","Section80DD","Section80DDB","Section80E","Section80EE","Section80EEA",
     "Section80EEB","Section80G","Section80GG","Section80GGA","Section80GGC","Section80U",
     "Section80TTA","Section80TTB"].forEach(k=>{
      alw[k]=0; if(ent[k]) why[k]="closed by section 115BAC";
    });
  } else {
    /* 80C-group with the ₹1.5L aggregate ceiling (and 80CCD(1) 10%-of-salary) */
    let c1  = Math.min(ent.Section80CCDEmployeeOrSE, R(0.10*net));
    if(ent.Section80CCDEmployeeOrSE>R(0.10*net)) why.Section80CCDEmployeeOrSE="limited to 10% of salary";
    let c80c=ent.Section80C, cccc=ent.Section80CCC;
    let grp = c80c+cccc+c1;
    if(grp>150000){
      const f=150000/grp;
      c80c=R(c80c*f); cccc=R(cccc*f); c1=150000-c80c-cccc;
      why.Section80C="80C, 80CCC and 80CCD(1) together stop at ₹1,50,000";
    }
    set("Section80C",c80c,why.Section80C);
    set("Section80CCC",cccc);
    set("Section80CCDEmployeeOrSE",c1,why.Section80CCDEmployeeOrSE);

    set("Section80CCD1B", Math.min(ent.Section80CCD1B,50000),
      ent.Section80CCD1B>50000?"capped at ₹50,000":"");
    set("Section80D", d80.total);
    set("Section80DD", ent.Section80DD);
    set("Section80DDB", Math.min(ent.Section80DDB, ((D.ddb||{}).senior==="Y")?100000:40000),
      ent.Section80DDB>(((D.ddb||{}).senior==="Y")?100000:40000)?"capped at "+RS(((D.ddb||{}).senior==="Y")?100000:40000):"");
    set("Section80U", ent.Section80U);
    set("Section80E", ent.Section80E);
    set("Section80EE", Math.min(ent.Section80EE,50000), ent.Section80EE>50000?"capped at ₹50,000":"");
    set("Section80EEA",Math.min(ent.Section80EEA,150000),ent.Section80EEA>150000?"capped at ₹1,50,000":"");
    set("Section80EEB",Math.min(ent.Section80EEB,150000),ent.Section80EEB>150000?"capped at ₹1,50,000":"");
    set("Section80GG", Math.min(ent.Section80GG,60000), ent.Section80GG>60000?"capped at ₹60,000":"");
    set("Section80GGA", ent.Section80GGA);
    set("Section80GGC", ent.Section80GGC);

    /* 80TTA / 80TTB — mutually exclusive by age, limited to the interest earned */
    const sav=N(RG(S.C,"os.sav",0)), dep=N(RG(S.C,"os.dep",0));
    if(sr){
      set("Section80TTA",0, ent.Section80TTA?"a senior citizen claims 80TTB":"");
      set("Section80TTB", Math.min(ent.Section80TTB, 50000, sav+dep),
        ent.Section80TTB>Math.min(50000,sav+dep)?"limited to ₹50,000 / the deposit interest":"");
    } else {
      set("Section80TTB",0, ent.Section80TTB?"80TTB is for a resident senior citizen":"");
      set("Section80TTA", Math.min(ent.Section80TTA, 10000, sav),
        ent.Section80TTA>Math.min(10000,sav)?"limited to ₹10,000 / the savings interest":"");
    }

    /* 80G — the qualifying limit needs an adjusted-GTI base net of the other
       Chapter-VI-A deductions computed above */
    const incBase = Math.max(0,
       N(RG(S.C,"sal.income", Math.max(0,net-(old?50000:75000)))) +
       N(RG(S.C,"hp.income",0)) + N(RG(S.C,"os.income",0)));
    let sub80=0; Object.keys(alw).forEach(k=>{ if(k!=="Section80G") sub80+=alw[k]; });
    const adjGTI = Math.max(0, incBase - sub80);
    const g = ded_80G(adjGTI);
    C.g = g;
    set("Section80G", g.total);
  }

  /* totals */
  let total=0; Object.keys(alw).forEach(k=>total+=alw[k]);
  /* the allowed total cannot exceed the income it is set against */
  const incBase = Math.max(0,
     N(RG(S.C,"sal.income", Math.max(0,net-(old?50000:75000)))) +
     N(RG(S.C,"hp.income",0)) + N(RG(S.C,"os.income",0)));
  const capped = Math.min(total, incBase);

  C.ent=ent; C.alw=alw; C.why=why; C.d80=d80;
  C.entTotal=R(total===0?0:Object.keys(ent).reduce((a,k)=>a+n0(ent[k]),0));
  C.total=R(capped);          /* published: allowed Chapter-VI-A total */
  C.allowedRaw=R(total);
  C.clipped=total>incBase;
}

/* ---- renderer ------------------------------------------------------ */
function secDed(){
  const C = S.C.ded||{}, alw=C.alw||{}, why=C.why||{}, old=C.old, D=S.ded;
  let h = "";

  if(!old){
    h += note("<b>Under section 115BAC only two Chapter-VI-A deductions survive</b> — the "+
      "employer's contribution under 80CCD(2) and the Agniveer Corpus Fund under 80CCH(2). "+
      "The rest are closed in the new regime; switch to the old regime to claim them.","stop");
    h += row("80CCD(2) — employer's contribution to a pension scheme", inp("ded.ccd2",{n:1}),
      {ref:"5e", v2:cell(alw.Section80CCDEmployer), hint:"14% of salary (Government) / 10% (other)"});
    h += row("80CCH(2) — Agniveer Corpus Fund", inp("ded.cch",{n:1}),
      {ref:"5w", v2:cell(alw.AnyOthSec80CCH)});
    h += row("Total Chapter VI-A deductions allowed", cell(C.total), {cls:"grand", ref:"C1"});
    return h;
  }

  /* --- headline table (entered vs allowed) --- */
  h += '<div class="r sub"><div class="l">Section</div><div class="ref"></div>'+
       '<div class="v2 hd2">You claim</div><div class="v hd2">Allowed</div></div>';

  /* 80C group */
  h += row("80C — total of the items listed below", cell(alw.Section80C),
    {ref:"5a", v2:cell((C.ent||{}).Section80C), hint:why.Section80C||"group ceiling ₹1,50,000"});
  h += fold("d_80c","","80C — items claimed (life insurance, PF, tuition, housing principal …)",
    (C.ent&&C.ent.Section80C?RS(C.ent.Section80C):""),
    grid("ded.c80c",[
      {k:"kind",h:"Item",t:"sel",w:"230px",opts:DED_80C_KIND},
      {k:"idno",h:"Identifier / policy / account number",t:"txt",w:"auto"},
      {k:"amt",h:"Amount",t:"num",w:"150px",req:1}],
      D.c80c,{min:"720px",empty:"No 80C item listed.",add:"Add an 80C item",
        foot:[{l:1,v:"Total 80C",span:2},{v:(C.ent||{}).Section80C||0}]}) +
    note("The group of 80C, 80CCC and 80CCD(1) together is capped at ₹1,50,000."));

  /* 80CCC */
  h += row("80CCC — pension fund", cell(alw.Section80CCC), {ref:"5b", v2:cell((C.ent||{}).Section80CCC)});
  h += fold("d_80ccc","","80CCC — pension-fund contribution (PRAN / other)",
    (C.ent&&C.ent.Section80CCC?RS(C.ent.Section80CCC):""),
    grid("ded.pen",[
      {k:"type",h:"Type of identifier",t:"sel",w:"180px",opts:DED_IDTYPE,req:1},
      {k:"name",h:"Name of the identifier",t:"txt",w:"auto",req:1},
      {k:"amt",h:"Amount",t:"num",w:"150px",req:1}],
      D.pen,{min:"680px",empty:"No 80CCC contribution.",add:"Add a contribution",
        foot:[{l:1,v:"Total 80CCC",span:2},{v:(C.ent||{}).Section80CCC||0}]}));

  /* 80CCD(1) / (1B) / (2) */
  h += row("80CCD(1) — own contribution to a pension scheme", inp("ded.ccd1",{n:1}),
    {ref:"5c", v2:cell(alw.Section80CCDEmployeeOrSE), hint:why.Section80CCDEmployeeOrSE||"within the ₹1.5L group; 10% of salary"});
  h += row("80CCD(1B) — further NPS contribution", inp("ded.ccd1b",{n:1}),
    {ref:"5d", v2:cell(alw.Section80CCD1B), hint:"ceiling ₹50,000"});
  h += row("80CCD(2) — employer's contribution", inp("ded.ccd2",{n:1}),
    {ref:"5e", v2:cell(alw.Section80CCDEmployer), hint:"14% of salary (Government) / 10% (other)"});
  if(N(D.ccd1)||N(D.ccd1b))
    h += fold("d_pran","","PRAN — for the NPS contributions claimed", "",
      grid("ded.pran",[{k:"pran",h:"PRAN number",t:"txt",w:"auto",req:1}],
        D.pran,{min:"420px",empty:"No PRAN given.",add:"Add a PRAN"}));

  /* 80D */
  h += row("80D — health insurance and preventive check-up", cell(alw.Section80D),
    {ref:"5g", v2:cell((C.ent||{}).Section80D)});
  h += fold("d_80d","","80D — health insurance, self / family and parents",
    (C.ent&&C.ent.Section80D?RS(alw.Section80D):""),
    row("Is the person or a family member (other than a parent) a senior citizen?",
      sel("ded.d80.selfSr",DED_SELFSR,{blank:false}),{req:1})+
    sub("Self and family")+
    row("Health insurance premium (non-senior)",inp("ded.d80.hiSelf",{n:1}),{ind:1})+
    row("Preventive health check-up (non-senior)",inp("ded.d80.phcSelf",{n:1}),{ind:1,hint:"within ₹5,000"})+
    row("Health insurance premium (senior)",inp("ded.d80.hiSelfSr",{n:1}),{ind:1})+
    row("Preventive health check-up (senior)",inp("ded.d80.phcSelfSr",{n:1}),{ind:1,hint:"within ₹5,000"})+
    row("Medical expenditure — senior, where no health insurance",inp("ded.d80.medSelfSr",{n:1}),{ind:1})+
    row("Is any one of the parents a senior citizen?",sel("ded.d80.parSr",DED_PARSR,{blank:false}),{req:1})+
    sub("Parents")+
    row("Health insurance premium (non-senior)",inp("ded.d80.hiPar",{n:1}),{ind:1})+
    row("Preventive health check-up (non-senior)",inp("ded.d80.phcPar",{n:1}),{ind:1,hint:"within ₹5,000"})+
    row("Health insurance premium (senior)",inp("ded.d80.hiParSr",{n:1}),{ind:1})+
    row("Preventive health check-up (senior)",inp("ded.d80.phcParSr",{n:1}),{ind:1,hint:"within ₹5,000"})+
    row("Medical expenditure — senior, where no health insurance",inp("ded.d80.medParSr",{n:1}),{ind:1})+
    row("80D eligible — computed",cell(alw.Section80D),{cls:"tot"})+
    note("The ceiling is ₹25,000 for self and family, ₹50,000 where a senior citizen is covered, "+
      "and the same again for parents. Preventive health check-up sits inside those ceilings."));

  /* 80DD */
  h += row("80DD — maintenance of a dependant with a disability", cell(alw.Section80DD),
    {ref:"5h", v2:cell((C.ent||{}).Section80DD)});
  h += fold("d_80dd","","80DD — dependant with a disability",
    (C.ent&&C.ent.Section80DD?RS(alw.Section80DD):""),
    row("Nature of the disability",sel("ded.dd.nature",DED_NATDIS),{req:1,hint:"75,000 (40-80%) / 1,25,000 (severe)"})+
    row("Type of the disability",sel("ded.dd.type",DED_TYPDIS),{req:1})+
    row("Type of dependant",sel("ded.dd.depType",DED_DEPTYPE),{req:1})+
    row("PAN of the dependant",inp("ded.dd.pan",{max:10}))+
    row("Aadhaar of the dependant",inp("ded.dd.aadhaar",{max:12}))+
    row("Acknowledgement number of Form 10-IA",inp("ded.dd.form10ia",{max:15}),{req:1})+
    row("UDID number",inp("ded.dd.udid",{max:20}))+
    formNote("<b>Form 10-IA</b> has to be filed before the return."));

  /* 80DDB */
  h += row("80DDB — treatment of a specified disease", inp("ded.ddb.amt",{n:1}),
    {ref:"5i", v2:cell(alw.Section80DDB), hint:why.Section80DDB||"40,000 / 1,00,000 (senior patient)"});
  if(N((D.ddb||{}).amt))
    h += fold("d_80ddb","","80DDB — specified disease","",
      row("Name of the specified disease",sel("ded.ddb.disease",DED_DISEASE),{req:1})+
      row("Is the patient a senior citizen (60 or above)?",
        sel("ded.ddb.senior",[["N","No"],["Y","Yes"]],{blank:false}),{req:1})+
      formNote("A prescription from a specialist under rule 11DD has to be kept on record."));

  /* 80E / 80EE / 80EEA / 80EEB */
  h += row("80E — interest on an education loan", cell(alw.Section80E),
    {ref:"5j", v2:cell((C.ent||{}).Section80E), hint:"full interest, no ceiling"});
  h += fold("d_80e","","80E — education-loan interest",
    (C.ent&&C.ent.Section80E?RS(C.ent.Section80E):""), ded_loanGrid("ded.e80",D.e80));
  h += row("80EE — housing-loan interest (first-time buyer)", cell(alw.Section80EE),
    {ref:"5k", v2:cell((C.ent||{}).Section80EE), hint:why.Section80EE||"ceiling ₹50,000"});
  h += fold("d_80ee","","80EE — housing-loan interest",
    (C.ent&&C.ent.Section80EE?RS(C.ent.Section80EE):""), ded_loanGrid("ded.ee80",D.ee80));
  h += row("80EEA — interest on a loan for affordable housing", cell(alw.Section80EEA),
    {ref:"5l", v2:cell((C.ent||{}).Section80EEA), hint:why.Section80EEA||"ceiling ₹1,50,000"});
  h += fold("d_80eea","","80EEA — affordable-housing loan interest",
    (C.ent&&C.ent.Section80EEA?RS(C.ent.Section80EEA):""),
    row("Stamp-duty value of the property",inp("ded.eeaStamp",{n:1}),{hint:"must be ₹45 lakh or less"})+
    ded_loanGrid("ded.eea80",D.eea80));
  h += row("80EEB — interest on a loan to buy an electric vehicle", cell(alw.Section80EEB),
    {ref:"5m", v2:cell((C.ent||{}).Section80EEB), hint:why.Section80EEB||"ceiling ₹1,50,000"});
  h += fold("d_80eeb","","80EEB — electric-vehicle loan interest",
    (C.ent&&C.ent.Section80EEB?RS(C.ent.Section80EEB):""), ded_loanGrid("ded.eeb80",D.eeb80,true));

  /* 80G */
  h += row("80G — donations", cell(alw.Section80G), {ref:"5n", v2:cell((C.ent||{}).Section80G),
    hint:"eligible amount after the 100/50% factor and the 10%-of-income limit"});
  h += fold("d_80g","","80G — donations, donee by donee",
    (C.ent&&C.ent.Section80G?RS(alw.Section80G):""),
    note("Where any row is filled, every field in that row is mandatory. A donation in cash above "+
      "₹2,000 gives no deduction — enter it under 'other mode'.","warn")+
    ded_gGrid("100% deduction, no qualifying limit","ded.g100",D.g100,false)+
    ded_gGrid("50% deduction, no qualifying limit","ded.g50",D.g50,false)+
    ded_gGrid("100% deduction, subject to the qualifying limit","ded.g100q",D.g100q,false)+
    ded_gGrid("50% deduction, subject to the qualifying limit","ded.g50q",D.g50q,true));

  /* 80GG */
  h += row("80GG — rent paid where no HRA is received", inp("ded.gg.amt",{n:1}),
    {ref:"5o", v2:cell(alw.Section80GG), hint:why.Section80GG||"ceiling ₹60,000 (least-of rule)"});
  if(N((D.gg||{}).amt))
    h += fold("d_80gg","","80GG — Form 10BA","",
      formNote("A claim under 80GG needs <b>Form 10BA</b>. Enter its acknowledgement number.")+
      row("Acknowledgement number of Form 10BA",inp("ded.gg.ack",{max:15}),{req:1,hint:"fifteen digits"}));

  /* 80GGA */
  h += row("80GGA — scientific research or rural development", cell(alw.Section80GGA),
    {ref:"5p", v2:cell((C.ent||{}).Section80GGA)});
  h += fold("d_80gga","","80GGA — donations for scientific research / rural development",
    (C.ent&&C.ent.Section80GGA?RS(C.ent.Section80GGA):""),
    grid("ded.gga",[
      {k:"clause",h:"Clause",t:"sel",w:"150px",opts:DED_GGA_CLAUSE,req:1},
      {k:"name",h:"Name of the donee",t:"txt",w:"auto",req:1},
      {k:"addr",h:"Address",t:"txt",w:"auto"},
      {k:"city",h:"City / town",t:"txt",w:"120px"},
      {k:"state",h:"State",t:"sel",w:"140px",opts:DED_STATE},
      {k:"pin",h:"PIN",t:"txt",w:"90px",max:6},
      {k:"pan",h:"PAN of the donee",t:"txt",w:"120px",max:10,req:1},
      {k:"cash",h:"In cash",t:"num",w:"110px"},
      {k:"other",h:"Other mode",t:"num",w:"110px"}],
      D.gga,{min:"1180px",empty:"No 80GGA donation.",add:"Add a donee"})+
    note("A donation in cash above ₹2,000 gives no deduction.","warn"));

  /* 80GGC */
  h += row("80GGC — contribution to a political party / electoral trust", cell(alw.Section80GGC),
    {ref:"5q", v2:cell((C.ent||{}).Section80GGC)});
  h += fold("d_80ggc","","80GGC — political-party contribution",
    (C.ent&&C.ent.Section80GGC?RS(C.ent.Section80GGC):""),
    grid("ded.ggc",[
      {k:"name",h:"Name of the party / electoral trust",t:"txt",w:"auto",req:1},
      {k:"pan",h:"PAN",t:"txt",w:"120px",max:10,req:1},
      {k:"dt",h:"Date of contribution",t:"date",w:"130px",req:1},
      {k:"cash",h:"In cash (barred)",t:"num",w:"110px"},
      {k:"other",h:"Other mode",t:"num",w:"110px",req:1},
      {k:"ifsc",h:"IFSC",t:"txt",w:"120px",max:11},
      {k:"ref",h:"Transaction reference",t:"txt",w:"160px"}],
      D.ggc,{min:"1120px",empty:"No 80GGC contribution.",add:"Add a contribution"})+
    note("A contribution in cash gives no deduction at all.","warn"));

  /* 80U */
  h += row("80U — the person has a disability", cell(alw.Section80U),
    {ref:"5v", v2:cell((C.ent||{}).Section80U)});
  h += fold("d_80u","","80U — self with a disability",
    (C.ent&&C.ent.Section80U?RS(alw.Section80U):""),
    row("Nature of the disability",sel("ded.u.nature",DED_NATDIS),{req:1,hint:"75,000 (40-80%) / 1,25,000 (severe)"})+
    row("Type of the disability",sel("ded.u.type",DED_TYPDIS),{req:1})+
    row("Acknowledgement number of Form 10-IA",inp("ded.u.form10ia",{max:15}),{req:1})+
    row("UDID number",inp("ded.u.udid",{max:20}))+
    formNote("<b>Form 10-IA</b> has to be filed before the return."));

  /* 80TTA / 80TTB */
  h += row("80TTA — interest on a savings account", inp("ded.tta",{n:1}),
    {ref:"5t", v2:cell(alw.Section80TTA), hint:why.Section80TTA||"ceiling ₹10,000, non-senior"});
  h += row("80TTB — interest on deposits (resident senior citizen)", inp("ded.ttb",{n:1}),
    {ref:"5u", v2:cell(alw.Section80TTB), hint:why.Section80TTB||"ceiling ₹50,000"});

  /* 80CCH */
  h += row("80CCH(2) — Agniveer Corpus Fund", inp("ded.cch",{n:1}),
    {ref:"5w", v2:cell(alw.AnyOthSec80CCH)});

  h += row("Total Chapter VI-A deductions allowed", cell(C.total), {cls:"grand", ref:"C1"});
  if(C.clipped) h += note("The deductions have been limited to the income they are set against.","warn");
  return h;
}

    {k:"from",h:"Lender",t:"sel",w:"120px",opts:DED_LOANFROM,req:1},

/* ---- export -------------------------------------------------------- */
const DED_KEYS = ["Section80C","Section80CCC","Section80CCDEmployeeOrSE","Section80CCD1B",
  "Section80CCDEmployer","Section80D","Section80DD","Section80DDB","Section80E","Section80EE",
  "Section80EEA","Section80EEB","Section80G","Section80GG","Section80GGA","Section80GGC",
  "Section80U","Section80TTA","Section80TTB","AnyOthSec80CCH"];

function expDed(j){
  const C=S.C.ded||{}, ent=C.ent||{}, alw=C.alw||{}, old=C.old, D=S.ded;
  const base = "ITR1_IncomeDeductions.";

  /* --- UsrDeductUndChapVIA (entered) + DeductUndChapVIA (allowed) --- */
  DED_KEYS.forEach(k=>{
    /* under the new regime only the two survivors carry an entered amount */
    const survives = (k==="Section80CCDEmployer"||k==="AnyOthSec80CCH");
    const eVal = (old||survives) ? n0(ent[k]) : 0;
    put(j, base+"UsrDeductUndChapVIA."+k, eVal);
    put(j, base+"DeductUndChapVIA."+k, n0(alw[k]));
  });
  let entTot=0, alwTot=0;
  DED_KEYS.forEach(k=>{
    const survives=(k==="Section80CCDEmployer"||k==="AnyOthSec80CCH");
    entTot += (old||survives)?n0(ent[k]):0; alwTot += n0(alw[k]);
  });
  put(j, base+"UsrDeductUndChapVIA.TotalChapVIADeductions", entTot);
  put(j, base+"DeductUndChapVIA.TotalChapVIADeductions", n0(C.total));

  /* --- nested leaves under UsrDeductUndChapVIA --- */
  if(old){
    const pen=(D.pen||[]).filter(r=>N(r.amt)).map(r=>({
      TypeofIdentifier: (r.type==="OTHPRAN")?"OTHPRAN":"PRAN",
      NameofIdentifier: (sv(r.name)||"NA"),
      Amount: n0(r.amt) }));
    if(pen.length) put(j, base+"UsrDeductUndChapVIA.PensionContribution80CCC", pen);
    const pran=(D.pran||[]).filter(r=>sv(r.pran)).map(r=>({PRANNum:sv(r.pran)}));
    if(pran.length) put(j, base+"UsrDeductUndChapVIA.PRANDtls", pran);
    if(N((D.ddb||{}).amt) && DED_DISEASE.some(x=>x[0]===(D.ddb||{}).disease))
      put(j, base+"UsrDeductUndChapVIA.NameOfSpecDisease80DDB", (D.ddb||{}).disease);
    if(N((D.gg||{}).amt) && sv((D.gg||{}).ack))
      put(j, base+"UsrDeductUndChapVIA.Form10BAAckNum", sv((D.gg||{}).ack));
  }

  /* --- old-regime detail schedules (only when OLD regime) --- */
  if(!old) return;

  /* Schedule80C */
  const c80c=(D.c80c||[]).filter(r=>N(r.amt)).map(r=>{
    const o={Amount:n0(r.amt)}; const id=sv(r.idno); if(id)o.IdentificationNo=id.slice(0,30); return o;});
  if(c80c.length) j.Schedule80C={ Schedule80CDtls:c80c,
    TotalAmt:n0((D.c80c||[]).reduce((a,r)=>a+n0(r.amt),0)) };

  /* Schedule80D */
  if(n0(alw.Section80D) || ded_80Dtouched()){
    const d=D.d80||{};
    const selfSr=(d.selfSr==="Y"||d.selfSr==="N"||d.selfSr==="S")?d.selfSr:"N";
    const parSr =(d.parSr==="Y"||d.parSr==="N"||d.parSr==="P")?d.parSr:"P";
    const b={
      SeniorCitizenFlag: selfSr,
      SelfAndFamily: n0(d.hiSelf)+Math.min(n0(d.phcSelf),5000),
      HealthInsPremSlfFam: n0(d.hiSelf),
      PrevHlthChckUpSlfFam: n0(d.phcSelf),
      SelfAndFamilySeniorCitizen: n0(d.hiSelfSr)+Math.min(n0(d.phcSelfSr),5000)+n0(d.medSelfSr),
      HlthInsPremSlfFamSrCtzn: n0(d.hiSelfSr),
      PrevHlthChckUpSlfFamSrCtzn: n0(d.phcSelfSr),
      MedicalExpSlfFamSrCtzn: n0(d.medSelfSr),
      ParentsSeniorCitizenFlag: parSr,
      Parents: n0(d.hiPar)+Math.min(n0(d.phcPar),5000),
      HlthInsPremParents: n0(d.hiPar),
      PrevHlthChckUpParents: n0(d.phcPar),
      ParentsSeniorCitizen: n0(d.hiParSr)+Math.min(n0(d.phcParSr),5000)+n0(d.medParSr),
      HlthInsPremParentsSrCtzn: n0(d.hiParSr),
      PrevHlthChckUpParentsSrCtzn: n0(d.phcParSr),
      MedicalExpParentsSrCtzn: n0(d.medParSr),
      EligibleAmountOfDedn: n0(alw.Section80D) };
    j.Schedule80D={ Sec80DSelfFamSrCtznHealth:b };
  }

  /* Schedule80DD */
  if(n0(alw.Section80DD)){
    const d=D.dd||{}, o={ DeductionAmount:n0(alw.Section80DD) };
    if(d.nature==="1"||d.nature==="2") o.NatureOfDisability=d.nature;
    if(d.type==="1"||d.type==="2")     o.TypeOfDisability=d.type;
    if(DED_DEPTYPE.some(x=>x[0]===d.depType)) o.DependentType=d.depType;
    if(sv(d.pan))     o.DependentPan=sv(d.pan).toUpperCase().slice(0,10);
    if(sv(d.aadhaar)) o.DependentAadhaar=sv(d.aadhaar).slice(0,12);
    if(sv(d.form10ia))o.Form10IAAckNum=sv(d.form10ia).slice(0,15);
    if(sv(d.udid))    o.UDIDNum=sv(d.udid).slice(0,20);
    j.Schedule80DD=o;
  }

  /* Schedule80U */
  if(n0(alw.Section80U)){
    const u=D.u||{}, o={ DeductionAmount:n0(alw.Section80U) };
    if(u.nature==="1"||u.nature==="2") o.NatureOfDisability=u.nature;
    if(u.type==="1"||u.type==="2")     o.TypeOfDisability=u.type;
    if(sv(u.form10ia)) o.Form10IAAckNum=sv(u.form10ia).slice(0,15);
    if(sv(u.udid))     o.UDIDNum=sv(u.udid).slice(0,20);
    j.Schedule80U=o;
  }

  /* Schedule80E / 80EE / 80EEA / 80EEB */
  const loanBlock=(rows,dtlsKey,intKey,totKey,extra)=>{
    const rr=(rows||[]).filter(r=>N(r.int)||sv(r.name));
    if(!rr.length) return null;
    const o={}; o[dtlsKey]=rr.map(r=>{
      const x={ LoanTknFrom:(r.from==="I")?"I":"B",
        BankOrInstnName:(sv(r.name)||"NA").slice(0,75),
        LoanAccNoOfBankOrInstnRefNo:(sv(r.acno)||"NA").slice(0,30) };
      if(ISO(r.dt)) x.DateofLoan=ISO(r.dt);
      x.TotalLoanAmt=n0(r.amt); x.LoanOutstndngAmt=n0(r.out);
      x[intKey]=n0(r.int);
      if(extra) extra(x,r);
      return x; });
    o[totKey]=n0(ded_loanInt(rr));
    return o;
  };
  const e=loanBlock(D.e80,"Schedule80EDtls","Interest80E","TotalInterest80E");
  if(e) j.Schedule80E=e;
  const ee=loanBlock(D.ee80,"Schedule80EEDtls","Interest80EE","TotalInterest80EE");

    (x,r)=>{ if(sv(r.vehreg)) x.VehicleRegNo=sv(r.vehreg).slice(0,20); });
  if(eeb) j.Schedule80EEB=eeb;

  /* Schedule80G — four buckets */
  const g=S.C.ded.g||ded_80G(0);

    if(dwp.length){

  /* Schedule80GGA */
  const gga=(D.gga||[]).filter(r=>N(r.cash)||N(r.other)||sv(r.name));
