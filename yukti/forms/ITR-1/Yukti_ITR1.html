/* =====================================================================
   EXPORT — expRet(j): FilingStatus always; PartA_139_8A + PartB-ATI only
   when ReturnFileSec == 21. put() keeps 0 for the required numeric leaves.
   ===================================================================== */
function expRet(j){
  const R0=S.ret||{}, C=S.C.ret||{}, A=C.ati||{};
  const UP=v=>{v=sv(v);return v?String(v).toUpperCase():undefined;};
  const sec=R(R0.sec)||11;

  /* ---------- §4 FilingStatus ---------- */
  put(j,"FilingStatus.ReturnFileSec",sec);
  put(j,"FilingStatus.OptOutNewTaxRegime",st0(R0.optout)==="Y"?"Y":"N");
  put(j,"FilingStatus.SeventhProvisio139",st0(R0.provFlag)==="Y"?"Y":"N");
  if(st0(R0.provFlag)==="Y"){
    put(j,"FilingStatus.DepAmtAggAmtExcd1CrPrYrFlg",st0(R0.depFlag)==="Y"?"Y":"N");
    if(st0(R0.depFlag)==="Y"&&sv(R0.depAmt)) put(j,"FilingStatus.AmtSeventhProvisio139i",R(R0.depAmt));
    put(j,"FilingStatus.IncrExpAggAmt2LkTrvFrgnCntryFlg",st0(R0.trvFlag)==="Y"?"Y":"N");
    if(st0(R0.trvFlag)==="Y"&&sv(R0.trvAmt)) put(j,"FilingStatus.AmtSeventhProvisio139ii",R(R0.trvAmt));
    put(j,"FilingStatus.IncrExpAggAmt1LkElctrctyPrYrFlg",st0(R0.eleFlag)==="Y"?"Y":"N");
    if(st0(R0.eleFlag)==="Y"&&sv(R0.eleAmt)) put(j,"FilingStatus.AmtSeventhProvisio139iii",R(R0.eleAmt));
  }
  /* conditional notice / receipt */
  if(RET1_SEC_NOTICE.indexOf(sec)>=0){
    put(j,"FilingStatus.NoticeNo",sv(R0.noticeNo));
    put(j,"FilingStatus.NoticeDateUnderSec",ISO(R0.noticeDate));
  }
  if(RET1_SEC_RECEIPT.indexOf(sec)>=0){
    put(j,"FilingStatus.ReceiptNo",sv(R0.receiptNo));
    put(j,"FilingStatus.OrigRetFiledDate",ISO(R0.origDate));
  }
  put(j,"FilingStatus.ItrFilingDueDate",RET1_DUEDATE);
  /* clause (iv) of the seventh proviso */
  put(j,"FilingStatus.clauseiv7provisio139i",st0(R0.clauseFlag)==="Y"?"Y":"N");
  if(st0(R0.clauseFlag)==="Y"){
    const cl=[];
    if(st0(R0.cl1Flag)==="Y") cl.push({clauseiv7provisio139iNature:"1",clauseiv7provisio139iAmount:R(R0.cl1Amt)});
    if(st0(R0.cl2Flag)==="Y") cl.push({clauseiv7provisio139iNature:"2",clauseiv7provisio139iAmount:R(R0.cl2Amt)});
    if(cl.length) put(j,"FilingStatus.clauseiv7provisio139iDtls",cl);
  }
  /* representative assessee */
  put(j,"FilingStatus.AsseseeRepFlg",st0(R0.repFlg)==="Y"?"Y":"N");
  if(st0(R0.repFlg)==="Y"){
    put(j,"FilingStatus.AssesseeRep.RepName",sv(R0.repName));
    put(j,"FilingStatus.AssesseeRep.RepEmailID",sv(R0.repEmail));
    if(sv(R0.repMobile)){
      put(j,"FilingStatus.AssesseeRep.CountryCodeRepMobileNo",R(R0.repMobileCc)||91);
      put(j,"FilingStatus.AssesseeRep.RepMobileNo",R(R0.repMobile));
    }
  }

  /* ---------- §5 PartA_139_8A + §6 PartB-ATI (updated return only) ---------- */
  if(sec!==21) return;

  /* PartA_139_8A */
  if(AADH.test(st0(R0.uAadhaar))) put(j,"PartA_139_8A.AadhaarCardNo",st0(R0.uAadhaar));
  put(j,"PartA_139_8A.Name",sv(R0.uName));
  put(j,"PartA_139_8A.PAN",UP(R0.uPan));
  put(j,"PartA_139_8A.AssessmentYear","2026");           /* utility bug emits 2025; emit 2026 */
  put(j,"PartA_139_8A.PreviouslyFiledForThisAY",st0(R0.prevFiled)==="Y"?"Y":"N");
  put(j,"PartA_139_8A.PreviouslyFiledForThisAY_139_8A",st0(R0.prevFiled8A)==="1"?"1":"2");
  if(st0(R0.prevFiled8A)==="1"){
    put(j,"PartA_139_8A.Applicable_139_8A.ITRForm",sv(R0.appItrForm)||"ITR1");
    put(j,"PartA_139_8A.Applicable_139_8A.AcknowledgementNo",sv(R0.appAckNo));
    put(j,"PartA_139_8A.Applicable_139_8A.OrigRetFiledDate",ISO(R0.appOrigDate));
  }
  put(j,"PartA_139_8A.LaidOutIn_139_8A",st0(R0.laidOut)==="Y"?"Y":"N");
  put(j,"PartA_139_8A.ITRFormUpdatingInc","ITR1");
  {const rs=(R0.reasons||[]).filter(r=>sv(r.reason)).map(r=>({ReasonsForUpdatingIncome:sv(r.reason)}));
   if(rs.length) put(j,"PartA_139_8A.UpdatingInc.ReasonsForUpdatingIncDtls",rs);}
  put(j,"PartA_139_8A.UpdatedReturnDuringPeriod",st0(R0.period)||"1");
  put(j,"PartA_139_8A.RetrntoRedCarriedFL.UnabsorbedDepreciation",st0(R0.unabDep)==="Y"?"Y":"N");
  if(st0(R0.unabDep)==="Y"){
    const uy=(R0.udYears||[]).filter(r=>sv(r.year)).map(r=>{const o={UnabsorbedDepreciationYear:R(r.year)};
      if(sv(r.rev)) o.RevisedReturnFile=st0(r.rev)==="Y"?"Y":"N";
      if(sv(r.upd)) o.UpdatedReturnFile=st0(r.upd)==="Y"?"Y":"N";
      return o;});
    if(uy.length) put(j,"PartA_139_8A.RetrntoRedCarriedFL.UDYear.UnabsorbedDepreciationYearDtls",uy);
  }

  /* PartB-ATI (schema §6; the block key carries a hyphen) */
  const B="PartB-ATI.";
  put(j,B+"HeadOfInc.Salaries",A.salaries||0);
  put(j,B+"HeadOfInc.IncomeFromHP",A.hp||0);
  put(j,B+"HeadOfInc.IncomeFromOS",A.os||0);
  put(j,B+"HeadOfInc.Total",A.total||0);
  put(j,B+"LatestTotInc",A.latest||0);
  put(j,B+"UpdatedTotInc",A.updated||0);
  put(j,B+"AmtPayable",A.amtPayable||0);
  put(j,B+"AmtRefundable",A.amtRefundable||0);
  put(j,B+"LastAmtPayable",A.lastPayable||0);
  put(j,B+"Refund",A.refund||0);
  put(j,B+"TotRefund",A.totRefund||0);
  put(j,B+"FeeIncUS234F",A.fee234F||0);
  put(j,B+"RegAssessementTAX",A.regTax||0);
  put(j,B+"AggrLiabilityRefund",A.aggRefund||0);
  put(j,B+"AggrLiabilityNoRefund",A.aggNoRefund||0);
  put(j,B+"AddtnlIncTax",A.addtnlIncTax||0);
  put(j,B+"NetPayable",A.netPayable||0);
  put(j,B+"TaxUS140B",A.tax140B||0);
  put(j,B+"TaxDue10_11",A.taxDue||0);
  put(j,B+"ReleifUS89",A.relief89||0);
  /* Schedule IT-1 / IT-2 challans */
  const chal=rows=>(rows||[]).filter(r=>sv(r.bsr)||sv(r.amt)).map((r,i)=>({
    slno:i+1,BSRCode:sv(r.bsr),DateDep:ISO(r.date),
    SrlNoOfChaln:R(r.srl),Amt:R(r.amt)}));
  const c1=chal(R0.it1);
  if(c1.length) put(j,B+"ScheduleIT1.TaxPayment1.ITTaxPayments",c1);
  put(j,B+"ScheduleIT1.Total",A.it1Total||0);
  const c2=chal(R0.it2);
  if(c2.length) put(j,B+"ScheduleIT2.TaxPayment2.ITTaxPayments",c2);
  put(j,B+"ScheduleIT2.Total",A.it2Total||0);
}

/* =====================================================================
   IMPORT — impRet(I): read FilingStatus and (if present) PartA_139_8A +
   PartB-ATI back into S.ret so the round-trip is stable.
   ===================================================================== */
function impRet(I){
  const read=[], R0=S.ret=S.ret||{};
  const _iso2dmy=s=>{s=st0(s);const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);
    return m?m[3]+"/"+m[2]+"/"+m[1]:"";};
  const FS=(I&&I.FilingStatus)||{};

  if(FS.OptOutNewTaxRegime!=null){R0.optout=FS.OptOutNewTaxRegime==="Y"?"Y":"N";read.push("regime");}
  if(FS.ReturnFileSec!=null){R0.sec=R(FS.ReturnFileSec);read.push("filing section");}
  if(FS.SeventhProvisio139!=null)R0.provFlag=FS.SeventhProvisio139;
  if(FS.DepAmtAggAmtExcd1CrPrYrFlg!=null)R0.depFlag=FS.DepAmtAggAmtExcd1CrPrYrFlg;
  if(FS.AmtSeventhProvisio139i!=null)R0.depAmt=String(FS.AmtSeventhProvisio139i);
  if(FS.IncrExpAggAmt2LkTrvFrgnCntryFlg!=null)R0.trvFlag=FS.IncrExpAggAmt2LkTrvFrgnCntryFlg;
  if(FS.AmtSeventhProvisio139ii!=null)R0.trvAmt=String(FS.AmtSeventhProvisio139ii);
  if(FS.IncrExpAggAmt1LkElctrctyPrYrFlg!=null)R0.eleFlag=FS.IncrExpAggAmt1LkElctrctyPrYrFlg;
  if(FS.AmtSeventhProvisio139iii!=null)R0.eleAmt=String(FS.AmtSeventhProvisio139iii);
  if(FS.NoticeNo!=null)R0.noticeNo=String(FS.NoticeNo);
  if(FS.NoticeDateUnderSec)R0.noticeDate=_iso2dmy(FS.NoticeDateUnderSec);
  if(FS.ReceiptNo!=null)R0.receiptNo=String(FS.ReceiptNo);
  if(FS.OrigRetFiledDate)R0.origDate=_iso2dmy(FS.OrigRetFiledDate);
  if(FS.clauseiv7provisio139i!=null)R0.clauseFlag=FS.clauseiv7provisio139i;
  if(Array.isArray(FS.clauseiv7provisio139iDtls)){
    FS.clauseiv7provisio139iDtls.forEach(x=>{
      if(String(x.clauseiv7provisio139iNature)==="1"){R0.cl1Flag="Y";R0.cl1Amt=String(x.clauseiv7provisio139iAmount==null?"":x.clauseiv7provisio139iAmount);}
      if(String(x.clauseiv7provisio139iNature)==="2"){R0.cl2Flag="Y";R0.cl2Amt=String(x.clauseiv7provisio139iAmount==null?"":x.clauseiv7provisio139iAmount);}
    });
  }
  if(FS.AsseseeRepFlg!=null){R0.repFlg=FS.AsseseeRepFlg;read.push("representative");}
  if(FS.AssesseeRep){const AR=FS.AssesseeRep;
    if(AR.RepName!=null)R0.repName=AR.RepName;
    if(AR.RepEmailID!=null)R0.repEmail=AR.RepEmailID;
    if(AR.CountryCodeRepMobileNo!=null)R0.repMobileCc=String(AR.CountryCodeRepMobileNo);
    if(AR.RepMobileNo!=null)R0.repMobile=String(AR.RepMobileNo);}

  /* PartA_139_8A */
  const PA=(I&&I.PartA_139_8A)||{};
  if(Object.keys(PA).length){
    if(PA.AadhaarCardNo!=null)R0.uAadhaar=String(PA.AadhaarCardNo);
    if(PA.Name!=null)R0.uName=PA.Name;
    if(PA.PAN!=null)R0.uPan=String(PA.PAN).toUpperCase();
    if(PA.PreviouslyFiledForThisAY!=null)R0.prevFiled=PA.PreviouslyFiledForThisAY;
    if(PA.PreviouslyFiledForThisAY_139_8A!=null)R0.prevFiled8A=String(PA.PreviouslyFiledForThisAY_139_8A);
    const AP=PA.Applicable_139_8A||{};
    if(AP.ITRForm!=null)R0.appItrForm=AP.ITRForm;
    if(AP.AcknowledgementNo!=null)R0.appAckNo=String(AP.AcknowledgementNo);
    if(AP.OrigRetFiledDate)R0.appOrigDate=_iso2dmy(AP.OrigRetFiledDate);
    if(PA.LaidOutIn_139_8A!=null)R0.laidOut=PA.LaidOutIn_139_8A;
    const RU=(PA.UpdatingInc||{}).ReasonsForUpdatingIncDtls;
    if(Array.isArray(RU))R0.reasons=RU.map(x=>({reason:x.ReasonsForUpdatingIncome}));
    if(PA.UpdatedReturnDuringPeriod!=null)R0.period=String(PA.UpdatedReturnDuringPeriod);
    const RC=PA.RetrntoRedCarriedFL||{};
    if(RC.UnabsorbedDepreciation!=null)R0.unabDep=RC.UnabsorbedDepreciation;
    const UYD=(RC.UDYear||{}).UnabsorbedDepreciationYearDtls;
    if(Array.isArray(UYD))R0.udYears=UYD.map(x=>({
      year:x.UnabsorbedDepreciationYear==null?"":String(x.UnabsorbedDepreciationYear),
      rev:x.RevisedReturnFile,upd:x.UpdatedReturnFile}));
    read.push("updated return (139(8A))");
  }
  /* PartB-ATI */
  const PB=(I&&I["PartB-ATI"])||{};
  if(Object.keys(PB).length){
    const HI=PB.HeadOfInc||{};
    if(HI.Salaries!=null)R0.atiSal=String(HI.Salaries);
    if(HI.IncomeFromHP!=null)R0.atiHP=String(HI.IncomeFromHP);
    if(HI.IncomeFromOS!=null)R0.atiOS=String(HI.IncomeFromOS);
    if(PB.LatestTotInc!=null)R0.latestTotInc=String(PB.LatestTotInc);
    if(PB.AmtPayable!=null)R0.amtPayable=String(PB.AmtPayable);
    if(PB.AmtRefundable!=null)R0.amtRefundable=String(PB.AmtRefundable);
    if(PB.LastAmtPayable!=null)R0.lastAmtPayable=String(PB.LastAmtPayable);
    if(PB.Refund!=null)R0.refund=String(PB.Refund);
    if(PB.FeeIncUS234F!=null)R0.feeIncUS234F=String(PB.FeeIncUS234F);
    if(PB.RegAssessementTAX!=null)R0.regAssTax=String(PB.RegAssessementTAX);
    if(PB.ReleifUS89!=null)R0.releifUS89=String(PB.ReleifUS89);
    const rd=arr=>(Array.isArray(arr)?arr:[]).map(x=>({
      bsr:x.BSRCode||"",date:_iso2dmy(x.DateDep),
      srl:x.SrlNoOfChaln==null?"":String(x.SrlNoOfChaln),amt:x.Amt==null?"":String(x.Amt)}));
    const P1=((PB.ScheduleIT1||{}).TaxPayment1||{}).ITTaxPayments;
    if(Array.isArray(P1))R0.it1=rd(P1);
    const P2=((PB.ScheduleIT2||{}).TaxPayment2||{}).ITTaxPayments;
    if(Array.isArray(P2))R0.it2=rd(P2);
    read.push("Part B-ATI");
  }
  return read;
}

/* =====================================================================
   CHECKS — chkRet(): this screen's own mandatory / validity checks.
   ===================================================================== */
function chkRet(){
  const out=[], R0=S.ret||{}; engRet();
  const C=S.C.ret||{}, sec=R(R0.sec)||11;

  /* the section must be legal for ITR-1 */
  if(RET1_BLOCKSEC.indexOf(sec)>=0)
    out.push({lvl:"err",t:"Filing section blocked",m:"Section "+
      (RET1_RETSEC.find(r=>r[0]===sec)||[,String(sec)])[1]+" is not valid for ITR-1. "+
      "Choose 139(1) [11], 139(4) [12], 139(5) [17], 119(2)(b) [20] or 139(8A) [21].",sec:"ret"});
  else if(RET1_VALIDSEC.indexOf(sec)<0)
    out.push({lvl:"err",t:"Filing section required",m:"Select a valid ITR-1 filing section.",sec:"ret"});

  /* conditional mandatory */
  if(RET1_SEC_RECEIPT.indexOf(sec)>=0){
    if(!st0(R0.receiptNo)) out.push({lvl:"err",t:"Receipt number required",m:"The receipt number of the original return is mandatory for this section.",sec:"ret"});
    if(!ISO(R0.origDate)) out.push({lvl:"err",t:"Original-return date required",m:"The date of filing of the original return is mandatory.",sec:"ret"});
  }
  if(sec===20){
    if(!st0(R0.noticeNo)) out.push({lvl:"err",t:"Order number required",m:"The DIN / number of the 119(2)(b) order is mandatory.",sec:"ret"});
    if(!ISO(R0.noticeDate)) out.push({lvl:"err",t:"Order date required",m:"The date of the 119(2)(b) order is mandatory.",sec:"ret"});
  }

  /* seventh-proviso amount consistency */
  if(st0(R0.provFlag)==="Y"){
    if(st0(R0.depFlag)==="Y"&&!sv(R0.depAmt)) out.push({lvl:"warn",t:"Deposit amount",m:"State the aggregate deposited in current accounts (over ₹1 crore).",sec:"ret"});
    if(st0(R0.trvFlag)==="Y"&&!sv(R0.trvAmt)) out.push({lvl:"warn",t:"Foreign-travel amount",m:"State the expenditure on foreign travel (over ₹2 lakh).",sec:"ret"});
    if(st0(R0.eleFlag)==="Y"&&!sv(R0.eleAmt)) out.push({lvl:"warn",t:"Electricity amount",m:"State the expenditure on electricity (over ₹1 lakh).",sec:"ret"});
  }

  /* representative details */
  if(st0(R0.repFlg)==="Y"){
    if(!st0(R0.repName)) out.push({lvl:"err",t:"Representative name required",m:"Furnish the name of the representative assessee.",sec:"ret"});
    if(!st0(R0.repEmail)||!MAIL.test(st0(R0.repEmail))) out.push({lvl:"err",t:"Representative email",m:"Furnish a valid email-id of the representative assessee.",sec:"ret"});
    if(!st0(R0.repMobile)) out.push({lvl:"err",t:"Representative contact",m:"Furnish the contact number of the representative assessee.",sec:"ret"});
  }

  /* updated-return checks */
  if(sec===21){
    if(st0(R0.uPan)&&!PAN_RE.test(st0(R0.uPan).toUpperCase())) out.push({lvl:"err",t:"Updated-return PAN",m:"The PAN in Part A 139(8A) is not valid.",sec:"ret"});
    if(!(R0.reasons||[]).some(r=>sv(r.reason))) out.push({lvl:"err",t:"Reason for updating required",m:"State at least one reason for updating the income (139(8A)).",sec:"ret"});
    if(!st0(R0.period)) out.push({lvl:"err",t:"Period required",m:"State the period during which the updated return is filed — it fixes the 140B rate.",sec:"ret"});
    const A=C.ati||{};
    if(A.total<=0) out.push({lvl:"warn",t:"No additional income",m:"An updated return u/s 139(8A) is expected to return additional income — the head-wise total is nil.",sec:"ret"});
    if(A.taxDue<=0&&A.netPayable>0&&A.tax140B<A.netPayable) out.push({lvl:"warn",t:"140B tax unpaid",m:"There is a net amount payable u/s 140B but the challans do not cover it.",sec:"ret"});
  }

  if(!out.some(x=>x.lvl==="err"))
    out.push({lvl:"ok",t:"Return and regime",m:(C.regime==="old"?"Old regime":"New regime")+
      " · filed u/s "+(RET1_RETSEC.find(r=>r[0]===sec)||[,String(sec)])[1]+
      (C.is8A?" · updated return u/s 139(8A)":"")+".",sec:"ret"});
  return out;
}

/* =====================================================================
   ITR-1 · Section "sal" — Salary income
   Screen ref: Income Details sheet, salary block + Schedule EA 10(13A).
   Compute order 30, screen order 30.

   Built from books/ITR-1/schema_tree.md §7.1/§7.2 (salary head +
   AllwncExemptUs10) and §19.9 (ScheduleEA10_13A), caps.md §2 (16(ia))
   and §1 (the 115BAC bar on section-10 allowances), enums.json
   (AllwncExemptUs10_SalNatureDesc, Placeofwork_EA_10_13A) and the prev
   engine engSal() in forms/ITR-1/Yukti_ITR1_prev.html — with the caps.md
   fixes applied.

   Owns / writes on export (no other builder writes these leaves):
     ITR1_IncomeDeductions.
       GrossSalary, Salary, PerquisitesValue, ProfitsInSalary,
       NetSalary, DeductionUs16, DeductionUs16ia, EntertainmentAlw16ii,
       ProfessionalTaxUs16iii, IncomeFromSal,
       AllwncExemptUs10.{AllwncExemptUs10Dtls[], TotalAllwncExemptUs10}
     ScheduleEA10_13A.{Placeofwork, ActlHRARecv, ActlRentPaid,
       DtlsSalUsSec171, BasicSalary, DearnessAllwnc, ActlRentPaid10Per,
       Sal40Or50Per, EligbleExmpAllwncUs13A}   (OLD regime & empcat<>NA)

   Publishes S.C.sal.{netSalary, incomeFromSal, ...}. netSalary drives the
   80CCD percentage-of-salary caps in the deductions section.
   Reads S.C.ret.regime (regime) and S.C.who.senior, and PersonalInfo's

     · New regime offers ONLY the 115BAC-permitted section-10 subset —
       10(5) and 10(17) are NOT in the new list (prev bug D-note).
     · HRA 10(13A) is computed here from the ScheduleEA10_13A least-of rule
       and auto-added as an AllwncExemptUs10 row (prev had no such schedule).
   ===================================================================== */

/* ---- section-10 allowances (code -> label), 10(13A) excluded here
        because it is auto-computed from the HRA schedule below --------- */
const _SAL_ALW=[
 ["10(5)","Leave travel concession or assistance"],
 ["10(6)","Remuneration of an official of an embassy or consulate"],
 ["10(7)","Allowances or perquisites paid by the Government outside India"],
 ["10(10)","Death-cum-retirement gratuity"],
 ["10(10A)","Commuted value of pension"],
 ["10(10AA)","Leave encashment on retirement"],
 ["10(10B)(i)","Compensation on retrenchment — limit notified by the Central Government"],
 ["10(10B)(ii)","Compensation on retrenchment — scheme approved by the Central Government"],
 ["10(10C)","Amount received on voluntary retirement"],
 ["10(10CC)","Tax on a non-monetary perquisite paid by the employer"],
 ["10(14)(i)","Allowance to meet expenses in the course of duty"],
 ["10(14)(ii)","Allowance for personal expenses at the place of duty"],
 ["10(14)(i)(115BAC)","Rule 2BB(1)(a)-(c) allowances (permitted under the new regime)"],
 ["10(14)(ii)(115BAC)","Transport allowance to a disabled employee (permitted under the new regime)"],
 ["10(17)","Allowance to a Member of Parliament, MLA or MLC"],
 ["EIC","Exempt income of a judge (Supreme/High Court Judges Act)"]];
/* section 115BAC(1A) leaves ONLY this subset standing — 10(5)/10(17)
   were WRONGLY included by the prev builder; they are removed here. */
const _SAL_ALW_NEW=["10(6)","10(7)","10(10)","10(10A)","10(10AA)","10(10C)","10(10CC)",
 "10(14)(i)(115BAC)","10(14)(ii)(115BAC)","EIC"];
const _SAL_METRO=[["1","A metro — Delhi, Mumbai, Kolkata or Chennai (50% of salary)"],
 ["2","Anywhere else (40% of salary)"]];

/* ---- regime / age / employer, read from the cross-section scalars ---- */
function _salIsOld(){
  const r=RG(S,"C.ret.regime","");
  if(r==="old"||r==="Old"||r==="OLD"||r==="Y"||r==="y"||r===2||r==="2")return true;
  if(r==="new"||r==="New"||r==="NEW"||r==="N"||r==="n"||r===1||r==="1")return false;
  if(typeof isNew==="function"){try{return !isNew();}catch(e){}}
  return false;                                   /* AY2026-27 default = new */
}
function _salIsNew(){return !_salIsOld();}
function _salEmpcat(){return st0(RG(S,"pi.empcat","")).toUpperCase()||"OTH";}
function _salGovt(){const e=_salEmpcat();return e==="CGOV"||e==="SGOV";}

/* ---- state seed (never clobber shell / import) --------------------- */
S.sal=S.sal||{};
if(S.sal.hra===undefined)S.sal.hra={place:"2"};
S.alw=S.alw||[];

/* ---- engine -------------------------------------------------------- */
function engSal(){
  S.C=S.C||{};
  const sl=S.sal||{}, g=k=>N(sl[k]);
  const gross=Math.max(0, g("s17_1")+g("s17_2")+g("s17_3"));
  const isNewR=_salIsNew();
  const ok=isNewR?(c=>_SAL_ALW_NEW.indexOf(c)>=0)
                 :(c=>_SAL_ALW.some(a=>a[0]===c));
  let manualExempt=0;
  (S.alw||[]).forEach(a=>{a._ok=(a.sec!=="10(13A)")&&!!ok(a.sec);
    if(a._ok)manualExempt+=n0(a.amt);});

  /* HRA 10(13A) — OLD regime and a real employer only (caps.md §1, sec plan S3) */
  const hraOn=_salIsOld() && _salEmpcat()!=="NA";
  const hra=sl.hra||{};
  let hraDet=null, hraElig=0;
  if(hraOn){
    const base=n0(hra.basic)+n0(hra.da);                /* salary for HRA = basic + DA */
    const metro=st0(hra.place)==="1";
    const rentLess10=Math.max(0, n0(hra.rent)-R(0.10*base));
    const pct=R((metro?0.50:0.40)*base);
    hraElig=Math.max(0, Math.min(n0(hra.hra), rentLess10, pct));
    hraDet={metro,base,rentLess10,pct,elig:hraElig};
  }

  /* 1iii  net = MAX(0, gross - MIN(exempt, gross)) */
  let exempt=manualExempt+hraElig;
  exempt=Math.min(exempt, gross);
  const net=Math.max(0, gross-exempt);

  /* 16(ia) std deduction = MIN(net, 75000 new / 50000 old) [caps.md §2] */
  const d16ia=Math.min(net, isNewR?75000:50000);
  /* 16(ii) entertainment — Government employees only, ceiling ₹5,000, old regime */
  const ent=(!isNewR && _salGovt())?Math.min(5000, n0(sl.ent)):0;
  /* 16(iii) professional tax — actual, old regime only */
  const pt=(!isNewR)?n0(sl.pt):0;
  const d16=Math.max(0, d16ia+ent+pt);
  const income=Math.max(0, net-d16);

  S.C.sal={netSalary:net, incomeFromSal:income, income:income,   /* income = alias the ded 80G / income-cap base reads (S.C.sal.income) */
    gross, manualExempt, hraElig, hraDet, hraOn, exempt,
    d16ia, ent, pt, d16, isNew:isNewR, govt:_salGovt(), empNA:_salEmpcat()==="NA"};
  return S.C.sal;
}

/* ---- renderer ------------------------------------------------------ */
function secSal(){
  const A=S.C.sal||engSal();
  const isNewR=A.isNew;
  let h="";

  h+=sub("Salary as per section 17");
  h+=row("Salary under section 17(1)",inp("sal.s17_1",{n:1}),{req:1,ref:"1(a)"});
  h+=row("Value of perquisites under section 17(2)",inp("sal.s17_2",{n:1}),{ref:"1(b)"});
  h+=row("Profits in lieu of salary under section 17(3)",inp("sal.s17_3",{n:1}),{ref:"1(c)"});
  h+=row("Gross salary",cell(A.gross),{cls:"tot",ref:"1"});

  /* --- allowances exempt u/s 10 --- */
  h+=sub("Allowances exempt under section 10");
  const opts=isNewR?_SAL_ALW.filter(a=>_SAL_ALW_NEW.indexOf(a[0])>=0):_SAL_ALW;
  h+=grid("alw",[{k:"sec",h:"Nature of the allowance",t:"sel",w:"auto",req:1,opts},
    {k:"amt",h:"Amount exempt",t:"num",w:"190px",req:1}],
    S.alw,{min:"620px",empty:"No allowance exempt under section 10.",add:"Add an allowance"});
  if(isNewR)
    h+=note("Under the new regime only the allowances permitted by section 115BAC are exempt. "+
      "Leave travel concession (10(5)), house rent allowance (10(13A)) and the legislator's "+
      "allowance (10(17)) are not among them.");
  if(A.hraOn && A.hraElig)
    h+=note("House rent allowance under 10(13A) of "+RS(A.hraElig)+" is added automatically from the "+
      "schedule below.","form");

  /* --- HRA 10(13A) schedule (old regime, real employer) --- */
  if(A.hraOn){
    const d=A.hraDet||{};
    h+=card("hpea","Schedule EA 10(13A) — house rent allowance exemption",
      (A.hraElig?F(A.hraElig):""),
      row("Place of work",sel("sal.hra.place",_SAL_METRO,{blank:false}),{req:1})+
      row("Basic salary",inp("sal.hra.basic",{n:1}),{req:1})+
      row("Dearness allowance forming part of pay",inp("sal.hra.da",{n:1}))+
      row("Salary as per section 17(1) for the schedule",inp("sal.hra.sal17",{n:1}),
        {hint:"defaults to the 17(1) salary above when left blank"})+
      row("House rent allowance actually received",inp("sal.hra.hra",{n:1}),{req:1})+
      row("Rent paid in the year",inp("sal.hra.rent",{n:1}),{req:1})+
      row("Rent paid less ten per cent of salary",cell(d.rentLess10),{ind:1})+
      row((d.metro?"Fifty":"Forty")+" per cent of salary",cell(d.pct),{ind:1})+
      row("Exemption eligible under 10(13A)",cell(d.elig),{cls:"grand",
        hint:"the least of the allowance received, rent less 10% of salary, and 50%/40% of salary"}));
  } else if(_salIsOld() && A.empNA){
    h+=note("The employer category is 'Not Applicable', so the house rent allowance schedule "+
      "does not apply.");
  }

  /* --- deductions u/s 16 --- */
  h+=sub("Deductions under section 16");
  h+=row("Net salary",cell(A.netSalary),{cls:"tot",ref:"2"});
  h+=row("Standard deduction under section 16(ia)",cell(A.d16ia),
    {ref:"3(a)",hint:isNewR?"least of net salary and ₹75,000":"least of net salary and ₹50,000"});
  h+=row("Entertainment allowance under section 16(ii)",
    isNewR?cell(0):inp("sal.ent",{n:1}),
    {ref:"3(b)",hint:isNewR?"closed under the new regime":
      (A.govt?"Government employees only, up to ₹5,000":"allowed to Government employees only")});
  h+=row("Professional tax under section 16(iii)",
    isNewR?cell(0):inp("sal.pt",{n:1}),
    {ref:"3(c)",hint:isNewR?"closed under the new regime":"tax on employment actually paid"});
  h+=row("Total deduction under section 16",cell(A.d16),{cls:"tot",ref:"3"});
  h+=row("Income chargeable under the head salaries",cell(A.incomeFromSal),{cls:"grand",ref:"4"});
  return h;
}

/* ---- export -------------------------------------------------------- */
function expSal(j){
  const A=S.C.sal||engSal();
  const sl=S.sal||{};
  const ID=j.ITR1_IncomeDeductions;
  put(ID,"GrossSalary",n0(A.gross));
  put(ID,"Salary",n0(sl.s17_1));
  put(ID,"PerquisitesValue",n0(sl.s17_2));
  put(ID,"ProfitsInSalary",n0(sl.s17_3));

  /* AllwncExemptUs10 — manual rows plus the auto HRA 10(13A) row */
  const dtls=[];
  (S.alw||[]).forEach(a=>{if(a._ok && n0(a.amt))dtls.push({SalNatureDesc:a.sec,SalOthAmount:n0(a.amt)});});
  if(A.hraOn && n0(A.hraElig))dtls.push({SalNatureDesc:"10(13A)",SalOthAmount:n0(A.hraElig)});
  if(dtls.length){
    ID.AllwncExemptUs10={AllwncExemptUs10Dtls:dtls, TotalAllwncExemptUs10:n0(A.exempt)};
  }

  put(ID,"NetSalary",n0(A.netSalary));
  put(ID,"DeductionUs16",n0(A.d16));
  put(ID,"DeductionUs16ia",n0(A.d16ia));
  put(ID,"EntertainmentAlw16ii",n0(A.ent));       /* required leaf — written even at 0 */
  put(ID,"ProfessionalTaxUs16iii",n0(A.pt));      /* required leaf — written even at 0 */
  put(ID,"IncomeFromSal",n0(A.incomeFromSal));

  /* ScheduleEA10_13A — OLD regime & employer <> NA & an HRA figure present */
  if(A.hraOn && A.hraDet && (n0((sl.hra||{}).hra) || n0(A.hraElig))){
    const hra=sl.hra||{}, d=A.hraDet;
    j.ScheduleEA10_13A={
      Placeofwork:d.metro?"1":"2",
      ActlHRARecv:n0(hra.hra),
      ActlRentPaid:n0(hra.rent),
      DtlsSalUsSec171:n0(hra.sal17)||n0(sl.s17_1),
      BasicSalary:n0(hra.basic),
      DearnessAllwnc:n0(hra.da),
      ActlRentPaid10Per:n0(d.rentLess10),
      Sal40Or50Per:n0(d.pct),
      EligbleExmpAllwncUs13A:n0(d.elig)};
  }
}

/* ---- import (inverse) ---------------------------------------------- */
function impSal(I){
  const read=[]; const ID=I&&I.ITR1_IncomeDeductions;
  S.sal=S.sal||{};
  if(ID){
    if(ID.Salary!=null){S.sal.s17_1=ID.Salary;read.push("salary 17(1)");}
    if(ID.PerquisitesValue!=null)S.sal.s17_2=ID.PerquisitesValue;
    if(ID.ProfitsInSalary!=null)S.sal.s17_3=ID.ProfitsInSalary;
    if(ID.EntertainmentAlw16ii!=null)S.sal.ent=ID.EntertainmentAlw16ii;
    if(ID.ProfessionalTaxUs16iii!=null)S.sal.pt=ID.ProfessionalTaxUs16iii;
    const al=ID.AllwncExemptUs10&&ID.AllwncExemptUs10.AllwncExemptUs10Dtls;
    if(Array.isArray(al)&&al.length){
      S.alw=al.filter(a=>a.SalNatureDesc!=="10(13A)")
             .map(a=>({sec:a.SalNatureDesc,amt:a.SalOthAmount}));
      read.push("allowances exempt u/s 10");
    }
  }
  const ea=I&&I.ScheduleEA10_13A;
  if(ea){
    S.sal.hra=S.sal.hra||{};
    S.sal.hra.place=String(ea.Placeofwork)==="1"?"1":"2";
    if(ea.ActlHRARecv!=null)S.sal.hra.hra=ea.ActlHRARecv;
    if(ea.ActlRentPaid!=null)S.sal.hra.rent=ea.ActlRentPaid;
    if(ea.DtlsSalUsSec171!=null)S.sal.hra.sal17=ea.DtlsSalUsSec171;
    if(ea.BasicSalary!=null)S.sal.hra.basic=ea.BasicSalary;
    if(ea.DearnessAllwnc!=null)S.sal.hra.da=ea.DearnessAllwnc;
    read.push("HRA exemption 10(13A)");
  }
  return read;
}

/* ---- checks (section-local sanity, not the CBDT rule engine) ------- */
function chkSal(){
  const out=[]; const A=engSal(); const sl=S.sal||{};
  /* allowances must be within gross salary */
  if(A.manualExempt+A.hraElig>A.gross && A.gross>0)
    out.push({lvl:"warn",t:"Exempt allowances",m:"The allowances exempt under section 10 exceed the gross salary; they have been limited to the salary.",sec:"sal"});
  /* stray allowance rows disallowed under the new regime */
  if(A.isNew){
    const lost=(S.alw||[]).filter(a=>n0(a.amt) && _SAL_ALW_NEW.indexOf(a.sec)<0 && a.sec!=="10(13A)");
    if(lost.length)
      out.push({lvl:"warn",t:"Allowances under the new regime",m:"Some allowances entered are not exempt under section 115BAC and will not be carried to the return.",sec:"sal"});
  }
  /* rows without a nature or amount */
  (S.alw||[]).forEach((a,i)=>{
    if(n0(a.amt) && !st0(a.sec))
      out.push({lvl:"err",t:"Allowance row "+(i+1),m:"Choose the nature of the allowance exempt under section 10.",sec:"sal"});
  });
  /* entertainment allowance only for Government employees */
  if(!A.isNew && n0(sl.ent) && !A.govt)
    out.push({lvl:"warn",t:"Entertainment allowance",m:"The section 16(ii) entertainment allowance is available only to Government employees; it has not been allowed.",sec:"sal"});
  /* HRA schedule sanity */
  if(A.hraOn){
    const hra=sl.hra||{};
    if(n0(hra.hra) && !n0(hra.rent))
      out.push({lvl:"warn",t:"House rent allowance",m:"No rent paid is entered, so no HRA exemption under 10(13A) is available.",sec:"sal"});
    if(n0(hra.hra) && !(n0(hra.basic)+n0(hra.da)))
      out.push({lvl:"warn",t:"House rent allowance",m:"Enter the basic salary (and dearness allowance) to work out the HRA exemption.",sec:"sal"});
  }
  if(!out.length && A.incomeFromSal)
    out.push({lvl:"ok",t:"Salary",m:"Income chargeable under salaries is "+RS(A.incomeFromSal)+
      " after "+RS(A.d16)+" of section-16 deductions.",sec:"sal"});
  return out;
}

/* ---- register (overrides the boot stub) ---------------------------- */
reg({id:"sal", t:"Salary income", ref:"Income Details · salary", f:secSal, s:()=>{
    const A=S.C.sal||{}; return A.incomeFromSal?RS(A.incomeFromSal):"";},
  eng:engSal, exp:expSal, imp:impSal, chk:chkSal, order:30, corder:30});

/* =====================================================================
   ITR-1 · Section "tax" — Tax computation (ITR1_TaxComputation)
   Screen order 90; compute order (corder) 90 — runs BEFORE "paid"
   (corder 92) so the net tax liability is on S.C.tax.* when the paid
   section computes interest, and AFTER the income/deduction sections
   (sal/hp/os corder 30/40/44, ded corder 50) so their published head
   incomes and the allowed Chapter-VI-A total are already on S.C.*.

   OWNS / writes on export — the whole ITR1_TaxComputation block:
     TotalTaxPayable, Rebate87A, TaxPayableOnRebate, EducationCess,
     GrossTaxLiability, Section89, NetTaxLiability,
     IntrstPay.{IntrstPayUs234A, IntrstPayUs234B, IntrstPayUs234C,
       LateFilingFee234F, FeeFurnish234I}, TotalIntrstPay, TotTaxPlusIntrstPay.
   The interest / fee figures themselves are COMPUTED by the "paid"
   section (caps.md §8-9 senior/threshold/carve-out fixes) and published
   on S.C.paid.*; this block's export reads them from there, so there is a
   single writer per block (paid never writes ITR1_TaxComputation).

   Reads on compute:
     S.C.sal.income, S.C.hp.income, S.C.os.income  — head incomes (GTI)
     S.C.ded.total                                 — allowed Chapter-VI-A
     S.C.who.senior / S.C.who.superSenior          — basic-exemption slab
     S.C.ret.regime                                — new / old regime
     S.C.os.ltcg112a (best-effort)                 — 112A gain for the
                                                     OLD-regime 87A test
   Publishes S.C.tax.{ti, grossTax, rebate, cess, grossTaxLiability,
     netTaxLiability} plus footer aliases (gross, net, regime, gti) and
     the marginal-relief / taxPayableOnRebate detail the screen shows.
     Also sets the footer scalars S.C.gti and S.C.ti.

   Tax ladder mirrors the prior builder's slab/engTax (which matches the
   utility) — NEW 0/5/10/15/20/25/30% at 4/8/12/16/20/24L cumulative bases;
   OLD 2.5/5/10L with senior (3L) / super-senior (5L) basic exemption in the
   OLD regime only (new regime forces age 55 → no age benefit). §87A uses
   the LIVE AO177 rule (caps.md §6, fix D10/D11): NEW total income ≤ ₹12L →
   min(tax, ₹60,000) with marginal relief tax − (TI − ₹12L) just above ₹12L;
   OLD total income ≤ ₹5L → min(tax, ₹12,500). 4% health-&-education cess; NO
   surcharge (ITR-1); total income rounded to the nearest ₹10 (§288B).
   112A ≤ ₹1.25L is handled in "os"; §89 relief needs Form 10E.
   ===================================================================== */

/* ---- the slabs (unique names; do not shadow any shell global) ------- */
const TX_SLAB_NEW=[[400000,0],[800000,5],[1200000,10],[1600000,15],
                   [2000000,20],[2400000,25],[Infinity,30]];
const TX_SLAB_OLD=[[250000,0],[500000,5],[1000000,20],[Infinity,30]];
const TX_SLAB_SR =[[300000,0],[500000,5],[1000000,20],[Infinity,30]];   /* senior 60-79, OLD only */
const TX_SLAB_SSR=[[500000,0],[1000000,20],[Infinity,30]];              /* super-senior >=80, OLD only */

/* slab tax on `inc` over the cumulative bands */
function _txSlab(inc,b){let t=0,l=0;
  for(const x of b){const u=x[0],r=x[1];
    if(inc>l)t+=(Math.min(inc,u)-l)*r/100; l=u; if(inc<=u)break;}
  return R(t);}

/* ---- cross-section readers (guarded; nothing throws) ---------------- */
/* new regime?  reads S.C.ret.regime ("new"/"old"), tolerating a boolean
   or the raw opt-out flag; new is the AY2026-27 default */
function _txRegNew(){
  const r=S.C.ret||{};
  if(r.regime==="new")return true;
  if(r.regime==="old")return false;
  if(typeof r.isNew==="boolean")return r.isNew;
  if(typeof r.new==="boolean")return r.new;
  const opt=((S.ret||{}).optout!=null?(S.ret||{}).optout:(S.fs||{}).optout);
  if(opt==="Yes"||opt==="Y")return false;
  return true;
}
/* senior (age 60-79) and super-senior (>=80) — actual age, from who */
function _txSenior(){const w=S.C.who||{};
  if(typeof w.senior==="boolean")return w.senior;
  if(w.senior==="Y")return true;
  return (typeof senior==="function")?senior():false;}
function _txSuper(){const w=S.C.who||{};
  if(typeof w.superSenior==="boolean")return w.superSenior;
  if(w.superSenior==="Y")return true;
  return (typeof superSr==="function")?superSr():false;}
/* the 112A long-term gain that "os" carries free of tax (≤ ₹1.25L, on
   S.C.os.ltcg) — the utility adds it back only for the OLD-regime 87A test */
function _txLtcg(){const o=S.C.os||{};
  const v=o.ltcg!=null?o.ltcg:(o.ltcg112a!=null?o.ltcg112a:
    (o.carried112A!=null?o.carried112A:(o.longCap112A!=null?o.longCap112A:0)));
  return N(v);}

/* ---- engine ---------------------------------------------------------- */
function engTax(){
  const regNew=_txRegNew(), sr=_txSenior(), ssr=_txSuper();
  /* GTI = salary + house property + other sources.  A house-property loss
     cannot be set against other heads under the new regime (115BAC), so the
     HP figure is floored at 0 there; the OLD regime allows the loss (already
     capped to the ₹2,00,000 set-off ceiling inside the hp section). */
  const salC=S.C.sal||{}, hpC=S.C.hp||{};
  const salInc=N(salC.incomeFromSal!=null?salC.incomeFromSal:salC.income);  /* head-salary income */
  const hpRaw =N(hpC.total!=null?hpC.total:hpC.income);                     /* signed HP income (2L-capped) */
  const osInc =N((S.C.os ||{}).income);
  const hp=regNew?Math.max(0,hpRaw):hpRaw;
  const gti=R(salInc+hp+osInc);
  const dedTot=N((S.C.ded||{}).total);                 /* allowed Chapter-VI-A */
  const ltcg=_txLtcg();
  /* Total income, rounded to the nearest ₹10 (§288B).  tiLT adds the 112A
     gain — used only for the OLD-regime 87A threshold, as the utility does. */
  const ti  =Math.max(0,Math.round((gti      -dedTot)/10)*10);
  const tiLT=Math.max(0,Math.round((gti+ltcg -dedTot)/10)*10);

  const bands=regNew?TX_SLAB_NEW:(ssr?TX_SLAB_SSR:sr?TX_SLAB_SR:TX_SLAB_OLD);
  const grossTax=_txSlab(ti,bands);

  /* §87A — the LIVE AO177 rule (not the stale 7L/25k back-up cell) */
  let rebate=0,marginal=0;
  if(regNew){
    if(ti<=1200000) rebate=Math.min(grossTax,60000);
    else if(grossTax>ti-1200000){ marginal=grossTax-(ti-1200000); rebate=marginal; }
  } else if(tiLT<=500000){
    rebate=Math.min(grossTax,12500);
  }
  const after=Math.max(0,grossTax-rebate);             /* TaxPayableOnRebate */
  const cess=R(after*0.04);                            /* 4% cess; NO surcharge */
  const grossTaxLiability=R(after+cess);
  const s89=N((S.tax||{}).s89);                        /* relief u/s 89 (Form 10E) */
  const netTaxLiability=Math.max(0,R(grossTaxLiability-s89));

  S.C.tax={
    ti, tiLT, gti, ltcg:R(ltcg),
    grossTax:R(grossTax), gross:R(grossTax),          /* gross = footer alias */
    rebate:R(rebate), marginal:R(marginal),
    after:R(after), taxPayableOnRebate:R(after),
    cess, grossTaxLiability,
    section89:R(s89), s89:R(s89),
    netTaxLiability, net:netTaxLiability,
    regime:regNew?"New":"Old", senior:sr, superSenior:ssr, bands};
  /* footer contract the shell band() reads */
  S.C.gti=gti; S.C.ti=ti;
}

/* ---- renderer -------------------------------------------------------- */
function secTax(){
  const T=S.C.tax||{}, I=S.C.paid||S.C.int||{}; let h="";
  h+=row("Regime",'<span class="c">'+esc(T.regime||"")+'</span>',
    {hint:T.regime==="Old"?(T.superSenior?"a very senior citizen — the first ₹5,00,000 is free"
      :T.senior?"a senior citizen — the first ₹3,00,000 is free":"the first ₹2,50,000 is free")
      :"the new regime slabs start at ₹4,00,000"});
  h+=row("Gross total income",cell(T.gti),{ref:"B4"});
  if(T.ltcg)h+=row("Long-term gain under section 112A (added for the rebate test only)",
    cell(T.ltcg),{ref:"C3(a)",hint:"exempt up to ₹1,25,000 — reported in the exempt-income screen"});
  h+=row("Less: deductions under Chapter VI-A",cell(-N((S.C.ded||{}).total)),{ref:"C1"});
  h+=row("Total income",cell(T.ti),{cls:"tot",ref:"C2",hint:"rounded to the nearest ₹10"});

  h+=sub("The slabs");
  h+='<div class="full"><table class="gt" style="min-width:660px"><thead><tr>'+
     '<th class="l">Slab</th><th style="width:80px">Rate</th>'+
     '<th style="width:160px">Income in it</th><th style="width:160px">Tax</th>'+
     '</tr></thead><tbody>';
  let last=0;
  (T.bands||[]).forEach(x=>{const u=x[0],r=x[1];
    const inSlab=Math.max(0,Math.min(T.ti||0,u)-last);
    const lbl=u===Infinity?"Above "+RS(last):(last===0?"Up to "+RS(u):RS(last+1)+" to "+RS(u));
    if(inSlab||r===0)
      h+='<tr><td class="l">'+esc(lbl)+'</td><td class="num" style="color:var(--ink-3)">'+r+
         '%</td><td class="num">'+cell(inSlab)+'</td><td class="num">'+cell(inSlab*r/100)+'</td></tr>';
    last=u;});
  h+='</tbody><tfoot><tr><td class="l" colspan="3">Tax payable on total income</td><td>'+
     F(T.grossTax)+'</td></tr></tfoot></table></div>';

  h+=row("Tax payable on total income",cell(T.grossTax),{ref:"D1"});
  h+=row("Rebate under section 87A",cell(-T.rebate),{ref:"D2",
    hint:T.marginal?"marginal relief — the tax is held to the income above "+
      RS(T.regime==="New"?1200000:500000)
      :"where total income is not more than "+RS(T.regime==="New"?1200000:500000)});
  h+=row("Tax payable after the rebate",cell(T.taxPayableOnRebate),{cls:"tot",ref:"D3"});
  h+=row("Health and education cess at four per cent",cell(T.cess),{ref:"D4"});
  h+=row("Total tax and cess",cell(T.grossTaxLiability),{cls:"tot",ref:"D5"});
  h+=row("Relief under section 89",inp("tax.s89",{n:1}),{ref:"D6"});
  if(N((S.tax||{}).s89)){
    h+=formNote("Relief under section 89 needs <b>Form 10E</b> filed before the return.");
    h+=row("Acknowledgement number of Form 10E",inp("tax.e10ack",{max:15}),{req:1,ind:1});
  }
  h+=row("Net tax liability",cell(T.netTaxLiability),{cls:"tot",ref:"D-net"});

  /* interest / fee summary — computed by the paid section (read-only here) */
  h+=sub("Interest, fee and the balance");
  h+=row("Due date of filing",'<span class="c">'+DISP(DUE)+'</span>');
  {const fd=D((S.C.ret||{}).filedDate)||D((S.ret||{}).filed);
   h+=row("Date of filing",'<span class="c">'+(fd?DISP(fd):"—")+'</span>',
     {hint:"entered on the Return and regime screen; drives 234A and the 234F fee"});}
  h+=row("Interest under section 234A",cell(I.i234a),{ref:"D7",hint:"late filing"});
  h+=row("Interest under section 234B",cell(I.i234b),{ref:"D8",hint:"short payment of advance tax"});
  h+=row("Interest under section 234C",cell(I.i234c),{ref:"D9",hint:"deferment of instalments"});
  h+=row("Fee for filing late (234F)",cell(I.f234f),{ref:"D10",
    hint:"₹1,000 where total income is not more than ₹5,00,000, otherwise ₹5,000"});
  if(I.f234i)h+=row("Fee for furnishing (234-I)",cell(I.f234i),{ref:"D10a"});
  h+=row("Total interest and fee",cell(I.totalIntrstPay),{cls:"tot"});
  h+=row("Total tax, fee and interest",cell(I.aggregate),{cls:"grand",ref:"D11"});
  h+=note("Tax deducted, collected, advance tax and self-assessment tax, and the "+
    "balance or refund, are on the <b>Taxes paid</b> screen.");
  return h;
}

/* ---- export — the whole ITR1_TaxComputation block ------------------- */
function expTax(j){
  const T=S.C.tax||{}, I=S.C.paid||S.C.int||{};
  const i234a=n0(I.i234a), i234b=n0(I.i234b), i234c=n0(I.i234c);
  const f234f=Math.min(5000,n0(I.f234f)), f234i=Math.min(5000,n0(I.f234i));
  const totInt=n0(I.totalIntrstPay!=null?I.totalIntrstPay:(i234a+i234b+i234c+f234f+f234i));
  const net=n0(T.netTaxLiability);
  /* Income-summary roll-up leaves in ITR1_IncomeDeductions — the tax section is
     the sole writer of these three (sal/hp/os write the head incomes, ded writes
     the VI-A leaves; nobody else touches the GTI/TI summary). Without this the
     schema skeleton (10_state) leaves them at 0, which false-fires the GTI rules
     (A18/A20/A21/A22) and the 80D GTI-restriction (A137). Mirrors the footer
     scalars S.C.gti / S.C.ti that gate-7 figures against. */
  const IDb=j.ITR1_IncomeDeductions=j.ITR1_IncomeDeductions||{};
  put(IDb,"GrossTotIncome",n0(T.gti));                       /* salary + HP + OS head incomes */
  put(IDb,"GrossTotIncomeIncLTCG112A",n0(N(T.gti)+N(T.ltcg)));/* + LTCG u/s 112A (<=1.25L) */
  put(IDb,"TotalIncome",n0(T.ti));                           /* GTI - allowed Chapter-VIA, rounded to Rs.10 */

  const TC=j.ITR1_TaxComputation=j.ITR1_TaxComputation||{};
  put(TC,"TotalTaxPayable",n0(T.grossTax));
  put(TC,"Rebate87A",n0(T.rebate));
  put(TC,"TaxPayableOnRebate",n0(T.taxPayableOnRebate));
  put(TC,"EducationCess",n0(T.cess));
  put(TC,"GrossTaxLiability",n0(T.grossTaxLiability));
  put(TC,"Section89",n0(T.section89));
  put(TC,"NetTaxLiability",net);
  put(TC,"IntrstPay.IntrstPayUs234A",i234a);
  put(TC,"IntrstPay.IntrstPayUs234B",i234b);
  put(TC,"IntrstPay.IntrstPayUs234C",i234c);
  put(TC,"IntrstPay.LateFilingFee234F",f234f);
  put(TC,"IntrstPay.FeeFurnish234I",f234i);
  put(TC,"TotalIntrstPay",totInt);
  put(TC,"TotTaxPlusIntrstPay",n0(net+totInt));
  /* the required whole-number leaves are kept even at 0 */
  ["TotalTaxPayable","Rebate87A","TaxPayableOnRebate","EducationCess",
   "GrossTaxLiability","Section89","NetTaxLiability","TotalIntrstPay",
   "TotTaxPlusIntrstPay"].forEach(k=>{if(TC[k]==null)TC[k]=0;});
  TC.IntrstPay=TC.IntrstPay||{};
  ["IntrstPayUs234A","IntrstPayUs234B","IntrstPayUs234C","LateFilingFee234F",
   "FeeFurnish234I"].forEach(k=>{if(TC.IntrstPay[k]==null)TC.IntrstPay[k]=0;});
}

/* ---- import (inverse; the return carries only Section89 of these) --- */
function impTax(I){
  const read=[]; const g=(o,p)=>p.split(".").reduce((t,k)=>t==null?undefined:t[k],o);
  const s89=g(I,"ITR1_TaxComputation.Section89");
  if(s89!=null){S.tax=S.tax||{};S.tax.s89=N(s89);read.push("section 89 relief");}
  return read;
}

/* ---- section-local sanity (not the CBDT rule engine) --------------- */
function chkTax(){
  const out=[]; const T=S.C.tax||{};
  if(N((S.tax||{}).s89)&&!/^\d{15}$/.test(st0((S.tax||{}).e10ack)))
    out.push({lvl:"err",t:"Form 10E",m:"Relief under section 89 needs the fifteen-digit acknowledgement of Form 10E.",sec:"tax"});
  if(T.marginal>0)
    out.push({lvl:"ok",t:"Marginal relief under section 87A",
      m:"Total income is just over ₹12,00,000, so the tax is held to the amount by which it exceeds that figure — relief of "+RS(T.marginal)+".",sec:"tax"});
  else if(T.rebate>0)
    out.push({lvl:"ok",t:"Rebate under section 87A",m:RS(T.rebate)+" of tax falls away.",sec:"tax"});
  if(N(T.ti)>5000000)
    out.push({lvl:"err",t:"ITR-1 cannot be used",
      m:"Total income is "+RS(T.ti)+". Sahaj stops at ₹50,00,000 — the return has to go on ITR-2.",sec:"tax"});
  if(!out.length)
    out.push({lvl:"ok",t:"Tax computation",m:T.regime+" regime · tax "+RS(T.netTaxLiability)+" after the rebate and cess.",sec:"tax"});
  return out;
}

/* ---- register (overrides the boot stub) ---------------------------- */
reg({id:"tax", t:"Tax computation", ref:"ITR1_TaxComputation · 112A", f:secTax,
  s:()=>{const T=S.C.tax||{}; return T.grossTaxLiability?("Tax "+CR(T.netTaxLiability)):"Slabs, rebate, cess";},
  eng:engTax, exp:expTax, imp:impTax, chk:chkTax, order:90, corder:90});

/* =====================================================================
   ITR-1 · Section "who" — Who is filing (Personal information)
   Books: books/ITR-1/schema_tree.md §1 CreationInfo · §2 Form_ITR1 ·
   §3 PersonalInfo · sections.md S1 · enums.json (StateCode, EmployerCategory,
   SecondaryAdd) · skeleton.json.
   Compute order 10 (corder 10) — runs FIRST: every downstream tax/interest/
   deduction gate reads S.C.who.* (age → senior / super-senior, employerCat).
   Screen order 10.

   Owns / writes on export (home EVERY leaf of these blocks):
     · CreationInfo.{SWVersionNo, SWCreatedBy, JSONCreatedBy, JSONCreationDate,
       IntermediaryCity, Digest}                              (§1, auto/meta)
     · Form_ITR1.{FormName, Description, AssessmentYear "2026",
       SchemaVer, FormVer}                                    (§2, auto/meta)
     · PersonalInfo.AssesseeName.{FirstName, MiddleName, SurNameOrOrgName}
     · PersonalInfo.PAN
     · PersonalInfo.Address.{ResidenceNo, ResidenceName, RoadOrStreet,
       LocalityOrArea, CityOrTownOrDistrict, StateCode, CountryCode, PinCode,
       ZipCode, CountryCodeMobile, MobileNo, CountryCodeMobileNoSec, MobileNoSec,
       EmailAddress, EmailAddressSec}
     · PersonalInfo.SecondaryAdd
     · PersonalInfo.AlternateAddress.{ResidenceNo, ResidenceName, RoadOrStreet,
       LocalityOrArea, CityOrTownOrDistrict, StateCode, CountryCode, PinCode,
       ZipCode}                                               (only when SecondaryAdd=Y)
     · PersonalInfo.DOB
     · PersonalInfo.EmployerCategory
     · PersonalInfo.AadhaarCardNo

   PUBLISHES (S.C.who.*): age (as on 31-03-2026), senior (60-79),
   superSenior (>=80), employerCat, pan, name, income(=0). The tax section
   reads senior/superSenior for the 234A/B/C exemptions and the 87A/234F
   thresholds; the salary section reads employerCat for the HRA schedule and
   16(ii) entertainment-allowance visibility.

   ITR-1 is a RESIDENT-INDIVIDUAL-only return: there is NO exported residential-
   status leaf (the utility comments it all out — enums.json PersonType_Status
   note). Residency is a gate applied downstream, not a field on this screen;
   the communication address therefore defaults to India (CountryCode 91). The
   CountryCode / ZipCode leaves are still homed here (export + import round-trip)
   for a foreign communication address carried in a portal prefill.
   ===================================================================== */

/* ---- CreationInfo / Form_ITR1 meta constants (schema §1 / §2) --------- */
const WHO1_SWVER   ="1.0";
const WHO1_SWBY    ="SW10000000";            /* [S][W][0-9]{8} pattern */
const WHO1_INTCITY ="Delhi";
const WHO1_FORMDESC="For Individuals having Income from Salaries, one house "+
  "property, other sources (Interest etc.) and having total income upto Rs.50 lakh";

/* ---- dropdown value lists ([code,label]) — enums.json VERBATIM -------- */
/* EmployerCategory — enums.json EmployerCategory (9 codes) */
const WHO1_EMPCAT=[
  ["CGOV","Central Government"],["SGOV","State Government"],
  ["PSU","Public Sector Undertaking"],["PE","Pensioners - Central Government"],
  ["PESG","Pensioners - State Government"],["PEPS","Pensioners - Public sector undertaking"],
  ["PEO","Pensioners - Others"],["OTH","Others"],
  ["NA","Not Applicable (eg. Family pension etc)"]];
/* SecondaryAdd — enums.json SecondaryAdd */
const WHO1_YN=[["Y","Yes"],["N","No"]];
/* StateCode — enums.json StateCode (38 states/UTs + 99 foreign) VERBATIM */
const WHO1_STATE=[
  ["01","ANDAMAN AND NICOBAR ISLANDS"],["02","ANDHRA PRADESH"],["03","ARUNACHAL PRADESH"],
  ["04","ASSAM"],["05","BIHAR"],["06","CHANDIGARH"],["07","DADRA AND NAGAR HAVELI"],
  ["08","DAMAN AND DIU"],["09","DELHI"],["10","GOA"],["11","GUJARAT"],["12","HARYANA"],
  ["13","HIMACHAL PRADESH"],["14","JAMMU AND KASHMIR"],["15","KARNATAKA"],["16","KERALA"],
  ["17","LAKSHADWEEP"],["18","MADHYA PRADESH"],["19","MAHARASHTRA"],["20","MANIPUR"],
  ["21","MEGHALAYA"],["22","MIZORAM"],["23","NAGALAND"],["24","ORISSA"],["25","PONDICHERRY"],
  ["26","PUNJAB"],["27","RAJASTHAN"],["28","SIKKIM"],["29","TAMILNADU"],["30","TRIPURA"],
  ["31","UTTAR PRADESH"],["32","WEST BENGAL"],["33","CHHATTISGARH"],["34","UTTARAKHAND"],
  ["35","JHARKHAND"],["36","TELANGANA"],["37","LADAKH"],
  ["99","Foreign / Other (used with CountryCode<>91)"]];
/* CountryCode — enums.json CountryCode enumerates only 91 (India) for ITR-1;
   resident-individual return, so the communication country is India. */
const WHO1_COUNTRY=[["91","India"]];

/* ---- reference date for age (last day of PY 2025-26 / AY 2026-27) ----- */
const WHO1_AGEREF=new Date(2026,2,31);       /* 31 March 2026 */

/* ---- state (guarded seeds; a {} placeholder would short-circuit ||) --- */
S.who = S.who || {};
(function(W){
  const d=(k,v)=>{if(W[k]===undefined)W[k]=v;};
  d("first",""); d("mid",""); d("last",""); d("pan",""); d("dob",""); d("aadhaar","");
  d("addr1",""); d("premises",""); d("road",""); d("locality",""); d("city","");
  d("state",""); d("country","91"); d("pin",""); d("zip","");
  d("mobileCc","91"); d("mobile",""); d("mobile2Cc","91"); d("mobile2","");
  d("email",""); d("email2","");
  d("addr2same","N");                        /* SecondaryAdd (default N) */
  d("addr1b",""); d("premisesb",""); d("roadb",""); d("localityb",""); d("cityb","");
  d("stateb",""); d("countryb","91"); d("pinb",""); d("zipb","");
  d("empcat","OTH");                         /* EmployerCategory */
})(S.who);

/* =====================================================================
   ENGINE — engWho(): identity face, adds nothing to GTI. Publishes the age /
   senior status and employer category the whole return gates on.
   ===================================================================== */
function engWho(){
  const W=S.who||{};
  const C=S.C.who={ income:0 };
  /* age as on the last day of the previous year (31-03-2026). A person who
     attains 60 (or 80) on or before that date is senior (super-senior) for
     the year — the "at any time during the PY" test. */
  const dob=(typeof D==="function")?D(W.dob):null;
  let age=0;
  if(dob){
    age=WHO1_AGEREF.getFullYear()-dob.getFullYear();
    const m=WHO1_AGEREF.getMonth()-dob.getMonth();
    if(m<0||(m===0&&WHO1_AGEREF.getDate()<dob.getDate())) age--;
    if(age<0) age=0;
  }
  C.age        = age;
  C.senior     = age>=60 && age<80;          /* 60-79 : basic exemption 3,00,000 (old) */
  C.superSenior= age>=80;                     /* >=80  : basic exemption 5,00,000 (old) */
  C.seniorAny  = age>=60;                      /* helper: 234B/234C exemption (bacage>59) */
  C.employerCat= st0(W.empcat)||"OTH";         /* HRA schedule + 16(ii) gate */
  C.pan        = st0(W.pan).toUpperCase();
  C.name       = [st0(W.first),st0(W.mid),st0(W.last)].filter(Boolean).join(" ");
  C.income=0;
}

/* =====================================================================
   RENDERER — secWho(): the personal-information page.
   ===================================================================== */
function secWho(){
  const W=S.who;
  const india =(st0(W.country)||"91")==="91";
  const indiab=(st0(W.countryb)||"91")==="91";
  let h="";

  h+=note("<b>Who is filing.</b> ITR-1 is filed by a <b>resident individual</b> "+
    "whose total income is up to ₹50 lakh from salary, one house property and "+
    "other sources. This page is the person's identity and communication details; "+
    "it adds nothing to total income. The date of birth settles the slab and the "+
    "senior-citizen benefits. Every date is <b>"+DF+"</b>.");

  /* ===================== Name / PAN / DOB / Aadhaar ===================== */
  h+=sub("Name and identity");
  h+=row("First name",inp("who.first",{max:25}),{ref:"AssesseeName.FirstName"});
  h+=row("Middle name",inp("who.mid",{max:25}),{ref:"AssesseeName.MiddleName"});
  h+=row("Last name / surname",inp("who.last",{max:25}),{req:1,ref:"AssesseeName.SurNameOrOrgName"});
  h+=row("Permanent Account Number (PAN)",inp("who.pan",{max:10}),
    {req:1,ref:"PAN",hint:"ten characters; the fourth letter must be P for an individual"});
  h+=row("Date of birth",dte("who.dob"),
    {req:1,ref:"DOB",hint:"this settles the slab and the senior-citizen benefit"});
  h+=row("Aadhaar number",inp("who.aadhaar",{n:1,max:12}),
    {ref:"AadhaarCardNo",hint:"twelve digits; mandatory to be quoted with the PAN"});
  {const C=S.C.who||{};
   if(C.age)h+=note("On the date of birth entered, the assessee is <b>"+C.age+
     "</b> as on 31 March 2026 — "+(C.superSenior?"a <b>super-senior citizen</b> (≥80)":
       C.senior?"a <b>senior citizen</b> (60–79)":"not a senior citizen")+".");}

  /* ===================== Employer category ===================== */
  h+=sub("Nature of employment");
  h+=row("Employer category / nature of employment",sel("who.empcat",WHO1_EMPCAT,{blank:false}),
    {req:1,ref:"EmployerCategory",
     hint:"drives the entertainment-allowance 16(ii) (government only) and the HRA schedule"});

  /* ===================== Primary address ===================== */
  h+=sub("Primary address — for communication");
  h+=row("Flat / Door / Block No",inp("who.addr1",{max:50}),{req:1,ref:"Address.ResidenceNo"});
  h+=row("Name of premises / building / village",inp("who.premises",{max:50}),{ref:"Address.ResidenceName"});
  h+=row("Road / Street / Post Office",inp("who.road",{max:50}),{ref:"Address.RoadOrStreet"});
  h+=row("Area / Locality",inp("who.locality",{max:50}),{req:1,ref:"Address.LocalityOrArea"});
  h+=row("Town / City / District",inp("who.city",{max:50}),{req:1,ref:"Address.CityOrTownOrDistrict"});
  h+=row("Country",sel("who.country",WHO1_COUNTRY,{blank:false}),
    {req:1,ref:"Address.CountryCode",hint:"ITR-1 is a resident return — India"});
  if(india){
    h+=row("State",sel("who.state",WHO1_STATE),{req:1,ref:"Address.StateCode"});
    h+=row("PIN code",inp("who.pin",{n:1,max:6}),{req:1,ref:"Address.PinCode",hint:"six digits"});
  } else {
    h+=row("State",sel("who.state",[["99","Foreign / Other"]],{blank:false}),{req:1,ref:"Address.StateCode"});
    h+=row("ZIP code",inp("who.zip",{max:10}),{req:1,ref:"Address.ZipCode"});
  }

  /* ===================== Communication ===================== */
  h+=sub("Details for communication");
  h+=row("Primary mobile number",
    inp("who.mobileCc",{n:1,max:3,ph:"Code"})+" "+inp("who.mobile",{n:1,max:10,ph:"Mobile"}),
    {req:1,ref:"Address.CountryCodeMobile / MobileNo",hint:"country code 91, then ten digits"});
  h+=row("Secondary mobile number",
    inp("who.mobile2Cc",{n:1,max:3,ph:"Code"})+" "+inp("who.mobile2",{n:1,max:10,ph:"Mobile"}),
    {ref:"Address.CountryCodeMobileNoSec / MobileNoSec"});
  h+=row("Primary email address",inp("who.email",{max:125,ph:"name@example.in"}),
    {req:1,ref:"Address.EmailAddress",hint:"receives the copy of the ITR-V"});
  h+=row("Secondary email address",inp("who.email2",{max:125}),{ref:"Address.EmailAddressSec"});

  /* ===================== Secondary address ===================== */
  h+=sub("Secondary address");
  h+=row("Do you want to give a second (different) address?",
    sel("who.addr2same",WHO1_YN,{blank:false}),
    {req:1,ref:"SecondaryAdd",hint:"choose Yes only if a separate communication address is to be added"});
  if(st0(W.addr2same)==="Y"){
    h+=row("Flat / Door / Block No",inp("who.addr1b",{max:50}),{req:1,ref:"AlternateAddress.ResidenceNo"});
    h+=row("Name of premises / building / village",inp("who.premisesb",{max:50}),{ref:"AlternateAddress.ResidenceName"});
    h+=row("Road / Street / Post Office",inp("who.roadb",{max:50}),{ref:"AlternateAddress.RoadOrStreet"});
    h+=row("Area / Locality",inp("who.localityb",{max:50}),{req:1,ref:"AlternateAddress.LocalityOrArea"});
    h+=row("Town / City / District",inp("who.cityb",{max:50}),{req:1,ref:"AlternateAddress.CityOrTownOrDistrict"});
    h+=row("Country",sel("who.countryb",WHO1_COUNTRY,{blank:false}),{req:1,ref:"AlternateAddress.CountryCode"});
    if(indiab){
      h+=row("State",sel("who.stateb",WHO1_STATE),{req:1,ref:"AlternateAddress.StateCode"});
      h+=row("PIN code",inp("who.pinb",{n:1,max:6}),{req:1,ref:"AlternateAddress.PinCode"});
    } else {
      h+=row("State",sel("who.stateb",[["99","Foreign / Other"]],{blank:false}),{req:1,ref:"AlternateAddress.StateCode"});
      h+=row("ZIP code",inp("who.zipb",{max:10}),{req:1,ref:"AlternateAddress.ZipCode"});
    }
  }

  return h;
}

/* =====================================================================
   EXPORT — expWho(j): serialise CreationInfo, Form_ITR1 and PersonalInfo onto
   j (the ITR1 root). put() skips undefined/null/"" but keeps 0; required
   string leaves fall back to a schema-valid placeholder so the block is never
   short of a required key.
   ===================================================================== */
function expWho(j){
  const W=S.who||{};
  const UP=v=>{v=sv(v);return v?String(v).toUpperCase():undefined;};
  const india =(st0(W.country)||"91")==="91";
  const indiab=(st0(W.countryb)||"91")==="91";
  const today=new Date().toISOString().slice(0,10);

  /* ---------- §1 CreationInfo (auto/meta) ---------- */
  put(j,"CreationInfo.SWVersionNo",WHO1_SWVER);
  put(j,"CreationInfo.SWCreatedBy",WHO1_SWBY);
  put(j,"CreationInfo.JSONCreatedBy",WHO1_SWBY);
  put(j,"CreationInfo.JSONCreationDate",today);
  put(j,"CreationInfo.IntermediaryCity",(sv(W.city)||WHO1_INTCITY).slice(0,25));
  put(j,"CreationInfo.Digest","-");

  /* ---------- §2 Form_ITR1 (auto/meta; AssessmentYear "2026") ---------- */
  put(j,"Form_ITR1.FormName","ITR-1");
  put(j,"Form_ITR1.Description",WHO1_FORMDESC);
  put(j,"Form_ITR1.AssessmentYear","2026");   /* utility hard-codes 2025 (bug); emit 2026 */
  put(j,"Form_ITR1.SchemaVer","Ver1.0");
  put(j,"Form_ITR1.FormVer","Ver1.0");

  /* ---------- §3 PersonalInfo ---------- */
  put(j,"PersonalInfo.AssesseeName.FirstName",sv(W.first));
  put(j,"PersonalInfo.AssesseeName.MiddleName",sv(W.mid));
  put(j,"PersonalInfo.AssesseeName.SurNameOrOrgName",(sv(W.last)||"NA").slice(0,25));

/* =====================================================================
   IMPORT — impWho(I): read CreationInfo/Form_ITR1/PersonalInfo back into
   S.who so the round-trip (JSON -> import -> export) is stable.

function impWho(I){
  const read=[], W=S.who=S.who||{};
  const _iso2dmy=s=>{s=st0(s);const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);
    return m?m[3]+"/"+m[2]+"/"+m[1]:"";};
  const PI=(I&&I.PersonalInfo)||{}, NM=PI.AssesseeName||{}, AD=PI.Address||{}, AA=PI.AlternateAddress||{};

  if(NM.FirstName!=null){W.first=NM.FirstName;}
  if(NM.MiddleName!=null){W.mid=NM.MiddleName;}
  if(NM.SurNameOrOrgName!=null){W.last=NM.SurNameOrOrgName;read.push("name");}
  if(PI.PAN!=null){W.pan=String(PI.PAN).toUpperCase();read.push("PAN");}
  if(PI.AadhaarCardNo!=null)W.aadhaar=String(PI.AadhaarCardNo);
  if(PI.DOB){W.dob=_iso2dmy(PI.DOB)||W.dob;read.push("date of birth");}
  if(PI.EmployerCategory!=null)W.empcat=PI.EmployerCategory;

  if(Object.keys(AD).length){
    if(AD.ResidenceNo!=null)W.addr1=AD.ResidenceNo;
    if(AD.ResidenceName!=null)W.premises=AD.ResidenceName;
    if(AD.RoadOrStreet!=null)W.road=AD.RoadOrStreet;
    if(AD.LocalityOrArea!=null)W.locality=AD.LocalityOrArea;
    if(AD.CityOrTownOrDistrict!=null)W.city=AD.CityOrTownOrDistrict;
    if(AD.StateCode!=null)W.state=String(AD.StateCode);
    if(AD.CountryCode!=null)W.country=String(AD.CountryCode);
    if(AD.PinCode!=null)W.pin=String(AD.PinCode);
    if(AD.ZipCode!=null)W.zip=AD.ZipCode;
    if(AD.CountryCodeMobile!=null)W.mobileCc=String(AD.CountryCodeMobile);
    if(AD.MobileNo!=null)W.mobile=String(AD.MobileNo);
    if(AD.CountryCodeMobileNoSec!=null)W.mobile2Cc=String(AD.CountryCodeMobileNoSec);
    if(AD.MobileNoSec!=null)W.mobile2=String(AD.MobileNoSec);
    if(AD.EmailAddress!=null)W.email=AD.EmailAddress;
    if(AD.EmailAddressSec!=null)W.email2=AD.EmailAddressSec;
    read.push("address and contact");
  }
  if(PI.SecondaryAdd!=null)W.addr2same=PI.SecondaryAdd;
  if(Object.keys(AA).length){
    if(AA.ResidenceNo!=null)W.addr1b=AA.ResidenceNo;
    if(AA.ResidenceName!=null)W.premisesb=AA.ResidenceName;
    if(AA.RoadOrStreet!=null)W.roadb=AA.RoadOrStreet;
    if(AA.LocalityOrArea!=null)W.localityb=AA.LocalityOrArea;
    if(AA.CityOrTownOrDistrict!=null)W.cityb=AA.CityOrTownOrDistrict;
    if(AA.StateCode!=null)W.stateb=String(AA.StateCode);
    if(AA.CountryCode!=null)W.countryb=String(AA.CountryCode);
    if(AA.PinCode!=null)W.pinb=String(AA.PinCode);
    if(AA.ZipCode!=null)W.zipb=AA.ZipCode;
    read.push("secondary address");
  }
  return read;
}

/* =====================================================================
   CHECKS — chkWho(): this screen's own mandatory / format validations
   (not the CBDT rule engine, which is a later phase).
   ===================================================================== */
function chkWho(){
  const out=[], W=S.who||{}; engWho();
  const india=(st0(W.country)||"91")==="91";
  const pan=st0(W.pan).toUpperCase();

  if(!st0(W.last)) out.push({lvl:"err",t:"Name required",m:"The last name / surname is mandatory.",sec:"who"});
  if(!pan) out.push({lvl:"err",t:"PAN required",m:"Enter the PAN of the individual.",sec:"who"});
  else if(!PAN_RE.test(pan)) out.push({lvl:"err",t:"PAN not valid",m:"The PAN must be five letters, four digits and a letter.",sec:"who"});
  else if(pan.charAt(3)!=="P") out.push({lvl:"warn",t:"PAN not an individual's",m:"The fourth letter of an individual's PAN is P — ITR-1 is for an individual only.",sec:"who"});

  if(!st0(W.dob)) out.push({lvl:"err",t:"Date of birth required",m:"Enter the date of birth in "+DF+" — it settles the slab.",sec:"who"});
  else if(!(typeof D==="function"&&D(W.dob))) out.push({lvl:"err",t:"Date of birth",m:"The date of birth is not a valid "+DF+" date.",sec:"who"});
  else if(D(W.dob)>WHO1_AGEREF) out.push({lvl:"err",t:"Date of birth",m:"The date of birth must be on or before 31 March 2026.",sec:"who"});

  if(st0(W.aadhaar)&&!AADH.test(st0(W.aadhaar))) out.push({lvl:"err",t:"Aadhaar",m:"The Aadhaar number must be twelve digits.",sec:"who"});
  if(!WHO1_EMPCAT.some(e=>e[0]===st0(W.empcat))) out.push({lvl:"err",t:"Employer category required",m:"Select the nature of employment.",sec:"who"});

  /* primary address */
  if(!st0(W.addr1)) out.push({lvl:"err",t:"Address required",m:"Flat / Door / Block No is mandatory.",sec:"who"});
  if(!st0(W.locality)) out.push({lvl:"err",t:"Address required",m:"Area / locality is mandatory.",sec:"who"});
  if(!st0(W.city)) out.push({lvl:"err",t:"Address required",m:"Town / City / District is mandatory.",sec:"who"});
  if(india&&!st0(W.state)) out.push({lvl:"err",t:"State required",m:"Select the state.",sec:"who"});
  if(india&&st0(W.pin)&&!/^\d{6}$/.test(st0(W.pin))) out.push({lvl:"err",t:"PIN code",m:"The PIN code must be six digits.",sec:"who"});
  else if(india&&!st0(W.pin)) out.push({lvl:"err",t:"PIN code required",m:"The six-digit PIN code is mandatory for an Indian address.",sec:"who"});

  /* communication */
  if(!st0(W.mobile)) out.push({lvl:"err",t:"Mobile required",m:"The primary mobile number is mandatory.",sec:"who"});
  else if((st0(W.mobileCc)||"91")==="91"&&!/^\d{10}$/.test(st0(W.mobile))) out.push({lvl:"warn",t:"Mobile number",m:"With country code 91 the mobile number should be ten digits.",sec:"who"});
  if(!st0(W.email)) out.push({lvl:"err",t:"Email required",m:"The primary email is mandatory — it receives the copy of the ITR-V.",sec:"who"});
  else if(!MAIL.test(st0(W.email))) out.push({lvl:"err",t:"Email not valid",m:"Enter a valid primary email address.",sec:"who"});
  if(st0(W.email2)&&!MAIL.test(st0(W.email2))) out.push({lvl:"err",t:"Secondary email",m:"The secondary email address is not valid.",sec:"who"});

  /* secondary address distinct */
  if(st0(W.addr2same)==="Y"&&(!st0(W.addr1b)||!st0(W.localityb)||!st0(W.cityb)))
    out.push({lvl:"err",t:"Secondary address required",m:"You chose to give a second address — its Flat/Door, locality and town are mandatory.",sec:"who"});

  if(!out.some(x=>x.lvl==="err")){
    const C=S.C.who||{};
    out.push({lvl:"ok",t:"Who is filing",m:(C.name||"Individual")+(pan?" · "+pan:"")+
      " · "+(C.superSenior?"super-senior":C.senior?"senior citizen":"below 60")+
      " (age "+(C.age||0)+").",sec:"who"});
  }
  return out;
}

/* =====================================================================
   Wiring — builds SECS in screen order and drives the whole form from the
   per-section registrations. Loaded last of the form parts.
   Central compute order for an ITR-1 individual: the income heads
   (salary -> house property -> other sources) feed the gross total income;
   Chapter-VI-A deductions and exempt income adjust it; the `tax` section
   does the Part B roll-up into the footer contract S.C.{gti,ti,tax,int};
   taxes paid and the bank/verification block close the return. Sections
   carry an `order` (screen order) and a `corder` (compute order).
   Modelled on forms/ITR-7/src/90_wiring.js.
   ===================================================================== */
const SECS = SCREEN_ORDER.map(id=>_SECREG.filter(r=>r.id===id).pop()).filter(Boolean)
  .map(r=>({id:r.id,t:r.t,ref:r.ref,f:r.f,s:r.s||(()=>"")}));

/* compute() — a 2-pass fixpoint over the section engines in compute order.
   Some feeds run against screen order (interest reads the balance of tax,
   Part B reads every head, 87A reads the total income): running every engine
   twice lets a value produced late in pass 1 reach an earlier-ordered engine
   in pass 2, so the whole computation converges. Engines assign (never
   accumulate) into S / S.C, so a second pass is idempotent once the fixpoint
   is reached. S.C is reset once, before the passes; the last pass is the one
   that records engine errors. */
function compute(){
  S.C={};                                   /* rebuilt every compute() call */
  const engs=_SECREG.filter(r=>r.eng).sort((a,b)=>((a.corder||a.order||50)-(b.corder||b.order||50))); /* corder = compute order (defaults to screen order); lets e.g. tax compute after every head */
  for(let pass=0;pass<2;pass++){
    const last=pass===1;
    for(const r of engs){ try{ r.eng(); }catch(e){ if(last)(S.C._errs=S.C._errs||[]).push(r.id+": "+e.message); } }
  }
  /* footer contract — a section (usually tax) sets these; default to 0 so the shell paints */
  S.C.gti = S.C.gti||0;
  S.C.ti  = S.C.ti ||0;
  S.C.tax = S.C.tax|| {gross:0, regime:(typeof isNew==="function"&&isNew())?"New":"Old", rebate:0};
  S.C.int = S.C.int|| {refund:0, balance:0, net:0};
  S.C.checks = engChecks();
}

function engChecks(){
  let out=[];
  for(const r of _SECREG){ if(r.chk){ try{ const c=r.chk(); if(Array.isArray(c)) out=out.concat(c);}catch(e){} } }
  return out;
}

/* buildReturn() — the schema envelope is {ITR:{ITR1:{...}}}; the ITR1 object
   is built from the required-key skeleton and each section's export writer
   fills its block(s). Root schema block: ITR1. */
function buildReturn(){
  compute();
  const j=deep(SKEL);
  for(const r of _SECREG){ if(r.exp){ try{ r.exp(j); }catch(e){ (S.C._errs=S.C._errs||[]).push("exp "+r.id+": "+e.message);} } }
  return {ITR:{ITR1:j}};
}

/* importReturn(I) — the inverse: unwrap the ITR1 object (from either {ITR1:..}
   or the bare block) and let each section's import reader pull its keys back
   into S. Returns the flat list of what was read. */
function importReturn(I){
  const read=[];
  const I1=(I&&I.ITR1)?I.ITR1:I;
  for(const r of _SECREG){ if(r.imp){ try{ const got=r.imp(I1); if(Array.isArray(got)) read.push.apply(read,got);}catch(e){} } }
  compute();
  return read;
}

const n0=x=>Math.max(0,R(x)),sg=x=>R(x),sv=v=>{v=st0(v);return v||undefined;};
function auditShape(b){const miss=[],bad=[];
  (function w(req,got,path){Object.keys(req).forEach(k=>{const p=path?path+"."+k:k;
    if(!(k in got)||got[k]===undefined){miss.push(p);return;}
    const r=req[k],g=got[k];
    if(r!==null&&typeof r==="object"&&!Array.isArray(r)){
      if(typeof g!=="object"||Array.isArray(g))bad.push(p+" should be an object");else w(r,g,p);
    } else if(typeof r==="number"){if(typeof g!=="number"||!isFinite(g)||g%1!==0)bad.push(p+" should be a whole number");
    } else if(typeof r==="string"){if(typeof g!=="string"||!g)bad.push(p+" should be text");}});
  })(SKEL,Object.values(b.ITR)[0],"");return {miss,bad};}

function exportJSON(){compute();

  if(errs.length){alert(errs.length+" thing"+(errs.length>1?"s":"")+" still to fix:\n\n"+

    (errs.length>8?"\n\n…and "+(errs.length-8)+" more.":""));return;}
  const b=buildReturn(),a=auditShape(b);
  if(a.miss.length||a.bad.length){alert("The return did not come out in the shape the schema requires:\n\n"+
    a.miss.slice(0,6).map(x=>"missing "+x).concat(a.bad.slice(0,6)).join("\n"));return;}
  const r=auditRules(b);
  if(r.length){alert("The return does not agree with itself:\n\n"+r.slice(0,8).join("\n"));return;}
  /* the department's own validation rules — Category A stops the upload, D is a warning */
  let rr=[];try{rr=runRules(Object.values(b.ITR)[0],S);}catch(e){console.error("rules",e);}
  const rA=rr.filter(x=>x.cat==="A"),rD=rr.filter(x=>x.cat==="D");S.C.rules=rr;
  if(rA.length){alert("The portal would reject this return — "+rA.length+" Category A rule"+(rA.length>1?"s":"")+" fail"+(rA.length>1?"":"s")+":\n\n"+

  if(rD.length)alert("Exported. "+rD.length+" Category D notice"+(rD.length>1?"s":"")+" to act on after upload:\n\n"+rD.map(x=>"D"+x.n+" · "+x.msg).join("\n"));

function rulesPanel(){let rr=[];try{const b=buildReturn();rr=runRules(Object.values(b.ITR)[0],S);}catch(e){return note("The department's rules could not be run yet — "+(e.message||e),"warn");}
