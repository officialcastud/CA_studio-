      if(sv(r.city)) ad.CityOrTownOrDistrict=sv(r.city).slice(0,50);
      if(DED_ST_SET.has(st0(r.state))) ad.StateCode=st0(r.state);
      if(/^[1-9]\d{5}$/.test(st0(r.pin))) ad.PinCode=parseInt(r.pin,10);
      if(Object.keys(ad).length) o.AddressDetail=ad;
      if(sv(r.pan)) o.DoneePAN=sv(r.pan).toUpperCase().slice(0,10);
      return o;
    });
    j.Schedule80GGA={ DonationDtlsSciRsrchRuralDev:rows,
      TotalDonationAmtCash80GGA:R(tCash), TotalDonationAmtOtherMode80GGA:R(tOth),
      TotalDonationsUs80GGA:R(tTot), TotalEligibleDonationAmt80GGA:R(tElig) };
  }

  /* Schedule80GGC — political party (cash barred) */
  const ggc=(D.ggc||[]).filter(r=>N(r.cash)||N(r.other)||sv(r.name));
  if(ggc.length){
    let tCash=0,tOth=0,tTot=0,tElig=0;
    const rows=ggc.map(r=>{
      const cash=n0(r.cash),oth=n0(r.other),tot=cash+oth;
      tCash+=cash;tOth+=oth;tTot+=tot;tElig+=oth;   /* cash gives no deduction */
      const o={ DonationAmtCash:cash, DonationAmtOtherMode:oth, DonationAmt:tot,
        EligibleDonationAmt:R(oth) };
      if(ISO(r.dt)) o.DonationDate=ISO(r.dt);
      if(sv(r.ifsc)) o.IFSCCode=sv(r.ifsc).toUpperCase().slice(0,11);
      if(sv(r.ref))  o.TransactionRefNum=sv(r.ref).slice(0,50);
      if(sv(r.name)) o.PoliticalPartyName=sv(r.name).slice(0,75);
      if(sv(r.pan))  o.PoliticalPartyPAN=sv(r.pan).toUpperCase().slice(0,10);
      return o;
    });
    j.Schedule80GGC={ Schedule80GGCDetails:rows,
      TotalDonationAmtCash80GGC:R(tCash), TotalDonationAmtOtherMode80GGC:R(tOth),
      TotalDonationsUs80GGC:R(tTot), TotalEligibleDonationAmt80GGC:R(tElig) };
  }

  const loanIn=(sch,dtls,intK)=>{const a=g(I,sch+"."+dtls);

/* ---- checks (section-local) --------------------------------------- */
function chkDed(){
  const out=[]; engDed(); const C=S.C.ded||{}, ent=C.ent||{}, alw=C.alw||{}, old=C.old, D=S.ded;
  if(!old){
    const lost=DED_KEYS.filter(k=>k!=="Section80CCDEmployer"&&k!=="AnyOthSec80CCH"&&N(ent[k]));
    if(lost.length)
      out.push({lvl:"warn",t:"New regime",m:"Under section 115BAC only 80CCD(2) and 80CCH(2) are allowed; the other amounts entered are not deducted.",sec:"ded"});
  } else {
    /* 80G — every field of a filled donee row is mandatory */
    [["g100",D.g100],["g50",D.g50],["g100q",D.g100q],["g50q",D.g50q]].forEach(([nm,rows])=>{
      (rows||[]).forEach((r,i)=>{
        if(!(N(r.cash)||N(r.other)||sv(r.name)||sv(r.pan))) return;
        if(!sv(r.name)) out.push({lvl:"err",t:"80G row",m:"The name of the donee is required.",sec:"ded"});
        if(!PAN_RE.test(st0(r.pan).toUpperCase())) out.push({lvl:"err",t:"80G row",m:"A valid PAN of the donee is required.",sec:"ded"});
        if(N(r.cash)>2000) out.push({lvl:"warn",t:"80G cash",m:"A cash donation above ₹2,000 gives no deduction — the cash of "+RS(r.cash)+" is disallowed.",sec:"ded"});
      });
    });
    (D.ggc||[]).forEach(r=>{ if(N(r.cash)) out.push({lvl:"warn",t:"80GGC cash",m:"A political-party contribution in cash gives no deduction.",sec:"ded"}); });
    (D.gga||[]).forEach(r=>{ if(N(r.cash)>2000) out.push({lvl:"warn",t:"80GGA cash",m:"An 80GGA cash donation above ₹2,000 gives no deduction.",sec:"ded"}); });
    if(N((D.gg||{}).amt) && !sv((D.gg||{}).ack))
      out.push({lvl:"err",t:"80GG",m:"A claim under 80GG needs the acknowledgement number of Form 10BA.",sec:"ded"});
    if(N((D.ddb||{}).amt) && !DED_DISEASE.some(x=>x[0]===(D.ddb||{}).disease))
      out.push({lvl:"err",t:"80DDB",m:"Pick the specified disease for the 80DDB claim.",sec:"ded"});
    if(ent.Section80DD && !st0((D.dd||{}).form10ia))
      out.push({lvl:"warn",t:"80DD",m:"Form 10-IA acknowledgement number is needed for the 80DD claim.",sec:"ded"});
    if(ent.Section80U && !st0((D.u||{}).form10ia))
      out.push({lvl:"warn",t:"80U",m:"Form 10-IA acknowledgement number is needed for the 80U claim.",sec:"ded"});
    if(alw.Section80TTB && !ded_senior())
      out.push({lvl:"warn",t:"80TTB",m:"80TTB is for a resident senior citizen.",sec:"ded"});
  }
  if(C.clipped)
    out.push({lvl:"warn",t:"Chapter VI-A",m:"The deductions have been limited to the income they are set against.",sec:"ded"});
  if(!out.length && C.total)
    out.push({lvl:"ok",t:"Chapter VI-A",m:"Deductions allowed "+RS(C.total)+".",sec:"ded"});
  return out;
}

    {k:"desc",h:"Description (circular / notification / receipt only)",t:"txt",w:"auto",max:250},

    S.ei,{min:"1120px",empty:"No exempt income reported.",add:"Add an exempt-income row"});

  h+=note("A <b>Description</b> is required only when the sub-category is a CBDT circular, a CBDT "+
    "notification, or a receipt not in the nature of income; leave it blank for every other clause.");

  /* --- agriculture > ₹5,000 bars ITR-1 --- */
  h+=note("<b>Agricultural income:</b> use sub-category <b>10(1)</b>. Net agricultural income of "+
    "<b>more than ₹5,000</b> cannot be reported in ITR-1 — you must file ITR-2 instead. "+
    "Keep agricultural income here at ₹5,000 or below.",
    ((S.C.ei||{}).agriOver5k)?"warn":undefined);

  h+=row("Total exempt income reported",cell((S.C.ei||{}).total),
    {ref:"ExemptIncAgriOthUs10Total",hint:"disclosure only; not part of total income"});

  return h;
}

/* ---- export — writes ONLY the ExemptIncAgriOthUs10 block --------------- */
function expEi(j){
  const rows=(S.ei||[]).filter(_eiValid1);
  if(!rows.length) return;                   /* block is conditional — omit when empty */

  /* create the nested path (skeleton omits it), then fill total + rows */
  const total=rows.reduce((s,r)=>s+Math.max(0,Math.round(N(r.amt))),0);
  put(j,"ITR1_IncomeDeductions.ExemptIncAgriOthUs10.ExemptIncAgriOthUs10Total",total);
  j.ITR1_IncomeDeductions.ExemptIncAgriOthUs10.ExemptIncAgriOthUs10Dtls=rows.map(r=>{
    const cat=EICAT1.some(c=>c[0]===r.cat)?r.cat:"OTH";
    const sub=EISUB1.some(c=>c[0]===r.sub)?r.sub:st0(r.sub);
    const o={Category:cat,SubCategory:sub,OthAmount:Math.max(0,Math.round(N(r.amt)))};
    if(EIDESC1.indexOf(sub)>=0) o.Description=(sv(r.desc)||"NA").slice(0,250);
    return o;
  });
}

/* ---- import (inverse) — seeds S.ei from a return ---------------------- */
function impEi(I){
  const read=[]; const g=(o,p)=>p.split(".").reduce((t,k)=>t==null?undefined:t[k],o);
  const dt=g(I,"ITR1_IncomeDeductions.ExemptIncAgriOthUs10.ExemptIncAgriOthUs10Dtls");
  if(Array.isArray(dt)&&dt.length){
    S.ei=dt.map(r=>({
      cat:EICAT1.some(c=>c[0]===r.Category)?r.Category:"OTH",
      sub:r.SubCategory||"",
      desc:r.Description||"",
      amt:N(r.OthAmount)}));
    read.push("exempt income ("+S.ei.length+" row"+(S.ei.length>1?"s":"")+")");
  }
  return read;
}

/* ---- checks — the section's own screen validations -------------------- */
function chkEi(){
  const out=[]; engEi();
  (S.ei||[]).forEach((r,i)=>{
    r=r||{};
    const started=st0(r.cat)||st0(r.sub)||st0(r.desc)||N(r.amt)>0;
    if(!started) return;                     /* skip an untouched blank row */
    const n=i+1;
    if(!EICAT1.some(c=>c[0]===r.cat))
      out.push({lvl:"err",t:"Exempt row "+n,m:"Select the category of exempt income.",sec:"ei"});
    if(!EISUB1.some(c=>c[0]===r.sub))
      out.push({lvl:"err",t:"Exempt row "+n,m:"Select the section-10 sub-category.",sec:"ei"});
    if(!(N(r.amt)>0))
      out.push({lvl:"err",t:"Exempt row "+n,m:"Enter the exempt amount (greater than zero).",sec:"ei"});
    if(EIDESC1.indexOf(r.sub)>=0 && !st0(r.desc))
      out.push({lvl:"err",t:"Exempt row "+n,m:"This sub-category (circular / notification / receipt) needs a description.",sec:"ei"});
    if(r.sub===EIAGRI1 && N(r.amt)>5000)
      out.push({lvl:"err",t:"Exempt row "+n,m:"Agricultural income above ₹5,000 cannot be filed in ITR-1 — use ITR-2.",sec:"ei"});
  });
  if(!out.length){
    const t=(S.C.ei||{}).total||0;
    out.push({lvl:"ok",t:"Exempt income",m:t?("₹"+t.toLocaleString("en-IN")+" of exempt income reported; every check passes."):"No exempt income to report.",sec:"ei"});
  }
  return out;
}

/* ---- register (overrides the boot stub) ------------------------------- */
reg({id:"ei", t:"Exempt income", ref:"Schedule EI", f:secEi,
  s:()=>{const t=((S.C.ei||{}).total)||0;
    return t?("₹"+t.toLocaleString("en-IN")+" exempt"):"";},
  eng:engEi, exp:expEi, imp:impEi, chk:chkEi, order:70, corder:28});

/* =====================================================================
   ITR-1 · Section "hp" — Income from house property
   Screen ref: HP sheet (Sheet19), PropertyDetails[] + the head total.
   Compute order 40, screen order 40.

   Built from books/ITR-1/schema_tree.md §7.3 (PropertyDetails[] +
   TotalIncomeChargeableUnHP), caps.md §5 (self-occupied 24(b) ceiling
   ₹2,00,000, the ₹2,00,000 HP-loss set-off ceiling, 30% standard
   deduction) and §1 (self-occupied 24(b) disallowed under the new
   regime), enums.json (PropertyOwner, ifLetOut, PropCoOwnedFlg,
   LoanTknFrom, StateCode) and the prev engine engProp()/engHP() in
   forms/ITR-1/Yukti_ITR1_prev.html — with the caps.md fixes applied.

   Owns / writes on export (no other builder writes these leaves):
     ITR1_IncomeDeductions.PropertyDetails[] (address, owner, co-owners,
       tenants, Rentdetails incl. Section24B loan table) and
     ITR1_IncomeDeductions.TotalIncomeChargeableUnHP

   Publishes S.C.hp.{total, loss, ...}: total is the SIGNED head income
   after the ₹2,00,000 loss cap (MAX(-200000, netHP)); loss is its
   magnitude when negative. The GTI consumer applies the new-regime floor.

   caps.md fixes over the prev builder:
     · self-occupied 24(b) interest capped at ₹2,00,000 (per property);
     · the ₹2,00,000 HP-LOSS set-off ceiling — enforce MAX(-200000, netHP)
       (the prev builder MISSED this);
     · new regime: self-occupied 24(b) interest disallowed.
   Reads S.C.ret.regime for the regime.
   ===================================================================== */

const _HP_OWNER=[["SE","Self"],["MI","Minor"],["SP","Spouse"],["OT","Others"]];
const _HP_TYPE=[["S","Self occupied"],["L","Let out"],["D","Deemed let out"]];
const _HP_LOAN=[["B","Bank"],["I","Institution / other than a bank"]];
const _HP_YN=[["N","No"],["Y","Yes"]];
const _HP_STATE=[["01","Andaman and Nicobar Islands"],["02","Andhra Pradesh"],
 ["03","Arunachal Pradesh"],["04","Assam"],["05","Bihar"],["06","Chandigarh"],
 ["07","Dadra and Nagar Haveli"],["08","Daman and Diu"],["09","Delhi"],["10","Goa"],
 ["11","Gujarat"],["12","Haryana"],["13","Himachal Pradesh"],["14","Jammu and Kashmir"],
 ["15","Karnataka"],["16","Kerala"],["17","Lakshadweep"],["18","Madhya Pradesh"],
 ["19","Maharashtra"],["20","Manipur"],["21","Meghalaya"],["22","Mizoram"],["23","Nagaland"],
 ["24","Orissa"],["25","Pondicherry"],["26","Punjab"],["27","Rajasthan"],["28","Sikkim"],
 ["29","Tamil Nadu"],["30","Tripura"],["31","Uttar Pradesh"],["32","West Bengal"],
 ["33","Chhattisgarh"],["34","Uttarakhand"],["35","Jharkhand"],["36","Telangana"],
 ["37","Ladakh"],["99","Foreign / other"]];
const _HP_STATECODES=_HP_STATE.map(s=>s[0]);

function _hpIsOld(){
  const r=RG(S,"C.ret.regime","");
  if(r==="old"||r==="Old"||r==="OLD"||r==="Y"||r==="y"||r===2||r==="2")return true;
  if(r==="new"||r==="New"||r==="NEW"||r==="N"||r==="n"||r===1||r==="1")return false;
  if(typeof isNew==="function"){try{return !isNew();}catch(e){}}
  return false;                                   /* AY2026-27 default = new */
}
function _hpIsNew(){return !_hpIsOld();}

/* ---- state seed (never clobber shell / import) --------------------- */
S.hp=S.hp||{};
S.hp.props=S.hp.props||[];

/* ---- one property -------------------------------------------------- */
function _hpProp(p){
  p=p||{};
  const isNewR=_hpIsNew();
  const type=["S","L","D"].indexOf(st0(p.type))>=0?st0(p.type):"S";
  const self=type==="S";
  const sh=Math.min(100, Math.max(0, N(p.share)||100))/100;
  const alv=self?0:R(N(p.rent)*sh);
  const rentNotReal=self?0:R(N(p.rentNotReal)*sh);
  const taxes=self?0:R(N(p.taxes)*sh);
  const unrealAndTax=rentNotReal+taxes;
  const balanceALV=Math.max(0, alv-unrealAndTax);
  const annualOwned=balanceALV;                       /* owner's share of NAV */
  const std=annualOwned>0?R(0.30*annualOwned):0;      /* 30% standard deduction */
  /* 24(b) interest — from the loan table (Section24BDtls), else a single field */
  const loans=Array.isArray(p.loans)?p.loans:[];
  let rawInt=loans.length?R(loans.reduce((a,l)=>a+N(l.int),0)*sh):R(N(p.interest)*sh);
  let interest=rawInt, cut=0;
  if(self){
    if(isNewR){cut=interest;interest=0;}              /* new regime: self-occ 24(b) disallowed */
    else if(interest>200000){cut=interest-200000;interest=200000;} /* self-occ ceiling 2L */
  }
  const arrears=R(N(p.arrears)*0.70*sh);              /* arrears/unrealised rent, less 30% */
  const totalDeduct=std+interest;
  const income=R(annualOwned-totalDeduct+arrears);
  return {type,self,sh,alv,rentNotReal,taxes,unrealAndTax,balanceALV,annualOwned,
    std,rawInt,interest,cut,arrears,totalDeduct,income};
}

/* ---- engine -------------------------------------------------------- */
function engHP(){
  S.C=S.C||{};
  const isNewR=_hpIsNew();
  const props=(S.hp&&S.hp.props)||[];
  const rows=props.map(p=>{const r=_hpProp(p);p._=r;return r;});
  const net=R(rows.reduce((a,r)=>a+r.income,0));       /* signed sum across properties */
  const capped=Math.max(-200000, net);                 /* ₹2,00,000 HP-loss set-off ceiling */
  const loss=capped<0?-capped:0;
  /* income = alias the ded income-cap / 80G adjusted-GTI base reads (S.C.hp.income);
     the new-regime floor on a loss is applied by the GTI consumer (tax), so the
     signed head income (capped) is published here as both total and income. */
  S.C.hp={rows, net, total:capped, income:capped, loss, isNew:isNewR, count:props.length};
  return S.C.hp;
}

/* ---- renderer ------------------------------------------------------ */
function secHP(){
  const H=S.C.hp||engHP();
  const isNewR=H.isNew;
  let h="";
  h+=note("A house you occupy yourself has a nil annual value, so only the interest on borrowed "+
    "capital counts. A let-out or deemed let-out property is taxed on its rent less the tax paid "+
    "to local authorities, a thirty per cent standard deduction and the interest.");

  (S.hp.props||[]).forEach((p,i)=>{
    const r=p._||_hpProp(p);
    const co=st0(p.co)==="Y"||st0(p.co)==="YES";
    const label=(_HP_TYPE.find(t=>t[0]===r.type)||["","—"])[1];
    const status=st0(p.addr1)?(label+" · "+(r.income<0?"loss "+RS(-r.income):RS(r.income))):"not filled";
    let b="";
    b+=sub("The property");
    b+=row("Type of house property",sel("hp.props."+i+".type",_HP_TYPE,{blank:false}),{req:1});
    b+=row("Owner of the property",sel("hp.props."+i+".owner",_HP_OWNER),{req:1});
    if(st0(p.owner)==="OT")
      b+=row("Describe the owner",inp("hp.props."+i+".ownerOther",{max:100}),{ind:1,req:1});
    b+=row("Flat, door or block number",inp("hp.props."+i+".addr1"),{req:1});
    b+=row("Town, city or district",inp("hp.props."+i+".city"),{req:1});
    b+=row("State",sel("hp.props."+i+".state",_HP_STATE));
    b+=row("PIN code",inp("hp.props."+i+".pin",{max:6}));
    b+=row("Is the property co-owned?",sel("hp.props."+i+".co",_HP_YN,{blank:false}),{req:1});
    if(co){
      b+=row("Share of the assessee, per cent",inp("hp.props."+i+".share",{n:1}),{req:1});
      b+=grid("hp.props."+i+".coowners",
        [{k:"name",h:"Name of the co-owner",t:"txt",w:"auto",req:1},
         {k:"pan",h:"PAN",t:"txt",w:"130px",max:10},
         {k:"aadhaar",h:"Aadhaar",t:"txt",w:"150px",max:12},
         {k:"share",h:"Share, per cent",t:"num",w:"120px",req:1}],
        p.coowners||[],{min:"720px",empty:"No co-owner listed.",add:"Add a co-owner"});
    }
    if(r.type!=="S"){
      b+=grid("hp.props."+i+".tenants",
        [{k:"name",h:"Name of the tenant",t:"txt",w:"auto",req:1},
         {k:"pan",h:"PAN of the tenant",t:"txt",w:"130px",max:10},
         {k:"tan",h:"PAN/TAN of the tenant",t:"txt",w:"140px",max:10}],
        p.tenants||[],{min:"680px",empty:"No tenant listed.",add:"Add a tenant"});
      b+=sub("Rent");
      b+=row("Annual lettable value, or rent received or receivable",
        inp("hp.props."+i+".rent",{n:1}),{req:1,ref:"1a"});
      b+=row("Rent that could not be realised",inp("hp.props."+i+".rentNotReal",{n:1}),{ref:"1b"});
      b+=row("Tax paid to local authorities",inp("hp.props."+i+".taxes",{n:1}),{ref:"1c"});
      b+=row("Balance annual value",cell(r.balanceALV),{cls:"tot",ref:"1d"});
      b+=row("Thirty per cent of the annual value",cell(r.std),{ref:"1e"});
    } else {
      b+=note("The annual value of a self-occupied house is nil, so only the interest counts.");
    }

    /* 24(b) — the loan table (Section24BDtls) */
    b+=sub("Interest on borrowed capital — section 24(b)");
    b+=grid("hp.props."+i+".loans",
      [{k:"type",h:"Loan from",t:"sel",w:"200px",req:1,opts:_HP_LOAN},
       {k:"lender",h:"Name of the bank or institution",t:"txt",w:"auto",req:1},
       {k:"acno",h:"Loan account / reference number",t:"txt",w:"180px"},
       {k:"dt",h:"Date the loan was taken",t:"date",w:"150px"},
       {k:"amt",h:"Total loan",t:"num",w:"130px"},
       {k:"os",h:"Outstanding on 31-03-2026",t:"num",w:"160px"},
       {k:"int",h:"Interest for the year",t:"num",w:"150px",req:1}],
      p.loans||[],{min:"1340px",empty:"No loan listed.",add:"Add a loan"});
    b+=row("Interest allowed under section 24(b)",cell(r.interest),
      {ref:"1f",hint:r.self?(isNewR?"closed under the new regime":"up to ₹2,00,000 for a self-occupied house")
                       :"no ceiling on a let-out property"});
    if(r.cut>0)b+=row(r.self&&isNewR?"Set aside under the new regime":"Above the ceiling",
      cell(-r.cut),{ind:1});
    b+=row("Arrears or unrealised rent received in the year",inp("hp.props."+i+".arrears",{n:1}),{ref:"1g"});
    if(r.arrears)b+=row("Taxable after thirty per cent",cell(r.arrears),{ind:1});
    b+=row("Income from house property "+(i+1),cell(r.income),{cls:"grand",ref:"1h"});
    h+=blk("p"+i,"Property "+(i+1)+(st0(p.addr1)?" — "+st0(p.addr1):""),status,b,"hp.props."+i);
  });

  if((S.hp.props||[]).length<2)
    h+='<button class="add" data-add="hp.props">Add a property</button>';

  h+=sub("Across all properties");
  h+=row("Net income from house property",cell(H.net),
    {ref:"B",hint:H.net<0?"a loss before the set-off ceiling":""});
  if(H.net<-200000)
    h+=row("Loss set off against other heads",cell(-200000),
      {ind:1,hint:"the set-off of a house-property loss is capped at ₹2,00,000"});
  h+=row("Income chargeable under the head house property",cell(H.total),{cls:"grand",ref:"B2"});
  if(isNewR && H.total<0)
    h+=note("Under the new regime a house-property loss cannot be set off against other income; it is "+
      "dropped when the gross total income is worked out.");
  return h;
}

/* ---- export -------------------------------------------------------- */
function expHP(j){
  const H=S.C.hp||engHP();
  const ID=j.ITR1_IncomeDeductions;
  const props=(S.hp&&S.hp.props)||[];
  if(props.length){
    ID.PropertyDetails=props.slice(0,2).map((p,i)=>{
      const r=p._||_hpProp(p);
      const co=st0(p.co)==="Y"||st0(p.co)==="YES";
      const addr={AddrDetail:(sv(p.addr1)||"NA").slice(0,200),
        CityOrTownOrDistrict:(sv(p.city)||"NA").slice(0,50),
        StateCode:_HP_STATECODES.indexOf(st0(p.state))>=0?st0(p.state):"19",
        CountryCode:"91"};
      if(/^[1-9]\d{5}$/.test(st0(p.pin)))addr.PinCode=parseInt(p.pin,10);
      const owner=_HP_OWNER.some(o=>o[0]===st0(p.owner))?st0(p.owner):"SE";
      const node={
        HPSNo:i+1,
        AddressDetailWithZipCode:addr,
        PropertyOwner:owner,
        PropCoOwnedFlg:co?"YES":"NO",
        AsseseeShareProperty:co?(N(p.share)||100):100,
        ifLetOut:r.type,
        Rentdetails:{
          AnnualLetableValue:n0(r.alv),
          RentNotRealized:n0(r.rentNotReal),
          LocalTaxes:n0(r.taxes),
          TotalUnrealizedAndTax:n0(r.unrealAndTax),
          BalanceALV:n0(r.balanceALV),
          AnnualOfPropOwned:n0(r.annualOwned),
          ThirtyPercentOfBalance:n0(r.std),
          IntOnBorwCap:n0(r.interest),
          TotalDeduct:n0(r.totalDeduct),
          ArrearsUnrealizedRentRcvd:n0(r.arrears),
          IncomeOfHP:sg(r.income)}
      };
      if(owner==="OT" && sv(p.ownerOther))node.PropertyOwnerOther=sv(p.ownerOther).slice(0,100);
      if(co){
        const cos=(p.coowners||[]).filter(c=>sv(c.name));
        if(cos.length)node.CoOwners=cos.map((c,ci)=>{
          const o={CoOwnersSNo:ci+1, NameCoOwner:(sv(c.name)||"NA").slice(0,75),
            PercentShareProperty:N(c.share)};
          if(sv(c.pan))o.PAN_CoOwner=st0(c.pan).toUpperCase().slice(0,10);
          if(/^[0-9]{12}$/.test(st0(c.aadhaar)))o.Aadhaar_CoOwner=st0(c.aadhaar);
          return o;});
      }
      if(r.type!=="S"){
        const tn=(p.tenants||[]).filter(t=>sv(t.name));
        if(tn.length)node.TenantDetails=tn.map((t,ti)=>{
          const o={TenantSNo:ti+1, NameofTenant:(sv(t.name)||"NA").slice(0,75)};
          if(sv(t.pan))o.PANofTenant=st0(t.pan).toUpperCase().slice(0,10);
          if(sv(t.tan))o.PANTANofTenant=st0(t.tan).toUpperCase().slice(0,10);
          return o;});
      }
      /* Section24B loan table. When 24(b) interest is fully disallowed
         (self-occupied under the new regime) the allowed interest r.interest
         is 0 and IntOnBorwCap is emitted as 0 above — so the 24B interest
         leaves must be 0 too, or rule A253 (self-occ 24(b) barred in the new
         regime) fires on TotalInterestUs24B. The old-regime self-occupied
         ceiling is applied in IntOnBorwCap only; the loan table keeps the
         actual interest. */
      const intDisallowed = r.self && _hpIsNew();  /* new regime, self-occupied */
      const loans=(p.loans||[]).filter(l=>sv(l.lender)||N(l.int)||N(l.amt));
      if(loans.length){
        node.Rentdetails.Section24B={
          Section24BDtls:loans.map(l=>{
            const o={LoanTknFrom:_HP_LOAN.some(x=>x[0]===st0(l.type))?st0(l.type):"B",
              BankOrInstnName:(sv(l.lender)||"NA").slice(0,75),
              InterestUs24B:intDisallowed?0:n0(l.int)};
            if(sv(l.acno))o.LoanAccNoOfBankOrInstnRefNo=st0(l.acno).slice(0,30);
            if(ISO(l.dt))o.DateofLoan=ISO(l.dt);
            if(N(l.amt))o.TotalLoanAmt=n0(l.amt);
            if(N(l.os))o.LoanOutstndngAmt=n0(l.os);
            return o;}),
          TotalInterestUs24B:intDisallowed?0:n0(r.rawInt)};
      }
      return node;
    });
  }
  /* head total — signed after the ₹2,00,000 cap; new regime drops a loss */
  const isNewR=_hpIsNew();
  put(ID,"TotalIncomeChargeableUnHP", sg(isNewR?Math.max(0,H.total):H.total));
}

/* ---- import (inverse) ---------------------------------------------- */
function impHP(I){
  const read=[]; const ID=I&&I.ITR1_IncomeDeductions;
  const pd=ID&&ID.PropertyDetails;
  if(Array.isArray(pd)&&pd.length){
    S.hp=S.hp||{};
    S.hp.props=pd.map(d=>{
      const a=(d.AddressDetailWithZipCode)||{};
      const rd=(d.Rentdetails)||{};
      const co=d.PropCoOwnedFlg==="YES";
      const p={
        type:["S","L","D"].indexOf(d.ifLetOut)>=0?d.ifLetOut:"S",
        owner:_HP_OWNER.some(o=>o[0]===d.PropertyOwner)?d.PropertyOwner:"SE",
        ownerOther:d.PropertyOwnerOther||"",
        addr1:a.AddrDetail||"", city:a.CityOrTownOrDistrict||"",
        state:a.StateCode||"", pin:a.PinCode!=null?String(a.PinCode):"",
        co:co?"Y":"N", share:d.AsseseeShareProperty!=null?d.AsseseeShareProperty:100,
        rent:rd.AnnualLetableValue, rentNotReal:rd.RentNotRealized, taxes:rd.LocalTaxes,
        arrears:rd.ArrearsUnrealizedRentRcvd,
        coowners:[], tenants:[], loans:[]};
      const cos=d.CoOwners||[];
      if(Array.isArray(cos))p.coowners=cos.map(c=>({name:c.NameCoOwner||"",pan:c.PAN_CoOwner||"",
        aadhaar:c.Aadhaar_CoOwner||"",share:c.PercentShareProperty}));
      const tn=d.TenantDetails||[];
      if(Array.isArray(tn))p.tenants=tn.map(t=>({name:t.NameofTenant||"",pan:t.PANofTenant||"",
        tan:t.PANTANofTenant||""}));
      const s24=rd.Section24B&&rd.Section24B.Section24BDtls;
      if(Array.isArray(s24))p.loans=s24.map(l=>({type:l.LoanTknFrom||"B",lender:l.BankOrInstnName||"",
        acno:l.LoanAccNoOfBankOrInstnRefNo||"",dt:dmy(l.DateofLoan)||"",amt:l.TotalLoanAmt,
        os:l.LoanOutstndngAmt,int:l.InterestUs24B}));
      /* self-occupied interest with no loan row -> keep as single field */
      if(!p.loans.length && rd.IntOnBorwCap!=null)p.interest=rd.IntOnBorwCap;
      return p;});
    read.push("house property");
  }
  return read;
}

/* ---- checks (section-local sanity, not the CBDT rule engine) ------- */
function chkHP(){
  const out=[]; const H=engHP();
  if((H.count||0)>2)
    out.push({lvl:"err",t:"House property",m:"ITR-1 allows at most two house properties.",sec:"hp"});
  (S.hp.props||[]).forEach((p,i)=>{
    const r=p._||_hpProp(p);
    const has=st0(p.addr1)||N(p.rent)||(p.loans||[]).some(l=>N(l.int))||N(p.interest);
    if(!has)return;
    if(!st0(p.addr1))
      out.push({lvl:"err",t:"Property "+(i+1),m:"The address of the property is required.",sec:"hp"});
    if(st0(p.co)==="Y" || st0(p.co)==="YES"){
      const sum=(p.coowners||[]).reduce((a,c)=>a+N(c.share),0)+(N(p.share)||0);
      if((p.coowners||[]).length && Math.abs(sum-100)>0.5)
        out.push({lvl:"warn",t:"Property "+(i+1)+" co-owners",m:"The assessee's share and the co-owners' shares should add up to 100 per cent.",sec:"hp"});
    }
    if(r.self && !H.isNew && r.rawInt>200000)
      out.push({lvl:"warn",t:"Property "+(i+1)+" interest",m:"Interest on a self-occupied house is capped at ₹2,00,000; the excess has been dropped.",sec:"hp"});
    if(r.self && H.isNew && r.rawInt>0)
      out.push({lvl:"warn",t:"Property "+(i+1)+" interest",m:"Interest on a self-occupied house is not deductible under the new regime.",sec:"hp"});
    if(r.type!=="S" && !(p.loans||[]).length && N(p.interest))
      out.push({lvl:"ok",t:"Property "+(i+1),m:"Interest is carried without a loan-table entry; add the loan details for completeness.",sec:"hp"});
  });
  if(H.net<-200000)
    out.push({lvl:"warn",t:"House-property loss",m:"The house-property loss is "+RS(-H.net)+
      "; only ₹2,00,000 can be set off against other heads this year.",sec:"hp"});
  if(!out.length && H.count)
    out.push({lvl:"ok",t:"House property",m:"Income chargeable under house property is "+
      (H.total<0?"a loss of "+RS(-H.total):RS(H.total))+".",sec:"hp"});
  return out;
}

/* ---- register (overrides the boot stub) ---------------------------- */
reg({id:"hp", t:"House property", ref:"Schedule HP", f:secHP, s:()=>{
    const H=S.C.hp||{}; if(!H.count)return "";
    return H.total<0?"loss "+RS(-H.total):RS(H.total);},
  eng:engHP, exp:expHP, imp:impHP, chk:chkHP, order:40, corder:40});

/* =====================================================================
   ITR-1 · Section "os" — Income from Other Sources  (screen order 50,
   compute order 44).  Owns, on export:

     ITR1_IncomeDeductions.OthersInc.OthersIncDtlsOthSrc[]
        · OthSrcNatureDesc  (enum OthersInc_OthSrcNatureDesc)
        · OthSrcOthNatOfInc (free text, 'any other')
        · OthSrcOthAmount   (int)
        · DividendInc.DateRange.{Upto15Of6, Upto15Of9, Up16Of9To15Of12,
          Up16Of12To15Of3, Up16Of3To31Of3}   (the DIV row's 234C break-up)
     ITR1_IncomeDeductions.IncomeOthSrc        (computed head total)
     ITR1_IncomeDeductions.DeductionUs57iia     (family-pension std ded 57(iia))
     LTCG112A.{TotSaleCnsdrn, TotCstAcqisn, LongCap112A}  (exempt LTCG u/s 112A,
        carried only up to ₹1,25,000; excess ⇒ the return must move to ITR-2)

   Publishes on S.C.os (book contract):
     income       — head "Income from other sources" (≥0)  → GTI
     dividendQtr  — the five 234C period figures (schema keys) → interest engine
     sav / dep    — savings- and deposit-interest, read by the ded section for
                    the 80TTA / 80TTB ceilings
     ltcg / ltcgOver / ltcgSale / ltcgCost / ltcgGain — the 112A disclosure
   Reads S.C.ret.regime (the family-pension 57(iia) ceiling is 25,000 new /
   15,000 old).  Every read is guarded; nothing throws.

   Model note: the dividend total is one OthersInc row (nature DIV); its
   quarter-by-quarter split (for 234C) is captured once, in S.osx, and attached
   to the first DIV row on export.  The ₹1.25L 112A gain sits in S.ltcg.
   ===================================================================== */

/* ---- state (seed only what is absent) ------------------------------ */
S.os   = Array.isArray(S.os) ? S.os : [];   /* OthersIncDtlsOthSrc[] rows {sec,amt,desc} */
S.osx  = S.osx  || {};                        /* dividend quarters q1..q5 (DIV DateRange) */
S.ltcg = S.ltcg || {};                        /* LTCG112A {sale, cost} */

/* ---- OthSrcNatureDesc — enums.json OthersInc_OthSrcNatureDesc (verbatim) --- */
const OS_NAT = [
  ["SAV","Interest from a savings account"],
  ["IFD","Interest from a deposit — bank, post office or co-operative society"],
  ["TAX","Interest on an income-tax refund"],
  ["OII","Any other interest income"],
  ["FAP","Family pension"],
  ["DIV","Dividend income"],
  ["10(11)(iP)","Provident-fund interest taxable — first proviso to 10(11)"],
  ["10(11)(iiP)","Provident-fund interest taxable — second proviso to 10(11)"],
  ["10(12)(iP)","Provident-fund interest taxable — first proviso to 10(12)"],
  ["10(12)(iiP)","Provident-fund interest taxable — second proviso to 10(12)"],
  ["OTH","Any other income"]];
const OS_NAT_SET = new Set(OS_NAT.map(x=>x[0]));

/* the five 234C dividend periods (enums.json DividendQuarters_DateRange) */
const OS_QTR = [
  ["q1","Upto15Of6","Up to 15 June 2025"],
  ["q2","Upto15Of9","16 June to 15 September 2025"],
  ["q3","Up16Of9To15Of12","16 September to 15 December 2025"],
  ["q4","Up16Of12To15Of3","16 December 2025 to 15 March 2026"],
  ["q5","Up16Of3To31Of3","16 March to 31 March 2026"]];

/* regime — read S.C.ret.regime, fall back to the shell's own flag */
function os_regOld(){
  const r = RG(S.C,"ret.regime",null);
  if(r==null||r==="") return (typeof isNew==="function") ? !isNew() : ((S.fs||{}).optout==="Yes");
  const s = String(r).toLowerCase();
  return s==="old"||s==="y"||s==="yes"||s==="2";
}

/* ---- engine -------------------------------------------------------- */
function engOs(){
  const C = S.C.os = { income:0 };
  const rows = Array.isArray(S.os) ? S.os : [];
  let gross=0, sav=0, dep=0, fap=0, div=0, hasDiv=false;
  rows.forEach(r=>{
    const a = N(r.amt), sec = st0(r.sec);
    if(!OS_NAT_SET.has(sec)) return;
    if(sec==="DIV") hasDiv=true;
    if(!a) return;
    gross += a;
    if(sec==="SAV") sav += a;
    else if(sec==="IFD") dep += a;
    else if(sec==="FAP") fap += a;
    else if(sec==="DIV") div += a;
  });

  /* 57(iia) — a third of the family pension, capped 25,000 new / 15,000 old */
  const d57 = Math.min(R(fap/3), os_regOld()?15000:25000);
  const income = Math.max(0, gross - d57);

  /* dividend quarterly break-up (for 234C) — schema-keyed */
  const qx = S.osx || {};
  const dividendQtr = {};
  OS_QTR.forEach(q=>{ dividendQtr[q[1]] = n0(qx[q[0]]); });
  const divQtrTotal = OS_QTR.reduce((a,q)=>a+dividendQtr[q[1]],0);

  /* LTCG u/s 112A — ITR-1 carries it only up to ₹1,25,000 */
  const L = S.ltcg || {};
  const sale = n0(L.sale), cost = n0(L.cost);
  const gain = Math.max(0, sale-cost);
  const over = gain > 125000;
  const carried = over ? 0 : gain;

  Object.assign(C,{
    gross:R(gross), sav:R(sav), dep:R(dep), fap:R(fap), div:R(div),
    d57:R(d57), income:R(income), hasDiv,
    dividendQtr, divQtrTotal:R(divQtrTotal),
    ltcgSale:R(sale), ltcgCost:R(cost), ltcgGain:R(gain), ltcg:R(carried), ltcgOver:over
  });
}

/* ---- renderer ------------------------------------------------------ */
function secOs(){
  const C = S.C.os || {};
  let h = "";

  h += note("Interest, dividend, family pension and any other income that is not salary or house property. "+
    "Interest from a savings account and from deposits is read across to the 80TTA / 80TTB ceilings.");

  h += grid("os",[
      {k:"sec",h:"Nature of income",t:"sel",w:"430px",req:1,opts:OS_NAT},
      {k:"desc",h:"Description (where 'any other' is chosen)",t:"txt",w:"auto",max:80},
      {k:"amt",h:"Amount",t:"num",w:"150px",req:1}],
    S.os,{min:"860px",empty:"No other income.",add:"Add a source",
      foot:[{l:1,v:"Total of the sources above",span:2},{v:C.gross}]});

  if(C.fap)
    h += row("Deduction under section 57(iia) on the family pension", cell(C.d57),
      {ref:"B3", hint:"a third of the family pension, capped at "+RS(os_regOld()?15000:25000)});

  /* dividend, quarter by quarter (only meaningful when a DIV row exists) */
  {
    let b = note("The quarter-by-quarter dividend is what interest under section 234C is worked out on. "+
      "It should add up to the dividend entered above.");
    OS_QTR.forEach(q=> b += row(q[2], inp("osx."+q[0],{n:1}), {ind:1}) );
    b += row("Dividend, quarterly total", cell(C.divQtrTotal), {cls:"tot"});
    h += fold("os_div","", "Dividend — quarterly break-up (section 234C)",
      (C.div?RS(C.div):""), b, {def:!!C.hasDiv});
  }

  /* LTCG u/s 112A (₹1.25L exempt disclosure) */
  {
    let b = note("Long-term capital gain on listed equity shares or equity mutual funds under section 112A. "+
      "ITR-1 can carry this only where the gain is <b>₹1,25,000 or less</b> (fully exempt). "+
      "A gain above ₹1,25,000 is taxable and must be filed on ITR-2.");
    b += row("Total sale consideration", inp("ltcg.sale",{n:1}), {ref:"D1"});
    b += row("Total cost of acquisition", inp("ltcg.cost",{n:1}), {ref:"D1"});
    b += row("Long-term capital gain u/s 112A", cell(C.ltcgGain), {cls:"tot"});
    b += row("Amount carried on this return (≤ ₹1,25,000, exempt)", cell(C.ltcg), {cls:"tot"});
    if(C.ltcgOver)
      b += note("This gain of "+RS(C.ltcgGain)+" is above ₹1,25,000 — ITR-1 cannot carry it. File ITR-2.","stop");
    h += fold("os_112a","D1","Exempt long-term capital gain u/s 112A",
      (C.ltcgGain?RS(C.ltcgGain):""), b, {def:!!(C.ltcgGain)});
  }

  h += row("Income from other sources", cell(C.income), {cls:"grand", ref:"B3"});
  return h;
}

/* ---- export -------------------------------------------------------- */
function expOs(j){
  const C = S.C.os || {};
  const rows = Array.isArray(S.os) ? S.os : [];

  const dq = C.dividendQtr || {};
  let divDone = false;
  const dtl = rows.filter(r=>OS_NAT_SET.has(st0(r.sec)) && N(r.amt)).map(r=>{
    const sec = st0(r.sec);
    const o = { OthSrcNatureDesc:sec, OthSrcOthAmount:n0(r.amt) };
    const d = sv(r.desc);
    if(d && (sec==="OTH"||sec==="OII")) o.OthSrcOthNatOfInc = d.slice(0,80);
    if(sec==="DIV" && !divDone){
      divDone = true;
      o.DividendInc = { DateRange:{
        Upto15Of6:       n0(dq.Upto15Of6),
        Upto15Of9:       n0(dq.Upto15Of9),
        Up16Of9To15Of12: n0(dq.Up16Of9To15Of12),
        Up16Of12To15Of3: n0(dq.Up16Of12To15Of3),
        Up16Of3To31Of3:  n0(dq.Up16Of3To31Of3) } };
    }
    return o;
  });
  if(dtl.length) put(j,"ITR1_IncomeDeductions.OthersInc",{OthersIncDtlsOthSrc:dtl});

  /* required head leaves — present even at 0 */
  put(j,"ITR1_IncomeDeductions.IncomeOthSrc",   n0(C.income));
  put(j,"ITR1_IncomeDeductions.DeductionUs57iia", n0(C.d57));

  /* LTCG112A — the VBA builder function is LTCG112A_New() (schema_tree.md line
     32444); the emitted JSON block key is LTCG112A. Always present (skeleton seeds
     it at 0); overwrite the three leaves. */
  put(j,"LTCG112A.TotSaleCnsdrn", n0(C.ltcgSale));
  put(j,"LTCG112A.TotCstAcqisn",  n0(C.ltcgCost));
  put(j,"LTCG112A.LongCap112A",   n0(C.ltcg));
}

/* ---- import (inverse) --------------------------------------------- */
function impOs(I){
  const read = [];
  const oi = RG(I,"ITR1_IncomeDeductions.OthersInc.OthersIncDtlsOthSrc",null);
  if(Array.isArray(oi) && oi.length){
    S.os = oi.map(r=>({
      sec: r.OthSrcNatureDesc||"",
      amt: r.OthSrcOthAmount!=null?String(r.OthSrcOthAmount):"",
      desc: r.OthSrcOthNatOfInc||"" }));
    const dv = oi.find(r=>r.OthSrcNatureDesc==="DIV" && r.DividendInc && r.DividendInc.DateRange);
    if(dv){
      const d = dv.DividendInc.DateRange;
      S.osx = {
        q1: d.Upto15Of6!=null?String(d.Upto15Of6):"",
        q2: d.Upto15Of9!=null?String(d.Upto15Of9):"",
        q3: d.Up16Of9To15Of12!=null?String(d.Up16Of9To15Of12):"",
        q4: d.Up16Of12To15Of3!=null?String(d.Up16Of12To15Of3):"",
        q5: d.Up16Of3To31Of3!=null?String(d.Up16Of3To31Of3):"" };
    }
    read.push("other sources");
  }
  const L = I && I.LTCG112A;
  if(L && (N(L.TotSaleCnsdrn)||N(L.TotCstAcqisn)||N(L.LongCap112A))){
    S.ltcg = { sale:String(L.TotSaleCnsdrn||""), cost:String(L.TotCstAcqisn||"") };
    read.push("LTCG u/s 112A");
  }
  return read;
}

/* ---- checks (section-local) --------------------------------------- */
function chkOs(){
  const out = []; engOs(); const C = S.C.os || {};
  (S.os||[]).forEach((r,i)=>{
    const started = st0(r.sec) || N(r.amt) || st0(r.desc);
    if(!started) return;
    if(!OS_NAT_SET.has(st0(r.sec)))
      out.push({lvl:"err",t:"Other source row "+(i+1),m:"Pick the nature of the income.",sec:"os"});
    if(!N(r.amt))
      out.push({lvl:"err",t:"Other source row "+(i+1),m:"Enter the amount of income.",sec:"os"});
    if(st0(r.sec)==="OTH" && !sv(r.desc))
      out.push({lvl:"warn",t:"Other source row "+(i+1),m:"Describe the 'any other' income.",sec:"os"});
  });
  if(C.hasDiv && (C.divQtrTotal||C.div) && C.divQtrTotal!==C.div)
    out.push({lvl:"warn",t:"Dividend quarters",m:"The quarter-by-quarter dividend ("+RS(C.divQtrTotal)+
      ") does not add up to the dividend entered ("+RS(C.div)+"); section 234C is worked out on the quarters.",sec:"os"});
  if(C.ltcgOver)
    out.push({lvl:"err",t:"LTCG u/s 112A",m:"The long-term capital gain u/s 112A of "+RS(C.ltcgGain)+
      " is above ₹1,25,000. ITR-1 cannot carry it — file ITR-2.",sec:"os"});
  if(!out.length && (C.income||C.ltcg))
    out.push({lvl:"ok",t:"Other sources",m:"Income from other sources "+RS(C.income)+
      (C.ltcg?"; exempt 112A gain "+RS(C.ltcg):"")+".",sec:"os"});
  return out;
}

/* ---- register ------------------------------------------------------ */
reg({id:"os", t:"Income from other sources", ref:"B3", f:secOs,
  s:()=>{const C=S.C.os||{}; const parts=[];
    if(C.income) parts.push(RS(C.income));
    if(C.ltcg)   parts.push("112A "+RS(C.ltcg));
    return parts.join(" · ");},
  eng:engOs, exp:expOs, imp:impOs, chk:chkOs, order:50, corder:44});

   ITR-1 · Section "paid" — Taxes paid, interest, fee and the balance
   Screen order 80 (sits before the tax screen); compute order (corder) 92
   — runs AFTER "tax" (corder 90) so S.C.tax.netTaxLiability / .ti / .gti
   are ready when the interest and fee are worked out here.

   OWNS / writes on export:
     · TaxPaid.TaxesPaid.{AdvanceTax, TDS, TCS, SelfAssessmentTax,
       TotalTaxesPaid}  and  TaxPaid.BalTaxPayable
     · Refund.RefundDue                       (Refund.BankAccountDtls is bank's)
     · TDSonSalaries      {TDSonSalary[], TotalTDSonSalaries}
     · TDSonOthThanSals   {TDSonOthThanSal[], TotalTDSonOthThanSals}
     · ScheduleTDS3Dtls   {TDS3Details[], TotalTDS3Details}   ← the FIX
     · ScheduleTCS        {TCS[], TotalSchTCS}
     · TaxPayments        {TaxPayment[], TotalTaxPayments}

   THE FIX (books/ITR-1/caps.md §10, and the prior-builder flag): the prior
   builder rolled the 26QB (194IA/IB/M) TDS credit into TaxPaid.TaxesPaid.TDS
   but never emitted the ScheduleTDS3Dtls block, so those rows were lost and
   the return failed its own TDS reconciliation (TaxPaid.TDS included the
   26QB credit while only the salary + other-than-salary schedule totals were
   summed). This section emits ScheduleTDS3Dtls with its rows AND its
   TotalTDS3Details, so TaxPaid.TDS = salary + other + 26QB reconciles.

   INTEREST / FEE — the caps.md §8-9 fixes over the prior builder:
     · 234B and 234C are waived for a SENIOR CITIZEN (actual age ≥ 60) in
       BOTH regimes (bacage>59, s.207(2)) — read S.C.who.senior.
     · 234A is waived for a senior only in the OLD regime (the utility forces
       age 55 under the new regime, so the age branch never fires there).
     · 234C is nil when the net tax (baseTax − TDS − TCS) is below ₹10,000,
       and its instalment base excludes the tax on dividend income that arose
       after each instalment date (read S.C.os.dividendQtr).
     · 234F is charged only when GTI exceeds the basic exemption for the
       regime / age — new > ₹4L, old > ₹2.5L, senior (SC 60-79) > ₹3L,
       super-senior (SSC ≥ 80) > ₹5L — and is ₹1,000 when total income is not
       more than ₹5L, otherwise ₹5,000.

   Reads on compute: S.C.tax.* (net, ti, gti), S.C.who.senior /
   .superSenior, S.C.ret.regime, S.C.os.dividendQtr, and this section's own
   TDS / TCS / challan grids. Publishes S.C.paid.* (also aliased to S.C.int
   for the footer band). The interest / fee figures are consumed by the tax
   section's export (single writer of ITR1_TaxComputation).
   ===================================================================== */

function _pdRegNew(){

/* who.senior is 60-79 ONLY; who.superSenior is >=80; who.seniorAny is >=60.
   The 234A/B/C exemption is for ANY age >= 60 (bacage>59), so it uses
   _pdAge60; the 234F GTI thresholds distinguish SC (60-79) from SSC (>=80). */
function _pdSenior(){const w=S.C.who||{};                 /* 60-79, for the 234F ₹3L threshold */
  if(typeof w.senior==="boolean")return w.senior;
  if(w.senior==="Y")return true;
  return false;}
function _pdSuper(){const w=S.C.who||{};                  /* >=80, for the 234F ₹5L threshold */
  if(typeof w.superSenior==="boolean")return w.superSenior;
  if(w.superSenior==="Y")return true;
  return (typeof superSr==="function")?superSr():false;}
function _pdAge60(){const w=S.C.who||{};                  /* >=60, for the 234A/B/C exemption */
  if(typeof w.seniorAny==="boolean")return w.seniorAny;
  if(w.seniorAny==="Y")return true;
  if(w.senior===true||w.senior==="Y"||w.superSenior===true||w.superSenior==="Y")return true;
  return (typeof senior==="function")?senior():false;}
/* the date the return was furnished — the ret section captures it; the
   input on the tax screen writes it to S.ret.filed; the return JSON does
   not carry it, so an import cannot restore it */
function _pdFiled(){const r=S.C.ret||{};
  return D(r.filedDate)||D(r.filed)||D((S.ret||{}).filed)||D((S.fs||{}).filed)||null;}
function _pdLate(filed){const r=S.C.ret||{};
  if(r.late===true)return true; if(r.late===false)return false;
  return !!(filed&&filed>DUE);}
function _pdRetSec(){const r=S.C.ret||{};
  return +(r.sec!=null?r.sec:((S.ret||{}).sec!=null?(S.ret||{}).sec:(S.fs||{}).sec))||0;}
/* dividend income by 234C quarter (from os), normalised to {q1..q5} */
function _pdDivQtr(){
  const o=(S.C.os||{}).dividendQtr; const out={q1:0,q2:0,q3:0,q4:0,q5:0};
  if(!o)return out;
  if(Array.isArray(o)){["q1","q2","q3","q4","q5"].forEach((k,i)=>out[k]=N(o[i]));return out;}
  out.q1=N(o.q1!=null?o.q1:o.Upto15Of6);
  out.q2=N(o.q2!=null?o.q2:o.Upto15Of9);
  out.q3=N(o.q3!=null?o.q3:o.Up16Of9To15Of12);
  out.q4=N(o.q4!=null?o.q4:o.Up16Of12To15Of3);
  out.q5=N(o.q5!=null?o.q5:o.Up16Of3To31Of3);
  return out;
}

/* ---- engine — taxes paid, then interest and fee with the caps fixes -- */
function engPaid(){
  const TX=S.C.tax||{};
  const net=N(TX.netTaxLiability!=null?TX.netTaxLiability:TX.net);
  const ti =N(TX.ti), gti=N(TX.gti);
  const s6079=_pdSenior(), ssr=_pdSuper(), age60=_pdAge60(), regNew=_pdRegNew();
  const filed=_pdFiled(), late=_pdLate(filed);

  /* a challan on/before 31 Mar 2026 is advance tax, after that self-assessment */
  const isSAT=c=>{const d=D(c.dt);return d?d>YREND:false;};
  const adv=(S.it||[]).filter(c=>!isSAT(c)).reduce((a,c)=>a+N(c.amt),0);
  const sat=(S.it||[]).filter(c=> isSAT(c)).reduce((a,c)=>a+N(c.amt),0);
  const t1=(S.tds1||[]).reduce((a,r)=>a+N(r.tds),0);        /* salary TDS      */
  const t2=(S.tds2||[]).reduce((a,r)=>a+N(r.claim),0);      /* other-than-sal  */
  const t3=(S.tds3||[]).reduce((a,r)=>a+N(r.claim),0);      /* 26QB rent/sale  */
  const tcs=(S.tcs||[]).reduce((a,r)=>a+N(r.claim),0);
  const tds=t1+t2+t3;                                        /* includes 26QB   */
  const paidTot=adv+tds+tcs+sat;

  /* 234A — 1%/month on the unpaid tax; senior waived in the OLD regime only */
  const unpaid=Math.max(0,net-paidTot);
  let i234a=0;
  if(late && !(age60 && !regNew))
    i234a=R(Math.floor(unpaid/100)*100*0.01*MPART(DUE,filed));

  /* the assessed tax that the advance-tax defaults run on */
  const assessed=Math.max(0,net-tds-tcs);

  /* 234B — 1%/month on the shortfall; senior waived in BOTH regimes; the
     ₹10,000 floor is the statutory assessed-tax threshold */
  let i234b=0;
  if(!age60 && assessed>=10000 && adv<assessed*0.9){
    const end=filed||new Date(2026,11,31);
    i234b=R(Math.floor((assessed-adv)/100)*100*0.01*MPART(new Date(2026,3,1),end));
  }

  /* 234C — instalment deferment; senior waived in BOTH regimes; nil below
     ₹10,000 net tax; the instalment base excludes the tax on dividend income
     received after each instalment date (caps.md §8) */
  let i234c=0, qs=[];
  if(!age60 && assessed>=10000){
    const dq=_pdDivQtr();
    const rate=ti>0?net/ti:0;                               /* effective rate on TI */
    const dAfter=[dq.q2+dq.q3+dq.q4+dq.q5, dq.q3+dq.q4+dq.q5, dq.q4+dq.q5, dq.q5];
    const upto=d=>(S.it||[]).filter(c=>!isSAT(c)&&D(c.dt)&&D(c.dt)<=d)
      .reduce((a,c)=>a+N(c.amt),0);
    const Q=[[new Date(2025,5,15),.15,3],[new Date(2025,8,15),.45,3],
             [new Date(2025,11,15),.75,3],[new Date(2026,2,15),1,1]];
    qs=Q.map((x,i)=>{const d=x[0],pc=x[1],mo=x[2];
      const base=Math.max(0,assessed-R(rate*dAfter[i]));
      const need=R(base*pc), got=upto(d), sh=Math.max(0,need-got);
      return {need,got,short:sh,mo,int:R(Math.floor(sh/100)*100*0.01*mo)};});
    i234c=qs.reduce((a,q)=>a+q.int,0);
  }

  /* 234F — late-filing fee, only above the regime/age basic-exemption GTI */
  let f234f=0;
  if(late){
    const gtiThresh=regNew?400000:(ssr?500000:s6079?300000:250000);
    if(gti>gtiThresh) f234f=ti<=500000?1000:5000;
  }
  /* 234-I — fee for furnishing a revised return (s.139(5)); niche, input-driven */
  const f234i=(late && _pdRetSec()===17)?n0((S.tax||{}).f234i):0;

  const totalIntrstPay=R(i234a+i234b+i234c+f234f+f234i);
  const aggregate=R(net+totalIntrstPay);
  const bal=aggregate-paidTot;

  const P={net:R(net),ti:R(ti),gti:R(gti),
    adv:R(adv),sat:R(sat),t1:R(t1),t2:R(t2),t3:R(t3),tds:R(tds),tcs:R(tcs),
    paid:R(paidTot),totalTaxesPaid:R(paidTot),
    i234a:i234a,i234b:i234b,i234c:i234c,f234f:f234f,f234i:R(f234i),qs,
    totalIntrstPay:totalIntrstPay,aggregate:aggregate,
    balance:R(Math.max(0,bal)),refund:R(Math.max(0,-bal)),
    late:late,senior:age60,senior6079:s6079,superSenior:ssr,regime:regNew?"New":"Old"};
  S.C.paid=P;
  S.C.int=P;                                                /* footer band contract */
}

/* ---- export --------------------------------------------------------- */
function expPaid(j){
  const I=S.C.paid||S.C.int||{};

  /* TaxPaid — the totals (all required, kept even at 0) */
  const TP=j.TaxPaid=j.TaxPaid||{}; TP.TaxesPaid=TP.TaxesPaid||{};
  TP.TaxesPaid.AdvanceTax      =n0(I.adv);
  TP.TaxesPaid.TDS             =n0(I.tds);          /* salary + other + 26QB */
  TP.TaxesPaid.TCS             =n0(I.tcs);
  TP.TaxesPaid.SelfAssessmentTax=n0(I.sat);
  TP.TaxesPaid.TotalTaxesPaid  =n0(I.paid);
  TP.BalTaxPayable             =n0(I.balance);

  /* Refund.RefundDue — the bank block (BankAccountDtls) is the bank section's */
  const RF=j.Refund=j.Refund||{};
  RF.RefundDue=n0(I.refund);

  /* TDSonSalaries[] — complete rows with a valid TAN */
  const s1=(S.tds1||[]).filter(r=>N(r.tds)&&TAN_RE.test(st0(r.tan).toUpperCase()));
  const TS=j.TDSonSalaries=j.TDSonSalaries||{};
  TS.TotalTDSonSalaries=n0(I.t1);
  if(s1.length)TS.TDSonSalary=s1.map(r=>({
    EmployerOrDeductorOrCollectDetl:{TAN:st0(r.tan).toUpperCase(),
      EmployerOrDeductorOrCollecterName:(sv(r.name)||"NA").slice(0,125)},
    IncChrgSal:n0(r.inc),TotalTDSSal:n0(r.tds)}));

  /* TDSonOthThanSals[] — 16A, with the TDSSection enum */
  const s2=(S.tds2||[]).filter(r=>N(r.claim)&&TAN_RE.test(st0(r.tan).toUpperCase()));
  const TO=j.TDSonOthThanSals=j.TDSonOthThanSals||{};
  TO.TotalTDSonOthThanSals=n0(I.t2);
  if(s2.length)TO.TDSonOthThanSal=s2.map(r=>({
    EmployerOrDeductorOrCollectDetl:{TAN:st0(r.tan).toUpperCase(),
      EmployerOrDeductorOrCollecterName:(sv(r.name)||"NA").slice(0,125)},
    TDSSection:PD_TDSSEC.some(x=>x[0]===r.sec)?r.sec:"94A",
    DeductedYr:PD_DEDYR.indexOf(String(r.yr))>=0?String(r.yr):"2025",
    AmtForTaxDeduct:n0(r.gross),
    TotTDSOnAmtPaid:n0(r.tds!=null&&r.tds!==""?r.tds:r.claim),
    ClaimOutOfTotTDSOnAmtPaid:n0(r.claim)}));

  /* ScheduleTDS3Dtls[] — 26QB rent/sale.  THE FIX: emitted with its rows
     AND its total, so the 26QB credit inside TaxPaid.TDS reconciles and the
     rows are no longer dropped. */
  const s3=(S.tds3||[]).filter(r=>N(r.claim)&&PAN_RE.test(st0(r.pan).toUpperCase()));
  const T3=j.ScheduleTDS3Dtls=j.ScheduleTDS3Dtls||{};
  T3.TotalTDS3Details=n0(I.t3);
  if(s3.length)T3.TDS3Details=s3.map(r=>{const o={
      PANofTenant:st0(r.pan).toUpperCase(),
      NameOfTenant:(sv(r.name)||"NA").slice(0,125),
      TDSSection:PD_TDS3SEC.some(x=>x[0]===r.sec)?r.sec:"4IA",
      DeductedYr:PD_DEDYR.indexOf(String(r.yr))>=0?String(r.yr):"2025",
      TDSDeducted:n0(r.tds!=null&&r.tds!==""?r.tds:r.claim),
      TDSClaimed:n0(r.claim)};
    if(AADH.test(st0(r.aadhaar)))o.AadhaarofTenant=st0(r.aadhaar);
    return o;});

  /* ScheduleTCS[] — 27D */
  const c1=(S.tcs||[]).filter(r=>N(r.claim)&&TAN_RE.test(st0(r.tan).toUpperCase()));
  const TC=j.ScheduleTCS=j.ScheduleTCS||{};
  TC.TotalSchTCS=n0(I.tcs);
  if(c1.length)TC.TCS=c1.map(r=>{const o={
      EmployerOrDeductorOrCollectDetl:{TAN:st0(r.tan).toUpperCase(),
        EmployerOrDeductorOrCollecterName:(sv(r.name)||"NA").slice(0,125)},
      AmtTaxCollected:n0(r.coll),
      CollectedYr:PD_DEDYR.indexOf(String(r.yr))>=0?String(r.yr):"2025",
      AmtTCSClaimedThisYear:n0(r.claim)};
    if(N(r.bf))o.TotalTCS=n0(r.bf);
    return o;});

  /* TaxPayments[] — advance / self-assessment challans */
  const ch=(S.it||[]).filter(c=>N(c.amt)&&BSR.test(st0(c.bsr).toUpperCase())&&ISO(c.dt)
    &&/^\d{1,5}$/.test(st0(c.sn)));
  const PY=j.TaxPayments=j.TaxPayments||{};
  PY.TotalTaxPayments=n0(N(I.adv)+N(I.sat));
  if(ch.length)PY.TaxPayment=ch.map(c=>({BSRCode:st0(c.bsr).toUpperCase(),
    DateDep:ISO(c.dt),SrlNoOfChaln:parseInt(c.sn,10),Amt:n0(c.amt)}));
}

/* ---- import (inverse) ---------------------------------------------- */
function impPaid(I){
  const read=[]; const g=(o,p)=>p.split(".").reduce((t,k)=>t==null?undefined:t[k],o);
  const dmyf=iso=>{const s=String(iso||"");
    return /^\d{4}-\d{2}-\d{2}/.test(s)?s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4):"";};

  const s1=g(I,"TDSonSalaries.TDSonSalary");
  if(Array.isArray(s1)&&s1.length){S.tds1=s1.map(r=>{const d=r.EmployerOrDeductorOrCollectDetl||{};
    return {tan:st0(d.TAN).toUpperCase(),name:d.EmployerOrDeductorOrCollecterName||"",
      inc:r.IncChrgSal||"",tds:r.TotalTDSSal||""};});read.push("salary TDS");}

  const s2=g(I,"TDSonOthThanSals.TDSonOthThanSal");
  if(Array.isArray(s2)&&s2.length){S.tds2=s2.map(r=>{const d=r.EmployerOrDeductorOrCollectDetl||{};
    return {tan:st0(d.TAN).toUpperCase(),name:d.EmployerOrDeductorOrCollecterName||"",
      sec:r.TDSSection||"94A",yr:String(r.DeductedYr||"2025"),gross:r.AmtForTaxDeduct||"",
      tds:r.TotTDSOnAmtPaid||"",claim:r.ClaimOutOfTotTDSOnAmtPaid||r.TotTDSOnAmtPaid||""};});
    read.push("other-than-salary TDS");}

  const s3=g(I,"ScheduleTDS3Dtls.TDS3Details");
  if(Array.isArray(s3)&&s3.length){S.tds3=s3.map(r=>({
    pan:st0(r.PANofTenant).toUpperCase(),aadhaar:r.AadhaarofTenant||"",
    name:r.NameOfTenant||"",sec:r.TDSSection||"4IA",yr:String(r.DeductedYr||"2025"),
    tds:r.TDSDeducted||"",claim:r.TDSClaimed||r.TDSDeducted||""}));
    read.push("26QB TDS");}

  const c1=g(I,"ScheduleTCS.TCS");
  if(Array.isArray(c1)&&c1.length){S.tcs=c1.map(r=>{const d=r.EmployerOrDeductorOrCollectDetl||{};
    return {tan:st0(d.TAN).toUpperCase(),name:d.EmployerOrDeductorOrCollecterName||"",
      yr:String(r.CollectedYr||"2025"),bf:r.TotalTCS||"",coll:r.AmtTaxCollected||"",
      claim:r.AmtTCSClaimedThisYear||""};});read.push("TCS");}

  const py=g(I,"TaxPayments.TaxPayment");
  if(Array.isArray(py)&&py.length){S.it=py.map(c=>({bsr:c.BSRCode||"",
    dt:dmyf(c.DateDep),sn:String(c.SrlNoOfChaln||""),amt:c.Amt||""}));read.push("challans");}
  return read;
}

/* ---- section-local sanity (not the CBDT rule engine) --------------- */
function chkPaid(){
  const out=[]; const I=S.C.paid||S.C.int||{};
  (S.tds1||[]).forEach((r,n)=>{if(N(r.tds)&&!TAN_RE.test(st0(r.tan).toUpperCase()))
    out.push({lvl:"err",t:"Salary TDS row "+(n+1),m:"The TAN is four letters, five digits and a letter.",sec:"paid"});});
  (S.tds2||[]).forEach((r,n)=>{if(!N(r.claim))return;
    if(!TAN_RE.test(st0(r.tan).toUpperCase()))
      out.push({lvl:"err",t:"TDS row "+(n+1),m:"The TAN is four letters, five digits and a letter.",sec:"paid"});
    if(!PD_TDSSEC.some(x=>x[0]===r.sec))
      out.push({lvl:"err",t:"TDS row "+(n+1),m:"Pick the section under which the tax was deducted.",sec:"paid"});});
  (S.tds3||[]).forEach((r,n)=>{if(N(r.claim)&&!PAN_RE.test(st0(r.pan).toUpperCase()))
    out.push({lvl:"err",t:"26QB row "+(n+1),m:"A valid ten-character PAN of the buyer or tenant is required.",sec:"paid"});});
  (S.tcs||[]).forEach((r,n)=>{if(N(r.claim)&&!TAN_RE.test(st0(r.tan).toUpperCase()))
    out.push({lvl:"err",t:"TCS row "+(n+1),m:"The TAN of the collector is four letters, five digits and a letter.",sec:"paid"});});
  (S.it||[]).forEach((c,n)=>{if(!N(c.amt))return;
    if(!BSR.test(st0(c.bsr).toUpperCase()))
      out.push({lvl:"err",t:"Challan "+(n+1),m:"The BSR code is seven characters.",sec:"paid"});
    if(!ISO(c.dt))
      out.push({lvl:"err",t:"Challan "+(n+1),m:"Give the date of deposit as "+DF+".",sec:"paid"});
    if(!/^\d{1,5}$/.test(st0(c.sn)))
      out.push({lvl:"err",t:"Challan "+(n+1),m:"The challan serial number is up to five digits.",sec:"paid"});});
  if((S.tds3||[]).some(r=>N(r.claim)))
    out.push({lvl:"ok",t:"26QB credit",m:"The 194IA/194IB/194M credit is carried in its own ScheduleTDS3Dtls and is part of the total tax deducted.",sec:"paid"});
  if(I.late){
    if(I.i234a||I.f234f)
      out.push({lvl:"warn",t:"Return filed late",m:"Interest under 234A of "+RS(I.i234a)+" and a fee under 234F of "+RS(I.f234f)+" follow.",sec:"paid"});
    else if(I.senior)
      out.push({lvl:"ok",t:"Senior citizen",m:"The senior-citizen exemptions from 234B/234C (and 234A in the old regime) apply.",sec:"paid"});
  }
  if(I.i234b>0)
    out.push({lvl:"warn",t:"Advance tax short",m:"Advance tax is below ninety per cent of the assessed tax, so 234B of "+RS(I.i234b)+" runs.",sec:"paid"});
  if(I.i234c>0)
    out.push({lvl:"warn",t:"Instalments missed",m:"Interest under 234C of "+RS(I.i234c)+" arises on the quarterly shortfall.",sec:"paid"});
  if(!out.length)
    out.push({lvl:"ok",t:"Taxes paid",m:"Total taxes paid "+RS(I.paid)+"; "+
      (I.refund?("refund "+RS(I.refund)):("balance "+RS(I.balance)))+".",sec:"paid"});
  return out;
}

/* =====================================================================
   ITR-1 · Section "ret" — Return and regime (filing status)
   Books: books/ITR-1/schema_tree.md §4 FilingStatus · §5 PartA_139_8A ·
   §6 PartB-ATI · sections.md S2 · caps.md §1 (regime bar) · enums.json
   (ReturnFileSec, OptOutNewTaxRegime, AsseseeRepFlg, SeventhProvisio_flags,
   clauseiv7provisio139iNature, ReasonsForUpdatingIncome_139_8A,
   UpdatedReturnDuringPeriod_139_8A, PreviouslyFiledForThisAY_139_8A).
   Compute order 12 (corder 12) — runs right after "who": it publishes the
   TAX-REGIME master gate S.C.ret.regime that every other section's engine
   reads. Screen order 20.

   Owns / writes on export (home EVERY leaf):
     §4 FilingStatus:
       · ReturnFileSec (valid for ITR-1: 11/12/17/20/21 ONLY; 13/14/15/16/18
         are blocked with an error)
       · OptOutNewTaxRegime (N = new/default, Y = old) — the regime toggle
       · SeventhProvisio139 + DepAmtAggAmtExcd1CrPrYrFlg / AmtSeventhProvisio139i
         + IncrExpAggAmt2LkTrvFrgnCntryFlg / AmtSeventhProvisio139ii
         + IncrExpAggAmt1LkElctrctyPrYrFlg / AmtSeventhProvisio139iii
       · NoticeNo / NoticeDateUnderSec (13/14/15/16/18/20)
       · ReceiptNo / OrigRetFiledDate (17/18/21)
       · ItrFilingDueDate (auto 2026-07-31)
       · clauseiv7provisio139i + clauseiv7provisio139iDtls[]{Nature, Amount}
       · AsseseeRepFlg + AssesseeRep{RepName, RepEmailID,
         CountryCodeRepMobileNo, RepMobileNo}
     §5 PartA_139_8A + §6 PartB-ATI (ONLY when ReturnFileSec == 21, 139(8A)):
       the whole updated-return subtree — reasons, period, unabsorbed-
       depreciation years, head-wise income, the 140B additional-tax
       computation, Schedule IT-1 / IT-2 challans and relief u/s 89.
       Emits PartA_139_8A.AssessmentYear "2026" (utility hard-codes 2025 — bug).

   PUBLISHES (S.C.ret.*):
     · regime   "new" | "old"     — the master gate (OptOutNewTaxRegime N/Y)
     · optout   "N" | "Y"         — the raw flag
     · is8A     bool              — ReturnFileSec == 21 (updated return)
     · sec      int               — the chosen ReturnFileSec
     · secValid bool              — whether the section is legal for ITR-1
     · seventhProviso bool        — SeventhProvisio139 == Y (forces 234F)
     · dueDate  "2026-07-31"      — ItrFilingDueDate (234A / 234F reference)
     · filedDate (DD/MM/YYYY)     — actual filing date (not a schema leaf;
       published for the tax section's 234A month-count and 234F late test)
   ===================================================================== */

/* ---- ReturnFileSec — enums.json ReturnFileSec [code,label,valid] ------- */
const RET1_RETSEC=[
  [11,"139(1) - On or before due date",true],
  [12,"139(4) - Belated",true],
  [13,"142(1)",false],
  [14,"148",false],
  [15,"153A",false],
  [16,"153C",false],
  [17,"139(5) - Revised",true],
  [18,"139(9) - Defective",false],
  [20,"119(2)(b) - After condonation of delay",true],
  [21,"139(8A) - Updated return",true]];
const RET1_VALIDSEC=[11,12,17,20,21];
const RET1_BLOCKSEC=[13,14,15,16,18];
/* codes that open the NoticeNo / NoticeDateUnderSec pair (schema §4 cond) */
const RET1_SEC_NOTICE=[13,14,15,16,18,20];
/* codes that open the ReceiptNo / OrigRetFiledDate pair (schema §4 cond) */

/* ---- Y/N flag list (SeventhProvisio_flags, AsseseeRepFlg, generic) ---- */
const RET1_YN=[["Y","Yes"],["N","No"]];
/* OptOutNewTaxRegime — enums.json OptOutNewTaxRegime (N=new default, Y=old) */
const RET1_OPTOUT=[["N","No — stay in the new tax regime u/s 115BAC(1A) (default)"],
                   ["Y","Yes — opt OUT of the new regime (the old regime)"]];
/* clauseiv7provisio139iNature — enums.json (1 = deposit>1cr, 2 = expenditure>2L) */
const RET1_CLAUSE_NATURE=[
  ["1","Deposit exceeding ₹1 crore in one or more current accounts"],
  ["2","Expenditure exceeding ₹2 lakh on foreign travel / other specified expenditure"]];
/* ReasonsForUpdatingIncome_139_8A — enums.json VERBATIM */
const RET1_REASONS=[
  ["1","Return previously not filed"],["2","Income not reported correctly"],
  ["3","Wrong heads of income chosen"],["4","Reduction of carried forward loss"],
  ["5","Reduction of unabsorbed depreciation"],["6","Reduction of tax credit u/s 115JB/115JC"],
  ["7","Wrong rate of tax"],["OTH","Others"]];
/* UpdatedReturnDuringPeriod_139_8A — enums.json VERBATIM (drives the 140B rate) */
const RET1_PERIOD=[
  ["1","Up to 12 months from end of Relevant AY"],
  ["2","Between 12 to 24 months from end of Relevant AY"],
  ["3","Between 24 to 36 months from end of Relevant AY"],
  ["4","Between 36 to 48 months from end of Relevant AY"]];
/* additional-tax rate u/s 140B by the period above (25 / 50 / 60 / 70 %) */
const RET1_140B_RATE={"1":0.25,"2":0.50,"3":0.60,"4":0.70};
/* PreviouslyFiledForThisAY_139_8A — enums.json (1 = Yes, 2 = No) */
const RET1_PREVFILED8A=[["1","Yes"],["2","No"]];
/* PreviouslyFiledForThisAY / LaidOutIn_139_8A / UnabsorbedDepreciation /

const RET1_DUEDATE="2026-07-31";             /* ItrFilingDueDate (auto) */

S.ret = S.ret || {};

  d("atiSal",""); d("atiHP",""); d("atiOS","");   /* HeadOfInc */

  d("amtPayable","");                        /* AmtPayable (Part B-TTI of updated ITR) */
  d("amtRefundable","");                     /* AmtRefundable */
  d("lastAmtPayable","");                    /* LastAmtPayable (per last valid return) */
  d("refund","");                            /* Refund (per last valid return) */
  d("feeIncUS234F","");                      /* FeeIncUS234F */

/* =====================================================================
   ENGINE — engRet(): publishes the regime master-gate and the 139(8A)
   flag, and (when it is an updated return) the whole PartB-ATI 140B
   computation into S.C.ret so export and screen share one source of truth.
   ===================================================================== */
function engRet(){
  const R0=S.ret||{};
  const optout=(st0(R0.optout)==="Y")?"Y":"N";
  const sec=R(R0.sec)||11;
  const C=S.C.ret={ income:0 };
  C.optout   = optout;
  C.regime   = optout==="Y"?"old":"new";     /* the master gate */
  C.sec      = sec;
  C.secValid = RET1_VALIDSEC.indexOf(sec)>=0;
  C.is8A     = sec===21;                       /* updated return */
  C.seventhProviso = st0(R0.provFlag)==="Y";   /* forces 234F regardless of GTI */
  C.dueDate  = RET1_DUEDATE;
  C.filedDate= st0(R0.filed);
  C.repFlg   = st0(R0.repFlg)==="Y";

  /* ---- PartB-ATI · 140B additional-tax computation (updated return) ---- */
  const A={};
  A.salaries = R(R0.atiSal);
  A.hp       = R(R0.atiHP);
  A.os       = R(R0.atiOS);
  A.total    = A.salaries + A.hp + A.os;                 /* HeadOfInc.Total */
  A.latest   = R(R0.latestTotInc);                        /* last valid return TI */
  A.updated  = A.latest + A.total;                        /* UpdatedTotInc */
  A.amtPayable   = R(R0.amtPayable);
  A.amtRefundable= R(R0.amtRefundable);
  A.lastPayable  = R(R0.lastAmtPayable);
  A.refund       = R(R0.refund);
  A.fee234F      = R(R0.feeIncUS234F);
  A.regTax       = R(R0.regAssTax);
  A.relief89     = R(R0.releifUS89);
  /* aggregate liability on additional income (both variants homed):
     - no earlier refund : AmtPayable - LastAmtPayable
     - earlier refund     : AmtPayable + Refund (the refund is added back) */
  A.aggNoRefund = Math.max(0, A.amtPayable - A.lastPayable);
  A.aggRefund   = Math.max(0, A.amtPayable + A.refund);
  A.useRefund   = A.refund>0;
  const AGG     = A.useRefund ? A.aggRefund : A.aggNoRefund;
  const rate    = RET1_140B_RATE[st0(R0.period)]||0.25;
  A.rate        = rate;
  A.addtnlIncTax= R(AGG*rate);                            /* AddtnlIncTax */
  A.netPayable  = AGG + A.addtnlIncTax;                   /* NetPayable */
  A.it1Total    = (R0.it1||[]).reduce((s,r)=>s+R(r.amt),0);
  A.it2Total    = (R0.it2||[]).reduce((s,r)=>s+R(r.amt),0);
  A.tax140B     = A.it1Total + A.it2Total;                /* TaxUS140B (challans) */
  A.taxDue      = Math.max(0, A.netPayable - A.tax140B);  /* TaxDue10_11 */
  A.totRefund   = A.amtRefundable;                        /* TotRefund */
  C.ati=A;
}

/* =====================================================================
   RENDERER — secRet(): the return / regime page, then (only when the
   updated-return section 21 is chosen) the whole 139(8A) sub-form.
   ===================================================================== */
function secRet(){
  const R0=S.ret, C=S.C.ret||{};
  const sec=R(R0.sec)||11;
  const valid=RET1_VALIDSEC.indexOf(sec)>=0;
  let h="";

  /* ===================== The tax regime ===================== */
  h+=sub("Tax regime");
  h+=row("Do you opt OUT of the new tax regime under section 115BAC(6)?",
    sel("ret.optout",RET1_OPTOUT,{blank:false}),
    {req:1,ref:"FilingStatus.OptOutNewTaxRegime",
     hint:"the default is No — the new regime u/s 115BAC(1A)"});
  if(st0(R0.optout)==="Y")
    h+=note("<b>Old regime.</b> The Chapter VI-A detail schedules and the HRA "+
      "10(13A) exemption become available, the standard deduction u/s 16(ia) is "+
      "₹50,000, and the senior-citizen basic exemption (₹3,00,000 / "+
      "₹5,00,000) applies.");
  else
    h+=note("<b>New regime u/s 115BAC(1A)</b> (default). Only 80CCD(2) and "+
      "80CCH(2) survive of Chapter VI-A; 16(ii) and self-occupied 24(b) are "+
      "closed; the standard deduction u/s 16(ia) is ₹75,000; the 87A rebate "+
      "runs to a total income of ₹12,00,000.");
  h+=note("For a return on ITR-1 the option is exercised in the return itself — "+
    "Form 10-IEA is needed only where there is business or professional income.");

  /* ===================== The filing section ===================== */
  h+=sub("Under which section is the return filed?");
  h+=row("Return filed under section",
    sel("ret.sec",RET1_RETSEC.map(r=>[r[0],r[1]+(r[2]?"":" — NOT valid for ITR-1")]),{blank:false}),
    {req:1,ref:"FilingStatus.ReturnFileSec"});
  if(!valid){
    h+=note("<b>Section "+(RET1_RETSEC.find(r=>r[0]===sec)||[,""])[1]+" is not a valid "+
      "filing section for ITR-1.</b> ITR-1 may be filed only u/s <b>139(1) [11]</b>, "+
      "<b>139(4) belated [12]</b>, <b>139(5) revised [17]</b>, <b>119(2)(b) [20]</b> "+
      "or <b>139(8A) updated [21]</b>. Sections 142(1), 148, 153A, 153C and 139(9) "+
      "[codes 13/14/15/16/18] are blocked — choose another form. Correct the "+
      "section before the return can be built.","stop");
    return h;                                 /* nothing further until a valid section */
  }
  h+=row("Due date of filing",cell2(RET1_DUEDATE),{ref:"FilingStatus.ItrFilingDueDate"});
  h+=row("Actual date of filing this return",dte("ret.filed"),
    {hint:"the portal's own date on submission; drives 234A and the 234F late-fee test"});

  /* conditional: ReceiptNo / OrigRetFiledDate (17 / 21) */
  if(RET1_SEC_RECEIPT.indexOf(sec)>=0){
    h+=row("Receipt number of the original return",inp("ret.receiptNo",{max:23}),
      {req:1,ref:"FilingStatus.ReceiptNo"});
    h+=row("Date of filing of the original return",dte("ret.origDate"),
      {req:1,ref:"FilingStatus.OrigRetFiledDate"});
  }
  /* conditional: NoticeNo / NoticeDateUnderSec (20 among the valid set) */
  if(RET1_SEC_NOTICE.indexOf(sec)>=0){
    h+=row("Unique number / DIN of the notice or order",inp("ret.noticeNo",{max:30}),
      {req:1,ref:"FilingStatus.NoticeNo",hint:"the order u/s 119(2)(b) condoning the delay"});
    h+=row("Date of such notice or order",dte("ret.noticeDate"),
      {req:1,ref:"FilingStatus.NoticeDateUnderSec"});
  }

  /* ===================== Seventh proviso to 139(1) ===================== */
  h+=sub("Seventh proviso to section 139(1)");
  h+=row("Filing though not otherwise required, under the seventh proviso to 139(1)?",
    sel("ret.provFlag",RET1_YN,{blank:false}),{req:1,ref:"FilingStatus.SeventhProvisio139",
    hint:"Yes makes the 234F late-fee apply regardless of income"});
  if(st0(R0.provFlag)==="Y"){
    h+=row("(i) Deposited over ₹1 crore in one or more current accounts?",
      sel("ret.depFlag",RET1_YN,{blank:false}),
      {ref:"FilingStatus.DepAmtAggAmtExcd1CrPrYrFlg",v2:inp("ret.depAmt",{n:1,ph:"Amount"})});
    h+=row("(ii) Spent over ₹2 lakh on foreign travel (self or another)?",
      sel("ret.trvFlag",RET1_YN,{blank:false}),
      {ref:"FilingStatus.IncrExpAggAmt2LkTrvFrgnCntryFlg",v2:inp("ret.trvAmt",{n:1,ph:"Amount"})});
    h+=row("(iii) Spent over ₹1 lakh on electricity in the year?",
      sel("ret.eleFlag",RET1_YN,{blank:false}),
      {ref:"FilingStatus.IncrExpAggAmt1LkElctrctyPrYrFlg",v2:inp("ret.eleAmt",{n:1,ph:"Amount"})});
  }

  /* ===================== Clause (iv) of the seventh proviso ===================== */
  h+=sub("Clause (iv) of the seventh proviso to 139(1)");
  h+=row("Any of the clause-(iv) conditions applicable?",
    sel("ret.clauseFlag",RET1_YN,{blank:false}),{req:1,ref:"FilingStatus.clauseiv7provisio139i"});
  if(st0(R0.clauseFlag)==="Y"){
    h+=row("(1) Deposit exceeding ₹1 crore in one or more current accounts",
      sel("ret.cl1Flag",RET1_YN,{blank:false}),
      {ref:"clauseiv7provisio139iDtls[] nature 1",v2:inp("ret.cl1Amt",{n:1,ph:"Amount"})});
    h+=row("(2) Expenditure exceeding ₹2 lakh on foreign travel / other specified expenditure",
      sel("ret.cl2Flag",RET1_YN,{blank:false}),
      {ref:"clauseiv7provisio139iDtls[] nature 2",v2:inp("ret.cl2Amt",{n:1,ph:"Amount"})});
  }

  /* ===================== Representative assessee ===================== */
  h+=sub("Representative assessee");
  h+=row("Is this return filed by a representative assessee?",
    sel("ret.repFlg",RET1_YN,{blank:false}),{req:1,ref:"FilingStatus.AsseseeRepFlg"});
  if(st0(R0.repFlg)==="Y"){
    h+=row("Name of the representative assessee",inp("ret.repName",{max:75}),
      {req:1,ref:"AssesseeRep.RepName"});
    h+=row("Email-id of the representative",inp("ret.repEmail",{max:125}),
      {req:1,ref:"AssesseeRep.RepEmailID"});
    h+=row("Contact number of the representative",
      inp("ret.repMobileCc",{n:1,max:3,ph:"Code"})+" "+inp("ret.repMobile",{n:1,max:10,ph:"Mobile"}),
      {req:1,ref:"AssesseeRep.CountryCodeRepMobileNo / RepMobileNo"});
  }

  /* ===================== Updated return u/s 139(8A) ===================== */
  if(sec===21){
    const A=(S.C.ret||{}).ati||{};
    h+=sub("Updated return u/s 139(8A) — Part A 139(8A)");
    h+=note("An updated return u/s 139(8A) unlocks Part A 139(8A) and Part B-ATI. "+
      "It carries additional income and the additional income-tax u/s 140B. "+
      "The assessment year is 2026-27.");
    h+=row("Aadhaar number",inp("ret.uAadhaar",{n:1,max:12}),{ref:"PartA_139_8A.AadhaarCardNo"});
    h+=row("Name (as in the updated return)",inp("ret.uName",{max:75}),{ref:"PartA_139_8A.Name"});
    h+=row("PAN",inp("ret.uPan",{max:10}),{ref:"PartA_139_8A.PAN"});
    h+=row("Assessment year",cell2("2026 (AY 2026-27)"),{ref:"PartA_139_8A.AssessmentYear"});
    h+=row("Return previously filed for this assessment year?",
      sel("ret.prevFiled",RET1_YESNO,{blank:false}),{ref:"PartA_139_8A.PreviouslyFiledForThisAY"});
    h+=row("Whether a return was previously filed for this AY (139(8A))?",
      sel("ret.prevFiled8A",RET1_PREVFILED8A,{blank:false}),
      {ref:"PartA_139_8A.PreviouslyFiledForThisAY_139_8A"});
    if(st0(R0.prevFiled8A)==="1"){
      h+=row("If yes, ITR form of the original return",inp("ret.appItrForm",{max:10}),
        {ref:"Applicable_139_8A.ITRForm"});
      h+=row("Acknowledgement number of the original return",inp("ret.appAckNo",{max:23}),
        {ref:"Applicable_139_8A.AcknowledgementNo"});
      h+=row("Date of filing of the original return",dte("ret.appOrigDate"),
        {ref:"Applicable_139_8A.OrigRetFiledDate"});
    }
    h+=row("Are you eligible to file an updated return as per the conditions laid out in 139(8A)?",
      sel("ret.laidOut",RET1_YESNO,{blank:false}),{ref:"PartA_139_8A.LaidOutIn_139_8A"});
    h+=row("ITR form updating the income",cell2("ITR1"),{ref:"PartA_139_8A.ITRFormUpdatingInc"});

    h+=sub("Reason(s) for updating the income");
    h+=grid("ret.reasons",[
      {h:"#",k:"_i",t:"calc",f:(r,i)=>i+1,w:"36px"},
      {h:"Reason for updating (139(8A))",k:"reason",t:"sel",opts:RET1_REASONS,req:1,w:"420px"}
    ],R0.reasons,{min:"480px",add:"Add a reason",empty:"No reason for updating entered."});

    h+=row("Updated return is being filed during the period",
      sel("ret.period",RET1_PERIOD,{blank:false}),
      {req:1,ref:"PartA_139_8A.UpdatedReturnDuringPeriod",
       hint:"drives the 140B additional-tax rate: 25% / 50% / 60% / 70%"});

    h+=sub("Reduction in carried-forward loss / unabsorbed depreciation");
    h+=row("Does the updated return reduce carried-forward unabsorbed depreciation?",
      sel("ret.unabDep",RET1_YESNO,{blank:false}),
      {ref:"RetrntoRedCarriedFL.UnabsorbedDepreciation"});
    if(st0(R0.unabDep)==="Y"){
      h+=grid("ret.udYears",[
        {h:"#",k:"_i",t:"calc",f:(r,i)=>i+1,w:"36px"},
        {h:"Assessment year",k:"year",t:"num",req:1,w:"140px"},
        {h:"Revised return filed?",k:"rev",t:"sel",opts:RET1_YESNO,w:"150px"},
        {h:"Updated return filed?",k:"upd",t:"sel",opts:RET1_YESNO,w:"150px"}
      ],R0.udYears,{min:"560px",add:"Add a year",empty:"No unabsorbed-depreciation year entered."});
    }

    /* ---------------- Part B-ATI ---------------- */
    h+=sub("Part B-ATI — total updated income and additional tax u/s 140B");
    h+=note("Enter the head-wise <b>additional</b> income being returned and the tax "+
      "figures from the updated return. The additional income-tax u/s 140B is computed "+
      "below at "+Math.round((A.rate||0.25)*100)+"% of the aggregate liability on the "+
      "additional income.");
    h+=row("Salaries",inp("ret.atiSal",{n:1}),{ref:"HeadOfInc.Salaries"});
    h+=row("Income from house property",inp("ret.atiHP",{n:1}),{ref:"HeadOfInc.IncomeFromHP"});
    h+=row("Income from other sources",inp("ret.atiOS",{n:1}),{ref:"HeadOfInc.IncomeFromOS"});
    h+=row("Total additional income",cell(A.total),{cls:"tot",ref:"HeadOfInc.Total"});
    h+=row("Total income as per the last valid return",inp("ret.latestTotInc",{n:1}),{ref:"LatestTotInc"});
    h+=row("Total updated income (last + additional)",cell(A.updated),{cls:"tot",ref:"UpdatedTotInc"});
    h+=row("Amount payable as per the updated return (Part B-TTI)",inp("ret.amtPayable",{n:1}),{ref:"AmtPayable"});
    h+=row("Amount refundable as per the updated return (Part B-TTI)",inp("ret.amtRefundable",{n:1}),{ref:"AmtRefundable"});
    h+=row("Amount payable as per the last valid return",inp("ret.lastAmtPayable",{n:1}),{ref:"LastAmtPayable"});
    h+=row("Refund claimed / issued as per the last valid return",inp("ret.refund",{n:1}),{ref:"Refund"});
    h+=row("Fee for default in furnishing return u/s 234F",inp("ret.feeIncUS234F",{n:1}),{ref:"FeeIncUS234F"});
    h+=row("Regular-assessment tax already paid",inp("ret.regAssTax",{n:1}),{ref:"RegAssessementTAX"});

    h+=grid("ret.it2",[

      {h:"Date of deposit",k:"date",t:"date",req:1,w:"150px"},

    ],R0.it2,{min:"660px",add:"Add a challan",empty:"No IT-2 challan entered."});

    h+=row("Total refund (from the updated return)",cell(A.totRefund),{ref:"TotRefund"});
  }

  return h;
}
