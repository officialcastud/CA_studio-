      inner += row("Whether section 92E is applicable to the entity?", sel(pre+"sec92e", OTH_YN), {ref:"Sec92EFirmFlag"});
      inner += row("Percentage share in the profit of the entity", inp(pre+"pct",{n:1}), {req:1, ref:"ProfitSharePercent", hint:"0 to 100"});
      inner += row("i · Amount of share in the profit", inp(pre+"profit",{n:1}), {req:1, ref:"ProfitShareAmt"});
      inner += row("ii · Amount of interest due or received", inp(pre+"interest",{n:1}), {ref:"IntrstAmtDueOrRecv"});
      inner += row("iii · Capital balance as on 31st March in the entity", inp(pre+"capbal",{n:1}), {req:1, ref:"FirmCapBalOn31Mar"});
      b += blk("if"+i, title, (cb.hasVal?"Entered":"Empty"), inner, "other.if."+i);
    });
    b += '<button class="add" data-add="other.if">Add an entity</button>';
    const T = C.ifTot||{};
    b += row("Total amount of share in profit (Σ i)", cell(T.profit), {ref:"TotalProfitShareAmt"});
    b += row("Total capital balance as on 31st March (Σ iii)", cell(T.capbal), {ref:"TotalFirmCapBalOn31Mar"});
    b += row("Total interest due or received (→ P&L 14xib, rule B10)", cell(T.interest), {});
    h += card("if","Schedule IF — Investment in unincorporated entities",
              ((C.if||[]).some(x=>x.hasVal)?(C.if||[]).filter(x=>x.hasVal).length+" entity(ies)":""), b);
  }

  /* ===== Schedule PTI ===== */
  {
    let b = note("Pass-through income from a business trust (REIT/InvIT) or investment fund (AIF/VCF) under sections 115U / 115UA / 115UB. Each head's net (col 9 = 7 − 8) reappears in that head's own schedule (HP item 2, OS Sl.2, Schedule CG / SI special rates); the exempt total (iv) flows to Schedule EI Sl. No. 5; column 10 TDS flows to Schedule TDS.");
    const blocks = C.pti || [];
    (O.pti||[]).forEach((raw,i)=>{
      const cb = blocks[i] || {};
      const pre = "other.pti."+i+".";
      const title = "Trust / fund " + (i+1) + (st0(raw.name)?" — "+esc(st0(raw.name)):"");
      let inner = "";
      inner += row("Investment entity covered by section", sel(pre+"kind", OTH_PTIKIND), {req:1, ref:"(2)"});
      inner += row("Name of business trust / investment fund", inp(pre+"name",{max:125}), {req:1, ref:"(3)"});
      inner += row("PAN of business trust / investment fund", inp(pre+"pan",{max:10}), {req:1, ref:"(4)"});
      const money4 = (k,lbl,ind)=> '<tr><td class="l"'+(ind?' style="padding-left:'+ind+'px"':'')+'>'+esc(lbl)+'</td>'+
        '<td>'+inp(pre+k+".inc",{n:1})+'</td><td>'+inp(pre+k+".loss",{n:1})+'</td>'+
        '<td class="num">'+cell((cb[k]||{}).net)+'</td><td>'+inp(pre+k+".tds",{n:1})+'</td></tr>';
      const money3 = (k,lbl,ind)=> '<tr><td class="l"'+(ind?' style="padding-left:'+ind+'px"':'')+'>'+esc(lbl)+'</td>'+
        '<td>'+inp(pre+k+".inc",{n:1})+'</td><td class="num">'+cell(0)+'</td>'+
        '<td class="num">'+cell((cb[k]||{}).net)+'</td><td>'+inp(pre+k+".tds",{n:1})+'</td></tr>';
      const aggRow = (lbl,o,ind)=> '<tr><td class="l"'+(ind?' style="padding-left:'+ind+'px"':'')+'><b>'+esc(lbl)+'</b></td>'+
        '<td class="num">'+cell((o||{}).inc)+'</td><td class="num">'+cell((o||{}).loss!==undefined?(o||{}).loss:0)+'</td>'+
        '<td class="num">'+cell((o||{}).net)+'</td><td class="num">'+cell((o||{}).tds)+'</td></tr>';
      let t = '<div class="full"><table class="gt" style="min-width:660px"><thead><tr>'+
        '<th class="l">Head of income (6)</th><th>Current year income (7)</th>'+
        '<th>Share of loss distributed (8)</th><th>Net income/loss 9=7−8 (9)</th>'+
        '<th>TDS (10)</th></tr></thead><tbody>';
      t += money4("hp","i · House property");
      t += '<tr><td class="l" colspan="5"><b>ii · Capital Gains</b></td></tr>';
      t += aggRow("a · Short term (iia = ai + aii)", cb.stAgg, 20);
      t += money4("st111a","ai · Section 111A", 36);
      t += money4("stOth","aii · Others", 36);
      t += aggRow("b · Long term (iib = bi + bii)", cb.ltAgg, 20);
      t += money4("lt112a","bi · Section 112A", 36);
      t += money4("ltOth","bii · Sections other than 112A", 36);
      t += '<tr><td class="l" colspan="5"><b>iii · Other Sources (iii = a + b)</b></td></tr>';
      t += aggRow("Other Sources total", cb.osAgg, 20);
      t += money3("osDiv","a · Dividend", 36);
      t += money3("osOth","b · Others", 36);
      t += '<tr><td class="l" colspan="5"><b>iv · Income claimed to be exempt (iv = a + b + c)</b></td></tr>';
      t += aggRow("Exempt total", cb.exTot, 20);
      t += money3("ex23fbb","a · u/s 10(23FBB)", 36);
      t += '</tbody></table></div>';
      t += row("iv b · Exempt u/s (specify section code)", inp(pre+"exBcode",{max:15}), {ref:"(iv b)"});
      t += '<div class="full"><table class="gt" style="min-width:520px"><tbody>'+
        '<tr><td class="l">Amount</td><td>'+inp(pre+"exB.inc",{n:1})+'</td>'+
        '<td class="l">TDS</td><td>'+inp(pre+"exB.tds",{n:1})+'</td></tr></tbody></table></div>';
      t += row("iv c · Exempt u/s (specify section code)", inp(pre+"exCcode",{max:15}), {ref:"(iv c)"});
      t += '<div class="full"><table class="gt" style="min-width:520px"><tbody>'+
        '<tr><td class="l">Amount</td><td>'+inp(pre+"exC.inc",{n:1})+'</td>'+
        '<td class="l">TDS</td><td>'+inp(pre+"exC.tds",{n:1})+'</td></tr></tbody></table></div>';
      inner += t;
      b += blk("pti"+i, title, (cb.hasVal?"Entered":"Empty"), inner, "other.pti."+i);
    });
    b += '<button class="add" data-add="other.pti">Add a trust / fund</button>';
    h += card("pti","Schedule PTI — Pass-through income (115U / 115UA / 115UB)",
              (blocks.some(x=>x.hasVal)?blocks.filter(x=>x.hasVal).length+" block(s)":""), b);
  }

  /* ===== Schedule TPSA ===== */
  {
    const T = C.tpsa || {};
    let b = note("Tax on secondary adjustments u/s 92CE(2A): where a transfer-pricing primary adjustment left excess money with the associated enterprise that was not repatriated in time, an additional tax of 18% (plus 12% surcharge and 4% health & education cess) may be paid in lieu of the secondary adjustment.");
    if(oth_s96())
      b += note("Part A-OI's 'impermissible avoidance arrangement (section 96)' answer is Yes — Schedule TPSA is expected to be filled (rule 693).","warn");
    b += row("1 · Amount of primary adjustment on which option u/s 92CE(2A) is exercised (total across all AYs)",
             inp("other.tpsa.adj",{n:1}), {ref:"[D4]", req:1});
    b += row("2a · Additional income tax payable @ 18% on item 1", cell(T.tax2a), {ref:"[D8]"});
    b += row("2b · Surcharge @ 12% on 2a", cell(T.sur2b), {ref:"[D9]"});
    b += row("2c · Health & Education cess @ 4% on (2a + 2b)", cell(T.cess2c), {ref:"[D10]"});
    b += row("2d · Total additional tax payable (2a + 2b + 2c)", cell(T.tot2d), {ref:"[D11]"});
    b += sub("Details of taxes paid (challans) — feeds item 3");
    b += grid("other.tpsa.challans",[
      {k:"bsr",h:"BSR Code",t:"txt",w:"110px",max:7},
      {k:"bank",h:"Name of Bank and Branch",t:"txt",max:125},
      {k:"date",h:"Date of Deposit",t:"date",w:"140px"},
      {k:"srl",h:"Serial No. of Challan",t:"txt",w:"120px",max:5},
      {k:"amt",h:"Amount deposited (Rs)",t:"num",w:"150px"}
    ], O.tpsa&&O.tpsa.challans||[], {min:"720px", empty:"No challans entered.", add:"Add a challan"});
    b += row("Total amount deposited (Σ challans)", cell(T.paid3), {ref:"TotalAmountDeposited"});
    b += row("3 · Taxes paid", cell(T.paid3), {ref:"[D12]"});
    b += row("4 · Net tax payable (2d − 3) → Part B-TTI", cell(T.net4), {ref:"[D13]"});
    h += card("tpsa","Schedule TPSA — Tax on secondary adjustments (section 92CE(2A))",
              (T.has?RS(T.net4):""), b);
  }

  /* ===== Schedule 115TD ===== */
  {
    const D6 = C.td || {};
    let b = note("Accreted income u/s 115TD: when a charitable/religious trust or institution ceases to exist as such (registration cancelled, converted, or merged/dissolved without transfer to another eligible entity), the excess of the FMV of its assets over its liabilities is taxed at the maximum marginal rate, with interest u/s 115TE.");
    b += row("1 · Aggregate FMV of total assets of the specified person", inp("other.td.fmv",{n:1}), {ref:"[F4]"});
    b += row("2 · Less: total liability of the specified person", inp("other.td.liab",{n:1}), {ref:"[F5]"});
    b += row("3 · Net value of assets (1 − 2)", cell(D6.net3), {ref:"[F6]"});
    b += row("4i · FMV of assets directly acquired out of income u/s 10(1)", inp("other.td.fmv4i",{n:1}), {ref:"[F7]"});
    b += row("4ii · FMV of assets acquired during the pre-registration period (11/12 benefit not claimed)", inp("other.td.fmv4ii",{n:1}), {ref:"[F8]"});
    b += row("4iii · FMV of assets transferred per third proviso to 115TD(2)", inp("other.td.fmv4iii",{n:1}), {ref:"[F9]"});
    b += row("4iv · Total (4i + 4ii + 4iii)", cell(D6.tot4iv), {ref:"[F10]"});
    b += row("5 · Liability in respect of assets at 4 above", inp("other.td.liab4",{n:1}), {ref:"[F11]"});
    b += row("6 · Accreted income u/s 115TD [3 − (4iv − 5)]", cell(D6.acc6), {ref:"[F12]"});
    b += row("7 · Additional income-tax payable u/s 115TD at maximum marginal rate",
             inp("other.td.addtax",{n:1}), {ref:"[F13]", req:1, hint:"MMR tax on the accreted income"});
    b += row("8 · Interest payable u/s 115TE", inp("other.td.interest",{n:1}), {ref:"[F14]", hint:"from the specified date to the date of payment"});
    b += row("9 · Specified date u/s 115TD", dte("other.td.specdate"), {ref:"[F15]", req:1});
    b += row("10 · Additional income-tax and interest payable (7 + 8)", cell(D6.pay10), {ref:"[F16]"});
    b += sub("Date(s) of deposit of tax on accreted income (challans) — feeds item 11");
    b += grid("other.td.challans",[
      {k:"date",h:"Date",t:"date",w:"140px"},
      {k:"bank",h:"Name of Bank and Branch",t:"txt",max:125},
      {k:"bsr",h:"BSR Code",t:"txt",w:"110px",max:7},
      {k:"srl",h:"Serial No. of Challan",t:"txt",w:"120px",max:5},
      {k:"amt",h:"Amount deposited",t:"num",w:"150px"}
    ], O.td&&O.td.challans||[], {min:"720px", empty:"No challans entered.", add:"Add a challan"});
    b += row("11 · Tax and interest paid (Σ challans)", cell(D6.paid11), {ref:"[F17]"});
    b += row("12 · Net payable/refundable (10 − 11) → Part B-TTI Sl. 13", cell(D6.net12), {ref:"[F18]"});
    h += card("td115","Schedule 115TD — Accreted income (section 115TD) + interest (115TE)",
              (D6.has?RS(D6.net12):""), b);
  }

  /* ===== Schedule GST ===== */
  {
    let b = note("Turnover / gross receipt reported for GST: one line per GSTIN, the annual value of outward supplies reported in the GST returns filed for the year. A disclosure that lets the department reconcile the income-tax turnover against the GST turnover. Both columns are paired-mandatory (rules 714/715).");
    b += grid("other.gst",[
      {k:"gstin",h:"GSTIN No.",t:"txt",w:"200px",max:15},
      {k:"amt",h:"Annual value of outward supplies as per the GST return(s) filed",t:"num"}
    ], O.gst||[], {min:"560px", empty:"No GSTIN entered.", add:"Add a GSTIN"});
    h += card("gst","Schedule GST — Turnover/gross receipt reported for GST",
              ((C.gst||[]).some(x=>x.has)?(C.gst||[]).filter(x=>x.has).length+" GSTIN(s)":""), b);
  }

  /* ===== Schedule FD ===== */
  {
    const F = C.fd || {};
    let b = note("Break-up of payments/receipts in foreign currency — to be filled only by an assessee not liable to get accounts audited u/s 44AB. An audited company leaves this blank (the audit report captures the same information).");
    if(F.audited)
      b += note("This company appears to be liable to audit u/s 44AB — Schedule FD is not to be filled by an audited company. Leave it blank.","warn");
    b += row("i · Payments made during the year on capital account", inp("other.fd.payCap",{n:1}), {ref:"[E5]"});
    b += row("ii · Payments made during the year on revenue account", inp("other.fd.payRev",{n:1}), {ref:"[E6]"});
    b += row("iii · Receipts during the year on capital account", inp("other.fd.rcptCap",{n:1}), {ref:"[E7]"});
    b += row("iv · Receipts during the year on revenue account", inp("other.fd.rcptRev",{n:1}), {ref:"[E8]"});
    h += card("fd","Schedule FD — Foreign-currency payments/receipts (non-audit filer)",
              (F.has?"Entered":""), b);
  }

  return h;
}

/* ---- export ------------------------------------------------------ */
function expOther(j){
  const C = S.C.other||{}, O = S.other||{};

  /* ---- Schedule IF ---- */
  const ifRows = (C.if||[]).filter(r=>r.hasVal);
  if(ifRows.length){
    j.ScheduleIF = {
      PartnerFirmDetails: ifRows.map(r=>{
        const o = {
          FirmName:(sv(r.name)||"NA").slice(0,125),
          FirmType:(sv(r.ftype)||"NA").slice(0,125),
          FirmPAN:PAN_RE.test(r.pan)?r.pan:"AAAAA0000A",
          ProfitSharePercent:N(r.pct),
          ProfitShareAmt:sg(r.profit),
          FirmCapBalOn31Mar:sg(r.capbal)
        };
        if(sv(r.audit))  o.IsLiableToAudit = r.audit;
        if(sv(r.sec92e)) o.Sec92EFirmFlag  = r.sec92e;
        if(r.interest)   o.IntrstAmtDueOrRecv = n0(r.interest);
        return o;
      }),
      TotalProfitShareAmt:sg((C.ifTot||{}).profit||0),
      TotalFirmCapBalOn31Mar:sg((C.ifTot||{}).capbal||0)
    };
  }

  /* ---- Schedule PTI ---- */
  const pb = (C.pti||[]).filter(b=>b.hasVal);
  if(pb.length){
    const m4 = o => ({ AmountOfInc:sg(o.inc), CurrYrLossShareByInvstFund:n0(o.loss),
                       NetIncomeLoss:sg(o.net), TDSAmount:n0(o.tds) });
    const m3 = o => ({ AmountOfInc:sg(o.inc), NetIncomeLoss:sg(o.net), TDSAmount:n0(o.tds) });
    j.SchedulePTI = { SchedulePTIDtls: pb.map(b=>{
      const IncClmdPTI = {
        TotalSec23FBB:{ AmountOfInc:sg(b.exTot.inc), NetIncomeLoss:sg(b.exTot.net), TDSAmount:n0(b.exTot.tds) },
        Sec23FBB:m3(b.ex23)
      };
      if(sv(b.exB.code)) IncClmdPTI.SecBIncExmptDtl = { SectionCode:b.exB.code, SecBCIncExmptDtl:m3(b.exB) };
      if(sv(b.exC.code)) IncClmdPTI.SecCIncExmptDtl = { SectionCode:b.exC.code, SecBCIncExmptDtl:m3(b.exC) };
      return {
        InvstmntCvrdUs115UA115UB:sv(b.kind)||"Section 115UB",
        BusinessName:(sv(b.name)||"NA").slice(0,125),
        BusinessPAN:PAN_RE.test(b.pan)?b.pan:"AAAAA0000A",
        IncFromHP:m4(b.hp),
        CapitalGainsPTI:{ ShortTermCG:m4(b.stAgg), STCG_Sec111A:m4(b.st111a), STCG_Others:m4(b.stOth),
                          LongTermCG:m4(b.ltAgg), LTCG_Sec112A:m4(b.lt112a), LTCG_Others:m4(b.ltOth) },
        IncClmdPTI:IncClmdPTI,
        IncOthSrc:m3(b.osAgg), OS_Dividend:m3(b.osDiv), OS_Others:m3(b.osOth)
      };
    })};
  }

  /* ---- Schedule TPSA ---- */
  const T = C.tpsa||{};
  if(T.has){
    const o = {
      AmtPrimaryAdjUs92CE_2A:sg(T.adj),
      AdditionalIncTax18PercAbove:sg(T.tax2a),
      Surcharge12Perc:sg(T.sur2b),
      HealthEducationCess:sg(T.cess2c),
      TotalAdditionalTax:sg(T.tot2d),
      TaxesPaid:sg(T.paid3),
      NetTaxPayable:sg(T.net4),
      TotalAmountDeposited:sg(T.paid3)
    };
    const chal = (T.challans||[]).filter(c=>c.amt || st0(c.bsr) || st0(c.bank) || ISO(c.date) || st0(c.srl));
    if(chal.length) o.DtlsTaxesPaid = chal.map(c=>{
      const r = { BSRCode:(sv(c.bsr)||"").slice(0,7), BankBranchName:(sv(c.bank)||"NA").slice(0,125),
                  SrlNoOfChaln:sg(N(c.srl)), Amount:n0(c.amt) };
      if(ISO(c.date)) r.DateDep = ISO(c.date);
      return r;
    });
    j.ScheduleTPSA = o;
  }

  /* ---- Schedule 115TD ---- */
  const D6 = C.td||{};
  if(D6.has){
    const o = {
      FMVTotTrustInst:sg(D6.fmv1),
      LessTotLiaTrustInst:sg(D6.liab2),
      NetValAsst:sg(D6.net3),
      FMVAsstAcqrdRfrdSec101:sg(D6.f4i),
      FMVAsstAcqPeriodFromDateCrtn:sg(D6.f4ii),
      FMVAsstTrnfsrdSec115TD2:sg(D6.f4iii),
      FMVTotal:sg(D6.tot4iv),
      LiabilityRespectofAsset4Above:sg(D6.liab4),
      AccretedIncomeSection115TD:sg(D6.acc6),
      AddIncPay115TDMarginalRate:sg(D6.addtax7),
      InterestPayable115TE:sg(D6.int8),
      AddIncIntstPayb:sg(D6.pay10),
      TaxIntstPaid:sg(D6.paid11),
      NetPaybleRefble:sg(D6.net12)
    };
    if(ISO(D6.specdate)) o.SpecifiedDateUs115TD = ISO(D6.specdate);
    const chal = (D6.challans||[]).filter(c=>c.amt || st0(c.bsr) || st0(c.bank) || ISO(c.date) || st0(c.srl));
    if(chal.length) o.DepositofTaxAccInc = { DepositofTaxAccIncDtls: chal.map(c=>{
      const r = { NameBankBranch:(sv(c.bank)||"NA").slice(0,125), BSRCode:(sv(c.bsr)||"").slice(0,7),
                  SrlNoOfChaln:sg(N(c.srl)), Amount:n0(c.amt) };
      if(ISO(c.date)) r.DateDep = ISO(c.date);
      return r;
    })};
    j.Schedule115TD = o;
  }

  /* ---- Schedule GST ---- */
  const gst = (C.gst||[]).filter(r=>st0(r.gstin) && R(r.amt));  /* paired: both present */
  if(gst.length){
    j.ScheduleGST = { TurnoverGrsRcptForGSTIN: gst.map(r=>({
      GSTINNo:st0(r.gstin).slice(0,15), AmtTurnGrossRcptGSTIN:sg(r.amt)
    })) };
  }

  /* ---- Schedule FD (non-audit filer, when any of the four is non-zero) ---- */
  const F = C.fd||{};
  if(F.has && !F.audited){
    j.ScheduleFD = {
      PaymntMadeOnCapitalAcc:sg(F.payCap),
      PaymntMadeOnRevenueAcc:sg(F.payRev),
      ReceiptsOnCapitalAcc:sg(F.rcptCap),
      ReceiptsOnRevenueAcc:sg(F.rcptRev)
    };
  }
}

/* ---- import ------------------------------------------------------ */
function impOther(I6){
  const read = [];
  S.other = S.other || {};

  /* Schedule IF */
  if(I6 && I6.ScheduleIF){
    const A = I6.ScheduleIF;
    S.other.if = (A.PartnerFirmDetails||[]).map(o=>({
      name:o.FirmName||"", ftype:o.FirmType||"", pan:o.FirmPAN||"",
      audit:o.IsLiableToAudit||"", sec92e:o.Sec92EFirmFlag||"",
      pct:nz(o.ProfitSharePercent), profit:nz(o.ProfitShareAmt),
      interest:nz(o.IntrstAmtDueOrRecv), capbal:nz(o.FirmCapBalOn31Mar)
    }));
    read.push("Schedule IF");
  }

  /* Schedule PTI */
  if(I6 && I6.SchedulePTI){
    const l4 = o => o ? { inc:nz(o.AmountOfInc), loss:nz(o.CurrYrLossShareByInvstFund), tds:nz(o.TDSAmount) } : {};
    const l3 = o => o ? { inc:nz(o.AmountOfInc), tds:nz(o.TDSAmount) } : {};
    S.other.pti = (I6.SchedulePTI.SchedulePTIDtls||[]).map(b=>{
      const c = b.CapitalGainsPTI||{}, x = b.IncClmdPTI||{};
      const r = { kind:b.InvstmntCvrdUs115UA115UB||"", name:b.BusinessName||"", pan:b.BusinessPAN||"",
        hp:l4(b.IncFromHP), st111a:l4(c.STCG_Sec111A), stOth:l4(c.STCG_Others),
        lt112a:l4(c.LTCG_Sec112A), ltOth:l4(c.LTCG_Others),
        osDiv:l3(b.OS_Dividend), osOth:l3(b.OS_Others), ex23fbb:l3(x.Sec23FBB) };
      if(x.SecBIncExmptDtl){ r.exBcode=x.SecBIncExmptDtl.SectionCode||""; r.exB=l3(x.SecBIncExmptDtl.SecBCIncExmptDtl); }
      if(x.SecCIncExmptDtl){ r.exCcode=x.SecCIncExmptDtl.SectionCode||""; r.exC=l3(x.SecCIncExmptDtl.SecBCIncExmptDtl); }
      return r;
    });
    read.push("Schedule PTI");
  }

  /* Schedule TPSA */
  if(I6 && I6.ScheduleTPSA){
    const A = I6.ScheduleTPSA;
    S.other.tpsa = {
      adj:nz(A.AmtPrimaryAdjUs92CE_2A),
      challans:(A.DtlsTaxesPaid||[]).map(c=>({ bsr:c.BSRCode||"", bank:c.BankBranchName||"",
        date:dmy(c.DateDep)||"", srl:c.SrlNoOfChaln!=null?String(c.SrlNoOfChaln):"", amt:nz(c.Amount) }))
    };
    read.push("Schedule TPSA");
  }

  /* Schedule 115TD */
  if(I6 && I6.Schedule115TD){
    const A = I6.Schedule115TD;
    S.other.td = {
      fmv:nz(A.FMVTotTrustInst), liab:nz(A.LessTotLiaTrustInst),
      fmv4i:nz(A.FMVAsstAcqrdRfrdSec101), fmv4ii:nz(A.FMVAsstAcqPeriodFromDateCrtn),
      fmv4iii:nz(A.FMVAsstTrnfsrdSec115TD2), liab4:nz(A.LiabilityRespectofAsset4Above),
      addtax:nz(A.AddIncPay115TDMarginalRate), interest:nz(A.InterestPayable115TE),
      specdate:dmy(A.SpecifiedDateUs115TD)||"",
      challans:(((A.DepositofTaxAccInc||{}).DepositofTaxAccIncDtls)||[]).map(c=>({
        date:dmy(c.DateDep)||"", bank:c.NameBankBranch||"", bsr:c.BSRCode||"",
        srl:c.SrlNoOfChaln!=null?String(c.SrlNoOfChaln):"", amt:nz(c.Amount) }))
    };
    read.push("Schedule 115TD");
  }

  /* Schedule GST */
  if(I6 && I6.ScheduleGST){
    S.other.gst = (I6.ScheduleGST.TurnoverGrsRcptForGSTIN||[]).map(r=>({
      gstin:r.GSTINNo||"", amt:nz(r.AmtTurnGrossRcptGSTIN) }));
    read.push("Schedule GST");
  }

  /* Schedule FD */
  if(I6 && I6.ScheduleFD){
    const A = I6.ScheduleFD;
    S.other.fd = { payCap:nz(A.PaymntMadeOnCapitalAcc), payRev:nz(A.PaymntMadeOnRevenueAcc),
                   rcptCap:nz(A.ReceiptsOnCapitalAcc), rcptRev:nz(A.ReceiptsOnRevenueAcc) };
    read.push("Schedule FD");
  }

  return read;
}

/* ---- checks (this section's own screen validations) --------------- */
function chkOther(){
  const out = [], C = S.C.other||{}, O = S.other||{};

  /* Schedule IF — per-entity mandatory fields when a row carries a value */
  (C.if||[]).forEach((r,i)=>{
    if(!r.hasVal) return;
    if(!st0(r.name) || !st0(r.ftype) || !PAN_RE.test(r.pan))
      out.push({lvl:"err", t:"Schedule IF", m:"Entity "+(i+1)+": name, type and a valid PAN of the entity are mandatory.", sec:"other"});
    if(r.pct<0 || r.pct>100)
      out.push({lvl:"err", t:"Schedule IF", m:"Entity "+(i+1)+": the percentage share in profit must be between 0 and 100.", sec:"other"});
  });

  /* Schedule PTI — required header fields when a block carries a value */
  (C.pti||[]).forEach((b,i)=>{
    if(!b.hasVal) return;
    if(!st0(b.kind) || !st0(b.name) || !PAN_RE.test(b.pan))
      out.push({lvl:"err", t:"Schedule PTI", m:"Block "+(i+1)+": the section covered (115U/115UA/115UB), name and a valid PAN of the trust/fund are mandatory.", sec:"other"});
  });

  /* Schedule TPSA — a challan date cannot be in the future (rule 694) */
  (((C.tpsa||{}).challans)||[]).forEach((c,i)=>{
    const d = ISO(c.date);
    if(d && new Date(d+"T00:00:00") > new Date())
      out.push({lvl:"err", t:"Schedule TPSA", m:"Challan "+(i+1)+": the date of deposit cannot be after today.", sec:"other"});
  });

  /* Schedule 115TD — if accreted income arises, the specified date and the
     additional tax must be present (rules 699/700). */
  const D6 = C.td||{};
  if(D6.acc6 > 0){
    if(!ISO(D6.specdate))
      out.push({lvl:"err", t:"Schedule 115TD", m:"Accreted income is present, so the specified date u/s 115TD (item 9) cannot be blank (rule 699).", sec:"other"});
    if(!D6.addtax7)
      out.push({lvl:"warn", t:"Schedule 115TD", m:"Accreted income is present but the additional income-tax u/s 115TD (item 7) at the maximum marginal rate has not been entered (rule 700).", sec:"other"});
  }

  /* Schedule GST — paired mandatory (rules 714/715) */
  (C.gst||[]).forEach((r,i)=>{
    const hasG = !!st0(r.gstin), hasA = !!R(r.amt);
    if(hasG !== hasA)
      out.push({lvl:"err", t:"Schedule GST", m:"Row "+(i+1)+": GSTIN No. and the annual value of outward supplies must both be filled (rules 714/715).", sec:"other"});
  });

  /* Schedule FD — an audited company must not fill it */
  const F = C.fd||{};
  if(F.has && F.audited)
    out.push({lvl:"warn", t:"Schedule FD", m:"This company appears liable to audit u/s 44AB; Schedule FD is for a non-audit filer and will not be written.", sec:"other"});

  return out;
}

reg({id:"other", t:"Other schedules", ref:"IF · PTI · TPSA · 115TD · GST · FD",
     f:secOther,
     s:()=>{ const C=S.C.other||{}; const bits=[];
       const nif=(C.if||[]).filter(x=>x.hasVal).length; if(nif) bits.push(nif+" IF");
       const npti=(C.pti||[]).filter(x=>x.hasVal).length; if(npti) bits.push(npti+" PTI");
       if((C.tpsa||{}).has) bits.push("TPSA "+RS((C.tpsa||{}).net4||0));
       if((C.td||{}).has) bits.push("115TD "+RS((C.td||{}).net12||0));
       const ngst=(C.gst||[]).filter(x=>x.has).length; if(ngst) bits.push(ngst+" GST");
       if((C.fd||{}).has) bits.push("FD");
       return bits.join(" · "); },
     eng:engOther, exp:expOther, imp:impOther, chk:chkOther, order:11, corder:11});

   Books: books/ITR-6/IT.md (Schedule IT · 15A, advance / self-assessment
   challans) and books/ITR-6/TDS.md (the three TDS/TCS tables).

   THE SHEET-NAME ↔ SCHEMA-BLOCK OFFSET (books/ITR-6/TDS.md §0):

   ===================================================================== */

/* ---- engine ------------------------------------------------------- */
function engPaid(){
  const P={income:0};

  /* TDS credit tables (schema TDS2 / TDS3) — per-row carried forward
     (rule A798: col 13 = col 6 + 7 + 8 − 9 − 10):
       cf = MAX(0, bf + dedOwn + dedOthTds − claimOwn − claimOthTds) */
  const rowCF=rows=>(rows||[]).forEach(r=>{
    const avail=N(r.bf)+N(r.dedOwn)+N(r.dedOthTds);
    const claimed=N(r.claimOwn)+N(r.claimOthTds);
    r._avail=avail; r._claimed=claimed; r._cf=Math.max(0,avail-claimed); r._over=claimed>avail;});
  rowCF(S.paid.tds2); rowCF(S.paid.tds3);
  const t2=(S.paid.tds2||[]).reduce((a,r)=>a+N(r.claimOwn),0); /* Σ col 9 own hands */
  const t3=(S.paid.tds3||[]).reduce((a,r)=>a+N(r.claimOwn),0); /* Σ col 9 own hands */

  /* Schedule TCS (15C) — per-row carried forward (rule A805:
       col 8 = col 5 + col 6 − col 7):
       cf = MAX(0, bf + collOwn + collOth − claimOwn − claimOth) */
  (S.paid.tcs||[]).forEach(r=>{
    const avail=N(r.bf)+N(r.collOwn)+N(r.collOth);
    const claimed=N(r.claimOwn)+N(r.claimOth);
    r._avail=avail; r._claimed=claimed; r._cf=Math.max(0,avail-claimed); r._over=claimed>avail;});
  const tcs=(S.paid.tcs||[]).reduce((a,r)=>a+N(r.claimOwn),0); /* Σ col 7(i) own hands */

  /* Schedule IT (15A) — advance vs self-assessment split by deposit date
     (books/ITR-6/IT.md §3; rules A775 / A776): a challan dated on or before
     31 Mar 2026 (YREND) is advance tax (→ 10a); on or after 1 Apr 2026 is
     self-assessment tax (→ 10d). No dropdown — the date decides. */
  const isSAT=c=>{const d=D(c.dt);return d?d>YREND:false;};
  const challans=(S.paid.it||[]).map(c=>({amt:R(N(c.amt)),dt:c.dt,sat:isSAT(c),valid:!!D(c.dt)}));
  const adv=challans.filter(c=>!c.sat).reduce((a,c)=>a+c.amt,0);
  const sat=challans.filter(c=> c.sat).reduce((a,c)=>a+c.amt,0);

  P.t2=R(t2); P.t3=R(t3);
  P.tds=R(t2+t3);                    /* 10b = TDS2 col 9 + TDS3 col 9 (rule A778) */
  P.tcs=R(tcs);                      /* 10c = TCS col 7(i)         (rules A777/A799) */
  P.adv=R(adv); P.sat=R(sat); P.itTotal=R(adv+sat); /* TotalTaxPayments = Σ Amt */
  P.paid=R(adv+t2+t3+tcs+sat);       /* 10e = 10a + 10b + 10c + 10d (rule A764) */
  P.challans=challans;
  P.income=0;                        /* taxes paid contribute nothing to GTI */
  S.C.paid=P;
}

    const o={TDSCreditName:r.who==="O"?"O":"S"};

      if(PAN_RE.test(st0(r.othPan).toUpperCase()))o.PANofOtherPerson=st0(r.othPan).toUpperCase();
      if(AADH.test(st0(r.othAadh)))o.AadhaarOfOtherPerson=st0(r.othAadh);}
    if(buyer){
      o.PANOfBuyerTenant=PAN_RE.test(st0(r.pan).toUpperCase())?st0(r.pan).toUpperCase():"AAAAA0000A";
      if(AADH.test(st0(r.aadh)))o.AadhaarOfBuyerTenant=st0(r.aadh);}
    else o.TANOfDeductor=st0(r.tan).toUpperCase();
    o.TDSSection=TDSSEC_CODES.indexOf(st0(r.sec))>=0?st0(r.sec):"94A";
    if(N(r.bf)&&DEDYR.indexOf(st0(r.yr))>=0){o.DeductedYr=parseInt(r.yr,10);o.BroughtFwdTDSAmt=n0(r.bf);}
    const c={TaxClaimedOwnHands:n0(r.claimOwn)};                 /* required leaf */
    if(N(r.dedOwn))c.TaxDeductedOwnHands=n0(r.dedOwn);
    if(N(r.dedOthInc))c.TaxDeductedIncome=n0(r.dedOthInc);
    if(N(r.dedOthTds))c.TaxDeductedTDS=n0(r.dedOthTds);
    if(N(r.claimOthInc))c.TaxClaimedIncome=n0(r.claimOthInc);
    if(N(r.claimOthTds))c.TaxClaimedTDS=n0(r.claimOthTds);
    if(PAN_RE.test(st0(r.claimOthPan).toUpperCase()))c.TaxClaimedSpouseOthPrsnPAN=st0(r.claimOthPan).toUpperCase();
    if(AADH.test(st0(r.claimOthAadh)))c.SpouseOthPrsnAadhaar=st0(r.claimOthAadh);
    o.TaxDeductCreditDtls=c;
    if(N(r.gross))o.GrossAmount=n0(r.gross);
    const heads=buyer?TDS3_HEADS:TDS2_HEADS;
    let hd=st0(r.head)||TDS_HEAD_OF[r.sec]||(buyer?"OS":"OS");
    if(!heads.some(x=>x[0]===hd))hd=buyer?"OS":"OS";
    o.HeadOfIncome=hd;
    o.AmtCarriedFwd=n0(r._cf||0);
    return o;};

  /* ScheduleTDS2 (sheet "Schedule TDS1", Form 16A) — total present even at zero */
  const t2=(S.paid.tds2||[]).filter(r=>(N(r.claimOwn)||N(r.dedOwn)||N(r.bf))&&TAN_RE.test(st0(r.tan).toUpperCase()));
  j.ScheduleTDS2={TotalTDSonOthThanSals:n0(P.t2)};
  if(t2.length)j.ScheduleTDS2.TDSOthThanSalaryDtls=t2.map(r=>tdsRow(r,false));

  /* ScheduleTDS3 (sheet "Schedule TDS2", Form 16B/C/D/E) — total present even at zero */
  const t3=(S.paid.tds3||[]).filter(r=>N(r.claimOwn)||N(r.dedOwn)||N(r.bf));
  j.ScheduleTDS3={TotalTDS3OnOthThanSal:n0(P.t3)};
  if(t3.length)j.ScheduleTDS3.TDS3onOthThanSalDtls=t3.map(r=>tdsRow(r,true));

  /* ScheduleTCS (sheet "Schedule TCS", Form 27D) — total present even at zero.
     Credit-owner S/O; TAN inside EmployerOrDeductorOrCollectDetl; the current-FY
     and claimed blocks nest own/other hands; TCSAmtCollOthrHands (claimed) is an
     OBJECT {TaxClaimedTCS, PANOfOthrPrsn} (books/ITR-6/TDS.md §4). */
  const tc=(S.paid.tcs||[]).filter(r=>(N(r.claimOwn)||N(r.collOwn)||N(r.bf))&&st0(r.tan));
  j.ScheduleTCS={TotalSchTCS:n0(P.tcs)};
  if(tc.length)j.ScheduleTCS.TCSDetails=tc.map(r=>{
    const det={TCSCreditName:r.who==="O"?"O":"S",TAN:st0(r.tan).toUpperCase()};
    if(r.who==="O"&&PAN_RE.test(st0(r.othPan).toUpperCase()))det.PANofOtherPerson=st0(r.othPan).toUpperCase();
    const o={EmployerOrDeductorOrCollectDetl:det};
    if(N(r.bf)&&DEDYR.indexOf(st0(r.yr))>=0){o.DeductedYr=parseInt(r.yr,10);o.BroughtFwdTCSAmt=n0(r.bf);}
    const cur={TCSAmtCollOwnHands:n0(r.collOwn)};                /* required leaf */
    if(N(r.collOth))cur.TCSAmtCollOthrHands=n0(r.collOth);
    o.TCSCurrFYDtls=cur;
    const cl={TCSAmtCollOwnHands:n0(r.claimOwn)};                /* required leaf */
    if(N(r.claimOth)||PAN_RE.test(st0(r.claimOthPan).toUpperCase())){
      const oth={};
      if(N(r.claimOth))oth.TaxClaimedTCS=n0(r.claimOth);
      if(PAN_RE.test(st0(r.claimOthPan).toUpperCase()))oth.PANOfOthrPrsn=st0(r.claimOthPan).toUpperCase();
      cl.TCSAmtCollOthrHands=oth;}
    o.TCSClaimedThisYearDtls=cl;
    o.AmtCarriedFwd=n0(r._cf||0);
    return o;});

  /* ScheduleIT — TotalTaxPayments present even at zero; DateDep as YYYY-MM-DD */
  const ch=(S.paid.it||[]).filter(c=>N(c.amt)&&BSR.test(st0(c.bsr).toUpperCase())&&ISO(c.dt)&&/^\d{1,14}$/.test(st0(c.sn)));
  j.ScheduleIT={TotalTaxPayments:n0(P.itTotal)};
  if(ch.length)j.ScheduleIT.TaxPayment=ch.map(c=>({BSRCode:st0(c.bsr).toUpperCase(),
    DateDep:ISO(c.dt),SrlNoOfChaln:parseInt(c.sn,10),Amt:n0(c.amt)}));
}

function impPaid(I6){
  const read=[]; const g=(o,p)=>p.split(".").reduce((t,k)=>t==null?undefined:t[k],o);
  const back=(r,buyer)=>{const c=r.TaxDeductCreditDtls||{};return {
    who:r.TDSCreditName||"S",othPan:r.PANofOtherPerson||"",othAadh:r.AadhaarOfOtherPerson||"",
    tan:r.TANOfDeductor||"",pan:r.PANOfBuyerTenant||"",aadh:r.AadhaarOfBuyerTenant||"",
    sec:r.TDSSection||"",yr:nz(r.DeductedYr)+"",bf:nz(r.BroughtFwdTDSAmt),
    dedOwn:nz(c.TaxDeductedOwnHands),dedOthInc:nz(c.TaxDeductedIncome),dedOthTds:nz(c.TaxDeductedTDS),
    claimOwn:nz(c.TaxClaimedOwnHands),claimOthInc:nz(c.TaxClaimedIncome),claimOthTds:nz(c.TaxClaimedTDS),
    claimOthPan:c.TaxClaimedSpouseOthPrsnPAN||"",claimOthAadh:c.SpouseOthPrsnAadhaar||"",
    gross:nz(r.GrossAmount),head:r.HeadOfIncome||""};};
  if(I6.ScheduleTDS2){S.paid.tds2=(I6.ScheduleTDS2.TDSOthThanSalaryDtls||[]).map(r=>back(r,false));read.push("Schedule TDS1 (Form 16A, other than salary)");}
  if(I6.ScheduleTDS3){S.paid.tds3=(I6.ScheduleTDS3.TDS3onOthThanSalDtls||[]).map(r=>back(r,true));read.push("Schedule TDS2 (Form 16B/16C/16D/16E)");}
  if(I6.ScheduleTCS){S.paid.tcs=(I6.ScheduleTCS.TCSDetails||[]).map(r=>{
    const det=r.EmployerOrDeductorOrCollectDetl||{};return {
    who:det.TCSCreditName||"S",tan:det.TAN||"",othPan:det.PANofOtherPerson||"",
    yr:nz(r.DeductedYr)+"",bf:nz(r.BroughtFwdTCSAmt),
    collOwn:nz(g(r,"TCSCurrFYDtls.TCSAmtCollOwnHands")),collOth:nz(g(r,"TCSCurrFYDtls.TCSAmtCollOthrHands")),
    claimOwn:nz(g(r,"TCSClaimedThisYearDtls.TCSAmtCollOwnHands")),
    claimOth:nz(g(r,"TCSClaimedThisYearDtls.TCSAmtCollOthrHands.TaxClaimedTCS")),
    claimOthPan:g(r,"TCSClaimedThisYearDtls.TCSAmtCollOthrHands.PANOfOthrPrsn")||""};});
    read.push("Schedule TCS");}
  if(I6.ScheduleIT){S.paid.it=(I6.ScheduleIT.TaxPayment||[]).map(c=>({
    bsr:c.BSRCode||"",dt:dmy(c.DateDep),sn:c.SrlNoOfChaln!=null?String(c.SrlNoOfChaln):"",amt:nz(c.Amt)}));
    read.push("advance / self-assessment tax");}
  return read;
}

/* ---- checks (screen validations only; department rules are Phase 6) ---- */
function chkPaid(){
  const out=[]; engPaid(); /* ensure row helpers set even if called stand-alone */
  const needYr=(rows,lbl)=>(rows||[]).forEach((r,i)=>{
    if(N(r.bf)>0 && DEDYR.indexOf(st0(r.yr))<0)
      out.push({lvl:"err",t:lbl+" row "+(i+1),m:"Unclaimed TDS brought forward is claimed but the financial year of deduction is not given.",sec:"paid"});});
  needYr(S.paid.tds2,"Schedule TDS1"); needYr(S.paid.tds3,"Schedule TDS2");
  const needTan=(rows,lbl)=>(rows||[]).forEach((r,i)=>{
    if((N(r.claimOwn)||N(r.dedOwn))&&!TAN_RE.test(st0(r.tan).toUpperCase()))
      out.push({lvl:"err",t:lbl+" row "+(i+1),m:"The deductor’s TAN is required and must be 4 letters, 5 digits, 1 letter.",sec:"paid"});});
  needTan(S.paid.tds2,"Schedule TDS1");
  (S.paid.tds3||[]).forEach((r,i)=>{
    if((N(r.claimOwn)||N(r.dedOwn))&&!PAN_RE.test(st0(r.pan).toUpperCase()))
      out.push({lvl:"err",t:"Schedule TDS2 row "+(i+1),m:"The buyer / tenant PAN is required (there is no TAN for 194IA/IB/M/S).",sec:"paid"});});
  const needOth=(rows,lbl)=>(rows||[]).forEach((r,i)=>{
    if(st0(r.who)==="O" && !(PAN_RE.test(st0(r.othPan).toUpperCase())||AADH.test(st0(r.othAadh))))
      out.push({lvl:"err",t:lbl+" row "+(i+1),m:"Credit relates to another person — give that person’s PAN or Aadhaar (rule 37BA(2)).",sec:"paid"});});
  needOth(S.paid.tds2,"Schedule TDS1"); needOth(S.paid.tds3,"Schedule TDS2");
  const needGross=(rows,lbl)=>(rows||[]).forEach((r,i)=>{
    if(N(r.claimOwn)>0 && !st0(r.head))
      out.push({lvl:"warn",t:lbl+" row "+(i+1),m:"TDS credit is claimed — please confirm the head of income under which the income is offered (rule A792).",sec:"paid"});});
  needGross(S.paid.tds2,"Schedule TDS1"); needGross(S.paid.tds3,"Schedule TDS2");
  (S.paid.tcs||[]).forEach((r,i)=>{
    if((N(r.claimOwn)||N(r.collOwn))&&!TAN_RE.test(st0(r.tan).toUpperCase()))
      out.push({lvl:"err",t:"Schedule TCS row "+(i+1),m:"The collector’s TAN is required (rule A804).",sec:"paid"});
    if(N(r.bf)>0 && DEDYR.indexOf(st0(r.yr))<0)
      out.push({lvl:"warn",t:"Schedule TCS row "+(i+1),m:"TCS brought forward is claimed but the year of collection is not given.",sec:"paid"});
    if(st0(r.who)==="O" && !PAN_RE.test(st0(r.othPan).toUpperCase()))
      out.push({lvl:"err",t:"Schedule TCS row "+(i+1),m:"Credit relates to another person — give that person’s PAN (rule 37i(1)).",sec:"paid"});});
  const over=(rows,lbl)=>(rows||[]).forEach((r,i)=>{if(r._over)
    out.push({lvl:"warn",t:lbl+" row "+(i+1)+" over-claimed",m:"Claimed "+RS(r._claimed)+" exceeds the "+RS(r._avail)+" deducted / collected and brought forward; carry-forward is held at zero.",sec:"paid"});});
  over(S.paid.tds2,"Schedule TDS1"); over(S.paid.tds3,"Schedule TDS2"); over(S.paid.tcs,"Schedule TCS");
  (S.paid.it||[]).forEach((c,i)=>{
    if(N(c.amt)&&!D(c.dt))
      out.push({lvl:"warn",t:"Challan "+(i+1),m:"An amount is entered but the date of deposit is missing or not DD/MM/YYYY — advance vs self-assessment cannot be decided.",sec:"paid"});
    if(N(c.amt)&&!BSR.test(st0(c.bsr).toUpperCase()))
      out.push({lvl:"warn",t:"Challan "+(i+1),m:"BSR code should be 7 characters (3 digits + 4 alphanumerics).",sec:"paid"});});
  const P=S.C.paid||{};
  if(P.paid>0)out.push({lvl:"ok",t:"Taxes paid",m:RS(P.paid)+" total — advance "+RS(P.adv)+", TDS "+RS(P.tds)+", TCS "+RS(P.tcs)+", self-assessment "+RS(P.sat)+".",sec:"paid"});
  return out;
}

   ITR-6 · Section "si" — Schedule SI (income chargeable at special rates)
   Built strictly from books/ITR-6/SI.md (never ITR-3's numbers/rows).
   Self-contained: state seed, engSi, secSi, expSi, impSi, chkSi and one
   reg() at the bottom. Compute order 46 — after the income heads
   (cg/os/bp) and after CYLA/BFLA, before the tax roll-up (~90).
   Structural template: forms/ITR-3/src/70_sec_si.js.

   THE COMPANY RETURN — what differs from ITR-3's SI:
   · No SPI, no IF here. On ITR-6 the SI sheet is the ONLY sheet in this
     section; it backs the single block ScheduleSI. (Schedule IF is a
     separate visible sheet in section "other"; the hidden IF fragment on
     the SI sheet, rows 108-115, is NOT part of Schedule SI — book §10.)
   · NOTHING is typed. Every income figure is fed from OS / CG / BP by the
     head's section code (book §2/§6). The filer's only input is the
     override switch EditAutopoulatedDetail (Yes unlocks manual edit).
   · The minimum-chargeable-to-tax walk is INERT for a company: THRESOLD

     Chargeable to Tax") EQUALS column H (income) on every row (book §5).
     There is NO resident basic-exemption set-off (that machinery is the
     individual/HUF utility's; a company has none). Column I is not a
     schema leaf — only H (SplRateInc) and J (SplRateIncTax) are filed.
   · The ₹1,25,000 s.112A exemption DOES apply, in the tax column only
     (book §5): ONE pool shared across own-112A (code 2A) then PTI-112A

     SEPARATE ₹1,25,000. It reduces the tax base J, not the income H.
   · Tax J = ROUND(income × rate/100) EXCEPT the three DTAA rows (treaty
     rate — the tax comes from the feed, book §4/A617/A618) and the three
     112A-@12.5% rows (base reduced by the exemption above).

   This head adds NOTHING to Gross Total Income (every rupee is already
   counted under CG/OS/BP) → S.C.si.income = 0. S.C.si.totInc feeds

/* sheet display-code → schema enum code (book §11) — applied to the fed
   maps and to a manually keyed row, so the filed SecCode is the enum
   spelling. r101/r102 VDA carry a copy-paste F-cell (PTI_5AC1b); their
   feeds are keyed by the correct enum 5BBH_BP/5BBH by their source
   sections (BP/CG), so no alias is needed for those two.                 */
const SI_CODE_ALIAS={
  STCGDTAA:"DTAASTCG", LTCGDTAA:"DTAALTCG", OSDTAA:"DTAAOS",
  "PTI_30%":"PTI_STCG30P", "PTI_20%":"PTI_STCG20P",
  "5AC1b":"5AC1abD", PTI_5AC1b:"PTI_5AC1abD", PTI_5A1b:"PTI_5A1bA"};
const siCanon=c=>SI_CODE_ALIAS[c]||c;

/* ---- classification sets (book §5, §7, and the tax section's needs) --- */
const C_112A_OWN="2A";                    /* row 20 — own 112A            */
const C_112A_PTI="PTI_LTCG12_5P112A";     /* row 63 — PTI-112A, shares pool */
const C_112A_SEP="5ADiiiP";               /* row 41 — separate ₹1,25,000  */
const SI_DTAA=["DTAASTCG","DTAALTCG","DTAAOS"];   /* treaty-rate tax (§4)  */
const siIsDTAA=c=>SI_DTAA.indexOf(c)>=0;
/* CG + dividend heads capped at 15% surcharge — a convenience the tax
   section reads (S.C.si.cgDivTax); the tax section still owns the cap. */
const SI_CGDIV=["1A","5AD1biip","21","22","21ciii","2A","5AB1b","5AC1c","5ADii",
  "5ADiii","5ADiiiP","PTI_STCG20P","PTI_STCG30P","PTI_LTCG12_5P112A","PTI_LTCG12_5P",
  "5A1ai","5A1aA","5AC1abD","5AD1iDiv","5AD1IBd",
  "PTI_5A1ai","PTI_5A1aA","PTI_5AC1abD","PTI_5AD1iDiv","PTI_5AD1IBd"];

/* ---- engine --------------------------------------------------------- */
/* Reads (all guarded — never throws on empty state). Each income section
   is expected to publish a feed map keyed by the schema SecCode:
     S.C.cg.siFeed  — the CG-fed heads (111A/112/112A/115AB/115AC/115AD
                      CG, STCG/LTCG-DTAA, all pass-through CG, 115BBH-CG)
     S.C.os.siFeed  — the OS-fed heads (115A/115AC/115AD-dividend family,
                      115BB/BBJ/BBA/BBE, patent-OS, carbon-OS, OS-DTAA,
                      every PTI_*-OS twin, 194LC/194LBA sub-cases)
     S.C.bp.siFeed  — the BP-fed heads (5B, 5BBF_BP, 5BBG_BP, 5BBH_BP)
   A feed value is either a number (income) or an object
   {inc, rate?, tax?}; a DTAA head supplies {inc, tax} (the treaty tax).
   If a sibling has not landed / published, the head is simply absent and
   SI stays inert (no throw). Codes are siCanon()-mapped so a display-code
   key still resolves to the schema enum.                                 */
function _siNorm(v){
  if(v==null)return null;
  if(typeof v==="object")return {inc:R(N(v.inc!=null?v.inc:v.income)),
    rate:(v.rate!=null&&v.rate!=="")?st0(v.rate):null,
    tax:(v.tax!=null&&v.tax!=="")?R(N(v.tax)):null};
  return {inc:R(N(v)),rate:null,tax:null};
}
function engSi(){
  const cg=(S.C.cg||{}), os=(S.C.os||{}), bp=(S.C.bp||{});
  const feeds={};                           /* code -> {inc,rate,tax,src} */
  const merge=(src,head)=>{if(!src||typeof src!=="object")return;
    Object.keys(src).forEach(k=>{const f=_siNorm(src[k]); if(!f)return;
      feeds[siCanon(k)]={inc:f.inc,rate:f.rate,tax:f.tax,src:head};});};
  merge(cg.siFeed,"cg"); merge(os.siFeed,"os"); merge(bp.siFeed,"bp");

  /* manual override (book §9 — EditAutopoulatedDetail unlocks the table) */
  if(S.si.edit==="Yes"){
    (S.si.rows||[]).forEach(r=>{if(!r||!r.code)return; const code=siCanon(r.code);
      feeds[code]={
        inc:R(N(r.inc)),
        rate:(r.rate!=null&&r.rate!=="")?st0(r.rate):(SI_RATE_DEF[code]||null),
        tax:(r.tax!=null&&r.tax!=="")?R(N(r.tax)):null,
        src:"man"};});
  }

  /* assemble rows in canonical sheet order (unknown codes appended) */
  const codes=Object.keys(feeds).sort((a,b)=>
    (SI_ORDER[a]==null?999:SI_ORDER[a])-(SI_ORDER[b]==null?999:SI_ORDER[b]));
  const rows=[];
  codes.forEach(code=>{const f=feeds[code];
    const rate=(f.rate!=null?f.rate:SI_RATE_DEF[code])||"";
    const inc=R(f.inc);
    if(inc===0)return;                       /* one row per head that carries income (book §12.1) */
    rows.push({code,rate:st0(rate),inc,tax:(f.tax!=null?R(f.tax):null),
      src:(f.src==="man"?"man":(SI_FEED[code]||f.src||""))});});

  /* ----- the ₹1,25,000 s.112A exemption (book §5, tax column only) ----
     P3 = MIN(125000, I20)         own 112A (2A)
     P5 = MIN(125000-P3, I63)      PTI-112A (PTI_LTCG12_5P112A)  [same pool]
     P6 = MIN(125000, I41)         115AD(1)(b)(iii) proviso (5ADiiiP) [separate] */
  let pool=125000, exOwn=0, exPti=0, exSep=0;
  const rOwn=rows.find(r=>r.code===C_112A_OWN);
  const rPti=rows.find(r=>r.code===C_112A_PTI);
  const rSep=rows.find(r=>r.code===C_112A_SEP);
  if(rOwn){exOwn=Math.min(pool,Math.max(0,rOwn.inc));pool-=exOwn;}
  if(rPti){exPti=Math.min(pool,Math.max(0,rPti.inc));pool-=exPti;}
  if(rSep){exSep=Math.min(125000,Math.max(0,rSep.inc));}
  const exemption112A=exOwn+exPti+exSep;

  /* ----- taxable income after Min-Chg adjust (col I) == income (col H)
     on ITR-6 (THRESOLD=0, book §5) — carried but inert. Then tax (col J). */
  let totInc=0, totCalc=0, totTax=0, tax112A=0, bbeInc=0, bbeTax=0,
      cgDivInc=0, cgDivTax=0, dtaaInc=0, dtaaTax=0;
  rows.forEach(r=>{
    r.taxable=r.inc;                          /* col I = col H (no min-chg reduction) */
    let base=r.inc;                           /* col J base */
    if(r.code===C_112A_OWN)      base=Math.max(0,r.inc-exOwn);
    else if(r.code===C_112A_PTI) base=Math.max(0,r.inc-exPti);
    else if(r.code===C_112A_SEP) base=Math.max(0,r.inc-exSep);
    if(siIsDTAA(r.code)){
      /* treaty rate — tax from the feed; fall back to base×rate only if
         the source did not supply it (A618 flags a null in checks). */
      r.tax=(r.tax!=null)?R(r.tax):R(base*N(r.rate)/100);
    }else{
      r.tax=R(base*N(r.rate)/100);            /* ROUND(H×G/100) with 112A base */
    }
    totInc+=r.inc; totCalc+=r.taxable; totTax+=r.tax;
    if(r.code===C_112A_OWN||r.code===C_112A_PTI||r.code===C_112A_SEP) tax112A+=r.tax;
    if(r.code==="5BBE"){bbeInc+=r.inc; bbeTax+=r.tax;}
    if(SI_CGDIV.indexOf(r.code)>=0){cgDivInc+=r.inc; cgDivTax+=r.tax;}
    if(siIsDTAA(r.code)){dtaaInc+=r.inc; dtaaTax+=r.tax;}});

  S.C.si={
    on:rows.length>0,
    rows,
    totInc:R(totInc),                         /* H106 → PartB-TI Sl.10 (SplRateInc) */
    totCalc:R(totCalc),                       /* I106 → PartB-TI Sl.14 (SplRateIncCalc; = income here) */
    totTax:R(totTax),                         /* J106 → PartB-TTI Sl.2b (TaxAtSpecialRates) */
    exemption112A:R(exemption112A),
    exOwn:R(exOwn), exPti:R(exPti), exSep:R(exSep),
    tax112A:R(tax112A),
    bbeInc:R(bbeInc), bbeTax:R(bbeTax),       /* 115BBE — flat 25% surcharge (tax section) */
    cgDivInc:R(cgDivInc), cgDivTax:R(cgDivTax),/* CG+dividend — 15% surcharge cap (tax section) */
    dtaaInc:R(dtaaInc), dtaaTax:R(dtaaTax),
    /* this head adds nothing to Gross Total Income — it re-presents
       income already counted under CG/OS/BP (book §1). */
    income:0};
}

/* =====================================================================
   RENDERER
   ===================================================================== */
function secSi(){
  const G=S.C.si||{}; let h="";

  h+='<div class="cgband">Schedule SI — income chargeable to tax at special rates</div>';
  h+=note("Income taxed at a special rate (please see instruction No. 7 for the rate). Every figure is picked up "+
    "automatically from Schedule OS, CG and BP by the head's section code — nothing is typed here. On a company the "+
    "\"minimum chargeable to tax\" adjustment does nothing, so column (ii) equals the income in column (i); tax in "+
    "column (iii) is rate × income, after the ₹1,25,000 section-112A exemption on the 112A / PTI-112A / 115AD-proviso heads.");

  const rows=G.rows||[];
  h+='<div class="full"><table class="gt" style="min-width:860px"><thead><tr>'+
     '<th class="l" style="width:40px">Sl.</th><th class="l" style="min-width:360px">Section</th>'+
     '<th style="width:80px">Rate (%)</th><th style="width:130px">Income (i)</th>'+
     '<th style="width:160px">Taxable after Min-Chg adj. (ii)</th><th style="width:130px">Tax thereon (iii)</th></tr></thead><tbody>';
  if(!rows.length)h+='<tr><td class="emp" colspan="6">No special-rate income — Schedule SI has nothing to show.</td></tr>';
  rows.forEach((r,i)=>{h+='<tr><td class="l">'+(i+1)+'</td>'+
    '<td class="l">'+esc(siLabel(r.code))+
      (r.src==="man"?'<span class="dt">manually edited</span>':
        (r.src?'<span class="dt">from Schedule '+esc(String(r.src).toUpperCase())+'</span>':''))+'</td>'+
    '<td class="num">'+(r.rate?esc(r.rate):"—")+(siIsDTAA(r.code)?'<span class="dt">treaty</span>':'')+'</td>'+
    '<td class="num">'+cell(r.inc)+'</td><td class="num">'+cell(r.taxable)+'</td>'+
    '<td class="num">'+cell(r.tax)+'</td></tr>';});
  h+='</tbody><tfoot><tr><td class="l" colspan="3">Total (row 106)</td>'+
     '<td>'+F(G.totInc||0)+'</td><td>'+F(G.totCalc||0)+'</td><td>'+F(G.totTax||0)+'</td></tr></tfoot></table></div>';

  if(R(G.exemption112A)>0)h+=note("₹"+F(G.exemption112A)+" of section-112A exemption applied in the tax column — "+
    "one ₹1,25,000 shared across own-112A then PTI-112A"+(R(G.exSep)>0?", and a separate ₹1,25,000 on the 115AD(1)(b)(iii) proviso head":"")+".");

  /* override switch — book r116 "Do you want to edit the details auto-populated…" */
  h+=row("Do you want to edit the details auto-populated in the table above?",
    sel("si.edit",[["Yes","Yes"],["No","No"]],{blank:false}),{ref:"r116",hint:"EditAutopoulatedDetail"});
  if(S.si.edit==="Yes"){
    h+=note("Override the auto-populated table — add or correct a special-rate head. Pick the section and its rate, "+
      "enter the income; a row here replaces the fed figure for the same section. For a DTAA head, also enter the "+
      "treaty tax (the tax is at the treaty rate, not income × 1%). The ₹1,25,000 section-112A adjustment is applied automatically.");
    h+=grid("si.rows",[
      {h:"Section",k:"code",t:"sel",opts:SI_CODE_OPTS,req:1},
      {h:"Rate (%)",k:"rate",t:"sel",opts:SI_RATES.map(x=>[x,x])},
      {h:"Income",k:"inc",t:"num",req:1},
      {h:"Treaty tax (DTAA only)",k:"tax",t:"num"}],
      S.si.rows||[],
      {min:"760px",empty:"No manual special-rate head added.",add:"Add / override a special-rate head"});
  }

  return h;
}

/* =====================================================================
   EXPORT — ScheduleSI (book §8/§12). Written only when a head carries
   income; totals present even at zero within the block. Column I
   (SplRateIncCalc) has no schema leaf and is not filed.
   ===================================================================== */
function expSi(j){
  const G=S.C.si||(engSi(),S.C.si)||{};
  const rows=(G.rows||[]).filter(r=>r.code&&N(r.inc));
  if(!rows.length){
    if(S.si.edit==="Yes"){ j.ScheduleSI={TotSplRateInc:0,TotSplRateIncTax:0,EditAutopoulatedDetail:"Y"}; }
    return;                                   /* no special income → omit the block (book §8) */
  }
  const SI={
    TotSplRateInc:n0(G.totInc),               /* H106 */
    TotSplRateIncTax:n0(G.totTax),            /* J106 */
    SplCodeRateTax:rows.map(r=>({
      SecCode:r.code,                          /* already the schema enum (SI_CODE_ALIAS applied at feed) */
      SplRatePercent:N(r.rate),
      SplRateInc:n0(r.inc),                    /* column H */
      SplRateIncTax:n0(r.tax)}))};             /* column J */
  SI.EditAutopoulatedDetail=(S.si.edit==="Yes")?"Y":"N";
  j.ScheduleSI=SI;
}

/* =====================================================================
   IMPORT — the inverse (round-trip identity). The fed heads are
   re-derived from OS/CG/BP each compute; a returned SI is read back into
   the manual-override rows only when EditAutopoulatedDetail = Y (the
   filer had edited it), so re-export reproduces the same SplCodeRateTax.
   ===================================================================== */
function impSi(I6){
  const read=[]; const si=I6.ScheduleSI; if(!si)return read;
  S.si.edit=(si.EditAutopoulatedDetail==="Y")?"Yes":(si.EditAutopoulatedDetail==="N"?"No":S.si.edit);
  if(S.si.edit==="Yes"&&Array.isArray(si.SplCodeRateTax)){
    S.si.rows=si.SplCodeRateTax.map(r=>{
      const code=r.SecCode, rate=r.SplRatePercent!=null?String(r.SplRatePercent):"";
      const o={code,rate,inc:nz(r.SplRateInc)};
      /* keep the treaty tax for a DTAA head so the round-trip is identity */
      if(siIsDTAA(code)&&r.SplRateIncTax!=null)o.tax=nz(r.SplRateIncTax);
      return o;});
  }
  read.push("Schedule SI (income at special rates)");
  return read;
}

/* =====================================================================
   CHECKS — the section's own screen validations (not the department
   rules; those are Phase 6). Regime-agnostic — a company has one regime.
   ===================================================================== */
function chkSi(){
  const out=[]; const G=S.C.si||(engSi(),S.C.si)||{};
  const add=(lvl,t,m)=>out.push({lvl,t,m,sec:"si"});

  (G.rows||[]).forEach(r=>{
    if(N(r.inc)&&!N(r.rate)&&!siIsDTAA(r.code))
      add("err","Special rate missing","The head \""+siLabel(r.code)+"\" has income of ₹"+F(r.inc)+" but no rate.");
    /* A618 — a DTAA row's tax cannot be null when its income > 0 */
    if(siIsDTAA(r.code)&&N(r.inc)>0&&!(N(r.tax)>0))
      add("warn","DTAA tax not entered","\""+siLabel(r.code)+"\" carries income of ₹"+F(r.inc)+
        " but no treaty tax. For a DTAA head the tax is at the treaty rate — set \"Do you want to edit…\" to Yes and enter it.");
  });

  /* total tax cross-check */
  if((G.rows||[]).length){
    const sumTax=(G.rows||[]).reduce((a,r)=>a+N(r.tax),0);
    if(Math.abs(sumTax-N(G.totTax))>1)
      add("err","Schedule SI total","Total tax at special rates (row 106) must equal the sum of the rows.");
  }

  if((G.totTax||0)>0)add("ok","Tax at special rates","₹"+F(G.totTax)+" of tax at special rates, added to the normal-rate tax in Part B-TTI (Sl. 2b).");
  if((G.exemption112A||0)>0)add("ok","Section-112A exemption","₹"+F(G.exemption112A)+" of the ₹1,25,000 section-112A exemption applied.");
  return out;
}

/* ---- register (overrides the boot stub) ----------------------------- */
reg({id:"si", t:"Special-rate income", ref:"Schedule SI",
  f:secSi, s:()=>{const G=S.C.si||{};
    return (G.totTax?RS(G.totTax)+" special-rate tax":(G.on?"disclosed":""));},
  eng:engSi, exp:expSi, imp:impSi, chk:chkSi, order:46, corder:46});

/* =====================================================================
   ITR-6 · Section "tax" (order 90) — Part B roll-up (the COMPANY return).
   Books: books/ITR-6/PARTB_TI_TTI.md, Tax.md (the hidden computation
          sheet), MAT.md / MATC.md (the 115JB / 115JAA interplay), SI.md,
          CYLA_BFLA.md / CFL.md, VIA.md, rules.json (716-745, 755-784).
   Schema blocks OWNED here: "PartB-TI" (hyphen) + "PartB_TTI" (underscore),
          and the hidden "Tax" computation-method sheet (read, not filed).
   NOT owned here (the `bank` section owns them, per phase-4 notes):
          PartB_TTI.Refund.* (BankDtlsFlag, AddtnlBankDetails[],
          ForeignBankDetails[], RefundDue) and AssetOutsideIndiaFlg —
          those are sourced from this sheet's rows 91-121 by `bank`, which
          reads the refund figure this engine publishes as S.C.int.refund.

   This is the Part B roll-up: it reads every income head via S.C.<head>,
   aggregates to Gross Total Income (item 9 = 7 − 8, INCLUDING special-rate
   income — the ITR-5 GTI bug was dropping it; loss totals come from
   S.C.loss.cylaTotal / bflaTotal), subtracts Chapter VI-A and 10AA
   (S.C.ded, each capped at 9 − item14), rounds Total Income to the nearest
   ten, then computes the CORPORATE tax: the 25/30/22/15 % domestic ladder
   (35 % foreign) with the 115BAA eligibility gate, company surcharge
   (7/12 % domestic, 2/5 % foreign) with marginal relief, a flat 25 %
   surcharge on 115BBE income, cess at 4 %, the MAT (115JB) interplay
   (gross tax = higher of normal 2f and MAT 1d, read as S.C.mat.tax1d),
   MAT credit (115JAA, computed here from S.C.matc.totBF, only when 2f > 1d),
   tax relief (Schedule TR),
   and 234A/234B/234C interest + 234F/234-I fees. It SETS the footer
   contract S.C.{gti, ti, tax, int}. There is NO salary head (Part B-TI
   opens at house property, item 1), NO basic exemption, NO 87A rebate,
   NO section 89 — this is a company.
   Rule 2 (CLAUDE.md): every figure/formula is ITR-6's own (Tax / PARTB
   sheets); nothing is ported from ITR-3. Every cross-read is guarded.
   ===================================================================== */

/* ---- state (my namespace S.tax — only my own typed inputs live here) ---- */
S.tax = S.tax || {};

/* ---- guarded multi-path state getter (returns the first non-empty) ---- */
function taxGet(){ for(var i=0;i<arguments.length;i++){var o=S,ok=true;
  var ks=String(arguments[i]).split("."); for(var j=0;j<ks.length;j++){ if(o==null){ok=false;break;} o=o[ks[j]]; }
  if(ok&&o!=null&&o!=="")return o; } return undefined; }

/* ---- resolve the Part A-General tax drivers (guarded — a company return) ----
   These are user inputs OWNED by the who/gen sections (PartA_GEN1.FilingStatus
   / OrgFirmInfo). The Tax sheet only reads them (Tax.md §1):
   - DomesticCompFlg  → Status_Dom_Foreign (MID(...,1,1)="Y" domestic)
   - Section115BA / Section115CurrAY → Check_115BA (115BA/115BAA/115BAB/"")
   - GrossReceipt (>400cr FY23-24?) → _Per25 (MID(...,1,1)="N" → small co. 25%)
   Consumed (in order) from computed publishes then raw state; the CEO wires
   the seam if the who/gen field names differ. Default: domestic, no option,
   turnover unknown → 30 % (the ELSE branch of the ladder). */
function taxDrivers(){
  var domVal = taxGet("C.who.domestic","C.gen.domestic","who.domestic","who.domesticFlg",
    "gen.domestic","pi.domestic");
  var domestic = (domVal==null) ? true                           /* default: a domestic company */
    : (typeof domVal==="boolean") ? domVal                       /* engWho publishes S.C.who.domestic as a BOOLEAN (who.js:84) */
    : st0(domVal).charAt(0).toUpperCase()==="Y";                 /* tolerate a raw "Y"/"N" input */
  var secRaw = st0(taxGet("C.gen.sec115","C.who.sec115","who.sec115","who.section115","who.opt115",
    "who.Section115CurrAY","who.Section115BA","fs.sec115","gen.sec115")||"");
  var s = secRaw.replace(/[^0-9A-Za-z]/g,"").toUpperCase();
  var sec = /115BAB/.test(s)?"115BAB": /115BAA/.test(s)?"115BAA": /115BA/.test(s)?"115BA":"";
  if(!domestic) sec="";                                          /* rule 9-10: a foreign co. cannot opt */
  var grRaw = st0(taxGet("C.gen.gr400","C.who.gr400","who.grossReceipt","who.gr400","who.turnover400",
    "who.GrossReceipt","gen.grossReceipt","fs.grossRcpt","fs.grossReceipt")||"");
  var per25small = grRaw.charAt(0).toUpperCase()==="N";          /* "No, ≤400cr" → 25 % small company */
  var sec92E = st0(taxGet("C.gen.sec92E","who.sec92E","gen.sec92E","gen.liable92E",
    "fs.sec92E")||"").charAt(0).toUpperCase()==="Y";             /* TP audit → 30-Nov due date */
  return {domestic:domestic, sec:sec, per25small:per25small, sec92E:sec92E};
}

/* ---- the 115BAA eligibility gate (Tax!D65) ----
   If ANY of the listed incentives is claimed, the concessional 22 % is
   withdrawn and 30 % applies: additional depreciation, 10AA/SEZ, 35AD,
   32AD, ESR (35/35CCC/35CCD weighted), and Part-C Chapter VI-A other than
   80JJAA / 80M (80M survives, phase-4 notes). Guarded; if nothing is
   detected the concession stands (the rules phase refines). */
function taxIncentiveClaimed(){
  var BP=(S.C.bp||{}), DED=(S.C.ded||{});
  var addlDep=N(BP.addlDep!=null?BP.addlDep:(BP.additionalDep||0));
  var d10AA=N(DED.us10AA!=null?DED.us10AA:(DED.ded10AA||0));
  var d35AD=N(BP.ded35AD!=null?BP.ded35AD:(DED.ded35AD||0));
  var d32AD=N(BP.ded32AD||0);
  var esr=N(BP.esr!=null?BP.esr:(BP.esr35||0));
  /* Part-C VI-A net of 80JJAA + 80M (80M survives 115BAA — notes) */
  var partC=N(DED.partC!=null?DED.partC:(DED.PartCchapterVIA||0));
  var d80JJAA=N(DED.d80JJAA||0), d80M=N(DED.d80M||0);
  var partCNet=Math.max(0, partC - d80JJAA - d80M);
  return (addlDep+d10AA+d35AD+d32AD+esr+partCNet)>0;
}

/* ---- the corporate tax ladder (Tax.md §1, cell C4) ---- */
function taxRateInfo(dr){
  if(!dr.domestic) return {rate:0.35, kind:"foreign", label:"Foreign company · 35%"};
  if(dr.sec==="115BAA"){
    if(taxIncentiveClaimed()) return {rate:0.30, kind:"115BAA-withdrawn",
      label:"115BAA withdrawn (incentive claimed) · 30%"};
    return {rate:0.22, kind:"115BAA", label:"Section 115BAA · 22%"};
  }
  if(dr.sec==="115BAB") return {rate:0.22, kind:"115BAB", label:"Section 115BAB · 15% mfg / 22% balance"};
  if(dr.sec==="115BA")  return {rate:0.25, kind:"115BA",  label:"Section 115BA · 25%"};
  if(dr.per25small)     return {rate:0.25, kind:"small",  label:"Domestic (turnover ≤ ₹400 cr) · 25%"};
  return {rate:0.30, kind:"domestic", label:"Domestic company · 30%"};
}
/* corporate tax on a normal-rate income (2a), with the 115BAB manufacturing split */
function taxCorpTax(normalInc, ri, bab15){
  normalInc=Math.max(0,R(normalInc));
  if(ri.kind==="115BAB"){
    var mfg=Math.max(0,Math.min(R(bab15||0),normalInc));         /* 15 % manufacturing */
    return R(mfg*0.15 + (normalInc-mfg)*0.22);                   /* 22 % balance */
  }
  return R(normalInc*ri.rate);
}

/* ---- company surcharge on the normal computation (Tax.md §3), with
   marginal relief. Returns the two surcharge parts (2di flat-25 on 115BBE,
   never relieved; 2dii tiered on the rest, relieved). `taxAtTIfn(x)` gives
   the corporate tax if total income were x (bbe tax held constant). ---- */
function taxCoSurcharge(ti, tax2c, bbeTax, dr, taxAtTIfn){
  var rate = ti>100000000?(dr.domestic?0.12:0.05): ti>10000000?(dr.domestic?0.07:0.02):0;
  var surI = R(Math.max(0,bbeTax)*0.25);                          /* 2di — flat 25 %, never relieved */
  var restTax = Math.max(0, tax2c - bbeTax);
  var surII = R(restTax*rate);
  var mr=0;
  if(rate>0){
    var th   = ti>100000000?100000000:10000000;
    var lower= ti>100000000?(dr.domestic?0.07:0.02):0;            /* surcharge of the tier BELOW */
    var taxAtTh = R(taxAtTIfn(th));
    var restAtTh= Math.max(0, taxAtTh - bbeTax);
    var surAtTh = R(restAtTh*lower);
    var hereLiab= tax2c + surII;                                  /* excl. the flat 115BBE surcharge */
    var thLiab  = taxAtTh + surAtTh + (ti - th);
    mr = Math.max(0, hereLiab - thLiab);
    surII = Math.max(0, surII - mr);
  }
  return {surI:surI, surII:R(surII), rate:rate, mr:R(mr)};
}
/* company surcharge on the MAT computation (Tax.md §4, SurchargeMAT = C20) */
function taxMatSurcharge(deemedTI, matTax, dr){
  var rate = deemedTI>100000000?(dr.domestic?0.12:0.05): deemedTI>10000000?(dr.domestic?0.07:0.02):0;
  var sur=R(matTax*rate), mr=0;
  if(rate>0){
    var th   = deemedTI>100000000?100000000:10000000;
    var lower= deemedTI>100000000?(dr.domestic?0.07:0.02):0;
    var matTaxAtTh = R(th*0.15);                                  /* MAT rate 15 % on the cut-off income */
    var surAtTh = R(matTaxAtTh*lower);
    mr = Math.max(0, (matTax+sur) - (matTaxAtTh+surAtTh) - (deemedTI-th));
    sur = Math.max(0, sur-mr);
  }
  return {sur:R(sur), rate:rate, mr:R(mr)};
}

/* the advance-tax instalment cut-offs (Schedule IT dates): 15 Jun · 15 Sep ·
   15 Dec · 15 Mar; the 17-31 Mar slot is the fifth (Tax.md §7, R3-R7) */
const TAX_Q_CUT=[new Date(2025,5,15),new Date(2025,8,15),new Date(2025,11,15),new Date(2026,2,15)];

/* =====================================================================
   the engine — the whole Part B roll-up and the S.C tax contract
   ===================================================================== */
function engTax(){
  var dr = taxDrivers();
  var ri = taxRateInfo(dr);

  /* ===== income heads (Part B-TI 1-4), each read via S.C.<head> (guarded) ===== */
  var HP=(S.C.hp||{}), BP=(S.C.bp||{}), CG=(S.C.cg||{}), OS=(S.C.os||{});

  /* item 1 — house property (no salary head): MAX(0, HP total) (L5) */
  var item1=Math.max(0, R(HP.income!=null?HP.income:(HP.total||0)));

  /* item 2 — profits and gains of business or profession (J7-L13) */
  var b2i =Math.max(0, R(BP.noSpec!=null?BP.noSpec:(BP.income||0)));         /* 2i  A38 non-spec */
  var b2ia=Math.max(0, R(BP.raw10TIA!=null?BP.raw10TIA:(BP.foreignDiamond||0)));/* 2ia raw diamonds 10TIA */
  var b2ii=Math.max(0, R(BP.spec||0));                                       /* 2ii speculative */
  var b2iii=Math.max(0, R(BP.specified||0));                                 /* 2iii specified */
  var b2iv=Math.max(0, R(BP.spl!=null?BP.spl:(BP.splRate||0)));              /* 2iv special-rate (115BBF/G/H + BP) */
  var b2v =Math.max(0, b2i+b2ia+b2ii+b2iii+b2iv);                            /* 2v total (nil if the sum is a loss) */

  /* item 3 — capital gains (J17-L30) */
  var st20=Math.max(0,R(CG.st20||0)), st30=Math.max(0,R(CG.st30||0)),
      stApp=Math.max(0,R(CG.stApp||0)), stDTAA=Math.max(0,R(CG.stDTAA||0));
  var lt125=Math.max(0,R(CG.lt125||0)), ltDTAA=Math.max(0,R(CG.ltDTAA||0));
  var totST=CG.shortTerm!=null?Math.max(0,R(CG.shortTerm)):(st20+st30+stApp+stDTAA);  /* 3av */
  var totLT=CG.longTerm !=null?Math.max(0,R(CG.longTerm)) :(lt125+ltDTAA);            /* 3biii */
  var cg3c =CG.stlt!=null?Math.max(0,R(CG.stlt)):Math.max(0,totST+totLT);             /* 3c */
  var cgC2 =R(CG.C2!=null?CG.C2:(CG.cg115BBH||0));                                     /* 3d 115BBH @30 % */
  var cg3e =Math.max(0, cg3c+cgC2);                                                    /* 3e total */

  /* item 4 — other sources (J32-L35) */
  var os4a=Math.max(0, R(OS.normal!=null?OS.normal:(OS.six!=null?OS.six:(OS.income||0))));/* 4a normal */
  var os4b=R(OS.special!=null?OS.special:(OS.splRate||0));                              /* 4b special rate */
  var os4c=Math.max(0, R(OS.raceHorse!=null?OS.raceHorse:((OS.horse||{}).bal||0)));     /* 4c race horses */
  var os4d=Math.max(0, os4a+os4b+os4c);                                                 /* 4d total */

  /* item 5 — total of head-wise income (1 + 2v + 3e + 4d) (L36) */
  var item5=R(item1 + b2v + cg3e + os4d);

  /* ===== loss set-off (S.C.loss, guarded) — items 6, 8; item 7, 9 (L37-L40) ===== */
  var L=(S.C.loss||{});
  var cyla=R(L.cylaTotal!=null?L.cylaTotal:((L.totHPset||0)+(L.totBusset||0)+(L.totOSset||0)));/* 6 */
  var item7=Math.max(0, item5 - cyla);                                       /* 7 balance after CY set-off */
  var bfla=R(L.bfSetoffTotal!=null?L.bfSetoffTotal:((L.totBFset||0)+(L.totDep||0)+(L.tot35||0)));/* 8 = BFLA set-off total 2xv+3xv+4xv */
  /* item 9 GROSS TOTAL INCOME = 7 − 8. It INCLUDES special-rate income —
     item5 already carries every head (b2iv, cgC2, os4b, 3d), so do NOT
     subtract special-rate income here (the ITR-5 GTI bug). (L40) */
  var gti=Math.max(0, item7 - bfla);

  /* ===== special-rate income (Schedule SI) — items 10 & 14 (L41 / L48) ===== */
  var SI=(S.C.si||{});
  var splInc =Math.max(0, R(SI.totInc!=null?SI.totInc:(SI.TotSplRateInc||0)));          /* 10 (Σ SplRateInc) */
  var splCalc=Math.max(0, R(SI.totIncCalc!=null?SI.totIncCalc:splInc));                 /* 14 (Σ SplRateIncCalc) */

  /* ===== Chapter VI-A + 10AA (S.C.ded, guarded) — items 11, 12 (J43-L46) =====
     11a/11b/11c and 12 are each capped so they cannot be set against
     special-rate income: MIN(…, GTI − IncChargeableTaxSplRates). */
  var DED=(S.C.ded||{});
  var viaPartB=Math.max(0, R(DED.partB!=null?DED.partB:(DED.PartBchapterVIA||0)));
  var viaPartC=Math.max(0, R(DED.partC!=null?DED.partC:(DED.PartCchapterVIA||0)));
  var viaCap=Math.max(0, gti - splCalc);
  var viaTot=Math.max(0, Math.min(viaPartB+viaPartC, viaCap));               /* 11c */
  var us10AA=Math.max(0, Math.min(R(DED.us10AA!=null?DED.us10AA:(DED.ded10AA||0)),
                                  Math.max(0, gti - splCalc - viaTot)));      /* 12 */

  /* item 13 — Total income = round-to-ten of MAX(0, GTI − 11c − 12) (§288B, L47) */
  var ti=Math.max(0, Math.round((gti - viaTot - us10AA)/10)*10);

  /* item 15 — income at normal rates = MAX(0, TotalIncome − item10) (L49) */
  var normalInc=Math.max(0, ti - splInc);

  /* item 16 — net agricultural income for rate (Schedule EI 2v) (L50) */
  var agri=Math.max(0, R((S.C.ei||{}).net2v!=null?(S.C.ei||{}).net2v:((S.C.ei||{}).netAgri||0)));

  /* item 17 — current-year losses carried forward (Schedule CFL xxi) (L51) */
  var cf=R(L.curTotal!=null?L.curTotal:((L.cf&&L.cf.total)||0));            /* Sch CFL row xxi = current-year total */

  /* item 18 — deemed total income u/s 115JB (Schedule MAT item 9) (L52);
     0 if 115BAA/115BAB is opted (rule 674) */
  var MAT=(S.C.mat||{});
  var matBlocked = (ri.kind==="115BAA"||ri.kind==="115BAB");    /* concessional regime shuts MAT off */
  var deemedTI = matBlocked?0:Math.max(0, R(MAT.deemedTI!=null?MAT.deemedTI:(MAT.total9!=null?MAT.total9:(MAT.deemed||0))));

  /* ===== Part B-TTI 2 — tax on total income (the corporate ladder) ===== */
  var bab15=N(BP.bab15!=null?BP.bab15:(BP.mfg115BAB||0));       /* 115BAB manufacturing income */
  var splTax=R(SI.totTax!=null?SI.totTax:(SI.TotSplRateIncTax||0));           /* 2b — SI col (ii) */
  var bbeInc=Math.max(0,R(SI.bbeInc!=null?SI.bbeInc:(SI.inc115BBE||0)));
  var bbeTax=Math.max(0,R(SI.bbeTax!=null?SI.bbeTax:(SI.tax115BBE||0)));      /* 115BBE tax, for 2di */
  var tax2a=taxCorpTax(normalInc, ri, bab15);                                 /* 2a */
  var tax2c=Math.max(0, R(tax2a + splTax));                                   /* 2c = 2a + 2b (L62) */

  /* 2d — surcharge (2di flat 25 % on 115BBE, 2dii tiered + marginal relief) */
  var taxAtTIfn=function(x){ return taxCorpTax(Math.max(0,x-splInc), ri, bab15) + splTax; };
  var scg=taxCoSurcharge(ti, tax2c, bbeTax, dr, taxAtTIfn);
  var sur=Math.max(0, scg.surI + scg.surII);                                  /* 2diii */
  var cess=R((tax2c+sur)*0.04);                                              /* 2e — 4 % */
  var grossTaxLiability=R(tax2c + sur + cess);                                /* 2f (L68) */

  /* ===== Part B-TTI 1 — tax on the deemed income u/s 115JB (MAT) =====
     The MAT tax total (1d = base + surcharge + cess) is OWNED by engMat and
     read here as S.C.mat.tax1d (MAT seam contract). The 1a/1b/1c breakdown is
     recomputed locally for the on-screen rows and as a guarded fallback for
     1d when engMat has not yet published tax1d; both use the same domestic
     15 % + 7 %/12 % + 4 % ladder, so they agree. */
  var mat1a = matBlocked?0:Math.max(0, R(MAT.tax!=null?MAT.tax:(MAT.taxUs115JB||0)));   /* 1a — MAT item 10 (15 % base) */
  var mscg = matBlocked?{sur:0,rate:0,mr:0}:taxMatSurcharge(deemedTI, mat1a, dr);       /* 1b */
  var mat1b = mscg.sur;
  var mat1c = matBlocked?0:R((mat1a+mat1b)*0.04);                                       /* 1c — cess 4 % */
  var mat1dLocal = matBlocked?0:R(mat1a+mat1b+mat1c);                                   /* local 1d (fallback) */
  var mat1d = matBlocked?0:R(MAT.tax1d!=null?MAT.tax1d:mat1dLocal);                     /* 1d = S.C.mat.tax1d (MAT seam) */

  /* ===== Part B-TTI 3 — gross tax payable = higher of 2f and MAT 1d (rule 768) ===== */
  var grossTaxPayable=Math.max(grossTaxLiability, mat1d);

  /* ===== Part B-TTI 4 — 115JAA MAT credit set-off, computed HERE (MATC item 5) =====
     Only when the normal gross tax (2f) exceeds the MAT (1d); capped at the
     headroom (2f − 1d) and at the MAT credit brought forward and available
     (Schedule MATC ΣB3 = S.C.matc.totBF), rule 773. Not read from
     S.C.mat.credit — that seam is retired. */
  var availCredit115JAA=Math.max(0, N((S.C.matc||{}).totBF));                 /* MATC brought-forward credit (input-derived) */
  var matCredit=(grossTaxLiability>mat1d)?Math.max(0, R(Math.min(availCredit115JAA, grossTaxLiability-mat1d))):0;/* rule 773 */
  var afterCredit=Math.max(0, grossTaxPayable - matCredit);                   /* item 5 (L71) */

  /* ===== Part B-TTI 6 — tax relief (Schedule TR): 90/90A + 91 ===== */
  var FA=(S.C.fa||{});
  var rel90=R(FA.dtaa!=null?FA.dtaa:(FA.section90||0));                        /* 6a — TR Sl.2 */
  var rel91=R(FA.notDtaa!=null?FA.notDtaa:(FA.section91||0));                  /* 6b — TR Sl.3 */
  var relief=Math.max(0, R(rel90+rel91));                                      /* 6c */
  var net=Math.max(0, R(afterCredit - relief));                               /* item 7 net tax liability (L76) */

  /* ===== taxes paid (S.C.paid, guarded) ===== */
  var P=(S.C.paid||{});
  var adv=R(P.adv||0), tds=R(P.tds||0), tcs=R(P.tcs||0), sat=R(P.sat||0);
  var paidTot=R(P.total!=null?P.total:(P.paid!=null?P.paid:(adv+tds+tcs+sat)));/* 10e */

  /* ===== interest & fee (the hidden Tax sheet, Tax.md §7) ===== */
  var dueDate = dr.sec92E ? new Date(2026,10,30) : (D(dmy(S.fs.duedate))||DUE);/* 30-Nov if 92E, else 31-Oct */
  var filed=D(S.fs.filed);
  var late=!!(filed && filed>dueDate);
  var IT=Array.isArray((S.paid||{}).it)?S.paid.it:(Array.isArray(S.it)?S.it:[]);
  var isSAT=function(c){var d=D(c.dt);return d?d>YREND:false;};
  var upto=function(d){return IT.filter(function(c){return !isSAT(c)&&D(c.dt)&&D(c.dt)<=d;})
    .reduce(function(a,c){return a+N(c.amt);},0);};

  /* 234A (N18): 1 %/month on MAX(net − adv − tds − tcs, 0), principal floored to 100 */
  var p234a=Math.max(0, net-adv-tds-tcs); if(p234a>100)p234a=Math.floor(p234a/100)*100;
  var m234a=late?MPART(dueDate,filed):0;
  var i234a=R(p234a*0.01*m234a);

  /* 234F late-filing fee (companies): ₹5,000; ₹1,000 if total income ≤ ₹5 lakh */
  var f234f=late?(ti<=500000?1000:5000):0;

  /* 234-I revised-return fee (rules 783/784): if filed after 31-12-2026 u/s 139(5),
     ₹1,000 when TI ≤ ₹5 lakh else ₹5,000. Gated on a revised-return indicator. */
  var revised=/revis|139\s*\(?5/i.test(st0(taxGet("fs.retType","fs.revised","fs.sec")))||(+S.fs.sec===17);
  var f234i=(revised && filed && filed>new Date(2026,11,31))?(ti<=500000?1000:5000):0;

  /* 234C (five quarter buckets; MATC-higher path uses the MAT tax as the base) */
  var matHigher=mat1d>grossTaxLiability;
  var base234c=matHigher?mat1d:net;
  var gate234c=base234c>=10000;
  var paidIn5=IT.filter(function(c){return !isSAT(c)&&D(c.dt)&&D(c.dt)>TAX_Q_CUT[3]&&D(c.dt)<=YREND;})
    .reduce(function(a,c){return a+N(c.amt);},0);
  var QDEF=[[0.15,0.12,3],[0.45,0.36,3],[0.75,null,3],[1,null,1]];            /* target, safe-harbour, months */
  var qs=QDEF.map(function(q,k){var pc=q[0],safe=q[1],mo=q[2];
    var b=Math.max(0, base234c - tds - tcs - relief);
    var need=R(b*pc), got=R(upto(TAX_Q_CUT[k]));
    var sh=(safe!==null && got>=Math.floor(b*safe/100)*100)?0:Math.floor(Math.max(0,need-got)/100)*100;
    if(!gate234c)sh=0;
    return {need:need, got:got, short:sh, mo:mo, int:R(sh*0.01*mo)};});
  var i234c=R(qs.reduce(function(a,q){return a+q.int;},0));

  /* 234B (N17): assessed = net − (tds + tcs); if advance < 90 %, 1 %/month Apr→filing */
  var assessed=net-tds-tcs, i234b=0;
  if(assessed>=10000 && net>=10000 && adv<0.9*assessed){
    var principal=Math.floor(Math.max(0, net-adv-tds-tcs)/100)*100;
    var end=filed||new Date();
    var months=Math.min(30, MPART(new Date(2026,3,1),end)||1);
    i234b=R(principal*0.01*months);
  }

  /* ===== the closing lines (§288B rounding) ===== */
  var intTotal=R(i234a+i234b+i234c+f234f+f234i);                              /* 8e (L83) */
  var aggregate=R(net + intTotal);                                            /* item 9 — nearest rupee (L84) */
  var bal=aggregate - paidTot;
  var balance=Math.round(Math.max(0, bal)/10)*10;                            /* item 11 — nearest ten (L91) */
  var refund =Math.round(Math.max(0,-bal)/10)*10;                           /* item 12 — nearest ten (L92) */

  /* 115TD adjustment (items 13-15) — Schedule 115TD net payable (S.C.other) */
  var net115TD=Math.max(0, R((S.C.other||{}).td115Net!=null?(S.C.other||{}).td115Net:((S.C.other||{}).net115TD||0)));
  var payable115TD=net115TD>refund?(net115TD-refund):0;                       /* 14 */
  var netRefund=refund>net115TD?(refund-net115TD):0;                          /* 15 */

  /* ===== publish the S.C contract (footer + the MATC seam) ===== */
  S.C.gti=R(gti);
  S.C.ti=R(ti);
  S.C.tax={
    regime:ri.label, rebate:0,                                               /* footer contract */
    dr:dr, ri:ri,
    item1:item1, b2i:b2i, b2ia:b2ia, b2ii:b2ii, b2iii:b2iii, b2iv:b2iv, b2v:b2v,
    st20:st20, st30:st30, stApp:stApp, stDTAA:stDTAA, totST:totST,
    lt125:lt125, ltDTAA:ltDTAA, totLT:totLT, cg3c:cg3c, cgC2:cgC2, cg3e:cg3e,
    os4a:os4a, os4b:os4b, os4c:os4c, os4d:os4d,
    item5:item5, cyla:cyla, item7:R(item7), bfla:bfla, splInc:splInc, splCalc:splCalc,
    viaPartB:viaPartB, viaPartC:viaPartC, viaTot:viaTot, us10AA:us10AA,
    normalInc:R(normalInc), agri:agri, cf:cf, deemedTI:deemedTI,
    tax2a:tax2a, splTax:splTax, tax2c:tax2c, bbeInc:bbeInc, bbeTax:bbeTax,
    surI:scg.surI, surII:scg.surII, surRate:scg.rate, mr:scg.mr, sur:sur, cess:cess,
    gross:grossTaxLiability,                                                 /* 2f = footer tax */
    normal2f:grossTaxLiability, grossTaxLiability:grossTaxLiability,         /* MAT seam: engMat/engMatc read these as the normal 2f */
    mat1a:mat1a, mat1b:mat1b, mat1c:mat1c, matSurRate:mscg.rate, matMr:mscg.mr,
    deemedTotal:mat1d,                                                       /* 1d = MATC item 1 */
    grossPayable:grossTaxPayable, matBlocked:matBlocked, matHigher:matHigher};
  S.C.int={
    dueDate:dueDate, filed:filed, late:late,
    grossPayable:grossTaxPayable, credit:matCredit, afterCredit:R(afterCredit),
    rel90:rel90, rel91:rel91, relief:relief, net:net,
    adv:adv, tds:tds, tcs:tcs, sat:sat, paid:paidTot,
    p234a:R(p234a), m234a:m234a, i234a:i234a, i234b:R(i234b), qs:qs, i234c:i234c,
    f234f:f234f, f234i:f234i, total:intTotal, aggregate:aggregate,
    balance:balance, refund:refund,
    net115TD:net115TD, payable115TD:payable115TD, netRefund:netRefund, matHigher:matHigher};
}

/* =====================================================================
   the screen — Part B-TI and Part B-TTI as result blocks (green cells),
   plus the tax-computation basis panel (the hidden Tax sheet, surfaced
   read-only) and the filing-date input that drives the interest.
   ===================================================================== */
function secTax(){
  var T=S.C.tax||{}, I=S.C.int||{};
  var r=function(n,l,v,o){return row(l,cell(v),Object.assign({ref:n},o||{}));};
  var h="";

  h+=note("Part B is the roll-up for the <b>company</b> return. Every white figure is picked up from another schedule; only the filing date below is keyed here. There is no salary head, no basic exemption, no 87A rebate and no section-89 relief.");

  /* ---- tax-computation basis (the hidden Tax sheet) ---- */
  h+=card("taxbasis","Tax computation basis (from Part A-General)","",
    r("—","Company type / rate",0,{v2:esc((T.ri||{}).label||"—")})+
    r("—","MAT (section 115JB)",0,{v2:T.matBlocked?"Not applicable (115BAA/115BAB opted)":"Applies to a domestic company on the normal regime"})+
    note("The 25 / 30 / 22 / 15 % domestic ladder (35 % foreign), the 115BAA eligibility gate, the company surcharge with marginal relief and the 234A/B/C interest are computed here from the Part A-General flags (domestic, 115BA/BAA/BAB option, turnover) owned by the Company-particulars section."));

  /* ===== Part B-TI ===== */
  h+=sub("Part B-TI — Computation of total income");
  h+=r("1","Income from house property — 3 of Schedule HP (nil if loss)",T.item1||0);
  h+=sub("2 · Profits and gains from business or profession");
  h+=r("2i","Business other than 115B / speculative / specified — A38 of BP (nil if loss)",T.b2i||0,{ind:1});
  h+=r("2ia","Foreign company — eligible raw-diamond business (rule 10TIA) — 3iva of Table E BP",T.b2ia||0,{ind:1});
  h+=r("2ii","Speculative business — 3(ii) of Table E BP (nil if loss)",T.b2ii||0,{ind:1});
  h+=r("2iii","Specified business — 3(iii) of Table E BP (nil if loss)",T.b2iii||0,{ind:1});
  h+=r("2iv","Income chargeable at special rate — 3d,3e,3f,3iv of Table E BP",T.b2iv||0,{ind:1});
  h+=r("2v","Total (2i + 2ia + 2ii + 2iii + 2iv)",T.b2v||0,{cls:"tot"});
  h+=sub("3 · Capital gains");
  h+=r("3ai","Short term chargeable @ 20% — 8ii of item E of CG",T.st20||0,{ind:1});
  h+=r("3aii","Short term chargeable @ 30% — 8iii",T.st30||0,{ind:1});
  h+=r("3aiii","Short term at applicable rate — 8iv",T.stApp||0,{ind:1});
  h+=r("3aiv","STCG at special rates as per DTAA — 8v",T.stDTAA||0,{ind:1});
  h+=r("3av","Total short-term capital gain (nil if loss)",T.totST||0,{cls:"tot"});
  h+=r("3bi","Long term chargeable @ 12.5% — 8vi",T.lt125||0,{ind:1});
  h+=r("3bii","LTCG at special rates as per DTAA — 8vii",T.ltDTAA||0,{ind:1});
  h+=r("3biii","Total long-term capital gain (nil if loss)",T.totLT||0,{cls:"tot"});
  h+=r("3c","Sum of short-term and long-term (3av + 3biii, nil if loss)",T.cg3c||0);
  h+=r("3d","Capital gains @ 30% u/s 115BBH — C2 of Schedule CG",T.cgC2||0);
  h+=r("3e","Total capital gains (3c + 3d)",T.cg3e||0,{cls:"tot"});
