/* =====================================================================
   Concessional-regime helpers (company: 115BA / 115BAA / 115BAB)
   The opted section lives in Part A-General (FilingStatus.Section115BA),
   owned by the `who` section. `who` is a sibling builder, so this reads
   resiliently from the likely state homes and degrades to "" (no
   concession -> no gating) when the seam is not yet wired. Flagged in the
   build report as a cross-section seam for the integrator.
   ===================================================================== */
function bpConc(){
  /* returns "115BA" | "115BAA" | "115BAB" | "" */
  var raw="";
  try{
    var cands=[
      S.C&&S.C.regime115, S.C&&S.C.conc115,
      S.fs&&(S.fs.sec115||S.fs.section115BA||S.fs.conc115||S.fs.regime115),
      S.who&&(S.who.sec115||S.who.section115BA||S.who.conc115),
      RG(S,"who.fs.Section115BA",""), RG(S,"who.filing.Section115BA",""),
      RG(S,"fs.Section115BA",""), RG(S,"who.Section115BA","")
    ];
    for(var i=0;i<cands.length;i++){ var c=st0(cands[i]); if(c){raw=c;break;} }
  }catch(e){}
  var m=/115BA[AB]?/.exec(String(raw).replace(/\s+/g,""));
  return m?m[0]:"";
}
function bpDepBarred(){ var s=bpConc(); return s==="115BA"||s==="115BAA"||s==="115BAB"; } /* A274/A275 */
function bpWeightedBarred(){ var s=bpConc(); return s==="115BAA"||s==="115BAB"; }        /* A255 */

/* =====================================================================
   The OI feed for BP 25/33  (ICDS XI(3)/XI(4) -> OI 3a/3b -> BP 25/33,
   plus the 145A stock-deviation on OI 4d/4e).
   Reads the accounts section's published OI figures if present; else
   falls back to this section's own ICDS totals (OI 3a = ICDS increase,
   OI 3b = ICDS decrease) plus any 145A figure read from the raw OI node.
   This guarantees the ICDS effect reaches BP even before the OI seam is
   fully wired (the ITR-5 fix), and picks up the 145A part when accounts
   publishes it.
   ===================================================================== */
function bpOIfeed(){
  var oi=(S.C&&S.C.oi)||{};
  var icdsInc=R(N((S.C.icds||{}).total));
  var icdsDec=R(N((S.C.icds||{}).deTotal));
  /* OI 3a/3b (ICDS): prefer accounts' published value, else our ICDS totals */
  var a3=(oi.i3a!=null)?N(oi.i3a):((oi.oi3a!=null)?N(oi.oi3a):icdsInc);
  var b3=(oi.i3b!=null)?N(oi.i3b):((oi.oi3b!=null)?N(oi.oi3b):icdsDec);
  /* OI 4d/4e (145A stock deviation): accounts input */
  var d4=(oi.i4d!=null)?N(oi.i4d):N(RG(S,"accounts.oi.MethodOfValClgStk.EffectOnPL",0));
  var e4=(oi.i4e!=null)?N(oi.i4e):N(RG(S,"accounts.oi.MethodOfValClgStk.DecProOrIncLossUs145_A",0));
  /* a fully-computed feed wins if accounts publishes it */
  var inc25=(oi.bp25!=null)?N(oi.bp25):(a3+d4);
  var dec33=(oi.bp33!=null)?N(oi.bp33):(b3+e4);
  return {inc25:R(inc25),dec33:R(dec33),a3:R(a3),b3:R(b3),d4:R(d4),e4:R(e4)};
}

/* =====================================================================
   Depreciation block engine (DPM & DOA) — one block per rate column.
   opts.half:false -> no <180-day split (45% block); opts.addl:false ->
   no additional depreciation (DOA, and the 45% block); the concessional
   regime closes additional depreciation (A274) and caps plant at 40%
   (the 45% block gets nil depreciation, A275).
   ===================================================================== */
function bpBlock(b,rate,opts){
  b=b||{};opts=opts||{};
  const halfOK  = opts.half!==false;
  const addlOK  = opts.addl!==false && !bpDepBarred();     /* A274 */
  const cap40   = opts.blocked && bpDepBarred();            /* A275: 45% block -> nil dep */
  const wdv = N(b.WDVFirstDay);
  const add180 = N(b.AdditionsGrThan180Days), realTot = N(b.RealizationTotalPeriod);
  const fullBase = wdv + add180 - realTot;
  const fullAmt = Math.max(0, fullBase);                    /* item 6 = MAX(0, 3+4-5) */
  const addLess = halfOK?N(b.AdditionsLessThan180Days):0;
  const realLess = halfOK?N(b.RealizationPeriodDuringYear):0;
  const halfAmt = halfOK?Math.max(0, addLess - realLess + Math.min(0,fullBase)):0; /* item 9 */
  let depFull = Math.round(fullAmt*rate/100);              /* item 10 = ROUND(6*rate/100) */
  let depHalf = halfOK?Math.round(halfAmt*rate/200):0;     /* item 11 = ROUND(9*rate/200) */
  const addl12 = addlOK?N(b.AddlnDeprOnGT180DayAdditions):0;
  const addl13 = addlOK?N(b.AddlnDeprDuringYearAdditions):0;
  const addl14 = addlOK?N(b.AddlnDeprOnLessThan180DayAdditions):0;
  if(cap40){depFull=0;depHalf=0;}
  const totDep = depFull+depHalf+addl12+addl13+addl14;     /* item 15 (DPM) / 12 (DOA) */
  const disallow = N(b.DepDisAllowUs38_2);                 /* item 16 / 13 */
  const netAgg = Math.max(0, totDep-disallow);             /* item 17 / 14 = MAX(0,15-16) */
  const pro = N(b.ProportionateAggDepreciation);           /* item 18 / 15 */
  const expTr = N(b.ExpdrOnTrforSaleAsset);                /* item 19 / 16 */
  /* item 20 (DPM) / 17 (DOA) capital gain u/s 50 = 5+8-3-4-7-exp.
     "Enter negative only if block ceases" is a hidden Y/N switch (not
     built) — so floor at 0: a positive s.50 STCG is carried, the
     block-ceases loss path is out of scope. */
  const cg50 = Math.max(0, realTot + realLess - wdv - add180 - addLess - expTr);
  const wdvLast = Math.max(0, fullAmt + halfAmt - totDep); /* item 21 / 18 = MAX(0,6+9-15) */
  return {rate,wdv,add180,realTot,fullAmt,addLess,realLess,halfAmt,
    depFull,depHalf,addl12,addl13,addl14,totDep,disallow,netAgg,pro,expTr,cg50,wdvLast,
    dep:(pro>0?pro:netAgg)};                               /* DEP: proportionate if >0 else net */
}

/* =====================================================================
   ENGINE
   ===================================================================== */
function engBp(){
  const B=S.bp||{};
  const nb=k=>N(B[k]), sgb=k=>sg(B[k]);
  const barredW=bpWeightedBarred();

  /* ---------- ICDS (publishes S.C.icds for the OI feed) ---------- */
  const icds={rows:{}}; let icdsInc=0, icdsDec=0;
  ICDS_ROWS.forEach(r=>{
    const o=(S.icds||{})[r[0]]||{};
    const inc=N(o.inc), dec=N(o.dec);
    icds.rows[r[0]]={inc:R(inc),dec:R(dec),net:R(inc-dec)};   /* Net = In - De */
    icdsInc+=inc; icdsDec+=dec;
  });
  icds.total   = Math.max(0,R(icdsInc));   /* XI(3) total increase  [F16] */
  icds.deTotal = Math.max(0,R(icdsDec));   /* XI(4) total decrease  [G16] */
  icds.totNet  = Math.max(0,R(icdsInc-icdsDec));  /* XI(5) floored at 0 [H16] */
  /* publish BOTH name-styles so the accounts OI engine finds the feed
     whichever convention it reads (the ITR-5 fix). */
  icds.totInc=icds.total; icds.totDec=icds.deTotal;
  S.C.icds=icds;

  /* ---------- ESR (feeds BP 29 and 24(c)) ---------- */
  const esr={rows:{}}; let eDeb=0,eAllow=0,eExcess=0,eShort=0;
  ESR_ROWS.forEach(r=>{
    const o=(S.esr||{})[r[0]]||{};
    const deb=N(o.deb);
    let allow=N(o.allow);
    if(barredW&&r[3])allow=0;                        /* A255: weighted deduction col(3)=0 */
    const excess=Math.max(0, allow-deb);             /* col(4) = MAX(0,(3)-(2)) */
    const shortRow=Math.max(0, deb-allow);           /* hidden col K = MAX((2)-(3),0) */
    eShort+=shortRow;
    esr.rows[r[0]]={deb:R(deb),allow:R(allow),excess:R(excess),
      gatedZeroed:barredW&&r[3]&&N(o.allow)>0};
    eDeb+=deb; eAllow+=allow; eExcess+=excess;
  });
  esr.totDeb=R(eDeb); esr.totAllow=R(eAllow);
  esr.totExcess=Math.max(0,R(eExcess));   /* item x(4) -> BP 29 */
  esr.shortfall=R(eShort);                /* col-K total -> BP 24(c) */
  S.C.esr=esr;

  /* ---------- DPM ---------- */
  const dpm={
    r15:bpBlock(S.dpm&&S.dpm.r15,15,{}),
    r30:bpBlock(S.dpm&&S.dpm.r30,30,{}),
    r40:bpBlock(S.dpm&&S.dpm.r40,40,{}),
    r45:bpBlock(S.dpm&&S.dpm.r45,45,{half:false,addl:false,blocked:true})
  };
  S.C.dpm=dpm;
  /* ---------- DOA ---------- */
  const landB=(S.doa&&S.doa.land)||{};
  const land={wdv:N(landB.WDVFirstDay),wdvLast:Math.max(0,N(landB.WDVFirstDay)),dep:0,cg50:0};
  const doa={
    land:land,
    b5:bpBlock(S.doa&&S.doa.b5,5,{addl:false}),
    b10:bpBlock(S.doa&&S.doa.b10,10,{addl:false}),
    b40:bpBlock(S.doa&&S.doa.b40,40,{addl:false}),
    furn:bpBlock(S.doa&&S.doa.furn,10,{addl:false}),
    intang:bpBlock(S.doa&&S.doa.intang,25,{addl:false}),
    ships:bpBlock(S.doa&&S.doa.ships,20,{addl:false})
  };
  S.C.doa=doa;

  /* ---------- DEP (summary of depreciation) ---------- */
  const dep={};
  dep.pm15=dpm.r15.dep; dep.pm30=dpm.r30.dep; dep.pm40=dpm.r40.dep; dep.pm45=dpm.r45.dep;
  dep.totPM=R(dep.pm15+dep.pm30+dep.pm40+dep.pm45);                 /* 1e */
  dep.b5=doa.b5.dep; dep.b10=doa.b10.dep; dep.b40=doa.b40.dep;
  dep.totBld=R(dep.b5+dep.b10+dep.b40);                             /* 2d */
  dep.furn=doa.furn.dep; dep.intang=doa.intang.dep; dep.ships=doa.ships.dep;
  dep.total=Math.max(0,R(dep.totPM+dep.totBld+dep.furn+dep.intang+dep.ships)); /* total -> BP 12i */
  S.C.dep=dep;

  /* ---------- DCG (deemed capital gains u/s 50) -> Schedule CG ---------- */
  const dcg={};
  dcg.pm15=dpm.r15.cg50; dcg.pm30=dpm.r30.cg50; dcg.pm40=dpm.r40.cg50; dcg.pm45=dpm.r45.cg50;
  dcg.totPM=R(dcg.pm15+dcg.pm30+dcg.pm40+dcg.pm45);                 /* 1e */
  dcg.b5=doa.b5.cg50; dcg.b10=doa.b10.cg50; dcg.b40=doa.b40.cg50;
  dcg.totBld=R(dcg.b5+dcg.b10+dcg.b40);                             /* 2d */
  dcg.furn=doa.furn.cg50; dcg.intang=doa.intang.cg50; dcg.ships=doa.ships.cg50;
  dcg.total=R(dcg.totPM+dcg.totBld+dcg.furn+dcg.intang+dcg.ships);  /* total -> Schedule CG */
  S.C.dcg=dcg;

  /* ---------- OI feed ---------- */
  const feed=bpOIfeed();

  /* ================= BP LADDER — Part A ================= */
  const K1 = sg(nb("pbt"));                                   /* 1 */
  const _2a = sgb("nplSpec"), _2b = sgb("nplSpecified");      /* 2a, 2b */
  const _3c = R(nb("a3ci")+nb("a3cii"));                      /* 3c = 3ci + 3cii */
  const sum3 = R(nb("a3a")+nb("a3b")+_3c+nb("a3d")+nb("a3e")+nb("a3f")); /* 3a+3b+3c+3d+3e+3f */
  const _4a = R(sgb("p44AE")+sgb("p44B")+sgb("p44BB")+sgb("p44BBA")+sgb("p44BBB")+sgb("p44BBC")+
               sgb("p44BBD")+sgb("p44D")+sgb("p44DA")+sgb("pXIIG")+sgb("pFirstSch"));
  const _4b = sgb("p115B");
  const _4c = R(nb("r7")+nb("r7A")+nb("r7B1")+nb("r7B1A")+nb("r8"));   /* TotalProfitFrmActCvrd */
  const _4d = R(nb("pElig10TIA"));
  const othExemptTot = R((B.othExempt||[]).reduce((a,r)=>a+N(r.amt),0));
  const _5ciii = R(nb("divExempt")+othExemptTot);            /* 5c total (OthExempInc) */
  const _5d = R(nb("a5a")+nb("a5b")+_5ciii);                 /* 5d TotExempInc */
  const _5A = R(nb("a5A"));
  const _6 = R(K1 - _2a - _2b - sum3 - _4a - _4b - _4c - _4d - _5d - _5A); /* 6 balance */
  const _9 = R(nb("e7a")+nb("e7b")+nb("e7c")+nb("e7d")+nb("e7e")+nb("e8a")+nb("e8b")); /* 9 (no 7f) */
  const _10 = R(_6+_9);                                       /* 10 = 6 + 9 */
  const _11 = R(nb("depDebPL"));                             /* 11 */
  const _12i = R(dep.total>0?dep.total:0);                   /* 12i = DEP total (A196) */
  const _12ii = R(nb("dep32_1_i"));                          /* 12ii */
  const _12iii = R(_12i+_12ii);                             /* 12iii */
  const _13 = R(_10+_11-_12iii);                            /* 13 = 10 + 11 - 12iii */
  const _20 = R(nb("deem41"));                               /* 20 */
  const _21 = Math.max(0, R(nb("d21_32AC")+nb("d21_32AD")+nb("d21_33AB")+nb("d21_33ABA")+
    nb("d21_35ABA")+nb("d21_35ABB")+nb("d21_35AC")+nb("d21_40A3A")+nb("d21_33AC")+
    nb("d21_72A")+nb("d21_80HHD")+nb("d21_80IA")));          /* 21 total */
  const _24c = R(nb("i24c")+esr.shortfall);                  /* 24c Others (+ESR shortfall A235) */
  const _24 = R(nb("i24a")+nb("i24b")+_24c);                 /* 24 total */
  const _25 = R(feed.inc25);                                 /* 25 = OI 3a + 4d (A197) */
  const _26 = R(nb("d14")+nb("d15")+nb("d16")+nb("d17")+nb("d18")+nb("d19")+_20+_21+nb("d22")+nb("d23")+_24+_25); /* 26 = 14..25 */
  const _27 = R(nb("d27"));                                  /* 27 */
  const _28 = R(nb("d28_32AC"));                             /* 28 = 32AC deduction */
  const _29 = R(esr.totExcess);                             /* 29 = ESR x(4) (A212) */
  const _30 = R(nb("d30")), _31 = R(nb("d31")), _32 = R(nb("d32"));
  const _33 = R(feed.dec33);                                 /* 33 = OI 3b + 4e */
  const _34 = R(_27+_28+_29+_30+_31+_32+_33);                /* 34 = 27..33 */
  const _35 = R(_13+_26-_34);                                /* 35 = 13 + 26 - 34 */
  const _36 = Math.max(0, R(nb("dp44AE")+nb("dp44B")+nb("dp44BB")+nb("dp44BBA")+nb("dp44BBB")+
    nb("dp44BBC")+nb("dp44BBD")+nb("dp44D")+nb("dp44DA")+nb("dpXIIG")+nb("dpFirstSch"))); /* 36x total */
  const _37 = R(_35+_36);                                    /* 37 = 35 + 36x */
  const _38f = _37;                                          /* 38f = item 37 */
  const A38 = R(nb("r38a")+nb("r38b")+nb("r38c")+nb("r38d")+nb("r38e")+_38f); /* A38 */
  const _agri = R(_4c - (nb("r38a")+nb("r38b")+nb("r38c")+nb("r38d")+nb("r38e"))); /* BalIncDeemedFrmAgri */

  /* ================= Part B — speculative ================= */
  const _40 = _2a;                                           /* 40 = 2a */
  const _41 = R(nb("s41")), _42 = R(nb("s42"));
  const B43 = R(_40+_41-_42);                                /* B43 = 40 + 41 - 42 */

  /* ================= Part C — specified 35AD ================= */
  const _44 = _2b;                                           /* 44 = 2b */
  const _45 = R(nb("sp45")), _46 = R(nb("sp46"));
  const _47 = R(_44+_45-_46);                                /* 47 = 44 + 45 - 46 */
  const _48 = bpWeightedBarred()?0:R(nb("sp48"));            /* 48 = 35AD(1) deduction (A255) */
  const C49 = R(_47-_48);                                    /* C49 = 47 - 48 */

  /* ================= Part D ================= */
  const D = R(A38 + Math.max(0,B43) + Math.max(0,C49));      /* D = A38 + B43 + C49 (losses -> CFL) */

  /* ================= Part E — intra-head set off ================= */
  const lossSetOff = Math.abs(Math.min(0, A38));            /* (i) loss to set off */
  const specInc = Math.max(0, B43);                          /* (ii) */
  const specifiedInc = Math.max(0, C49);                     /* (iii) */
  const lifeInc = 0;                                         /* (iv) 115B life insurance (not built) */
  const diamondInc = Math.max(0, _4d);                       /* (iva) 10TIA raw diamond */
  let rem=lossSetOff;
  const specSet = Math.min(rem, specInc); rem-=specSet;
  const specifiedSet = Math.min(rem, specifiedInc); rem-=specifiedSet;
  const lifeSet = Math.min(rem, lifeInc); rem-=lifeSet;
  const diamondSet = Math.min(rem, diamondInc); rem-=diamondSet;
  const totSet = R(specSet+specifiedSet+lifeSet+diamondSet); /* (v) */
  const lossRemain = R(Math.max(0, lossSetOff-totSet));      /* (vi) = (i) - (v) */

  /* ================= Schedule-SI feed (special-rate BP heads) =================
     70_sec_si.js consumes S.C.bp.siFeed keyed by the schema SecCode (book
     SI.md §2/§3/§6). Each value is the already-computed BP income (a plain
     number); si.js supplies the statutory rate from its own SI_RATE_DEF
     (5B=12.5, 5BBF_BP=10, 5BBG_BP=10, 5BBH_BP=30) and computes the tax.
        5B      115B — profits & gains of life insurance business <- item 4b (A237)
        5BBF_BP 115BBF — patent royalty, business income          <- item 3d (A615)
        5BBG_BP 115BBG — carbon credits, business income          <- item 3e (A614)
        5BBH_BP 115BBH — VDA, business income                     <- item 3f (A623)
     Amounts are REUSED from the BP ladder above (not recomputed). A head is
     emitted only when its income is positive — a nil / loss head carries no
     special-rate income and so contributes no SI row. */
  const siFeed={};
  const si5B   = R(_4b);            /* item 4b — 115B life insurance profit */
  const si5BBF = R(nb("a3d"));      /* item 3d — 115BBF patent (business)   */
  const si5BBG = R(nb("a3e"));      /* item 3e — 115BBG carbon (business)   */
  const si5BBH = R(nb("a3f"));      /* item 3f — 115BBH VDA (business)      */
  if(si5B>0)   siFeed["5B"]=si5B;
  if(si5BBF>0) siFeed["5BBF_BP"]=si5BBF;
  if(si5BBG>0) siFeed["5BBG_BP"]=si5BBG;
  if(si5BBH>0) siFeed["5BBH_BP"]=si5BBH;

  S.C.bp = {
    on:true,
    a:{K1,_2a,_2b,_3c,sum3,_4a,_4b,_4c,_4d,_5ciii,_5d,_5A,_6,_9,_10,_11,_12i,_12ii,_12iii,_13,
       _20,_21,_24c,_24,_25,_26,_27,_28,_29,_33,_34,_35,_36,_37,_38f,A38,_agri},
    b:{_40,_41,_42,B43},
    c:{_44,_45,_46,_47,_48,C49},
    d:D,
    e:{lossSetOff,specInc,specifiedInc,lifeInc,diamondInc,specSet,specifiedSet,lifeSet,diamondSet,totSet,lossRemain},
    feed:feed,
    dcg:dcg,     /* published for the CG section (S.C.bp.dcg) */
    siFeed:siFeed, /* special-rate BP heads for Schedule SI (S.C.bp.siFeed) */
    income:D
  };
}

/* =====================================================================
   RENDERER
   ===================================================================== */
function rBP(label,right,ref,o){o=o||{};o.ref=ref;return row(label,right,o);}
function inpN(p){return inp(p,{n:1});}

function secBp(){
  const A=(S.C.bp&&S.C.bp.a)||{}, Bp=(S.C.bp&&S.C.bp.b)||{}, Cp=(S.C.bp&&S.C.bp.c)||{}, E=(S.C.bp&&S.C.bp.e)||{};
  const conc=bpConc(), barredW=bpWeightedBarred(), depBar=bpDepBarred();
  let h="";
  h+=formNote("Schedule BP is the spine of the company return — a computed adjustment ladder that turns "+
    "book profit into taxable business income. Most lines carry forward from Schedule P&L, the Trading / "+
    "Manufacturing accounts, Part A-OI and Schedules DEP/ESR/ICDS — enter each figure as it appears there. "+
    "The free entries are the 5c exempt-income table and the 35AD(5) clause. Depreciation (DPM/DOA), its "+
    "summary (DEP/DCG), ESR and ICDS are the sub-schedules below and feed this ladder automatically.");
  if(conc)h+=note("Concessional regime <b>"+esc(conc)+"</b> opted: "+
    (depBar?"additional depreciation is nil and the 45% plant &amp; machinery block claims no depreciation (A274/A275)":"")+
    (barredW?(depBar?"; ":"")+"the ESR weighted deductions [35(1)(ii)/(iia)/(iii)/35(2AA)/35CCC] and the 35AD(1) deduction are closed (A255)":"")+".","warn");

  /* ---- Part A ---- */
  h+=sub("A — Business other than speculative & specified business");
  h+=rBP("1  Profit before tax as per statement of P&L (53, 61(ii), 62(b) of Part A-P&L)",inpN("bp.pbt"),"A1");
  h+=rBP("2a  Net profit/loss from speculative business included in 1",inpN("bp.nplSpec"),"A2a",{hint:"enter −ve for a loss (Sl. 12b of Trading Account)"});
  h+=rBP("2b  Net profit/loss from specified business u/s 35AD included in 1",inpN("bp.nplSpecified"),"A2b",{hint:"enter −ve for a loss"});
  h+=sub("3 — Income credited to P&L considered under other heads / 115BBF-G-H");
  h+=rBP("3a  House Property",inpN("bp.a3a"),"A3a",{ind:1});
  h+=rBP("3b  Capital Gains",inpN("bp.a3b"),"A3b",{ind:1});
  h+=rBP("3c(i)  Dividend income",inpN("bp.a3ci"),"A3ci",{ind:1});
  h+=rBP("3c(ii)  Other than dividend income",inpN("bp.a3cii"),"A3cii",{ind:1});
  h+=rBP("3c  Other sources (3c(i)+3c(ii))",cell(A._3c),"A3c",{ind:1});
  h+=rBP("3d  u/s 115BBF",inpN("bp.a3d"),"A3d",{ind:1});
  h+=rBP("3e  u/s 115BBG",inpN("bp.a3e"),"A3e",{ind:1});
  h+=rBP("3f  u/s 115BBH (net of cost of acquisition)",inpN("bp.a3f"),"A3f",{ind:1});
  h+=sub("4a — Profit incl. in 1 referred to 44AE/44B/44BB/44BBA/44BBB/44BBC/44BBD/44D/44DA/Ch-XII-G/First Schedule (other than 115B)");
  [["p44AE","44AE"],["p44B","44B"],["p44BB","44BB"],["p44BBA","44BBA"],["p44BBB","44BBB"],
   ["p44BBC","44BBC"],["p44BBD","44BBD"],["p44D","44D"],["p44DA","44DA"],
   ["pXIIG","Chapter-XII-G"],["pFirstSch","First Schedule (other than 115B)"]].forEach(x=>
     h+=rBP("4a · "+x[1],inpN("bp."+x[0]),"",{ind:1,hint:"enter −ve for a loss"}));
  h+=rBP("4a  Total",cell(A._4a),"A4a");
  h+=rBP("4b  Profit and gains from life insurance business u/s 115B",inpN("bp.p115B"),"A4b");
  h+=sub("4c — Profit from activities covered under rule 7, 7A, 7B(1), 7B(1A) and 8");
  [["r7","Rule 7"],["r7A","Rule 7A"],["r7B1","Rule 7B(1)"],["r7B1A","Rule 7B(1A)"],["r8","Rule 8"]].forEach(x=>
     h+=rBP("4c · "+x[1],inpN("bp."+x[0]),"",{ind:1}));
  h+=rBP("4c  Total (TotalProfitFrmActCvrd)",cell(A._4c),"A4c");
  h+=rBP("4d  Profit from eligible business of selling raw diamonds (rule 10TIA)",inpN("bp.pElig10TIA"),"A4d");
  h+=sub("5 — Income credited to P&L (included in 1) which is exempt");
  h+=rBP("5a  Share of income from firm(s)",inpN("bp.a5a"),"A5a");
  h+=rBP("5b  Share of income from AOP/BOI",inpN("bp.a5b"),"A5b");
  h+=rBP("5c  Dividend income (exempt)",inpN("bp.divExempt"),"A5c");
  h+=grid("bp.othExempt",[{k:"name",h:"Nature of other exempt income",t:"txt",w:"60%"},{k:"amt",h:"Amount",t:"num",w:"30%"}],
    (S.bp&&S.bp.othExempt)||[],{empty:"No other exempt income.",add:"Add exempt income"});
  h+=rBP("5c iv  Total (dividend + other)",cell(A._5ciii),"A5civ");
  h+=rBP("5d  Total exempt income (5a+5b+5c)",cell(A._5d),"A5d");
  h+=rBP("5A  Income/receipts credited to P&L but not chargeable to tax",inpN("bp.a5A"),"A5A");
  h+=rBP("6  Balance (1 − 2a − 2b − 3a…3f − 4a − 4b − 4c − 4d − 5d − 5A)",cell(A._6),"A6");
  h+=sub("7/8 — Expenses debited to P&L under other heads / exempt / 14A");
  [["e7a","7a House Property"],["e7b","7b Capital Gains"],["e7c","7c Other Sources"],
   ["e7d","7d u/s 115BBF"],["e7e","7e u/s 115BBG"]].forEach(x=>
     h+=rBP(x[1],inpN("bp."+x[0]),"",{ind:1}));
  h+=rBP("7f  u/s 115BBH (other than cost of acquisition)",cell(0),"A7f",{ind:1,hint:"sheet row with no schema key — not separately filed"});
  h+=rBP("8a  Expenses relating to exempt income",inpN("bp.e8a"),"A8a",{ind:1});
  h+=rBP("8b  Expenses relating to exempt income disallowed u/s 14A (16 of Part A-OI)",inpN("bp.e8b"),"A8b",{ind:1});
  h+=rBP("9  Total (7a…7e + 8a + 8b)",cell(A._9),"A9");
  h+=rBP("10  Adjusted profit or loss (6 + 9)",cell(A._10),"A10");
  h+=rBP("11  Depreciation & amortization debited to P&L",inpN("bp.depDebPL"),"A11");
  h+=rBP("12i  Depreciation allowable u/s 32(1)(ii) & (iia) — column 6 of Schedule DEP",cell(A._12i),"A12i");
  h+=rBP("12ii  Depreciation allowable u/s 32(1)(i) (Appendix-IA; power sector)",inpN("bp.dep32_1_i"),"A12ii");
  h+=rBP("12iii  Total (12i + 12ii)",cell(A._12iii),"A12iii");
  h+=rBP("13  Profit/loss after adjustment for depreciation (10 + 11 − 12iii)",cell(A._13),"A13");
  h+=sub("14–25 — Amounts to be added back");
  [["d14","14 disallowable u/s 36 (6s of OI)"],["d15","15 disallowable u/s 37 (7k of OI)"],
   ["d16","16 disallowable u/s 40 (8Aj of OI)"],["d17","17 disallowable u/s 40A (9f of OI)"],
   ["d18","18 disallowable u/s 43B (11i of OI)"],["d19","19 interest disallowed u/s 23 MSMED Act (17 of OI)"],
   ["deem41","20 deemed income u/s 41"]].forEach(x=>h+=rBP(x[1],inpN("bp."+x[0]),"",{ind:1}));
  h+=sub("21 — Deemed income u/s 32AC/32AD/33AB/33ABA/35ABA/35ABB/35AC/40A(3A)/33AC/72A/80HHD/80-IA");
  [["d21_32AC","21a 32AC"],["d21_32AD","21b 32AD"],["d21_33AB","21c 33AB"],["d21_33ABA","21d 33ABA"],
   ["d21_35ABA","21e 35ABA"],["d21_35ABB","21f 35ABB"],["d21_35AC","21g 35AC"],["d21_40A3A","21h 40A(3A)"],
   ["d21_33AC","21i 33AC"],["d21_72A","21j 72A"],["d21_80HHD","21k 80HHD"],["d21_80IA","21l 80-IA"]].forEach(x=>
     h+=rBP(x[1],inpN("bp."+x[0]),"",{ind:1}));
  h+=rBP("21  Total deemed income (only the total is filed)",cell(A._21),"A21");
  h+=rBP("22  Deemed income u/s 43CA",inpN("bp.d22"),"A22",{ind:1});
  h+=rBP("23  Any other item of addition u/s 28 to 44DB",inpN("bp.d23"),"A23",{ind:1});
  h+=sub("24 — Any other income not in P&L / expense not allowable");

   ["dp44BBA","36iv 44BBA"],["dp44BBB","36v 44BBB"],["dp44BBC","36va 44BBC"],["dp44BBD","36vb 44BBD"],
   ["dp44D","36vi 44D"],["dp44DA","36vii 44DA"],["dpXIIG","36viii Chapter-XII-G"],
   ["dpFirstSch","36ix First Schedule (other than 115B)"]].forEach(x=>h+=rBP(x[1],inpN("bp."+x[0]),"",{ind:1}));
  h+=rBP("36x  Total (36i to 36ix)",cell(A._36),"A36x");
  h+=rBP("37  Net profit/loss other than speculative & specified (35 + 36x)",cell(A._37),"A37");
  h+=sub("38 — after rule 7A/7B/8");

  h+=rBP("B43  Income from speculative business (40 + 41 − 42)",cell(Bp.B43),"B43",{hint:"if loss → 6xix of Schedule CFL"});

  h+=sub("C — Specified business under section 35AD");

  h+=rBP("45  Additions in accordance with section 28 to 44DB",inpN("bp.sp45"),"C45");

  h+=rBP("Relevant clause of s.35AD(5) (row 1)",sel("bp.clause.0",BP_35AD5),"35AD(5)");
  h+=rBP("Relevant clause of s.35AD(5) (row 2)",sel("bp.clause.1",BP_35AD5),"35AD(5)");

  /* ---- Part D & E ---- */
  h+=sub("D & E — Chargeable income and intra-head set off");
  h+=rBP("D  Income chargeable under 'Profits and gains from Business or profession' (A38 + B43 + C49)",cell(S.C.bp?S.C.bp.d:0),"D");
  h+=rBP("E(i)  Business loss of current year to be set off",cell(E.lossSetOff),"E i");
  h+=rBP("E(ii)  Income from speculative business",cell(E.specInc),"E ii",{v2:cell(E.specSet)});
  h+=rBP("E(iii)  Income from specified business",cell(E.specifiedInc),"E iii",{v2:cell(E.specifiedSet)});
  h+=rBP("E(iv)  Profit and gains from life insurance business u/s 115B",cell(E.lifeInc),"E iv",{v2:cell(E.lifeSet)});
  h+=rBP("E(iva)  Income of foreign company from raw-diamond business (rule 10TIA)",cell(E.diamondInc),"E iva",{v2:cell(E.diamondSet)});

  h+=rBP("E(vi)  Loss remaining after set off (i − v)",cell(E.lossRemain),"E vi");
  h+=note("Note: include the income of the specified persons referred to in Schedule SPI while computing income under this head.");

  /* ---- Sub-schedules ---- */
  h+=depFold();
  h+=esrFold();
  h+=icdsFold();
  return h;
}

    h+='<tr><td class="l">7 Additions <180 days</td>'+iN("AdditionsLessThan180Days")+'</tr>';
    h+='<tr><td class="l">8 Realization out of 7</td>'+iN("RealizationPeriodDuringYear")+'</tr>';

    if(bpDepBarred()){
      h+='<tr><td class="l">12–14 Additional depreciation</td><td class="num">'+cell(0)+' <span class="hint">closed by '+esc(bpConc())+'</span></td></tr>';
    }else{
      h+='<tr><td class="l">12 Additional depr. on 4</td>'+iN("AddlnDeprOnGT180DayAdditions")+'</tr>';

      h+='<tr><td class="l">14 Additional depr. (prec. yr, <180 days)</td>'+iN("AddlnDeprOnLessThan180DayAdditions")+'</tr>';
    }

  h+='<tr><td class="l">'+(opts.half!==false?"15":"12")+' Total depreciation</td>'+c(blk.totDep)+'</tr>';
  h+='<tr><td class="l">Depreciation disallowed u/s 38(2)</td>'+iN("DepDisAllowUs38_2")+'</tr>';

function depFold(){

    "the s.38(2) disallowance and transfer expenditure; every green cell is computed. Under 115BA/115BAA/115BAB "+
    "additional depreciation is nil and the 45% plant block claims no depreciation (A274/A275).","");
  inner+=sub("Schedule DPM — Plant & machinery");

    ["1d P&M @45%",dep.pm45],["1e Total P&M",dep.totPM],["2a Building @5%",dep.b5],["2b Building @10%",dep.b10],

  inner+=sub("Schedule DCG — Deemed capital gains u/s 50 (computed) → Schedule CG");

    ["1d P&M @45%",dcg.pm45],["1e Total P&M",dcg.totPM],["2a Building @5%",dcg.b5],["2b Building @10%",dcg.b10],

    ["4 Intangible assets",dcg.intang],["5 Ships",dcg.ships],["Total deemed capital gains → Schedule CG",dcg.total]]);
  return fold("bp_dep","DPM · DOA · DEP · DCG","Depreciation & deemed capital gains",
    (dep.total?"Depreciation "+RS(dep.total):"Not entered"),inner);

  const b10=C.b10||{};
  B.b10= {gain:R(N(b10.r125a)+N(b10.r125o))};               /* B10 pass-through LTCG */
  B.b11= engDTAA(C.b11);                                    /* B11a/B11b (NR DTAA) */
  B.bA = {loss:R(N((C.bA||{}).amt))};                       /* B(A) buy-back LTCL @12.5% */
  /* B12 = B1g+B2e+B3c+B4+B5+B6c+B7+B8e+B9+B10−B11a+B(A) (B5/B6/B7 are 0 for a resident) */
  B.total=R(B.b1+B.b2.gain+B.b3.gain+B.b4.gain+B.b5.gain+B.b6.gain+B.b7.gain+B.b8.gain+B.b9.gain+B.b10.gain-B.b11.notTax-B.bA.loss);

  /* ---- Part E · set-off matrix on the six rate-slots -------------- */
  /* Composition (CG book §6, Table E rows 460-472):
     20%   = A3ie + A3iie + A4a + A8@20                        − STL20
     30%   = A5e + A8@30                                       − STL30
     app.  = A1e + A2c + A4b + A6g + A7 + A8@app               − STLAR
     DTAA  = A9b
     12.5% = B1g+B2e+B3c+B4+B5+B6c+B7+B8e+B9+B10               − B(A)
     LTDTAA= B11b   (A4/A5/B5/B6/B7 are 0 for a resident)                */
  const bbAt=code=>R((C.aA||[]).filter(x=>(x.rate||"STL20")===code).reduce((a,x)=>a+N(x.amt),0));
  const E={
    st20:R(A.a3i.gain+A.a3ii.gain+A.a4.a+N(a8.r20)-bbAt("STL20")),
    st30:R(A.a5.gain+N(a8.r30)-bbAt("STL30")),
    stApp:R(A.a1+A.a2.gain+A.a4.b+A.a6.gain+A.a7.gain+N(a8.rApp)-bbAt("STLAR")),
    stDTAA:R(A.a9.special),
    lt125:R(B.b1+B.b2.gain+B.b3.gain+B.b4.gain+B.b5.gain+B.b6.gain+B.b7.gain+B.b8.gain+B.b9.gain+B.b10.gain-B.bA.loss),
    ltDTAA:R(B.b11.special)};
  const gain={},loss={},used={},absorbed={},matrix={};
  KEYS.forEach(k=>{gain[k]=Math.max(0,E[k]);loss[k]=Math.max(0,-E[k]);used[k]=0;absorbed[k]=0;matrix[k]={};});
  const isLong=k=>k.charAt(0)==="l";
  if(C.editE && C.Eover){                                   /* row 473 "Do you want to edit" override */
    KEYS.forEach(gk=>KEYS.forEach(lk=>{const v=N(((C.Eover[gk]||{})[lk]));
      if(v>0){matrix[gk][lk]=v;absorbed[gk]+=v;used[lk]+=v;}}));
  } else {
    /* auto set-off: a STCL sets off any CG; a LTCL sets off only LTCG (Part E rule) */
    KEYS.forEach(lk=>{if(!loss[lk])return;let avail=loss[lk];
      KEYS.forEach(gk=>{if(avail<=0||gk===lk||!gain[gk])return;
        if(isLong(lk)&&!isLong(gk))return;
        const u=Math.min(avail,gain[gk]-absorbed[gk]);if(u<=0)return;
        matrix[gk][lk]=(matrix[gk][lk]||0)+u;absorbed[gk]+=u;used[lk]+=u;avail-=u;});});
  }
  const after={},totSet={},remain={};let C1=0;
  KEYS.forEach(k=>{after[k]=R(gain[k]-absorbed[k]);C1+=after[k];   /* C1 = Σ CurrYrCapGain (ii..vii) */
    totSet[k]=R(used[k]);remain[k]=R(Math.max(0,loss[k]-used[k]));});
  const cflSTCL=R(["st20","st30","stApp","stDTAA"].reduce((a,k)=>a+remain[k],0)); /* unabsorbed CY STCL → CFL */
  const cflLTCL=R(["lt125","ltDTAA"].reduce((a,k)=>a+remain[k],0));               /* unabsorbed CY LTCL → CFL */

  /* ---- Part F · quarters (auto from land sale dates; editable) ---- */
  const Fauto={};KEYS.forEach(k=>Fauto[k]=[0,0,0,0,0]);
  (C.land||[]).forEach(p=>{const r=p._;if(!r)return;const q=cgQtr(p.sale);
    const k=r.isLT?"lt125":"stApp"; if(r.gain>0)Fauto[k][q]+=r.gain;});
  const F={};KEYS.forEach(k=>{const ov=(C.Fover||{})[k];
    F[k]=(C.editF&&ov)?ov.map(N):Fauto[k].slice();});

  /* ---- Part C · summary ------------------------------------------- */
  const C2=vda.cg;                                          /* C2 = Sch VDA item B */
  const C3=R(C1+C2);                                         /* C3 = C1 + C2 */

  /* ---- Part D · deduction particulars (disclosure) ---------------- */
  const dedD={};
  const addD=(sec,amt,src)=>{if(!N(amt))return;(dedD[sec]=dedD[sec]||[]).push({amt:N(amt),src});};
  (C.land||[]).forEach((p,i)=>Object.keys(p.ded||{}).forEach(k=>addD(k.replace("s",""),(p.ded||{})[k],"land"+i)));
  if(N((C.b2||{}).ded&&(C.b2.ded||{}).s54EC))addD("54EC",(C.b2.ded||{}).s54EC,"b2");
  [["a6",C.a6],["b8",C.b8]].forEach(([h,o])=>
    Object.keys((o||{}).ded||{}).forEach(k=>addD(k.replace("s",""),(o.ded||{})[k],h)));
  const dedTotal=Object.values(dedD).reduce((a,rows)=>a+rows.reduce((b,r)=>b+r.amt,0),0);

  /* ---- special-rate buckets for the tax section (Schedule SI) ----- */
  const base112a=Math.max(0,B.b4.gain), base115ad=Math.max(0,B.b7.gain);
  const si112a=Math.max(0,Math.min(after.lt125,base112a));           /* 112A @12.5% (own ₹1.25L exempt at SI) */
  const si112a115ad=Math.max(0,Math.min(Math.max(0,after.lt125-si112a),base115ad)); /* 115AD proviso @12.5% (separate ₹1.25L) */
  const si112=Math.max(0,after.lt125-si112a-si112a115ad);            /* other LTCG @12.5% */
  const buckets={
    si111a20:after.st20,          /* STCG 111A / 115AD(1)(b)(ii) @20% */
    si30:after.st30,              /* STCG @30% */
    stApp:after.stApp,            /* STCG at applicable rate */
    stDTAA:after.stDTAA,
    si112a:si112a, si112a115ad:si112a115ad, si112:si112,
    ltDTAA:after.ltDTAA,
    si115bbh:vda.cg};             /* VDA @30% u/s 115BBH */

  /* ================= Schedule-SI feed (special-rate CG heads) =================
     70_sec_si.js consumes S.C.cg.siFeed keyed by the exact schema SecCode
     (SI.md §2/§3/§6). Value = a plain number (income; si.js supplies the rate
     from its own SI_RATE_DEF and computes the tax) OR, for a DTAA head, an
     {inc,tax} object carrying the treaty-rate tax (SI.md §4, rule A618).
     Every figure is REUSED from the ladder above (Part A/B gains, Table-E
     after-set-off slots and the ₹1.25L LTCG split) — nothing is recomputed.

     A special-rate head shares its Table-E rate-slot with siblings, so the
     post-set-off slot total (after.*) is apportioned back to its member heads
     by their gross gain (splitSI); with no current-year capital loss each head
     simply keeps its full gain. Applicable-/normal-rate slots (stApp: A1/A2/A4b/
     A6/A7/A8-app) carry NO special rate and are deliberately excluded — that is
     the income that must stay at the corporate rate.
        1A     111A / 115AD(1)(b)(ii)-STT own+NR @20%   <- A3(i)e + A4a  (E.st20)
        5AD1biip 115AD(1)(b)(ii) STCG by FII @20%       <- A3(ii)e       (E.st20)
        PTI_STCG20P pass-through STCG @20%              <- A8a           (E.st20)
        5ADii  115AD(1)(b)(ii) STCG (other than 111A) @30% <- A5e        (E.st30)
        PTI_STCG30P pass-through STCG @30%              <- A8b           (E.st30)
        2A     112A LTCG @12.5%                         <- B4 (Sch 112A) (si112a)
        5ADiiiP 115AD(1)(b)(iii) proviso LTCG @12.5%    <- B7 (Sch 115AD)(si112a115ad)
        21     112 LTCG (land/slump/B5/B8/B9) @12.5%    <- B1g/B2e/B5/B8e/B9 (si112)
        22     112(1) listed sec/ZCB @12.5%             <- B3c           (si112)
        21ciii/5AB1b/5AC1c/5ADiii  NR 112(1)(c)/115AB/115AC/115AD @12.5% <- B6 rows
        PTI_LTCG12_5P112A / PTI_LTCG12_5P pass-through LTCG @12.5% <- B10a1/B10a2 (si112)
        DTAASTCG / DTAALTCG  STCG/LTCG chargeable at the DTAA treaty rate <- A9b/B11b
        5BBH   115BBH VDA capital-gain income @30%      <- Schedule VDA item B (C2) */
  const splitSI=(dst,afterAmt,members)=>{               /* apportion a slot total across its heads */
    const codes=Object.keys(members).filter(c=>members[c]>0);
    const tot=codes.reduce((a,c)=>a+members[c],0);
    if(tot<=0||afterAmt<=0)return;
    if(afterAmt>=tot){codes.forEach(c=>{dst[c]=R((dst[c]||0)+members[c]);});return;}
    let acc=0;                                          /* set-off shrank the slot — pro-rate, last head absorbs rounding */
    codes.forEach((c,i)=>{const v=(i<codes.length-1)?R(afterAmt*members[c]/tot):R(afterAmt-acc);
      acc+=v; if(v>0)dst[c]=R((dst[c]||0)+v);});
  };
  const siFeed={};
  /* STCG @20% slot (E.st20) — 111A own+NR, FII 115AD(1)(b)(ii), pass-through */
  splitSI(siFeed,after.st20,{
    "1A":R(Math.max(0,A.a3i.gain)+Math.max(0,A.a4.a)),
    "5AD1biip":Math.max(0,A.a3ii.gain),
    "PTI_STCG20P":Math.max(0,N(a8.r20))});
  /* STCG @30% slot (E.st30) — FII 115AD(1)(b)(ii) other than 111A, pass-through */
  splitSI(siFeed,after.st30,{
    "5ADii":Math.max(0,A.a5.gain),
    "PTI_STCG30P":Math.max(0,N(a8.r30))});
  /* LTCG @12.5% — 112A (2A) and 115AD-proviso (5ADiiiP) are carved out first
     by the engine (si112a / si112a115ad); the residue si112 is the "other" pool */
  if(si112a>0)       siFeed["2A"]=R(si112a);
  if(si112a115ad>0)  siFeed["5ADiiiP"]=R(si112a115ad);
  const b6by={};                                        /* NR B6 rows classified to their SI code by the entered section */
  (C.b6||[]).forEach((rw,i)=>{const g=Math.max(0,N(((B.b6.rows||[])[i]||{}).gain));if(g<=0)return;
    const s=st0(rw.sec).toUpperCase().replace(/\s+/g,"");
    const code=/115AB/.test(s)?"5AB1b":/115AC/.test(s)?"5AC1c":/115AD/.test(s)?"5ADiii":"21ciii";
    b6by[code]=R((b6by[code]||0)+g);});
  splitSI(siFeed,si112,Object.assign({
    "21":R(Math.max(0,B.b1)+Math.max(0,B.b2.gain)+Math.max(0,B.b5.gain)+Math.max(0,B.b8.gain)+Math.max(0,B.b9.gain)),
    "22":Math.max(0,B.b3.gain),
    "PTI_LTCG12_5P112A":Math.max(0,N(b10.r125a)),
    "PTI_LTCG12_5P":Math.max(0,N(b10.r125o))},b6by));
  /* DTAA heads — treaty-rate tax (SI.md §4): {inc, tax}. inc = post-set-off
     amount; tax = inc × the applicable (lower of treaty/IT-Act) rate. */
  const dSt=R(after.stDTAA), dLt=R(after.ltDTAA);
  if(dSt>0)siFeed["DTAASTCG"]={inc:dSt,tax:R(dSt*N(A.a9.rate)/100)};
  if(dLt>0)siFeed["DTAALTCG"]={inc:dLt,tax:R(dLt*N(B.b11.rate)/100)};
  /* 115BBH VDA capital-gain income @30% (Schedule VDA item B = C2) — not part of
     Table E, taken directly */
  if(R(vda.cg)>0)siFeed["5BBH"]=R(vda.cg);

  S.C.cg={on:true,nri:nri,land,A,B,E,gain,loss,used,absorbed,matrix,after,totSet,remain,F,Fauto,
    s112a,s115ad,vda,buckets,siFeed,dedD,dedTotal:R(dedTotal),cflSTCL,cflLTCL,
    dtaaStcgRate:A.a9.rate,dtaaLtcgRate:B.b11.rate,
    C1:R(C1),C2:R(C2),C3:R(C3),
    shortTerm:A.total,longTerm:B.total,total:R(C3),
    income:R(C3)};   /* head's contribution to Gross Total Income — C3 (≥0; net loss carries via loss section) */
}

function calcRow(label,ref,n,ind){return row(label,cell(n),{ref:ref,ind:ind});}

function landBlock(p,i,lt){const r=p._||engLand(p);let h="";
  h+=row("Date of purchase / acquisition",dte("cg.land."+i+".buy"),{ref:lt?"B1":"A1"});
  h+=row("Date of sale / transfer",dte("cg.land."+i+".sale"),{});
  h+=row("a i · Full value of consideration received/receivable",inp("cg.land."+i+".cons",{n:1}),{ref:"ai"});
  h+=row("ii · Value of property as per stamp valuation authority",inp("cg.land."+i+".sdv",{n:1}),{ref:"aii"});
  h+=calcRow("iii · Full value of consideration u/s 50C","aiii",r.value);
  if(!r.safe)h+=note("Stamp value exceeds consideration by more than 10% — u/s 50C the stamp value is adopted.","warn");
  h+=row("b i · Cost of acquisition without indexation",inp("cg.land."+i+".cost",{n:1}),{ref:"bi"});
  h+=row("ii · Cost of improvement without indexation",inp("cg.land."+i+".improve",{n:1}),{ref:"bii"});
  h+=row("iii · Expenditure wholly & exclusively on transfer",inp("cg.land."+i+".exp",{n:1}),{ref:"biii"});
  h+=calcRow("iv · Total deductions u/s 48 (bi + bii + biii)","biv",r.biv);
  h+=calcRow("c · Balance (aiii − biv)","1c",r.c);
  const ex=lt?EXLT_LAND:EXST_LAND;
  ex.forEach(([code,lbl])=>{h+=row("d · Deduction u/s "+code+" (details in item D)",inp("cg.land."+i+".ded.s"+code,{n:1}),{ref:lbl,ind:1});});
  h+=calcRow(lt?"e · LTCG on Immovable property (1c − 1d)":"e · STCG on Immovable property (1c − 1d)",lt?"B1e":"A1e",r.e);
  /* buyer table (194-IA) + property location → TrnsfImmblPrprty */
  h+=row("Address of property",inp("cg.land."+i+".paddr"),{ref:"AddressOfProperty"});
  h+=row("State",sel("cg.land."+i+".pstate",CG_STATE),{ref:"StateCode"});
  h+=row("Pin code",inp("cg.land."+i+".ppin",{max:6}),{ref:"PinCode"});
  h+=row("Country code",inp("cg.land."+i+".pcountry",{max:4,ph:"91"}),{ref:"CountryCode"});
  h+=grid("cg.land."+i+".buyers",[
      {h:"Name of buyer",k:"name",t:"txt"},
      {h:"PAN",k:"pan",t:"txt",max:10},
      {h:"Aadhaar",k:"aadhaar",t:"txt",max:12},
      {h:"% share",k:"share",t:"num"},
      {h:"Amount",k:"amt",t:"num"}
    ],(p.buyers||[]),{empty:"No buyer detail (PAN mandatory if tax deducted u/s 194-IA).",add:"Add a buyer",min:"860px"});
  return blk("cgland"+(lt?"L":"S")+i,(lt?"Long-term property ":"Short-term property ")+(i+1),
    RS(r.gain),h,"cg.land."+i);
}

/* the section-48 aggregate body (shared by A3i/A3ii/A6/B3/B8 and NR B6 rows) */
function aggBody(path,r,opts){opts=opts||{};let h="";
  if(opts.unq){
    h+=row("a · Full value — unquoted shares (received/receivable)",inp(path+".unqCons",{n:1}),{ref:"ia"});
    h+=row("b · Fair market value of unquoted shares (Rule 11UA)",inp(path+".unqFmv",{n:1}),{ref:"ib"});
    h+=calcRow("c · Full value u/s 50CA (higher of a or b)","ic",r.c50ca);
    h+=row("ii · Full value — assets other than unquoted shares",inp(path+".othCons",{n:1}),{ref:"ii"});
    h+=calcRow("iii · Total consideration (ic + ii)","aiii",r.cons);
  } else {
    h+=row("a · Full value of consideration",inp(path+".cons",{n:1}),{ref:"a"});
  }
  h+=row("bi · Cost of acquisition without indexation",inp(path+".cost",{n:1}),{ref:"bi",ind:1});
  h+=row("bii · Cost of improvement without indexation",inp(path+".improve",{n:1}),{ref:"bii",ind:1});
  h+=row("biii · Expenditure w&e on transfer",inp(path+".exp",{n:1}),{ref:"biii",ind:1});
  h+=calcRow("biv · Total deductions u/s 48","biv",r.biv);
  h+=calcRow("c · Balance","c",r.c);
  if(opts.loss94)h+=row("d · Loss to be ignored u/s 94(7)/94(8)",inp(path+".loss94",{n:1}),{ref:"d"});
  if(opts.dcg)h+=row("e · Deemed STCG on depreciable assets (Sch DCG item 6)",inp(path+".dcg",{n:1}),{ref:"6e"});
  (opts.deds||[]).forEach(code=>{const c=code.replace("s","");
    h+=row("d · Deduction u/s "+c,inp(path+".ded."+code,{n:1}),{ref:c,ind:1});});
  return h;}
function aggBlock(id,title,ref,path,o,r,opts){opts=opts||{};
  const h=aggBody(path,r,opts)+calcRow(title+" gain",ref,r.gain);
  return fold(id,ref,title,RS(r.gain),h,{});}

function chkCg(){
  const out=[];const G=S.C.cg;if(!G||!G.on)return out;
  const C=S.cg;

  (C.land||[]).forEach((p,i)=>{const r=p._;if(r&&!r.safe)
    out.push({lvl:"warn",t:"Property "+(i+1)+" · section 50C",
      m:"Stamp value exceeds consideration by more than 10% — the stamp value is adopted as full value.",sec:"cg"});});
  /* mutual exclusion 112A vs 115AD proviso */
  const has112=(C.s112a||[]).some(r=>N((r._||{}).sale)||N(r.cost));
  const has115=(C.s115ad||[]).some(r=>N((r._||{}).sale)||N(r.cost));
  if(has112&&has115)out.push({lvl:"err",t:"Schedule 112A vs 115AD",
    m:"A row in Schedule 112A bars Schedule 115AD(1)(b)(iii) proviso, and vice versa.",sec:"cg"});
  /* 115AD proviso is FII/FPI (non-resident) only */
  if(has115&&!G.nri)out.push({lvl:"err",t:"Schedule 115AD",
    m:"Schedule 115AD(1)(b)(iii) proviso applies only to a non-resident FII/FPI.",sec:"cg"});
  /* VDA: dates not after 31 March of the FY */
  (C.vda||[]).forEach((r,i)=>{const dS=D(r.sale),dA=D(r.buy);
    if((dS&&dS>YREND)||(dA&&dA>YREND))out.push({lvl:"err",t:"Schedule VDA row "+(i+1),
      m:"Date of acquisition/transfer cannot be after 31 March of the financial year.",sec:"cg"});});
  /* consideration nil but section-48 deductions claimed */
  (C.land||[]).forEach((p,i)=>{if(!N(p.cons)&&(N(p.cost)||N(p.exp)||N(p.improve)))
    out.push({lvl:"warn",t:"Property "+(i+1)+" · section 48",
      m:"Where full value of consideration is zero, deductions u/s 48 cannot be claimed.",sec:"cg"});});
  /* buy-back loss needs the dividend offered in Schedule OS (reminder) */
  if(N((G.A.aA||{}).loss)||N((G.B.bA||{}).loss))
    out.push({lvl:"warn",t:"Buy-back capital loss",
      m:"A buy-back capital loss can be claimed only if the corresponding dividend is offered in Schedule OS.",sec:"cg"});

    out.push({lvl:"ok",t:"Capital gains",m:"C3 income chargeable under CAPITAL GAINS = "+RS(G.C3)+".",sec:"cg"});
  return out;
}

function dedGet(o,p){try{return p.split(".").reduce((t,k)=>t==null?undefined:t[k],o);}catch(e){return undefined;}}

    dedGet(S,"pi.s115ba"),dedGet(S,"pi.sec115")];
  for(const raw of cand){ if(raw==null||raw==="")continue;
    const s=String(raw).replace(/[^0-9A-Za-z]/g,"").toUpperCase();
    if(s.indexOf("115BAB")>=0)return "115BAB";
    if(s.indexOf("115BAA")>=0)return "115BAA";
    if(s.indexOf("115BA")>=0)return "115BA"; }
  return "";
}

function dedM80Cutoff(){

/* 80G — four buckets, ₹2,000 cash cap, 10%-of-adjusted-TI qualifying
   limit on C and D (80G.md §3-4). */
function engDed80G(gtiLimit,partCProfitLinked){
  const rows=S.ded.g80||[];
  const base=r=>N(r.other)+(N(r.cash)>2000?0:N(r.cash));   /* a cash donation over ₹2,000 gives no deduction (A809) */
  let A=0,B=0,C=0,D=0,cash=0,other=0,gross=0;
  rows.forEach(r=>{const b=base(r);gross+=N(N(r.amt)||N(r.cash)+N(r.other));cash+=N(r.cash);other+=N(r.other);
    const bk=r.bucket||"A"; if(bk==="A")A+=b; else if(bk==="B")B+=b; else if(bk==="C")C+=b; else D+=b;});
  const ql=Math.max(0,R(0.1*Math.max(0,gtiLimit-Math.max(0,partCProfitLinked||0))));   /* 80G.md §4 V3 */
  const cE=Math.min(C,ql), residual=Math.max(0,ql-cE), dE=Math.min(R(0.5*D),residual);
  const eligible=R(A + 0.5*B + cE + dE);
  return {eligible:R(eligible),cash:R(cash),other:R(other),gross:R(gross),A:R(A),B:R(B),C:R(C),D:R(D),ql:R(ql)};
}

  /* RA — supporting register; eligible = cash + other, no cap (RA.md §3) */
  const raRows=S.ded.ra||[];
  const raCash=raRows.reduce((s,r)=>s+N(r.cash),0), raOther=raRows.reduce((s,r)=>s+N(r.other),0);

  /* 80GGB / 80GGC — only the "other mode" contributions are eligible; cash never
     is; totals forced to 0 under 115BAA/115BAB (80GGB.md/80GGC.md §4). */
  const ggbRows=S.ded.ggb||[], ggcRows=S.ded.ggc||[];
  const ggbElig=conc?0:R(Math.min(ggbRows.reduce((s,r)=>s+N(r.other),0),gtiLimit));
  const ggcElig=conc?0:R(Math.min(ggcRows.reduce((s,r)=>s+N(r.other),0),gtiLimit));

  /* 80LA — per-sub-section subtotals (80LA.md §2) */
  const laRows=S.ded.la||[];
  const la1sub=R(laRows.reduce((s,r)=>s+(r.sub==="80LA(1)"?N(r.amt):0),0));
  const la1asub=R(laRows.reduce((s,r)=>s+(r.sub==="80LA(1A)"?N(r.amt):0),0));

  /* 80M — SUMIF distributions by the schedule the received dividend is offered
     under, each capped at the dividend offered under that head; date on or
     before one month prior to the 139(1) due date (A837); foreign company → 0
     (A842); belated 139(4) → 0. 80M SURVIVES 115BAA/115BAB (A849/A850). */
  const cutoff=dedM80Cutoff();
  const osDiv=dedDivOffered("os"), bpDiv=dedDivOffered("bp");
  let distOS=0, distBP=0, m80Late=false, m80NoType=false;
  (S.ded.m80||[]).forEach(r=>{const amt=N(r.amt); if(amt<=0)return;
    const iso=ISO(r.dt);
    if(!r.type)m80NoType=true;
    if(iso&&cutoff&&iso>cutoff){m80Late=true;return;}   /* past the distribution deadline — does not qualify */
    if(r.type==="ScheduleBP")distBP+=amt; else if(r.type==="ScheduleOS")distOS+=amt;});
  let m80OS=0,m80BP=0;
  if(!foreign&&!belated){
    m80OS=osDiv>0?Math.min(distOS,osDiv):distOS;      /* cap at dividend offered under OS where known */
    m80BP=bpDiv>0?Math.min(distBP,bpDiv):distBP;      /* cap at dividend offered under BP where known */
  }
  m80OS=R(m80OS); m80BP=R(m80BP); const m80=R(m80OS+m80BP);

  /* -- claimed amount per VI-A row -- */
  const fed={g80:g80.eligible,ggb:ggbElig,gga:ggaElig,ggc:ggcElig,
    ia:R(ia80),ib:R(ib80),ie:R(ie80),iac:N((S.ded.iac||{}).amt),la1:la1sub,la1a:la1asub,m80:m80};
  const claim=k=>fed[k]!==undefined?N(fed[k]):N((S.ded.v||{})[k]);

  /* -- allowed amount per VI-A row (regime + gates) -- */
  const out={},why={};
  DED_PARTB_KEYS.concat(DED_PARTC_KEYS).forEach(k=>{
    let c=claim(k);
    if(k==="gga"&&bpInc!==0&&c){why.gga="not available where there is business income (rule A836)";c=0;}
    if(conc&&!DED_CONC_SURV[k]&&c){why[k]="closed under section 115BAA / 115BAB";c=0;}
    out[k]=R(Math.max(0,c));
  });
  out.m80=m80;   /* 80M survives the concessional regime */
  if(foreign&&m80===0&&(distOS+distBP)>0)why.m80="a foreign company cannot claim 80M (rule A842)";
  else if(belated&&m80===0&&(distOS+distBP)>0)why.m80="a belated return under 139(4) gets no 80M";

  /* -- part totals, GTI-capped (VIA.md §5; A835 Part B = a+b+c+d, A850 Part C
        includes 80M; totals MIN'd against the GTI limit) -- */
  const rawB=DED_PARTB_KEYS.reduce((a,k)=>a+R(out[k]||0),0);
  const rawC=DED_PARTC_KEYS.reduce((a,k)=>a+R(out[k]||0),0)+m80;
  const partB=Math.max(0,Math.min(rawB,gtiLimit));
  const partC=Math.max(0,Math.min(rawC,gtiLimit));
  const total=rawB+rawC;                                    /* claimed grand total */
  const allowed=Math.max(0,Math.min(rawB+rawC,gtiLimit));   /* Total Chapter VI-A, capped */

  /* Section 10AA (SEZ) — NOT Chapter VI-A; subtracted separately at Part B-TI
     (10AA.md §1, rule A736). Closed under 115BAA/115BAB. */
  const aa10Raw=(S.ded.aa10||[]).reduce((s,r)=>s+N(r.amt),0);
  const ded10AA=conc?0:Math.max(0,Math.min(R(aa10Raw),gtiLimit));

  S.C.ded={income:0,                     /* a deduction contributes 0 to GTI */
    out,why,fed,
    partB:R(partB),partC:R(partC),allowed:R(allowed),total:R(total),clipped:total>gtiLimit,
    ded10AA:R(ded10AA),aa10Raw:R(aa10Raw),
    m80:m80,m80OS:m80OS,m80BP:m80BP,m80Late,m80NoType,distOS:R(distOS),distBP:R(distBP),
    ggaElig,ggbElig,ggcElig,raCash:R(raCash),raOther:R(raOther),
    ia80:R(ia80),ib80:R(ib80),ie80:R(ie80),la1sub,la1asub,
    conc,concKind:dedConc(),foreign,belated,gtiLimit,bpInc,osDiv:R(osDiv),bpDiv:R(bpDiv),cutoff};
}

  /* Schedule 80 — 80-IA / 80-IB / 80-IE undertakings */
  const grp=(gk,label)=>{const g=(get(gk)||{});const t=((g.rows)||[]).reduce((s,r)=>s+N(r.amt),0);

  h+=card("d80la","Schedule 80LA — Offshore Banking Unit / IFSC unit",(V.la1sub+V.la1asub)?RS(V.la1sub+V.la1asub):"",
    grid("ded.la",[{k:"sub",h:"Sub-section claimed",t:"sel",w:"140px",req:1,opts:DED_LA_SUB},

      {k:"ay",h:"First AY of deduction",t:"txt",w:"120px",max:7,req:1,ph:"e.g. 2025-26"},
      {k:"amt",h:"Amount for the current AY",t:"num",w:"150px",req:1}],

    row("80-LA(1) — Offshore Banking Unit",cell(V.la1sub),{cls:"tot",ref:"m"})+
    row("80-LA(1A) — IFSC unit",cell(V.la1asub),{cls:"tot",ref:"n"})+
    note("Type of entity and type of income depend on the sub-section chosen (rules A606/A607). 80-LA(1) and 80-LA(1A) cannot both be claimed together (A838).","warn"));

  const aasum=(S.ded.aa10||[]).reduce((s,r)=>s+N(r.amt),0);
  h+=card("d10aa","Schedule 10AA — units in a Special Economic Zone",(V.ded10AA||0)?RS(V.ded10AA):(aasum?RS(aasum):""),
    (V.conc?note("Closed under section 115BAA / 115BAB (rule A633).","stop"):"")+
    grid("ded.aa10",[{k:"ay",h:"AY the unit began to manufacture / produce / provide service",t:"sel",w:"auto",req:1,opts:DED_10AA_AY},
      {k:"amt",h:"Amount of deduction",t:"num",w:"220px",req:1}],S.ded.aa10||[],
      {min:"640px",empty:"No unit listed.",add:"Add a unit",foot:[{l:1,v:"Total deduction under section 10AA",span:1},{v:aasum}]})+
    note("Section 10AA is not a Chapter VI-A deduction — it is subtracted separately at Part B-TI (rule A736). The window ends at AY 2022-23.","warn"));

  /* how total income comes out */
  h+='<div class="cgband">How the total income comes out</div>';
  const gti=S.C.gti||V.gtiLimit||0;
  h+=row("Gross total income",cell(gti),{cls:"tot",hint:"set by Part B — total income and tax"});
  h+=row("Less: deductions under Chapter VI-A",cell(-(V.allowed||0)));
  if(V.ded10AA)h+=row("Less: deduction under section 10AA",cell(-(V.ded10AA||0)));
  h+=row("Total income (indicative)",cell(Math.max(0,gti-(V.allowed||0)-(V.ded10AA||0))),{cls:"grand",hint:"the tax section rounds and finalises this"});
  return h;
}

/* ===================================================================
   expDed — write the schema blocks onto j (EXACT ITR-6 keys)
   =================================================================== */
function dedAddr(r){return {AddrDetail:(sv(r.addr)||"NA").slice(0,200),
  CityOrTownOrDistrict:(sv(r.city)||"NA").slice(0,50),StateCode:st0(r.state)||"01",
  PinCode:/^\d{6}$/.test(st0(r.pin))?+r.pin:100000};}
function expDed(j){
  const V=S.C.ded||{out:{},fed:{}}; const out=V.out||{}, fed=V.fed||{};
  const conc=!!V.conc;
  const regOpen=k=>!conc||!!DED_CONC_SURV[k]||k==="m80";     /* claimed side blank for items closed by 115BAA/115BAB */
  const claim=k=>fed[k]!==undefined?N(fed[k]):N((S.ded.v||{})[k]);

  /* ---- ScheduleVIA (always present; the three totals required on each object) ---- */
  const usr={},ded={};
  Object.keys(DED_MAP).forEach(k=>{const f=DED_MAP[k];
    if(claim(k)&&regOpen(k))put(usr,f,n0(claim(k)));
    if(out[k])put(ded,f,n0(out[k]));});
  /* 80M — the OS/BP split, the total, and the distribution detail array */
  /* written through a computed key, exactly like DED_MAP above: the claimed (usr) and

/* ===================================================================
   chkDed — this section's own screen validations (err / warn)
   The department rules (A578 etc.) are Phase 6; these are the checks the
   filer sees while entering data.
   =================================================================== */
function chkDed(){
  const out=[]; const V=S.C.ded||{out:{},why:{}}; const o=V.out||{};
  const add=(lvl,t,m)=>out.push({lvl,t,m,sec:"ded"});

  if(V.conc){
    add("warn","Concessional regime","Under section 115BAA / 115BAB only 80JJAA and 80M survive; 80G, 80GGA, 80GGB, 80GGC, the 80-IA/IB/IE family, 80-IAC, 80-LA, 80-PA and section 10AA are set to zero (rules A815 / A848 / A576 / A588 / A633).");
  }
  /* 80M */
  if(V.m80NoType)add("err","80M — schedule not chosen","Every 80M distribution row must say whether the received dividend is offered under Schedule OS or Schedule BP (rule A844).");
  if(V.m80Late)add("warn","80M — distribution too late","A distribution after "+(V.cutoff?dmy(V.cutoff):"one month before the due date")+" does not qualify for 80M (rule A837); it has been excluded.");
  if(V.foreign&&(V.distOS+V.distBP)>0)add("warn","80M — foreign company","A foreign company cannot claim 80M (rule A842); it has been set to zero.");
  if(V.belated&&(V.distOS+V.distBP)>0)add("warn","80M — belated return","A belated return under 139(4) gets no 80M; it has been set to zero.");
  /* 80GGA */
  if(V.bpInc!==0&&(S.ded.gga||[]).some(r=>N(r.cash)||N(r.other)))
    add("warn","80GGA and business income","80GGA is not available where there is business income (rule A836); the eligible amount is zero.");
  (S.ded.gga||[]).forEach((r,i)=>{if(N(r.cash)>2000)add("warn","80GGA — cash over ₹2,000","Row "+(i+1)+": a cash donation over ₹2,000 gives no deduction (rule A820).");});
  /* 80G / RA / 80GGB / 80GGC — other-mode ⇒ reference + IFSC */
  (S.ded.g80||[]).forEach((r,i)=>{if(N(r.other)&&(!sv(r.ref)||!st0(r.ifsc)))
    add("err","80G — reference required","Donee "+(i+1)+": an other-mode donation needs the transaction reference and IFSC (rule A816).");
    if(N(r.cash)>2000)add("warn","80G — cash over ₹2,000","Donee "+(i+1)+": a cash donation over ₹2,000 gives no deduction (rule A809).");});
  /* 80G — PAN uniqueness across buckets (A813) */
  {const seen={};(S.ded.g80||[]).forEach(r=>{const p=st0(r.pan).toUpperCase();if(!p)return;
    (seen[p]=seen[p]||{})[r.bucket||"A"]=1;});
   Object.keys(seen).forEach(p=>{if(Object.keys(seen[p]).length>1)add("warn","80G — repeated PAN","PAN "+p+" appears in more than one 80G bucket (rule A813).");});}
  const polChk=(rows,sec)=>{(rows||[]).forEach((r,i)=>{if(!(N(r.cash)||N(r.other)))return;
    if(!sv(r.name)||!st0(r.pan))add("err",sec+" — party details","Row "+(i+1)+": the political party's name and PAN are required.");
    if(N(r.other)&&(!sv(r.ref)||!st0(r.ifsc)))add("err",sec+" — reference required","Row "+(i+1)+": an other-mode contribution needs the transaction reference and IFSC.");
    const iso=ISO(r.dt);if(iso&&(iso<"2025-04-01"||iso>"2026-03-31"))add("warn",sec+" — date out of year","Row "+(i+1)+": the contribution must fall in FY 2025-26.");});};
  polChk(S.ded.ggb,"80GGB"); polChk(S.ded.ggc,"80GGC");
  /* 80IAC */
  {const x=S.ded.iac||{};if(N(x.amt)){const iso=ISO(x.doi);
    if(iso&&iso<="2016-04-01")add("warn","80IAC — incorporation date","The start-up must be incorporated after 01-04-2016 to claim 80-IAC (rule A600).");
    if(!sv(x.nature)||!sv(x.cert)||!st0(x.fay)||!iso)add("err","80IAC — details required","When 80-IAC is claimed, the incorporation date, nature of business, certificate number and first AY are all required (rule A599).");}}
  /* 80LA */

   if(V.la1sub>0&&V.la1asub>0)add("warn","80LA — one sub-section only","80-LA(1) and 80-LA(1A) cannot both be claimed together (rule A838).");}
  /* GTI cap */
  if(V.clipped)add("warn","Deductions capped","The Chapter VI-A total is limited to the gross total income.");
  /* a settled figure */
  if((V.allowed||0)>0||(V.ded10AA||0)>0)add("ok","Deductions allowed","Chapter VI-A: "+RS(V.allowed||0)+
    (V.ded10AA?"; section 10AA: "+RS(V.ded10AA):"")+".");
  return out;
}

/* 2(iv) feed — the balance income deemed to be from agriculture (Schedule BP
   BalIncDeemedFrmAgri, EI Sl.2(iv) NetAgriIncRelateToRule7; rule A649). The BP
   builder publishes this scalar into S.C.bp; the read is guarded across the
   likely names so EI never throws before/without a BP engine (CEO wires the seam). */
function eiBpBalAgri(){
  const b = S.C.bp || {}, a = b.a || {};
  const cands = [b.balAgri, a.balAgri, b.balIncDeemedFrmAgri, a.balIncDeemedFrmAgri, b.netAgri, a.netAgri];
  for(const c of cands){ if(c!=null && isFinite(N(c))) return N(c); }
  return 0;
}

/* ---- engine ------------------------------------------------------ */
function engEi(){
  S.ei = S.ei || {};
  const E = S.ei;
  const C = S.C.ei = { income:0 };
  isNew();  /* regime read — no closures apply to Schedule EI (exempt income stays open) */

  /* line 1 */
  const interest = R(E.interest);                                   /* [InterestInc] */

  /* line 2 — the agricultural working */
  const grossAgri = R(E.grossAgri);                                 /* 2i  GrossAgriRecpt */
  const expAgri   = R(E.expAgri);                                   /* 2ii ExpIncAgri */
  const unabAgri  = R(E.unabAgri);                                  /* 2iii UnabAgriLossPrev8 */
  /* 2iv = MAX(0, balance income deemed to be from agriculture, from Sch BP) [H9=BP.40] */
  const agri4 = Math.max(0, R(eiBpBalAgri()));                      /* NetAgriIncRelateToRule7 */
  /* 2v = MAX(0, i - ii - iii + iv) — enter nil if loss [H10] */
  const net2v = Math.max(0, grossAgri - expAgri - unabAgri + agri4);/* NetAgriIncOrOthrIncRule7 */

  /* land rows (2vi) — only meaningful when net2v > 5 lakh */
  const land = (E.land||[]).map(r=>({
    district:st0((r||{}).district), pin:st0((r||{}).pin),
    meas:N((r||{}).meas), owned:st0((r||{}).owned), irr:st0((r||{}).irr),
    filled: !!(st0((r||{}).district)||st0((r||{}).pin)||N((r||{}).meas)||st0((r||{}).owned)||st0((r||{}).irr))
  }));

  /* line 3 — other exempt income table; Others = MAX(0, SUM(Amount)) [G39] */
  const others = (E.others||[]).map(r=>({
    cat:st0((r||{}).cat), sub:st0((r||{}).sub), desc:st0((r||{}).desc),
    amt:R((r||{}).amt)
  }));
  const Others = Math.max(0, others.reduce((a,r)=>a+r.amt,0));     /* Others */

  /* line 4 — DTAA (non-residents); IncChrgblAsPerDTAA = MAX(0, SUM(AmountOfIncome)) [J56] */
  const dtaa = (E.dtaa||[]).map(r=>({
    amt:R((r||{}).amt), nature:st0((r||{}).nature), cname:st0((r||{}).cname),
    ccode:st0((r||{}).ccode), article:st0((r||{}).article),
    head:st0((r||{}).head), trc:st0((r||{}).trc)
  }));
  const dtaaTotal = Math.max(0, dtaa.reduce((a,r)=>a+r.amt,0));    /* IncChrgblAsPerDTAA */

  /* line 5 */
  const passThr = R(E.passThr);                                     /* PassThrIncNotChrgblTax */

  /* line 6 = MAX(0, 1 + 2(v) + 3 + 4 + 5) [J58] */
  const total6 = Math.max(0, interest + net2v + Others + dtaaTotal + passThr); /* TotalExemptInc */

  C.interest = interest;
  C.grossAgri = grossAgri; C.expAgri = expAgri; C.unabAgri = unabAgri;
  C.agri4 = agri4;
  C.net2v = net2v;                 /* Sl.No.2 net agricultural income */
  C.land = land;
  C.others = others; C.othersTot = Others;
  C.dtaa = dtaa; C.dtaaTotal = dtaaTotal;
  C.passThr = passThr;
  C.total = total6;
  C.needLand = net2v > EI_5L;

  /* rate effect — net agri income for the tax section (Part B-TI Sl.16, rule A739) */
  S.C.eiAgri = net2v;

  /* exempt income adds nothing to Gross Total Income */
  C.income = 0;
}

/* ---- renderer ---------------------------------------------------- */
function secEi(){
  const E = S.ei||{}, C = S.C.ei||{};
  let h = "";
  h += note('Schedule EI collects income that is not chargeable to tax. Nothing here is taxed. Two figures still matter: the <b>net agricultural income</b> at Sl. No. 2 is carried for rate purposes (Part B-TI Sl. No. 16, partial integration), and Sl. No. 2(iv) &amp; Sl. No. 5 reconcile to Schedule BP (Sl. No. 40) and Schedule PTI. A company has no basic-exemption slab, so the rate effect is carried but does not change the flat rate. Exempt income is unaffected by the new tax regime.');

  /* ===== 1 · Interest income ===== */
  h += row("1 · Interest income", inp("ei.interest",{n:1}), {ref:"InterestInc"});

  /* ===== 2 · Agricultural income working ===== */
  h += sub("2 · Agricultural income");
  h += row("i · Gross agricultural receipts (other than income excluded under rule 7A/7B/8)",
           inp("ei.grossAgri",{n:1}), {ref:"GrossAgriRecpt", ind:1});
  h += row("ii · Expenditure incurred on agriculture", inp("ei.expAgri",{n:1}),
           {ref:"ExpIncAgri", ind:1});
  h += row("iii · Unabsorbed agricultural loss of the previous eight assessment years",
           inp("ei.unabAgri",{n:1}), {ref:"UnabAgriLossPrev8", ind:1});
  h += row("iv · Agricultural income portion relating to Rule 7/7A/7B(1)/7B(1A)/8 (from Sl. No. 40 of Schedule BP)",
           cell(C.agri4), {ref:"NetAgriIncRelateToRule7", ind:1, hint:"= balance income deemed from agriculture in Schedule BP; auto-pulled"});
  h += row("v · Net agricultural income for the year (i − ii − iii + iv; nil if loss)",
           cell(C.net2v), {ref:"NetAgriIncOrOthrIncRule7", ind:1, req:1});

  /* 2(vi) — land details, only when 2(v) > Rs.5 lakh */
  if(C.needLand){
    h += note("Net agricultural income exceeds ₹5,00,000 — the details of each agricultural land are mandatory (Sl. No. 2(vi)).","warn");
    h += grid("ei.land",[
      {k:"district",h:"District (with PIN)",t:"txt",max:125,w:"200px",req:1},
      {k:"pin",h:"PIN code",t:"txt",max:6,w:"100px",req:1,ph:"6-digit"},

    ], E.land||[], {min:"780px", empty:"Add each agricultural land parcel.", add:"Add a land parcel"});
  } else {
    h += note("The land table (Sl. No. 2(vi)) opens only when net agricultural income exceeds ₹5,00,000.");
  }

  /* ===== 3 · Other exempt income ===== */
  h += sub("3 · Other exempt income (please specify)");
  {
    let t = '<div class="full"><table class="gt" style="min-width:860px"><thead><tr>'+
      '<th>Sl</th><th class="l req">Category</th><th class="l req">Sub-Category</th>'+
      '<th class="l">Description</th><th class="req">Amount</th><th class="x"></th></tr></thead><tbody>';
    const rows = E.others||[];
    if(!rows.length){
      t += '<tr><td class="emp" colspan="6">Nothing entered.</td></tr>';
    } else {
      rows.forEach((r,i)=>{
        const pre = "ei.others."+i+".";
        t += '<tr><td class="num">'+(i+1)+'</td>'+
          '<td class="l">'+sel(pre+"cat", EI_CAT, {style:"width:100%"})+'</td>'+
          '<td class="l">'+sel(pre+"sub", eiSubOpts(), {style:"width:100%"})+'</td>'+
          '<td>'+inp(pre+"desc",{max:125})+'</td>'+
          '<td>'+inp(pre+"amt",{n:1})+'</td>'+
          '<td class="x"><button data-del="ei.others.'+i+'" title="Remove">'+TRASH+'</button></td></tr>';
      });
      t += '<tr><td class="l" colspan="4"><b>Total (other exempt income)</b></td>'+
        '<td class="num">'+cell(C.othersTot)+'</td><td></td></tr>';
    }
    t += '</tbody></table></div><button class="add" data-add="ei.others">Add an exempt-income row</button>';
    h += t;
    h += note("Choose the Category, then the Sub-Category (both mandatory where an amount is entered — rule A659). The Sub-Category list carries all 73 coded exemptions; the utility's per-Category filter lives in named ranges the source dump could not resolve. The row total feeds Sl. No. 3 (Others).");
  }

  /* ===== 4 · Income not chargeable as per DTAA (non-residents only) ===== */
  h += sub("4 · Income claimed as not chargeable to tax as per DTAA (non-residents only)");
  h += grid("ei.dtaa",[
    {k:"amt",h:"Amount of income",t:"num",w:"140px",req:1},
    {k:"nature",h:"Nature of income",t:"txt",max:75,w:"170px"},
    {k:"cname",h:"Country name",t:"txt",max:55,w:"160px",req:1},
    {k:"ccode",h:"Country code",t:"sel",opts:EI_CTRY,w:"210px",req:1},
    {k:"article",h:"Article of DTAA",t:"txt",max:16,w:"130px"},
    {k:"head",h:"Head of income",t:"sel",opts:EI_HEAD,w:"210px",req:1},
    {k:"trc",h:"TRC obtained",t:"sel",opts:EI_TRC,w:"120px"}
  ], E.dtaa||[], {min:"1130px", empty:"For non-residents only.", add:"Add a DTAA row",
     foot:[{v:(C.dtaaTotal||0)},{l:1,v:"Total income from DTAA claimed not chargeable (Sl. No. 4)",span:6}]});

  /* ===== 5 · Pass-through income ===== */
  h += row("5 · Pass-through income claimed as not chargeable to tax (Schedule PTI)",
           inp("ei.passThr",{n:1}), {ref:"PassThrIncNotChrgblTax",
           hint:"must equal the exempt pass-through in Schedule PTI (rule A646)"});

  /* ===== 6 · Total ===== */
  h += row("6 · Total exempt income (1 + 2(v) + 3 + 4 + 5)", cell(C.total),
           {ref:"TotalExemptInc", req:1, cls:"tot"});

  return h;
}

/* ---- export ------------------------------------------------------ */
function expEi(j){
  const C = S.C.ei||{};
  const o = {};

  /* single figures (written only when non-zero) */
  put(o,"InterestInc", C.interest ? sg(C.interest) : undefined);
  if(C.grossAgri) put(o,"GrossAgriRecpt", sg(C.grossAgri));
  if(C.expAgri)   put(o,"ExpIncAgri", sg(C.expAgri));
  if(C.unabAgri)  put(o,"UnabAgriLossPrev8", sg(C.unabAgri));
  if(C.agri4)     put(o,"NetAgriIncRelateToRule7", n0(C.agri4));
  /* required total (2v) — always present, even at zero */
  o.NetAgriIncOrOthrIncRule7 = n0(C.net2v);

  /* 2(vi) land table — only when it has rows carrying data */
  const land = (C.land||[]).filter(r=>r.filled);
  if(land.length){
    o.ExcNetAgriInc = { ExcNetAgriIncDtls: land.map(r=>{
      const d = {};
      pf(d,"NameOfDistrict",(sv(r.district)||"NA").slice(0,125));
      pf(d,"PinCode", R(r.pin)||undefined);
      pf(d,"MeasurementOfLand", r.meas ? r.meas : undefined);
      pf(d,"AgriLandOwnedFlag", sv(r.owned));
      pf(d,"AgriLandIrrigatedFlag", sv(r.irr));
      return d;
    })};
  }

  /* line 3 — other exempt income; write rows carrying an amount or a selection */
  const others = (C.others||[]).filter(r=>r.amt || st0(r.cat) || st0(r.sub) || st0(r.desc));
  if(others.length){
    o.OthersInc = { OthersIncDtls: others.map(r=>{
      const d = {};
      pf(d,"Category", sv(r.cat));
      pf(d,"SubCategory", sv(r.sub));
      pf(d,"Description", sv(r.desc) ? sv(r.desc).slice(0,125) : undefined);
      d.OthAmount = n0(r.amt);
      return d;
    })};
  }
  /* required total (3) — always present, even at zero */
  o.Others = n0(C.othersTot);

  /* line 4 — DTAA */
  const dtaa = (C.dtaa||[]).filter(r=>r.amt || st0(r.cname) || st0(r.ccode));
  if(dtaa.length){
    o.IncNotChrgblAsPerDTAA = { IncNotChrgblAsPerDTAADtls: dtaa.map(r=>{
      const d = {};
      d.AmountOfIncome = n0(r.amt);
      pf(d,"NatureOfIncome", sv(r.nature) ? sv(r.nature).slice(0,75) : undefined);
      pf(d,"CountryName",(sv(r.cname)||"NA").slice(0,55));
      pf(d,"CountryCodeExcludingIndia", sv(r.ccode));
      pf(d,"ArticleOfDTAA", sv(r.article) ? sv(r.article).slice(0,16) : undefined);
      pf(d,"HeadOfIncome", sv(r.head));
      pf(d,"TRCFlag", sv(r.trc));
      return d;
    })};
  }
  /* required total (4) — always present, even at zero */
  o.IncChrgblAsPerDTAA = n0(C.dtaaTotal);

  /* line 5 */
  if(C.passThr) put(o,"PassThrIncNotChrgblTax", sg(C.passThr));

  /* required total (6) — always present, even at zero */
  o.TotalExemptInc = n0(C.total);

  j.ScheduleEI = o;
}

/* ---- import ------------------------------------------------------ */
function impEi(I6){
  const read = [];
  const EI = I6 && I6.ScheduleEI;
  if(!EI) return read;
  S.ei = S.ei || {};
  const E = S.ei;

  E.interest  = nz(EI.InterestInc);
  E.grossAgri = nz(EI.GrossAgriRecpt);
  E.expAgri   = nz(EI.ExpIncAgri);
  E.unabAgri  = nz(EI.UnabAgriLossPrev8);
  E.passThr   = nz(EI.PassThrIncNotChrgblTax);

  const land = ((EI.ExcNetAgriInc||{}).ExcNetAgriIncDtls)||[];
  E.land = land.map(r=>({
    district:r.NameOfDistrict||"", pin:(r.PinCode!=null?String(r.PinCode):""),
    meas:(r.MeasurementOfLand!=null?String(r.MeasurementOfLand):""),
    owned:r.AgriLandOwnedFlag||"", irr:r.AgriLandIrrigatedFlag||""
  }));

  const others = ((EI.OthersInc||{}).OthersIncDtls)||[];
  E.others = others.map(r=>({
    cat:r.Category||"", sub:r.SubCategory||"", desc:r.Description||"", amt:nz(r.OthAmount)
  }));

  const dtaa = ((EI.IncNotChrgblAsPerDTAA||{}).IncNotChrgblAsPerDTAADtls)||[];
  E.dtaa = dtaa.map(r=>({
    amt:nz(r.AmountOfIncome), nature:r.NatureOfIncome||"", cname:r.CountryName||"",
    ccode:(r.CountryCodeExcludingIndia!=null?String(r.CountryCodeExcludingIndia):""),
    article:r.ArticleOfDTAA||"", head:r.HeadOfIncome||"", trc:r.TRCFlag||""
  }));

  read.push("Schedule EI");
  if(E.land.length)   read.push("EI agricultural land");
  if(E.others.length) read.push("EI other exempt income");
  if(E.dtaa.length)   read.push("EI DTAA income");
  return read;
}

/* ---- checks ------------------------------------------------------ */
function chkEi(){
  const out = [], C = S.C.ei||{};
  const res = st0((S.pi||{}).res), isRes = (res==="RES"||res==="");
  const isDom = st0((S.pi||{}).domestic)==="Y";

  /* net agri income > 5 lakh requires the land table (rules A654/A655) */
  if(C.needLand){
    const rows = (C.land||[]).filter(r=>r.filled);
    if(!rows.length){
      out.push({lvl:"err", t:"Schedule EI · agricultural land",
        m:"Net agricultural income exceeds ₹5,00,000, so the details of each agricultural land (Sl. No. 2(vi)) are mandatory.", sec:"ei"});
    } else {
      rows.forEach((r,i)=>{
        if(!st0(r.district) || !/^\d{6}$/.test(st0(r.pin)) || !(r.meas>0) || !st0(r.owned) || !st0(r.irr))
          out.push({lvl:"err", t:"Schedule EI · agricultural land",
            m:"Land row "+(i+1)+": district, a 6-digit PIN code, measurement, owned/held-on-lease and irrigated/rain-fed are all required.", sec:"ei"});
      });
    }
  }

  /* other exempt income rows — Category + Sub-category mandatory where amount>0 (A659),
     description for the free-text sub-categories (A658), duplicate sub-category (A655),
     resident/domestic applicability (A656/A657), and per-section forms (A652/A653) */
  const seen = {};
  (C.others||[]).forEach((r,i)=>{
    if(r.amt && (!st0(r.cat) || !st0(r.sub)))
      out.push({lvl:"err", t:"Schedule EI · other exempt income",
        m:"Row "+(i+1)+": Category and Sub-category are mandatory where an amount is entered (rule A659).", sec:"ei"});
    if((st0(r.cat)||st0(r.sub)||st0(r.desc)) && !r.amt)
      out.push({lvl:"warn", t:"Schedule EI · other exempt income",
        m:"Row "+(i+1)+": a category/description is set but the amount is nil.", sec:"ei"});
    if(r.amt && EI_SUB_DESC.indexOf(st0(r.sub))>=0 && !st0(r.desc))
      out.push({lvl:"err", t:"Schedule EI · other exempt income",
        m:"Row "+(i+1)+": a Description is mandatory for this sub-category (rule A658).", sec:"ei"});
    if(st0(r.sub)){
      if(seen[r.sub])
        out.push({lvl:"warn", t:"Schedule EI · other exempt income",
          m:"Sub-category "+r.sub+" is selected on more than one row; it may be reported only once (rule A655).", sec:"ei"});
      seen[r.sub]=1;
    }
    if(r.amt && isRes && EI_SUB_NOTRES.indexOf(st0(r.sub))>=0)
      out.push({lvl:"warn", t:"Schedule EI · other exempt income",
        m:"Row "+(i+1)+": exempt income u/s "+r.sub+" cannot be reported by a Resident (rule A656).", sec:"ei"});
    if(r.amt && isDom && EI_SUB_NOTDOM.indexOf(st0(r.sub))>=0)
      out.push({lvl:"warn", t:"Schedule EI · other exempt income",
        m:"Row "+(i+1)+": exempt income u/s "+r.sub+" cannot be reported by a domestic company (rule A657).", sec:"ei"});
    if(r.amt && st0(r.sub)==="10(23FF)")
      out.push({lvl:"warn", t:"Schedule EI · other exempt income",
        m:"Row "+(i+1)+": Form 10-II must be filed for exemption u/s 10(23FF) (rule A652).", sec:"ei"});
    if(r.amt && st0(r.sub)==="10(4D)")
      out.push({lvl:"warn", t:"Schedule EI · other exempt income",
        m:"Row "+(i+1)+": Form 10-IG or Form 10-IK must be filed for exemption u/s 10(4D) (rule A653).", sec:"ei"});
  });

  /* DTAA rows — required fields and non-resident applicability */
  const dtaaRows = (C.dtaa||[]).filter(r=>r.amt || st0(r.cname) || st0(r.ccode));
  dtaaRows.forEach((r,i)=>{
    if(!r.amt || !st0(r.cname) || !st0(r.ccode) || !st0(r.head))
      out.push({lvl:"err", t:"Schedule EI · DTAA",
        m:"DTAA row "+(i+1)+": amount, country name, country code and head of income are mandatory.", sec:"ei"});
  });
  if(dtaaRows.length && isRes)
    out.push({lvl:"warn", t:"Schedule EI · DTAA",
      m:"The DTAA not-chargeable table (Sl. No. 4) is applicable for non-residents only, but the residential status is Resident.", sec:"ei"});

  /* line 5 must reconcile to Schedule PTI exempt pass-through (guarded cross-read; rule A646) */
  const ptiExempt = ((S.C.other||{}).pti||[]).reduce((a,b)=>a+R((b.exTot||{}).net||0),0);
  if(R(C.passThr)!==R(ptiExempt) && (R(C.passThr)||R(ptiExempt)))
    out.push({lvl:"warn", t:"Schedule EI · pass-through",
      m:"Sl. No. 5 pass-through income ("+RS(C.passThr)+") should equal the exempt pass-through in Schedule PTI ("+RS(ptiExempt)+").", sec:"ei"});

  return out;
}

       return bits.join(" · ");},
     eng:engEi, exp:expEi, imp:impEi, chk:chkEi, order:18});

   Schema blocks: ScheduleFSI, ScheduleTR1, ScheduleFA

function faOn(){return faRes()==="RES";}
function faCount(){return ["a1","a2","a3","a4","b","c","d","e","f","g"]
  .reduce((a,k)=>a+((S.fa[k]||[]).length),0);}

/* ================================================================
   ENGINE — engFa()
   ================================================================ */
function engFa(){
  const C=S.C.fa={income:0, fsi:[], trRows:[], paidTot:0, reliefTot:0,
                  dtaa:0, notDtaa:0, relief90:0, relief91:0, hasFA:false};
  /* Schedule FSI adds no income to GTI — column (b) is already in Part B-TI. */
  C.income=0;

  /* Schedule FA present ⟺ any table has a row and the company is resident.
     Published so the Part B-TTI owner (bank/tax) can set AssetOutsideIndiaFlg. */
  C.hasFA = faOn() && faCount()>0;

  if(!faOn()){S.fa.fsi=S.fa.fsi||[];return;}  /* non-resident: schedules not applicable */

  (S.fa.fsi||[]).forEach(rw=>{
    const heads=["hp","bus","cg","os"];       /* NO salary head (company) */
    let tb=0,tc=0,td=0,te=0; const hc={};
    heads.forEach(k=>{
      const h=rw[k]||{};
      const b=n0(h.b), c=n0(h.c), d=n0(h.d);
      const e=Math.min(c,d);                  /* Q=MIN(O,P): relief = lower of tax paid (c) and tax payable (d) */
      hc[k]={b,c,d,e};
      tb+=b; tc+=c; td+=d; te+=e;             /* Total row = SUM down each column */
    });
    C.fsi.push({code:rw.code||"", name:FA_CONM[rw.code]||rw.name||"", tin:rw.tin||"",
                sec:rw.sec||"", heads:hc, tot:{b:tb,c:tc,d:td,e:te}});
    /* one Schedule TR row per country: (c)=country total tax paid, (d)=country total relief */
    if(rw.code){
      C.trRows.push({code:rw.code, name:FA_CONM[rw.code]||rw.name||"", tin:rw.tin||"",
                     paid:tc, relief:te, sec:rw.sec||""});
    }
  });

  /* TR totals (TR_FA.md) */
  C.paidTot   = C.trRows.reduce((a,r)=>a+n0(r.paid),0);      /* SUM col (c) -> TotalTaxOutsideIndia */
  C.reliefTot = C.trRows.reduce((a,r)=>a+n0(r.relief),0);    /* SUM col (d) -> TotalTaxReliefOutsideIndia */
  C.dtaa      = C.trRows.reduce((a,r)=>a+((r.sec==="90"||r.sec==="90A")?n0(r.relief):0),0); /* SUMIF 90/90A */
  C.notDtaa   = C.trRows.reduce((a,r)=>a+(r.sec==="91"?n0(r.relief):0),0);                  /* SUMIF 91 */
  /* Part B-TTI relief feeds: DTAA relief -> Section90, non-DTAA relief -> Section91 */
  C.relief90  = C.dtaa;
  C.relief91  = C.notDtaa;
}

/* ================================================================
   RENDERER — secFa()
   ================================================================ */
function secFa(){
  const res=faRes();
  const C=S.C.fa||{fsi:[],trRows:[],paidTot:0,reliefTot:0,dtaa:0,notDtaa:0};

  if(!faOn())
