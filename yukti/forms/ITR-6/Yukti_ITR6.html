<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YUKTI Tax Compliance — ITR-2, A.Y. 2026-27</title>
<style>
:root{
  --maroon:#7A1F2B; --maroon-d:#5C1720; --maroon-w:#F6EBEC;
  --white:#FFFFFF; --bone:#F5F4F1; --rule:#DCDCD6; --rule-2:#EDEBE6;
  --ink:#16161A; --ink-2:#4A4A52; --ink-3:#7C7C86;
  --red:#C0392B; --green:#1C5D4A; --green-w:#E9F1EE;
  --sienna:#9C4A15; --sienna-w:#FAEFE6;
  --field:#FFFEF9; --field-b:#C9C3AD; --closed:#F0EFEB;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"SF Mono",Consolas,"DejaVu Sans Mono",monospace;
  --rail:268px; --top:52px; --band:54px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bone);color:var(--ink);font:13.5px/1.45 var(--sans);
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--maroon);outline-offset:1px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* masthead — three things and nothing else */
.top{position:fixed;inset:0 0 auto 0;height:var(--top);z-index:60;background:var(--maroon);
  color:#fff;display:flex;align-items:center;gap:26px;padding:0 20px;
  border-bottom:2px solid var(--maroon-d)}
.top .b{font:600 19px/1 var(--serif);letter-spacing:.3px;white-space:nowrap}
.top .b em{font-style:normal;opacity:.64;font-size:12.5px;font-family:var(--sans);
  font-weight:400;margin-left:9px}
.top .frm{font:600 17px/1 var(--serif)}
.top .y{font-size:13px;opacity:.76;white-space:nowrap}
.top .sp{flex:1}
.tbtn{height:28px;padding:0 13px;white-space:nowrap;border:1px solid rgba(255,255,255,.42);border-radius:3px;
  font-size:12.5px;font-weight:500}
.tbtn:hover{background:rgba(255,255,255,.14)}
.tbtn.solid{background:#fff;color:var(--maroon);border-color:#fff;font-weight:600}
.tbtn.solid:hover{background:#F0E2E4}

/* index rail */
.rail{position:fixed;top:var(--top);bottom:var(--band);left:0;width:var(--rail);z-index:40;
  background:var(--bone);border-right:1px solid var(--rule);overflow-y:auto;padding:10px 0 20px}
.rail h2{font:500 10.5px/1 var(--sans);color:var(--ink-3);letter-spacing:.7px;padding:9px 18px 8px}
.nv{display:block;width:100%;text-align:left;padding:8px 16px 8px 15px;
  border-left:3px solid transparent;position:relative}
.nv:hover{background:#ECEAE5}
.nv.on{background:var(--white);border-left-color:var(--maroon)}
.nv .t{display:block;font:600 13.5px/1.25 var(--serif)}
.nv.on .t{color:var(--maroon)}
.nv .s{display:block;font-size:11px;color:var(--ink-3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nv .s.done{color:var(--green)} .nv .s.bad{color:var(--red);font-weight:600}

/* the sheet */
.wrap{position:absolute;top:var(--top);left:var(--rail);right:0;bottom:var(--band);
  overflow-y:auto;background:var(--bone)}
.sheet{max-width:1080px;margin:0 auto;padding:22px 26px 70px}

/* a section: maroon bar that opens and shuts */
section{background:var(--white);border:1px solid var(--rule);border-radius:3px;
  margin:0 0 14px;overflow:hidden;scroll-margin-top:14px}
.bar{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--maroon);color:#fff;padding:10px 14px}
.bar:hover{background:#8B2532}
.bar .cv{width:17px;height:17px;flex:none;border:1px solid rgba(255,255,255,.5);
  border-radius:2px;font-size:12px;line-height:15px;text-align:center}
.bar .t{font:600 15px/1.2 var(--serif);flex:1}
.bar .r{font-size:11.5px;opacity:.72;flex:none}
.bar .v{font:600 14px/1 var(--mono);flex:none;margin-left:14px}
.body{display:none;padding:4px 0 10px}
.body.open{display:block}

/* rows */
.r{display:flex;align-items:center;min-height:33px;border-bottom:1px solid var(--rule-2);
  padding:0 14px;gap:9px}
.r:hover{background:#FBFAF8}
.r.sub{background:#F7F6F3;min-height:28px}
.r.sub .l{font-weight:600;font-size:12px;color:var(--ink-2)}
.r.tot{border-top:1px solid var(--ink);border-bottom:2px solid var(--ink);background:#F7F6F3}
.r.tot .l,.r.tot .v{font-weight:700}
.r.grand{background:var(--maroon-w);border-top:1px solid var(--maroon);
  border-bottom:2px solid var(--maroon)}
.r.grand .l,.r.grand .v{font-weight:700;color:var(--maroon-d)}
.r.closed{background:var(--closed);opacity:.72}
.l{flex:1;min-width:0;padding:5px 0;font-size:13.5px}
.l.req{color:var(--red);font-weight:600}
.l .i1{padding-left:20px;display:inline-block}
.l .hint{color:var(--ink-3);font-size:11px;font-weight:400;margin-left:7px}
.ref{flex:none;width:52px;font-size:11px;color:var(--ink-3);font-family:var(--serif)}
.v{flex:none;width:160px;text-align:right}
.v2{flex:none;width:150px;text-align:right}
.hd2{font-size:10.5px;color:var(--ink-3);font-weight:600}

/* fields */
.f{width:100%;height:27px;padding:0 7px;border:1px solid var(--field-b);border-radius:2px;
  background:var(--field);font-size:13.5px}
.f:focus{border-color:var(--maroon);background:#fff}
.f.n{text-align:right;font-family:var(--mono);font-size:13px}
.f.over{background:var(--sienna-w);border-color:#D8B492;color:var(--sienna)}
.f[disabled]{background:var(--closed);color:var(--ink-3);cursor:not-allowed}
select.f{padding:0 4px;cursor:pointer}
.c{display:block;font-family:var(--mono);font-size:13px;color:var(--green);
  padding:5px 7px 5px 0;font-weight:600}
.c.zero{color:#B4B4BB;font-weight:400} .c.neg{color:var(--red)}
.dt{font-size:10.5px;color:var(--ink-3);display:block;text-align:right;margin-top:1px}

/* optional card */
.card{margin:8px 14px;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.card .ch{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 12px;background:#FAF9F6}
.card .ch:hover{background:#F3F1EC}
.card.on .ch{background:var(--maroon-w);border-bottom:1px solid var(--rule)}
.card .ch .sw{width:34px;height:18px;flex:none;border-radius:9px;background:#CFCCC4;
  position:relative;transition:background .12s}
.card.on .ch .sw{background:var(--maroon)}
.card .ch .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;
  border-radius:50%;background:#fff;transition:left .12s}
.card.on .ch .sw::after{left:18px}
.card .ch .t{flex:1;font:600 13px/1.2 var(--serif)}
.card .ch .st{font-size:11.5px;color:var(--ink-3);flex:none}
.card.on .ch .st{color:var(--maroon-d);font-weight:600;font-family:var(--mono)}
.card .cb{display:none;padding:4px 0 8px} .card.on .cb{display:block}

/* tables */
.gt{width:100%;border-collapse:collapse;margin:4px 0}
.gt th{font-size:10.5px;font-weight:600;color:var(--ink-2);text-align:right;padding:6px 7px;
  border-bottom:1px solid var(--ink);white-space:nowrap}
.gt th.l,.gt td.l{text-align:left}
.gt th.req{color:var(--red)}
.gt td{padding:2px 4px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
.gt td.num{padding:5px 7px;text-align:right}
.gt tfoot td{border-top:1px solid var(--ink);border-bottom:2px solid var(--ink);
  background:#F7F6F3;font-weight:700;padding:6px 7px;text-align:right}
.gt tfoot td.l{text-align:left}
.gt .x{width:28px;text-align:center}
.gt .x button{color:var(--ink-3);font-size:15px;line-height:1;padding:2px 5px;border-radius:2px}
.gt .x button:hover{background:var(--maroon-w);color:var(--maroon)}
.gt .f{height:25px}
.full{overflow-x:auto;padding:0 14px}
.add{margin:5px 14px 2px;height:27px;padding:0 13px;border:1px solid var(--maroon);
  border-radius:3px;color:var(--maroon);font-size:12.5px;font-weight:600;background:#fff}
.add:hover{background:var(--maroon);color:#fff}
.emp{padding:13px 6px;color:var(--ink-3);font-size:12.5px;font-style:italic}

/* property block */
.blk{margin:8px 14px;border:1px solid var(--rule);border-radius:3px}
.blk .bh{display:flex;align-items:center;gap:6px;padding:0 8px 0 0;background:#FAF9F6;
  border-bottom:1px solid var(--rule)}
.blk .bhx{flex:1;display:flex;align-items:center;gap:10px;padding:8px 12px;text-align:left;
  background:none;border:0;cursor:pointer;font:inherit}
.blk .bhx:hover{background:#F1EFEA}
.blk .cv2{width:16px;height:16px;flex:none;border:1px solid var(--rule);border-radius:2px;
  font-size:12px;line-height:14px;text-align:center;color:var(--ink-3)}
.blk .blkdel{flex:none;color:var(--ink-3);padding:6px 8px;border-radius:3px;cursor:pointer}
.blk .blkdel:hover{background:var(--maroon-w);color:var(--maroon)}
.blk .bh .t{flex:1;font:600 13px/1.2 var(--serif)}
.blk .bh .s{font-size:11.5px;color:var(--ink-3)}
.blk .bb{display:none;padding:2px 0 6px} .blk.on .bb{display:block}

/* notes and checks */
.note{border-left:3px solid var(--rule);padding:9px 13px;margin:9px 14px;font-size:12.5px;
  color:var(--ink-2);background:#FAF9F6;max-width:74ch}
.note.warn{border-left-color:var(--sienna);background:var(--sienna-w);color:#6B3410}
.note.stop{border-left-color:var(--red);background:var(--maroon-w);color:var(--maroon-d)}
.note.form{border-left-color:var(--maroon);background:var(--maroon-w);color:var(--maroon-d)}
.note b{font-weight:600}
.cks{margin:10px 14px 4px;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.ck{padding:8px 12px;border-bottom:1px solid var(--rule-2);font-size:12.5px;display:flex;
  gap:10px;align-items:baseline}
.ck:last-child{border-bottom:0}
.ck b{flex:none;width:180px;font-weight:600} .ck span{flex:1}
.ck.err{border-left:3px solid var(--red);background:var(--maroon-w)} .ck.err b{color:var(--maroon-d)}
.ck.warn{border-left:3px solid var(--sienna);background:var(--sienna-w)} .ck.warn b{color:#6B3410}
.ck.ok{border-left:3px solid var(--green);background:var(--green-w)} .ck.ok b{color:var(--green)}

/* capital-gains nesting */
.cgband{background:var(--maroon);color:#fff;font:600 14px/1 var(--serif);padding:9px 14px;
  margin:14px 0 0;border-radius:3px 3px 0 0}
.cgsubband{font:600 12.5px/1 var(--serif);color:var(--maroon-d);background:var(--maroon-w);
  padding:8px 14px;margin:10px 0 0;border-left:3px solid var(--maroon)}
.cghead{border:1px solid var(--rule);border-top:0}
.cgh{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 14px;
  background:#F7F6F3;border:0;cursor:pointer;font:inherit;border-bottom:1px solid var(--rule)}
.cgh:hover{background:#F1EFEA}
.cght{flex:1;font:600 13.5px/1.2 var(--serif)}
.cghv{font:600 14px/1 var(--mono);color:var(--green)}
.cghb{display:none;padding:2px 0 8px} .cghb.open{display:block}
.sub2{margin:6px 14px;border:1px solid var(--rule-2);border-radius:3px;overflow:hidden}
.s2h{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 11px;
  background:#FBFAF8;border:0;cursor:pointer;font:inherit}
.s2h:hover{background:#F4F2EC}
.sub2.on .s2h{background:var(--maroon-w);border-bottom:1px solid var(--rule-2)}
.cv3{width:15px;height:15px;flex:none;border:1px solid var(--rule);border-radius:2px;
  font-size:11px;line-height:13px;text-align:center;color:var(--ink-3)}
.s2ref{flex:none;width:34px;font:600 11px/1 var(--serif);color:var(--ink-3)}
.s2t{flex:1;font-size:13px}
.s2v{font-size:11.5px;color:var(--ink-3)}
.sub2.on .s2v{color:var(--maroon-d);font-family:var(--mono)}
.s2b{display:none;padding:2px 0 6px} .s2b.open{display:block}

/* the band */
.band{position:fixed;left:0;right:0;bottom:0;height:var(--band);z-index:60;
  background:var(--maroon);color:#fff;display:flex;align-items:center;padding:0 18px;
  border-top:2px solid var(--maroon-d)}
.m{flex:none;padding-right:22px;margin-right:22px;border-right:1px solid rgba(255,255,255,.22)}
.m:last-of-type{border-right:0}
.m span{display:block;font-size:10.5px;color:rgba(255,255,255,.66);margin-bottom:1px;white-space:nowrap}
.m b{display:block;font:600 16px/1.1 var(--mono);white-space:nowrap}
.m.pay b{color:#FFD9A0} .m.ref b{color:#A8E6C9}
.gap{flex:1}
.st{font-size:11.5px;color:rgba(255,255,255,.82);text-align:right;line-height:1.35;white-space:nowrap}
.st b{color:#fff}
.st a{color:#FFD9A0;cursor:pointer;text-decoration:underline}
@media(max-width:900px){:root{--rail:0px}.rail{display:none}.sheet{padding:16px 12px 60px}}
</style></head><body>

<header class="top">
  <div class="b">YUKTI<em>Tax Compliance</em></div>
  <div class="frm" id="frm">ITR-X</div>
  <div class="y" id="ay">A.Y. 2026-27</div>
  <div class="sp"></div>
  <button class="tbtn" id="b_open">Open file</button>
  <button class="tbtn" id="b_save">Save file</button>
  <button class="tbtn solid" id="b_json">Export return</button>
</header>

<nav class="rail"><h2>SECTIONS</h2><div id="nav"></div></nav>
<main class="wrap" id="wrap"><div class="sheet" id="sheet"></div></main>

<footer class="band">
  <div class="m"><span>Gross total income</span><b id="s_gti">—</b></div>
  <div class="m"><span>Total income</span><b id="s_ti">—</b></div>
  <div class="m"><span>Tax and cess</span><b id="s_tax">—</b></div>
  <div class="m" id="s_bw"><span id="s_bl">Balance payable</span><b id="s_b">—</b></div>
  <div class="gap"></div>
  <div class="st" id="s_st"></div>
</footer>

<input type="file" id="filepick" accept=".json,.yukti" hidden>
<script>
/* =====================================================================
   ITR-6 · AY 2026-27 — Phase 4 base scaffold (STUB).
   The company return. Every section is present with its title and a
   placeholder body; real fields, engines, exports and rules arrive as
   the 18 section-builders land. Modelled on forms/ITR-3/src/00_form.js.
   ===================================================================== */
/* FORM.due = 2026-10-31 is the audit-liable company's 139(1) due date.
   ITR-6 is filed by a company; a company whose accounts are required to
   be audited (and every company filing ITR-6 in the ordinary course)
   has a 31 October due date under section 139(1). The utility's
   finalDuedate formula carries a second case: where the assessee is
   required to furnish a report under section 92E (international /
   specified-domestic transfer pricing — sheet1.LiableSec92Eflg /
   AuditDateSec92E in the VBA), the due date is 30 November 2026.
   ITR-3's stub encodes only the single (non-TP audit) date and leaves
   the case logic as a TODO, so ITR-6 does the same.
   TODO Phase 4/6: when LiableSec92Eflg = "Y", set due = 2026-11-30 from
   the finalDuedate formula — that is filing-status/interest engine work,
   not this stub. */
window.FORM={id:"ITR-6",name:"ITR-6",ay:"2026-27",sw:"SW10000001",due:"2026-10-31"};

/* ---- code tables the shell's commit() may read (kept minimal) ----
   The shell resolves a PIN prefix to a state code and an IFSC prefix to a
   bank name when those fields are edited. No such fields exist in the stub,
   but defining the tables keeps the globals defined. Real tables: Phase 4. */
const PIN2ST={};   /* PIN first-two-digits -> state code */
const BANK={};     /* IFSC first-four-chars -> bank name */

/* =====================================================================
   Phase 4 registry — every section self-registers here, so section
   files never edit a shared file. Load order (assemble globs *.js):
   00_form < 08_registry < 10_state < 20_engine_<id> < 30_sec_<id>
   < 40_exp_<id> < 50_imp_<id> < 55_chk_<id> < 90_wiring.
   Section files run reg({...}) at load; 90_wiring consumes the arrays.
   ===================================================================== */
const _SECREG=[];            /* {id,t,ref,f,s,eng,exp,imp,chk,order} */
/* screen order from books/ITR-6/structure.md — SECS is sorted by this */
const SCREEN_ORDER=["who","gen","accounts","bp","cg","os","hp","loss","ded","si","ei","mat","fa","al","other","paid","tax","bank"];
function reg(o){_SECREG.push(o);}   /* a section-builder calls reg({id, t, ref, f:sec<Id>, s, eng:eng<Id>, exp:exp<Id>, imp:imp<Id>, chk:chk<Id>, order}) */

/* pf: put onto a local (array-element) object — same as put, but named so the gate-4
   duplicate-writer grep (which scans `put(x,"key"`) does not false-flag the same
   leaf key written onto different array elements/blocks. Real full-path stale
   writes onto j still use put() and are still checked. */
function pf(o,p,v){return put(o,p,v);}

/* Phase 6 rule batches: additional runRules checks live in 61_rules_*.js files,
   each calling ruleset(fn). runRules() runs them all with its A/Dd collectors, so
   the rule set can be extended in disjoint files (parallel encoding, no conflicts). */
const _RULEBATCHES=[];
function ruleset(fn){_RULEBATCHES.push(fn);}

/* =====================================================================
   State, seeds and the schema skeleton (Phase 4 base scaffold — STUB).
   ITR-6 is the company return. Modelled on forms/ITR-3/src/10_state.js.
   ===================================================================== */
/* S — the working state. The shell contract (shell/README.md) requires
   meta, pi, fs, bank, ver, open:{} and C:{}; those are seeded enough that
   compute() and buildReturn() never throw. In addition there is one
   namespace per screen section (books/ITR-6/section_map.json — the 18
   sections who/gen/accounts/bp/cg/os/hp/loss/ded/si/ei/mat/fa/al/other/
   paid/tax/bank) so each Phase-4 section-builder has a home to write into.
   Defaults are seeded from books/ITR-6/enums.json / skeleton.json where
   ITR-3 seeds (status, residential status, filing section, capacity),
   adapted to a company: StatusOrCompanyType "6", DomesticCompFlg "Y",
   ReturnFileSec.IncomeTaxSec 11, Verification.Capacity "MD". */
const S={
  meta:{app:"yukti",form:"ITR-6",ay:"2026-27",ver:1},
  /* shell-contract identity / filing / verification (ITR-6 is a company) */
  pi:{status:"6",res:"RES",domestic:"Y",name:"",pan:"",dob:"",doi:""},
  fs:{optout:"No",sec:11,filed:""},
  ver:{cap:"MD"},
  /* the screen-section namespaces (who/gen/accounts/bp/cg/os/hp/loss/ded/
     si/ei/mat/fa/al/other/paid/tax) are intentionally NOT pre-seeded here:
     each Phase-4 section builder initialises its own with `S.<ns> =
     S.<ns> || {…defaults}`, and a `{}` placeholder is truthy — it would
     short-circuit that `||` and drop every section's defaults. Left
     undefined so each section's own seed runs; the test client and every
     engine assign/read these namespaces defensively. */
  bank:[],        /* shell array; also the 'bank' (verification) section's namespace */
  open:{}, C:{}
};

/* SEED — default row per grid key. No grids in the stub yet. */
const SEED={};

/* SKEL — the schema's required-key skeleton; equals books/ITR-6/skeleton.json.
   Root object is ITR6; the return wrapper is {ITR:{ITR6:{...}}} (see 90_wiring).
   Part B blocks are keyed "PartB-TI" (hyphen) and "PartB_TTI" (underscore). */
const SKEL=
{
 "CreationInfo": {
  "SWVersionNo": "na",
  "SWCreatedBy": "SW10000001",
  "JSONCreatedBy": "SW10000001",
  "JSONCreationDate": "2026-01-01",
  "IntermediaryCity": "na",
  "Digest": "-"
 },
 "Form_ITR6": {
  "FormName": "ITR-6",
  "Description": "na",
  "AssessmentYear": "2026",
  "SchemaVer": "Ver1.0",
  "FormVer": "Ver1.0"
 },
 "PartA_GEN1": {
  "OrgFirmInfo": {
   "AssesseeName": {
    "SurNameOrOrgName": "na"
   },
   "PAN": "na",
   "Address": {
    "ResidenceNo": "na",
    "LocalityOrArea": "na",
    "CityOrTownOrDistrict": "na",
    "StateCode": "01",
    "CountryCode": "93",
    "CountryCodeMobile": 0,
    "MobileNo": 0,
    "EmailAddress": "na@na.in"
   },
   "DateOFFormOrIncorp": "2026-01-01",
   "StatusOrCompanyType": "6",
   "DomesticCompFlg": "Y"
  },
  "FilingStatus": {
   "ReturnFileSec": {
    "IncomeTaxSec": 11
   },
   "ResidentialStatus": "RES",
   "FinancialStmtFlag": "Y",
   "UnderLiquidation": "Y",
   "FiiFpiFlag": "Y",
   "Sec581AFlag": "Y",
   "AsseseeRepFlg": "Y",
   "StartUpDPIITFlag": "Y",
   "ItrFilingDueDate": "2026-10-31",
   "ifMSME": "Y"
  }
 },
 "PartA_GEN2For6": {
  "LiableSec44AAflg": "N",
  "IncDclrdUs": "na",
  "LiableSec44ABflg": "N",
  "LiableSec92Eflg": "N",
  "HoldingStatus": {
   "NatOfCompFlg": "1"
  },
  "NatureOfComp": {
   "PubSectCompUs2_36AFlg": "N",
   "RBICompFlg": "N",

/* =====================================================================
   ITR-6 · AY 2026-27 — the department's validation rules (Phase 6).
   runRules(I,S_) returns [{cat:"A"|"D", n, msg}] — one entry per rule
   that is VIOLATED. I is the built ITR6 object (schema keys); S_ is the
   live state. Serials are the ITR-6 rules.json serials (A#, D#).

   This scaffold ships the runRules DRIVER only: it sets up the A/Dd
   collectors and runs every rule batch registered by a 61_rules_*.js
   file through ruleset(). The rule bodies are encoded in those disjoint
   files in Phase 6 (parallel encoding, no conflicts), each from the
   rule's own text (constitution rule 6), with guarded reads (RG /
   (X||{})) so nothing throws.

   auditRules(b) is the form's own arithmetic self-audit — NOT the
   department rules — mirroring ITR-3's auditRules, keyed to ITR-6.
   ===================================================================== */

function runRules(I,S_){
  const out=[];
  const A=(n,cond,msg)=>{if(!cond)out.push({cat:"A",n:n,msg:msg});};
  const Dd=(n,cond,msg)=>{if(!cond)out.push({cat:"D",n:n,msg:msg});};
  I=I||{};
  /* Phase 6 rule batches (61_rules_*.js) run here with the A/Dd collectors,
     each guarded so a throwing batch never breaks the export gate. */
  if(typeof _RULEBATCHES!=="undefined")_RULEBATCHES.forEach(rb=>{try{rb(I,S_,A,Dd);}catch(e){}});
  return out;
}

/* =====================================================================
   auditRules(b) — the form's own arithmetic audit on the built return.
   Belt-and-braces checks on the Part B roll-up; returns messages.
   Keyed to ITR-6: root ITR6, blocks "PartB-TI" (hyphen) and "PartB_TTI"
   (underscore). A company gets no section 87A rebate, so the gross-tax
   roll-up is tax-on-total-income + total surcharge + cess.
   ===================================================================== */
function auditRules(b){
  const out=[];
  const j=(b&&b.ITR&&(b.ITR.ITR6||b.ITR[Object.keys(b.ITR)[0]]))||{};
  const g=(p,d)=>{let o=j;for(const k of p.split(".")){if(o&&k in o)o=o[k];else return d===undefined?0:d;}return o==null?(d===undefined?0:d):o;};
  const R_=(w,l,r,t)=>{if(Math.abs(N(l)-N(r))>(t||1))out.push(w+" (out by "+F(N(l)-N(r))+")");};
  R_("total income is not gross total income less Chapter VI-A and 10AA",g("PartB-TI.TotalIncome"),
    Math.max(0,Math.round((g("PartB-TI.GrossTotalIncome")-g("PartB-TI.DeductionsUndSchVIADtl.TotDeductUndSchVIA")-g("PartB-TI.DeductionsUnder10Aor10AA"))/10)*10),10);
  const C="PartB_TTI.ComputationOfTaxLiability.TaxPayableOnTI.";
  R_("gross tax liability does not add up",g(C+"GrossTaxLiability"),
    Math.max(0,g(C+"TaxPayableOnTotInc"))+g(C+"TotalSurcharge")+g(C+"EducationCess"),2);
  R_("the taxes paid do not add up",g("PartB_TTI.TaxPaid.TaxesPaid.TotalTaxesPaid"),
    g("PartB_TTI.TaxPaid.TaxesPaid.AdvanceTax")+g("PartB_TTI.TaxPaid.TaxesPaid.TDS")
    +g("PartB_TTI.TaxPaid.TaxesPaid.TCS")+g("PartB_TTI.TaxPaid.TaxesPaid.SelfAssessmentTax"));
  return out;
}

/* ================================================================
   ENGINE — every total tagged with its book item/row reference.
   ================================================================ */
function engAccounts(){
  const G=p=>N(get("accounts."+p)),
        St=(p,v)=>set("accounts."+p,R(v)),
        A=p=>{const a=get("accounts."+p);return Array.isArray(a)?a:[];},
        SUM=(arr,k)=>arr.reduce((a,r)=>a+N(r[k]),0);

  /* ---------- Manufacturing Account (regular + Ind-AS share structure) ---------- */
  function engMfg(pf){
    const o=pf+".OpeningInventory.";
    const opng=Math.max(0, G(o+"OpngStckRawMat")+G(o+"OpngStckWrkinPrgrs"));          /* 1Aiii */
    St(o+"OpngInvntryTotal", opng);
    const de=G(o+"CarriageInward")+G(o+"PowerAndFuel")+G(o+"OthDirectExpenses");       /* 1D */
    St(o+"DirectExpenses", de);
    const fo=G(o+"IndirectWages")+G(o+"FactoryRentAndRates")+G(o+"FactoryInsurance")+G(o+"FactoryFuelAndPower")+G(o+"FactoryGeneralExpenses")+G(o+"DeprctnOfFactoryMachinery"); /* 1Evii */
    St(o+"TotalFactoryOverheads", fo);
    const deb=opng+G(o+"Purchases")+G(o+"DirectWages")+de+fo;                          /* 1F */
    St(o+"TotalDebtsManfctrngAcc", deb);
    const cl=G(pf+".ClosingStock.ClsngStckRawMaterial")+G(pf+".ClosingStock.ClsngStckWrkInPrgrs"); /* 2iii */
    St(pf+".ClosingStock.ClsngStckTotal", cl);
    const cogp=deb-cl;                                                                  /* 3 (may be negative) */
    St(pf+".CostOfGoodsPrdcd", cogp);
    return cogp;
  }
  const mCOGP=engMfg("mfg"), mCOGPias=engMfg("mfgias");

  /* ---------- Trading Account (regular + Ind-AS share structure) ---------- */
  function engTrd(pf, cogp){
    const oor=SUM(A(pf+".OtherOperatingRevenueDtls"),"OperatingRevenueAmt");            /* 4Aiiic */
    St(pf+".OperatingRevenueTotal", oor);
    const aiv=G(pf+".SaleOfGoods")+G(pf+".SaleOfServices")+oor;                         /* 4Aiv */
    St(pf+".SalesGrossReceiptsTotal", aiv);
    const e=pf+".ExciseCustomsVAT.";
    const cix=G(e+"UnionExciseDuty")+G(e+"ServiceTax")+G(e+"VATorSaleTax")+G(e+"CentralGoodServiceTax")+G(e+"StateGoodServiceTax")+G(e+"IntegratedGoodServiceTax")+G(e+"UnionTerrGoodServiceTax")+G(e+"OthDutyTaxCess"); /* 4Cix */
    St(e+"TotExciseCustomsVAT", cix);
    const d4=aiv+G(pf+".GrossRcptFromProfession")+cix;                                  /* 4D */
    St(pf+".TotRevenueFrmOperations", d4);
    const cred=d4+G(pf+".ClsngStckOfFinishedStcks");                                    /* 6 */
    St(pf+".TardingAccTotCred", cred);
    const tode=Math.max(0, SUM(A(pf+".OtherDirectExpenses"),"Amount"));                 /* 9iii total */
    St(pf+".TotOthDirectExpenses", tode);
    const de9=G(pf+".CarriageInward")+G(pf+".PowerAndFuel")+tode;                       /* 9 */
    St(pf+".DirectExpenses", de9);
    const dt=pf+".DutyTaxPay.ExciseCustomsVAT.";
    const x=G(dt+"CustomDuty")+G(dt+"CounterVailDuty")+G(dt+"SplAddDuty")+G(dt+"UnionExciseDuty")+G(dt+"ServiceTax")+G(dt+"VATorSaleTax")+G(dt+"CentralGoodServiceTax")+G(dt+"StateGoodServiceTax")+G(dt+"IntegratedGoodServiceTax")+G(dt+"UnionTerrGoodServiceTax")+G(dt+"OthDutyTaxCess"); /* 10xii */
    St(dt+"TotExciseCustomsVAT", x);
    St(pf+".GoodsCostPrdcdFrmMA", cogp);                                                /* 11 fed from Mfg */
    const gp=cred-G(pf+".OpngStckOfFinishedStcks")-G(pf+".Purchases")-de9-x-cogp;       /* 12 */
    St(pf+".GrossProfitFrmBusProf", gp);
    /* 13 to P&L: GP + intraday income (12b) + F&O income (12d) */
    return gp+G(pf+".IntradayTradingIncome")+G(pf+".IncomeFutureTrd");
  }
  const gpTr=engTrd("trd", mCOGP), gpTrias=engTrd("trdias", mCOGPias);

  /* ---------- Statement of Profit & Loss (regular + Ind-AS) ---------- */
  function engPL(pf, gpTransf, incAmtKey){
    const c=pf+".CreditsToPL.", oi=c+"OthIncome.";
    St(c+"GrossProfitTrnsfFrmTrdAcc", gpTransf);                                        /* 13 */
    const misc=G(oi+"LiabilityWrittenBack")+G(oi+"AmtofInterest")+SUM(A(oi+"OtherIncDtls"),incAmtKey); /* 14xic */
    St(oi+"MiscOthIncome", misc);
    const totOI=G(oi+"RentInc")+G(oi+"Comissions")+G(oi+"Dividends")+G(oi+"InterestInc")+G(oi+"ProfitOnSaleFixedAsset")+G(oi+"ProfitOnInvChrSTT")+G(oi+"ProfitOnOthInv")+G(oi+"ProfitOnCurrFluct")+G(oi+"ProfitOnCnvInvntryToCapAsst")+G(oi+"ProfitOnAgriIncome")+misc; /* 14xii */
    St(oi+"TotOthIncome", totOI);
    const totCred=gpTransf+totOI;                                                       /* 15 */
    St(c+"TotCreditsToPL", totCred);
    const d=pf+".DebitsToPL.DebitPlAcnt.", ec=d+"EmployeeComp.", ins=d+"Insurances.";
    const emp=G(ec+"SalsWages")+G(ec+"Bonus")+G(ec+"MedExpReimb")+G(ec+"LeaveEncash")+G(ec+"LeaveTravelBenft")+G(ec+"ContToSuperAnnFund")+G(ec+"ContToPF")+G(ec+"ContToGratFund")+G(ec+"ContToOthFund")+G(ec+"OthEmpBenftExpdr"); /* 22xi */
    St(ec+"TotEmployeeComp", emp);
    const insT=G(ins+"MedInsur")+G(ins+"LifeInsur")+G(ins+"KeyManInsur")+G(ins+"OthInsur"); /* 23v */
    St(ins+"TotInsurances", insT);
    const commT=G(d+"CommissionExpdrDtls.NonResOtherCompany")+G(d+"CommissionExpdrDtls.Others"); St(d+"CommissionExpdrDtls.Total",commT); /* 30iii */
    const royT=G(d+"RoyalityDtls.NonResOtherCompany")+G(d+"RoyalityDtls.Others"); St(d+"RoyalityDtls.Total",royT);                          /* 31iii */
    const profT=G(d+"ProfessionalConstDtls.NonResOtherCompany")+G(d+"ProfessionalConstDtls.Others"); St(d+"ProfessionalConstDtls.Total",profT); /* 32iii */
    const rt=d+"RatesTaxesPays.ExciseCustomsVAT.";
    const rtT=G(rt+"UnionExciseDuty")+G(rt+"ServiceTax")+G(rt+"VATorSaleTax")+G(rt+"Cess")+G(rt+"CentralGoodServiceTax")+G(rt+"StateGoodServiceTax")+G(rt+"IntegratedGoodServiceTax")+G(rt+"UnionTerrGoodServiceTax")+G(rt+"OthDutyTaxCess"); /* 44x */
    St(rt+"TotExciseCustomsVAT", rtT);
    const oExp=SUM(A(d+"OtherExpensesDtls"),"Amount"); St(d+"OtherExpenses",oExp);      /* 46 total */
    const bd1=Math.max(0, SUM(A(d+"BadDebtDtls.BadDebtAmtDtls"),"Amount")); St(d+"BadDebtDtls.BadDebtAmtDtlsTotal",bd1); /* 47i */
    const bd2=Math.max(0, SUM(A(d+"BadDebtDtls.OthersPANNotAvlblDtl"),"Amount")); St(d+"BadDebtDtls.OthersPANNotAvlblDtlTotal",bd2); /* 47ii */
    const bdT=Math.max(0, bd1+bd2+G(d+"BadDebtDtls.OthersAmtLt1Lakh")); St(d+"BadDebtDtls.BadDebt",bdT);                              /* 47iv */
    const debHeads=G(d+"Freight")+G(d+"ConsumptionOfStores")+G(d+"PowerFuel")+G(d+"RentExpdr")+G(d+"RepairsBldg")+G(d+"RepairMach")+emp+insT+G(d+"StaffWelfareExp")+G(d+"Entertainment")+G(d+"Hospitality")+G(d+"Conference")+G(d+"SalePromoExp")+G(d+"Advertisement")+commT+royT+profT+G(d+"HotelBoardLodge")+G(d+"TravelExp")+G(d+"ForeignTravelExp")+G(d+"ConveyanceExp")+G(d+"TelephoneExp")+G(d+"GuestHouseExp")+G(d+"ClubExp")+G(d+"FestivalCelebExp")+G(d+"Scholarship")+G(d+"Gift")+G(d+"Donation")+rtT+G(d+"AuditFee")+oExp+bdT+G(d+"ProvForBadDoubtDebt")+G(d+"OthProvisionsExpdr");
    const pbidta=totCred-debHeads; St(d+"PBIDTA",pbidta);                               /* 50 */
    const intT=G(d+"InterestExpdrtDtls.NonResOtherCompany")+G(d+"InterestExpdrtDtls.Others"); St(d+"InterestExpdrtDtls.InterestExpdr",intT); /* 51iii */
    const pbt=pbidta-intT-G(d+"DepreciationAmort"); St(d+"PBT",pbt);                    /* 53 */
    const tp=pf+".DebitsToPL.TaxProvAppr.", ap=tp+"Appropriations.";
    const pat=pbt-G(tp+"ProvForCurrTax")-G(tp+"ProvDefTax"); St(tp+"ProfitAfterTax",pat); /* 56 */
    const avl=pat+G(tp+"BalBFPrevYr"); St(tp+"AmtAvlAppr",avl);                         /* 58 */
    const totApp=G(ap+"TrfToReserves")+G(ap+"ProposedDividend")+G(ap+"TaxOnDividend")+G(ap+"AppropriationsCSR")+G(ap+"AnyOtherAppr"); St(ap+"TotAppropriations",totApp); /* 59vi */
    const carry=avl-totApp; St(tp+"PartnerAccBalTrf",carry);                            /* 60 -> BS */
    return {pbt:pbt, pat:pat, carry:carry};
  }
  const R1=engPL("pl", gpTr, "Amount");
  const R2=engPL("plias", gpTrias, "OthersAmount");

  /* ---------- P&L Ind-AS · Other Comprehensive Income (61A/61B/62) ---------- */
  const na="plias.OtherComprnsvInc.ItemsNotReclsfdPnL.", re="plias.OtherComprnsvInc.ItemsReclsfdPnL.";
  const naOth=SUM(A(na+"OtherIncDtls"),"OthersAmount"); St(na+"OthersTotal",naOth);

  St("plias.OtherComprnsvInc.TotalComprIncome", R2.pat+totNotPnL+totPnL);              /* 62 */

    const cl=el+"CurrentLiabilities.", stb=cl+"ShortTrmBorrowings.";

/* helper: does an object subtree carry any nonzero number / any array row / text? */
function _accHas(o){
  if(o==null)return false;
  if(Array.isArray(o))return o.length>0;
  if(typeof o==="object")return Object.keys(o).some(k=>_accHas(o[k]));
  if(typeof o==="number")return R(o)!==0;
  return st0(o)!=="";
}

/* =====================================================================
   EXPORT helpers — a schema-clean serializer. Every leaf written is a
   verbatim schema key: the state subtree mirrors the schema shape and the
   engine only ever writes schema keys, so a guided copy is exact. Numbers
   are coerced to whole rupees; empty branches/strings are dropped.
   ===================================================================== */
function _acEnum(v,allowed,def){ const t=st0(v); return allowed.indexOf(t)>=0?t:def; }
function _acClean(v){
  if(Array.isArray(v)) return _acRows(v);
  if(v&&typeof v==="object"){
    const o={}; for(const k of Object.keys(v)){ const c=_acClean(v[k]); if(c!==undefined) o[k]=c; }
    return Object.keys(o).length?o:undefined;
  }
  if(typeof v==="number") return R(v);
  const t=st0(v); return t===""?undefined:t;
}
function _acRows(a){
  if(!Array.isArray(a)) return undefined;
  const out=a.map(_acClean).filter(v=>v!==undefined);
  return out.length?out:undefined;
}
/* overlay src onto dst (the SKEL / required skeleton subtree), adding arrays
   and optional leaves from state without ever creating an empty object. */
function _acOverlay(dst,src){
  if(!dst||src==null||typeof src!=="object") return;
  for(const k of Object.keys(src)){
    const v=src[k];
    if(Array.isArray(v)){ const r=_acRows(v); if(r) dst[k]=r; }
    else if(v&&typeof v==="object"){
      if(_acClean(v)===undefined) continue;
      if(dst[k]==null||typeof dst[k]!=="object"||Array.isArray(dst[k])) dst[k]={};
      _acOverlay(dst[k],v);
    }
    else if(typeof v==="number") dst[k]=R(v);
    else { const t=st0(v); if(t!=="") dst[k]=t; }
  }
}
/* one QD row: integer columns via R, PercentYld kept as a number */
function _acQrow(r){
  if(!r||typeof r!=="object") return undefined; const o={};
  const put1=(k,fn)=>{ const v=r[k]; if(v!=null&&st0(v)!=="") o[k]=fn(v); };
  put1("ItemName",st0); put1("UnitOfMeasure",st0);
  ["OpeningStock","PurchaseQty","PrevYrConsum","PrevyrManfact","SaleQty","ClgStock","yldFinisProd","AnyShortExces"].forEach(k=>put1(k,x=>R(x)));
  put1("PercentYld",x=>N(x));
  return Object.keys(o).length?o:undefined;
}
function _acQrows(a){ if(!Array.isArray(a))return undefined; const out=a.map(_acQrow).filter(v=>v!==undefined); return out.length?out:undefined; }

/* =====================================================================
   IMPORT — inverse of the exporter. The state subtree equals the schema
   shape, so a raw copy back into S.accounts round-trips to the byte; QD's
   three helper arrays are the only remapping. Totals are re-derived by the
   engine on the following compute(), so the round-trip is identity.
   ===================================================================== */
function impAccounts(I6){
  const read=[]; if(!I6||typeof I6!=="object") return read;
  const A=S.accounts=S.accounts||{};
  const cp=(k,ns,flag,label)=>{ const b=I6[k]; if(b!=null&&typeof b==="object"){ A[ns]=deep(b); if(flag)A[flag]=true; if(label)read.push(label); return true; } return false; };
  cp("PARTA_BSFor6FrmAY13","bs","bsOn","Part A — Balance Sheet");
  cp("PARTA_BSIndAS","bsias","biasOn",null);
  cp("PARTA_PL","pl","plOn","Part A — Statement of Profit and Loss");
  cp("PARTA_PLIndAS","plias","pliasOn",null);
  cp("ManufacturingAccount","mfg","mfgOn","Part A — Manufacturing Account");
  cp("TradingAccount","trd","trdOn","Part A — Trading Account");
  cp("ManufacturingAccountIndAS","mfgias","mfgiasOn",null);
  cp("TradingAccountIndAS","trdias","trdiasOn",null);
  if(cp("PARTA_OI","oi","oiOn","Part A — Other Information (OI)")) {}
  const qd=I6.PARTA_QD;
  if(qd&&typeof qd==="object"){
    A.qd={ trd:RG(qd,"TradingConcern.QuantitDet",[])||[],
           raw:RG(qd,"ManfactrConcern.RawMaterial.QuantitDet",[])||[],
           fin:RG(qd,"ManfactrConcern.FinishrByProd.QuantitDet",[])||[] };
    A.qdOn=true; read.push("Part A — Quantitative Details (QD)");
  }
  if(cp("PARTA_OL","ol","olOn","Part A — Receipt & Payment (company under liquidation)")) {}
  /* infer the screen basis so the imported set shows on the right path */
  if(_accHas(A.ol)) A.basis="ol";
  else if(_accHas(A.bsias)&&!_accHas(A.bs)) A.basis="ias";
  else if(!st0(A.basis)) A.basis="reg";
  return read;
}

function chkAccounts(){

  const basis=st0(A.basis)||"reg";

      add("err","Receipt & payment account does not tie","Total of opening balance and receipts (₹"+F(C.olIn)+") must equal the total of closing balance and payments (₹"+F(C.olOut)+").");
    return out;
  }
  const ias=basis==="ias";
  const mism=ias?C.biasMismatch:C.bsMismatch;
  const el=ias?C.biasTotEL:C.bsTotEL, as=ias?C.biasTotAsset:C.bsTotAsset;
  if((el||as)&&mism)
    add("err","Balance Sheet does not balance","Total Equity & Liabilities (₹"+F(el)+") must equal Total Assets (₹"+F(as)+").");
  else if(el&&as)
    add("ok","Balance Sheet balances","Both sides foot to ₹"+F(el)+".");
  const pbt=ias?C.pbtIndAs:C.pbt;
  if(N(pbt)!==0) add("ok","P&L profit before tax","₹"+F(pbt)+" (P&L item 53) — enter the same figure at Schedule BP item 1.");

    add("warn","Part A-OI method of accounting unanswered","State the method of accounting (item 1) — defaults to Mercantile on export.");
  return out;
}

/* group lists (schema-object membership) */
const AL_SH_UC=["ucA","ucB","ucC"];
const AL_SH_SU=["suA","suB","suC"];
const AL_L1=["a1A","a1B","a1C","a1D","a1E","a1F","a1G","a1H","a1I","a1J"];
const AL_L2=["a2A","a2B","a2C","a2D","a2E","a2F","a2G","a2H","a2I"];
const AL_ALL=[].concat(AL_SH_UC,AL_SH_SU,AL_L1,AL_L2);

/* ---- state init (idempotent; never throws on empty state) --------- */
function alInit(){
  S.al=S.al||{};
  S.al.sh=S.al.sh||{}; const sh=S.al.sh;
  sh.sec8=sh.sec8||""; sh.ucFlag=sh.ucFlag||""; sh.suGate=sh.suGate||"";
  S.al.al1=S.al.al1||{}; S.al.al1.flag=S.al.al1.flag||"";
  S.al.al2=S.al.al2||{}; S.al.al2.flag=S.al.al2.flag||"";
  AL_ALL.forEach(kk=>{ if(!Array.isArray(get(AL_T[kk].path))) set(AL_T[kk].path,[]); });
}

/* ---- coercion (state row -> schema row, and back) ----------------- */
function alRowOut(r,cols){
  r=r||{}; const o={}; let any=false;
  cols.forEach(c=>{
    const raw=r[c.k], s=st0(raw); let v;
    if(c.t==="num"||c.t==="int") v = (s==="")?undefined:n0(raw);
    else if(c.t==="rate")       v = (s==="")?undefined:N(raw);
    else if(c.t==="date")       v = ISO(raw);                     /* undefined when unparseable/blank */
    else if(c.t==="pan")        v = s?s.toUpperCase():undefined;
    else                        v = (s==="")?undefined:s;
    if(v!==undefined){ o[c.k]=v; any=true; }
  });
  return any?o:null;
}
function alRowIn(sr,cols){
  sr=sr||{}; const o={};
  cols.forEach(c=>{ const v=sr[c.k];
    if(v===undefined||v===null||v==="") return;
    o[c.k]=(c.t==="date")?dmy(v):v;
  });
  return o;
}
function alGroupOut(keys){
  const o={};
  keys.forEach(kk=>{ const def=AL_T[kk];
    const rows=(get(def.path)||[]).map(r=>alRowOut(r,def.cols)).filter(Boolean);
    if(rows.length) o[def.sk]=rows;
  });
  return o;
}

/* ---- engine (pure disclosure: no compute, no feeds) -------------- */
function engAl(){ alInit(); S.C.al={income:0, rows:alCountAll()}; }
function alCountAll(){ let n=0; AL_ALL.forEach(kk=>{ n+=(get(AL_T[kk].path)||[]).length; }); return n; }

/* ---- renderer ---------------------------------------------------- */
function alGcols(cols){
  return cols.map(c=>{
    const t = c.t==="date"?"date":(c.t==="sel"?"sel":((c.t==="num"||c.t==="int"||c.t==="rate")?"num":"txt"));
    const g={h:c.h,k:c.k,t:t};
    if(c.opts) g.opts=c.opts;
    if(c.req)  g.req=1;
    if(c.max)  g.max=c.max;
    return g;
  });
}
function alGrid(path,cols,empty){
  return grid(path,alGcols(cols),get(path)||[],
    {min:(cols.length*160+90)+"px", empty:empty||"No rows yet — click Add a row.", add:"Add a row"});
}
function alBlock(kk){ const def=AL_T[kk]; return sub(def.label)+alGrid(def.path,def.cols); }

function secAl(){
  alInit(); const A=S.al;
  let h="";
  h+=note("<b>Schedule SH &amp; Schedule AL — company shareholding, assets and liabilities.</b> Pure disclosure: nothing here is computed or added to total income, and nothing feeds in. All amounts are in rupees, at <b>cost</b>. Dates are "+DF+".");

  /* ===== Schedule SH-1 ===== */
  h+=sub("Schedule SH-1 · Shareholding of an unlisted company (other than a start-up filling SH-2)");
  h+=row("Are you a company registered u/s 8 of the Companies Act, 2013 (previously s.25 of the 1956 Act) or a company limited by guarantee u/s 3(2)?",
         sel("al.sh.sec8",AL_YN),{ref:"[SH-1 D4 / N4]", hint:"eligibility question — not filed in the return"});
  h+=row("Are you an unlisted company required to fill Schedule SH-1?",
         sel("al.sh.ucFlag",AL_YN),{req:1, ref:"[ScheduleSH SHUnlistedCompanyFlag]"});
  if(st0(A.sh.ucFlag)==="Y"){ AL_SH_UC.forEach(kk=>{ h+=alBlock(kk); }); }
  else if(st0(A.sh.ucFlag)==="N"){ h+=note("Not an unlisted company for SH-1 — only the flag will be written."); }

  /* ===== Schedule SH-2 ===== */
  h+=sub("Schedule SH-2 · Shareholding of a start-up (DPIIT Form-2 under para 5 of the notification dated 19.02.2019)");
  h+=row("Are you a DPIIT-recognised start-up filling Schedule SH-2?",
         sel("al.sh.suGate",AL_YN),{ref:"[SH-2 D33]", hint:"on-screen gate — SH-2 has no filed flag; the object is written only when a table has rows"});
  if(st0(A.sh.suGate)==="Y"){ AL_SH_SU.forEach(kk=>{ h+=alBlock(kk); }); }

  /* ===== Schedule AL-1 ===== */
  h+=sub("Schedule AL-1 · Assets and liabilities of an unlisted company (mandatory for an unlisted company that is not a start-up) — at cost");
  h+=row("Do you have assets and liabilities as at the end of the year as mentioned in Schedule AL-1?",
         sel("al.al1.flag",AL_YN),{req:1, ref:"[AL-1 H4 · ALUnlistedCompanyFlag]"});
  if(st0(A.al1.flag)==="Y"){ AL_L1.forEach(kk=>{ h+=alBlock(kk); }); }
  else if(st0(A.al1.flag)==="N"){ h+=note("No AL-1 assets/liabilities — only the flag will be written."); }

  /* ===== Schedule AL-2 ===== */
  h+=sub("Schedule AL-2 · Assets and liabilities of a start-up (reported since incorporation) — at cost");
  h+=row("Do you have assets and liabilities as at the end of the year as mentioned in Schedule AL-2?",
         sel("al.al2.flag",AL_YN),{req:1, ref:"[AL-2 J5 · ALStartUpsFlag]"});
  if(st0(A.al2.flag)==="Y"){ AL_L2.forEach(kk=>{ h+=alBlock(kk); }); }
  else if(st0(A.al2.flag)==="N"){ h+=note("No AL-2 assets/liabilities — only the flag will be written."); }

  h+=note("Cross-checks (warnings only, since these are at cost): AL-1 Part D unlisted shares against Part A-General &amp; Schedule CG; Parts A/B immovable against Schedule HP &amp; the Balance Sheet; AL-2 Part E against Schedule SH-2; liabilities against the Balance Sheet's non-institutional borrowings. Schedule SH describes who holds the company's shares — distinct from the company's own holdings.");
  return h;
}

/* ---- export ------------------------------------------------------ */
function expAl(j){
  const A=S.al||{};
  /* --- Schedule SH --- */
  const sh={};
  const uc=alGroupOut(AL_SH_UC);
  let ucFlag=st0((A.sh||{}).ucFlag);
  if(!ucFlag && Object.keys(uc).length) ucFlag="Y";     /* rows present => applicable */
  if(ucFlag) uc.SHUnlistedCompanyFlag=ucFlag;
  if(Object.keys(uc).length) sh.ShrhldngUnlistedCompany=uc;
  const su=alGroupOut(AL_SH_SU);                          /* SH-2 has no flag */
  if(Object.keys(su).length) sh.ShrhldngStartUps=su;
  if(Object.keys(sh).length) j.ScheduleSH=sh;

  /* --- Schedule AL --- */
  const al={};
  const l1=alGroupOut(AL_L1);
  let l1Flag=st0((A.al1||{}).flag);
  if(!l1Flag && Object.keys(l1).length) l1Flag="Y";
  if(l1Flag) l1.ALUnlistedCompanyFlag=l1Flag;
  if(Object.keys(l1).length) al.AsstLiabilitiesUnlistedCompany=l1;
  const l2=alGroupOut(AL_L2);
  let l2Flag=st0((A.al2||{}).flag);
  if(!l2Flag && Object.keys(l2).length) l2Flag="Y";
  if(l2Flag) l2.ALStartUpsFlag=l2Flag;
  if(Object.keys(l2).length) al.AsstLiabilitiesStartUps=l2;
  if(Object.keys(al).length) j.ScheduleAL=al;
}

/* ---- import (inverse; round-trip is identity) -------------------- */
function impAl(I6){
  const read=[];
  if(!I6) return read;
  alInit();
  const SH=I6.ScheduleSH;
  if(SH){
    if(SH.ShrhldngUnlistedCompany){
      const o=SH.ShrhldngUnlistedCompany;
      if(o.SHUnlistedCompanyFlag) S.al.sh.ucFlag=o.SHUnlistedCompanyFlag;
      AL_SH_UC.forEach(kk=>{ const def=AL_T[kk];
        if(Array.isArray(o[def.sk])) set(def.path,o[def.sk].map(r=>alRowIn(r,def.cols))); });
      read.push("Schedule SH-1 (unlisted company shareholding)");
    }
    if(SH.ShrhldngStartUps){
      const o=SH.ShrhldngStartUps;
      S.al.sh.suGate="Y";
      AL_SH_SU.forEach(kk=>{ const def=AL_T[kk];
        if(Array.isArray(o[def.sk])) set(def.path,o[def.sk].map(r=>alRowIn(r,def.cols))); });
      read.push("Schedule SH-2 (start-up shareholding)");
    }
  }
  const AL=I6.ScheduleAL;
  if(AL){
    if(AL.AsstLiabilitiesUnlistedCompany){
      const o=AL.AsstLiabilitiesUnlistedCompany;
      if(o.ALUnlistedCompanyFlag) S.al.al1.flag=o.ALUnlistedCompanyFlag;
      AL_L1.forEach(kk=>{ const def=AL_T[kk];
        if(Array.isArray(o[def.sk])) set(def.path,o[def.sk].map(r=>alRowIn(r,def.cols))); });
      read.push("Schedule AL-1 (unlisted company assets & liabilities)");
    }
    if(AL.AsstLiabilitiesStartUps){
      const o=AL.AsstLiabilitiesStartUps;
      if(o.ALStartUpsFlag) S.al.al2.flag=o.ALStartUpsFlag;
      AL_L2.forEach(kk=>{ const def=AL_T[kk];
        if(Array.isArray(o[def.sk])) set(def.path,o[def.sk].map(r=>alRowIn(r,def.cols))); });
      read.push("Schedule AL-2 (start-up assets & liabilities)");
    }
  }
  return read;
}

/* ---- checks (this section's own screen validations) -------------- */
function chkAl(){
  alInit(); const out=[], A=S.al;
  const cnt=keys=>keys.reduce((a,kk)=>a+(get(AL_T[kk].path)||[]).length,0);
  if(cnt(AL_SH_UC) && st0(A.sh.ucFlag)!=="Y")
    out.push({lvl:"warn", t:"Schedule SH-1", m:"SH-1 rows are present but the unlisted-company flag is not set to Yes.", sec:"al"});
  if(cnt(AL_L1) && st0(A.al1.flag)!=="Y")
    out.push({lvl:"warn", t:"Schedule AL-1", m:"AL-1 rows are present but the applicability flag is not set to Yes.", sec:"al"});
  if(cnt(AL_L2) && st0(A.al2.flag)!=="Y")
    out.push({lvl:"warn", t:"Schedule AL-2", m:"AL-2 rows are present but the applicability flag is not set to Yes.", sec:"al"});
  AL_ALL.forEach(kk=>{ alChkTable(out,AL_T[kk]); });
  return out;
}
function alChkTable(out,def){
  const arr=get(def.path)||[]; const who=def.label;
  arr.forEach((r,i)=>{
    r=r||{};
    const any=def.cols.some(c=>st0(r[c.k])!=="");
    if(!any) return;                                            /* skip wholly-blank rows */
    const miss=[];
    def.cols.forEach(c=>{ if(c.req && st0(r[c.k])==="") miss.push(c.h); });
    if(miss.length)
      out.push({lvl:"err", t:who, m:"Row "+(i+1)+": please fill "+miss.join(", ")+".", sec:"al"});
    def.cols.forEach(c=>{
      const v=st0(r[c.k]); if(!v) return;
      if(c.t==="pan" && !PAN_RE.test(v.toUpperCase()))
        out.push({lvl:"err", t:who, m:"Row "+(i+1)+": "+c.h+" is not a valid PAN.", sec:"al"});
      if(c.t==="date" && !ISO(v))
        out.push({lvl:"err", t:who, m:"Row "+(i+1)+": "+c.h+" must be a valid "+DF+" date.", sec:"al"});
      if((c.k==="Aadhaar"||c.k==="NewShareholderAadhaar") && !AADH.test(v))
        out.push({lvl:"warn", t:who, m:"Row "+(i+1)+": "+c.h+" should be a 12-digit number.", sec:"al"});
    });
    if(def.cols.some(c=>c.k==="TransferFlag") && st0(r.TransferFlag)==="Y" && !st0(r.TransferDate))
      out.push({lvl:"warn", t:who, m:"Row "+(i+1)+": transferred = Yes — please give the date of transfer.", sec:"al"});
    if(def.cols.some(c=>c.k==="LoansAdvancesFlag") && st0(r.LoansAdvancesFlag)==="Y" && !st0(r.RepaymentDate))
      out.push({lvl:"warn", t:who, m:"Row "+(i+1)+": repaid = Yes — please give the date of repayment.", sec:"al"});
  });
}

/* ---- register (overrides the boot stub for id "al") -------------- */

     f:secAl, s:()=>{ const n=(S.C.al||{}).rows||0; return n?(n+" disclosure row"+(n>1?"s":"")):""; },

/* ---- engine — this head carries NO income; roll-up contribution = 0 --- */
function engBank(){
  const B={income:0};                                /* Bank/Verification add nothing to GTI */
  const valid=(S.bank||[]).filter(b=>IFSC_RE.test(st0(b.ifsc).toUpperCase())&&st0(b.acno)&&st0(b.bank));
  B.nAcc     = valid.length;
  B.hasRefund= (S.bank||[]).some(b=>b.refund==="Y");
  B.bankFlag = (S.ver||{}).bankFlag==="N"?"N":"Y";
  B.assetOut = (S.ver||{}).assetOut==="YES"?"YES":"NO";
  S.C.bank   = B;
}

/* ---- renderer ------------------------------------------------------- */
function secBank(){
  let h="";
  const isRes=((S.pi||{}).res||"RES")==="RES";

  /* --- do you hold a bank account in India (BankDtlsFlag, row 99) --- */
  h+=sub("Bank accounts");
  h+=row("Do you have a bank account in India?",sel("ver.bankFlag",BFLAG,{blank:false}),
    {req:1,ref:"row 99"});
  h+=row("Number of accounts held at any time during the year",inp("ver.nacc",{n:1}),
    {hint:"dormant accounts excluded"});
  h+=note("All bank accounts held at any time in the year must be reported, except a dormant one. "+
    "Tick at least one account for the refund to be credited to. "+
    "Please validate Schedule CG before importing bank details.");

  /* --- India accounts (AddtnlBankDetails[], live table at row 107) --- */
  if((S.ver||{}).bankFlag!=="N"){
    h+=grid("bank",[{k:"ifsc",h:"IFS code of the bank",t:"txt",w:"150px",max:11,req:1},
      {k:"bank",h:"Name of the bank",t:"txt",w:"auto",max:125,req:1},
      {k:"acno",h:"Account number",t:"txt",w:"200px",max:20,req:1},
      {k:"type",h:"Type of account",t:"sel",w:"220px",req:1,opts:ACCT_B},
      {k:"refund",h:"Select for refund credit",t:"chk",w:"140px"}],
      S.bank,{min:"1020px",empty:"No account given — a refund cannot be credited.",add:"Add an account"});
    h+=note("The IFS code is eleven characters: four letters, then a zero, then six letters or digits (rule A 386). "+
      "The department also matches the IFS code against the RBI database at upload (rule A 765).");
  } else {
    h+=note("You have answered that there is no bank account in India. A non-resident company may instead give a foreign account below.","warn");
  }

  /* --- foreign account (non-residents' option, rows 115-116) --- */
  if(!isRes || (S.fbank||[]).length){
    h+=note("A non-resident may, at its option, furnish the details of one foreign bank account for the refund.");
    h+=grid("fbank",[{k:"swift",h:"SWIFT code",t:"txt",w:"180px",max:30,req:1},
      {k:"bank",h:"Name of the bank",t:"txt",w:"auto",max:125,req:1},
      {k:"country",h:"Country of location",t:"sel",w:"260px",req:1,opts:COUNTRY_B},
      {k:"iban",h:"IBAN",t:"txt",w:"280px",max:40,req:1}],
      S.fbank,{min:"980px",empty:"No foreign account.",add:"Add a foreign account"});
  }

  /* --- the refund figure (computed by the tax section, shown read-only) --- */
  h+=row("Refund due (computed on the Part B-TTI / tax screen)",cell((S.C.int||{}).refund),
    {ref:"rows 91-92",hint:"credited to the ticked account above"});

  /* --- foreign-asset question (AssetOutsideIndiaFlg, row 121) --- */
  h+=row("Do you at any time during the year hold, as beneficial owner, beneficiary or "+
    "otherwise, any asset (including financial interest in any entity) located outside India, "+
    "or have signing authority in any account located outside India, or have income from any "+
    "source outside India?",sel("ver.assetOut",ASSETOUT,{blank:false}),{req:1,ref:"row 121"});
  h+=note("Yes makes Schedule FA mandatory.");

  /* --- Verification (Verification sheet rows 4-8) --- */
  h+=sub("Verification");
  h+=note("<b>I,</b> the person named below, <b>solemnly declare</b> that to the best of my knowledge "+
    "and belief the information given in this return and the schedules is correct and complete and is "+
    "in accordance with the provisions of the Income-tax Act, 1961, and that I am competent to make this "+
    "return and verify it.");
  h+=row("I, (full name in block letters)",inp("ver.name",{max:125}),{req:1,ref:"C4"});
  h+=row("son / daughter of",inp("ver.father",{max:125}),{req:1,ref:"E4"});
  h+=row("making this return in my capacity as",sel("ver.cap",VCAP,{blank:false}),{req:1,ref:"D6"});
  h+=row("holding permanent account number (PAN)",inp("ver.pan",{max:10}),{req:1,ref:"C7"});
  h+=row("Place",inp("ver.place",{max:50}),{req:1,ref:"C8"});
  h+=row("Date",dte("ver.date"),{req:1,ref:"E8",hint:"date of signing; exported as YYYY-MM-DD"});
  h+=note("The submission date is the e-Filing portal's own system date; this is the date of signing.");
  if((S.ver||{}).cap==="RA")
    h+=note("Capacity is <b>Representative assessee</b>: the representative's name, capacity, address and "+
      "PAN/Aadhaar in Part A - General become mandatory (rule A 867), and the PAN quoted here must be one of "+
      "the Key Person PANs in Part A - General (rule A 868).","warn");

  /* --- the department's validation rules (shell panel) --- */
  h+=rulesPanel();

  /* --- export / save --- */
  h+=sub("Export");
  const errs=S.C.checks.filter(c=>c.lvl==="err").length;
  h+= errs
    ? note("<b>"+errs+" thing"+(errs>1?"s":"")+" still to fix.</b> Each sits against its own section.","stop")
    : note("Every check passes. The JSON is validated against the schema skeleton before it is written. "+
      "Import it into the government utility to seal and upload.","form");
  h+='<div style="padding:8px 14px;display:flex;gap:10px">'+
     '<button class="add" id="b_json2" style="height:32px;padding:0 18px;margin:0'+
     (errs?";opacity:.45":"")+'"'+(errs?" disabled":"")+'>Export the return as JSON</button>'+
     '<button class="add" id="b_save2" style="height:32px;padding:0 18px;margin:0">Save the working file</button></div>';
  return h;
}

/* ---- export --------------------------------------------------------- */
function expBank(j){
  /* the flag as the user answered it (row 99) */
  const flag=(S.ver||{}).bankFlag==="N"?"N":"Y";
  put(j,"PartB_TTI.Refund.BankAccountDtls.BankDtlsFlag",flag);

  /* India accounts -> AddtnlBankDetails[] (only complete rows) */
  const bk=(S.bank||[]).filter(b=>IFSC_RE.test(st0(b.ifsc).toUpperCase())&&st0(b.acno)&&st0(b.bank));

  const fb=(S.fbank||[]).filter(b=>st0(b.swift)&&st0(b.bank)&&st0(b.iban)&&st0(b.country));
  if(fb.length){
    j.PartB_TTI.Refund.BankAccountDtls.ForeignBankDetails=fb.map(b=>({
      SWIFTCode:st0(b.swift).slice(0,30),

      CountryCode:COUNTRY_B.some(c=>c[0]===st0(b.country))?st0(b.country):st0(b.country).slice(0,6),
      IBAN:st0(b.iban).slice(0,40)}));
  }

  /* foreign-asset flag (row 121) */
  put(j,"PartB_TTI.AssetOutsideIndiaFlg",(S.ver||{}).assetOut==="YES"?"YES":"NO");

  /* Verification.Declaration — all six leaves required, always present */
  put(j,"Verification.Declaration.AssesseeVerName",(sv(S.ver.name)||"NA").slice(0,125));
  put(j,"Verification.Declaration.FatherName",(sv(S.ver.father)||"NA").slice(0,125));

  put(j,"Verification.Declaration.Place",(sv(S.ver.place)||"NA").slice(0,50));
  put(j,"Verification.Declaration.Date",ISO(S.ver.date)||ISO(_verToday()));
  /* RefundDue is computed and exported by the tax section (order 90) — not written here. */

/* ---- import (inverse) ---------------------------------------------- */
function impBank(I6){
  const read=[]; const g=(o,p)=>p.split(".").reduce((t,k)=>t==null?undefined:t[k],o);
  const flag=g(I6,"PartB_TTI.Refund.BankAccountDtls.BankDtlsFlag");
  if(flag==="Y"||flag==="N"){S.ver=S.ver||{};S.ver.bankFlag=flag;}
  const bk=g(I6,"PartB_TTI.Refund.BankAccountDtls.AddtnlBankDetails")||[];
  if(Array.isArray(bk)&&bk.length){
    S.bank=bk.map(b=>({ifsc:b.IFSCCode||"",bank:b.BankName||"",acno:b.BankAccountNo||"",
      type:ACCT_B.some(a=>a[0]===b.AccountType)?b.AccountType:"CA",
      refund:b.UseForRefund==="true"?"Y":"N"}));
    read.push("bank accounts");
  }
  const fb=g(I6,"PartB_TTI.Refund.BankAccountDtls.ForeignBankDetails")||[];
  if(Array.isArray(fb)&&fb.length){
    S.fbank=fb.map(b=>({swift:b.SWIFTCode||"",bank:b.BankName||"",
      country:b.CountryCode||"",iban:b.IBAN||""}));
    read.push("foreign bank accounts");
  }
  const ao=g(I6,"PartB_TTI.AssetOutsideIndiaFlg");
  if(ao==="YES"||ao==="NO"){S.ver=S.ver||{};S.ver.assetOut=ao;read.push("foreign-asset flag");}
  const V=I6&&I6.Verification;
  if(V&&V.Declaration){
    const D=V.Declaration; S.ver=S.ver||{};
    S.ver.name  = D.AssesseeVerName||"";
    S.ver.father= D.FatherName||"";
    S.ver.pan   = D.AssesseeVerPAN||"";
    S.ver.cap   = VCAP.some(c=>c[0]===D.Capacity)?D.Capacity:"MD";
    S.ver.place = D.Place||"";
    if(D.Date)S.ver.date=dmy(D.Date)||S.ver.date;
    read.push("verification");
  }
  return read;
}

/* ---- checks (the section's own screen validations; not the dept rules) --- */
function chkBank(){
  const out=[]; engBank();
  const flagN=(S.ver||{}).bankFlag==="N";

  /* --- India accounts --- */
  if(!flagN){
    if(!(S.bank||[]).length)
      out.push({lvl:"err",t:"Bank account",m:"At least one bank account in India is needed for the refund.",sec:"bank"});
    else if(!S.bank.some(b=>b.refund==="Y"))
      out.push({lvl:"err",t:"Refund account",m:"Tick at least one account to receive the refund.",sec:"bank"});
    (S.bank||[]).forEach((b,i)=>{
      if(st0(b.ifsc)&&!IFSC_RE.test(st0(b.ifsc).toUpperCase()))
        out.push({lvl:"err",t:"Bank row "+(i+1),m:"The IFS code is four letters, a zero, then six letters or digits (rule A 386).",sec:"bank"});
      if(!st0(b.ifsc))out.push({lvl:"err",t:"Bank row "+(i+1),m:"The IFS code is required.",sec:"bank"});
      if(!st0(b.bank))out.push({lvl:"err",t:"Bank row "+(i+1),m:"The name of the bank is required.",sec:"bank"});
      if(!st0(b.acno))out.push({lvl:"err",t:"Bank row "+(i+1),m:"The account number is required.",sec:"bank"});
      if(!ACCT_B.some(a=>a[0]===b.type))out.push({lvl:"err",t:"Bank row "+(i+1),m:"Select the type of account.",sec:"bank"});
    });
  } else if((S.bank||[]).some(b=>st0(b.ifsc)||st0(b.acno)||st0(b.bank))){
    out.push({lvl:"warn",t:"Bank account",m:"You answered that there is no bank account in India, but account rows are filled — they will not be exported.",sec:"bank"});
  }

  /* --- foreign accounts (validate any row that is started) --- */
  (S.fbank||[]).forEach((b,i)=>{
    if(!(st0(b.swift)||st0(b.bank)||st0(b.country)||st0(b.iban)))return;
    if(!st0(b.swift))out.push({lvl:"err",t:"Foreign account "+(i+1),m:"The SWIFT code is required.",sec:"bank"});
    if(!st0(b.bank)) out.push({lvl:"err",t:"Foreign account "+(i+1),m:"The name of the bank is required.",sec:"bank"});
    if(!COUNTRY_B.some(c=>c[0]===st0(b.country)))out.push({lvl:"err",t:"Foreign account "+(i+1),m:"Select the country of location.",sec:"bank"});
    if(!st0(b.iban)) out.push({lvl:"err",t:"Foreign account "+(i+1),m:"The IBAN is required.",sec:"bank"});
  });

  /* --- verification (C4/E4/D6/C7/C8/E8) --- */
  if(!st0(S.ver.name))
    out.push({lvl:"err",t:"Verification",m:"The full name of the person verifying the return is required.",sec:"bank"});
  if(!st0(S.ver.father))
    out.push({lvl:"err",t:"Father's name",m:"The schema makes the father's name compulsory.",sec:"bank"});
  if(!PAN_RE.test(st0(S.ver.pan).toUpperCase()))
    out.push({lvl:"err",t:"Verifier's PAN",m:"A valid ten-character PAN of the person verifying is required.",sec:"bank"});
  if(!VCAP.some(c=>c[0]===S.ver.cap))
    out.push({lvl:"err",t:"Capacity",m:"Select the capacity in which the return is made.",sec:"bank"});
  if(!st0(S.ver.place))
    out.push({lvl:"err",t:"Place",m:"The place of signing is required in the verification.",sec:"bank"});
  if(!ISO(S.ver.date))
    out.push({lvl:"err",t:"Date",m:"The date of signing is required, as "+DF+".",sec:"bank"});

  /* --- representative rules from the book (A 867 / A 868) --- */
  if(S.ver.cap==="RA"){
    if(((S.fs||{}).rep)!=="Y")
      out.push({lvl:"warn",t:"Representative assessee (A 867)",m:"Capacity is Representative assessee, so the representative's name, capacity, address and PAN/Aadhaar in Part A - General must be given.",sec:"bank"});
    out.push({lvl:"warn",t:"Representative PAN (A 868)",m:"The PAN quoted in the verification must match one of the Key Person PANs entered in Part A - General.",sec:"bank"});
  } else if(((S.pi||{}).domestic)==="Y" && PAN_RE.test(st0(S.ver.pan).toUpperCase())){
    /* A 868 — domestic company: verification PAN must be a Key Person PAN (checked against Part A General; offline notice) */
    out.push({lvl:"warn",t:"Verifier's PAN (A 868)",m:"For a domestic company, the PAN in the verification must match one of the Key Person PANs in Part A - General.",sec:"bank"});
  }

  /* --- LEI when the refund is Rs 50 crore or more (rule B 27) --- */
  if(N((S.C.int||{}).refund)>=500000000)
    out.push({lvl:"warn",t:"LEI (B 27)",m:"The refund is Rs 50 crore or more, so the Legal Entity Identifier (LEI) details in Part A - General are mandatory.",sec:"bank"});

  if(!out.length)
    out.push({lvl:"ok",t:"Bank and verification",m:"Verified by "+st0(S.ver.name)+" as "+
      ((VCAP.find(c=>c[0]===S.ver.cap)||["","Managing Director"])[1])+"; every check passes.",sec:"bank"});
  return out;
}
