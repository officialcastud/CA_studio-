        if(r[4].cyOS)S.loss.osOver[k]={os:N(b.OthSrcLossNoRaceHorseSetoff)};});}
    read.push("Schedule CYLA");}
  if(bf){S.loss.editB=(bf.BFLAEditFlag==="Y")?"Y":"";
    if(S.loss.editB){S.loss.bflaOver={};
      LOSS_ROWS.forEach(r=>{const k=r[0],b=bf[r[3]]&&bf[r[3]].IncBFLA;if(b&&r[5].bf2)S.loss.bflaOver[k]=N(b.BFlossPrevYrUndSameHeadSetoff);});}
    read.push("Schedule BFLA");}
  if(cf){S.loss.cfl=S.loss.cfl||{};
    CFL_YEARS.forEach(([y,key,F])=>{const d=rg(cf,key+".CarryFwdLossDetail");if(!d)return;
      const row={dt:dmy(d.DateOfFiling)};
      if(F.hp)row.hp=nz(d.TotalHPPTILossCF);
      if(F.bus){row.bus5a=nz(d.BroughtFrwrdBusLoss);row.bus5b=nz(d.AmtAdjAccOptTaxUs115BAA_115BA);}
      if(F.spec)row.spec=nz(d.LossFrmSpecBusCF);
      if(F.specified)row.specified=nz(d.LossFrmSpecifiedBusCF);
      if(F.b115)row.b115=nz(d.LossFrmLifeInsBusUs115B);
      if(F.st)row.st=nz(d.TotalSTCGPTILossCF);
      if(F.lt)row.lt=nz(d.TotalLTCGPTILossCF);
      if(F.horse)row.horse=nz(d.OthSrcLossRaceHorseCF);
      S.loss.cfl[y]=row;});
    read.push("Schedule CFL (losses carried forward)");}
  if(ud){const arr=(ud.ScheduleUD||[]).map(r=>({ay:r.AssYr||"",bfud:N(r.AmtBFUD),adj115:N(r.AmtAdjOptTaxUs115BAA),
      soc:N(r.AmtDeprSOCY),bfallow:N(r.AmtBFUAllow),allowsoc:N(r.AmtAllowSOCY)}));
    if(arr.length){if(arr[0].ay!=="2026-27")arr.unshift({ay:"2026-27"});S.loss.ud=arr;}
    read.push("Schedule UD (unabsorbed depreciation / s.35(4) allowance)");}
  return read;
}

/* ---- checks --------------------------------------------------------- */
function chkLoss(){
  const out=[];const L=S.C.loss||engLoss();const baa=loss115BAA();
  const add=(lvl,t,m)=>out.push({lvl,t,m,sec:"loss"});

  /* CYLA Rs 2,00,000 cap on the HP set-off (s.71(3A) / A502: 2xvi <= 200000) */
  if(L.totHPset>200000) add("err","House-property set-off cap","The current-year house-property loss set off (Rs "+F(L.totHPset)+") exceeds the Rs 2,00,000 limit of section 71(3A).");

  /* CFL 5b (115BAA adjustment) only when the company has opted for 115BAA (A564) */
  if(!baa){const bad=CFL_YEARS.filter(([y,,F])=>F.bus&&N(((S.loss.cfl||{})[y]||{}).bus5b)>0).map(x=>x[0]);
    if(bad.length) add("warn","115BAA adjustment without opting","Schedule CFL 5b (amount adjusted on opting for section 115BAA) is filled for "+bad.join(", ")+" but must be nil unless the company opts for taxation u/s 115BAA.");}

  /* Schedule UD 3a (115BAA adjustment) only when opting for 115BAA (A569) */
  if(!baa){const badUD=(S.loss.ud||[]).some(r=>N(r.adj115)>0);
    if(badUD) add("warn","Schedule UD 115BAA adjustment","Schedule UD column 3a (adjustment on opting for section 115BAA) is filled but must be nil unless the company opts for taxation u/s 115BAA.");}

  /* Schedule UD col 4 depreciation set off cannot exceed BP 12iii (A574) */
  const bp12iii=("inc12iii" in ((S.C&&S.C.bp)||{}))?R(N(S.C.bp.inc12iii)):null;
  if(bp12iii!=null && L.udPoolDep>bp12iii+1)
    add("err","Depreciation set off exceeds business income","The depreciation set off in Schedule UD (Rs "+F(L.udPoolDep)+") cannot exceed the income available in item 12iii of Schedule BP (Rs "+F(bp12iii)+").");

  /* Schedule UD first-row gate */
  {const rows=S.loss.ud||[];const first=rows[0]||{};
   const firstEmpty=!(N(first.bfud)||N(first.adj115)||N(first.soc)||N(first.bfallow)||N(first.allowsoc));
   const laterFilled=rows.slice(1).some(r=>N(r.bfud)||N(r.soc)||N(r.bfallow)||N(r.allowsoc));
   if(firstEmpty&&laterFilled) add("warn","Schedule UD first row empty","The first row (2026-27) of Schedule UD has no entry, so the later rows will not be considered. Fill the first row or move the amounts up.");}

  /* CFL — a carried-forward loss needs the year's date of filing */
  const noDate=CFL_YEARS.filter(([y,,F])=>{const r=(S.loss.cfl||{})[y]||{};
    const has=(F.hp&&N(r.hp))||(F.bus&&N(r.bus5a))||(F.spec&&N(r.spec))||(F.specified&&N(r.specified))||(F.b115&&N(r.b115))||(F.st&&N(r.st))||(F.lt&&N(r.lt))||(F.horse&&N(r.horse));
    return has&&!ISO(r.dt);}).map(x=>x[0]);
  if(noDate.length) add("err","Date of filing required in Schedule CFL","A brought-forward loss carries only if that year's return was filed in time — enter the date of filing for "+noDate.join(", ")+".");

  /* CFL — date of filing cannot precede 1 April of the assessment year (VBA per-row minimum) */
  const badDate=CFL_YEARS.filter(([y])=>{const r=(S.loss.cfl||{})[y]||{};const iso=ISO(r.dt);if(!iso)return false;
    const min=D(CFL_MINDATE[y]),got=D(r.dt);return min&&got&&got<min;}).map(x=>x[0]);
  if(badDate.length) add("err","Date of filing too early in Schedule CFL","The date of filing for "+badDate.join(", ")+" is before 1 April of that assessment year.");

  /* BFLA arithmetic / UD-reconciliation validators */
  (L.val||[]).forEach(m=>add("err","Schedule BFLA",m));

  /* informational */
  if(L.cylaTotal>0) add("ok","Current-year losses set off","Rs "+F(L.cylaTotal)+" of this year's losses set against other heads in Schedule CYLA.");
  if(L.bfSetoffTotal>0) add("ok","Brought-forward set off","Rs "+F(L.bfSetoffTotal)+" of brought-forward losses, depreciation and s.35(4) allowance set off in Schedule BFLA.");
  if(L.cf.total>0) add("ok","Carried forward to future years","Rs "+F(L.cf.total)+" of losses carried forward through Schedule CFL.");
  return out;
}

/* =====================================================================
   ITR-6 · Section "mat" — Minimum Alternate Tax (company)
   Schedules MAT (s.115JB book-profit MAT) + MATC (s.115JAA credit),
   built strictly from books/ITR-6/MAT.md and books/ITR-6/MATC.md
   (never ITR-3/ITR-5 numbers — those forms carry AMT s.115JC, not MAT).
   Self-contained: state seed, engMat, secMat, expMat, impMat, chkMat and
   one reg() at the bottom, overriding the Phase-4 boot stub for "mat".

   ITR-6 is the COMPANY return. Where ITR-3/ITR-5 compute AMT off *adjusted
   total income* (s.115JC/AMTC s.115JD), ITR-6 computes MAT off **book
   profit** (s.115JB) with a fixed add-back / deduction list, and MAT credit
   under s.115JAA (MATC). Applicability (books MAT §1 / MATC §1):
     · only a DOMESTIC company fills MAT/MATC (rule 685);
     · the whole schedule is NIL if the company opts for the concessional
       regime under section 115BAA or 115BAB (rule 674 / 683);
     · the MAT tax line is nil where book profit (deemed TI) <= 0.
   This build's client is a domestic company on the normal regime, so MAT
   applies. The concessional-regime and domestic-company gates are read
   defensively (Part A-General is owned by other builders) — see _matConc /
   _matDomestic; they default to "normal regime, domestic" so the section
   never throws and computes MAT for this client.

   Rate split (book MAT §1/§9): 9% on the IFSC slice (item 9a), 15% on the
   rest (item 9b). Surcharge and cess are applied in Part B-TTI by the tax
   section, not here.

   Compute model (books MAT §12 / MATC §9 — the FIX-WAVE-6A seam contract):
   this engine PUBLISHES, computed from Schedule MAT / book profit ALONE (it
   does NOT depend on the tax section):
     S.C.mat.deemedTI  (item 9)  -> Part B-TI (rule 745), via the tax section.
     S.C.mat.tax1d               -> Part B-TTI item 1d = MAT (item 10) +
                 surcharge + 4% cess (rule 774). This single figure feeds both
                 Schedule MATC item 1 AND the tax section's higher-of test at
                 Part B-TTI 3 (rule 768: gross = higher of 2f and 1d), so the
                 two share one source. (S.C.mat.tax = item 10 before surcharge/
                 cess is kept for Part B-TTI 1a, rule 771.)
     S.C.matc.* (the Schedule MATC figures: item 1/2/3, the year rows,
                 credit = item 5, carryFwd = item 6).
   and CONSUMES, for the MATC head (seam keys — never tax.mat1d/normal2f that
   do not exist):
     MATC item 1 <- S.C.mat.tax1d  (this section's own 1d, computed above).
     MATC item 2 <- S.C.tax.normal2f (published by engTax = Part B-TTI 2f, the
                 normal gross tax incl. surcharge+cess); 0 until the tax section
                 has run (pass 1). The compute() fixpoint (mat corder 70 < tax
                 corder ~90) makes MATC converge on the real 2f by pass 2.
   The credit SET-OFF for Part B-TTI point 4 is NOT computed here — the tax
   section derives it from S.C.mat.tax1d and S.C.tax.normal2f (contract); this
   section only publishes the Schedule MATC figures. It OWNS only ScheduleMAT /
   ScheduleMATC — it writes no Part B block (the tax section owns those).
   ===================================================================== */

/* ---- applicability gates (read Part A-General defensively) --------------- */
/* Domestic company? (rule 685). S.pi.domestic is seeded "Y"; other builders
   may also stamp S.who. Default to domestic so MAT computes for this client. */
function _matDomestic(){
  const v=st0((S.pi&&S.pi.domestic)!=null?S.pi.domestic:"Y").toUpperCase();
  if(v==="N"||v==="FOREIGN"||v==="F") return false;
  const w=(S.who||{});
  const wv=st0(w.domestic||w.domesticFlg||w.DomesticCompFlg||"").toUpperCase();
  if(wv==="N"||wv==="FOREIGN"||wv==="F") return false;
  return true;
}
/* Opted concessional regime 115BAA / 115BAB? (rule 674/683 -> schedule nil).
   Read a published scalar first, then Part A-General state (owned by who/gen);
   defaults to false = normal regime (correct for this build). */
function _matConc(){
  const t=(S.C&&S.C.tax)||{};
  let s=st0(t.conc115||t.regime115||t.regimeSec||t.sec115||"");
  if(!s){
    const w=(S.who||{}), g=(S.gen||{});
    s=[w.sec115,w.section115,w.Section115BA,w.regime,w.sec115cur,w.Section115CurrAY,
       g.sec115,g.Section115BA].map(st0).join(" ");
  }
  return /115BA[AB]/.test(s);
}

/* Surcharge on the MAT (Tax.md §4 / MAT.md §9), tiered on the deemed total
   income (item 9) with marginal relief; MAT rate 15% at the cut-off income.
   Self-contained so S.C.mat.tax1d is computed from book profit alone (the seam
   contract forbids depending on the tax section); it mirrors taxMatSurcharge in
   70_sec_tax.js so the two agree to the rupee. MAT is a domestic-company charge
   (rule 685), so the domestic tiers (7% >1cr / 12% >10cr) apply; the foreign
   tiers (2%/5%) are kept only for completeness. Returns the surcharge amount. */
function _matSurcharge(deemedTI, matTax, domestic){
  const rate = deemedTI>100000000?(domestic?0.12:0.05)
             : deemedTI>10000000 ?(domestic?0.07:0.02):0;
  let sur=R(matTax*rate);
  if(rate>0){
    const th   = deemedTI>100000000?100000000:10000000;
    const lower= deemedTI>100000000?(domestic?0.07:0.02):0;   /* surcharge of the tier below */
    const matTaxAtTh=R(th*0.15), surAtTh=R(matTaxAtTh*lower);
    const mr=Math.max(0,(matTax+sur)-(matTaxAtTh+surAtTh)-(deemedTI-th));
    sur=Math.max(0,sur-mr);
  }
  return R(sur);
}

/* ---- engine ------------------------------------------------------------- */
/* Computes MAT (items 4..10) then MATC (items 1..6), publishing S.C.mat and
   S.C.matc. All cross-reads guarded; never throws on empty state. */
function engMat(){
  const domestic=_matDomestic(), conc=_matConc();

  /* ===== Schedule MAT ============================================== */
  const item4 = sg(S.mat.pat);                          /* may be negative */
  const tot5  = MAT_ADD.reduce((a,x)=>a+n0(get("mat.add."+x[0])),0);
  const tot6  = MAT_DED.reduce((a,x)=>a+n0(get("mat.ded."+x[0])),0);
  const book7 = R(item4 + tot5 - tot6);                 /* 7 = 4 + 5n - 6l */
  const tot8e = Math.max(0, MAT_8A.reduce((a,x)=>a+n0(get("mat.a8."+x[0])),0));
  /* 8Bj = max(0, 8f+8g+8h+8i) — sums 8i (the utility's H49 bug corrected) */
  const tot8j = Math.max(0, MAT_8B.reduce((a,x)=>a+n0(get("mat.b8."+x[0])),0));
  const item9 = conc ? 0 : R(book7 + tot8e - tot8j);    /* 9 = 7 + 8e - 8j; 0 under 115BAA/BAB */
  const ifsc9a= conc ? 0 : Math.min(Math.max(0,item9), n0(S.mat.ifsc));  /* 9a in [0, item9] */
  const item9b= R(item9 - ifsc9a);                      /* 9b = 9 - 9a */
  const tax10 = (conc||item9<=0) ? 0
              : Math.max(0, R(0.09*ifsc9a + 0.15*item9b));  /* 9%*9a + 15%*9b */

  /* Part B-TTI 1d (rule 774) = MAT (item 10) + surcharge (1b) + 4% cess (1c),
     computed here from book profit alone. This is the seam figure the tax
     section reads for the higher-of test (rule 768) and that MATC item 1 uses. */
  const mat1b = (conc||item9<=0) ? 0 : _matSurcharge(item9, tax10, domestic);
  const mat1c = (conc||item9<=0) ? 0 : R((tax10 + mat1b)*0.04);
  const tax1d = (conc||item9<=0) ? 0 : R(tax10 + mat1b + mat1c);

  const matContent = item4!==0 || tot5>0 || tot6>0 || tot8e>0 || tot8j>0 ||
    st0(S.mat.q1) || st0(S.mat.q3) || n0(S.mat.ifsc)>0;

  S.C.mat={
    on: domestic && !conc && !!matContent,
    domestic, conc,
    item4, tot5:R(tot5), tot6:R(tot6), book7,
    tot8e:R(tot8e), tot8j:R(tot8j),
    item9, ifsc9a:R(ifsc9a), item9b, tax10,
    deemedTI:item9,      /* -> Part B-TI (rule 745), via the tax section */
    tax:tax10,           /* -> Part B-TTI 1a (rule 771), via the tax section */
    sur1b:mat1b, cess1c:mat1c,
    tax1d};              /* -> Part B-TTI 1d (rule 774) & Schedule MATC item 1 */

  /* ===== Schedule MATC ============================================= */
  const tax=(S.C&&S.C.tax)||{};
  /* item 1 (MATC §2, rule 677) <- Part B-TTI 1d = this section's own tax1d
     (MAT + surcharge + cess), computed above from book profit alone. */
  const td1d = tax1d;
  /* item 2 (MATC §2, rule 678) <- Part B-TTI 2f = S.C.tax.normal2f, published
     by engTax (normal gross tax incl. surcharge+cess); 0 until it has run. */
  const tf2f = tax.normal2f!=null ? N(tax.normal2f) : 0;
  /* relief net-off for the current-year gross (book MATC §3, G27): 2f IS the
     gross tax liability under normal provisions, so grossLiab = item 2. */
  const grossLiab = tf2f;
  const relief = tax.totRelief!=null ? Math.max(0, N(tax.totRelief)-N(grossLiab)) : 0;

  const item1 = R(td1d), item2 = R(tf2f);
  const item3 = conc ? 0 : Math.max(0, item2 - item1);   /* MAX(0, 2 - 1) */

  const rows=(S.mat.matc.rows||[]).map(r=>{
    const b1=n0(r.gross), b2=n0(r.setoff), b3=Math.max(0,b1-b2);
    return {ay:r.ay, b1, b2, b3, c:0, d:0};
  });
  const sumB3=rows.reduce((a,r)=>a+r.b3,0);
  /* column C: set off OLDEST year first, total capped at item 3 and at Σ B3 */
  let pool = conc ? 0 : Math.min(item3, sumB3);
  rows.forEach(r=>{ const u=Math.min(pool, r.b3); r.c=u; pool-=u;
    r.d = conc ? 0 : Math.max(0, r.b3 - r.c); });

  /* current-year row 2026-27: gross = MAX(0, 1 - 2 - relief); no set-off in
     the year it arises, so its D = its own gross */
  const g27 = conc ? 0 : Math.max(0, item1 - item2 - relief);
  const k27 = conc ? 0 : g27;

  const totGross = rows.reduce((a,r)=>a+r.b1,0) + g27;    /* Σ G12:G27 */
  const totSetoff= rows.reduce((a,r)=>a+r.b2,0);
  const totBF    = rows.reduce((a,r)=>a+r.b3,0);
  const totUtil  = rows.reduce((a,r)=>a+r.c,0);           /* item 5 */
  const totCF    = rows.reduce((a,r)=>a+r.d,0) + k27;     /* item 6 (Σ K12:K27) */

  const matcContent = sumB3>0 || g27>0 || totSetoff>0;

  S.C.matc={
    on: domestic && !conc && !!matcContent,
    domestic, conc,
    item1, item2, item3,
    rows, g27:R(g27), k27:R(k27),
    totGross:R(totGross), totSetoff:R(totSetoff), totBF:R(totBF),
    totUtil:R(totUtil), totCF:R(totCF),
    credit:R(totUtil),     /* item 5 -> Part B-TTI point 4 (rule 772) */
    carryFwd:R(totCF)};    /* item 6 -> future years */
}

function secMat(){
  const G=S.C.mat||{}, M=S.C.matc||{}; let h="";
  const domestic=_matDomestic(), conc=_matConc();
  const YESNO=[["Y","Yes"],["N","No"]];
  const ONETWO=[["1","1 - Yes"],["2","2 - No"]];
  /* labelled numeric-input row */
  const ir=(path,ref,label,req)=>row(label, inp(path,{n:1}), {ref:ref, req:req, ind:1});
  /* computed (green) row */
  const cr=(label,ref,val,cls)=>row(label, cell(val), {ref:ref, cls:cls});

  h+='<div class="cgband">Schedule MAT — Minimum Alternate Tax payable under section 115JB</div>';
  if(!domestic)
    h+=note("Schedule MAT applies only to a <b>domestic company</b> (rule 685). This company is not marked domestic in Part A-General, so MAT is not computed.","warn");
  else if(conc)
    h+=note("The company has opted for the concessional regime under section <b>115BAA / 115BAB</b>, so it is not liable to MAT under section 115JB (rule 674). Every figure below is held at zero.","warn");
  else
    h+=note("MAT is charged at <b>15%</b> of book profit, and a concessional <b>9%</b> on the portion of book profit from units located in an IFSC (item 9a). Surcharge and cess are added in Part B-TTI.");

  /* --- items 1-3: the three opening questions --- */
  h+=sub("Preparation of the statement of profit and loss");
  h+=row("1 · Is the P&L prepared in accordance with Parts II of Schedule III to the Companies Act, 2013?",
    sel("mat.q1",ONETWO),{ref:"E4"});

    h+=row("2 · If 1 is no, is the P&L prepared in accordance with the Act governing such company?",

  h+=row("3 · Are the same accounting policies, standards and depreciation method/rates followed as for the accounts laid before the AGM?",
    sel("mat.q3",ONETWO),{ref:"E6"});

  h+=sub("6 · Deductions");

  /* --- item 7 book profit --- */
  h+=cr("7 · Book profit under section 115JB (4 + 5n − 6l)","E36",G.book7||0,"grand");

  /* --- item 8 Ind-AS adjustments --- */
  h+=sub("8 · Ind-AS adjustments (sub-sections 2A to 2C of section 115JB)");

    sel("mat.indas",YESNO),{ref:"E37"});
  h+='<div class="cgband">8A · Additions to book profit under sub-sections (2A) to (2C)</div>';
  MAT_8A.forEach(x=>{ h+=ir("mat.a8."+x[0], x[1], "8A"+x[0]+" · "+x[2]); });
  h+=cr("8Ae · Total additions (8Aa to 8Ad)","H43",G.tot8e||0,"tot");
  h+='<div class="cgband">8B · Deductions from book profit under sub-sections (2A) to (2C)</div>';

  h+='<div class="cgband">Schedule MATC — Computation of tax credit under section 115JAA</div>';
  h+=note("MAT paid above the normal tax becomes a credit, carried forward up to fifteen assessment years and set off in a later year when the normal tax exceeds that year's MAT.");
  h+=cr("1 · Tax under section 115JB in A.Y. 2026-27 (1d of Part B-TTI)","E4",M.item1||0);

  h+='<tr><td class="l">xvi</td><td class="l">'+MATC_CURAY+' (current)</td>'+
    '<td class="num">'+cell(M.g27||0)+'</td><td class="num">—</td><td class="num">—</td>'+

  h+='</tbody><tfoot><tr><td class="l" colspan="2">xvii · Total</td>'+

  h+=cr("6 · MAT liability available for credit in subsequent assessment years [4(D) xvii]","E30",M.carryFwd||0,"tot");
  if((M.credit||0)>0)

  return h;
}

      AssYr:r.ay,

/* =====================================================================
   IMPORT — the inverse (schema -> S.mat); round-trip is identity because
   only the typed inputs are read back and the engine re-derives the totals.
   ===================================================================== */
function impMat(I6){
  const read=[];
  const m=I6.ScheduleMAT, c=I6.ScheduleMATC;

  if(m){
    S.mat.q1 = m.PLAcntPrepSchedVICompAct||"";
    S.mat.q2 = m.PLAcctFlg||"";
    S.mat.q3 = m.PLAcntPrepAsperAGM||"";
    S.mat.pat = nz(m.ProfAfterTaxPLAcnt);
    const A=m.Additions||{}; MAT_ADD.forEach(x=>{ S.mat.add[x[0]]=nz(A[x[3]]); });
    const D=m.Deducts||{};   MAT_DED.forEach(x=>{ S.mat.ded[x[0]]=nz(D[x[3]]); });
    S.mat.indas = m.FinancialStamentFlag||"";
    const AA=m.AdditionsProfUs115JB||{}; MAT_8A.forEach(x=>{ S.mat.a8[x[0]]=nz(AA[x[3]]); });
    const BB=m.DeductionsProfUs115JB||{}; MAT_8B.forEach(x=>{ S.mat.b8[x[0]]=nz(BB[x[3]]); });
    S.mat.ifsc = nz(m.DeemedTotalIncUs115JBIFSC);
    read.push("Schedule MAT (s.115JB book-profit MAT)");
  }

  if(c){
    const byAY={};
    (Array.isArray(c.UtilMATCredAvl)?c.UtilMATCredAvl:[]).forEach(r=>{ if(r&&r.AssYr) byAY[r.AssYr]=r; });
    S.mat.matc.rows = MATC_AYS.map(ay=>{ const r=byAY[ay]||{};
      return {ay:ay, gross:nz(r.MATCredGross), setoff:nz(r.MATCredSetOff)}; });
    read.push("Schedule MATC (s.115JAA MAT credit)");
  }
  return read;
}

/* =====================================================================
   CHECKS — this section's own screen validations (not the department rules)
   ===================================================================== */
function chkMat(){
  const out=[]; const G=S.C.mat||{}, M=S.C.matc||{};
  const add=(lvl,t,m)=>out.push({lvl,t,m,sec:"mat"});
  const domestic=_matDomestic(), conc=_matConc();

  if(!domestic || conc) return out;   /* MAT/MATC inert — nothing to validate */

  if(G.on){
    /* the mandatory opening flags */
    if(!st0(S.mat.q1))
      add("err","MAT item 1 unanswered","State whether the P&L is prepared per Parts II of Schedule III to the Companies Act, 2013.");
    if(S.mat.q1==="2"&&!st0(S.mat.q2))
      add("warn","MAT item 2 unanswered","Item 1 is “no”, so state whether the P&L is prepared per the Act governing the company.");
    if(!st0(S.mat.q3))
      add("err","MAT item 3 unanswered","State whether the same accounting policies/standards and depreciation method were followed as for the AGM accounts.");
    /* item 4 should equal Part A-P&L Sl. No. 56 (rule 676 — enforced in Phase 6) */
    if(N(S.mat.pat)===0)
      add("warn","MAT item 4 is zero","Profit after tax (item 4) is zero — it should equal Sl. No. 56 of Part A-P&L / Part A-P&L Ind AS.");
    /* 9a IFSC must not exceed item 9 */
    if(n0(S.mat.ifsc) > Math.max(0,G.item9)+0)
      add("err","IFSC deemed income too high","The IFSC portion (item 9a, ₹"+F(n0(S.mat.ifsc))+") cannot exceed the deemed total income at item 9 (₹"+F(Math.max(0,G.item9))+").");
    if((G.book7||0)>0 && (G.tax10||0)>0)
      add("ok","MAT computed","Book profit ₹"+F(G.book7)+", MAT ₹"+F(G.tax10)+" (before surcharge and cess).");
    else if((G.book7||0)<=0)
      add("ok","No MAT","Book profit is not positive, so the MAT under section 115JB is nil.");
  }

  if(M.on){
    /* rule 773 in spirit: credit is not usable in a year MAT is the higher tax */
    if((M.item1||0) > (M.item2||0) && (M.credit||0)>0)
      add("warn","MAT credit not set off this year","The MAT (item 1, ₹"+F(M.item1)+") exceeds the normal tax (item 2, ₹"+F(M.item2)+"), so no credit can be set off this year; any brought-forward credit carries forward.");
    /* set-off cannot exceed the headroom (item 3) — engine caps it, so warn only if data implies a claim beyond it */
    if((M.credit||0) > (M.item3||0)+1)
      add("err","MAT credit exceeds headroom","The credit utilised (₹"+F(M.credit)+") cannot exceed the amount of tax against which credit is available (item 3, ₹"+F(M.item3)+").");
    if((M.credit||0)>0)
      add("ok","MAT credit set off","₹"+F(M.credit)+" of MAT credit set off against the tax; ₹"+F(M.carryFwd)+" carried to subsequent years.");
  }
  return out;
}

/* =====================================================================
   ITR-6 · Section "os" — Income from Other Sources (the COMPANY return)
   Book: books/ITR-6/OS.md   ·   Schema block: ScheduleOS
   Structural template: forms/ITR-3/src/70_sec_os.js — every field, number,
   formula, enum and schema key below is taken from the ITR-6 books, not
   from ITR-3.  Compute order: 16 (an income head; before losses/tax).

   HOW ITR-6's OS DIFFERS FROM ITR-3's (book §14, notes "os:")
   ---------------------------------------------------------------------
   · Interest 1b has FIVE sub-lines (bi–bv), NOT nine — a company has no
     provident-fund proviso interest (book §2.1b; rule 474's sixth term is
     a stale parse-merge, so five is booked per utility+schema).
   · 1e "any other income" is lean: one fixed business-trust 56(2)(xii)
     line + a free table.  NO family-pension row, NO 89A notified-country
     split, NO 56(2)(xiii) life-insurance line.  1e is floored at nil
     (J22 = MAX(0, free rows + 56(2)(xii))).
   · There is NO item "5a" (income claimed for 89A relief) — item 6 is
     1(after DTAA) − 3 + 4 + 5, with no 89A subtraction (book §6; rule 471).
   · The accumulated-PF u/s 111 sub-schedule is HIDDEN (r39H–r43H) and is
     NOT built (book §12).  Because it is hidden the visible special-rate
     lettering runs ai, aii, b, c, d, e — so ITR-6's 2c/2d/2e are ITR-2's
     2d/2e/2f (notes "os:").
   · 2c = "any other income at special rate"  (OthersGrossDtls)
     2d = pass-through income at special rate  (PTIOthersGrossDtls)
     2e = the DTAA table                       (NRIDTAADtlsSchOS)
   · The 2e DTAA table uses SecITAct (not ITR-2's ItemNoincl) for "Section
     of I.T. Act" and NatureOfIncome for "Item No." (book §15.8); its
     NatureOfIncome enum is {1ai,1aiii,1b,1c,1d,2ai,2aii,2c,2d}.
   · Item-6 normal OS loss routes to CYLA 4i (book §14; rule 518 → CYLA
     1xiii); ITR-2 routed to CYLA 3i.
   · Item-8e race-horse loss carries to CFL.  SOURCE INCONSISTENCY (book
     §7, notes): sheet 8e label says "11xvii of Schedule CFL", rule 561
     says "11xix".  This section PUBLISHES the value (S.C.os.raceHorse,
     signed); the LOSS/CFL section owner reconciles the row number.
   · Item 10 has ten quarterly break-up blocks (two 115AD(1)(i) dividend
     rows — FII @20% and specified-fund @10%; NO 115ACA, NO NOT89A).

   ITEM 2 / ITEM 6 — the DTAA reclassification (book §3 J29, §6 L81)
   ---------------------------------------------------------------------
   The DTAA amounts attributable to the item-1 normal-rate lines (natures
   1ai,1aiii,1b,1c,1d), call it DTAA6, are MOVED from the normal leg to the
   special leg: item 6 SUBTRACTS DTAA6 (L81) and item 2 ADDS it back as the
   "2e elements related to Sl.No.1" term (J29; rule 472).  This is the one
   place ITR-6 diverges from the ITR-3 engine (which did not add DTAA into
   item 2).  The special-rate DTAA rows (natures 2ai,2aii,2c,2d) are already
   inside 2ai/2aii/2c/2d and are NOT re-added.  TotalAmtTaxUsDTAASchOs (the
   2e disclosure total, J65) is the sum of ALL counted rows.

   CROSS-SECTION ROLLS published on S.C.os (consumed by loss/si/tax):
     netNormal / normal / six  — item 6 (signed; <0 ⇒ CYLA 4i)
     special                   — item 2 total (→ Schedule SI, Part B-TI)
     raceHorse / horse.bal     — item 8e (signed; <0 ⇒ Schedule CFL)
     chargeable                — item 9 IncChargeableFrmOthSrc (→ Part B-TI)
     dtaaTotal                 — 2e TotalAmtTaxUsDTAASchOs (→ SI DTAA / CYLA)
     income                    — signed head figure (item2 + item6 + MAX0(8e))
   Regime note: deductions 3d/8b are disallowed under 115BAB (rule 488) —
   that is a Phase-6 rule on the filing-status flag, not an OS-local field,
   so it is left to the rules-enforcer (no regime gate lives in this engine).
   ===================================================================== */

/* ---- engine ------------------------------------------------------ */
function engOs(){
  S.os = S.os || {};
  const O = S.os;
  const C = S.C.os = { income:0 };

  /* ===== item 1 — gross income at normal applicable rates ===== */
  /* 1a (J5) = 1a(i) + 1a(ii) + 1a(iii) */
  const div_i=R(O.divOth), div_ii=R(O.div22e), div_iii=R(O.div22f);
  const a1 = div_i + div_ii + div_iii;                                    /* DividendGross */
  /* 1b (J9) = FIVE interest lines; PTI interest (1b(iv)) may be negative */
  const bi=R(O.intSaving), bii=R(O.intDeposit), biii=R(O.intRefund), biv=R(O.intPTI), bv=R(O.intOthers);
  const b1 = bi+bii+biii+biv+bv;                                          /* InterestGross */
  /* 1c */
  const c1 = R(O.rentMach);                                               /* RentFromMachPlantBldgs */
  /* 1d (J16) = MAX(0, 56(2)(x) five lines) */
  const d_i=R(O.giftMoney), d_ii=R(O.giftImmovWo), d_iii=R(O.giftImmovInadeq),
        d_iv=R(O.giftOthWo), d_v=R(O.giftOthInadeq);
  const d1 = Math.max(0, d_i+d_ii+d_iii+d_iv+d_v);                        /* Tot562x */
  /* 1e (J22) = MAX(0, free rows + business-trust 56(2)(xii)) */
  const othersSum = (O.others||[]).reduce((s,r)=>s+R(r.amt),0);
  const biz562xii = R(O.sum562xii);
  const e1 = Math.max(0, othersSum + biz562xii);                          /* AnyOtherIncome */
  const item1 = a1 + b1 + c1 + d1 + e1;                                   /* J4 GrossIncChrgblTaxAtAppRate */

  /* ===== item 2 — special rates ===== */
  const s2ai = R(O.win115BB);                                             /* LtryPzzlChrgblUs115BB */
  const s2aii = R(O.win115BBJ);                                           /* IncChrgblUs115BBJ */
  /* 2b (J32) = MAX(0, six 68/69 lines) */
  const b2 = Math.max(0, R(O.cc68)+R(O.ui69)+R(O.um69a)+R(O.udi69b)+R(O.ue69c)+R(O.hundi69d)); /* IncChrgblUs115BBE */
  /* 2c (J46) = Σ SourceAmount */
  const d2c = (O.spl||[]).reduce((s,r)=>s+R(r.amt),0);                    /* OthersGross */
  /* 2d (J58) = Σ PTI amounts */
  const d2d = (O.pti||[]).reduce((s,r)=>s+R(r.amt),0);                    /* PassThrIncOSChrgblSplRate */
  /* 2e (J65) DTAA — for an NRI only TRC="Y" rows count; residents: all rows */
  const dtaaRows = (O.dtaa||[]).map(r=>{
    const treaty = st0(r.treaty).toUpperCase()==="NIL" ? 0 : N(r.treaty);
    const hasTreaty = st0(r.treaty)!=="";
    const itact  = N(r.itact);
    const hasItact = st0(r.itact)!=="";
    /* col 10 applicable rate = lower of treaty (col 6) and IT-Act (col 9); L67 blanks it
       for a non-resident whose TRC is not "Y" */
    let appl = hasTreaty ? (hasItact ? Math.min(treaty,itact) : treaty) : (hasItact ? itact : "");
    if(os6_isNRI() && r.trc!=="Y") appl = "";
    const counts = os6_isNRI() ? (r.trc==="Y") : true;                    /* rule 495 / J65 */
    return {amt:R(r.amt), nature:st0(r.nature), sec:st0(r.sec), treaty, hasTreaty,
            itact, hasItact, appl, trc:r.trc||"", counts,
            cc:st0(r.cc), article:st0(r.article)};
  });
  /* DTAA6 = the item-1-attributable DTAA portion (natures 1ai,1aiii,1b,1c,1d),
     moved from the normal leg (item 6 subtracts) to the special leg (item 2 adds) */
  const OS_ITEM1_NAT = ["1ai","1aiii","1b","1c","1d"];
  const dtaa6 = dtaaRows.filter(r=>r.counts && OS_ITEM1_NAT.indexOf(r.nature)>=0)
                        .reduce((s,r)=>s+r.amt,0);                        /* OS.DTAA6 */
  const f2 = dtaaRows.filter(r=>r.counts).reduce((s,r)=>s+r.amt,0);       /* TotalAmtTaxUsDTAASchOs */
  /* item 2 (J29) = MAX(0, 2ai + 2aii + 2b + 2c + 2d + DTAA6) */
  const item2 = Math.max(0, s2ai + s2aii + b2 + d2c + d2d + dtaa6);       /* IncChargeableSpecialRates */

  /* ===== item 3 — section 57 deductions ===== */
  const expenses = R(O.dExpenses);                                        /* 3a Expenses */
  /* 3b depreciation — allowed only if rental income (1c) offered, restricted to 1c (rule 465) */
  const dep = c1>0 ? Math.min(Math.max(0,R(O.dDep)), c1) : 0;             /* Depreciation */
  /* 3c interest expenditure u/s 57(1): eligible ≤ 20% of dividend at 1a(i)+1a(ii) (rule 493) */
  const claimedInt = Math.max(0,R(O.dIntClaimed));                        /* UsrIntExp57 */
  const divForInt = div_i + div_ii;                                       /* 1a(i)+1a(ii) */
  const eligInt = divForInt>0 ? Math.min(claimedInt, R(0.20*divForInt)) : 0; /* IntExp57 */
  const totDed = expenses + dep + eligInt;                                /* J78 TotDeductions (3a+3b+3c) */

  /* ===== items 4, 5 ===== */
  const notDed58 = R(O.notDed58);                                         /* AmtNotDeductibleUs58 */
  const profit59 = R(O.profit59);                                         /* ProfitChargTaxUs59 */

  /* ===== item 6 (L81), signed — a loss routes to CYLA 4i ===== */
  const item6 = item1 - dtaa6 - totDed + notDed58 + profit59;            /* BalanceNoRaceHorse */

  /* ===== item 7 (L82) = 2 + MAX(0, 6) ===== */
  const item7 = item2 + Math.max(0, item6);                              /* TotOthSrcNoRaceHorse */

  /* ===== item 8 — race horses (L88) ===== */
  const H = O.horse||{};
  const hReceipts=R(H.receipts), hDed57=Math.max(0,R(H.ded57)), hNot58=R(H.notDed58), hProfit59=R(H.profit59);
  const item8e = hReceipts - hDed57 + hNot58 + hProfit59;                /* BalanceOwnRaceHorse (signed) */

  /* ===== item 9 (L89) = 7 + MAX(0, 8e) ===== */
  const item9 = item7 + Math.max(0, item8e);                             /* IncChargeableFrmOthSrc */

  /* ---- expose the working ---- */
  C.a1={i:div_i,ii:div_ii,iii:div_iii,tot:a1};
  C.b1={i:bi,ii:bii,iii:biii,iv:biv,v:bv,tot:b1};
  C.c1=c1;
  C.d1={i:d_i,ii:d_ii,iii:d_iii,iv:d_iv,v:d_v,tot:d1};
  C.e1={others:othersSum, biz562xii:biz562xii, tot:e1};
  C.item1=item1;
  C.s2ai=s2ai; C.s2aii=s2aii; C.b2=b2;
  C.d2c=d2c; C.d2d=d2d; C.f2=f2; C.dtaa6=dtaa6; C.dtaaRows=dtaaRows;
  C.item2=item2;
  C.ded={expenses, dep, claimedInt, eligInt, tot:totDed};
  C.notDed58=notDed58; C.profit59=profit59;
  C.item6=item6; C.item7=item7;
  C.horse={receipts:hReceipts, ded57:hDed57, not58:hNot58, profit59:hProfit59, bal:item8e};
  C.item9=item9;

  /* ---- rolls for other sections (loss / si / tax) ---- */
  C.netNormal  = R(item6);                 /* signed; <0 → CYLA 4i (rule 518) */
  C.normal     = R(item6);                 /* alias */
  C.six        = R(item6);                 /* alias (tax-section fallback name) */
  C.special    = R(item2);                 /* special-rate OS income → Schedule SI / Part B-TI */
  C.raceHorse  = R(item8e);                /* signed; <0 → Schedule CFL (rule 561: 11xix) */
  C.chargeable = R(item9);                 /* IncChargeableFrmOthSrc → Part B-TI */
  C.dtaaTotal  = R(f2);                    /* 2e total → Schedule SI DTAA / CYLA (rule 524, 616) */
  /* GTI contribution — signed on the normal leg so a loss reaches CYLA */
  C.income = R(item2 + item6 + Math.max(0, item8e));

  /* ================= Schedule-SI feed (special-rate OS heads) =================
     70_sec_si.js consumes S.C.os.siFeed keyed by the schema SecCode (SI.md
     §2/§3/§6). A value is a plain number (income — si.js supplies the rate
     from SI_RATE_DEF and computes the tax) or {inc,tax} for the DTAA head
     (treaty tax, rule A618). Every amount is REUSED from item 2 above — the
     2a winnings, 2b 115BBE, and the 2c/2d dropdown incomes summed by their
     own section code (which is already the schema enum spelling, verified
     against the SI SecCode enum) — never recomputed.

     DTAA netting (SI.md §6 r58 + Feed summary; OS book §13 l.407–410, rules
     616/630/631 "…after reducing DTAA"): the 2e income is disclosed once, at
     the treaty rate, under the single OS-DTAA head (code DTAAOS = the whole
     2e total f2, tax = Σ income × the applicable lower-of-treaty/IT-Act rate).
     Because the same DTAA income is also carried inside the 2a/2c/2d figures
     (see the item-2 note above — the 2ai/2aii/2c/2d DTAA rows are NOT re-added
     into item 2, they already sit in those heads), each special-rate head is
     reduced by its own counted-DTAA portion so no rupee is taxed twice; the
     natures map 2ai→5BB, 2aii→5BBJ 1:1, and a 2c/2d row names its head in the
     SecITAct (enum) column. The fed heads then reconcile to item 2. A head is
     emitted only when its remaining income is > 0 (SI.md §12.1). */
  const siFeed = {};
  const dtRows = (dtaaRows || []).filter(r => r.counts);           /* rule 495 gate already applied */
  const sumDt  = pred => dtRows.filter(pred).reduce((s, r) => s + r.amt, 0);

  /* gross special-rate incomes by SecCode, straight from item 2 */
  const osGross = {};
  const bump = (code, amt) => { if (code) osGross[code] = (osGross[code] || 0) + R(amt); };
  bump("5BB",  s2ai);                                              /* 2a(i)  115BB   */
  bump("5BBJ", s2aii);                                             /* 2a(ii) 115BBJ  */
  bump("5BBE", b2);                                                /* 2b     115BBE (never DTAA) */
  (O.spl || []).forEach(r => bump(st0(r.code), r.amt));            /* 2c dropdown incomes */
  (O.pti || []).forEach(r => bump(st0(r.code), r.amt));            /* 2d dropdown incomes */

  /* the DTAA portion carried inside those gross figures, by SecCode */
  const osDtaa = {};
  const bumpDt = (code, amt) => { if (code) osDtaa[code] = (osDtaa[code] || 0) + R(amt); };
  bumpDt("5BB",  sumDt(r => r.nature === "2ai"));                  /* 2ai ↔ 5BB   */
  bumpDt("5BBJ", sumDt(r => r.nature === "2aii"));                 /* 2aii ↔ 5BBJ */
  dtRows.filter(r => r.nature === "2c" || r.nature === "2d")       /* 2c/2d named by SecITAct */
        .forEach(r => bumpDt(st0(r.sec), r.amt));

  /* net each head; publish only what still carries income */
  Object.keys(osGross).forEach(code => {
    const net = R(Math.max(0, osGross[code] - R(osDtaa[code] || 0)));
    if (net > 0) siFeed[code] = net;
  });

  /* OS-DTAA head — the whole 2e total at the treaty rate ({inc,tax}); tax is
     Σ income × applicable rate (lower of treaty / IT-Act, per row). */
  if (R(f2) > 0) {
    const dtaaTax = dtRows.reduce((s, r) => {
      const rate = (r.appl !== "" && r.appl != null) ? N(r.appl) : 0;
      return s + R(r.amt * rate / 100);
    }, 0);
    siFeed["DTAAOS"] = { inc: R(f2), tax: R(dtaaTax) };
  }

  C.siFeed = siFeed;                        /* special-rate OS heads → Schedule SI (S.C.os.siFeed) */
}

/* ---- renderer ---------------------------------------------------- */
function secOs(){
  const O = S.os||{}, C = S.C.os||{};
  let h = "";

  h += note('Income from Other Sources for a company. Dividend reduced in Schedule BP / P&L must be offered here (rules 200, 201); a buy-back capital loss claimed in Schedule CG requires the 2(22)(f) dividend at 1a(iii) to be filled (rules 433, 500).');

  /* ===== item 1 — normal-rate income ===== */
  {
    let b = "";
    /* 1a — dividends */
    b += row("1a · Dividends, Gross (i + ii + iii)", cell((C.a1||{}).tot), {ref:"1a", cls:"tot"});
    b += row("Dividend income [other than (ii) and (iii)]", inp("os.divOth",{n:1}), {ind:1, ref:"1a(i)"});
    b += row("Dividend income u/s 2(22)(e)", inp("os.div22e",{n:1}), {ind:1, ref:"1a(ii)"});
    b += row("Dividend income u/s 2(22)(f) — buy-back treated as dividend", inp("os.div22f",{n:1}), {ind:1, ref:"1a(iii)",
      hint:"fill this if a buy-back loss is claimed in Schedule CG (rules 433, 500)"});
    /* 1b — interest (five lines) */
    b += row("1b · Interest, Gross (i … v)", cell((C.b1||{}).tot), {ref:"1b", cls:"tot"});
    b += row("From Savings Bank", inp("os.intSaving",{n:1}), {ind:1, ref:"1b(i)"});
    b += row("From Deposit (Bank / Post Office / Co-op Society)", inp("os.intDeposit",{n:1}), {ind:1, ref:"1b(ii)"});
    b += row("From Income Tax refund", inp("os.intRefund",{n:1}), {ind:1, ref:"1b(iii)"});
    b += row("In the nature of Pass through income / loss", inp("os.intPTI",{n:1}), {ind:1, ref:"1b(iv)", hint:"may be negative"});
    b += row("Others, incl. interest from Companies, NBFCs & HFCs", inp("os.intOthers",{n:1}), {ind:1, ref:"1b(v)"});
    /* 1c */
    b += row("1c · Rental income from machinery, plants, buildings etc., Gross", inp("os.rentMach",{n:1}), {ref:"1c",
      hint:"unlocks the depreciation deduction at 3b"});
    /* 1d — 56(2)(x) */
    b += row("1d · Income u/s 56(2)(x) chargeable to tax (i … v, floored at nil)", cell((C.d1||{}).tot), {ref:"1d", cls:"tot"});
    b += row("Aggregate sum of money received without consideration", inp("os.giftMoney",{n:1}), {ind:1, ref:"1d(i)"});
    b += row("Immovable property without consideration — stamp duty value", inp("os.giftImmovWo",{n:1}), {ind:1, ref:"1d(ii)"});
    b += row("Immovable property for inadequate consideration — SDV in excess", inp("os.giftImmovInadeq",{n:1}), {ind:1, ref:"1d(iii)"});
    b += row("Any other property without consideration — fair market value", inp("os.giftOthWo",{n:1}), {ind:1, ref:"1d(iv)"});
    b += row("Any other property for inadequate consideration — FMV in excess", inp("os.giftOthInadeq",{n:1}), {ind:1, ref:"1d(v)"});
    /* 1e — any other income */
    b += row("1e · Any other income (floored at nil)", cell((C.e1||{}).tot), {ref:"1e", cls:"tot"});
    b += row("Specified sum received by a unit holder from a business trust u/s 56(2)(xii)", inp("os.sum562xii",{n:1}), {ind:1, ref:"1e"});
    b += sub("Any other income — specify nature and amount");
    b += grid("os.others",[
      {k:"nat",h:"Nature",t:"txt",max:50,req:1},
      {k:"amt",h:"Amount",t:"num",w:"160px",req:1}
    ], O.others||[], {empty:"No other-income rows.", add:"Add an income row"});
    b += row("1 · Gross income chargeable at normal rates (1a+1b+1c+1d+1e)", cell(C.item1), {ref:"1", cls:"tot"});
    h += fold("os_1","1","Income chargeable at normal applicable rates", RS(C.item1||0), b, {def:true});
  }

  /* ===== item 2 — special rates ===== */
  {
    let b = "";
    b += note("Nothing in item 3 (deductions u/s 57) may be set against the special-rate income at 2a–2e (sheet row 72).");
    b += row("2a(i) · Winnings from lotteries, crossword puzzles, races, card games etc. u/s 115BB", inp("os.win115BB",{n:1}), {ref:"2a(i)"});
    b += row("2a(ii) · Winnings from online games u/s 115BBJ", inp("os.win115BBJ",{n:1}), {ref:"2a(ii)"});
    /* 2b — 115BBE */
    b += row("2b · Income chargeable u/s 115BBE (i … vi, floored at nil)", cell(C.b2), {ref:"2b", cls:"tot"});
    b += row("Cash credits u/s 68", inp("os.cc68",{n:1}), {ind:1, ref:"2b(i)"});
    b += row("Unexplained investments u/s 69", inp("os.ui69",{n:1}), {ind:1, ref:"2b(ii)"});
    b += row("Unexplained money etc. u/s 69A", inp("os.um69a",{n:1}), {ind:1, ref:"2b(iii)"});
    b += row("Undisclosed investments etc. u/s 69B", inp("os.udi69b",{n:1}), {ind:1, ref:"2b(iv)"});
    b += row("Unexplained expenditure etc. u/s 69C", inp("os.ue69c",{n:1}), {ind:1, ref:"2b(v)"});
    b += row("Amount borrowed or repaid on hundi u/s 69D", inp("os.hundi69d",{n:1}), {ind:1, ref:"2b(vi)"});
    /* 2c — other special-rate sources */
    b += sub("2c · Any other income chargeable at special rate");
    b += note("The utility narrows the section list by residential status; the full filed set is shown here (book §3).");
    b += grid("os.spl",[
      {k:"code",h:"Nature (special-rate section)",t:"sel",opts:OS6_SPL,req:1},
      {k:"amt",h:"Amount",t:"num",w:"150px"}
    ], O.spl||[], {min:640, empty:"No special-rate rows.", add:"Add a special-rate row",
       foot:[{l:1,v:"2c Total"},{v:C.d2c}]});
    /* 2d — PTI special-rate */
    b += sub("2d · Pass through income in the nature of income from other sources at special rate");
    b += grid("os.pti",[
      {k:"code",h:"Nature (PTI special-rate section)",t:"sel",opts:OS6_PTI,req:1},
      {k:"amt",h:"Amount",t:"num",w:"150px"}
    ], O.pti||[], {min:640, empty:"No PTI special-rate rows.", add:"Add a PTI row",
       foot:[{l:1,v:"2d Total"},{v:C.d2d}]});
    /* 2e — DTAA */
    b += sub("2e · Amount included in 1 and 2 above, chargeable at special rates in India as per DTAA (non-residents only)");
    b += note("For a non-resident a row counts in the 2e total only if the TRC is obtained (Yes); for a resident every row counts. The applicable rate is the lower of the treaty rate and the Income-tax Act rate. DTAA attributable to items 1a(i)/1a(iii)/1b/1c/1d is moved from item 6 to item 2.");
    b += grid("os.dtaa",[
      {k:"amt",h:"Amount of income",t:"num",w:"130px",req:1},
      {k:"nature",h:"Item No. in which included",t:"sel",opts:OS6_DTAA_NAT,req:1},
      {k:"cc",h:"Country",t:"sel",opts:OS6_CC,req:1},
      {k:"article",h:"Article of DTAA",t:"txt",max:20,req:1},
      {k:"treaty",h:"Rate as per Treaty (NIL if not chargeable)",t:"txt",max:10,req:1},
      {k:"trc",h:"TRC obtained",t:"sel",opts:OS6_TRC},
      {k:"sec",h:"Section of I.T. Act",t:"sel",opts:OS6_DTAA_SEC,req:1},
      {k:"itact",h:"Rate as per I.T. Act",t:"txt",max:10,req:1},
      {k:"appl",h:"Applicable rate [lower of Treaty, I.T. Act]",t:"calc",f:(r,i)=>((C.dtaaRows||[])[i]||{}).appl}
    ], O.dtaa||[], {min:1180, empty:"No DTAA rows.", add:"Add a DTAA row",
       foot:[{l:1,v:"2e Total"},{v:C.f2},{l:1,v:"",span:7}]});
    b += row("2 · Income chargeable at special rates (2ai+2aii+2b+2c+2d+2e)", cell(C.item2), {ref:"2", cls:"tot"});
    h += fold("os_2","2","Income chargeable at special rates", RS(C.item2||0), b);
  }

  /* ===== item 3 — section 57 deductions ===== */
  {
    const D = C.ded||{};
    let b = "";
    b += row("3a · Expenses / deductions (other than those relating to 2a–2e)", inp("os.dExpenses",{n:1}), {ref:"3a"});
    b += row("3b · Depreciation (available only if rental income offered at 1c)", (C.c1>0?inp("os.dDep",{n:1}):cell(0)), {ref:"3b",
      hint:(C.c1>0?"restricted to the 1c rental income (rule 465)":"available only when rental income is offered at 1c")});
    if(C.c1>0) b += row("3b · Depreciation allowed — computed", cell(D.dep), {ind:1, ref:"3b", cls:"tot"});
    b += row("3c · Interest expenditure u/s 57(1) claimed (dividend only)", inp("os.dIntClaimed",{n:1}), {ref:"3c",
      hint:"available only if dividend offered at 1a(i)/1a(ii); eligible ≤ 20% of that dividend"});
    b += row("3c · Eligible interest expenditure u/s 57(1) — computed", cell(D.eligInt), {ind:1, ref:"3c", cls:"tot"});
    b += row("3d · Total deductions (3a + 3b + 3c)", cell(D.tot), {ref:"3d", cls:"tot"});
    h += fold("os_3","3","Deductions under section 57", RS((C.ded||{}).tot||0), b);
  }

  /* ===== items 4–7 ===== */
  {
    let b = "";
    b += row("4 · Amounts not deductible u/s 58", inp("os.notDed58",{n:1}), {ref:"4"});
    b += row("5 · Profits chargeable to tax u/s 59", inp("os.profit59",{n:1}), {ref:"5"});
    if(C.dtaa6) b += row("Less: DTAA amounts attributable to item-1 lines (moved to item 2)", cell(-(C.dtaa6||0)), {ind:1, ref:"L81"});
    b += row("6 · Net income at normal rates (1 − DTAA − 3 + 4 + 5); a loss goes to CYLA 4i", cell(C.item6), {ref:"6", cls:"tot"});
    b += row("7 · Income from other sources other than race horses (2 + 6; 6 as nil if negative)", cell(C.item7), {ref:"7", cls:"tot"});
    h += fold("os_67","4–7","Net income from other sources", RS(C.item7||0), b, {def:true});
  }

  /* ===== item 8 — race horses (its own card, off by default) ===== */
  {
    const RH = C.horse||{};
    let b = "";
    b += row("8a · Receipts", inp("os.horse.receipts",{n:1}), {ref:"8a"});
    b += row("8b · Deductions u/s 57 in relation to 8a only", inp("os.horse.ded57",{n:1}), {ref:"8b"});
    b += row("8c · Amounts not deductible u/s 58", inp("os.horse.notDed58",{n:1}), {ref:"8c"});
    b += row("8d · Profits chargeable to tax u/s 59", inp("os.horse.profit59",{n:1}), {ref:"8d"});
    b += row("8e · Balance (8a − 8b + 8c + 8d)", cell(RH.bal), {ref:"8e", cls:"tot"});
    if(R(RH.bal)<0) b += note("A negative 8e is a race-horse loss carried to Schedule CFL (sheet: 11xvii; rule 561: 11xix) and taken as nil at item 9. It is set off against race-horse income only, for four years.");
    h += fold("os_8","8","Income from owning and maintaining race horses", RS((C.horse||{}).bal||0), b);
  }

  /* ===== item 9 ===== */
  h += row("9 · Income under the head “Income from other sources” (7 + 8e; 8e as nil if negative)",
           cell(C.item9), {ref:"9", cls:"tot"});

  /* ===== item 10 — quarterly accrual/receipt ===== */
  {
    let t = '<div class="full"><table class="gt" style="min-width:960px"><thead><tr>'+
      '<th class="l">Other Source Income</th>'+OS6_QCOLH.map(x=>'<th>'+esc(x)+'</th>').join("")+'</tr></thead><tbody>';
    OS6_QROWS.forEach(qr=>{
      t += '<tr><td class="l">'+esc(qr.l)+'</td>'+
        OS6_QP.map(pk=>'<td>'+inp("os.q."+qr.k+"."+pk,{n:1})+'</td>').join("")+'</tr>';
    });
    t += '</tbody></table></div>';
    let b = note("Quarterly break-up of income that accrues or is received under this head, for interest u/s 234C. Each row must reconcile to its source figure by its tie-back rule (e.g. row 1 = 2a(i); the 1a(i) dividend row = 1a(i) − DTAA subject to TRC − adjusted interest u/s 57).");
    b += t;
    h += fold("os_10","10","Information about accrual / receipt of income from Other Sources", "", b);
  }

  return h;
}

/* ---- export ------------------------------------------------------ */
function expOs(j){
  const C = S.C.os||{}, O = S.os||{};

  /* ---- item 3 Deductions object (required: Depreciation, TotDeductions) ---- */
  const D = C.ded||{};
  const ded = { Depreciation:n0(D.dep), TotDeductions:n0(D.tot) };
  if(D.expenses)   ded.Expenses    = sg(D.expenses);
  if(D.claimedInt) ded.UsrIntExp57 = n0(D.claimedInt);
  if(D.eligInt)    ded.IntExp57    = n0(D.eligInt);

  /* ---- IncOthThanOwnRaceHorse (parent of items 1–7) ---- */
  const a1=C.a1||{}, b1=C.b1||{}, d1=C.d1||{}, e1=C.e1||{};
  const io = {
    GrossIncChrgblTaxAtAppRate: sg(C.item1),
    DividendGross: sg(a1.tot),
    DividendOthThan22e: sg(a1.i),
    Dividend22e: sg(a1.ii),
    Dividend22f: sg(a1.iii),
    InterestGross: sg(b1.tot),
    IntrstFrmSavingBank: sg(b1.i),
    IntrstFrmTermDeposit: sg(b1.ii),
    IntrstFrmIncmTaxRefund: sg(b1.iii),
    NatofPassThrghIncome: sg(b1.iv),
    IntrstFrmOthers: sg(b1.v),
    RentFromMachPlantBldgs: sg(C.c1),
    Tot562x: n0(d1.tot),
    Aggrtvaluewithoutcons562x: sg(d1.i),
    Immovpropwithoutcons562x: sg(d1.ii),
    Immovpropinadeqcons562x: sg(d1.iii),

    Anyotherpropinadeqcons562x: sg(d1.v),
    AnyOtherIncome: sg(e1.tot),
    IncChargeableSpecialRates: sg(C.item2),
    LtryPzzlChrgblUs115BB: sg(C.s2ai),
    IncChrgblUs115BBE: n0(C.b2),
    CashCreditsUs68: sg(R(O.cc68)),
    UnExplndInvstmntsUs69: sg(R(O.ui69)),
    UnExplndMoneyUs69A: sg(R(O.um69a)),
    UnDsclsdInvstmntsUs69B: sg(R(O.udi69b)),
    UnExplndExpndtrUs69C: sg(R(O.ue69c)),
    AmtBrwdRepaidOnHundiUs69D: sg(R(O.hundi69d)),
    OthersGross: n0(C.d2c),

  };
  /* optional fixed lines */
  if(C.s2aii)        io.IncChrgblUs115BBJ    = sg(C.s2aii);
  if(R(O.sum562xii)) io.SumRecdPrYrBusTRU562xii = sg(R(O.sum562xii));
  if(R(O.notDed58))  io.AmtNotDeductibleUs58  = sg(C.notDed58);
  if(R(O.profit59))  io.ProfitChargTaxUs59    = sg(C.profit59);
  /* 1e free "any other income" rows */
  const others = (O.others||[]).filter(r=>st0(r.nat)||R(r.amt));
  if(others.length) io.OthersInc = { OthersIncDtls: others.map(r=>({
    OthNatOfInc:(sv(r.nat)||"NA").slice(0,50), OthAmount:sg(R(r.amt)) })) };
  /* 2c other special-rate rows */
  const spl = (O.spl||[]).filter(r=>st0(r.code)||R(r.amt));
  if(spl.length) io.OthersGrossDtls = spl.map(r=>({SourceDescription:st0(r.code)||"5AD1i", SourceAmount:sg(R(r.amt))}));
  /* 2d PTI special-rate rows */
  const pti = (O.pti||[]).filter(r=>st0(r.code)||R(r.amt));
  if(pti.length) io.PTIOthersGrossDtls = pti.map(r=>{
    const o = {SourceDescription:st0(r.code)||"PTI_5AD1i"};
    if(R(r.amt)) o.SourceAmount = sg(R(r.amt));
    return o;
  });
  /* 2e DTAA rows */
  const dtaa = (C.dtaaRows||[]).filter(r=>r.amt||st0(r.cc)||st0(r.article));
  if(dtaa.length) io.IncChargblSplRateOS.NRIOsDTAA = { NRIDTAADtlsSchOS: dtaa.map(r=>{
    const o = {
      DTAAamt: sg(r.amt),
      NatureOfIncome: st0(r.nature)||"1ai",
      CountryName: (OS6_CCNAME[st0(r.cc)]||"NA").slice(0,50),
      CountryCodeExcludingIndia: st0(r.cc)||"9999",
      DTAAarticle: (sv(r.article)||"NA").slice(0,20),
      RateAsPerTreaty: r.hasTreaty ? r.treaty : 0,
      SecITAct: st0(r.sec)||"56i",
      RateAsPerITAct: r.hasItact ? r.itact : 0
    };
    if(r.trc) o.TaxRescertifiedFlag = r.trc;
    if(r.appl!=="" && r.appl!=null) o.ApplicableRate = r.appl;
    return o;

  const OS = { IncOthThanOwnRaceHorse: io, TotOthSrcNoRaceHorse: sg(C.item7) };

  /* ---- item 8 race horses (required root group; always emitted) ---- */
  const RH = C.horse||{};
  const rh = { Receipts:n0(RH.receipts), DeductSec57:n0(RH.ded57), BalanceOwnRaceHorse:sg(RH.bal) };
  if(RH.not58)    rh.AmtNotDeductibleUs58 = sg(RH.not58);
  if(RH.profit59) rh.ProfitChargTaxUs59   = sg(RH.profit59);
  OS.IncFromOwnHorse = rh;

  /* ---- item 9 ---- */
  OS.IncChargeableFrmOthSrc = sg(C.item9);

  /* ---- item 10 quarterly DateRange objects (all ten required, always present) ---- */
  const q = O.q||{};
  OS6_QROWS.forEach(qr=>{
    const src = q[qr.k]||{};
    const dr = {};
    OS6_QP.forEach(pk=>{ dr[pk] = sg(R(src[pk])); });
    OS[qr.o] = { DateRange: dr };
  });

  j.ScheduleOS = OS;
}

/* ---- checks ------------------------------------------------------ */
function chkOs(){
  const out = [], C = S.C.os||{}, O = S.os||{};
  const D = C.ded||{};

  /* 3b depreciation only if rental income (1c) is offered */
  if(R(O.dDep)>0 && !(C.c1>0))
    out.push({lvl:"err", t:"Section 57 · depreciation", m:"Depreciation (3b) can be claimed only when rental income from machinery/plant/buildings is offered at 1c (rule 465).", sec:"os"});
  else if(R(O.dDep)>0 && R(O.dDep)>C.c1)
    out.push({lvl:"warn", t:"Section 57 · depreciation", m:"Depreciation (3b) is restricted to the 1c rental income of "+RS(C.c1)+"; only that much is allowed (rule 465).", sec:"os"});

  /* 3c interest expenditure — only against dividend at 1a(i)/1a(ii), and ≤ 20% of it */
  const divForInt = (C.a1||{}).i + (C.a1||{}).ii;
  if(R(O.dIntClaimed)>0 && !(divForInt>0))
    out.push({lvl:"err", t:"Section 57 · interest expenditure", m:"Interest expenditure u/s 57(1) (3c) is available only when dividend income is offered at 1a(i) and/or 1a(ii).", sec:"os"});
  else if(R(O.dIntClaimed) > (D.eligInt||0))
    out.push({lvl:"warn", t:"Section 57 · interest expenditure", m:"Interest expenditure u/s 57(1) is restricted to 20% of the dividend at 1a(i)+1a(ii); only "+RS(D.eligInt||0)+" of "+RS(R(O.dIntClaimed))+" claimed is eligible (rule 493).", sec:"os"});

  /* 2e DTAA — NRI/TRC gate and applicable-rate note */
  (C.dtaaRows||[]).forEach((r,i)=>{
    if(os6_isNRI() && r.amt>0 && r.trc!=="Y")
      out.push({lvl:"warn", t:"DTAA row "+(i+1), m:"You are a non-resident and no TRC is obtained for this row, so its "+RS(r.amt)+" is not counted in the 2e DTAA total (rule 495).", sec:"os"});
  });
  /* 2e is a non-resident-only table */
  if((C.dtaaRows||[]).some(r=>r.amt>0) && !os6_isNRI())
    out.push({lvl:"warn", t:"DTAA table", m:"The 2e DTAA table is applicable for non-residents only; the residential status in Part A-General is Resident.", sec:"os"});

  /* per-item DTAA caps (rules 481–487): 1a(i), 1b, 1d, 2a(i), 2a(ii), 2c, 2d */
  const capMap = [
    {nat:"1ai",  lim:(C.a1||{}).i, l:"1a(i) dividend"},
    {nat:"1b",   lim:(C.b1||{}).tot, l:"1b interest"},
    {nat:"1c",   lim:C.c1, l:"1c rental"},
    {nat:"1d",   lim:(C.d1||{}).tot, l:"1d 56(2)(x)"},
    {nat:"2ai",  lim:C.s2ai, l:"2a(i) 115BB"},
    {nat:"2aii", lim:C.s2aii, l:"2a(ii) 115BBJ"},
    {nat:"2c",   lim:C.d2c, l:"2c other special-rate"},
    {nat:"2d",   lim:C.d2d, l:"2d PTI special-rate"}
  ];
  capMap.forEach(cm=>{
    const sum = (C.dtaaRows||[]).filter(r=>r.counts && r.nature===cm.nat).reduce((s,r)=>s+r.amt,0);
    if(sum>R(cm.lim))
      out.push({lvl:"err", t:"DTAA vs "+cm.l, m:"The 2e DTAA amounts against "+cm.l+" ("+RS(sum)+") exceed that item's own figure "+RS(cm.lim)+" (rules 481–487).", sec:"os"});
  });

  /* 115BBF cannot be offered by a non-resident (rules 462, 231, 498) */
  if(os6_isNRI()){
    const has5bbf = (O.spl||[]).some(r=>st0(r.code)==="5BBF") || (O.pti||[]).some(r=>st0(r.code)==="PTI_5BBF");
    if(has5bbf)
      out.push({lvl:"err", t:"Section 115BBF", m:"A non-resident cannot offer patent income u/s 115BBF at 2c/2d (rule 462).", sec:"os"});
  }

  /* item-1 gift 56(2)(x) floored at nil */
  const d1=C.d1||{};
  if((d1.i+d1.ii+d1.iii+d1.iv+d1.v)<0)
    out.push({lvl:"warn", t:"Section 56(2)(x)", m:"The 56(2)(x) sub-lines sum below nil; item 1d is taken as nil.", sec:"os"});

  /* race-horse loss goes to CFL */
  if(R((C.horse||{}).bal)<0)
    out.push({lvl:"ok", t:"Race horses", m:"The race-horse balance (8e) is a loss of "+RS((C.horse||{}).bal)+"; it is carried to Schedule CFL (sheet 11xvii / rule 561 11xix — reconciled by the loss schedule) and taken as nil at item 9.", sec:"os"});

  /* item-6 loss to CYLA 4i */
  if(R(C.item6)<0)
    out.push({lvl:"ok", t:"Other sources loss", m:"Net income at normal rates (item 6) is a loss of "+RS(C.item6)+"; it is available for set-off at 4i of Schedule CYLA (rule 518).", sec:"os"});

  return out;
}

/* =====================================================================
   ITR-6 · Section "other" — Other schedules
     Schedule IF   (ScheduleIF)      — investment in unincorporated entities
     Schedule PTI  (SchedulePTI)     — pass-through income (115U/115UA/115UB)
     Schedule TPSA (ScheduleTPSA)    — tax on secondary adjustments 92CE(2A)
     Schedule 115TD(Schedule115TD)   — accreted income + 115TE interest
     Schedule GST  (ScheduleGST)     — turnover/gross receipt reported for GST
     Schedule FD   (ScheduleFD)      — foreign-currency payments/receipts (non-audit)
   Books: books/ITR-6/{IF,PTI,TPSA,Schedule_115TD,GST,FD}.md
   Structural template: forms/ITR-3/src/70_sec_other.js (pattern only —
   every field/number/formula here is from the ITR-6 books).
   Compute order 11 (screen order 15; among the disclosure schedules, after
   the income heads). These schedules are disclosures / additional-tax
   computations — none adds to Gross Total Income, so S.C.other.income = 0.

   CROSS-SECTION SCALARS PUBLISHED into S.C.other (guarded reads by consumers):
     if:            [] computed IF entities (per-entity name/pan/profit/interest/capbal)
     ifProfitShare  Σ ProfitShareAmt   -> Schedule BP A5a/A5b cap (rule 827)
     ifInterest     Σ IntrstAmtDueOrRecv -> statement of P&L 14xib (rule B10)
     ifCapBal       Σ FirmCapBalOn31Mar
     pti:           [] computed PTI blocks (head objects, ITR-3-shaped so the
                    HP/OS/CG/SI/EI builders read each net the same way)
     ptiExemptTotal Σ exempt net -> Schedule EI Sl. No. 5 (PassThrIncNotChrgblTax, rule 646)
     ptiHP          Σ i·HP net   -> Schedule HP item 2 (rule 186)
     ptiOSDiv/ptiOSOth Σ OS nets -> Schedule OS 2 (rules 469/487)
     tpsaNet        ScheduleTPSA item 4 (net additional tax) -> Part B-TTI
     td115Net       Schedule 115TD item 12 NetPaybleRefble -> Part B-TTI Sl. 13 (rules 779/780)
     td115AddIncInt Schedule 115TD item 10 (7+8)
   CONSUMES: none required (all reads are of this section's own state); the
   FD/TPSA audit-flag reads of the gen/accounts sections are guarded and
   optional.
   ===================================================================== */

/* ---- state ------------------------------------------------------- */
S.other = S.other || {
  /* Schedule IF — repeatable, one object per unincorporated entity */
  if:[],
  /* Schedule PTI — repeatable, one object per business trust / investment fund */
  pti:[],
  /* Schedule TPSA — one primary-adjustment figure + a challan table */
  tpsa:{ adj:"", challans:[] },
  /* Schedule 115TD — accreted-income computation + a deposit table.
     addtax (item 7) and interest (item 8) are entered figures — see note. */
  td:{ fmv:"", liab:"", fmv4i:"", fmv4ii:"", fmv4iii:"", liab4:"",
       addtax:"", interest:"", specdate:"", challans:[] },
  /* Schedule GST — repeatable, one row per GSTIN */
  gst:[],
  /* Schedule FD — four fixed foreign-currency lines (non-audit filer) */
  fd:{ payCap:"", payRev:"", rcptCap:"", rcptRev:"" }
};

/* SEED defaults for new repeatable rows (the shell add-handler also keeps
   its own SEED map keyed by the last path segment). */
SEED["other.if"]           = SEED["other.if"]           || {};
SEED["other.pti"]          = SEED["other.pti"]          || {};
SEED["other.gst"]          = SEED["other.gst"]          || {};
SEED["other.tpsa.challans"]= SEED["other.tpsa.challans"]|| {};
SEED["other.td.challans"]  = SEED["other.td.challans"]  || {};

/* dropdown value lists (from the books) */
const OTH_YN      = [["Yes","Yes"],["No","No"]];                       /* IF audit / 92E flags */
/* PTI entity covered — book dropdown "(Select)/Section 115U/115UA/115UB";
   the schema leaf InvstmntCvrdUs115UA115UB stores the display string. */
const OTH_PTIKIND = [["Section 115U","Section 115U"],
                     ["Section 115UA","Section 115UA"],
                     ["Section 115UB","Section 115UB"]];

/* Is this a company liable to audit u/s 44AB? Schedule FD is filled only by a
   NON-audit filer (book heading). The 44AB flag lives in the gen section
   (PartA_GEN2For6.LiableSec44ABflg). Guarded read; when unknown, treat the
   filer as non-audit so the FD card is offered. */
const oth_audited = ()=>{
  const g = S.gen||{}, A = g.aud||{};
  const v = st0(A.sec44AB||"");
  return v==="Y" || v==="Yes";
};
/* Part A-OI "impermissible avoidance arrangement (section 96)" = Yes requires
   TPSA (rule 693). Owned by the accounts section; guarded read for a screen
   hint only (the department rule itself is Phase 6). */
const oth_s96 = ()=>{
  const a = S.accounts||{};
  const v = st0(a.s96||a.impermissibleAvoid||"");
  return v==="Y" || v==="Yes";
};

/* ---- engine ------------------------------------------------------ */
function engOther(){
  S.other = S.other || {};
  const O = S.other;
  const C = S.C.other = { income:0 };

  /* ---------- Schedule IF (book IF.md) ---------- */
  const ifRows = (O.if||[]).map(r=>{
    r = r||{};
    const profit = R(r.profit), interest = Math.max(0,R(r.interest)), capbal = R(r.capbal);
    const pct = N(r.pct);
    const hasVal = !!(st0(r.name)||st0(r.ftype)||st0(r.pan)||profit||interest||capbal||pct);
    return { name:st0(r.name), ftype:st0(r.ftype), pan:st0(r.pan).toUpperCase(),
             audit:st0(r.audit), sec92e:st0(r.sec92e), pct:pct,
             profit:profit, interest:interest, capbal:capbal, hasVal:hasVal };
  });
  const ifTot = { profit:0, interest:0, capbal:0 };
  ifRows.forEach(x=>{ ifTot.profit+=x.profit; ifTot.interest+=x.interest; ifTot.capbal+=x.capbal; });
  C.if = ifRows;
  C.ifTot = ifTot;
  C.ifProfitShare = ifTot.profit;   /* -> BP A5a/A5b cap (rule 827) */
  C.ifInterest    = ifTot.interest; /* -> P&L 14xib (rule B10) */
  C.ifCapBal      = ifTot.capbal;

  /* ---------- Schedule PTI (book PTI.md) ---------- */
  /* col 9 = 7 - 8 on HP and each CG leaf; OS/exempt leaves carry no loss col.
     iia = ai+aii, iib = bi+bii, iii = a+b, iv = a+b+c (rules 661-665). */
  const leaf  = r => { r=r||{}; const inc=R(r.inc), loss=R(r.loss), tds=Math.max(0,R(r.tds));
                       return { inc, loss, net:inc-loss, tds }; };          /* col 9 = 7-8 */
  const leaf3 = r => { r=r||{}; const inc=R(r.inc), tds=Math.max(0,R(r.tds));
                       return { inc, net:inc, tds }; };                     /* no loss col */
  const add4  = (a,b)=>({ inc:a.inc+b.inc, loss:a.loss+b.loss, net:a.net+b.net, tds:a.tds+b.tds });
  const add3  = (a,b)=>({ inc:a.inc+b.inc, net:a.net+b.net, tds:a.tds+b.tds });
  C.pti = (O.pti||[]).map(b=>{
    b = b||{};
    const hp     = leaf(b.hp);
    const st111a = leaf(b.st111a), stOth = leaf(b.stOth);
    const lt112a = leaf(b.lt112a), ltOth = leaf(b.ltOth);
    const stAgg  = add4(st111a, stOth);     /* iia = ai + aii (rule 662) */
    const ltAgg  = add4(lt112a, ltOth);     /* iib = bi + bii (rule 663) */
    const osDiv  = leaf3(b.osDiv), osOth = leaf3(b.osOth);
    const osAgg  = add3(osDiv, osOth);      /* iii = a + b (rule 664) */
    const ex23   = leaf3(b.ex23fbb);
    const exB    = leaf3(b.exB); exB.code = st0(b.exBcode);
    const exC    = leaf3(b.exC); exC.code = st0(b.exCcode);
    const exTot  = { inc:ex23.inc+exB.inc+exC.inc, net:ex23.net+exB.net+exC.net,
                     tds:ex23.tds+exB.tds+exC.tds };   /* iv = a + b + c (rule 665) */
    const hasVal = !!(st0(b.name)||st0(b.pan)||st0(b.kind)||
                      hp.inc||hp.loss||stAgg.inc||ltAgg.inc||osAgg.inc||exTot.inc);
    return { kind:st0(b.kind), name:st0(b.name), pan:st0(b.pan).toUpperCase(),
             hp, st111a, stOth, lt112a, ltOth, stAgg, ltAgg,
             osDiv, osOth, osAgg, ex23, exB, exC, exTot, hasVal };
  });
  /* published totals for the head schedules */
  C.ptiExemptTotal = C.pti.reduce((a,b)=>a+R(b.exTot.net), 0);   /* -> EI Sl.5 (rule 646) */
  C.ptiHP          = C.pti.reduce((a,b)=>a+R(b.hp.net), 0);      /* -> HP item 2 (rule 186) */
  C.ptiOSDiv       = C.pti.reduce((a,b)=>a+R(b.osDiv.net), 0);   /* -> OS 2 dividend (rule 469) */
  C.ptiOSOth       = C.pti.reduce((a,b)=>a+R(b.osOth.net), 0);   /* -> OS 2 others (rule 487) */

  /* ---------- Schedule TPSA (book TPSA.md) ---------- */
  {
    const T = O.tpsa || {};
    const adj  = R(T.adj);                                  /* item 1 (typed) */
    const tax2a = R(adj * 0.18);                            /* 2a = 18% of 1 (rule 687) */
    const sur2b = R(tax2a * 0.12);                          /* 2b = 12% of 2a (rule 688) */
    const cess2c = R((tax2a + sur2b) * 0.04);               /* 2c = 4% of (2a+2b) (rule 689) */
    const tot2d = tax2a + sur2b + cess2c;                   /* 2d = 2a+2b+2c (rule 690) */
    const chal  = (T.challans||[]).map(c=>({ bsr:st0((c||{}).bsr), bank:st0((c||{}).bank),
                     date:st0((c||{}).date), srl:st0((c||{}).srl), amt:Math.max(0,R((c||{}).amt)) }));
    const paid3 = chal.reduce((a,c)=>a+c.amt, 0);           /* item 3 = Σ challans (rule 691) */
    const net4  = tot2d - paid3;                            /* item 4 = 2d - 3 (rule 692) */
    C.tpsa = { adj, tax2a, sur2b, cess2c, tot2d, paid3, net4, challans:chal,
               has:!!(adj || chal.length) };
    C.tpsaNet = net4;                                       /* -> Part B-TTI */
  }

  /* ---------- Schedule 115TD (book Schedule_115TD.md) ---------- */
  {
    const D6 = O.td || {};
    const fmv1   = R(D6.fmv);                               /* item 1 (typed) */
    const liab2  = R(D6.liab);                              /* item 2 (typed) */
    const net3   = fmv1 - liab2;                            /* item 3 = 1-2 (rule 695) */
    const f4i    = R(D6.fmv4i), f4ii = R(D6.fmv4ii), f4iii = R(D6.fmv4iii);
    const tot4iv = f4i + f4ii + f4iii;                      /* item 4iv (rule 696) */
    const liab4  = R(D6.liab4);                             /* item 5 (typed) */
    const acc6   = net3 - (tot4iv - liab4);                 /* item 6 = 3-(4iv-5) (rule 697) */
    const addtax7 = Math.max(0,R(D6.addtax));               /* item 7 (entered — MMR tax) */
    const int8    = Math.max(0,R(D6.interest));             /* item 8 (entered — 115TE) */
    const pay10   = addtax7 + int8;                         /* item 10 = 7+8 */
    const chal    = (D6.challans||[]).map(c=>({ date:st0((c||{}).date), bank:st0((c||{}).bank),
                      bsr:st0((c||{}).bsr), srl:st0((c||{}).srl), amt:Math.max(0,R((c||{}).amt)) }));
    const paid11  = chal.reduce((a,c)=>a+c.amt, 0);         /* item 11 = Σ challans */
    const net12   = Math.max(0, pay10 - paid11);            /* item 12 = 10-11, floor 0 (rule 698) */
    C.td = { fmv1, liab2, net3, f4i, f4ii, f4iii, tot4iv, liab4, acc6:acc6,
             addtax7, int8, pay10, paid11, net12, specdate:st0(D6.specdate), challans:chal,
             has:!!(fmv1 || liab2 || tot4iv || acc6 || addtax7 || int8 || chal.length) };
    C.td115AddIncInt = pay10;                               /* item 10 */
    C.td115Net       = net12;                               /* item 12 -> Part B-TTI Sl.13 (rule 779) */
  }

  /* ---------- Schedule GST (book GST.md) ---------- */
  C.gst = (O.gst||[]).map(r=>({ gstin:st0((r||{}).gstin), amt:R((r||{}).amt),
                                has:!!(st0((r||{}).gstin) || R((r||{}).amt)) }));

  /* ---------- Schedule FD (book FD.md) ---------- */
  {
    const F = O.fd || {};
    const payCap = R(F.payCap), payRev = R(F.payRev), rcptCap = R(F.rcptCap), rcptRev = R(F.rcptRev);
    C.fd = { payCap, payRev, rcptCap, rcptRev,
             has:!!(payCap || payRev || rcptCap || rcptRev), audited:oth_audited() };
  }

  /* disclosures only — nothing added to GTI here */
  C.income = 0;
}

/* ---- renderer ---------------------------------------------------- */
function secOther(){
  const O = S.other||{}, C = S.C.other||{};
  let h = "";

  /* ===== Schedule IF ===== */
  {
    let b = note("Information regarding investment in unincorporated entities — a company that is a partner in a firm, or holds an investment in an LLP / AOP / BOI, discloses one line per entity. The share of profit is generally exempt (taxed in the entity's hands); the interest is business income. This schedule is the source that Schedule BP item A5a/A5b reconciles against (rule 827), and the interest column ties to statement of P&L item 14xib (rule B10).");
    const rows = O.if||[];
    const cr = C.if||[];
    rows.forEach((raw,i)=>{
      const cb = cr[i] || {};
      const pre = "other.if."+i+".";
      const title = "Entity " + (i+1) + (st0(raw.name)?" — "+esc(st0(raw.name)):"");
      let inner = "";
      inner += row("Name of the entity", inp(pre+"name",{max:125}), {req:1, ref:"FirmName"});
