  let H="";

  /* ---------- Schedule FSI ---------- */
  let fsiInner=note("Details of income from outside India and tax relief (available only in case of resident). The amounts in (b) are already included in Part B-TI — this schedule identifies that slice and computes the relief. Column (e) = lower of (c) tax paid outside India and (d) tax payable in India. If no Country Code is entered, the row is not considered.");
  const HEADS=[["hp","i","House Property"],["bus","ii","Business or Profession"],["cg","iii","Capital Gains"],["os","iv","Other Sources"]];
  (S.fa.fsi||[]).forEach((rw,i)=>{
    const cr=(C.fsi||[])[i]||{heads:{},tot:{b:0,c:0,d:0,e:0}};
    let t='<div class="full"><table class="gt" style="min-width:920px"><thead><tr>'+
      '<th class="l">Head of income (a)</th>'+
      '<th>Income from outside India (b)</th>'+
      '<th>Tax paid outside India (c)</th>'+
      '<th>Tax payable in India (d)</th>'+
      '<th>Tax relief (e)=min(c,d)</th>'+
      '<th class="l">DTAA article u/s 90/90A (f)</th></tr></thead><tbody>';
    HEADS.forEach(hd=>{const k=hd[0], p="fa.fsi."+i+"."+k, hc=(cr.heads||{})[k]||{e:0};
      t+='<tr><td class="l">'+hd[1]+' — '+esc(hd[2])+'</td>'+
        '<td>'+inp(p+".b",{n:1})+'</td>'+
        '<td>'+inp(p+".c",{n:1})+'</td>'+
        '<td>'+inp(p+".d",{n:1})+'</td>'+
        '<td class="num">'+cell(hc.e)+'</td>'+
        '<td class="l">'+inp(p+".art",{max:16,ph:"Article"})+'</td></tr>';});
    const tt=cr.tot||{b:0,c:0,d:0,e:0};
    t+='<tr><td class="l"><b>Total (i+ii+iii+iv)</b></td>'+
       '<td class="num">'+cell(tt.b)+'</td><td class="num">'+cell(tt.c)+'</td>'+
       '<td class="num">'+cell(tt.d)+'</td><td class="num">'+cell(tt.e)+'</td><td></td></tr>';
    t+='</tbody></table></div>';
    const head=row("Country/Region Code",sel("fa.fsi."+i+".code",FA_CO),{req:1})+
      row("Taxpayer Identification Number",inp("fa.fsi."+i+".tin",{max:75}),{req:1})+
      row("Section under which relief claimed",sel("fa.fsi."+i+".sec",FA_RELSEC),{hint:"90 / 90A (DTAA) or 91 (no DTAA) — carried to Schedule TR"});
    const nm=rw.code?(FA_CONM[rw.code]||rw.code):"New country";
    fsiInner+=blk("fsi"+i, "Country "+(i+1)+" — "+esc(nm), tt.e?RS(tt.e)+" relief":"—", head+t, "fa.fsi."+i);
  });
  fsiInner+='<button class="add" data-add="fa.fsi">Add a country</button>';
  H+=fold("fa_fsi","Schedule FSI","Income from outside India & tax relief",
      (C.fsi||[]).length?(C.fsi.length+" countr"+(C.fsi.length>1?"ies":"y")):"None", fsiInner, {def:true});

  /* ---------- Schedule TR ---------- */
  let trTbl;
  if((C.trRows||[]).length){
    trTbl='<div class="full"><table class="gt" style="min-width:760px"><thead><tr>'+
      '<th class="l">Country/Region (a)</th><th class="l">TIN (b)</th>'+
      '<th>Taxes paid outside India (c)</th><th>Tax relief available (d)</th>'+
      '<th class="l">Relief section (e)</th></tr></thead><tbody>';
    (C.trRows||[]).forEach(r=>{
      let fi=-1;(S.fa.fsi||[]).forEach((b,j)=>{if(fi<0&&b.code===r.code)fi=j;});
      trTbl+='<tr><td class="l">'+esc(r.name||r.code)+'</td><td class="l">'+esc(r.tin||"—")+'</td>'+
        '<td class="num">'+cell(r.paid)+'</td><td class="num">'+cell(r.relief)+'</td>'+
        '<td class="l">'+(fi>=0?sel("fa.fsi."+fi+".sec",FA_RELSEC,{style:"width:100%"}):esc(r.sec||"—"))+'</td></tr>';
    });
    trTbl+='<tr><td class="l"><b>Total</b></td><td></td>'+
      '<td class="num">'+cell(C.paidTot)+'</td><td class="num">'+cell(C.reliefTot)+'</td><td></td></tr>';
    trTbl+='</tbody></table></div>';
  } else {
    trTbl=note("Schedule TR is generated from Schedule FSI — add a country in FSI above (with a Country Code) and its taxes paid (c) and relief (e) appear here per country.");
  }
  let trInner=trTbl+
    row("Total relief where DTAA applies (section 90/90A)",cell(C.dtaa),{hint:"sum of (d) where section is 90 or 90A"})+

    row("Total tax relief available",cell(C.reliefTot),{hint:"TotalTaxReliefOutsideIndia"})+
    row("Any tax paid outside India, on which relief was allowed in India, refunded/credited by the foreign authority this year?",
        sel("fa.trFlag",FA_REFFLAG));
  if(S.fa.trFlag==="YES"){
    trInner+=row("Amount of tax refunded",inp("fa.trAmt",{n:1}))+
             row("Assessment year in which the relief was allowed in India",inp("fa.trAY",{max:9,ph:"YYYY-YY"}));
  }
  H+=fold("fa_tr","Schedule TR","Summary of tax relief for taxes paid outside India",
      C.reliefTot?RS(C.reliefTot)+" relief":"—", trInner, {def:false});

  /* ---------- Schedule FA ---------- */
  let faInner=note("Details of foreign assets and income from any source outside India, held at any time during the <b>calendar year</b> 1 Jan – 31 Dec 2025 (peak and closing balances are for that period, not the financial year). Values in rupees. Beneficial interest counts. If no Country Code (or, in A1–D/F/G, no Country Code, and in E no institution name) is entered in a row, that row is not considered. The \"schedule / item where offered\" columns point at where the income already sits in this return — FA adds no income.");

    grid("fa.a3",[

  /* A4 — Foreign Cash Value Insurance / Annuity */
  faInner+=fold("fa_a4","A4","Foreign Cash Value Insurance / Annuity Contract", faCnt(S.fa.a4),

  /* B — Financial Interest in any Entity */
  faInner+=fold("fa_b","B","Financial Interest in any Entity", faCnt(S.fa.b),
    grid("fa.b",[
      {h:"Country/Region",k:"code",t:"sel",opts:FA_CO},
      {h:"ZIP",k:"ZipCode",t:"txt",max:8},
      {h:"Nature of entity",k:"NatureOfEntity",t:"txt",max:100},

  const fc=faCount();
  H+=fold("fa_fa","Schedule FA","Foreign assets & income from any source outside India",
      fc?(fc+" row"+(fc>1?"s":"")):"None", faInner, {def:false});

  return H;
}
/* small local helper: count label for a table */
function faCnt(a){a=a||[];return a.length?(a.length+" row"+(a.length>1?"s":"")):"None";}

/* ================================================================
   EXPORT — expFa(j)   (schema keys/enum values verbatim)
   ================================================================ */
function expFa(j){
  const C=S.C.fa||{fsi:[],trRows:[],paidTot:0,reliefTot:0,dtaa:0,notDtaa:0};
  if(!faOn())return;   /* FSI/TR/FA not applicable to a non-resident company */

  /* ---- ScheduleFSI ---- (four heads: HP, Business, CG, OS — no salary) ---- */
  const fsiArr=[];
  (C.fsi||[]).forEach(cr=>{
    if(!cr.code)return;    /* no country code -> row not considered */
    const el={};
    pf(el,"CountryName", cr.name||FA_CONM[cr.code]||"");
    pf(el,"CountryCodeExcludingIndia", cr.code);
    pf(el,"TaxIdentificationNo", cr.tin);
    const blkState=(S.fa.fsi||[]).find(b=>b.code===cr.code)||{};
    const obj=(sk,dtaa)=>{const h=(cr.heads||{})[sk]||{b:0,c:0,d:0,e:0};const o={};
      o.IncFrmOutsideInd=n0(h.b); o.TaxPaidOutsideInd=n0(h.c);
      o.TaxPayableinInd=n0(h.d);  o.TaxReliefinInd=n0(h.e);
      const art=sv((blkState[sk]||{}).art);
      if(art&&dtaa)o.DTAAReliefUs90or90A=art;
      return o;};
    el.IncFromHP      =obj("hp",1);
    el.IncFromBusiness=obj("bus",1);
    el.IncCapGain     =obj("cg",1);
    el.IncOthSrc      =obj("os",1);
    const t=cr.tot||{b:0,c:0,d:0,e:0};
    el.TotalCountryWise={IncFrmOutsideInd:n0(t.b),TaxPaidOutsideInd:n0(t.c),
                         TaxPayableinInd:n0(t.d),TaxReliefinInd:n0(t.e)};
    fsiArr.push(el);
  });
  if(fsiArr.length)put(j,"ScheduleFSI.ScheduleFSIDtls",fsiArr);

  /* ---- ScheduleTR1 ---- (grand total key is TotalTaxOutsideIndia) ---- */
  const trArr=[];
  (C.trRows||[]).forEach(r=>{
    const el={};
    pf(el,"CountryName", r.name||FA_CONM[r.code]||"");
    pf(el,"CountryCodeExcludingIndia", r.code);
    pf(el,"TaxIdentificationNo", r.tin);
    el.TaxPaidOutsideIndia=n0(r.paid);
    el.TaxReliefOutsideIndia=n0(r.relief);
    if(sv(r.sec))el.ReliefClaimedUsSection=r.sec;
    trArr.push(el);
  });
  if(trArr.length)put(j,"ScheduleTR1.ScheduleTR",trArr);
  if(trArr.length||C.reliefTot||C.paidTot){
    /* block-level required totals — present even at zero once TR is filed */
    put(j,"ScheduleTR1.TotalTaxOutsideIndia",n0(C.paidTot));
    put(j,"ScheduleTR1.TotalTaxReliefOutsideIndia",n0(C.reliefTot));
    put(j,"ScheduleTR1.TaxReliefOutsideIndiaDTAA",n0(C.dtaa));
    put(j,"ScheduleTR1.TaxReliefOutsideIndiaNotDTAA",n0(C.notDtaa));
    if(sv(S.fa.trFlag))put(j,"ScheduleTR1.TaxPaidOutsideIndFlg",S.fa.trFlag);
    if(S.fa.trFlag==="YES"){
      if(N(S.fa.trAmt))put(j,"ScheduleTR1.AmtTaxRefunded",n0(S.fa.trAmt));
      if(sv(S.fa.trAY))put(j,"ScheduleTR1.AssmtYrTaxRelief",st0(S.fa.trAY));
    }
  }

  /* ---- ScheduleFA ---- (resident company only) ---- */
  const hasCode=r=>st0(r.code)!=="";
  const ccA=(el,r)=>{pf(el,"CountryCodeExcludingIndia",r.code);pf(el,"CountryName",FA_CONM_A[r.code]||"");}; /* A1–A4 name list */

  if(I6.ScheduleFSI&&Array.isArray(I6.ScheduleFSI.ScheduleFSIDtls)){
    const trSec={};((I6.ScheduleTR1||{}).ScheduleTR||[]).forEach(r=>{trSec[r.CountryCodeExcludingIndia]=r.ReliefClaimedUsSection;});

    S.fa.fsi=I6.ScheduleFSI.ScheduleFSIDtls.map(el=>({

    S.fa.a3=map(F.DtlsForeignEquityDebtInterest,r=>Object.assign(cc(r),{NameOfEntity:r.NameOfEntity,AddressOfEntity:r.AddressOfEntity,ZipCode:r.ZipCode,NatureOfEntity:r.NatureOfEntity,InterestAcquiringDate:toDMY(r.InterestAcquiringDate),InitialValOfInvstmnt:nz(r.InitialValOfInvstmnt),PeakBalanceDuringPeriod:nz(r.PeakBalanceDuringPeriod),ClosingBalance:nz(r.ClosingBalance),TotGrossAmtPaidCredited:nz(r.TotGrossAmtPaidCredited),TotGrossProceeds:nz(r.TotGrossProceeds)}));
    S.fa.a4=map(F.DtlsForeignCashValueInsurance,r=>Object.assign(cc(r),{FinancialInstName:r.FinancialInstName,FinancialInstAddress:r.FinancialInstAddress,ZipCode:r.ZipCode,ContractDate:toDMY(r.ContractDate),CashValOrSurrenderVal:nz(r.CashValOrSurrenderVal),TotGrossAmtPaidCredited:nz(r.TotGrossAmtPaidCredited)}));
    S.fa.b=map(F.DetailsFinancialInterest,r=>Object.assign(cc(r),{ZipCode:r.ZipCode,NatureOfEntity:r.NatureOfEntity,NameOfEntity:r.NameOfEntity,AddressOfEntity:r.AddressOfEntity,NatureOfInt:r.NatureOfInt,DateHeld:toDMY(r.DateHeld),TotalInvestment:nz(r.TotalInvestment),IncFromInt:nz(r.IncFromInt),NatureOfInc:r.NatureOfInc,IncTaxAmt:nz(r.IncTaxAmt),IncTaxSch:r.IncTaxSch,IncTaxSchNo:r.IncTaxSchNo}));
    S.fa.c=map(F.DetailsImmovableProperty,r=>Object.assign(cc(r),{ZipCode:r.ZipCode,AddressOfProperty:r.AddressOfProperty,Ownership:r.Ownership,DateOfAcq:toDMY(r.DateOfAcq),TotalInvestment:nz(r.TotalInvestment),IncDrvProperty:nz(r.IncDrvProperty),NatureOfInc:r.NatureOfInc,IncTaxAmt:nz(r.IncTaxAmt),IncTaxSch:r.IncTaxSch,IncTaxSchNo:r.IncTaxSchNo}));
    S.fa.d=map(F.DetailsOthAssets,r=>Object.assign(cc(r),{ZipCode:r.ZipCode,NatureOfAsset:r.NatureOfAsset,Ownership:r.Ownership,DateOfAcq:toDMY(r.DateOfAcq),TotalInvestment:nz(r.TotalInvestment),IncDrvAsset:nz(r.IncDrvAsset),NatureOfInc:r.NatureOfInc,IncTaxAmt:nz(r.IncTaxAmt),IncTaxSch:r.IncTaxSch,IncTaxSchNo:r.IncTaxSchNo}));
    S.fa.e=map(F.DetailsOfAccntsHvngSigningAuth,r=>Object.assign(cc(r),{NameOfInstitution:r.NameOfInstitution,AddressOfInstitution:r.AddressOfInstitution,ZipCode:r.ZipCode,NameMentionedInAccnt:r.NameMentionedInAccnt,InstitutionAccountNumber:r.InstitutionAccountNumber,PeakBalanceOrInvestment:nz(r.PeakBalanceOrInvestment),IncAccuredTaxFlag:r.IncAccuredTaxFlag,IncAccuredInAcc:nz(r.IncAccuredInAcc),IncOfferedAmt:nz(r.IncOfferedAmt),IncOfferedSch:r.IncOfferedSch,IncOfferedSchNo:r.IncOfferedSchNo}));
    S.fa.f=map(F.DetailsOfTrustOutIndiaTrustee,r=>Object.assign(cc(r),{ZipCode:r.ZipCode,NameOfTrust:r.NameOfTrust,AddressOfTrust:r.AddressOfTrust,NameOfOtherTrustees:r.NameOfOtherTrustees,AddressOfOtherTrustees:r.AddressOfOtherTrustees,NameOfSettlor:r.NameOfSettlor,AddressOfSettlor:r.AddressOfSettlor,NameOfBeneficiaries:r.NameOfBeneficiaries,AddressOfBeneficiaries:r.AddressOfBeneficiaries,DateHeld:toDMY(r.DateHeld),IncDrvTaxFlag:r.IncDrvTaxFlag,IncDrvFromTrust:nz(r.IncDrvFromTrust),IncOfferedAmt:nz(r.IncOfferedAmt),IncOfferedSch:r.IncOfferedSch,IncOfferedSchNo:r.IncOfferedSchNo}));

    got.push("Schedule FA");
  }

}

/* ================================================================
   CHECKS — chkFa()   (this section's own screen validations)
   ================================================================ */
function chkFa(){
  const out=[];
  const res=faRes();
  const C=S.C.fa||{fsi:[],trRows:[],reliefTot:0};
  const anyFsi=(S.fa.fsi||[]).length>0;
  const fc=faCount();

  /* Not applicable to a non-resident company (FSI/TR/FA) */
  if(!faOn()){
    if(anyFsi||fc>0)
      out.push({lvl:"err",t:"Foreign schedules not applicable",
        m:"Residential status is non-resident. Schedules FSI, TR and FA are available only for a resident company — remove the foreign entries or correct the residential status.",sec:"fa"});
    return out.length?out:[{lvl:"ok",t:"Foreign income & assets",m:"Not applicable to a non-resident company.",sec:"fa"}];
  }

  /* FSI: country-code note; TIN per country block */
  (S.fa.fsi||[]).forEach((b,i)=>{
    const t=(C.fsi||[])[i]||{tot:{b:0,c:0,d:0}};
    const anyVal=(t.tot.b||t.tot.c||t.tot.d);
    if(!b.code&&anyVal)
      out.push({lvl:"warn",t:"FSI country "+(i+1)+" has no Country Code",
        m:"Figures are entered but no Country/Region Code is chosen — the utility ignores a row with a blank Country Code. Pick a country or clear the row.",sec:"fa"});
    if(b.code&&!st0(b.tin)&&anyVal)
      out.push({lvl:"warn",t:"FSI country "+(i+1)+" missing TIN",
        m:"Taxpayer Identification Number is required for each FSI country block.",sec:"fa"});
    if(b.code&&anyVal&&!st0(b.sec))
      out.push({lvl:"warn",t:"FSI country "+(i+1)+" missing relief section",
        m:"Choose the section under which relief is claimed (90 / 90A / 91) — it decides whether the relief goes to the DTAA or the non-DTAA total in Schedule TR.",sec:"fa"});
  });

  /* (e)=MIN(c,d): flag a head where tax was paid abroad but (d) is nil, so relief is 0 */
  (C.fsi||[]).forEach((cr,i)=>{
    ["hp","bus","cg","os"].forEach(k=>{const h=(cr.heads||{})[k]||{};
      if(n0(h.c)>0&&n0(h.d)===0)
        out.push({lvl:"warn",t:"No relief for country "+(i+1),
          m:"Tax was paid outside India on a head but tax payable in India (d) is nil, so relief (e)=min(c,d)=0. Enter (d) at the average Indian rate on that income.",sec:"fa"});
    });
  });

  /* TR refund clawback follow-up */
  if(S.fa.trFlag==="YES"){
    if(!N(S.fa.trAmt))out.push({lvl:"warn",t:"Refund amount missing",m:"You answered that foreign tax relief was refunded — enter the amount of tax refunded.",sec:"fa"});
    if(!st0(S.fa.trAY))out.push({lvl:"warn",t:"Refund AY missing",m:"Enter the assessment year in which the relief was allowed in India.",sec:"fa"});
  }

  /* FA where-offered pointer completeness (B/C/D require schedule + item no.) */
  [["b","B"],["c","C"],["d","D"]].forEach(pair=>{
    (S.fa[pair[0]]||[]).forEach((r,i)=>{
      if(st0(r.code)===""&&(N(r.TotalInvestment)||N(r.IncTaxAmt)))
        out.push({lvl:"warn",t:"FA "+pair[1]+" row "+(i+1)+" has no Country Code",
          m:"A row with values but no Country/Region Code is ignored by the utility — pick a country or clear the row.",sec:"fa"});
      else if(st0(r.code)!==""&&(!st0(r.IncTaxSch)||!st0(r.IncTaxSchNo)))
        out.push({lvl:"warn",t:"FA "+pair[1]+" row "+(i+1)+" incomplete",
          m:"Table "+pair[1]+" requires the schedule where the income is offered and its item number.",sec:"fa"});
    });
  });

  if(!out.length){
    out.push({lvl:"ok",t:"Foreign income & assets",
      m:(anyFsi||fc)?("FSI/TR relief "+RS(C.reliefTot||0)+"; FA rows "+fc+"."):"No foreign income, relief or assets.",sec:"fa"});
  }
  return out;
}

    (A.salesBand==="Upto10CR" && (A.pctRcvd==="MoreThan5Per" || A.pctPaid==="MoreThan5Per"));
  C.nobCodes = ((S.gen&&S.gen.nob)||[]).map(r=>r&&r.code).filter(Boolean);  /* -> bp/ded gating */
  C.income = 0;
}

/* =====================================================================
   EXPORT — expGen(j): serialise the whole PartA_GEN2For6 block from S.gen.
   Repeating tables are JSON ARRAYS (constitution rule 12). put()/oPut
   skip empty values; SKEL keeps the required leaves present at nil.
   ===================================================================== */
function expGen(j){
  const A=S.gen.aud||{}, H=S.gen.hold||{}, NC=S.gen.nat||{};
  const oPut=(o,k,v)=>{if(v!==undefined&&v!==null&&v!=="")o[k]=v;};
  const putArr=(path,arr)=>{if(arr&&arr.length)put(j,path,arr);};
  const UP=v=>{v=sv(v);return v?String(v).toUpperCase():undefined;};
  const pctVal=v=>{if(v===undefined||v===null||v==="")return undefined;const n=N(v);return n>0?n:undefined;};
  /* AddressDetailWithZipCode — one shared six-field sub-object */
  function addr(r){r=r||{};const a={};
    oPut(a,"AddrDetail",sv(r.addr));
    oPut(a,"CityOrTownOrDistrict",sv(r.city));
    oPut(a,"StateCode",sv(r.state));
    const cc=sv(r.country);
    oPut(a,"CountryCode",cc);
    if((cc||"91")==="91"){const p=R(r.pin);if(p>=100000&&p<=999999)a.PinCode=p;}
    else oPut(a,"ZipCode",st0(r.zip).slice(0,10));
    return a;}

  /* ---- audit information (top-level leaves of the block) ---- */
  put(j,"PartA_GEN2For6.LiableSec44AAflg",sv(A.sec44AA||"N"));
  put(j,"PartA_GEN2For6.IncDclrdUs",sv(A.incDclrdUs||"N"));
  put(j,"PartA_GEN2For6.TotalSalesExcOneCr",sv(A.salesBand));
  if(A.salesBand==="Upto10CR"){
    put(j,"PartA_GEN2For6.AgrOFAllAmtsRcvd",sv(A.pctRcvd));
    put(j,"PartA_GEN2For6.AgrOFAllPayMade",sv(A.pctPaid));
  }
  put(j,"PartA_GEN2For6.LiableSec44ABflg",sv(A.sec44AB||"N"));
  if(A.sec44AB==="Y"){
    put(j,"PartA_GEN2For6.AuditedByAccountantFlg",sv(A.acctFlg));
    if(A.acctFlg==="Y"){
      put(j,"PartA_GEN2For6.AuditInfo.AuditReportFurnishDate",ISO(A.repDate));
      if(A.repAck) put(j,"PartA_GEN2For6.AuditInfo.AckNum44AB",R(A.repAck));
      put(j,"PartA_GEN2For6.AuditInfo.AudFrmName",sv(A.frmName));
      put(j,"PartA_GEN2For6.AuditInfo.AudFrmPAN",UP(A.frmPAN));
    }
  }
  put(j,"PartA_GEN2For6.LiableSec92Eflg",sv(A.sec92E||"N"));
  put(j,"PartA_GEN2For6.AccountAuditFlag",sv(A.sec92E==="Y"?(A.acct92E||"N"):"N"));
  if(A.sec92E==="Y"&&A.acct92E==="Y"){
    put(j,"PartA_GEN2For6.AuditDetails92E.DateOfAudit",ISO(A.date92E));
    if(A.ack92E) put(j,"PartA_GEN2For6.AuditDetails92E.AckNum92E",R(A.ack92E));
  }
  putArr("PartA_GEN2For6.AuditDetails",(A.oth||[]).map(r=>{const o={};
    oPut(o,"AuditedSection",sv(r.sec));
    if(r.sec==="OTH") oPut(o,"AnyOtherSection",sv(r.otherSec));
    oPut(o,"AuditFlag",sv(r.flag));
    oPut(o,"DateOfAudit",ISO(r.date));
    if(r.ack) oPut(o,"AckNumOth",R(r.ack));
    return o;}));
  putArr("PartA_GEN2For6.AuditReportDetails",(A.act||[]).map(r=>{const o={};
    oPut(o,"AuditReportAct",sv(r.act));
    if(r.act==="19") oPut(o,"AuditReportActOthers",sv(r.actOther));
    oPut(o,"AuditReportSection",sv(r.sec));
    oPut(o,"OtherITActFlag",sv(r.othFlag));
    oPut(o,"AuditReportDate",ISO(r.date));
    return o;}));

  /* ---- holding status ---- */
  put(j,"PartA_GEN2For6.HoldingStatus.NatOfCompFlg",sv(H.natFlg));
  const compRow=r=>{const cd={};
    oPut(cd,"CompName",sv(r.name));
    oPut(cd,"CompPAN",UP(r.pan));
    const a=addr(r); if(Object.keys(a).length) cd.AddressDetailWithZipCode=a;
    const p=pctVal(r.pct); if(p!==undefined) cd.CompSharePercent=p;
    return {CompDetails:cd};};
  putArr("PartA_GEN2For6.HoldingStatus.HoldingCompDetail",(H.holding||[]).map(compRow));
  putArr("PartA_GEN2For6.HoldingStatus.SubsidiaryCompDetail",(H.subsid||[]).map(compRow));

  /* ---- business organisation ---- */
  putArr("PartA_GEN2For6.BusOrganisation",(S.gen.busorg||[]).map(r=>{const o={};
    oPut(o,"BusOrgType",sv(r.type));
    oPut(o,"CompName",sv(r.name));
    const a=addr(r); if(Object.keys(a).length) o.AddressDetailWithZipCode=a;
    oPut(o,"BusOrgPAN",UP(r.pan));
    oPut(o,"DateOfBusinessOrg",ISO(r.date));
    return o;}));

  /* ---- key persons ---- */
  putArr("PartA_GEN2For6.KeyPersons",(S.gen.keyp||[]).map(r=>{const o={};
    oPut(o,"PersonName",sv(r.name));
    oPut(o,"Designation",sv(r.desig));
    const a=addr(r); if(Object.keys(a).length) o.AddressDetailWithZipCode=a;
    oPut(o,"KeyPerPAN",UP(r.pan));
    oPut(o,"KeyPersnAadhaar",sv(r.aadhaar));
    oPut(o,"DirectorIdNo",sv(r.din));
    return o;}));

  /* ---- shareholders (10%+) ---- */
  putArr("PartA_GEN2For6.ShareHolderInfo",(S.gen.shr||[]).map(r=>{const o={};
    oPut(o,"ShareHolderInfoName",sv(r.name));
    const p=pctVal(r.pct); if(p!==undefined) o.PercentageOfShare=p;
    const a=addr(r); if(Object.keys(a).length) o.AddressDetailWithZipCode=a;
    oPut(o,"ShareHolderPAN",UP(r.pan));
    oPut(o,"ShareHolderAadhaar",sv(r.aadhaar));
    return o;}));

  /* ---- ownership (ultimate beneficial owners) ---- */
  putArr("PartA_GEN2For6.OwnershipInfo",(S.gen.own||[]).map(r=>{const o={};
    oPut(o,"OwnerName",sv(r.name));
    const p=pctVal(r.pct); if(p!==undefined) o.PercentageOfShare=p;
    const a=addr(r); if(Object.keys(a).length) o.AddressDetailWithZipCode=a;
    oPut(o,"OwnerPAN",UP(r.pan));
    oPut(o,"OwnerAadhaar",sv(r.aadhaar));
    return o;}));

  /* ---- foreign-company parents ---- */
  const frnRow=r=>{const o={};
    oPut(o,"Name",sv(r.name));
    const a=addr(r); if(Object.keys(a).length) o.AddressDetailWithZipCode=a;
    oPut(o,"CountryOfResidence",sv(r.cor));
    oPut(o,"PAN",UP(r.pan));
    oPut(o,"TaxpayerRegNumber",sv(r.trn));
    return o;};
  putArr("PartA_GEN2For6.FrnCompImmediatePrntCompDtls",(S.gen.frnImm||[]).map(frnRow));
  putArr("PartA_GEN2For6.FrnCompUltimatePrntCompDtls",(S.gen.frnUlt||[]).map(frnRow));

  /* ---- nature of company (eight required flags) ---- */
  put(j,"PartA_GEN2For6.NatureOfComp.PubSectCompUs2_36AFlg",sv(NC.pubSect||"N"));
  put(j,"PartA_GEN2For6.NatureOfComp.RBICompFlg",sv(NC.rbi||"N"));
  put(j,"PartA_GEN2For6.NatureOfComp.CompLes40PercSharGovRBIFlg",sv(NC.gov40||"N"));
  put(j,"PartA_GEN2For6.NatureOfComp.BankCompUs5Flg",sv(NC.bank||"N"));
  put(j,"PartA_GEN2For6.NatureOfComp.SchedBankOfRBIActFlg",sv(NC.schedBank||"N"));
  put(j,"PartA_GEN2For6.NatureOfComp.CompWithIRDARegisterFlg",sv(NC.irda||"N"));
  put(j,"PartA_GEN2For6.NatureOfComp.NonBankFIICompFlg",sv(NC.nbfi||"N"));
  put(j,"PartA_GEN2For6.NatureOfComp.CompanyUnlistedFlag",sv(NC.unlisted||"N"));

  /* ---- nature of business codes ---- */
  putArr("PartA_GEN2For6.NatOfBus.NatureOfBusiness",(S.gen.nob||[]).map(r=>{const o={};
    oPut(o,"Code",sv(r.code));
    oPut(o,"TradeName1",sv(r.trade));
    oPut(o,"Description",sv(r.desc));
    return o;}));

}

/* =====================================================================
   IMPORT — impGen(I6): read PartA_GEN2For6 back into S.gen. Inverse of the
   export, so buildReturn -> importReturn -> buildReturn is identity.
   ===================================================================== */
function impGen(I6){
  const read=[];
  const G=(I6&&I6.PartA_GEN2For6)||{};
  if(!Object.keys(G).length) return read;
  S.gen=S.gen||{}; const A=S.gen.aud=S.gen.aud||{}, H=S.gen.hold=S.gen.hold||{}, NC=S.gen.nat=S.gen.nat||{};
  const inAddr=x=>{x=x||{};return {addr:x.AddrDetail,city:x.CityOrTownOrDistrict,state:x.StateCode,
    country:x.CountryCode,pin:x.PinCode!=null?String(x.PinCode):"",zip:x.ZipCode||""};};

  /* audit */
  if(G.LiableSec44AAflg!=null)A.sec44AA=G.LiableSec44AAflg;
  if(G.IncDclrdUs!=null)A.incDclrdUs=G.IncDclrdUs;
  if(G.TotalSalesExcOneCr!=null)A.salesBand=G.TotalSalesExcOneCr;
  if(G.AgrOFAllAmtsRcvd!=null)A.pctRcvd=G.AgrOFAllAmtsRcvd;
  if(G.AgrOFAllPayMade!=null)A.pctPaid=G.AgrOFAllPayMade;
  if(G.LiableSec44ABflg!=null)A.sec44AB=G.LiableSec44ABflg;
  if(G.AuditedByAccountantFlg!=null)A.acctFlg=G.AuditedByAccountantFlg;
  if(G.AuditInfo){const AI=G.AuditInfo;
    if(AI.AuditReportFurnishDate)A.repDate=dmy(AI.AuditReportFurnishDate);
    if(AI.AckNum44AB!=null)A.repAck=String(AI.AckNum44AB);
    if(AI.AudFrmName!=null)A.frmName=AI.AudFrmName;
    if(AI.AudFrmPAN!=null)A.frmPAN=AI.AudFrmPAN;}
  if(G.LiableSec92Eflg!=null)A.sec92E=G.LiableSec92Eflg;
  if(G.AccountAuditFlag!=null)A.acct92E=G.AccountAuditFlag;
  if(G.AuditDetails92E){if(G.AuditDetails92E.DateOfAudit)A.date92E=dmy(G.AuditDetails92E.DateOfAudit);
    if(G.AuditDetails92E.AckNum92E!=null)A.ack92E=String(G.AuditDetails92E.AckNum92E);}
  if(Array.isArray(G.AuditDetails))A.oth=G.AuditDetails.map(r=>({sec:r.AuditedSection,otherSec:r.AnyOtherSection,
    flag:r.AuditFlag,date:dmy(r.DateOfAudit),ack:r.AckNumOth!=null?String(r.AckNumOth):""}));
  if(Array.isArray(G.AuditReportDetails))A.act=G.AuditReportDetails.map(r=>({act:r.AuditReportAct,
    actOther:r.AuditReportActOthers,sec:r.AuditReportSection,othFlag:r.OtherITActFlag,date:dmy(r.AuditReportDate)}));
  read.push("audit information");

  /* holding status */
  if(G.HoldingStatus){const HS=G.HoldingStatus;
    if(HS.NatOfCompFlg!=null)H.natFlg=HS.NatOfCompFlg;
    const rc=x=>{const cd=(x&&x.CompDetails)||{};const a=inAddr(cd.AddressDetailWithZipCode);
      return Object.assign({name:cd.CompName,pan:cd.CompPAN,pct:cd.CompSharePercent},a);};
    if(Array.isArray(HS.HoldingCompDetail))H.holding=HS.HoldingCompDetail.map(rc);
    if(Array.isArray(HS.SubsidiaryCompDetail))H.subsid=HS.SubsidiaryCompDetail.map(rc);
  }

  /* business organisation */
  if(Array.isArray(G.BusOrganisation))S.gen.busorg=G.BusOrganisation.map(r=>Object.assign(
    {type:r.BusOrgType,name:r.CompName,pan:r.BusOrgPAN,date:dmy(r.DateOfBusinessOrg)},inAddr(r.AddressDetailWithZipCode)));
  /* key persons */
  if(Array.isArray(G.KeyPersons))S.gen.keyp=G.KeyPersons.map(r=>Object.assign(
    {name:r.PersonName,desig:r.Designation,pan:r.KeyPerPAN,aadhaar:r.KeyPersnAadhaar,din:r.DirectorIdNo},inAddr(r.AddressDetailWithZipCode)));
  /* shareholders */
  if(Array.isArray(G.ShareHolderInfo))S.gen.shr=G.ShareHolderInfo.map(r=>Object.assign(
    {name:r.ShareHolderInfoName,pct:r.PercentageOfShare,pan:r.ShareHolderPAN,aadhaar:r.ShareHolderAadhaar},inAddr(r.AddressDetailWithZipCode)));
  /* ownership */
  if(Array.isArray(G.OwnershipInfo))S.gen.own=G.OwnershipInfo.map(r=>Object.assign(
    {name:r.OwnerName,pct:r.PercentageOfShare,pan:r.OwnerPAN,aadhaar:r.OwnerAadhaar},inAddr(r.AddressDetailWithZipCode)));
  /* foreign parents */
  const frn=r=>Object.assign({name:r.Name,cor:r.CountryOfResidence,pan:r.PAN,trn:r.TaxpayerRegNumber},inAddr(r.AddressDetailWithZipCode));
  if(Array.isArray(G.FrnCompImmediatePrntCompDtls))S.gen.frnImm=G.FrnCompImmediatePrntCompDtls.map(frn);
  if(Array.isArray(G.FrnCompUltimatePrntCompDtls))S.gen.frnUlt=G.FrnCompUltimatePrntCompDtls.map(frn);

  /* nature of company */
  if(G.NatureOfComp){const N2=G.NatureOfComp;
    if(N2.PubSectCompUs2_36AFlg!=null)NC.pubSect=N2.PubSectCompUs2_36AFlg;
    if(N2.RBICompFlg!=null)NC.rbi=N2.RBICompFlg;
    if(N2.CompLes40PercSharGovRBIFlg!=null)NC.gov40=N2.CompLes40PercSharGovRBIFlg;
    if(N2.BankCompUs5Flg!=null)NC.bank=N2.BankCompUs5Flg;
    if(N2.SchedBankOfRBIActFlg!=null)NC.schedBank=N2.SchedBankOfRBIActFlg;
    if(N2.CompWithIRDARegisterFlg!=null)NC.irda=N2.CompWithIRDARegisterFlg;
    if(N2.NonBankFIICompFlg!=null)NC.nbfi=N2.NonBankFIICompFlg;
    if(N2.CompanyUnlistedFlag!=null)NC.unlisted=N2.CompanyUnlistedFlag;
    read.push("nature of company");
  }
  /* nature of business */
  if(G.NatOfBus&&Array.isArray(G.NatOfBus.NatureOfBusiness)){
    S.gen.nob=G.NatOfBus.NatureOfBusiness.map(r=>({code:r.Code,trade:r.TradeName1,desc:r.Description}));
    read.push("nature of business");
  }
  return read;
}

/* =====================================================================
   CHECKS — chkGen(): this section's own screen validations (err/warn).
   Department rules (A8/A23-A29/A33-A36 etc.) are Phase 6.
   ===================================================================== */
function chkGen(){
  const out=[]; const A=S.gen.aud||{}, H=S.gen.hold||{}, C=S.C.gen||{};
  const isPAN=v=>PAN_RE.test(st0(v).toUpperCase());

  /* holding-status flag is required */
  if(!st0(H.natFlg))
    out.push({lvl:"err",t:"Holding status required",m:"Select the nature of company (holding / subsidiary status).",sec:"gen"});

  /* 44AB auditor particulars */
  if(A.sec44AB==="Y"&&A.acctFlg==="Y"){
    if(!st0(A.repDate)||!D(A.repDate))
      out.push({lvl:"err",t:"Audit report date required",m:"Enter the date of furnishing of the section 44AB audit report (DD/MM/YYYY).",sec:"gen"});
    else if(D(A.repDate)>new Date())
      out.push({lvl:"err",t:"Audit report date",m:"The date of furnishing the audit report cannot be after today.",sec:"gen"});
    if(st0(A.frmPAN)&&!isPAN(A.frmPAN))
      out.push({lvl:"err",t:"Auditor PAN not valid",m:"The auditor's PAN must be five letters, four digits and a letter.",sec:"gen"});
    else if(!st0(A.frmPAN))
      out.push({lvl:"warn",t:"Auditor PAN",m:"The auditor's PAN is required when accounts are audited u/s 44AB.",sec:"gen"});
  }
  /* advisory 44AB liability from turnover + cash %s */
  if(C.auto44AB&&A.sec44AB!=="Y")
    out.push({lvl:"warn",t:"Section 44AB may apply",m:"The turnover band and cash percentages point to a tax-audit liability u/s 44AB (A27/A28/A29/A36).",sec:"gen"});

  /* 92E audit date when audited */
  if(A.sec92E==="Y"&&A.acct92E==="Y"&&(!st0(A.date92E)||!D(A.date92E)))
    out.push({lvl:"err",t:"92E audit date required",m:"Enter the date of furnishing of the section 92E audit report.",sec:"gen"});

  /* other-Act audit rows: Act + section code required per row */
  (A.act||[]).forEach((r,i)=>{
    if(st0(r.act)&&!st0(r.sec))
      out.push({lvl:"warn",t:"Other-Act audit — section",m:"Row "+(i+1)+": enter the section code for the selected Act.",sec:"gen"});
    if(r.act==="19"&&!st0(r.actOther))
      out.push({lvl:"warn",t:"Other-Act audit — description",m:"Row "+(i+1)+": describe the Act when 'Others' is selected.",sec:"gen"});
  });

  /* foreign-parent rows require country of residence + registration no. */
  const frnChk=(arr,label)=>{(arr||[]).forEach((r,i)=>{
    if(st0(r.name)){
      if(!st0(r.cor)) out.push({lvl:"warn",t:label+" parent — country",m:"Row "+(i+1)+": select the country of residence.",sec:"gen"});
      if(!st0(r.trn)) out.push({lvl:"warn",t:label+" parent — registration",m:"Row "+(i+1)+": enter the taxpayer / unique identification number.",sec:"gen"});
    }});};
  frnChk(S.gen.frnImm,"Immediate"); frnChk(S.gen.frnUlt,"Ultimate");

  /* share-percentage tables 0-100 */
  const pctChk=(arr,label)=>{(arr||[]).forEach((r,i)=>{
    const p=N(r.pct); if(r.pct!==""&&r.pct!=null&&(p<0||p>100))
      out.push({lvl:"warn",t:label+" percentage",m:"Row "+(i+1)+": percentage of shares must be between 0 and 100.",sec:"gen"});
  });};
  pctChk(S.gen.shr,"Shareholder"); pctChk(S.gen.own,"Ownership");

  /* at least one nature-of-business code (or at Point-61 of Sch P&L) */
  if(!(S.gen.nob||[]).some(r=>st0(r.code)))
    out.push({lvl:"warn",t:"Nature of business",m:"At least one business code is required here or at Point-61 of Schedule P&L.",sec:"gen"});

  if(!out.some(x=>x.lvl==="err"))
    out.push({lvl:"ok",t:"Company particulars",m:(S.gen.nob||[]).length+" business code(s)"+(A.sec44AB==="Y"?" · audit u/s 44AB":"")+(A.sec92E==="Y"?" · 92E":"")+".",sec:"gen"});
  return out;
}

   Built from books/ITR-6/HOUSE_PROPERTY.md only (rows 3–76, rules
   A175–A194/A198/A503/A526/A704/A750, schema ScheduleHP §12).
   Structured on forms/ITR-3/src/70_sec_hp.js (shell idiom / engine /
   screen / export / import / checks pattern) — but every field, formula,
   enum and item-number is taken from the ITR-6 book, never from ITR-3.

   (book §§ intro, 8, 9):

       no minor / spouse / others, no "specify" field.
     • Type of house property = Let Out (Y) / Deemed Let Out (D) ONLY —

/* ---- 115BAB regime detector -------------------------------------------
   The utility drives the 24(a)/24(b) bar off the chosen concessional
   section (P22 = MID(sheet1.ReturnFileSec,1,6) == "115BAB"). The canonical
   schema source is PartA_GEN1.FilingStatus.Section115BA (opted earlier) /
   Section115CurrAY (opting this year) == "115BAB", surfaced on the Tax
   sheet as Check_115BA. The "who" (Part A-General) and "tax" builders own
   those fields and are built in parallel, so this read is guarded across
   the likely publish points and defaults to FALSE (the full working) when
   the flag is absent. Integrator seam: point this at whatever canonical
   flag the who/tax engines publish (see report). */
function hpBAB(){
  try{
    var C = S.C || {};
    if(C.opt115==="115BAB" || C.regimeSec==="115BAB") return true;
    if(C.tax && (C.tax.sec115==="115BAB" || C.tax.check115BA==="115BAB" || C.tax.concSec==="115BAB")) return true;
    if(C.who && (C.who.sec115==="115BAB" || C.who.concSec==="115BAB")) return true;
    var w = S.who || {};
    if(st0(w.sec115)==="115BAB" || st0(w.sec115CurrAY)==="115BAB" ||
       st0(w.concSec)==="115BAB" || st0(w.optSec)==="115BAB") return true;
    var f = S.fs || {};
    if(st0(f.sec115)==="115BAB" || st0(f.conc)==="115BAB") return true;
  }catch(e){}
  return false;
}

/* ---- engine ------------------------------------------------------ */
/* One property block a–k, exactly as the book's cell formulas read (§2).
   `bab` = the company has opted 115BAB → 24(a) (g) and 24(b) (h) disallowed. */
function engProp(p, bab){
  p = p || {};
  const co = p.co==="YES";
  const coShare = (p.coowners||[]).reduce((s,x)=>s+N(x.share), 0);
  /* assessee's share I7 (computed, not typed):
     = IF(co="Y", 100 − Σ co-owners' shares, IF(co="N", 100, 0))  (book §2) */
  let share;
  if(co)              share = Math.max(0, R(100 - coShare));
  else if(p.co==="NO") share = 100;
  else                 share = 0;

  const a = R(p.rent);                            /* 1a AnnualLetableValue — typed gross (full) */
  const b = R(p.unreal);                          /* 1b RentNotRealized — typed */
  const c = R(p.taxes);                           /* 1c LocalTaxes — typed */
  const d = R(b + c);                             /* 1d TotalUnrealizedAndTax [J21]=SUM(J19:J20) */
  const e = Math.max(0, R(a - d));                /* 1e BalanceALV [L22]=MAX(0,L18−J21) */
  const f = Math.max(0, R((share/100) * e));      /* 1f AnnualOfPropOwned [L23]=MAX(0,ROUND(L22×I7/100,0)) */
  /* 1g ThirtyPercentOfBalance [J24]=MAX(ROUND(0.3×1f,0),0) — 24(a); 0 under 115BAB (A187) */
  const g = bab ? 0 : Math.max(0, R(0.30 * f));

  /* 1h IntOnBorwCap [J25]=MAX(0, IF(AND(share>0, 1a>0), Σ24(b) interest, 0)) — A178;
     0 under 115BAB (A188). TotalInterestUs24B (K33)=Σ rows (A191), disclosed as hRaw. */
  const loans = (p.loans||[]).filter(l => N(l.interest));
  const hRaw  = R(loans.reduce((s,l)=>s+N(l.interest), 0));   /* Section24B.TotalInterestUs24B */
  const guard = share > 0 && a > 0;
  let h = 0, barredBAB = false, barredGuard = false;
  if(bab){ h = 0; if(hRaw>0) barredBAB = true; }              /* 115BAB — interest disallowed */
  else if(guard){ h = hRaw; }
  else { h = 0; if(hRaw>0) barredGuard = true; }              /* share 0 or ALV nil — interest not admissible */

  const i = R(g + h);                             /* 1i TotalDeduct [L34]=SUM(J24:J25) */
  const j = R(p.arrears);                         /* 1j ArrearsUnrealizedRentRcvd — typed net of 30% */
  const k = R(f - i + j);                         /* 1k IncomeOfHP [L36]=L23−L34+L35 (signed) */

  return {co, coShare, share, a, b, c, d, e, f, g, hRaw, h, guard, barredBAB, barredGuard,
          i, j, k, nLoans:loans.length};
}

function engHp(){
  const H   = S.hp || {};
  const bab = hpBAB();
  const C = S.C.hp = { income:0, on:!!H.on, rows:[], sum1k:0, pti:0, ptiFromSch:false,
                       bab:bab, cyla2i:0, cflExcess:0, partBTI1:0, barred:0 };
  if(!H.on) return;

  const rows  = (H.props||[]).map((p,idx)=>{ const r=engProp(p,bab); p._=r; p._i=idx; return r; });
  const sum1k = R(rows.reduce((s,r)=>s+r.k, 0));           /* Σ1k */

  /* item 2 — Pass through income/loss from Schedule PTI (A186). The "other"
     section computes S.C.other.pti (screen order after HP); guarded read —
     falls back to the manual figure H.pti until that engine has run. */
  const oth = S.C.other || {};
  const ptiFromSch = (oth.pti||[]).reduce((s,x)=>s+N((x.hp||{}).net), 0);
  const usedSch = Math.abs(ptiFromSch) > 0;
  const pti = R(usedSch ? ptiFromSch : N(H.pti));          /* PassThroghIncome */

  const income = R(sum1k + pti);                           /* item 3 = Σ1k + 2 = TotalIncomeChargeableUnHP */

  C.rows = rows;
  C.sum1k = sum1k;
  C.pti = pti;
  C.ptiFromSch = usedSch;
  C.income = income;                                       /* signed head total for CYLA/PartB-TI/FSI roll-up */

  /* helper P-column — s.71(3A) ₹2,00,000 loss cap (book §3) */
  C.cyla2i    = income < 0 ? Math.max(income, -200000) : 0;   /* P70 → 2i of Schedule CYLA (signed, ≤0) */
  C.cflExcess = Math.max(0, R(-income - 200000));            /* P71 → Schedule CFL (positive) */
  C.partBTI1  = Math.max(0, income);                        /* Part B-TI item 1 = MAX(0, income) (A750) */
  C.barred    = R(rows.reduce((s,r)=>s+(r.barredBAB?r.hRaw:0), 0));
}

/* ---- renderer ---------------------------------------------------- */
function hpBlock(p, i, ordinal, bab){
  const r = p._ || engProp(p, bab);
  const pre = "hp.props."+i+".", id = "hp"+i;
  const typeLbl = (HP_TYPE.find(t=>t[0]===p.type)||["","—"])[1];
  const status = (st0(p.addr)?typeLbl+" · ":"") + (r.k<0?"loss "+RS(-r.k):RS(r.k));
  let b = "";

  /* --- the property --- */
  b += sub("The property");
  b += row("Address of property", inp(pre+"addr",{max:200}), {req:1, ref:"F4", hint:"NOTE: do not leave the address blank"});
  b += row("Town / City", inp(pre+"city",{max:50}), {req:1, ref:"G4"});
  b += row("Country", sel(pre+"country", HP_COUNTRY), {req:1, ref:"I4"});
  if((p.country||"91")==="91"){
    b += row("State", sel(pre+"state", HP_STATE), {req:1, ref:"H4"});
    b += row("PIN Code", inp(pre+"pin",{max:6}), {req:1, ref:"J4", hint:"100000–999999"});
  } else {
    b += row("State", sel(pre+"state", [["99","Foreign"]], {blank:false}), {req:1, ref:"H4"});
    b += row("Zip Code", inp(pre+"zip",{max:8}), {ref:"K4", hint:"for property abroad"});
  }

  /* --- ownership (Self / Deemed Owner only) --- */
  b += sub("Ownership");
  b += row("Owner of the Property", sel(pre+"owner", HP_OWNER), {req:1, ref:"F6",
           hint:"a company can own only as itself or as a deemed owner"});
  b += row("Is the property co-owned?", sel(pre+"co", HP_COOWN, {blank:false}), {req:1, ref:"I6"});
  b += row("Assessee's percentage of share in the property (%)", cell(r.share),
           {ref:"I7", cls:"tot",
            hint:p.co==="YES"?"computed = 100 − co-owners' shares":"not co-owned — 100%"});
  if(p.co==="YES"){
    b += grid(pre.slice(0,-1)+".coowners",[
        {k:"name",h:"Name of other co-owner(s)",t:"txt",w:"auto",req:1,max:125},
        {k:"pan",h:"PAN of other co-owner(s)",t:"txt",w:"120px",max:10},
        {k:"aadhaar",h:"Aadhaar of other co-owner(s)",t:"txt",w:"140px",max:12},
        {k:"share",h:"Percentage share of co-owner(s) %",t:"num",w:"160px"}],
      p.coowners||[], {min:"760px", empty:"No co-owner listed.", add:"Add a co-owner",
        foot:[{l:1,v:"Shares — yours "+r.share+"% + co-owners "+r.coShare+"%",span:3},{v:r.share+r.coShare}]});
    if(Math.abs(r.share+r.coShare-100)>0.01)
      b += note("The assessee's share + co-owners' shares add to "+(r.share+r.coShare)+"%, not 100%.","warn");
  }

  /* --- type (Let Out / Deemed Let Out only) --- */
  b += sub("Type of house property");
  b += row("Type of House property", sel(pre+"type", HP_TYPE), {req:1, ref:"F15",
           hint:"a company has no self-occupied house — Let Out or Deemed Let Out only"});
  b += grid(pre.slice(0,-1)+".tenants",[
      {k:"name",h:"Name(s) of Tenant(s) (if let out)",t:"txt",w:"auto",max:125},
      {k:"pan",h:"PAN of Tenant(s) (if available)",t:"txt",w:"120px",max:10},
      {k:"aadhaar",h:"Aadhaar of Tenant(s) (if available)",t:"txt",w:"140px",max:12},
      {k:"pantan",h:"PAN / TAN of Tenant(s) (if TDS credit is claimed)",t:"txt",w:"220px",max:10}],
    p.tenants||[], {min:"880px", empty:"No tenant listed.", add:"Add a tenant"});
  b += note("Furnishing PAN/Aadhaar of the tenant is mandatory if tax is deducted u/s 194-IB; "+
    "furnishing the TAN of the tenant is mandatory if tax is deducted u/s 194-I (sheet note, row 76).");

  /* --- the working a–k (always full — no self-occupied branch) --- */
  b += sub("Computation of income from the property");
  b += row("a · Gross rent received or receivable or lettable value", inp(pre+"rent",{n:1}),
           {req:1, ref:"1a", hint:"in full — a let-out / deemed let-out property cannot have nil rent; your share is applied at f"});
  b += row("b · The amount of rent which cannot be realized", inp(pre+"unreal",{n:1}), {ref:"1b", hint:"cannot exceed 1a"});
  b += row("c · Tax paid to local authorities", inp(pre+"taxes",{n:1}), {ref:"1c"});
  b += row("d · Total (1b + 1c)", cell(r.d), {ref:"1d", cls:"tot"});
  b += row("e · Annual value (1a − 1d)", cell(r.e), {ref:"1e", cls:"tot"});
  b += row("f · Annual value of the property owned (own share × 1e)", cell(r.f),
           {ref:"1f", cls:"tot", hint:r.share<100?r.share+"% of "+RS(r.e):""});
  if(bab){
    b += note("Section 115BAB — the company has opted for the manufacturing concessional rate, so the "+
      "30% standard deduction u/s 24(a) (1g) and the interest u/s 24(b) (1h) are both disallowed "+
      "(rules A187 / A188).","stop");
    b += row("g · 30% of 1f", cell(0), {ref:"1g", cls:"tot", hint:"disallowed u/s 115BAB (24a)"});
  } else {
    b += row("g · 30% of 1f", cell(r.g), {ref:"1g", cls:"tot"});
  }

  /* --- 24(b) loan table (inside the block) --- */
  b += sub("h · Interest payable on borrowed capital — Section 24(b)");
  b += note("One row per loan; every column is required on a filled row. The interest sums into "+
    "Total Interest u/s 24(b) and, unless disallowed, into item h. Interest is admitted only when the "+
    "assessee's share > 0 and the annual value (1a) > 0.");
  b += grid(pre.slice(0,-1)+".loans",[
      {k:"from",h:"Loan taken from",t:"sel",w:"170px",req:1,opts:HP_LOANFROM},
      {k:"name",h:"Name of the bank / institution / person",t:"txt",w:"auto",req:1,max:125},
      {k:"acno",h:"Loan Account number of the Bank / Institution",t:"txt",w:"200px",req:1,max:25},
      {k:"dt",h:"Date of sanction of loan",t:"date",w:"150px",req:1},
      {k:"amt",h:"Total amount of loan",t:"num",w:"150px",req:1},
      {k:"os",h:"Loan outstanding as on 31-03-2026",t:"num",w:"180px",req:1},
      {k:"interest",h:"Interest on Borrowed capital u/s 24(b)",t:"num",w:"180px",req:1}],
    p.loans||[], {min:"1360px", empty:"No loan.", add:"Add a loan",
      foot:[{l:1,v:"Total Interest on borrowed capital u/s 24(b)",span:6},{v:r.hRaw}]});
  let hHint = "";
  if(bab) hHint = "disallowed u/s 115BAB (24b)";
  else if(!r.guard && r.hRaw>0) hHint = "not admissible — share is nil or the annual value (1a) is nil";
  b += row("h · Interest payable on borrowed capital", cell(r.h), {ref:"1h", cls:"tot", hint:hHint});

  b += row("i · Total (1g + 1h)", cell(r.i), {ref:"1i", cls:"tot"});
  b += row("j · Arrears / Unrealized Rent received during the year, less 30%", inp(pre+"arrears",{n:1}),
           {ref:"1j", hint:"enter the amount already net of the 30% deduction"});
  b += row("k · Income from house property "+ordinal+" (1f − 1i + 1j)", cell(r.k), {ref:"1k", cls:"grand"});

  return blk(id, "Property "+ordinal+(st0(p.addr)?" — "+st0(p.addr):""), status, b, "hp.props."+i);
}

function secHp(){
  const C = S.C.hp || {};
  const bab = C.bab;
  let h = "";
  h += row("Is there income or a loss from house property?",
           sel("hp.on",[["","No"],["1","Yes"]],{blank:false}), {req:1, ref:"Schedule HP"});
  if(!S.hp.on) return h;

  h += note("One block per property, unlimited. Type is Let Out or Deemed Let Out only — a company has no "+
    "self-occupied house, so the full a–k working always runs and the gross rent (1a) must be more than nil. "+
    "The Section 24(b) loan table sits inside each block and sums into item h. Rent, unrealised rent and "+
    "local taxes are entered in full for the property; the assessee's share is applied once, at item f, and "+
    "is computed as 100 − the co-owners' shares.");
  if(bab)
    h += note("The company has opted for taxation u/s 115BAB — for every property the 30% standard deduction "+
      "(24a) and the interest on borrowed capital (24b) are disallowed (rules A187 / A188).","warn");

  (S.hp.props||[]).forEach((p,i)=>h += hpBlock(p, i, i+1, bab));
  h += '<button class="add" data-addprop="1">Add a property</button>';

  h += sub("Across all properties");
  h += row("Σ1k · Income from all properties", cell(C.sum1k), {cls:"tot"});
  if(C.ptiFromSch)
    h += row("2 · Pass through income / Loss — from Schedule PTI", cell(C.pti),
             {ref:"2", hint:"the house-property row(s) of Schedule PTI"});
  else
    h += row("2 · Pass through income / Loss (if any)", inp("hp.pti",{n:1}),
             {ref:"2", hint:"from Schedule PTI — leave blank if none"});
  h += row('3 · Income under the head "Income from house property" (Ʃ1K + 2)', cell(C.income),
           {ref:"3", cls:"grand",
            hint:C.income<0?"a loss — to 2i of Schedule CYLA, the set-off capped at ₹2,00,000 (s.71(3A)); the excess carries to CFL":""});
  if(C.income<0){
    h += row("Loss allowed to be set off this year (capped at ₹2,00,000) → CYLA 2i", cell(C.cyla2i), {cls:"tot"});
    if(C.cflExcess>0)
      h += row("Loss carried forward under Schedule CFL (excess beyond ₹2,00,000)", cell(-C.cflExcess), {cls:"tot"});
  }
  return h;
}

/* ---- export ------------------------------------------------------ */
function expHp(j){
  const C = S.C.hp || {};
  if(!(S.hp && S.hp.on && (S.hp.props||[]).length)) return;
  const bab = C.bab;

  const items = (S.hp.props||[]).map((p,i)=>{
    const r = p._ || engProp(p, bab);
    const ad = {
      AddrDetail:(sv(p.addr)||"NA").slice(0,200),
      CityOrTownOrDistrict:(sv(p.city)||"NA").slice(0,50),
      StateCode:(p.country||"91")==="91" ? (HP_STATE_SET[st0(p.state)]?st0(p.state):"19") : "99",
      CountryCode:(st0(p.country)||"91").slice(0,4)
    };
    if((p.country||"91")==="91"){ if(/^[1-9]\d{5}$/.test(st0(p.pin))) ad.PinCode=parseInt(p.pin,10); }
    else if(sv(p.zip)) ad.ZipCode=sv(p.zip).slice(0,8);

    /* Rentdetails — every leaf is schema-required (book §7/§12); write all,
       even zero (direct object literal, not put(), so 0 is retained). */
    const rd = {
      AnnualLetableValue:n0(r.a),               /* 1a */
      RentNotRealized:n0(r.b),                  /* 1b */
      LocalTaxes:n0(r.c),                       /* 1c */
      TotalUnrealizedAndTax:n0(r.d),            /* 1d */
      BalanceALV:n0(r.e),                       /* 1e */
      AnnualOfPropOwned:n0(r.f),                /* 1f */
      ThirtyPercentOfBalance:n0(r.g),           /* 1g */
      IntOnBorwCap:n0(r.h),                     /* 1h */
      TotalDeduct:n0(r.i),                      /* 1i */
      ArrearsUnrealizedRentRcvd:n0(r.j),        /* 1j (typed net of 30%) */
      IncomeOfHP:sg(r.k)                        /* 1k (signed) */
    };

    const ln = (p.loans||[]).filter(l=>N(l.interest));
    if(ln.length){
      rd.Section24B = {
        Section24BDtls: ln.map(l=>({
          LoanTknFrom:l.from==="I"?"I":"B",
          BankOrInstnName:(sv(l.name)||"NA").slice(0,125),
          LoanAccNoOfBankOrInstnRefNo:(sv(l.acno)||"NA").slice(0,25),
          DateofLoan:ISO(l.dt)||"2025-04-01",
          TotalLoanAmt:n0(l.amt),
          LoanOutstndngAmt:n0(l.os),
          InterestUs24B:n0(l.interest)
        })),
        TotalInterestUs24B:n0(r.hRaw)             /* K33 = Σ rows (A191) */
      };
    }

    const it = {
      HPSNo:i+1,
      AddressDetailWithZipCode:ad,
      PropertyOwner:(p.owner==="DO"?"DO":"SE"),
      PropCoOwnedFlg:(p.co==="YES"?"YES":"NO"),
      AssessePercentShareProp:r.share,            /* computed I7 (required) */
      ifLetOut:(p.type==="D"?"D":"Y"),            /* Y/D only; coerce anything else to Y */
      Rentdetails:rd
    };

    const co = (p.coowners||[]).filter(x=>st0(x.name));
    if(co.length) it.CoOwners=co.map((x,k)=>{
      const c={CoOwnersSNo:k+1, NameCoOwner:st0(x.name).slice(0,125)};
      if(PAN_RE.test(st0(x.pan).toUpperCase())) c.PAN_CoOwner=st0(x.pan).toUpperCase();
      if(AADH.test(st0(x.aadhaar))) c.Aadhaar_CoOwner=st0(x.aadhaar);
      if(N(x.share)) c.PercentShareProperty=N(x.share);
      return c;
    });
    const tn = (p.tenants||[]).filter(x=>st0(x.name));
    if(tn.length) it.TenantDetails=tn.map((x,k)=>{
      const t={TenantSNo:k+1, NameofTenant:st0(x.name).slice(0,125)};
      if(PAN_RE.test(st0(x.pan).toUpperCase())) t.PANofTenant=st0(x.pan).toUpperCase();
      if(AADH.test(st0(x.aadhaar))) t.AadhaarofTenant=st0(x.aadhaar);
      if(sv(x.pantan)) t.PANTANofTenant=st0(x.pantan).toUpperCase().slice(0,10);
      return t;
    });
    return it;
  });

  j.ScheduleHP = { PropertyDetails:items, TotalIncomeChargeableUnHP:sg(C.income) };
  if(C.pti) j.ScheduleHP.PassThroghIncome=sg(C.pti);
}

/* ---- import ------------------------------------------------------ */
function impHp(I6){

      return {

        state:ad.StateCode||"", country:ad.CountryCode||"91",
        pin:ad.PinCode!=null?String(ad.PinCode):"", zip:ad.ZipCode||"",
        owner:p.PropertyOwner==="DO"?"DO":"SE",
        co:p.PropCoOwnedFlg==="YES"?"YES":"NO",
        share:nz(p.AssessePercentShareProp),          /* recomputed by the engine on paint */
        coowners:(p.CoOwners||[]).map(c=>({name:c.NameCoOwner||"", pan:c.PAN_CoOwner||"",
          aadhaar:c.Aadhaar_CoOwner||"", share:nz(c.PercentShareProperty)})),
        type:p.ifLetOut==="D"?"D":"Y",
        tenants:(p.TenantDetails||[]).map(t=>({name:t.NameofTenant||"", pan:t.PANofTenant||"",
          aadhaar:t.AadhaarofTenant||"", pantan:t.PANTANofTenant||""})),
        rent:nz(rd.AnnualLetableValue), unreal:nz(rd.RentNotRealized), taxes:nz(rd.LocalTaxes),
        arrears:nz(rd.ArrearsUnrealizedRentRcvd),     /* stored net (typed net of 30%) — direct */
        loans:(RG(rd,"Section24B.Section24BDtls",[])||[]).map(l=>({
          from:l.LoanTknFrom==="I"?"I":"B", name:l.BankOrInstnName||"", acno:l.LoanAccNoOfBankOrInstnRefNo||"",
          dt:dmy(l.DateofLoan)||"", amt:nz(l.TotalLoanAmt), os:nz(l.LoanOutstndngAmt),
          interest:nz(l.InterestUs24B)}))
      };
    })
  };
  return ["Schedule HP (income from house property)"];
}

/* ---- checks ------------------------------------------------------ */
function chkHp(){
  const out = [];
  if(!(S.hp && S.hp.on)) return out;
  const C = S.C.hp || {};
  const bab = C.bab;
  const myPan = st0((S.pi||{}).pan).toUpperCase();

  (S.hp.props||[]).forEach((p,n)=>{
    const r = p._ || engProp(p, bab);
    const L = "Property "+(n+1);

    /* required address (book: do not leave address blank) */
    if(!st0(p.addr)) out.push({lvl:"err", t:L, m:"The address of the property is required.", sec:"hp"});
    if(!st0(p.city)) out.push({lvl:"err", t:L, m:"Town / City is required.", sec:"hp"});
    if((p.country||"91")==="91" && !HP_STATE_SET[st0(p.state)])
      out.push({lvl:"err", t:L, m:"State is required for a property in India.", sec:"hp"});
    /* owner Self / Deemed Owner only */
    if(p.owner!=="SE" && p.owner!=="DO")
      out.push({lvl:"err", t:L, m:"Select the owner of the property — Self or Deemed Owner.", sec:"hp"});
    /* type Let Out / Deemed Let Out only (a company has no self-occupied house) */
    if(p.type!=="Y" && p.type!=="D")
      out.push({lvl:"err", t:L, m:"Select the type of house property — Let Out or Deemed Let Out (a company has no self-occupied house).", sec:"hp"});

    /* gross rent must be > 0 for a let-out / deemed let-out property (A181) */
    if(!(N(p.rent)>0))
      out.push({lvl:"err", t:L, m:"A let-out or deemed let-out property needs a gross rent / lettable value (1a) greater than nil.", sec:"hp"});
    /* local tax not allowed if 1a is zero/null (A179) */
    if(N(p.taxes)>0 && !(N(p.rent)>0))
      out.push({lvl:"warn", t:L, m:"Tax paid to local authorities (1c) cannot be claimed when the gross rent (1a) is nil.", sec:"hp"});
    /* unrealised rent cannot exceed the gross rent (A194) */
    if(N(p.unreal) > N(p.rent))
      out.push({lvl:"warn", t:L, m:"The amount of rent that cannot be realised (1b) cannot exceed the gross rent (1a).", sec:"hp"});

    /* co-ownership: shares must total 100 (A176); each co-owner < 100 (A192);
       PAN or Aadhaar required (A176); co-owner PAN cannot equal assessee PAN (A189) */
    if(p.co==="YES"){
      if(!(p.coowners||[]).some(x=>st0(x.name)))
        out.push({lvl:"err", t:L, m:"List the other co-owner(s) of the property.", sec:"hp"});
      if(Math.abs(r.share+r.coShare-100)>0.01)
        out.push({lvl:"err", t:L, m:"The assessee's share plus the co-owners' shares must total 100%.", sec:"hp"});
      (p.coowners||[]).forEach((x,m)=>{
        const CL = L+", co-owner "+(m+1);
        if(!st0(x.name))
          out.push({lvl:"err", t:CL, m:"The co-owner's name is required.", sec:"hp"});
        if(!PAN_RE.test(st0(x.pan).toUpperCase()) && !AADH.test(st0(x.aadhaar)))
          out.push({lvl:"err", t:CL, m:"The PAN or Aadhaar of the co-owner is required.", sec:"hp"});
        if(st0(x.pan) && !PAN_RE.test(st0(x.pan).toUpperCase()))
          out.push({lvl:"err", t:CL, m:"The PAN is not in the correct form.", sec:"hp"});
        if(myPan && st0(x.pan).toUpperCase()===myPan)
          out.push({lvl:"err", t:CL, m:"A co-owner's PAN cannot be the same as the assessee's PAN.", sec:"hp"});
        if(N(x.share)>=100)
          out.push({lvl:"err", t:CL, m:"Each co-owner's share must be less than 100%.", sec:"hp"});
      });
      /* assessee cannot claim interest if his share of a co-owned property is zero (A178) */
      if(r.share===0 && r.hRaw>0)
        out.push({lvl:"err", t:L, m:"Interest u/s 24(b) cannot be claimed on a co-owned property in which the assessee's share is nil.", sec:"hp"});
    }

    /* tenant PAN form */
    (p.tenants||[]).forEach((x,m)=>{
      if(st0(x.pan) && !PAN_RE.test(st0(x.pan).toUpperCase()))
        out.push({lvl:"err", t:L+", tenant "+(m+1), m:"The PAN is not in the correct form.", sec:"hp"});
    });

    /* 115BAB — 24(a) and 24(b) disallowed (informational, A187/A188) */
    if(bab && (r.hRaw>0 || N(p.rent)>0))
      out.push({lvl:"warn", t:L, m:"Section 115BAB — the 30% standard deduction (24a) and interest (24b) have been disallowed for this property.", sec:"hp"});
    /* interest not admissible when share is nil or the annual value (1a) is nil (A178) */
    else if(!bab && !r.guard && r.hRaw>0)
      out.push({lvl:"warn", t:L, m:"Interest u/s 24(b) is admitted only when the assessee's share > 0 and the annual value (1a) > 0; it has been set to nil for this property.", sec:"hp"});

    /* interest u/s 24(b) needs every column of the loan row (book §2/§7) */
    (p.loans||[]).filter(l=>N(l.interest)).forEach((l,m)=>{
      if(!st0(l.from)||!st0(l.name)||!st0(l.acno)||!ISO(l.dt)||!(N(l.amt)>0)||!(N(l.os)>=0))
        out.push({lvl:"err", t:L+", loan "+(m+1), m:"Every column of the Section 24(b) loan row is required (lender, name, account no., date of sanction, total loan, amount outstanding).", sec:"hp"});
    });
  });

  return out;
}

/* ---- register ---------------------------------------------------- */
reg({id:"hp", t:"House property", ref:"Schedule HP",
     f:secHp,
     s:()=>{ const C=S.C.hp||{}; if(!(S.hp&&S.hp.on)) return "None";
       return C.income<0 ? "Loss "+CR(-C.income)
            : (C.income ? "Income "+CR(C.income)
                        : ((S.hp.props||[]).length+" property")); },
     eng:engHp, exp:expHp, imp:impHp, chk:chkHp, order:12});

/* =====================================================================
   ITR-6 · Section "loss" — Losses: set-off and carry-forward + Sch UD
   Schedules CYLA · BFLA · CFL and Schedule UD (unabsorbed depreciation /
   s.35(4) allowance), built strictly from the ITR-6 books
   books/ITR-6/CYLA_BFLA.md, books/ITR-6/CFL.md and
   books/ITR-6/Unabsorbed_Depreciation.md — never ITR-3's numbers.
   Structural template: forms/ITR-3/src/70_sec_loss.js.

   The company return differs from ITR-2/3:
   - NO salary head; CYLA/BFLA run FOURTEEN live head rows (the three
     pre-23-Jul-2024 CG rate slots 15%/10%/20% are hidden, not built).
   - FOUR business heads are live (business, life-insurance u/s 115B,
     speculative, specified) and CYLA carries a live business-loss column.
   - BFLA carries TWO extra brought-forward columns beyond the loss:
     depreciation (col 3) and the s.35(4) allowance (col 4), both fed from
     Schedule UD and both settable against OTHER-SOURCES income too.
   - CFL runs SIXTEEN assessment-year rows (specified-business s.35AD and
     115B life-insurance losses carry without the 8-year cap; speculative
     and race-horse carry four years).
   - HP-loss set-off capped at Rs 2,00,000 (s.71(3A) / rule A502).

   compute order 45 (after every income head, before the tax roll-up).
   ===================================================================== */

/* ---- state ---------------------------------------------------------- */
/* S.loss.cfl  — keyed by assessment year "YYYY-YY"; each holds the date of
     filing + the historic per-column loss figures the filer types.
   S.loss.ud   — the repeatable ScheduleUD[] ledger; first row is the
     current AY 2026-27 (the sheet's gating first row).
   editC / editB — the CYLA / BFLA "edit auto-populated details?" flags;
     the *Over objects hold the manual overrides behind those switches.   */
S.loss = S.loss || { cfl:{}, ud:[{ay:"2026-27"}], editC:"", editB:"",
                     cylaOver:{}, busOver:{}, osOver:{}, bflaOver:{} };
if(!Array.isArray(S.loss.ud)||!S.loss.ud.length) S.loss.ud=[{ay:"2026-27"}];

/* Does the company opt for taxation u/s 115BAA?  Only then are the CFL 5b
   business-loss adjustment and the Schedule UD 3a adjustment live (rules
   A564 / A569).  Read defensively from whatever the tax/gen section
   publishes; default false so nothing is falsely gated open. */
function loss115BAA(){
  const t=(S.C&&S.C.tax)||{};
  if("is115BAA" in t) return !!t.is115BAA;
  if("s115BAA" in t)  return !!t.s115BAA;
  const g=(S.gen&&S.gen.taxRegime)||(S.tax&&(S.tax.regime||S.tax.optSec))||"";
  return /115BAA|(^|[^B])BAA/.test(String(g));
}

/* The FOURTEEN live income-head rows, in the book's row order
   (CYLA ii..xv / BFLA i..xiv).  Each entry:
     [key, label, cylaKey, bflaKey, cyFlags, bfFlags]
   cyFlags — which current-year set-off column exists on this row
     {cyHP, cyBus, cyOS}  (CYLA_BFLA.md §3 "which loss may go where")
   bfFlags — {bf2, bfDep}
     bf2   : which brought-forward loss column feeds this row (0 = none),
             also the head this row's BF loss is matched against
     bfDep : whether the BF depreciation / 35(4) columns are live here
             (true on EVERY live row — they may set off against any head)
   Note: OS-normal uses different schema keys on the two matrices
     (CYLA OthSrcExclRaceHorseLottery vs BFLA OthSrcExclRaceHorse).      */
const LOSS_ROWS=[
 ["hp","House property","HP","HP",{cyHP:0,cyBus:1,cyOS:1},{bf2:"hp",bfDep:1}],
 ["bus","Income from Business (excluding life-insurance u/s 115B, speculative and specified business)","BusProfExclSpecProf","BusProfExclSpecProf",{cyHP:1,cyBus:0,cyOS:1},{bf2:"bus",bfDep:1}],
 ["b115","Profit and gains from life insurance business u/s 115B","ProfGainUs115B","ProfGainUs115B",{cyHP:1,cyBus:0,cyOS:1},{bf2:"b115",bfDep:1}],
 ["spec","Speculative income","SpeculationIncome","SpeculationIncome",{cyHP:1,cyBus:0,cyOS:1},{bf2:"spec",bfDep:1}],
 ["specified","Specified business income","SpecifiedBusIncome","SpecifiedBusIncome",{cyHP:1,cyBus:0,cyOS:1},{bf2:"specified",bfDep:1}],
 ["st20","Short-term capital gain taxable @ 20%","STCG20Per","STCG20Per",{cyHP:1,cyBus:1,cyOS:1},{bf2:"st",bfDep:1}],
 ["st30","Short-term capital gain taxable @ 30%","STCG30Per","STCG30Per",{cyHP:1,cyBus:1,cyOS:1},{bf2:"st",bfDep:1}],
 ["stApp","Short-term capital gain taxable at applicable rates","STCGAppRate","STCGAppRate",{cyHP:1,cyBus:1,cyOS:1},{bf2:"st",bfDep:1}],
 ["stDTAA","Short-term capital gain taxable at special rates as per DTAA","STCGDTAARate","STCGDTAARate",{cyHP:1,cyBus:1,cyOS:1},{bf2:"st",bfDep:1}],
 ["lt125","Long-term capital gain taxable @ 12.5%","LTCG12_5Per","LTCG12_5Per",{cyHP:1,cyBus:1,cyOS:1},{bf2:"lt",bfDep:1}],
 ["ltDTAA","Long-term capital gain taxable at special rates as per DTAA","LTCGDTAARate","LTCGDTAARate",{cyHP:1,cyBus:1,cyOS:1},{bf2:"lt",bfDep:1}],
 ["os","Net income from other sources chargeable at normal applicable rates","OthSrcExclRaceHorseLottery","OthSrcExclRaceHorse",{cyHP:1,cyBus:1,cyOS:0},{bf2:0,bfDep:1}],
 ["horse","Profit from owning and maintaining race horses","ProfitFrmRaceHorse","ProfitFrmRaceHorse",{cyHP:1,cyBus:1,cyOS:1},{bf2:"horse",bfDep:1}],
 ["osDTAA","Income from other sources taxable at special rates as per DTAA","IncOSDTAA","IncOSDTAA",{cyHP:1,cyBus:1,cyOS:1},{bf2:0,bfDep:1}]];
const ROW_KEYS=LOSS_ROWS.map(r=>r[0]);

/* CYLA set-off walk orders (heads that can absorb each current-year loss,
   in the utility's running-remainder order; A525: the OS loss goes first
   against race horses, then OS-DTAA, then the rest). */
const CY_ORDER_HP =["bus","b115","spec","specified","os","horse","st30","stApp","st20","stDTAA","lt125","ltDTAA","osDTAA"];
const CY_ORDER_BUS=["hp","os","horse","osDTAA","st30","stApp","st20","stDTAA","lt125","ltDTAA"];
const CY_ORDER_OS =["horse","osDTAA","hp","bus","b115","spec","specified","st30","stApp","st20","stDTAA","lt125","ltDTAA"];
/* BFLA capital set-off: a LT loss on the two long slots only; a ST loss on
   any capital slot (short first, then long). */
const BF_ORDER_LT=["lt125","ltDTAA"];
const BF_ORDER_ST=["st30","stApp","st20","stDTAA","lt125","ltDTAA"];
/* BF depreciation / 35(4) pools distribute across every head, row order. */
const DEP_ORDER=ROW_KEYS.slice();

/* Schedule CFL — the fixed SIXTEEN assessment-year rows.  Each entry:
     [AY, schemaKey, windowFlags]
   The schema keys are the department's legacy "LossCF…FromAY" names
   (CFL.md §3); they do NOT correspond to the year — map by row position.
   Window flags (CFL.md §3):
     specified — indefinite (every row); b115/hp/bus/st/lt — 8 yrs (2018-19+);
     spec/horse — 4 yrs (2022-23+).                                        */
const F_SPEC ={specified:1};
const F_8YR  ={hp:1,bus:1,specified:1,b115:1,st:1,lt:1};
const F_FULL ={hp:1,bus:1,spec:1,specified:1,b115:1,st:1,lt:1,horse:1};
const CFL_YEARS=[
 ["2010-11","LossCFFromPrev9thYearFromAY",F_SPEC],
 ["2011-12","LossCFFromPrev8thYearFromAY",F_SPEC],
 ["2012-13","LossCFFromPrev7thYearFromAY",F_SPEC],
 ["2013-14","LossCFFromPrev6thYearFromAY",F_SPEC],
 ["2014-15","LossCFFromPrev5thYearFromAY",F_SPEC],
 ["2015-16","LossCFFromPrev4thYearFromAY",F_SPEC],
 ["2016-17","LossCFFromPrev3rdYearFromAY",F_SPEC],
 ["2017-18","LossCFFromPrev2ndYearFromAY",F_SPEC],
 ["2018-19","LossCFFromPrevYrToAY",F_8YR],
 ["2019-20","LossCFCurrentAssmntYear",F_8YR],
 ["2020-21","LossCFCurrentAssmntYear2021",F_8YR],
 ["2021-22","LossCFCurrentAssmntYear2022",F_8YR],
 ["2022-23","LossCFCurrentAssmntYear2023",F_FULL],
 ["2023-24","LossCFCurrentAssmntYear2024",F_FULL],
 ["2024-25","LossCFCurrentAssmntYear2025",F_FULL],
 ["2025-26","LossCFCurrentAssmntYear2026",F_FULL]];
/* oldest year in each carry window — its unrelieved figure lapses;
   specified business never lapses. */
const CFL_OLDEST_8="2018-19", CFL_OLDEST_4="2022-23";
/* per-year VBA minimum date of filing (CFL.md §3): 1 April of the AY. */
const CFL_MINDATE={};CFL_YEARS.forEach(([y])=>{CFL_MINDATE[y]="01/04/"+y.slice(0,4);});

/* ---- engine --------------------------------------------------------- */
/* Every cross-head figure is read guarded (never throw). Consumed S.C
   contract each income section publishes (guarded, default 0):
     hp.income                         house-property head income (signed)
     bp.busExcl [NetPLBusOthThanSpec7A7B7C] / bp.income   business excl spec
     bp.b115    [Table-E (iv) ProfGainUs115B]             115B life-insurance
     bp.spec    [AdjustedPLFrmSpecuBus]                   speculative (signed)
     bp.specified [ProfitLossSpecifiedBusFinal]           specified (signed)
     bp.busLossCY [Table-E 2vi LossRemainSetOffOnBus]     CYLA business loss H6
     bp.inc12iii [TotDeprAllowITAct]                      UD depreciation cap
     cg.after.{st20,st30,stApp,stDTAA,lt125,ltDTAA}       gains after CG set-off
     cg.cflSTCL / cg.cflLTCL           Table-E unabsorbed STCL / LTCL
     os.netNormal [BalanceNoRaceHorse]                    net OS at normal rates
     os.raceHorse [BalanceOwnRaceHorse]                   race-horse balance
     os.dtaaTotal [os DTAA amount]                        OS at special DTAA rates
   Each falls back to .income where a finer key is absent.                */
function engLoss(){
  const g=(o)=>o||{};
  const hp=g(S.C.hp), bp=g(S.C.bp), cg=g(S.C.cg), os=g(S.C.os);
  const cgAfter=g(cg.after);
  const busExcl    = ("busExcl"   in bp)?N(bp.busExcl)   : N(bp.income);
  const b115PL     = ("b115"      in bp)?N(bp.b115)      : 0;
  const specPL     = ("spec"      in bp)?N(bp.spec)      : 0;
  const specifiedPL= ("specified" in bp)?N(bp.specified) : 0;
  const osNorm     = ("netNormal" in os)?N(os.netNormal) : N(os.income);
  const osHorseBal = ("raceHorse" in os)?N(os.raceHorse) : 0;
  const osDtaa     = N(os.dtaaTotal);
  const baa=loss115BAA();

  /* ---- CYLA row i · the three incoming current-year losses ---------- */
  const hpTotal = Math.max(0,-N(hp.income));                            /* G6 = ABS(MIN(HP total,0)) */
  const hpCapped= Math.min(hpTotal,200000);                            /* set-off limited to 2,00,000 (A502) */
  const hpExcess= Math.max(0,hpTotal-200000);                          /* over 2,00,000 -> straight to CFL */
  const busLoss = ("busLossCY" in bp)?Math.max(0,N(bp.busLossCY)):Math.max(0,-R(busExcl)); /* H6 = ABS(MAX(LossRemainSetOffOnBus,0)) */
  const osLoss  = Math.max(0,-osNorm);                                  /* I6 = ABS(MIN(BalanceNoRaceHorse,0)) */

  /* ---- CYLA col 1 · income of the current year (positive only) ------ */
  const inc={
    hp:Math.max(0,N(hp.income)), bus:Math.max(0,busExcl), b115:Math.max(0,b115PL),
    spec:Math.max(0,specPL), specified:Math.max(0,specifiedPL),
    st20:Math.max(0,N(cgAfter.st20)), st30:Math.max(0,N(cgAfter.st30)),
    stApp:Math.max(0,N(cgAfter.stApp)), stDTAA:Math.max(0,N(cgAfter.stDTAA)),
    lt125:Math.max(0,N(cgAfter.lt125)), ltDTAA:Math.max(0,N(cgAfter.ltDTAA)),
    os:Math.max(0,osNorm), horse:Math.max(0,osHorseBal), osDTAA:Math.max(0,osDtaa)};

  /* ---- CYLA cols 2/3/4 · set-off (greedy, respecting 2+3+4 <= 1) ---- */
  const setHP={},setBus={},setOS={},remInc={},flag={};
  LOSS_ROWS.forEach(r=>{setHP[r[0]]=0;setBus[r[0]]=0;setOS[r[0]]=0;remInc[r[0]]=inc[r[0]];flag[r[0]]=r[4];});
  if(S.loss.editC){                                                     /* manual override behind I29 switch */
    LOSS_ROWS.forEach(r=>{const k=r[0],f=r[4];
      if(f.cyHP){setHP[k]=Math.min(N((S.loss.cylaOver[k]||{}).hp),remInc[k]);remInc[k]-=setHP[k];}
      if(f.cyBus){setBus[k]=Math.min(N((S.loss.busOver[k]||{}).bus),remInc[k]);remInc[k]-=setBus[k];}
      if(f.cyOS){setOS[k]=Math.min(N((S.loss.osOver[k]||{}).os),remInc[k]);remInc[k]-=setOS[k];}});
  }else{
    let rem=hpCapped;CY_ORDER_HP.forEach(k=>{if(rem<=0||!flag[k].cyHP)return;const t=Math.max(0,Math.min(rem,remInc[k]));setHP[k]=t;remInc[k]-=t;rem-=t;});
    rem=busLoss;   CY_ORDER_BUS.forEach(k=>{if(rem<=0||!flag[k].cyBus)return;const t=Math.max(0,Math.min(rem,remInc[k]));setBus[k]=t;remInc[k]-=t;rem-=t;});
    rem=osLoss;    CY_ORDER_OS.forEach(k=>{if(rem<=0||!flag[k].cyOS)return;const t=Math.max(0,Math.min(rem,remInc[k]));setOS[k]=t;remInc[k]-=t;rem-=t;});
  }
  const sum=o=>ROW_KEYS.reduce((a,k)=>a+N(o[k]),0);
  const totHPset =Math.max(0,Math.min(200000,sum(setHP)));              /* G26, capped at 2,00,000 (s.71(3A)) */
  const totBusset=Math.max(0,Math.min(sum(setBus),busLoss));           /* H26 */
  const totOSset =Math.max(0,Math.min(sum(setOS),osLoss));             /* I26 */
  const hpRemain = totHPset<200000?Math.max(0,(hpCapped-totHPset)+hpExcess):hpExcess; /* G27 -> CFL */
  const busRemain= Math.max(0,busLoss-totBusset);                      /* H27 -> CFL */
  const osRemain = Math.max(0,osLoss-totOSset);                        /* I27 — normal OS loss lapses */
  const afterC={};LOSS_ROWS.forEach(r=>{const k=r[0];afterC[k]=R(inc[k]-setHP[k]-setBus[k]-setOS[k]);}); /* col 5 = 1-2-3-4 */

  /* ---- Schedule UD · the depreciation / 35(4) ledger --------------- */
  const udRows=(S.loss.ud||[]);
  const ud={rows:[]};let uBF=0,uAdj=0,uSO=0,uBal=0,uBFa=0,uSOa=0,uBala=0;
  const firstHasData=(()=>{const r=udRows[0]||{};return N(r.bfud)||N(r.adj115)||N(r.soc)||N(r.bfallow)||N(r.allowsoc);})();
  udRows.forEach((r,i)=>{
    const bf=N(r.bfud), adj=baa?N(r.adj115):0, so=N(r.soc), bal=Math.max(0,bf-adj-so); /* (5)=(3)-(3a)-(4) A571 */
    const bfa=N(r.bfallow), soa=N(r.allowsoc), bala=Math.max(0,bfa-soa);               /* (8)=(6)-(7) A572 */
    ud.rows.push({ay:st0(r.ay),bf:R(bf),adj:R(adj),so:R(so),bal:R(bal),bfa:R(bfa),soa:R(soa),bala:R(bala)});
    /* first-row gating: if the first row is empty, later rows are ignored (sheet D4 note) */
    if(firstHasData||i===0){uBF+=bf;uAdj+=adj;uSO+=so;uBal+=bal;uBFa+=bfa;uSOa+=soa;uBala+=bala;}
  });
  if(!firstHasData){uBF=uAdj=uSO=uBal=uBFa=uSOa=uBala=0;}
  ud.totBF=R(uBF);ud.totAdj=R(uAdj);ud.totSO=R(uSO);ud.totBal=R(uBal);
  ud.totBFa=R(uBFa);ud.totSOa=R(uSOa);ud.totBala=R(uBala);
  /* current-AY balances c/f = the first (2026-27) row's balance columns */
  ud.curDep  =R((ud.rows[0]||{}).bal);
  ud.curAllow=R((ud.rows[0]||{}).bala);
  const poolDep=ud.totSO, poolAllow=ud.totSOa;                          /* BFLA col-3 / col-4 pools (H34/I34) */

  /* ---- CFL · brought-forward figures from the year-rows ------------- */
  const cflRow=y=>(S.loss.cfl||{})[y]||{};
  const b5c=r=>Math.max(0,N(r.bus5a)-(baa?N(r.bus5b):0));               /* 5c = MAX(0, 5a - 5b); 5b only under 115BAA */
  const bf={hp:0,bus:0,b115:0,spec:0,specified:0,st:0,lt:0,horse:0};
  CFL_YEARS.forEach(([y,,F])=>{const r=cflRow(y);
    if(F.hp)bf.hp+=N(r.hp); if(F.bus)bf.bus+=b5c(r); if(F.b115)bf.b115+=N(r.b115);
    if(F.spec)bf.spec+=N(r.spec); if(F.specified)bf.specified+=N(r.specified);
    if(F.st)bf.st+=N(r.st); if(F.lt)bf.lt+=N(r.lt); if(F.horse)bf.horse+=N(r.horse);});

  /* ---- BFLA col 2 · brought-forward loss set off (head-matched) ----- */
  const setBF={};LOSS_ROWS.forEach(r=>setBF[r[0]]=0);
  if(S.loss.editB){
    LOSS_ROWS.forEach(r=>{const k=r[0],c2=r[5].bf2;if(c2)setBF[k]=Math.max(0,Math.min(N(S.loss.bflaOver[k]),afterC[k]));});
  }else{
    setBF.hp       =Math.min(bf.hp,afterC.hp);
    setBF.bus      =Math.min(bf.bus,afterC.bus);
    setBF.b115     =Math.min(bf.b115,afterC.b115);
    setBF.spec     =Math.min(bf.spec,afterC.spec);
    setBF.specified=Math.min(bf.specified,afterC.specified);
    let remLT=bf.lt;BF_ORDER_LT.forEach(k=>{if(remLT<=0)return;const t=Math.max(0,Math.min(remLT,afterC[k]-setBF[k]));setBF[k]+=t;remLT-=t;}); /* LTCL first, long slots only */
    let remST=bf.st;BF_ORDER_ST.forEach(k=>{if(remST<=0)return;const t=Math.max(0,Math.min(remST,afterC[k]-setBF[k]));setBF[k]+=t;remST-=t;}); /* STCL against any CG slot */
    setBF.horse    =Math.min(bf.horse,afterC.horse);
  }
  /* how much of each brought-forward column BFLA actually used (for CFL xviii) */
  const usedBF={hp:setBF.hp,bus:setBF.bus,b115:setBF.b115,spec:setBF.spec,specified:setBF.specified,horse:setBF.horse,st:0,lt:0};
  {const ltUsed=Math.min(bf.lt,BF_ORDER_LT.reduce((a,k)=>a+setBF[k],0));
   const stUsed=Math.min(bf.st,BF_ORDER_ST.reduce((a,k)=>a+setBF[k],0)-ltUsed);
   usedBF.lt=Math.max(0,ltUsed);usedBF.st=Math.max(0,stUsed);}

  /* ---- BFLA cols 3/4 · BF depreciation & 35(4) from Schedule UD ----- */
  /* Distribute the two UD pools across every head's income remaining after
     the BF-loss set-off (they may set off against any head, OS included).  */
  const setDep={},set35={};LOSS_ROWS.forEach(r=>{setDep[r[0]]=0;set35[r[0]]=0;});
  let remDep=poolDep;DEP_ORDER.forEach(k=>{if(remDep<=0)return;const avail=afterC[k]-setBF[k]-setDep[k];const t=Math.max(0,Math.min(remDep,avail));setDep[k]=t;remDep-=t;});
  let rem35=poolAllow;DEP_ORDER.forEach(k=>{if(rem35<=0)return;const avail=afterC[k]-setBF[k]-setDep[k]-set35[k];const t=Math.max(0,Math.min(rem35,avail));set35[k]=t;rem35-=t;});

  const afterB={};let gti=0;
  LOSS_ROWS.forEach(r=>{const k=r[0];afterB[k]=R(Math.max(0,afterC[k]-setBF[k]-setDep[k]-set35[k]));gti+=afterB[k];}); /* J = MAX(0,F-G-H-I) */
  const totBFset=sum(setBF), totDep=sum(setDep), tot35=sum(set35);

  /* ---- CFL xix · current-year losses to carry forward (assembled) --- */
  const cur={
    hp:hpRemain,                                                        /* A560 = CYLA 2xvii */
    bus:busRemain,                                                      /* BP Table-E business loss remaining */
    b115:Math.max(0,-R(b115PL)),                                        /* A562 = BP 4b (115B loss) */
    spec:Math.max(0,-R(specPL)),                                        /* A556 = BP speculative loss */
    specified:Math.max(0,-R(specifiedPL)),                             /* A557 = BP specified-business loss */
    st:Math.max(0,R(("cflSTCL" in cg)?N(cg.cflSTCL):0)),               /* A558 = CG Table-E unabsorbed STCL */
    lt:Math.max(0,R(("cflLTCL" in cg)?N(cg.cflLTCL):0)),               /* A559 = CG Table-E unabsorbed LTCL */
    horse:Math.max(0,-R(osHorseBal))};                                 /* A561 = OS 8e (race-horse loss) -> row xix (NOT xvii) */

  /* ---- CFL xx-xxii · carry forward, with the window lapse rule ------ */
  const old8=cflRow(CFL_OLDEST_8), old4=cflRow(CFL_OLDEST_4);
  const oldest={hp:N(old8.hp),bus:b5c(old8),b115:N(old8.b115),st:N(old8.st),lt:N(old8.lt),spec:N(old4.spec),horse:N(old4.horse)};
  const cf={};
  ["hp","bus","b115","st","lt"].forEach(k=>{cf[k]=Math.max(0,bf[k]-Math.max(usedBF[k],oldest[k])+cur[k]);}); /* 8-yr window lapse */
  ["spec","horse"].forEach(k=>{cf[k]=Math.max(0,bf[k]-Math.max(usedBF[k],oldest[k])+cur[k]);});             /* 4-yr window lapse */
  cf.specified=Math.max(0,bf.specified-usedBF.specified+cur.specified);                                     /* no lapse — indefinite */
  const lapsed={};["hp","bus","b115","st","lt","spec","horse"].forEach(k=>{lapsed[k]=Math.max(0,oldest[k]-usedBF[k]);});
  cf.total=cf.hp+cf.bus+cf.b115+cf.spec+cf.specified+cf.st+cf.lt+cf.horse;
  const curTotal=cur.hp+cur.bus+cur.b115+cur.spec+cur.specified+cur.st+cur.lt+cur.horse;                    /* Part B-TI item 17 (Sch CFL xxi) */

  /* ---- validators (CFL.md / rules.json) ---------------------------- */
  const val=[];
  const stSetTotal=BF_ORDER_ST.reduce((a,k)=>a+setBF[k],0), ltSetTotal=BF_ORDER_LT.reduce((a,k)=>a+setBF[k],0);
  if(stSetTotal>bf.st+bf.lt+1) val.push("Losses set off against capital gains cannot exceed the capital loss brought forward in Schedule CFL.");
  if(ltSetTotal>bf.lt+1)       val.push("Losses set off against long-term gains cannot exceed the long-term loss brought forward in Schedule CFL.");
  if(totDep+1<poolDep)         val.push("Brought-forward depreciation set off (Rs "+F(totDep)+") is less than the amount in Schedule UD (Rs "+F(poolDep)+") — reduce the depreciation set off in Schedule UD.");
  if(tot35+1<poolAllow)        val.push("Brought-forward s.35(4) allowance set off (Rs "+F(tot35)+") is less than the amount in Schedule UD (Rs "+F(poolAllow)+") — reduce the allowance set off in Schedule UD.");

  /* ---- this head's contribution to the footer's gross total income --- */
  const otherHeads=N(hp.income)+N(bp.income)+N(cg.income)+N(os.income);
  const income=R(gti)-R(otherHeads);

  S.C.loss={
    inc,hpTotal:R(hpTotal),hpCapped:R(hpCapped),hpExcess:R(hpExcess),busLoss:R(busLoss),osLoss:R(osLoss),
    setHP,setBus,setOS,totHPset:R(totHPset),totBusset:R(totBusset),totOSset:R(totOSset),
    hpRemain:R(hpRemain),busRemain:R(busRemain),osRemain:R(osRemain),afterC,
    bf,setBF,setDep,set35,usedBF,totBFset:R(totBFset),totDep:R(totDep),tot35:R(tot35),afterB,
    cur,cf,oldest,lapsed,val,income:R(income),ud,
    /* published scalars for the tax roll-up (Part B-TI) and cross-checks */
    cylaTotal:R(totHPset+totBusset+totOSset),                          /* item 6 */
    bflaTotal:R(totBFset),                                             /* BF-loss set-off only */
    bfSetoffTotal:R(totBFset+totDep+tot35),                           /* item 8 = BFLA 2xv+3xv+4xv */
    gti:R(gti),                                                        /* item 9 (normal-head part) / BFLA J53 */
    curTotal:R(curTotal),                                             /* item 17 (Sch CFL xxi) */
    udPoolDep:R(poolDep),udPoolAllow:R(poolAllow)};
  return S.C.loss;
}

  CY.TotalLossSetOff={TotHPlossCurYrSetoff:n0(L.totHPset),TotBusLossSetoff:n0(L.totBusset),TotOthSrcLossNoRaceHorseSetoff:n0(L.totOSset)};

    const o={IncOfCurYrUndHeadFromCYLA:n0(L.afterC[k]),IncOfCurYrAfterSetOffBFLosses:n0(L.afterB[k])};
    if(b.bf2)o.BFlossPrevYrUndSameHeadSetoff=n0(L.setBF[k]);

  j.ScheduleBFLA=BF;

  /* ===== ScheduleCFL ===== */
  const anyYear=CFL_YEARS.some(([y,,F])=>{const r=(S.loss.cfl||{})[y]||{};
    return (F.hp&&N(r.hp))||(F.bus&&N(r.bus5a))||(F.spec&&N(r.spec))||(F.specified&&N(r.specified))||(F.b115&&N(r.b115))||(F.st&&N(r.st))||(F.lt&&N(r.lt))||(F.horse&&N(r.horse));});
  if(anyYear||L.cf.total>0||L.curTotal>0||L.bf.hp+L.bf.bus+L.bf.b115+L.bf.spec+L.bf.specified+L.bf.st+L.bf.lt+L.bf.horse>0){
    const C={};
    CFL_YEARS.forEach(([y,key,F])=>{const r=(S.loss.cfl||{})[y]||{};
      const b5c=Math.max(0,N(r.bus5a)-(baa?N(r.bus5b):0));
      const any=(F.hp&&N(r.hp))||(F.bus&&N(r.bus5a))||(F.spec&&N(r.spec))||(F.specified&&N(r.specified))||(F.b115&&N(r.b115))||(F.st&&N(r.st))||(F.lt&&N(r.lt))||(F.horse&&N(r.horse));
      if(!any)return;
      const d={DateOfFiling:ISO(r.dt)||("2018-04-01")};
      if(F.hp&&N(r.hp))d.TotalHPPTILossCF=n0(r.hp);
      if(F.bus&&N(r.bus5a)){d.BroughtFrwrdBusLoss=n0(r.bus5a);if(baa&&N(r.bus5b))d.AmtAdjAccOptTaxUs115BAA_115BA=n0(r.bus5b);d.BroughtFrwdBusLossSetOffDrYr=n0(b5c);}
      if(F.spec&&N(r.spec))d.LossFrmSpecBusCF=n0(r.spec);
      if(F.specified&&N(r.specified))d.LossFrmSpecifiedBusCF=n0(r.specified);
      if(F.b115&&N(r.b115))d.LossFrmLifeInsBusUs115B=n0(r.b115);
      if(F.st&&N(r.st))d.TotalSTCGPTILossCF=n0(r.st);
      if(F.lt&&N(r.lt))d.TotalLTCGPTILossCF=n0(r.lt);
      if(F.horse&&N(r.horse))d.OthSrcLossRaceHorseCF=n0(r.horse);
      C[key]={CarryFwdLossDetail:d};});
    const summ=o=>({LossSummaryDetail:{TotalHPPTILossCF:n0(o.hp),BroughtFrwdBusLossSetOffDrYr:n0(o.bus),
      LossFrmSpecBusCF:n0(o.spec),LossFrmSpecifiedBusCF:n0(o.specified),LossFrmLifeInsBusUs115B:n0(o.b115),
      TotalSTCGPTILossCF:n0(o.st),TotalLTCGPTILossCF:n0(o.lt),OthSrcLossRaceHorseCF:n0(o.horse)}});
    C.TotalOfBFLossesEarlierYrs=summ(L.bf);                             /* xvii */

      arr.push(o);});
    if(arr.length)UD.ScheduleUD=arr;
    UD.TotBFUDepritAmt=n0(U.totBF);
    UD.TotAmtAdjOptTaxUs115BAA=(baa&&U.totAdj)?n0(U.totAdj):0;   /* schema-required in ITRScheduleUD; 0 when not 115BAA (Defect 12) */
    UD.TotCurYrdepritSetoffInc=n0(U.totSO);
    UD.TotDepritBalCFNY=n0(U.totBal);
    UD.TotBFUAllowAmt=n0(U.totBFa);
    UD.TotCurYrAllowSetoffInc=n0(U.totSOa);
    UD.TotalBalCFNY=n0(U.totBala);
    j.ITRScheduleUD=UD;
  }
}
